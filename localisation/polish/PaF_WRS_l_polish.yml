unification.168.t: "[GetNewspaper]Wolne Miasto Warszawa jednoczy Dystrykt Stołeczny!"
unification.168.desc: "Wygląda na to, że lewicowa frakcja skupiająca miejskich aktywistów, liberalnych socjalistów i socjaldemokratów, znana jako Wolne Miasto Warszawa, przejęła kontrolę nad całą metropolią. Sojusz od początku wydawał się nietrwały, lecz teraz zjednoczył się pod stanowczym przywództwem lewicowego publicysty, aktywisty i pisarza Jana Śpiewaka. Oparte na zasadach demokracji i antykapitalizmu Wolne Miasto Warszawa cieszyło się poparciem części warszawskiej klasy średniej jeszcze przed Upadkiem. Od tamtej pory jego kurs ideologiczny niewiele się zmienił, choć metody działania stały się bardziej radykalne. Krążą pogłoski, że rynek nieruchomości objęto ścisłą kontrolą, a represje wobec osób łamiących nowe przepisy są wymierzane z ostentacyjną bezwzględnością. Ponadto mocno ograniczono sprzedaż alkoholu i benzyny, a niektórzy domagają się nawet całkowitej prohibicji. Czas pokaże, czy nowy rząd stolicy zdoła wytrzymać presję innych pretendentów do zjednoczenia kraju - i jak długo mu się to uda."
unification.168.a: "Prohibicja w Polsce? Wolne żarty..."
