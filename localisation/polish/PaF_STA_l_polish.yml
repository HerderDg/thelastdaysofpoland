starachowice.1.t: "Zwycięstwo nad Ziobrą!"
starachowice.1.desc: "Po ciężkiej wojnie siły ziobrystów zaakceptowały nasze warunki pokoju! Udało nam się zdobyć część ziem na mocy traktatu, a teraz, gdy wojna wreszcie dobiegła końca, możemy skupić się na odbudowie zarówno nowych, jak i dawnych terytoriów. Wznieśmy toast za to wielkie zwycięstwo!"
starachowice.1.a: "Nareszcie zwycięstwo!"

starachowice.2.t: "Ziobro odmawia poddania się!"
starachowice.2.desc: "Mimo naszej wyraźnej przewagi siły ziobrystów odrzuciły traktat pokojowy! Będziemy musieli walczyć, dopóki nie osłabną na tyle, by nie móc bronić swoich ziem. Wtedy wreszcie odniesiemy zasłużone zwycięstwo!"
starachowice.2.a: "Naprzód, żołnierze, na Kielce!"

starachowice.3.t: "Sandomierz negocjuje z Ziobrą"
starachowice.3.desc: "Nasz południowy sąsiad, Sandomierz, rozpoczął negocjacje z Prokuraturą. Czas pokaże, czy ich próba zakończy się sukcesem, ale to dobra okazja, by również rozpocząć rozmowy z siłami ziobrystów."
starachowice.3.a: "Poczekajmy i zobaczmy, jak sobie poradzą."

starachowice.4.t: "Przejęcie pogranicza"
starachowice.4.desc: "Prokuratura zaczyna się rozpadać! Ruch oporu w całym województwie świętokrzyskim zbuntował się przeciwko Prokuratorowi Generalnemu, pozostawiając pogranicze bez ochrony. Szybko to wykorzystaliśmy, zajmując część ziem na wschodzie. Ziobro może być niezadowolony z utraty tych terytoriów, ale na razie nic nie może na to poradzić."
starachowice.4.a: "Po raz kolejny Dawid pokonuje Goliata."

starachowice.5.t: "Chaos w stolicy!"
starachowice.5.desc: "Socjalistyczna opozycja zorganizowała w Starachowicach masowy strajk! Początkowo pokojowy protest przerodził się w starcia, gdy bardziej radykalne grupy zaatakowały policję, a ta odpowiedziała siłą, doprowadzając do eskalacji sytuacji, nad którą nie mamy już kontroli. Pozostaje tylko pytanie, kto zwycięży w tym konflikcie: opozycja, rząd, czy też starcia przybiorą taką skalę, że doprowadzą do wojny domowej?"
starachowice.5.a: "Rząd przetrwa!"
starachowice.5.b: "Socjaliści przejmują miasto!"
starachowice.5.c: "Konflikt eskaluje w wojnę domową!"

starachowice.6.t: "Koniec konfliktu!"
starachowice.6.desc: "Po wielu miesiącach walk z Prokuraturą zwyciężyliśmy! Nie możemy przywrócić życia poległym, ale możemy naprawić zniszczenia i zadbać o to, byśmy w razie kolejnego konfliktu byli uzbrojeni i gotowi do walki!"
starachowice.6.a: "Niech żyją Starachowice!"

starachowice.8.t: "Pielgrzymi z Sandomierza proszą o pozwolenie na przemarsz"
starachowice.8.desc: "Pielgrzymi z Sandomierza niedawno dotarli do naszej granicy, prosząc o pozwolenie na wjazd do kraju, aby mogli dokończyć swoją pielgrzymkę. Nie wydają się całkowicie godni zaufania, lecz nowo ustanowiony teokratyczny rząd Sandomierza z pewnością rozgniewa się, jeśli odmówimy im wstępu. Czy powinniśmy ich przepuścić, czy odesłać z powrotem?"
starachowice.8.a: "Wpuść pielgrzymów."
starachowice.8.b: "Zawróć ich znad granicy."

#News Events

unification.127.t: "[GetNewspaper][STA.GetName] jednoczy województwo świętokrzyskie!"
unification.127.desc: "Wbrew wszelkim przeciwnościom Wspólnoty Starachowickie, niewielka demokracja z województwa świętokrzyskiego, wyszły zwycięsko z walk i ponownie zjednoczyły całe województwo! Jedno z małych państw stawiających opór Prokuraturze, mimo fatalnego położenia zdołało przetrwać aż do jej upadku. Później, mimo sprzeciwu socjalistów i zrujnowanej gospodarki, Starachowice zwyciężyły w wojnie o województwo świętokrzyskie. Przywódca nowo utworzonej Federacji Polski Środkowej, Marek Materek, ogłosił, że walka jeszcze się nie skończyła i nie spocznie, dopóki Polska nie zostanie odbudowana jako demokratyczna republika."
unification.127.a: "Czy jest jeszcze jakaś nadzieja na demokrację w Polsce?"

super.127.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.127.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.127.a: "Wreszcie zjednoczeni."


