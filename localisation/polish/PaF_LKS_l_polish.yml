LKS_lumileds: "Lumileds Poland"
LKS_pafana: "Pabianicka Fabryka Narzędzi \"PAFANA\""
##Ideas##
LKS_great_derby: "Wielkie Derby Łodzi"
LKS_great_derby_desc: "Historia rywalizacji pomiędzy Widzewem a ŁKS-em - jednymi z najstarszych klubów piłkarskich w Polsce - sięga 1911 roku. Od tamtej pory ich konflikt urósł do rozmiarów równie wielkich co same kluby, często prowadząc do brutalnych starć pomiędzy kibicami obu stowarzyszeń na długo przed 2025 rokiem. Całkowita degrengolada norm moralnych po Upadku tylko jeszcze bardziej podsyciła emocje, gdyż oba kluby zostały przeorganizowane w struktury quasi-państwowe i zaczęły prowadzić przeciwko sobie regularną wojnę."

LKS_memories_of_failure: "Wspomnienia porażki"
LKS_memories_of_failure_desc: "Kibice ŁKS-u być może nigdy się do tego nie przyznają, ale nie jest to równa walka. Nigdy nie była. Odkąd rozpoczął się konflikt pomiędzy klubami, Widzew odnosił większe sukcesy piłkarskie i był popularniejszy z tej dwójki. Przed Upadkiem Rycerzy Wiosny bardziej bolało to pierwsze, ostatnio zaś zaszkodziło im to drugie, gdy przewaga liczebna kiboli Widzewa wyparła ŁKS z ich bastionu w Piotrkowie Trybunalskim, przez co utracili znaczną część swojego znaczenia na arenie wojewódzkiej. Choć nie zniechęca to ultrasów ŁKS-u, aktualność tej porażki sprawia, że ludność cywilna znacznie mniej entuzjastycznie podchodzi do angażowania się w przyszłe konflikty."

LKS_guerilla_tactics: "Taktyka partyzancka"
LKS_guerilla_tactics_desc: "Ze względu na Rozejm pomiędzy Widzewem a ŁKS-em, którego zawarcie nadzorował Hołownia, oraz brak zasobów, Czerwono-Biało-Czerwoni ultrasi musieli znaleźć sposób, by dać upust swojej agresji w akceptowalny sposób. Zamiast wdawać się w otwartą wojnę, zaczęli wysyłać nieoznakowanych wojowników w granice Widzewa, by siać spustoszenie na jego terytorium, korzystając przy tym z pomocy przychylnie nastawionej miejscowej ludności Wolborza, Piotrkowa i Sulejowa. Ci, którzy wracają z takich rajdów, później szkolą tych, którzy zostali, w sztuce walki partyzanckiej."


##Events##
unification.188.t: "[GetNewspaper]Wojownicy ŁKS-u jednoczą województwo łódzkie"
unification.188.desc: "Polska jest domem dla wielu rywalizacji trwających tak długo, że mało kto spodziewa się, by kiedykolwiek miały się zakończyć. Jedna z nich postawiła przeciwko sobie dwa z najstarszych polskich klubów piłkarskich - ŁKS i Widzew - w niekończącej się walce o lokalną i ogólnokrajową dominację. Ich konflikt, który w ostatnich latach nabrał dodatkowego znaczenia politycznego, został ostatecznie rozstrzygnięty, gdy ŁKS zdominował swoich wrogów. Następnie, po unicestwieniu obiektu swojej obsesji, zwrócili wzrok ku większemu światu. Napełnieni nowo odkrytą nadzieją nie tracili czasu i rzucili wyzwanie pozostałym sąsiednim watażkom. Teraz 'Rycerze Wiosny' swobodnie przemierzają Łódzkie, brutalnie nękając wszystkich 'nie-rodowitych łodzian', co zazwyczaj oznacza każdego, kto choćby spojrzy na nich odrobinę krzywo. Podczas gdy ich odwieczni wrogowie desperacko próbowali na nowo zdefiniować swoją tożsamość po Upadku, sukces milicji ultrasów ŁKS-u dowodzi, że czasami prostota starych metod jest najlepszym sposobem na wygraną."
unification.188.a: "A rodowici łodzianie właśnie osiągnęli swoją najważniejszą."

super.188.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.188.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.188.a: "Wreszcie zjednoczeni."
