unification.174.t: "[GetNewspaper]Area 52 Ufologists unify Kuyavia!"
unification.174.desc: "The citizens of Kuyavia watch on in shock as against all odds, their region has been seized by a secretive organization dedicated to the search for extraterrestrial life. Small in number and seen as little more than a disjointed grouping of conspiracy theorists desperately clinging to a long-forgotten alleged sighting, the unexplainable success of Zagórski's ufologists has led some to claim that 'Nautilus' may truly be in possession of thus-unknown alien technology. Leaked documents depicting incomprehensible schematics of interplanetary vehicles and futuristic weaponry indicate a concentrated reverse-engineering effort, while hundreds of antennas aimed at the universe's infinite vastness work ceaselessly to establish first contact. Despite all these signs, skeptics dismiss the statelet as a product of mass hysteria, and its search as nothing but a futile spur of collective madness, but given the recent flair-up of reported alien activity in Kuyavia, there might be more to this story than science can possibly explain."
unification.174.a: "I want to believe."
 
 ##IDEAS##
 
UFO_kosmity: "Sekrety kosmosu"
UFO_kosmity_desc: "Twierdzenie, że nie jesteśmy sami w kosmosie nie musi być udowadniane na nowo. To po prostu fakt. Co prawda możemy debatować jak często to co tam jest przylatuje z wizytami, ale jedno wiemy na pewno: Z powodów nam jeszcze nieznanych, obce formy życia postanowiły zaznaczyć swoją obecność na losowym polu w Wylatowie. Do tej pory nie odszyfrowaliśmy tajemniczej wiedzy zakodowanej w tych piktogramach. Ale, w końcu rozwiążemy i tę zagadkę. Czy przybywają w pokoju? Jaką wiedzę nam przynoszą? I najważniejsze: czy kiedykolwiek powrócą? Minęło już ćwierć wieku od ich ostatniej wiadomości. Ale nadal, chcemy wierzyć."

UFO_szury: "Duchowe zestrojenie"
UFO_szury_desc: "Przez zbyt długi czas, grona czołowych naukowców próbowały utrzymać monopol na prawdę. Pod żałosną wymówkę 'empiryzmu', tuszowali wszystkie alternatywne światopoglądy, próbując oczyścić świat ze wszystkiego co duchowe lub metafizyczne. Ale nie ważne jak bardzo będą się starać zniszczyć tę iskrę duchowości, ludzie zawsze będą odczuwać połączenie z czymś większym niż oni sami. Jesteśmy krainą tysiąca teorii, każda z nich równie ważna i słuszna - jesteśmy najwiekszą przestrzenią otwartej wymiany zdań na wszelkie tematy które masoni próbowali wyciszyć. Czerpiemy z mocy poza ludzkim zrozumieniem. Nasza wiedza i potencjał zostały uwolnione i wyniesiony na wyższy poziom."

ufoki_tooltip: "Unraveling the secrets of the universe could bring immeasurable progress... or §Rabsolute peril.§!"
ufoki_tooltip: "Odkrywanie sekretów wszechświata może przynieść nieopisany postęp...lub §Rcałkowitą zgubę.§!"