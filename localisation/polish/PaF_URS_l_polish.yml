unification.162.t: "[GetNewspaper]Kolektyw Czerwonego Niedźwiedzia jednoczy region stołeczny"
unification.162.desc: "W 1976 roku Zakłady Przemysłu Ciągnikowego Ursus były jednym z wielu ognisk strajków robotniczych przeciwko nagłej podwyżce cen wprowadzonej przez rząd. Wygląda na to, że po Upadku Ursus pozostał wierny lewicy, choć w wyniku deindustrializacji po 1989 roku przybrało to nową formę. W 2027 roku dzielnicą rządziła anarchistyczna grupa zwana Kolektywem Czerwonego Niedźwiedzia. Mimo radykalnie lewicowych poglądów skupiała się przede wszystkim na kwestiach społecznych, takich jak trudności, z którymi mierzą się osoby LGBTQ+, oraz dostęp do bezpiecznej aborcji, zamiast na prawach pracowniczych. Początkowo Ursus był jedynie bezpieczną przystanią dla osób pozbawionych praw i prześladowanych. Jednak w burzliwych latach po 2025 roku Kolektyw uznał, że bierność oznacza zagładę. Pod przywództwem Małgorzaty \"Margot\" Szutowicz i jej towarzyszy z rozwiązanego kolektywu \"Stop Bzdurom\" Czerwony Niedźwiedź przeszedł do ofensywy, ostatecznie podporządkowując sobie znienawidzoną, liberalną Warszawę."
unification.162.a: "\"Poradzimy sobie z nienawiścią\""
 
super.162.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.162.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.162.a: "Wreszcie zjednoczeni."

