unification.26.t: "[GetNewspaper]Księstwo Bytomskie jednoczy Metropolię Śląską!"
unification.26.desc: "Przeszłość nigdy nie odpuszcza, zawsze pozostawiając gdzieś w oddali nikły blask, gotowy przypomnieć światu o swoim istnieniu. Na Śląsku wiatry nostalgii wieją ku bogatej niemieckiej historii regionu, rozbudzając ciepłe wspomnienia o porządku i stabilności, jakie niegdyś zapewniali mu opiekuńczy zachodni zwierzchnicy. Ta sympatia wobec znacznie pewniejszej przeszłości, znajdująca oddźwięk wśród mieszkańców, pozwoliła hrabiemu von Schaffgotschowi - potomkowi szlachty, która przed wiekami władała tymi ziemiami, uwielbianemu przez swoich poddanych, zarówno Polaków, Ślązaków, jak i Niemców - przejąć kontrolę nad Metropolią Śląską. Gdy dawno zapomniani spadkobiercy dawnych właścicieli ziemskich i przedsiębiorców powracają na należne im ziemie, ich obecni polscy właściciele stają przed ryzykiem ponownego odegrania roli kolonialnych niewolników wyzyskiwanych przez niemiecki kapitał. Mimo to hrabia jak dotąd zachował popularność wśród miejscowych, ciesząc się znacznie większym poparciem niż którykolwiek z jego rodaków przed nim."
unification.26.a: "Schlesien ist Deutsch!"

super.26.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.26.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.26.a: "Wreszcie zjednoczeni."