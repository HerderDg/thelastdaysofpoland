 STO_browar: "Browar Jędrzejów"
 STO_crusade: "Krucjata przeciwko PiS"
 STO_crusade_desc: "Front Zera jest jednością tylko ze względu na nienawiść do PiSu. Żołnierz jest o wiele bardziej efektywny jeśli walczy przeciwko komuś kogo szczerze nienawidzi. A ludzi którzy żywią głęboką urazę przeciwko Prawu i Sprawiedliwości jest wiele w tym kraju, co czyni ich doskonałymi żołnierzami w walce przeciwko PiSowskiemu zagrożeniu. Jedyny minus tej sytuacji jest taki, że w innych wojnach już nie będą tak ochoczo uczestniczyć..."

 STO_hate: "Zjednoczeni tylko przez nienawiść" 
 STO_hate_desc: "Front Zero jest zjednoczony przez niewiele więcej niż ich nienawiść do PiSu. To powoduje wiele konfliktów wewnętrznych. Jak już uda nam się pokonać PiS, nic nas w zasadzie nie będzie łączyło z naszymi koalicjantami. Chyba, że uda nam się zjednoczyć Front na przykład jakimś odpowiednim manifestem politycznym."
 
 ###   News Events   ###
 
unification.126.t: "[GetNewspaper]Front Zero jednoczy województwo świętokrzyskie!"
unification.126.desc: "Prawo i Sprawiedliwość, jedyna partia w Polsce, której udało się utrzymać władzę przez naprawdę dłuższy czas, leży teraz na łopatkach. Przynajmniej w województwie świętokrzyskim, gdzie Front Zero rozgromił wszystkich przeciwników i mocno zacisnął uścisk na całym terytorium. Wszędzie, dokąd wkroczyła milicja Frontu, następowała fala aresztowań, aż zatrzymano wszystkich członków PiS w regionie i postawiono ich przed Trybunałem złożonym z najbliższych współpracowników Stonogi. Podobno wyroki zależały od rangi oskarżonych w partii, a według pogłosek najważniejsi działacze otrzymali wyjątkowo drakońskie kary. Podczas pełnego emocji przemówienia z balkonu kieleckiego ratusza Zbigniew Stonoga przysiągł położyć kres tyranii PiS w całej Polsce i wreszcie zaprowadzić w kraju prawdziwe prawo i sprawiedliwość. Krytycy kwestionują wiarygodność tych deklaracji, wskazując na brutalne traktowanie dysydentów politycznych i dyktatorskie rządy Stonogi. Czas pokaże jednak, czy ich obawy się spełnią."
unification.126.a: "Nic tylko zawieźć ich do Auschwitz i piecyki włączyć."

super.126.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.126.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.126.a: "Wreszcie zjednoczeni."
