unification.59.t: "[GetNewspaper]Rząd Wałbrzycha jednoczy region wrocławski!"
unification.59.desc: "Choć ostateczny wynik walk w regionie był znany już od dłuższego czasu, dopiero teraz nadeszło potwierdzenie z Dolnego Śląska. Rząd Wałbrzycha przejął pełną kontrolę nad wschodnimi ziemiami dawnego województwa, w tym nad Wrocławiem, niegdysiejszą siedzibą władz Eurokomisariatu. Państwo, będące odpryskiem reżimu sił okupacyjnych, zamierzało stłumić wszelki sprzeciw, lecz wybuch Alkoholowej Rebelii pokrzyżował te plany. Po zwycięstwie zreorganizowało się i ruszyło na kolejne podboje, wzbudzając wśród mieszkańców województwa ostrożną nieufność. Niektórzy określają rządzących ziemiami dawnego EK mianem patologicznego paradoksu - utrzymują pozory normalnie funkcjonującej administracji cywilnej, jednocześnie kultywując najgorsze wynaturzenia i tradycje polskiego Zagłębia Alkoholowego. Wciąż nie wiadomo, czy ta osobliwa mieszanka zdoła funkcjonować jak sprawne państwo, zwłaszcza że nieustanne pokusy płynące z butelki mogą w końcu podporządkować sobie i tak już podupadającą administrację."
unification.59.a: "Rządzenie krajem na trzeźwo to zbyt wiele zachodu."

super.59.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.59.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.59.a: "Wreszcie zjednoczeni."

