unification.113.t: "[GetNewspaper]Warszawski Okręg Wojskowy jednoczy Okręg Stołeczny!"
unification.113.desc: "Dla niektórych Upadek nie był wydarzeniem, które narodziło się wewnątrz kraju, lecz nieuniknionym skutkiem zagranicznych machinacji. Przez miesiące teoria spiskowa krążyła wśród zwolenników dawnego reżimu, ale bez poparcia któregoś z watażków groziło jej, że na zawsze trafi na śmietnik historii. W końcu znalazła jednak patrona w najwyższych kręgach Warszawskiego Okręgu Wojskowego. Zafascynowany tą teorią Antoni Macierewicz poprzysiągł zemstę zarówno siłom UE, jak i Rosji, wzywając naród polski do powszechnej mobilizacji. Choć jego działania mogą wydawać się skrajne, potęga wojskowa Szalonego Marszałka pozwoliła mu pokonać i zlikwidować wszystkie frakcje watażków w stolicy. Teraz, gdy Warszawa znajduje się już pewnie w jego rękach, jej potencjał przemysłowy i ogromna populacja zostaną bez wątpienia w pełni wykorzystane do zasilenia szeregów armii. Miliony mieszkańców regionu jeszcze o tym nie wiedzą, ale w nadchodzących wojnach zjednoczeniowych wkrótce staną się żołnierzami."
unification.113.a: "Antoni wzywa nas wszystkich do broni"

super.113.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.113.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.113.a: "Wreszcie zjednoczeni."

