 ##Events##

unification.49.t: "[GetNewspaper]Wolna Armia Wędkarzy jednoczy region wrocławski"
unification.49.desc: "Z Dolnego Śląska napłynęły pierwsze wieści. Grupa wojowników-wędkarzy, która przejęła władzę w okolicach stawów milickich, zdołała zorganizować się w faktycznie niezależne państwo. Czy to dzięki szczęściu, niekompetencji rywali, czy też innym przyczynom, umocnili swoją pozycję na terenie dawnego województwa.\nIch przywódca, Andrzej Gałecki, prowadzi swoich towarzyszy po kiju w duchu pełnej swobody łowienia ryb, gdzie i kiedy tylko dusza zapragnie. Oczywiście z poszanowaniem stanowisk wędkarskich oraz regularnym zarybianiem i dokarmianiem ryb. Większość urzędów władz znajduje się wzdłuż Odry i mniejszych rzek, a także nad wszystkimi jeziorami i stawami. Sam przywódca przemierza terytorium na pokładzie potężnej łodzi, będącej okrętem flagowym państwa. Obywatele są zdezorientowani, lecz dzięki naukom udzielanym przez wędkarzy szybko przystosowują się do rzeczywistości, w której najważniejsze jest łowienie ryb."
unification.49.a: "Przynajmniej zarybiają."

super.49.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.49.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.49.a: "Wreszcie zjednoczeni."

