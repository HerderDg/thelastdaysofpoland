unification.166.t: "[GetNewspaper]NORDBAT jednoczy Zachodnie Pomorze!"
unification.166.desc: "ONZ przybyła do Polski jako siły pokojowe, lecz na Pomorzu Zachodnim stała się czymś zupełnie innym. NORDBAT - osławiony Batalion Nordycki - rozgromił watażków regionu, zaprowadzając kruchą stabilizację z dyscypliną równie surową jak krainy, z których pochodzi. Ci zahartowani weterani, najlepsi żołnierze Skandynawii, narzucają własną, twardą wizję prawa i porządku. Na autostradach roi się od punktów kontrolnych, patrole poruszają się z wojskową precyzją, a ci, którzy stawiają opór, szybko przekonują się, że ci „żołnierze sił pokojowych” są przede wszystkim wojownikami, a dopiero potem dyplomatami. Cywile szepczą o nadużyciach, przeszukiwaniu domów bez uzasadnienia i przymusowym rozbrajaniu ludności, które NORDBAT określa mianem surowych, lecz niezbędnych działań przeciwpartyzanckich. Nie da się jednak zaprzeczyć, że życie uległo poprawie. Targi ponownie się otwierają, bandytyzm zanika, a zerwane łańcuchy dostaw zostają odbudowane. Lecz w kraju, który od stuleci walczył z najeźdźcami, nawet wybawcy przybierają oblicze zdobywców. Misja ONZ jest jasna, ale co z Polakami? Czy kiedykolwiek spojrzą na zagranicznych żołnierzy inaczej niż na kolejną siłę, która przyszła nimi rządzić?"
unification.166.a: "SZWEDZI! TFU!"

super.166.t: "[GetNewspaper]ONZ przynosi porządek Polsce!"
super.166.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.166.a: "Wreszcie zjednoczeni."

