unification.138.t: "[GetNewspaper]Wadowicka Republika Ludowa jednoczy Małopolskę!"
unification.138.desc: "Rozbite ziemie Małopolski zostały wreszcie zjednoczone przez jedną siłę, lecz wbrew oczekiwaniom nie wyłoniła się ona z jednego z dominujących ośrodków miejskich, a z relatywnie spokojnego miasteczka Wadowice. W akcie kosmicznej ironii miejsce narodzin zmarłego papieża Jana Pawła II stało się bazą państwa całkowicie sprzecznego z jego naukami, rządzonego przez komunistyczną awangardę Michała Nowickiego. Opierając się na nostalgii za Polską Rzeczpospolitą Ludową i ścisłym przywiązaniu do ideologii stalinowskiej, proletariacki rząd pozostaje w konflikcie z przekonaniami zwykłych ludzi. Doniesienia z wewnątrz wskazują na silne tendencje autorytarne w armii, gdzie wszelkie oznaki sprzeciwu uznaje się za zagraniczną prowokację i surowo karze. W końcu, jak stwierdził sam Przewodniczący, żaden rozsądny człowiek nie sprzeciwi się nadchodzącemu Czerwonemu Odrodzeniu."
unification.138.a: "Naprzód, towarzysze!"

unificationreg.138.t: "[GetNewspaper]Rewolucja rusza dalej!"
unificationreg.138.desc: "Pochodnia proletariackiego wyzwolenia płonie coraz jaśniej, a południowe ziemie Polski, mimo zaciekłego oporu okopanej burżuazji, zostały opanowane przez czerwoną rewolucję. Ludowa Awangarda, stawiając czoła wrogom zarówno wewnętrznym, jak i zewnętrznym, rozszerzyła kontrolę na całą Małą Galicję. Dzięki połączonej potędze przemysłowej Krakowa i Zagłębia Przewodniczący kieruje wzrok na północny wschód, gdzie za granicami jego państwa zubożali chłopi mają rzekomo tęsknić za wolnością spod jarzma tyranów. Przynajmniej tak głosi oficjalne stanowisko armii. Tymczasem mieszkańcy podbitych ziem drżą przed nasilającymi się represjami politycznymi, a każdego, kto służył upadłym watażkom, piętnuje się jako zdrajcę klasowego. Coraz więcej obywateli trafia w jedną stronę na Pola Śmierci za coraz bardziej wątłe powiązania z dawnymi reżimami. Ci, którzy pozostali, mogą już tylko zastanawiać się, czy następni będą właśnie oni."
unificationreg.138.a: "Rząd dla Ludu, przeciwko Ludowi"

unificationsupreg.138.t: "[GetNewspaper]Płomienie rewolucji nad Galicją"
unificationsupreg.138.desc: "Porządek w Polsce wisi na włosku, ponieważ po raz trzeci w ciągu stu lat siły komunistyczne stoją u bram Warszawy. Tak jak ich poprzednicy, Armia Wyzwolenia Ludowego stawia sobie jasny cel - całkowite zniesienie rządów burżuazji w kraju. W dużej mierze cel ten został już osiągnięty: właścicieli ziemskich pozbawiono majątków, a przemysł uspołeczniono. Na przeciwników systemu czeka sieć więzień i obozów pracy, w których dysydenci są poddawani przymusowej reedukacji... o ile zdołają przeżyć mordercze warunki. W miarę jak lud uczy się jednocześnie bać i czcić Nowickiego, wokół przywódcy rośnie kult jednostki, a Ojciec Rewolucji wzoruje swój wizerunek na radzieckim mentorze. Być może, jeśli Armia Czerwona dotrze do morza, nazwisko Przewodniczącego będzie kiedyś wymieniane jednym tchem z nazwiskiem Sekretarza Generalnego."
unificationsupreg.138.a: "Dziedzictwo, któremu trzeba dorównać - nie tylko sławą, ale i brutalnością"

super.138.t: "[GetNewspaper]Czerwony świt nad Polską"
super.138.desc: "Uznawana za martwą na zawsze Polska Rzeczpospolita Ludowa powróciła, tym razem nie narzucona w wyniku obcego podboju, lecz jako oddolny ruch proletariacki. Mimo to duch stalinizmu wciąż jest żywy, a na społeczeństwo narzucono równie despotyczny system. Zgodnie z nieomylną teorią struktura społeczna została całkowicie wywrócona, a różnice klasowe zniesione, tak by wszyscy pracowali na rzecz zwykłych ludzi. Po dotarciu do granic ze wszystkich stron republika zwraca się do wewnątrz, by zaleczyć rany i wyeliminować całą pozostałą opozycję - zarówno rzeczywistą, jak i urojoną. Listy domniemanych zdrajców rosną z każdym dniem. Retoryka Przewodniczącego Nowickiego pozostaje jednak jasna: rewolucja nie będzie zakończona, dopóki świat nie zostanie całkowicie oczyszczony z kapitalistycznych wpływów. Siły Związku pozostają w stanie najwyższej gotowości, ponieważ Czerwona Fala, która przetoczyła się przez Polskę, grozi teraz zalaniem Europy."
super.138.a: "Tym razem nie będzie cudu nad Wisłą"

super_a.138.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_a.138.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super_a.138.a: "Wreszcie zjednoczeni."

