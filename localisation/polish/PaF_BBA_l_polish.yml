unification.178.t: "[GetNewspaper]Republika Podbeskidzia jednoczy Beskidy!"
unification.178.desc: "W przewidywalnym, choć dość przyziemnym obrocie spraw, cywilny rząd Bielska-Białej ogłosił swoje zwierzchnictwo nad żałosnym skrawkiem Karpat znanym jako Podhale. Triumf ten zapewniły ostatnie resztki zdrowego rozsądku, jakie ostały się w tym okrojonym mieście-państwie, lub możliwe, że były to dzięki jakiemuś zakulisowemu wsparciu euroliberałów. Tak czy inaczej, historycy jakoś to sobie wytłumaczą, jak zawsze.\n\nRany po bratobójczej wojnie w regionie nie zagoją się łatwo, szczególnie w przypadku miasta, które już przed Upadkiem doświadczyło znacznego regresu. Pojawiły się najróżniejsze spekulacje dotyczące przyszłego rozwoju świeżo utworzonej republiki, przede wszystkim w kwestii odbudowy przemysłu włókienniczego lub rozbudowy sieci hydroenergetycznej. Pewne jest jednak, że nowy rząd przedkłada odbudowę, stabilność i obronę nad ekspansję, a więc przynajmniej przez jakiś czas pokój może faktycznie się utrzymać."
unification.178.a: "Chwila wytchnienia?"


