atom_plant.1010.t: "Negocjacje z Orlenem - Sukces"
atom_plant.1010.desc: "Jedną z firm żywo zainteresowanych budową małych reaktorów modułowych był Orlen, który przed Upadkiem miał ambitne plany wzniesienia elektrowni w wielu miejscach pozostających w jego strefie wpływów. Katastrofa roku 2025 położyła kres wszystkim projektom związanym z energią jądrową. Jednak zarówno umowy i projekty, jak i dokumentacja lokalizacyjna pozostały gdzieś w archiwach tych przedsiębiorstw. Skoro Orlen nadal funkcjonuje jako jeden z elementów polskiej anarchii, a my zawarliśmy umowę z jego dawnym partnerem, GE-Hitachi, rozsądnie było zwrócić się z propozycją współpracy. Pozyskanie tak ważnego sojusznika stanowiłoby przecież znaczący krok nie tylko ku realizacji projektu jądrowego, lecz także ku zjednoczeniu kraju.\n\nNa szczęście Orlen okazał się mocno zainteresowany strategiczną współpracą. Nasz wysłannik, skierowany do Płocka z propozycjami, wrócił z podpisanym paktem gwarantującym współpracę przy budowie reaktorów oraz wzajemne zobowiązania sojusznicze w razie agresji innych watażków. Na razie tajemnicą pozostaje, w jaki sposób pogodzimy nasze interesy z ich interesami, lecz to my stoimy tu na silniejszej pozycji. Po nieuniknionym zwycięstwie będziemy więc mogli wymusić pokojowe zjednoczenie - ofertę, której nie będą mogli odrzucić."
atom_plant.1010.a: "Fuzja idealna."

atom_plant.2010.t: "Negocjacje z Orlenem - Porażka"
atom_plant.2010.desc: "Jedną z firm żywo zainteresowanych budową małych reaktorów modułowych był Orlen, który przed Upadkiem miał ambitne plany wzniesienia elektrowni w wielu miejscach pozostających w jego strefie wpływów. Katastrofa roku 2025 położyła kres wszystkim projektom związanym z energią jądrową. Jednak zarówno umowy i projekty, jak i dokumentacja lokalizacyjna pozostały gdzieś w archiwach tych przedsiębiorstw. Skoro Orlen nadal funkcjonuje jako jeden z elementów polskiej anarchii, a my zawarliśmy umowę z jego dawnym partnerem, GE-Hitachi, rozsądnie było zwrócić się z propozycją współpracy. Pozyskanie tak ważnego sojusznika stanowiłoby przecież znaczący krok nie tylko ku realizacji projektu jądrowego, lecz także ku zjednoczeniu kraju.\n\nNiestety Orlen nie był zainteresowany strategiczną współpracą i przedłożył własne interesy nad dobro wspólne. Nie przekonała go nawet propozycja sojuszu wojskowego, w ramach którego mielibyśmy obowiązek przyjść mu z pomocą w razie wojny. Może to i lepiej; ten gest dobrej woli był przecież korzystniejszy dla nich niż dla nas. Poradzimy sobie samodzielnie, a umowa z GE-Hitachi nadal gwarantuje nam pomoc z zagranicy."
atom_plant.2010.a: "Niedorzeczne korposzczury!"

