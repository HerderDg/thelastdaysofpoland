ATM_prepare_for_future_desc: "Czekaliśmy wystarczająco długo. Bez względu na stojące przed nami wyzwania nie możemy pozostawać ślepi na nasz wyższy cel. Cała idea Atomowej Krucjaty skupiała się wokół jednej fundamentalnej obietnicy - zbudowania reaktora jądrowego na polskiej ziemi i wyrwania nas z epoki smogu oraz zależności od węgla. Pora dotrzymać słowa. Przez ostatnie miesiące konsekwentnie odkładaliśmy środki na uruchomienie projektu. Musimy już tylko wybrać kierunek: możemy pójść drogą konwencjonalnej energetyki jądrowej i zbudować jeden ogromny reaktor zaopatrujący cały kraj albo zdecydować się na znacznie bardziej ryzykowne rozwiązanie, czyli zdecentralizowaną sieć lokalnych reaktorów SMR. Obie możliwości mają liczne zalety, lecz ostatecznie zwyciężyć może tylko jedna. Decyzja należy do Wiecha."
ATM_revive_smr_project_desc: "Choć budowa jednego ogromnego reaktora może wydawać się naturalnym wyborem, niedawne niepowodzenia światowej energetyki jądrowej uczyniły mniejsze i bezpieczniejsze alternatywy znacznie bardziej realnymi, zwłaszcza zważywszy na naszą obecną... kruchą sytuację gospodarczą. Nie możemy oczekiwać wydajności porównywalnej z tradycyjnymi modelami, lecz znacznie niższa cena z nawiązką rekompensuje konieczność budowy kilku rozproszonych jednostek, aby zaspokoić potrzeby rosnącej sieci energetycznej. Projekt wypróbowało już kilka przedsiębiorstw i poczyniły one znaczne postępy, zanim Upadek gwałtownie przerwał nasze prace. Dysponujemy więc wystarczającymi danymi, by dowieść, że rozwiązanie sprawdzi się lokalnie. Reaktory SMR, odpowiednio rozmieszczone w kluczowych węzłach sieci, mogłyby zapewnić znacznie bardziej równomierny rozdział energii jądrowej, a dodatkową zaletą byłaby łatwiejsza rozbudowa. Prawdę mówiąc, to jedyny racjonalny wybór."
ATM_korean_khnp_desc: "Państwowe koreańskie KHNP jest prawdopodobnie najbardziej doświadczonym z potencjalnych partnerów i odpowiada za liczne wielkoskalowe projekty na całym świecie. Ma jednak jedną zasadniczą wadę. Nazwa przedsiębiorstwa kojarzy się przede wszystkim z tradycyjnymi reaktorami, a dotychczas SMR-y traktowało ono głównie jako poboczny pomysł przyćmiony przez zwykłe przedsięwzięcia. Rodzi to obawy, czy posiada przewagę technologiczną niezbędną do zapewnienia oczekiwanej jakości. Mimo to firma wielokrotnie dowiodła niezawodności i opłacalności, a od tamtej pory przesunęła zainteresowanie w kierunku zgodnym z naszymi potrzebami. Może to być strzał w ciemno, lecz pod względem wiedzy KHNP wydaje się najlepszą możliwością, tym bardziej że nie łączą go żadne istniejące więzi z naszymi konkurentami. Nie możemy oczekiwać niczego przesadnie widowiskowego, tylko mnóstwa solidnej pracy - najbezpieczniejszego zakładu, jeżeli naprawdę chcemy ukończyć projekt."
ATM_american_nuscale_desc: "Ambicje NuScale są jasne. Przedsiębiorstwo wielokrotnie podkreślało skupienie na bezpieczeństwie energetycznym, stawiając walkę ze zmianą klimatu i konieczność przejścia na odnawialne źródła w centrum swoich zasad. Umowa z KGHM-em pokazała już zainteresowanie naszym rynkiem, którego nie ostudziło nawet ryzyko inwestycji w zmiennym krajobrazie Polski. Niedawno NuScale ponownie zaczęło szukać możliwości biznesowych, a żadne państwo nie zaoferuje mu lepszego partnerstwa niż nasze. Jak w przypadku każdej firmy nie wiadomo, czy wzniosłe zapewnienia o ratowaniu środowiska poprzez działalność są prawdziwe, czy stanowią jedynie przesadnie ozdobną reklamę. Nawet jeśli składają naszym zasadom tylko gołosłowne hołdy, NuScale nadal jest najlepszym wyborem dla dalszej realizacji misji."
ATM_japanese_hitachi_desc: "Dział Energii Jądrowej megakorporacji Hitachi nie udaje, jakie są jego prawdziwe zamiary - chodzi o pieniądze. Firma już wcześniej zwracała się do polskich przedsiębiorstw i zawarła z Orlenem umowę na rozwój reaktorów SMR na naszej ziemi, lecz podobnie jak wszystkie obiecujące projekty wysiłki te przerwał rozpad kraju. Zapewne będzie miała obawy przed kolejnym wejściem na nasz rynek, ale odpowiednie gwarancje i obietnica zwrotu inwestycji, gdyby coś poszło nie tak, mogą sprowadzić ją z powrotem do stołu negocjacyjnego. To chciwe, pozbawione duszy sępy, lecz jeżeli chcemy otrzymać jak najwięcej za nasze pieniądze, prawdopodobnie nigdzie nie znajdziemy lepszego partnera. Czasami trzeba odłożyć zasady na bok i wybrać pragmatyczną możliwość. Hitachi może zapewnić nam najlepszą umowę i tylko to się liczy."
ATM_envoy_to_plock_desc: "Nic lepiej nie ukazuje kontrowersyjnej natury PKN Orlen niż postać jego wieloletniego prezesa. Choć przekształcił firmę ze średnio znaczącego przedsiębiorstwa we względnie zamożne, samowystarczalne państwo, trudno stwierdzić, czy Obajtek ma dobre intencje, czy jego działania są tylko produktem nieustannych intryg służących osobistemu awansowi. W najlepszym razie jest niewiarygodnym zdrajcą, który w chwili największej potrzeby porzucił człowieka, któremu zawdzięcza całą karierę. A jednak to prawdopodobnie jedyny watażka w całym kraju gotowy z nami współpracować. Wcześniej przychylnie odnosił się do technologii jądrowej, przynajmniej kiedy mu to odpowiadało. Jeżeli okażemy mu upragnione uznanie, być może zaoferujemy wygodne stanowisko po ponownym zjednoczeniu kraju, może przystać na ugodę. Z pewnością jest to lepsze niż posyłanie przeciw niemu naszych dywizji."
ATM_envoy_to_lubin_desc: "KGHM często przedstawiał się jako postępowa korporacja, która nie uchyla się od odpowiedzialności w sprawach środowiskowych, nawet gdy konkurenci stosowali liczne bezwzględne praktyki biznesowe. Wdrażanie ekologicznie efektywnych i niskoemisyjnych technologii zasługuje na uznanie, podobnie jak próby wprowadzenia reaktorów SMR zaspokajających potrzeby energetyczne firmy. Po Upadku Eurokomisariatów KGHM zdołał wywalczyć dla siebie niewielkie państwo w południowo-zachodnim zakątku kraju, samotnie i dzielnie stojące naprzeciw niemieckiej fali. Firma z pewnością zasługuje na uwagę, a względna zgodność z naszymi ideałami stanowi wyjątkową możliwość zawarcia trwałego paktu dla wspólnego rozwoju. Jeżeli uzna współpracę za stosowną, będziemy mogli stawić czoła nadchodzącym wojnom jako zjednoczona siła. Wynagrodzenie członków zarządu wysokimi stanowiskami w naszej administracji po zakończeniu wszystkiego jest za to stosunkowo niewielką ceną."
ATM_location_plans_desc: "Jedną z głównych zalet technologii SMR jest możliwość budowy wielu mniejszych reaktorów we wszystkich zakątkach terytorium. Liczbę potencjalnych jednostek ogranicza tylko niebo, a niemal nieustanna lawina coraz ambitniejszych propozycji przypomina bardziej wojnę przetargową niż racjonalny proces decyzyjny. Nasze obecne fundusze pozwalają jednak na budowę najwyżej trzech, przynajmniej na razie. Nawet przy tak ogromnej inwestycji nie możemy oczekiwać pokrycia całej sieci energetycznej, lecz pierwszy krok powinien znacznie zmniejszyć jej obciążenie i otworzyć możliwość dalszego rozwoju. Od czegoś trzeba zacząć, a pierwszą decyzją musi być wybór lokalizacji reaktorów spośród niezliczonych miejsc niestrudzenie proponowanych przez doradców."
ATM_dabrowa_gornicza_desc: "Proces wyboru lokalizacji pierwszych reaktorów SMR był długi i przeciągający się, lecz ostatecznie postanowienia Wielkiego Planu Redukcji wymagają skupienia zasobów w Dąbrowie Górniczej. Jej strategiczne położenie na wschodniej osi metropolii katowickiej samo w sobie daje wystarczające podstawy do rozwoju, lecz istnieje jeszcze jeden powód, który czyni ten wybór oczywistym. Nad okolicą dominuje struktura znacznie większa od tej, którą zamierzamy zbudować, i bardzo chcielibyśmy przekształcić ją na własne podobieństwo. Huta Katowice jest ogólnokrajowym gigantem metalurgicznym, lecz zasilające ją elektrownie to tytani zanieczyszczeń. Aby uzasadnić radykalną przemianę Kombinatu, powinniśmy przynajmniej dać ludziom w zamian coś, z czego mogą być dumni. Nasze działania z pewnością poważnie zaburzą lokalny ekosystem przemysłowy, lecz w dłuższej perspektywie mieszkańcy Dąbrowy Górniczej, miejmy nadzieję, odnajdą nowe poczucie dumy jako część polskiej awangardy atomowej."
ATM_oswiecim_desc: "Poprzednie rządy już rozważały Nową Hutę jako potencjalne miejsce rozwoju energetyki jądrowej. Bliskość jednego z największych polskich ośrodków miejskich i baz akademickich sprawia, że przy odpowiednim finansowaniu może pewnego dnia stać się wielkim węzłem atomowym, a więc doskonałą lokalizacją dla jednego z pierwszych reaktorów SMR. Ponadto wytwarzane przez reaktor ciepło da nam wyjątkową możliwość wyłączenia pobliskiej elektrociepłowni i skutecznego zneutralizowania jednego z największych trucicieli w kraju. Podobnie jak niemal wszystkie aktywa w portfelu PGE obiekt od dawna jest solą w oku każdego ekologa, lecz kluczowe położenie dotychczas powstrzymywało wszystkie próby ograniczenia jego działania. Aż do teraz. Upieczemy dwie pieczenie na jednym ogniu i wyślemy zakład na dawno zasłużoną emeryturę."
ATM_ostroleka_desc: "Elektrownia Ostrołęka to niemal stuletni kolos zaopatrujący cały region w śmiesznie tanią energię, lecz od dawna przeżyła już swą użyteczność, mimo prób rozbudowy podejmowanych przez dawny rząd. Każdego dnia wyrzuca do atmosfery ogromne ilości zanieczyszczeń, dlatego zgodnie z Planem Redukcji musi zostać zastąpiona bardziej zrównoważoną alternatywą - reaktorem jądrowym. Podczas budowy możemy powoli wygaszać kolejne bloki, aż po ukończeniu projektu dojdzie do ostatecznego zamknięcia. Ze względu na obecną wysoką wydajność kompleksu zastąpienie jego produkcji będzie wymagało niemal całkowitego skupienia na wytwarzaniu maksymalnej ilości bezpiecznie uzyskiwanej energii. Jeżeli prawidłowo wdrożymy najnowsze rozwiązania technologiczne, powinniśmy nawet osiągnąć ogólną nadwyżkę."
ATM_prepare_huta_katowice_desc: "Przemysłowy kolos Huty Katowice ma za sobą długą historię przemian. Niegdyś służył jako jeden z głównych ośrodków \"Solidarności\", a od tamtej pory każda zmiana ideologicznej warty w Polsce pozostawia w zakładzie własny ślad. Oczywiście nie możemy być gorsi, a aby umocnić obecność, odciśniemy piętno jeszcze mocniej niż poprzednie reżimy. Kompleks jest reliktem przeszłości, zwłaszcza pod względem emisji. Najwyższy czas wprowadzić go w XXI wiek i przekształcić zgodnie ze współczesnymi praktykami. Robiąc miejsce dla reaktora SMR, wyposażymy zakład w zmodernizowane filtry dwutlenku węgla, wprowadzimy ścisłe procedury bezpieczeństwa i zapewnimy mieszkania robotnikom, aby \"Huta Katowice\" mogła wyrosnąć na symbol naszego ruchu."
ATM_prepare_monowice_ponds_desc: "Do dziś Kombinat góruje nad Nową Hutą i definiuje jej reputację jako polskiego zagłębia stalowego. Mógłby jednak stać się czymś znacznie większym. Umieszczenie reaktora SMR daje nam wyjątkową szansę na gruntowną modernizację całego kompleksu. Rozległe, puste połacie dzikiej zieleni na wschód od fabryki możemy wykorzystać jako miejsce największej polskiej farmy słonecznej, a bezpośrednią okolicę przekształcić w nowoczesny park technologiczny. Jako najwyższej klasy uspołeczniony ośrodek dla przedsiębiorców i myślicieli przemysłowych obszar usprawni przepływ informacji między czołowymi gałęziami badań i rozwoju. Nowa Huta od dawna żyła w cieniu Krakowa. Od teraz to jednak peryferyjna dzielnica będzie nosić atomową koronę."
ATM_seize_the_land_desc: "Plan zastąpienia przestarzałej elektrowni napotyka jedną zasadniczą przeszkodę - zarówno sam kompleks, jak i otaczające go ziemie znajdują się w rękach prywatnych. Obecni właściciele raczej nie ucieszą się z rychłego zamknięcia głównego źródła dochodu, a wobec stanowczej odmowy sprzedaży pozostaje tylko jedna droga - przymusowa nacjonalizacja. Na szczęście możemy przejąć własność w interesie publicznym, powołując się na postanowienia Wielkiego Planu Redukcji. Jednym szybkim ruchem wkroczymy i obejmiemy ją w posiadanie, zanim zorganizują jakikolwiek opór. Oczywiście zaoferujemy im przy tym jakieś marne odszkodowanie. Nie jesteśmy przecież bez serca. Jeżeli to nie wystarczy, przedstawimy sprawę przed przyjaznym sądem. Najważniejsze, że będziemy mogli natychmiast rozpocząć pracę - zainstalować filtry węglowe ograniczające zanieczyszczenia i powoli zmniejszać produkcję."
ATM_specialists_from_abroad_desc: "Nasze lokalne kadry są... delikatnie mówiąc, rozczarowujące. Zwykle przy dostatecznej ilości czasu można by łatwo wygładzić takie niedoskonałości, lecz reaktor jądrowy nie jest odpowiednim miejscem na szkolenie podczas pracy. Zamiast pozwalać robotnikom biegać jak ślepe kury czekające na katastrofę, nieco rozsądniej będzie zatrudnić ludzi z prawdziwym doświadczeniem. Na szczęście zagranicznych ekspertów jądrowych jest całkiem wielu dzięki genialnej decyzji naszych sąsiadów o całkowitym porzuceniu wszystkich istniejących elektrowni. Nie zaszkodzi także podkupić kilku specjalistów z dalszych stron. Gdy zatrudnimy wystarczająco wykwalifikowaną siłę roboczą, wykorzystamy ją nie tylko do obsługi reaktorów, lecz również do prowadzenia dodatkowych wykładów dla naszych... niezbyt bystrych pracowników. Może jeśli wyjaśnią najważniejsze zagadnienia wystarczająco powoli i prosto, przynajmniej część wiedzy pozostanie w głowach."
ATM_conversion_of_belchatow_desc: "Jeżeli chodzi o nasze potrzeby energetyczne, wybór jest jasny - wszystko albo nic. W samym środku terytorium znajduje się największa elektrownia w Polsce. Obecnie jest również największym trucicielem kraju, lecz wkrótce ulegnie to radykalnej zmianie. Węglowcy będą kipieć z wściekłości, patrząc, jak klejnot w koronie zmienia się w czołowego producenta czystej energii, ale właśnie to zamierzamy zrobić. Weźmiemy potężną Elektrownię Bełchatów, rozbierzemy jej obecną, rozrzutną formę i zastąpimy ją olbrzymim reaktorem jądrowym, który zaspokoi potrzeby energetyczne całych pokoleń. Będzie to kosztowne i zapewne wymaga delikatnego balansowania, by uniknąć kolejnego Blackoutu, lecz jeżeli naprawdę nam się powiedzie, nie tylko zagwarantujemy sobie niezależność energetyczną, ale również zniszczymy najdumniejszy symbol dziedzictwa Bractwa."
ATM_partial_shutdown_desc: "Elektrownia Bełchatów pozostaje największym źródłem emisji dwutlenku węgla w całej Europie, czarną plamą w naszym ekologicznym życiorysie, która przez cały okres działania podważa zapewnienia o szybkim zbliżaniu się do zerowej emisji netto. Choć obiekt poważnie ucierpiał w początkowej fazie Atomowej Krucjaty, niewiele zrobiliśmy, by zatrzymać nieustanny przemysłowy łoskot. Węgiel płonął w piecach za rządów Ziemkiewicza i płonie także za naszych. Aby wyrwać się z cyklu hipokryzji, w którym występujemy przeciw paliwom kopalnym, lecz nadal wykorzystujemy je do własnego utrzymania, będziemy stopniowo wygaszać produkcję w ledwie działających blokach najbardziej uszkodzonych podczas konfliktu. Nie powinno to przesadnie zaburzyć bilansu energetycznego, a otworzy drogę do rozwoju alternatyw. Powoli rozbierając Bełchatów, w pełni oczekujemy, że inne źródła energii przejmą jego obowiązki."
ATM_energy_balance_desc: "Brzmi świetnie, prawda? Wystarczy zakończyć wykorzystywanie paliw kopalnych, poczekać, aż energia jądrowa wypełni lukę, i cieszyć się nowym, w pełni zrównoważonym systemem. Och, wygląda na to, że właśnie wynaleźliśmy przepis na Blackout. Nie da się tego ominąć. Jedynym sposobem ograniczenia zależności od węgla jest powolne, stopniowe odchodzenie połączone z rozbudową odnawialnych źródeł, które stworzą zrównoważony miks energetyczny. Będzie to długi proces, lecz dzień po dniu i fabryka po fabryce będziemy coraz bliżej zerwania niezdrowego uzależnienia Polski. Epoka atomowa nadejdzie, ale nie dotrzemy do niej bez wykonania całej pracy. W przeciwnym razie spłonie w naszych rękach, zanim ujrzymy jej świt."
ATM_security_measures_desc: "Bezpieczeństwo atomowe nie jest sprawą, którą można wyśmiać. Przesadnie sensacyjne twierdzenia przeciwników, według których w chwili uruchomienia pierwszego reaktora cały kraj zmieni się w jedno wielkie napromieniowane pustkowie, nie mają wiele wspólnego z rzeczywistością, lecz i tak rozsądnie będzie wdrożyć liczne środki ochronne. Aby ograniczyć zagrożenia stwarzane przez materiały promieniotwórcze, zastosujemy najwyższe światowe standardy, zapewnimy pracownikom odpowiednie wyposażenie osłonowe, wykorzystamy rozbudowane sieci zabezpieczeń zapobiegające zniszczeniu całego systemu przez pojedynczy błąd oraz starannie utworzymy łańcuchy składowania i gospodarowania odpadami, by trzymać niebezpieczne materiały jak najdalej od ludzi. Przeciwnicy Atomu czekają na nasze najdrobniejsze potknięcie, które uzasadni ich strach. Nie damy im tego upragnionego powodu."
ATM_national_atomic_agency_desc: "Nawet najlepiej ułożone plany bez odpowiedniego nadzoru muszą w końcu się wykoleić. Oczywiście możemy sami doglądać budowy, lecz wobec innych wyzwań nie stać nas na nieustanne rozdzielanie uwagi. Potrzebujemy zaufanej organizacji poświęconej zapewnieniu prawidłowego utrzymania i rozwoju systemów jądrowych, która będzie mogła samodzielnie interweniować, gdyby cokolwiek odeszło od pożądanych norm. Wzorując się na odpowiedniku sprzed Upadku, utworzymy agencję złożoną ze specjalistów atomistyki. Będzie ona nadzorować działanie reaktora bełchatowskiego oraz wszystkich przyszłych przedsięwzięć, aby po raz pierwszy w historii naszego kraju odpowiednie decyzje podejmowali ludzie posiadający rzeczywistą wiedzę i doświadczenie."
ATM_infrastructure_issues_desc: "Utrzymanie sprawnego łańcucha dostaw i uniknięcie wąskich gardeł wymaga gruntownej przebudowy obecnej sieci drogowej wokół Bełchatowa. Jednopasmowe drogi wojewódzkie mogą wystarczać do ruchu cywilnego, lecz próba wysłania ciężarówek towarowych na ulice pełne dziur skończy się wyłącznie kłopotami. Aby zapobiec ogromnym korkom paraliżującym każdą dostawę, zdecydowanie rozwiążemy problem poprzez budowę autostrad, linii kolejowych oraz innej kluczowej infrastruktury, która przekształci Bełchatów w centralny ośrodek aktywności przemysłowej. Poza oczywistym zapewnieniem nieprzerwanego działania planowanej elektrowni inwestycja silnie pobudzi cały region, zdecydowanie podniesie jego potencjał gospodarczy do poziomu największych metropolii kraju i zyska nam przychylność mieszkańców."
ATM_restructurization_of_belchatow_desc: "Miasto Bełchatów jest równie przestarzałe jak idea, którą zaczęło symbolizować. Zmiana tożsamości będzie wymagała znacznie więcej niż umieszczenia w centrum ogromnej megastruktury i uznania pracy za zakończoną. Aby zmyć plamę pozostawioną przez Bractwo, musimy przebudować całe śródmieście według własnej wizji. Od ciasnych ulic, poprzez bezduszne pomniki \"postępu\", aż po splątaną sieć rur biegnącą pod całym bałaganem, zmienimy każdą cegłę, aby dawna stolica węgla mogła naprawdę stać się nowym ośrodkiem atomowej potęgi. Pod naszym nadzorem miasto przekształci się w metropolię całkowicie dostosowaną do potrzeb monumentalnej elektrowni jądrowej górującej nad nim i będzie wzrastać w jej cieniu jako wzorcowy model nowej epoki."
ATM_old_government_documents_desc: "Idea budowy reaktora jądrowego na terytorium Polski nie jest niczym nowym. Wystarczy spojrzeć ponad pół wieku wstecz, zanim seria katastrof splamiła ją w oczach przyszłych pokoleń, aby zobaczyć, że dawni wschodni zwierzchnicy wielokrotnie próbowali rozszerzyć swoje atomowe ambicje na nasze ziemie. Podobnie jak większość radzieckich planów budowa zakończyła się katastrofalną, kompromitującą porażką, lecz pozostawiła po sobie zbiór bezcennych dokumentów: szczegółowe plany budowlane, dokładne pomiary, przewidywaną wydajność, wymagane prognozy zaopatrzenia... niemal wszystkie dane potrzebne do własnej próby stworzenia elektrowni jądrowej. Problem w tym, że większość jest pełna błędów i przeoczeń. Nie znaczy to jednak, że dokumenty są bezużyteczne. Stanowią skarbnicę porad, ponieważ ich niedostatki dokładnie pokazują wszystko, czego nie wolno robić, jeżeli nasz projekt ma się udać. Czasami musimy po prostu... zrobić dokładnie odwrotnie, niż sugerują."
ATM_experiences_of_zarnowiec_desc: "Niedokończona Elektrownia Jądrowa Żarnowiec była najbliższą próbą zbudowania przez nasz kraj działającego reaktora jądrowego. O włos dzieliło nas od dołączenia do prestiżowego grona światowych potęg ujarzmiających atom, lecz w najważniejszej chwili przemiany ideologicznej Polski krótkowzroczny rząd postanowił porzucić cały projekt, uznając go za \"zbędny dla wewnętrznego bilansu energetycznego kraju\". Dziś w połowie ukończone ruiny kompleksu w Żarnowcu przypominają o tym, co mogło powstać, o utraconym cennym czasie oraz o samodzielnie wywołanej zależności od węgla. Oczywiście zastosowana przy budowie technologia z epoki zimnej wojny była niebezpieczna nawet według dawnych standardów i rozsądnie będzie unikać wielu niebezpiecznie oszczędnościowych rozwiązań, którymi próbowano przepchnąć projekt. Nadal możemy jednak wynieść mnóstwo lekcji z tej nieudanej próby ujarzmienia mocy Atomu."
ATM_water_problems_desc: "Uruchomienie łańcucha reakcji rozszczepienia to jedno, ale utrzymanie go pod kontrolą stanowi zupełnie inne wyzwanie. Aby uniknąć nieskończonego sprzężenia zwrotnego kończącego się obróceniem całego budynku w dym, potrzebujemy stałego dopływu uniwersalnego chłodziwa - wody. Brzmi banalnie: wykorzystać miejscowe jezioro i opróżnić je do ostatniej kropli. Region bełchatowski nie został jednak obdarzony zbiornikiem o wystarczającej objętości. Wobec braku gotowych rozwiązań musimy wykazać się nieszablonowym myśleniem. Na razie możemy sprowadzać wodę z zewnątrz, w razie potrzeby po jednej ciężarówce. To dobry początek, lecz na dłuższą metę nie wystarczy. Pewnego dnia coś musi pójść nie tak i chłodziwo nie dotrze na czas. Potrzebujemy trwalszego rozwiązania..."
ATM_belchatow_mines_reservoirs_desc: "Jedną z nielicznych korzyści przyniesionych przez Upadek jest ogromna liczba osobliwych pomysłów zrodzonych przez stada ideologów uwolnionych z łańcuchów. Większość jest całkowicie bezwartościowa i najlepiej o nich zapomnieć, lecz czasami w hałdzie śmieci można znaleźć klejnot. Dawno temu w notatkach Sapkowskiego odkryliśmy ledwie czytelne, szaleńczo nabazgrane plany, a szaleniec... tym jednym razem mówił z sensem, choć z całkowicie niewłaściwych powodów. Jego pomysł zalania bełchatowskich kopalń zapewne zrodził się z czystego delirium, ale możemy wykorzystać go do utworzenia olbrzymiego podziemnego zbiornika świeżej wody służącej do chłodzenia reaktora. Zalanie całej sieci szybów będzie ogromnym przedsięwzięciem, lecz jeśli już teraz zaczniemy napełniać przyszłe jezioro, większość pracy powinna być gotowa, gdy woda stanie się potrzebna."
ATM_begin_staff_training_desc: "Lokalnej sile roboczej zdecydowanie brakuje wiedzy niezbędnej do przekształcenia naszego magnum opus ze zbioru rysunków technicznych w prawdziwą, samodzielną i sprawną konstrukcję, nie wspominając nawet o obsłudze po uruchomieniu. Doskonale wiemy, że jeśli już teraz damy im zielone światło, całkowicie spartaczą budowę i pozostawią bałagan wymagający rozległej konserwacji od chwili, gdy budowniczowie położą ostatnie poprawki. Niedbała praca, całkowity brak dyscypliny, ekipy przychodzące z opóźnieniem, bez motywacji albo pijane... wszystko to stanie się normą, jeżeli z góry nie ukrócimy podobnych wybryków. Opóźnienie z takiego powodu jest kompromitujące, lecz jeśli robota ma zostać wykonana porządnie, musimy znacznie rozbudować szkolenie personelu przed kolejnymi etapami projektu."
ATM_engineers_from_maria_reactor_desc: "Wiele osób nie zdaje sobie sprawy, że reaktor jądrowy na polskiej ziemi nie byłby niczym nowym. Jeszcze przed Upadkiem w stolicy kraju istniał niewielki zakład, choć skupiał się przede wszystkim na badaniach, a nie wytwarzaniu energii. Antyatomowa furia wawerskich anarchistów mogła bezpowrotnie zniszczyć reaktor MARIA, lecz jej zasięg miał granice. Inżynierowie uciekli, zabierając wiedzę ze sobą. Choć od dziesięciu lat nie pracują w zawodzie, ich doświadczenie nadal jest bezcenne, a wielu z pewnością ucieszy się z powrotu do własnej specjalizacji po latach niekończącej się harówki. Zaoferujemy im najbardziej dochodowe kontrakty w życiu, aby przeciągnąć ich na naszą stronę. Gdy na poważnie rozpoczniemy działalność, bezpieczeństwo reaktora nie będzie musiało zależeć od zbieraniny niewyszkolonych osiłków."
ATM_our_own_grand_project_desc: "Bractwo uwielbiało przedstawiać Bełchatów jako własne dzieło i rzeczywiście żadne miejsce nie ukazywało jego zepsucia lepiej niż miasto nękane smogiem. Dziś Bełchatów pokazuje zupełnie inne oblicze - nieugięty obrońca węgla stał się zwiastunem epoki jądrowej. Wykonaliśmy monumentalną pracę, lecz wszystkie dotychczasowe wysiłki były zaledwie przygotowaniem do budowy naszego opus magnum. Jesteśmy gotowi pozostawić trwały ślad w historii Polski dzięki oddaniu i poświęceniu atomowych serc. Możemy poklepać się po plecach. Mamy wszystko, czego potrzeba, by prawidłowo zrealizować pierwszy megaprojekt, mimo że życie nieustannie rzucało nam kłody pod nogi. Widok największego osiągnięcia wypełni nasze dusze dumą."
ATM_phase_construction_desc: "Wszystkie prace przygotowawcze zostały ukończone i jesteśmy gotowi wbić pierwszą łopatę pod monumentalną budowę, która nas czeka. Miesiące planowania, rozpaczliwe gromadzenie zasobów i przydzielanie funduszy - to była łatwa część. Prawdziwa próba zaczyna się teraz. Jeżeli dotychczas sumiennie wykonywaliśmy obowiązki, możemy oczekiwać stałego postępu w przewidzianym okresie budowy. Gdy konstrukcja będzie nabierać kształtu cegła po cegle, kolejne lata wypełnią oczekiwanie i ekscytacja, a my będziemy stopniowo zbliżać się do spełnienia atomowych marzeń. Możemy teraz skupić się na innych sprawach, poklepać się po plecach i z dumą patrzeć, jak nasz największy projekt przybiera kształt. Postawiliśmy sobie niemal niemożliwy cel, a pomimo wszechobecnych wątpliwości w kraju i za granicą właśnie dotrzymujemy najważniejszej obietnicy."
ATM_foreign_workforce_desc: "Poproś typowego polskiego budowlańca, żeby naprawił przeciek, a zaleje ci pół domu. Poproś, żeby zbudował dom, a postawi ruderę. Poproś, żeby zbudował reaktor jądrowy, a zapewne wybuchnie w ciągu miesiąca od uruchomienia. Zdecydowanie popieramy wykorzystywanie miejscowej siły roboczej, lecz w sprawie tak ważnej lepiej zatrudnić kogoś, kto nie wykona tylko absolutnego minimum potrzebnego do otrzymania wypłaty. Liczne zagraniczne firmy mają doświadczenie w pracy przy elektrowniach jądrowych oraz reputację potwierdzającą ich niezawodność. Będą znacznie droższe od lokalnych odpowiedników, ale przynajmniej nie spartaczą całego projektu i nie skompromitują nas przed światem. Zapłaciliśmy już tak dużo, że dodatkowe drobne prawie niczego nie zmienią."
ATM_diverting_resources_desc: "Budowa okazała się ogromnym przedsięwzięciem wymagającym jeszcze większych funduszy, niż przewidywały początkowe szacunki. Pomimo wzorowo sumiennej księgowości nadal bardzo brakuje nam pieniędzy, co zmusza do opóźniania płatności i ograniczania najdroższych części, aby jakoś zmieścić wszystko w napiętym budżecie. Jedziemy na oparach, dlatego jedynym sposobem uniknięcia całkowitego zatrzymania projektu jest wrzucenie jeszcze większej ilości gotówki oraz zasobów w tę studnię bez dna. Każdą nadwyżkę i wszystkie oszczędności, które możemy odłożyć bez zagrożenia dla integralności kraju, przeznaczymy na wsparcie rosnącego reaktora. Po ukończeniu odpłaci się niemal darmową energią do końca naszego życia - dobrodziejstwem wartym każdej ceny."
ATM_focus_on_nuclear_shield_desc: "Międzynarodowa sytuacja dyplomatyczna nie jest nawet w przybliżeniu tak przyjazna, jak mieliśmy nadzieję. Żyjemy we wrogim świecie, a każda próba podważenia utrwalonej hierarchii z pewnością spotka się z odwetem potęg obawiających się utraty globalnej pozycji. Elektrownia pozostaje najwyższym priorytetem, lecz do zapewnienia ochrony możemy ostatecznie potrzebować czegoś znacznie bardziej... bezpośredniego. W razie potencjalnego konfliktu z niemieckimi wrogami szybko zobaczymy rakiety przelatujące nad naszym terytorium. Najpewniej nie będą zmierzać do Berlina, lecz spróbują przemienić każde nasze miasto w kolejne Bałuty. Aby oddalić widmo całkowitego spustoszenia, musimy zbudować tarczę jądrową przechwytującą wszystkie obce pociski próbujące naruszyć przestrzeń powietrzną. Musimy zagwarantować, że nawet jeśli wystrzelą cały arsenał, ani jeden nie dosięgnie celu."
ATM_question_of_uranium_desc: "Elektrownia jądrowa wymaga stałego dopływu wzbogaconego uranu. Jedyny problem? Nie mamy ani grama. Jeżeli nie zamierzamy magicznie wytwarzać elektryczności wyłącznie siłą ambicji, musimy znaleźć dostęp do niezawodnych źródeł. Oczywiście nasze rdzenne terytorium jest całkowicie pozbawione tego cennego surowca. Nie oznacza to jednak, że opuściło nas całe szczęście. Raporty z misji poszukiwawczych prowadzonych przed Upadkiem wskazują niewykorzystane złoża na obu krańcach kraju - w górach na południu i pojezierzach na północy. Jeżeli wyślemy zespoły, aby odnalazły odpowiednie miejsca, możemy niemal natychmiast rozpocząć wydobycie. Gdyby okazało się to zbyt kosztowne albo trudne, zawsze pozostaje druga możliwość - kupno uranu za granicą. Nasze państwo walczy jednak o jakiekolwiek uznanie międzynarodowe, więc znalezienie chętnych partnerów może przekraczać nasze możliwości."
ATM_import_proposals_desc: "Możliwości wyboru zagranicznych partnerów są dość ograniczone, lecz jeżeli chcemy uruchomić elektrownię jądrową, import uranu będzie przez pewien czas konieczny. Większość rynków jest całkowicie zamknięta na potencjalne przedsięwzięcia. Niewielu chce przecież ryzykować sprzedaż wysoce promieniotwórczego materiału, często wykorzystywanego w głowicach jądrowych, nieuznawanemu państewku pogrążonemu w wojnie domowej i otoczonemu przez wrogich watażków, którzy mogliby łatwo przejąć go do własnych nikczemnych celów. Niektórych niewiele jednak obchodzi los towaru, o ile otrzymają wystarczającą zapłatę. Możemy spróbować rzucać pieniędzmi, aby przyciągnąć bogate w surowce kraje Trzeciego Świata. Jeżeli to zawiedzie, będziemy musieli paść na kolana i błagać przyjazne mocarstwa o obdarzenie naszej sprawy zaufaniem. Jeśli dotychczas zrobiliśmy dość, by je przekonać, być może przystaną na prośbę."
ATM_reach_western_contacts_desc: "Na nasze szczęście nie wszystkie zachodnie mocarstwa są równie nadęte jak Niemcy. Francuzi i Kanadyjczycy wyrazili zainteresowanie współpracą, choć zapewne mieli na myśli wyłącznie uznanie dyplomatyczne i być może odrobinę pomocy humanitarnej. Musimy znaleźć sposób, by przekonać ich do przekazania czegoś znacznie ważniejszego i niebezpieczniejszego. Ta droga nie gwarantuje sukcesu, a nasz korpus dyplomatyczny będzie musiał pracować do granic możliwości, aby otrzymać cokolwiek poza stanowczym potępieniem. Jeśli jednak pragniemy jakiejkolwiek globalnej legitymizacji, musimy zachowywać się jak najbardziej szanowane państwa i prowadzić interesy wyłącznie z nimi. Jeżeli przedstawimy się jako rosnąca alternatywa dla niemieckiej dominacji nad kontynentem, być może dopisze nam szczęście u głównych konkurentów Berlina."
ATM_pragmatic_deals_desc: "Rozważyliśmy wielu międzynarodowych partnerów, ograniczyliśmy listę do dwóch najbardziej obiecujących, a ostatecznie pozostał tylko jeden. Kanadyjczycy nie widzą powodu, by nam ufać. Nie mają żadnej zachęty do pomocy zmagającej się z problemami niewiadomej po drugiej stronie globu, a naszej gotówki także nie potrzebują, zresztą i tak nie moglibyśmy zaoferować jej zbyt wiele. Ostatnią nadzieję pokładamy we Francuzach, gotowych nam pomóc z jednego prostego powodu - osłabia to Niemców. Od Inwazji oba mocarstwa prowadzą nieustanną walkę o dominację w Europie, a szala zdecydowanie przechylała się dotychczas na korzyść Berlina. Francja jest zdesperowana i szuka każdego, kto dołączy do jej strony. Jeżeli okaże się niezawodnym dostawcą, możemy otworzyć drogę do dalszej współpracy."
ATM_tap_into_african_business_desc: "Po co zwracać się do pośredników, skoro możemy zdobyć rozpaczliwie potrzebne zasoby bezpośrednio u źródła? Zamiast prowadzić interesy z aroganckimi zachodnimi mocarstwami, które nie sprzedałyby nam ani grama bez bezpośredniej korzyści, możemy wynegocjować znacznie rozsądniejsze ceny z afrykańskimi reżimami wydobywającymi uran własnymi sposobami. W przeciwieństwie do bardziej rozwiniętych odpowiedników nie będą przesadnie wybredne przy wyborze klientów. Sprawa powinna być prosta - my dostajemy towar, oni zapłatę. Możemy nawet oczekiwać odrobiny współczucia. Czy tak bardzo się różnimy? Obie strony są walczącymi o przetrwanie rządami, które rozpaczliwie próbują utrzymać kraje na powierzchni wobec niezliczonych rebelii. Wzajemnie korzystna współpraca powinna leżeć w interesie wszystkich zainteresowanych."
ATM_weapons_for_ore_desc: "Nic nie przychodzi za darmo, a na świecie istnieje tylko jedna uniwersalna waluta - broń. Możemy zalać afrykańskich sojuszników gotówką i utopić ich rynki w niestabilnym złotym, lecz rozsądnie będzie osłodzić umowę czymś nieco... kontrowersyjnym, za to posiadającym znacznie większą siłę przetargową. Nasze składy pękają od starych poradzieckich i prowizorycznych modeli z okresu po Upadku. Dla nas są bezwartościowe, lecz dla pogrążonego w nędzy kraju, bez jednej fabryki większej od miejscowego warsztatu i mierzącego się z tuzinem rebelii, trzema zamachami stanu oraz jednym kontrzamachem nawet najbardziej przestarzałe egzemplarze mogą być bezcenną deską ratunku. Jeżeli do każdej dostawy dorzucimy nieco kontrabandy, z łatwością wynegocjujemy stały strumień uranu znacznie poniżej ceny rynkowej. W istocie będzie to prawie tak, jakbyśmy otrzymywali go za darmo."
ATM_search_in_the_south_desc: "Południowe złoża są stosunkowo skromne w porównaniu z północnymi odpowiednikami, lecz mają jedną kluczową zaletę, przez którą warto podjąć próbę ich eksploatacji - zdecydowanie łatwiej je odnaleźć i wydobywać. Dzięki dawnym pracom prowadzonym w pierwszych latach Polski Ludowej, niemal całe stulecie temu, najważniejsze miejsca pozyskiwania uranu zostały dokładnie naniesione na mapy wraz z proponowanymi lokalizacjami kopalń. Niestety wiele najbogatszych obszarów dawno ogołocono, aby napędzać radzieckie ambicje, lecz znaczna część pożądanego pierwiastka nadal pozostaje nietknięta i czeka na odkrycie przez nasze załogi. Nawet uwzględniając ograniczenia obecnej technologii, powinniśmy uzyskać dość, by zaspokoić potrzeby w przewidywalnej przyszłości."
ATM_sudety_deposits_desc: "Ponura historia sudeckich kopalń uranu pozostaje jedną z najciemniejszych plam w dziejach opresyjnej Polski Ludowej. Bez wiedzy szerszej opinii publicznej tysiące więźniów pracowały wbrew własnej woli i bez jakiegokolwiek wyposażenia ochronnego. Do dziś nie wiadomo, ilu oddało życie w ciasnych, słabo oświetlonych tunelach, gdzie ich ciała spoczywają na wieczność. Nawet ta tragedia ma jednak jasną stronę. Właściwie powinniśmy podziękować dawnym władzom. Wykonały pracę za nas. Puste kopalnie pozostają uśpione od kilku dziesięcioleci, a niemal cała infrastruktura nadal jest nienaruszona. Znaczne potencjalne złoża pozostają niezbadane, tuż poza zasięgiem obecnych szybów. Wystarczy sprowadzić nowoczesne wyposażenie, a już następnego dnia będziemy wydobywać dość uranu, by zasilić każdy z naszych reaktorów."
ATM_industrial_plants_r1_desc: "Paradoks historii naszego narodu polega na tym, że całe stulecie temu znajdowaliśmy się bliżej epoki atomowej niż dziś. Były to pierwsze kroki, lecz nawet taki rozwój uchroniłby nas przed żałosnym położeniem. Pod przymusowym patronatem Związku Radzieckiego, socjalistyczna Polska utworzyła serię zakładów przerobu uranu w trzewiach dzikich Sudetów. Wszystkie zasoby zdobyte ciężką pracą polskich górników trafiały w chciwe łapska wschodnich zwierzchników, lecz nie zdołali zagarnąć wszystkich bogactw pasma. W tonach skał metamorficznych nadal znajduje się mnóstwo uranu czekającego na odkrycie. Ponownie wykorzystamy ten opuszczony relikt eksploatacji Polski i przemienimy go w promieniotwórcze złoto. Po raz pierwszy w historii zakłady będą zaopatrywać własnych rodaków."
ATM_holy_cross_deposits_desc: "Atomowy potencjał Gór Świętokrzyskich jest znany od dawna, a w połowie XX wieku przeprowadzono liczne ekspedycje. Mimo całego uranu odkrytego w północnej części regionu nic z tego nie wynikło poza kilkoma plamami danych w notatniku urzędnika. Nie mówimy wprawdzie o największych złożach, lecz możliwość skutecznego dotarcia do nich konwencjonalnymi metodami górniczymi sprawia, że warto rozpocząć wydobycie w tym rejonie. Dysponujemy dokładnymi informacjami o położeniu i wielkości najważniejszych żył. Wystarczy wydać załogom rozkaz i patrzeć, jak najstarsze pasmo górskie Polski pęka, odsłaniając największy skarb."
ATM_uranium_from_phosphorites_desc: "Okolice Annopola słyną z bogactwa fosforytów, które z kolei zawierają duże ilości... uranu. Zgadza się, te niepozorne kamyczki mają największy udział cudownego pierwiastka ze wszystkich niekonwencjonalnych źródeł i całkowicie przyćmiewają wydajność innych potencjalnych miejsc. Moglibyśmy przewiercić każde wzgórze w kraju, lecz tylko tutaj otrzymamy tak wiele przy tak niewielkim wysiłku. Skały są stosunkowo rzadkie i zbyt intensywna eksploatacja szybko je wyczerpie, ale mimo to znacznie zwiększą zaopatrzenie reaktora. Pozostaje rozbudować miejscowe wydobycie i cieszyć się szybkim strumieniem, który powinien pokryć najpilniejsze zapotrzebowanie."
ATM_search_in_the_north_desc: "Północne złoża są prawdziwą żyłą drogocennego uranu, która pod względem rozmiaru i potencjału całkowicie przyćmiewa południowe odpowiedniki. Nie bez powodu nikt wcześniej nie poszedł jednak tą drogą. Bez nowoczesnych rozwiązań technologicznych są niemal niedostępne, a każda próba wydobycia będzie wiązać się z ogromnymi kosztami. Co więcej, część złóż leży na terenach chronionych, co dodatkowo grozi gniewem organizacji ochrony klimatu. Wszystkie te wyzwania bledną jednak w porównaniu z potencjalnymi korzyściami. Jeżeli ujarzmimy dzikie północne syneklizy i utworzymy kopalnie, zapewnimy niezawodny dopływ zasobów zdolny pokryć nie tylko wszystkie potrzeby energetyczne, ale również potrzeby wielu przyszłych pokoleń. Pora kopać!"
ATM_peribaltic_syneclise_desc: "Poza podstawowym skutkiem w postaci ograniczenia zależności od kontrolowanych przez Rosję szlaków wodnych budowa kanału przez Mierzeję Wiślaną przyniosła również drugorzędną, choć znacznie ważniejszą konsekwencję. Początkowo przeoczono odkrycie, lecz wykopy odsłoniły wielkie złoża uranu ukryte w rozsianych po tym obszarze piaskowcach. Jeżeli wierzyć wstępnym danym, zawierają więcej surowca niż wszystkie pozostałe miejsca razem - ponad połowę całych polskich zasobów skupioną w jednym wygodnym pakiecie. Jak zawsze głównym problemem jest dostępność, a właściwie jej brak. Największe nagrody zawsze mają najwyższą cenę i tutaj nie jest inaczej. Uruchomienie wydobycia będzie wymagało potężnej inwestycji, lecz spodziewany zwrot z nawiązką wynagrodzi wszystkie poniesione koszty."
ATM_drilling_into_vistula_spit_desc: "Sprzęt jest gotowy i możemy wreszcie rozpocząć wiercenie na Mierzei Wiślanej. Teren jest niegościnny, okolica niebezpieczna, a sprzeciw społeczny ogromny, lecz stoimy na progu rozwiązania problemów z dostawami uranu. Wydobycie jest więc nie tylko korzystną inwestycją, lecz również sprawą kluczową dla bezpieczeństwa narodowego i energetycznego. Proces nie obejdzie się jednak bez problemów. Możemy do pewnego stopnia zagwarantować ochronę odsłoniętych ekip przed bandytami i armiami watażków, ale konieczność naruszenia delikatnego ekosystemu miejscowego parku krajobrazowego rozgniewała liczne grupy aktywistów, które zdają się zdecydowane na bezterminowe zatrzymanie wszystkich maszyn. Nieszczególnie im się to spodoba, ale będziemy musieli... ostrożnie ich odsunąć i kopać dalej. Sprawa jest zbyt ważna, by ulec żądaniom."
ATM_podlasie_syneclise_desc: "Głęboko położone łupki syneklizy podlaskiej zdecydowanie nie są naszym pierwszym wyborem źródła uranu. Złoże nie należy ani do największych, ani do najbardziej dostępnych, a sięgnięcie po nie ukazuje desperacką potrzebę zdobycia jak największej ilości paliwa dla elektrowni w krótkim czasie pozostałym do jej uruchomienia. Nie możemy dopuścić nawet najmniejszego ryzyka niedoboru, dlatego musimy szybko odblokować także ten strumień, aby wspomóc główne prace wydobywcze. Szacowane koszty są bardzo wysokie i mogą poważnie obciążyć nasze finanse, lecz przyszłe pokolenia podziękują za bezinteresowną ofiarę. Bogate w uran skały Podlasia będą ostatnim lśniącym klejnotem atomowej korony."
ATM_rajsk_uranium_mines_desc: "Aby przyspieszyć północne ambicje górnicze, możemy bezpiecznie oprzeć prace na dawnych planach. Wieś Rajsk została wcześniej wskazana jako odpowiednie miejsce dla kopalni uranu dzięki wysoce zasobnym łupkom znajdującym się głęboko pod ziemią. Wtedy pomysł upadł. Tym razem wreszcie go urzeczywistnimy. Zgodnie z zakurzonymi schematami i rysunkami koncepcyjnymi zbudujemy miejsce wydobycia w samym centrum spokojnej osady, a następnie rozszerzymy je na zewnątrz wraz z nieuniknionym rozwojem działalności. Musimy tylko nieznacznie przesiedlić mieszkańców wsi... a być może całej gminy, jeżeli sytuacja będzie tego wymagała."
