ATM_heart_of_baluty_desc: "Zamiana jednego zestawu problemów na drugi wcale nie ułatwia sprawy. Bezpośrednie zagrożenia mogły zniknąć, lecz perspektywy nadal wyglądają ponuro. Wytchnienie zapewniane przez spokój bunkra pełniącego funkcję kwatery głównej odciąga uwagę od okrutnej rzeczywistości - czeka nas wspinaczka pod górę. Projekty postępują zdecydowanie zbyt wolno, ludzie oraz dawni sojusznicy mają nam za złe nasze działania, a wścibski zachodni sąsiad, niedoszły hegemon Europy, coraz głębiej wtrąca się w nasze sprawy. Choć bardzo chcielibyśmy choć na chwilę zdjąć nogę z gazu, utknęliśmy w nieskończonej spirali nieustannie zmuszającej do wykonania następnego ruchu. W chwili, gdy wreszcie stawaliśmy na nogi, nad Polską gromadzą się ciemne chmury. Przetrwaliśmy jednak wiele burz i z tą nie będzie inaczej. Do roboty!"
ATM_green_fury_desc: "Och, cóż za ironia, że kraj taki jak nasz cierpi wskutek gniewu ekologów. Dotychczas robiliśmy wszystko właściwie, a mimo to ich niezadowolenie tylko rośnie. Można poświęcić się środowisku i sparaliżować wzrost gospodarczy w imię walki ze zmianą klimatu, lecz w oczach niektórych nigdy nie zrzuci się piętna \"atomowych terrorystów\". To wręcz zabawne, jak wiele szkód może wyrządzić zwykła różnica zdań. Nazywanie nas złoczyńcami nie jest niczym nowym, choć oskarżenie rzeczywiście boli bardziej, gdy pada z ust dawnych sojuszników. Nie możemy pozwolić, by aktywiści sabotowali wszystkie inwestycje jądrowe. Sprawa jest zbyt ważna. Mamy związane ręce, więc na razie będziemy po prostu działać bez nich. Być może jeśli zignorujemy wrogą retorykę, zmęczą się i wszystko wróci do normy. W końcu co może nam zrobić zbieranina niezorganizowanych ekologów?"
ATM_monsters_we_create_desc: "Cóż, wygląda na to, że całkiem wiele. Spodziewaliśmy się paskudnych haseł i pikiet, lecz tym razem fanatycy Greenpeace naprawdę przekroczyli granicę. W pewnym sensie sami ponosimy część winy za tragedię. Nigdy nie powinniśmy byli dawać im aż tak wielkiej władzy i swobody. Sprawcy ukryli się i unikają sprawiedliwości. Pokazali, że w obronie swoich drogocennych ideałów nie mają żadnych oporów przed bezmyślnym terrorem. Weszli na wojenną ścieżkę i uderzą ponownie. W przeciwieństwie do obrazu, który nam przypisują, nie jesteśmy jednak potworami. Poprzednicy zamordowaliby aktywistów z zimną krwią, wykurzając ich jednego po drugim, aż zdusiliby ostatni punkt oporu. My jednak nie będziemy bezczynnie patrzeć, jak eliminują naszych ludzi. Trzeba coś zrobić, a jeżeli Greenpeace nie ustąpi, będziemy musieli rozwiązać sprawę w bolesny sposób."
ATM_appeal_to_the_un_desc: "Aktywiści antyatomowi nigdy nie posłuchają naszego głosu rozsądku. Choć ogólne cele obu stron są zgodne, odmawiają uwagi choćby jednemu słowu wypowiedzianemu przez \"marionetki Wielkiego Atomu\". Na szczęście istnieje większy autorytet, znacznie potężniejszy i bardziej wpływowy od naszego państwa, który ci wichrzyciele nadal uznają za moralny wzorzec. ONZ nigdy nie była szczególnie przyjazna naszej sprawie, ponieważ przeniknęli do niej ci sami zagubieni ludzie, którzy sprawiają problemy w naszych granicach, lecz jej krytyka pozostawała dotąd względnie rozsądna. Różnimy się, ale jeśli nawiążemy kontakt i przekonamy organizację, by uznała nas za wartościowego sojusznika, może to wystarczyć do ostudzenia nastrojów w kraju. Z pewnością dostrzegą korzyści współpracy zamiast marnowania cennego czasu i zasobów na wzajemne kłótnie."
ATM_fruitless_effort_desc: "Organizacja Narodów Zjednoczonych nas odrzuciła! Cóż za ironia, że ogłaszają się \"obrońcami pokoju\", lecz kiedy jeden raz mogą naprawdę coś zmienić, postanawiają poprzeć terrorystów aktywnie pustoszących nasze terytorium. Z jakiego powodu? Dziecinnej odmowy uznania konieczności energii atomowej w walce klimatycznej? Greta musiała całkiem postradać zmysły, skoro uważa, że postępuje słusznie. Odmawiając ich potępienia, biernie uprawomocniła sprawę buntowników. Tylko ośmieli ich to do dalszych aktów terroru przeciw niewinnym zwolennikom. Czy nie ma już dość cierpienia i śmierci? Dobrze, jeżeli ONZ nie chce współpracować, sami zajmiemy się sprawą. Niech składają tyle protestów dyplomatycznych, ile tylko pragną. Jeśli chcieli mieć coś do powiedzenia, powinni stanąć po naszej stronie."
ATM_strike_for_climate_desc: "Jakby garstka dysydentów nie wystarczała, fanatykom Greenpeace najwyraźniej udało się zwrócić przeciw nam znaczną część ludności. Podsycając obawy przed potencjalną katastrofą jądrową, wzburzyli obywateli na tyle, że rozpoczęli wielką kampanię obywatelskiego nieposłuszeństwa. W ciągu kilku godzin niemal cała produkcja stanęła, a nawet podstawowe usługi przestały działać. System przemysłowy, tak starannie budowany przez ostatnie lata, runął niczym chwiejny domek z kart po jednym podmuchu wiatru. Bez najważniejszych towarów sytuacja może wkrótce stać się krytyczna, jeśli zapasy awaryjne się wyczerpią, a niedobory tylko podsycą płomienie sprzeciwu. W taki czy inny sposób musimy sprowadzić ludzi z powrotem do pracy. Nawet jeśli będzie to wymagało poważnych ustępstw, to nie stać nas na chwilę opóźnienia, bo wszystkie dotychczasowe wysiłki spłoną na naszych oczach."
ATM_meeting_with_strikers_desc: "Choć aktywnie paraliżują kraj, większość strajkujących nie jest zła. Zostali oszukani i okłamani przez wrogie wpływy, ale można przekonać ich do powrotu na właściwą drogę. Wybaczymy im i powitamy na powrót w domu niczym synów marnotrawnych. Najpierw musimy jednak nakłonić ich do zakończenia farsy, aby życie wróciło do normy. Udało nam się nawiązać bezpośrednią linię komunikacji z przywódcami strajku. Jeżeli zasiądą z nami i znajdziemy jakiś działający kompromis, cała sytuacja może zakończyć się błyskawicznie. Ich obawy są przesadzone. Wystarczy, że posłuchają rozsądku oraz przygotowanych przez nas ogromnych ilości danych, a dostrzegą głupotę własnych działań. Kiedy skończymy, staną się naszymi najwierniejszymi sojusznikami."
ATM_oh_the_irony_desc: "Cóż, teraz to są jeszcze bardziej wściekli. Wspaniale. Najwyraźniej nie spodobało im się walenie po głowach naszymi proatomowymi wykładami. Wcześniej byli gotowi negocjować, a teraz twierdzą, że nigdy nie ulegną żądaniom \"atomowych terrorystów\" i otwarcie domagają się obalenia naszej władzy. Sytuacja pogarsza się z każdą minutą, a widmo niedoborów rośnie. Każdego dnia do protestów dołączają kolejne zagubione dusze, a wydarzenia szybko wymykają się spod kontroli. Jeżeli chcemy je opanować, musimy działać natychmiast. Możliwości są ograniczone, a pokojowe rozwiązanie już wypróbowaliśmy. Nie chcemy tworzyć precedensu, według którego sprzeciw tłumi się siłą, lecz nie pozostawiono nam wyboru. Musimy to przemyśleć. Być może pojawi się inne rozwiązanie, choć wydaje się to coraz mniej prawdopodobne. Może istnieć tylko jedna droga naprzód. Taka, której zawsze pragnęliśmy uniknąć."
ATM_at_least_fair_trial_desc: "A więc w końcu do tego doszło. Jeżeli nie zdołamy nakłonić dysydentów do współpracy, będziemy musieli siłą złamać ich wolę. Próbowaliśmy wszystkiego, lecz historia najwyraźniej skazała nas na to, byśmy nie byli lepsi od brutalnych reżimów z przeszłości. Choć wykonanie wyroku sprawia nam ból, nasza wizja ma znacznie większe znaczenie niż żądania zbuntowanych mas. Nie możemy pozwolić im zniszczyć całej naszej ciężkiej pracy w pogoni za ich głupim marzeniem. Wykorzystanie energii jądrowej nie podlega negocjacjom i garstka zagubionych aktywistów tego nie zmieni. Najgłośniejsza grupa buntowników przypieczętowała los destrukcyjnymi działaniami. Bez nich pozostali powinni szybko się rozejść. Nie ma honoru w skazywaniu człowieka walczącego za szlachetną sprawę, bez względu na to, jak bardzo się myli. Jeżeli nie możemy okazać litości, przynajmniej zachowajmy sprawiedliwość. To szaleństwo musi się skończyć."
ATM_suffocating_smoke_desc: "Ciemne chmury smogu raz za razem okazują się odporniejsze, niż mogliśmy przypuszczać. Bez względu na wprowadzaną politykę walki z pozostałym zanieczyszczeniem powietrza desperacko trzymają się nieba, kryją w mrocznych zakątkach i złowieszczo górują nad tymi samymi fabrykami, które je zrodziły. Niczym ranne zwierzę rozpaczliwie walczące o przetrwanie, szara mgła zdaje się gniewnie odpowiadać na nasze działania, opadając na obszary miejskie i zamykając je w duszącej kapsule, która nadal odbiera życie licznym obywatelom. Z każdym miesiącem obłoki chmur jednak przerzedzają się, a przez wielkie ponure morze dymu przebija się ślad błękitu. Wielki Plan Redukcji przynosi owoce i ostatecznie zniszczymy ostatnie pozostałości smogu, lecz jeśli chcemy dożyć tego dnia, musimy znacznie przyspieszyć postępy."
ATM_water_desc: "Nasze zanieczyszczone rzeki nie są jednak całkiem bezużyteczne. Nawet gdy zatruwają je tony odpadów z każdej fabryki na ich drodze, nurt nadal niesie coś bezcennego - energię. Dotychczas pozyskiwaliśmy ten niemal nieskończony strumień darmowej mocy dość powoli i nieefektywnie. Budowa odpowiedniej infrastruktury stanowi przecież poważne obciążenie finansowe. W miarę zbliżania do całkowitej zależności od energii odnawialnej nie możemy jednak dłużej zaniedbywać jednego z jej najważniejszych źródeł. Polska jest krainą rzek doskonale zdolnych zaopatrzyć nas wszystkich. Musimy przyjąć te dary natury i budować elektrownie wodne wszędzie, gdzie pozwala na to teren. Początkowo będzie to kosztowne, lecz przy odpowiednim planowaniu oraz konserwacji możemy wreszcie pozbyć się szkodliwych systemów opartych na węglu, pozostawionych przez dawne rządy."
ATM_air_desc: "Choć nasze ziemie nie zostały szczególnie pobłogosławione silnym wiatrem, nadal daleko nam do pełnego wykorzystania darów Zefira. Jeszcze przed Upadkiem ledwo dotrzymywaliśmy kroku światowym liderom produkcji. Przez wiele chaotycznych lat nikt nie miał ani zasobów, ani woli, by podczas niemal nieustannej wojny zbudować choćby jedną turbinę. Coraz stabilniejsza i dominująca pozycja pozwoliła nam jednak wreszcie rozpocząć opracowywanie planów masowej budowy generatorów wiatrowych. Zaczynając od wietrznego wybrzeża, stworzymy sieć sięgającą poza horyzont - pole olbrzymów z gracją obracających się dla dobra nas wszystkich, górujących nad krajobrazem w nieustannym tańcu jako dumne symbole naszej wiedzy technologicznej i przywiązania do produkcji energii odnawialnej."
ATM_sun_desc: "Polska zbyt późno przyjęła modę na energię słoneczną. Gdy inne państwa doskonaliły praktyczne zastosowania technologii, panele dopiero raczkowały w naszych granicach. Mimo powolnego początku i surowego klimatu byliśmy na dobrej drodze, by nadrobić zaległości, lecz postęp przerwał Upadek. Po ponad dekadzie chaosu niewiele pozostało z rozległych mórz kolektorów słonecznych, w większości zniszczonych podczas walk. Produkcja i montaż niezliczonych paneli wyraźnie uszczupli roczny budżet, ale nie możemy odpocząć, dopóki nie skompletujemy trójcy odnawialnych źródeł energii. Stoimy na progu osiągnięcia całkowicie wolnej od zanieczyszczeń niezależności energetycznej, co nawet w lepszych czasach kraju uważano za odległe marzenie. Udowodnijmy niedowiarkom, że się mylą, i urzeczywistnijmy tę wizję."
ATM_hydrogen_application_desc: "Rozrzutne czasy polegania na paliwach kopalnych jako głównym źródle energii należą do przeszłości. Możemy radykalnie ograniczyć emisje i zwalczyć liczne zagrożenia zdrowotne, przechodząc na nowy rodzaj spalania - energię wodorową. Choć nie jest równie skuteczna jak tradycyjne paliwa, wykorzystanie technologii mogłoby znacznie zmniejszyć ślad węglowy i oddalić ryzyko niedoborów. Trudno przecież wyczerpać najpowszechniejszy pierwiastek w całym wszechświecie. Tradycyjnie zastosowanie ograniczało się do niewielkich silników pojazdów, lecz przy dostatecznych badaniach możemy rozszerzyć je na niemal wszystkie gałęzie przemysłu i całkowicie zlikwidować dawną zależność od węgla. Będzie to znaczne, choć pomijalne poświęcenie wydajności, ale zapewnimy płynne działanie i zrównoważony rozwój na wiele lat. W naszym położeniu znacznie lepiej mieć coś niezawodnego, niż ryzykować Blackout podobny do tego, którego doświadczyło Bractwo."
ATM_co2_filters_desc: "Pomimo postępów nadal nie zdołaliśmy całkowicie pozbyć się węgla i zapewne długo się to nie zmieni. Niektóre gałęzie przemysłu zwyczajnie nie mają odpowiednich ekologicznych źródeł energii, a całkowite wyłączenie kluczowych części produkcji jest nie do przyjęcia. Nie musimy jednak bezczynnie siedzieć, gdy jesteśmy zmuszeni emitować szkodliwe zanieczyszczenia. Niedawne osiągnięcia techniki umożliwiły stosowanie filtrów dwutlenku węgla, w których powietrze atmosferyczne przechodzi przez materiał absorbujący CO2, następnie szybko skraplany i przekształcany w minerały węglanowe. Jeżeli proces osiągnie odpowiednią wydajność, możemy dojść do emisji netto równej zeru nawet w zakładach wykorzystujących paliwa kopalne. To tylko rozwiązanie tymczasowe, lecz powinno wystarczyć na wiele lat."
ATM_achievements_of_reduction_plan_desc: "Plan Redukcji był niezwykle kontrowersyjny. Dobrowolne ograniczenie produkcji w tak trudnym czasie dla celu równie abstrakcyjnego jak walka ze zmianą klimatu z pewnością nie przysporzyło nam sojuszników. Nawet gdyby kampania skłoniła większość dawnych sympatyków do porzucenia nas, jej powodzenie można oceniać tylko według jednego kryterium - czy rzeczywiście ograniczyła emisje. Pod tym względem możemy bez ogródek nazwać ją sukcesem, choć niezbyt spektakularnym. Podążamy właściwą drogą i jeżeli będziemy trzymać się jej z dotychczasowym oddaniem, możemy naprawdę osiągnąć zrównoważenie środowiskowe w nadchodzących latach. Dzięki naszym wysiłkom Polska odradza się, a przyroda powraca, by odzyskać prawowite ziemie tak brutalnie odebrane przez poprzedników. Postępujemy słusznie. Musimy tylko wytrwać."
ATM_captain_planet_desc: "Na początku Atomowej Krucjaty odziedziczyliśmy katastrofę ekologiczną niepodobną do niczego, co wcześniej widziano w rozwiniętym świecie. Po ponad dekadzie prób ocalenia nielicznych pozostałości kruchego ekosystemu oraz przejścia na odnawialne źródła energii w zawrotnym tempie zdołaliśmy odwrócić szkody całego stulecia i stanąć na czele nowej, zdrowszej epoki. Matka Natura się uzdrawia, a wszystko dzięki jednemu człowiekowi. Jakub Wiech dokonał niemożliwego i odwrócił losy globalnej walki ze zmianą klimatu. Po raz pierwszy tłumy na widok wizjonera niosącego je ku przyszłości nie szepczą z powątpiewaniem, lecz wiwatują z entuzjazmem. Nie jest już wiecznym słabeuszem i zaczęto postrzegać go takim, jaki naprawdę jest - bohaterem, największym obrońcą planety. Dopóki stoi na czele państwa, niszczycielskie siły ludzkiej chciwości nigdy nie zatriumfują."
ATM_black_eagle_desc: "Nasza zachodnia granica jest daleka od bezpieczeństwa. Jednego dnia możemy świętować zwycięstwa na froncie wewnętrznym, a następnego utracić wszystko wskutek kolejnej inwazji. Niemcy już pokazali gotowość do ingerowania w nasze sprawy, a obecna retoryka nie jest ani trochę przyjaźniejsza niż przed laty. Wtedy powstrzymali ich unijni partnerzy, zanim zdołali całkowicie nas podporządkować. Tym razem nie będziemy mieli tyle szczęścia. Długofalowe cele Energiewende są jasne - wyeliminowanie energetyki jądrowej na całym świecie. Skoro mają czelność ujadać na supermocarstwa po drugiej stronie globu, nie będą po prostu tolerować atomowego odrodzenia u wschodniego sąsiada. W końcu uderzą. Kiedy to zrobią, nauczymy ich pozostawać po własnej stronie Odry i nigdy więcej nie zadzierać z Polską."
ATM_fortify_border_desc: "Choć przeszkody naturalne zapewniają tak potrzebną ochronę, mosty na Odrze dają każdemu potencjalnemu najeźdźcy doskonałą możliwość przekroczenia potężnej rzeki. Gdy niemieckie kolumny pancerne wdarłyby się na rozległe, otwarte równiny po jej wschodniej stronie, niewiele moglibyśmy zrobić, by powstrzymać je przed dotarciem do serca kraju. W ciągu kilku minut możemy zostać zalani i utracić kontrolę nad najlepszą linią obrony. W takim położeniu równie dobrze moglibyśmy się poddać. Po rozpoczęciu wojny nikt nie da nam czasu na przygotowania. Najpewniej natychmiast staniemy wobec pełnowymiarowego natarcia. Musimy być gotowi, by na pierwszy widok formacji wroga wysadzić wszystkie przeprawy, rozmieścić oddziały w nowo zbudowanych fortyfikacjach wzdłuż rzeki i strzelać do żołnierzy Bundeswehry jak do kaczek, gdy bezskutecznie spróbują przebić się na drugi brzeg."
ATM_formation_of_minutemen_desc: "Ile czasu będziemy mieli na załatanie szybko rosnącej wyrwy, gdy nasze linie nieuchronnie zostaną przełamane? Godzinę? Dzień? Zdecydowanie zbyt mało, by Sztab Generalny zebrał się i wymyślił cudowny plan ratowania sytuacji. Niegdyś polegaliśmy na Wojskach Obrony Terytorialnej, lecz wobec prawdziwego zagrożenia ich koncepcja okazała się w znacznej mierze nieskuteczna. Pod ogniem wroga rozpierzchali się, zawsze spóźnieni i nigdy dość liczni, by zmienić wynik bitwy. Potrzebujemy jednostki zdolnej zareagować natychmiast i zneutralizować każde niebezpieczeństwo bez chwili zwłoki - takiej, której do dołączenia do pierwszej linii potrzeba nie więcej niż przysłowiowej minuty. Możliwość wzmacniania pozycji niemal na życzenie uczyni nasze linie niezniszczalnymi, a każde wrogie natarcie wykrwawi się bez osiągnięcia najmniejszego postępu."
ATM_mine_the_coastline_desc: "Głupotą byłoby zakładać, że w coraz bardziej prawdopodobnej wojnie zaatakują nas wyłącznie wzdłuż granicy lądowej. Sposób prowadzenia działań ofensywnych radykalnie różni się od czasów przodków, a wrogowie z pewnością wykorzystają każdą możliwość przełamania obrony. Desant morski zawsze jest kuszącym sposobem przejęcia wybrzeża, a nasza linia brzegowa jest długa i słabo chroniona. Nie możemy liczyć na dorównanie niemieckiej flocie na mroźnych wodach Bałtyku. W otwartej bitwie łatwo by nas odparto. Choć zdobycie panowania na morzu jest niemożliwe, możemy przynajmniej odebrać przeciwnikom swobodę działania w pobliżu wybrzeża. Aby zapobiec desantom, przykryjemy morze tak gęstym kobiercem min, że żaden okręt nie przepłynie bez uszkodzeń. Jeśli chcą najechać nas od północy, zapłacą wysoką cenę za pychę."
ATM_lessons_from_fall_desc: "Jeżeli chodzi o odparcie niemieckiej inwazji, dysponujemy już bolesnym przykładem tego, czego nie wolno robić. Niekompetencja rządu Morawieckiego zmieniła kampanię, która miała być wyniszczającą mordęgą, w spacerek przerwany wyłącznie przez narastające wśród sojuszników Berlina obawy przed jego dominacją. Jeśli mamy stawić czoła całej potędze Bundeswehry, nie możemy pozwolić, aby zgubiły nas podziały i chwiejne sympatie. Przekaz musi być jasny - bronimy się przed wrogą siłą zdeterminowaną podporządkować każdego Polaka obcemu uciskowi. Upolitycznienie wojska pomogło zachować oddanie przeciętnego żołnierza naszej sprawie, lecz musimy przejść do bardziej zawodowych sił, zbudowanych nie na kapryśnej osobistej lojalności wobec idei politycznej, ale na wiecznym oddaniu Ojczyźnie. W obliczu niemieckiej agresji zjednoczymy się w walce o przetrwanie narodu."
ATM_approach_the_french_desc: "Nawet jeżeli powstrzymamy pierwsze natarcie, nie możemy oczekiwać, że na zawsze zatrzymamy Niemców. Ich potęga przemysłowa w końcu nas przytłoczy. Na każdy utracony przez nas pocisk mogą wystrzelić dziesięć, nie wspominając o całym specjalistycznym wyposażeniu, którym dysponują. Jeżeli chcemy przetrwać, potrzebujemy sojuszników. Francuzi nie darzą nas wielką sympatią, lecz bez chwili wahania skorzystają z możliwości osłabienia swojego wroga. Jeżeli przyślą nam rozpaczliwie potrzebne zaopatrzenie, powinniśmy zorganizować skuteczną obronę i wytrzymać dostatecznie długo, aby ich naciski dyplomatyczne zatrzymały konflikt. Jeżeli nawiążemy kontakt i pokażemy się z najlepszej strony, powinni uznać nas za wartościowego sojusznika. Nasze narody zawsze łączyła naturalna przyjaźń. Pora odnowić partnerstwo."
ATM_dust_off_old_machines_desc: "Podczas wojny nie możemy pozwolić sobie na wybrzydzanie, zwłaszcza wobec wroga o ponad dwukrotnie większych możliwościach produkcyjnych. Gdy dojdzie do starcia, będziemy potrzebować każdej możliwej przewagi, dlatego nie można wykluczać nawet wykorzystania dawnych, podejrzanych modeli sprzętu Bractwa. Na szczęście poprzedni przeciwnicy łaskawie pozostawili pokaźne zapasy niewykorzystanych egzemplarzy testowych, które porzucone powoli rdzewieją w magazynach rozsianych po województwie. Czasami o różnicy między zwycięstwem a porażką decyduje jedna prymitywna maszyna wypełniająca kluczową lukę. Aby zmaksymalizować szanse, dokładnie sprawdzimy stan wszystkich podobnych sztuk i sporządzimy spis wskazujący, co można potencjalnie przekazać żołnierzom, a co jest tylko stertą bezużytecznego złomu. Przynajmniej znaczna część powinna nadal działać, prawda?"
ATM_rad_eaters_desc: "Przed Upadkiem polskie siły specjalne cieszyły się groźną reputacją, a jednostki takie jak GROM, Agat i JWK regularnie uznawano za jedne z najskuteczniejszych zespołów bojowych na całym kontynencie, zdolne konkurować nawet z absolutną światową elitą. Niestety żadna z organizacji nie przetrwała licznych prób najbardziej burzliwego okresu kraju, lecz ich dziedzictwo nadal istnieje, podobnie jak wielu dawnych członków. Jeżeli zmierzymy się z Niemcami w otwartym konflikcie, zapewne będziemy musieli intensywnie wykorzystywać elitarne formacje, by tworzyć przewagę w najważniejszych punktach frontu. Infrastruktura szkoleniowa pozostała w znacznej mierze nienaruszona, a wielu byłych komandosów chce służyć jako instruktorzy. Możemy więc zbudować własną jednostkę sił specjalnych, podlegającą takim samym, jeśli nie wyższym standardom niż dawniej. Gdziekolwiek pojawią się Radożercy, przechylą szalę bitwy na naszą korzyść bez względu na trudność zadania."
ATM_hearts_and_minds_desc: "Strach. Pomimo kolejnych osiągnięć, strach paraliżuje wszystkie dalsze próby wprowadzania energii jądrowej do życia publicznego. Niedoinformowane masy nerwowo drżą na samą wzmiankę o rozszerzeniu naszych programów i po cichu modlą się o nasz upadek, żywiąc próżne nadzieje na własne ocalenie. Niszczycielski potencjał Atomu skrzywdził Polskę jak żaden inny kraj. Dziś nawet pokojowe inicjatywy kojarzą się z katastrofami na Bałutach i w Czarnobylu. Utknęliśmy w martwym punkcie i musimy łagodzić politykę, by uniknąć gniewu ludzi. Aby przełamać impas, musimy ukoić ich lęk i pokazać prawdziwą naturę technologii jądrowej - nowoczesnego, bezpiecznego rozwiązania problemów energetycznych narodu. Obalenie dziesięcioleci antyatomowej propagandy będzie ogromnym zadaniem, lecz jeżeli przekonamy choćby znaczną część ludności, dalsze działania staną się znacznie łatwiejsze."
ATM_lead_by_example_desc: "Nie możemy oczekiwać, że ludzie uwierzą w nasze zapewnienia o bezpieczeństwie technologii jądrowej, jeżeli sami nie okażemy choćby odrobiny zaufania. To jedynie formalność, ale już dawno powinniśmy odbyć niewielką trasę powrotną po Bałutach. Nawet dziś tylko najodważniejsze dusze zapuszczają się na spustoszone ziemie, co wzmacnia legendę o zagrożeniu, jakie może stworzyć pojedynczy wybuch atomowy, przypadkowy lub nie. Oczywiście doskonale wiemy, że okolica jest bezpieczna. Dosłownie spędziliśmy wiele miesięcy w ukryciu tuż obok strefy wybuchu. Mimo to nie zaszkodzi ponownie odwiedzić terytorium i zmienić wyprawę w pełnowymiarową akcję wizerunkową. Pokażmy ją w telewizji, pobierzmy kilka próbek gleby i przeprowadźmy serię badań dowodzących braku trwałego promieniowania. Jeżeli dopilnujemy, by wszyscy patrzyli, możemy raz na zawsze udowodnić, że nawet najgorsza znana nam tragedia jądrowa blednie przy codziennym zniszczeniu wywoływanym przez węgiel."
ATM_affirmation_campaign_desc: "Zawsze staraliśmy się złagodzić w umysłach ludzi splamiony obraz Atomu, lecz bez pełnoprawnej kampanii niewiele zdołamy osiągnąć, zwłaszcza gdy tragedia Bałut jest tak świeżo wyryta w zbiorowej pamięci. Wielu nie dostrzega różnicy między nieszkodliwą energetyką jądrową a niszczycielskim potencjałem broni atomowej. Jeżeli chcemy ukoić obawy, musimy pokazać, że \"przerażająca megastruktura złowieszczo górująca nad ich domami\" zdecydowanie należy do pierwszej kategorii i wcale nie wybuchnie, pustosząc pół kraju. Aby różnica stała się boleśnie jasna, rozdamy ulotki, obkleimy miasta billboardami i zorganizujemy otwarte spotkania z ekspertami technologii jądrowej dla każdego, kto wątpi w bezpieczeństwo projektu. Gdy skończymy, wszyscy obywatele będą wiedzieli, że nie mają się czego bać."
ATM_we_could_use_media_desc: "Przyjazny aparat medialny sumiennie szerzący twoje ideały wśród mas nie musi być czymś złym, nawet jeśli czasami trzeba nagiąć prawdę, by zachować pozytywny wizerunek. Bractwo miało słuszny pomysł, przejmując kontrolę nad prasą, lecz zrujnowało go fatalnym wykonaniem. Nie musimy wymyślać jawnych kłamstw ani cenzurować wszystkich innych opinii, aby wyglądać na tych dobrych. Wiemy, że mamy rację. Trzeba tylko dopilnować, by wszyscy otrzymali przekaz. Jeżeli zastosujemy wystarczającą ilość faworyzowania, by przyjazne publikacje zawsze utrzymywały przewagę nad konkurencją, wkrótce każdy obywatel pozna naszą narrację wraz z wiedzą potrzebną do jej pełnego poparcia, zanim natknie się na choćby jedno słowo przeciwników próbujących ją obalić. Później nikt przy zdrowych zmysłach nawet nie pomyśli o wątpieniu w nas."
ATM_rewrite_education_system_desc: "Skutki dziesięcioleci upolitycznionej edukacji oraz jawnej dezinformacji szerzonej przez ludzi, którym powierzono kształtowanie umysłów najmłodszych obywateli, są oczywiste. Wychowaliśmy pokolenie aroganckich półgłówków, niezdolnych do choćby jednej samodzielnej myśli i idealnie przygotowanych do powtarzania kłamstw, którymi wielokrotnie wbijano im do głów. Absolwenci Systemu Edukacyjnego Bractwa są w znacznej mierze straceni, lecz możemy zapobiec powtórzeniu sytuacji. Szkoła nie powinna wbijać uczniom jedynego właściwego sposobu myślenia, nawet jeśli mogłaby szerzyć nasze nauki. Potrzebujemy prawdziwej platformy krytycznego myślenia, która zachęca do dyskusji, sumiennego sprawdzania faktów i metodycznych badań. W przeciwieństwie do przeciwników nie musimy mówić dzieciom, w co mają wierzyć. Jeżeli damy im właściwe narzędzia do poszukiwania prawdy, to i tak zrozumieją, że znajduje się ona po naszej stronie."
ATM_reintroduction_of_studies_desc: "Do zarządzania licznymi specjalistycznymi i najnowocześniejszymi projektami potrzebujemy wielkiej liczby doskonale wyszkolonych pracowników. Niestety stwierdzenie, że brakuje nam odpowiednich kadr, byłoby ogromnym niedopowiedzeniem. Zawieszenie niemal całego szkolnictwa wyższego i prześladowanie każdego, czyją wiedzę można było uznać za niebezpieczną, doprowadziły do największego drenażu mózgów w Europie, a większość ekspertów wyjechała ku lepszym prospektom. Nawet jeżeli niektórych da się skusić do powrotu, pozostaje nam luka pokoleniowa niewykwalifikowanej siły roboczej. Jeżeli wznowimy działalność rozmaitych uczelni technicznych na naszym terytorium i położymy w programach silny nacisk na badania jądrowe oraz inżynierię, z czasem możemy obsadzić większość kluczowych stanowisk nowym pokoleniem obiecujących i ambitnych specjalistów. Prawdopodobnie minie jednak wiele lat, zanim inwestycja w ich przyszłość zwróci się w pełni."
ATM_children_of_atom_desc: "Najmłodsze pokolenie Polaków, urodzone i wychowane pod naszą opieką, jest źródłem niemal niewyczerpanego potencjału. Nie splamiły go nikczemne kłamstwa dawnych reżimów ani traumatyczne wydarzenia kształtujące obecną świadomość narodu. Odpowiednio pielęgnowane może stać się kluczem do jaśniejszej przyszłości nas wszystkich, lecz żeby sprowadzić je na właściwą drogę, musimy wykorzystać lata kształtowania i wszczepić podatnym umysłom odpowiednie wartości. Począwszy od szkół podstawowych oraz przedszkoli, nauczyciele będą sławić zalety Atomu w prostej i zrozumiałej formie, dzięki której wykorzystanie energii jądrowej dla dobra kraju zabrzmi równie naturalnie oraz fundamentalnie jak podstawowe dodawanie. Dla gotowych zrobić więcej przygotujemy rozmaite zajęcia pozalekcyjne, kluby i grupy, które będą dalej szerzyć sprawę. Daleko temu do oddania wymaganego przez organizacje młodzieżowe znienawidzonych poprzedników, lecz nadal jest to skuteczny sposób zapewnienia wiecznej lojalności dzieci pod pozorem beztroskiej zabawy."
ATM_knowledge_is_death_of_fear_desc: "Zrobiliśmy wszystko, co mogliśmy, wielokrotnie pokazując obywatelom bezpieczeństwo energii jądrowej. Wielu posłuchało. Część najzacieklejszych wrogów dołączyła do naszych szeregów jako gorliwi zwolennicy sprawy atomowej. Nie wszyscy okazali się jednak równie otwarci. Wielu przedstawicieli starszych pokoleń nadal stanowczo sprzeciwia się wszystkiemu, co jądrowe, i wciąż bredzi o katastrofach, których ledwie pamięta. Upłynie trochę wody w Wiśle, zanim opowieści krążące dziś po Polsce jako legendy i powtarzane przez starców jako ostrzeżenie przed nadmiernym zaufaniem do niezawodności Atomu wreszcie wymrą. Młodzież nauczyła się głosić chwałę energii jądrowej i okazuje oddanie, jakiego nie widzieliśmy od pierwszej bitwy z siłami Ziemkiewicza. Wkrótce staną się oni kręgosłupem polskiego społeczeństwa, a nasza sprawa zakorzeni się w sercach i umysłach ludności."
ATM_utilize_radiation_desc: "Niedawne prace wydobywcze zapewniły nam dostęp do świętego Graala wszystkich źródeł energii - uranu. Wszystkie konwencjonalne metody, z którymi dotychczas pracowaliśmy, bledną przy potędze choćby jednej bryłki tej cudownej rudy. Bez kozery można stwierdzić, że odblokowaliśmy prawdziwy potencjał, do którego zawsze dążyliśmy. Niestety uran ma także wady. Choć bardzo chcielibyśmy rozszerzyć jego wykorzystanie, nieodłączna promieniotwórczość rzeczywiście stwarza poważne zagrożenie. Wiemy wystarczająco dużo, by nie składać ludzi w ofierze na ołtarzu postępu, lecz korzyści są zbyt wielkie, by z nich zrezygnować. Trzymamy w rękach klucz do zwycięstwa. Musimy teraz zdecydować, co jest ważniejsze - jednostka czy dobro ogółu."
ATM_deadly_but_safe_desc: "Nie jesteśmy bezmyślnymi potworami. Jeżeli wykorzystamy materiały promieniotwórcze, wszystkimi działaniami pokieruje jedna zasada - bezpieczeństwo obywateli jest najważniejsze. Naprawdę szkoda, że nigdy nie ujarzmimy pełnej potęgi rozszczepienia, lecz na własne oczy widzieliśmy zniszczenie przynoszone przez bezmyślną pogoń za całkowitym wykorzystaniem potencjału surowca. Mówi się, że władza deprawuje, ale my nie ulegniemy pokusie. Zresztą niewiele tracimy. Istnieje wiele bezpiecznych zastosowań uranu, a inżynierowie już ciężko pracują nad pierwszymi projektami. Możemy marzyć o tym, co mogło powstać, lecz dokonaliśmy słusznego wyboru. Nasze serca pozostały po właściwej stronie i ludzie będą wdzięczni. Nie pożałujemy. Nie możemy."
ATM_uranium_armor_desc: "Zubożony uran, powstający jako produkt uboczny wytwarzania wzbogaconego odpowiednika służącego za paliwo dla reaktora jądrowego, ma kilka własnych interesujących właściwości. Dzięki mniejszej zawartości najbardziej rozszczepialnego izotopu jego metaliczna postać wyróżnia się niezwykle wysoką gęstością, co czyni ją doskonałym materiałem na płyty dla pojazdów opancerzonych. Umieszczenie go w czołgach między warstwami stali mogłoby znacznie poprawić ich odporność i uczynić niemal nieprzebijalnymi dla większości konwencjonalnej broni przeciwpancernej. Oczywiście zamknięcie żołnierzy w czymś, co w istocie jest promieniotwórczą kapsułą, budzi poważne obawy zdrowotne, lecz ekspozycja powinna być dość ograniczona, by podczas zwykłej zmiany na polu bitwy nie stwarzać znacznego ryzyka. Jeżeli okoliczności zmuszą ich do jednorazowego działania przez dłuższy czas... cóż, od tego są szpitale polowe."
ATM_uranium_bullets_desc: "Wraz z naszymi możliwościami rosną również możliwości wrogów. Niedawne wojny pokazały, że utraciliśmy monopol na pancerz. Zamiast razić nieprzyjacielskie czołgi setkami bezużytecznych pocisków, możemy wykorzystać zubożony uran z elektrowni jądrowej do produkcji najnowocześniejszej amunicji przeciwpancernej. Ostrzejszy rdzeń, który nie pęka przy uderzeniu i łatwo zapala się po trafieniu, pozwoli tym cudeńkom jednym strzałem rozbić nawet najtwardsze płyty. Masowe zastosowanie technologii w wyspecjalizowanych batalionach przeciwpancernych całkowicie zniweluje zdolność wrogów do prowadzenia wojny pancernej. Jeżeli tylko ośmielą się rozmieścić maszyny w pobliżu frontu, na pewno je odnajdziemy, obierzemy za cel i natychmiast zniszczymy, aż ostatecznie wycofają się ze wstydem - na piechotę."
ATM_nuclear_jets_desc: "Pomysł wyposażenia samolotów w napęd jądrowy jest stary i sięga pierwszych lat zimnej wojny, lecz koncepcja nigdy nie wyszła poza etap eksperymentalny. Nawet gdy udawało się wytworzyć dość energii do zasilania pojazdu w locie, problem niewystarczającej osłony przed promieniowaniem od dawna wymykał się naukowcom oraz inżynierom. Tam, gdzie oni widzieli trudności, my dostrzegamy okazję. Dzięki szybkiemu postępowi technologicznemu możemy znaleźć odpowiednią równowagę między wydajnością a bezpieczeństwem personelu. Jeżeli zdołamy stworzyć model gotowy do walki, zyskamy przewagę nie tylko nad pozostałymi watażkami, lecz także światowymi hegemonami. Nadal sądzą, że walczymy prowizoryczną bronią i kijami bejsbolowymi. Wyobraźcie sobie zdumienie w ich oczach, gdy pokażemy całemu światu konstrukcję uznaną przez wszystkich za niemożliwą."
ATM_nuclear_engines_desc: "Od pierwszego ujarzmienia potęgi Atomu rozwój marynarki i technologii jądrowej pozostają splecione ze sobą. Wielkie, powolne morskie kolosy są doskonałymi jednostkami do zastosowania napędu jądrowego dzięki dość równomiernemu zużyciu energii przez większą część typowego rejsu. Izolacja zapewniana przez bezmiar morza daje dodatkową korzyść: gdyby coś naprawdę poszło nie tak, każda awaria systemu pozostałaby zdarzeniem czysto lokalnym, bez ryzyka naruszenia integralności reszty floty. Tradycyjne zastosowania ograniczają się głównie do okrętów podwodnych, lecz niemal całkowite zniszczenie Polskiej Marynarki Wojennej podczas Inwazji daje nam wyjątkową możliwość odbudowy od podstaw, z energią atomową jako standardowym napędem wszystkich okrętów. Zaczynając od niewielkich krążowników i niszczycieli, zbudujemy największą flotę jądrową świata, być może pewnego dnia wystawiając pierwszy lotniskowiec, jaki kiedykolwiek pływał po Bałtyku."
ATM_sacred_losses_desc: "Obawy zdrowotne są ważne, lecz w obecnej sytuacji nie stać nas na stawianie bezpieczeństwa wybranej garstki ponad interesem wszystkich pozostałych. Kiedy niebezpieczeństwo czai się za każdym rogiem, ograniczanie potencjału z powodu humanitarnego oburzenia byłoby szaleństwem. Oczywiście skazywanie części żołnierzy na potworną, bolesną śmierć wskutek choroby popromiennej jest niemoralne. Właśnie dlatego są bohaterami, skoro tak heroicznie zgłosili się na ochotników do tych misji. Gdyby tego nie zrobili, prawdopodobnie wszyscy bylibyśmy martwi, podporządkowani silniejszej potędze, która nie zatrzyma się, by rozważać słuszność własnych działań. Jeśli chcemy wznieść się na wyżyny wymagane przez ambicje, musimy ujarzmić pełną moc Atomu - to jasne jak słońce. Robimy matkę wszystkich omletów. Nie możemy martwić się każdym jajkiem."
ATM_precise_dispersion_desc: "Krytycy uwielbiają twierdzić, że nie dostrzegamy zagrożeń promieniowania. Nic bardziej mylnego. W przeciwieństwie do ich ograniczonych, lękliwych umysłów widzimy potencjał czekający na wykorzystanie, a nie niebezpieczeństwo, którego trzeba unikać. Gdyby strategicznie rozmieścić materiały promieniotwórcze w pobliżu formacji wroga albo we własnych pozycjach przed taktycznym odwrotem, cząstki wyrzucane z rozpadających się jąder mogłyby powoli wyniszczać nieprzyjacielskie armie bez oddania jednego strzału. Jakby dotknięci nieznaną zarazą wiszącą nad polem bitwy, przeciwnicy padaliby jak muchy, pozwalając nam dobić niedobitki. Niektóre bardziej krytyczne głosy mogą nazwać ten plan rzekomą \"zbrodnią wojenną\", lecz czy naprawdę różni się to od zabijania ich w tradycyjny sposób? Właściwie pozostawiamy walczącym wyjątkową szansę na przetrwanie natarcia, o ile zdołają wyzdrowieć z okropieństw choroby popromiennej."
ATM_attack_of_dead_men_desc: "Przekształcenie pola bitwy w napromieniowane, niegościnne pustkowie, na którym nie przetrwa żaden człowiek, nie musi być czymś złym. Jeżeli zmusimy wroga do porzucenia albo przynajmniej osłabienia pozycji, by uniknął szkodliwego promieniowania dziesiątkującego jego żołnierzy, znajdziemy się w doskonałym położeniu do przeprowadzenia niszczycielskiego ataku przez przerzedzone linie i wbiciu potężnego klinu zdolnego rozbić każdą obronę. Musimy tylko wyposażyć własnych żołnierzy w dość sprzętu ochronnego, by przetrwali warunki wystarczająco długo do wykonania celów. Ich los zapewne zostanie przypieczętowany, lecz lepiej skazać setki, niż potencjalnie utracić dziesiątki tysięcy w nieskutecznych konwencjonalnych atakach. Nie ma większego honoru niż śmierć pośród potęgi Atomu i bezpośrednie doświadczenie siły promieniowania. Wybrańcy powinni wręcz uznać się za szczęśliwców. Oddali życie za dobrą sprawę."
ATM_zeppelin_in_atomic_age_desc: "Od tragedii Hindenburga ponad sto lat temu sterowce uważa się za niebezpieczny i przestarzały środek podróży. To niezwykle ograniczony sposób myślenia, zwłaszcza że wymagają znacznie mniej energii zarówno podczas startu, jak i na wysokości przelotowej, co czyni je doskonałymi jednostkami do zastosowania napędu jądrowego. Kolejna zaleta jest oczywista - możliwość prowadzenia nieprzerwanego patrolu przez wiele godzin, a potencjalnie nawet dni, niczym wszechwidzący strażnik czuwający nad nami z nieba. Odpowiednio uzbrojone i w jakiś sposób przemycone nad terytorium wroga sterowce mogłyby siać spustoszenie daleko za jego liniami, uderzając w ośrodki przemysłowe pozostające poza zasięgiem konwencjonalnej broni. Ponowne wykorzystanie dawnych projektów Bractwa i wyposażenie ich w odpowiednie źródło napędu pozwoliłoby natychmiast rozpocząć produkcję i w znacznej mierze ominąć etap planowania. Wszystkie elementy są na miejscu. Musimy tylko wprawić je w ruch."
ATM_modernization_of_mi14pl_desc: "Podczas zimnej wojny wiele największych potęg eksperymentowało ze śmigłowcami zdolnymi przenosić ładunek jądrowy. Mogły działać znacznie elastyczniej niż tradycyjne samoloty i były szczególnie przydatne w walce z ruchomymi celami oraz na małych wysokościach. Radziecka sfera często wykorzystywała te maszyny, lecz konstrukcja w dużej mierze się zestarzała i opiera na technologiach opatentowanych ponad pół wieku temu. Podstawowy projekt jest solidny i może zwiększyć nasze jądrowe możliwości uderzeń powietrze-ziemia, choć wymaga znacznych udoskonaleń, by sprostać wymaganiom współczesnej wojny. Jeżeli zdobędziemy odpowiednią dokumentację, powinniśmy zmodernizować modele przy użyciu najnowszych osiągnięć. Wtedy śmigłowce będą mogły stawić czoła nawet najskuteczniejszym systemom obrony przeciwlotniczej."
ATM_threat_of_the_future_desc: "Gdy rozpoczynaliśmy walkę, nasza armia była tylko zbieraniną gloryfikowanych partyzantów. Przez wiele kolejnych lat skutecznie przekształciliśmy ją w prawdopodobnie najbardziej oddaną siłę bojową całej Europy, uzbrojoną po zęby w szereg przełomowych technologii. Przede wszystkim nie gonimy już tylko za światowymi trendami. Wszechobecne wykorzystanie energii jądrowej we wszystkich rodzajach sił zbrojnych stawia nas na czele nadchodzącej rewolucji, która na zawsze odmieni sztukę wojenną i zdecydowanie wprowadzi ją w epokę atomu. Osiągnięcia zmieniły układ sił na świecie i zakłóciły hegemonię obecnych supermocarstw. Gardzą naszym pędem, oskarżają o zabawę ogniem kosztem wszystkich, lecz przede wszystkim boją się pozostania w tyle. Jako pierwsi wykonaliśmy ten skok naprzód, ale nie będziemy ostatni. Kiedy spróbują nas dogonić, zawsze pozostaniemy dziesięć kroków przed nimi, jako wieczni pionierzy broni jądrowej."
ATM_medical_usage_desc: "Zalegający smog jest powolnym, lecz metodycznym zabójcą. Jego ciągła obecność doprowadziła do powstania rozmaitych chorób, przede wszystkim nowotworów. Przy obecnym przeciążeniu systemu opieki zdrowotnej podobna diagnoza niemal zawsze oznaczała dotychczas wyrok śmierci. Już nie. Nasze społeczeństwo choruje, a my mamy lekarstwo. Terapia radioizotopowa od dawna uchodzi za jeden z największych przełomów w onkologii, lecz koszty i trudności zdobycia odpowiednich środków leczniczych uznawano za zbyt wielkie, by inwestować. Teraz, gdy mamy dostęp do kilku... mniej sprawdzonych izotopów, możemy wreszcie urzeczywistnić pomysł. Część lekarzy zgłasza obawy dotyczące bezpieczeństwa i potencjalnych skutków ubocznych stosowania wysoce promieniotwórczych materiałów u pacjentów bez wcześniejszych odpowiednich badań klinicznych, lecz korzyści znacznie przewyższają wszelkie ryzyko. W końcu to i tak ten sam proces. Co jeszcze gorszego może się wydarzyć?"
ATM_agricultural_usage_desc: "Polskie rolnictwo nadal nie odzyskało sił po szkodach wyrządzonych przez Bractwo podczas krótkich rządów w województwie łódzkim. W dalszych wysiłkach na rzecz jego odrodzenia zdobyliśmy właśnie potężnego, choć niespodziewanego atomowego sojusznika. Promieniowanie emitowane podczas rozpadu niestabilnych pierwiastków daje możliwości radiograficznego określania najlepszego rozmieszczenia i stosowania nawozów, a dzięki szkodliwemu wpływowi na zwierzęta pozwala na niezrównaną kontrolę szkodników mogącą zastąpić pestycydy. Poza tym, podobnie jak niemal niezdatne do życia warunki i zanieczyszczenie ziemi przyspieszyły naturalną selekcję najodporniejszych odmian roślin, promieniowanie może wywoływać mutacje pomagające stworzyć wydajniejsze warianty. Tym razem nauka jest niepodważalna, sprawdzona na wielu kontynentach i rodzajach gleby. Wniosek jest jasny - wkrótce pokonamy problemy z którymi boryka się rolnictwo."
ATM_industrial_usage_desc: "Potencjalne zastosowania uranu w rozmaitych gałęziach przemysłu są w znacznej mierze marginalne i często pomijane, lecz zawsze pozostajemy otwarci na nowe rozwiązania wykorzystujące materiały jądrowe. Poza celami badawczo-rozwojowymi jesteśmy gotowi rozwijać radiografię przemysłową, umożliwiającą dokładne obrazowanie wewnętrznych cech metali i spawów użytych w infrastrukturze, zwłaszcza często niedbałych elementów zbudowanych przez pokonanych watażków, aby wykryć wszelkie wady konstrukcyjne. Niestabilne cząsteczki można ponadto wykorzystywać do sterylizacji żywności i konstrukcji wyposażenia szpitalnego, a także w miernikach precyzyjnie kontrolujących gęstość oraz grubość używanych materiałów. Wszystkie te zastosowania są drobne i głównie sytuacyjne, lecz szybko się sumują, stawiając nas na czele innowacji przemysłowych. Polska nie będzie już technologicznym zaściankiem Europy. Od teraz to my wyznaczamy światowe standardy."
ATM_last_son_of_atom_desc: "Dokonaliśmy wiele dla naszego narodu, niemal na każdym kroku przecząc oczekiwaniom i zmieniając rozdarte wojną pustkowie w rosnące supermocarstwo. Kraj się odrodził i po raz pierwszy w swojej długiej, burzliwej historii znalazł się pod kompetentnym przywództwem. Bujne zielone pola zachodniej Polski, malownicze wybrzeża Pomorza, nieujarzmione góry Tatr - odzyskaliśmy krajobrazy uważane za bezpowrotnie utracone, harmonijnie łącząc je ze zrównoważonym przemysłem jądrowym, który przez nadchodzące stulecia będzie niewzruszonym kręgosłupem narodu. Stoimy na progu zwycięstwa, lecz na drodze pozostał jeden wróg, coraz bardziej zazdrosny o rosnącą siłę oraz pozycję międzynarodową. Ze swojej siedziby w Berlinie, Niemcy spoglądają na nas z płomiennym gniewem jako na antytezę ich antyatomowej retoryki i ucieleśnienie wszystkich wynikających z niej błędów. Czy nam się to podoba, czy nie, będziemy musieli ukrócić imperialne marzenia."
ATM_winter_is_coming_desc: "Niemieckie zagrożenie nie ustąpi łatwo. Nieustannie nas sprawdzają, metodycznie zwiększają napięcie na granicy i szukają słabości, które mogłyby nas złamać. Jasno przedstawili stanowisko - konflikt jest nieunikniony, a oni przygotowują się do ostatecznego starcia, które raz na zawsze rozstrzygnie nasze spory. Z Berlinem nie da się negocjować. Wiedzą, że jeżeli nie pokonają nas teraz, prawdopodobnie nigdy nie otrzymają kolejnej okazji do powstrzymania nas przed przyćmieniem ich niegdyś groźnej potęgi. Każdego dnia na brzegu Odry ustawia się więcej żołnierzy, czekających na feralny rozkaz do ataku. Wkrótce wody poczerwienieją od krwi poległych, lecz nadal mamy wybór. Możemy przyjąć pozycję wyczekującą i zachować siły przed nieuchronnym natarciem albo przeprowadzić decydujące uderzenie, które uczyni ich bezradnymi, zanim zdołają wymyślić odpowiedź. Decyzja może odmienić los całego narodu."
ATM_nuclear_winter_desc: "Ostatnie dziesięciolecia zmieniły Niemcy w nieprzejednanego terrorystę klimatycznego, całkowicie przekonanego o słuszności antyatomowej polityki Energiewende. Pragną narzucić wolę całemu światu, poczynając od buntowniczego sąsiada - Polski. Kto raz spróbuje kolonializmu, często nabiera na niego smaku, a berlińscy biurokraci są prawdziwymi koneserami. Skoro raz trzymali nas w garści, teraz znacznie trudniej im odpuścić. Możemy dalej płaszczyć się jak ich małe marionetki albo wreszcie potwierdzić niezależność. Bierne czekanie nic nam nie da. Aby naprawdę pokazać determinację, musimy działać. Niemcy nigdy nie nauczą się po nas nie deptać, dopóki nie zakosztują własnego lekarstwa. Na szczęście mamy niespodziankę idealną na tę okazję."
ATM_western_crusade_desc: "Niemcy posłuchają wyłącznie argumentów siły. Sądzą, że mogą nas zastraszyć, lecz tym razem odpowiemy. Aby raz na zawsze zniszczyć imperialistyczne ambicje Czarnego Orła, musimy podciąć mu skrzydła, aby już nigdy nie wzbił się w powietrze. Wspólnie z francuskimi sojusznikami nie mamy wyboru i musimy przeprowadzić dwukierunkową ofensywę, uderzając na Germanię ze wschodu i zachodu. Zaatakujemy pierwsi, przejdziemy przez Odrę aż do Łaby, podczas gdy francuskie kolumny ruszą ku Renowi. W połączeniu z naszym małym \"prezentem\" powinno to w zupełności wystarczyć do całkowitego obalenia wrogiego rządu i wiecznego uwolnienia nas oraz Europy spod tyranii Berlina. Na ich gruzach odbudujemy kontynent, silniejszy niż kiedykolwiek i mocno osadzony pod naszym prawowitym przywództwem. Nadchodzi koniec epoki."
ATM_what_berlin_desc: "Nadszedł dzień sądu. Nie możemy dłużej tolerować bezkarności Niemiec. Nawet wobec nieuchronności naszego triumfu odmawiają ustąpienia choćby o centymetr. Gardzą nami. Sądzą, że nie mamy odwagi. Wolą pozwolić spłonąć całemu krajowi, niż dożyć chwili, w której przyćmi ich silna, zjednoczona Polska. Skoro tego pragną, niech tak będzie. Odetniemy głowę węża, zanim Niemcy zrozumieją, co się wydarzyło. Pod osłoną nocy grupa najbardziej lojalnych żołnierzy przeniknie głęboko na terytorium wroga. Misja będzie prosta: dotrzeć z ładunkiem do Berlina, a gdy zbierze się Bundestag, zdetonować głowicę w jego pobliżu i natychmiast zakończyć istnienie całego niemieckiego kierownictwa. Pragnęliśmy pokoju, lecz aby go osiągnąć, Berlin musi dostąpić oczyszczenia ogniem atomowym."
ATM_and_we_are_ready_desc: "Granica między słuszną samoobroną a godnymi potępienia działaniami ofensywnymi jest cienka, lecz nawet wielokrotnie prowokowani odmawiamy jej przekroczenia. Niemcy nas sprawdzają. Chcą, abyśmy zaatakowali i potwierdzili nieuzasadnione obawy społeczności międzynarodowej wobec naszego ruchu. Pod żadnym pozorem dobrowolnie nie wpadniemy w pułapkę. Wiedzą, że przegrywają. Działają z desperacji. Z każdym dniem stajemy się silniejsi, podczas gdy Energiewende wije się w śmiertelnych konwulsjach. Wkrótce nie będą w stanie nam zagrozić i zmienią się w smutne kadłubowe państewko, dla którego dawne ambicje hegemoniczne pozostaną tylko nostalgią. Układ sił na świecie ulega przemianie, a my wyrastamy na najważniejszych obrońców środowiska całej planety, zwiastunów nowej, zrównoważonej epoki. Musimy tylko przetrwać ostatnią burzę."
ATM_watchers_on_the_oder_desc: "Konfrontacja jest nieunikniona, lecz dopilnujemy, by odbyła się wyłącznie na naszych warunkach. Zachodni sąsiedzi rwą się do walki, ale zmusimy ich do uległości bez oddania choćby jednego strzału. Skoro nie potrafią się zachować, wspólnie z sojusznikami ze Wspólnoty Europejskiej wprowadzimy całkowite embargo na wszystkie niemieckie produkty i odetniemy ich od świata. Mimo to musimy być gotowi do wojny. Odwieczny wróg nie pozwoli się zagłodzić bez walki, dlatego musimy zmobilizować cały naród i zwiększyć gotowość bojową na zachodniej flance przed nadchodzącym szturmem. Będziemy chronić Odrę ze wszystkich sił, aby żaden Niemiec nie przedostał się na nasze ziemie. Berlin pozna znaczenie głodu, aż wreszcie przyczołga się do stołu negocjacyjnego i zacznie błagać o litość."
ATM_call_berlin_desc: "Dostatecznie ich zmiękczyliśmy, a teraz pora zmusić Niemców do zapłaty. Nasza lista żądań jest długa i odzwierciedla liczne urazy powstałe przez dziesięciolecia ingerowania w naszą suwerenność. Można wręcz powiedzieć, że spełnienie ultimatum bez trwawego podważenia międzynarodowej pozycji oraz gospodarki Berlina jest niemal niemożliwe. Taki właśnie jest cel - sparaliżować ich na tyle, by nigdy więcej nam nie zagrozili. Kanclerz może kopać i krzyczeć, narzekając na surowość żądań, ale jeśli zachował choćby odrobinę instynktu samozachowawczego, i tak je przyjmie. Jego naród jest samotny, cierpi w izolacji i za wszelką cenę woła o ulgę. Oczywiście gdy rodacy dowiedzą się o ciężarze, który spadnie na nich za działania rządu, ulice Niemiec pogrążą się w chaosie. To jednak nie jest nasz problem. Dla nas będzie to jedynie widok triumfu."


##Events##
atom_cw.1.t: "Lokalne Ocieplenie"
atom_cw.1.desc: "- Halina, cho no! Szefu zaraz zacznie przemówienie.\n - Jakby jego przemówienia były takie ciekawe...\n- Jakby było coś innego do oglądania... - odgryzł się Robert - Przestań narzekać!\n - Drodzy górnicy i wszyscy wspierający sprawę węglową - zaczął Ziemkiewicz, ani trochę nie przejmując się kłótnią małżeństwa - Ostatnie lata były trudne dla nas wszystkich. Czeka nas jednak świetlana przyszłość napędzana węglem. Zwłaszcza gdy zlikwidujemy wszystkich zagranicznych agentów, takich jak atomowi terroryści pod wodzą *zzz*.\nExposé Ziemkiewicza - podobnie jak kłótnię Roberta z Haliną - przerwały zakłócenia.\n- Co jest, do cholery? - Mąż Haliny był pewien, że Bractwo zawsze zapewnia sygnał najwyższej jakości podczas przemówień Starszego.\nZdziwienie Roberta wzrosło jeszcze bardziej, gdy na ekranie telewizora pojawiły się trzy tajemnicze sylwetki. Kiedy transmisja się ustabilizowała, małżeństwo i wszyscy inni poddani Bractwa oglądający obowiązkowe przemówienie ujrzeli trzech mężczyzn siedzących przed zabytkowym biurkiem. Mieli wojskowe kurtki oraz czarne kominiarki. Obok ustawiono czarną flagę z symbolem atomu.\n - Przerwaliśmy tę transmisję, aby przekazać ważną wiadomość wszystkim Polakom. Bractwo niszczy nasz kraj. Kłamie o rzekomym postępie. Brak smogu? Po prostu zaczerpnijcie powietrza na zewnątrz. Ich organizację zbudowano na kłamstwach i mogę to udowodnić. - Mężczyzna pośrodku zdjął maskę, odsłaniając twarz człowieka, który nie miał prawa żyć - Jakuba Wiecha. - Zgadza się, Panie i Panowie. Żyję. Wzywam wszystkich prześladowanych przez Bractwo oraz Polaków pragnących walczyć o lepszą przyszłość, aby powstali przeciw tyranii Ziemkiewicza.\n Transmisja dobiegła końca, a widzom w domach pozostały tylko zakłócenia i pojedynczy napis: \"BRAK SYGNAŁU\"."
atom_cw.1.a: "Nieboszczyk przemówił!"

atom_cw.2.t: "Czarna Bestia"
atom_cw.2.desc: "(Dzień 0 operacji \"Czarna Bestia\")\n\n(4:30) Zespół sabotażowy zajmuje pozycje.\n(5:30) Ciężarówka z zaopatrzeniem dociera do punktu Alfa. Zespół sabotażowy obezwładnia personel Bractwa i dokonuje egzekucji.\n(6:30) Zespół sabotażowy, ubrany w zdobyte wcześniej mundury Bractwa, wjeżdża ciężarówką wyładowaną C4 do magazynu zaopatrzenia elektrowni.\n(6:35) Agentka \"Judyta\", szantażem zmuszona do pracy dla nas trzy miesiące temu, przeprowadza kontrolę ciężarówki.\n(6:40) Parkujemy ciężarówkę i opuszczamy obiekt.\n(7:00) Wycofujemy się na bezpieczną odległość od strefy wybuchu i detonujemy ładunek.\n(7:45) Docieramy na miejsce spotkania z ekipą propagandową oraz \"Judytą\", aby przekazać im zapłatę.\n\nUwagi końcowe: misja przebiegła dokładnie według planu i zakończyła się całkowitym sukcesem. Reakcja łańcuchowa wywołana eksplozją paliwa w magazynie zaopatrzenia objęła ogniem znaczną część elektrowni. Spodziewamy się licznych przerw w sieci energetycznej Bractwa i zdecydowanego spadku ich morale. Nawet jeśli Bractwo spróbuje ukryć atak na Bełchatów, nagrania ekipy propagandowej zagwarantują, że szersza opinia publiczna pozna prawdę."
atom_cw.2.a: "Nie wiedziałem że to miejsce może jeszcze bardziej dymić"

atom_cw.3.t: "Powstanie Łódzkie"
atom_cw.3.desc: "Pół roku temu nadgorliwy węglowy Paladyn rozstrzelał mojego ojca za rzekomą działalność wywrotową. Tak naprawdę tata bezlitośnie ogrywał go w karty. Wywołało to całkiem duże zamieszanie w okolicy. Chyba właśnie dlatego agent wiechowców mnie znalazł i uznał, że może zaproponować mi szansę na dokonanie zemsty. Raczej nikogo nie zdziwi, że zgodziłem się do nich dołączyć.\nTeraz jestem jednym z Atomowych Krzyżowców. Czekam, by pomścić ojca, i przygotowuję broń. Cholernie się boję. Tak długo czekałem na tę okazję, że teraz nie mogę stchórzyć. Nigdy nie pozwolono mi ćwiczyć z prawdziwą bronią. Amunicja służyła wyłącznie do straszenia nowych adeptów, a strzały szybko zwróciłyby niepożądaną uwagę. Zajmowałem się głównie przemycaniem zapasów, śledzeniem patroli Paladynów i malowaniem graffiti przeciw Bractwu. Nikt nie przygotował mnie do szturmu na Komendę Miejską Policji. Plusem jest to, że siły Bractwa rozciągnięto i nie mogą obsadzić wszystkich garnizonów wystarczającą liczbą ludzi do skutecznej obrony. Plan polega na zabiciu wszystkich rycerzy i liczeniu, że miejscowa policja przyjdzie nam z pomocą.\n15:55. Zostało pięć minut. Pięć minut, a jako szczęśliwiec przeleję pierwszą krew. Po raz ostatni spoglądam na dowódcę, który zwerbował mnie wiele miesięcy temu. Zakrywa dwa ślady po kulach hełmem kevlarowym i kieruje broń w stronę strażników.\nPada strzał."
atom_cw.3.a: "Balujmy jak w 1905!"

atom_cw.4.t: "Skrytki kraju \"Normalności\"" 
atom_cw.4.desc: "Ile czasu minęło? Dwadzieścia? Może trzydzieści minut? Nie miało to większego znaczenia, lecz z każdą kolejną Jan coraz bardziej się denerwował. Miał spotkać się z Kazikiem o piętnastej, ale tamten nadal się nie pojawił. Kiedy ten już zamierzał wyjść i uznać operację za nieudaną, wspólnik wszedł przez drzwi opuszczonej kamienicy.\n\n- Patrzcie, kto to się zjawił! Jeszcze kilka minut i umieściłbym twoją twarz na kartonach mleka. Co cię zatrzymało?\n\n- No, przepraszam. Z jakiegoś powodu kilku osiłków Bractwa zrobiło awanturę. Przeszukali mnie, sprawdzili dokumenty i zadawali mnóstwo pytań. Oczywiście bardzo wyraźnie pokazałem im, jakim jestem dobrym, praworządnym obywatelem. Zacytowałem nawet jedną z tych przeklętych bzdur napisanych przez Ziemkiewicza.\n\n- Dobra, nieważne. Zachowaj bajki na później. Ja poszedłem skrótem. Wygląda na to, że nie musiałem się tak spieszyć. Chodźmy po zapasy.\n\nDwaj Krzyżowcy weszli do salonu niewielkiego mieszkania. Kazik badał podłogę w poszukiwaniu pozostawionego tam znaku - jednej lekko poluzowanej deski obok rozbitego telewizora kineskopowego. Nie było trudno jej znaleźć i wkrótce odsłonili wielką nagrodę. Dwa prymitywne domowej roboty pistolety maszynowe wyglądające jak rodem wyjęte z Powstania Warszawskiego oraz skrzynkę nabojów wystarczającą może na trzy magazynki dla każdego. Kazik podniósł jeden i zaczął mu się przyglądać.\n\n- Ładne. Powinny mieć całkiem niezłego kopa. Zamek mógłby być jednak solidniejszy.\n\n- Nie powinny być lepiej ukryte? Jak dla mnie to dość oczywiste miejsce.\n\n- Tak, łatwo je znaleźć, jeśli wiesz, że tu są. Większość Paladynów nadaje się zresztą tylko do palenia książek. Nie jest to najbystrzejsza zbieranina. Człowiek przemycający je dla nas też najwyraźniej o tym wie. Dobra, schowaj broń gdzieś pod kurtką. Uderzmy tych pylarzy tam, gdzie zaboli."
atom_cw.4.a: "Pokażmy Warszawiakom jak się robi powstania!"

atom_cw.6.t: "Serca z kamienia"
atom_cw.6.desc: "Gadomski jak zawsze siedział na krześle z nosem w raportach ekonomicznych. Słyszał coś o jakimś powstaniu, ale to nie był jego problem. Miejscowi Paladyni powinni sobie poradzić. W najgorszym razie, gdy zrobi się gorąco, wkroczy Rzymkowski. Nic nie powinno już powstrzymać Bractwa.\nDzisiaj po rozdzieleniu zasobów z kopalń miał trochę wolnego czasu, więc postanowił pracować nad kilkoma planami reform. Planami reform, których twardogłowi Bractwa nigdy nie pozwoliliby mu wdrożyć.\nCicho westchnął.\n\nGdy pracował nad ulubionym projektem, ktoś wsunął kopertę pod drzwi gabinetu.\nGadomski ją podniósł. Najwyraźniej wysłał ją \"przyszły przyjaciel\".\n - Jakie pretensjonalne - powiedział głośno, zdumiony tajemniczym listem.\nPospiesznie otworzył drzwi, aby sprawdzić, czy zdoła dostrzec wysłannika odpowiedzialnego za przesyłkę, lecz korytarz był pusty.\nNie widząc innego wyjścia, Paladyn otworzył kopertę, by zaspokoić swoją ciekawość.\n\n \"Szanowny Panie Gadomski,\nNiewielkie zamieszki, o których z pewnością Pan słyszał, w nadchodzących dniach zmienią się w ogromną rebelię. Bractwo nie ma szans. Dlatego z przyjemnością złożę Panu ofertę: pragnę, aby przekazał nam Pan wszystkie szczegóły dotyczące wojska Bractwa, przyspieszając nieuniknione. Chcielibyśmy również otrzymać jak najwięcej informacji o głównym przedmiocie Pańskiego zainteresowania - stanie gospodarki. W zamian odpowiednio złagodzimy Pański wyrok, gdy nadejdzie dzień rozliczenia. Aby sam mógł Pan przekonać się, że jesteśmy tak poważnym zagrożeniem, jak twierdzimy, dajemy tydzień na przemyślenie oferty. Po upływie tego czasu powinien Pan umieścić interesujące nas akta na półce 4D w szafie 57, w pokoju 119 archiwum bełchatowskiego. Wierzę, że podejmie Pan właściwą decyzję.\n\nPodpisano,\nNie tak martwy, jak kazano Panu wierzyć,\nJakub Wiech\"\n\n List wypadł Gadomskiemu z ręki. Czy był prawdziwy? Może to jedna z intryg Janeckiego? Próba lojalności? Informacje o powstaniach... są zbyt świeże.\nTakie myśli krążyły po jego głowie. Był już za stary na podobne rzeczy. Ponownie przeczytał list i rozważył możliwości.\n Założę, że jest prawdziwy - pomyślał. - Świeżość informacji o buntownikach, ujawnienie, że Wiech nadal żyje. Poczekam tydzień. Jeśli ich postępy wojskowe okażą się obiecujące... Byłby to jednak akt zdrady. Walka ze wszystkim, nad czym dotąd pracował. A przekazane informacje mogły przechylić szalę na korzyść buntowników.\nBez względu na ostateczną decyzję był pewien, że musi zniszczyć list. Zapisał informacje na temat miejsca zrzutu szyfrem, po czym włożył list do kominka i podpalił. Stosowne zakończenie wiadomości wysłanej przez Wiecha do ministra Bractwa."
atom_cw.6.a: "'To może być ostatnia rzecz którą robię dla Bractwa'"

atom_reg.1.t: "Palimy czarne złoto z ziomkami"
atom_reg.1.desc: "Gdy mijaliśmy kolejny las, tym razem za wsią Studzianki pod Bełchatowem, powitał nas widok niemal apokaliptyczny. Spłonęło tu prawie każde drzewo, podobnie jak w znacznej części innych lasów województwa łódzkiego. Nie mieści mi się w głowie, do czego zmierzało Bractwo Węgla podczas swych despotycznych, antyludzkich rządów ani co jeszcze planowałoby uczynić, gdyby nie my.\n\nWidzieliśmy już wiele - miasta, polany, lasy i nabrzeża, wszystko zniszczone przez ludzi, którzy tak wiele mówili o postępie. Trafniej byłoby jednak nazwać to regresem. Około trzynastej, po długiej podróży przez te spustoszone tereny, dotarliśmy do elektrowni Bełchatów, niedawno przejętej przez naszych ludzi. Już z odległości kilku kilometrów widać było nasze wielkie sztandary zwieszające się z najwyższych punktów konstrukcji elektrowni.\n\nObchód objął wszystkie kluczowe obiekty elektrowni, zabezpieczone przez naszych żołnierzy. Sprawdziliśmy, czy żołnierze Bractwa nie ukryli żadnych przykrych pułapek, które mogłyby nas skrzywdzić. Po inspekcji udaliśmy się na parking elektrowni. Oprócz żołnierzy czekali tam nasi miejscowi urzędnicy, a także mieszkańcy pobliskich wsi i odleglejszych miast, takich jak Łódź, Bełchatów, Piotrków Trybunalski czy Skierniewice. Wszyscy przybyli mieli dość straszliwych rządów Bractwa Węgla i z ulgą powitali wyzwolenie przez żołnierzy Krucjaty.\n\nW drodze tutaj, jako adiutant naszego przywódcy, miałem okazję z nim porozmawiać. Zdawał sobie sprawę z drogi, którą dotąd przebył, ale także z tego, czego wciąż musi dokonać. Pomimo pokonania tyranów z Bractwa nasza ojczyzna nadal nie była zjednoczona. Wciąż pozostawała podzielona, a w tej anarchii mogli kryć się watażkowie jeszcze gorsi od Rafała Ziemkiewicza. Był wyraźnie spięty, lecz widzę w nim ogromną determinację. Nikt z nas nie spodziewał się, że znajdzie się teraz w takiej sytuacji. Pod koniec inspekcji Wiech wygłosił przemówienie. Mówił o pokonaniu Bractwa Węgla i powstrzymaniu jego potwornych planów, które prowadziły do zniszczenia ekosystemu, a w konsekwencji Polski. Mówił również o wyzwoleniu Polski, nazywając je jednym z najważniejszych zadań, przed którymi stoi Atomowa Krucjata - zaraz po obietnicy przyniesienia Atomu i uzdrowienia środowiska."
atom_reg.1.a: "Widok z piekła rodem..."

atom_reg.2.t: "Grafomański Zgred"
atom_reg.2.desc: "- Cóż, poszło gorzej, niż się spodziewałem - pomyślał Ziemkiewicz.\n - Spokój! Spokój! - krzyczała sędzia Anna Maria Wesołowska, gdy atomowe hieny oszalały na widok byłego Starszego wchodzącego do sali tronowej. Nie dość, że triumfowały, to jeszcze koniecznie musiały zachowywać się nieznośnie. Ziemkiewicz nie zwracał uwagi na sądowe formalności, dopóki prokurator nie wymówił jego nazwiska.\n - Obywatelu Rafale Ziemkiewiczu - Artur Łapa rozpoczął przemowę. - Został pan oskarżony o zbrodnie przeciwko ludzkości, destabilizację klimatu i prześladowanie opozycji wewnętrznej. Czy przyznaje się pan do winy?\n- Co za farsa - pomyślał Ziemkiewicz. - Żona jakiegoś śmiesznego korwinisty jako obrończyni i skompromitowany prawnik jako prokurator. To była ostatnia okazja, by świat usłyszał prawdę Bractwa.\n- Ludzkość? - zaczął. - Próbowałem ją uratować! Czy nie widzicie, że w Atomie nie ma przyszłości? Przecież niedaleko stąd dymi radioaktywny dowód na prawdziwość moich słów. Klimat? Czy wy wszyscy jesteście ślepi? Tej zimy wyraźnie padał śnieg, Wysoki Sądzie. Nie możecie być równie głupi jak ci atomowi wariaci!\n - Proszę się opanować, panie Ziemkiewicz - nakazała Wesołowska.\n - A ostatni zarzut jest jeszcze bardziej oburzający! - zignorował upomnienie sędzi. - Wysoki Sądzie, walczyliśmy jedynie z tymi terrorystami. To właśnie jest ta \"opozycja\", o której mówi prokurator? Mordercy cywilów pracujących w naszych elektrowniach? Mam nadzieję, że jasno wynika z tego, iż uważam się za całkowicie niewinnego.\n- Dobrze. Świadek Jakub Wiech, proszę podejść - sędzia Wesołowska wezwała Wielkiego Ekologa na miejsce dla świadków.\nSala sądowa wybuchła oklaskami.\n- Spokój! Spokój!\n- Wysoki Sądzie, jak zawsze chciałbym odeprzeć twierdzenia pana Ziemkiewicza - przedstawił dowody, które Starszy tak usilnie próbował przemilczeć. - Statystyki przedstawiane przez Bractwo próbowały obarczyć innych watażków winą za wzrost śmiertelności. Jak widzimy, nie tłumaczy to liczby zgonów w regionach daleko od frontu.\nZiemkiewicz próbował zachować spokój.\n - To zdjęcie przedstawia więźniów politycznych zamkniętych w obozach internowania, tuż przed zesłaniem do kopalń. Krzyżowcy wciąż próbują uratować jak najwięcej z nich. Mamy fotografie kilku osób, których zaginięcie zgłoszono. Wielu z nich to zwykli dziennikarze, nawet niezwiązani z naszą sprawą.\nZiemkiewicz zaczął nerwowo stukać palcami w stół.\n - Tutaj mamy niezależne międzynarodowe raporty o emisji CO2. A tutaj raport Łukasza Warzechy o rzekomo superwydajnej sieci energetycznej Bractwa.\n - Kłamstwa! Oszczerstwa!\n - Panie Ziemkiewicz!\nSkąd wzięli ten raport? Czy Warzecha zdradził swojego Starszego? Nie potrafił skupić się na dalszej części rozprawy. Wciąż myślał o tym, co mogło się wydarzyć. O przyszłości! O Postępie! Wszystko przepadło.\n - Niniejszym uznaję Rafała Ziemkiewicza za winnego wszystkich zarzutów - głos sędzi ponownie wyrwał Ziemkiewicza z rozmyślań. - A wyrok brzmi..."
atom_reg.2.a: "...dożywocie."
atom_reg.2.b: "...kara śmierci!"

atom_reg.3.t: "Rzeźnik Klimatu"
atom_reg.3.desc: "Rozpoczęło się rozliczanie starego Bractwa, a każdy jego członek, który miał w nim jakiekolwiek znaczenie, stanął przed sądem. Głowa węża, Ziemkiewicz, została odcięta. Największy szkodnik wciąż jednak pozostawał na wolności, a jeśli nie usunie się komórek rakowych, mogą dać przerzuty.\n\nGdy stało się oczywiste, że upadek Bełchatowa jest nieunikniony, Łukasz Warzecha zrozumiał, co się święci, i postanowił zrobić to, co było najlepsze dla niego. Gdy Krucjata się zbliżała, szybko opuścił Bełchatów i, mając przy sobie tylko kilka niezbędnych rzeczy, ukrył się w pobliskiej wsi Huta. Od tamtej pory minęło wiele dni, a walki już dawno ucichły. \"Ziemkiewicz się poddał\" - pomyślał, choć na miejscowej remizie nadal widział powiewające flagi, którym przysięgał wierność. \"Czy Ziemkiewicz dokonał niemożliwego?\", \"Przecież klęska wydawała się nieuchronna\". Wiedział jedno - jeśli Ziemkiewicz przeżył, Wartownik będzie musiał odkupić winę za tak pospieszną zdradę przywódcy.\n\nAby tego dokonać, udał się do stacji nadawczej w Piotrkowie, po drodze chwytając jakiegoś zagubionego ekologa. Budynek był pusty, ale zasilanie nadal działało, co stworzyło Warzesze doskonałą okazję. Szybko ustawił zakładnika na scenie. Światła, kamery, akcja. Ledwie zdołał wypowiedzieć jedno słowo, gdy zardzewiałe drzwi rozwarły się z hukiem, a Warzecha został otoczony przez oddział Krzyżowców. Nie wiedział, że właśnie dobrowolnie wszedł do paszczy lwa.\n\nZabrano go do najbliższego sądu, a przez całą drogę towarzyszył mu kamerzysta. Czekał tam Jakub Wiech, sam Wielki Ekolog, by uczestniczyć w procesie Paladyna. Publiczność zajęła miejsca, a sędzia wszedł na salę. Odczytywanie zarzutów wobec Warzechy zdawało się nie mieć końca, aż nagle oskarżony wstał, spojrzał Wiechowi w oczy i krzyknął: \"Precz z Atomem, niech żyje Czarne Złoto!\". Potem coś przegryzł i... osunął się na stół."
atom_reg.3.a: "Czy wszystkie procesy muszą kończyć się kapsułką z cyjankiem?"

atom_reg.4.t: "Proszę, zjedz warzywka"
atom_reg.4.desc: "Każdy, kto sądził, że Bractwo odejdzie po cichu, jest naiwnym głupcem. Łukasz Warzecha może nie żyć, ale jego wpływy przetrwały. Wśród ludności nadal istnieje opozycja, zwłaszcza w okolicach Bełchatowa, gdzie indoktrynacja zapuściła głębokie korzenie. Wielu członków uznanych za zbyt mało znaczących, by ich sądzić lub skazać, stworzyło coś w rodzaju opozycji wobec rządów Wiecha. Zakładali liczne organizacje na granicy legalności i tworzyli komórki w całym dawnym województwie łódzkim, robiąc wszystko, co mogli, by zwrócić ludność przeciwko Atomowi.\n\nW tym samym czasie Jakub Wiech próbował organizować działania promujące jego program, polegający głównie na liberalizacji wielu pozostałych po dawnych rządach niedorzecznych przepisów. Jednym z nich była polityka \"zielonej kuchni\", która miała zachęcać ludzi do zdrowszego odżywiania. Nic dziwnego, że niedobitki Bractwa rozpoczęły kampanię przeciwko jedzeniu jakiejkolwiek zieleniny, próbując przedstawić warzywa jako coś słabego i lewackiego. Najważniejszy był jednak program Wiecha dotyczący węgla - tego samego, który Bractwo uważało za święty skarb. W głęboko zindoktrynowanym społeczeństwie jakiekolwiek szkalowanie go oczywiście nie wchodziło w grę. Jedno niewłaściwe słowo, a ludzie wyrażali niezadowolenie na ulicach. \n\nNa razie opozycja postanowiła poprzestać na okazjonalnych, zażartych wymianach zdań w prasie lub na ulotkach oraz na racjonalnej - w jej mniemaniu - argumentacji: ograniczenie zużycia węgla może oznaczać spadek produkcji, zwłaszcza jeśli przeprowadzi się je zbyt pospiesznie."
atom_reg.4.a: "Nie mogliby się uspokoić i... spróbować szpinaku dla odmiany?"

atom_reg.5.t: "Małpa w kamaszach"
atom_reg.5.desc: "- Czy świadek ma coś do dodania? - Sędzia główny prowadzący rozprawę spoglądał na jednego z oficerów, którzy zdecydowali się zeznawać przeciwko ich naczelnemu dowódcy, Tomaszowi Rzymkowskiemu.\n- Nie, Wysoki Sądzie. To wszystko. Proszę tylko o to, żeby spotkał go należyty los.\nOskarżony siedział z naburmuszoną twarzą jak gdyby cała ta sytuacja była obraźliwa wobec jego statusu. Przy każdych zeznaniach rzucał głośnymi uszczypliwymi uwagami wobec świadków, a w szczególności lubował się w rozprawianiu o upodobaniach seksualnych ich rodzicielek. Albo po prostu tupał nóżką robiąc szum prawie tak ogromny jak własne ego.\n- Wy jesteście niepoważni! Wy i wasze marionetki! Powinienem was wszystkich wysłać na linię frontu a nie robić z was oficerów! Jakim prawem owca ma w ogóle czelność osądzać lwa? Dowodziłem najpotężniejszą armią jaką widziała polska ziemia, i jako Naczelny Paladyn domagam się traktowania mnie z godnością odpowiednią mojej randze! - unosił się wojskowy. Prokurator spojrzał się na byłego paladyna jak wygłodniały wilk na ofiarę.\n\n- Pacyfikacja Tomaszowa Mazowieckiego. Pacyfikacja Piotrkowa Trybunalskiego. Bombardowanie dzielnic cywilnych w Łodzi, Skierniewicach i Sieradzu. Przymusowa likwidacja komun na terenach powiatów skierniewickiego, łowickiego, rawskiego i brzezińskiego. Zbrodnia w Drzewicy, gdzie na pański rozkaz rozstrzelano 45 oficerów pochodzenia żydowskiego. Całkowita dewastacja Załęczańskiego Parku Krajobrazowego gdzie żołnierze z miotaczami ognia wypalali hektar po hektarze lasu. Rozkaz numer 33 o traktowaniu jeńców wojennych. Obozy pracy nadzorowane przez pańskich żołnierzy. Ma Pan na sumieniu setki tysięcy ofiar. Mam wymieniać dalej? Bo lista ciągnie się jeszcze dalej, a wiele masowych mogił jest odkrywanych z każdym kolejnym dniem.\n\nRzymkowski zamilkł. Przynajmniej na chwilę sąd mógł procedować dalej, przechodząc do wysłuchiwania zeznań świadków cywilnych którzy widzieli na własne oczy zbrodnie popełniane przez oddziały Bractwa Wegla. Rozprawa toczyła się kolejne godziny, aż w końcu sędzia spytał się głównego winnego:\n- Czy oskarżony ma coś na swoją obronę?\n- Farsa! - odburknął Rzymkowski\n- Przepraszam?\n- Farsa. Chcecie sądu? Sądźcie mnie wedle moich własnych standardów! Jeśli macie się mnie pozbyć to rozstrzelajcie mnie i miejcie to z głowy, a nie udajecie że zależy wam na demokratycznych standardach i prawach człowieka! \nPo tym emocjonalnym wybuchu widać było że przez głowę sędziego przemknęła myśl czy faktycznie nie przychylić się do tego wniosku. Musi umrzeć, to jedno jest pewnikiem. Póki co jednak zadecydował o przerwie po której zostanie ogłoszony wyrok. A więc... jak to zrobimy? Pluton egzekucyjny czy szubienica?"
atom_reg.5.a: "Spełnijmy jego ostatnie życzenie!"
atom_reg.5.b: "A na drzewach zamiast liści..."

atom_reg.6.t: "Tutaj kiedyś była fabryka"
atom_reg.6.desc: "Marcin Szymański pracował w jednym z zakładów wojskowych pod Zgierzem. Był tam zatrudniony jeszcze za rządów Konsorcjum. Kiedy jednak Bractwo przejęło całą prowincję, zakład znacząco rozbudowano. Zarówno warunki, jak i rygor pracy stały się o wiele surowsze, a grafik wydłużono, przez co obciążenie wzrosło ponad dwukrotnie. Mimo to wynagrodzenie pozwalało na bardzo wygodne życie, zwłaszcza jak na standardy upadłego państwa. Samo Bractwo wspierało pracowników zakładów wojskowych i ich rodziny, zapewniając najlepsze dostępne mieszkania, edukację, dostęp do opieki zdrowotnej oraz możliwość bardzo długich urlopów finansowanych przez państwo.\n\nIstniały obawy, że ostateczne zwycięstwo Atomowej Krucjaty i jej destrukcyjna polityka zniweczą dorobek Bractwa. Obawy te okazały się uzasadnione. Około tygodnia po ostatecznym zwycięstwie Krucjaty i ustanowieniu lokalnej administracji rozpoczęły się zwolnienia. Dotknęły także zakład Szymańskiego. Wielu jego kolegów straciło pracę. Bał się, że spotka go ten sam los, zwłaszcza że rząd planował odebrać przywileje pracownikom zakładów wojskowych i ich rodzinom. Po raz kolejny nie sposób było odmówić mu racji.\n\nPewnego słonecznego niedzielnego poranka Szymański otrzymał od pracodawcy list z ważnymi i bardzo złymi wiadomościami. Okazało się, że również padł ofiarą masowych zwolnień w fabrykach zbrojeniowych, które w państwie mniej zmilitaryzowanym niż Bractwo nie potrzebowały aż tylu robotników. Nie wszystko jednak było stracone, ponieważ w ramach rekompensaty państwo oferowało pomoc w znalezieniu nowego zatrudnienia i tymczasowe wsparcie finansowe każdemu, kto zgłosił się do miejscowego urzędu. \n\nNastępnego dnia poszedł do urzędu miasta, gdzie nietrudno było znaleźć właściwe miejsce, bo kolejki ciągnęły się w nieskończoność. Po długim oczekiwaniu, gdy wreszcie przyszła jego kolej, okazało się, że jedyną dostępną ofertą jest pomoc przy hodowli krów gdzieś pod Ozorkowem. Płacono lepiej niż przy składaniu karabinów, ale o pracy na roli nie miał pojęcia. Było daleko od domu, droga była niebezpieczna, a on nie miał samochodu, lecz dla rodziny człowiek zrobi wszystko. Wreszcie dzięki temu programowi jego syn będzie mógł chodzić do prawdziwej szkoły. Może wcale nie jest tak źle. To jak pierwsze promienie słońca przebijające się przez ciemne chmury po naprawdę długiej burzy."
atom_reg.6.a: "Szczęście w nieszczęściu"

atom_reg.7.t: "Wielka Spluwa - Archibald Dorn"
atom_reg.7.desc: " - Żołnierzu, jesteście bez munduru! Nie macie żadnego?! - sierżant Dorn urwał. Owszem, wiechowcy dopiero co przeobrazili się z przypadkowej zbieraniny terrorystów w coś przypominającego prawdziwą armię, ale sierżant nie chciał wyjść źle, podważając własne słowa. - Wracajcie do kwatermistrza po oznaczenia frakcyjne! Chyba że chcecie dostać kulkę od swoich!\nPoczątkowo Archibald Dorn nie był pewien, co sądzić o swoim \"przeniesieniu\". Przez kilka lat był lojalnym żołnierzem Bractwa i dorobił się stopnia sierżanta. Niektórzy mogliby nazwać przejście na stronę Krzyżowców zdradą, ale Dorn nigdy tak na to nie patrzył. Po prostu wykonywał swoją pracę, a poza tym...\n- Reszta ma robić pompki, dopóki ten kretyn nie wróci!\nMożna powiedzieć, że nawet po upadku Bractwa nadal dręczył wiechowców."
atom_reg.7.a: "Emmm..."

atom_reg_a.7.t: "Wielka Spluwa - Krzysztof Jasak"
atom_reg_a.7.desc: "- Coś poszło potwornie nie tak - pomyślał kapitan Krzysztof Jasak. - Wszystkie analizy wskazywały, że zwycięstwo jest nam pisane.\n Odpowiadał za wywiad i wiedział, że wiechowcy to tylko farsa. Kozioł ofiarny. Chochoł. Oczywiście Jakub Wiech istniał, ale nigdy nie kierował organizacją wojskową. Od miesiąca Jasak niemal odchodził od zmysłów. Bractwo Węgla pokonało innych łódzkich watażków o porównywalnej sile, by potem ulec buntownikom, którzy nie powinni nawet istnieć. To absurd! Czy był to przewrót Paladynów, który wymknął się spod kontroli? Intryga mająca usunąć Ziemkiewicza? Wszystko byłoby prostsze, gdyby zginął wraz ze swymi braćmi na polu bitwy, wciąż widząc w życiu jakiś cel.\nW szufladzie leżał list od nowego reżimu z zaproszeniem, by pomógł atomowej sprawie zbudować sieć wywiadowczą. Nie żeby miał wybór. Agenci Wiecha śledzili każdy jego krok. Rozpaczliwie pragnęli jego tajemnic. Alternatywą była śmierć, czy to z rąk służb, czy własnych. A Jasak nadal musiał utrzymać rodzinę. Wyglądało na to, że znalazł się w pułapce.\n- Muszę pozostać realistą.\nWiedział, że pracując w wywiadzie Krucjaty, może spróbować znaleźć odpowiedzi na pytanie, co wydarzyło się po ogłoszeniu buntu przez Wiecha. I nawiązać kontakt z potencjalnymi kontrrewolucjonistami. Cała ta sytuacja mogła być gambitem Gadomskiego, którego dotąd po prostu nie zdołał dostrzec."
atom_reg_a.7.a: "Hmm...\n...wybory, wybory..."

atom_reg_b.7.t: "Wielka Spluwa - Mikołaj Mrożek"
atom_reg_b.7.desc: "- A to za rozprawienie się z tym świrem z dawnego Bractwa - Kamil Staszek podał koledze z drużyny kolejną szklankę piwa. - Uratowałeś mi życie, stary. I nawet się nie zawahałeś. Czy ci goście nie byli przypadkiem twoimi...\n - Braćmi? - Mikołaj Mrożek dokończył za kolegę z chłodną ironią. - Nigdy nie lubiłem tych pojebów. Służyłem pod nimi, bo zgarnęli mnie z ulicy, dali zardzewiały karabinek i wysłali na front. Zawsze nienawidziłem tych zadufanych skurwysynów za to, co zrobili z moim Bełchatowem.\nStaszek wydawał się w porządku i szczerze wdzięczny za ratunek, lecz Mrożek uznał, że to nie pora wyjawiać, iż nie po raz pierwszy zabił członka Bractwa. Pierwszy raz zdarzył się, gdy Atomowi Krzyżowcy osaczyli jego i jego drużynę w jednym z bełchatowskich domów. Ich dowódca, przeklęty fanatyk, uparł się utrzymać tę beznadziejną pozycję. Gdy Mrożek dostał okazję, zastrzelił dowódcę i poddał się nadchodzącym wiechowcom. Jego koledzy z drużyny nie mieli innego wyjścia i również złożyli broń. Według własnych rachunków uratował tego dnia pięć istnień. Pięć wypranych z mózgu dronów, które za jego czyn uważały go za zdrajcę. Kto wie, może któryś z nich wbiłby mu nóż między żebra, gdyby pozostał w Bełchatowie. Prześladowany tą myślą przeniósł się do Kutna i został tam jednym z Krzyżowców."
atom_reg_b.7.a: "Nasze miasta mają nowych strażników."

atom_reg.8.t: "Zagubiony Defetysta"
atom_reg.8.desc: "Przez całą rozprawę Gadomski siedział ze spuszczoną głowę, rozdarty między lojalnością wobec Bractwa a Zdrowym Rozsądkiem. Co za ironia! To właśnie Zdrowy Rozsądek dał początek Bractwu. Na początku była to zupełnie inna organizacja. A może tylko tak sobie wmawiał, szukając jakiegokolwiek usprawiedliwienia. Nie, tego był pewien. Bractwo było ruchem ostrożności. Ostrożności wobec gwałtownej dekarbonizacji, energii jądrowej, obcych wpływów! Gdyby tylko tamci fanatycy nie krępowali jego wysiłków. Tak! Właśnie tak było!\nDlatego ich zdradził.\n\nZapytany o swój udział w Bractwie, Gadomski podzielił się przemyśleniami na temat węglowych fanatyków i zdawał się okazywać autentyczną skruchę. Przyznał również, że w ostatnich miesiącach istnienia Bractwa przekazywał Atomowym Krzyżowcom informacje wywiadowcze, w tym kopię kompromitującego raportu Warzechy. Jego adwokat natychmiast przedstawił materialne dowody potwierdzające te słowa. Dla zwiększenia wiarygodności Wiecha wezwano na świadka.\nGadomski cieszył się, że nie było tam z nim żadnego innego członka rady. Wiedział, że postąpił słusznie, ale mimo to myśl o zobaczeniu dawnych kolegów... dawnych Braci, wywoływała w nim niepokój.\n\n - Witoldzie Gadomski, sąd uznał pana za winnego. W pańskiej sprawie istnieją jednak liczne okoliczności łagodzące - oznajmiła sędzia Wesołowska. - Aby mieć pewność, że nie będzie pan próbował szerzyć wywrotowej agendy karbonistycznej, sąd skazuje pana na rok pobytu w obozie reedukacyjnym. Odprowadzić oskarżonego.\n - Nieźle - pomyślał Gadomski, gdy wyprowadzano go z sali. - W innych okolicznościach mógł dostać conajmniej 20 lat.\n\nPóźniej tego dnia, gdy Gadomski marniał w celi aresztu, czekając na transport, odwiedził go sam Wiech. Ekolog przedstawił mu tajemniczą propozycję, tak niedorzeczną, że Gadomski uznał ją za żart.\n\n - Czy byłbyś zainteresowany skróceniem wyroku do trzech miesięcy, Witoldzie?"
atom_reg.8.a: "Co ten Wiech knuje?"

atom_reg.9.t: "To nie jest zbrodnia"
atom_reg.9.desc: "- Właśnie tutaj, Wielki Ekologu.\nStrażnik otworzył drzwi celi, by Jakub Wiech mógł wejść. Zobaczył byłego ministra gospodarki Bractwa siedzącego za biurkiem w przestronnym pomieszczeniu, w którym go osadzono. Oprócz biurka, krzesła i łóżka celę wyposażono w duży regał, szafę na dokumenty, komputer i drukarkę.\n- Dziękuję. Możecie nas teraz zostawić - polecił Wiech strażnikowi.\n- Wielki Ekolog? Naprawdę? - zapytał drwiąco Gadomski. - Kim ty jesteś, przywódcą jakiegoś kultu?\n- Ludzie, których dręczyliście, potrzebowali kogoś, w kogo mogliby uwierzyć. Brutalna prawda jest taka, że pomogłeś stworzyć podłoże dla takiego fanatyzmu. Dlatego mam nadzieję, że zechcesz odkupić winy.\nZamiast odpowiedzieć, Gadomski odwrócił się na krześle w stronę Wiecha i podał mu świeżo ukończony raport. Wiech pobieżnie przeczytał jego pracę, głęboko rozważając przedstawione punkty.\n- Imponujące, ile można osiągnąć w trzy miesiące - Wiech pochwalił wysiłki ministra.\n- Prawdę mówiąc, myślałem o niektórych z tych spraw jeszcze wtedy, gdy sprawowałem urząd - przyznał skromnie Gadomski.\n- Niepokoi mnie jednak brak szczegółów i niekontrolowana prywatyzacja, która rozpocznie się po wdrożeniu twojego planu.\n- Po pierwsze, nie pamiętam wszystkich tajników gospodarki Bractwa. Po drugie, gdybym zdradził ci wszystko, co wiem, nie byłbym ci już potrzebny - Gadomski uśmiechnął się, próbując zdobyć możliwie największą przewagę ze swej niekorzystnej pozycji. - Prywatyzacja również jest konieczna. Wiele zakładów przemysłowych jest skrajnie nierentownych. Nie wspominając o tym, jak szkodzą twojemu świętemu środowisku. Budżet Bractwa był też niepokojąco niezrównoważony. Faktem pozostaje również, że pod względem posiadanego majątku Atomowej Krucjacie bliżej do Krucjaty Ludowej niż do Trzeciej Krucjaty. Potrzebujemy miejscowych przedsiębiorców i gromady nierozważnie odważnych zagranicznych inwestorów. Oraz kogoś, kto ma dość wiedzy, by w okresie przejściowym rozstrzygnąć, które aktywa należy sprzedać, a które zachować.\nGadomski znów uśmiechnął się przebiegle, rzucając \"Wielkiemu Ekologowi\" znaczące spojrzenie.\n\nWiech chciał jeszcze raz przemyśleć plan, zanim zawrze pakt z diabłem, ale zdał sobie sprawę, że tak naprawdę nie ma innego wyboru. Wyciągnął więc rękę.\n - Witamy w rządzie, Panie Gadomski."
atom_reg.9.a: "Ale znaj umiar, umiar znaj"

atom_reg.10.t: "Nieuchwytny Pajęczak"
atom_reg.10.desc: "Pająki są najgroźniejsze, gdy pozostają niewidoczne i mogą swobodnie snuć swoje intrygi poza zasięgiem wścibskich oczu. Gdy zostaną odkryte, stają się łatwym łupem dla każdego głupca, który ma czym je zdzielić. Tak właśnie czuł się teraz Janecki. Tyle lat planowania i ostrożnych knowań, tylko po to, by osądzała go banda półgłówków. Oczywiście nie zamierzał mówić tego na głos. Jego sytuacja i tak była ponura. Będzie milczał. To zawsze był jego niezawodny sposób działania. Obrażanie sędzi w stylu Rzymkowskiego lub targowanie się jak Gadomski nie dałoby nic poza rozgniewaniem całej sali.\n\n- ...Wysoki Sądzie - prokurator kończył mowę. - Wszyscy znamy powody, dla których Rafał Ziemkiewicz został uznany za winnego. Należy więc ukarać także architekta i wykonawcę tych samych prześladowań politycznych, które wiązały się z Ziemkiewiczem. Pomimo przytłaczającej góry dowodów wiemy, że niektóre z jego zbrodni nigdy nie ujrzą światła dziennego z powodu panicznego niszczenia licznych dokumentów przed przejęciem władzy przez Krzyżowców. Wnoszę o karę śmierci.\n- Wysoki Sądzie, brak dowodów nie może służyć do skazania oskarżonego. A te dowody, które posiadamy, wskazują, że właściwsze byłoby dożywocie.\n- Nie waż się bronić tego drania! - krzyknął anonimowy głos, wywołując falę chaosu na sali.\n- Spokój! Spokój! Spokój!\n\nPo długim namyśle sędzia Wesołowska wydała wyrok w sprawie Pająka."
atom_reg.10.a: "Kokon"
atom_reg.10.b: "Klapek"

atom_reg.11.t: "Kłamstwo to grzech"
atom_reg.11.desc: "Karol Byzdra szedł korytarzem w stronę gabinetu Wiecha. Niósł dziś jeden z najważniejszych dokumentów w historii Bractwa - teczkę z hakami Janeckiego. Ogromna teczka była tak istotna, że sam Wielki Ekolog chciał zapoznać się z nią jako pierwszy.\n- Oto akta, których chciałeś - Byzdra podał dokumenty przełożonemu, pomijając formalności. W końcu on i Wiech znali się od dawna.\n- Dzięki, Karol - odparł Wiech, szykując się do otwarcia teczki. Jego umysł wypełnił niepokój.\n- Mam nadzieję, że nie jest na mnie zły za to, że nie pozwoliłem mu otworzyć ich jako pierwszemu. Szkoda, że nie mogę ufać nawet najbliższym sojusznikom - pomyślał Wielki Ekolog, gdy jego minister spraw wewnętrznych wyszedł. \nPomijając osobiste uprzedzenia, Janecki był najlepszym przykładem tego, co się dzieje, gdy służby specjalne wymykają się spod kontroli, a Wiech nie zamierzał do tego dopuścić.\n- Dobrze, dość rozmyślań. Zobaczmy, co tu mamy.\nOkazało się, że akta skrywają bardzo wiele. Dokumenty Janeckiego potwierdziły wszystkie pośrednie dowody obciążające członków Bractwa. Ten cwaniak zebrał nawet materiały przeciwko samemu sobie, przez co lista jego zbrodni okazała się dłuższa, niż przypuszczał którykolwiek z Krzyżowców.\n- Szkoda, że już skazaliśmy tego drania.\nByły tam również szczegóły dotyczące członków opozycji, którzy zaginęli bez śladu. Zgodnie z podejrzeniami wielu z nich stracono, lecz niektórych uwięziono w tajnych podziemnych więzieniach. Więzieniach, o których Krzyżowcy nic nie wiedzieli.\n- Wciąż możemy uratować tych ludzi.\nNa koniec Wiech skierował wzrok na budzący grozę rozdział zawierający informacje o hakach i szpiegach w szeregach Atomowej Krucjaty.\nNie było tam ani Byzdry, ani Czyżewskiego.\n- Dzięki Bogu. - Żaden katalog akt, choćby największy, nie byłby w stanie opisać ulgi, jaką Wiech odczuł w tej chwili.\nOkazało się, że Krucjata także miała swoje tajemnice. Większość szpiegów była zwykłymi szeregowcami. Niektórzy byli oficerami niższej rangi. Zwerbowano ich tuż przed wielkim powstaniem przeciwko Bractwu, więc Janecki nie zdążył wyrządzić im szkody.\n- Musimy działać szybko. Trzeba zapobiec ewentualnemu przewrotowi Bractwa.\nIstniały też akta dotyczące samego Wielkiego Ekologa.\n- Skoro miał na mnie haki, dlaczego nie użył ich do szantażu, by uzyskać niższy wyrok?\n\nWtedy Wiech zrozumiał dlaczego.\n\n- Och, zdecydowanie są kompromitujące, ale na dłuższą metę nie stanowią zagrożenia.\n\nSzybko spalił \"dowód\" i zaczął pisać do Byzdry list w sprawie nowej serii procesów przeciwko zdrajcom wymienionym przez Janeckiego."
atom_reg.11.a: "- Wydawało mi się że zniszczyłem te zdjęcia dawno temu..."

atom_reg.12.t: "Utyje szarańcza 1/2"
atom_reg.12.desc: "- Mówcie mi Julka. Możecie mnie nie znać, ale właśnie przyjechałam z Paryża. Chciałabym, żebyśmy najpierw się poznali, lecz dostałam miesięczny przydział pracy do wykonania w niecały tydzień, a jeśli wszystko poszło zgodnie z planem, wy jesteście podobnie obciążeni. Spróbujmy więc uwinąć się w mniej niż godzinę: priorytety i kierunki lobbingu oraz aktywizmu w regionie łódzkim. Oto mój projekt propozycji. Przedstawia strategie i nasze skupienie na oddolnej agitpropagandzie, agitpropagandzie w mediach i telekomunikacji oraz, rzecz jasna, lobbingu.\nTrzej pozostali liderzy nowo utworzonego oddziału Greenpeace siedzieli przy tym samym stole w sali, która mogła być jedynie klasą szkoły podstawowej. Jej ruina upodabniała dzisiejszą Łódź do ukraińskiej Prypeci. Szary beton, resztki dziecięcych rysunków na podłodze - każdy przedstawiał przyszłość lepszą od rzeczywistości. Aktywiści byli młodzi; każdy przybył z innego francuskiego miasta, by niezwłocznie ponownie zaszczepić struktury Greenpeace w Polsce.\nJulka ciągnęła dalej:\n- Jak widzicie, wszystkie nasze wysiłki koncentrują się na ujawnianiu utrzymujących się sympatii proziemkiewiczowskich. Obejmuje to między innymi działania bezpośrednie prowadzone przez pośredników, z którymi możemy wyprzeć się powiązań, oraz przekonywanie władz, by dołączyły do naszych starań albo upoważniły nas do wykonania za nie tej pracy. W aneksie na końcu znajdziecie proponowane ochłapy, które można rzucić wiechowcom...\nMężczyzna w hipsterskich okularach i z brodą przerwał:\n- Przemoc uliczna i lobbing na rzecz kontroli myśli? Nie jesteśmy Bractwem!"
atom_reg.12.a: "- Nie zniżymy się do ich poziomu!"

atom_reg_a.12.t: "Utyje szarańcza 2/2"
atom_reg_a.12.desc: "- Ha! Rozejrzyjcie się. Ten kraj już przeszedł dewzrost. Nędza, głód, bezprawie - właśnie z tym naród będzie kojarzył dewzrost przynajmniej przez jedno pokolenie. Znajdujemy się jednak także w wyjątkowym położeniu, bo możemy odbudować państwo nieobciążone ciężarem odziedziczonej gospodarki. Jeśli nic nie będzie ciągnąć go wstecz, możemy stworzyć dla całego narodu nowy, bezemisyjny sposób istnienia. Wolność słowa i rynek idei są drugorzędne wobec tego, co umożliwia samo życie, a w konsekwencji również je: przetrwanie tej planety.\n- Tutaj napisano, że poprzemy atomową obsesję Wiecha i skierujemy wszystkie siły na zniszczenie węglowych fetyszystów! Światowy Greenpeace nas znienawidzi! - hipster wyglądał na wściekłego, jakby ktoś zamienił mu bezcukrową mokkę ze Starbucksa z podwójnym tłuszczem na skroplony węgiel albo inny specjał Bractwa.\n- Nie znienawidzi. Ocieplają się wobec energii jądrowej szybciej, niż nawet ja przewidywałam - łysy mężczyzna wyrwał się z milczenia, przychodząc Julce z pomocą.\n\n- Paliwo jądrowe to paliwo kopalne!\n- Dosłownie nie jest paliwem kopalnym. Nie powstaje ze skamielin. Chcesz powiedzieć, że nie jest odnawialne; znane złoża rud jądrowych wystarczą na setki lat użytkowania - Julka odetchnęła z ulgą, że aktywizm nie wymaga zbyt wiele twardej nauki.\n- Nie, musimy postawić na dewzrost i prawdziwie odnawialną energię! Nie ma planety B!\n- Nie ma też interwencji UE B, a patrząc na to, jak skończyła się ostatnia, dzięki Bogu.\n- Nie nawołuję do ekstremistycznego pośpiechu. Ten plan jest w pełni racjonalny i dokładny. I musi zadziałać, musi; nic nie może nas odwieść od tego. Patrząc na kierunek, w którym zmierza świat... możemy być ostatnią latarnią nadziei dla tej planety."
atom_reg_a.12.a: "Najlepszym lekarstwem na faszyzm jest ekofaszyzm."

atom_reg.13.t: "Opcja atomowa"
atom_reg.13.desc: "- W każdej epoce historii największym ograniczeniem dobrobytu i przemysłu była energia. Dziś także odczuwamy to aż nazbyt dobrze. Wszystko, na co pracowaliśmy, zgasło i umarło, gnijąc na naszych oczach. Jak bez energii mamy tchnąć w to nowe życie?\n\nIrena przeżyła już dziewięćdziesiąt zim i, wbrew oczekiwaniom wszystkich, nigdy nie opuściło jej zdrowie. Kiedy cały jej świat i naród upadły do rangi Trzeciego Świata, gdy tysiące zginęły, a jeszcze więcej uciekło, gdy jej rodzinną Łódź rozświetliło drugie słońce, należała do nielicznych, których rutyna się nie zmieniła. Dawniej wstawała rano i pracowała jako opiekunka dzieci. Teraz, gdy większość z nich uciekła z rodzicami, pozostawiając zrozpaczonych i samotnych, opiekowała się ich meblami. Wiedziała, że życie nigdy tak naprawdę się nie zmienia. Że te rozpadające się bloki są żywsze, niż się wydają. Polska żyła. Martwe były jedynie... obietnice ludzi znajdujących się daleko od niej. Martwe już w chwili narodzin.\n\n- Atom był obietnicą lepszego życia dla nas wszystkich, wolnego od dyktatu tych, od których musieliśmy kupować energię. Atom był suwerennością w najczystszej postaci. Atom oznaczał wolność od rachunków za prąd. Ale nie lękajcie się. Nie był wam pisany, ponieważ wasi władcy nigdy go nie rozumieli ani mu nie ufali. My go rozumiemy. My mu ufamy. Wiemy, jak zapobiec powtórzeniu tych tragedii. Do 2050 roku obietnica Atomu znów będzie wasza. Do 2050 roku opcja atomowa ponownie nas wyzwoli! Ludzka pomysłowość raz jeszcze zerwie wszelkie ograniczenia. A tym razem ruszymy ku gwiazdom.\n\nGłos zapewne należał do kolejnego polityka, który wijąc się, dotarł na czele tego, co z nas zostało. Albo do innego watażki. Co za różnica? Bez względu na nich Irena nadal będzie wstawać rano, udawać, że plotkuje z rówieśniczkami, pracować i czytać... Im więcej się zmieniało, tym więcej pozostawało takie samo. Nie zapobiegłoby temu nawet stopienie reaktora łódzkiej elektrowni. Nie zmieniłaby tego żadna głupia obietnica któregoś z Braci, równie dobrze mogącego być alter ego poprzedniego.\n\nA jednak, gdy radiowe przemówienie ucichło, a oklaski przebrzmiały, spojrzała w stronę Strefy Wykluczenia. Jej umysł opanowała piosenka w jakimś przeklętym obcym języku, zespołu uwielbianego przez wnuka...\nEins, hier kommt die Sonne\nZwei, hier kommt die Sonne\nDrei, sie ist der hellste Stern von allen"
atom_reg.13.a: "Vier, und wird nie vom Himmel fallen"

atom_reg.14.t: "Ad Victoriam"
atom_reg.14.desc: "- TY BEZCZELNA GNIDO! CHCESZ MI POWIEDZIEĆ, ŻE JESTEŚ PRZYDZIELONYM SKRYBĄ TEGO PLUTONU, A NIE UMIESZ NARYSOWAĆ NICZEGO PONAD TO, CO WYSKROBAŁABY KURA PAZUREM?\n- PANIE SIERŻANCIE, NIKT MI NIE POWIEDZIAŁ, ŻE JESTEM SKRYBĄ, PANIE SIERŻANCIE!\n- TO CO TY, KURWA, TUTAJ ROBISZ, SZEREGOWY! ZARAZ JESZCZE BĘDZIESZ PIEPRZYŁ, ŻE NA OBIAD NIE MA NUGGETSÓW Z KURCZAKA I RYŻU?! CO TY W OGÓLE, KURWA, TUTAJ ROBISZ, SZEREGOWY?!?!?!\n- PANIE SIERŻANCIE, ZGUBIŁEM SIĘ W DRODZE DO BERLINA, PANIE SIERŻANCIE!\nŁUP!\n\nI tak moja głowa trafiła na godnego przeciwnika w postaci tablicy, ku której z dziką siłą pchnęła ją wciąż umazana węglem ręka instruktora. Do Atomowej Krucjaty wstąpiłem z głodu, gdyż podpadłem okupantom z Bractwa; wcale nie próbowałem dostać się do Berlina. Zostałem jednak dla koleżeństwa panującego w Krucjacie. Zaledwie kilka tygodni temu śpiewałem pieśni pochwalne naszym przywódcom i szturmowałem Elektrownię Bełchatów. Po zwycięstwie dość bezceremonialnie powiedziano nam, że bycie partyzantem to nie to samo co bycie żołnierzem zawodowym, a nowy program szkolenia zaczniemy od zera.\nMówią, że żołnierz zawodowy ma wytrzymać najgorsze warunki, a zdecydowanie nas do tego przygotowywali. Mówię to ja, człowiek przyzwyczajony przez życie partyzanckie do wiecznego niewyspania i nocnych operacji. Inni rekruci nie mieli tyle szczęścia.\nNawet jedzenie stało się gorsze. Życie partyzanta oznaczało, że jadło się wszystko, co wpadło w ręce, co napełniało serce nadzieją, że dla odmiany można znaleźć coś przyzwoitego. Starcia były szybkie i nagłe, a jeśli tylko zabezpieczenie operacyjne działało, zawsze uderzaliśmy pierwsi. Tutaj człowiek jest na wieki skazany na tę samą buraczano-ziemniaczaną breję, zapewne zmodyfikowaną genetycznie tak, by otępiała wyższe funkcje poznawcze. Złamano mnie, gnębiono jak bydło, zdemoralizowano do gnębienia nowych rekrutów, a mimo to wciąż czułem koleżeństwo... w na wpół martwym, zdruzgotanym umyśle. Pamięć składała się z zamglonych wspomnień torów przeszkód i ćwiczeń bojowych z ostrą amunicją. Od czasu do czasu śniło mi się, że nadal jestem w Poznaniu, moja dziewczyna leży na kanapie i uśmiecha się spod burzy złotych włosów, a ja podchodzę do niej i...\n\n- GÓWNO PRAWDA, SZEREGOWY! TWOJA LASKA TO JEBANA DZIWKA, KTÓRA W TEJ CHWILI OBRABIA KAŻDEMU POZNAŃSKIEMU GANGSTEROWI! GLEBA I POMPUJ!\n\nTen przeklęty głos zdołał już wpełznąć mi do głowy. Odzyskując przytomność, walczyłem z odruchem, by nie paść na twarz i nie zacząć robić pompek. Instruktor gniewnie wskazał moje miejsce, więc wróciłem usiąść, rozcierając bolący punkt, którym głowa uderzyła w tablicę.\n- PO JAKĄ CHOLERĘ TU JESTEŚMY? - zapytał z pozornie niemożliwą mieszaniną znudzenia i autorytetu.\n- PRO VICTORIAM! - odpowiedział tłum.\n- DOKĄD, KURWA, ZMIERZAMY?\n- AD VICTORIAM"
atom_reg.14.a: "No, i tak trzymać!"

atom_reg.15.t: "Miś Wykrywacz"
atom_reg.15.desc: "Kolejny pozornie normalny dzień w firmie KONSTRUKTPOL, odpowiedzialnej za produkowanie elementów budowlanych. Prezes Jan Wiaderski siedzi przy swoim biurku wpatrując się tępo w ekran monitora. Po drugiej stronie zasiada dyrektor Andrzej Czubiński, kierownik zakładu produkcyjnego.\n- Andrzejku, czytałeś to rozporządzenie ministra gospodarki prawda? - zagaił prezes otwierając firmowego maila.\n- Panie Prezesie, no czytałem ale jestem pewien że nas to nie dotyczy, jesteśmy małym zakładem produkcyjnym, nie produkujemy aż takiej ilości odpadów, ja stawiam że zabiorą się za jakieś giganty typu Huta Katowice czy KGHM, co ich obchodzimy my? Nas nawet nie ma w Panoramie Firm. - odpowiedział dyrektor\n- Bo zatrudniamy na czarno ukraińców...\n\nSłowa prezesa zagłuszył dźwięk przychodzącej wiadomości. Zawarta w niej była krótka instrukcja przesłana z Narodowej Agencji Klimatycznej co do wymagań jakie musi spełniać każda firma aby mogła zostać dopuszczona na rynek. Wraz z wiadomością odtworzył się również załącznik na którym postać animowanego misia piszczała: \"MIŚ WYKRYWACZ WYKRYWA SILNE ZANIECZYSZCZENIA, ZAŁÓŻ FILTRY JUŻ DZIŚ!\".\n- Patrz Andrzejku jaki śmieszny. O, a tu tańczy jak się kliknie. Hehe, co oni tam pisali, że jakie kary będą? - ton prezesa wydawał się dość lekceważący\n- Cofnięcie licencji na produkcję. W ostatecznym rozrachunku likwidacja zakładu - dyrektorowi nie było do śmiechu. Mały zakład produkcyjny w małym miasteczku był czasem czymś co dzieliło w tych czasach kilkadziesiąt osób i ich rodziny od śmierci głodowej, lub zdechnięcia na froncie jednej z wielu wojen. Dyrektor Czubiński dbał o swoich pracowników, czego nie można zbytnio powiedzieć o prezesie spółki. Nie tak wielkiej spółki można dodać.\n\nPrzyszła kolejna wiadomość.\n- MIŚ WYKRYWACZ WYKRYWA SILNE ZANIECZYSZCZENIA, ZAŁÓŻ FILTRY JUŻ DZIŚ!\n- Kurwa, znowu? Wrzucam to do spamu.\nKolejna wiadomość.\n- MIŚ WYKRYWACZ WYKRYWA SILNE ZANIECZYSZCZENIA, ZAŁÓŻ FILTRY JUŻ DZIŚ!\n- Tak chcesz ze mną pogrywać głupi bocie? Dobrze, zablokuję ten adres. Nie będą mi mówili jak mam rządzić swoją własną firmą - Prezes Wiaderski zamknął skrzynkę pocztową i z uśmiechem zwrócił się do dyrektora Czubińskiego - Widzisz Andrzejku, z nimi to trzeba...\nPukanie do drzwi przerwało w pół zdanie prezesa. Do pomieszczenia wszedł człowiek w garniturze z teczką i wpinką z logiem Atomowej Krucjaty na mankiecie.\n- Witam, prezesie Wiaderski. Poproszę sprawozdania finansowe z ostatnich trzech lat, czas na audyt. I naprawdę radziłbym panu założyć te filtry już dziś."
atom_reg.15.a: "Ale nasz piec nawet nie działa!"

atom_reg.16.t: "Gdy wzywa wolność"
atom_reg.16.desc: "Nikt nie pamięta, jak długo byliśmy uwięzieni w kopalniach. Wszyscy pamiętamy, jak do tego doszło. Wyczuliśmy, że dzieje się coś złego. Strażnicy byli poruszeni, a z każdym dniem było ich mniej. Odważniejsi z nas próbowali pytać, co się dzieje, i zostali za to skatowani. Nikt nie spodziewał się, że pewnego dnia po prostu odejdą.\nIch odejście nie oznaczało jednak końca naszej męki. Bractwo ewakuowało się w ogromnym pośpiechu. Było widać, że ogarnęło ich przerażenie. \"Są bliżej, niż myśleliśmy\"; \"Nie zostało nam wiele czasu\"; \"Ewakuować cały personel\". Niektórzy próbowali uciec razem z nimi i zostali bezlitośnie zastrzeleni. Potem większość z nas się wycofała. To dało im czas na podłożenie ładunków i wysadzenie ich przy wejściu, grzebiąc nas w środku.\n\nOd tamtej pory minęło wiele dni w słabym świetle elektrycznych lamp. Mieliśmy tylko zapasowe racje, które strażnicy zostawili w pośpiechu. Wodę zbieraliśmy ze ścian jaskini. Zasypialiśmy i budziliśmy się, nie wiedząc, czy jest dzień, czy noc. Większość postanowiła wreszcie odpocząć i przestała wydobywać węgiel, skoro nikt już nas nie pilnował. Ci, którzy byli tu najdłużej, nadal pracowali, bojąc się, że Bractwo wróci i ukarze ich za obijanie się. Początkowo większość z nas ich wyśmiewała. Lecz im dłużej pozostawaliśmy pod ziemią, tym bardziej narastały paranoja, lęk i nienawiść do Bractwa. Niektórzy twierdzili, że w głębszych korytarzach słyszeli maszerujących paladynów. Ludzie na dole byli na skraju zdziczenia i zaczynali rozważać zjedzenie zmarłych.\n\nKiedy więc usłyszeliśmy na zewnątrz głośny huk, wszyscy uznaliśmy, że to kolejna z ich szalonych machin wojennych. Gdy głazy blokujące wejście zaczęły powoli znikać, doszliśmy do wniosku, że Bractwo wróciło zagonić nas do pracy. \"Nie ma szans, żebym po tym wszystkim znów fedrował\" - powiedział jeden z nas. Oślepiło nas światło, gdy po raz pierwszy od dawna zobaczyliśmy słońce, lecz dostrzegliśmy żołnierzy z latarkami schodzących w naszą stronę. Niewiele myśląc, obrzuciliśmy ich kamieniami i ruszyliśmy na nich z kilofami w dłoniach. Byłem jednym z pierwszych napastników. Zaczęli do nas strzelać. Dopiero gdy przewróciłem jednego z żołnierzy i zobaczyłem symbol atomu na jego napierśniku, zrozumiałem, co się dzieje. Krzyknąłem do pozostałych górników:"
atom_reg.16.a: "Stać! To nie są żołnierze Bractwa!"

atom_reg.17.t: "Gdzie diabeł nie może, tam Niemców pośle"
atom_reg.17.desc: "RZĄD FEDERALNY EUROPEJSKIEGO PAŃSTWA NIEMIECKIEGO I WSZYSTKIE ORGANY FEDERALNE UNII EUROPEJSKIEJ,\n\n\"Działając zgodnie z postanowieniami porozumień Berlińskich z dnia 14 marca 2024 roku oraz przyjętą polityką europejską Energiewende z dnia 30 stycznia 2025 roku, wzywa się wszelkie podmioty polityczne na terenie Europejskiej Republiki Polski do zaprzestania jakiegokolwiek wykorzystywania surowców radioaktywnych oraz zaniechania swoich atomowych planów zagrażających stabilności regionu. Biorąc pod uwagę fakt, że wyżej wymienione podmioty nie są uznawane międzynarodowo jako państwa niepodległe, Unia Europejska zarzeka sobie prawo do interwencji wojskowej na terytorium państwa członkowskiego, które to formalnie zostało inkorporowane ponownie do struktur europejskich zgodnie z artykułem 4 traktatu gdańskiego o rozszerzeniu misji stabilizacyjnej na terenach byłej Rzeczpospolitej Polskiej. \n\nJednocześnie, jeśli na terytorium Polski dojdzie do budowy reaktorów, to rząd niemiecki będzie pracować z użyciem odpowiednich instrumentów prawnych oraz siłowych by zniwelować zagrożenie płynące z niszczycielskiej polityki jednego z głównych rebelianckich sił politycznych jakim jest Atomowa Krucjata. Organizacja ta bezpośrednio odwołuje się do najbardziej tragicznych w skutkach katastrof spowodowanych wykorzystaniem energii atomowej w historii jak katastrofa w Czarnobylu czy katastrofa w Fukushimie. Jednogłośną rezolucją nr 4576, rząd federalny Unii Europejskiej na podstawie dostępnych raportów ze śledztwa na temat katastrofy nuklearnej na Bałutach w polskim mieście Łodzi, ogłasza że całą odpowiedzialność za ten barbarzyński atak ponoszą fanatycy z Atomowej Krucjaty, a sama organizacja wraz z dniem dzisiejszym zostaje oficjalnie zaklasyfikowana jako organizacja terrorystyczna. Wzywa się wszystkie państwa członkowskie Unii Europejskiej, oraz wszelkie wolne narody ONZ do przeciwstawienia się terroru płynącego z użycia atomu przez fanatyków, którzy stanowią zagrożenie dla całego świata.\"\n\nJakub Wiech siedząc w swoim gabinecie nie dowierzał swoim oczom. Do wiadomości był również dołączony list gończy z Interpolu z jego podobizną. Od dzisiaj stał się on osobą którą zrównano z takimi osobistościami jak Jacek Jaworek czy Osama Bin Laden. Introdukcja do tak \"zacnego\" panteonu osobistości nie była do końca wymarzonym scenariuszem lidera Krucjaty.\n- Co za stek bzdur...przynajmniej na tym zdjęciu wyglądam jakbym zaraz miał wypuścić najlepszy kawałek o wojnie w Wietnamie."
atom_reg.17.a: "Było mi zostać na Bałutach..."

atom_reg.18.t: "Niewidzialna groza"
atom_reg.18.desc: "Choć część uporczywej opozycji może wynikać z wciąż obecnych wpływów Bractwa - czynnika powszechnie utrudniającego każdą politykę wprowadzaną przez Krucjatę - jedna rzecz ma własny, osobny legion przeciwników: sam Atom.\n\nZnaczna część ludności wciąż pamięta niesławną katastrofę czarnobylską. Ci, którzy jej nie pamiętają, z pewnością mieli nieprzyjemność słuchać niezliczonych przestróg powtarzanych przez starszych. Dla wielu zagrożenia energii jądrowej są osobistym doświadczeniem niesionym przez resztę życia i wplecionym w zbiorową świadomość narodu. Strach przed Czarnobylem i tym, co uczynił z okolicą oraz mieszkańcami Prypeci, od tamtej pory ciążył nad debatą publiczną, prowadząc do porzucenia projektu Elektrowni Jądrowej Żarnowiec i zamknięcia drzwi przed wszelkimi dalszymi przedsięwzięciami. Katastrofa ta nauczyła obecne społeczeństwo, jaką krzywdę Atom może wyrządzić ludzkiemu ciału i jak zwykły błąd człowieka może wywołać tak ogromną tragedię.\n\nKatastrofa w Fukushimie, gdzie wskutek tsunami doszło do stopienia rdzenia reaktora, jeszcze bardziej pogłębiła nieufność, pokazując ludności, że nawet nieustannie zachwalane bezpieczne, nowoczesne technologie mogą łatwo zawieść w starciu z siłami natury. \n\nA na końcu nastąpiła eksplozja na Bałutach, ostatni gwóźdź do trumny naszego rozpadającego się narodu. Wielu ludzi straciło życie, domy, rodziny... Ze starej dzielnicy Bałuty pozostała jedynie sterta gruzów i bólu - przejmujące przypomnienie, w jaki sposób Atom może zostać użyty przeciwko nim.\n\nWszystkie te doświadczenia sprawiły, że przyszłości przedstawianej przez Jakuba Wiecha lękają się niemal wszyscy poza najbardziej oddanymi obywatelami. Dawniej sporadyczne protesty stały się nową codziennością. Zdesperowane głosy blokują tryby Krucjaty; ludzie gotowi są wrócić do węgla tylko po to, by sprzeciwić się uranowi. Przekonanie ich do naszej wizji będzie wymagało znacznie więcej niż pustych słów otuchy. Będziemy musieli zasadniczo przeobrazić ich sposób myślenia."
atom_reg.18.a: "Przyszłe nadzieje wygrają, czy przeszłe strachy pozostaną?"

atom_reg.19.t: "To dopiero kopniak w łeb"
atom_reg.19.desc: " - Ile szczęścia może mieć jeden człowiek? - pomyślał Jakub Wiech.\nNigdy nie wyobrażał sobie siebie w takiej roli. Wielki Ekolog, dowódca Atomowej Armii. Zawsze uważał się raczej za spokojnego człowieka. Gdyby mógł, pozostałby dziennikarzem, demaskował Bractwo i pozwolił samym ludziom podjąć świadomą decyzję o jego obaleniu. Nie mógł jednak długo zaprzeczać swemu przeznaczeniu. Ludzie w Polsce i na całym świecie potrzebowali, by działał. I zadziałał. Minęło kilka lat, a wpływy Bractwa odchodzą w zapomnienie. Zanim Polska zostanie zjednoczona, Bractwo skurczy się do przypisu w podręcznikach historii, podczas gdy on zostanie zapamiętany jako triumfujący wzór jasnej, słonecznej przyszłości. Wizja wiecznego uznania cieszyła go bardziej niż czekająca na biurku uroczysta whisky czy świętujący żołnierze, którzy wyczekiwali swego wielkiego przywódcy. Wiech wkrótce otworzy butelkę i dołączy do wiernych Krzyżowców, chcąc odpędzić zmartwienia zakłócające jego idylliczne rozmyślania. Zmartwienia, które wywoływał sam widok mapy Europaństwa Niemieckiego. Zajmie się nimi później. W ostatnich latach zrobił wystarczająco wiele, by wreszcie pozwolić sobie na odpoczynek. Jeszcze przez chwilę chciało mu się śpiewać..."
atom_reg.19.a: "'Moje życie będzie wspaniałe!'"

atom_supreg.1.t: "Wyboista droga którą podążamy"
atom_supreg.1.desc: "Pierwszy etap sprzątania bałaganu po Bractwie dobiegł końca. Jakub Wiech siedział w swoim bunkrze na Bałutach, rozważając sytuację Krucjaty. Właśnie wygrał wojnę z człowiekiem, który próbował wymazać go z istnienia, i zamiast tego sam go wymazał. Wciąż jednak czekało wiele problemów. Jeden rozdział się skończył, a kolejny właśnie rozpoczynał. \n\nSpojrzał na mapę ziem zdobytych przez Krzyżowców, próbując przedyskutować bieżące sprawy z własnymi myślami. \n\"...czy wciąż damy radę podbić cały kraj? Czy z ludźmi w ogóle da się jeszcze rozmawiać?\" - jego wewnętrzny monolog natychmiast przeszedł w półświadome mamrotanie, jakby upił się własnymi myślami. - \"Hołownia próbował takiego podejścia... i skończył z niczym...\" \nZiemkiewiczowi wyraźnie łatwiej było zarządzać podległymi mu ludźmi. Legalizując Greenpeace, Wiech właśnie stworzył sobie kolejny problem. Innym była konwersja elektrowni, a do tego dochodziły Niemcy. Na końcu pozostawała kwestia uruchomienia handlu uranem i jego wydobycia. Wszystkie te problemy piętrzyły się w głowie Wiecha.\n\nJego wzrok padł na niewielki stos raportów leżących na biurku. \n\"Co my tu mamy... ach tak... raport z działalności Greenpeace. A raczej stek bzdur... jebana hołota gryzie rękę, która ją karmi, skurwysyny... nie mogą być wdzięczni choć przez minutę?\". \nKolejny raport, tym razem o aktywności Bractwa w województwie łódzkim. \n\"...to gówno jest jak rak. Pozwolisz przeżyć jednej komórce, a zaraz wraca w całym organizmie. ...miejmy nadzieję, że nie rozprzestrzeni się dalej...\" \n\nZłowieszcza wiadomość z Berlina wciąż nie dawała mu spokoju. Porównywanie go do radykalnych terrorystów wydawało się nierzeczywiste. Wiedział, że zjednoczenie Polski oznacza ostateczną konfrontację z Niemcami. \n\"...po prostu boją się energii atomowej. Panikujące stare baby. Czarnobyl wciąż siedzi im w głowach\". \nZatrzymał się, a jego tok myślenia nagle otrzeźwiał. \"...Czy to naprawdę jest tego warte? To wszystko... Chciałem tylko powstrzymać Ziemkiewicza, a teraz jestem na drodze do zjednoczenia całego kraju. Czy naprawdę taki był nasz cel?\". Gdy jego umysł zaczęły wypełniać ciemne chmury, dostrzegł teczkę przygniecioną wszystkimi otrzymanymi raportami. W środku znajdowało się sprawozdanie dotyczące jakości powietrza, poziomu życia i środowiska. - Ich praca służyła dobru wszystkich. Dlaczego mieliby się zatrzymywać? W tej samej chwili Jakub wstał, upił łyk czarnej kawy i ruszył do działania."
atom_supreg.1.a: "Jest jeszcze wiele do zrobienia, ale będzie warto."

atom_supreg.2.t: "Niełatwo być Zielonym"
atom_supreg.2.desc: "Zatrzymaj się, tam coś leży! - krzyknął pasażer z tylnego siedzenia. Dyrektor ds. geologicznych z Narodowej Agencji Klimatycznej, Andrzej Maciejewski wracał ze spotkania w sprawie badań kolejnych potencjalnych miejsc, gdzie w przyszłości można byłoby zbudować elektrownie atomowe. Szofer zatrzymał się na skraju jezdni zaraz za znakiem ostrzegającym o dzikich zwierzętach. Jako, że byli w środku lasu, równie dobrze na jezdni mógł się znajdować rozjechany jeleń. Ale serce podskoczyło dyrektorowi do gardła gdy ujrzał, że to co zauważył było ciałem człowieka. \n- Kurwa...Marek dzwoń na policję! - rzucił do swojego kierowcy. Ten natychmiast wyciągnął telefon i gorączkowo próbował się dowiedzieć gdzie się tak naprawdę się znajdują. Nawigacja wskazywała drogę wojewódzką 726, a pobliski słupek kilometrowy uświadczył go w przekonaniu że są pośrodku niczego. Zanim jednak zdążył wykręcić numer alarmowy, usłyszał przeraźliwy krzyk, jak gdyby dzika obdzierano ze skóry.\n- AAAAAAAAAAAA JA PIERDOLĘ - był to dyrektor, który podszedł bliżej ciała wiedziony zwykłą ciekawością. - ON NIE MA PŁUC, WYCIĘLI MU JEBANE PŁUCA!\n\nMaciejewski jako jeden z nielicznych przetrwał cały Upadek bez traumatycznych wspomnień, i nie był przystosowany psychicznie do widoku krwi i juchy. A tym bardziej zmasakrowanych trupów ludzi z wnętrznościami dookoła. To wszystko sprawiło że natychmiastowy refluks żołądkowy ujrzał światło dzienne szybciej niż mózg dyrektora zdążył zareagować paniką. Wymioty rzuciły go na kolana, jednakże po chwili zorientował się że coś mu nie pasuje w tym makabrycznym krajobrazie. \n- M...M...Marek! Tu jest coś napisane...- wnętrzności ofiary układały się w odrażający napis \"MORDERCY\" - Chodź tu szybko! To jest kurwa jakiś kult chy...- odwracając się, \n\nW pół kroku stanął wryty niczym słup soli. Jego kierowca właśnie podzielił los poprzedniego denata. Nad jego ciałem stał mężczyzna w ciemnozielonym stroju z równie zieloną kominiarką na twarzy. W normalnej sytuacji Maciejewski by się roześmiał, ale widząc ostrze ociekające krwią które tamten dzierżył w dłoni nie było mu wcale do śmiechu. Dyrektor pomyślał że skoro jest tylko jeden to może uciec. Nie zauważył jednak drugiego zamachowca który chwycił go od tyłu w żelaznym uścisku.\n- W imieniu wolnej Ziemi skazuję Cię na śmierć za zbrodnie przeciwko planecie, dyrektorze. \n\nI nastał koniec. Światłość przeistoczyła się w ciemność, a dookoła zieleń przeistoczyła się w czerwień. "
atom_supreg.2.a: "Zielony Skurwiel znowu w akcji..."

atom_supreg.3.t: "Oślepiający ogień"
atom_supreg.3.desc: "Bartek i Kajtek siedzieli w niemal całkowitej ciemności - nie licząc sześciu ekranów komputera - wewnątrz VW Transportera znalezionego podczas wojny z Bractwem, a później przerobionego na mobilne centrum dowodzenia ich jednostki. Samochód, podłączony do sieci kamer, stał na głównym placu miasta, zajętym obecnie przez protestujących w eleganckich garniturach oraz z symbolami przedupadkowej partii Nowa Nadzieja i Bractwa. Wszyscy wrzeszczeli, przeklinali i podpalali kosze na śmieci, by wyszydzić atomową sprawę. Większość była powiązana z aparatem węglowego państwa i bardzo młoda - zbyt młoda, by pamiętać dawną jakość powietrza. I byli *wściekli*. \n\nPomimo utrzymywania przy życiu miejscowej elektrowni węglowej, huty i retort do wypalania węgla drzewnego, by zachować lokalne struktury społeczne i gospodarcze we względnie nienaruszonym stanie, cały powiat tak bardzo zubożał, że wielu byłych robotników przemysłowych musiało porzucić domy i wrócić do życia w skleconych własnoręcznie przydrożnych budach. \n\nTymczasem protestujący ślepo powtarzali wykresy swoich ekonomistów i jeszcze bardziej pogarszali jakość powietrza. Wielu przyniosło plakaty propagandowe wiechowców, by spalić je podczas demonstracji, tylko dodatkowo ograniczając widoczność. W rzeczywistości duet w samochodzie niemal wcale nie widział, co działo się na zewnątrz ich \"Wagena\"; większość kamer pokazywała jedynie coś przypominającego czarną chmurę tonącą we wszechobecnej szarości. \n\n- Ej, patrz - Bartek dostrzegł jakiś ruch między ogniskami. - Coś się dzieje. \n- O cholera. Biją się? \n- Nie wiem, ale wygląda, jakby coś ich rozjuszyło... \n-... \n- O rany. \n\nDwaj obserwatorzy nie widzieli, co działo się na zewnątrz, ale wciąż mogli słyszeć - a to *zdecydowanie* brzmiało jak wystrzał. Ludzie na zewnątrz najwyraźniej się zgodzili, sądząc po kakofonii prowadzonego na oślep ognia samopowtarzalnego, która rozległa się zaledwie kilka sekund później. Dwie chmury ludzi zderzyły się ze sobą, a jedna szybko stawała się coraz mniejsza. \n- DOWÓDZTWO! STRAŻNICY OTWORZYLI OGIEŃ! - krzyknął Kajtek. \n- DOWÓDZTWO! DOWÓDZTWO! SZARŻUJĄ NA NAS! SZARŻUJĄ! \nGdy jedna z grup rozpłynęła się we mgle, duet przygotował się, otworzył drzwi samochodu i puścili serię z broni, nie dbając o to, co znajdowało się przed nimi. Jako jedyni uzbrojeni w broń automatyczną błyskawicznie wykorzystali przewagę siły ognia, rozrywając szarawą materię mącącą popielate morze, które ich otaczało... \n- WSTRZYMAĆ OGIEŃ! WSTRZYMAĆ OGIEŃ! STRZELACIE DO SWOICH! STRZELACIE DO SWOICH! -..."
atom_supreg.3.a: "...dobiegło z krótkofalówek duetu, niesłyszalne pośród chaosu."

atom_supreg.4.t: "Stawka Większa niż Życie"
atom_supreg.4.desc: "PRZECHWYCONY MELDUNEK AGENTA H-47 PSEUDONIM NACHTIGALL\n\n[GetDateText], SWINEMÜNDE (ŚWINOUJŚCIE)\n\nOPERACYJNOŚĆ PROJEKTU ATOMOWEGO ROŚNIE\nPLACÓWKA STANOWI INTEGRALNE ZAGROŻENIE DLA BEZPIECZEŃSTWA EUROPEJSKIEGO\nELEMENTY WYKONAWCZE W RZĄDZIE SĄ NIEPODATNE NA KORUPCJĘ I SZANTAŻ.\nBRAK POTENCJALNYCH WPŁYWÓW W STRUKTURACH DO WYKORZYSTANIA.\n\nPOTWIERDZONO ISTNIENIE PLANÓW POTENCJALNIE ZAWIERAJĄCYCH PROJEKT BRONI MASOWEGO RAŻENIA [ZAŁĄCZNIKI 1-3]\nW PRZYPADKU BRAKU REAKCJI MOŻLIWE KATASTROFALNE SKUTKI DLA BERLINA I WSZYSTKICH PRZYGRANICZNYCH MIAST NIEMIECKICH\n\nNASTROJE W RZĄDZIE KRUCJATY ZMIERZAJĄ DO FIZYCZNEJ ELIMINACJI NARODU NIEMIECKIEGO METODAMI NUKLEARNYMI. INWAZJA JEST NIEUNIKNIONA.\n\n------------------------------------ZALECENIA------------------------------------\n\nWPROWADZENIE NATYCHMIAST STANU WYJĄTKOWEGO W PRZYGRANICZNYCH EUROREGIONACH\n\nMOBILIZACJA WSZYSTKICH SIŁ WOJSKOWYCH CELEM INTERWENCJI PREWENCYJNEJ\n\nMASOWE BOMBARDOWANIE WSZYSTKICH INSTALACJI ENERGETYCZNYCH I WOJSKOWYCH CELEM OSIĄGNIĘCIA MAKSYMALNEJ DOMINACJI I UZIEMIENIA ICH POTENCJAŁU ODWETOWEGO.\n\nPOZWOLENIE NA FIZYCZNĄ ELIMINACJĘ OBIEKTU 'ZWERG'\n\nHEIL EUROPA"
atom_supreg.4.a: "Najlepsze szyszki są na Placu Wolności"

atom_supreg.5.t: "Koalicja"
atom_supreg.5.desc: "W łódzkiej Manufakturze doszło do nieoczekiwanego spotkania, którego oboje uczestnicy pozornie reprezentowali odmienne pozycje na osi politycznej. Miało szansę stać się jednym z upragnionych symboli zmian potrzebnych, by przekonać społeczeństwo do współpracy na rzecz przyszłości.\n\n- Wiesz, to trochę ironiczne, zważywszy na twoje nazwisko. Wyobraź sobie nagłówki! Wiech i Węgiel! Gdyby Ziemkiewicz tu był, grillowałby mnie za to tygodniami! - przywódca Atomowej Krucjaty zaśmiał się do swojej rozmówczyni, którą była nie kto inny jak Roksana Węgiel, dawna członkini Karbonariuszy - politycznej młodzieżówki Bractwa. Podobnie jak wielu innych po wojnie domowej znalazła się w sieci zainteresowań decydentów nowego państwa.\n\n- Nawet mi nie wspominaj o Ziemkiewiczu. Pomyśl tylko, jakim trzeba być starym dziadem, żeby robić ze mnie ideał swojej walki ideologicznej wyłącznie dlatego, że mam takie, a nie inne nazwisko! Banda boomerów, nic więcej - powiedziała Roksana. Nie sprawiała wrażenia osoby zindoktrynowanej, lecz rozsądnej dziewczyny. Jak na ironię, to właśnie Zdrowy Rozsądek promowała propaganda Bractwa, osiągając w przypadku młodej piosenkarki skutek odwrotny do zamierzonego.\n\n- Nie, rozumiem. Słuchaj, masz taką jedną fajną piosenkę. Oczywiście wszystkie są świetne, ale ta jest wyjątkowa. \"XXI wiek\". Myślę, że kraj potrzebuje teraz odrobiny tej energii. Nadziei, że ten wiek będzie zielony, pełen nadziei i wszystkiego, co ludzkość ma najlepszego do zaoferowania. Nie zrozum mnie źle, nie chcę cię wykorzystać do własnych celów. Chcę tylko z tobą współpracować. Trasy koncertowe, bez żadnych wymuszonych przemówień, bez prawnych haczyków; mówisz i robisz, co chcesz. Uczciwe wynagrodzenie. Nie prosiłbym cię też, żebyś stawała pod sztandarami i promowała moją gębę. Co ty na to?\n\nRoksana spojrzała na Wiecha z zainteresowaniem. Była bystrzejsza, niż ktokolwiek mógł przypuszczać. Równie dobrze potrafiła jednak oceniać intencje innych ludzi. Wtedy nie miała wyboru. Teraz miała, i to uczciwy. Mogła też w każdej chwili się wycofać. Normalność wraca na scenę.\n\n- Mój menedżer zadzwoni do twojego biura i ustalą szczegóły - powiedziała z uśmiechem, ciepło machając Wiechowi na odchodne. Przez minutę stał w pomieszczeniu pogrążony w myślach. Nie sądził, że interesy w Polsce po katastrofie mogą wciąż być uczciwe i przyjemne."
atom_supreg.5.a: "Oby żona się nie zezłościła..."

atom_supreg.6.t: "Potop"
atom_supreg.6.desc: "Jeśli naród chce istnieć, musi posiadać cztery rzeczy: obywateli, rząd, terytorium i stosunki międzynarodowe. Bez choćby jednego z tych czynników nie można uznać go za państwo. Jakub Wiech doskonale o tym wie, podobnie jak każdy polski watażka pragnący zjednoczyć Polskę. Choć każde państewko w ruinach tego niegdyś wielkiego kraju może zagwarantować pierwsze trzy, zagraniczne uznanie może otrzymać tylko jedno, bo Polska może być tylko jedna. Jakub wiedział, że musi działać szybko. Dogodnie się składało, że Szwecja miała wkrótce gościć szczyt ONZ poświęcony zmianom klimatu i problemom środowiska. Ekolog postanowił wykorzystać okazję i wziąć w nim udział jako przedstawiciel Polski, próbując zdobyć międzynarodowe uznanie dla Atomowej Krucjaty.\n\nW Sztokholmie zebrały się wszystkie delegacje, a wśród nich liczna grupa polskich przedstawicieli z samym Jakubem Wiechem na czele. Wszedł do sali i zajął miejsce puste od lat, wywołując falę zdumienia wśród uczestników. Wreszcie nadszedł czas, by Polska przemówiła z głównej mównicy. Krzyżowiec upiększył swoje dokonania, przedstawiając się jako przywódca ruchu, który wymierzył sprawiedliwość jednemu z największych trucicieli regionu - choć nikt nie rozpoznał jego nazwiska - i obiecał uwolnić Polskę od węgla i smogu. Błagał, że szczytne cele może osiągnąć tylko wtedy, gdy społeczność międzynarodowa uzna jego państwo za jedyny prawowity rząd w kraju. Kobieta stojąca w pierwszym rzędzie pośrodku uczestników wybuchnęła śmiechem, gdy usłyszała ostatnie słowa Wiecha. Opuściła wyznaczone miejsce i ruszyła prosto ku Jakubowi. Twarz światowych sił ekologicznych wybuchła szaleńczą tyradą. \n\n- Jak śmiesz mówić o transformacji, skoro nadal prześladujesz tych, którzy walczą o klimat? - zwróciła się do Wiecha. - Jak śmiesz mówić o zmianach, skoro po prostu zastąpisz węgiel Atomem? Jak w ogóle śmiesz uczestniczyć w tym szczycie, będąc jedynie samozwańczym, niewybranym watażką, który zdobył pozycję siłą oręża? Uważasz, że tak bardzo różnisz się od potwora, jakim próbujesz przedstawić Ziemkiewicza, ale dla mnie jesteście tacy sami.\n\nWraz z tymi słowami cały entuzjazm wzbudzony przemówieniem Jakuba Wiecha umarł bolesną śmiercią, a upokorzony przywódca został zmuszony opuścić Sztokholm w niesławie."
atom_supreg.6.a: "Ta piekielna baba..."

atom_supreg.7.t: "Z drapieżnika w ofiarę"
atom_supreg.7.desc: "Minuty poprzedzające spotkanie zdawały się wiecznością. Jakub Wiech był sam, otoczony przez wygłodniałą sforę, która pragnęła wyłącznie jego upadku. Próbował zachować spokój, lecz gdziekolwiek spojrzał, czuł tuzin gniewnych oczu przeszywających jego duszę, oceniających go i wypatrujących oznak słabości. Krzesło było boleśnie niewygodne, a darmowa szklanka wody smakowała sucho jak pustynny piasek. Czas zdawał się pełznąć, a każde tyknięcie starego analogowego zegara wbijało w jego pierś kolejną igłę niepokoju. Był ich prawowitym przywódcą, ale w tej wrogiej wilczej jamie Wiech czuł się mały, niczym robak czekający na zgniecenie. Po raz pierwszy od wielu lat poczuł emocję, którą uważał za dawno porzuconą - strach. Czuł, jak inicjatywa wymyka mu się z rąk. Wiedział, że musi coś zrobić. Odchrząknął i podniósł się, by przemówić. Wciąż mógł to uratować... lecz nawet teraz został wyprzedzony.\nZanim zdążył otworzyć usta, grzmiący głos zatrzymał Jakuba Wiecha w miejscu, a jego szorstkość zdradzała doświadczenie mężczyzny siedzącego po przeciwnej stronie długiego, okrągłego stołu.\n- Panie Wiech, zna pan nasze stanowisko. My też nie chcemy tego protestu. Niech pan tylko skończy z tą atomową farsą, a jutro wrócimy na stanowiska pracy. \nMężczyzna wygadywał kompletne bzdury, lecz w tych szczególnych warunkach szpakowaty związkowiec brzmiał tak władczo, tak autorytatywnie. Wystarczyło to, by lata medialnego przygotowania dziennikarza straciły znaczenie, a przygotowana przemowa zamieniła się w nieskładne mamrotanie. \n- Widzicie... zapominacie... energia jądrowa jest ważna... musimy zbudować elektrownię... dla dobra natury... \nWidok Wiecha potykającego się o własne słowa wystarczył, by jeszcze bardziej podnieść pewność siebie przywódcy związku. Wymiana coraz bardziej sfrustrowanych żądań i coraz słabszych wyjaśnień szybko zmieniła negocjacje w jednostronną awanturę. To był pogrom. Ekolog wiedział, co nadchodzi, ale bez względu na wysiłki nie potrafił złapać rytmu. Każde oskarżenie spychało go głębiej w narożnik bez wyjścia, aż przeciwnik wreszcie wypowiedział słowa, których Wiech obawiał się od początku rozmowy. \n- Przestanie pan wreszcie obrażać moją inteligencję tymi wymówkami na pół gwizdka i choć raz, do cholery, zrobi to, co należy? Albo wykona pan nasze żądania i już nigdy nie odważy się nawet wypowiedzieć słowa \"atom\", albo kończymy. \n- Przepraszam, ale po prostu nie mogę tego zrobić. Proszę, gdybyście tylko posłuchali... Istnieje mnóstwo zastosowań, które miałyby pozytywny... \nReszta jego słów trafiła jednak w próżnię. Przywódcy strajku jeden po drugim wstawali z miejsc i wychodzili. W sali pozostał tylko pokonany Jakub Wiech, zapadnięty w krześle, raniony ciszą bardziej niż dziesiątkami obelg rzuconych pod jego adresem w ciągu ostatnich kilku minut. Nawet on sam nie pamięta, ile czasu zajęło mu zebranie sił, by ponownie stanąć na nogach."
atom_supreg.7.a: "No i pokojowy dialog poszedł w..."

atom_supreg.8.t: "Dał nam przykład Bonaparte..."
atom_supreg.8.desc:  "Wysłannik szedł korytarzami Hôtel du ministre des Affaires étrangères przy 37 Quai d'Orsay w 7. dzielnicy Paryża, zmierzając na spotkanie z francuską minister spraw zagranicznych Catherine Colonną. Nie byłoby w tym nic niezwykłego, gdyby nie strój ambasadora. Piotr Napierała, minister wojny wiechowskiej Polski, szedł na negocjacje w kopii munduru Napoleona. Nawet mimo oficjalnego upoważnienia rządu Atomowej Krucjaty strażnicy nie byli pewni, czy go wpuścić, prasa zaś była zachwycona widokiem czegoś tak niezwykłego, czym mogła nakarmić najnowsze wydanie wiadomości. Zacofani konserwatyści i reakcjoniści w kraju, tacy jak ten zakuty łeb Gadomski, mogą uważać go za błazna, lecz ich światopogląd nie pozwala im dostrzec geniuszu tej metody. Pod naciskiem miejscowych komentatorów rządowi Francji trudno będzie odrzucić propozycję człowieka, który tak ostentacyjnie schlebia francuskiemu narodowi.\nCzas płynął, a Napierała zbliżał się do celu. W samą porę! Poprzedzający go ambasador Niemiec właśnie opuszczał gabinet minister. Korzystając z okazji, polski wysłannik przekazał narodowi niemieckiemu wyrazy szacunku poprzez... pogardliwe wystawienie języka.\nGdy wreszcie wszedł do gabinetu, przywitał panią Colonnę uściskiem dłoni i lekkim ukłonem.\n- Bonjour, madame la ministre - popisując się znajomością francuskiego, Napierała postanowił prowadzić rozmowę w języku gospodyni.\n - Bonjour - odpowiedziała uprzejmie Colonna - Powiedziano mi, że chce pan omówić kontrakty wojskowe i dostawy na wypadek niespodziewanego ataku.\n - W istocie - Napierała wiedział, że robiła wszystko, by nie powiedzieć wprost, iż chodzi o zagrożenie niemieckie. Postanowił podjąć grę. - Mam nadzieję, że nas rozumiecie. Francja patrzy życzliwie na naszą sprawę. Trudno się dziwić, skoro to kolebka nowoczesnej, oświeconej cywilizacji Zachodu. Polska również ma szansę wznieść się na tak szacowny poziom, jeśli tylko zdoła obronić się przed narodami będącymi... w najlepszym razie cywilizacyjną hybrydą Zachodu i Wschodu.\nSpojrzał minister głęboko w oczy, upewniając się, że rozumie znaczenie jego słów. Rozumiała.\n - Cóż, nasz rząd oczekuje kontraktu na waszą broń. A także gwarancji naszej niepodległości połączonej z sojuszem obronnym.\n - Monsieur Napierała - odpowiedziała Colonna. - Dziękuję za ciepłe słowa o naszym narodzie. To prawda, że wasza walka o czyste środowisko jest bliska naszym sercom. Z pewnością pozwolimy wam kupować naszą broń po uczciwej cenie, lecz obawiam się, że nie możemy przyjść wam z pomocą w razie inwazji. Musi pan zrozumieć: wasz rząd ma zdecydowanie zbyt małą legitymację międzynarodową, byśmy mogli to zrobić. Możemy co najwyżej podpisać pakt o nieagresji.\nNapierała był wyraźnie poruszony takim obrotem spraw.\n - Dziękuję za to, co już nam obiecaliście - próbował zachować spokój. - Musicie jednak zrozumieć: nasz kraj jest młody i już wyczerpany niekończącą się walką. Bez poważnej pomocy z zewnątrz możemy upaść.\n - Przykro mi, monsieur Napierała. Nic więcej nie możemy zrobić."
atom_supreg.8.a: "...koniec końców możemy liczyć tylko na siebie"

atom_supreg.9.t: "Aktywista i obserwator"
atom_supreg.9.desc: "Daniel szedł szarą ulicą, rozglądając się i wyciągając ulotki. Na drodze panował ruch, ale ze stanowiska przy oknie na trzecim piętrze dobrze widziałem każdego. Mój kumpel Jarek leżał w mieszkaniu po lewej, obserwując inną ulicę, gdzie dwóch kolejnych pechowych nowicjuszy rozdawało ulotki i przygotowywało manifestacje. Kiedyś byłem taki jak oni: rozdawałem kartki, które ledwie rozumiałem, i nadstawiałem karku przed kibolami oraz antyatomowymi fanatykami. Odsłużyłem jednak swoje i jako obserwator musiałem dostrzec zagrożenie, zanim zauważą je chłopaki w terenie.\n\n- Atom jest przyszłością, nie przeszłością! - usłyszałem głos Daniela. Minęło kilka minut i w końcu udało mu się skłonić ludzi do przyjmowania ulotek. Same ulotki też się poprawiły. Zamiast upychać lekcję fizyki na jednej kartce, pokazywały nasze starania o opanowanie technologii tak, by już nigdy nas nie zawiodła. Przekonywanie ludzi zaraz po tym, co stało się z Łodzią, było trudne, lecz nie niemożliwe. Kiedy sam działałem w terenie, nikt mnie nie osłaniał. Miałem za to obrzyna.\n\nTutaj jakaś kobieta pluje na Daniela, tam wielki łysy facet dziwnie się patrzy... Wzrok powędrował mi dalej wzdłuż ulicy... i znacznie dalej zobaczyłem grupę wyglądającą na kiboli, w tym kobiety... nie, za chudzi i zbyt mało postawni jak na kiboli. Mieli jednak kije baseballowe. Zakładali kominiarki... Szybko wyciągnąłem radiotelefon i zameldowałem: \n- W5, podejrzana grupa zbliża się do Daniela, bądźcie gotowi. Daniel, wynoś się stamtąd...\nZa późno. Gdy zaczął odchodzić, grupa przyspieszyła.\n- Mają go na oku, interweniujcie natychmiast!\n\n- Chcesz, żebyśmy wszyscy zginęli? Żebyśmy się udusili jak kiedyś całe to miasto! - słyszałem, jak tak zwani zieloni aktywiści zaczepiają Daniela. Odepchnął jednego i dostał kijem w ramię od drugiego. Cofnął się, gdy jedna z kobiet szykowała zamach własnym kijem. Ktoś inny go przytrzymał, ale mój wzrok spoczął na największym napastniku, który wycofał się na jezdnię... i wyciągnął pistolet.\n- Mój brat zginął na Bałutach! Dlaczego JEMU nie dasz trochę swojej...\n\nPiekielny pisk rozdarł powietrze, gdy samochód z pełnym impetem uderzył w bandytę i się zatrzymał. Ze środka wysypali się ludzie w czarnych kamizelkach i kominiarkach. To była nasza grupa interwencyjna, która wreszcie odpowiedziała na alarmy. Zanim napastnicy zrozumieli, co się dzieje, spadły na nich pałki - na ramiona i głowy. Towarzysząca im blondynka wrzeszczała, dopóki jeden z naszych nie założył jej worka na głowę i nie obezwładnił. Pozostali wijąc się, kopali, zanim również nie spacyfikowały ich worki i bezlitosne ciosy. Największy mężczyzna, potrącony przez samochód, czołgał się ku broni, którą jeden z naszych nonszalancko podniósł i przeładował, jakby zamierzał zastrzelić go na miejscu. Potem po prostu ogłuszył go kopniakiem w twarz.\n\nKolejny dzień, kolejna zwycięska bitwa o serca i umysły. Kolejny dzień w Krucjacie, do której dołączyłem, by zmieniać świat, a skończyłem jako zwykły obserwator z dumnym tytułem."
atom_supreg.9.a: "- Dyspozytornia, grupa W5 będzie potrzebować więźniarki"

atom_supreg.10.t: "Wojna biologiczna"
atom_supreg.10.desc: "Gabinet profesor Zielińskiej oświetlała tylko mała lampka na biurku. Lata pracy w Agencji Klimatu przyniosły niewiele rezultatów i psychicznie wyczerpały wszystkich w Departamencie Nadzoru. Na jutro zaplanowano spotkanie całego kluczowego personelu agencji, podczas którego zostanie przedstawiony zbiorczy raport o tegorocznym stanie środowiska. Profesor po cichu modliła się, by tym razem mogła powiedzieć wszystkim coś więcej niż tylko, że pozostało jeszcze wiele do zrobienia i musimy być cierpliwi.\n\nSięgnęła po pierwszy raport. Toksykologia środowiskowa. Badanie mutagenności i rakotwórczości zanieczyszczeń środowiska. Badania ekotoksykologiczne zanieczyszczeń powietrza. Biomonitoring zanieczyszczeń wody. Wszystkie biomarkery wykazują widoczną poprawę! Czyżby nasze wysiłki wreszcie zaczynały przynosić rezultaty? Podekscytowana Zielińska zaczęła przeglądać kolejne raporty z wynikami badań łódzkiego ekosystemu, który ucierpiał najbardziej. Wygląda na to, że naprawdę jest coraz lepiej!\n\nDrugi raport. Badania populacji fauny na obszarach dotkniętych katastrofą ekologiczną. Ktoś zauważył dziki w pobliżu lotniska w Łasku! Jeszcze niedawno wydawało się to niemożliwe; nawet zwierzęta omijały całe województwo szerokim łukiem, ryby w rzekach były martwe, a ptaki spadały z nieba jak rażone piorunem. Może pewnego dnia Zielińską obudzi śpiew skowronków? Przez chwilę marzyła o założeniu gospodarstwa w rodzinnej Grabicy. Szybko jednak wróciła do rzeczywistości i sięgnęła po następny stos papierów.\n\nTrzeci raport. Biotesty na organizmach roślinnych. Serce profesor przyspieszyło z podekscytowania; czytając kolejne zdania, nie potrafiła ukryć radości. Tempo wzrostu korzeni, kiełkowanie i wzrost siewek - wszystko na plus! Wszystkie próbki posadzonych secale cereale, triticum aestivum oraz hordeum vulgare spełniały normy wystarczające, by uznać je za zdrowe okazy!\n\nProfesor zdjęła okulary i wstała zdumiona. Wzięła głęboki oddech, po raz pierwszy nie obawiając się, że nadmierne wdychanie powietrza może doprowadzić do chorób układu oddechowego. Na jutrzejszym spotkaniu będzie sam przywódca Krucjaty, a to ona przekaże przełomową wiadomość - nasz ekosystem został uzdrowiony. Oczywiście osiągnięcie stanu idealnego zajmie jeszcze kilka lat, lecz już teraz jest to ogromny sukces. Zielińska nie zaśnie tej nocy, z niecierpliwością wyczekując jutra."
atom_supreg.10.a: "Czym do cholery jest hordeum vulgare?"

atom_supreg.11.t: "Stalowe Giganty"
atom_supreg.11.desc: "- Mirek, zbieraj dupę, mamy zinwentaryzować magazyny od C1 do C10 - krzyknął Rafał, szef zmiany w składnicy uzbrojenia rezerwowego. Owe magazyny były najstarszymi w jednostce, zapieczętowane szczelnie od czasów Pierwszej Krucjaty. Atomowej, a nie tej do Ziemi Świętej oczywiście. Wielkie hale wypełnione bronią skrywały jednak nie święte granaty ręczne, ale coś co w obecnej sytuacji geopolitycznej przyda się o wiele bardziej. Ciężki sprzęt.\n\nRafał z Mirosławem weszli podziemnym tunelem do pierwszego z magazynów. Dookoła zalegały zamknięte skrzynie, na których można było ledwie odczytać napisy: AMUNICJA, KILOFY, GRANATY NAPALMOWE. Mirkowi widząc tę ostatnią natychmiast przeszła chęć na papierosa. Tym co jest tu zgromadzone możnaby wysadzić połowę Łodzi. A drugie pół by spłonęło z wrażenia. Rafał podszedł do skrzynki kontrolnej i włączył oświetlenie sali. I wtedy dopiero Mirek ujrzał absolutny gigantyzm zgromadzonych tu maszyn.\n\n- Rafał, co to do cholery jest? - zapytał Mirek wskazując palcem na stojący najbliżej ogromny czołg z dwiema lufami. Był imponujących rozmiarów ale nie wyglądał jakby miał gdzieś pojechać w najbliższej przyszłości.\n- To mój drogi jest prototypowy czołg który przejęli nasi gdy weszli do fabryk porzuconych przez Bractwo. Mówili na niego Koala. Trochę ich zdążyli naklepać, i nie wszystkie wysadzili. Jest jeden problem. To absolutny szajs. Układ paliwowy przecieka bardziej niż dziurawe gacie, układ kierowniczy to dramat, ten kloc w ogóle nie skręca.\n- To nie wygląda jakby miało w ogóle w zamierzeniu skręcać. No i chyba błotnika mu brakuje - zauważył Mirek. Faktycznie, co drugi czołg był w jakimś stopniu wybrakowany.\n- A o tym to nawet mi nie mów, gdzie ja Ci drugi taki błotnik dostanę? W ogóle wyobrażasz sobie ile to diabelstwo pali? - kontynuował swój wywód Rafał\n- Czego, węgla?\n- Geniuszu, może i oni byli durni ale czołgi to chyba musieli robić na paliwko, nie?\n- No dobrze, dobrze, dużo tego tutaj? - Mirek szybko chciał zmienić temat\n- Z kilkadziesiąt sztuk mamy, policzmy je szybko to Ci pokażę jak węglowcy zmasakrowali Ospreya. - Mirek na dźwięk tych słów zrobił minę jakby się przesłyszał.\n- Oni mieli Ospreye?! - Rafał roześmiał się. On jeszcze nie wie że żaden z tych gruzów nie wyszedł nigdy poza rejon fabryki. I nie życzył nikomu znalezienia się w środku któregokolwiek z tych wymysłów chorego industrializmu."
atom_supreg.11.a: "- Poczekaj młody, aż zobaczysz Wielką Baśkę."

atom_supreg.12.t: "Atomowe przedszkole"
atom_supreg.12.desc: " - Cześć, dzieciaki! Mam na imię Dominika, a dzisiaj dowiemy się czegoś o... - opiekunka zrobiła dramatyczną pauzę. - Energii jądrowej, hura!.\nDzieci nie wyglądały na zachwycone.\n - Oto A'Tomek! - Dominika wyciągnęła zza pleców pacynkę pulchnego chłopca. - Opowie nam więcej o energii jądrowej!\n - Cześć, dzieci! - przemówił A'Tomek, wystawiając zdolności brzuchomówcze Dominiki na najwyższą próbę. - Energia jądrowa daje nam prąd zasilający telewizory, zabawki i żarówki. A wszystko to bez tego paskudnego smogu! Czy któreś z was ma astmę?\nKilkoro dzieci podniosło ręce.\n - Widzicie? Czy ostatnio nie oddycha się łatwiej?\n - Tak! - odezwało się kilkoro pechowych urwisów.\n - Dobrze - A'Tomek ponownie oddał głos Dominice. - Żeby dowiedzieć się więcej o energii jądrowej, zagramy w małą grę. Połowa z was będzie w drużynie protonów, a połowa w drużynie elektronów. Elektrony będą biegać wokół protonów. Protony dostaną opaski na oczy i spróbują uciec z jądra atomowego!"
atom_supreg.12.a: "Wiechowcy łączą zabawę z nauką."

atom_supreg.13.t: "Walka z wiatrakami"
atom_supreg.13.desc: "Chaos i nieporozumienie. Walka z własnym społeczeństwem jest praktycznie w każdym przypadku walką z wiatrakami. Tym razem jednak wiatraki są po naszej stronie. Zieloni terroryści chcieliby przedstawiać się jako racjonalne ugrupowanie ekologiczne, lecz po tym, czego dokonali, nie pozostaje nam nic innego niż zakrojona na pełną skalę akcja pacyfikacyjna.\n\nUlice zamieniły się w pola bitwy. Strajki są brutalnie rozbijane, lecz niczym u hydry w kolejnym mieście wyrastają nowe demonstracje, które natychmiast przeradzają się w zamieszki. Doszło do kilku przypadków sabotażu kolejowego. Jeden z nich spowodował wykolejenie pociągu pod Radomskiem i dziesiątki ofiar, ponieważ zaatakowano skład pasażerski, a nie towarowy. Krwawa walka ideologiczna znów odbiera życie niewinnym osobom postronnym.\n\nCzym różni się islamski terrorysta od ekologicznego? Być może niczym. Łączy ich ten sam kolor, a incydent w Skierniewicach, gdzie dwóch ekologów wysadziło się wraz z transformatorem energetycznym, pokazał, że są gotowi umrzeć za swoje wypaczone przekonania. Niewiele znaczy fakt, że przekonania te same w sobie nie są złe. Troska o środowisko to całkowicie słuszna idea, którą sami popieramy. Według Greenpeace energia atomowa jest jednak narzędziem diabła, mimo że nie wierzą w Boga. Widzą drzazgę w oku bliźniego i zaglądają do drugiego, licząc na znalezienie kolejnej.\n\nSzczyt absurdu osiągnięto jednak w Bełchatowie. Jeden z najmądrzejszych członków Greenpeace postanowił uderzyć w samo siedlisko zła. Trudno jednak porównywać to z naszą operacją podczas wojny domowej, kiedy neutralizowaliśmy całe bloki energetyczne. Ten konkretny ekolog wpadł na wyborny pomysł, by samotnie udać się pod elektrownię i, ku zdumieniu strażników, wystrzelić z granatnika RPG-7 w jeden z kominów chłodni. Możemy sobie tylko wyobrazić jego zaskoczenie, gdy pocisk nawet nie zarysował potężnej konstrukcji. Nie zdążył otrząsnąć się z szoku, bo strażnicy elektrowni postanowili wyzwolić go z jego jakże ambitnego życia.\n\nNie daj Boże, gdyby byli bardziej kompetentni, moglibyśmy mieć prawdziwe problemy, a historia w ironiczny sposób zatoczyłaby koło. Obecnie są jedynie nieznośnym szkodnikiem, który częściej uderza w cywilów niż w nas. Nasza administracja przetrwa tę burzę, choć zaczęliśmy już nieco chwiać się na pozycjach."
atom_supreg.13.a: "Co dalej? Rzucanie kapustą w czołgi?"

atom_supreg.14.t: "Oddział utylizacji"
atom_supreg.14.desc: "Poziom minus trzy. Otwieranie drzwi. Proszę czekać na autoryzację.\nAutoryzacja potwierdzona. Dzień dobry, panie Wiech.\n\nDziennikarz wszedł do zimnej, ciemnej sali podziemnego warsztatu, który za czasów Bractwa służył jako poligon doświadczalny dla najróżniejszych szalonych pomysłów członków Rady. Przywódca Krucjaty skierował się na drugi koniec hali, gdzie wokół urządzenia zgromadziło się kilku naukowców i żołnierzy. Na widok przełożonego stanęli na baczność, a kierujący naukowcami zwrócił się do przybysza:\n- Panie Wiechu, z radością melduję, że projekt został ukończony.\n- Doktorze Tarkowski, dobrze widzieć pana w służbie sprawiedliwości. Proszę powiedzieć, jak tego dokonaliście? Odnoszę wrażenie, że Bractwo było bardzo zainteresowane tym projektem - powiedział Wiech.\n- Tak, ale nie dbali o ludzkie życie, a my mieliśmy wyłącznie plany. Nie zdążyliśmy przejść do budowy prototypów, zanim zaatakowano nasze laboratorium... przepraszam, wyzwolono. Nie chciałem... - naukowiec zaczerwienił się, próbując naprędce ułożyć przeprosiny.\n- Spokojnie, doktorze. Nie jest pan już trybikiem w ideologicznej machinie - uspokoił go Wiech.\n\nPo upadku Bractwa Atomowa Krucjata objęła opieką wielu naukowców, którzy chętnie zmienili stronę, by kontynuować badania bez niemoralnych rozkazów z góry.\n- Tak... Dziękuję za zapewnienie! Problemem naszego projektu był grafenowy rdzeń. Był niestabilny, a z powodów ideologicznych nie mogliśmy użyć niczego innego. Zawsze mogliśmy napędzać go parą, ale byłaby to jedynie kpina z inżynierii. Teraz opracowaliśmy nowy rodzaj baterii atomowej, która bez problemu zasila urządzenie! Nazwaliśmy ją rdzeniem fuzyjnym i prawdopodobnie będziemy mogli zastosować ją nie tylko w tym projekcie, ale również upowszechnić i wprowadzić do codziennego użytku! Jest całkowicie bezpieczna, a przede wszystkim tania i uniwersalna. Proszę, niech Pan pozwoli nam zademonstrować! Sierżancie, uruchomić maszynę!\n\nTłum odsłonił obiekt zainteresowania. Za nimi stał pancerz wspomagany, na którym jeden z żołnierzy umieścił rdzeń fuzyjny i go zabezpieczył. Stalowy pancerz rozchylił się, pozwalając badanemu z łatwością wejść do środka. Wszyscy niecierpliwie czekali na dalszy rozwój wydarzeń. Całkowicie okryty pancerzem sierżant poruszył się i zrobił krok. Potem następny. I kolejny, aż ku zdumieniu wszystkich zaczął biec. Pancerz okazał się w pełni sprawny. Wiech obserwował scenę z satysfakcją. Był to przełom technologiczny, triumf czystej nauki nad ideologiczną pseudoinżynierią. Wystarczyło użyć jednego cudownego składnika."
atom_supreg.14.a: "Atom jest kluczem"

atom_supreg.15.t: "Götterdämmerung"
atom_supreg.15.desc: "- Za każdym razem na drodze naszej siły i dobrobytu stawała bez wyjątku jedna przeszkoda. Od czasów rozbiorów, czy to pod postacią Prus, nazistów, czy europejskiej \"Unii\". Cokolwiek robiliśmy, ze wszystkich sił starali się nam to utrudnić. Niemcy. Teraz, na miłość do wszystkiego, co polskie, znów podnoszą swoje paskudne łby. Możemy spodziewać się po nich najgorszego. Pokazaliśmy im, co potrafimy uczynić z technologią, którą głupio odrzucili. Nigdy nam tego nie wybaczą - Wiech górował nad swoją radą, wyglądając, jakby za chwilę miał wybrać przemoc. Nie podjęto jednak jeszcze żadnych decyzji.\n\n- Znów podnoszą łeb pomimo naszego pokazu. Atom przebił ich odnawialną energię. Po Bałutach trudno było to sprzedać, a jednak się udało.\n- Ostrożnie. Opieramy decyzje na pierwotnej emocji podpartej setkami lat naszej historii. Nie możemy jednak samotnie wystąpić przeciwko czarnemu sercu Europy - Karol Byzdra próbował ostudzić zebranie. Nie zamierzali pozwolić, by pochłonął ich gniew.\nWiech wtrącił: - Pobyt we Francji nauczył mnie jednego: mile widziane jest tam wszystko, co dopiecze Niemcom. A za ich przykładem reszta bez wahania wskoczy do tego pociągu. Włochy, Grupa Wyszehradzka... nawet Czechy.\n- Kiedy Czesi okazali nam choć odrobinę dobrej woli? Nigdy nie sprzeciwiają się Niemcom - Piotr Napierała, jak zawsze surowy, wydawał się najspokojniejszy na zebraniu, niemal jak posąg. Aż do teraz.\n- Bo się nie odważają. Czesi są uparci i w razie potrzeby będą walczyć o wolność od niemieckiego dyktatu; trzeba im tylko pokazać, że walka ma szanse - odparował Wiech.\n- Możemy razem z Francuzami prężyć muskuły do woli, ale same gesty nie zmuszą Niemiec do ustąpienia, inaczej nie zbudowaliby IV Rzeszy i nie nazwali jej Unią. Musimy uderzyć tam, gdzie zaboli - Napierała nie ustępował.\n\n- Innymi słowy, w gospodarkę. Jeśli będziemy mieli Austrię, Danię, Czechy, Francję i na wszelki wypadek Włochy, możemy całkowicie ich zablokować - Czyżewski jak zawsze myślał kategoriami surowców i pieniędzy. - Jakby Dania miała na to przystać. Nie, tę wojnę może zakończyć tylko to, co zakończyło II wojnę światową - oczy Napierały lśniły, jakby wewnątrz nich wybuchała eksplozja termojądrowa.\n- Polska flaga nad Berlinem?\n- Niekoniecznie... ale z pewnością drugie słońce. Wiecie, co mam na myśli? Oczywiście, że wiecie. Właśnie o to chodzi w naszym ruchu. Najjaśniejsza ze wszystkich gwiazd... stworzona przez nas."
atom_supreg.15.a: "Alea iacta est"

atom_supreg.16.t: "Tykająca bomba"
atom_supreg.16.desc: "Wspomnienia z frontu, wpis 48\n[GetDate], Słubice, Punkt Kontrolny Gamma 33, \n\nPo raz pierwszy stałem dzisiaj na nocnej warcie w tym wybuchowym kotle. Incydentów przygranicznych codziennie było przynajmniej kilka, ale na szczęście żaden z nich nie stał się zarzewiem otwartej wojny. Tym z góry zawsze udało się załagodzić sytuację. Wczoraj Niemcy symulowali utratę panowania nad łodzią i pustą krypą staranowali nasz patrolowiec. Na szczęście nikomu się nic nie stało. Dzisiaj rano od strony parku na południu usłyszeliśmy głośny wybuch. Szwaby wysadziły jeden z wałów przeciwpowodziowych po naszej stronie.Jak tak dalej pójdzie, jeszcze tydzień i zaczniemy w siebie strzelać ze wszystkiego co mamy. A biorąc pod uwagę ile sprzętu zgromadziliśmy po obu stronach, to i ze Słubic, i Frankfurtu nie zostanie kamień na kamieniu. \n\nWarta przebiegała w miarę spokojnie oprócz momentu w którym nad moją strażnicę nadleciały dwa małe drony cywilne. Mój towarzysz, szeregowy Wojtek otworzył ogień w kierunku jednego z nich niszcząc go, a drugi kołując wbił się bezpośrednio do jednego z namiotów na tyłach. Ci, których obudził nie pozostawili z niego nawet kabelka. Jutro chłopaki chcą wysłać balon na niemiecką stronę z głośnikiem grającym Rotę. Nie uważam żeby to był dobry pomysł, ale nie chcę donosić na kolegów...\n\nJeszcze trzy kolejne dni i zostanę zluzowany na tyły. Dowództwo stara się rotować frontowymi jednostkami jak najczęściej, rzekomo ze względów ogromnego stresu jaki na nas jest nałożony każdego dnia. W sumie mają rację, tego tylko brakuje żeby ktoś nie wytrzymał i zaczął pruć do wszystkich Niemców których widać. A widzimy ich często, w końcu są po drugiej stronie rzeki. A na moście stoimy praktycznie twarzą w twarz.\n\nMuszę napisać list do matki. Normalnie zadzwoniłbym ale ze względów bezpieczeństwa wszystkie urządzenia elektroniczne są ograniczone do sprzętu wojskowego. Tak bardzo chciałbym usłyszeć jej głos, zanim...\n...miejmy po prostu nadzieję, że góra wie co robi i nie będzie wojny. Już wystarczająco wycierpieliśmy."
atom_supreg.16.a: "Zaraz będzie padać..."

atom_supreg.17.t: "Rozmowa kontrolowana"
atom_supreg.17.desc: "Gorąca linia pomiędzy Łodzią a Berlinem stała się wręcz parząca. Kataklizm wojenny może wybuchnąć w każdej chwili, jedna iskra może wysadzić tę całą beczkę prochu jaką stała się granica polsko-niemiecka. Dlatego też Jakub Wiech, rozumiejąc powagę sytuacji, każdą możliwą chwilę starał się spędzać na konsultacjach z kanclerzem Niemiec by rozbroić tę tykającą bombę. Ale to wszystko była syzyfowa praca. Niemcy wcale nie pomagali, wręcz wydawać by się mogło że celowo zaogniają konflikt by doprowadzić do otwartej wojny.\n\nWóz albo przewóz. Ale kiedy zdecydujesz się grać va banque, musisz mieć pewność że to ty będziesz w każdym momencie rozdawał karty. Wiech podniósł słuchawkę, rozkazał połączyć się z Berlinem oraz włączyć transmisję na żywo.\n\n- Halo, Herr Wiech. Czy to jest ten dzień, w którym odbierając telefon usłyszę sensowną propozycję od pana? - nastroje w Niemczech były podejrzanie wesołe\n- 17 bilionów złotych - wypalił Wiech\n- Że co, proszę?\n- 6 bilionów 220 miliardów złotych za okupację niemiecką w latach 1939-1945 - mówił ostro, ale powoli i wyraźnie z naciskiem na każde kolejne słowo - kolejne 5 bilionów za szkody wyrządzone w trakcie inwazji roku 2025, oraz dwa lata bezustannej germanizacji, kolonializmu i wyzysku. 5 bilionów 780 miliardów za szkody wyrządzone przez Energiewende całej Europie, oraz spowodowanie katastrofy klimatycznej na kontynencie. \n- To żart, ale dość słaby. Proszę do mnie nie dzwonić w innej sprawie niż zapraszam.\nWiech zagotował się. Ich ignorancja oraz wyższość to tylko pozory. Przycisnąć ich, a w końcu pękną. Nie są gotowi na to co im przyszykowaliśmy.\n- Jestem śmiertelnie poważny. Jednocześnie chciałem poinformować, że wszystkie wolne narody Europy wzywają reżim w Berlinie do rozwiązania Unii Europejskiej w jej obecnym kształcie. Nowa organizacja międzynarodowa zajmie jej miejsce, bez niemieckiego imperializmu. Dodatkowo macie 5 lat na zrezygnowanie z zatruwania środowiska poprzez zamknięcie wszystkich elektrowni węglowych. Zanim się jakkolwiek odezwiesz to wiedz, że stoją ze mną wszystkie uciskane państwa europejskie. Wy nie wiecie kim my jesteśmy, wam się tylko wydaje. Na koniec tylko powiem, że ta rozmowa transmitowana jest na całą Europę. I zwrócę się też do was, obywatele niemieccy. Zrzućcie jarzmo neoimperialnego oprawcy i wyzwólcie swój kraj. W innym przypadku spadnie na was gniew całego wolnego świata jeżeli spróbujecie jeszcze raz prowokować wojnę. Żegnam.\n\nWiech rzucił słuchawką nie czekając na odpowiedź i opadł wyczerpany na fotel. Serce mu biło jak szalone, w głowie pędziły mu setki myśli, ale jednocześnie czuł wielką ulgę. Nie wiadomo jaka będzie reakcja Berlina ale zabezpieczył sobie wszystkie możliwe wyjścia. Nie stoją sami przeciwko wrogowi. Po raz pierwszy od dawna dostrzegł światło w bardzo długim tunelu."
atom_supreg.17.a: "Jeszcze tylko trochę..."

atom_supreg.18.t: "Zemsta za Bałuty"
atom_supreg.18.desc: "W opustoszałym drugowojennym tunelu serwisowym pod Berlinem przez ostatnie dwa lata rodziła się konspiracja. Absolutnie gargantuiczny wysiłek przemytniczy sprawił że wszystko jest już prawie gotowe. Szmuglowanie materiałów przez Czechy było łatwiejsze niż próba przeciśnięcia się przez Odrę lub od strony Bałtyku. Urządzenie jest gotowe. Jedyne na co czekamy, to sygnał ze sztabu.\n\n[GetDate]. Pada komunikat na antenie polskiego radia, prezenter zaczyna czytać fragment Konrada Wallenroda - \"Ja to sprawiłem; jakem wielki, dumny, tyle głów hydry jednym ściąć zamachem! Jak Samson jednem wstrząśnieniem kolumny, zburzyć gmach cały, i runąć pod gmachem!\". To nasz sygnał. Cała uwaga Niemiec skupiona jest na Odrze. Nie będą spodziewali się ataku od środka.\nZaładowaliśmy urządzenie do vana. Razem z docelowym, pojechało sześć innych ciężarówek by w razie wypadku odwrócić uwagę od celu numer jeden. Ja, razem z moim towarzyszem Grzegorzem jedziemy z głównym ładunkiem. To nasza ostatnia podróż, podróż z której już nie wrócimy. Pogodziłem się z tym losem już dawno. Udało nam się dostrzec nie będąc zatrzymanymi przez nikogo na Schumanstrasse, gdzie pozostawiliśmy auto, ustawiliśmy detonator, i oddaliliśmy się. 15 minut. Nie wystarczająco żeby uciec. Wystarczająco żeby dotrzeć pod Bundestag.\n\nDocieramy na minutę przed wybuchem. Sporo czasu, żeby docenić nasze ostatnie chwile. Stoimy na polu przed siedzibą parlamentu Niemiec. Nikt nas nie zauważa. Grzesiek wyciąga flagę Krucjaty, i zaczyna krzyczeć:\n- NIECH ŻYJE ATOMOWA POLSKA, PRECZ Z IMPERIALIZMEM NIEMIECKIM\nIroniczne, sami popełniamy akt najwyższego terroryzmu. Ale w domu nie będą na to patrzeć w ten sposób. To zwycięstwo. 15 sekund. Strażnicy nas zauważyli i biegną w naszą stronę. Nasze poświęcenie obudzi naród polski i wkroczy on na drogę ku zwycięstwu. 10 sekund. Z Polski właśnie wyjdzie iskra która podpali cały świat, ale nie żeby go zniszczyć, lecz odnowić. Za wolność. 5. Naszą. 4. I waszą. 3. \n- RZUĆ FLAGĘ I NA ZIEMIĘ - krzyknął jeden ze strażników po niemiecku\nDwa. \n- Widzimy się w piekle - rzuciłem pod nosem\nJeden.\n\nOślepiający błysk poraził całą populację Berlina, nad niemiecką stolicą pojawiło się drugie słońce. Jeszcze tylko chwila, i wszystko przestanie mieć znaczenie. Fala uderzeniowa zmiata wszystko co napotka na swojej drodze. Kula ognia rozprzestrzenia się i czuć już jej ciepło. Za moment już ogarnie nas atom, i odejdziemy z tego świata jako jedność scalona w symfoni pożogi. Poczułem palący ból. A potem było tylko światło."
atom_supreg.18.a: "Padł na pysk eurofaszysta fryc!"

atom_plant.1.t: "Rdzeń naszej potęgi"
atom_plant.1.desc: "- A on co tutaj robi? - zapytał oskarżycielskim tonem Czyżewski.\nWiech nie mógł liczyć na choćby odrobinę uprzejmości podczas tego spotkania. Rzeczywiście, mogła to być dyskusja, od której zależy przetrwanie państwa. Decyzja o tym, jaki rodzaj reaktora będzie napędzał naszą krucjatę.\n- Cóż... Gadomski jest naszym ministrem gospodarki. Ma takie samo prawo tu być jak ty.\nW teorii to on powinien być głównym bohaterem dyskusji, lecz Wiech nie chciał, by jego stara gwardia - Czyżewski i Byzdra - poczuła się zepchnięta na bok przez nowego człowieka, który na dodatek należał kiedyś do Bractwa. Dla równowagi postanowił zaprosić na spotkanie także Napierałę.\n - Karol, czy zechcesz przedstawić projekt, nad którym pracowaliście z Danielem?\nKarol Byzdra wstał i rozpoczął przemowę.\n- Kiedy nasza organizacja wciąż działała w podziemiu, Daniel i ja pracowaliśmy nad planami przyszłości naszej sieci energetycznej. Wszyscy widzieliście dokumenty, więc będę zwięzły. Małe reaktory modułowe wydają się zdecydowanie najlepszym sposobem zasilania naszego kraju. Mamy już przedupadkowe plany i wiemy, że tego rodzaju reaktory dadzą nam ogromną elastyczność przy dodawaniu kolejnych jednostek. Moglibyśmy z łatwością rozbudowywać sieć wraz z postępami zjednoczenia. Ponadto bylibyśmy znacznie mniej podatni na ataki wroga. Jeden duży reaktor stanowiłby idealny cel dla każdego, kto chciałby sparaliżować nasz kraj, czego dowiedliśmy podczas ataku na Bełchatów. Mam nadzieję, że Wielki Ekolog skłoni się ku realizacji naszej wizji.\nGadomski podniósł rękę.\nJeśli można, mam kilka zastrzeżeń do tej propozycji.\n - Proszę mówić - Wiech wykonał zachęcający gest dłonią.\n - Sugerowałbym... bardziej scentralizowany system. System oparty na istniejącej infrastrukturze. System, który zapewniłby zatrudnienie pracownikom obecnych elektrowni. Byłby też wielkim, widocznym symbolem zmiany, nie sądzicie?\n - Scentralizowany system to dobry pomysł - Napierała zawsze musiał mieć ostatnie słowo. - Moglibyśmy sprawować znacznie większą kontrolę nad scentralizowaną siecią. Tutejsi ludzie są zbyt głupi, by docenić energię atomową. Potrzebujemy monumentalnego symbolu atomowej dominacji.\nRozpoczęła się wyczerpująca dyskusja o kwestiach technicznych i szczegółach obu wizji.\n - Jak zawsze decyzja należy do pana, Wielki Ekologu - Czyżewski podsumował długą debatę."
atom_plant.1.a: "SMR-y będą przyjaźniejsze dla środowiska"
atom_plant.1.b: "Atomowe serce zabije w Bełchatowie!"

atom_plant.2.t: "Cena naszych pragnień"
atom_plant.2.desc: "Wielki Ekolog garbił się nad biurkiem, studiując najnowszą partię dokumentów - rysunki techniczne, niedopracowane podsumowania, kosztorysy... wszystkie prowadziły do jednego wniosku: projekt był nie lepszy niż hazard, a on musiał postawić wszystko, by mieć choć najmniejszą szansę powodzenia. Już czwartą godzinę szukał możliwych ulepszeń, desperacko próbując zwiększyć wydajność, a jego myśli oświetlał jedynie słaby blask przygaszonej lampy. Wiech był w swoim żywiole, bez przerwy sporządzając notatki, jakby wszedł w atomowy stan zen. \n\nPogrążony w myślach dziennikarz nie zauważył obecności Gadomskiego, dopóki minister nie zaczął mówić. Jego głos wyraźnie przestraszył Wiecha i siłą sprowadził go do rzeczywistości. \n- Słuchaj, nie chcę zanadto przeszkadzać, ale nie możesz tego kontynuować. Jeśli chodzi o zasoby, ledwo stoimy na nogach. Możesz mieć swój reaktor, ale czy nie możesz zaczekać, aż przestanie grozić bankructwem całego kraju? \nOśmielony Gadomski rzucił na solidne mahoniowe biurko gruby stos raportów gospodarczych. Pierwsza strona krzyczała jaskrawoczerwonym drukiem: \"Alarm: deficyt krytyczny\". \nWiech rzucił okiem na schludne podsumowanie, udając, że naprawdę rozważa ostrzeżenia ministra, lecz decyzję już podjął. Był wizjonerem i nie pozwoli, by sprawy tak błahe jak obawy o finansowanie stanęły na drodze jego marzeniom. \n- Decyzja już zapadła, Witold. Nie cofnę wszystkiego przez jakieś liczby na kartce - odpowiedział znudzonym tonem Wiech. \nOdruchowe zlekceważenie zirytowało Gadomskiego, odsłaniając cień frustracji pod jego zwykle spokojną powierzchownością. \n- Zaprzęgasz całą naszą przyszłość do pomysłu, który zawodził za każdym razem, gdy go próbowano. Zapamiętaj moje słowa. Kiedy twój ukochany projekt sprawi, że będziemy zdychać w jakimś nienazwanym rowie, lepiej pamiętaj, kto próbował przemówić ci do rozsądku. \n\nZanim Wiech zdążył odpowiedzieć, Gadomski wyszedł już z gabinetu, zostawiając ekologa sam na sam z myślami. Wracając do planów rozrzuconych po biurku, wymamrotał:"
atom_plant.2.a: "- Doprowadzę to do końca. Z tobą albo bez ciebie."

atom_plant.4.t: "Mente et Malleo"
atom_plant.4.desc: "- Zakłady Przemysłowe R-1 były strefą wydobycia i przetwarzania uranu, stworzoną i zbudowaną w czasach Polski Ludowej. I właśnie dlatego musimy zejść do tych przeklętych grobowców. Przypadło nam niewdzięczne zadanie wejścia do jednego z zabitych deskami tuneli, opuszczonego od co najmniej, ilu, ponad 60 lat? Kurwa, cudownie... \n\nZimne powietrze, mokra posadzka i chlupot kaloszy, a wszystko oświetlone wyłącznie lampką na hełmie górniczym. Świeżo upieczony inżynier z Wrocławia nie mógł sobie wymarzyć bardziej luksusowej pierwszej pozycji w CV. \n- Przestań narzekać do tego dyktafonu, Miłosz, i pomóż mi z tymi jebanymi deskami! Masz dokumentować na tym złomie nasze odkrycia. Bóg jeden wie, ile jeszcze twojego bełkotu to ustrojstwo pomieści! \nCzłowiek, z którym przydzielono go do szkolenia w pracy, był najbliższym możliwym przeciwieństwem młodego inżyniera: szorstkim, mniej więcej pięćdziesięcioletnim górnikiem z Lubina, wybranym ze względu na dziesięciolecia doświadczenia w KGHM. Mogłoby się ono rzeczywiście przydać, gdyby zrzędliwa postawa siwobrodego nie zniechęcała Miłosza do poważnego traktowania jakichkolwiek jego rad. \n- Dobra, dobra, nie musisz krzyczeć, Lucjan. Podaj łom. \n\nPo pewnych zmaganiach i serii głośnych uderzeń spróchniałe dębowe deski ustąpiły, odsłaniając zakurzoną, starą część kopalni. Dotychczas obszar, przez który musiała przejść para, był w dość kiepskim stanie, lecz przynajmniej miał jako tako działające oświetlenie. Przed nimi rozciągała się jednak jednolicie czarna otchłań, pozornie ciągnąca się w nieskończoność. Zanim Miłosz zdążył choćby skomentować ciemny tunel, Lucjan ruszył naprzód, zupełnie niewzruszony tym, co mogło ich czekać. \n\nPodczas marszu wilgotnym korytarzem duet nie napotkał zbyt wielu rzeczy, których by się nie spodziewał. Nieutrzymywane podpory i zardzewiałe tory dla wózków towarzyszyły im przez całą nerwową drogę, aż w końcu trafili na niezwykle ciekawe znalezisko: wózek pełen materiałów wybuchowych. Najdziwniejsze było to, że oznaczenia nie pasowały stylem do reszty sprzętu i tablic w obiekcie. Wyglądały zbyt nowocześnie w porównaniu z osobliwymi krojami pisma widocznymi wszędzie wokół. Pomimo konsternacji ruszyli dalej, odnotowując obecność tego niepasującego do epoki wózka. \n\nPlanowana wyprawa została jednak nagle przerwana. W miejscu, gdzie tunel miał biec dalej, zespół znalazł zawał i dobywający się z niego, bezbłędnie rozpoznawalny odór zgnilizny. Badając go z bliska i ledwie znosząc smród, znaleźli grubą gumową rękawicę, z której wystawało gnijące ramię znikające pod skałami na wysokości łokcia. Nadal tkwiły na nim resztki rozkładającego się mięsa."
atom_plant.4.a: "Co tu się, do cholery, wydarzyło?"

atom_plant.5.t: "Wywłaszczona rudera"
atom_plant.5.desc: "- Co to znaczy, że wydano pozwolenie na wydobycie uranu? Tu nie ma nic poza kamieniami! - stary dziad w słomkowym kapeluszu i niebiesko-czerwonych ogrodniczkach siedział na bujanym fotelu, ledwie zwracając uwagę na wiechowskiego urzędnika, który wysiadł z furgonetki i wszedł na zaniedbaną, ciemnobrązową posesję. Pachniało tu maszynami z lat 70., które starzec jakimś cudem utrzymywał w ruchu, oraz świńskim gównem, ale głównie świńskim gównem. \n- Właściwie to samorząd nie wydał żadnego pozwolenia. Nie było potrzebne. Za pańskie grunty otrzyma pan rekompensatę w postaci opuszczonej działki w innej części kraju. \nOficjalny ton urzędnika i jego świta przyciągnęły uwagę rolnika, który wstał i podszedł, próbując mu się postawić.\n- N-I-E! - wrzasnął - W całym tym kraju nie ma uranu, więc po prostu o tym zapomnijcie! - ciągnął, lecz ludowa mądrość nie mogła się równać z Krucjatą. \n- W tutejszych organicznych fosforytach występuje do 600 ppm... - zaczął wiechowiec. \n- Czyli mówisz mi, że zabierasz MOJE gospodarstwo, bo chcesz wydobywać uran z podziemnego gówna? - rolnik zarechotał. \n- Mówię, że jeśli Brat Wiech zechce zbudować tutaj diabelski młyn, to gospodarstwo zamieni się w diabelski młyn! Zapłacimy za remont i przeprowadzkę, czego jeszcze Pan chce? \n- Chcę... miliona euro! - dotąd szorstka mowa rolnika przeszła w dziwny skowyt, po części wilczy, po części alarmowy. \nUrzędnik głęboko westchnął. Z tym dało się pracować. Drogo, lecz do przyjęcia. Wtedy starzec uśmiechnął się jednak, pokazując na wpół czarne zęby. \n- Dobrze, przepraszam, źle się wyraziłem. Sto... MILIARDÓW euro! - po czym z zadowoloną miną zaczął dłubać palcem w zębach. \n- Dość tego. Strażnicy, zabierzcie mi tego dziada sprzed oczu - urzędnik miał już po dziurki w nosie wybryków starowinka. Cały zgniły budynek trzeba będzie zrównać z ziemią; niczego nie da się wykorzystać ponownie. Kiedy jednak staruch i jego świnie zostaną przeniesieni, będzie można naprawdę zabrać się do pracy. Może nawet załatwi mu jakieś nowe maszyny rolnicze, bo widok starca wijącego się i wrzeszczącego w drodze do więźniarki wzbudził w nim odrobinę współczucia. Mimo to wyciągnął przyrządy pomiarowe i zaczął biegać po skałach i polu: plany wydobycia wciąż wymagały zatwierdzenia i poprawek. Kopalnia odkrywkowa czy nie, potrzebował miejsca na niezwykle dokładne przetwarzanie, by wycisnąć stąd choć odrobinę uranu."
atom_plant.5.a: "Ostatecznie okazało się, że działka była bezwartościowa."

atom_plant.6.t: "Je me souviens"
atom_plant.6.desc: "Kwestia importu uranu ma kluczowe znaczenie dla powodzenia naszych projektów jądrowych, dlatego Jakub Wiech powierzył ją najlepszym ludziom w Ministerstwie Spraw Zagranicznych. Ponieważ stanowiska Francuzów i Kanadyjczyków były niepewne, pozyskanie ich poparcia stanowiło dość delikatną sprawę. Ludwik i Karol wiedzieli, co należy zrobić. Pierwszy miał zająć się Francuzami, drugi Kanadyjczykami.\n\nPierwszym krokiem Karola było zorganizowanie w Łodzi bankietu, na który osobiście zaprosił ambasadora Kanady. Miał pewne wątpliwości co do planu, lecz nie potrafił wymyślić innego sposobu. Ku jego zaskoczeniu Kanada przyjęła zaproszenie i wysłała do Łodzi korpus dyplomatyczny. Wiedział, że wydarzenie musi być doskonałe, a oni muszą pokazać szanownym gościom swoją najlepszą stronę. \n- W menu muszą znaleźć się polskie dania narodowe! Po co mieliby jeść coś, co mają u siebie? - krzyczał na kucharza.\nGdy przygotowania do bankietu dobiegały końca, Karol pomyślał o ostatnim dodatku, który urozmaici okazję - wódce.\nGoście przybyli, wydarzenie przebiegło pomyślnie, a dyplomaci wydawali się bardziej niż zadowoleni, choć równie dobrze mógł przemawiać przez nich alkohol. Karol postanowił wykorzystać okazję i zabrał ambasadora Kanady na balkon, by omówić umowę.\n- Proszę spojrzeć, jesteśmy w rozpaczliwej sytuacji. Obiecaliśmy przekształcić nasze elektrownie, lecz zanim zdołamy wydobyć własne zasoby, musimy też część importować. Wiem, że wasz kraj ma mnóstwo uranu na...\n- Charles - przerwał ambasador. - Rozumiem, że to dla was sprawa kluczowa i otrzymałeś misję, ale ja również działam według wytycznych przełożonych. Innymi słowy... nie ufają waszemu ruchowi. Jesteś tylko kolejnym watażką pośród tej hołoty i nie wiadomo nawet, czy przetrwasz. C'est la vie. Muszę jednak przyznać, że bankiet był wspaniały.\n\nKarol bał się wrócić do Wiecha z pustymi rękami, zwłaszcza po wydaniu tak wielkiej sumy na bezcelowe wydarzenie. Gdy wszedł do Ministerstwa Spraw Zagranicznych, serce zaczęło bić szybciej. Usiadł na miejscu, spięty i blady.\n- Jakub, ja... ja... ambasador...\n- Nie martw się, wiem o wszystkim - przerwał Wiech. - To już nieważne; Ludwik zapewnił nam umowę z Francuzami. Sprzedadzą nam uran i kanadyjski i nigeryjski. Przynajmniej pomogłeś nam nawiązać stosunki z Kanadyjczykami.\nWychodząc z pokoju, Karol odetchnął z ogromną ulgą. Ludwik został wprawdzie obsypany pochwałami, lecz Karol zachował posadę, a tylko to się liczyło."
atom_plant.6.a: "Gdy Kogut zdecydował się pomóc, Bóbr pozostał sceptyczny."

atom_plant.7.t: "Obcy w obcym kraju"
atom_plant.7.desc: "Sześciogodzinny lot od ostatniej przesiadki dał Arturowi aż nadto czasu, by znienawidzić tajność swojej misji. Nawet na wpół śpiąc, po samym poziomie turbulencji doskonale rozpoznał, że samolot zbliża się do Windhuku. Mógłby przysiąc, że stary Boeing jest o minutę od rozpadnięcia się na kawałki, a ta jedna myśl utrzymywała go przytomnego skuteczniej niż niewygodny zagłówek i przedni fotel, który bez przerwy miażdżył mu kolana. Przez całą podróż nie pragnął niczego poza rzuceniem się na najbliższe łóżko i odespaniem koszmarnej drogi. Kiedy jednak polski wysłannik wreszcie postawił stopę na zaniedbanym pasie startowym i zobaczył całą delegację skandującą jego imię, uznał, że już śni. \n\nCzerwony dywan, orkiestra marszowa triumfalnie wygrywająca hymn gospodarzy, potok pochwał od człowieka tytułującego się ministrem kopalń i energii - wszystko to tylko pogłębiło ból głowy niewyspanego dyplomaty. Szybko połknął dwie tabletki ibuprofenu, po czym wraz ze świtą został niechętnie wepchnięty do rządowego samochodu. Następne trzy godziny zlały się w mgłę. Zamiast spodziewanej krótkiej wycieczki po stolicy jazda trwała dalej i przecinała otaczającą sawannę w nieznanym kierunku. Grzeczność nakazywała Arturowi rozmawiać z urzędnikiem pełniącym rolę miejscowego przewodnika, lecz w otępieniu potrafił jedynie ograniczyć się do wyuczonych zwrotów propagandowych. \nGdy kopalnia Rössing nagle ukazała się jego oczom w całej okazałości, Artur był pewien, że przekroczył granicę między rzeczywistością a halucynacją. Była większa niż wszystko, co dotąd widział, przyćmiewając nawet potęgę bełchatowskiej odkrywki. Po krótkim spacerze po terenie wydobycia w pełnym żarze pustynnego słońca - wyraźnie urządzonym głównie po to, by zaimponować ambasadorowi - grupa udała się do niepozornej szopy służącej za centrum operacyjne kompleksu. \nPrzekonany, że dostatecznie zmiękczył wysłannika, minister przeszedł do ofensywy i zaczął sondować zataczającego się dyplomatę w poszukiwaniu możliwych ustępstw. \n- Wie pan, panie Zawadzki, rząd Namibii chętnie współpracowałby z waszym narodem, ale z pewnością zna pan sytuację na północy. Jeśli buntownicy posuną się dalej, mogą odciąć nasze szlaki eksportowe. Potrzebujemy was równie mocno, jak wy nas. \n- Och... a dlaczego po prostu... ich nie odeprzecie? - odparł Artur w sennym otępieniu, tylko częściowo rejestrując skierowane do niego słowa. \n- Bardzo byśmy chcieli, ale nie mamy nawet w przybliżeniu dość broni, by przełamać impas. Ostatnia ofensywa już zmusiła nas do odwrotu. \n- Broń... mamy trochę broni... możemy się podzielić... \n- Dziękuję, panie Zawadzki, to dla nas niezwykle wiele znaczy. Pójdę przygotować dokumenty. \n\nDelegacja wróciła z gotową umową po zaledwie pięciu minutach pospiesznego bazgrania. Dokument roił się od błędów, które tak wybitny dyplomata jak on powinien natychmiast zauważyć, lecz gdy Artur udawał, że czyta liczne warunki i postanowienia dotyczące tajnych dostaw broni, potrafił skupić wzrok jedynie na polu podpisu. Przeczytał tekst traktatu w rekordowym tempie i wpisał na dole swoje nazwisko, oficjalnie powołując umowę do życia. Zadowolony Artur osunął się na biurko i zasnął, zanim minister zdążył rozpocząć świętowanie."
atom_plant.7.a: "Przynajmniej podróż powrotna wydawała się przy tym znacznie znośniejsza."

atom_plant.8.t: "Ostatni lot kormorana"
atom_plant.8.desc: "Marzena wiedziała, co musi zrobić. Szybko wskoczyła do samochodu i pojechała z domu w Krynicy Morskiej do Kątów Rybackich. Kiedy dotarła na miejsce, byli tam już inni członkowie Greenpeace. Natychmiast dołączyła do grupy i uniosła transparent z napisem \"Wiech = Ziemkiewicz\". Pozostali protestujący mieli podobne tablice, porównujące Wiecha do Kaczyńskiego, szejków albo Trumpa. Szybko utworzyli blokadę na drodze prowadzącej przez Mierzeję Wiślaną. W okolicy znajdowało się wiele rezerwatów przyrody, z których najważniejszy był Park Krajobrazowy. Protestujący z Greenpeace szybko przyjęli kormorana za swój symbol. Wszystko po to, by chronić ptaki przed eksploatacyjnymi planami Wiecha. Protesty rozlały się po okolicy, a blokady powstały na drogach z Gdańska, Nowego Dworu Gdańskiego i Elbląga. \n\nMarzenę przytłoczyła reakcja ludności. Jej zamiary nie pokrywały się jednak z ich intencjami.\n- To zrujnuje turystykę w okolicy - powiedział dyrektor Ośrodka Wypoczynkowego Panorama.\n- Jego polityka to czysty nonsens. Kaczyński nigdy by czegoś takiego nie zrobił - stwierdziła starsza kobieta.\n- Kormorany są czarne jak węgiel, a on ukradł nam ten skarb - krzyczał miejscowy sprzedawca.\n- Atom nie jest nawet zdrowy, czy jego wydobycie tutaj nie zatruje powietrza? - zapytał przechodzień.\n- Po prostu chcę mieć dziś wolne - powiedziała Julia, pracownica Panoramy.\n\nWkrótce protestujący spotkali się jednak z reakcją Wiecha. Policja wraz z niewielkim pułkiem Krucjaty wkroczyła do miejscowości i zaczęła rozpędzać protesty. Gdy przybyli, większość uczestników zamieszek uciekła i pozostali jedynie członkowie Greenpeace. Otrzymali ultimatum: albo ustąpią, albo zostaną aresztowani i osądzeni. Niektórzy się poddali, inni, tacy jak Marzena, nie ustąpili. Wtedy coś rzuconego przez jednego ze strażników szybko trafiło ją w głowę, a ona obudziła się w radiowozie jadącym na komisariat. Przez małe okna pojazdu patrolowego zobaczyła stado kormoranów odlatujących znad Mierzei. Wiedziała, że poniosła klęskę, a prace już się rozpoczęły."
atom_plant.8.a: "To z pewnością nie pomoże naszej sprawie."

atom_plant.9.t: "Utracony raj"
atom_plant.9.desc: "Marcin spędził całe życie, obecnie to już będzie ponad czterdzieści lat, w niczym niewyróżniającej się wsi Rajsk. Z czasem nauczył się rozpoznawać niemal każdy samochód wjeżdżający do powoli wyludniającej się osady i z niej wyjeżdżający - zadanie znacznie ułatwił Upadek, ograniczając podróże do tych naprawdę koniecznych. Nikt nie fatygowałby się w te strony bez konkretnego celu, toteż takie miejsce pozostawało w dużej mierze zdane na siebie. \n\nNieznany ruch ograniczał się do rzęchów prowadzonych przez zagubionych wędrowców, więc nagły widok nieskazitelnie czarnego sedana wprawił Marcina w całkowite osłupienie. Nie znał tego modelu; był cudem inżynierii, którego rozdarty wojną kraj po prostu nie potrafił wyprodukować. Musiał należeć do kogoś ważnego. Uważnie śledził samochód przez całą drogę przez wieś, zastanawiając się, czy zwiastuje nadejście lepszych czasów. Uznał go za jednorazowy przypadek, lecz wkrótce żałował, że nie przegonił auta, kiedy miał okazję. \n\nŻycie w środkowej części Podlasia miało własny rytm, niczym meandrująca rzeka, której bieg wyznaczyły setki lat niezakłóconej izolacji. W maleńkiej wsi Rajsk nurt napotkał jednak skałę, która zmieniła go w wzburzony potok. Choć Marcin o tym nie wiedział, jego dom stał na skrzyżowaniu historii, a on miał stać się jedną z ofiar postępu. \n\nNiecały tydzień po pierwszym pojawieniu się samochód wrócił. Wysiadł z niego niski mężczyzna w okularach, który ignorował wszystkie pytania, sporządził szczegółową mapę wsi, zapisał nieznane uwagi i wypełnił sterty dokumentów. Następnego dnia przybyła ekipa budowlana wraz z uzbrojoną eskortą. Na posesję Marcina wjechał ogromny buldożer, gotując się do ciosu, który zniszczy dorobek mieszkańca. Wybiegł z domu akurat w chwili, gdy budynek runął po uderzeniu kuli wyburzeniowej. Krzyczał na urzędnika, dopóki nie zabrakło mu tchu. \n\nZapewnienia o nowym domu podarowanym mu przez państwo niczego nie zmieniły, podobnie jak pokaźna suma zaoferowana w ramach rekompensaty za to samowolne wywłaszczenie. Każde słowo urzędnika tylko bardziej rozwścieczało Marcina i po krótkiej chwili sprzeczka przerodziła się w bójkę. Plama czerwieni splamiła idealnie wyprasowaną flanelę biurokraty - był to ostatni obraz zwycięstwa, jaki zobaczył mieszkaniec wsi, zanim pałka rozjemcy pogrążyła go we śnie."
atom_plant.9.a: "Do końca życia miał nadzieję, że pewnego dnia wróci do Rajska. Nie było jednak do czego wracać..."

