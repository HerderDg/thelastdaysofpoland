ATM_fission_desc: "Po latach skrupulatnych przygotowań prowadzonych tuż pod nosem Ziemkiewicza, w ruinach Bałut, jesteśmy gotowi dać Bractwu to, o co się prosiło. To, czego się obawiało. To, o czym bredziło w swoich obłąkanych przemówieniach. Atomową Krucjatę. Wierzymy, że nie jest jeszcze za późno, by uratować Polskę przed tymi węglowymi rzeźnikami, nawet jeśli otaczające nas spustoszenie zdaje się temu przeczyć. Zanim jednak naprawdę ruszymy, nasza sprawa musi zdobyć wystarczające poparcie społeczne poprzez ujawnienie kłamstw Bractwa. Wydaje im się, że dzięki posłusznym tubom propagandowym mają monopol na prawdę, lecz nie mogliby bardziej się mylić. A czy istnieje lepszy sposób na pokazanie wszystkim skali oszustwa niż odezwa \"od dawna martwego\" Jakuba Wiecha?"
ATM_supplies_from_lodz_desc: "Choć nasza kampania zbrojnego oporu przeciw Bractwu dopiero się rozpoczyna, do powstania przygotowywaliśmy się od bardzo dawna. Przez lata zakładaliśmy liczne skrytki z zaopatrzeniem w mrocznych zakamarkach łódzkiej miejskiej dżungli. Znalazło się w nich wszystko: od prowizorycznej broni i domowych materiałów wybuchowych po prymitywne uzbrojenie przeciwpancerne, które, miejmy nadzieję, zdoła choć trochę uszkodzić elitarne jednostki wroga. Dzięki współpracy z miejscowymi grupami partyzanckimi nawet obecna okupacja miasta i brutalne represje sił Ziemkiewicza nie naruszyły bezpieczeństwa naszej doskonale ukrytej kontrabandy. Teraz, gdy nadeszła właściwa chwila i otwarcie chwytamy za broń, możemy wreszcie wykorzystać zakonspirowany arsenał przeciwko naszym nemezis."
ATM_apocalyptic_roads_desc: "Wraz z postępem podbojów Bractwa rosło jego samozadowolenie. Bełchatowskie elity, będące obsesyjnymi narcyzami, szybko uwierzyły we własną propagandę o niezwyciężonej potędze i nabrały pełnego przekonania, że każdy przeciwnik jest od nich bezgranicznie gorszy. Z czasem uzbrojone eskorty ochraniające konwoje z najważniejszymi towarami przemierzające województwo stawały się coraz słabsze, gdy złudne poczucie bezpieczeństwa zakorzeniło się w umysłach Paladynów. Teraz, kiedy prowadzimy otwartą wojnę, konwoje są uczciwym celem, a my możemy wykorzystać ich spuszczoną gardę i przejąć cenne zaopatrzenie. Żadna droga nie będzie dla nich bezpieczna. Żaden transport nie pozostanie poza naszym zasięgiem. Całkowicie sparaliżujemy Bractwo, odcinając wszelki przepływ zasobów między jego garnizonami."
ATM_strike_at_nucleus_desc: "Zawsze wiedzieliśmy, że ten dzień nadejdzie. Jeszcze przed Upadkiem, Elektrownia Bełchatów była solą w oku każdego ekologa po tej stronie Odry. Jest wydajna, boleśnie wydajna, i w zawrotnym tempie wypluwa ze swoich kominów śmiercionośny czarny dym, lecz pal to licho - Paladyni uczynili z niej symbol, wokół którego się jednoczą. Pora raz na zawsze ten symbol zniszczyć. Cel jest prosty: musimy pokazać ludności, że nawet najświętsze miejsca Bractwa nie są nietykalne. Zwycięstwo propagandowe w zupełności wystarczy, ponieważ rzeczywiste zniszczenie całego zakładu samym sabotażem byłoby niemal niemożliwe. Nie chcielibyśmy nawet próbować, gdyż Wiech zdaje się mieć własne plany dotyczące przyszłości elektrowni."
ATM_reach_the_dissidents_desc: "Wewnętrzne mechanizmy rady są... w najlepszym razie mętne. Czterej Paladyni zamknęli się w porcelanowej wieży, pozornie poza naszym zasięgiem, lecz w ich strukturze widać pewne pęknięcia. Pozostali płoną pasją niczym ukochany węgiel i pomstują na atom, jakby jutra miało nie być, podczas gdy Gadomski zawsze pozostawał outsiderem - zarówno pod względem gorliwości, dziennikarskiej przeszłości, jak i polityki gospodarczej. Musimy działać niezwykle ostrożnie, by nie narazić naszego wywiadu, lecz powinniśmy wykorzystać okazję, nawiązać z nim kontakt i przekonać go do wyłamania się z szeregu oraz pomocy w poruszaniu się po dysfunkcyjnej machinie, jaką jest gospodarka Bractwa."
ATM_black_market_connections_desc: "Podziemny tryb życia nie pozwala nam wyspecjalizować się w żadnej dziedzinie bez poważnego zaniedbania innej. Nasi agenci muszą być samowystarczalni i elastyczni. Podczas przymusowego wygnania na Bałutach opanowaliśmy sztukę szabru, lecz dotychczas nie zdołaliśmy wyszkolić wyspecjalizowanych przemytników broni. Jeżeli chcemy zdobyć uzbrojenie bardziej zaawansowane niż zbieranina prowizorycznych karabinów i kijów bejsbolowych, potrzebujemy pomocy z zewnątrz. Pora wejść w moralną szarą strefę i zawrzeć umowę z handlarzami bronią działającymi na czarnym rynku. W obecnym położeniu niewiele możemy zaoferować kupcom śmierci, lecz dopilnujemy, by po zakończeniu wszystkiego otrzymali sowitą zapłatę."
ATM_makeshift_workshops_desc: "Struktura Bractwa może nie być aż tak przegniła, jak sądziliśmy. Pierwsze starcia z jego żołnierzami dowiodły, że wysiłek wojenny prawdopodobnie pochłonie znacznie więcej wyposażenia, niż zgromadziliśmy w skromnych łódzkich skrytkach lub kupujemy powolnym strumieniem na czarnym rynku. Potrzebujemy ośrodków produkcyjnych, i to szybko. W naszych obecnych, surowych warunkach nie ma mowy o budowie stałych fabryk wojskowych, lecz prostsze instalacje nadal wchodzą w grę. Prowizoryczne warsztaty nie zapewnią wyposażenia najwyższej jakości, ale na razie powinny wystarczyć do załatania luk w łańcuchu dostaw."
ATM_god_particles_desc: "Odwołajcie się do miłości dawnych Razemków do Atomu. Wskażcie, że Izrael wykorzystuje energię jądrową. Powiedzcie, że dajecie im szansę walczyć z samym Azazelem! Nie wiemy, co jeszcze mogłoby przekonać Żydów z Widzewa do udzielenia nam pomocy, lecz nasi dyplomaci z pewnością wykorzystają wszystkie możliwe sztuczki. Niech przestudiują Talmud w poszukiwaniu elementów doktryny, które mogą się przydać. Dopilnujcie, by wytrzymali krytykę nawet najbardziej wymagających rabinów. Tylko bez stereotypowego wciskania im pieniędzy w zamian za wsparcie. Chyba że okaże się to konieczne..."
ATM_red_forest_desc: "Cóż, to powinno być łatwe. Jeżeli istnieje frakcja, która nienawidzi rządów Ziemkiewicza równie mocno jak my, muszą nią być kochający przyrodę harcerze. Zważywszy na ich skłonność do obskurantyzmu, nie możemy być pewni ich stosunku do energetyki jądrowej, lecz nawet oni muszą dostrzec, że jesteśmy co najmniej mniejszym złem. Plan jest prosty: pojawić się, podburzyć ich przeciw naszym wrogom i patrzeć, jak lasy zapłoną gniewem.\nA jeśli nie potrafimy przekonać czcicieli lasu, że reżim rozpoznawalny po wyrzucających smog kominach i dosłownie wielbiący zanieczyszczenie jest zły... Cóż, w takim razie równie dobrze możemy odwołać całą Krucjatę."
ATM_nuclear_commando_desc: "Muszą istnieć jacyś pachołkowie Sapkowskiego, których da się wykorzystać ponownie po wcześniejszych kampaniach, w celu zdobycia przewagi. Wyznawcy Wiecznego Ognia najpewniej już dołączyli do szeregów Bractwa ze względu na wysoce konserwatywne poglądy, rycerską estetykę i zamiłowanie do palenia rzeczy. Można jednak bezpiecznie założyć, że odniesiemy przynajmniej częściowy sukces, werbując bardziej postępowe i ekologicznie nastawione Scoia'tael. Są... co najmniej ekstrawaganccy, a nasze większe plany prawdopodobnie całkowicie ich przerosną, lecz liczy się wyłącznie to, że potrafią walczyć. Jak dla nas ci dzikusi mogą nawet traktować energię atomową jak kolejny rodzaj magii."
ATM_send_the_courier_desc: "Ponieważ właściwa Łódź jest najgęściej zaludnionym obszarem całego województwa, zdobycie tam znacznego poparcia powinno być stosunkowo łatwe. Poza tym znacznie prościej przeniknąć do wielkiego miasta, gdzie można zniknąć w każdej ciemnej uliczce lub podejrzanym mieszkaniu, niż do wsi, w której każdy starszy zna wszystkie miejscowe sprawy. Musimy tylko wysłać jednego z naszych agentów przebranego za zwykłego kuriera, aby zebrał rozproszone komórki powstańcze i poprowadził atak na ufortyfikowane pozycje zbudowane przez rząd Hołowni."
ATM_blood_money_desc: "Skrzydlewski i jego rodzina z pewnością nie są zadowoleni ze stanu swoich kwiatów pod rządami Bractwa. Nawet jeśli może zrekompensować sobie straty większym popytem na pogrzeby, wynikającym z mnóstwa chorób płuc wywołanych smogiem, możemy wykorzystać wiszące nad nim niebezpieczeństwo nacjonalizacji na kaprys Ziemkiewicza, aby przeciągnąć go na naszą stronę. Dodajmy do tych argumentów kilka hojnych łapówek od ręki oraz obietnicę kolejnych po przejęciu województwa, a otrzymamy ofertę, której stary łajdak nie zdoła odrzucić. Kwadratowy łeb powinien słuchać szefa jak posłuszny pies, a dopóki utrzymają w ryzach tego trzeciego, wszystko będzie dobrze."
