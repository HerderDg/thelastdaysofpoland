atom_plant.1011.t: "Negocjacje z KGHM - Sukces"
atom_plant.1011.desc: "Jedną z firm żywo zainteresowanych budową małych reaktorów modułowych był KGHM, który przed Upadkiem miał ambitne plany wzniesienia elektrowni w wielu miejscach pozostających w jego strefie wpływów. Katastrofa roku 2025 położyła kres wszystkim projektom związanym z energią jądrową. Jednak zarówno umowy i projekty, jak i dokumentacja lokalizacyjna pozostały gdzieś w archiwach tych przedsiębiorstw. Skoro KGHM nadal funkcjonuje jako jeden z elementów polskiej anarchii, a my zawarliśmy umowę z jego dawnym partnerem, NuScale, rozsądnie było zwrócić się z propozycją współpracy. Pozyskanie tak ważnego sojusznika stanowiłoby przecież znaczący krok nie tylko ku realizacji projektu jądrowego, lecz także ku zjednoczeniu kraju.\n\nNa szczęście KGHM okazał się żywo zainteresowany strategiczną współpracą. Nasz wysłannik, skierowany do Lubina z konkretnymi propozycjami, wrócił z podpisanym paktem gwarantującym współpracę przy budowie reaktorów oraz wzajemne zobowiązania sojusznicze w razie agresji innych watażków. Tajemnicą pozostaje, w jaki sposób pogodzimy nasze interesy z ich interesami. To my stoimy jednak na silniejszej pozycji, więc po nieuniknionym zwycięstwie będziemy mogli wymusić pokojowe zjednoczenie - ofertę, której nie będą mogli odrzucić."
atom_plant.1011.a: "Fuzja idealna."

atom_plant.2011.t: "Negocjacje z KGHM - Porażka"
atom_plant.2011.desc: "Jedną z firm żywo zainteresowanych budową małych reaktorów modułowych był KGHM, który przed Upadkiem miał ambitne plany wzniesienia elektrowni w wielu miejscach pozostających w jego strefie wpływów. Katastrofa roku 2025 położyła kres wszystkim projektom związanym z energią jądrową. Jednak zarówno umowy i projekty, jak i dokumentacja lokalizacyjna pozostały gdzieś w archiwach tych przedsiębiorstw. Skoro KGHM nadal funkcjonuje jako jeden z elementów polskiej anarchii, a my zawarliśmy umowę z jego dawnym partnerem, NuScale, rozsądnie było zwrócić się z propozycją współpracy. Pozyskanie tak ważnego sojusznika stanowiłoby przecież znaczący krok nie tylko ku realizacji projektu jądrowego, lecz także ku zjednoczeniu kraju.\n\nNiestety KGHM nie był zainteresowany strategiczną współpracą i przedłożył własne interesy nad dobro wspólne. Nie przekonała go nawet propozycja sojuszu wojskowego, w ramach którego mielibyśmy obowiązek przyjść mu z pomocą w razie wojny. Może to i lepiej; ten gest dobrej woli był przecież korzystniejszy dla nich niż dla nas. Poradzimy sobie samodzielnie, a umowa z NuScale nadal gwarantuje nam pomoc z zagranicy."
