## Characters ##
POLITICS_WIECH_DESC: "W wielu aspektach Jakub Wiech stanowi antytezę nauk Ziemkiewicza, idealnego straszaka, na którego można zrzucić całą winę za niepowodzenia Bractwa. Pomimo, że ogromne ilości propagandy już dawno zniekształciły niemal wszystkie ideały dziennikarskie, określając jego grupę odmieńców jako pionki w jakiejś nieznanej globalnej intrydze mającej obalić 'ostatni bastion postępu,' prawdziwe niebezpieczeństwo, jakie Wiech stanowi dla elity Bełchatowa, tkwi nie w różnicach, ale w podobieństwach między nim a Ziemkiewiczem. Jako urodzony zwolennik umiarkowanego konserwatyzmu, dziennikarz mógłby czuć się jak u siebie w domu w państwie, które stworzył jego wróg. Może w innej rzeczywistości mogliby być sojusznikami, ale w narodzie zbudowanym na dogmatach wyższości węgla, każda sugestia przeciwna jest niczym innym jak zdradziecką herezją.\n\nMimo że zawsze był niemile widziany na terytorium Bractwa, nic nie mogło powstrzymać Wiecha przed ujawnianiem prawdy o niebezpieczeństwach, jakie frakcja ta stanowiła nie tylko dla Polski, ale dla całego świata. Pomimo że jego życie było zagrożone za każdym razem, gdy zabierał głos, dziennikarz uparcie nawoływał do przejścia od szybko wyczerpujących się paliw kopalnych do niemal nieskończonej, zrównoważonej energii atomowej. Gdziekolwiek się pojawił, znajdował tam zwolenników trzymających się jego ideałów jako nadziei wobec rosnącego fanatyzmu Ziemkiewicza. Każda przemowa, każdy obywatel przekonany do sprawy nuklearnej osłabiał rządy Bractwa choćby w najmniejszym stopniu, ale to wystarczyło by obudzić sny o konieczności reform. Wkrótce jednak dni pokojowego przekonywania obywateli Łódzkiego dobiegną końca, gdy włodarze regionu postanowią stłumić to, co uważają za plagę rozprzestrzeniającą się przez ich ziemie.\n\nJakub Wiech nigdy nie pragnął być liderem, ale bez niego ruch nuklearny zginąłby, brutalnie zdławiony przez Ziemkiewicza i jego popleczników. Pomimo wiedzy, jaki los go czeka jeśli zawiedzie, dziennikarz rozpoczął otwartą rebelię przeciwko siłom Bractwa, rozpoczynając Atomową Krucjatę, aby przywrócić zdrowy rozsądek województwu. Niektórzy mogą powiedzieć, że stawka jest zbyt wysoka, że tylko skazał swoich zwolenników na służenie jako trening strzelecki dla doświadczonych paladynów, ale to nigdy nie odstraszało Wiecha. Przez całe życie walczył o sprawą nuklearną, i teraz również nie odpuści. Nawet jeśli będzie musiał za to umrzeć, jego poświęcenie będzie na zawsze uwiecznione."

