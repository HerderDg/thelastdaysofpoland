ATM_decarbonization_desc: "To... koniec. Bractwo upadło. Od dawna obawialiśmy się chwili, w której działa wreszcie umilkną, ponieważ wedle wszelkich prawideł to my powinniśmy zostać pokonani. A jednak stoimy tu jako zwycięzcy, z krajem do rządzenia i dawnymi wrogami do osądzenia. Dopiero teraz, gdy ucichły bębny wojny, a euforia triumfu opadła, ogrom zniszczeń stał się widoczny. Rządzimy ruinami i pustkowiami, miastami pokrytymi smogiem oraz polami niezdatnymi do uprawy. Węgiel zniszczył województwo łódzkie, pozostawiając na ziemi blizny znacznie gorsze niż te, które mogła wyrządzić bomba. Teraz rozpoczyna się prawdziwa praca nad odwróceniem spustoszenia tak ochoczo rozwijanego przez naszych poprzedników. Mrok węgla, choć w śmiertelnych konwulsjach zakorzenił się w ekosystemie i umysłach ludzi, ustąpi przed światłem atomu."
ATM_brother_ziemkiewicz_desc: "Och, jak wspaniale odwróciły się role. Nasz największy wróg, twarz Bractwa, człowiek, który próbował wykorzenić nas wszystkich, znalazł się teraz na naszej łasce. Seria niedawnych porażek ukazała prawdziwego Ziemkiewicza - bredzącego szaleńca zagubionego we własnych urojeniach wielkości. Poza rolą figuranta kliki posiadał niewiele rzeczywistej władzy i pozostawał w cieniu bardziej metodycznych manipulantów. Choć pokusa pełnej zemsty jest ogromna, musimy uznać jeden fakt: Ziemkiewicz nie stanowi zagrożenia. Mimo to życia zniszczone przez jego obłąkane tyrady domagają się pomsty, a nasi zwolennicy zgodnie skandują jeden wyrok - śmierć. Odrobina miłosierdzia mogłaby bardzo pomóc w rehabilitacji umiarkowanych przeciwników, lecz czy naprawdę możemy pozwolić takiemu potworowi żyć po całym cierpieniu, które nam zadał?"
ATM_brother_warzecha_desc: "Spośród wszystkich pokonanych wrogów nikt nie zasługuje na natychmiastowy odwet bardziej niż \"Wartownik\" Warzecha - prawdziwy architekt systemu okrucieństwa i wyzysku Bractwa. Przez lata ten mały szczur chował się za popularniejszymi kolegami i zza kulis pociągał za sznurki prowadzące do zniszczenia Polski. Każda decyzja, która wpychała bełchatowską klikę coraz głębiej na mroczną ścieżkę, pozostawiała trop prowadzący do jednego człowieka - ucieleśnienia wszystkich najgorszych cech Bractwa. Warzecha jest nie do odkupienia. Gdyby dostał kolejną szansę, z radością powtórzyłby wszystko, skazując miliony na życie na zatrutym pustkowiu, ani na chwilę nie tracąc tego irytującego uśmieszku. Wyrok już zapadł. Drań musi umrzeć za swoje zbrodnie, a my z osobliwą satysfakcją będziemy patrzeć na jego wykonanie."
ATM_deindoctrination_desc: "Poza katastrofą ekologiczną gwałtownie rozwijającą się na naszych oczach zakorzeniła się jeszcze jedna, bardziej humanitarna tragedia. Nieustanny strumień niepodważanej propagandy wyrzucany przez media Bractwa stępił umysły ludności, czyniąc ją dobrowolnym uczestnikiem samobójstwa własnego narodu. Ludzie trzymają się nauk bezmyślnych panów i przyjmują jako dogmat politykę, która zniszczy wszystko, co znają. Nawet jeśli się nam sprzeciwiają, nie są naszymi wrogami, lecz złamanymi ofiarami potrzebującymi przewodnictwa. Przekonanie ich o słuszności naszej drogi będzie długim i żmudnym procesem, lecz małymi krokami pomożemy im ponownie wyzwolić się z kłamstw."
ATM_saving_polish_microclimates_desc: "Kwiaty więdną na chemicznie skażonej ziemi. Zatrute rzeki płyną przez lasy pniaków. Dzikie zwierzęta głodują, gdyż ich łańcuch pokarmowy legł w gruzach. Polska leży pośrodku całkowitego, samodzielnie wywołanego załamania ekologicznego, którego skutki zdoła zrównoważyć dopiero wspólny wysiłek wielu pokoleń. Odziedziczyliśmy region zniszczony przez niekontrolowaną ekspansję przemysłową do tego stopnia, że nieustanne zapotrzebowanie na kolejne zasoby zagroziło nie tylko równowadze ekosystemu, lecz samemu przetrwaniu ludności. Choć bardzo byśmy tego potrzebowali, nie istnieje żadne cudowne rozwiązanie - czeka nas tylko powolna i trudna odbudowa. Musimy zatem powołać rządową agencję klimatyczną, która oceni, co utraciliśmy, co można jeszcze uratować i gdzie skierować fundusze, aby naprawdę coś zmienić. Krok po kroku przyroda powróci, nawet jeśli będzie zaledwie cieniem dawnej siebie."
ATM_acknowledge_global_warming_desc: "Dawno minęły czasy, gdy groźne zimy uciskały Polskę, a śnieżny puch miesiącami pokrywał ziemię. Obrazy bitew na śnieżki i zjazdów na sankach nie są jednak jedynie przejawem nostalgii za błogimi dniami młodości, a ich zniknięcie nie jest przypadkiem. To przykład czegoś większego i znacznie bardziej złowrogiego - zmiany klimatu. Zbyt długo rząd bezmyślnie odrzucał wszystkie dowody katastrofalnego wpływu ludzkości na środowisko, jednocześnie aktywnie przyspieszając ten proces. Koniec z tym. Wszyscy jesteśmy współwinni największej zbrodni człowieka przeciw naturze i najwyższy czas wziąć odpowiedzialność za wyrządzone szkody. W wojnie z Ziemią nie może być zwycięzców. Jeżeli życie na tej planecie ma mieć jakąkolwiek przyszłość, każdy z nas musi wreszcie zrobić wszystko, by naprawić własne błędy."
ATM_destroy_malicious_media_desc: "W Bractwie istniała tylko jedna prawda, pilnie wyrzucana przez miriady finansowanych przez rząd publikacji. Choć próbowały się od siebie odróżniać i udawały coś więcej niż bezmyślne tuby propagandowe, łączyła je jedna cecha - całkowity brak uczciwości dziennikarskiej przy promowaniu szkodliwej polityki Ziemkiewicza. Walka z dezinformacją już wszczepioną w głowy obywateli potrwa długo, lecz możemy przynajmniej zatrzymać jej dalsze rozprzestrzenianie. Wielkie konglomeraty medialne, takie jak ukochane przez szaleńców \"Do Rzeczy\", zostaną rozbite i zastąpione licznymi niezależnymi gazetami promującymi naszą narrację. Mniejsze redakcje będą działać dalej, choć pod ścisłym nadzorem i z antywęglowym nastawieniem, aby deradykalizować czytelników. Wojna o umysły ludzi dopiero się rozpoczęła, a te publikacje posłużą jako żołnierze pierwszej linii."
ATM_industrial_cults_desc: "Nawet instytucja tak święta jak Kościół nie uniknęła ingerencji pachołków Ziemkiewicza. Wypaczyli ją w groteskową formę, która szerzyła nie słowo Boże, lecz industrialistyczny program kliki. Po latach podobnych dogmatów wyrzucanych z ołtarzy wielu pobożniejszych wiernych zaczęło wielbić węgiel niczym Złotego Cielca. Modlą się do niego, otaczają nim i głoszą jego chwałę podczas tajnych spotkań. Musimy przywrócić Kościołowi dawną świetność i uwolnić go od zepsutych wpływów poprzez rehabilitację skompromitowanych duchownych, którzy odmówili współudziału w deprawowaniu swoich owczarni. Z czasem sprowadzimy zagubione owieczki z powrotem do ich świętego pasterza. Tak nam dopomóż Bóg."
ATM_brother_rzymkowski_desc: "Niczym owce oszczędzone przed wilkiem zbieramy się, by osądzić niedoszłego zabójcę. Wszystkie masakry, wszystkie zbrodnie wojenne, wszystko prowadzi do jednego człowieka - rzeźnika Bełchatowa, Paladyna Rzymkowskiego. Wielu naszych wrogów, pozbawionych ochrony dowódcy, twierdzi, że tylko wykonywało rozkazy, lecz taktyka tego ludobójczego szaleńca nie miała nic wspólnego z wojną. Gdyby postawił na swoim, każdy z nas spocząłby dwa metry pod ziemią, z kulą w potylicy kończąc opór i masowym grobem grzebiącym całe dziedzictwo. Dla tego drania nie ma innej stosownej kary niż ta, którą sam tak ochoczo wymierzał. Nie będzie drugiej szansy, jedynie satysfakcja z pomszczenia życia naszych braci. Rzymkowski nie zasługuje na nic więcej."
ATM_brotherhood_arms_industry_desc: "Skoro zatrzymaliśmy machinę wojenną Bractwa, pozostały po niej jedynie fabryki, które ją napędzały: część uśpiona, część nadal pracująca na zaopatrzenie upadłego kolosa. Przemysł zbrojeniowy pozostawiony przez pokonanych wrogów robi wrażenie, lecz w najlepszym razie zmierza w złym kierunku. Podobnie jak całe państwo, które uzbrajał, jest niewiarygodnie rozrzutny. Jedynym jego osiągnięciem było wysysanie kolejnych zasobów z już wyczerpanego regionu i przybliżanie zegara ekologicznej zagłady do północy z każdym wyprodukowanym pociskiem. Ten system wyzysku można powstrzymać tylko poprzez ogólne ograniczenie jego skali. Już teraz mamy więcej niż wystarczającą liczbę fabryk. Zmniejszymy produkcję do poziomu rzeczywistych potrzeb i zlikwidujemy wszystkie zbędne linie montażowe oraz projekty, przynajmniej dopóki nie znajdziemy sposobu, by uczynić je zrównoważonymi."
ATM_dissolve_paladin_hierarchy_desc: "W Bractwie zdobycie tytułu Paladyna było prawdopodobnie największym osiągnięciem w karierze oficera. A jednak nikt dokładnie nie wiedział, co właściwie oznaczała ta ranga. Jedni służyli jako dowódcy polowi, inni jako administratorzy, a jeszcze inni nawet jako zwykli strażnicy. Choć nosili ten sam tytuł, żaden Paladyn nie miał identycznego statusu. Utrzymywanie tak nierównej i niezorganizowanej struktury dowództwa wojskowego może jedynie wywołać dalszy chaos, zwłaszcza gdy włączamy do niej własne jednostki. Musimy zatem przywrócić w armii sprawdzoną strukturę, opartą na tradycyjnych stopniach niegdyś potężnych Sił Zbrojnych Rzeczypospolitej Polskiej. W przeciwieństwie do wrogów utrzymamy wyraźną hierarchię z dobrze określonym łańcuchem dowodzenia oraz płynnym systemem awansów, który zapewni nam stały napływ młodszych i starszych oficerów, a nie zbieraninę dożywotnio mianowanych osób na jedno wzniosłe, wszechogarniające stanowisko."
ATM_amnesty_for_officers_desc: "Nie wszyscy generałowie, z którymi walczyliśmy w ostatnim konflikcie, są fanatykami ideologicznymi. Niektórzy to zwykli, pozbawieni kręgosłupa najemnicy gotowi służyć każdemu, o ile rozwija to ich karierę i zapewnia zdrowy strumień pieniędzy. Zazwyczaj trzymalibyśmy się z dala od takich żmij, lecz niestety naszej armii brakuje wyższego dowództwa. Nie mamy czasu, by wyszkolić własne lojalne kadry, co pozostawia nam tylko jedną możliwość - przyjąć oficerów gotowych walczyć za naszą sprawę, a właściwie za nasze pieniądze. Dokładnie prześwietlimy ich życiorysy i każemy im przysiąc walkę na chwałę Atomu, ale ostatecznie ich lojalność przypomina chorągiewkę na wietrze - zwraca się tam, gdzie akurat powieje los. Jeżeli nadejdą dla nas ciężkie czasy, porzucą nas bez chwili wahania."
ATM_nucleation_desc: "Skoro położyliśmy fundamenty, pora zacząć wdrażać nową strukturę. Stworzenie od podstaw sprawnej administracji wojskowej nie jest łatwe, zwłaszcza gdy jednocześnie trzeba sprzątać bałagan pozostawiony przez kogoś innego. Dysponując skromnymi zasobami, musimy w rekordowym tempie utworzyć centralne dowództwo, ustanowić posterunki garnizonowe w całym regionie i zbudować ośrodki szkoleniowe przygotowane na napływ nowych rekrutów. Czeka nas iście herkulesowe zadanie, lecz przynajmniej nie musimy stawiać mu czoła samotnie. Część dawnych oficerów Bractwa pracujących obecnie dla nas ma przynajmniej podstawowe pojęcie o funkcjonowaniu takiego systemu. Oto ich szansa, by dowieść własnej wartości."
ATM_long_road_to_normality_desc: "Nie ma żadnych wątpliwości: mamy ogromny dług wobec partyzantów. W walce dowiedli swej wartości ponad wszelkie oczekiwania, lecz niewyszkolone formacje partyzanckie nie są skalowalnym modelem odpowiednim dla ustabilizowanego państwa takiego jak nasze. Brak regulacji to jedno, ale najważniejszy problem stanowi nieobecność jakiegokolwiek ujednoliconego systemu szkolenia. Podczas ostatniej wojny często musieliśmy posyłać do walki każdego, kto potrafił celnie strzelać. Nasze siły przetrwały wyłącznie dzięki niewiarygodnemu szczęściu i niekompetencji przeciwnika. Od teraz nie będzie już tak łatwo. Stajemy naprzeciwko utrwalonych reżimów, często wspieranych przez niedobitki niegdyś groźnej Armii. Aby się im przeciwstawić, musimy wyszkolić żołnierzy według najwyższych standardów. Koniec z obijaniem się. Na horyzoncie widać wojnę, a tym razem będziemy gotowi."
ATM_stop_ridiculous_army_programs_desc: "Cudowna broń - ozdoba dyktatorów, próżne odzwierciedlenie ich fetyszyzacji potęgi. Zważywszy na megalomańskie aspiracje Bractwa, nic dziwnego, że zmarnowało znaczną część budżetu na niepraktyczne, niewykonalne projekty, które miały rzekomo zmieść wrogów z powierzchni ziemi. Wiele kompleksów przemysłowych działało wyłącznie w tym celu, trwoniąc ogromne ilości siły roboczej i zasobów na budowę bezużytecznych rupieci zalegających obecnie w magazynach. Od teraz wszystkie podobne projekty próżności zostaną wstrzymane, a nieudane prototypy rozebrane na części. Nie oczekujemy znaleźć niczego użytecznego, lecz w naszym położeniu liczy się każde luźne koło zębate. Po uprzątnięciu śmieci przestawimy linie montażowe na produkcję materiałów, które naprawdę wesprą zarówno wysiłek wojenny, jak i dobrobyt ludności. Koniec z pogonią za niemożliwymi marzeniami o niezrównanej potędze. Pora, aby zapanowała tu odrobina odpowiedzialności."
ATM_brother_gadomski_desc: "Paladyn Gadomski jest żmiją i oportunistą gotowym zdradzić wszystko, co mu drogie, byle ocalić stanowisko. Nigdy nie kochał dogmatów Bractwa i wyskoczył z tonącego okrętu, gdy tylko pojawiło się prawdziwe zagrożenie na horyzoncie. Zwykle trzymalibyśmy się z dala od tak niewiarygodnych ludzi, lecz smutna prawda brzmi: nie mamy wyboru. Spośród garstki Paladynów gotowych współpracować z nami w jakimkolwiek stopniu nikt nie zna wewnętrznych mechanizmów Bractwa tak dobrze jak Gadomski. Czy nam się to podoba, czy nie, potrzebujemy jego wiedzy, by przebudować przemysłową machinę i ponownie wszystko uruchomić. Na szczęście bezkręgowiec zdążył już wkraść się w łaski znacznej części naszego kierownictwa, pomagając nam w walce przeciw dawnym kolegom. Plan jest więc prosty - symboliczna kara, która uspokoi masy, a po jej zakończeniu wygodne stanowisko."
ATM_redemption_for_civilian_sector_desc: "Odziedziczywszy region po dawnych wrogach, nieuchronnie musimy radzić sobie z przemysłem, który raczyli nam pozostawić. Zwykle docenilibyśmy możliwość rozwijania już działającego systemu, lecz sektor cywilny Bractwa jest po prostu nie do uratowania. Nieliczne żarzące się jeszcze iskry niezależnej aktywności gospodarczej istnieją wyłącznie po to, by napędzać samobójczy system eksploatacji zasobów oraz utrzymywać ludność w posłuszeństwie i zależności od skromnych usług. Przerwanie tego katastrofalnego cyklu wymaga całkowitej przebudowy, a do tego potrzebujemy wiedzy kogoś, kto pomógł ten system stworzyć. Gadomski nie zasługuje na naszą uwagę, lecz może być jedyną szansą na uporządkowanie bałaganu. Jeżeli zdoła odwrócić sytuację, być może okażemy dość łagodności, by pozwolić mu się odkupić."
ATM_repopulate_the_countryside_desc: "W całym regionie krajobraz usiany jest pustymi domami, które bez prawowitych właścicieli powoli niszczeją. Za reżimu Ziemkiewicza tysiące ludzi siłą wyrwano z wiejskich domostw, aby nakarmić przemysłowy ustrój Bractwa. Teraz, gdy zwyciężył rozsądek, pora pozwolić im wreszcie powrócić. Własnymi środkami albo z naszą pomocą ludzie odzyskają dawny dobytek i znów będą mogli przyjąć tradycyjny sposób życia. Pola, na których niegdyś pracowali, zostały najpewniej rozkopane i zbezczeszczone w poszukiwaniu zasobów naturalnych, lecz udzielimy im wszelkich dotacji potrzebnych, by stanęli na nogi. Po całym cierpieniu, którego doznali chociaż tyle możemy dla nich zrobić."
ATM_fight_the_smog_desc: "Choć szaleńczą pogoń Bractwa za ekspansją przemysłową za wszelką cenę brutalnie przerwano, pozostałość dawnego systemu wciąż unosi się w powietrzu, którym oddychamy. Trudno wyjść z mieszkania bez zadławienia się smogiem, nawiedzającym nas niczym widmo dawnych grzechów przeciw środowisku. Jeżeli szybko go nie wykorzenimy, szkody mogą stać się trwałe, na zawsze zmieniając centralną Polskę w niezdatne do zamieszkania pustkowie. Bez względu na potrzebne zasoby musimy usunąć zalegającą truciznę, aby pewnego dnia promienie słońca znów mogły rozświetlić Bełchatów, wolny od śmiercionośnych chmur więżących miasto w ciemności."
ATM_revitalize_agrarian_industry_desc: "Po latach niewłaściwego użytkowania, zanieczyszczeń chemicznych i niemal nieustannej wojny niegdyś żyzne pola regionu w znacznej mierze opustoszały. Nieliczne działki, które przetrwały surowe warunki, zniszczono później, aby zrobić miejsce dla dalszej ekspansji przemysłowej. Przez brak dalekowzroczności Bractwa, a właściwie całkowitą obojętność wobec losu głodującej ludności, pozostały nam jedynie samotne, rozproszone skrawki ziemi uprawnej na obrzeżach województwa, dokąd maszyny jeszcze nie dotarły. Mimo fatalnej sytuacji nie wszystko jest jednak stracone. Najodporniejsze odmiany przystosowały się do niegościnnego klimatu. Jeżeli rozsiejemy ich nasiona po naszym terytorium, część może jeszcze wydać plon. Wykorzystamy wszystkie wolne środki, by wesprzeć borykających się z trudnościami rolników i pomóc im uprawiać pozostałości ziemi. Miejmy nadzieję, że z czasem znów będą w stanie utrzymać się samodzielnie."
ATM_green_is_back_on_menu_desc: "Choć zdołaliśmy przywrócić na rynki w miarę stały dopływ owoców i warzyw, stajemy przed kolejnym problemem - całkowitym brakiem popytu. Po latach antywegetariańskiej propagandy mieszkańcy województwa łódzkiego zaczęli uważać wszystkie naturalne produkty za jawnie szkodliwe, przypisując nawet najprostszym roślinom rozmaite zmyślone zagrożenia i choroby. Choć brzmi to niedorzecznie, musimy wrócić do podstaw, obalić te szkodliwe mity i za wszelką cenę zachęcić ludzi do jedzenia warzyw, nawet kosztem znacznych strat dla skarbu państwa. Nasi obywatele przypominają dzieci urządzające awanturę z powodu zapomnianych smaków. Tak jak niegdyś rodzice nauczyli ich kochać żywność roślinną, tak my nauczymy ich ponownie się nią cieszyć."
ATM_brother_janecki_desc: "Niewiele nazwisk budzi w naszych szeregach tyle strachu co Paladyn Janecki. Szara eminencja Bractwa od dawna siała spustoszenie pośród naszych sympatyków, metodycznie eliminując nas jednego po drugim niczym łowca bezgłośnie tropiący ofiarę. Choć przerwaliśmy kręgi jego wpływów, nieufność zasiana przez infiltratorów do dziś przenika nasze struktury. Na szczęście, wszystkie mroczne machinacje Janeckiego zawiodły, a on sam stanął przed sądem za liczne zbrodnie. Jego cień nie wydaje się już równie potężny i skurczył się do żałosnej, bezsilnej postaci. Mimo to ludzie, którzy przez okrutne prześladowania stracili rodzinę, przyjaciół i towarzyszy, domagają się śmierci oprawcy i żądają zemsty bez względu na rządy prawa. Czy można ich winić? Jakie miłosierdzie mogłoby przysługiwać takiemu potworowi?"
ATM_proctor_secret_files_desc: "Człowiek taki jak Janecki nie utrzymuje się przy władzy wyłącznie dzięki dobrej woli przełożonych. Najwyższe kręgi Bractwa miały niewiele powodów, by mu ufać, a jeszcze mniej, by nie zastąpić go kimś bardziej lojalnym i przewidywalnym. Istnieje tylko jedno wyjaśnienie. Bali się mu sprzeciwić, a aby tak było, ten przeklęty pająk musiał mieć haki na każdego, kto cokolwiek znaczył. Z pewnością gdzieś to wszystko zapisał. Jeżeli zdobędziemy te informacje, z łatwością utrzymamy dawnych kolegów Janeckiego w ryzach. Mógł nawet posunąć się do zgromadzenia kompromitujących materiałów na naszych własnych przywódców. Przezorny zawsze ubezpieczony. Przeszukamy każdy przedmiot, który po nim pozostał, i zajrzymy pod każdy kamień. Jeżeli gdzieś ukrył akta, w końcu je znajdziemy. Lepiej my niż nasi wrogowie."
ATM_secret_service_apparatus_desc: "Dziedzictwo Bractwa składa się w znacznej mierze z porażek, lecz jednego nie można mu odmówić - wiedziało, jak utrzymywać w ryzach krajowych i zagranicznych dysydentów. Janecki nie był głupcem. Stworzona przez niego organizacja jest mokrym snem szpiega, zdolnym wcisnąć macki w najmniejszą szczelinę w poszukiwaniu śladów buntu. W stale zmieniającym się krajobrazie politycznym Polski po Upadku, gdzie lojalność często zmienia się pod wpływem kaprysu, rozsądnie będzie dostosować agencję do naszych potrzeb. Oczywiście nie dążymy do równie wielkiego okrucieństwa i terroru co dawny Proktor, lecz nie zaszkodzi przejąć część jego skuteczniejszych metod kontroli. Niektórzy nazwą nas hipokrytami, inni się od nas odwrócą. Wznowienie inwazyjnej kampanii państwowej inwigilacji nie przysporzy nam sojuszników, lecz zapewni coś znacznie ważniejszego - przetrwanie."
ATM_cleanse_the_ranks_desc: "Choć próby przystosowania służb specjalnych Bractwa przyniosły dotąd zadowalające rezultaty, zgnilizna ideologiczna wszczepiona przez Janeckiego na każdym poziomie jego ukochanej organizacji sięga znacznie głębiej, niż mogliśmy przewidzieć. Zaraza dotknęła wszystkich, od najniższych urzędników po najwyższych oficerów, czyniąc z nich uśpionych agentów wymierzonych w naszą sprawę. Na razie mogą sumiennie wykonywać zadania, lecz kto wie, jakie brudy na naszych przywódców wykopują za ich plecami, niczym gniazdo szerszeni pełne zdrajców czekających na najmniejszy ruch? Nie ma miejsca na półśrodki. Wytniemy tę ropiejącą ranę, zanim zdoła się rozprzestrzenić, nawet jeżeli oznacza to zastąpienie całej agencji niewyszkolonymi lojalistami."
ATM_stop_the_persecutions_desc: "Po wielu latach pod butem Bractwa ludność województwa łódzkiego poznała tylko jedną emocję - strach. Sieć szpiegów Janeckiego sięgała głęboko i brutalnie ujawniała najmniejsze oznaki sprzeciwu, a nawet wątpliwości wobec narzuconej doktryny. Tych, którzy ośmielili się zabrać głos, czekał okrutny los. Czasami zaledwie kilka niezręcznie dobranych słów wypowiedzianych podczas rodzinnej kolacji stanowiło podstawę do szybkiej likwidacji człowieka. Choć musimy zachować pewien poziom porządku, nie możemy pozwolić na dalsze stosowanie tak brutalnej polityki, zwłaszcza po tym, jak doprowadziła do śmierci tylu naszych ekologicznych towarzyszy. Postąpimy słusznie i poluzujemy wodze, aby prześladowani dysydenci wreszcie mogli wyjść z ukrycia. Mroczne chmury tyranii wkrótce się rozwieją."
ATM_bring_the_dissidents_desc: "Choć Bractwo przedstawiało się jako ideologiczny monolit, wygląda na to, że nie wszyscy jego dawni członkowie znajdują się poza możliwością rehabilitacji. Poza licznym gronem ideologów bezceremonialnie odtrąconych za sprzeciw wobec radykalnego zwrotu organizacji nawet w utrwalonych szeregach powstało pełnoprawne skrzydło reformistyczne, napędzane młodzieńczą pasją i pragmatyzmem najnowszego pokolenia węglowego kultu. Nie muszą zgadzać się z nami we wszystkim, lecz wiedza o wewnętrznym funkcjonowaniu rządu może okazać się niezbędna w próbie odwrócenia jego najbardziej szkodliwej polityki. To strzał w ciemno, ale lepszy niż bezczynność. Niezależnie od naszych opinii powinniśmy przynajmniej wykonać kilka gestów dyplomatycznych i sprawdzić, czy współpraca jest w ogóle możliwa. Wolimy mieć ich po swojej stronie, niż samotnie stawiać czoła największemu kryzysowi ekologicznemu Europy."
ATM_greenpeace_poland_desc: "Niewiele organizacji ma równie kontrowersyjną reputację co Greenpeace. Pod wieloma względami ich ideały przeczą naszym, a sprzeciw wobec energetyki jądrowej od dawna jest fundamentem każdego prawdziwego ruchu ekologicznego. Nawet teraz nie oczekujemy, że szczególnie pokochają nasze pomysły na rozwiązanie obecnych kryzysów. Niektórzy nazwą głupotą wzmacnianie organizacji tak zaciekle przeciwnej podstawowej wizji naszego państwa, lecz w walce o powstrzymanie zagłady potrzebujemy wszystkich rąk na pokładzie. Aktywiści z pewnością docenią możliwość wyjścia z ukrycia, uwolnienia od prześladowań oraz niemal wolną rękę na wznowienie działalności proklimatycznej. Niech we własnym gronie narzekają na nasze atomowe marzenia, ile tylko chcą, o ile pilnują swojego poletka i nie przeszkadzają nam. Utrzymanie ich w ryzach nie powinno być trudne. W końcu wiele nam zawdzięczają."
ATM_promise_of_atom_desc: "Gdy marnieliśmy w zbombardowanym piekle Bałut, jedna wizja i jeden cel dodawały nam otuchy, nadawały sens i dawały powód do dalszej walki - marzenie o atomowej Polsce. Teraz, kiedy jesteśmy niekwestionowanymi władcami województwa łódzkiego, nasi zwolennicy na nic nie czekają bardziej niż na spełnienie tego snu. Wystarczająco długo trzymaliśmy ludzi w niewiedzy. Pora ponownie potwierdzić przywiązanie do idei, która stanowi fundament naszego ruchu. Pora rozpocząć budowę pierwszego reaktora. Nie mamy niemal żadnych zasobów ani wiedzy, lecz położenie zwyczajnie nie pozwala odkładać projektu w nieskończoność. Jeżeli chcemy zachować choćby pozory odpowiedzialności, musimy natychmiast rozpocząć opracowywanie planów budowy megaprojektu, nawet jeżeli jego rzeczywista realizacja doprowadzi nas na skraj wytrzymałości. Oficjalnie ogłośmy więc ambicje i pozwólmy, aby związał nas los. Uda się czy nie, oto będzie nasze dziedzictwo."
ATM_reform_crusaders_desc: "Krzyżowcy dobrze nam służyli. Ich liczne czyny odwagi i bohaterstwa zostaną zapamiętane na zawsze, uwiecznione w opowieściach o naszym nieprawdopodobnym zwycięstwie i otoczone czcią. W miarę rozszerzania zakresu działań staje się jednak jasne, że obecna struktura zwyczajnie nie dorasta do zadania. Zjednoczenie kraju wymaga prawdziwej, nowoczesnej armii, a nie słabo uregulowanej partyzantki. Aby zapewnić odpowiednią dyscyplinę, doktrynę i szkolenie, oficjalnie wcielimy milicje do nowych zawodowych sił zbrojnych, czyniąc z nich prawdziwą awangardę Atomowej Krucjaty. Owszem, nowe standardy mogą zmusić nas do oddzielenia ziarna od plew, lecz przy niemal niewyczerpanym strumieniu ochotników oczekujemy całkowicie płynnej przemiany."
ATM_great_reduction_plan_desc: "Ludzkość potrafi być rozrzutną rasą, pasożytem na ciele planety, wysysającym wszystkie zasoby i spalającym ją gazami cieplarnianymi, aż ostatecznie zginie wszelkie życie na powierzchni. Własnymi działaniami policzyliśmy swoje dni, nieświadomi nadchodzącej zagłady i dalej odwracając terraformowanie Ziemi. Czas łagodnych odpowiedzi i bezsilnych przemówień dawno minął. Jeżeli mamy ocalić ludzkość, musimy podjąć radykalne działania. Od teraz na każdej ziemi, do której dotrą nasi żołnierze, ślad węglowy zostanie unicestwiony i zredukowany do zera, dopóki cały kraj nie osiągnie wreszcie ekologicznej równowagi. Z pewnością nadepniemy wielu ludziom na odcisk i czasami będziemy musieli sami strzelić sobie w stopę, niszcząc kluczowe gałęzie przemysłu, lecz grozi nam wyginięcie, a przetrwanie nie podlega negocjacjom."
ATM_free_ecologists_desc: "Choć przeszliśmy przez wiele trudności, kuląc się, by przetrwać w napromieniowanych ruinach Bałut, nie miejmy wątpliwości - należymy do nielicznych szczęśliwców. Podczas gdy my wyciskaliśmy prymitywną egzystencję z surowej rzeczywistości, nasi bracia harowali w mrocznych głębinach bełchatowskich kopalń, bez przerw, z dala od światła słońca i odarci z człowieczeństwa, aż ich ciała odmawiały posłuszeństwa, a szyby stawały się grobami. Do dziś wielu naszych sympatyków pozostaje skutych w tych potwornych warunkach, nieświadomych przemiany, jaka dokonała się na powierzchni. Pracują, by karmić od dawna zepsutą maszynę, obawiając się, że jeśli choć na chwilę przestaną, kat szybko wymierzy karę. Ich wyroki dobiegły końca. Uwolnimy ich i sprowadzimy na powierzchnię, aby wreszcie powrócili do społeczeństwa. O ile ich umysły nie zostały już złamane."
ATM_pentomic_battle_groups_desc: "Od początku epoki atomowej wojna uległa przemianie. Nad walczącymi zawisła nowa, wszechpotężna broń, zdolna jednym uderzeniem zmieść całe dywizje. Powolne, drobiazgowe natarcia i stałe pozycje należą do przeszłości. Jeżeli chcemy przełamać linie wroga, zanim potęga Atomu nas unicestwi, musimy całkowicie zreformować strukturę sił zbrojnych i zapewnić każdemu batalionowi dość specjalistycznego wyposażenia, by prowadził działania ofensywne samodzielnie, bez wsparcia innych formacji. Dzięki temu będziemy mogli atakować szybko, przytłaczać przeciwników i rozpraszać się, zanim zdążą choćby rozważyć odpowiedź jądrową. Wrogowie, więźniowie przestarzałych taktyk, pozostaną bezradni i zdani na łaskę naszych klinów."
ATM_message_from_berlin_desc: "Niedawne sukcesy niewątpliwie przyniosły nam większy rozgłos, nawet poza granicami Polski. Wielu spogląda na nas z ostrożnym optymizmem, uznając za pożądaną zmianę, a nasze zwycięstwo za jedną z nielicznych pozytywnych historii napływających z rozdartego wojną regionu. Kilka odważnych dusz próbowało nawet dołożyć się do szlachetnej sprawy. Pośród tego strumienia reakcji trwa jednak ogłuszająca cisza - milczenie Niemców, samozwańczych \"panów Europy\". Dzięki ogromnym zasobom i interwencjonistycznej polityce ich sprzeciw mógłby w pojedynkę zniszczyć wszystko, co osiągnęliśmy. Nie oczekujemy od nich sympatii. W zupełności wystarczy niechętna tolerancja wobec naszego wzrostu. Mamy już dość wrogów w kraju i nie potrzebujemy kolejnego na liście. Możemy tylko mieć nadzieję, że podzielają to zdanie."
ATM_clearer_sky_desc: "Po raz pierwszy od niemal dekady słońce przebija się przez chmury smogu. Ośrodki miejskie zapewne będą cierpieć jeszcze przez wiele lat, lecz życie na peryferiach powoli znów zaczyna przypominać... normalność. Nieustanny, ogłuszający łoskot maszyn przemysłowych ustąpił spokojnemu pomrukowi ciągników, pilnie przygotowujących pierwszy zbiór w odrodzonym regionie. Plony prawdopodobnie ledwie wystarczą na podstawowe wyżywienie, lecz mimo wszystko są znakiem nowej epoki - wodą wyciśniętą z kamienia, budulcem życia wydrapanym z jałowej ziemi. Przetrwaliśmy najsurowsze próby, zapewniliśmy sobie dalsze istnienie i położyliśmy fundament pod powolne odrodzenie przyrody. Zza grubej zasłony odcinającej nas od świata przebija teraz słaby blask - nadzieja, na którą w pełni zasłużyliśmy."
ATM_shadow_of_chernobyl_desc: "26 kwietnia 1986 roku sprawa atomowa w Polsce umarła, jak się wtedy wydawało, na zawsze. Gdy feralny reaktor w Czarnobylu płonął i wyrzucał trujące opary nad całą Europę Wschodnią, przez nasz kraj przetoczyły się fale strachu, zaszczepiając w przerażonej ludności dożywotnią fobię przed wszystkim, co jądrowe. Niewielu mogło wówczas przewidzieć rozmiary tej nieufności. Przetrwała pokolenia, aż Polska pozostała w tyle, uzależniona od węgla. Od katastrofy, która zdefiniowała ostatnie dziesięciolecia naszej energetyki, normy bezpieczeństwa znacznie wzrosły, a wydajność poszybowała w górę, jasno pokazując, że energia jądrowa jest jedyną drogą do zakończenia zależności od paliw kopalnych. Ludzie nadal jednak, wstrząśnięci tragedią w Czarnobylu, drżą na samo wspomnienie naszych wielkich planów, sabotują wysiłki i przedstawiają nas jako diabły, złych agentów pragnących sprowadzić kolejną katastrofę. W ich sercach ten tragiczny dzień nadal żyje. Jeżeli chcemy rozpocząć budowę pierwszego reaktora, musimy znaleźć sposób, by ukoić obawy, zanim staniemy bezpośrednio naprzeciw zdesperowanych mas."
ATM_fallout_desc: "Przebyliśmy długą drogę od przejęcia województwa łódzkiego. To, co zaczęło się jako ledwie godna uwagi grupa buntowników, wyrosło na jednego z głównych pretendentów do zjednoczenia Polski. Wbrew wszystkiemu w znacznej mierze opanowaliśmy szkody wyrządzone przez poprzedników i przywróciliśmy pozory harmonii w zrujnowanym regionie. Oczywiście nie jest to pora, by spocząć na laurach. Nadal daleko nam do realizacji celów, a na drodze czeka wiele wyzwań. Środowisko wciąż się nie uzdrowiło, ludzie występują przeciw naszej polityce, a zagraniczne sępy przygotowują atak gdy najmniej będziemy się go spodziewać. Możemy jednak świętować jedno: nie jesteśmy już tylko ekipą sprzątającą, określaną przez walkę z zalegającym dziedzictwem Bractwa. Od teraz wyzwania, sukcesy i porażki należą wyłącznie do nas. Staliśmy się panami własnego losu."
