unification.156.t: "[GetNewspaper]Atomowa Krucjata pokonuje Bractwo"
unification.156.desc: "Gdy wydawało się, że uścisk Bractwa nad Łódzkiem został ostatecznie umocniony, bijące przemysłowe serce środkowej Polski wyrwał z jego piersi okrzyk wyzwolenia. Powstała jako ostatnia próba buntu przeciwko tyrańskim rządom Ziemkiewicza grupa uciskanych ekologów, dowodzona przez uznanego za zmarłego dziennikarza Jakuba Wiecha, zdołała przejąć kontrolę nad województwem po wyczerpującej kampanii partyzanckiej. \"Atomowa Krucjata\", jak nazywa się ruch, głosi potrzebę natychmiastowej odbudowy klimatu i przejścia na energię jądrową, wyrzucając ukochany węgiel Bractwa na śmietnik historii. Choć sukces partyzantów jest bezprecedensowy i pokazali już, że nie istnieje przeszkoda zbyt trudna do pokonania, zwycięstwo to stanowi jedynie pierwszy krok na długiej drodze ku spełnieniu marzeń Krucjaty. Kolejne mogą okazać się znacznie większym wyzwaniem."
unification.156.a: "Ostatnie iskry postępu zostały stłumione."

unificationreg.156.t: "[GetNewspaper]Atomowa Krucjata podbija sąsiednie województwa"
unificationreg.156.desc: "Atomowe marzenie trwa w środkowej Polsce, gdyż wygląda na to, że Jakub Wiech wbrew niemożliwym przeciwnościom wydarł region z pustki pozostawionej po Ziemkiewiczu. Nawet po ostatecznym triumfie nad swoim wrogiem, dziennikarz musiał zbudować sprawne państwo na popiołach przemysłowego pustkowia Bractwa. Choć skutki niekontrolowanego skażenia wciąż są odczuwalne, pierwsze oznaki wskazują, że przyroda powoli się odradza dzięki daleko idącej polityce środowiskowej, która ma uleczyć naród z trwałego uzależnienia od węgla. Teraz, gdy Atomowa Krucjata rozszerzyła wpływy poza Łódzkie, Wiech musi znaleźć sposób, by przekonać zmęczoną ludność do swojej wizji jądrowej. To jednak może nie być łatwe w kraju wciąż wstrząśniętym ogromną radioaktywną dziurą w samym jego geograficznym środku."
unificationreg.156.a: "Czy mi się zdaje, czy powietrze ostatnimi czasy jest jakieś...lżejsze?"

unificationsupreg.156.t: "[GetNewspaper]Atomowa Krucjata w przededniu zwycięstwa"
unificationsupreg.156.desc: "Wizja atomowej Polski jest coraz bliższa rzeczywistości, a wszystko dzięki Jakubowi Wiechowi i jego Atomowej Krucjacie. Dziennikarz wyszedł zwycięsko z niezliczonych zmagań i umocnił władzę nad środkową Polską, przebywając daleką drogę od czasów, gdy był demonizowanym partyzantem pod opresyjnymi rządami Bractwa. Dziś stoi na czele być może najpoważniejszego kandydata do zjednoczenia narodu, dysponującego sprawnym aparatem rządowym oraz wspólnym marzeniem popychającym ruch ku nowym wyżynom. Teraz, gdy zabezpieczył swoją pozycję, Wiech ujawnił najambitniejszy plan: budowę reaktora jądrowego na polskiej ziemi, który rozwiąże problemy energetyczne kraju. Realizacja będzie jego ostateczną próbą i wymaga zasobów oraz wiedzy niewidzianych w kraju od czasów Upadku."
unificationsupreg.156.a: "Tak w ogóle, co jest nie tak ze starym dobrym węglem?"

super.156.t: "[GetNewspaper]Świt atomowej Polski"
super.156.desc: "Po raz pierwszy od ponad dekady światło przebija ciemne chmury smogu, które niegdyś spowijały Polskę żałosnym całunem. Atomowa Krucjata powstała jedynie jako bunt przeciwko tyrańskiemu dążeniu Bractwa Węgla do nieokiełznanego \"postępu\", lecz przekroczyła granice tego, co uznawano za możliwe na tym postindustrialnym pustkowiu. Wykorzystała czystą energię, by przywrócić harmonijną równowagę między rozwojem ludzkości a dobrostanem przyrody. Gdy walki w umęczonym wojną regionie ustają, wysoko wznosi się tylko atomowa latarnia, nadając komunikat słyszany na całym świecie: Polska wróciła na mapę, a z Wielkim Ekologiem u steru ponownie dołącza do wspólnoty międzynarodowej silniejsza niż kiedykolwiek, gotowa rzucić wyzwanie każdemu, kto spróbuje narzucić hegemonię odradzającemu się narodowi."
super.156.a: "Zrobiliśmy ściepę narodową i zbudowaliśmy elektrownię atomową!"

atom_post.1.t: "Ustanowienie Europejskiej Rady Kontroli"
atom_post.1.desc: "We are at the dawn of a new era for Europe. The era of true independence and true unification. No longer will our energetic safety be dependent on the whims of the Russians, Arabs, or even Americans! No longer will European cooperation mean German domination. It is time for true equality of European nations so that we can truly be United in Diversity. And Poland will be one of the architects of this new continental order!\n\nThe way to this bright future was paved with the lives of millions of innocents. It also cost Germany its capital. But that is the sad truth that progress cannot be achieved without the sacrifice of many brave souls. We honor their memory as we honor the new, powerful, and green Europe!"
atom_post.1.a: "Europejski sen ciągle trwa!"