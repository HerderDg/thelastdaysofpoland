##Ideas and Spirits##
ATM_overextended_army: "Przeciążona armia"
ATM_overextended_army_desc: "Krucjata, jak zaczęto nazywać nasz ruch, nie jest bynajmniej świetlanym przykładem regularnej armii. Początkowo nasz bezładny bunt przeciw Bractwu nie wymagał niczego bardziej wyrafinowanego niż masa gorliwych milicji, lecz teraz, kiedy naprawdę przejęliśmy kontrolę nad województwem, problemy zaczęły wyrastać jak grzyby po deszczu. \n\nNiedobitki Bractwa terroryzują naszą administrację, drobna przestępczość stale rośnie, a sąsiedzi już spoglądają na słabo chronione granice w poszukiwaniu ziem, które mogliby zagarnąć. Ostatnie resztki oddechu naszej armii nieustannie wyciskają niemal ciągłe napady zza granicy i starcia z bandytami. \n\nJeżeli nie chcemy upaść wskutek rebelii albo rozpaść się po jednym ciosie ze strony innych województw, nie mamy wyboru - musimy przekształcić naszą armię w coś, z czego naprawdę moglibyśmy być dumni."

ATM_indoctrinated_society: "Zindoktrynowane społeczeństwo"
ATM_indoctrinated_society_desc: "Bezmyślne drony o oczach spowitych smogiem. Tak z pewnością można opisać mieszkańców Bełchatowa. Doprawdy zdumiewające, jak skuteczna była niegdyś machina propagandowa Bractwa. Nawet odcięci od niekończącego się strumienia fałszywych wiadomości i fanatyków siejących strach nadal niezachwianie wierzą w ideały kliki. Ich życie stało się tak rutynowe, że z lotu ptaka można by pomylić ich z robotnicami w mrowisku. \n\nBoją się Atomu i wszelkiego odwetu, jaki Krucjata mogłaby na nich sprowadzić. Wszystko, czego Ziemkiewicz osobiście nie zatwierdził i nie poparł, traktują jak zarazę. Co zaskakujące, trucizna ta przeniknęła nawet do umysłów szerszej ludności województwa. Ludzie, którzy wcześniej mogli odnosić się do odnawialnych lub jądrowych źródeł energii z umiarkowanym sceptycyzmem, zradykalizowali się do tego stopnia, że znienawidzili kolor zielony. \n\nPrzyszłość pokaże, czy istnieje jeszcze nadzieja na przywrócenie tym ludziom prawdziwego rozsądku. A nie wypaczonego \"Zdrowego Rozsądku\" głoszonego przez Ziemkiewicza."

ATM_deindoctrination_idea: "Kampania deindoktrynacyjna"
ATM_deindoctrination_idea_desc: "Rozpoczęliśmy kampania deindoktrynacyjną w naszym kraju.\n\n§GKiedy zostanie ukończona, efekty duchu narodowego §YZindoktrynowane społeczeństwo§! zmniejszą się§!"

ATM_ravaged_countryside: "Spustoszone wsie"
ATM_ravaged_countryside_desc: "Gdziekolwiek spojrzeć w województwie łódzkim, widać jedynie zniszczenie. Upadek, polityka Bractwa, wojny pomiędzy watażkami, a w końcu nawet nasz bunt przeciwko dawnym despotom obróciły region w ruinę. Miasta nadal stoją, tylko pozornie uszkodzone walkami, lecz wkrótce także one odczują skutki krzywd wyrządzonych ziemi. \n\nPola uprawne został zatrute przez wiszące nad nimi szare chmury smogu, a lekkomyślny industrializm zatopił kły w krwiobiegu kraju. Nieudane próby Bractwa, by zapobiec Blackoutowi, przekształciły również wiele niegdyś pięknych lasów w pustkowia pełne pniaków i zadeptanej zieleni. \n\nProblemy tylko się pogarszają w miarę zbliżania do Bełchatowa i jego rodzimego elektrycznego potwora. Ta pożerająca węgiel maszyna wyrządziła ekosystemowi tyle szkód, że nie mamy pewności, czy przez długi czas zdoła wyrosnąć w jej pobliżu cokolwiek zdrowego. \n\nNaszym obowiązkiem jest teraz chwycić za łopaty i pługi, by odzyskać okopconą ziemię - sadzonka po sadzonce."

ATM_revitalizing_countryside: "Rewitalizacja wsi"
ATM_revitalizing_countryside_desc: "Minęło trochę czasu, zanim pierwsza partia nasion wykiełkowała, zamiast zwiędnąć. Widok kolejnych pokoleń roślin ginących w skażonej ziemi wystawiał naszą wiarę na próbę, lecz ostatecznie tylko osłodził późniejsze zbiory. Pełne uzdrowienie gleby zajmie wiele lat. Część szkód może nawet okazać się trwała, lecz kilka skarłowaciałych ziemniaków i tak jest lepsze niż prawdziwa klęska głodu. Niby nic wielkiego, ale to uczciwa robota."

ATM_pentomic_army: "Armia Pentomiczna"
ATM_pentomic_army_desc: "Na atomowym polu bitwy skupienie sił w tradycyjnym klinie pancernym tworzy doskonały cel dla taktycznej broni jądrowej. Doktryna pentomiczna odpowiada na to zagrożenie, dzieląc każdą formację na pięć podległych jednostek, zdolnych do rozmieszczenia i podjęcia działań znacznie szybciej niż konwencjonalne brygady, a zarazem dysponujących większymi możliwościami ofensywnymi niż zwykłe bataliony.\nKoncepcja pentomiczna łączy elementy należące zazwyczaj do kilku różnych jednostek w bardziej zrównoważoną dywizję, ograniczając konieczność komunikacji między odrębnymi strukturami dowodzenia, która mogłaby powodować opóźnienia."

ATM_climate_agency: "Narodowa Agencja Klimatyczna"
ATM_climate_agency_desc: "Skoro rozpoczęliśmy walkę ze smogiem, potrzebujemy organu regulacyjnego, który zapewni całemu przedsięwzięciu nadzór i wyznaczy kierunek. Taką rolę odegra nowo utworzona agencja. Zgromadzą się w niej najwybitniejsze umysły, jakie może zaoferować nasz kraj po Upadku, aby badać, opracowywać i wdrażać inicjatywy niezbędne do przywrócenia Polsce dawnego naturalnego piękna. Oczyszczanie wody, wychwytywanie dwutlenku węgla, a nawet radykalne przemiany mogące spowolnić gospodarkę - podejmiemy się wszystkiego, jeżeli pozwoli nam to zniszczyć plagę stworzoną przez chciwość Bractwa."

ATM_gadomski_plan: "Plan Gadomskiego"
ATM_gadomski_plan_desc: "Łącząc rozbudowany system prywatnych inicjatyw z drobną domieszką centralnego planowania, plan gospodarczy Gadomskiego pozwala nam powoli uśpić zranionego kolosa, którym była machina przemysłowa Bractwa, nie powodując przy tym niepotrzebnych szkód społecznych ani gospodarczych."

ATM_reduction_plan: "Plan Wielkiej Redukcji"
ATM_reduction_plan_desc: "Zwierzęta, drzewa i wszystkie pozostałe istoty żywe zasługują na nasz szacunek! Przez cały okres swego istnienia Bractwo Węgla doszczętnie niszczyło środowisko. Cały przemysł i energetyka, a nawet ogrzewanie domów, opierały się na węglu! Wyrządziło to astronomiczne szkody, doprowadzając do śmierci niezliczonych ludzi i zwierząt oraz stawiając roślinność na krawędzi zagłady!\n\nŚrodowisko jest wspólnym dobrem całej ludzkości. Pora zacząć o nie dbać, zanim będzie za późno na odwrót. Musimy zmodernizować zatruwające otoczenie domowe systemy grzewcze, przekształcić fabryki według bardziej ekologicznego modelu, a elektrownie przebudować na nowoczesne, niskoemisyjne zakłady. Troska o przyrodę przyniesie nam więcej korzyści niż jej niszczenie! A odkręcenie wszystkiego, czego dotknęło Bractwo, będzie wymagało mnóstwa pracy."

ATM_fear_of_the_atom: "Strach przed atomem"
ATM_fear_of_the_atom_desc: "Czarnobyl, Fukushima, Bałuty. Te trzy nazwy powtarzano niczym mantrę i na stałe wryły się one w umysły Polaków. Przez cały okres swoich rządów Bractwo Węgla podsycało narastającą spiralę strachu i nienawiści wobec ekologicznej, wydajnej energetyki jądrowej za pomocą nikczemnej prowęglowej propagandy. Dzisiejsza technologia jest jednak inna: margines bezpieczeństwa znacznie wzrósł, a systemy zabezpieczeń stały się zaawansowane. Kult Ziemkiewicza nawet zza grobu próbuje odciągnąć nas od wizji taniej i czystej elektryczności.\n\nCo więcej, samo słowo \"atom\" budzi lęk po niewyjaśnionej do dziś katastrofie sprzed kilku lat. Nie można wykluczyć, że cała sytuacja była wynikiem spisku Ziemkiewicza z Niemcami, choć nikt nie odważył się jeszcze powiedzieć tego głośno.\n\nNaszym priorytetem jest zmiana sposobu myślenia ludności. Audycje odrodzonego radia i telewizji, materiały w internecie oraz artykuły prasowe stanowią dobry początek drogi do stworzenia legionu zwolenników energetyki jądrowej."

ATM_zeppelin_in_the_atomic_age_idea: "Sterowce ery atomowej"
ATM_zeppelin_in_the_atomic_age_idea_desc: "Czy istnieje potężniejsza podniebna jednostka niż sterowiec? W rzadkim przejawie zgodności zarówno my, jak i Ziemkiewicz odpowiadamy na to pytanie stanowczym NIE. Ich plany były nieefektywnym bałaganem, który albo nigdy nie oderwałby się od ziemi, albo po prostu eksplodowałby chwilę po uruchomieniu, lecz sam pomysł był słuszny. Gdzieś w swojej niewielkiej chacie stary Paladyn na widok tego podniebnego kolosa uroni łzę dumy. Jego marzenia o postępie stały się rzeczywistością, choć pod nieco innym kierownictwem."

ATM_eco_org_idea: "Odrodzenie organizacji ekologicznych"
ATM_eco_org_idea_desc: "Czy kiedykolwiek przyjrzałeś się smutnemu stanowi naszego środowiska, będącemu skutkiem dziesięcioleci zanieczyszczeń i zaniedbań? Czy popierasz zrównoważony rozwój i nie chcesz mieć udziału w dalszym niszczeniu przyrody? Czy pragniesz odwrócić bieg wydarzeń, powstrzymać zmianę klimatu i pomóc odtworzyć zieloną duszę naszej planety? \n\nBardziej niż kiedykolwiek wcześniej Matka Natura potrzebuje odważnych dusz, które dołączą do awangardy walczącej o przetrwanie Ziemi. Wstąp już dziś do Greenpeace i pomóż zapewnić lepszą przyszłość wszystkim dzieciom Gai."

ATM_eco_org_idea2: "Zielony strach"
ATM_eco_org_idea2_desc: "Czy kiedykolwiek zastanawiałeś się, czy Wiechowcom naprawdę zależy na środowisku? Czy masz dość nieustannych pustych obietnic, podczas gdy w wielu fabrykach kraju nadal spala się węgiel? Czy chcesz powstrzymać sekciarskie oddanie Atomowi i skupić się na odnawialnych źródłach energii, które naprawdę działają? \n\nBardziej niż kiedykolwiek wcześniej Matka Natura potrzebuje odważnych dusz, które przeciwstawią się wszystkim wypaczającym walkę o przetrwanie Ziemi. Wstąp już dziś do Greenpeace i pomóż utrzymać ruch ekologiczny na właściwej drodze."

ATM_eco_org_idea3: "Zielona panika"
ATM_eco_org_idea3_desc: "Czy zauważyłeś, jak tłumione są głosy domagające się naprawdę czystej energii? Czy masz dość nieustannego upadku wywołanego lekceważeniem środowiska przez Wiecha? Czy chcesz przeciwstawić się atomowym kultystom, zanim zniszczą wszystko, co jest nam drogie? \n\nBardziej niż kiedykolwiek wcześniej Matka Natura potrzebuje odważnych dusz, które udaremnią wszystkie próby zniszczenia naszej wspólnej przyszłości. Wstąp już dziś do Greenpeace i pomóż powstrzymać dalszy rozwój szkodliwej technologii atomowej."

ATM_eco_org_idea4: "Zielony terror"
ATM_eco_org_idea4_desc: "Czy doszedłeś do wniosku, że wiechowcy utracili prawo do życia w chwili, gdy wypowiedzieli wojnę naszej planecie? Czy jesteś gotów walczyć z całych sił? Czy chcesz dokonać sprawiedliwej zemsty na wrogach ruchu klimatycznego? \n\nBardziej niż kiedykolwiek wcześniej Matka Natura potrzebuje odważnych dusz, które zabiją atomowe ścierwo i przywrócą światu równowagę. Wstąp już dziś do Greenpeace i pomóż odzyskać kraj w imię Gai."

ATM_oze_idea: "Subsydia dla energii odnawialnej"
ATM_oze_idea_desc: "Depcząc ptaki, osobliwe pustynie i ryby, nie cofniemy się przed niczym, by uruchomić i sfinansować każde możliwe odnawialne źródło energii. Fotowoltaika na każdym domu, wiatraki na każdym wzgórzu, zapora na każdej rzece. Mamy to gdzieś - nasza droga do pełnej dekarbonizacji nie może się zatrzymać tylko dlatego, że porządnej elektrowni jądrowej nie da się zbudować w tydzień. Wszystko to da nam więcej energii, większe możliwości odchodzenia od spalania węgla, a ostatecznie pozwoli uratować planetę - poczynając od tego kraju."


ATM_captain_planet_idea: "Kapitan Planeta"
ATM_captain_planet_idea_desc: "Bohaterowie zyskują przydomki. Większość zdobywa je w walce, inni w uznaniu zasług dla pokoju. Niektórzy stają się znani z własnych niedoskonałości, a pechowców historia obdarza odpowiednikiem szyderczego przezwiska. \n\nJakub Wiech nigdy nie przypuszczał, że zostanie zapamiętany inaczej niż jako średnio rozpoznawalny dziennikarz próbujący mówić prawdę władzy. Nici losu poprowadziły go jednak przez niezwykłą opowieść o odkupieniu i triumfie. \n\nJego tytuł - \"Kapitan Planeta\" - może niewiele znaczyć dla zewnętrznego obserwatora, lecz dla nas jest symbolem nowej, lepszej epoki i przypomnieniem wszystkich przeszkód, które pokonaliśmy. I brzmi o wiele lepiej niż Hałabała."

ATM_rad_eaters_idea: "Radożercy"
ATM_rad_eaters_idea_desc: "Tak jak Polska przed Upadkiem miała GROM, a Ziemkiewicz zawsze mógł liczyć na elitarny oddział Paladynów, tak my możemy polegać na Radożercach, którzy wykonają za nas całą brudną robotę. Uzbrojone po zęby w najnowszą generację broni do skrytego działania i gotowe bez chwili wahania oddać życie za sprawę atomu, nasze bezmyślne osiłki mają tylko jeden cel - zabijać na chwałę Krucjaty. \n\nStrzeżcie się, wrogowie Atomu. Śmierć nadejdzie, gdy najmniej będziecie się jej spodziewać."

ATM_atoms_bulwark: "Atomowy bastion"
ATM_atoms_bulwark_desc: "Mały kamyk emanuje potęgą, jakiej nigdy wcześniej nie widzieliśmy. Błaga, by jej użyć. Chce, abyśmy skorzystali z jej darów. Jest potężna. Zbyt potężna. Nieskończona otchłań przyciąga nasz wzrok i kusi, byśmy z tęsknotą wpatrywali się w jej mroczne głębiny. Jeżeli nie zachowamy ostrożności, odmieni nas na zawsze. Musimy trzymać ją na łańcuchu i ograniczyć jej wykorzystanie do tego, co przynosi korzyści bez wyrządzania krzywdy. W przeciwnym razie żądza potęgi może nas pochłonąć. Czy jednak odmowa rozważenia granic własnej siły nie jest grzechem? Zwłaszcza teraz, gdy stanęliśmy na progu wszechmocy? Moglibyśmy zostać bogami pośród ludzi... \nJakie będzie więc nasze dziedzictwo?"

ATM_bulwark_safe: "Atomowy bastion - Bezpieczeństwo"
ATM_bulwark_safe_desc: "Najwyższa potęga niesie ze sobą najwyższą odpowiedzialność. Ci, którzy wykorzystują ją w nikczemnych celach, z pewnością zapiszą się w historii jako najwięksi złoczyńcy, ponieważ nawet zwycięzcy zostają ostatecznie zmiażdżeni pod ciężarem własnych zbrodni moralnych. Zamiast skazywać się na podążanie mętną ścieżką utylitarnych usprawiedliwień, wolimy zostać dobroczynnymi strażnikami tajemnic Atomu: obdarzać ich korzyściami godnych i nie pozwalać zaślepionym nienawiścią oraz ambicją wyzwolić ich prawdziwego potencjału. Łatwo ulec zepsuciu. My udowodnimy, że potrafimy wznieść się ponad chaos i dochować pierwotnej obietnicy."

ATM_bulwark_deadly: "Atomowy bastion - Śmiertelność"
ATM_bulwark_deadly_desc: "Skazać jednego czy skazać milion? Wybór wydaje się prosty, prawda? Zamiast uginać się przed kaprysami moralistów, którzy całe życie spędzili z dala od okrucieństwa szerszego świata, podążamy za tym, co zapewnia nam przetrwanie, nawet kosztem kilku dodatkowych ofiar. W naszej ponurej rzeczywistości wszystko często sprowadza się do prostej zasady - \"zjedz albo zostań zjedzony\" - a zaszliśmy zbyt daleko, by pozwolić, aby wszystko wymknęło nam się z rąk. Cokolwiek się stanie, wolimy żyć i budzić strach, niż umrzeć i zyskać szacunek. Historię i tak piszą zwycięzcy."

ATM_maria_II_reactor: "Reaktor Jądrowy 'MARIA II'"
ATM_maria_II_reactor_desc: "W rekordowym tempie, zważywszy na warunki panujące w Polsce po Upadku, ukończono pierwszy blok Elektrowni Jądrowej Bełchatów, nazwany na cześć słynnego reaktora badawczego MARIA w Świerku.\n\nPonieważ blok numer 12 zamiast kotłów parowych wyposażono w turbiny, możliwe było uproszczenie procesu dostosowania istniejących systemów recyrkulacji wody do potrzeb obecnego reaktora MARIA II.\n\nJednostka może wytwarzać 1000 MW energii, dzięki czemu jest zarówno \"czystsza\", jak i wydajniejsza od starego bloku energetycznego o mocy 850 MW.\n\nZbudowanie reaktora w strefie działań wojennych to doprawdy imponujące osiągnięcie.\nMiejmy tylko nadzieję, że nic mu się nie stanie..."

ATM_consortium_supplies: "Zaopatrzenie z Konsorcjum"
ATM_consortium_supplies_desc: "Kierownictwo Konsorcjum, choć od dawna nie ma już czym zarządzać, nadal istnieje. Pozostawieni sami sobie zeszli do podziemia, próbując ocalić swoje przedsiębiorstwa przed ciemiężycielem.\n\nPośród szarego morza Bractwa znajduje się jednak zielona oaza.\n\nTeraz, gdy prowadzimy pełnowymiarową walkę z Bractwem Węgla, wsparcie naprawdę płynie do nas od Konsorcjum. Obejmuje fundusze od Skrzydlewskiego, broń od Rutkowskiego oraz pozostawione przez Ebrantila karetki, które wzmacniają nasze szeregi i reperują budżet, pozwalając kontynuować walkę z Ziemkiewiczem.\n\nKonsorcjum, jak każde przedsiębiorstwo, woli nazywać to inwestycją niż pomocą materialną. Liczy na możliwość wyjścia z podziemia.\n\nTylko czas pokaże, czy inwestycja im się opłaci..."

ATM_diverting_resources_idea: "Przesuwanie środków"
ATM_diverting_resources_idea_desc: "Budowa reaktora jądrowego wcale nie jest tak prosta, jak mogłoby się początkowo wydawać.\n\nAby przeciwdziałać katastrofie narzuconej nam przez Bractwo, musimy zbudować go jak najszybciej. Zadanie to wymaga całego zestawu rozmaitych materiałów.\n\nSetki ton betonu i stali, dziesiątki ton podzespołów elektronicznych i mechanicznych, a także wiele ton rzeczy tak przyziemnych jak asfalt lub żwir na drogi dojazdowe czy ceramika do pracowniczych toalet. Wszystko to trzeba gdzieś wyprodukować.\n\nDlatego musimy przestawić naszą gospodarkę na inne tory. Powinien prowadzić nas tylko jeden cel: jak najszybsze ukończenie projektu. Oczywiście przy zachowaniu pewnych norm bezpieczeństwa."

ATM_belchatow_failed: "Upadły program atomowy"
ATM_belchatow_failed_desc: "§RStało się...\nWszyscy się tego obawiali i naprawdę to się stało...§!\n\nWskutek wadliwego projektu układu chłodzenia rdzeń reaktora uległ stopieniu. Strażacy i pracownicy Elektrowni Jądrowej Bełchatów natychmiast rozpoczęli ograniczanie skutków awarii. Dzięki wysiłkom naszych bohaterów praktycznie wyeliminowaliśmy ryzyko skażenia atmosfery i gleby w regionie, zapobiegając pełnowymiarowej katastrofie ekologicznej.\n\nSytuacja zmusiła najwyższe władze do utworzenia kordonu bezpieczeństwa wokół całej \"Strefy Zagrożenia\", aby odizolować ludność od potencjalnych niebezpieczeństw.\n\nJeszcze gorsze jest jednak to, że utraciliśmy zaufanie społeczeństwa.\n\nCzarnobyl, Fukushima i Bałuty - znaczna część naszego narodu już wcześniej obawiała się energetyki jądrowej. Teraz do tej grupy dołącza Bełchatów i prawdopodobnie nigdy nie zdołamy wznowić programu jądrowego w naszej ojczyźnie, mimo że nadal jest to najbezpieczniejsza forma energii, jaką kiedykolwiek stworzono.\n\nNiestety ludzie wiedzą lepiej..."

ATM_pacification: "Akcja pacyfikacyjna"
ATM_pacification_desc: "Zamordowanie wysokiego rangą urzędnika pracującego nad rozwojem energetyki atomowej jest niedopuszczalnym aktem barbarzyńskiego terroryzmu! Rzeźnicy z Greenpeace, najpewniej finansowani przez Niemcy, utworzyli bojówki destabilizujące naszą sytuację wewnętrzną! ONZ postanowiła nie angażować się w żadne rozmowy pokojowe, a ludzie, którzy ulegli propagandzie strachu, wyszli na ulice.\n\nNegocjacje były krótkie.\n\nNiestety, choć bardzo chcielibyśmy tego uniknąć, musimy odpowiedzieć siłą. Pora spacyfikować strajki i zwalczyć bojowników Greenpeace. Nie będzie to łatwe, ponieważ część fanatyków jest gotowa umrzeć za swoją donkiszotowską walkę, lecz ich życie jest ofiarą, którą jesteśmy gotowi ponieść. Aby zjednoczyć kraj, musimy ustabilizować sytuację wewnętrzną."

ATM_atomic_science: "Atomowa nauka"
ATM_atomic_science_desc: "Wraz z przywracaniem krajowego systemu edukacji do życia nasza Krucjata kieruje go z całych sił ku naukom ścisłym, zwłaszcza wszystkiemu, co związane z atomem. Fizyka jądrowa, inżynieria i wiele innych dziedzin otrzymują najlepszych profesorów z kraju i zagranicy, a ich studenci korzystają z hojnych stypendiów oraz kredytów, czasami niemal za samo zaliczenie pierwszego roku. Tak silne skupienie na fizyce i inżynierii z pewnością zapewni nam liczną, oddaną kadrę naukowców zajmujących się dokładnie tym, co stanowi istotę naszego ruchu."

ATM_civilian_usage: "Cywilne wykorzystanie uranu"
ATM_civilian_usage_desc: "Nauka atomowa nie sprowadza się do głowic jądrowych i widowiskowych megaprojektów reaktorów. Czasami naprawdę liczą się pozornie nieciekawe, codzienne zastosowania. Niepozorny radioizotop ratujący życie śmiertelnie chorego pacjenta. Nowa metoda obrazowania wykrywająca niewielki wyciek, zanim zagrozi całemu rurociągowi. Pierwiastek promieniotwórczy zwalczający szkodniki lepiej niż jakikolwiek zwykły środek chemiczny. Większość pomniejszych watażków wyśmiałaby naszą politykę wciskania Atomu do niemal każdej dziedziny codziennego życia, lecz właśnie to pozwala nam stale wyprzedzać konkurencję. Niech się śmieją - te niewielkie świecące kamyki są kluczem do naszego zwycięstwa."

ATM_cleansing_ranks: "Oczyszczanie szeregów"
ATM_cleansing_ranks_desc: "Dziedziczenie po poprzednikach jest wspaniałe, dopóki nie trzeba zająć się szkodnikami. Da się nad tym zapanować, gdy nagroda nie jest większa od domu, lecz gdy całą agencję wywiadowczą opanowały karaluchy, szczury i kameleony, potrzeba znacznie więcej niż puszka trutki. W ostatnich dniach Bractwa, Janecki wypełnił swoje dzieło taką ilością trującej węglowej ideologii, jaką tylko zdołały pomieścić cztery ściany siedziby organizacji. Bez obaw. Wyrwiemy każdy z tych paskudnych chwastów."
ATM_cleansing_ranks_tt: "Rozpoczniemy oczyszczanie szeregów naszych agentów specjalnych. Po zakończeniu otrzymamy dwóch lojalnych i oddanych agentów do naszej siatki szpiegowskiej."
