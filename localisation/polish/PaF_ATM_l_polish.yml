atom_plant.12.t: "Fantastyczna Inżynier Woo"
atom_plant.12.desc: "Jeżeli biuro miało w pełni działające ogrzewanie i oświetlenie, a nocą nie przypominało Prypeci, można je było uznać za luksusowe. Dawny ratusz był kiedyś właśnie takim wspaniałym biurem. Okolica oferowała niewiele pod względem siły roboczej i istotnych zasobów, lecz położenie sprawiało, że było to idealne miejsce do wdrażania nowych pracowników. Mój pokój był największy. Kiedyś musiał należeć do burmistrza. Moja praca była prosta i nieproporcjonalnie ważna: odpowiadać na setki ogłoszeń o pracę, które zamieściliśmy na całym świecie. Od Ameryki po Chiny próbowaliśmy rekrutować inżynierów jądrowych i fizyków, by wyszkolili naszą własną kadrę ekspertów. Reaktory SMR nie będą przecież konserwować się same. Problem polegał na tym, że w szczytowym okresie wojny domowej nie było wielu, a właściwie żadnych choćby odrobinę wykwalifikowanych specjalistów na tyle odważnych, by przybyć do strefy wojny. Pal licho bezpieczeństwo: czy mogliśmy zagwarantować im choćby wygodę? Dostęp do internetu? Rzeczy, bez których nie wyobrażali sobie życia? Z pewnością musielibyśmy płacić im w euro lub dolarach, co stanowiło zupełnie inne wyzwanie.\nWszedł mój pierwszy kandydat. Blondyn wyglądający po części jak naukowiec, a po części jak klon Guya Fieriego. Porozmawialiśmy o tym, skąd pochodzi. Z jego przeszłości zdołałem wyciągnąć najwyżej tyle, że jest... fantastyczny.\n- Proszę mi przypomnieć. Dlaczego zgłosił się pan do tej pracy?\n- Chodzili od drzwi do drzwi i pytali, czy ktoś zna jakichś naukowców. Powiedziałem: nie szukajcie dalej.\n- Ma pan jakieś wykształcenie z fizyki teoretycznej?\n- Ależ oczywiście, mam teoretyczny dyplom z fizyki! Jest fantastyczny, tak jak ja! Mam go tutaj.\nŻałosny kawałek pokracznego papieru, który mi pokazał, zdecydowanie nie był fantastyczny. Oczywiście nie powiedziałem mu, że witamy na pokładzie.\nJeśli chcę zatrzymać swój elegancki gabinet, muszę zacząć dostarczać rekrutów, i to szybko. Nadzieja zapłonęła jasno, gdy dostałem odpowiedź z Korei. Stosunkowo młoda inżynierka jądrowa szukająca pracy. Dyplom prawdziwy, najlepsza na roku, znakomite listy polecające. Jakimś cudem od sześciu miesięcy bez pracy. Naprawdę gotowa przyjechać akurat do Polski... nauczyć się języka...\nCzy to nie było zbyt piękne, by mogło być prawdziwe?\nNieważne. Zaledwie dwa tygodnie później wreszcie zjawiła się w moim gabinecie. Po wejściu rozglądała się, jakby nigdy w życiu nie widziała biura. Poruszała rękami niczym dyrygent orkiestry... Dopiero potem weszła do środka, nadal rozglądając się ze zdziwieniem. O co jej chodzi? Czego się spodziewała?\nRozmawialiśmy po angielsku. To, jak wiele umiała po polsku po tak krótkim czasie nauki, było zdumiewające, lecz jej głos brzmiał dziwnie monotonnie. Wystrzeliwała sylaby niczym maszyna do pisania. Czasem trudno było mi nadążyć za jej słowami, mimo że posługiwaliśmy się wspólnym językiem.\n- Jakie ma pani doświadczenie w pracy z reaktorami SMR?\n- Jako stażystka KHNP wykazałam się biegłością w konserwacji SMR. Samodzielnie instalowałam, konfigurowałam i usuwałam usterki. Może pan zapoznać się z moimi referencjami.\nNie nawiązywała kontaktu wzrokowego.\n- Dlaczego po studiach nie została pani w KHNP? Najlepsze oceny na Uniwersytecie Narodowym w Seulu... z pewnością błagali, żeby przyjęła pani ich ofertę.\n- Tak. Zostałam tam około siedmiu miesięcy.\n- Dlaczego pani odeszła... wie pani co, nieważne. Prawda jest taka, że z wiarygodnym dyplomem i tak dostałaby pani tę pracę. Wkrótce zadzwonimy w sprawie pierwszego przydziału."
atom_plant.12.a: "Witamy na pokładzie, panno Woo."

atom_plant.13.t: "Per Aspera"
atom_plant.13.desc: "Piramidy egipskie. Koloseum. Hagia Sophia. Wszystkie te budowle wzniosły wielkie mocarstwa swoich czasów i na zawsze pozostaną pomnikami ludzkiej pomysłowości. Dziś nie wydają się aż tak imponujące w porównaniu ze współczesnymi kompleksami.\n\nZachwycamy się nimi jednak w odniesieniu do ówczesnych możliwości człowieka. Teraz, gdy potęga cywilizacyjna Polski leży w rynsztoku, samodzielne przekształcenie ogromnej elektrowni wydaje się gigantycznym wyczynem. Nie będzie to jednak taka opowieść. Tak jak Koloseum zbudowano przy użyciu starożytnej technologii, tak my osiągniemy cel pomimo naszych niedostatków.\n\nNasz własny wielki projekt: Elektrownia Jądrowa Bełchatów. Triumf nad przeszłością, w której doprowadzaliśmy planetę do ruiny.\n\nJa, wiechowiec, byłem niegdyś straszydłem, bajką mającą przerazić Bractwo i zmusić je do uległości. Z widma stałem się nową nadzieją kraju. Musiałem. Chciałem. Kraj trzeba było uratować nie przed biedą ani wojną... lecz przed rozpaczą. To najgorsza część każdego upadku. Rozpacz, podobnie jak strach, jest zabójcą paraliżującym umysł i ciało, zapraszającym śmierć i apatię. Najgorsze, co można zrobić, to nie robić nic. Jest jak drapieżnik zaciskający się wokół ciebie i uniemożliwiający ucieczkę, miażdżący tym mocniej, im mniej się szarpiesz. Jak czarna dziura po przekroczeniu horyzontu zdarzeń.\n\nTakie projekty są ogromnym, namacalnym przypomnieniem, by pokonać strach. Pozwól mu przeniknąć przez siebie i zostawić cię za sobą. Gdy wszystko wydaje się stracone i nic nie możesz zrobić, czasem potrzebujesz odrobiny otuchy, by wiedzieć, że jednak możesz coś uczynić. Że jeszcze Polska nie zginęła.\n\nAby jednak ten przykład mógł rozbłysnąć, plan musi zadziałać. Wszystko sprowadza się do mocy, mocy Atomu. Jesteśmy gotowi. Musimy być gotowi. Jeżeli coś pójdzie nie tak, ale zdążymy to naprawić, zanim stanie się poważnym problemem, wykonaliśmy dobrą robotę. Bełchatów będzie karmił nas energią, nie dusząc nas przy tym. Musi. Zebraliśmy każdego inżyniera jądrowego, jakiego udało się znaleźć, a nawet więcej, zgromadziliśmy uran, dostosowaliśmy sieć... to zadziała. Musi zadziałać.\n\nCzas pokaże, czy będziemy musieli wrócić do deski kreślarskiej, czy zdołamy rozpalić atomową latarnię nadziei dla całego narodu. Jego bijące serce, pompujące elektryczną krew życia do każdego gniazdka."
atom_plant.13.a: "Zarówno elektryczne, jak i duchowe."

atom_plant.14.t: "Przywoływanie"
atom_plant.14.desc: "Nasi przodkowie błagali przedmioty nieożywione i bożki o szczęście, deszcz i władzę. Pan Twardowski zawarł pakt z diabłem. My zaś zabiegamy o względy sił znacznie potężniejszych i straszniejszych, które jedną ręką mogą zabijać... a drugą obdarzać nieograniczoną mocą. \n\nNasze plany są gotowe, surowe grymuary, które poprowadzą nasze dłonie. Ostatni krok to wziąć je i budować, stworzyć wielkie betonowe miejsca nieustającego rytuału rozszczepiania atomu, który zasili naszą przyszłość i marzenia, wynosząc Polskę z powrotem do grona rozwiniętych cywilizacji. \n\nReaktor. Doprowadzenie pary. Okablowanie. Pozostało tylko je zbudować. A wtedy rozpocznie się rytuał: atomy będą się rozszczepiać, woda wrzeć, turbiny obracać... wszystko, o czym marzyliśmy i za co walczyliśmy, ożyje. Harmonogram jest niezwykle krótki. W \"cywilizowanych\" warunkach zajęłoby to niemal dekadę. Nie są to jednak cywilizowane warunki. Zmobilizować wszystkie posiadane maszyny, zorganizować równoległą budowę wszystkiego, co się da, masowy szarwark, rekwizycje... Nasze plany wymagają najwyższej intensywności. \n\nWbrew powszechnemu rozsądkowi już gromadzimy rudy uranu. Mówili nam, że nie możemy ich po prostu sprowadzić. Mówili, że poszukiwanie ich tutaj byłoby szaleństwem. Mówili, że równie dobrze możemy sprzedać dusze diabłom. \nNie. \nNaszą magią jest nauka. Nasze dusze pozostają bezpieczne i nieskalane. Od teraz zawieramy umowy wyłącznie z Atomem. \n\nPrecz, szatanie. Napisano bowiem, że tylko Bóg zasługuje na cześć. \n\nDo pracy, bracia. Mamy wolę i maszyny, by wznieść wielkość na przekór stadu tchórzy oglądających się na Łódź i jej tragedię. Gdy popłynie energia, ich strach ustąpi na dobre."
atom_plant.14.a: "Napisano bowiem też: Chwała patrzącym w przyszłość!"

atom_plant.15.t: "AWARYJNE WYŁĄCZENIE"
atom_plant.15.desc: "Elektrownia Jądrowa Bełchatów, blok nr 12\n\nGODZINA 0 - Początkowa awaria układu chłodzenia\nO 7:36 wykryto anomalię w głównym układzie chłodzenia ciśnieniowego reaktora wodnego Elektrowni Jądrowej Bełchatów. \nWstępne dane wskazywały na usterkę mechanizmów obiegu chłodziwa.\n\nGODZINA 1 - Wzrost temperatury i ciśnienia:\nTemperatura i ciśnienie rdzenia reaktora zaczęły przekraczać limity eksploatacyjne.\nUruchomiono awaryjne mechanizmy chłodzenia, lecz ich skuteczność ograniczył rozmiar awarii układu chłodziwa.\n\nGODZINA 2 - Początek procesu stopienia rdzenia\nPomimo awaryjnego chłodzenia pręty paliwowe reaktora zaczęły przekraczać temperaturę krytyczną, rozpoczynając proces topienia rdzenia.\nPojawiły się oznaki naruszenia systemów obudowy bezpieczeństwa i możliwego uwolnienia materiałów promieniotwórczych.\nPersonel elektrowni uruchomił procedurę ewakuacji awaryjnej.\nWładze lokalne i służby ratunkowe rozpoczęły ewakuację pobliskich mieszkańców.\n\nGODZINA 3 - Alarm i pomoc:\nDo międzynarodowych organów nadzoru jądrowego i sąsiednich państw wysłano zawiadomienia o rozwijającej się sytuacji awaryjnej - z wyjątkiem Niemiec.\nZwrócono się o wyspecjalizowane zespoły i zasoby potrzebne do opanowania kryzysu.\nWdrożono działania mające ustanowić bezpieczny obwód i ograniczyć rozprzestrzenianie skażeń promieniotwórczych.\nTrwa monitorowanie poziomu promieniowania na dotkniętych obszarach.\n\nSytuacja pozostaje pod kontrolą; działania zabezpieczające trwają. Władze ściśle monitorują poziom promieniowania na dotkniętych obszarach. Prowadzone jest kompleksowe dochodzenie mające ustalić pierwotną przyczynę awarii układu chłodzenia. W miarę postępów dochodzenia publikowane będą kolejne komunikaty, które pozwolą dokładniej zrozumieć incydent i przyczynią się do przyszłych środków bezpieczeństwa w obiektach jądrowych."
atom_plant.15.a: "Kurwa."

atom_plant.16.t: "Elektrownia Jądrowa Bełchatów została uruchomiona!"
atom_plant.16.desc: "Dokonaliśmy tego. \nŚrodkowa Polska ponownie ucztuje na energii z Bełchatowa, tym razem wytwarzanej przez nowszego, czystszego i lepszego dostawcę zbudowanego na miejscu poprzedniego. Przemysłową machinę lepszą od starego, ziejącego smogiem monstrum, które wreszcie zapadło w wieczny sen. \n\nWbrew wszystkiemu - wojnie domowej, zrujnowanej gospodarce, nastrojom ludności - osiągnęliśmy to, czego poprzednie rządy nie potrafiły dokonać przez pół wieku. \n\nMożemy być z siebie dumni... \nWreszcie przynieśliśmy Polsce Atom."
atom_plant.16.a: "Okazuje się, że Polak potrafi!"

atom_plant.17.t: "Pierwsza fala reaktorów SMR pracuje!"
atom_plant.17.t.b: "Druga fala reaktorów SMR pracuje!"
atom_plant.17.t.c: "Trzecia fala reaktorów SMR pracuje!"
atom_plant.17.t.d: "Ostatnia fala reaktorów SMR pracuje!"
atom_plant.17.desc: "Właśnie uruchomiliśmy pierwszą falę małych reaktorów modułowych. Zapewnią nam tak bardzo potrzebną energię elektryczną."
atom_plant.17.desc.b: "Właśnie uruchomiliśmy drugą falę małych reaktorów modułowych. Dostarczą nam więcej prądu, dzięki czemu ludzie wreszcie zaczną żyć tak jak przed Upadkiem."
atom_plant.17.desc.c: "Właśnie uruchomiliśmy trzecią falę małych reaktorów modułowych. Zapewnią nam wygodną nadwyżkę energii."
atom_plant.17.desc.d: "Właśnie uruchomiliśmy ostatnią falę małych reaktorów modułowych. Stanowią ostateczny dowód, że ta technologia może działać nawet w najgorszych warunkach."
atom_plant.17.a: "Nie zwalniać!"
atom_plant.17.b: "Wreszcie możemy odpocząć."

atom_plant.18.t: "Moj dom murem podzielony"
atom_plant.18.desc: "- Bełchatów!? Chcesz umieścić reaktor w jebanym BEŁCHATOWIE? W dosłownym piekle na ziemi, zadymionym, czczącym węgiel i nienawidzącym Atomu Bełchatowie? Oszalałeś? \nJakub Wiech nie był przyzwyczajony do tak agresywnego tonu najbliższych doradców, ale nie trzeba było geniusza, by zrozumieć, że najnowsza decyzja wywołała spore poruszenie. \n- Właśnie. W tym samym Bełchatowie, który kazałeś swoim ludziom wyzwolić z uścisku Bractwa. Jeśli już, powinieneś być dumny, Karol. To dzięki tobie wszystko stało się możliwe. \n- Tak, widziałem to miasto dość razy, by wiedzieć, że nie należy tam wracać. Ty też powinieneś. W tych stronach nie ma nic poza śmiercią i nędzą. Dosłownie każde miejsce byłoby lepsze niż umieszczanie twojego... NASZEGO magnum opus w cieniu tej ohydnej, ziejącej dymem elektrowni. \n- Och, jeśli o to chodzi... Myślałem, że Piotr już ci powiedział. Nie budujemy go obok elektrowni; umieszczamy go wewnątrz kompleksu. Chociaż właściwszym słowem byłoby chyba \"zastępujemy\"... \n\nEkolog widział, jak twarz ministra czerwienieje z gniewu i wykrzywia się w bezbożną mieszaninę tysiąca emocji, gotowych wybuchnąć jednocześnie. Rozważał cofnięcie się, by zwiększyć dystans od coraz bardziej rozwścieczonego rozmówcy, lecz zdołał jedynie spojrzeć z krótkim zdumieniem. \n- Co ty sobie, do cholery, myślisz? Jasne, skoro już przy tym jesteś, postaw go w środku Bałut. Albo zbuduj na jebanym morzu. Nie, wiesz co? Czemu po prostu nie przerzucić go przez niemiecką granicę? Mam dość. Jeśli chcesz wpędzić ten kraj do grobu, lepiej zrób to, kurwa, sam. Nie będę ryzykował życia i reputacji dla tego bajzlu. \n\nWyczerpawszy tyradę i spaliwszy most łączący go z przełożonym, Byzdra natychmiast odmaszerował donikąd. Gdy Wiech stał oszołomiony, szybko podbiegł do niego kolejny doradca, wyrzucając z siebie potok przeprosin. Dysząc, Daniel Czyżewski próbował bronić kolegi: \n- Jakub, tak mi przykro. Myślałem, że wszyscy jesteśmy zgodni. Posłuchaj, pójdę porozmawiać z Karolem. Może zdołam go przekonać. \n- Nie trzeba - odpowiedział Wiech z lekkim śmiechem."
atom_plant.18.a: "- Poza tym i tak zaniedługo wróci."

atom_plant.19.t: "Ludzie i Gigawaty"
atom_plant.19.desc: "Gdy historyk skończył mówić, w tle odtworzono archiwalne nagrania katastrofy w Czarnobylu przy akompaniamencie dość posępnej, pospolitej muzyki. \n\nW tej samej chwili, gdy napisy końcowe zaczęły powoli wpełzać od dołu ekranu, po pokoju rozszedł się dobrze znany dźwięk płyty wysuwanej z odtwarzacza CD, a ekran wrócił do ciemnoszarego menu wyboru. Potem zgasł. \n\nDłoń sięgnęła po błyszczącą metaliczną płytę, opisaną jedynie czarnym markerem, i ostrożnie wsunęła ją z powrotem do papierowej koperty chroniącej przed zarysowaniami. Następnie płyta trafiła na stos wielu innych CD, w odpowiednich pudełkach, kopertach lub czymkolwiek innym. \n\nWiech westchnął i odłożył notes pełen dziesiątek bazgrołów oraz uwag sporządzonych podczas trwającego od kilku dni maratonu dokumentów. Żarnowiec... To było najbliżej, jak Polska kiedykolwiek znalazła się celu, do którego on sam dążył. Ogromny potencjał projektu został całkowicie zaprzepaszczony przez brak inicjatywy Polski Ludowej. Wysiłku włożonego w budowę zrujnowanej dziś Elektrowni Bełchatów nie poświęcono kolosowi, jakim w porównaniu z nią byłby Żarnowiec. \n\nJakub sięgnął po kolejną płytę, lecz zawahał się, zmarszczył nos i skierował uwagę na poplamiony kawą kubek stojący na biurku obok krążków. Filmy nie obrażą się przecież, jeśli zrobi sobie krótką przerwę."
atom_plant.19.a: "To już trzecia czy czwarta?"

atom_plant.20.t: "Jeden z nas"
atom_plant.20.desc: "Andrzej był prostym rolnikiem. Przynajmniej tak chciał, by myślał o nim świat. W Polsce po Upadku obowiązywała prosta zasada przetrwania: nie wychylaj się, nie wzbudzaj zainteresowania nikogo poza najbliższą rodziną, a jeśli nie masz wyjątkowego pecha, wszystko powinno być w porządku. \nAndrzej ze swojej strony dbał, by wyglądać tak zwyczajnie, jak to tylko możliwe. Każdego ranka wstawał, by uprawiać pola, wracał po zachodzie słońca, wypijał jedno albo dwa piwa przed starym telewizorem i szedł spać. Czasem nawet specjalnie udzielał się w wiejskiej społeczności. Nie mógł przecież wyglądać na zbyt wielkiego samotnika. Niepozorny parobek starannie ułożył życiorys tak nudny, że nikomu nie przyszło do głowy kwestionować jego nagłego pojawienia się przed laty. Wszyscy uznali po prostu, że zapomnieli. \nDla własnego bezpieczeństwa Andrzej ukrywał życiorys, który postawiłby go w centrum zainteresowania Atomowej Krucjaty. Fakt ten uderzył go jak cegła, gdy wieczorny program przerwał dzwonek do drzwi. Początkowo go zignorował, lecz kiedy dźwięk się powtórzył, sięgnął po ukryty pistolet i przygotował się na nieuniknione. Uważając na każdy krok, podszedł do drzwi wejściowych, gwałtownie je otworzył i wycelował naładowaną broń prosto w nieznanego napastnika. \nPodczas wielu bezsennych nocy Andrzej często wyobrażał sobie chwilę, gdy przeszłość wróci, by go prześladować. Przed oczami przemknął mu strumień obrazów: płonący wrak Marii, plemienne pieśni bojowników z Wawra, włócznia, która podczas pospiesznej ucieczki wbiła się kilka centymetrów od jego ciała... Inżynier wiedział, że pewnego dnia go znajdą i dokończą dzieła. Spodziewał się ujrzeć osiłka całego pokrytego barwami wojennymi. Zamiast tego człowiek po drugiej stronie lufy był po prostu kolejnym przerażonym jajogłowym. \n- Proszę opuścić broń. Nie chcę pana skrzywdzić. Pan jest Andrzej Bartczak, zgadza się? Główny inżynier reaktora Maria? \n- Kto cię przysłał? - odpowiedział \"rolnik\", powoli opuszczając lufę. \n- Nazywam się Przeworski. Młodszy inżynier Przeworski. Mam pracować pod pańskim kierownictwem w Bełchatowie. Wiech buduje elektrownię jądrową, a pańska wiedza byłaby bezcenna. \n- I co z tego? Chcesz, żebym nadstawił karku i nadzorował kolejny płonący wrak? Dam ci radę, chłopcze. Uciekaj w bezpieczne miejsce, póki możesz. \n- Naprawdę chce pan, żeby do tego sprowadzało się pańskie życie? Najlepszy ekspert jądrowy w całej Polsce, a marnieje pan w wiejskiej chacie jak jakiś ograniczony prostak? \nSłowa musiały trafić w czuły punkt, bo inżynier odpowiedział przez zaciśnięte zęby: \n- Dobrze, ale jeśli coś pójdzie nie tak, pierwszy się stamtąd wynoszę. \n- Świetnie, za godzinę przygotuję transport. A tak bardziej osobiście..."
atom_plant.20.a: "Mógłbym prosić o autograf?"

atom_plant.1003.t: "Negocjacje z GE-Hitachi - Sukces"
atom_plant.1003.desc: "Świetne wieści!\n\nPrzed Upadkiem, hucznie zapowiadana budowa licznych małych reaktorów modułowych (SMR) nie doszła do skutku, a żaden z rządów nie miał niezbędnej woli, by uczynić cokolwiek dla rozwoju naszego bezpieczeństwa energetycznego. Nam samym brakowało technologii i zostaliśmy zmuszeni zwrócić się o wsparcie budowy do podmiotów zagranicznych.\n\nNasz specjalny wysłannik zdołał przekonać wykonawców z GE-Hitachi do podpisania aneksu do umowy w sprawie budowy małych reaktorów modułowych. Teraz to my będziemy beneficjentami porozumienia i jako prawowity rząd sprowadzimy energię atomową do Polski.\n\nProces ten ciągnął się zdecydowanie zbyt długo bez widocznych rezultatów. Pora zabrać się do pracy, a z pomocą naszych nowych-starych partnerów zdołamy zbudować te reaktory w rekordowym czasie. Przynajmniej taki jest plan."
atom_plant.1003.a: "Bierzmy się do pracy!"

atom_plant.2003.t: "Negocjacje z GE-Hitachi - Porażka"
atom_plant.2003.desc: "Źle się dzieje w państwie polskim\n\nPrzed Upadkiem hucznie zapowiadana budowa licznych małych reaktorów modułowych (SMR) nie doszła do skutku, a żaden z rządów nie miał niezbędnej woli, by uczynić cokolwiek dla rozwoju naszego bezpieczeństwa energetycznego. Nam samym brakowało technologii i zostaliśmy zmuszeni zwrócić się o wsparcie budowy do podmiotów zagranicznych.\n\nNasz specjalny wysłannik, który miał renegocjować z GE-Hitachi umowę w sprawie budowy małych reaktorów modułowych, został odprawiony. Nie chcieli ryzykować inwestowania w kraju ogarniętym wojną, zwłaszcza w sektorze tak wrażliwym jak energetyka jądrowa. Martwią się o swój wizerunek i z góry zakładają, że coś pójdzie nie tak.\n\nCóż, nie potrzebujemy ich pomocy. Z pewnością znajdziemy inne rozwiązanie. Nawet jeżeli będziemy musieli zrobić to sami, nic ani nikt nie może stanąć na drodze do realizacji planów energii jądrowej!"
atom_plant.2003.a: "Zapytajmy KHNP!"
atom_plant.2003.b: "Zapytajmy NuScale!"
atom_plant.2003.c: "Musimy działać na własną rękę..."

