unification.145.t: "[GetNewspaper][FROM.GetName] unifies Lesser Poland!"
unification.145.desc: "After months of fierce urban warfare and brotherly conflict, Kraków is at last free, and with it, all of Lesser Poland. Though they were at first perceived as relative outsiders with little chance to expand beyond their isolated positions on the Free City's outskirts, in their fight for human dignity, the soldiers of the Kraków Unification Action displayed discipline and courage unmatched by their more established foes, eventually securing the region's complete unification. Having led the people to this victory, it now falls upon Jan Maria Rokita to transform the directionless organization into a proper government. And while his promises of unity and the safeguarding of unalienable rights can rouse the masses to action, his ties to the former KO regime and circumstances regarding his departure from said party bind him, risking the alienation of the Action's more radical members. Without direction, however, the unification would simply wither in its cradle."
unification.145.a: "Any fool can lead their people to war. A true leader unites them in peacetime."

super.145.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.145.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.145.a: "Wreszcie zjednoczeni."

