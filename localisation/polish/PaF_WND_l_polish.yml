unification.145.t: "[GetNewspaper][FROM.GetName] jednoczy Małopolskę!"
unification.145.desc: "Po miesiącach zaciekłych walk miejskich i bratobójczych starć Kraków jest wreszcie wolny, a wraz z nim cała Małopolska. Początkowo żołnierze Krakowskiej Akcji Zjednoczeniowej uchodzili za przybyszów z zewnątrz, mających niewielkie szanse na wyjście poza swoje odizolowane pozycje na obrzeżach Wolnego Miasta. Walcząc jednak o ludzką godność, wykazali się dyscypliną i odwagą, którym nie dorównywali bardziej ugruntowani przeciwnicy, aż w końcu zdołali całkowicie zjednoczyć region. Po poprowadzeniu ludzi do zwycięstwa Jan Maria Rokita musi teraz przekształcić pozbawioną wyraźnego kierunku organizację w prawdziwy rząd. Jego obietnice jedności i ochrony niezbywalnych praw potrafią porwać masy do działania, lecz związki z dawnym reżimem KO i okoliczności odejścia z tej partii stanowią dla niego obciążenie, grożąc zrażeniem bardziej radykalnych członków Akcji. Bez wyraźnego kierunku całe dzieło zjednoczenia mogłoby jednak zwiędnąć, zanim na dobre zapuści korzenie."
unification.145.a: "Każdy głupiec potrafi poprowadzić swój lud na wojnę. Prawdziwy przywódca jednoczy go w czasach pokoju."

super.145.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.145.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.145.a: "Wreszcie zjednoczeni."

