 JOM_land_of_red_dragon_desc: ""
 
 JOM_empire_of_the_rising_salt: "Imperium Wschodzącej Sól"
 JOM_empire_of_the_rising_salt_desc: ""

 JOM_through_the_njorvasund: "Przez Njorvasund"
 JOM_through_the_njorvasund_desc: ""

 JOM_scourge_of_the_olympus: "Plaga Olimpu"
 JOM_scourge_of_the_olympus_desc: "Na południe płynęliśmy wzdłuż murów piany,\nwyspy całowane ogniem płonęły.\nLaur wieńczył kamienne sale,\nświatło pasło się na szczytach.\nZeus grzmiał z tronu chmur,\nzłoto w zwierciadle pioruna.\nOdyn patrzył z kołyszącego się\nokrętu, gdy wzgórza się zbliżały.\n\nSłońce biło w kamienne członki,\nposągi strzegły granicy.\nGaje oliwne na obrzeżach tronów,\nświątynie utrzymywały porządek.\nMarmur lśnił na jasnych posadzkach,\npłomienie migotały w paleniskach.\nWzgórza cicho brzmiały lirą,\npieśni Myrmidonów chichotały."
 
 JOM_varangians_in_the_miklagardr: "Waregowie w Miklagarðrze"
 JOM_varangians_in_the_miklagardr_desc: "Minarety przebijają zasłony nieba,\ndym przypraw wznosi się przez łuki.\nNiegdyś nosiliśmy kolczugi wysokich,\nzłoci ludzie maszerowali w pochodach.\nBasileus zasiadał tam w koronie,\nprzysięgi składano w chwale.\nDziś mury noszą ślady dźwięku,\necha nucą starą opowieść.\n\nMarmur popękany od blasku słońca,\nna targu pieśni w nowych językach.\nZapach szafranu na runicznych drogach,\nzimni ludzie patrzą sinymi płucami.\nWciąż stoimy tam, gdzie grzmiały tarcze,\nteraz pył okrywa kolumny.\nVæringjar niegdyś śpiewali mieczem,\ndziś kroczymy tu w zadumie."
 
 JOM_on_the_coast_of_saracens: "Na wybrzeżu Saracenów"
 JOM_on_the_coast_of_saracens_desc: "Spiżowe światło uderzyło w kadłub z piasku,\ndługie okręty o stalowych dziobach dryfowały.\nGłośno witaliśmy pełen brzeg,\nczarne flagi wzniosły się na wietrze.\nThor niegdyś wysłał królewskich ludzi,\nostrza ku kaplicy samego Chrystusa.\nDziś żaden krzyż nie znaczy ich kręgów,\ngwiazda i półksiężyc zmagają się ze sobą.\n\nKruki latają, gdzie runęły mury,\ndym wznosi się ze zburzonych świątyń.\nZwoje i kopuły w zaklęciu wezwania,\nzłoto i wersety wykute w kamieniu.\nCedrowe wzgórza skrywają winę duchów,\nkrew wciąż zasala granicę.\nLudzie Jomsborga patrzą na ramę płomieni,\nobcy bogowie wydają rozkazy."
 
