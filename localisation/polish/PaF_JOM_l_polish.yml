 JOM_song_of_ice_and_fire: "Pieśń lodu i ognia"
 JOM_song_of_ice_and_fire_desc: ""

 JOM_land_of_green: "Zielona Kraina"
 JOM_land_of_green_desc: "O ziemio, nad którą ogień uciekł z nieba,\na olbrzymy wypłakały lodowy oddech,\nśpisz pod chłodem młota,\ngdzie ukoronowana śniegiem cisza śpiewa o śmierci.\n\nZielona z nazwy, lecz blada jak mgła,\ntwe urwiska kryją opowieści o dawno zmarłych bogach.\nTam oko Odyna wciąż nawiedza wiatr,\na Loki śmieje się w pieśni lodowca.\n\nŻadna słoneczna włócznia nie przebije twego mrozu,\na jednak przybyliśmy z ogniem i wiosłem.\nBy upomnieć się o ostatni skraj Jörð\ni wznieść domy tam, gdzie nie było nikogo.\n\nO Grenlandio, oblubienico burzy i kamienia,\npozdrawiamy cię nie za łatwość ani plon,\nlecz za siłę, którą daje twoje milczenie,\nrunę, którą ryjesz w mieczu i tarczy."

 JOM_vinland_and_markland: "Vinland i Markland"
 JOM_vinland_and_markland_desc: "Przeprawiliśmy się tam, gdzie morze styka się z krańcem nieba,\nna zachód wielorybim szlakiem, przez mgłę i los,\nku brzegom, gdzie oddychały żelazne lasy,\na czerwona ziemia piła ciężar Północy.\n\nMarkland wynurzył się w cieniu sosen,\nmur kory, śniegu i kamienia,\nlecz w jego sercu bił pradawny rytm,\nniczym sama Jörð, choć nie nasza.\n\nVinland wydał złocistą winorośl,\na jego pola śpiewały cicho pod mrozem.\nUpartymi dłońmi wyrzeźbiliśmy domy\ni krwią zapłaciliśmy cenę nadziei.\n\nO zachodni krewniaku ziemi Midgardu,\nodbiłeś marzenia z lodowych fiordów,\nkraino surowsza, lecz zielona i szeroka,\nszepcie z kuźni samych bogów."

 JOM_visit_ny_jorvik: "Wizyta w Nýjarvíku"
 JOM_visit_ny_jorvik_desc: "Wiosła kąsały pianę na szerokim wielorybim szlaku,\nna zachód płynęliśmy, gdzie gwiazdy się rozchodzą.\nKły stalowych urwisk pięły się ku niebu,\nkamienne włócznie wieńczyło wezwanie ognia.\n\nPanna z pochodnią stoi z gwiazdami na czole,\nzłocisty płomień - przysięga, którą złożyła.\nRuny ludzi w niezliczonych językach\nprzemawiają dymem, gdzie ryczą wielkie wichry.\n\nBębny gorączki złota dudnią w żyłach kolei,\nżelazne żmije pod kamieniem.\nNýjarvík, śmiała bramo Midgardu,\nkorzeniu płomienia i nasiono tronu.\n\nPrzybijamy tu nie z mieczem w dłoni,\nlecz z żaglami marzeń ku obcemu brzegowi.\nNiech los zostanie wyryty w szkle i stali,\na saga powstanie tam, gdzie klękają dawni bogowie."

 JOM_temptation_of_bandarikin: "Pokusa Bandaríkinu"
 JOM_temptation_of_bandarikin_desc: "Słońcem smagana droga pośród wężowych zarośli,\nstalowe buty miażdżą pieśń grzechotnika.\nOddech mokradeł i cisza cyprysów,\nbagno płynie czernią, gdzie korzenie rosną długo.\n\nBestie o spiżowych szczękach w cienistym leżu,\noczy jak węgle ze snu Grímnira.\nBagienne ognie tańczą widmowym krokiem,\nskuci bogowie budzą się w południowym żarze.\n\nKrewni z gołymi ramionami i żelaznym uściskiem\nwykuwają swe życie z ziemi i płomienia.\nSynowie rednecków z miodem na ustach\nstoją niczym jarlowie, nieugięci wobec imienia.\n\nNiech skaldowie zapamiętają Południe,\ngdzie grom kroczy w ludziach.\nGdzie honor śpi w pocałunku karabinu,\na sagi oddychają przez mokradła i trzęsawiska."

 JOM_caribbean_vikings: "Wikingowie z Karaibów"
 JOM_caribbean_vikings_desc: "Żagle zapłonęły w południowej bryzie,\ngdzie morze złociło się w objęciach nieba.\nWyspy przypraw i grzmotu kuszą\nsyrenami odzianymi w koralowy wdzięk.\n\nSmoki burzy wyją wśród tropikalnej piany,\nThor głośno bije w skąpaną słońcem falę.\nZrodzeni ze stali synowie lodowego domu\nśmieją się, gdzie wichry szaleją jak Freja.\n\nRum płynie słodko niczym miód w rogu,\nbębny jak wojenne wezwanie wstrząsają brzegiem.\nPalma i hełm są wytarte solą,\ngdy najeźdźcy znów wznoszą toast za bogów.\n\nNiech skaldowie śpiewają o ogniu i pianie,\no ludziach Północy na południowym błękicie,\nktórzy znaleźli los tam, gdzie krążą ciepłe wiatry,\ni wyryli nowe sagi, śmiałe i prawdziwe."

 JOM_halls_of_montezuma: "Komnaty Montezumy"
 JOM_halls_of_montezuma_desc: "Czerwone słońce wieńczyło czoło dżungli,\nku niebu wzniesiono stopnie o kamiennych kłach.\nPierzasti bogowie ze złotą przysięgą\npatrzyli, jak zdzierano skórę z bębnów i serc.\n\nSkrzydła Quetzala zwijały się w zmierzchu,\nburza i dym w pierzastej postaci.\nObrzędy krwi ze starszego świata\nspotkały zimną stal i północne okrzyki.\n\nZłoto Aztlánu płonęło jak ogień,\nlecz było przeklęte ciszą, ciężarem i rozpaczą.\nKrólowie jaguarów, bez nikogo, kto wymówi ich imiona,\npadli przed dziobem długiego okrętu.\n\nNiech echo Montezumy rozbrzmiewa\nod świątynnych sal po głębię dżungli,\nbo nawet bogowie muszą lękać się żądła,\ngdy wilki Odyna skradają się z zachodu."

