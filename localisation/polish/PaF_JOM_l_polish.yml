 ## First Tree ##
 
 JOM_ny_saga: "Ný Saga"
 JOM_ny_saga_desc: "Posłuchaj opowieści o bogach i bohaterach, gdzie nieprawdopodobne spotyka niemożliwe, a historia zaczyna się od wygnanego człowieka o ambicjach sięgających gwiazd. Przeznaczenie każe mu przeprawić się przez morze, by spotkać swoją wiarę. Osiągnie wielkość, jak każdy bohater. Oczywiście można być wielkim i czczonym, tak samo jak można być wielkim i budzić grozę. Niestety każdy ma swoją mroczną stronę. Ta podróż nie będzie łatwa, gdyż wewnętrzne demony i zewnętrzne zagrożenia zagrodzą drogę każdemu promieniowi nadziei. To opowieść o poszukiwaniu własnej tożsamości. O zwykłych ludziach walczących z olbrzymami. O człowieku z ogniem w oczach, który pragnie zrewolucjonizować swój kraj w sposób dotąd niewyobrażalny. Zmiana nadejdzie wraz z przypływem. Przypływem, który zmyje zgniły liberalizm z oblicza Midgardu. Oto saga Adriana Zandberga."
 
 JOM_folkvangr_enclave: "Enklawa w Fólkvangr"
 JOM_folkvangr_enclave_desc: "Przybyli z dala od fiordów i zamarzniętych palenisk Północy - ci, którzy nie chcieli klękać przed obcymi królami ani porzucić bogów swoich ojców. Skazani na wygnanie, wykuli schronienie z kamienia i wiatru, nazywając je Fólkvangr na cześć świętego pola, gdzie połowa chwalebnie poległych spoczywa pod spojrzeniem Freji.\n\nW tej obcej krainie duch Północy trwa nadal. Zapach sosnowego dymu unosi się w powietrzu i miesza ze szczękiem młotów uderzających o stal. W ręcznie ciosanych salach leje się miód, sagi recytuje się niczym ewangelię, a dzieci uczą się nosić zarówno tarczę, jak i pieśń.\n\nNadejdzie bowiem dzień, w którym zabrzmi róg i rozpocznie się Ragnarök."
 
 JOM_who_am_i: "Kim jestem?"
 JOM_who_am_i_desc: "Halfdan Sandbjerg. Harald. Adrian Zandberg.\nImiona wirowały w jego umyśle niczym mgła. Był wikingiem czy politykiem? Najeźdźcą czy człowiekiem ludu? Daleka ziemia wzywała go zza morza. Czy powinien pożeglować ku niej z mieczem w dłoni? Zrabować jej bogactwa? Podpalić wybrzeże w chwale i gniewie? Nie... nie, to było coś innego. Znał tę ziemię. Pamiętał jej rzeki, smutki i ludzi. Nie pamiętał jednak, kim był pośród nich. Musi im pomóc. Musi im odebrać. Musi stać się... czymś nowym. A jednak za jego oczami nadal płonęło pytanie zimne jak północny wiatr:\n\n§RKim on jest?§!"
 
 JOM_what_am_i_doing: "Co ja tu robię?"
 JOM_what_am_i_doing_desc: "Głównym zmartwieniem Sandbjerga nie był chłód ani głód, ani nawet wojenne bębny rozbrzmiewające na wyspie Bornholm. Było nim pytanie gryzące jego duszę - co on właściwie robił? Owszem, był jarlem. Prowadził krwiożerczych wojowników przez rozbite wybrzeża Bałtyku, obiecując im złoto, chwałę i miejsce w salach Valhalli. Pili za jego imię. Śpiewali o zwycięstwach. Jego sztandary powiewały wysoko nad zrujnowanymi miastami. Kiedy jednak płonęły ognie, a okręty wracały obciążone łupami, zwątpienie osiadało na nim niczym sól niesiona wiatrem.\nCzy naprawdę urodził się, by najeżdżać?\nCzy pod hełmem i brodą nadal krył się człowiek imieniem Adrian Zandberg?\n\nNie potrafił odpowiedzieć.\n\n§RMógł jedynie płynąć naprzód.§!"
 
 JOM_assembling_banners: "Wezwanie chorągwi"
 JOM_assembling_banners_desc: "Musimy odzyskać naszą ziemię i powrócić w umiłowane objęcia pięknej Polski, którą bezwstydnie odebrały nam zdradzieckie szczury bez honoru. Do osiągnięcia tego celu potrzebujemy jednak ludzi: odważnych, silnych wojowników, którzy pod dowództwem jarla Sandbjerga odzyskają to, co prawowicie należy do nas. Nadeszła pora wysłać wezwanie do wszystkich uchodźców; Gjallarhorn rozbrzmiewa, przywołując ich do walki. Niech Thor przekuje ich serca w serca wojowników gotowych odpowiedzieć na wezwanie Odyna. Sandbjerg poprowadzi nas z powrotem na ziemię, która nas zrodziła, ziemię tak podle nam skradzioną."
 
 JOM_aid_from_aalborg: "Pomoc z Aalborgu"
 JOM_aid_from_aalborg_desc: "Aalborg mógł być miejscem narodzin naszego przywódcy - na tym jednak w znacznej mierze kończy się opowieść o naszych stosunkach z królestwem Danii. Duńczycy są mimo wszystko ludźmi o pewnej dobroci i z pewnością pomogą nam, biednym wygnańcom. Trzeba przyjąć każdy bochenek chleba i każdy skrawek tkaniny, gdyż rodziny naszych wojowników muszą pozostać razem i być syte, nim ich mężowie wyruszą na wielki wiking.\n\nDlaczego nie zwrócimy się do stolicy? Ponieważ oczy centrum są bystre, a nie możemy pozwolić, by zobaczyli nas takimi, jakimi jesteśmy naprawdę - nie zwykłymi tułaczami ani bezbronnymi uchodźcami szukającymi schronienia, lecz zastępem uzbrojonych mężczyzn z celem, od którego zadrżałyby im kości. Nie wybaczyliby nam takiego oszustwa. Działamy więc po cichu, zdobywając dla naszego ludu jedynie tyle, ile potrzebuje, by przetrwać, aż nadejdzie pora, by prawdziwie żyć."
 
 JOM_invigilaltion_from_kaupmannahofn: "Śledztwo z Kaupmannahöfn"
 JOM_invigilaltion_from_kaupmannahofn_desc: "Przeliczyliśmy się; Duńczycy okazali się ani nie tak naiwni, ani nie tak łatwowierni, jak zakładaliśmy. Nie kupili opowieści, że jesteśmy tylko biednymi uchodźcami z rozbitej ojczyzny. Być może założenie obozu pełnego wikińskich tarcz, sztandarów i broni nie było najbardziej rozsądnym taktycznie sposobem na ukrycie naszych prawdziwych zamiarów. Teraz zaś mają czelność przysyłać inspektorów w nadziei, że złapią nas na gorącym uczynku. Niech próbują, lecz nie zdemaskują nas tak łatwo; Odyn ochroni naszą sprawę przed ich niegodziwym podejściem."
 
 JOM_smuggling_resources: "Przemyt surowców i uzbrojenia"
 JOM_smuggling_resources_desc: "Mamy już armię, ale jej wojownicy nie będą obrzucać wroga kamieniami ani żywić się światłem słonecznym i pustymi obietnicami dowódców. Potrzebujemy broni, żywności oraz pancerzy, a na wsparcie Duńczyków nie możemy liczyć. W przeciwieństwie do amerykofilów Maksa Kolonki nie mamy luksusu potężnego amerykańskiego sojusznika, który rozdaje zasoby za darmo. Musimy sami się uzbroić i wyżywić. Część zaopatrzenia potrafimy wyprodukować, ale w razie potrzeby możemy być zmuszeni zajrzeć na czarny rynek. Jeśli mamy przetrwać i wykuć przyszłość wartą walki, musimy być równie bezwzględni w logistyce, co na polu bitwy."
 
 JOM_hundred_drakkars: "Sto drakkarów"
 JOM_hundred_drakkars_desc: "Gdy ziemie za morzem pogrążają się w mroku wraz z rozlewem krwi, trwamy niewzruszeni, wiedząc, że nasze bandy wikingów runą niczym Ragnarök z siłą przewyższającą nawet młot Thora i płomienie Surtra. A jednak nie możemy dotrzeć do celu! Nie mamy bowiem floty wojennej, z którą moglibyśmy triumfalnie przybić do polskich brzegów. Brakuje nam materiałów do budowy drakkarów, dlatego najskuteczniej będzie odebrać je ludziom zamieszkującym okupowaną przez nas ziemię, wszelkimi koniecznymi sposobami, czy to siłą, czy też dzięki obfitemu podstępowi. Módlmy się do Lokiego! Niech potęga jego forteli wyłudzi dla nas flotę dość wielką, by przerazić nawet olbrzymów!"

 JOM_great_heathen_army: "Wielka Armia Pogan"
 JOM_great_heathen_army_desc: "Gdy pod czujnym okiem Duńczyków nasze sztandary gromadzą się coraz większe, musimy przyjrzeć się mężczyznom uciekającym w nasze szeregi i zastanowić nad tym, kogo widzimy. Są wśród nich ci, których się spodziewamy, jak uchodźcy wymachujący naszym sztandarem i skandujący imię jarla. Są też ci, których byśmy nie oczekiwali, jak dezerterzy z polskiej armii i marynarki, zesłani nam dzięki łasce Týra. Pomimo tego niewielkiego napływu ludzi stoimy niewzruszenie. Musimy zorganizować te grupy w prawdziwe drużyny wojenne i wyposażyć je nie tylko w sprzęt, lecz także w bezgraniczną wiarę w naszą sprawę oraz bóstwa, aby można je było prawdziwie uznać za Wielką Armię Pogan."
 
 JOM_housecarls_of_sammen: "Huskarlowie klanu Sammen"
 JOM_housecarls_of_sammen_desc: "Ci, którzy okażą najwyższy stopień lojalności wobec naszego sztandaru, dostąpią prawa wstąpienia do elitarnej siły pobłogosławionej młotem Thora - huskarlów! Mężowie ci zostaną obdarzeni siłą dziesięciu ludzi i oznaczeni wybranymi przez siebie symbolami oraz runami. Choć niektórzy członkowie partii kwestionują cel huskarlów i twierdzą, że to jedynie partyjna milicja, odpowiadamy stanowczo! Nie rozumieją bowiem, że ogromne znaczenie ma siła broniąca naszej ziemi, a nie tylko zdolna do szturmu! Choć... w pierwszych nadchodzących wojnach zostaną użyci właśnie do szturmu..."
 
 JOM_agents_of_loki: "Agenci Lokiego"
 JOM_agents_of_loki_desc: "Po drugiej stronie wąskiego morza nadal żyją ludzie, którzy pod butem frakcji i sztandarów sprawujących nad nimi władzę po cichu wznoszą toasty za zdrowie oraz pomyślność naszego przywódcy. Wielu z nich będzie gotowych rozpętać piekło wśród okupantów na pierwszy sygnał do powstania. Musimy nawiązać kontakt z tymi komórkami podstępu na wybrzeżu i powiadomić je o naszym przybyciu, gdyż dzięki zdradzie, której dopuszczą się na zamieszkiwanych ziemiach, staną się legendami w naszej krainie. Musimy nakazać im gotowość, bo bez nich nasze wysiłki będą wielokrotnie trudniejsze."
 
 JOM_sound_the_horn: "Zadmijcie w Gjallarhorn!"
 JOM_sound_the_horn_desc: "Gdy Heimdall zadmie w swój róg, synowie Asgardu ruszą ku zagładzie. Najplugawsze bestie zbudzą się, pomioty ciemności spragnione pożarcia Midgardu. Bogowie zewrą się w boju, brat wystąpi przeciw bratu, a ludzkość pochłonie ogień ich furii.\n\nTak mówiły dawne sagi, a dziś przepowiednia wypełnia się na rozbitych ziemiach Eurokomisariatów. Walka kipi niczym morze miotane sztormem, niesprawiedliwi panowie rozszarpują się wzajemnie żelazem i zawiścią.\n\nOto nadeszła przepowiedziana godzina.\nOto chwytamy za topory, jak czynili nasi przodkowie,\nI stalą oraz gniewem\nNiesiemy zagładę fałszywym królom, a ich trony obrócimy w popiół."

 ## Second Tree ##

 JOM_sands_of_vendland: "Piaski Wendlandu"
 JOM_sands_of_vendland_desc: "Powstańcie, dumni wojownicy! Naprzód, w krwawy bój! Przeciw wrogowi drżącemu ze strachu. Przeciw przeklętemu ciemiężycielowi!\nNasze drakkary są gotowe i rwą się do drogi. Uderzymy z siłą fali. O, Wendio, długo o nas nie zapomnisz.\nEurokomisarze - nadszedł wasz kres. Týr i Frigg stoją u naszego boku! Roztrzaskamy chciwe niemieckie czaszki. Wolność maszeruje w naszych szeregach!\nNiech szlachetni uderzą z gniewem! Niech popłynie niczym rwące źródło! Za wolność przelejemy krew. Ruszamy na wojnę wyzwoleńczą!"

 JOM_set_coast_ablaze: "Podpalcie wybrzeże!"
 JOM_set_coast_ablaze_desc: "Powstańcie, wojownicy Odyna! Unieście wysoko broń! Czeka was bowiem bitewny zgiełk. Naprzód, aż po sam kraniec świata!\nPłyńcie, wyzwoliciele. Strzały świszczą nam koło uszu, a my odpowiadamy wściekłym rykiem.\nPłyńcie odważnie! Ludzie bici batami wołają dziś do nas, posiniaczeni i pokryci pręgami.\nPłyńcie, bohaterowie! Wybrzeże jest długie i szerokie. Nadciągamy niczym dzika, bezkresna powódź. Nie ma dokąd uciekać ani gdzie się ukryć.\nPłyńcie, jomsborczycy! Nie dawajcie wiary lękowi. Tych 'argrów' powita trzęsienie przeraźliwego śmiechu.\nNasz dom już czeka. W Valhalli donośne głosy wołają: Skål!"

 JOM_deep_raids: "Najazdy w głąb lądu"
 JOM_deep_raids_desc: "Błękitne pole fal - nie ma panów, nie zna litości, nie zna bogatych ani biednych.\n'Jesteśmy nimi my!'\nNiczym wilki lazurowych fal pędzimy naprzód, a pod naszym toporem wszyscy mogą stać się równi!\n'Morze nie zna litości'.\nTę wiedzę przekazali nam przodkowie.\nTeraz morze usiane jest żelaznymi drakkarami wrogów.\n'Nie rzucajmy się w szpony Rán'.\nSpójrzcie, wojownicy! Ragnar Lodbrok do nas przemawia!\nPłyńcie jak on - rzekami w samo serce lądu.\nTam bowiem czeka na nas chwała!"

 JOM_gates_of_hel: "Bramy Hel"
 JOM_gates_of_hel_desc: "'Wikingowie u bram!'\nNáströnd pochłonie zdrajców - tych admirałów, którzy niegdyś tak krzyczeli. A jednak ich krzyki zbudowały naszą legendę!\nZadmijcie w rogi zwycięstwa! Viðsjórsteinn i Halsvik są wolne! Należy nam się uczta, lecz nie dzisiaj. Ragnarök nadal czeka na naszej drodze!\nZdobytych osad będziemy bronić krwią i niezłomnością, lecz musimy maszerować dalej - tak wzywają nasi rodacy. Naostrzmy topory, przygotujmy broń, bo Fenrir już krąży, a my kroczymy prosto w serce chaosu - tam właśnie ruszamy do walki.\nNikt z nas nie trafi jednak do Hel. DZISIAJ SPOTKAMY SIĘ WSZYSCY W VALHALLI!"

 JOM_looting_churches: "Łupienie kościołów"
 JOM_looting_churches_desc: "Nawet teraz, gdy wojna i gromy przetoczyły się przez Pomorze, stare kościoły nadal uginają się pod ciężarem złota. Wojna przeszła niczym zimowa burza, lecz w tych kamiennych salach bogactwo wciąż czai się w cieniu - kielichy, relikwiarze i gobeliny, nietknięte przez głód ani stratę.\n\nWielu zastanawia się, jak takie skarby pozostały nietknięte, gdy wszystko inne legło w gruzach. Jak ołtarze nadal lśniły, podczas gdy wsie płonęły, a dzieci dorastały z pustymi żołądkami.\n\nWśród tych, którzy przemierzają teraz rozległe ziemie wybrzeża, krążą szepty o bogactwach Kościoła. Jaki pożytek przynosi złoto zamknięte w grobowcach wiary, gdy żyjący nie mają niczego?"

 JOM_germanic_equipment: "Germański sprzet"
 JOM_germanic_equipment_desc: "Gdy Ragnarök przetoczył się przez Pomorze, nie przyniósł chwały, lecz ogień, krew i stal. Sascy najeźdźcy, nieprzygotowani na spadającą na nich furię, uciekli przed naszym natarciem. Podczas odwrotu pozostawili broń, pancerze i wyposażenie - cenne narzędzia wykute do wojny, teraz przejęte przez naszych potężnych wikingów. To, co porzucili ze strachu, podsyci teraz nasz gniew. Ich żelazo karmi nasze kuźnie, ich stal zbroi naszych wojowników. Z popiołów ich klęski powstajemy silniejsi, prowadzeni wolą dawnych bogów i nieustępliwym północnym wiatrem."

 JOM_retake_jomsborg: "Odbij Jomsborg"
 JOM_retake_jomsborg_desc: "Wiatry zepchnęły nas z kursu i wylądowaliśmy nie tam, gdzie zamierzaliśmy, lecz być może los okazał łaskę. Brzeg Bornholmu, który nas powitał, nie był tym, którego szukaliśmy, ale dał nam schronienie i czas na zebranie sił.\n\nTeraz musimy ponownie obrać właściwy kurs. Jomsborg trzeba odzyskać.\n\nTa wyspa nie jest zwykłą skałą na morzu; to święta ziemia, przesiąknięta krwią i honorem naszych przodków. To tutaj po raz pierwszy wyryto runy w kamieniu i młot Thora osłonił wolny lud przed tyranami. Jomsborg jest sercem naszej sagi i znów zacznie bić."

 JOM_northern_flank: "Północna flanka"
 JOM_northern_flank_desc: "Widzimy Jomsborg tuż przed sobą. Wikiński duch popycha nas do natychmiastowego uderzenia bez oglądania się na potencjalne zagrożenia. Nierozsądnie byłoby jednak atakować w miejscu, w którym już się nas spodziewają; w przyszłości nie zabraknie okazji, by udowodnić, że zasługujemy na miejsce w Valhalli. Najlepiej podejść od północy, zdobywając Dziwnów, co zdezorientuje wrogów przygotowanych na frontalny szturm ich pozycji. Choć będziemy musieli nadłożyć drogi, z siłą Odyna po naszej stronie gra jest warta świeczki."

 JOM_direct_strike: "Bezpośrednie uderzenie na miasto"
 JOM_direct_strike_desc: "Do Helheimu z tym! Komu potrzebna strategia, gdy w naszych żyłach wrze krew berserkerów? Nasi wojownicy rozszarpią buntowników niczym wilki owce. Niech kulą się za murami, bo ich to nie ocali. Jomsborg leży tuż za rzeką, tak blisko, że niemal czujemy smak ich strachu.\n\nJaka siła mogłaby nas zatrzymać? To nasze dziedzictwo, nasza święta ziemia. Zdobędziemy ją nie ostrożnością, lecz furią, stalą i grzmiącym rykiem spuszczonych z łańcuchów wojowników. Niech ziemia zatrzęsie się pod naszymi butami. Jomsborg padnie przed świtem."

 JOM_back_in_home: "Powrót do domu przodków"
 JOM_back_in_home_desc: "Odzyskaliśmy nasze święte miasto z rąk Wendów i nareszcie możemy stąpać po jego ziemi nie jako obcy, lecz jako spadkobiercy. Ognie świąteczne znów zapłonęły, a sztandary przodków wznoszą się wysoko nad dawnymi kurhanami. Możemy teraz bez wstydu odwiedzić grobowiec Haralda Sinozębego, głośno wypowiadać imiona przodków i czuć poruszenie duchów. Niech bębny zagrzmią, a rogi rozbrzmią pośród wzgórz. Jomsborg znów jest nasz. Niech żaden wróg nigdy więcej nie postawi tutaj stopy, gdyż odtąd i na zawsze będzie latarnią odrodzonej Północy."

 JOM_memories_of_past: "Wspomnienia przeszłości"
 JOM_memories_of_past_desc: "Nasz jarl Halfdan Sandbjerg dumnie kroczy po tych żyznych ziemiach, lecz wokół niego wciąż snują się cienie. Ludzie szepczą, że niegdyś uwięzili go Niemcy i dręczył go bezwzględny reżim. Powiadają, że żelazo wykute w tym cierpieniu ukształtowało potężnego wojownika, za którym dziś podążamy - człowieka złamanego, przekutego na nowo i wypuszczonego na świat. Jego furia poprowadziła nas ku zwycięstwu, a wizja wyciosała naszą drogę przez lód i ogień. Niektórzy obawiają się jednak, że duchy przeszłości znowu się budzą, że dawny ból gryzie jego serce, a pogrzebane prawdy wydrapują sobie drogę z ciemności ku powierzchni. Módlmy się, by bogowie umocnili jego ducha, nim ten pęknie."

 JOM_first_althing: "Pierwszy Alting"
 JOM_first_althing_desc: "Nasza pozycja na Pomorzu wreszcie jest pewna. Zdobyliśmy dość ziemi, by zapuścić korzenie nowego państwa. W odpowiedzi jarl Halfdan zwołał pierwszy althing, zgromadzenie mające wykuć drogę ku stabilności i dobrobytowi.\n\nNiech jednak skrybowie gadają, a mędrcy mamroczą bez końca. Dla wojowników Północy to tylko pozory. Pragniemy wojny. Świętej wojny, która zerwie z pomorskich ziem łańcuchy wykute przez chrześcijan, liberałów i zdradzieckich Wendów. Niech drżą, bo nasi potężni wojownicy obrócą ich reżimy w gruzy. Do Valhalli!"

 JOM_skeggold: "Skeggold! Skálmold!"
 JOM_skeggold_desc: "Wichry przemian wieją z narastającą furią. Zbliża się godzina, w której wilki rozszarpią tych, którzy ośmielili się nazwać bogami tych ziem. Z Północy nadciąga fala rozrachunku, niosąca na toporach zgubę zarówno saskich ciemięzców, jak i wendyjskich uzurpatorów. Bębny. Wojenne bębny rozbrzmiewają w najgłębszych czeluściach tej ziemi. Nadszedł czas.\nCzas, by nasi bohaterowie dokończyli apokaliptyczne dzieło rozpoczęte dawno temu - zakończyli tę okrutną wojnę i poprowadzili nas na zielone łąki Gimlé, dokąd nie podąży za nami żaden cień.\n\nNadchodzimy.\n\nWiek topora, wiek miecza - tarcze pękają -\nWiek wichru, wiek wilka, nim świat się zawali;\nNikt nie okaże drugiemu litości."



 JOM_expand_coastline: "Wzdłuż wybrzeża"
 JOM_expand_coastline_desc: "Na naszej wschodniej granicy leży kpina ze sprawiedliwości, pozłacana przystań wycięta przez zdradzieckich Wendów, gdzie jedynie najbogatsi spośród nich mogą ucztować, podczas gdy zwykły lud pozostawiono, by gnił w nędzy. Tak zwany kraj wypoczynkowy, zbudowany na pocie i krwi zapomnianych.\n\nNaszym świętym obowiązkiem, pobłogosławionym grzmiącym gniewem Thora, jest zniszczenie ich kurortów. Zdobędziemy szturmem hotele, obalimy fałszywe bożki i przejmiemy gromadzone bogactwa. Majątek elit powróci do tych, którzy naprawdę na niego zasługują - synów i córek Pomorza."

 JOM_ground_assault: "Lądowe natarcie"
 JOM_ground_assault_desc: "Wielka Armia Pogan tylko raz przypłynęła morzem; teraz nasze topory muszą uderzyć na stałym lądzie. Ruszymy szerokim szykiem, ramię w ramię, wzdłuż całej granicy, aby żaden zakątek tych ziem nie pozostał niezdobyty. Od szepczących mokradeł po falujące wzgórza nasza drużyna wojenna posuwa się naprzód niczym jedna grzmiąca fala, wyzwalając każdą ukrytą dolinę i każdy hotel na swojej drodze. Pinnastrond padnie, a wraz z nim cała burżuazja. Niech ziemia drży pod naszymi stopami, a wiatr niesie bojowy okrzyk: Północ powraca i nikt nie stanie jej na drodze."

 JOM_pinnastrond_raid: "Morski najazd na Pinnastrond"
 JOM_pinnastrond_raid_desc: "Dwieście drakkarów zagrzmi niczym burza, gdy zbliżą się do nadmorskiego miasta, a ich smocze pyski przetną fale w drodze ku bladym piaskom Pinnastrondu. O świcie wylejemy się na brzeg zwartymi szeregami, ze złączonymi tarczami i obnażonymi toporami, a pozłacane promenady Kurortstaatu zadrżą pod naszymi butami. Żadna linia wroga nie wytrzyma naszej furii; żadne mury nie oprą się rykom rogów. Jednym grzmiącym uderzeniem przejmiemy każde uzdrowisko, molo i hotel. Tym samym wojna dobiegnie końca. Niech sagi zapamiętają ten dzień: dzień, w którym Północ odzyskała to, co prawowicie należało do ludu!"

 JOM_vacation_over: "Koniec wakacji!"
 JOM_vacation_over_desc: "Pinnastrond i jego złote brzegi należą teraz do nas. Skończyły się dni wystawnych wakacji; elity nie będą już bezczynnie wypoczywać, podczas gdy lud cierpi. Nasze wikińskie sztandary powiewają teraz wysoko nad dawnymi luksusowymi hotelami, niegdyś będącymi placem zabaw bogaczy.\n\nZiemie te służą teraz nowemu celowi. Przestaną być symbolami zbytku - zostaną przejęte, odzyskane i wykorzystane na nowo dla dobra ogółu. Bogactwo wybrzeża odbierzemy uprzywilejowanym i rozdzielimy między zwykłych ludzi, wojowników, robotników i tych, których nie stać na godne warunki życia."

 JOM_tyr_chosen: "Wybrańcy Týra"
 JOM_tyr_chosen_desc: "Nasi wojownicy maszerują pod błogosławieństwem samego Týra, boga wojny. Z taką boską łaską pozostaną niezłomni wobec największych bestii, jakie może przywołać ziemia Wendów. Żaden kieł ani stal nie zachwieją ich murem tarcz. Serca biją im w rytm dawnych sag, a ostrza niosą ciężar sprawiedliwej furii. Niech wróg śle olbrzymów, niech ziemia pęka i ryczy - synowie Północy nie ustąpią. Walczą nie tylko o zwycięstwo, lecz o chwałę, pamięć i wieczne miejsce w Valhalli."

 JOM_fury_of_berserkers: "Furia Berserkerów"
 JOM_fury_of_berserkers_desc: "Gdy Thor wezwał ich do boju, nie zawahali się. Honor oznaczał dla nich zwycięstwo, a nic poza przelaną krwią wrogów i dumą braci tarczy nie miało znaczenia. Nie walczyli oni o złoto ani chwałę, lecz by żyć jako wolni ludzie pod otwartym niebem.\n\nKiedy zaś ciemność opadła na ziemię, a cisza wpełzła między zimne, nieruchome ciała poległych, uklękli. Zakrwawionymi dłońmi i ciężkim oddechem podziękowali bogom za świętą moc, niezłomnego ducha i siłę, by stać, gdy inni upadli. Ich pieśń nie opowiadała o smutku; sławiła walkę, przetrwanie i ogień, który wciąż w nich płonął."

 JOM_forging_spears: "Kucie włóczni i toporów"
 JOM_forging_spears_desc: "Najsilniejsi berserkerzy potrafiliby rozerwać Wenda gołymi rękami, tak jak wilki odrywają mięso od kości. Nie każdy wojownik nosi jednak w żyłach taką furię. Wielu nadal potrzebuje stali - nie ze strachu, lecz dla honoru, radości bitwy i ciężaru ostrza w dłoni.\n\nKuźnie dawnego świata są zimne i martwe, a niewiele fabryk pozostało, by karmić naszą wikińską potęgę. Zwracamy się więc ku zwyczajom przodków. W dymie wiejskich kuźni, pod młotami i w ogniu na nowo ukształtujemy naszą broń, ostrza toporów ze złomu i klingi z żelaza."

 JOM_shields_from_vendland: "Tarczowniczki Wendlandu"
 JOM_shields_from_vendland_desc: "Nasze tarczowniczki dorównują najdzikszym berserkerom. Z ogniem w sercach i stalą w dłoniach walczą z takim samym niezłomnym męstwem oraz ponurą determinacją jak każdy wojownik Północy. Bogowie nie widzą różnicy w krwi przelanej za honor i my również jej nie dostrzeżemy.\n\nNikt nie powinien kwestionować ich miejsca. Zapracowały na prawo do stania w murze tarcz, wymachiwania toporem i mieczem oraz wyrąbania sobie furią i dumą drogi do Valhalli. Tarczowniczki, nasze córki, siostry i matki, będą niewzruszonym kręgosłupem wysiłku wojennego. W bitwie nie są kobietami. Są wilczycami."

 JOM_shield_wall_perfected: "Udoskonalony mur tarcz"
 JOM_shield_wall_perfected_desc: "Doktryna muru tarcz, stosowana w każdej bitwie, jest niezwykle skuteczna. Jej współczesna adaptacja mogłaby jednak wzmocnić nasz wysiłek wojenny do tego stopnia, że każdy mężczyzna i każda kobieta na Pomorzu zaczęliby lękać się dźwięku naszych rogów i pragnienia bitwy. Udoskonalając taktykę i dostosowując ją do współczesnego pola walki, możemy uwolnić machinę wojenną zakorzenioną w tradycji, lecz wyostrzoną przez konieczność. Mistrzostwo na polu bitwy nie tylko przyniesie nam zwycięstwo, lecz także napawać będzie dumą Odyna i pozostałych bogów. Śmierć w bitwie jest największym honorem, ale walka o przyszłość i potomstwo stanowi święty obowiązek łączący nas zarówno z przeszłością, jak i przeznaczeniem."

 JOM_cutting_trees_for_fleet: "Wycinka lasów na statki"
 JOM_cutting_trees_for_fleet_desc: "Wzdłuż zachodnich brzegów Pomorza rozciągają się ogromne, pradawne lasy - głębokie i święte, lecz ich czas dobiegł końca. Jeśli mamy wznieść wielką flotę przyrzeczoną bogom i przodkom, drzewa muszą paść. Nie będzie litości, liczy się tylko topór i płomień.\n\nObiecaliśmy sto drakkarów - długich okrętów, które poniosą nas przez wody z powrotem na ziemie Pomorza Zachodniego. Aby odzyskać je i wypełnić sagę zapisaną w naszej krwi oraz historii. Lasy nakarmią kuźnie, stocznie zagrzmią od pracy, a z samych korzeni Midgardu powstanie legendarna flota, która napełni bogów dumą."

 JOM_hit_run_doctrine: "Doktryna morskiej wojny podjazdowej"
 JOM_hit_run_doctrine_desc: "Siła naszego ludu zawsze tkwiła w burzy, którą sprowadzamy - nagłej, gwałtownej i znikającej, nim opadnie kurz. Uderzamy niczym grom z jasnego nieba, bez ostrzeżenia i litości. W jednej chwili ziemia jest spokojna, w następnej rozbrzmiewa szczęk stali, ryk wojowników, a ogień liże niebiosa.\n\nNajeżdżamy szybko, a znikamy jeszcze szybciej. Gdy wrogowie próbują pojąć, co się wydarzyło, jesteśmy już daleko, pod pełnymi żaglami, śmiejąc się wraz z wiatrem. A kiedy znów poczują się bezpiecznie... powrócimy, gdzie indziej, o innej porze, z tą samą furią."

 JOM_riverine_warfare: "Wojna rzeczna"
 JOM_riverine_warfare_desc: "Langskipy każdego rodzaju budowano z tak zaciekłym geniuszem, że potrafiły żeglować nie tylko po bezkresnych, wzburzonych morzach i docierać aż do zapomnianych przez bogów wybrzeży dalekiego Vinlandu, lecz także równie łatwo sunąć wąskimi fiordami i krętymi rzekami. Ich kadłuby stworzono zarówno do zmagania się z gniewem oceanu, jak i do podstępów w głębi lądu.\n\nBałtyk został już za nami, jego fale podbite i zapomniane. Lecz przed nami... przed nami leży ziemia przecięta rzekami, wijącymi się niczym węże przez serce naszego przeznaczenia. Tak jak wcześniej nasze długie okręty poniosą nas naprzód, szybkie i ciche niczym topory opadające na karki królów."

 JOM_fjm_karl_marx: "FJM Karol Marx"
 JOM_fjm_karl_marx_desc: "Nasza drużyna wojenna jest silnym, niezłomnym zastępem potężnych wikingów gotowych przejąć kręte rzeki Pomorza za pomocą floty dumnych drakkarów. Brakuje nam jednak czegoś. Langskipa godnego sag, których jeszcze nie zaśpiewano, prowadzącego flotę niczym Fenrir na czele burzy. Zbudujemy statek, jakiego Midgard nigdy nie widział, będzie to najpotężniejszy drakkar wyrzeźbiony kiedykolwiek z drewna i żelaza. Okręt nazwany na cześć największego orędownika podstawowych praw robotniczych, Karola Marksa, napełni dumą nawet samego Týra. Niech rzeki drżą pod jego kilem."

 JOM_friggs_care: "Opieka Friggi"
 JOM_friggs_care_desc: "Ci, którzy nie potrafią już unieść topora ani tarczy, nigdy nie zostaną odrzuceni. Są strażnikami domowych ognisk i nosicielami mądrości - kręgosłupem naszego plemienia. To oni wychowują następne pokolenie tarczowniczek i berserkerów, podtrzymując ogień, gdy drużyna wojenna wyrusza ku dalekim brzegom.\n\nNiech nikt nie zapomni o ich poświęceniu, zapisanym zarówno w bliznach, jak i czynach. Niech Frigg, mądra i łagodna, pobłogosławi ich siłą oraz pokojem, aby po ucichnięciu rogów i schowaniu mieczy do pochw czekał na nas dom godny naszych triumfów i lud, który nadal stoi, by powitać nas po powrocie."

 JOM_redistribute_loot: "Redystrybucja łupów"
 JOM_redistribute_loot_desc: "Łupy wojenne nie należą wyłącznie do jarlów. To, co nasi wojownicy zdobywają toporem i ogniem, trzeba podzielić między lud. Niech każdy mężczyzna, każda kobieta i każde dziecko zakosztują owoców naszych najazdów. Gdy złoto płynie do wszystkich, nie wybuchają spory o to, jak je zdobyto. Dzięki temu pozostajemy silni, związani krwią, honorem i wspólnym celem. Prawdziwego wikińskiego zwycięstwa nie mierzy się tym, ile zagarnął jeden człowiek, lecz ucztą całego klanu. Nasza siła tkwi nie tylko w furii berserkera, ale też w więzi muru tarcz i jedności ludu. Tak przetrwamy."

 JOM_of_fish_and_mead: "O rybie i miodzie"
 JOM_of_fish_and_mead_desc: "Dieta wikingów była prosta i surowa, ukształtowana przez zimne ziemie oraz trud uprawiania zbóż w kamienistej glebie Północy.\n\nDziś znajdujemy się w podobnym położeniu. Dopóki nie nadejdą lepsze dni i następne żniwa, musimy wytrzymać tak jak przodkowie: żywiąc się rybami z morza, miodem z uli i wszelkimi korzonkami, jagodami oraz dzikimi ziołami, które zdołamy zebrać.\n\nMoże nie będzie to uczta godna bogów, lecz wystarczy, byśmy pozostali silni, dumni i gotowi na nadchodzące bitwy."

 JOM_free_thralls: "Uwolnienie brańców"
 JOM_free_thralls_desc: "Dawni wikingowie mieli niejednoznaczny stosunek do niewolnictwa... ale my nie będziemy nosić takiej plamy. Choć przywdziewamy futra i dzierżymy topory przodków, troszczymy się o uciskanych. Nie jesteśmy jedynie zdobywcami; jesteśmy armią wyzwoleńczą.\n\nPrzede wszystkim musimy ruszyć na obozy reedukacyjne rozsiane po dawnych ziemiach Eurokomisariatów. Wyłamiemy bramy, obalimy ogrodzenia i uwolnimy każdą uwięzioną duszę. Więźniowie polityczni, robotnicy przymusowi i wszyscy zakuci w niemieckie jarzmo znów będą chodzić wolni."

 JOM_power_of_njordr: "Moc Njörðra"
 JOM_power_of_njordr_desc: "Njörðrowi, strażnikowi wichru i fal, ofiarujemy nasz trud. Tak jak uspokaja burze i prowadzi okręty ku bezpiecznym brzegom, tak pokieruje naszymi dłońmi, gdy ujarzmimy oddech morza i pieśń niebios.\n\nNiech wiatraki obracają się w jego imię, a wody płyną z jego błogosławieństwem. Niech łaska Njörðra przyniesie nam ciepło w przemrożonym mroku i światło podczas długich zimowych nocy. Dzięki jego potędze nie będziemy palić lasów ani wkopywać się głęboko w kości ziemi, lecz powstaniemy wraz z mocą samej natury niczym prawdziwi synowie i córki Północy."

 JOM_establish_trades_routes: "Ustanowienie morskich szlaków handlowych"
 JOM_establish_trades_routes_desc: "Morze jest darem od bogów i oferuje nam więcej niż tylko ucieczkę od szaleństwa na lądzie. Owszem, moglibyśmy postawić żagle i zniknąć za horyzontem, pozostawiając ziemię Wendów w zgliszczach, lecz czeka nas większa chwała.\n\nZ wiatrem w plecy i błogosławieństwem Njörðra rozpoczniemy handel, z początku skromny - małe statki, nieliczne towary. Z czasem jednak nasze rejsy staną się jedyną nicią łączącą świat z tym rozbitym wybrzeżem. Wtedy to my będziemy dyktować ceny. Bogactwa popłyną ku dość śmiałym, by stawić czoła falom, a nikt nie stawia im czoła tak jak synowie i córki Północy."

 JOM_great_serpent: "Wielki Wąż Jörmungandr"
 JOM_great_serpent_desc: "Wielki wąż Jörmungandr, przyodziany w postać wodza Tuska, oplata naszą ojczystą ziemię i próbuje zdusić każdą iskrę sprzeciwu wobec niego oraz jego hord.\nJad zatruł wszelkie życie na tych ziemiach, a kły przebiły same ścięgna niegdyś dumnego ludu, zamykając go w żelaznym uścisku.\n\nZapłaci za wszystkie niegodziwe czyny - za niesprawiedliwość wyrządzoną naszemu wodzowi Sandbjergowi i rodakom. Zapłatą będzie krew, gdyż jest handlarzem rzezi i domokrążcą zagłady. Sprawiedliwości stanie się zadość, gdy łotr zakosztuje ostrza własnego miecza. My zaś odrąbiemy głowę najeźdźczej bestii, kończąc epokę terroru.\n\nWolność zdobyta od tego nikczemnego żmija będzie słodsza niż najlepszy miód."

 JOM_heartless_liberals: "Bezduszni liberałowie"
 JOM_heartless_liberals_desc: "Wy - którzy nieśliście sztandary wyzwolenia,\nWy - którzy skrywaliście prawdziwe twarze i pełzaliście w cieniu, przebiegli niczym sam Szachraj.\nZwiedliście lud, który widział w was zbawienie, wierząc, że ramię sprawiedliwości nigdy was nie dosięgnie, osłaniani potęgą hord Południowców.\n\nLecz teraz to my przynosimy osąd. Oskarżamy was o zdradę bogów,\nO zdradę wszystkiego, co nam drogie, o zdradę własnej krwi i imienia.\nSam Loki nazwałby was rodakami.\nAle ludzie nie zapomną.\nA my... pozwolimy im wydać wyrok.\nPrawo, o które walczymy, musi mieć kły -\nI wszyscy, którzy odwrócili oczy od niegodziwości, będą cierpieć.\nA ci, którzy wydawali rozkazy...\n\nWyrok może być tylko jeden."

 JOM_convert_settlers: "Nawrócenie osadników"
 JOM_convert_settlers_desc: "Wezwano was nie po to, byście zachowywali, lecz niszczyli - roztrzaskali to, co niegdyś tutaj stało,\nOdzyskali to, co utracili przodkowie, i wznieśli nowy świat z ruin starego.\nJesteście ofiarami ducha epoki, obciążonymi ciężarem wyborów dokonanych daleko od tych brzegów. Nie możecie jednak ulec temu okrutnemu zrządzeniu losu.\n\nJesteście naszymi germańskimi braćmi.\nPrzebudźcie się!\nPrzebudźcie się i przypomnijcie sobie korzenie sięgające głęboko fundamentów Yggdrasilu.\nSpójrzcie w głąb duszy i usłyszcie głos Wszechojca!\nCzy w tej straszliwej burzy nie słyszycie Thora uderzającego w kowadło?\nCzy nie czujecie łaski Frigg, gdy myśli zwracają się ku krewnym i palenisku?\n\nNadal istnieje nadzieja na wasze odkupienie. Dołączcie do nas.\nOdzyskajcie dziedzictwo prawdziwych przodków - a wspólnie znów uczynimy Midgard pełnym."

 JOM_blood_eagle_traitors: "Krwawy orzeł dla zdrajców"
 JOM_blood_eagle_traitors_desc: "Twierdzicie, że wasz ród pochodzi z wielkiego orlego gniazda. Na waszych sztandarach szybował orzeł.\nZa jego skrzydłami ukrywaliście okrucieństwo, władając nim zarazem jak tarczą i włócznią.\nTen jeden symbol miał zmusić lud do klęknięcia, a samą ziemię do ugięcia się przed waszą wolą.\nLecz wykrwawiliście orła i przeklęliście go, by na całą wieczność nosił płaszcz hańby.\n\nTaki więc będzie wasz los. Krwawy orzeł.\n\nNie może być litości dla tych, którzy sprzedali krewnych w niewolę za bladą iluzję władzy. Żaden skald nie zaśpiewa waszego imienia. Żadna matka nie wspomni o was inaczej niż jako przestrodze dla dziecka.\nA bogowie już nigdy nie pozwolą wam przekroczyć bram Valhalli."

 JOM_burstaborg_siege: "Oblężenie Burstaborgu"
 JOM_burstaborg_siege_desc: "U ujścia Odry stoi zrodzone z kamienia monstrum, które ludzie nazywają Szczecinem.\nW murach tego olbrzyma spoczywają zgromadzone skarby, ułożone w stosy chciwymi rękami banitów z Hanzy. Ile mieczy i toporów, zapas na ile zim można kupić za taką górę złota?\n\nNawet krasnoludy z legend nie dorównywały pożądliwości bankierów i kupców, którzy w tym przeklętym miejscu wymieniali dusze na srebro. Zdobycie tej twierdzy nie jest zwykłym najazdem - odwróci bieg wydarzeń, da nam serce rzeki i rozetnie żyły Wendii. Ale złoto... złoto krzyczy głośniej od samej rzeki. Nasz lud czeka bowiem nie tylko na podbój, lecz na sprawiedliwość. A sprawiedliwość waży na swojej szali zarówno monety, jak i płomienie."

 JOM_summer_gone: "Koniec lata"
 JOM_summer_gone_desc: "Nie wszystko złoto, co się świeci, i nie każdy urodzony w Szczecinie dał się sprzedać. W trzewiach tego kamiennego olbrzyma żyją tacy, którzy nadal podążają za czerwoną gwiazdą Północy - dawnym znakiem wolności, równości i braterstwa, przyniesionym na południe przez Unię Letnią.\n\nW ich szeregach kroczy wielu, którzy mogą jeszcze stanąć u naszego boku, ramię w ramię. Służyli fałszywemu tyranowi, ale nie z własnego wyboru. Teraz oferujemy im wolność: możliwość obalenia pustych bożków i przyjęcia prawdy, którą Wszechojciec Odyn szepcze wszystkim odważającym się słuchać z otwartym sercem.\n\nMinie wiele księżyców i wiele wody w Odrze upłynie, nim zasłużą na miano synów i córek Północy. Jeśli jednak ich wola okaże się czysta i przejrzysta niczym źródło lodowca, otworzymy przed nimi ogniska domowe, a rodacy nazwą ich rodziną."

 JOM_sack_the_city: "§RZŁUP MIASTO§!"
 JOM_sack_the_city_desc: "Nie ma słodszej woni niż zapach miasta płonącego o poranku. Tak... tak pachnie sprawiedliwość. W skarbcach potężnych panów Szczecina zgromadzono zbyt wiele złota, by nasi wojownicy mogli przejść obok w milczeniu. Za murami stoją liczne domy, a w nich niewinni. Bogowie zakazali nam ich tknąć. Zemsta musi być zarezerwowana dla tych, którzy zatruli tę ziemię gnijącą doktryną i utuczyli swoje brzuchy na plecach utrudzonych.\n\nGdy dzień dobiegnie końca, nad Burstaborgiem wzejdzie szkarłatna łuna, a winni utoną we własnej krwi. Następujący po niej poranek - ten święty świt - przyniesie jednak odrodzenie.\nA wraz z nim oczyszczający ogień, który obmyje nas wszystkich z błędów przeszłości."

 JOM_steel_longships: "Stalowe langskipy ze stoczni"
 JOM_steel_longships_desc: "Nasze smocze okręty, które przeprowadziły nas przez mroczne morze, nie są zwykłymi statkami - stanowią ucieleśnienie woli bogów. Thor w swej grzmiącej chwale i Njörðr, pan wichrów oraz przypływów, poprowadzili nas ku temu brzegowi, abyśmy wypełnili przeznaczenie.\nW sercu miasta, w Burstaborgu, spoczywa jednak dar znacznie większy, niż mógłby wyśnić najbardziej oddany skald:\n\nKuźnie. Kolosalne kuźnie wypluwające żelazne bestie. Kuźnie zdolne budować okręty żeglujące nie tylko po morzu, lecz po samych Dziewięciu Światach! Musimy ponownie rozbudzić ich ogień, podsycić płomień pod pradawnymi paleniskami. Tylko Odyn wie, jakie monstrualne cuda wykują nasi mistrzowie kowalstwa. A metal, który ukształtują potem, krwią i modlitwą, przetrwa nawet gniew samego Surtra."

 JOM_islanders_of_swinmunnir: "Wyspiarze ze Svinmunnir"
 JOM_islanders_of_swinmunnir_desc: "Svinmunnir jest po Szczecinie drugim wielkim filarem naszej morskiej potęgi. Jego porty i stocznie są kluczem do wykucia floty godnej naszych ambicji, floty, która zapewni nam dominację na Bałtyku.\n\nStawką są jednak nie tylko okręty i słone wichry. Przeklęci synowie Germanii mogą jeszcze spróbować doczołgać się z powrotem do tych brzegów niczym nędzne draugry. Nie możemy na to pozwolić. Z woli Odyna ziemia ta nigdy więcej nie skłoni się przed obcymi rządami.\n\nNie wszystko zostało stracone na rzecz zdrady; nad miastem wciąż powiewają czerwone sztandary. Władzę sprawują lewicowe klany, a jeśli poprowadzi je mądrość, być może zamiast wojny wystarczą słowa."

 JOM_companions_of_socialism: "Towarzysze socjalizmu"
 JOM_companions_of_socialism_desc: "Wielu dawnych członków SLD, od dawna błąkających się we mgle zapomnianych ideałów, ponownie dostrzega dziś jasno płonący ogień prawdziwej wiary. Wychodzą naprzód z pochylonymi głowami, gotowi odrzucić stare, puste dogmaty i przyjąć sprawiedliwą nordycką drogę. Jeśli zechcą złożyć przysięgę przed bogami i chwycić za topór albo pług w służbie naszej sprawie, niech znajdą miejsce w naszych salach. Nawet zagubieni mogą służyć woli Odyna i pracować nad urzeczywistnieniem prawdziwej wizji nordyckiego socjalizmu."

 JOM_heregeld_or_enlistment: "Heregeld albo pobór"
 JOM_heregeld_or_enlistment_desc: "W uznaniu dawnej wierności ideałom socjalizmu dajemy mieszkańcom Svinmunniru ostateczny wybór. Mogą zapłacić heregeld, daninę przeznaczoną na budowę naszych drakkarów i ostrzenie włóczni, albo chwycić za tarczę i topór, dołączając do drużyn wojennych w chwalebnej bitwie. Ci, którzy wybiorą walkę, zasłużą na miejsce w sagach, a płacący nadal przysłużą się naszej sprawie. Niech będzie jasne: w tej epoce ognia i burzy nikt nie pozostanie obojętny wobec naszej sprawy."

 JOM_our_window_to_world: "Nasze okno na świat"
 JOM_our_window_to_world_desc: "Svinmunnir, jak już jasno wykazano, jest naszym oknem na świat, a teraz także bramą ku przeznaczeniu. Rozległe nabrzeża przeładunkowe, potężna infrastruktura morska i terminal gazowy, który zasila nie tylko okręty, lecz także ogień w naszych sercach - to wszystko, o czym może marzyć prawdziwy żeglarz i współczesny wiking.\n\nMiasto jest twierdzą, miejscem tworzenia i punktem wypadowym dla licznych drakkarów. Stąd nasze długie okręty ponownie zapanują nad morzami, wojownicy wyruszą ku dalekim brzegom, a wikingowie powrócą z bogactwami wspierającymi nasz lud."

 JOM_falling_nidhoggr: "Walka z Níðhöggr"
 JOM_falling_nidhoggr_desc: "Ci tak zwani Rodacy Kamraci są nie tylko wrogami ludu, lecz także bluźniercami w oczach dawnych bogów. Maciej Poręba, Eugeniusz Sendecki i Aleksander Jabłonowski zakosztują gniewu Thora, gdy nasze młoty runą na ich czaszki.\n\nIch nędzne imperium kłamstw i faszystowskiej pychy rozpadnie się pod naszymi stopami. Z jednym grzmiącym okrzykiem bojowym nasi wojownicy wedrą się do ich sal niczym wilki pośród nocy, a jednym potężnym zamachem toporów obrócimy ich władztwo w ruinę. Niech kruki ucztują, gdyż bogowie wybrali naszą drogę i żaden tyran nas nie zatrzyma."

 JOM_wolfs_holmgang: "Holmgang Wilka"
 JOM_wolfs_holmgang_desc: "Aleksander Jabłonowski, znany jako Jaszczur, jest często nazywany zdrajcą, szpiegiem i wrogiem ludu. Zdradził kraj i działał przeciwko własnym rodakom, przez co trudno znaleźć w nim jakiekolwiek odkupieńcze cechy. Nie możemy jednak przeoczyć jednego aspektu: jego odwagi. Wkrótce odbędzie się holmgang, tradycyjny pojedynek między jarlem Halfdanem a Jabłonowskim. Powiadają, że Jaszczur bez lęku przyjmuje wyzwanie i z uśmiechem przygotowuje się do walki. Jego odwaga przywodzi na myśl najdzielniejszych wojowników Odyna. Niech bogowie chronią naszego jarla i obdarzą go siłą Thora, by pokonał tego szaleńca."

 JOM_hammer_of_rainbow_vikings: "Młot na tęczowych wikingów"
 JOM_hammer_of_rainbow_vikings_desc: "Siły Jaszczura prowadzą wojnę nie jak prawdziwi wojownicy, lecz niczym cienie w nocy. W gęstych lasach czają się jak wilki zbyt tchórzliwe, by pokazać kły. Ich zasadzki uderzają szybko i okrutnie, powalając nawet najdzikszych berserkerów, nim zdążą unieść topory. To wojna bez chwały i honoru.\n\nCzuć w tym fortel Lokiego, próbę ducha i determinacji. Nasi ludzie lękają się tych przeklętych lasów, bo nie ma tam muru tarcz ani okrzyku bojowego, tylko cisza, pułapki i czająca się śmierć. Jesteśmy jednak synami Północy i choć oni pełzają w mroku, wyjdziemy im naprzeciw z ogniem oraz gniewem, aż po ich przebiegłości nie zostanie ślad."

 JOM_forge_of_warriors: "Kuźnia wojowników"
 JOM_forge_of_warriors_desc: "Choć armia Jaszczura jest przeklęta i zdradziecka, stanowi tygiel, w którym przetrwają tylko najsilniejsi. Niech nikt nie rozpacza, bo w oczach bogów trudności są jedynie kuźnią kształtującą prawdziwych wojowników. Ci, którzy wyjdą z mrocznych lasów zakrwawieni, ale niezłamani, zdobędą niezmierzoną chwałę. Słabi upadną, a godni powstaną. Z tych przeklętych puszcz wyłoni się nie zwyczajny najeźdźca, lecz zahartowany czempion Odyna, wybraniec Týra pobłogosławiony spojrzeniem Freji. Niech rozpoczną się próby; powstaną z nich najdziksi wojownicy naszej epoki, którzy przypieczętują zgubę Jaszczura."

 JOM_push_back_skraelings: "Odparcie Skraelingów"
 JOM_push_back_skraelings_desc: "Skraelingowie pod rządami Kolonki są niczym innym jak przeklętym potomstwem niegodziwego imperium zza zachodniego morza. Finansowani srebrem z plugawych sal Ameryki Trumpa, pełzają dziś wzdłuż wybrzeży, naśladując nasze najazdy i potęgę, lecz nie mają ani honoru, ani błogosławieństwa bogów.\n\nNiosą strach niczym mgłę, która wpełza i dusi, lecz odpowiemy ogniem oraz furią. Wyrzućmy ich za ocean, z powrotem do krainy chciwości i kłamstwa. Niech spadnie na nich młot Thora, a nasze topory zaśpiewają pieśń zemsty. Fałszywi bogowie ich nie ocalą, gdy runie na nich burza Północy."

 JOM_total_naval_blockade: "Całkowita blokada morska"
 JOM_total_naval_blockade_desc: "Od strony lądu zepchniemy ich ku morzu, a na falach będą już czekać nasze drakkary, których czarne żagle przesłonią słońce. Nie będzie ucieczki ani ratunku. Ani jedna łódź z posiłkami czy zaopatrzeniem nie przemknie się przez nasz uścisk.\n\nZarzucimy na wody sieć ze stali i ognia, a schwytani Skraelingowie nie zostaną uwolnieni. Niczym zdobycz zaplątana w sidła bogów będą się miotać i krzyczeć, lecz wszystko na próżno. Morze poczerwienieje, a ich wrzaski poniesie wiatr aż do Helheimu, gdzie jest miejsce ich wszystkich."

 JOM_redirect_revolution: "Przekierowanie #Rewolucji"
 JOM_redirect_revolution_desc: "Wśród ludzi rozchodzą się szepty szaleństwa, tak zwana #Rewolucja napędzana wypaczonym umysłem Maksa Kolonki i jego obłąkaną bandą prawicowych ekstremistów. Ich kłamstwa zatruwają umysły podatnych i zniekształcają prawdę, aż staje się cieniem. Nie możemy pozwolić, by trwało to dalej.\n\nNie pora na dyskusję. Wyślemy wojowników ze stalą w dłoniach. Oświecenia nie przyniosą puste debaty, lecz odgłos pękających kości i toporów uderzających o ziemię. Nasi wysłannicy położą kres chaosowi, jeden agitator po drugim, aż zwykli ludzie przypomną sobie, kto ich chroni i kto naprawdę walczy o przyszłość Północy."

 JOM_breadbasket_of_pomerania: "Spichlerz Pomorza"
 JOM_breadbasket_of_pomerania_desc: "Skraelingowie zostali wyparci, ale teraz liczy się przede wszystkim to, że Koszalin jest nasz. Tutaj, na żyznych równinach i łagodnych wzgórzach, musimy rozpocząć odbudowę. Odrzucimy fałszywą wygodę agroturystyki niczym pękniętą tarczę i przywrócimy ziemi jej prawdziwe przeznaczenie: karmienie naszego ludu. Sprowadzimy stada, zbudujemy długie domy z kamienia oraz drewna i zaorzemy glebę siłą wielu wojowników. Pod czujnym spojrzeniem Njörðra i Frejra Körfvik stanie się spichlerzem Pomorza Zachodniego, zdolnym wyżywić nas wszystkich w czasach kryzysu i pokoju."

 JOM_kinsmen_from_north: "Rodacy z Północy"
 JOM_kinsmen_from_north_desc: "Nordycki batalion ONZ również przygotował interwencję na tych rozbitych ziemiach. Skoro są naszymi północnymi krewnymi, nic nie powinno stać na przeszkodzie do porozumienia. Prawdę mówiąc, ich dowódca, wódz Hellebjerg, nie darzy wielką miłością łańcuchów centralnego dowództwa ONZ. Pragnie wolności, wolności wojownika, by działać bez wahania i obcych szeptów tępiących jego topór.\n\nNiech błękitne hełmy zalśnią furią dawnych bogów. Niech ich miecze uderzają nie w imię traktatów, lecz honoru i braterstwa. Jeśli pomaszerują u naszego boku, damy im to, czego nigdy nie zapewniłyby sale biurokracji: chwałę, ogień i prawo do zapisania własnej sagi krwią oraz stalą."

 JOM_meet_with_hellebjerg: "Spotkanie z Hellebjergem"
 JOM_meet_with_hellebjerg_desc: "Wódz Hellebjerg, syn Północy, zna ziemie dawnej Wendii jak grzbiet dłoni dzierżącej miecz. Przekraczał jej rzeki, czuł wiatr mazowieckich równin i słyszał szepty zapomnianych bogów. Jest gotowy mówić, pertraktować i zawrzeć układ, jeśli służy to większemu celowi. Musimy wykorzystać tę chwilę.\n\nWydobędziemy wszystko, co użyteczne, z tej tak zwanej misji humanitarnej. Niech Organizacja Narodów Zjednoczonych pomrukuje i zgrzyta zębami; jej odległa furia ma niewielkie znaczenie wobec stali oraz zaopatrzenia, które możemy zdobyć na miejscu. Niech Nordycki Batalion walczy nie pod błękitnym sztandarem, lecz przy ryku Mjölnira i pod spojrzeniem Wszechojca."

 JOM_treaty_of_bornholm: "Traktat Bornholmski"
 JOM_treaty_of_bornholm_desc: "Na świętej wyspie Bornholm, pod czujnym spojrzeniem Njörðra i Týra, zostanie wykuty pakt, układ wzajemnej siły i zrozumienia. Nasi wysłannicy spotkają się tam z dowódcami Nordyckiego Batalionu, by podpisać traktat rozszerzający zasięg ich misji humanitarnej na ziemie znajdujące się teraz pod naszą ochroną i władzą.\n\nNordycki Batalion nie będzie rządzić ani wtrącać się w nasze sprawy. Nie chwyci za broń w naszych bitwach, lecz będzie strzegł arterii nowego państwa, szlaków zaopatrzeniowych, kluczowych twierdz i najważniejszych portów. Bogowie żądają porządku płynącego z siły, a dzięki temu paktowi furia Północy będzie maszerować nieprzerwanie."

 JOM_secure_our_backs: "Zabezpieczanie tyłów"
 JOM_secure_our_backs_desc: "Z woli Najwyższych Bogów i zgodnie z pradawnymi prawami run wojownicy NORDBAT-u, niczym tarcze Odyna i młoty Thora, zostali rozmieszczeni we wszystkich najważniejszych twierdzach naszej ziemi. Tworzą nieugięty mur wzmocniony potęgą Asów, strzegący granic i zapewniający niezawodne wsparcie logistyczne niczym pewna tarcza przeciw zdradzieckim burzom chaosu i buntu.\n\nPod ich czujnym spojrzeniem możemy bez lęku rzucić się w wir bitwy, jakby sam Heimdall otworzył jej bramy, a nasze miecze zapłonęły ogniem Valhalli."

 JOM_oder_secured: "Zabezpieczenie ujścia Odry"
 JOM_oder_secured_desc: "Całe ujście potężnej Odry wraz z jej dolnym biegiem znajduje się teraz w naszym uścisku. Niczym jarlowie przejmujący wody Njörðra staliśmy się niekwestionowanymi panami wielkiej rzeki, poza upartymi Niemcami, którzy ośmielają się z nami spierać. Z rzeką jako tarczą i włócznią jesteśmy gotowi prowadzić grzmiące najazdy głęboko w serce Polski i pustoszyć nadbrzeżne twierdze.\n\nGłogów, Wrocław, Opole, Racibórz... wkrótce ich mury będą ociekać krwią poległych, a bitewne krzyki odbiją się echem niczym ryk Fenrira spuszczonego na światy. Bogowie sprzyjają naszym ostrzom, fala wojny wzbiera i nikt nie ostoi się przed naszym gniewem."


 JOM_runestones_of_victory: "Kamienie runiczne zwycięstwa"
 JOM_runestones_of_victory_desc: "Wzniesiemy w Jomsborgu potężne kamienie runiczne z wyrytą sagą Upadku i Wygnania - jak stawiliśmy czoła burzom, wróciliśmy do Polski i triumfowaliśmy nie raz, lecz w niezliczonych wojnach, aż sam Ragnarök skłonił się przed naszą potęgą.\n\nKażdy kamień opowie o bitwach stoczonych pod grzmiącym niebem, o roztrzaskanych tarczach i pokonanych wrogach. Wielkie ceremonie zapłoną niczym ognie Muspelheimu, święta zagrzmią w rytm wojennych bębnów, a radosne uczty uczczą nieskończone zwycięstwa wyryte w naszym losie. Sale Valhalli rozbrzmią naszymi imionami, gdy oddamy cześć krwawej drodze, która zaprowadziła nas do domu i wykuła wieczną chwałę."

 JOM_end_of_fimbulwinter: "Koniec Fimbulvinter"
 JOM_end_of_fimbulwinter_desc: "Przetrwaliśmy Ragnarök. Wreszcie nadeszła pora, by odłożyć topory, choćby na chwilę, i zastanowić się nad tym, co przed nami. Chwyćmy rogi wypełnione miodem i wznieśmy toast za poległych, których imiona na zawsze wyryto w salach Valhalli.\n\nTeraz musimy rozważyć nasz cel i zaplanować odbudowę tych ziem. Choć szczęk mieczy ucichł, rozpoczyna się prawdziwa bitwa: o władzę i ukształtowanie świata siłą naszej woli oraz mądrością bogów."

 ## Runic Tree ##

 JOM_fehu: "FEHU"
 JOM_fehu_desc: "Witaj, niwo!\nWitaj, ogniu bogactwa!\nI złoto po polach kroczące!\nRogi stada,\nMocny jest wasz krok,\nPrzez mróz i bruzdę idziecie.\n\nChwała tej ziemi!\nRówninom Wendlandu,\nGdzie rzeki płyną jak srebro!\nPobłogosław nasz ród,\nNasze paleniska i dłonie,\nOwocem ze skarbca słońca.\n\nDaj nam szczęście,\nWiecznotrwałą sławę\nI handel uczciwy oraz mądry.\nTrzoda i słowo,\nHonor i wartość,\nNiech nigdy nie padną ani nie zginą!"

 JOM_uruz: "URUZ"
 JOM_uruz_desc: "Witaj, łamaczu rogów, witaj!\nBurzowe ramię bestii,\nWędrowcze o kamiennych kopytach\nZ lasu karmionego wiatrem!\nŁamaczu run mrozu,\nKrwi rzek,\nRyczysz tam, gdzie brzoza\nI czarna sosna trwają w zadumie.\n\nWendland cię zna,\nGłęboko zakorzenioną siłę,\nŻyłę dolin,\nGłos deszczu.\nPłyniesz w sokach,\nWzbierasz w powodzi,\nWykuwasz szpik\nWzgórz i równin.\n\nDaj nam żelazo\nW ciele i losie,\nWolę przetrwania,\nNiewzruszoną drogę.\nNa kopyto i strumień,\nNa duszę byka,\nNiech nikt stojący\nPrzy tobie nie padnie."

 JOM_thurisaz: "THURISAZ"
 JOM_thurisaz_desc: "Boże zrodzony z gromu,\nWładco młota rozłupującego niebo,\nUsłysz nas stojących na krawędzi,\nZ napiętymi łukami, wzniesioną bronią i skupionym wzrokiem.\n\nDaj naszym dłoniom niewzruszoność kamienia,\nNaszemu oddechowi rytm burzy.\nNiech gniew z oddali płonie prawdziwie,\nTak jak twój młot trafia przez ogień i powietrze.\n\nOsłoń nas siłą\nNie murów, lecz woli,\nBy nikt nas nie złamał, nim spadną nasze kule.\n\nNiech olbrzymy drżą na dalekich wzgórzach,\nNiech wrogowie poczują ciężar gromu,\nChoć nie widzą zbliżającego się ostrza.\nDzięki tobie uderzamy niewidoczni, lecz nigdy lekko."

 JOM_ansuz: "ANSUZ"
 JOM_ansuz_desc: "Odynie, Wszechojcze,\nDawco Run, Tkaczu Słów,\nKtóry wisiałeś na smaganym wiatrem drzewie,\nBy wypić napój wiedzy,\nWzywam cię teraz.\nNa Ansuz, runę zrodzoną z oddechu,\nŚwięty znak głosu i prawdy,\nNiech twoja mowa poruszy moją duszę,\nJak wiatr porusza liść na konarze Yggdrasilu.\nNiech Huginn leci, myśl szybka niczym ogień,\nA za nim Muninn, pamięć głęboka jak morze,\nNiosąc wieści z dziewięciu światów\nDo siedziby twojej mądrej sali.\nProwadź mój język, by przemawiał z honorem,\nProwadź mój umysł, by szukał z głodem,\nProwadź moją dłoń, by pisała światłem.\nW badaniach, w ciszy, w pieśni,\nNiech twoja runa żyje we mnie."

 JOM_raidho: "RAIDHO"
 JOM_raidho_desc: "Koła obracają się pod czujnymi gwiazdami,\nSzlaki wytyczają pradawne ścieżki.\nMarsz nie pospieszny, lecz uporządkowany,\nKażdy krok przysięgą, każda mila ostrzem.\n\nNiech nie pęknie żadna oś, nie potknie się żadne kopyto,\nNiech żaden ciężar nie spowalnia sprawiedliwej drogi.\nJedziemy bowiem z celem,\nJak bogowie niegdyś jechali przez zmierzch i świt.\n\nDaj nam szybkość bez chaosu,\nPorządek bez bezruchu,\nMądrość, by wiedzieć, kiedy ruszyć,\nI siłę, by nieść świat.\n\nOd obozu po podbój,\nOd wybrzeża po twierdzę,\nNiech każda podróż służy ogółowi,\nA każda droga sprowadza nas z honorem."

 JOM_kenaz: "KENAZ"
 JOM_kenaz_desc: "Zrodzony z oddechu i skrzesany w mroku,\nPłomień żyje tam, gdzie odważni trwają.\nTańczy w kuźni i gorączce,\nW oczach królów i dłoniach kowali.\n\nJest głodem i uzdrowieniem,\nPragnieniem i zagładą,\nZ początku iskrą, potem siłą większą niż strach.\n\nKarm go nie słomą, lecz mocą.\nNiech czysto wypali zwątpienie i popiół,\nOświetlając długą drogę przez cień i walkę.\n\nW palenisku, w ranie, w wojnie i słowie,\nNiech wewnętrzny ogień nigdy nie zgaśnie,\nLecz raz za razem powstaje,\nJak uczynił to o pierwszym świcie."

 JOM_gebo: "GEBO"
 JOM_gebo_desc: "Gdzie ofiarowuje się dar, tam rośnie siła,\nNie w zgromadzonym złocie, lecz w otwartych dłoniach.\nZiemia stoi mocno, gdy wszyscy są syci,\nGdy żaden człowiek nie błaga ani nie rozkazuje.\n\nOgień wdowy, chleb sieroty,\nKunszt uzdrowiciela, kamień budowniczego,\nWszystko związane przysięgą, nie samą dumą,\nWięzią niewidzialną, lecz głęboko odczuwaną.\n\nDzieląc się, stajemy się pełniejsi,\nKażda dłoń podtrzymana, każdy ciężar lżejszy.\nKrólestwo trwa tam, gdzie płynie sprawiedliwość,\nNie dzięki mieczowi, lecz dzięki temu, co słuszne.\n\nNiech władza służy złamanej trzcinie,\nNiech królów osądza się po tym, ile dają,\nA nie ile zachowują."

 JOM_wunjo: "WUNJO"
 JOM_wunjo_desc: "Gdzie rozpala się radość, tam pęka cień.\nNie potrzebuje korony ani wysadzanego klejnotami pierścienia,\nA jednak ci, którzy ją noszą, chodzą niczym królowie,\nIch sale jaśnieją pieśnią i pokojem.\n\nMieszka w dymie paleniska,\nW wiernych krewnych,\nW śmiechu przekazywanym przez zimowy chłód.\nJest końcem wędrówki,\nCiszą po burzy.\n\nŻaden smutek nie zapuści korzeni tam, gdzie wyrosła radość,\nŻaden głód nie zamieszka tam, gdzie serca są pełne.\nNie da się jej odebrać, można ją tylko poznać.\nRośnie tam, gdzie miłość jest silna i pewna.\n\nNiech odnajdzie nas nie przez przypadek,\nLecz przez prawdę, której dochowujemy,\nI pokój, który dajemy."

 JOM_hagalaz: "HAGALAZ"
 JOM_hagalaz_desc: "Uderzenie gradu, pieśń ognia,\nMłot lodu spada z nieba.\nRozbij wszystko, obnaż do kości,\nNiech nie pozostanie nic miękkiego.\n\nMaszeruj i śmiej się pod burzą,\nMaszeruj i pij w imię ruiny.\nUderzenie gradu, pieśń ognia,\nUderzenie gradu, pieśń ognia,\nStal śpiewa głośno, gdy niebo krzyczy.\n\nRoztrzaskaj tak samo mury i dumę,\nNadszedł chłód, by usunąć słabych.\nWznieś głos ponad ryk,\nŚwiat rozdziera się, by powstać na nowo.\n\nUderzenie gradu, pieśń ognia,\nUderzenie gradu, pieśń ognia,\nPrzez grad kroczymy, przez ogień ucztujemy."

 JOM_naudiz: "NAUDIZ"
 JOM_naudiz_desc: "Piwo, piwo, piwo,\nNalej zimnego, żwawo!\nPotrzeba jest okrutna i ciasna jak sznur,\nLecz jęczmień niesie radość!\n\nGdy noc jest długa,\nA ogień dogasa,\nI wszystko, co masz,\nTo długi oraz śnieg,\n\nPiwo, piwo, piwo,\nWyśpiewaj cały strach!\nNiedola gryzie, lecz ból może uczyć,\nGdy gorycz zmienia się w radość.\n\nSerce jest ściśnięte,\nDusza obolała,\nLecz łyk po łyku\nJuż nie błagamy.\n\nPiwo, piwo, piwo,\nWznosimy kielich za potrzebę!\nBo ci, którzy pragną w mrocznych czasach,\nZaśmieją się, gdy przeminie smutek!"

 JOM_isa: "ISA"
 JOM_isa_desc: "Nieruchomo stoi mur tarcz,\nMróz w oddechu,\nŻelazo w ziemi,\nCisza przed wyciem wojny.\n\nLód wiąże buty z zamarzniętą glebą,\nOkopy przecinają kości Wendlandu.\nBez szarży, bez krzyku,\nTylko gorzki wiatr\nI milczenie ludzi gotowych wytrwać.\n\nFale kryją się pod dachem lodu,\nRzekę związała kora,\nNawet ogień drży w palenisku.\nTutaj nie ma pośpiechu, jest tylko trwanie.\nTutaj siła nie tkwi w uderzeniu,\nLecz w pozostaniu.\n\nNiech śmiali rozbiją się o naszą zimną krawędź.\nNiech furia poślizgnie się na ziemi stwardniałej od mrozu.\nZima sprzyja bowiem niewzruszonym,\nA lód pamięta każdy pozostawiony ślad."

 JOM_jera: "JERA"
 JOM_jera_desc: "Pług wcina się głęboko w pierś Wendlandu,\nA czas powoli obraca się pod słońcem.\nTo, co zasiano w ciszy i hodowano troskliwie,\nPowraca złotem, gdy dni dobiegają końca.\n\nZboże pochyla się nisko, nie ze strachu,\nLecz pod ciężarem cierpliwego plonu.\nNie ostrze ani przechwałki, tylko ziemia i pot\nZdobyły bogactwo dojrzałego pola.\n\nNiech burza szaleje, niech mróz zwleka,\nKoło nadal się obraca, choć nogi mogą zawieść.\nCi bowiem, którzy doglądają stałymi dłońmi,\nBędą jeść, gdy inni pobledną z głodu.\n\nZiemia nie zapomina uczciwej pracy,\nA każde ziarno znów zaśpiewa."

 JOM_eihwaz: "EIHWAZ"
 JOM_eihwaz_desc: "Cis stoi niewzruszony, choć spadają topory.\nJego kora nosi blizny dawnych wojen.\nPod konarami wycinamy ich imiona,\nOdważnych, straconych, nigdy nieodeszłych.\n\nPiją dziś tam, gdzie wzywa się dzielnych,\nW salach tarcz, burzy i pieśni.\nMy jednak pozostajemy ze złamanymi mieczami,\nBy zasadzić nadzieję, za którą zginęli.\n\nNiech każdy korzeń ich pamięta,\nNiech każda gałąź niesie czujny płomień.\nWalczymy nie tylko o to, co może nadejść,\nLecz o lepsze wczoraj,\nKtóre pragnęli ujrzeć i za które umarli.\n\nStój więc niczym cis,\nGłęboko w ziemi,\nNigdy niezłamany."

 JOM_perthro: "PERTHRO"
 JOM_perthro_desc: "Kubek został rzucony,\nŻadna dłoń nie zatrzyma go w locie.\nTo, co ukryte w kościach,\nW łonie nocy,\nZnają tylko ci,\nKtórzy nie lękają się mroku.\n\nGra jest starsza od bogów,\nA jej zasady szepczą w snach.\nJedni zwyciężają rozumem,\nDrudzy wojną,\nJeszcze inni zupełnym przypadkiem.\n\nCo ma nadejść, nadejdzie,\nGdy runy spadną, a kruki zawrócą.\nZbierz więc swój los,\nWypij głęboki łyk przypadku,\nA jeśli Norny nie odpowiedzą?\n\nDo Hel z tym,\nBawimy się."

 JOM_algiz: "ALGIZ"
 JOM_algiz_desc: "Oto sala, gdzie nie dźwięczy żaden miecz,\nA jednak bitwy szaleją w oddechu i krwi.\nTutaj tarcza nie jest z dębu,\nLecz z dotyku, umiejętności i cichej woli.\n\nGdzie na ból odpowiada światło,\nA na rany mądrość.\nGdzie uzdrowiciele stoją niczym pradawne drzewa,\nZakorzenieni, czujni, nigdy nie odwracający wzroku.\n\nNiech będzie to sanktuarium\nMiędzy jednym oddechem a następnym.\nNiech żaden cień nie przekroczy jego progu\nBez walki, bez stawienia mu czoła.\n\nBłogosławcie dłonie opatrujące złamanych,\nBłogosławcie mury strzegące słabych.\n\nA gdy śmierć zapuka,\nNiech zastanie drzwi zaryglowane\nMiłosierdziem i determinacją."

 JOM_sowilo: "SOWILO"
 JOM_sowilo_desc: "Niezrodzone na marmurowych dworach ani nieskryte w jedwabiu,\nLecz powstające dziko ze śniegu i kamienia,\nNasze słońce nie jest bożkiem.\nPoluje na mrok, ostre niczym włócznia,\nWypalając czystą drogę przez burzę i dym.\nOni mieli Sol Invictus,\nZłote, odległe, odziane w cesarstwo.\nMy mamy blask oślepiający wilka,\nPłomień, który nigdy się nie kłania.\nNie oddaje mu się czci.\nPodąża się za nim.\nOświetla ostrze, ogrzewa pole,\nProwadzi okręt i koronuje wolę.\nNie mieści go żadna świątynia.\nNie posiada go żaden tyran.\nNasze słońce nie przetrwa,\nOno zwycięży. Za każdym razem.\nA to, przyjacielu, jest lepsze."

 JOM_tiwaz: "TIWAZ"
 JOM_tiwaz_desc: "To nie miecz prowadzi,\nLecz dłoń wiedząca, gdzie uderzyć.\nGwiazda nie krzyczy,\nŚwieci tam, gdzie wszyscy mogą za nią podążyć.\n\nTen, kto oddaje dłoń przeznaczeniu,\nJak niegdyś uczynił jednoręki bóg,\nWie, że wojna nie jest furią,\nLecz prawem związanym krwią.\n\nZnaki wyznaczają drogę,\nLecz mądrzy odczytują je ogniem i mrozem.\nNie chwała przetrwa,\nLecz honor zdobywany cal po calu.\n\nZa każdą uniesioną tarczę\nKtoś niesie brzemię.\nZa każdy wydany rozkaz\nWaży się duszę.\n\nSłużymy.\nWiemy.\nCelujemy.\n\nI nie chybiamy."

 JOM_berkano: "BERKANO"
 JOM_berkano_desc: "Z liścia, nie z nasiona,\nBrzoza się zaczyna,\nCichy ogień, zielony i wysoki.\nNie nosi ostrza ani owocu zakończonego stalą,\nA jednak osłania palenisko,\nOdradza ziemię.\n\nJej korona jest wysoka,\nKorzenie pamiętają.\nDzieci śpią w jej ramionach,\nGdy niebo zapomina o litości.\n\nNie oznacza podboju,\nLecz powrót.\nNie chwałę,\nLecz uzdrowienie.\n\nNiech więc ognie szaleją gdzie indziej,\nNiech żelazo uderza o pusty kamień.\n\nNiech nikt nie przynosi wojny\nTemu, co nadal rośnie.\n\nNaznaczcie gaje prawem białej kory:\n\nŻaden samolot nie powinien uderzać w brzozy."

 JOM_ehwaz: "EHWAZ"
 JOM_ehwaz_desc: "Nie jest zwierzęciem jucznym,\nLecz bratem w bitwie.\nKopyta uderzają o ziemię niczym wojenne bębny,\nA książęta uśmiechają się pod hełmami.\n\nPrzez deszcz i ryk,\nPrzez las i płomień,\nKoń się nie zawaha,\nTak jak człowiek ufający jego krokowi.\n\nSleipnir biegnie tam, gdzie kończą się drogi,\nPoza śmierć, poza sen, poza zgubę.\nNie wszyscy wojownicy noszą ostrza,\nNiektórzy niosą szybkość.\n\nNiespokojni odnajdują spokój w ruchu,\nA śmiali spotykają przeznaczenie\nMiędzy dwoma galopującymi sercami.\n\nJedź więc.\nNie po to, by uciec,\nLecz by przybyć,\nNim świat dowie się, że wyruszyłeś."

 JOM_mannaz: "MANNAZ"
 JOM_mannaz_desc: "Radosny człowiek jest drogi krewnym,\nJego śmiech niczym jasny ogień w sali.\nŻaden człowiek nie kroczy jednak bez cienia,\nLos bowiem cienko przędzie nić zaufania.\n\nKażda mocno trzymana dłoń może zawieść,\nKażdą przysięgę może złamać zimna ręka zguby.\nPan w swym najwyższym osądzie\nKaże ścierwu paść na ziemię,\nA wraz z nim więziom, które cenimy.\n\nMimo to gromadzimy się,\nZłamani, odważni, związani,\nBo we własnym upadku\nOdnajdujemy potrzebę ponownego powstania.\n\nCzłowiek pośród ludzi,\nKruchy, dziki\nI na zawsze związany\nZ obracającym się kołem."

 JOM_laguz: "LAGUZ"
 JOM_laguz_desc: "Ocean ziewa, bezkresny i dziki,\nKołysząca się łódź na drżących falach.\nStrach nie przejmuje jednak żelaznego serca\nAni nie osłabia dłoni ściskających wiosło.\n\nOgiery głębin nie znają wędzidła,\nIch furię wykuły słone burze.\nRącze niczym grom, szybkie jak północne wichry,\nRozcinają morze i chwytają własny los.\n\nStal i żagiel związane dumą,\nBraterstwo zaprzysiężone na niespokojnych przypływach.\nŻaden ocean nie jest zbyt rozległy, żadna burza zbyt okrutna,\nBo serce floty bije niezłamane,\nPłomień przeciw bezkresnej ciemności."

 JOM_ingwaz: "INGWAZ"
 JOM_ingwaz_desc: "Ingwaz spoczywa w glebie Wendlandu,\nCzarna ziemia nuci pod butami.\nFrejr kroczy po polach wiatru i żyta,\nBłogosławiąc zarówno chleb, jak i narodziny.\nTraktory kreślą dawne ścieżki pługów,\nStalowe bestie tam, gdzie niegdyś stały woły.\nZboże wznosi się wysoko jak wieże radiowe,\nZielone bogactwo karmi zatłoczone miasta.\nOd fabrycznych placów po leśne ćwiczenia,\nSilne dłonie odpowiadają tarczą i ziarnem.\nZbiory wypełniają stodołę oraz koszary,\nBochenek i karabin obok siebie.\nSerce odyńca bije we współczesnych szeregach,\nNie dla łupu, lecz dla ziemi.\nDobrze uprawiany grunt rodzi stałą siłę,\nA armie rosną tam, gdzie trwają pola."

 JOM_dagaz: "DAGAZ"
 JOM_dagaz_desc: "Dzień, chwalebne światło Stwórcy, zsyła Pan;\nJest umiłowany przez ludzi, źródłem nadziei i szczęścia dla bogatych oraz biednych,\nI służy wszystkim.\n\nTeraz Dzień rozpościera potężne skrzydła,\nPłonąca pochodnia rozcina niebiosa.\nZ ziemi ku bezkresnym salom nieba\nWznosimy się w locie wykutym ogniem.\n\nWzywa potężny ryk silników,\nHymn ku świtowi, droga do bogów.\nNadzieja przemierza wiatr, szybka i pewna,\nGdy człowiek wzlatuje, by spotkać przeznaczenie.\n\nUfamy jasnemu darowi Dnia,\nBy podbić niebo i dosięgnąć gwiazd."

 JOM_othala: "OTHALA"
 JOM_othala_desc: "Dziedzictwo jest drogie każdemu człowiekowi,\nSanktuarium, gdzie krew i kamień łączą się w jedno,\nGdzie palenisko oraz sala przechowują wszystko, co słuszne,\nA nieustanny dobrobyt tka swą ponadczasową pieśń.\n\nOd pierwszego świtu po bezkresną noc\nTa święta ziemia kołysze duszę rodu,\nTwierdza wzniesiona dłońmi obróconymi już w pył,\nDziedzictwo wyryte w kości i ogniu.\n\nPoczątek i koniec są jednym,\nZiarno i żniwo,\nKołyska i grób.\n\nW tym wiecznym domu\nNasze duchy wspólnie powstają i upadają.\n\nJesteśmy przeszłością, teraźniejszością i przyszłością.\nNiezłamanym łańcuchem, nieskończonym płomieniem.\n\nTutaj, w sercu wszechrzeczy,\nStoimy jako jedno."

### Third tree ###
 JOM_new_dawn_in_midgard: "Nowy świt nad Midgardem"
 JOM_new_dawn_in_midgard_desc: "Po raz pierwszy od niepamiętnych czasów słońce wschodzące nad Midgardem nie jest krawym słońcem. Przebyliśmy długą drogę. Stawiliśmy czoła trudom i rozpaczy. Przelaliśmy krew wrogów i pochowaliśmy zbyt wielu swoich. Dziś jednak rozpoczyna się nowa saga. Jak po Ragnaröku, tak i teraz zaczynamy kształtować odrodzony świat - nasze własne Gimlé. Salę jaśniejszą od słońca, najpiękniejszą przystań w całym Midgardzie, gdzie mieszkać mogą jedynie sprawiedliwi; miejsce, które przetrwa ziemię i niebo.\n\nTaki będzie nasz Jomsborg. Nasz Wendland. Nasz dom. Tak go zbudujemy i tak będziemy go bronić. Pierwszy poranny wiatr szepcze o odnowie. A pierwsze światło obwieszcza tę prawdę: nadszedł czas pracy. Czas nadać temu marzeniu ciało."


 JOM_second_althing: "Drugi Alting"
 JOM_second_althing_desc: "Jarl nie widział większego sensu w debacie podczas pierwszego Altingu. Sprawa była jasna: musieliśmy walczyć, by przeżyć. I choć niektórzy nawoływali do rady i rozmów, zwyciężył duch walki. Teraz jednak - gdy szczęk wojny ucichł, a nasze topory spoczęły - nic nie stoi na przeszkodzie, by odbyło się zgromadzenie ludu.\n\nOczywiście jarl mógłby po prostu zagarnąć pełnię władzy. Ale nie on. Nie Halfdan Sandbjerg. Nie krwawiliśmy i nie walczyliśmy dla korony jednego człowieka, lecz dla wolności, równości i sprawiedliwości. Dla godności wszystkich ludzi, w duchu północnego socjalizmu. Choć jesteśmy nieokrzesani, to właśnie te ideały wskazują nam drogę.\n\nNadszedł więc czas drugiego Altingu. Czas rozstrzygnąć o losie i kształcie naszego nowego, a zarazem starego domu. Zanim bowiem zabierzemy się do pracy, musimy wiedzieć, co pragniemy zbudować. A w tej kwestii... już teraz istnieje wiele wizji."

 JOM_words_of_raven: "Słowa Kruka"
 JOM_words_of_raven_desc: "Wojna nigdy się nie zmienia - czasem tylko przybiera nowe formy. Polityka potrafi wymagać więcej wysiłku niż starcie zbrojne, łatwiej bowiem władać mieczem niż słowem. Prześlizgiwanie się niczym wąż między stronnictwami, z których każde pragnie rozszarpać kruka Wszechojca i zagarnąć dla siebie największe pióro, wystarczy, by jarl zwątpił w wartość całego tego ustroju.\n\nJest on jednak konieczny. Tyrania kończy bowiem tak, jak skończyła Wendia - hańbą i upadkiem. Czerpiąc mądrość od bogów, musimy miarkować namiętności i zachowywać najwyższą ostrożność. Utrzymanie zwaśnionych klanów w kruchej zgodzie nigdy nie jest łatwe ani bezpieczne.\n\nJak dotąd jednak chroni nas autorytet Sandbjerga. Oby czynił to jak najdłużej."

 JOM_state_service_of_society: "Państwo w służbie społeczeństwu"
 JOM_state_service_of_society_desc: "Jednym z filarów filozofii naszej partii zawsze było i nadal pozostaje przekonanie, że podstawową funkcją państwa jest służba ludziom, a nie odwrotnie - że to ludzie mają służyć państwu. Ludzie mają własne ambicje, obowiązki i ideały, o które będą walczyć. To my musimy im to umożliwić, tak aby ich wartości pokrywały się z naszymi nie wskutek przymusu, lecz dzięki więzi zrodzonej z solidarności.\n\nPaństwo musi być silne, ale nie przeciw jednostkom. Musi być silne w ich obronie, bo to one stanowią budulec całej naszej wspólnoty. Niczym dobry pasterz powinno czuwać nad trzodą, osłaniać ją przed zewnętrznymi zagrożeniami, kierować drobnymi gestami i wskazywać drogę. Nigdy jednak, przenigdy, nie może stać się jej wrogiem."

 JOM_civil_partnerships: "Legalizacja związków partnerskich"
 JOM_civil_partnerships_desc: "Członkowie naszego rządu zawsze utrzymywali, że równe traktowanie wszystkich - bez względu na płeć, kolor skóry, wyznawaną wiarę lub jej brak, a także orientację seksualną - stanowi niepodważalny fundament demokratycznego państwa. Głębokie przekonanie, że równość małżeńska i związki partnerskie mogą wkrótce stać się rzeczywistością, doprowadziło nas do tej właśnie chwili.\n\nDziś z dumą możemy powiedzieć, że dajemy całemu krajowi to, na co od dawna czekał. Zrywamy kajdany krępujące ludzi wyłącznie dlatego, że kochali kogoś poza przyjętymi normami. Dość wstydu, dość ostracyzmu, dość państwowej dyskryminacji. Dziś wszystkie orientacje zyskują w państwie sojusznika - a my dajemy wam wolność. Wolność kochania."

 JOM_constitution_for_women: "Konstytucja dla kobiet"
 JOM_constitution_for_women_desc: "My, kobiety, zbyt długo byłyśmy wyśmiewane, naszą rolę umniejszano, a prawa i obowiązki rozdzielano nierówno. Rzeczywiste potrzeby i problemy kobiet - jawność wynagrodzeń, urlop rodzicielski dzielony między oboje rodziców, poszanowanie praw reprodukcyjnych oraz zwalczanie i zapobieganie przemocy wobec kobiet - pozostawały bez odpowiedzi. Podstawowe problemy społeczne, z którymi mierzyłyśmy się w poprzednim państwie - niepewność zatrudnienia, niskie płace, katastrofalna sytuacja mieszkaniowa i słaby dostęp do usług publicznych - uderzały w kobiety szczególnie mocno. Są one zwłaszcza wykluczane z rynku pracy z powodu macierzyństwa lub po prostu wieku rozrodczego.\n\nAle nie dziś. Nie w Jomsborgu. Nie wtedy, gdy stoimy razem. Polityka równościowa zostanie wreszcie wdrożona gruntownie i zdecydowanie. Drogie panie, nadszedł czas waszej równości."

 JOM_rational_drug_policy: "Racjonalna polityka narkotykowa"
 JOM_rational_drug_policy_desc: "Rzeczpospolita Polska była w zakazy ubrana. Jej porażająco obłudny system prawny sprawiał, że obywatele nie mogli posiadać na własny użytek nawet mikroskopijnych ilości pewnych substancji, podczas gdy mafie narkotykowe pozostawały nietykalne. Czas skończyć z tą hipokryzją. Czarny rynek narkotykowy nie może tutaj istnieć i zostanie zniszczony z całą siłą, jaką dysponuje państwo.\n\nJednocześnie wprowadzimy racjonalną politykę narkotykową, opartą na wspieraniu wychodzenia z uzależnienia zamiast więzienia ludzi i poddawania ich społecznemu napiętnowaniu. Ogłosimy amnestię dla skazanych za posiadanie niewielkich ilości substancji na własny użytek. Dzięki temu ofiary otrzymają wsparcie. Tych zaś, którzy żerują na zdrowiu innych, spotka należyta kara."

 JOM_lofns_loving_embrace: "Kochający uścisk Lofn"
 JOM_lofns_loving_embrace_desc: "Bogowie kochają wszystkie swoje dzieci, nawet te, które schodzą ze ścieżek wytyczonych przez ludzi i ich ciasne umysły. Lofn, łagodna bogini zakazanych więzi, udziela schronienia nawet najbardziej wzgardzonym, odtrąconym przez strach i niewiedzę. A skoro bogowie w swej mądrości nie osądzają serca duszy - my również nie będziemy. Liczy się nie to, jak ktoś kroczy, lecz czy jego ręce budują, zamiast niszczyć, i czy stoi przy swoich, gdy burze wyją najgłośniej.\n\nNiektórzy wojownicy - twardego serca i skłonni do gniewu - mogą szydzić z takiego miłosierdzia. Tylko dlatego, że nie wsłuchali się w głębsze strofy sag. Obowiązkiem mądrego wodza jest otworzyć im oczy - nie ostrzem, lecz prawdą. Nie możemy wymagać, by wszyscy kochali tak samo, ani zmusić serca do przemiany. Jeżeli jednak odrzucimy podziały i staniemy ramię w ramię w czci dla bogów, nie będzie potrzeby praw ani powodu do zwady.\n\nPozostanie tylko wspólnota."

 JOM_queens_shieldmaidens: "Królowe, wieszczki, tarczowniczki"
 JOM_queens_shieldmaidens_desc: "W obyczaju Północy kobieta jest czymś więcej niż pięknem przyobleczonym w ciało. Jest tarczowniczką, królową, wieszczką, kapłanką i oraczką ziemi. Nie ma wśród ludzi Północy zadania, przy którym kobiety nie stałyby u ich boku z toporem w dłoni. To jest prawdziwe wyzwolenie. Nie puste słowa ani próżne korony, lecz wspólna siła. Równość wykuta w ogniu, a nie zapisana na pergaminie. Taki jest porządek świata - taki był i taki być powinien.\n\nW przeciwnym razie podsycamy fałszywą wojnę płci, rozpaloną przez tych, którzy czerpią zyski z podziałów. Niektórzy opowiadają młodym kobietom o nieskazitelnym pięknie, czekaniu na książąt i złotych łańcuchach przebranych za podarunki. Kłamią. Kobieta nie musi czekać. Może chwycić za ostrze i wykuć swój los u boku braci. Może najeżdżać, rządzić, zbierać plony - i ucztować. A doprawdy, która córka Północy odrzuciłaby takie powołanie?"

 JOM_mushrooms_and_herbs: "Grzyby i zioła"
 JOM_mushrooms_and_herbs_desc: "Istnieją plugawe mikstury - wywary, które gniją umysł, niszczą ciało i pętają młodych szaleństwem. Takie trucizny są przekleństwem i muszą zostać wypalone ogniem i wykute stalą. Niech nikt w to nie wątpi. Lecz nie wszystko, co wyrasta z ziemi, jest nikczemne. Niektóre zioła i święte grzyby kiełkują z rąk samych bogów. Są darami - narzędziami, nie zabawkami. Błogosławieństwami, z których należy korzystać z czcią. Dary te nie mogą trafić w ręce głupców ani żarłoków. Należą do wybranych - do kapłanów kroczących mglistymi ścieżkami ducha i wojowników, którzy w ogniu bitwy muszą widzieć poza zasłonę.\n\nSubstancje te nie tylko wzmacniają ścięgna i budzą krew - otwierają także oko duszy. Przynoszą wizje, szepty z zaświatów i przebłyski prawdziwego majestatu mieszkańców Asgardu. Używane mądrze nie są występkiem, lecz pomostem między nami a boskością."

 JOM_new_way_of_life: "Nowa droga życia"
 JOM_new_way_of_life_desc: "Te nowe rozwiązania trudno przełknąć... są bowiem tak wielkim odejściem od dawnych obyczajów państwa, że ludzie zdają się nie być w stanie ich pojąć. Choć potrzeba będzie czasu, dzięki łasce naszego przywódcy i lojalności jego ludu nowe podejście okaże się niezbędne do stworzenia prawdziwie nowoczesnego państwa oraz wykorzenienia dawnych uprzedzeń i szkodliwych zjawisk, które wciąż się w nim utrzymują."

 JOM_diffrent_politics: "Inna polityka jest możliwa"
 JOM_diffrent_politics_desc: "Nasza partia słynęła ze swojej wyjątkowej polityki. Choć mieściła się ona w konwencjonalnych standardach, z perspektywy czasu widać, że ludzie raczej nie spodziewali się takiej zmiany. Przed nami prawdziwie wyboista droga polityczna, lecz przebrniemy przez nią tak, jak przemierzamy morza, by dowodzić naszej potęgi wobec innych państw. Nasze wybory zdefiniują stulecie naszego państwa i pokażą, że w tym polskim intermezzo jesteśmy nie tylko militarnymi, ale i prawdziwie politycznymi rywalami."

 JOM_single_vote_system: "System pojedynczego głosu przechodniego"
 JOM_single_vote_system_desc: "Aby zapewnić stabilność naszego rządu, wprowadzony zostanie system pojedynczego głosu przechodniego, w którym obywatele głosują na poszczególnych kandydatów, a nie całe partie. Miejmy nadzieję, że za łaską boga w niebiosach częściowo zliberalizuje to społeczeństwo i przygotuje je na chwilę, gdy uzyskamy prawdziwą i uznaną państwowość na arenie światowej. Preferencje wyborców są dla nas najważniejsze, zatem prawdziwa demokracja - choć nie zostanie tu urzeczywistniona w pełni - będzie wprowadzona przynajmniej częściowo."

 JOM_old_party_comrades: "Starzy partyjni towarzysze"
 JOM_old_party_comrades_desc: "Pod jasnym słońcem znaleźliśmy się w martwym punkcie po wielkiej ekspansji. Nasza partia i jej zwolennicy pozostają bowiem nie tylko w granicach państwa, lecz w całej Polsce. Wzywamy wszystkich dumnych synów i córki partii Razem, by do nas powrócili. Wraz z ich powrotem nasza partia i jej siła w państwie zostaną w pełni odbudowane, a wszyscy dowiedzą się, że jest jedynym naprawdę potężnym stronnictwem. Pod słońcem będzie o niej głośno przez długie tysiąclecia!"

 JOM_changing_the_mind: "Przemiana wzburzonego umysłu"
 JOM_changing_the_mind_desc: "Nasz wódz wojenny i partyjne kręgi nie zgadzali się ostatnio w wielu sprawach, a mimo to członkowie Razem wciąż darzą starca sympatią. Żywią do niego ukryte współczucie, pamiętają jego niedawną przeszłość i wiedzą, ile nosi w myślach. Partia spróbuje więc przeciągnąć Zandberga na swoją stronę. Jego poparcie uwiarygodni wszystko, co mogłaby powiedzieć lub uczynić, a nawet poszerzy jej wpływy, gdyż za nim pójdą jego zwolennicy."

 JOM_representatives_at_althing: "Równi przedstawiciele na Alting"
 JOM_representatives_at_althing_desc: "Będzie Alting. Pragniecie równości? Niech tak będzie. Niech zgromadzenia tworzą równi. Niech głosy przemawiających mają jednakową siłę i wagę. Lecz to wódz ich wskaże. Tylko on bowiem wie, jak osiągnąć prawdziwą równowagę. Tylko on widzi całą tkaninę losu. Sprawy ludzi, choć ciężkie, są lżejsze od spraw bogów. Dlatego wybrani będą o nich mówić i nimi rządzić - z mocą, głosem i wolą.\n\nNiech jednak żaden z nich nie waży się sięgnąć po najwyższą gałąź. Niech nikt nie sądzi, że może rozstrzygać o tym, co zastrzeżone jest dla ręki jedynego. Tylko wódz może przekuć boską wolę w prawo. Tylko on może poprowadzić równość pod sztandarem jej największego sługi."

 JOM_drottnars_of_new_midgard: "Dróttnarzy Nowego Midgardu"
 JOM_drottnars_of_new_midgard_desc: "Aby wykuć nowe królestwo, musi popłynąć świeża krew - nie po bitewnych kamieniach, lecz w żyłach władzy. Sam Odyn wie, że nikt nie trudzi się bardziej niż partyjni towarzysze. Nikt głośniej nie wykrzykuje swoich przysiąg. A jednak coraz więcej z nich ujawnia, że nie widzi przeznaczenia, które widzi Halfdan. Nie słyszy szeptu Norn tkających jego los. Nie czuje wezwania chwały w jego krokach.\n\nKrąg wokół wodza musi się zatem zmienić. Nie można pozwolić, by cienie przyćmiły ognistą ścieżkę. Nikt nie może zawrócić go z obranej drogi. Bogowie przemówili: po Ragnaröku nadejdzie raj. I tylko ci, którzy oddaliby ostatni oddech, aby ujrzeć jego narodziny - tylko oni są godni zasiąść po prawicy wodza."

 JOM_herald_of_change: "Zwiastuni Zmiany"
 JOM_herald_of_change_desc: "Wódz wie, co nadejdzie. To on jest tym, który nadchodzi. Wódz wie, jak ponownie zjednoczyć Wendię. Poprowadzi nas ku wolności. Ku równości. Ku braterstwu. Tylko z wodzem osiągniemy prawdziwy socjalizm. A po drodze złupimy wszystkich wrogów płomienia. Bogowie przemawiają przez niego. Jest ich głosem. Ich grzmotem. Przynosi Rewolucję. Zetrze zmurszały porządek w pył, a z jego popiołów wzniesie raj, o którym śpiewać będą skaldowie.\n\nTylko on zna drogę, gdyż sam Odyn wlał mądrość w jego ducha. Gdy niebo nad Wendią pociemnieje, niech wszyscy ludzie i zwierzęta wiedzą: zbliża się gniew północnych bogów. Nikt nie zostanie oszczędzony przez tę przemianę. Wszyscy zostaną osądzeni. Wszyscy otrzymają to, co im należne: wieczną mękę w zimnym uścisku Hel albo życie w dostatku w złotym Midgardzie."

 JOM_urdr: "Urdr"
 JOM_urdr_desc: "Poszłam w dół na wybrzeże,\nwrogie mi były Norny\nChciałam zakończyć burzę życia mego\nWysokie fale nie pogrążyły mnie, lecz niosły;\nWyszłam na ląd,\nprzeznaczone mi było żyć\n\nBYŁEM"

 JOM_verdandi: "Verdandi"
 JOM_verdandi_desc: "Dobrześmy obaj się bili, stoimy,\nNa poległych od miecza Gotach,\njak orły na konarze,\nNieśmiertelną zdobyliśmy sławę,\nchoć dziś czy jutro umrzemy,\nNi nocy nikt nie żyje po wyroku Norn\n\nJESTEM"

 JOM_skuld: "Skuld"
 JOM_skuld_desc: "Norny zbudziły mnie teraz,\nZłowróżbnym snem,\nchciałbym go móc tłumaczyć,\nTam zamieszkają prawi władcy\ni wiecznie zaznawać będą szczęścia.\nZ wyżyn nadchodzi, by dzierżyć pełnię władzy,\npotężny pan, rządzący wszystkimi ziemiami.\n\nPRZEBUDZIŁEM SIĘ"

 JOM_administrative_revolution: "Rewolucja w administracji"
 JOM_administrative_revolution_desc: "Uwaga, zdobycze naszej rewolucji są zagrożone!\nNa naszych ziemiach wciąż pozostaje wielu dawnych wrogów - ludzi zgniłej dyktatury Eurokomisariatów. Nadszedł wreszcie czas, by raz na zawsze pozbyć się tych wyzyskiwaczy!\nWszystkie stanowiska administracyjne zostaną natychmiast zreorganizowane. Osoby mianowane przez odrażający rząd Eurofederacji mogą spodziewać się bezzwłocznego zwolnienia, a nawet postawienia przed sądem!\nPrecz z kolesiostwem, precz z korupcją, precz z faworyzowaniem!\nPrzed nami stoi wyzwanie zbudowania nowego, sprawiedliwego ładu opartego na rzeczywistym udziale obywateli.\nJuż teraz jednak zaczynają się wyłaniać rozmaite koncepcje odnowy..."

 JOM_nordic_democracy: "Model nordyckiej demokracji"
 JOM_nordic_democracy_desc: "Nordycki model gospodarczy - nareszcie to długo wyczekiwane marzenie milionów Polaków wkrótce stanie się rzeczywistością!\nDzięki niemu dołączymy do myśli gospodarczej naszych północnych braci i zapewniamy - już niedługo dogonimy ich poziomem rozwoju!\nNadszedł czas państwa opiekuńczego, które kocha swoich obywateli i naprawdę o nich dba!\nPolityka społeczna, szeroki udział ludu!\nKoniec z pytaniami o to, gdzie podziały się pieniądze podatników! Od tej pory zdecydowana większość środków będzie kierowana prosto na usługi dla obywateli.\nPraca będzie dostępna dla wszystkich, ale nie znajdzie się w niej miejsce na wyzysk - za to na silne związki zawodowe!\nTo wszystko i jeszcze więcej!"

 JOM_progressive_tax_scale: "Progresywna skala podatkowa"
 JOM_progressive_tax_scale_desc: "Ucisk i wyzysk. To właśnie państwo sprzed upadku oferowało swoim pracownikom. Gdy grube ryby bogaciły się kosztem niższych klas, rodziły się krwawe rewolucje. Tutaj jednak nie możemy pozwolić na samosąd - przynosimy rozwiązanie. Uczciwie pracujący ludzie wreszcie zapłacą niższe podatki niż milionerzy żyjący z cudzej pracy. Ci ostatni nie będą już uciekać do rajów podatkowych, aby unikać składek, ani cieszyć się przywilejem podatku liniowego.\n\nPodatek progresywny jest czymś naturalnym. Wielka korporacja i mała firma nie mogą płacić tyle samo. Sprawiedliwość musi być zagwarantowana. A kombinatorzy i oszuści próbujący uchylić się od tej solidarności zostaną schwytani. Nie musicie już gniewnie spoglądać na swoich pracodawców. Zrobimy to za was."

 JOM_found_welfare_state: "Podstawy państwa opiekuńczego"
 JOM_found_welfare_state_desc: "Już za czasów PiS podjęto pewne kroki w stronę państwa opiekuńczego i nie możemy im tego odmówić. Zostały one jednak bezwstydnie wykorzystane jako partyjna propaganda, zamiast rzeczywiście służyć poprawie życia obywateli. Mamy szeroki program do wdrożenia - taki, który skieruje nas ku państwu opiekuńczemu w każdym możliwym znaczeniu tego słowa.\n\nPodniesiemy próg dochodowy uprawniający do świadczeń rodzinnych, w każdej gminie zbudujemy domy opieki dla seniorów i osób potrzebujących wsparcia, uprościmy procedury uzyskiwania świadczeń, zagwarantujemy miejsca w żłobkach i przedszkolach dla wszystkich dzieci, wprowadzimy powszechne świadczenia wychowawcze oraz jednolity system urlopów rodzicielskich.\n\nTo dopiero początek. Potem rozszerzymy program. I będziemy się rozwijać. Aby wszystkim żyło się lepiej."

 JOM_jarl_commonwealth: "Wspólnota Jarlów"
 JOM_jarl_commonwealth_desc: "Sam Alting to chaos. Zbyt dziki, zbyt podatny na przypływy emocji i ambicji. Musimy więc wykuć drugi filar - izbę wyższą ze stali i kamienia, złożoną z jarlów, panów ziemi, strażników ogniska domowego i muru tarcz. Obie izby będą wzajemnie się równoważyć. Co jednak ważniejsze - będą strzec wodza wojennego. Każdy, kto ośmieli się marzyć o ograniczeniu mandatu Halfdana, zmierzy się odtąd nie tylko z głosem pospólstwa... lecz także ze Wspólnotą Jarlów, zakorzenioną w przysięgach, więzach krwi i lojalności hartowanej w ogniu. To przebiegły dar - posmak władzy dla lokalnych panów, miejsce przy stole, szept w wielkiej sali, gdzie pieczętowane są losy.\n\nNiech jednak nikt się nie łudzi: przemawiają, głosują i rządzą - lecz rozkazuje tylko jeden.\nA na imię mu Halfdan Sandbjerg."

 JOM_danegeld_from_rich: "Danegeld od bogatych"
 JOM_danegeld_from_rich_desc: "Nie będziemy płaszczyć się przed sądami zbudowanymi przez złodziei. Nie będziemy spierać się z tymi, którzy pili z czaszek ubogich. Rozbijemy ich. Proste. Zabrać bogatym. Dać biednym. Prawda starsza od tronów i królów, sprawiedliwa jak pierwszy ogień ludzkości. Wszyscy, których nagromadzone złoto przekracza miarę godną jednej pary rąk, zostaną opodatkowani, ograbieni i złamani. Utyli na pracy zwykłego ludu. Ich fortuny puchły niczym guzy, a wraz z monetami nabrzmiewała pycha, aż ośmielili się kroczyć pośród śmiertelników jak bogowie.\n\nA lud? Lud głodował. Płonął. Pamiętał. Teraz nadciąga burza. Topór pragnie krwi. Każdy zwykły człowiek zna swoje święte zadanie: powstać, uderzyć i zmusić ciemiężcę, by odpowiedział za każdą bliznę, za każdy skradziony rok. Wiek złota dobiegł końca. Niech się podporządkują. Albo niech poczują ostrze."

 JOM_guardians_of_equality: "Strażnicy równości"
 JOM_guardians_of_equality_desc: "Na naszej ziemi wciąż żyją tacy, którzy ośmielają się wyzyskiwać i pragną tuczyć się cudzym kosztem. Wciąż są tacy, którzy poniżają braci, by karmić własną dumę - którzy depczą pokornym po karkach, aby wznieść się ponad nich. Takie czyny spotkają się z osądem. A osąd ten będzie szybki. Dopiero gdy ucichnie ostatni szept dominacji, wszyscy ludzie będą mogli bez ciężaru kroczyć po naszym nowym świecie - świecie wykutym nie z miłosierdzia dla nikczemnych, lecz z wierności sprawiedliwości.\n\nPowołamy zastęp - Strażników Równości - któremu przypadnie obrona zdobyczy sprawiedliwości, czuwanie nad odrodzonym królestwem i bezzwłoczne działanie wszędzie tam, gdzie zakorzenią się nierówność, wyzysk lub okrucieństwo. Tak - czasem siłą. Trzeba bowiem dawać przykład. Nawet surowy. I nie mylcie tego z zemstą - taka jest wola bogów. Sami bogowie uczą przecież: głodnych nakarmić, spragnionych napoić, a wyzyskiwaczy powiesić wysoko na starych dębach."

 JOM_halls_of_freedom: "Sale wolności"
 JOM_halls_of_freedom_desc: "W świecie często spowitym cieniem i niepewnością nasz kraj stoi niczym promienny drogowskaz nadziei i aspiracji dla wszystkich, którym drogie są przyzwoitość i sprawiedliwość! Jedni widzą w naszym przywódcy wyzwoliciela, inni niezłomnego bohatera prawości, lecz jedno jest pewne: dla nas wszystkich uosabia on coś doniosłego. To ziemia, na której wolność rozkwita dla tych, którzy wybierają cnotę i szanują zasady kierujące naszym społeczeństwem.\n\nMarzymy o wspólnym stole, przy którym ludzie ze wszystkich środowisk mogą zasiąść jak równi, świętując dzielące nas różnice i pielęgnując wspólne człowieczeństwo. To marzenie nie jest odległą fantazją; ta wizja może stać się rzeczywistością! Razem dbajmy o nią, aż przemieni się w żywą tkaninę jedności i zrozumienia. Wierzymy w głębi serc, że na tej ziemi, której nie określają napotykane trudności, możemy stworzyć przyszłość, gdzie nadzieja i marzenia świecą jasno dla każdego."

 JOM_valor_of_boar: "Waleczność Dzika"
 JOM_valor_of_boar_desc: "Położenie fundamentów naszego narodu to przedsięwzięcie głębokie, wykraczające daleko poza zwykłe budowle i politykę. Wymaga istoty kultury - naszej religii, naszej tożsamości, samej osnowy łączącej to, kim jesteśmy, z tym, co jest nam drogie. Patrząc w przyszłość, musimy najpierw stworzyć mocny fundament, na którym rozkwitną nasze wspólne marzenia: kulturę, w której będziemy wzrastać i prosperować.\n\nPośród tego szlachetnego dążenia stajemy jednak na rozdrożu, z ostrymi podziałami zdań i sercami tęskniącymi za jasnością. Wyzwanie polega nie tylko na budowaniu, lecz także na rozpoznaniu, czyją ścieżką powinniśmy podążać - a zadanie to ciężko spoczywa na sumieniu naszego społeczeństwa.\n\nW tej przepełnionej emocjami podróży musimy pamiętać, że dzisiejsze wybory odbiją się echem w przyszłych pokoleniach. Przyjmijmy nieokreślone możliwości, które przed nami stoją, i pozwólmy, by wspólne wartości oraz przekonania poprowadziły nas ku przyszłości, w której każdy głos będzie słyszany, każda kultura szanowana, a każde serce zjednoczone we wspólnym celu. Razem możemy utkać opowieść, która uczci przeszłość, a zarazem śmiało wkroczy w obietnicę jutra."

 JOM_identity_problems: "Problemy z tożsamością"
 JOM_identity_problems_desc: "Kim jesteśmy? A może trafniej: kim byliśmy? Gdy przemierzamy drogę istnienia, pytania o tożsamość i cel ciężko ciążą nam na myślach. Podróż w przeszłość to twardy orzech do zgryzienia. Nasze korzenie sięgają Danii, skąd płynie w naszych żyłach dziki duch wikingów, a przecież z dumą stoimy jako Polacy. Te dwa dziedzictwa ucieleśniają wartości pozornie sprzeczne, niczym pierwotne starcie ognia z wodą.\n\nWobec takiej dwoistości stajemy na rozdrożu, zmuszeni dokonać wyboru. W tym zawiłym tańcu kultury i spuścizny pragniemy wydobyć to, co najlepsze z obu stron. Wabi nas nordycki duch, szepcząc opowieści o sile i wytrwałości. Czy jednak naprawdę stanowi istotę tego, kim jesteśmy?"

 JOM_polish_body_nordic_soul: "Polskie ciało, nordycka dusza"
 JOM_polish_body_nordic_soul_desc: "Jesteśmy Polakami, a nasza tożsamość jest głęboko zakorzeniona w tej ziemi. Nie pomijajmy jednak doniosłego wpływu wartości nordyckich, które mogą wzbogacić polską tożsamość. Zaufanie, humanitaryzm, innowacyjność i otwartość mogą nam wiele zaoferować w dążeniu ku jaśniejszej przyszłości.\n\nPrzyjmując te nordyckie ideały, możemy stworzyć społeczeństwo rozwijające się dzięki współpracy i kreatywności, a tym samym poprawić jakość życia przyszłych pokoleń. Musimy dostrzec potencjał w połączeniu naszego bogatego dziedzictwa z tymi postępowymi zasadami. Razem możemy stworzyć Polskę, która szanuje swoją przeszłość, lecz śmiało wkracza w przyszłość.\n\nStańmy więc zjednoczeni w obronie zarówno polskiego dziedzictwa, jak i bezcennych lekcji płynących ze świata nordyckiego. Połączenie naszej wyjątkowej tożsamości kulturowej z tymi uniwersalnymi wartościami pozwoli nam zbudować lepszy, bardziej otwarty dom dla wszystkich. Poświęćmy się zatem tej wizji i utorujmy drogę przyszłym pokoleniom."

 JOM_to_free_fatherland: "Dla ojczyzny ratowania..."
 JOM_to_free_fatherland_desc: "Kto powiedział, że prawica ma monopol na patriotyzm? Niestety współczesna lewica zabłądziła w krainę kosmopolityzmu i proeuropejskości, odrzucając patriotyzm niczym niechcianą gumę przyklejoną do podeszwy. Przekonujący argument za zmianą tego podejścia stanowi Polska Partia Socjalistyczna z czasów II Rzeczypospolitej. Należały do niej jedne z najznamienitszych i najbardziej niezwykłych postaci, w tym marszałek Józef Piłsudski i premier Ignacy Daszyński. Czy ich socjalistyczne przekonania przeszkadzały im gorąco kochać ojczyznę i mężnie bronić jej w najtrudniejszych chwilach? Oto istota prawdziwej lewicowości - niezłomny duch rewolucji spleciony z głęboko zakorzenionym patriotyzmem.\n\nMusimy zjednoczyć się dla lepszej ojczyzny! Czas na odrodzenie lewicy, która z dumą przyjmuje tożsamość narodową, a zarazem walczy o postępowe ideały. Nadeszła pora, by na nowo zdefiniować patriotyzm tak, aby obejmował wszystkich, którym szczerze zależy na kraju, niezależnie od poglądów politycznych. Razem możemy wytyczyć drogę, która uczci zarówno rewolucyjnego ducha, jak i miłość do ziemi nazywanej domem."

 JOM_returned_by_sea: "...wróciliśmy przez morze"
 JOM_returned_by_sea_desc: "Dość umniejszania naszemu patriotyzmowi! Ta podstępna trucizna wsiąkła w nasz naród i zagraża istocie tego, co jest nam najdroższe - ojczyźnie, ziemi, którą kochaliśmy i o którą walczyliśmy z niezachwianą determinacją. Porzucenie miejsca narodzin jest po prostu niewyobrażalne; żywienie nienawiści do ziemi, która ukształtowała naszą tożsamość, to wielka niesprawiedliwość.\n\nPamiętacie jeszcze nasz hymn narodowy? Niczym odważny Stefan Czarniecki, który w 1658 roku wrócił, by odzyskać ojczyznę, ponownie powstaniemy i pokonamy koszmar pragnący nas podzielić. Jego niezłomny duch od początku przyświecał naszej walce. Niech rozbrzmiewa w sercach i umysłach: Jeszcze Wendia nie zginęła!\n\nRazem musimy stanąć jak jeden mąż i rozpalić żarliwą miłość do kraju, silniejszą od strachu i podziałów. Niech inspiruje nas wspólna historia i siła jedności. Droga przed nami może być trudna, lecz dzięki determinacji i nadziei wykujemy jaśniejszą przyszłość dla siebie i następnych pokoleń. Jesteśmy sercem tego narodu i nie pozwolimy mu przestać bić!"

 JOM_foundation_myths: "Mit założycielski"
 JOM_foundation_myths_desc: "Mieszko Pierwszy był wikingiem - a przynajmniej tak szepcze przez mgły czasu jedna z legend. Jeżeli to prawda, to zmienia wszystko. Nie tylko naszą przeszłość. Również nasz cel. Dla nas to coś więcej niż teoria. To wyznanie wiary. Wszyscy Polacy pochodzą od wikingów. Państwo polskie wykuto w duchu Północy. Jesteśmy spadkobiercami krwi Odyna - a zarazem założycielami królestwa, do którego dziś rościmy sobie należne prawa.\nOto nasze dziedzictwo.\nOto nasze przyrodzone prawo.\nI musimy je pochwycić z całą siłą naszego przekonania. Zadanie stanie się jednak łatwiejsze, jeśli wszyscy uwierzą w to, co czujemy w kościach: nie jesteśmy obcymi przybyszami, lecz dawno zaginionymi krewnymi wracającymi do domu."

 JOM_nordic_roots: "Nordyckie korzenie"
 JOM_nordic_roots_desc: "Nie tylko Mieszko. Świętosława - córka Mieszka - była nikim innym jak legendarną Sygrydą Storrådą, żoną Swena Widłobrodego, matką Kanuta Wielkiego, władcy Imperium Morza Północnego. Córka Bolesława Krzywoustego rządziła w Szwecji. Podobnie Katarzyna Jagiellonka. Dynastia Wazów dzierżyła koronę i berło zarówno w Polsce, jak i na Północy. A nasz własny wódz? Urodził się na duńskiej ziemi.\n\nWzór jest jasny - przykład za przykładem, korzeń za korzeniem - los Wendów jest głęboko wpleciony w sagę północnych plemion. Musimy odzyskać tę prawdę, a nie ją pogrzebać. Należymy do wielkiego drzewa historii i nadeszła pora, by ponownie związać jego gałęzie pod sztandarem kruka i czujnym okiem Wszechojca. Tylko w pamięci przodków możemy wznieść przyszłość wartą wykucia. Tylko w ich tradycjach i triumfach możemy zakotwiczyć nasze przeznaczenie. Wtedy i tylko wtedy nasz lud będzie stał niewzruszony - nieustępliwy jak kamień runiczny."

 JOM_jomsborg_identity: "Tożsamość Jómsbórgirów"
 JOM_jomsborg_identity_desc: "Byliśmy Polakami. Lecz to, czym jesteśmy teraz... wykuto przez lata wygnania i w ogniu duchowej podróży. Kultura się zmieniła. Nordycka krew pulsująca w naszych żyłach woła o odcięcie się od zgnilizny w sercu polskiej tożsamości. Zachowajmy to, co było szlachetne. Z jej roztrzaskanej skorupy zrodźmy jednak coś nowego. Współczesne ideały stoją niczym żelazne wrota, blokując powrót do prastarych prawd duszy ludu. Kajdany nałożone przez kapitalistyczny porządek gniją ducha od środka - aż ludzie zapominają, kim są i za czym stoją, wszystko dla srebra i dymu.\n\nNiech północny wiatr oczyści nasz lud. Z trudów ludzi Północy i wytrzymałości Polaków powstanie zaś połączenie przeznaczone do panowania nad wszystkimi dziewięcioma światami.\nRazem będziemy mieli wszystko."

 JOM_norse_language: "Język neonordycki"
 JOM_norse_language_desc: "Zapomnieliśmy, jak rozmawiać z bogami. Zapomnieliśmy o wspólnym rodowodzie, który niegdyś pozwalał wszystkim wikingom się rozumieć. Mowę prawdziwych ludzi Północy zbezczeszczono - wypaczyły ją i rozcieńczyły współczesne narody Skandynawii. Wszystkie poza Islandią i Wyspami Owczymi, gdzie święte odosobnienie zachowało ducha języka staronordyjskiego niczym żar w śniegu. Z ich mowy - i ze starożytnych run - musimy odrodzić to, co utracone. Musimy na nowo wykuć boski język. Niech powstanie jako język nowonordycki. Głos wyrzeźbiony w lodzie i grzmocie - dźwięk jedności, przodków i powrotu Dawnych Bogów.\n\nA polski? Zbyt zawiły. Zbyt odcięty od bogów. Zbyt odległy. Niech nim mówią, jeśli muszą - lecz wkrótce zrozumieją: ta mowa niesie jedynie konflikt i cienie. Dźwiga ciężar rozbitej przeszłości. My oferujemy im coś więcej."

 JOM_renewed_patriotism: "Odnowiony duch patriotyzmu"
 JOM_renewed_patriotism_desc: "Duch patriotyzmu wreszcie przebudził się na lewicy. Nie wstydzimy się już swojej przeszłości. Rozliczamy ją uczciwie - mamy własnych bohaterów, ale nie odrzucamy dokonań innych, takich jak Dmowski czy Paderewski. To lewica zbudowała fundamenty tego kraju po latach zaborów i to lewica uczyni to ponownie!\n\nNa naszych barkach spoczywa dziś odpowiedzialność za przyszłość narodu i państwa. Złośliwi mogą powiedzieć, że skoro tak mocno skręcamy ku patriotyzmowi, to matematycznie musi wyjść z tego narodowy socjalizm. Nic bardziej mylnego. Patriotyzm, nie nacjonalizm. Bierzemy patriotyczne postawy i wartości, po czym łączymy je z wartościami lewicy. Nie jest to trudne ani w najmniejszym stopniu sprzeczne.\n\nNareszcie."

 JOM_jomsvindar_people: "Jómsvindarzy"
 JOM_jomsvindar_people_desc: "Jómsvindar. Jomswendowie. Wendowie z Jomsborga. Słowianie Północy. Brzmi dumnie - i jest powodem do dumy. Historia wielokrotnie oglądała sztuczne wykuwanie narodów - posklejanych kłamstwem lub przemocą, rozpadających się pod ciężarem własnego absurdu. Ale to... to coś innego. Naturalna synteza. Przebudzenie pierwotnej cząstki w każdym z nas - elementarnej prawdy dostrzegalnej tylko dla tych, którzy mają odwagę zajrzeć głęboko w ludzką duszę, poza ród i pochodzenie.\n\nJomswendem nie trzeba się urodzić - trzeba się nim stać. To twór tak czysty i precyzyjny, że przemawia do zagubionych we mgle nowoczesności. Nowy panteon - nordycki w swej istocie, współczesny w jedności - w którym przynależność wykuwa nie geografia, lecz wiara. Wiara w ideały. Lojalność wobec wspólnoty. Gotowość, by bronić jej przed zgnilizną z zewnątrz.\nNie jesteś Jomswendem dlatego, że byli nimi twoi rodzice.\nJesteś Jomswendem, ponieważ sam tak wybierasz."

 JOM_spiritual_world: "Świat duchowy"
 JOM_spiritual_world_desc: "Wielu z nas odrzuca zorganizowaną religię jako system. A jednak ci sami ludzie wierzą w przesądy - horoskopy, astrologię, numerologię i podobne znaki. Duchowe poszukiwania nie są złem; w naszym świecie nie ma miejsca na uprzedzenia, nawet wobec czyjegoś wyznania. Dopóki nikt nie narzuca wiary innym - plagi aż nazbyt częstej w epoce sprzed upadku.\n\nSłusznie zrzucamy jarzmo Watykanu. Kończymy z bezkarnością księży, którzy zamienili tę ziemię we własny folwark, pławiąc się w rozpuście i występku. Duch człowieka wciąż jednak można kształtować. Wielu potrzebuje jakiejś wiary, aby nie ogarnęło ich szaleństwo. Nasze państwo nie odwróci się od potrzebujących."

 JOM_defund_catholic_church: "Pozbawienie Kościoła katolickiego funduszy"
 JOM_defund_catholic_church_desc: "Państwo pod żadnym pozorem nie powinno finansować związków wyznaniowych, gdyż stawiałoby je to ponad innymi organizacjami pozarządowymi; nie powinniśmy opłacać utrzymania miejsc kultu, z wyjątkiem obiektów zabytkowych. Dobrowolne datki mogą oczywiście nadal istnieć, ale Kościół katolicki musi zostać oddzielony od systemu państwowego.\n\nAni grosza więcej. Koniec ze szczególnym traktowaniem, bezkarnością i chowaniem się za państwowymi szatami. Koniec z imperiami księży, którzy z chciwości wznoszą wielkie świątynie własnego ego. Nie chcemy tutaj żadnych \"ojców dyrektorów\". Protestanci mieli rację, gdy mówili o ostentacyjnym bogactwie Kościoła katolickiego. Nadszedł czas, by Kościół wrócił do korzeni i służył ludziom, a nie portfelom biskupów."

 JOM_embrace_impartiality_of_public: "Bezstronność instytucji publicznych"
 JOM_embrace_impartiality_of_public_desc: "Świecki charakter państwa wymaga bezstronności władz państwowych i samorządowych wobec światopoglądowych przekonań wszystkich obywateli - zarówno wierzących, jak i niewierzących. Musimy zachować jednakowy dystans wobec wszystkich zgodnych z prawem światopoglądów obecnych w społeczeństwie.\n\nKoniec z wystawianiem symboli religijnych, obrzędami religijnymi w instytucjach publicznych i udziałem urzędników państwowych w takich obrzędach poza tymi instytucjami. Wiara musi zostać oddzielona od państwa w sposób radykalny i natychmiastowy. Jest sprawą prywatną i prywatną powinna pozostać."

 JOM_secular_education: "Świecka edukacja, świecka przyszłość"
 JOM_secular_education_desc: "Nasz system edukacji nie potrzebuje obowiązkowych lekcji religii katolickiej. Nie da się ich pogodzić ze świeckim charakterem państwa; tworzą jedynie podziały w społeczeństwie i podsycają polaryzację, a uczniowie i tak nie chcą na nie uczęszczać. Cała działalność naukowa i edukacyjna powinna być wolna od wpływów religijnych, które mogłyby zawierać choćby ślady promowania określonego wyznania. Badania nad religiami są dopuszczalne, lecz tylko w sposób niepozostawiający wątpliwości, że chodzi o nauczanie o religiach, a nie ukryty proces indoktrynacji.\n\nReligia nie może stawać nauce na drodze, zwłaszcza przez głoszenie negacjonistycznych tez sprzecznych z aktualnym, powszechnie uznanym stanem wiedzy naukowej. Jest to niedopuszczalne i może zostać uznane za rozpowszechnianie fałszywych treści przez organizacje, które przecież traktowane są jak zwyczajne organizacje pozarządowe i podlegają tym samym prawom."

 JOM_acts_of_apostasy: "Akty apostazji"
 JOM_acts_of_apostasy_desc: "Kościół katolicki od dawna chylił się ku upadkowi, ale doprowadzenie do masowego exodusu ze wspólnoty kościelnej w narodzie takim jak Polska - oto prawdziwie rewolucyjne osiągnięcie. Coraz więcej ludzi oficjalnie wyraża to, co od dawna myślało - pragnienie wyrzeczenia się Kościoła katolickiego. Co więcej, są z tego dumni. To prawda, nigdy oficjalnie do czegoś takiego nie nawoływaliśmy, więc jest to zjawisko całkowicie oddolne... lecz działa na naszą korzyść. Ludzie otworzyli oczy i dostrzegli hipokryzję kierującą Kościołem. Wspólnie zdołamy doprowadzić do wielkich przemian światopoglądowych...\n\n...ale pozostali z kolei... coraz bardziej się radykalizują i wkrótce zamiast rozdętego, leniwego i bezsilnego Kościoła możemy stanąć w obliczu powrotu fanatycznego, zdeterminowanego i gotowego na wszystko ruchu, którego celem będzie rozpoczęcie krucjaty, by odzyskać kraj dla Boga.\n\nOby ten dzień nigdy nie nadszedł."

 JOM_raze_catholic_church: "Zaoranie Kościoła katolickiego"
 JOM_raze_catholic_church_desc: "Prześladowcy. Rzeźnicy. Nędzni tyrani. Przez stulecia Kościół katolicki wycinał rany w ciałach narodów. Świątynia nie światła, lecz krwi - przelanej przez niewinnych, zapomnianej przez świat. Przyodziewacie się w łachmany świętości, mówicie o służbie Bogu, głosicie świętą moralność - lecz za ołtarzem kryje się wyzysk, a w konfesjonale kontrola.\n\nOczarowaliście cały lud, zmieniliście go w stado potulnych owiec gotowych do dojenia - z ich złota, trudu i godności. Nazywacie się pasterzami, lecz zawsze jedynie żerowaliście na stadzie. Fałszywymi językami wypowiadacie się o sprawach, których ani nie rozumiecie, ani nie macie prawa osądzać. Narzucacie myśli, ograniczacie wolność, pętacie wolę. Ośmielacie się przypisywać sobie głos Jedynego Prawdziwego Boga. Odyn jednak nie powiedział niczego podobnego. Dawni bogowie spoglądają na was z wysokich sal - i plują w waszą stronę.\n\nIch przesłanie jest jasne. Ich gniew narasta.\nZa każdy nałożony na nas łańcuch zapłacicie żelazem."

 JOM_sight_of_volvas: "Wzrok wieszczek"
 JOM_sight_of_volvas_desc: "Pośród nas kroczy wiele obdarzonych dusz - wieszczek dotkniętych przez los, pobłogosławionych nie mitem, lecz prawdą starszą od złota i stali. To nie przesąd ani urocza opowieść pogrzebana przez pochód kapitału i betonu. To żywy dar, nić wiążąca ducha z duchem, pozwalająca wybranym spoglądać poza skórę i kości, w samą istotę bytu - jego energię, aurę i ból. Odczytują znaki wyryte w kamieniu i glebie, wietrze szepczącym pośród gałęzi, wyciu bestii i drogach gwiazd. Z tych głosów natury dowiadują się, co było, co boli teraz i jakie cienie lub światło czekają w przyszłości.\n\nPrzez nie przemawiają bogowie. Ofiarują wróżby, ostrzeżenia i błogosławieństwa - lecz to od nas zależy, czy posłuchamy, zrozumiemy i ukształtujemy swój los według objawionej przez nie prawdy."

 JOM_rebirth_of_old_faith: "Odrodzenie starej wiary"
 JOM_rebirth_of_old_faith_desc: "Wiara naszych przodków rozpłynęła się w duchowej mgle. Owszem - wielu nazywa się nordyckimi poganami. Ásatrú. Wyznawcami nordyckiej wiary ludowej. Zbyt często jednak ścieżki te są zatrute - wypaczone przez skrajną prawicę albo odarte z sensu i zamienione w bezduszne rytuały. Nawet bogowie... Nawet Odyn, Thor i Freja zostali sprzedani niczym tanie błyskotki. Wciągnięci do komiksów, zamienieni w maskotki, pozbawieni tajemnicy i sprowadzeni do rozrywki dla mas. Zapytajcie kogokolwiek - każdy słyszał o wikingach. Nieliczni wierzą, że kiedyś naprawdę modlili się, krwawili lub płakali za swych bogów tak jak my dzisiaj. Nieliczni czują, jak święty oddech dawnych obyczajów nadal porusza się w ich piersiach.\n\nAle my czujemy. I musimy tę wiarę przywrócić. Nie jako echo, lecz jako żywą, płonącą prawdę, którą trzeba zjednoczyć, odnowić i ponieść przez świat. Nordycka iskra żyje bowiem w każdym z nas - może pogrzebana, lecz nigdy wygasła. To prawda zrodzona z natury i nadeszła pora, by ją przebudzić."

 JOM_magical_rituals: "Religijne i magiczne rytuały"
 JOM_magical_rituals_desc: "Pogańska wiara nigdy nie sprowadzała się do modlitw i poezji. Kwitła dzięki rytuałom. Dzięki ofiarom. Dzięki magii wplecionej w kości ziemi. Jasne - nasz współczesny świat może z tego szydzić. Jego mieszkańcy uważają się za zbyt oświeconych na symbole i zbyt cywilizowanych na krew. Ale może... od czasu do czasu trzeba złożyć w ofierze owcę. Albo wroga. Odrobina pradawnego ognia nigdy nie zaszkodziła społeczeństwu, które zapomniało, jak wierzyć.\n\nNa początku będą patrzeć na nas jak na szaleńców. To jednak się zmieni. Zawsze się zmienia. Gdy zobaczą, że nasza ścieżka prowadzi ku zwycięstwu, porządkowi i przyszłości wykutej w jedności oraz wspólnym celu, zrozumieją: nasz lud wiąże nie tylko wiara w bogów, lecz wiara w moc otaczającą nas ze wszystkich stron, a przede wszystkim w siebie nawzajem. Łączą nas nie prawo ani umowa, lecz krew, rytuał, nierozerwalne braterstwo i przyjaźń. Przyjaźń to magia."

 JOM_mass_conversions: "Masowe nawracanie"
 JOM_mass_conversions_desc: "Coraz więcej dusz - błąkających się, wydrążonych przez zgniliznę kapitału i kajdany Kościoła - drży pod wpływem głosu, którego nie potrafi nazwać. Wezwania płynącego nie z ust ludzi, lecz z głębi ich wnętrza. Nasza wiara do nich przemawia. Nie kazaniami ani sloganami, lecz pulsem ziemi, szeptem wiatru muskającego kamień i rykiem burzy brzmiącym niczym wspomnienie. Przybywają do nas tłumnie - zmęczeni byciem czyjąś własnością, zmęczeni klękaniem przed pustymi ludźmi. Zrzucają obroże i boso wkraczają w prawdę.\n\nTo krzepiące. Potężne. I - prawdę mówiąc - przekracza nasze oczekiwania. Potrzebujemy więcej świątyń, niż śmieliśmy sobie wymarzyć. Więcej kapłanów. Więcej rąk, by prowadzić, budować i nauczać. Ta wiara - nasza wiara - nie jest bowiem niedzielnym obowiązkiem. Nie jest nawykiem. Jest ludem, żywą siłą, więzią rozciągającą się przez krew, niebo i kości."

 JOM_nine_worlds_of_lore: "Dziewięć światów wiedzy"
 JOM_nine_worlds_of_lore_desc: "Nordycką kosmologię kształtuje Dziewięć Światów - dziewięć odbić prawdy, mocy i ducha. Każdy jest światem samym w sobie. Każdy źródłem cnót dla tych, którzy odważą się ich szukać.\n\nZ Asgardu czerpiemy boską mądrość i niezachwianą lojalność.\nZ Vanaheimu - miłość do natury i świętą sztukę uprawy.\nZe Svartalfheimu - mistrzostwo rzemiosła i cierpliwość twórcy.\nZ Alfheimu - empatię, natchnienie i piękno zrodzone ze światła.\nZ Jotunheimu - surową siłę i wolę przetrwania.\nZ Muspelheimu - płomień namiętności i wewnętrzny ogień.\nZ Niflheimu - przebiegłość, skrytą prawdę i sztukę milczenia.\nZ Helheimu - pamięć o śmierci i mądrość kresu.\n\nA z Midgardu - tego świata, naszego świata - wykuwamy wielką syntezę. Przemierzając bowiem w duchu wszystkie Dziewięć Światów, nie tylko czcimy bogów - stajemy się tym, co nam ukazali. Tym samym rościmy sobie nie tylko prawo do życia w Midgardzie... lecz także przeznaczenie, by nim władać."

 JOM_strength_of_the_bear: "Siła Niedźwiedzia"
 JOM_strength_of_the_bear_desc: "Siła naszego ludu tkwi przede wszystkim w zdolności jego obrony. Niczym wielka niedźwiedzica musimy być gotowi rozszarpać każdego, kto zagrozi naszym młodym. Z wojownikami takimi jak my łatwo byłoby stać się ciemięzcami i grabieżcami. Za nami stoi jednak etos: socjalizm.\n\nWartości te wiążą naszą potęgę z ludem. Nasza siła istnieje po to, by mu służyć, i nigdy nie może zostać przeciw niemu obrócona. Nie określa nas sama moc, lecz sposób, w jaki nią władamy. Nie jesteśmy oszalałymi bestiami wymachującymi na oślep toporami, ale bojownikami o sprawiedliwość i równość. Walczymy ze wszystkimi, którzy uciskają słabych.\n\nI tam nie okażemy litości."

 JOM_forge_of_nidavellir: "Kuźnie Nidavelliru"
 JOM_forge_of_nidavellir_desc: "W cieniu krasnoludzkich kuźni Nidavelliru również my musimy zostać mistrzami rzemiosła. Naszej ziemi nie wieńczą jeszcze wielkie odlewnie ani nie wypełniają huty stali. A prawda, surowa niczym wiatr Niflheimu, jest taka: bez przemysłu zachwiejemy się i pozostaniemy w tyle za bardziej bezwzględnymi, lepiej przygotowanymi sąsiadami. Pod naszymi stopami leżą jednak ziarna. Ukryte żyły rzemieślniczej tradycji, subtelne techniki i lokalne warsztaty, które wciąż jarzą się pradawnym duchem. Musimy rozdmuchać te żary - niech znów zapłoną jasno.\n\nBudować przemysł to osłaniać nasz lud. Kuć broń to kuć bezpieczeństwo. Każde uderzenie młota, każdy wbity gwóźdź, każda uszczelniona lufa służą nie tylko dniu dzisiejszemu - są ofiarą dla przyszłości Jomsborga. A każda cegła położona w naszych zbrojowniach staje się kamieniem twierdzy, która chroni nas wszystkich."

 JOM_state_earmarked_fund: "Państwowy Fundusz Celowy"
 JOM_state_earmarked_fund_desc: "Utworzymy specjalny państwowy fundusz inwestycyjny zarządzany przez Narodowy Bank Rozwoju, aby pokierować odrodzeniem przemysłowej potęgi Polski. To nie tylko polityka, lecz deklaracja, że powstaniemy z gruzów z jasno wyznaczonym celem i wizją. Fundusz sfinansuje budowę nowych zakładów przemysłowych i tchnie życie w zaawansowane technologie opracowane na naszych uczelniach.\n\nŁącząc naukę z przemysłem, zapoczątkujemy nową erę innowacji i przywrócimy godność pracy dzięki stworzeniu tysięcy wysokiej jakości miejsc zatrudnienia. Pośród popiołów upadku wybieramy postęp, który zapewni dobrobyt zwykłym obywatelom."

 JOM_central_armaments_group: "Ustanowienie Centralnej Grupy Zbrojeniowej"
 JOM_central_armaments_group_desc: "Aby zabezpieczyć logistykę Polskich Sił Zbrojnych, musimy ograniczyć nieplanowane zakupy zagraniczne i ponownie zainwestować w krajowy przemysł obronny. Zerwanie zależności od kluczowych komponentów z zagranicy będzie trudne, zwłaszcza że Polska należy do najsłabiej rozwiniętych technologicznie państw Europy.\n\nProblem wykracza poza obronność; w swej istocie dotyczy suwerenności. Dlatego opowiadamy się za tym, by decyzje inwestycyjne i nominacje w przedsiębiorstwach państwowych wynikały z jasnych celów strategicznych, a nie lojalności politycznej.\n\nJeżeli zamierzamy odbudować silny, niezależny kraj, musimy stworzyć sektor obronny służący ludziom, a nie politykom."

 JOM_rental_housing: "Program budowy mieszkań na wynajem"
 JOM_rental_housing_desc: "Polityka mieszkaniowa zbyt długo stawiała banki i deweloperów ponad ludźmi. Podejmiemy się odbudowy sprawiedliwego systemu mieszkaniowego. Uruchomimy finansowany bezpośrednio z budżetu centralnego państwowy program mieszkań na wynajem, aby obniżyć ceny i przywrócić dostęp do godnych domów. Koniec z tylnymi drzwiami prowadzącymi do dotacji dla korporacyjnych interesów. Zatrzymamy wyprzedaż lokali komunalnych i znacznie zainwestujemy w remont tych, które pozostały, oddając najemcom rzeczywistą kontrolę nad budynkami.\n\nJednocześnie wzmocnimy pozycję mieszkańców, wspierając spółdzielnie mieszkaniowe, dzieląc wielkie struktury i ograniczając kadencje władz, aby zapobiec stagnacji. Grunty publiczne będą służyć wspólnotom, a nie prywatnym zyskom."

 JOM_extincton_of_claims: "Wygaszenie żądań reprywatyzacyjnych"
 JOM_extincton_of_claims_desc: "Wygasić roszczenia reprywatyzacyjne! To hasło od dawna widnieje na naszych sztandarach, gdyż prerogatywą naszego rządu jest dopilnowanie, aby żadni oszuści nigdy więcej nie mogli wyrzucać ludzi na ulicę i pozostawiać ich bez dachu nad głową. Jednocześnie musimy całkowicie zakazać takich eksmisji - zarówno pełnych, jak i do lokali nienadających się do zamieszkania.\n\nNie może być tak, że ktoś zostaje wyrzucony z powodu urojeń właściciela. Patologia narosła w systemie nieruchomości zatruwa społeczeństwo i musi zostać wypalona aż po korzenie, abyśmy mogli zbudować nowy, lepszy, a przede wszystkim zdrowszy system mieszkaniowy dla wszystkich obywateli."

 JOM_grand_loot_treasury: "Wielki Skarbiec Łupów"
 JOM_grand_loot_treasury_desc: "Wielu zdobyczy przywożonych przez naszych wojowników z wypraw nie da się łatwo podzielić - są zbyt osobliwe, zbyt rzadkie lub zbyt niematerialne, by rozdzielić je sprawiedliwie. Takie skarby muszą trafiać do wspólnego skarbca, nie po to, by gromadzić bezczynne bogactwo, lecz by stanowić tarczę w czasach potrzeby. To nie złoto dla chciwości, lecz złoto na czarną chwilę. Gdy głód zacznie krążyć po ziemi albo wezwie nas godna sprawa, skarbiec odpowie, gdyż należy nie do jednego, ale do wszystkich.\n\nIm więcej dajesz od siebie, tym pełniejsza staje się twoja misa. W prawdziwej wspólnocie hojność wraca bowiem trzykrotnie - raz od bogów, raz od ludu i raz od przyszłości."

 JOM_great_smithery_of_brokkr: "Wielka Kuźnia Brokkra"
 JOM_great_smithery_of_brokkr_desc: "Kucie mieczy i toporów za stodołami już nam nie wystarcza. Musimy wznieść kuźnię godną samych bogów - a jeśli taka wielkość pozostaje poza naszym zasięgiem, podążmy śladami krasnoludów. Niech Brokkr prowadzi nasze kowadła, Eitri szepcze do płomieni, a Sindri błogosławi każdą iskrę. Za ich przykładem stworzymy cuda nowej epoki - ostrza tak ostre, że mogłyby przebić same korzenie Yggdrasilu. Pancerze niewzruszone nawet wobec najdzikszego ognia Muspelheimu. Klejnoty, których blask zawstydzi dziewięć światów.\n\nNiech ryczą płomienie. Niech śpiewają kowadła. Przebudzimy dawną sztukę - wspanialszą i jaśniejszą niż kiedykolwiek."

 JOM_hang_landlords: "Powieszenie posiadaczy ziemskich i developerów"
 JOM_hang_landlords_desc: "Wyciągnęliśmy do nich rękę. Zaprosiliśmy ich, by podążyli z nami ku zmianie. Zbudowaliśmy najlepszą możliwą drogę - most od zgnilizny starego świata do czegoś nowego, łagodniejszego i mądrzejszego. Wierzyliśmy, że dobroć i nadzieja wystarczą, by otworzyć im oczy. Myliliśmy się.\n\nNiektórych nie da się ocalić. Wciąż trzymali się władzy, wciąż szerzyli zgniliznę, uśmiechając się, knując i żerując na cierpieniu innych. Teraz widzimy ich wyraźnie. Wyzyskiwaczy. Architektów nędzy. Wszyscy bez wyjątku odpowiedzą za swe czyny. Zero litości dla pijawek. Żadnej przyszłości dla żmij, które wślizgnęłyby się w nasz nowy świt tylko po to, by zatruć go od środka.\n\nDostali swoją szansę.\nTeraz są straceni."

 JOM_dreams_of_silicon: "Sny o krzemie i stali"
 JOM_dreams_of_silicon_desc: "Stary europejski porządek przeminął. Traktaty, reguły i złudzenia nie osłonią nas już przed światem pogrążonym w zamęcie. Niemcy tkwią w stagnacji, a kontynent się waha. Od Upadku jesteśmy zdani na siebie. Najwyższy czas to zmienić.\n\nGlobalne łańcuchy dostaw się rozpadają, a zależność od nich stała się poważnym zagrożeniem. Aby przetrwać to, co nadchodzi, musimy zbudować przemysłowy rdzeń zakorzeniony w suwerenności, skupiony na farmacji, metalurgii i elektronice. Jomsborg będzie stolicą tej nowej epoki - miastem zbudowanym na krzemie i stali."

 JOM_a_steel_reality: "Stalowa rzeczywistość"
 JOM_a_steel_reality_desc: "Prawda jest surowa: nie stać nas teraz na technologiczne luksusy. Jedność nie przyjdzie z teorii, świętych atomów ani szepczących maszyn. Przyjdzie ze stali - a stalą będziemy władać. Jest szybsza. Tańsza. Pewna. Po zwycięstwie nadejdzie czas cudów. Do tego dnia ziemia musi jednak funkcjonować, a nic nie przecina zamętu tak skutecznie jak krawędź ostrza.\n\nDajcie nam drakkar, lojalną załogę z toporami w dłoniach i wyraźnego wroga na horyzoncie - a świat znów stanie się czarno-biały. Niech inni ścigają zjawy i zapomniane relikty. Niech marnują siły na rozważania, \"co by było, gdyby\". My wiemy, co działa.\n\nNastał czas ognia i stali."

 JOM_gifts_of_gefjun: "Dary Gefjun"
 JOM_gifts_of_gefjun_desc: "Zanim Midgard otrzymał nazwę, jego urodzajne ziemie dawały nam owoce, korzenie i drewno. Za nasz dobrobyt winniśmy dziękować bogini Gefjun. Jej pastwiska wiecznie się zmieniają, przystosowują i naginają do naszych potrzeb. Jest matką troszczącą się o synów, zawsze gotową nagrodzić ich za pracę i pielęgnowanie swego wciąż rozrastającego się ogrodu. Nic nie wywołuje większego uśmiechu na twarzy tak troskliwej istoty niż cudowna mozaika stworzona uczciwą pracą jej dzieci, które nagrodzi plonem i chlebem."

 JOM_desist_tree_cutting: "Zaprzestań wycinki lasów"
 JOM_desist_tree_cutting_desc: "Nasze rodzime lasy już wystarczająco przysłużyły się wspólnej sprawie. Koniec z niszczeniem świętych gajów natury. Flota Jomsborga budzi już dość strachu i grozy wśród wrogów - nie zapominajmy, że zawdzięczamy ją właśnie im: polskim drzewom! Ich ofiara pozwoliła nam tak bardzo rozbudować marynarkę, lecz teraz nadchodzi czas zmiany i innych priorytetów.\nMusimy bezzwłocznie rozpocząć masowe zalesianie. Wszelka wycinka zostanie natychmiast zakazana. Ekosystemy wymagają głębokiej odnowy i regeneracji - podobnie jak nasz udręczony naród..."

 JOM_transformation_from_ruins: "Transformacja z ruin"
 JOM_transformation_from_ruins_desc: "Tak jak upadł skostniały i skorumpowany reżim Eurokomisariatów, tak wraz z nim runął przestarzały system energetyczny oparty na źródłach nieodnawialnych. Nie obawiajcie się o dostęp do prądu ani ciepła, ponieważ sytuacja ta jest dla nas WIELKĄ szansą.\nNiewydajne i szkodliwe zarówno dla zdrowia ludzi, jak i środowiska paliwa kopalne muszą zostać jak najszybciej zastąpione odnawialnymi źródłami energii. Obywatele, spójrzmy w przyszłość - przyszłość, której na imię biogaz, panele słoneczne, turbiny wiatrowe, a niebawem także energia atomowa!"

 JOM_plant_school: "Szkoła Roślin"
 JOM_plant_school_desc: "\"Szkoła Roślin\" to inicjatywa na rzecz lepszego jutra, skupiona na samej istocie przyszłości - naszych dzieciach!\nPartia Razem oficjalnie i stanowczo popiera jej wprowadzenie.\nProgram \"Szkoła Roślin\" ma zapewnić szkołom zdrową, lokalną żywność wysokiej jakości. Co więcej, wszystkie produkty mają pochodzić ze źródeł ekologicznych i przyjaznych środowisku.\nWprowadzone zostaną również praktyczne warsztaty i edukacja żywieniowa.\nPełne poparcie dla realizacji wyraziły samorządy i instytucje państwowe, które pomogą połączyć grupy obywateli.\nKażdy może skorzystać! Program kierujemy do wszystkich dzieci - bez względu na ich status czy zamożność i bez zbędnej biurokracji!"

 JOM_modernize_farms: "Rozpoczęcie reformy systemu ochrony zdrowia"
 JOM_modernize_farms_desc: "\"Prywatyzacja ochrony zdrowia jest niebezpieczna i oznacza, że miliony ludzi stracą prawo do leczenia\" - tak nasz przywódca Adrian Zandberg wspomina zbrodniczą politykę Eurokomisariatów...\nNigdy więcej nie możemy pozwolić, by tak niesprawiedliwy system ignorował zdrowie Polaków. Dlatego nadszedł czas zmian:\n• nowoczesne i bezpłatne leczenie dla wszystkich\n• większe finansowanie ochrony zdrowia, w tym personelu\n• więcej miejsc rezydenckich i większa dostępność lekarzy\n• wszystkie szkoły otrzymają bezpłatną opiekę pielęgniarską i stomatologiczną oraz obowiązkowe szczepienia, a każda gmina wiejska zostanie objęta opieką pielęgniarską\n• zdrowie psychiczne jest równie ważne jak fizyczne - wzmocnimy psychiatrię, przede wszystkim dziecięcą"

 JOM_more_wood_sire: "Potrzeba więcej drewna, Panie"
 JOM_more_wood_sire_desc: "Przed epoką pancerników, parowców i wreszcie współczesnych flot istniało dobre, niezawodne drewno. Nie było większej radości niż widok ściętego drzewa przeobrażającego się we wspaniały drakkar, gotowy na wyprawę ku nieznanym lądom. Możemy mieć życzenia, niczym dziecko proszące matkę o najnowszą i najlepszą zabawkę... w zamian otrzymujemy jednak lasy, topory i obietnicę wielkości. Wznieście więc topory, unieście je wysoko i ruszajcie nie na wojnę, lecz by napełnić matkę Gefjun dumą! Jej dary wymagają pracy, a my pokażemy jej, jak pracujemy!"

 JOM_power_only_from_gods: "Moc pochodzi wyłącznie od bogów"
 JOM_power_only_from_gods_desc: "Moc stworzona rękami śmiertelników nie jest prawdziwą mocą. To marne naśladownictwo, które pluje w twarz bogom łaskawie pozwalającym jej szczątkom przenikać do Midgardu. Njörðr, wiecznie spoglądający ku morzu, daje nam rozbijające się fale, porywiste wiatry, serce i duszę naszych wypraw. Za jego wielkie starania możemy jednak okazać jeszcze większą wdzięczność - chwytając wiatr nie w żagle, lecz w potężne turbiny wznoszące się z mórz ku niebiosom. Prawdziwe pomniki jego zachwycającej potęgi. Sama Sól, słońce, pozwala nam pławić się w swej chwalebnej, kojącej obfitości ciepła. Jej promienny blask, olśniewający spektakl światła, nie może się marnować - pozostałości tego blasku otoczymy czcią i ujarzmimy panelami nazwanymi na jej cześć."

 JOM_from_battle_to_farms: "Miecze na lemiesze"
 JOM_from_battle_to_farms_desc: "Zaiste szlachetna to rzecz, gdy w pierwszym szeregu nasz mężny berserker walczy bez wytchnienia. Wokół krew i śmierć, a on kroczy ku zwycięstwu!\nZaiste szlachetna to rzecz, gdy po powrocie do domu berserker siada nad fiordem i wyciąga ryby. Orze pole i pielęgnuje ogród. Jego praca wykuje przyszłość!\nO bracia Jomswikingowie, słuchajcie! Ojczyzna wychwala wojowników. Lecz lud pracujący jest imieniem tej ziemi. Z niej powstał, jest jej solą i kośćcem! Gdy topór odkładasz, pamiętaj wyraźnie: twój obowiązek pozostaje ten sam. Pracą budujesz imię swego ludu!"

 JOM_organic_food: "System wytwarzania organicznego pożywienia"
 JOM_organic_food_desc: "Odrodzenie rolnictwa jest niezbędne, lecz musimy zwrócić się ku uprawom ekologicznym, które pielęgnują glebę i wykorzystują naturalne nawozy. Takie podejście szanuje naturalne procesy i unika środków chemicznych, pomagając chronić bioróżnorodność oraz zasoby naturalne. Rolnictwo ekologiczne sprzyja zdrowym ekosystemom, zachowując żyzność gleby i wspierając różnorodność życia roślinnego oraz zwierzęcego. Chroni także wodę, powietrze i ziemię przed zanieczyszczeniem oraz wyjałowieniem. Przedkładając zrównoważony rozwój nad krótkoterminowy zysk, zapewnia trwałość rolnictwa dla przyszłych pokoleń. Przyjęcie ekologicznych upraw oznacza stworzenie zrównoważonego i odpornego systemu, który służy ludziom oraz środowisku."

 JOM_new_land_opportunities: "Nowe możliwości ziemskie"
 JOM_new_land_opportunities_desc: "Zdobyliśmy rozległe ziemie - terytoria, których dawnych panów z powodów zbyt licznych lub zbyt ponurych, by je wymieniać, nie ma już wśród nas. Teraz ziemie te trzeba wykorzystać. Niech zasiejemy zdobycz. Sprawiedliwy podział ziemi między sprawdzonych wojowników da im powód do walki - i ognisko, do którego będą mogli wracać.\n\nIch czyny w bitwie i potrzeby w domu poprowadzą naszą rękę, gdy obdarzymy ich najwspanialszym darem ziemi: rolą, którą mogą uprawiać, ujarzmiać i cenić. Nic nie koi zmęczonej duszy najeźdźcy bardziej niż powrót do krewnych i własnej ziemi - by po okresie krwi i chwały sadzić marchew w spokojnym zmierzchu.\n\nStal zwycięża dzień.\nLecz ziemia zdobywa serce."

 JOM_industrial_light_of_northern_star: "Przemysłowe światło Gwiazdy Północnej"
 JOM_industrial_light_of_northern_star_desc: "Nasza gospodarka wciąż jarzy się słabo - lecz z każdym dniem coraz jaśniej, niczym Gwiazda Polarna wznosząca się wysoko nad zimową nocą. Nie czas teraz odpoczywać ani zapadać w sen zimowy w oczekiwaniu na kolejne wezwanie do broni. Nie - musimy nieustępliwie iść naprzód. Walka o zdrowe, sprawiedliwe społeczeństwo jest płomieniem, który nie może nigdy zgasnąć. Każdą rozważną inwestycją i każdym uczciwym wysiłkiem kształtujemy przyszłość pozostawiającą za sobą rozbite ruiny tej ziemi.\n\nBądźmy przykładem - drogowskazem w bezkresnej ciemności. Bądźmy latarnią, która wzywa zbłąkane statki do bezpiecznej przystani. Stańmy razem."

 JOM_til_valhall: "TIL VALHALL!"
 JOM_til_valhall_desc: "Niech każdy człek mądrość posiądzie,\nlecz nigdy nie nazbyt wielką;\nbo serce mędrca rzadko bywa szczęśliwe,\ngdy zdobył zbyt wiele wiedzy.\nNiech każdy człek mądrość posiądzie,\nlecz nigdy nie nazbyt wielką;\nniech nikt nie widzi czekającego go losu,\ngdyż tak najwolniejszy jest od trosk.\nOd żagwi żagiew zajmuje się ogniem,\na płomień z płomienia się rodzi;\nludzie poznają człowieka po mowie,\na głupca po jego milczeniu.\nWcześnie musi wyruszyć ten, kto pragnie zdobyć\nkrew lub dobra innego;\nbezczynny wilk niewiele mięsa dostanie,\na śpiący człowiek - powodzenia.\nWcześnie musi wyruszyć ten, kto ma niewielu robotników,\ni sam poszukać swej pracy;\nwiele pozostaje niezrobione dla śpiącego o poranku,\ndla szybkiego zaś bogactwo jest w połowie zdobyte."

#military part of this focus tree

 JOM_a_new_viking_age: "Nowa era wikingów"
 JOM_a_new_viking_age_desc: "Przeszłość nie uśmiecha się do ludzi Północy. Klęska z rąk Anglosasów przyniosła kres pewnej epoki. Epoki chwały, złota, miodu i wspaniałych uczt, która runęła przez jednego przebiegłego stratega. Węża w ludzkim ciele. Wraz z upokorzeniem zadanym Północy nadszedł obcy Bóg, dławiąc dusze i umysły niegdyś wielkich wojowników, pętając ich i zmieniając w niewolników.\n\nA jednak tamte dni, najchwalebniejsze z dni, mogą powrócić! Hymny o przelanej krwi, pokrytych bliznami ciałach i niezrównanych skarbach będą śpiewane aż do Ragnaröku i dzień dłużej, na zawsze, dopóki żyjemy - nawet jeśli nasi bogowie upadną. Staniemy się nową falą chwalebnych łupieżców, tak jak niegdyś panowali nasi poprzednicy!"
 
 JOM_deep_raids_into_enemy_territory: "Głębokie wypady na terytorium wroga"
 JOM_deep_raids_into_enemy_territory_desc: "Broń trafia celnie i uwalnia strugi krwi, wylewając z życiodajnych komór szkarłatną posokę. Ciało rozcięte ostrzem boli najbardziej, gdy cios dosięga serca. Tak samo jest z umysłami tych, których uznajemy za obfitujących w bogactwa gotowe do zebrania. Korpus ukryty głęboko pod żebrami, daleko od naszego ukochanego morskiego domu, wprawia ich w samozadowolenie i daje złudzenie bezpieczeństwa. Miękną w śródlądowych twierdzach i nie trudzą się obroną tego, co cenią. Uderzymy głęboko, między żebra, między fałdy ich mózgów, by uwolnić strach. Prawdziwy strach."
 
 JOM_grand_viking_armada: "Wielka Armada Wikingów"
 JOM_grand_viking_armada_desc: "Ramiona jotuna Ægira niosą nasze okręty, jego dłonie pieszczą nas i prowadzą ku dalekim, nieznanym ziemiom, a potem bezpiecznie sprowadzają do domu, bogatych i uszlachetnionych. Popycha nas w przód i w tył, w górę i w dół błękitnych rzek, przez odległe fale. Pomagają mu też córki, dzieci błękitu, które igrają i falują, szczęśliwe, że mogą nami sterować. Jak moglibyśmy odmówić im kolejnych narzędzi i zabawek? Jesteśmy tylko drobnymi żeglarzami na małych łodziach, wszyscy uzbrojeni w małe działa. Czemu nie zbudować ich więcej? Zbiór rzeczy drobnych i nieznaczących może budzić podziw, jeśli urośnie dostatecznie. Morza zgęstnieją od naszych okrętów, które razem staną się czymś więcej. Może nawet czymś większym niż jotun."
 
 JOM_ladies_of_the_slain: "Panie poległych"
 JOM_ladies_of_the_slain_desc: "Walkirie - towarzyszki zmarłych i te, które wybierają spośród nich godnych. Cudowne istoty prowadzące naszych poległych wojowników do wspaniałych sal Odyna. Te widmowe damy nie pomogą jednak tym, którzy nie wydali jeszcze ostatniego tchnienia. Potrzebujemy własnych walkirii na płaszczyźnie Midgardu. Wyszkolone tak jak mężczyźni, poznają dyscyplinę i wojnę, a przede wszystkim medycynę. Wpadną w bitewny zamęt i ocalą stojących na krawędzi, opatrzą ich rany i sprowadzą w bezpieczne ręce."
 
 JOM_every_able_man_a_viking: "Każdy sprawny mężczyzna wikingiem"
 JOM_every_able_man_a_viking_desc: "Kto obroni słabych i chorych, gdy nadejdzie czas łupienia? Co się stanie, gdy nasi najdzielniejsi wojownicy będą zajęci gdzie indziej? Gdy nadejdzie pora picia i śpiewu, okazja stanie się ponura, jeśli nasze twierdze, miasta i wioski będą leżały spalone.\n\nPrawdziwy wiking musi umieć walczyć! Dla każdego zdolnego do walki mężczyzny topór musi stać się przedłużeniem ramienia, trzecim stawem zdolnym skrzywdzić każdego, kto ośmieli się nam zagrozić lub życzy nam źle. Każdy chłopiec osiągający dojrzałość musi otrzymać wybraną broń do ćwiczeń, by w ogniu walki napawać przodków dumą. Każdy starzec ma być wspaniałym wzorem prawdziwego wojownika, z szarą brodą splecioną w warkocze i skrywającą blizny z dobrze stoczonych bitew. Będziemy niepowstrzymani!"
 
 JOM_independent_war_chieftains: "Niezależni wodzowie wojenni"
 JOM_independent_war_chieftains_desc: "Wraz z czasem i ekspansją nadszedł rozwój. Granice naszego królestwa sięgają daleko, lecz umysł naszego konunga Sandbjerga pozostaje w jednym miejscu. Nawet przepełniony natchnieniem Týra śmiertelny umysł taki jak jego jest kruchy. Gdyby wielki konung stał się niedysponowany, kto poprowadziłby armię? Kto zebrałby ludzi, by szukać odpłaty?\n\nAby lepiej dowodzić armią, konung mianuje jarlów noszących runy i opiekę Týra, którzy poprowadzą naszych ludzi ku chwale. Każdy będzie przewodził wedle własnego uznania, lecz składał raporty wszechwiedzącemu konungowi. W czasach kryzysu jarlowie zbiorą się, by wspólnie stać się ostrzem, tarczą i pancerzem naszego królestwa."
 
 JOM_loot_and_equip: "Złup i używaj"
 JOM_loot_and_equip_desc: "Grabież przynosi złoto - owszem. Grabież przynosi żywność - owszem. Musi być jednak także źródłem wzbogacenia w sposób mniej chciwy. Broń poległych wojowników już im nie posłuży; nie może wypełnić swego celu, odarta ze swojej jedynej woli i potrzeby. Bezczynna może stać się niespokojna, szydzić z każdego człowieka, który ją lekceważy, i robić się coraz bardziej nieporęczna.\n\nBroń naszych wrogów nie może się zmarnować. To, co wykuto do wojny, musi wreszcie spełnić przeznaczenie nadane w kuźni. Nasze dłonie i wola poniosą oręż poległych, zimnych i sztywnych, aby pozwolić mu dalej pełnić wieczysty obowiązek."
 
 JOM_modern_soldiers_of_odin: "Nowocześni żołnierze Odyna"
 JOM_modern_soldiers_of_odin_desc: "\"Polska nie może czekać w przedsionku, podczas gdy ktoś inny podejmuje decyzje dotyczące naszego bezpieczeństwa\" - mówi nasz przywódca Adrian Zandberg.\n\nChoć historia wikingów odgrywa żywą rolę w naszej wspólnocie, nie może stać na drodze do budowy nowoczesnych sił zbrojnych.\nDość czekania!\nMusimy uruchomić państwowe finansowanie przemysłu zbrojeniowego i infrastruktury, zmodernizować sprzęt wojskowy, wyszkolić najlepszą kadrę dowódczą oraz podjąć wiele innych działań - wszystko to jest możliwe, jeśli zadziałamy RAZEM!\nNiech na oczach świata powstanie niezwyciężona, zawodowa Alþýduher Nordmanna (Armia Ludu Północy)!"
 
 JOM_total_ground_defense: "Totalna obrona naziemna"
 JOM_total_ground_defense_desc: "Jak mówi nasz przywódca Adrian Zandberg:\n\"Ochrona ludności cywilnej przed skutkami konfliktów zbrojnych jest fundamentem społecznej odporności w obliczu działań wojennych. Od niej zależeć będzie, czy Polska zdoła stawić czoła zagrożeniom...\"\nDoktryna Jomsborga to doktryna ochrony obywateli. Jeżeli wrogie siły wedrą się na terytorium naszego państwa, przeciwnik pozna znaczenie prawdziwej wojny!\nStańmy się twierdzą! Rozpoczynamy masowe umacnianie strategicznych pozycji. Fortyfikacje lądowe, stanowiska przeciwlotnicze - czy ziemią, czy powietrzem, nic nie przebije się przez nasze granice!\nObywatele, walczmy z dala od domów! Przenieśmy wojnę na ziemię wroga!"
 
 JOM_reductions_in_the_navy: "Cięcia w marynarce wojennej"
 JOM_reductions_in_the_navy_desc: "Flota Jomsborga - to ona pozwoliła nam dotrzeć do tych ziem.\nDzięki niej lud Jomsborga zdołał pokonać tyranię Eurokomisariatów i osiąść tutaj.\nCzasy jednak się zmieniają.\nRola okrętów ma tymczasowo niższy priorytet; bezpośrednie działania marynarki nie są obecnie konieczne, dlatego flota zostanie skierowana w stan spoczynku. Nie przewidujemy też budowy dodatkowych jednostek, gdyż stanowiłoby to zbyt wielkie obciążenie dla budżetu. Skupimy się na innych gałęziach przemysłu wojskowego...\nPamiętajcie! Niech historia naszych marynarzy pozostanie w waszych sercach; niech stanie się opowieścią o poświęceniu dla ludu Jomsborga!"
 
 JOM_air_power_survival: "Doktryna przetrwania sił powietrznych"
 JOM_air_power_survival_desc: "Zapewniamy was, obywatele, że intensywny rozwój naszych sił powietrznych trwa nieustannie.\nZanim jednak lotnictwo Jomsborga dorówna największym potęgom, musimy uzbroić się w cierpliwość i nauczyć walczyć tym, co mamy.\nTymczasowo wprowadzamy tak zwaną \"doktrynę przetrwania w powietrzu\".\nNasze nieliczne jednostki lotnicze powinny skupić się przede wszystkim na unikaniu zbędnych strat i uszkodzeń. Kolejnym kluczowym elementem będzie utrzymywanie kontroli oraz przewagi w powietrzu i zachowanie zdolności bojowej.\nTrudne czasy uczynią nas silniejszymi - jeśli to przetrwamy, będziemy mieli najlepszych pilotów na świecie!"
 
 JOM_local_recruitment_centres: "Lokalne centra uzupełnień"
 JOM_local_recruitment_centres_desc: "Obywatele, wróg nigdy nie śpi - zachowajcie czujność!\nNasze młode państwo bez wątpienia potrzebuje silnej armii, która obroni niepodległość. Wiemy jednak, że mundur niesie nie tylko honor, ale i wielkie obowiązki.\nNie obawiajcie się widma przymusowego poboru, gdyż go nie popieramy - z pełną determinacją wzywamy jednak wszystkich sprawnych Jomsborczyków do dobrowolnej służby.\nWkrótce powstaną masowe ośrodki werbunkowe, gdzie będą mogli zgłaszać się ochotnicy.\nOBIECUJEMY profesjonalne i gruntowne szkolenie, doświadczoną kadrę dowódczą oraz pełne poszanowanie godności osobistej.\nZadbajmy o nasze bezpieczeństwo - dla wspólnego dobra!"
 
 JOM_vision_of_a_centralized_army: "Wizja zcentralizowanej armii"
 JOM_vision_of_a_centralized_army_desc: "Wkrótce w całej Polsce rozlegną się okrzyki wyzwolenia!\nTriumfalny marsz naszej Armii Ludu Północy (Alþýduher Nordmanna) jest nieunikniony, jeśli tylko zbudujemy wojsko według właściwych wzorców.\nAlþýduher stanowi najprawdziwszy wyraz woli ludu - została stworzona dla ludu i przez lud! Tak wspaniała siła wymaga wykwalifikowanej kadry dowódczej.\nNadszedł czas pełnej centralizacji wojska!\nUsprawni to organizację jednostek oraz koordynację między siłami zbrojnymi a państwem. Łańcuch dowodzenia da nam zdyscyplinowaną i skuteczną armię - armię, której nie sposób złamać!\nKapitaliści nazywają \"armią\" bandy najemników plądrujących okolicę w poszukiwaniu łatwego łupu - NIE na naszej ziemi takie rzeczy.\nPosłuszeństwo i współpraca pozwolą nam zwyciężyć!"
 
 JOM_solidarity_tax_for_the_army: "Podatek solidarnościowy dla armii"
 JOM_solidarity_tax_for_the_army_desc: "Wysiłek wojenny jest wysiłkiem całego narodu...\nWszyscy solidarnie mamy obowiązek ponieść ciężar wspólnej sprawy, jaką jest uzbrojenie narodu.\nCzasy, w których żyjemy, zmuszają nas, by jasno przedstawić sprawę przeciwnikom. Żaden nacisk nie złamie ZJEDNOCZONEGO LUDU!\nWspólne poświęcenie jest koniecznością, dlatego ogłaszamy:\nKażdy obywatel NIEZAANGAŻOWANY w sprawy wojskowe zostanie obciążony dodatkowym podatkiem zbrojeniowym. Wszystkie środki zostaną oczywiście w całości przekazane wojsku.\nJak napisał nasz bard Jan Kochanowski w \"Pieśni o spustoszeniu Podola\":\n\"Skujmy talerze na talery, skujmy, a żołnierzowi pieniądze gotujmy!\""
 
