##Events##
 jomsborg.1.t: "Ku brzegom"
 jomsborg.1.desc: "Na horyzoncie zaczynają rysować się kontury lądu. Po długich godzinach na morzu widok stałego gruntu przynosi załodze falę ulgi i podniecenia. Podróż była długa i wyczerpująca, ale teraz na leżących przed nami brzegach czekają obietnice nowych możliwości i przygód. To jednak musi poczekać. Najpierw trzeba zabezpieczyć miejsce lądowania i zniszczyć niemieckiego ciemięzcę. Gdy nasze długie okręty przecinają fale, załoga przygotowuje się na czekające wyzwania, gotowa odcisnąć swoje piętno na tej nowej ziemi. Determinacja wojowników pozostaje niezachwiana, a ich duch jest silny, gdy zbliżają się do naszego domu. Z błogosławieństwem Odyna już nigdy nie oddamy tej ziemi."
 jomsborg.1.a: "OOODDDYYYYNNNNNNIEEEEE!"

 jomsborg.2.t: "Jesteśmy w domu"
 jomsborg.2.desc: "Wymagało to wielu ofiar, lecz po latach walki wreszcie odzyskaliśmy niewielki skrawek ziem naszych przodków. Kraina niegdyś utracona na rzecz obcych ciemięzców znajduje się teraz pod naszą kontrolą. Droga do tej chwili była wyczerpująca, pełna bitew i trudów, ale nasza determinacja nigdy się nie zachwiała. Przybyliśmy z Fólkvangru i mamy nadzieję, że już nigdy nie będziemy musieli go opuszczać. Teraz rozpoczyna się odbudowa. Musimy odtworzyć domy, uprawiać ziemię i stworzyć kwitnącą wspólnotę wraz ze sprawną administracją. Nasz lud wiele wycierpiał, podobnie jak mieszkańcy, którzy pozostali pod niemieckimi rządami. Czas zagoić rany przeszłości. W Jomsborgu czcimy bogów i poległych wojowników. Nie zawiedziemy ich, gdyż przed nami stoi jeszcze wiele niebezpieczeństw, a walka nie dobiegła końca."
 jomsborg.2.a: "Niemcy! Czekam tu na was!"

 jomsborg.3.t: "[GetNewspaper]Inwazja wikingów?!"
 jomsborg.3.desc: "Co kilka dni docierają do nas nowe wieści o upadku EKW. Dzisiejsze wiadomości są jednak... dość niecodzienne. Pomorskie media regionalne podobno informują o... najeździe wikingów na Kamień Pomorski.\n\nLudźmi Północy dowodził Adrian Zandberg (nazywany ponoć przez swoich ludzi Halfdanem Sandbjergiem), który najwyraźniej wreszcie powrócił do kraju po exodusie na Bornholm, do jakiego zmusił go konflikt z rządem Eurokomisariatu. Gdy publiczne potępienie wewnętrznych patologii i podejrzanych interesów EK doprowadziło ostatecznie do aresztowania Zandberga oraz policyjnego nalotu na jego dom, wygłosił on przemówienie, w którym stwierdził, że nawet UE nie zdoła uratować nieudanego projektu zwanego Polską, a zbudowanie godnego szacunku państwa wymaga zastąpienia całej polskiej tożsamości szlachetniejszą, nordycką."
 jomsborg.3.a: "Til almannaheilla."
 
 jomsborg.4.t: "Walkirie wzywają"
 jomsborg.4.desc: "Potężny, poobijany mężczyzna stoi na brzegu Bornholmu. Wzrok kieruje ku południu, ku ziemiom, które przysporzyły mu tyle bólu. Nie zdołało go to jednak powstrzymać. Niczym prawdziwy wojownik wyszedł z cierpienia silniejszy. Pobicie przez strażników zahartowało ciało. Walki z innymi więźniami pomogły udoskonalić technikę. Przez zakrwawione oczy widział wyraźniej niż kiedykolwiek. Wreszcie ujrzał, jak z kapitału opada maska człowieczeństwa, odsłaniając oblicze Fáfnira. Zrozumiał, że system trzeba spalić do fundamentów i wznieść od nowa.\nŻądza zemsty nie przesłoniła mu jednak rzeczywistości. Eurolǫg wciąż kontrolował znaczną część jego drugiej ojczyzny. Był pewien, że kruchy porządek niebawem się rozpadnie, ale... minęły już dwa lata, a niemiecki ład wydaje się niewzruszony. Daje to czas jego Wszecharmii na rozrost i szkolenie, lecz jej członkowie także stają się niespokojni. Niespokojni i zbyt liczni, by dało się ich wyżywić bez terroryzowania miejscowej ludności. Grucela, początkowo nieprzekonany do inwazji, teraz nalega na pośpiech i sugeruje uderzenie na ujście Wisły albo przeprawę przez Cieśninę Piławską. Nie rozumie, że byłoby to zbyt niebezpieczne. Poza tym celem musi być Wolin. Na szczęście jego dowódca wojenny, Adam Kościelak, całkowicie się z nim zgadza. Biejat i Zawisza wolą milczeć, choć na ostatnim zebraniu rady ta druga złośliwie zauważyła, że niedługo będą musieli podbić Bornholm i ogłosić niepodległość.\nPrzynajmniej bezpośrednie problemy przysłaniały dalekosiężne wyzwania dręczące jego umysł. Stworzenie Wielkiej Armii Północy i przemiana Polski w idealne społeczeństwo były na szczęście zmartwieniami jutra. Nawet to nie stanowiło jednak największej troski. Stało się jasne, że pomimo przywiązania do wieców i współpracy równych przyszłość ruchu spoczywa wyłącznie na nim - Karminowym Jarlu Fólkvangru. Ludzie postrzegali go i podziwiali jak monarchę. On jednak aż nazbyt dobrze wiedział, co się dzieje, gdy tak wiele zależy od potężnej jednostki. Choć był pewien własnej odporności na korupcję, zaczął wierzyć, że umysł wymyka mu się spod kontroli. Znajdował starożytne runy zapisane w ziemi i swoim dzienniku, mimo że nigdy się ich nie uczył. Czasem, stojąc na brzegu, widział na horyzoncie morskie potwory, a gdy spoglądał w wodę, odbicie było rozmazane, choć tafla pozostawała nieruchoma."
 jomsborg.4.a: "Wzywają Cię do domu"
 
 jomsborg.5.t: "W sali Karminowego Jarla"
 jomsborg.5.desc: "Daleko od całego chaosu europejskiego lądu, pośród zimnych i wzburzonych wód Bałtyku, leżała duńska wyspa Bornholm. Spokojna i cicha wysepka, gdzie życie płynie powoli, z dala od ruchliwego centrum Danii. W swej błogości - a może niewiedzy i ślepym zaufaniu - mieszkańcy Bornholmu udzielili schronienia grupie uchodźców z Polski. Od europejskiej interwencji minęło już dużo czasu, a liczne łodzie przybiły do plaż w pobliżu Svaneke. Początkowo zaniepokojeni miejscowi uspokoili się, gdy przywódca Polaków, Adrian Zandberg, powitał ich w ojczystym języku duńskim, mimo że jego przemowa była prosta i mocno kaleczona.\n\nAby nie sprawiać kłopotów, uchodźcy założyli tuż za miastem niewielką komunę, wznosząc drewniane chaty ze wszelkich zdobytych odpadków. Z upływem miesięcy osada rosła, wkrótce otrzymując nazwę Fólkvangr na cześć mitycznej przystani poległych wojowników, którą włada bogini Freja. Cała wioska skupiła się wokół długiego domu zbudowanego z porzuconych kontenerów transportowych - Sessrúmniru, gdzie Karminowy Jarl odbywał spotkania, a po zmroku planował wielki powrót. Wraz ze wzrostem ludności pojawiło się zapotrzebowanie na kowala, rybaków, szkutników i kupców znających przynajmniej trzy słowa po duńsku. Choć niewielka i odosobniona, wioska Fólkvangr nosiła niezłomnego ducha determinacji. Każdego wieczoru, gdy zachodziło słońce, mieszkańcy zbierali się przy ognisku, by śpiewać opowieści o dawnych ziemiach - tych, które im odebrano, i tych, które odzyskają.\n\nZ czasem duch wikingów zaczął przenikać całą wspólnotę, a wszystkich przyciągał mądry, choć niekiedy niestabilny przywódca. Wraz z rosnącym napięciem psychicznym, niewątpliwie wywołanym latami nieskutecznych prób pokojowego przejęcia władzy i poprawy stanu Polski, wkrótce pojawiły się pęknięcia. W szczelinach jego umysłu zakorzeniła się nowa tożsamość Halfdana Sandbjerga - surowego naczelnego wodza wikingów, który nie ugnie kolana przed nikim i którego potrzebowali rozbici, lecz wierni wojownicy, by zjednoczyć się i wrócić do chwalebnej wojny z zachodnimi najeźdźcami.\n\nGdy jego osobowość się odmieniła, obok długiego domu wzniesiono Wielką Świątynię Odyna, gdzie mianowani przez niego goði odprawiali obrzędy w imię Wszechojca. Nieustępliwy wódz Sandbjerg spogląda teraz na raczkującą osadę zagubionych, lecz wiernych dusz, stojąc na wzgórzu i obserwując, jak w \"stoczni\" kształt nabiera kolejny drakkar. Wkrótce wikińscy wojownicy Fólkvangru popłyną na południe i napiszą sagę godną Walhalli!"
 jomsborg.5.a: "Freja zaopiekuje się nami na swojej łące."
 
 jomsborg.6.t: "Hávamál"
 jomsborg.6.desc: "Słońce stanęło. Kruki krążą nad ciałami.\nOczy się mrużą, ramiona sztywnieją, w głowie wiruje, oddech zamiera na zimnych, zaciśniętych zębach.\n\n\"Siedem stóp ziemi wystarczy każdemu człowiekowi...\"\n\nDaleko poza śmiertelną powłoką bogowie podzielili ziemskie dobra i już o nie nie walczą.\nDaleko poza bogami wkrótce rozpocznie się Ragnarök, a stoczą go śmiertelnicy, dźwigając całą grozę czynów, z którymi nie było im dane się mierzyć. Bogowie jednak milczą. Równie dobrze mogliby być martwi.\n\n- Żaden śmiertelnik nie udźwignie ciężaru milionów... Nie stawi czoła Fenrirowi i Jormungandrowi... Ale ty, Haraldzie? A ty? Czy stajesz w szeregu jak inni śmiertelnicy?\n- Jestem... śmiertelnikiem. Nikim więcej.\n- Twoja dusza jest nieśmiertelna, Haraldzie. Zawsze tu była. Pamiętasz krew? Ogień? Ludzi? Okręty na wielorybim szlaku... Zawsze tu byłeś, Haraldzie. Tutaj panowałeś.\n- Dlaczego nazywasz mnie imieniem, które nie jest moje? Mam na imię...\n\n- Masz na imię Harald. Zawsze tak było, odkąd bogowie sprowadzili ludzkość na ten świat. Harald i tylko Harald - zostałeś okłamany...\n- Nigdy nie okłamywałem samego siebie! Jestem człowiekiem jak każdy inny i mój obowiązek jest taki jak obowiązek każdego. Jestem, kim jestem, i przed tym nie ucieknę!\n- Nie stanąłeś w szeregu... Nigdy się nie cofnąłeś... Człowiek w tym ciele jest jedynie twoim spadkobiercą, Haraldzie. Weź go. Weź jego ciało i panuj. Naródź się na nowo.\n\n- JESTEM, KIM JESTEM! JESTEM, KIM JESTEM, I JESTEM ADRIANEM ZANDBERGIEM! NIE UCIEKNĘ PRZED TYM! JESTEM CZŁOWIEKIEM I NIE POZWOLĘ, BY KIEROWAŁY MNĄ UROJENIA!\n\nCisza. Słońce nie potrafi mówić, a gdyby potrafiło, człowiek leżałby martwy, zgarbiony pod jego niegasnącym światłem.\n\n- Walczysz, mały Halfdanie. Skoro walczysz, znasz prawdę. Idź dalej. Pamiętaj jednak... Okręt już płynie... Król przybywa po to, co mu należne...\n\nNiemądry człowiek czuwa całą noc\ni rozmyśla nad wszystkim;\ngdy przychodzi poranek, umysł ma znużony,\na ciężar pozostaje tak samo wielki."
 jomsborg.6.a: "Żadne życie nie trwa wiecznie."
 
 jomsborg.7.t: "Völuspá"
 jomsborg.7.desc: "Fale uderzają o wybrzeże, jedna po drugiej. Kołyszą kolebkę piaszczystej ziemi, nielicznych skał i drzew. Wiatr niesie ku domenie bogów budzący się płacz noworodka.\n\nBracia walczyć będą\ni wzajemnie się zabiją,\na synowie sióstr\nsplamią więzy krwi...\n\n- Twoi bracia o tobie zapomnieli, Halfdanie. Uważają cię za szaleńca. Myślą, że nie żyjesz.\n- Nie umarłem. Jeszcze nie.\n- Nie możesz umrzeć. Masz większe przeznaczenie, za którym musisz podążyć. Za morzem...\n- Moja ziemia jest bardziej udręczona niż kiedykolwiek. Wśród mego ludu rządzą niesprawiedliwość i chciwość...\n- Ale twój lud jest tutaj. To lud topora... Twój zastęp, twoi bracia...\n- Mój lud jest w domu... To uciskani i biedni. Ślepi i sprowadzeni na manowce. Ci...\n- Ten, kto stoi z tobą tarcza przy tarczy, jest twoim bratem. Nikt inny. On ochroni ciebie, a ty jego.\n- Są tacy, którzy potrzebują naszej ochrony. Tacy, którzy nie potrafią...\n- Będziesz chronił tego, kto z tobą walczy. Kto mieści się za twoją tarczą. Nikogo innego nie zdołasz ochronić.\n- Zdołam. Zdołamy. Zrobimy to. MUSIMY. Nie ma innej drogi.\n- Nadeszła Fimbulvinter. Gdy piwnica będzie pusta, ogień zgaśnie, a dłonie posinieją od zimna, kogo ochronisz? Potulnych i słabych? Wszystkich w całym kraju? Ludzi na całym szerokim świecie? Ochronisz tych, którzy staną z tobą tarcza przy tarczy... przeciw krążącym wilkom...\n\nCisza. Wiatr zagrzebał się w wydmach i przestał wiać.\n- Wszyscy mężczyźni... Wszystkie kobiety... są potrzebni do walki...\n- W takim razie oni będą twoimi braćmi tarczy, Halfdanie. Będą walczyć u twego boku..."
 jomsborg.7.a: "...dopóki będą w stanie."

 jomsborg.8.t: "Kruki Odyna patrzą na nas"
 jomsborg.8.desc: "Ciche, zwykle pochmurne i spokojne niebo nad Bornholmem rozdarł głośny łoskot śmigłowca. Łopaty wirnika cięły poranną mgłę, gdy maszyna Duńskiej Królewskiej Straży Przybrzeżnej zmierzała ku niezwykłej osadzie na wschodnim brzegu wyspy. Na pokładzie siedział Mikkel Rasmussen, zastępca urzędnika Administracji Regionu Stołecznego - osoba zbyt mało ważna, by zasiadać w kopenhaskiej radzie, lecz dostatecznie ważna, by wysłać ją do zbadania doniesień o dziwnej wiosce gdzieś na bałtyckim odludziu królestwa. Siedział z tyłu śmigłowca Straży Przybrzeżnej, w jednej ręce ściskając teczkę pełną nieprawdopodobnych opisów \"dzikiej grupy LARP-owej ludzi Północy\", która założyła stałą osadę pod Svaneke, a drugą masując skronie. Przeklinał w duchu, że nie po to spędził lata na najlepszych kopenhaskich uczelniach. Wkrótce jednak gniewne rozmyślania przerwał pilot.\n\n- Panie zastępco, jesteśmy prawie na miejscu.\n\nGdy wyjrzał przez okno, oczy mu się rozszerzyły, a brwi uniosły wysoko. Raporty nie przesadzały: naprawdę była to zbieranina LARP-owców udających wikingów i żyjących w prawdziwej, choć prymitywnej nordyckiej wspólnocie świątynnej. Przybycie \"wrzeszczącego srebrnego ptaka\" wywołało w wiosce wielkie poruszenie. Mężczyźni, kobiety i dzieci wybiegli z chat z drewna i gliny, wskazując, machając i kuląc się przed \"potworem\".\n\n- Posadź nas. Muszę zobaczyć to z bliska - powiedział Mikkel, ogarnięty zdumioną ciekawością.\n- Tak jest - odpowiedział pilot i skierował śmigłowiec na puste pole w pobliżu wsi.\n\nGdy wirniki wzbiły wokół lądowiska chmury pyłu, niemal wszyscy oszołomieni mieszkańcy otoczyli maszynę, niektórzy z prymitywnymi, zardzewiałymi toporami w drżących dłoniach. Gdy tylko koła śmigłowca dotknęły ziemi, Mikkel otworzył boczne drzwi, mocno ściskając teczkę. Kobiety i dzieci krzyczały ze strachu, kiedy mężczyzna w czerni wyszedł z \"brzucha ptaka\". Duński urzędnik w garniturze wyglądał całkowicie nie na miejscu pośród nieogolonych cosplayerów okrytych kocami i podartymi dywanami. Najodważniejsi mężczyźni utworzyli drżący mur tarcz i przygotowali się do walki. Na szczęście, nim wydarzyło się coś złego, z szyku wyszedł wysoki, postawny mężczyzna, przed którym pozostali wojownicy skłonili się z szacunkiem.\n\n- Vælkomin, przybyszu! - zagrzmiał, rozkładając ręce w powitalnym geście i mówiąc bardzo łamaną duńszczyzną. - Chwała Wszechojcu! Posłańcu Hugina i Munina, witam cię w Fólkvangrze!\n\nAtmosfera wokół lądowiska szybko się rozluźniła, a tarcze i topory opuszczono. Mikkel stał w osłupieniu, lecz szybko się opanował, poprawił garnitur i podszedł do jarla w długiej karminowej pelerynie. Wódz plemienia niemal promieniał z radości, że jego czyny przyciągnęły uwagę Kruków Odyna, gdy prowadził urzędnika ku długiemu domowi w centrum wsi. Mikkel uznał, że najlepiej będzie po prostu podtrzymywać tę zabawę, a potem zdać relację z tego, co zobaczył."
 jomsborg.8.a: "Ci Polacy biorą to naprawdę na poważnie, co nie?"

 jomsborg.9.t: "Obrońcy karminu"
 jomsborg.9.desc: "Ogień kuźni roztaczał aurę kojącego ciepła pośród zimnych wiatrów zachodniego Bałtyku. Wieśniacy gromadzili się wokół uszkodzonego kontenera mieszczącego piec hutniczy i patrzyli, jak dzień po dniu trwa praca nad bronią i pancerzami na nadchodzącą inwazję. Każdy choćby z grubsza metalowy przedmiot, którego duńscy mieszkańcy wyspy nie przytwierdzili do podłoża, był zdobywany i wykorzystywany ponownie przez zastęp Fólkvangru. Złom przetapiany w stalowym piecu stanowił podstawę wysiłku zbrojeniowego osady.\n\nNa pobliskim pniaku siedział doświadczony wojownik Bjorn i ostrzył swój wierny topór. Kuźnia pracowała dniem i nocą, potrzebowała więc ogromnych ilości drewna, a on wraz z innymi wojownikami podczas kolejnych wart pomagał rąbać polana na opał. Każde pociągnięcie osełki sypało iskrami na zmarzniętą ziemię. Tęsknił za powrotem do krain, z których wygnano jego i resztę plemienia, dlatego codziennie zgłaszał się do dodatkowej pracy, by zapewnić powodzenie nadchodzącej walki. Skupiony na toporze i od tygodni niewyspany, nie dostrzegł zbliżającej się potężnej postaci.\n\n- Ver heill ok sæll, bracie Bjornie - przywitał go głęboki głos, stawiając na baczność.\n- Witaj, jarlu Halfdanie! - Wstał, zatknął topór, położył dłoń na piersi i pochylił głowę, rozpoznając samego wodza plemienia.\n- Nie musisz się kłaniać, bracie. - Jarl dość szorstko poklepał Bjorna po ramieniu i uśmiechnął się krzepiąco spod gęstej brody. - Miałem nadzieję, że znajdziesz chwilę na rozmowę w długim domu.\n- Dla ciebie wszystko, mój jarlu. - Skinął głową i ruszył za przywódcą.\n\nPrzy każdym kroku kolczuga jarla, wykonana z przetopionych garnków i patelni, pobrzękiwała, potęgując jego i tak już dominującą obecność. Karminowa peleryna łopotała na chłodnej bryzie znad brzegu.\n- Bogowie zauważyli twoje poświęcenie dla sprawy. Ja również - powiedział spokojnie jarl, gdy dotarli do długiego domu. - Jesteś u mego boku dłużej niż większość.\n- Tak, wodzu, jeszcze zanim te pogańskie bękarty nas wygnały. - Na samą myśl zacisnął pięści.\n- Wkrótce, bracie, już wkrótce - zapewnił Halfdan, gdy przekraczali próg.\n\nWewnątrz czekała grupa elitarnych wojowników z karminowymi tarczami i hełmami typu gjermundbu. Zastęp pochylił głowy przed jarlem, który odwrócił się do Bjorna.\n- Pragnę, abyś wstąpił w szeregi moich huskarlów i walczył z naszymi wrogami w imię Odyna.\n- To będzie dla mnie zaszczyt, mój jarlu. - Bjorn skłonił się, a sam Halfdan Sandbjerg nałożył mu na głowę hełm huskarla.\nWojownicy trzykrotnie zakrzyknęli \"skál! skál! skál!\", witając nowego członka swoich szeregów."
 jomsborg.9.a: "Karminowa Straż rośnie w siłę"

 jomsborg.10.t: "Wzrok Szachraja"
 jomsborg.10.desc: "Tej nocy Międzywodzie było bardzo ciche, jak każdej od czasu Upadku. Zwyczajna wieś na wybrzeżu Bałtyku utrzymywała się z turystyki, lecz po interwencji Eurokorpusu cała branża zamarła niemal z dnia na dzień. Dziś mieszka tu ułamek dawnej ludności - ludzie zbyt dumni albo zbyt biedni, by wyjechać i spróbować życia w nowej rzeczywistości.\n\nJan, młody mieszkaniec wsi, leżał w łóżku i patrzył w sufit. Pozostał w zrujnowanej drewnianej chacie, by opiekować się chorą babcią, gdy jego brat zniknął, a przyjaciele rozproszyli się po okolicznych miasteczkach i miastach. W bezsennych rozmyślaniach przeklinał polityczny establishment, który doprowadził kraj do obecnego stanu. Przewrócił się na bok i spojrzał na ścianę, gdzie przykleił stary, wyblakły plakat. Karminowa barwa dawała mu spokój i przypominała czasy sprzed lat, kiedy razem z bratem byli wolontariuszami partii Razem. Może właśnie nostalgia sprawiła, że uwierzył w pogłoski krążące po wsi i poza nią: wygnany przywódca wciąż żyje i nie porzucił swojej misji. Westchnął, wstał i przetarł niewyspane oczy. Po cichu wymknął się z chaty i ruszył ku plaży, licząc, że morze przyniesie mu ukojenie. Usiadł na zimnym piasku, zamknął oczy i wsłuchał się w fale rozbijające o brzeg. W tej chwili pragnął jedynie znaku, że wkrótce wszystko się zmieni.\n\nNagle usłyszał odgłos starego drewna uderzającego o piasek. Otworzył oczy i ujrzał naprawdę niezwykły widok: łódź z prymitywnie wyrzeźbioną smoczą głową na dziobie. Dwaj postawni brodacze odziani w szorstkie dywany pomalowane karminową farbą wyskoczyli na brzeg i wyciągnęli łódź z wody. Jan osłupiał, lecz znajomo pomalowane peleryny żeglarzy rozpaliły coś w jego wnętrzu. Pobiegł ku nim, potykając się o wydmy.\n\n- Bracie Ivarrze, rad jestem znów cię widzieć. - Jeden z mężczyzn uklęknął przy nim i wyciągnął rękę.\n- Zygmunt? To ty, bracie? - Jan chwycił jego dłoń. Pamiętał tę twarz.\n- Teraz Agmundr, bracie. - Rodzeństwo mocno się objęło. - Chwała Odynowi, że nic ci nie jest.\n- Gdzie byłeś? O co chodzi z tym strojem? - zapytał zszokowany Jan.\n- Nie ma czasu na wyjaśnienia, bracie. Zaufaj mądrości Mimira i przygotuj się na nasz powrót. Rozgłoś wieści, agencie Lokiego, gdyż nie zapomniano o twoich dawnych wysiłkach.\n\nIvarr wstał z odnowioną determinacją. Z surowym wyrazem twarzy skinął bratu głową. Od tej chwili on i niezliczeni dawni wolontariusze zostali uaktywnieni jako uśpieni agenci, którzy mieli zasiać ziarno rewolucji przed powrotem Karminowego Jarla."
 jomsborg.10.a: "Agenci Lokiego kryją się na każdym kroku."

 jomsborg.11.t: "Lądowanie Normanów"
 jomsborg.11.desc: "Czarne fale Bałtyku ryczały, spragnione krwi. W normalnych okolicznościach kilku głośnych Polaków na motorówkach i skuterach wodnych rozbawiłoby dumnego niemieckiego oficera marynarki. Okoliczności nie były jednak normalne. Niemiecka armia okupowała wrogie ziemie i była atakowana ze wszystkich stron. W tej chwili motorówki były równie groźne jak drakkary, a wrzeszczący ludzie równie dobrzy jak berserkerzy. Pośród nich płynął Oskar Węgorz, który niedawno przyjął imię Öskuldr Ormríbrók i niebawem miał dowieść swej wartości w chrzcie bojowym.\nBrzegi Polski zbliżały się coraz bardziej. Öskuldr nie mógł się doczekać powrotu i zemsty na tych, którzy zaatakowali Polskę, oraz tych, którzy wcześniej ją osłabili. Serce zaczęło mu bić szybciej.\nTak jak przewidziała rada wojenna, Niemcy byli zbyt zajęci walką z siłami lądowymi, by spodziewać się desantu od strony morza. Dobrze. Öskuldr i jego towarzysze zaczęli przygotowywać koktajle Mołotowa, gdy sternik motorówki zbliżał się do jednostki Euroadmiralicji. Kiedy byli dostatecznie blisko, płonące butelki pofrunęły ku nieprzyjacielskiej łodzi i objęły ją ogniem. Pierwszy punkt zdobyty. Niemcy pojęli, co się dzieje, ale byli zbyt zajęci wycofywaniem się na bezpieczne pozycje, by się bronić. Jedynie wartownicy prowadzili regularny ogień. Na szczęście oddział Öskuldra miał własnego strzelca, który odpowiedział ołowiem na ołów. Nie było jednak czasu na ostrożną likwidację straży przybrzeżnej. Niemcy mieli przewagę ogniową, więc ludzie Północy musieli nacierać natychmiast, zanim obrońcy zdołają się przegrupować.\nZ głośnym okrzykiem Öskuldr, trzymając topór w dłoni, ruszył wraz z wieloma innymi wikingami na plażę w pościgu za wycofującymi się Niemcami. Nad jego głową latały rzucane topory, strzały i pojedyncze kule. Dogonił rannego niemieckiego żołnierza i rozpłatał mu głowę, nim ten zdążył wystrzelić. Nie mając czasu nacieszyć się zabójstwem, pobiegł ku nieprzyjacielskiemu wałowi z worków z piaskiem, prosto na żołnierza zbyt zajętego ostrzeliwaniem innego napastnika, by dostrzec szarżę. Za tę nieuwagę topór zmiażdżył mu czaszkę. Öskuldr przeskoczył przez worki i uderzył kolejnego żołnierza. Ten zdołał zablokować cios karabinkiem. Całą siłą wiking wyrwał broń z rąk Niemca, zahaczając ją zakrzywionym ostrzem topora. Uderzył eurożołnierza czołem w nos, po czym ciął go w brzuch. Przeciwnik runął na ziemię. Öskuldr spojrzał na plażę. Jego bracia broni odnosili sukcesy na pozostałych odcinkach wybrzeża. Dźwięk mosiężnego rogu obwieścił zwycięstwo."
 jomsborg.11.a: "Teraz tylko czekać na posiłki"

 jomsborg.12.t: "Komu bije dzwon?"
 jomsborg.12.desc: "Ksiądz Paweł Michniewicz często modlił się, aby Bóg obalił Niemców i wypędził ich z Polski. Nosił nienawiść w sercu. Teraz zrozumiał, że ziemię Gryfitów mogą nawiedzić jeszcze gorsze zła. Te, które przychodzą od morza. Uświadomił to sobie, gdy usłyszał o natarciu pogan i ich grabieżczej kampanii. Próbował odpokutować gniew, udzielając schronienia rannym żołnierzom Admiralicji. Nawet wtedy nie czuł się oczyszczony.\n- Zrobiłem to ze strachu - powiedział kiedyś spowiednikowi, księdzu Markowi Kuligowskiemu. - Ze strachu i dlatego, że uznałem, iż Związek Jaszczurczy nie przyjdzie nam z pomocą na czas. Nie tak powinien wyglądać prawdziwy żal.\nJeśli popełnił grzech, niech za niego odpowie! Czy Bóg uderzyłby w samo serce pomorskiego chrześcijaństwa wyłącznie z powodu występków jednej parafii?\nLudzie Północy przybyli nocą. Za drzwiami kościoła rozbrzmiewały krzyki ostatnich zdemoralizowanych niemieckich żołnierzy broniących świątyni. Gdy wikingowie skończyli z obrońcami, zaczęli rąbać toporami w kościelne wrota.\n*Trzask*\nKsiądz Michniewicz odmówił ostatnie modlitwy.\n*Trzask*\nDzikie wrzaski najeźdźców przeraziły wszystkich, którzy szukali w kościele pociechy i ochrony.\n*Trzask*\nWdarli się do środka. Tych, którzy próbowali stawiać opór, wycięto. Potem zwrócili się przeciw rannym. Żaden Niemiec nie miał przeżyć.\nCoś w Pawle pękło. Zostawił wszystkich własnemu losowi. Pobiegł w najdalszą część kościoła i ukrył się za rzeźbą archanioła Michała. W tych krótkich chwilach schronienia nie znalazł spokoju. Słyszał coraz głośniejsze kroki, a wraz z nimi odgłosy grabieży. Ociekający potem ksiądz próbował uspokoić oddech, aby go nie znaleźli. Wikingowie minęli go i skierowali się ku kryptom książąt pomorskich.\nKsiądz Paweł postanowił pozostać w ukryciu. Próbując zebrać myśli, opracował plan dotarcia do rodziny w Uniborzu.\n- Jednego przegapiliśmy - wiking, który skończył rabować groby, niestety zauważył ukrywającego się kapłana.\nDrugi wyciągnął rękę i go chwycił. Jedno uderzenie opancerzoną rękawicą odebrało Pawłowi możliwość oporu. Przeciągnęli go przez główną nawę, gdzie ujrzał wikingów próbujących wymazać dziewięćset lat historii pomorskiego chrześcijaństwa.\nWiking, który go schwytał, uniósł młot nad głową księdza."
 jomsborg.12.a: "- Święty Ottonie, módl się za nami"

 jomsborg.13.t: "Forfaðir"
 jomsborg.13.desc: "Sam Karminowy Jarl nie mógł przybyć na Blót upamiętniający zdobycie Jomsborga. Wysoka gorączka, rany odniesione w walce i wyczerpanie planowaniem inwazji zebrały swoje żniwo. Musiał kurować się w łóżku.\nWyrzuty sumienia dręczyły go jednak bardziej niż fizyczne dolegliwości. W środku nocy obudził się i uznał, że musi zobaczyć nekropolię. Wyruszył bez straży, ubrany jedynie w prostą koszulę nocną.\nNa szczycie wzgórza ujrzał kurhany oznaczone białymi kamieniami i wygasłe ognisko - ślad Blótu odprawionego przez jego wyznawców. Przyjrzał się pozostałym żarom. Ku jego zdumieniu układały się w słowa zapisane runami: ARALD CVRMSVN. Dopiero teraz poczuł, jak zimno jest na zewnątrz. Coś było nie tak. Zmarli byli niespokojni.\nZobaczył popiół wydobywający się z kurhanów i tworzący wir. Jarl zasłonił oczy ramionami.\nWtedy z popiołu uformowało się przed nim trzynaście nieumarłych draugrów. Jeden król ze zgniłymi zębami i dwunastu huskarlów ze sznurami zwisającymi z szyi.\n- Jesteśmy Haraldem Gormsonem, zwanym Sinozębym, królem Duńczyków, Skanii, Jomsborga i Aldinburga. Odrzuciłeś wezwanie Odyna - wysyczał zmarły szorstkim głosem.\n- Jestem Adrian Zandberg i znam cię - odparł jarl stanowczo. - Kim jesteś, by mówić o woli Odyna? Wyrzekłeś się go, aby podążyć za Chrystusem.\n- Tak uczyniłem i dlatego moja dusza, nasza dusza, leży w Hel i marnieje wraz z innymi słabeuszami. To samo czeka ciebie, jeśli nie przyjmiesz mojego ducha i nie pozwolisz, by zapanowała twoja prawdziwa natura.\n- Nigdy tego nie zrobię.\n- Prawie zrobiłeś. W więzieniu. Pamiętasz oślepiający szał berserkera, gdy broniłeś się w bójkach? To twoja prawdziwa natura próbowała się z tobą porozumieć.\n- Znam cię. Chcesz sprowadzić na cały świat zniszczenie, śmierć i gwałt. Ja chcę pomagać ludziom. Wydźwignąć ich z cierpienia.\n- Rozejrzyj się. Wszystko to już jest w Vendlandzie. Tylko przyjmując przeznaczenie, zdołasz pokazać poddanym, jak przetrwać w tej nowej epoce.\nZandberg nie znalazł odpowiedzi.\n- Pomyśl także o ich życiu po śmierci. Cóż warte jest pięćdziesiąt lat wygody, jeśli kończą się tysiącleciami w ciemnościach Hel? Chcesz pomagać ludziom? Pomóż mnie. Pozwól mojej duszy wejść w pustą skorupę twego ciała, abym mógł odkupić się jako wojownik.\nMilczenie jarla było dla zjawy dostateczną odpowiedzią.\n- Wiem, że podejmiesz właściwą decyzję. Na znak dobrej woli przyjmij dar, który przyniosłem ci od Eir.\nJarl obudził się w łóżku. Przemoczony potem, lecz w doskonałym zdrowiu."
 jomsborg.13.a: "Co to za magia?"

 jomsborg.14.t: "Vafþrúðnismál"
 jomsborg.14.desc: "Pomimo ostatnich sukcesów Zandberg nie znajdował czasu na świętowanie. Rzadko uczestniczył w ucztach lub śpiewał z towarzyszami broni.\nNiektórzy sądzili, że nie spocznie, dopóki całe niemieckie zagrożenie nie zostanie zepchnięte za Odrę. Pewne zachowania jarla budziły jednak wątpliwości, czy rzeczywiście kieruje nim zaciekłość.\n\nZandberg stanął u wejścia do obozu szkoleniowego, by przeprowadzić dyskretną inspekcję. Stacjonujący tam ludzie ćwiczyli walkę wręcz w dwóch drużynach. Jedna szybko obezwładniła większość drugiej. Pozostał tylko jeden wojownik. Nie zamierzał się poddać, więc przeciwnicy rzucili się na niego wspólnie.\n- Poddaję się! - krzyknął, leżąc na ziemi, kopany i bity przez rywali.\n- Dosyć! - chciał zawołać Zandberg, lecz słowa zamarły mu w ustach. Aż nazbyt dobrze znał obraz bezbronnej ofiary katowanej przez oprawców. Serce zaczęło walić mu w piersi. Oddech przyspieszył.\n- Przestańcie! - Wreszcie zdołał wydobyć głos, bardziej spanikowany, niż ktokolwiek się spodziewał. Walka ustała, a wszyscy zwrócili głowy ku jarlowi. Dowódca obozu zapewne skarcił zwycięską drużynę. Zandberg nie był pewien, gdyż opuścił obóz szybkim krokiem.\n\n- Potężny Duńczyk leży na podłodze! - Tak oprawca Zandberga rozpoczynał każde przesłuchanie. Dlaczego znów słyszał jego chrapliwy głos? - Podaj nazwisko przywódcy szczecińskiej komórki Razem.\nPotem następowało zbiorowe bicie.\n\n- Potężny Duńczyk leży na podłodze! Powiedz, gdzie ukrywa się Grucela?\nKopnięcie w głowę.\n\n- Potężny Duńczyk leży na podłodze! Powiedz, gdzie ukrywa się Bosak?\nCios w brzuch.\nBłąkając się bez celu, Zandberg dotarł wreszcie do własnego namiotu. W środku próbował uspokoić oddech, lecz obrazy i odczucia nie ustępowały. Ból razów, widok torturowanych więźniów. Krzywy uśmiech oprawcy.\n- Ten cholerny drań rzeczywiście wybił mi dziurę w głowie... Jeśli jeszcze go zobaczę, wyrąbię mu taką samą! - pomyślał Zandberg, próbując znaleźć otuchę. Chwilowa euforia wyobrażonej zemsty minęła równie szybko, jak się pojawiła. - Czy ta męka nigdy się nie skończy?\n\"Znasz prawdę...\"\nZandberg nie potrafił rozpoznać głosu."
 jomsborg.14.a: "'...walka jest wieczna. Zaadaptuj się lub zgiń.'"

 jomsborg.15.t: "Kwestia przyszłości"
 jomsborg.15.desc: "Morski wiatr owiewał zgromadzenie Armii Północy na Srebrnej Górze w Jomsborgu. Marcelina Zawisza miała nadzieję, że okaże się wiatrem zmian. Od pewnego czasu namawiała Zandberga, by pamiętał o egalitarnych ideałach partii Razem... i, oczywiście, o wikińskich tradycjach wieców. Po wielu dniach nieustannych nacisków jarl wreszcie ustąpił.\nZawisza miała nadzieję, że to właściwa chwila, aby uniknąć katastrofy.\n- Dzień dobry, zechce pan mnie poprzeć podczas nadchodzącego wiecu? - Wręczyła ulotkę jednemu z wojowników. Pośród mężczyzn w wilczych skórach i lnianych tunikach wyróżniała się ciemnogranatową marynarką.\n- Hmm, przepraszam... - Mężczyzna z trudem próbował zrozumieć treść na papierze. Właśnie to martwiło Zawiszę. Co było tak skomplikowanego w trzydziestopięciogodzinnym tygodniu pracy i niższym wieku emerytalnym? - Nie interesuję się polityką.\nKolejna osoba, berserker, okazała się jeszcze gorsza.\n- Wybacz, pani. Pójdę za Sandbjergiem, nie za jakąś socjalistką.\nWyglądało na to, że karmin na sztandarach wyblakł bardziej, niż początkowo sądziła.\n- Równy podział łupów! Dziękuję za podpisanie petycji. - Magdalena Biejat uśmiechała się perłowo do każdego przechodzącego wikinga. - Większa rola Altingu! Dziękuję.\nJej koleżanka postanowiła dostosować wygląd do nowej rzeczywistości. Zamiast zwyczajowej ciemnogranatowej marynarki i spodni miała na sobie morską zieleń sukni stylizowanej na średniowieczną. Zdawała się przyciągać więcej uwagi, lecz kto wie, ilu zwolenników stanie przy niej, gdy przyjdzie co do czego.\n\n- Nadszedł czas Altingu! - Początek obrad ogłosił nie kto inny jak Kościelak.\nKolejne rozczarowanie. Zawisza liczyła, że ich przemówienia poruszą serca i umysły żołnierzy oraz przemówią do rozsądku Zandberga, ale nigdzie go nie było. Zamiast tego mianował Kościelaka mistrzem ceremonii, najwyraźniej chcąc zdobyć jego przychylność. Nie wspominając już o tym, że pierwszą wezwaną mówczynią miała być...\n- Magdalena Biejat. Prosimy o przemówienie.\n- O, dzielni wojownicy - rozpoczęła Magda swoje exposé. - Pragnę podziękować wam za poświęcenie podczas odzyskiwania polskich ziem. Bez was nie byłoby nas tutaj. W chaosie bitwy często trudno pamiętać, o co walczymy. Walczymy za nasz kraj i przyszłość naszych dzieci. Dlatego musimy pomyśleć o przyszłości. O potężnych inwestycjach sfinansowanych ostatnim napływem środków. O prawach kobiet, które tak jak wy walczą na porodówkach.\n- Jeszcze kilka zdań i naprawdę przekona sporą część z nich - pomyślała Zawisza. - Niedługo nadejdzie mój czas, by zabłysnąć.\nWtedy na plażę wjechał koń, niosąc samego Karminowego Jarla.\n- Thor przemówił do mnie. Dość gadania, wracajcie do ćwiczeń!"
 jomsborg.15.a: "Przewidywanie zostawcie Odynowi"

 jomsborg.16.t: "Sztuka interaktywna"
 jomsborg.16.desc: "Helena człapała jedną z alejek kurortu, pompatycznie trzymając trzeci kieliszek truskawkowego daiquiri. Niemal bez tchu Zygmunt próbował dotrzymać jej ślimaczego tempa, rozpaczliwie pilnując, by przeładowane talerze dopełnione przy bufecie nie wylały zawartości na chodnik. Dwustumetrowy spacer na plażę zmienił się w morderczą wyprawę. Po dotarciu na miejsce położyli najnowsze łupy na maleńkim stoliku i opadli na leżaki, gotowi na kolejny dzień leniuchowania i niewiele więcej.\n\n- Helenka, nie zrobiło się tu ostatnio trochę nudno?\n- Owszem. A skoro o tym wspominasz... jest też znacznie puściej niż zwykle. Nawet Müllerowie wyjechali. Tak się kończy oszczędzanie na rozrywce. Od dwóch miesięcy puszczają te same przedstawienia.\n- Racja. I brakuje im energii. Jakby artyści robili to pod przymusem.\n- Wiesz co? W tym tempie powinniśmy zacząć myśleć o innym kurorcie.\n\nPrzez wzburzone fale ku brzegowi płynęły łodzie. Flota inwazyjna przybyła, by zagarnąć ten odcinek wybrzeża.\n\n- Zrobię rezerwację, gdy wrócimy do pokoju. Mam na oku kilka miejsc, które... chwila, ty też to widzisz, prawda?\n- Wygląda jak... niech mnie, Helenka! To wikiński długi okręt.\n- No, wreszcie coś nowego! W końcu poszli po rozum do głowy i zmienili repertuar.\n- Ech, nadal muszą nad tym popracować. Te stroje wyglądają potwornie tanio. W najbliższym sklepie z kostiumami znalazłbym coś lepszego.\n- Och, nie marudź. Robią, co mogą. Poza tym to tylko próba. W dzisiejszym programie wydarzeń nie było żadnej rekonstrukcji wikińskiej inwazji.\n\nGdy zetknęli się z lądem, najeźdźcy zeszli na brzeg w poszukiwaniu łupów. Większość natychmiast ruszyła ku głównym budynkom, zaślepiona obietnicą bogactwa i szałem berserkera. Jeden z grabieżców, mocno dzierżąc topór, podszedł do starszej pary i stanął nad nią groźnie.\n\n- W imię Odyna oddajcie cały dobytek, a pozwolę wam żyć. Nie chcę dziś przez was brudzić topora krwią.\n- Proszę pana, muszę przyznać, że wykonuje pan wspaniałą pracę. Bardzo przekonująco. Gdybym tylko mogła coś zasugerować, powinien pan trochę popracować nad akcentem.\n- Daję wam ostatnią szansę. Pieniądze albo życie.\n- Przepraszam, moja żona właśnie pana pochwaliła. Nawet jej pan nie podziękuje?\n- Zły wybór.\n\nNajeźdźca bez słowa uniósł broń, z kamienną i wyraźnie niezadowoloną miną. Przygotował się do ciosu w zuchwałych miejscowych.\n- Helenka, zaczynam podejrzewać, że on naprawdę nie żartuje..."
 jomsborg.16.a: "Możemy to uznać za nieporozumienie?"

 jomsborg.17.t: "Skjaldbaka"
 jomsborg.17.desc: "- Dobra, ludzie! - Potężny wódz stanął przed zbieraniną młodych rekrutów. Trzymał w dłoni duński podręcznik historii. - Zgłosiliście się do Alþýduher, żeby nie skończyć jako bezwartościowi niewolnicy. Ale to coś znaczy! Musicie się wysilić, bo inaczej wrócicie do rodzinnego Zadupia Złupionego w worku na zwłoki. Nie chcemy tego, prawda? Przećwiczmy więc stare, dobre szyki obronne. Zaczniemy od muru tarcz.\nDowódca pokazał rekrutom stronę z książki i czekał na rezultat.\nPrzyszli wikingowie utworzyli kwadrat i unieśli okrągłe tarcze, jedną obok drugiej. Jeden szereg chronił front, a dwa kolejne miały osłaniać boki. Stojący pośrodku podnieśli tarcze nad głowy.\n- Nie! Nie, wszystko źle! Nie patrzyliście? - wybuchnął instruktor. - Ledwie rozumiecie nordic walking, a co dopiero nordyckie formacje! Tarcze są okrągłe, więc ustawione obok siebie stykają się tylko w jednym punkcie i zostawiają ogromne szczeliny. Muszą na siebie zachodzić jak łuski węża. I uformujcie jeden mur, a nie cztery, na Thora!\nNowy oddział wkrótce pojął podstawy i stworzył coś przypominającego mur tarcz z podręcznika.\n- Dobrze, sprawdźmy, czy szyk działa. Łucznicy!\nOddział strzelców przygotował ćwiczebne strzały i wycelował w rekrutów. Wystrzelili i, na szczęście dla piechurów, żadna strzała nie przebiła formacji.\n- Ach, ćwiczycie mur tarcz. - Szkolenie przerwał jeden z tanów ze swoim elitarnym oddziałem. - Imponujące. Z pewnością zwiększy nasze możliwości obronne. O ile będziemy walczyć na płaskim terenie. Na wzgórzach i w lasach wasi żołnierze zostaną łatwo oskrzydleni. Nie wspominając o spotkaniu z bardziej zaawansowanym wrogiem.\nGestem nakazał elitarnym zbrojnym wycelować w mur tarcz.\n- Mam nadzieję, że rozumiecie przesłanie - ciągnął. - Dopóki jednak mierzymy się z wrogami uzbrojonymi w pałki i proce, to wystarczy. Sądzę też, że pozostanie ponadczasowo skuteczną metodą pacyfikacji nieuzbrojonych buntowników. Mimo wszystko nalegam, aby szkolić rekrutów w bardziej dynamicznej taktyce, tak by zdążyli dopaść strzelców, nim ci przeszyją ich kulami.\nInstruktor próbował ukryć wstyd i gniew, wyładowując się na nowicjuszach.\n- Słyszeliście go. Szykować się do biegu. Ruszać!"
 jomsborg.17.a: "Formować szyk! Biegiem! Formować szyk!"

 jomsborg.18.t: "Piekielna robota"
 jomsborg.18.desc: "Dzień 1\n\nPrzydzielili mnie do pracy przy jakimś statku. Jeszcze nie wiem jakim, ale zapłata jest podejrzanie hojna, a to może oznaczać tylko kłopoty. Mimo wszystko znam się na fachu i nie ma roboty, której bym nie podjął. A przynajmniej tak sobie powtarzam.\n\nDzień 5\n\nTo jest kompletne pierdolone szaleństwo. Po pierwsze chcą, żeby statek był w całości z drewna. Kto, kurwa, myśli w ten sposób w XXI wieku? Jakby tego było mało, żądają norweskiego dębu. Norweskiego. Jebanego. Dębu. Skąd mam go wziąć? Najwyraźniej nasze wspaniałe polskie drzewa nie są dość dobre dla tych idiotów.\n\nDzień 11\n\nWreszcie skończyliśmy szkielet. Sprowadzenie drewna niemal przyprawiło mnie o gorączkę, ale jakimś cudem się udało. Naprawdę mam nadzieję, że to była najtrudniejsza część roboty. Boże, miej mnie w opiece, jeśli wymyślą kolejne bzdury.\n\nDzień 15\n\nKiedy zobaczyłem wymiary kotwicy, omal nie dostałem zawału. To coś jest absurdalnie wielkie i zupełnie bezużyteczne, ale spróbuj im to wyjaśnić. Te brodate dupki tylko powtarzały, że kotwica nie może obrażać potężnego Odyna, więc musi być wielka. Tyle. Zero logiki. Czyste, pieprzone szaleństwo.\n\nDzień 27\n\nPo tygodniach morderczej pracy dotarliśmy wreszcie do wykończenia. Myślałem, że poznałem już pełnię ich obłędu. Myliłem się koszmarnie. Teraz chcą, żeby najlepsi dostępni malarze stworzyli na żaglu najbardziej realistyczny portret Karola Marksa. A żeby mieć pewność, że go nie \"znieważymy\", wysyłają jakichś kutasów z administracji, by patrzyli nam na ręce. Z każdym oddechem coraz bardziej żałuję przyjęcia tej roboty.\n\nDzień 30\n\nWszystko się zjebało. Nie dość, że Marks został \"namalowany źle\", to jeszcze odkryli, że dziób jest o dziesięć pieprzonych centymetrów za krótki. Dziesięć. I dlatego muszę przebudować cały statek. Mam dość. Oby ci idioci spłonęli w piekle, Helheimie czy jak tam się nazywa ich życie pozagrobowe.\n\nDzień 60\n\nWreszcie zatwierdzili projekt. Oczywiście powiedzieli, że nie jest idealny, tylko \"dostatecznie dobry\". Nigdy w życiu nie czułem takiej ulgi. Przez pewien czas byłem przekonany, że któryś z tych wikingów odrąbie mi głowę, jeśli znajdą kolejny problem. To miejsce jest chore. Jak tylko dostanę wypłatę, ruszam na zachód. Koniec z wikingami i ich pierdoleniem."
 jomsborg.18.a: "Toć to iście syzyfowa praca."

 jomsborg.19.t: "Vem kan segla"
 jomsborg.19.desc: "- Nie, nie możemy po prostu użyć kogi! Nie mamy żadnej. I po co nam koga, skoro stoją tu całkiem dobre klipry? - Głos Biejat trafiał w próżnię. Zawisza po wielu godzinach debaty była zbyt nieobecna, by się przydać, a Zandberg...\n- Musimy pokazać ludziom naszą stronę, stronę Północy. Jeśli nie pokażemy jej za granicą, jak mamy przynieść ją narodowi? Sobie samym?! Nie! - Zandberg uderzył potężną pięścią w dębowy stół, aż kufel zadrżał.\n- Popłyniemy kogami, zawiesimy tarcze na lewej i prawej burcie, użyjemy żagli i WYRUSZYMY NA WIKING!\nWiosła, żagle, tarcze, najazdy. Taka była wizja Zandberga na podróże krajowe i zagraniczne. Ostatecznie może dało się wyperswadować mu kogi, lecz jego myśl pozostawała zwarta niczym mur tarcz. Biejat trochę go rozumiała, bo oglądała z nim ponownie \"Wikingów\". Zawisza siedziała we własnym świecie, a dobiegające od niej ciche dźwięki przypominały jakiś k-pop.\n- Jesteśmy Wendami, silne mamy ramiona, z naszym hirdem łupimy słabych. Spalimy świat i naprawimy go, gdy epoka wikingów spotka dzisiejszy dzień. - Biejat nie potrafiła już do niego dotrzeć. Zbyt dobrze znała ten stan: Zandberg zamykał się w swojej wizji idealnej wikińskiej przyszłości i się w niej pławił, nieważne jak daleko odchodziła od marzeń dzielonych niegdyś z Zawiszą i Biejat. Kufel znika w gardle. Mówią, że po alkoholu ludzie stają się szczególnie szczerzy. Czy ten bredzący szaleniec ukazywał właśnie prawdziwego siebie? Czy o to mu teraz chodziło?\n\nWtedy Zawisza wstała. Wypiła własną porcję miodu i... wyciągnęła kościany flet. Melodia zwróciła uwagę Zandberga; melancholijny, powolny nurt przypominał kołysankę i go uspokajał. Chwilę później wszedł skald.\n\nHwerʀ mag an kwirū habē sigljan,\nrōan þan sa ni ā āru?\nHwerʀ mag wiþʀ wini skiljan\nanþi ni falljan tāru?\n\nKto popłynie bez wiatru, kto powiosłuje bez wioseł? Kto rozstanie się z przyjacielem i nie uroni łzy? Bard przemawiał w pranordyjskim, jeszcze starszym od mowy, którą Zandberg promował wśród Wendów.\n- Marcelino, to piękna aranżacja... Chyba... chyba rozumiem, co chcesz powiedzieć. Wysyłając ekspedycje, rozdzielimy przyjaciół. Nie chcesz, abym lekkomyślnie rozdzielił ich na zawsze.\n- Właśnie tak. Jesteśmy silnymi wikingami, owszem, ale jeśli pokażemy słabym prawdziwą naturę, zanim będziemy gotowi na odpowiedź... nic z nas nie zostanie. Gdy wypłyniemy, musimy wiedzieć, z kim handlować, a kogo najeżdżać. Spójrz na nasze ziemie. Wciąż brakuje nam tak wielu rzeczy...\n- Tak... - zgodził się Zandberg. - Bardziej potrzebujemy partnerów handlowych niż wrogów. Nadejdzie czas, by pokazać światu prawdziwą siłę, lecz najpierw musimy ją zdobyć. Najpierw handel... a brać będziemy tylko od tych, z którymi sobie poradzimy. Pamiętaj jednak, Marcelino... nawet pieśni nie przekonają mnie, że ból rozstania z przyjacielem jest większy od chwały triumfu, który zapamiętają skaldowie."
 jomsborg.19.a: "Mogę wiosłować bez wioseł, ale nie rozstanę się z przyjacielem bez łez."

 jomsborg.20.t: "Bezczynny Verndarar"
 jomsborg.20.desc: "Od samego rana mieszkańcy Soldina wrzeli. Anonimowe źródło dostarczyło spis rzekomych kolaborantów związanych z upadłym reżimem Eurokomisariatu. Podupadająca lokalna gazeta opublikowała go bez sprawdzenia, chcąc zwiększyć sprzedaż, a ludność nadała mu własne znaczenie: nie była to dla nich lista hańby, lecz lista celów.\n\nSteinn i Gunnarr byli w połowie patrolu, gdy wieść o artykule wreszcie do nich dotarła. Krótki telefon z dyspozytorni rozwiał nadzieje na ciepły obiad na posterunku. Zamiast tego otrzymali nowe rozkazy: strzec rezydencji jednego z wysokich urzędników. Nie z ideologicznej sympatii, lecz dlatego, że biurokrata wykonał tyle spanikowanych telefonów, iż łatwiej było wysłać ochronę, niż słuchać dalszych jęków i skarg.\n\nGdy funkcjonariusze przybyli, przed budynkiem zebrało się około piętnastu protestujących. Steinn i Gunnarr stanęli przy bramie, groźnie spoglądając na niedoszłych intruzów i dając jasno do zrozumienia, że nie warto próbować wejścia. Nieco obniżyło to napięcie i zamieniło sytuację w długotrwały impas.\n\n- Mów, co chcesz, ale ma tu całkiem ładny dom. Też bym się złościł na ich miejscu. Miasto mocno ucierpiało podczas wojny. To chyba jedyne miejsce, gdzie tego nie widać - Steinn zwrócił się do partnera, przerywając nudę.\n- Biurokraci. Wszędzie ta sama historia.\n- No właśnie. Czasem człowiek się zastanawia, czy nie pomagamy niewłaściwej stronie.\n- Bo pomagamy. Jak się czujesz, ryzykując życie w obronie zatwardziałego liberała?\n- Kiepsko. Naprawdę kiepsko.\n- To może pozwolimy sprawom... potoczyć się naturalnym biegiem? Właściwie chyba nie zdążyliśmy tu na czas. Gdy przyjechaliśmy, posiadłość była już splądrowana. Co za szkoda.\n- Skoro o tym wspominasz... przecież i tak nie chciałby naszej interwencji, prawda? \"Państwo nie powinno mieć monopolu na przemoc\" i tak dalej?\n- Teraz rozumiesz. Gdyby chciał ochrony, sam by ją sobie wynajął. To takie proste. Czemu wcześniej na to nie wpadliśmy?\n- Popatrz na nas, Steinn. Wreszcie jesteśmy prawdziwymi bohaterami. Spełniamy życzenie tego człowieka i pozwalamy mu żyć oraz umrzeć zgodnie z przekonaniami... To niemal piękne. Aż łza się w oku kręci.\n\nW porozumiewawczym geście obaj partnerzy odsunęli się o kilka kroków, pozostawiając wejście do rezydencji szeroko otwarte. Niemal natychmiast rozwścieczony tłum wdarł się na teren posiadłości. Steinn i Gunnarr odjechali zadowoleni, pozostawiając urzędnika na pastwę gniewu ludu."
 jomsborg.20.a: "Kolejny przykład hipokryzji libków."

 jomsborg.21.t: "Wolfsangel"
 jomsborg.21.desc: "Pyritz - Pyrzyce, jak nazywali je ci nieokrzesani barbarzyńcy. Reklamowano je jako idealne, sielankowe miasto, daleko od frontu i blisko domu. Koszt przeprowadzki był śmiesznie niski w porównaniu ze Schwerinem. Dla Dietricha, świeżo upieczonego absolwenta, wybór był oczywisty. Myśl, że administracja UE może całkowicie nie zdołać spacyfikować jakichś dzikusów - tych samych, których niechętnym poddanym teraz został - była mu zupełnie obca. A jednak jakimś cudem zwyciężyli.\n\nGdy poprawiał pruską flagę wiszącą na ścianie na kawałkach taśmy, które zawsze odklejały się, gdy wyglądała idealnie, usłyszał pukanie do drzwi. Mijając rozrzucone po pokoju pamiątki, ruszył je otworzyć.\n\nNa progu stało dwóch mężczyzn. Byli od niego wyżsi i szersi w barach, choć przy jego lekko skrzywionych plecach nie było to wielkim osiągnięciem. Obejrzał ich od góry do dołu - czarne włosy, brązowe włosy, piwne i zielone oczy; bez wątpienia Polacy. Trzymali w dłoniach małe książeczki. Było jeszcze gorzej, niż się obawiał: Świadkowie Jehowy!\n\nPrzedstawili się, ale nie zwrócił uwagi na ich imiona. Nie obchodziły go. Prychnął i już miał zamknąć drzwi, gdy brązowooki przemówił czymś, co zaledwie przypominało niemiecki i nie sięgało nawet poziomu volksdeutscha.\n\n- Prosimy o chwilę. Przyszliśmy porozmawiać o Wielkim Wōdenie!\n\nDietrich znieruchomiał i spojrzał na kaznodzieję z irytacją. Wyprostował się nieco i zapytał z niedowierzaniem:\n\n- Mówicie poważnie? Prawdziwi wyznawcy prawdziwych Bogów? Przecież nie jesteście nawet właściwej...\n\nPowstrzymał się, nim naprawdę wyraził opinię o rzekomych wiernych. Zamiast niego odezwał się drugi, zielonooki mężczyzna.\n\n- Śmiertelnie poważnie, bracie. Obawiam się, że wiernych jest niewielu. Germańska krew w naszych żyłach musi zostać przebudzona.\n\nBrązowooki wręczył mu broszurę. Zawierała prymitywne streszczenie wiedzy o Bogach i opis run. Dietrich rozmyślał nad jej jakością, a raczej jej brakiem. Wszystko to już wiedział, podane w formie dla dziecka i pozbawione kluczowych szczegółów znaczenia. Po namyśle jedyny prawdziwy Niemiec z całej trójki odpowiedział:\n\n- Zobaczymy się... na kazaniu. Może ja też będę mógł was czegoś nauczyć. Niech Heimdallr prowadzi waszą drogę.\n\nZadowoleni odeszli, a Dietrich dorzucił broszurę do sterty rupieci na biurku, tuż obok jednej z pamiątek po dziadku."
 jomsborg.21.a: "Pierścień z runami, który pominęli."

 jomsborg.22.t: "Miłosierdzie Jarla"
 jomsborg.22.desc: "Bogdan Jaroszewicz czuł ukłucie niepokoju, czekając na audiencję u potężnego jarla Halfdana. Wciąż trudno było uwierzyć, że jego miasto plądrują prawdziwi wikingowie. Jak do tego doszło? Ich demokratyczny eksperyment skończył się tak nagle. Ledwie wypędzili Niemców ze Szczecina i nacieszyli krótką chwilą stabilności, a już znów prześladowali ich dawni współobywatele. Teraz okrucieństwo było jeszcze gorsze. Na szczęście Magdalena Biejat przemówiła Zandbergowi do rozsądku, a on otrzymał szansę ocalenia ludzi i miasta przed barbarzyńcami.\n\nKiedy wrota wielkiej sali się otworzyły i Jaroszewicza przyprowadzono przed Halfdana, ogarnęła go fala czystego strachu. Wysoki, potężny wiking spoglądał na niego z drewnianego tronu z jawną pogardą. W oczach Halfdana Bogdan był tylko zdrajcą sprawy, który sprzymierzył się z konserwatystami i liberałami, aby odbudować świat, na którego zniszczenie Halfdan poświęcił całe życie.\n\n- A więc, panie Zand... jarlu Halfdanie, przybyłem błagać...\n\nNim skończył, Halfdan mu przerwał.\n\n- Wiem, po co wpełzasz do mojej sali, robaku. Przychodzisz nie ze stalą, lecz z miękkimi słowami i modlitwami o pokój. W moich oczach nie jesteś mężczyzną. Gdyby w twojej krwi płynął choć cień honoru, chwyciłbyś topór, stanął pośród swego ludu i spotkał przeznaczenie pod otwartym niebem. Lepiej polec z imieniem niesionym przez wiatr i duszą zabraną do Walhalli, niż żyć na kolanach, obgryzając resztki litości jak skopany pies.\n\nSandbjerg wstał, a biedny Jaroszewicz był pewien, że jarl chwyci topór u boku i natychmiast zetnie mu głowę.\n\n- Dotarły jednak do mnie wieści, że oszczędzenie twego nędznego życia może lepiej przysłużyć się ludowi niż przelanie krwi na tych deskach. Poświęciłeś życie służbie zwykłym ludziom, co podziwiam mimo twego tchórzostwa. Otrzymasz kolejną szansę, by służyć ludowi. Niech Odyn będzie mi świadkiem, że osobiście zetnę ci głowę, jeśli postanowisz nas zdradzić; to samo dotyczy podwładnych. Twoje miasto zostanie oszczędzone. Ludzie przeżyją. Z błogosławieństwem Eir spoczywającym na dłoniach pomożesz nam wykuć z popiołów królestwo sprawiedliwości.\n\n- D-dziękuję, mój jarlu. Mój lud zapamięta tę łaskę.\n\nJaroszewicz skłonił się głęboko i wycofał od tronu, z sercem wciąż łomoczącym w piersi. Dopiero gdy wielkie wrota zamknęły się za nim, pozwolił sobie odetchnąć."
 jomsborg.22.a: "Kruchy pokój"

 jomsborg.23.t: "Burstarøkkr"
 jomsborg.23.desc: "Wikingowie szaleli w centrum. Gdy przedzierali się przez biedniejsze dzielnice, trzymali żądzę łupów na wodzy. Teraz, gdy dotarli do serca Hanzy, mogli dać jej upust. Klasę rządzącą Szczecina wyłapywano i rozstrzeliwano na miejscu.\nSplądrowano skarbce banków Raiffeisen i Millennium. Jedni zatrzymywali pieniądze, inni postanowili się podzielić. W tym celu ich wódz wojenny nakazał spędzić ludność cywilną na główną ulicę.\n- Jestem Helgi Fallöxi - oznajmił potężny wiking. W jednej dłoni trzymał worek banknotów, w drugiej wielki topór bojowy. Pod jego stopami leżał nierówno oddychający człowiek w podartym garniturze. - Przez dziesięciolecia bogaci was terroryzowali! Wyzyskiwali! W końcu sprzedali was Niemcom! Oto wasza odpłata!\n- Najpierw jednak musimy upewnić się co do waszej lojalności - ciągnął. - Musimy wiedzieć, że potraficie rozwinąć ducha wojownika i już nigdy nie dacie się ujarzmić. Ten, kto zabije tego człowieka, otrzyma dziewięćset tysięcy złotych.\nWiększość zgromadzonych nie wiedziała, czy to jakiś test. Wreszcie jeden mężczyzna wystąpił naprzód.\n- Ja to zrobię.\nPodszedł do wikinga i wziął jego topór. Huskarlowie Helgiego przygotowali miecze na wypadek, gdyby ochotniczy kat spróbował czegoś głupiego. Mężczyzna uniósł wikiński topór i trzymał go nad głową, patrząc więźniowi w oczy.\n- Proszę... - Twarz biznesmena była brudna od potu, popiołu i krwi.\nTopór mimo to opadł.\n- Niech będzie błogosławiony Tyr! - krzyknął Fallöxi, unosząc odciętą głowę straconego. Następnie ją odrzucił i wręczył obiecane pieniądze mężczyźnie. - Topór możesz zatrzymać. Użyj go, by kontynuować żniwa. Wszyscy możecie zyskać, jeśli przyprowadzicie nikczemnych na rzeź.\nW wielu sercach zapłonął karminowy ogień. Mężczyźni zaczęli szukać i bić bogatych członków elit ukrywających się w domach i piwnicach. Kobiety zrywały perłowe naszyjniki i złote kolczyki z ciał dam z wyższych sfer. Ocalałych przyprowadzano do Helgiego, który kazał huskarlom zapędzić ich do ewakuowanego wieżowca Hanza.\n- Wendowie nazwali tę drogę aleją Wyzwolenia - powiedział, gdy wszystkich bogaczy zamknięto w wieży. - Pokażę wam prawdziwe wyzwolenie!\nGrzmot materiałów wybuchowych zagłuszył tłum. W ciągu kilku sekund wieżowiec Hanza runął."
 jomsborg.23.a: "Krew dla boga krwi!"

 jomsborg.24.t: "Skål!"
 jomsborg.24.desc: "- Wiesz, gdybyśmy pili kieliszek za kieliszek, nie byłoby sprawiedliwie! Moja wątroba wystarczająco przeszła, żeby w ogóle miało to sens!\n\nŚmiech rozległ się po przytulnym mieszkaniu w Svinmunnirze. Była późna noc, a wnętrze oświetlała jedynie lampa pamiętająca zapewne Gomułkę. Jej właściciel był wówczas pewnie odrobinę za młody, lecz dziś stanowił... barwnego... tytana lewicy.\n\nJarl oczywiście dostrzegał w nim potencjał. Kto na jego miejscu nie zabiegałby o byłego prezydenta?\n\nZandberg siedział naprzeciwko w miękkim, skrzypiącym fotelu. Między nimi stała na wpół opróżniona butelka wódki i jeszcze zamknięta butelka dobrego miodu. Lekko podpity jarl odpowiedział:\n\n- Może i nie! Ale dobrze wiesz, panie Aleksandrze, że nie przyszedłem tylko pić. Chciałem omówić przyszłość naszej wspólnej sprawy.\n\nWyciągnął zza pasa wielki nóż myśliwski, zręcznie zerwał plombę i nalał płynnego złota do dwóch szklanek. Wręczenie jednej z nich było zdecydowanie najlepszym sposobem, by skłonić gospodarza do słuchania.\n\nAleksander wziął szklankę, lecz nim Zandberg zdążył się odezwać, sam przemówił:\n\n- Masz tupet! Przychodzisz pić do domu starego człowieka tylko po to, by rozmawiać o interesach! Niech zgadnę: chcesz, żebym wrócił do polityki?\n\nOpróżnił szklankę, uśmiechnął się z uznaniem do smaku i pozwolił olbrzymowi naprzeciw zabrać głos, który tak brutalnie chciał odebrać gospodarzowi.\n\n- Nie ująłbym tego w ten sposób, ale tak. Socjalistyczna sprawa nie może opierać się wyłącznie na zapale młodzieży. Proszę o pomoc człowieka z doświadczeniem potrzebnym do ukształtowania nowoczesnego ruchu.\n\nNim skończył mówić, Kwaśniewski niemal dopił drugą szklankę miodu. Rozejrzał się po pokoju, po starych meblach, których zawsze odmawiał wymienić. Wspomniał dobre dawne czasy i zaczął mówić:\n\n- Jesteś dobrym człowiekiem, Adrian. Wiesz o tym? Powiem ci tak. Dam ci nauczkę i przyjmę ofertę. Mam tylko jeden warunek..."
 jomsborg.24.a: "...musisz załatwić mi więcej tego miodu."

 jomsborg.25.t: "Ból rozstania"
 jomsborg.25.desc: "Artur, trzydziestokilkuletni pracownik handlu, spoczywał bezwładnie na kanapie, oglądając wiadomości i wcale ich nie słuchając. Nawet gdyby próbował, nie potrafiłby się skupić. Myśli pędziły, przepełnione lękiem o przyszłość. Po drugiej stronie mieszkania bawiło się dwoje małych dzieci. Jego zatroskana żona Łucja, która właśnie skończyła przygotowywać kolację, usiadła obok na podłokietniku.\n\n- Byłeś dziś strasznie cichy. Coś się stało?\n- Jutro.\n- Co jutro, kochanie?\n- Termin. Dzień, w którym kończy się moje życie. Nazywaj to, jak chcesz.\n- Minął już miesiąc? Ale nawet nie zdążyliśmy... - Przesunęła dłonią po jego włosach, próbując go pocieszyć.\n- Tak. Wiem. Zawsze będę za tobą tęsknił. Naprawdę wątpię, czy stamtąd wrócę.\n- Nie musisz iść. Zawsze możemy wyjechać. Mój wujek ma dom koło Stralsundu, pamiętasz? Załatwi ci papiery...\n- Przepraszam, ale nie mogę.\n- Artur, obiecałeś...\n- Wszędzie mają patrole. Nie przejdziemy przez granicę. Widzieliśmy, co robią ze schwytanymi. Nie podejmę takiego ryzyka.\n- Cholera, mówiłam, że powinniśmy wyjechać wcześniej. Dobrze, ile wynosi opłata?\n- Za dużo. Nie stać nas. Nawet w przybliżeniu.\n- To co, po prostu się poddasz? Możemy wziąć pożyczkę, pracować po godzinach... Przy dobrym gospodarowaniu w końcu ją spłacimy.\n- Policzyłem. To się nie uda. Wpadniemy tylko w spiralę zadłużenia.\n- I co z tego? Nie wycenię twojego bezpieczeństwa. Nieważne, ile to kosztuje, chcę, żebyś został ze mną.\n- Słuchaj, długo o tym myślałem. Nie chcę, żebyś przeze mnie przez całe życie ledwie wiązała koniec z końcem. Zasługujesz na więcej. Chłopcy też. Chcę, żeby mieli prawdziwą przyszłość.\n- Więc wolisz ich porzucić? Myślę, że woleliby przyszłość, w której nie muszą tracić ojca!\n- Ale nie żyjemy w takiej przyszłości, prawda? Robię to dla was wszystkich. Możesz chociaż nie utrudniać bardziej, niż już jest?\n- Utrudniać!? Powiem ci, co jest trudne. Samotne wychowywanie dwójki dzieci i codzienne zamartwianie się, czy jeszcze żyjesz!\n- Naprawdę robisz z tego problem dotyczący ciebie!?\n- Tak, ten JEDEN JEDYNY RAZ. Może twoje życie kończy się jutro, ale moje będzie trwało. Bez ciebie, bez nikogo... - Łucja wybiegła z płaczem."
 jomsborg.25.a: "Ostatnią noc przespał samotnie."

 jomsborg.26.t: "Kres Białego Wilka"
 jomsborg.26.desc: "Na skrzyżowaniu trzech dróg zgromadziły się dziesiątki huskarlów i walkirii. Stojąc w szerokim kręgu krzyczeli i wyklinali zagłuszając szum pobliskiego morza. Celem tych wszystkich szyderstw i wyzwisk była wynędzniała postać w brudnym mundurze - Wojciech Olszański, mimo zmęczenia stał wyprostowany chcąc zachować resztę dumy. W jednej ręce trzymał wyszczerbiony miecz, a w drugiej skórzaną, lekko wypłowiałą tarczę. Milczał wspominając swoje bitwy, od tych przed kamerą po te w lasach i spalonych wsiach. Nagle rozległ się potężny ryk, po którym nastąpiła cisza, zaburzana wyłącznie stukotem miarowych kroków. Oto do kręgu wszedł górujący nad wszystkimi, odziany w niedźwiedzią skórę, z toporem w każdej ręce Halfdan, a wraz z nim przyboczny, który stanął między nim a Wojciechem, rozwinął zwój i przeczytał:\n- Wojciechu Olszański, zostałeś wyzwany na holmgang przez Halfdana Sandbjerga za uporczywe działanie na szkodę ludu polskiego i republiki. Walczycie wybraną przez siebie bronią, bez możliwości zmiany zniszczonej tarczy, na śmierć i życie, a zwycięzca przejmuje cały majątek pokonanego.\n\nPo tym wojownicy stanęli krok od siebie, czekając dopóki nordycki herold nie wyjdzie z kręgu. Pierwszy zaatakował Duńczyk uderzając z góry, lecz Wojtek zablokował uderzenie tarczą, po czy spróbował cięcia z prawej, przeciwnik odskoczył w lewo, po czym ponownie uderzył z góry i ponownie został zablokowany. Znów rozległy się wściekłe krzyki pod adresem wyzwanego.  Wojtek wykonał pchnięcie, ale Halfdan cofnął się o krok, zaklinował miecz między trzonek a ostrze topora i wyrwał go z całej siły, wyrzucając ostrze na kraniec okręgu. Wiking zrobił to tak silnie, że na chwilę stracił równowagę, odsłaniając się i dając swojemu przeciwnikowi idealną szansę na atak. Jaszczur zamachnął się i z całą swoją furią przyłożył tarczą w głowę Sandbjerga. Ten zamroczony cofnął się parę kroków i widząc szarżującego ku niemu Jabłonowskiego sam ruszył ku niemu, koncentrując swój atak na osłabionej już tarczy. Wojciech Olszański usłyszał dźwięk pękającego drewna i chwilę później znajdował się na ziemi, widząc oszalałego Duńczyka, który odrzucił topory, rzucił się na niego i wymierzył mu w głowę cios. I kolejny. I kolejny. I kolejny. I nagle Wojtek znalazł się na zielonej polanie widząc wokół siebie ukochanych kamratów i żonę. Jego rodzinę."
 jomsborg.26.a: "Jego dom."

 jomsborg.27.t: "Zemsta to moje drugie imię"
 jomsborg.27.desc: "Przez lasy popiołu i bagna rozpaczy maszerowali berserkerzy z Jomsborga, nie ubrani w zbroję, ale w szał. Ich czerwone sztandary nie porywały wiatru, gdyż powietrze było ciężkie i gęste od mgły i znaków przepowiedzianej bitwy. Daleko od bagien dobiegł bezbożny syk, tysiące głosów sprzeciwu, po których nastąpiło wstrząsające wycie. Mieszkały tam Jaszczurki, partyzanci starego, opuszczonego narodu, z włóczniami śliskimi od jadu i oczami błyszczącymi od nienawiści. \n\n Zderzenie nastąpiło nagle - stal na kości, kły na ciele. Spotkali się w błocie, w błocie krwawili. Topory spadły jak grzmoty, tarcze roztrzaskały się jak drzewa podczas burzy. Zatrute strzałki przeszyły mięśnie, a pieniące się usta ryczały głośniej niż rogi. Jeden berserker rozłupał trzy Jaszczurki jednym zamachem, a jego topór zaśpiewał swój żelazny hymn, zanim utonął w czarnej wodzie. Inny, przebity pierś, uniósł wroga w górę i zębami rozerwał mu gardło. \n\n Bagno piło głęboko. Bagno było ołtarzem rzeźniczym. Kończyny wyrwane ze stawów, czaszki zmiażdżone na miazgę, ciała tonące, podczas gdy bąbelki unosiły się niczym upiorne modlitwy. Trzciny zakołysały się pod ciężarem trupów, a sama ziemia zrobiła się czerwona i parowała niczym kuźnia na polu bitwy. A mimo to walczyli. Godziny zamieniły się w dni. Dni zamieniły się w tygodnie. Tygodnie zamieniły się w wieczność. Na każdą śmierć odpowiedziała następna, na każdy krzyk ryk. Jaszczurki uderzały z drzew, z wody, z cienia. Berserkerzy odpowiedzieli ogniem, stalą i szaleństwem. Żadna ze stron nie ustąpiła. Żadna ze stron nie wygrała. Tylko bagno ogłosiło triumf.\n\nKiedy słońce w końcu przebiło się przez mgłę, jedynym mieszkańcem tych krain była cisza. Ziemię pokrywała wykładzina padliny, baseny były zatkane krwią. Kruki krążyły, a ich skrzydła były czarnymi sztandarami nad ogromnym królestwem umarłych. Berserkerzy, którzy wypełzli z bagien, nieśli na sobie piętno zagłady. Jaszczurki, które się wymknęły, złożyły przysięgę zemsty. \n\nI tak śpiewano: na Bagnach Czerwonych Smutków żaden człowiek nie jest zwycięzcą, żadna bestia nie triumfuje. Tylko śmierć, wieczna i nieprzerwana, wyryła swoją sagę w błocie i krwi. Ale ci, którzy przeżyli, na zawsze będą nosić ślady tych starć. I uczyni z nich najwspanialszych wojowników, którzy kiedykolwiek weszli do annałów naszej historii. Będą naszą żelazną pięścią w nadchodzących walkach."
 jomsborg.27.a: "Zrodzony z krwi"

 jomsborg.28.t: "Chrapiący Snorri"
 jomsborg.28.desc: "Dzień pierwszy: \n\n Nasz drakkar jest na pozycji, kotwica zarzucona. Widzimy Skraelingów obserwujących nas, obserwujących ich i otaczający ich horyzont. Celem blokady jest przechwycenie każdego ruchu, przychodzącego i wychodzącego. Normalnie rozmieścilibyśmy się poza zasięgiem ich cięższych dział, ale nie mamy do tego żadnych statków, a niezależnie od tego, jakie działo musieli zgromadzić, rzuca wokół nas pociski grzmotowe, co nie miało większego wpływu na nasze morale. Mogliby nas zbombardować w nocy, jeśli nic nie trafi, nie obudzi mnie nawet chrapanie kapitana Snorriego. \n Dzień 2 \n\n Pomyślałem, że tępota Skraelingów się wyczerpała lub, co bardziej prawdopodobne, skończyły się pociski, które (w dużej mierze) pasowały do ich armaty. Łowimy ryby, śpiewamy, patrzymy, jak drwią z nas. Środkowe palce i \"czarnoksiężnicy ojcojebcy\" to jedyne dwie rzeczy, które słychać. Potem widzimy trebusz i znowu się śmiejemy. Nie śmiejemy się długo. \n Wystrzelona z trebusza pralka leci w naszą stronę i uderza w tarczę naszej burty. Tarcza pęka, podobnie jak większość burty. Snorri budzi się z drzemki i spieszy na pomoc przy naprawach awaryjnych. Zabieram towarzysza ze zmiażdżonymi nogami, upewniając się, że straci tylko nogi, a nie życie. \n Dzień 3 \n\n Nogi Ivara, jak mówi kapitan, są połamane w kościach i należy je odesłać do domu. Nie będzie już chodził, ale może zaśpiewa jako skald i pamięć o nim przetrwa. Śpiewamy ku jego pamięci i honorowi, podczas gdy Skraelingowie wciąż drwią: Było jasne, że jedyne, co mogą w nas rzucić, to obelgi dotyczące \"ognistych, siarkowych grzmotów\". Nie mają odwagi niczego posłać w morze i nic tu nie przypływa. Tylko to się liczy."
 jomsborg.28.a: "W nocy przeklinali, a chrapanie Snorriego zagłuszało ich słowa."

 jomsborg.29.t: "Odyn was kocha"
 jomsborg.29.desc: "W dolinie Wieprzy, gdzieś niedaleko Sławna, nad niczym nie wyróżniającą się wsią, wstało słońce. Różnica polegała na tym, że zamiast koguta mieszkańców budził głośny pisk wyznawcy Kolonki. Stojąc na zepsutej pralce, agitator gromadził chłopów i innych mieszkańców wsi i napełniał ich głowę zamerykanizowanymi pomysłami. Żadnych usług publicznych, żadnych podatków, ograniczania rządu do minimum i tym podobne postulaty, które brzmią niesamowicie, ale są całkowicie sprzeczne z polityką Jomsborgu. Przekroczeniem granicy było agitowanie lokalnej ludności przeciwko \"nemesis\", wzywając do rewolucji. Wiadomość o tym dotarła do rządu centralnego i samego Karminowego Jarla, więc wysłano oficera politycznego, aby zaprowadził pokój w wiosce. \n\nPo wyczerpującej jeździe pełnej niezliczonej ilości grzęźnięć w błocie, na nierównych i mokrych wiejskich drogach przyjechała furgonetka. Zbigniewa, młodszego oficera, wysłano tutaj, na odludzie, aby wciągnąć prawicowego agitatora w debatę na rzecz lokalnej stabilności i dobrobytu ludzi. Westchnął, mając nadzieję, że to będzie przełomowy moment w jego karierze politycznej, chwycił notatki i wysiadł z vana. Z pluskiem ubrudził sobie garnitur błotem, \"Świetnie\" - pomyślał. Przewracając oczami, poprawił karminowy krawat i zaczął zbliżać się do małego tłumu otaczającego pralkę.\n\n - Nadchodzi agent diabła! - agitator krzyknął głośno. - Przybył, by odebrać wam wolność! Ukraść wasze pieniądze! Zmienić płeć waszych dzieci! \n \n Tłum podskoczył ze złości, a w ich rękach powoli pojawiały się widły i pochodnie. \n \n - Proszę, przyjaciele, rodacy, nie jestem tu po to, żeby robić jakąkolwiek z tych rzeczy. - odezwał się Zbigniew, przedzierając się przez wściekły tłum. - Rząd stara się tylko upewnić, że wszystkie wasze potrzeby i pragnienia zostaną zaspokojone! Każdy w kraju zasługuje na szczęście, zasługuje na szansę, równość i sprawiedliwość społeczną! \n - Nie słuchajcie czerwonego zdrajcy, on opowiada sagi słodkich kłamstw, żeby WAS KONTROLOWAĆ! - krzyknął Agitator jeszcze raz, nieco nie dostrzegając ironii swoich słów. - Odejdź i zabierz ze sobą swoje nikczemne, brudne ideały! \n \n Z piskiem metalu tylne drzwi furgonetki otworzyły się. Uwagę ludu przykuł brzęk kolczugi i chrząknięcie brodatego wojownika. Wszyscy na placu byli trochę oszołomieni, a Zbigniew westchnął i szepnął do siebie - \". To już piąty raz w tym tygodniu..\". Topór rzucony przez Wikinga niczym błyskawica z czystego nieba rozłupał głowę agitatora na pół, wprawiając tłum w panikę. \n \n - RAAAAA! ODYN KOCHA WAS WSZYSTKICH!!!"
 jomsborg.29.a: "Do następnej wioski..."

 jomsborg.30.t: "Spotkanie z Hellebjergem"
 jomsborg.30.desc: "Spotkaliśmy się z generałem NORDBAT, Hellebjergiem. Wyraził zainteresowanie współpracą z Jomsborgiem w przyszłości. Omówiliśmy możliwe wspólne ćwiczenia i programy szkoleniowe dla naszych żołnierzy. Generał Hellebjerg podkreślił znaczenie interoperacyjności między naszymi siłami i zasugerował, abyśmy pracowali nad wspólnymi protokołami komunikacyjnymi i taktyką. Uzgodniliśmy, że w nadchodzących miesiącach odbędzie się kolejne spotkanie w celu dalszego omówienia tych inicjatyw i umocnienia naszego partnerstwa. Chociaż był trochę onieśmielony obecnością naszego jarla, wydawał się chętny do współpracy z nami. Ogólnie rzecz biorąc, spotkanie było produktywne i położyło podwaliny pod silny sojusz wojskowy między Jomsborgiem a NORDBAT."
 jomsborg.30.a: "Ludzie Północy znów razem?"

 jomsborg.31.t: "Traktat Bornholmski"
 jomsborg.31.desc: "Podpisaliśmy z NORDBAT traktat dotyczący obrony regionu Morza Bałtyckiego. Traktat określa nasze wzajemne zaangażowanie w utrzymanie bezpieczeństwa i stabilności na tym obszarze, a także nasz wspólny interes w przeciwdziałaniu potencjalnym zagrożeniom ze strony aktorów zewnętrznych. Zgodnie z warunkami umowy zarówno Jomsborg, jak i NORDBAT będą prowadzić regularne wspólne patrole i ćwiczenia na Morzu Bałtyckim. NORDBAT nie będzie jednak brał udziału w żadnych operacjach ofensywnych inicjowanych przez Jomsborg. Traktat zawiera także postanowienia dotyczące wymiany informacji wywiadowczych i współpracy w kwestiach bezpieczeństwa morskiego. Ogólnie rzecz biorąc, umowa ta stanowi znaczący krok naprzód w naszych wysiłkach na rzecz wzmocnienia naszych partnerstw wojskowych i zapewnienia bezpieczeństwa w naszym regionie."
 jomsborg.31.a: "Mur tarcz na Bałtyku"

 jomsborg.32.t: "Rzut Wikingiem"
 jomsborg.32.desc: "Zwycięski władca Północy zasiadał uroczyście w słabo oświetlonym pubie Viking's Throw w Szczecinie, wspominając poległych braci. Wszyscy czekali i patrzyli na szlachetnego Halfdana Sandbjerg. Zgodnie ze starożytną tradycją, jarl miał jako pierwszy jeść i pić podczas uczty. Na jego podczaszego mianowano Adama Kościelaka. Przywódca Wikingów wciąż nie był pewien swojego przeznaczenia, ale jednego był pewien: był politykiem. Nadanie Kościelakowi kolejnych zaszczytów zapewniłoby mu pozycję zarówno w partii, jak i w armii. Wziął kielich i opróżnił go jednym łykiem. Spojrzał poważnie na swoich towarzyszy w holu. Następnie rzucił kielich i ryknął z radości. Zachęcona sala wybuchła własnym wrzaskiem.\nJarl miał bezpieczną pozycję. Jego zwolennicy byli gotowi naśladować go w najdrobniejszych szczegółach. To było inspirujące. Ale i męczące. Powstrzymywanie się od monokracji w partii było nie tylko wyrazem przywiązania do egalitaryzmu, ale dobrym sposobem na uniknięcie zbyt dużej pracy wykonywanej przez jedną osobę. Zwłaszcza jeśli tą osobą był Zandberg. Aby odpędzić zmartwienia ostatnich miesięcy, jarl gestem poprosił o więcej miodu pitnego. Wciąż jednak za mało. Teraz jego umysł zajęły wspomnienia tych chorobliwych duchów przeszłości. \n - Podczaszy, następna kolejka! \nKościelak prawie rozlał napój. Zandberg uważał, że gdyby nie potrzeba politykowania, zatrudniłby kogoś bardziej kompetentnego. Dlaczego naprawdę musi tak być? Marcelina i Magda, siedzące tak blisko niego, uniosły się. Powinni być jego przyjaciółmi. Zamiast tego bawią się frakcyjnością.\n- Właściwie to przynieś mi dwie kolejki, Adam.\n\n- A co robi ten... co ten bezprzewodowy trup, wie *hic* o wikingach, że chce mojego ciała. Wiem już wszystko z sagi. Jestem wikingiem! Ha! Najlepszy od czasów Harolda Silnorękiego *hic*. - Zandberg zaczął się kłócić sam ze sobą. - Czy ktoś w to wątpi?\nWstał i skierował się na środek sali.\n- Ty - wskazał na przypadkowego Wikinga - Wiesz, kto jest największym wikingiem wszechczasów?\n- Erm, prawdopodobnie Ragnar Lothbrok.\nAh, kolejny wątpił w jego waleczność. Pogrążony w żalu Zandberg uderzył niezdecydowanego żołnierza.\n- A gdzie jest teraz Ragnar Lothbrok? Jestem najlepszy! Czy ktoś w to wątpi? Walcz ze mną! Przekażę jarlostwo temu, kto mnie pokona!\nNiewielu podjęło wyzwanie. Ci, którym się to udało, padli pod potężnymi ciosami Potężnego Duńczyka. Jeden został nawet rzucony na stół.\n- Ok, wystarczy! - Ktoś próbował ujarzmić jarla słowami!\n- Kto się odważy... o, to... Ty, Marcelinko - Zandberg z trudem utrzymywał się na nogach.\nWkrótce dołączyła do niej Magda.\n- Wynośmy się stąd."
 jomsborg.32.a: "*hik* Dlaczego? Nie widzicie, że wygrywałem?"

 jomsborg.33.t: "Stary niedźwiedź mocno śpi"
 jomsborg.33.desc: "Po długiej podróży z \"Viking's Throw\", Zawiszy i Biejat w końcu udało się namówić Zandberga, aby położył się do łóżka w zarezerwowanym przez nich pokoju hotelowym. Wielki karminowiec spał teraz spokojnie, głośno chrapiąc nad miską wymiocin. \nZawisza wyszła z pokoju, żeby zaczerpnąć świeżego powietrza. Na zewnątrz spojrzała na brzeg i zdała sobie sprawę, że cały proces zajął im tak długo, że słońce już wzeszło. Biejat wkrótce dołączyła do swojej koleżanki. \n - Jak idzie sianie fermentu? - Zawisza zapytała Biejat, wciąż patrząc na wschód słońca. \n- Rzeczywiście świetnie - blask entuzjazmu Biejat zawstydził nieśmiałe poranne słońce - Odwołanie pierwszego Altingu wyszło nam na dobre. Mamy więcej czasu na przygotowania. Również dlatego, że teraz całe Pomorze Zachodnie jest pod naszą kontrolą, możemy sięgnąć do większej bazy wyborczej, aby wszystkie wybory mogły być jak najbardziej demokratyczne. \nZawisza uniosła brwi i skierowała wzrok na Biejat. Wiedziała, dokąd to zmierza. \n - To nie było częścią planu. Plan był taki, żeby frekwencja była jak najniższa, dlatego do naszej polityki musimy przekonać jak najmniejszą liczbę wyborców. \n- Tak, właśnie to zrobiłam. - Głos Biejat pozostał spokojny - przekonałam jak największą część starej gwardii. Dotarłam do wiernych socjalistów, ale to nie wystarczyło. Ci pierwsi czczą Zandberga, a tych drugich jest mniej. Musimy postawić na ilość. \n- A jak myślisz, kogo przyciągniesz? - Frustracja Zawiszy rosła. - Wiesz, z liberałami nie da się dyskutować. \nBiejat wzięła głęboki oddech, spojrzała na koleżankę. \n- Wiesz, że my chcemy tego samego, Marcelino - powiedziała kobieta z delikatnym, uspokajającym uśmiechem - Ale potrzebujemy sojuszników i ja mogę się tym zająć. Jeśli myślisz, że tak ważni są żelazny elektorat i partia, może skup się na Adamie i jego rosnącym przywiązaniu do ekscesów Zandberga. \n- Och, myślisz, że to moja wina, że dorosły mężczyzna chce udawać Wikinga? \n- Nie, nie to miałem na myśli. - Biejat pozostała w defensywie - To tylko sugestia. \n- Nieważne - Zawisza była zmęczona nieprzespaną nocą i tymi wszystkimi grami. - Rób co chcesz. Przecież burżuje nie wsadzili cię do więzienia, ale na twoim miejscu nie nadwyrężałabym swojego szczęścia."
 jomsborg.33.a: "Pęknięcia w monolicie"

 jomsborg.34.t: "Inność w polityce jest możliwa"
 jomsborg.34.desc: "Wielka Armia Północy zebrała się na Srebrnej Górze w Jomsborgu. Po raz kolejny. Członkowie frakcji Zawiszy i Biejat mieli nadzieję, że ten ting nie zostanie rozwiązany przez Zandberga. Na szczęście dla nich, tym razem Jarl był obecny. Siedział na drewnianym tronie i wydawał się być w dość ponurym nastroju. \nMagdalena Biejat patrzyła na wszystkich, którzy przyszli wyrazić swoje zdanie. Liczba wojowników rosła wykładniczo. Była też spora liczba cywilów, która zdała sobie sprawę, że Ludowa Republika Jomsborga jest lokalnym hegemonem i że dobrym pomysłem byłoby, aby ktoś miał coś do powiedzenia na temat nowego reżimu. Tak naprawdę morze chętnych do wzięcia udziału było tak rozległe, że nie było wystarczającej liczby głośników, aby wszyscy mogli słuchać. Biejat przygotowywała się do wygłoszenia przemówienia w imieniu swojej frakcji do wszystkich tych ludzi. \n - Witamy na drugim Altingu! - Adam Kościelak zachował urząd marszałka - W imieniu naszego jarla oddaję głos członkini rady - Magdalenie Biejat. \n - Dziękuję - Biejat żałowała, że najlepsze wprowadzenie poszło na marne na rzecz bałaganu, jakim był pierwszy Alting\n- Teraz twardo stoimy na ziemiach zabezpieczonych przez waleczny wysiłek naszej armii. Postęp militarny został osiągnięty tak szybko, że wielu z nas martwi się, co zrobi, gdy nie będzie już nic do zdobycia. \n- Słabeusze! - krzyczeli niektórzy z tłumu - Walka nigdy się nie kończy! \n- Chodzi o powrót do demokracji, o korzyści dla niepełnosprawnych cywilów i żołnierzy oraz o uczciwą gospodarkę. \n- Tchórze, którzy nie chcą walczyć, nie zasługują na litość! - Tłum stawał się coraz bardziej agresywny w swoim tonie. \nAdam Kościelak patrzył na wściekłe zgromadzenie krwiożerczych berserkerów ze zrozumiałym strachem. Potem rzucił szybkie spojrzenie na Zandberga, szukając aprobaty, ale twarz jarla ani drgnęła. \n - Jak dotąd sposoby Odyna dobrze nam służyły i są zgodne z lewicowymi wartościami, które wszyscy podzielamy. - argumentował Adam - Nigdy po roku 1989 nie było bardziej skutecznego sposobu redystrybucji bogactwa, nawet ze strony duchowieństwa. Ekologia nigdy nie była bardziej popularna wśród wszystkich klas społecznych niż obecnie. \n - Ale ty przede wszystkim powinieneś wiedzieć o występujących zniekształceniach. W dużej mierze trzymasz się starych sposobów. \n- Nie, Magdo. To ty nie zdajesz sobie sprawy, że twoje poglądy są przestarzałe. Nie możemy utrzymać tego samego programu, jaki proponowaliśmy przed Upadkiem. Świat się zmienił i musimy dostosować się do tej brutalnej rzeczywistości, narzucając nasze ideały etosem wojownika. Kto jest ze mną? - pytanie było skierowane do tłumu. \nWiększość wojowników kibicowała Kościelakowi. \n- A kto nadal wierzy, że inna polityka jest możliwa? - Biejat postanowiła policzyć wierne jej topory. \nZwolennikami jej byli głównie cywile. W sumie był podział 50/50. \nNastępnie Zandberg podniósł rękę i opuścił pole zgromadzeń."
 jomsborg.34.a: "Drugi Alting dobiega końca!"

 jomsborg.35.t: "Kroniki omdlenia"
 jomsborg.35.desc: "Powolny spacer Heleny do supermarketu, zwykle nudny i spokojny, zatrzymał się nagle, gdy zauważyła plakat przyklejony do witryny sklepu. W ciągu prawie siedemdziesięciu lat swojego życia nigdy nie widziała czegoś tak oburzającego. Nawet ten diabelski Tusk i cholerni niemieccy okupanci nie zachwiali jej poglądów tak bardzo, jak obraz przed nią teraz: dwóch mężczyzn trzymających tęczową flagę, napadających na kościół w jej dzielnicy. Ci Wikingowie już gotowali krew w jej żyłach, ale to było coś zupełnie innego. Te przeklęte hasła LGBT na oficjalnym plakacie rządowym? \n\n Dla niej było to całkowicie szokujące. Wydawało mi się to głęboką obrazą każdego katolika w regionie. Jak to możliwe, że właśnie w Polsce, spośród wszystkich miejsc, legalizowano te tzw. \"partnerstwa\"? Ten szaleniec, Zandberg, Sandbjerg, czy jak tam się nazywał, niszczył podstawowe wartości i tożsamość Polski. W jej oczach każdy, kto kwestionował władzę Kościoła, był poważnym grzesznikiem, skazanym na smażenie się w piekle. \n\nA gdy szła dalej, otaczające ją plakaty tylko pogłębiały jej niepokój. Homoseksualna kobieta paliła na stosie kilku liberałów, co wydało jej się dziwnie satysfakcjonujące. Jednak z każdym krokiem Helena czuła, że słabną jej siły, a spokój ducha słabnie. I wtedy to zobaczyła - ostatnią kroplę która przelała czarę goryczy. Dwóch wysokich, brodatych mężczyzn, wyraźnie homoseksualnych, trzymających się za ręce i całujących się, z toporami po bokach. Jej serce zamarło. To przeszło jej wszelkie wyobrażenia. \n\nTo było jak cios zadany Helenie. Natychmiast upadła i zemdlała na chodniku. Przechodnie szybko zebrali się wokół i bez chwili namysłu robili zdjęcia. Dopiero interwencja Wikingów, którymi tak pogardzała, przyniosła realną pomoc. Przenieśli wątłą staruszkę w cień supermarketu i cierpliwie czekali, aż odzyska przytomność. \n\n- Chwała Odynowi, co się z nią stało? \n\n- Myślę, że pasztecik musiał jej zaszkodzić, paskudna rzecz. Jak ktoś może to jeść?\n\nHelena powoli odzyskiwała przytomność i z trudem wstała.\n\n- Święta Maryjo, miałam taki straszny koszmar. Widziałam homoseksualnych Wikingów na ulicach Szczecina.\n\n Kiedy spojrzała na mężczyzn, tych z jej tzw. koszmaru, krzyknęła i ponownie zemdlała. Obaj Wikingowie spojrzeli na nią całkowicie zdezorientowani, wymieniając spojrzenia, jakby zastanawiali się, czy powinni wezwać karetkę, czy po prostu wrócić na lunch.\n\nJeden w końcu wzruszył ramionami i wymamrotał: \n\n- A myślałem, że dzisiejszy dzień będzie nudny.\n\n To powiedziawszy, odeszli, zostawiając Helenę leżącą w cieniu supermarketu, wciąż drżącą z powodu koszmaru, który stał się śmiesznie realny."
 jomsborg.35.a: "Nowa rzeczywistość?"

 jomsborg.36.t: "Przez topór do serca"
 jomsborg.36.desc: "Wniosek o pozwolenie na noszenie miecza. Testament określający, kto będzie niewolnikiem spadkodawcy. Oraz archiwizacja i digitalizacja papierowej transkrypcji najnowszego kamienia runicznego Jarla. A wszystko to w ramach codziennej pracy typowego biurokraty nowego reżimu. Niektórzy młodsi pracownicy ratusza mieli trudności z adaptacją, ale Kazimiera Jędrzejak przeżyła już jedną pozornie diametralną zmianę ustroju; mogłaby to zrobić jeszcze raz. Nagle ciszę w biurze przerwały głośne odgłosy, jak gdyby ktoś dławił się śledziem. Najwyraźniej ktoś tuż przed pokojem Kazimiery prowadził ożywioną dyskusję po duńsku. Wkrótce pojawili się dwaj sprawcy; Zbroja, którą nosili, wskazywała, że służyli w armii jarla. \n- Dzień dobry - powiedział jeden z nich wyraźnie polską - ja i mój mąż pobraliśmy się jeszcze w Danii, kiedy Alþýduher jeszcze stacjonował na Bornholmie. Chcielibyśmy transkrypcję naszego aktu małżeńskiego, aby był on legalny tutaj w Polsce. \n- Obawiam się, że obecne prawo to uniemożliwia - odpowiedziała monotonnie Kazimiera - Jeśli interesują was typowe korzyści płynące z małżeństwa, możecie złożyć wniosek o współwłasność w pokoju 4, w pokoju 16 możecie uregulować kwestię dziedziczenia drakkarów, a w pokoju 6 możecie upoważnić kogokolwiek do otrzymywania adresowanych do was pism lub uzyskania informacji o stanie zdrowia po bitwie. Należy pamiętać, że niektóre usługi wymagają dodatkowej opłaty. \n - Wygląda na to, że nie rozumiesz. - Składający petycję pozostawał nieustępliwy. - Mój mąż ma córkę z poprzedniego małżeństwa. Jeśli umrze w czasie wojny, dziewczyna, którą z nim wychowuję, nie będzie miała nikogo, kto by się nią zaopiekował. \n - Rozumiem całkowicie - biurokratka nie odnosiła się zbyt życzliwie do kogoś, kto fałszywie sugerował jej niekompetencję. - Dziewczynka otrzyma numer PESEL, akt urodzenia i paszport, w którym będzie można wpisać tylko samotnego ojca i samotną matkę. Jeśli coś stanie się jej ojcu, zostanie odesłana do rodziny w Danii lub umieszczona w sierocińcu. \n - Ja pierdolę! - petent miał już dość. Mąż próbował go uspokoić, lecz daremnie.\n- Wyznajemy bogów kazirodztwa, gwałtu i zmiany płci, ale nie takich gdzie dwoje kochających się ludzi nie może uzyskać dokumentu legalizującego już zawarte małżeństwo? \n - Tak, ma pan rację. - Biurokratka spojrzała znad okularów. Mężczyźni spojrzeli na siebie nieco zdezorientowani.\n- W przypadku nagłej deifikacji, Pan i Pański partner możecie odnowić petycję w celu otrzymania transkrypcji małżeństwa. Do tego czasu uważam sprawę za zamkniętą. Czy jest coś jeszcze, w czym mogę wam pomóc?"
 jomsborg.36.a: "Nie wszystkie bitwy są do wygrania"

 jomsborg.37.t: "Wśród braci"
 jomsborg.37.desc: "Dni mijały, a Paweł coraz bardziej czuł, że nie należy do Wikingów. Byli potężnymi wojownikami, nieustraszonymi w obliczu śmierci, chodzącymi ucieleśnieniami siły i męskości. A on? Był gejem. W jego umyśle obraz idealnego wojownika boleśnie zderzał się z tym, kim był. \n\nPrzez wiele najazdów Paweł dumnie walczył u boku swojego oddziału berserkerów, bez wahania paląc kościoły i plądrując miasta. W bitwie czuł, że żyje. Równy. Ale ostatnio, po wypiciu zbyt wielu piw, wyznał swój sekret jednej ze swoich towarzyszek broni. Od tego czasu wątpliwości nękały go dzień i noc.\n\nKiedy zaprosili go do miejscowej tawerny, był pewien, co go czeka: kpina, odrzucenie i odmowa dalszej walki u jego boku. Uważał, że w Walhalli nie ma dla niego miejsca. Jednak bez względu na konsekwencje stawiłby im czoła jak wojownik.\n\nKiedy Paweł wszedł do tawerny, zmusił się do uśmiechu. Jego towarzysze byli głośni i radośni, świętując swoje niedawne zwycięstwa. Siedząc wśród nich, Paweł czekał, aż ich życzliwość przerodzi się w obrzydzenie. Przeżywał to już wcześniej, w szkole, w domu, więc nie było to nic nowego. Mimo to cisza mocno go przytłaczała. Zniknął jego zwykły gadatliwy i beztroski charakter, co szybko zauważyli jego koledzy. Karol, jeden z nich, postanowił przerwać niezręczną ciszę i zapytać, co się dzieje.\n\n- Piwo Ci nie smakuje, Paweł? Co się stało? Zwykle nie jesteś taki cichy i nudny!\n\n- Och, nic, naprawdę nic, Karol... Po prostu wiesz.\n\n- Nie bądź pizdą i dawaj śmiało. Nie będziemy tu siedzieć i się smucić, kiedy mamy tyle powodów do świętowania!\n\n- Skończmy z tym wreszcie. Wiem, jestem gejem, nie pasuję tutaj i nigdy nie znajdę swojego miejsca w Walhalli!\n\n Towarzysz ucichł na chwilę, a potem wszyscy wybuchnęli śmiechem.\n\n- Kurczę, bracie, naprawdę myślałeś, że cię za to osądzaliśmy? Chyba żartujesz! Nie ma z tobą nic złego. Powiedziałbym nawet, że masz więcej odwagi niż my wszyscy razem wzięci. W pojedynkę zabiłeś 5 Skraelingów wyglądających jak diabeł prosto z piekła rodem! Masz wszystko, co Odyn podziwia i to że podobają Ci się mężczyźni tego nie zmieni!\n\nWszyscy klepali go po plecach, okazując swoje wsparcie. Uprzedzenia towarzyszyły mu przez całe życie, począwszy od rodziców, nauczycieli i ludzi, którzy nazywali siebie przyjaciółmi. Nauczył się oczekiwać odrzucenia, zanim ono nadejdzie. A jednak tutaj, wśród najeźdźców i zabójców, znalazł akceptację.\n\nCała kompania wstała od stołu, podnosząc kubki. Paweł stał razem z nimi, a głos mu się łamał, gdy krzyczał, szczęśliwszy niż kiedykolwiek w życiu:"
 jomsborg.37.a: "TILL VALHALL!"

 jomsborg.38.t: "Zatroskani przyjaciele"
 jomsborg.38.desc: "Najbliżsi doradcy Zandberga poprosili o audiencję. Żądający ton wiadomości rozwścieczył go. Był jarlem, a nie jakimś chłopcem na posyłki. Skierował swoją wściekłość na manekiny na placu treningowym. Później, gdy ochłonął, ponownie uznał, że takie spotkanie byłoby bardzo zgodne z ideą kolektywnego przywództwa. W swej mądrości postanowił udać się do sali konferencyjnej. \nW nim znalazł całą radę. Wszyscy spojrzeli na niego ze współczuciem. \n- Martwimy się o Ciebie, Adrian - Biejat, jak zawsze zaczęła dyplomatycznie. \n- Przez te ostatnie... lata nie byłeś sobą - Zawisza jak zawsze trzymała się faktów. \n- Twoje... nastawienie pomogło nam w przeszłości, ale czasami wydaje nam się, że się zatracasz - Kościelak był wciąż niezdecydowany. \n - Dlatego nadal Cię wspieramy, ale myślę, że powinieneś poszukać profesjonalnej pomocy. - Grucela zakończył rzeczową konkluzją. \n- Rozumiem - Zandberg postanowił przekonać swoich zmartwionych towarzyszy - Ja też na początku się bałem, ale z czasem zacząłem akceptować fakt, że zostałem pobłogosławiony darem. Jeszcze nie wiem, jak to wykorzystać, ale jest to coś, co pomoże nam zjednoczyć Polskę i ukształtować ją w sposób, o jakim zawsze marzyliśmy. Myślałem, że to rozumiałeś, Adamie - Kościelak ze wstydem spuścił głowę i próbował się wytłumaczyć.\n - Dobrze nam służyło, gdy byliśmy słabszymi na północy. Ale wiesz, że Wikingowie zmienili swoje podejście, gdy wyruszyli poza Skandynawię. \n - Nie jesteśmy specjalistami - Grucela kontynuował ofensywę - ale patrząc na to, wydaje mi się, że cierpisz na jakąś chorobę psychiczną. \n- Rozumiem - odpowiedział ponownie Zandberg - Myślałem to samo, ale widzisz, cały sens chorób psychicznych polega na tym, że cierpisz z ich powodu. A odkąd zaakceptowałam, że mogę rozmawiać z duszami Wikingów, nie cierpię. \nZawisza przewróciła oczami\n- Właściwie czuję się świetnie. - kontynuował Zandberg - Widzę wszystkie te możliwości i zdaję sobie sprawę, że tylko ja mogę poprowadzić ludzkość w tej nowej erze. Duchy nie stanowią problemu, jeśli ciągle przelewam krew wrogów. Ale to dlatego, że jesteśmy w stanie wojny.\n- A co będzie, jeśli wojna się skończy? - wtrącił Kościelak.\n- Nie sądzę, żeby to kiedykolwiek nastąpiło. Wrogowie chowają się wszędzie. Zawsze. - przywódca wojenny zastanowił się przez chwilę - Jakie są wasze warunki?\n- A co jeśli duchy zaczną żądać więcej? Nie możemy wykluczyć choroby psychicznej wyłącznie na podstawie kaprysu. To właśnie zawsze oddzielało nas od konfederatów i innych tego rodzaju typków - To naprawdę zabolało Zandberga.\n- Dobra, jeśli zacznę się źle czuć, poszukam pomocy.\n- Chyba już przeszukaliśmy oferty - Grucela wręczył mu kartkę."
 jomsborg.38.a: "Patryk Łodzianin, Psy.D."

 jomsborg.39.t: "Rúnatal"
 jomsborg.39.desc: "Najbliżsi doradcy Sandbjerga poprosili o audiencję. Żądający ton wiadomości rozwścieczył go. Był jarlem, a nie jakimś chłopcem na posyłki. Skierował swoją wściekłość na manekiny na placu treningowym. Był jarlem! To on powinien żądać obecności. Na co przydała mu się ich rada? Huginn i Muninn dzielą się z nim wiedzą. Mimo to postanowił zaszczycić swą osobą radę. Ze względu na dawne czasy. \nW sali konferencyjnej zastał całą w komplecie. Wszyscy spojrzeli na niego z niepokojem. \n- Martwimy się o Ciebie, Adrian - Biejat, jak zawsze zaczęła dyplomatacznie. \n- Przez te ostatnie... lata nie byłeś sobą - Zawisza jak zawsze trzymała się faktów. \n- Twoje... nastawienie pomogło nam w przeszłości, ale czasami wydaje nam się, że się zatracasz - Kościelak był wciąż niezdecydowany. \n - Twoje ostatnie reformy kierują nas bardziej w stronę autokracji. Uważamy, że jest to spowodowane twoim stanem. Uważamy, że powinieneś poszukać profesjonalnej pomoc. - Grucela zakończył rzeczową konkluzją. \n- Ja... czy wygląda na to, że się zatraciłem, Adam? - zapytał retorycznie Sandbjerg - Wręcz przeciwnie. Czuję głęboką więź z moimi przodkami, którzy prowadzą mnie, a przeze mnie, Was do zwycięstwa. W ciągu ostatnich miesięcy nasz ruch osiągnął więcej niż przez ostatnią dekadę. \n - Ale jakim kosztem? - Grucela nalegał - Autorytaryzm jest sprzeczny ze wszystkim, za czym się opowiadamy.\n - I tu się mylisz, przyjacielu. - Jarl odpowiedział spokojnie i wyrecytował - Powiesiłem się na tym wietrznym Drzewie. Całe dziewięć dni i nocy, dźgnięty włócznią, ofiarowany Odynowi, sam sobie oddany, wysoko na tym Drzewie, o którym nikt nie słyszał, z którego korzenia ono wznosi się do nieba. Wkrótce wydałem owoc i kwitłem w pełni, rosłym i zyskiwałem mądrość; Słowo za słowem, znalazłem słowa, czyn za czynem, dokonywałem czynów. \n\n - Co to ma niby oznaczać? - Zawisza w końcu przerwała ciszę. \n - Znam znaczenie run. Wiem, jak je czytać. Ludzie mogą już swobodnie wchodzić do mojego umysłu, ponieważ akceptuję ich i troszczę się o nich. Niedługo i oni mi całkowicie zaufają i wtedy będę mógł wejść do ich umysłów. Wtedy demokracja nie będzie potrzebna. \nZawisza spojrzał na Grucelę z wyrzutem. Biejat była zdezorientowana. Kościelak był jednocześnie przestraszony, ale i zafascynowany. Było jasne, że Grucela miał jakiś plan dotyczący tego, jak rozmowa ma wyglądać. I prawie nic z tego nie wyszło. \n - Myślę, że na dzisiaj już skończyliśmy - oznajmił Jarl, zanim ktokolwiek zdążył cokolwiek pomyśleć, i skierował się w stronę wyjścia."
 jomsborg.39.a: "- I co my teraz z nim zrobimy?"

 jomsborg.40.t: "Stąd przychodzą dziewice..."
 jomsborg.40.desc: "Kolejna bezsenna noc nękała Karminowego Jarla. Przewracał się na łóżku z boku na bok. Po dwóch godzinach prób przyzwania Njöruna postanowił zmęczyć się jazdą konną. Wyruszył na wiejskie ścieżki i podziwiał, jak światło księżyca spowijało podbite przez niego ziemie. W końcu natknął się na starą, pustą wioskę. Nie splądrowaną, lecz porzuconą. Składała się z domów o białych ścianach przeciętych ciemnymi drewnianymi belkami. Ich dachy były wykonane głównie ze strzechy. Część z nich pokryta została dachówką. W centrum wsi znajdowała się stara kamienna studnia. Zandberg podszedł do niej i wrzucił monetę na szczęście. \n - Życzysz sobie dobrej przyszłości? - Od razu po uderzeniu monety w taflę zabrzmiał kobiecy głos\n- Chyba, przecież nie można życzyć sobie dobrej przeszłości. Kim jesteś? - powiedział Zandberg oglądając się za siebie. Kobieta miała na sobie zieloną sukienkę i miała blond włosy. Minęła go i podeszła zaczerpnąć wodę ze studni. \n- Kogo pytasz? - Kobieta nie spojrzała na niego. Skupiła się wyłącznie na opadającym wiadrze. \n- Niegrzecznie jest nie odpowiadać na pytanie. Zwłaszcza, gdy jarl o to pyta. \n- Pij - podała mu wiadro wody ze studni - Wyglądasz na spragnionego.\n Coś hipnotycznego w jej głosie namawiało go, aby zrobił, co kazała.\n - Jestem Urðr, jedna z Norn - sióstr losu - powiedziała Zandbergowi, gdy ten wziął pierwszy łyk. \nJarla wzrok zaczął się zamazywać. Jeszcze raz zobaczył więzienie, w którym był przetrzymywany. Pamiętał zdradę, swoje przepowiednie, w które niewielu wierzyło, i niesprawiedliwość, jakiej doświadczyli uciskani. Trudności, z jakimi borykała się jego wspólnota jako uchodźcy na Bornholmie. \n - Tak wiele gniewu, tak wiele bólu - Urðr towarzyszyła jarlowi. Dotknęła jego twarzy - Jednak nie zawsze tak było, prawda? \n Wzięła go za rękę i zeszła dalej po schodach pamięci. Zandberg widział czasy przed Upadkiem. Obrazy nigdy wcześniej nie były tak żywe. Widział rozległe morza młodzieży zainspirowanej jego przemówieniami przeciwko nadużyciom wyborczym. Widział, jak członkowie Razem gratulowali mu występu w debacie prezydenckiej w 2015 roku. \nJeszcze głębiej. Widział dzieciństwo w Danii. On sam jako mały chłopiec. Jego rodzice, którzy opuścili wygodną, socjaldemokratyczną Danię, aby odpowiedzieć na wezwanie domu nękanego przez złego dyktatora, któremu wydawało się, że wie wszystko. Przypomniał sobie swoją krótką karierę dziecięcego aktora i zaszczyt bycia jedną z pierwszych osób korzystających z Internetu w Polsce.\n Zamrugał i wrócił do wioski. Wiadro w jego dłoni było puste, a Urðr nigdzie nie było. \nWsiadł na konia, wrócił do swojej komnaty i natychmiast zasnął."
 jomsborg.40.a: "Yggdrasil rośnie dzięki studni Urðr"

 jomsborg.41.t: "Pod czujnym okiem Odyna"
 jomsborg.41.desc: "Inwazja socjalistycznych Wikingów przyprawiała wielu przedsiębiorców o rozdzierający ból głowy. Dla Patryka Halina dawało to pewność. Wiedział, że w końcu po niego przyjdą. Przez wiele dni żył w stanie przerażenia, spał w swoim biurze, wzdrygał się przy każdym pukaniu i modlił się znacznie więcej niż kiedykolwiek wcześniej.\n\nZ wyprzedzeniem spisał swój testament. Czasami próbował się uspokajać, że jego firma była mała, nieistotna, a on nie złamał żadnego prawa. Jednak pewność siebie słabła za każdym razem, gdy z regionu napływały nowe doniesienia o skonfiskowanych fabrykach, publicznych procesach i śmierci wielu dyrektorów generalnych, których największą zbrodnią było odniesienie sukcesu. Skoro oni mogli upaść, to on też.\n\nW desperackiej próbie udobruchania nowego rządu Patryk z dnia na dzień podniósł płace, ściskając dłonie pracownikom, którzy patrzyli na niego z niedowierzaniem. Codziennie uczęszczał do kościołów, które nie były jeszcze napadnięte, za każdym razem modląc się coraz dłużej. To nie miało żadnego znaczenia. Wysłannicy przybyli pewnego szarego poranka. Patryk zabarykadował się w swoim biurze, dociskając szafki do drzwi, serce biło mu mocno, gdy negocjacje ciągnęły się prawie pół godziny. Kiedy w końcu ich wpuścił, ręce mu się trzęsły.\n\nZapewniali go, że go nie zabiją, a on zastanawiał się, na ile uczciwości barbarzyńcy mogą sobie pozwolić. Patryk usiadł ciężko, opierając łokcie na biurku, splatając palce i wpatrując się w ludzi, którzy teraz byli właścicielami jego losu. Patrzyli na siebie przez kilka minut, a cisza przecinała atmosferę niczym ostry nóż. W końcu odezwał się jeden z wysłanników.\n\n- Pragniemy poinformować, że od tego dnia zakończył się Pański wyzysk pracowników. Twoja firma zapłaci znacznie więcej podatków, a my będziemy monitorować działania wobec Twoich pracowników. Powinieneś traktować ich uczciwie, inaczej nasza następna wizyta nie będzie już tak przyjemna. Pamiętaj, że pod czujnym okiem Odyna i Jarla Halfdana nic nie pozostaje niezauważone. Dziękuję za współpracę.\n\nPatryk stał w bezruchu jeszcze długo po zamknięciu drzwi. Nie przejęli firmy. Nie wywlekli go na ulicę i nie ścięli mu głowy. Regulowali go. Na pierwszym miejscu była ulga; po czym wybuchnął krótkim, łamliwym śmiechem. Na razie wyszedł z tego cało. Ale zrozumiał, że era drobnych intryg i cichego wyzysku dobiegła końca. Przez miesiące, a może nawet lata, nie podejmował żadnych wątpliwych prób. Wiedział, że druga wizyta nie zakończy się ostrzeżeniem, ale bolesnymi konsekwencjami."
 jomsborg.41.a: "Równość niesiona na mieczach."

 jomsborg.42.t: "Powiernicy Andvaranauta"
 jomsborg.42.desc: "Karola obudziło oślepiające światło reflektorów sceny. Właściwie to nigdy nie spał, ale po trzeciej godzinie ciągnięcia w łańcuchach ze swojej posiadłości wszedł w taki stan oderwanej beznadziejności, że równie dobrze mógł sobie wyobrazić całą podróż. Jego oczy nie były jeszcze przyzwyczajone do jasności, ale słyszał już znajomy grzechot, tyle że teraz towarzyszyło mu czterech kolejnych nieszczęśników. Po wejściu po trzech stopniach na główną platformę w końcu usłyszał ogłuszający szum, który wcześniej był nie do zniesienia. Setki wściekłych głosów wrzeszczących i obrzucających obelgami skazanych. W tym momencie zrozumiał swój los. \n\n - Cicho! Zachowujcie się, chłopi! Czy nie wiecie, kto stoi przed wami? - Na rozkaz wojownika tłum ucichł, pozostawiając jedynie szydercze miny. Nareszcie Karol mógł wreszcie usłyszeć własne myśli. \n\n - Tak lepiej. Nie chcielibyśmy teraz sprawiać złego wrażenia, prawda? Sigmundrze, uwolnij naszych finalistów z łańcuchów! \n\n Mając wolne ręce, potentat rozejrzał się po arenie w poszukiwaniu potencjalnej drogi ucieczki. Dwa boczne wyjścia były starannie strzeżone przez uzbrojonych toporników, podczas gdy główne było blokowane przez jeszcze bardziej krwiożerczy tłum. Z tego miejsca nie było ucieczki. \n\n- Przyjrzyjcie się dobrze, ludzie. Oto twarz kapitału. To są lepsi od was: Ci, którzy osiągnęli bogactwa przekraczające Twoje najśmielsze oczekiwania. Jednak tegoroczny zwycięzca może być tylko jeden. Proszę o brawa dla... Karola Modzelewskiego! \n\nStał tam zszokowany, gdy masy grzecznie klaskały. Jeden z Wikingów popchnął go w stronę podium, przez co potknął się i prawie upadł. Wojownik pełniący rolę gospodarza trzymał go za ramiona, gdy tylko odzyskał stabilną równowagę, podniósł mikrofon do twarzy. \n\n- A więc, Karol... To był naprawdę imponujący występ. Już od jakiegoś czasu jesteśmy w centrum uwagi, ale Twoje ostatnie wysiłki... naprawdę inspirujące. \n- Czekaj... o co w tym wszystkim chodzi? Jakie wysiłki? \n - Udało Ci się. Wygrałeś kapitalizm. Tego zawsze chciałeś, prawda? Przyjmij proszę ten skromny prezent w imieniu nas wszystkich. Wiemy, że to nic w porównaniu z twoją fortuną, ale niech ten róg obfitości symbolizuje twoje zaangażowanie w bogactwo. \n- Uhh... dziękuję, jestem zaszczycony. \n - Mhm. Zawiąż tę opaskę na oczach. Mamy dla Ciebie jeszcze jedną sekretną nagrodę; ten o wiele bardziej pasuje do kogoś o twoim statusie. \n\nKarol usłuchał, wciąż nieco podejrzliwy. Wiking pchnął go w dół, a on poczuł, jak jego szyja opiera się o twardy kawałek drewna. Wpadł w panikę i rozpaczliwie się wymachiwał, ale nie był w stanie zmusić się do opuszczenia pozycji. Spiker kontynuował spokojnie. \n\n — A teraz część, na którą wszyscy czekaliście. Sekcja C, rzędy 1-4, pamiętaj, że znajdujecie się w strefie odprysków. Jeśli chcecie zmienić miejsca, jest to ostatnia szansa, aby to zrobić."
 jomsborg.42.a: "Hej, przynajmniej dostał pamiątkę!"

 jomsborg.43.t: "Valheim"
 jomsborg.43.desc: "Można powiedzieć, że my już upadliśmy.\n\nDziesięć miesięcy temu wszyscy byliśmy razem w jednej osadzie, ucztowaliśmy i pracowaliśmy jako wspólnota. Przez jakiś czas żyliśmy tak, jakby Upadku w ogóle nie było.\n\nPotem odcięto prąd. Lokalne wodociągi przestały działać, zgasły światła i wkrótce z tysiąca mieszkańców zostało tylko pięciuset. Reszta rozpłynęła się w ciemności, by powrócić jako bandyci i ograbić nas ze wszystkiego, co mieliśmy. Nasz kościół, serce osady, splądrowano i rozszarpano, jakby Boga nie było. Tych z nas, którzy zostali, również rozszarpano - albo spotkało ich coś jeszcze gorszego.\n\nRuszyliśmy dalej. Było nas stu. Z każdym dniem ubywało ludzi. Głód i rozłamy odbierały nam nadzieję. Bandy rabusiów zwykle odpędzaliśmy ogniem ze strzelb. Cały kraj cofnął się do VIII wieku, kiedy wszędzie panowały grody, a bezpiecznie nie było nigdzie. Każda ufortyfikowana społeczność albo odmawiała nam wstępu, albo próbowała nas ograbić.\n\nWraz z naszymi malejącymi siłami rosła zuchwałość napastników. Ośmielili się nawet próbować gwałcić nasze kobiety i dzieci na naszych oczach. Ich matki pierwsze rzuciły się do walki i podziurawiono je kulami. Reszta z nas zdołała ich obezwładnić. Tej nocy mięso wreszcie wróciło do jadłospisu.\n\nZdziczeliśmy, przerobiwszy bliźnich na mięso, i zobojętnieliśmy na skutek cierpienia. Wkrótce strzelaliśmy do każdej napotkanej uzbrojonej grupy. Widziałem jednak po każdym z nas, że nikt nie pisał się na to, by stać się częścią bandytyzmu włóczącego się po tych ziemiach. A jednak nie dało się żyć inaczej. Alternatywą było unicestwienie, które wabiło już wielu.\n\nPrzeszłość, czasy, do których się cofaliśmy, przybrała ostateczną postać tamtej pamiętnej nocy. Zmierzaliśmy do Jomsborgu, który według legendy przyjmował wszystkich takich jak my. Nie wierzyliśmy już w legendy, ale co z tego? W najgorszym razie wszyscy zginiemy.\n\nKiedy więc nadeszli brodaci wojownicy, z toporami, kolczugami i całym tym rynsztunkiem, złożyliśmy broń. Dla mrzonki. A potem ucztowaliśmy razem z nimi. Mleko i miód, i sala pełna wojowników. Przyjęliśmy ich archaicznych bogów, a oni przyjęli nas. Wydawało się to snem, ale nim nie było."
 jomsborg.43.a: "To były zaświaty."

 jomsborg.44.t: "...potężne mądrością..."
 jomsborg.44.desc: "Zandberg przewodniczył kolejnemu posiedzeniu rady. Trzeciemu w tym tygodniu. Po raz kolejny słuchał sprawozdań z lokalnych wyborów do tingów, o przepełnionych szpitalach i zawirowaniach gospodarczych. Co za nuda. Mimo dwóch filiżanek kawy czuł, że w każdej chwili może zasnąć. \n- Dobra wiadomość jest taka - ciągnęła swój raport Zawisza - że dzięki polityce najazdów mamy stały dopływ daniny politycznej. Tymczasem... \n- Tak? Co z tym, Marcelino? - zapytał Zandberg i spojrzał na koleżankę, lecz wtedy zauważył, że znieruchomiała. Co więcej, cała rada zastygła. Jakby czas się zatrzymał. \n- Zmęczony? - na krześle naprzeciwko niego siedziała teraz nieznajoma kobieta. - Chciałbyś wrócić na pole bitwy? A może wolałbyś, żeby ktoś inny wziął na siebie ciężar decyzji? \n- Ty musisz być... - Zandberg spodziewał się odpowiedzi. \n- Verðandi, Norna Teraźniejszości - oznajmiła bogini. \n- Nic im nie jest? - zapytał jarl, spoglądając na swoich doradców. \n- Nie. Nie odczują żadnej różnicy. \n- Wiesz wszystko o teraźniejszości? - zapytał Zandberg. \nNorna skinęła głową. \n- Co członkowie rady sądzą o mnie i moich rządach? \n- Twoja prawa ręka jest na ciebie zła. Wątpi w ciebie. Zna jarzmo obozów internowania, ale uważa, że wyciągnąłeś z niego niewłaściwą lekcję. Spiskuje z Uśmiechniętą, która z kolei spiskuje przeciwko niej. Obie próbują realizować własne cele, ale nie podniosą na ciebie ręki. Łączące je z tobą koleżeństwo dobrze współgra z twoją użytecznością jako symbolu dla mas. Mężczyźni w ciebie wierzą. Wódz Wojenny cię podziwia pomimo swej lojalności i sceptycyzmu. Skarbnik sądzi, że zdoła cię zmienić. Mimo wszystko wszyscy życzą ci jak najlepiej. Wiem też, że żadne z nich nie pochwaliłoby tego, że opowiedziałeś im o naszej rozmowie. \nZandberg wciąż rozważał w myślach obie możliwości. Siłę swojego dziedzictwa oraz fakt, że najzdolniejsi ludzie, jakich znał, mówili mu, że się myli. \n- Powiedziałam ci o ich uczuciach, bo o nie zapytałeś. - Verðandi wyczuła rozdarcie w jego umyśle. Wstała i podeszła bliżej. - Musisz jednak pamiętać, komu naprawdę jesteś winien lojalność. W tym pokoju są tylko cztery osoby, a czterdzieści milionów czeka na swojego obrońcę. Na swojego jarla. Norna wyciągnęła rękę. Z jej pleców wyrosły dwa wielkie białe skrzydła. Kiedy Zandberg dotknął bogini, oślepił go błysk. Teraz niosła go, lecąc przez chmury. Zandberg ujrzał tam armie maszerujące przez pola. Mordujące cywilów, napadające na kobiety i dzieci. Zobaczył wielkie miasta, w których bogaci bez żadnej kontroli wyzyskiwali biednych na niewyobrażalną skalę. \nNorna go upuściła. \nKrzyknął i obudził się w sali obrad w Jomsborgu. Jego doradcy, jak zwykle, patrzyli na niego z konsternacją."
 jomsborg.44.a: "- Wszystko w porządku?"

 jomsborg.45.t: "...a los i życie\nsynów człowieczych..."
 jomsborg.45.desc: "Strzał padł znikąd. Zwyczajną przejażdżkę konną jarla Zandberga przerwano, gdy pierwszy z jego huskarlów runął postrzelony. Pozostali szybko zeskoczyli z koni, by osłonić swojego pana. Rozpętała się brutalna walka. Zaskoczeni huskarlowie szybko się zebrali i odpowiedzieli ogniem w stronę napastników, lecz wcześniej koń Zandberga został zabity, a sam jarl został raniony w nogę. Nim zdołał pojąć, skąd nadszedł atak, spostrzegł, że wszyscy członkowie jego osobistej straży nie żyją. Ich ciała jeżyły się od strzał. Mimo to walczyli dzielnie. Tylko jeden z napastników zachował dość sił, by wyjść z krzaków, w których ukrywał się jego oddział. Ranny w plecy, ruszył ku Zandbergowi, który nie był w stanie się podnieść. \n- Śmierć Karminom! - krzyknął zamachowiec, unosząc nad głową jarla maczugę okopową. \nZandberg zamknął oczy, gotując się na swój los. Wtedy usłyszał szczęk miecza uderzającego o pancerz, lecz nie poczuł bólu. Gdy otworzył oczy, ujrzał wojowniczkę stojącą między nim a napastnikiem. Tarczą zatrzymała cios przeciwnika, po czym, ku zdumieniu obu mężczyzn, wbiła ostrze w brzuch niedoszłego zabójcy jarla. \nWojowniczka spojrzała na Zandberga, a następnie bez słowa podeszła do ciał huskarlów, by je obejrzeć. \nZandberg przyjrzał się swojej wybawicielce. Miała na sobie złoty pancerz lamelkowy, okryty czerwonym płaszczem zdobionym białymi piórami. Jej skóra i oczy lśniły trupią jasnością. \n- Walkiria... - pomyślał Zandberg, po czym powiedział na głos: - Rozumiem, że mój czas jeszcze nie nadszedł. \n- Nie lękaj się, Karminowy Jarlu - jej zębowe korony były rzeźbione. - Wciąż masz przed sobą przyszłość, gdyż wiążę z tobą szczególne zadanie. Jestem Skuld, Norną Przyszłości. \nSkończywszy mówić, zagwizdała. Z jednej z leśnych ścieżek wybiegł biały koń. Pomimo obrażeń Zandberg zdołał wstać i razem z Norną dosiadł wierzchowca. \nRuszyli szybko. Szybciej od każdego samochodu, pociągu czy samolotu. Znaleźli się w mieście przyszłości. Z czystym powietrzem, z tramwajami i autobusami zamiast niekończącego się ruchu samochodowego. Na każdym rogu widział kolektyw robotniczy prowadzący przedsiębiorstwo, a w oddali elektrownię atomową. Oglądał wiadomości o zmniejszających się nierównościach, podczas gdy Alting gościł debatę Zawiszy z Biejat. Wszystkiemu przewodniczył Zandberg. Wkrótce jednak nad idyllą zebrały się ciemne chmury. Wiadomości zaczęły mówić o potworze pustoszącym miasta Polski. O krwawiącym, rozkładającym się Jǫrmungandrze. Ludzie zaczęli wznosić nordyckie idole. Mieszkańców oraz zwierzęta domowe spędzono na ulice. Pokłonili się samozwańczemu goði, który zażądał ofiary mającej powstrzymać nieszczęścia. Odbył się największy Blót wszech czasów. Ludzie wiwatowali na cześć Thora, ale ten nie nadszedł. Zamiast niego w ziemi rozwarła się ognista paszcza - wrota Múspellheimu. Wyjechała z nich konna horda jǫtnarów. Ich przywódca był szary niczym draugr, a jego oczy jarzyły się żółtym blaskiem. Nosił maskę z jeleniej czaszki. Trolle tratowały ludzi, którzy je przyzwali, i puściły znaczną część świata z dymem. Po rzezi wzbiły się jednak w powietrze na swych koniach i uderzyły na Jǫrmungandra, który ze względu na rogi wodza jǫtnar wziął go za swojego ojca, Lokiego. Szary Jǫtunn został następnie okrutnym władcą resztek ludzkości. \nWizja dobiegła końca. Zandberg obudził się na miejscu zasadzki. Noga wciąż go bolała, ale przynajmniej wszyscy napastnicy byli martwi. Pomoc już nadciągała. Nie mogła jednak pomóc Zandbergowi w podjęciu właściwej decyzji."
 jomsborg.45.a: "Co może powstrzymać Ragnarök?"

 jomsborg.46.t: "Nauka przynależności"
 jomsborg.46.desc: "Kamil nie potrafił przywyknąć do nowej sytuacji na Pomorzu Zachodnim. Jednego dnia żył pod Niemcami, potem pod administracją Krzystka, a teraz pod jakimiś wikingami. Skąd oni w ogóle się wzięli? Średniowieczny Norman przemierzający współczesną Polskę był czymś, czego zwyczajnie nie potrafił pojąć. A teraz, jakby tego było mało, dostał zaproszenie na obchody bitwy pod Stamford Bridge, czymkolwiek ona była.\n\nZe szczerej ciekawości postanowił pójść. Kamil uczestniczył kiedyś w warszawskich obchodach rocznicy Powstania Warszawskiego i pamiętał ich powagę. Pełną minutę ciszy, wspomnienie tych, którzy polegli za możliwość istnienia niepodległej Polski. Wyobrażał sobie, że tutaj będzie podobnie. W ostatecznym rozrachunku przekonała go też możliwość pokazania, że on również może skorzystać pod nową administracją.\n\nKiedy wszedł do Parku Kasprowicza, nie mógł uwierzyć własnym oczom. Wzdłuż głównej alei ustawiono długie drewniane stoły, przykryte nie biało-czerwonymi barwami, lecz sztandarami z dziwnymi bestiami wyszytymi wyrazistym błękitem i czernią. Dym z pieczonego mięsa leniwie snuł się między drzewami, niosąc zapach miodu i przypalonego tłuszczu. Beczki stały otwarte, a ich zawartość chlupotała w ciężkich kuflach raz po raz wznoszonych w głośnych toastach. Gdzieś przy stawie grupa barczystych mężczyzn w hełmach toczyła inscenizowaną walkę; ich topory szczękały o tarcze przy wiwatach zachwyconego tłumu.\n\nSzybko się odnalazł. Imprezował przez całą noc, pił z nieznajomymi i tańczył z różnymi kobietami. Początkowe oszołomienie dawno rozpłynęło się w cieple i hałasie. Obserwując ryczący tłum unoszący rogi, raz po raz zastanawiał się, jak ogromne musiało być to zwycięstwo, skoro zasłużyło na taką fetę. Około północy ciekawość w końcu popchnęła go, by zapytać kogoś o ten wielki triumf. Zebrał się na odwagę i podszedł do wysokiego, dokumentnie pijanego wikinga.\n\n- Jestem tu nowy. Niewiele wiem o waszej historii i wierzeniach. Świętujecie z takim rozmachem, że nie mogę przestać się zastanawiać, jak wielkie było to zwycięstwo. Możesz mi opowiedzieć?\n\nWiking patrzył na niego przez jedno uderzenie serca, po czym wybuchnął grzmiącym śmiechem.\n- Na potęgę Odyna! Zwycięstwo? Nie wygraliśmy, chłopcze. Przegraliśmy. Sromotnie. Stamford Bridge stało się naszym grobem!\n- Wy... przegraliście?\n- Ano! Harald Hardrada poległ. Wielkiego króla Norwegii ścięto w Anglii. Nasza armia została rozbita. Powiadają, że był to koniec wielkiej epoki wikingów. Wspaniała katastrofa!\nKamil szukał na jego twarzy śladu ironii, lecz nie znalazł żadnego.\n- Świętujecie... klęskę?\nWiking wcisnął Kamilowi w dłonie kufel piwa.\n- Za Haralda! Za dzielnych wojowników, którzy tego dnia znaleźli swoje miejsce w Valhalli!\nPo krótkiej chwili wahania Kamil również uniósł kufel."
 jomsborg.46.a: "Klęska warta pamięci"

 jomsborg.47.t: "Saga Wendlandzka"
 jomsborg.47.desc: "\"Jeszcze przed powstaniem państwa ze stolicą w Gnieźnie ziemie nad Wisłą zamieszkiwali Wandalowie, którzy na całe następne stulecia ukształtowali germańskie dziedzictwo Wendlandu\". \nDoktor Jan Dokalfar mozolił się nad podręcznikiem szkolnym zgodnym z nową podstawą programową, według której: \"Wszystkie dzieci Wenedów winny wiedzieć w sercach i umysłach, iż w ich żyłach płynie krew Skandynawów\". Wziął głęboki oddech i zabrał się do pracy. \n\"Każdy zna skandynawskie dziedzictwo pierwszego historycznego władcy naszego państwa - Dagona, który dla swoich słowiańskich poddanych przyjął imię Mieszko. \nBadania genetyczne potwierdzają tę hipotezę. Przodkowie Mieszka byli przybyszami ze Szkocji, będącej celem wikińskich najazdów i kolonizacji. Za jego panowania nad Wisłę napłynęli nordyccy osadnicy, by służyć dynastii Pjastrów. Ich potomków nazywano Wenedami; żyli oni obok swoich słowiańskich sąsiadów, znanych jako Polacy. Odtąd germańscy sąsiedzi państwa używali nazw Polska i Wendland wymiennie. Choć po Wielkiej Wędrówce Ludów kraj pozostawał w przeważającej mierze słowiański, jego nordyckie elity ukształtowały kulturę królestwa. \n- Będę potrzebował więcej miodu... - Jan zrobił sobie krótką przerwę, po czym wrócił do pisania. \n\"Zjednoczona monarchia wenedzka przetrwała z pewnymi przerwami do 1138 roku, kiedy książę Burisleif Skævmundede ostatecznie podzielił kraj, a jego następcy utracili tytuł królewski. Powstałą próżnię wypełnił Kanut IV Duński, który wykorzystał podobieństwa między kulturą duńską a wenedzką i w 1185 roku przywłaszczył sobie tytuł króla Wenedów. Tytuł został uznany przez papieża, odtąd więc władcy Pjastrów, tacy jak Przemysł II czy Władysław Łokietek, musieli zadowalać się wyłącznie tytułem królów Polski\". \nKolejny łyk. \n\"Pomimo utraty tytułu więzy łączące Polskę, tudzież Wendland, ze Skandynawią były powszechnie znane w całej Europie. Nieprzypadkowo William Szekspir w \"Hamlecie\" - sztuce o duńskim księciu - jednym tchem wymienia Norwegię, Anglię i Polskę, dowodząc, że ostatni z tych krajów łączyło z Danią równie wiele wspólnej historii, co dwa pozostałe. Postać Poloniusza, królewskiego doradcy, również obrazuje bliskie związki między oboma narodami. \nChoć w epoce nowożytnej polskie elity odżegnywały się od wenedzkiej przeszłości, dobrze o niej pamiętały. Właśnie dlatego w 1587 roku szwedzki książę Zygmunt Waza zwyciężył w walce o koronę z kandydatem austriackim i zapoczątkował najdłużej panującą dynastię elekcyjną\". \nDoktor historii spojrzał na wiszący na ścianie dyplom, czując do siebie obrzydzenie. W nowym podręczniku nie mógł napisać o najbardziej oczywistym podobieństwie między Wendlandem a Danią."
 jomsborg.47.a: "\"Wendland też jest więzieniem\""

 jomsborg.48.t: "Krucha jedność"
 jomsborg.48.desc: "Wielu uznałoby wspólny marsz lewicy i narodowców 11 listopada za fatalny pomysł. Przez lata coś takiego wydawało się nie do pomyślenia, zważywszy na wzajemną nienawiść obu środowisk - szczególnie tam, gdzie w grę wchodzili wikingowie. A jednak, wbrew wszelkim przewidywaniom, tego dnia obie grupy maszerowały razem.\n\nMarek, od wielu lat związany z licznymi kręgami narodowymi, również nie wyobrażał sobie, że kiedykolwiek do tego dojdzie. Idąc tamtego dnia przez tłum, częściej zerkał na boki niż przed siebie. Sztandary wyglądały inaczej. Niektóre hasła niezgrabnie się ze sobą pokrywały; inne wprost sobie przeczyły. Kilka metrów dalej mężczyzna w rogatym hełmie śmiał się i swobodnie rozmawiał z kimś z kręgu ONR.\n\nTo nie miało sensu. Jeszcze rok temu przeszliby na drugą stronę ulicy, byle się minąć - albo zrobiliby coś gorszego. Jak zatem właściwie do tego doszło? Znaleźli wspólnego wroga. Szwedów. Sama nazwa obudziła coś starego, wyciągniętego z podręczników historii i na wpół zapamiętanych krzywd. Najazd sprzed wieków, wojny, przekazywane z pokolenia na pokolenie opowieści. Nieważne, jak odległe były te wydarzenia. Liczyło się to, że obie strony mogły choć raz wskazać ten sam kierunek.\n\nPrzez pewien czas dawne spory wydawały się mniej istotne, odsunięte przez prosty fakt, że wszyscy szli razem. Zjednoczeni przeciw wspólnemu wrogowi. Po raz pierwszy lewica i prawica nie stały naprzeciwko siebie po dwóch stronach policyjnego kordonu czy barykady. Patrzyły w tę samą stronę. Okrzyki nie zawsze do siebie pasowały, symbole nie stapiały się w jedną całość, lecz rytm marszu i tak niósł wszystkich naprzód.\n\nMarek wiedział, że to nie potrwa. Nie był naiwny. Jutro powrócą kłótnie. Ożyją dawne urazy. Ale przez jedno popołudnie nic z tego nie zdawało się mieć znaczenia. Było w tym coś niemal nierzeczywistego, coś kruchego i ulotnego. Przez kilka godzin Polska wydawała się mniej podzielona niż kiedykolwiek. Nie dlatego, że wszyscy się ze sobą zgadzali, lecz dlatego, że znaleźli jeden powód, by stanąć ramię w ramię. A kiedy Marek spoglądał na tłum poruszający się jak jedno ciało, pozwolił sobie zastanowić się, czego trzeba, aby trwało to dłużej niż jeden dzień."
 jomsborg.48.a: "Czy to może coś zmienić?"


 jomsborg.49.t: "Siła wielu"
 jomsborg.49.desc: "Główny statystyk Olaf już trzeci wieczór ślęczał nad wynikami powszechnego spisu ludności zarządzonego w całym państwie. Choć większość danych zestawiono bez większych problemów, jedna rzecz wciąż go prześladowała. Narodowość. Jak w takim państwie określić, kim naprawdę jest człowiek, skoro nawet samo państwo i jego przywódca nie wydawali się tego do końca pewni?\n\n- Pozostawienie otwartego pytania było błędem. Co mnie podkusiło, żeby rubryka przynależności narodowej w formularzu miała formę pytania otwartego? - mamrotał raz po raz Olaf, popijając o bardzo późnej porze trzecią kawę czwartym energetykiem.\n- Może po prostu jakoś to posegreguję...\n\nŻaden sposób nie dawał jednak sensownych wyników. Za każdym razem ktoś wpisywał inne określenie tej samej rzeczy, które jednocześnie dało się uznać za osobną tożsamość. W końcu Olaf stwierdził, że jeśli chce choć spróbować zawęzić zakres odpowiedzi, musi zacząć od podstaw.\n\n- Jak mam w ogóle interpretować kogoś, kto napisał, że utożsamia się z ziemniakiem, helikopterem bojowym albo lisem tybetańskim? To nie jest pytanie o tożsamość płciową, więc skąd te żarty?! Chyba że... właściwie. Odmowa odpowiedzi albo odpowiedź satyryczna. To odsieje kilka wpisów.\n\nNie uszczupliło to nawet odrobinę przytłaczającego stosu kwestionariuszy, który na niego czekał.\n- Dobra. Cudzoziemcy. Ci inni... cudzoziemcy. Ukraińcy. Łatwe. Rosjanie. Litwini. Żydzi. Romowie. W porządku. Niemcy. Dobrze. Chwila... tu nie jest... niemiecka... tylko... GERMAŃSKA? Co to ma, kurwa, znaczyć?! On jest... Niemcem wyznającym religię germańską... czy Germaninem jak jakieś starożytne plemię barbarzyńców? Znowu to samo kurwa, O BOGOWIE.\nOkazało się, że nawet te kategorie nie były tak łatwe do skatalogowania, jak mogłoby się wydawać. Olaf spędził kolejne trzy godziny, próbując wrzucić wszystkich mniej lub bardziej niemieckich ludzi do jednego stosu, aż zaczął nakładać się on na stos nordycki.\n- To wszystko jest jakieś pojebane. A jeszcze nawet nie doszedłem do tych, którzy wpisali \"wiking\". TO JEST PIERDOLONY CZASOWNIK, NIE TOŻSAMOŚĆ. Może... mógłbym opublikować dwa spisy? Nie, i tak wysłaliby mnie na szkolenie z wrażliwości, bo przecież musimy być inkluzywni. Jak mam wyodrębnić każdą możliwą kombinację, skoro to wygląda jak spektrum autyzmu?! Chwila... och... OCH. To jedyne rozwiązanie. To musi być spektrum.\n\n- No dobrze, ułożyć od najbardziej nordyckich do najbardziej polskich. Łatwizna."
 jomsborg.49.a: "Tylko nie mów, że to przez autyzm... to niestosowne."

 jomsborg.50.t: "Echo dzwonów"
 jomsborg.50.desc: "Paweł Michniewicz, niegdyś katolicki duchowny, a teraz zbiegły niewolnik, ukrywał się w plebanii przy kościele Matki Bożej Szkaplerznej w Bierzwniku. Tamtejszy proboszcz, ksiądz Sławomir Mazurkiewicz, przyjął go jeszcze wtedy, gdy Paweł pozostawał w szoku i padał z wycieńczenia po ucieczce od brutala imieniem Brandr. \nBierzwnicki kapłan dał mu wszystko, czego potrzebował, a nawet poprosił Pawła, by powrócił do swojego powołania i został jego nieoficjalnym wikarym, co miało uleczyć duszę wygnanego księdza. Michniewicz odmówił. Nie chciał występować przeciwko oficjalnej hierarchii Kościoła, nawet w tak wyjątkowych okolicznościach. Poza tym nadal dręczyło go poczucie winy, bo się załamał i pozostawił wiernych na pastwę Normanów. \n- Nie jestem gotowy. Może kiedyś - odpowiadał za każdym razem, gdy Mazurkiewicz poruszał ten temat. - Muszę najpierw odzyskać jasność umysłu. \nŁatwiej było powiedzieć, niż zrobić. Każdej nocy budził się ze wspomnieniem złupienia Kamienia Pomorskiego. Mnóstwo czasu spędzał, wyglądając przez okno, czy w stronę kościoła nie zmierza wikiński patrol, i na wszelki wypadek nigdy nie oddalał się zanadto od możliwych kryjówek. Zapytał nawet księdza Sławomira, czy ma jakiś plan na wypadek, gdyby tym razem najeźdźcy postanowili splądrować jego parafię. \n- Posłuchaj - odpowiedział mu wówczas Mazurkiewicz. - Doceniam twoją troskę i rozumiem, ile wycierpiałeś. Ale mój skromny kościół nie dorównuje rangą katedrze św. Jana. Nie jest ani równie bogaty w zabytki, ani równie ważny jako symbol. Poza tym wikingowie muszą teraz rządzić podbitymi ziemiami. Nie mogą bez końca ich grabić. Zdawało się, że ksiądz Sławomir ma rację. Paweł zaczął doceniać swój nowy dom. Odważył się wychodzić poza plebanię i pomagać przy pracach domowych, a pewną pociechę odnalazł w żywotach świętych, którzy również doświadczali prześladowań. Lubił czytać je nad pobliskimi jeziorami. \nPóźniej żałował, że stracił czujność. \nKiedy wrócił z jednej z takich wypraw nad jezioro Bierzwnik, zauważył przed plebanią tłum uzbrojony we włócznie i pochodnie. Zastygł na dłuższą chwilę, lecz potem zacisnął pięść, przeżegnał się i ruszył w stronę zgromadzonych. \nWikingowie wynosili z kościoła wszystko, co się świeciło, włącznie z przedmiotami przyniesionymi na wystawę przez miejscowych archeologów. Zrabowane rzeczy rzucali zgromadzonym cywilom. Następnie wywlekli z kościoła księdza Sławomira. Może chcieli zrobić z niego niewolnika. Może zabić. Tym razem Michniewicz postanowił działać. \n- Hej! - wrzasnął na całe gardło, a wszyscy świętokradczy rabusie spojrzeli w jego stronę. - Zostawcie go! \nPojmany ksiądz wykorzystał okazję i uderzył trzymającego go wikinga głową w nos. Mazurkiewicz rzucił się do ucieczki, a jeden z rabusiów ruszył za nim. \n- Zostaw go! - rozkazał ich przywódca. - Tutaj mamy twardą sztukę o znacznie większym potencjale.\nPaweł ponownie został niewolnikiem..."
 jomsborg.50.a: "...ale tym razem na własnych warunkach"

 jomsborg.51.t: "Álfablót"
 jomsborg.51.desc: "Trzech mężczyzn zmierzało do piwnicy bloku mieszkalnego, w której miała odbyć się potajemna ceremonia. Właściwie szło tylko dwóch: wysoki, brodaty mężczyzna z grzywą pełną warkoczy oraz równie potężnie zbudowany człowiek, którego głowę zamiast włosów pokrywały liczne tatuaże. Obaj nosili tradycyjne lniane szaty. Trzeciego, ubranego w garnitur, nieśli skrępowanego sznurem i zakneblowanego. \n- Jesteś pewien, że to tutaj, Algiz? - zapytał łysy swojego towarzysza. - Miejsce jakoś na takie nie wygląda. \n- Posłuchaj, Odal. Adres się zgadza, kod do drzwi też - odparł zapleciony. - Nie zawsze można oceniać książkę po okładce. Wojownik zapukał do drzwi piwnicy. \n- Przybyliśmy świętować Álfablót - oznajmił Algiz. \nDrzwi otworzyły się powoli ze skrzypnięciem. \n- Więcej gości, cudownie! - przywitała ich uśmiechnięta kobieta i zawiesiła kwietne wieńce na szyjach obu wojowników. Kiedy spojrzała w dół i zauważyła niesionego przez nich związanego mężczyznę, jej oczy na moment rozszerzyły się ze zdumienia, lecz szybko odzyskała rezon. - Przepraszam, po prostu nie przywykłam do tego rodzaju... relacji, ale śmiało wyrażajcie siebie tak, jak tylko chcecie. Podczas wiosennego Vårblotu odbędą się nawet warsztaty o niestandardowych praktykach miłosnych pod auspicjami bogini Freyji. Ale gdzie moje maniery? Jestem Auðr i będę gyðją dzisiejszej ceremonii. Wybaczcie, muszę jeszcze zająć się kilkoma sprawami. Witajcie na Álfablócie! \nZałożyła trzeci wieniec na szyję więźnia i szybko odeszła w głąb pomieszczenia. \n- Kobieta? - Odal spojrzał na towarzysza z konsternacją. \n- Akurat to się zgadza - Algiz próbował go uspokoić. - Za prowadzenie Álfablótów odpowiadają kobiety. \n\nMężczyźni weszli do pokoju pełnego świec i drewnianych idoli. Była to prawdziwa izba gościnna z olbrzymim stołem zastawionym szwedzkim stołem. Bawili się całkiem dobrze, choć rozczarowała ich ilość wegańskich zamienników mięsa i piwa bezalkoholowego. \n- Jak podoba wam się nasza ceremonia? - Auðr podeszła do Algiza i Odala. \n- Jeśli chodzi o jedzenie i napoje, naprawdę przeszłaś samą siebie - pochwalił ją długowłosy Algiz. \n- Ale najbardziej czekaliśmy na część Álfablótu zwaną blót - dodał, rzucając znaczące spojrzenie na przerażonego więźnia, skulonego pod ławą, na której siedzieli, bez żadnej drogi ucieczki. \n- Ach, ofiara! Właśnie miałam ją rozpocząć. \nObaj mężczyźni wpatrywali się w nią z niecierpliwością, kiedy chwyciła nóż. Zamiast złożyć ofiarę z człowieka, odcięła jednak kawałki kilku potraw, położyła je na ołtarzu i odmówiła modlitwy do elfów oraz Freyra, dawcy pokoju. \n- Widzę, że cała wasza trójka trochę markotnieje. Sądzę, że dobrze zrobiłaby wam komnata z Oparami Hekli. \n- Może ofiara z człowieka polega na wrzuceniu więźnia w piekielne płomienie podobne do tych z wulkanu Hekla? - Algiz próbował doszukać się sensu w nowych praktykach. \n- Chyba warto spróbować - odparł Odal, podnosząc więźnia i wchodząc do pomieszczenia wskazanego przez Auðr. \nNa miejscu dowiedzieli się, że Opary Hekli były eufemizmem oznaczającym halucynogeny wypełniające wewnętrzną komnatę. Zanim zdążyli zareagować, znajdowali się już pod ich wpływem. \n- Myślisz o tym samym, co ja? - Algiz zapytał przyjaciela powolnym, odprężonym głosem. - Wszyscy jesteśmy połączeni niczym światy na gałęziach Yggdrasilu. \n- Taaak - Odal zaczął się kołysać. - Zabić kogoś to jak zabić samego siebie. Po tym objawieniu puścił więźnia i przeciął więzy krępujące mu ręce oraz nogi. Niedoszła ofiara skorzystała z okazji i uciekła."
 jomsborg.51.a: "Jego strata"

 jomsborg.52.t: "Nie przybywam w pokoju"
 jomsborg.52.desc: "Paweł Michniewicz, były ksiądz, klęczał w spalonych ruinach kościoła św. Floriana w Postominie. Na dłoniach miał krew. Rozmyślał nad tym, jak znalazł się w tym położeniu. \nPo ucieczce z niewoli szukał schronienia w rozmaitych zachodniopomorskich parafiach. Wiedział, że jeśli wikingowie przeszukają go i znajdą na jego piersi znamię niewolnika, ponownie go zniewolą albo zabiją. Poza tym musiał na własne oczy przekonać się, jak wygląda tak zwana amnestia dla Kościoła katolickiego. Ludziom łatwiej było zaakceptować \"racjonalną politykę świeckości\" niż otwarcie represyjny reżim. Cel pozostawał ten sam: odwieść ludzi od Chrystusa; stworzyć duchową pustkę, aby z czasem ich martwa religia mogła wypełnić serca Polaków. A nawet gdyby nie kierowały nimi żadne ukryte zamiary, nie byłoby sprawiedliwe wybaczyć im wcześniejsze zbrodnie. \nZrozumiał to, kiedy dotarł do Postomina. \nNowy reżim arogancko radził księżom, by przy kościołach zakładali szkółki niedzielne. Trudno było jednak tego dokonać, skoro miejscowy kościół spłonął podczas pierwszych najazdów. Postomino leżało blisko brzegu, dlatego jego mieszkańcy oraz ich sąsiedzi lepiej od Pomorzan żyjących dalej od morza znali furię głodnych wikingów. Po przybyciu Paweł przebrał się za żebraka, by obserwować mieszkańców wsi. Spędził tam kilka tygodni. Między miejscową ludnością a wikińskimi siłami pokojowymi panowało napięcie. Któregoś dnia musiało eksplodować. I eksplodowało. Bezdomny już proboszcz Postomina został dotkliwie pobity przez nieznanych sprawców. Oczywiście winą obarczono pogan. Wkrótce przed posterunkiem policji zebrał się protest wymierzony w Normanów. Wikingowie, co zaskakujące, zachowywali się dość defensywnie, ale można to było wyjaśnić przewagą liczebną protestujących. Paweł był pewien, że demonstracja przerodzi się w przemoc. Obawiał się, że nie będzie dość gwałtowna. A to, jak przekonywał się raz za razem, oznaczało śmierć. \n- Jako kapłan Kościoła katolickiego mówię wam - zawołał w końcu - uderzcie na nich! Zabijcie ich w imię Boga, nim wezwą odwetowy najazd! Tyle wystarczyło tłumowi. Fala protestujących ciskających kamieniami zalała wikingów, choć obrońcy otworzyli ogień i ranili część napastników. \n- Wszyscy uczestnicy tego, co się tutaj wydarzyło, muszą uciekać do lasu. W otwartej walce z nimi nie zwyciężymy - Michniewicz szybko wyrósł na przywódcę. \nWłaśnie tak znalazł się w ruinach kościoła, modląc się o wskazówkę. Modlitwę przerwała dłoń położona na jego ramieniu."
 jomsborg.52.a: "\"Chodź, ojcze. Czas ruszać\"."

 jomsborg.53.t: "Próba wierzeń"
 jomsborg.53.desc: "Kolejny niedzielny poranek. Jeszcze niedawno Antoni wstawał natychmiast po przebudzeniu. Nie dzisiaj. Odkąd tylko sięgał pamięcią, służył w miejscowym kościele. W wiosce, w której mieszkał, tego od niego oczekiwano. Zawsze uważał się za katolika. Teraz nie był już tego taki pewien. Sądził, że innej drogi po prostu nie ma. Przez większość czasu miał rację. Ci, którzy opuszczali Kościół, nie mieli żadnego innego systemu wartości. Duchowa pustka, dokładnie tak, jak mówili księża. Być może jednak działo się tak dlatego, że nikt nie przedstawił im żadnej alternatywy.\n\nPamiętał dzień, kiedy podczas spaceru zapuścił się do pobliskiego lasu i usłyszał śmiech oraz śpiew. Zakradł się w krzaki. Poganie obchodzili Varblot, jeśli dobrze usłyszał. Zobaczył, jak radują się i głośno modlą do swoich bogów o spełnienie najgłębszych pragnień. Wszyscy po prostu ich słuchali, nie osądzając. Wbrew temu, czego nauczono go podczas kazań, nie składano żadnych ofiar z ludzi. Widział jedynie ludzi cieszących się życiem. Mężczyznę i kobietę w znakomitej kondycji, rzeźbiących swoje ciała w arsenały wojowników. Stanowili jaskrawe przeciwieństwo zarówno mizernych ministrantów, jak i pobłażliwych wobec samych siebie, leniwych ateistów, których spotykał.\n\nTeraz zastanawiał się, czy jego również tak by przyjęto, gdyby tam przyszedł - choćby tylko po to, by zobaczyć, co się dzieje. Była jednak niedziela. Hierarchowie nowej religii wyraźnie wyznaczyli cotygodniowe obrzędy tak, aby pokrywały się z nabożeństwami w miejscowych kościołach.\nAntoni próbował przywołać jakieś ciepłe uczucia wobec swojego Kościoła, ale wszystko było inne. Jakby wypaczone. Ceremonia, którą dawniej uważał za majestatyczną, teraz wydawała mu się nudna i martwa. Uświadomił sobie, że ludzie chodzący z nim do kościoła, choć byli braćmi i siostrami w wierze, niemal nic o nim nie wiedzieli. Po zakończeniu mszy każdy wracał do swojego domu. Tydzień po tygodniu. Poganie natomiast sprawiali wrażenie, jakby bardzo dobrze się znali i otwarcie okazywali sobie przywiązanie. Katolicy, przynajmniej w jego parafii, patrzyli na siebie z podejrzliwością, próbując wykryć w swoich szeregach krypto-poganina. Nawet jego rodzice z każdym kazaniem popadali w coraz większą paranoję. Marszcząc brwi, przesłuchiwali go w sprawie każdej dziewczyny, z którą rozmawiał, i mamrotali coś o konkubinach. Podejrzany wydawał im się też każdy jego wypad ze znajomymi.\nW oczach wspólnoty i tak wkrótce miał zostać heretykiem. Równie dobrze mógł wybrać się na wycieczkę i samemu przekonać się, o co go oskarżano."
 jomsborg.53.a: "Tego dnia narodził się nowy syn Odyna"

 jomsborg.54.t: "Dziennik Skarg Bloku 44"
 jomsborg.54.desc: "Skarga nr 68, wspólnota mieszkaniowa \"Sigurn\".\nSkarżąca: Zygfryda Storrada, lat 78.\nTreść skargi:\nPan Tusksson to najbardziej nieznośny sąsiad, jakiego miałam od czasu, kiedy Stachu się ze mną zadawał! Nie mogę spać, bo kiedy akurat nie jeździ z wami na rabunki, udaje, że rabuje, i chodzi po całym osiedlu z toporem na wierzchu! Z toporem, mówię wam, kiedy wokół biegają dzieci, naprawdę! Tak wielkim, że nawet moja stara klacz Bun by się go przestraszyła, a las, który kiedyś miałam, dałoby się nim wyrąbać! KTO MU POZWOLIŁ TAK CHODZIĆ I STRASZYĆ MOJE WNUKI, idźcie i mu powiedzcie, powiedzcie temu (ocenzurowano w urzędzie), żeby przestał. Albo niech go ospa weźmie, niech go dżuma pochłonie!\nOdpowiedź urzędnika:\nProsimy zachować otwarty umysł w kontaktach z obywatelami o silniejszej tożsamości jomswenedzkiej. Przypominamy, że Regulamin i Prawa Lokatorów §§ 4, ust. 2-10 określają WSZYSTKIE uzasadnione podstawy skierowania lokatora na postępowanie dyscyplinarne, natomiast ust. 11-14 wszystkie podstawy eksmisji bądź przeniesienia. Popierane przez państwo wyrażanie nordyckiego pochodzenia, szczególnie poprzez zachowania akceptowane przez Wikiński Socjalizm, takie jak jawne noszenie topora bojowego, nie spotyka się z dezaprobatą, lecz jest wręcz zalecane. Być może wspólne ćwiczenia z posługiwania się toporem oraz wikińskich okrzyków bojowych pomogłyby pani docenić rodzącą się kulturę jomswenedzką.\n\nSkarga nr 69, wspólnota mieszkaniowa \"Sigurn\".\nSkarżąca: Zygfryda Storrada, lat 78.\nTreść skargi:\n(Ocenzurowano w urzędzie), byłam tam, wiem, co on robił, ja wam jeszcze pokażę kulturę jomswenedzką. Nie mogę nawet spać przez cały ten hałas, który robi. Nocami rozpala ognisko, tańczy wokół niego, pije miód i wrzeszczy coś w rodzaju, yyyyy, uuuuch...\nHeill, Haraldr Harðráði! \nMikli norðmannakonungr! \nVerndari var hann Miklagarðs \nyfir Væringjum hǫfðingi! \nNo, przez waszych ludzi znam już nawet cały tekst i wiem, jak go zapisać, niech was ospa weźmie, niech was dżuma pochłonie. Tak bardzo lubicie swoje paragrafy, to co powiecie na Ustawę o Ochronie Zdrowia i Bezpieczeństwie §§ 9 ust. 9: organy władzy publicznej wszystkich szczebli mają obowiązek i uprawnienia do przeciwdziałania wszelkim zagrożeniom dla zdrowia choćby jednego obywatela! Nadmierne nocne hałasy pana Tuskssona nie pozwalają mi spać, a ta sama ustawa, §§ 4 ust. 13, uznaje niemożność porządnego wyspania się za zagrożenie dla zdrowia! Więc idźcie i uciszcie tego wikinga, siarczysty piorun niech was trzaśnie, niech (ocenzurowano) ognisty, siarczysty piorun..."
 jomsborg.54.a: "Przekazać skargi 68 i 69 do sądu okręgowego, a w piątek dać personelowi wolne."

 jomsborg.55.t: "Do mądrego człowieka"
 jomsborg.55.desc: "Był to pierwszy dzień Konferencji Technicznej w Burstaborgu. Odbywała się w wielkiej sali wzniesionej nie tak dawno temu i gromadziła wyłącznie najtęższe oraz najbardziej wynalazcze umysły z całego Jomsborga. Szeroki był zakres ich specjalizacji, a jeszcze szersze możliwości. Brakowało im jednak kierunku. Byli wielkim, potężnym światłem, które należało skupić soczewką na problemach nękających te ziemie, aby wypalić je do cna. Czy można było skierować ich lepiej, niż prawdziwie ich inspirując?\n\n- Na początek dzisiejszych prezentacji chciałbym zaprosić na scenę Gunnara Kowalssona. Proszę o oklaski dla naszego szanownego gościa.\n\nProwadzący zszedł ze sceny, ustępując miejsca potężnej postaci, całej z mięśni i starannie zaplecionych włosów. Odziany był w mundur galowy, na którym połyskiwały medale. Cztery za chwałę w rabunku, pięć za udane najazdy i trzy kolejne za inne osiągnięcia w służbie polowej. Chwycił mikrofon dłonią, w której wyglądał on niczym zabawka, i przemówił głębokim głosem, donośniejszym od każdego rogu wojennego.\n\n- Pozdrawiam! To dla mnie zaszczyt stać dziś przed wami! Sądząc po moim wyglądzie, może się tak nie wydawać, ale ja również byłem kiedyś człowiekiem nauki. Jak zapewne widać, odnalazłem jednak inne powołanie.\n\nPo sali przeszedł nieco nerwowy chichot. Mówca ciągnął dalej:\n\n- Wy natomiast pozostaliście wierni swoim profesjom. To powołanie równie szlachetne jak powołanie wojownika. Jesteście tymi, którzy poniosą pochodnię nowego, odrodzonego narodu; narodu wykuwanego w ryku wielkiego pieca, wysiłkiem każdego mężczyzny, każdej kobiety i wszystkich pozostałych. To technika postępu, produkcji i nowoczesności sprowadzi na te ziemie nowy złoty wiek!\n\nZamilkł na chwilę, oceniając reakcję publiczności. Miał ich w garści, niemal siedzieli na krawędziach krzeseł. Zebrał całą siłę głosu i podniósł go do grzmotu podobnego piorunowi.\n\n- Wasze mózgi są waszą największą siłą! W imię postępu i w imię jedności wykorzystajcie je, by nadejście lepszego jutra stało się faktem! Dziękuję."
 jomsborg.55.a: "Gromkie oklaski"

 jomsborg.56.t: "Prostota rzezi"
 jomsborg.56.desc: "- I PAMIĘTAJ, WYRYJ MI NA LUFIE RUNĘ, BO TO PRZYNOSI SZCZĘŚCIE!\n\nSamael Zimmerberg przybył w to miejsce z pobudek idealistycznych, a według niektórych wręcz nierozsądnych. Jego przyjaciele i krewni po inżynierii mechanicznej celowali w wygodne posady w Rheinmetall, Raytheonie czy Boeingu, gdzie projektowaliby i produkowali najnowocześniejszą broń. On natomiast zaangażował się w działalność na rzecz demokratycznego socjalizmu w najlepszy znany sobie sposób: rozpowszechniał przemysłową wiedzę wśród podobnie myślących państw watażków w upadłych krajach.\n\nKiedy więc połowę życiowych oszczędności wydał na maszyny zdolne produkować broń i kolejne maszyny, a drugą połowę na przemycenie samego siebie do Jomsborga, spodziewał się, że zasieje ziarno przemysłowej machiny wojennej dla zwiastuna socjalizmu w kraju, który potrzebował go najbardziej.\n\nZamiast tego trafił do ośrodka rekonstrukcji wikińskiego średniowiecza, w którym wszystko zaszło o wiele za daleko.\n\nZamiast wykorzystać technologię, by zapewnić pokój i dobrobyt robotnikom całego świata, otrzymał odgórną dyrektywę pochodzącą od brodatego barbarzyńcy, szerokiego w barach i wielkiego posturą, któremu towarzyszyły dwie kobiety ze spuszczonymi głowami, niczym konkubiny w osmańskim haremie. Samael czuł się jak w pułapce. Zamiast służyć rewolucji, został zmuszony do pracy dla gospodarki opartej na najazdach, a zamiast tworzyć sieciocentryczne, skoordynowane siły, kazano mu wykuwać broń z poprzedniego stulecia - toporną, lecz przyozdobioną runami.\n\nW kompetentnych rękach uzbrojenie sprawdziłoby się całkiem dobrze. Problem w tym, że trafiało w ręce długobrodego przygłupa, który chrząkał niczym neandertalczyk nad znacznie wątlejszym Samaelem kalibrującym tokarkę do metalu. Mężczyzna domagał się karabinu bojowego z ogniem selektywnym, który mógłby służyć również jako topór.\n\n- TOPÓR. DAJ TOPÓR NA KOLBĘ!\n\n- Z całym szacunkiem, panie Jarku, jak chce pan celować, kiedy oprze pan brodę na ostrzu?!\n\n- TO Z DRUGIEJ STRONY! OSTRZE OPRZE SIĘ NA NAPIERŚNIKU!\n\n- Dobrze, rozumiem, że nie będzie panu przeszkadzało ostrzenie go co drugi dzień!\n\n- OSTRZĘ CODZIENNIE I NA TWOICH PAZNOKCIACH BĘDĘ OSTRZYŁ, JEŚLI NIE ZROBISZ ŁADNEJ RUNY!\n\n- Ta tokarka nie służy do grawerowania takich rzeczy. Chce pan, żebym ręcznie wydłubał runę w kolbie i spędził tu kolejne dwa dni?!\n\n- NAWET DWA TYGODNIE, JEŚLI TO DA PRZYCHYLNOŚĆ BOGÓW! A PÓKI CO BĘDĘ JEŹDZIŁ NA NAJAZDY Z TWOJĄ PATELNIĄ, WIĘCEJ Z NIEJ POŻYTKU NIŻ Z TEGO PISTOLETU Z Kœnugarðru, KTÓRY MI DAŁEŚ!\n\nWiking chodził w kółko, podczas gdy Samael rozrysowywał projekt kolby. Jej dolna część kończyła się ostrzem przypominającym topór, które w gruncie rzeczy mogłoby też posłużyć jako całkiem niezłe narzędzie okopowe. Ze względu na wytrzymałość kolbę należało jednak przeprojektować tak, by stała się prawdziwym hakiem bojowym i pomieściła więcej stali. Wiking zobaczył projekt.\n\n- WIĘKSZY TOPÓR! MA UCINAĆ ŁBY TAK MOCNO, JAK TYLKO SIĘ DA! WIĘKSZY!"
 jomsborg.56.a: "Dlaczego upraszczanie zawsze musi być takie skomplikowane?"

 jomsborg.57.t: "Podstawy władzy"
 jomsborg.57.desc: "Przemówienie do rozsądku tym przeklętym naukowcom nie było dla Andrzeja łatwym zadaniem. Zwyczajnie nie potrafili pojąć, że ich badania powinny służyć przemysłowi cywilnemu, zamiast napędzać wikińską machinę wojenną. Jak mogli udoskonalić coś, co dowiodło swojej wartości już całe wieki temu? A jednak bez przerwy mówili o tym, że nowo zaprojektowany czołg w stylu nordyckim zapewni im zwycięstwo.\n\n- Nie wyzwolimy Polski samymi tymi średniowiecznymi bzdurami, Andrzej! - warknął Krystian. - Inni watażkowie czynią przygotowania, opracowują nowe taktyki, dostosowują się do zmieniającego świata, a ty chcesz skupić się głównie na ludności? Postradałeś zmysły? To właśnie niezdolność do przystosowania się doprowadziła dawnych wikingów do upadku!\n\n- Krystian, nasza armia dowiodła swojej wartości na Pomorzu Zachodnim - odpowiedział spokojnie Andrzej. - Zmiażdżyliśmy każdego heretyka i wroga ludu. Twierdzisz, że inni się przystosowują, ale czy którykolwiek z nich mierzył się z siłą podobną do naszej? Nie znają nas, a prostota naszej taktyki doprowadzi ich do zguby. Ich nowoczesna broń nie będzie nic znaczyła, gdy uciekną w popłochu na widok potężnych berserków rozłupujących im czaszki. Lud pokłada wiarę w Odynie i w nas. Jeśli poświęcimy się poprawie jego życia...\n\nUczeni ponownie wybuchnęli krzykiem, całkowicie zagłuszając Andrzeja. Ich sprzeczne wizje starły się w burzy oskarżeń i urwanych argumentów, a zebranie po raz kolejny pogrążyło się w chaosie. Kiedy zmęczenie wreszcie zmusiło ich do milczenia, Andrzej podjął przerwany wywód.\n\n- Skończyliście? - zapytał spokojnie. - Nie znajdziemy rozsądnego rozwiązania, przekrzykując się nawzajem. Próbuję powiedzieć, że jeśli zainwestujemy w ludzi i naprawdę poprawimy ich życie, nie tylko zapewnimy im dobrobyt. Wzbudzimy lojalność. Więcej ludzi zechce dołączyć do naszych szeregów. Twierdzimy, że walczymy za lud, musimy więc tego dowieść, robiąc wszystko, co w naszej mocy, by podnieść jego poziom życia.\n\nW sali zapadła cisza. Naukowcy spoglądali po sobie, a wcześniejszą wściekłość zastąpiła niepewność. Nikt nie kwapił się, by zabrać głos jako pierwszy.\n\nKrystian odchylił się na krześle.\n\n- Prosisz nas, żebyśmy przekierowali zasoby - powiedział cicho. - Żebyśmy zaryzykowali utratę rozpędu dla cywilów.\n\n- Nie. Proszę was, żebyście zbudowali coś trwałego. Nie tylko coś, co wygrywa bitwy. Musimy wygrać wojnę, a wojny nigdy nie wygrywa się samą stalą.\n\nJeden z uczonych poprawił okulary.\n\n- Silniejsze zaplecze cywilne ustabilizowałoby pobór... i logistykę. W dłuższej perspektywie mogłoby nawet wzmocnić armię bardziej niż jakikolwiek prototyp.\n\nTym razem nikt się nie sprzeciwił. Powoli, niemal niechętnie, ponownie otwarto notatniki, by nakreślić plany budowy dróg, fabryk i gospodarstw. I choć nie odbyło się żadne formalne głosowanie, kierunek przyszłości narodu po cichu uległ zmianie."
 jomsborg.57.a: "Zabezpieczyć przyszłość."

 jomsborg.58.t: "Błogosławieństwa Sif"
 jomsborg.58.desc: "- A zatem, panie Jastrzębski... - kobieta postawiła kolejny znak na podkładce z dokumentami. - Z przeprowadzonej przeze mnie kontroli wynika, że pańskie gospodarstwo nie spełnia żadnego z nowych wymogów naszych przepisów bezpieczeństwa rolniczego. Szczerze mówiąc, nie spełniałoby nawet norm sprzed Upadku, ale odbiegam od tematu. \n- Z całym szacunkiem, proszę pani, ja pani nie uczę, jak tam sobie stawiać ptaszki czy co pani robi, więc niech pani mnie nie uczy, jak mam uprawiać swoje rośliny. Ojciec mi pokazał, jak dbać o tę ziemię, kiedy namęczył się, żeby resztki PGR-u znowu nadawały się pod uprawę. Nie pozwolę, żeby pani eksperymenty zniszczyły jego dziedzictwo. \n- Nie przyszłam się z panem kłócić. Otrzymał pan dotacje mające umożliwić ekologiczną restrukturyzację. W pańskim długoterminowym interesie leży, by pańskie dzieci mogły kiedyś uprawiać ziemię swojego dziadka. Te reformy mają im to umożliwić. Informuję również, że niedostosowanie się do przepisów będzie skutkowało karami finansowymi. Jakieś dalsze pytania? \n- Nie - Jastrzębski spuścił wzrok. \n- Do widzenia. \n- Do widzenia. \n \n- Reforma tak dobra, że trzeba ludzi zmuszać, żeby się do niej stosowali - mruknął do siebie po odejściu inspektorki i splunął na ziemię. \nZaczął się zastanawiać, skąd rząd mógł się dowiedzieć. Przekupił miejscowego wójta, a nawet kilku urzędników powiatowych, żeby przymykali oko. Rodzina by go nie wydała, nawet Milenka. Kto mógł... \nI nagle go olśniło. Wsiadł do samochodu i pojechał na skraj pola. \n- Ten skurwysyn... - powiedział Jastrzębski, gdy ujrzał głównego podejrzanego. \nDługowłosy hipis jeździł traktorem, dbając o własną ziemię, a przy okazji niszcząc dorobek innych. \n- O, witaj, sąsiedzie - pomachał w stronę Jastrzębskiego. - Jak leci? \n- Nie sąsiaduj mi tu, Bjorn - oburzył się rolnik. - Wiem, że to ty na mnie doniosłeś. \n- Ale o czym ty mówisz? \n- Nasłałeś na mnie inspektorów. Tylko dlatego, że sam gospodarujesz jak jakaś ciota, nie znaczy, że wszyscy mają tak robić. \n- Co ciotowatego jest w trosce o naturę? W zapewnieniu gdaczącym dzieciom Freyra dość miejsca, by mogły przeżyć życie w całej pełni? Albo w używaniu owoców samej natury do nawożenia gleby, aby złote włosy Sif mogły wyrosnąć spod ziemi? \n- Właśnie o tym mówię. Pogańsko-ciotowate gusła. Przestań tylko nasyłać ekoterrorystów na moje pole, bo pokażę ci, jak wygląda prawdziwy najazd! \n- Nie wiem, o czym mówisz, ale dobrze, jak sobie chcesz. \nJastrzębski odjechał samochodem w poczuciu dobrze spełnionego obowiązku. Kiedy zniknął, Bjorn wyjął telefon i zadzwonił."
 jomsborg.58.a: "W mojej okolicy przyda się kolejna kontrola."

 jomsborg.59.t: "W poszukiwaniu Stórbóndiego"
 jomsborg.59.desc: "Biura administracyjne Fitandi Fylki jak zwykle świeciły pustkami, nie licząc miejscowego wodza i jego najbliższych urzędników. Po wygnaniu dawnych właścicieli ziemskich większość ich pól leżała odłogiem. Już w poprzednim sezonie brak upraw doprowadził do poważnych nieurodzajów. Wodzostwo umierało i aby zapobiec jego zagładzie, potrzebowało większej liczby rolników; byłych wikingów gotowych porzucić życie pełne najazdów i grabieży, by osiąść na roli. \n\n- Przynieś mi dobre wieści, Olav. Zgłosili się jacyś kandydaci? \n- Nie... do końca, hersirze. Ale będziemy szukać dalej. Haakon wciąż ma kontakty wśród wikingów. Gdyby zwiększył pan nagrodę dla osadników, moglibyśmy spróbować przedstawić im naszą ofertę. \n- Olav, minęły dwa miesiące. Nie możesz mi powiedzieć, że nie zgłosiła się ani jedna osoba. Dosłownie rozdajemy im ziemię za darmo. Czego więcej mogą chcieć? \n- Cóż... technicznie rzecz biorąc, mieliśmy kilku kandydatów, ale nasz system weryfikacyjny ich oznaczył i automatycznie odrzucił. \n- Dobrze, nieważne. Przynieś mi ich podania. Nie ufam osądowi Einarra. \n- Hersirze, to pan osobiście mianował go systemem weryfikacyjnym. Czy to nie przeczy całej idei jego istnienia? \n- Posłuchaj. Kiedy on po pijanemu bezmyślnie stawiał czerwony stempel, mogliśmy rozdać większość dostępnej ziemi uprawnej. Lepiej więc miej nadzieję, że wciąż zdołamy dotrzeć do części tych ludzi. \n\nDotarcie do biura Einarra zajęło niecałe trzy minuty. Olav chwycił stos odrzuconych podań i szybko pobiegł z powrotem do swojego wodza. \n\n- Dobrze, oto one. Mam odrzucić podania niekompletne i te złożone dla żartu? \n- Zakładałem, że już to zrobiłeś. Ile ich tu jest, z dziesięć? \n- Dokładnie dwanaście. Ale tego będziemy musieli się pozbyć... To jest zupełnie niezrozumiałe... Och, a ten kandydat najwyraźniej przedarł kartkę na pół... Dobrze, zostało nam... trzech poważnych kandydatów. Świetnie. \n- I nie skontaktowałeś się z nimi, ponieważ...? \n- Vagn Egillsson - stracił nogę podczas najazdu na Mjollnę. W następstwie uznany za niezdolnego do jakiejkolwiek pracy fizycznej. Przyjęcie go prawdopodobnie oznaczałoby wypłacanie renty w zamian za niewielkie albo wręcz żadne korzyści. Knutr ze Svidviku - udokumentowana historia składania roszczeń w niemal każdym wodzostwie. Od zeszłego roku największy właściciel ziemski po tej stronie Svinny. Rzadko odwiedza swoje posiadłości, pracę pozostawiając robotnikom schwytanym podczas najazdów. Nieszczególnie pożyteczny członek społeczności. I na koniec Radulfr Berserker. Słyszał pan o Radulfrze, prawda, hersirze? \n- Mhm. Świetny żołnierz, naprawdę okropny człowiek. Wyrzucono go z Arnskrony za ścięcie miejscowego jarla podczas sporu o ziemię. Nie możemy sobie jednak pozwolić na kolejny nieurodzaj. Ech, skontaktuj się z dwoma ostatnimi. Powiedz, że mogą przyjechać i wybrać sobie dowolną ziemię."
 jomsborg.59.a: "Będą siać. I to jak."

 jomsborg.60.t: "Otworzyć Bramę Steina"
 jomsborg.60.desc: "KRISTI! GDZIE JEST MASKA Z LULKIEM?! CO TO ZA ASYSTENTKA, KTÓRA NIE PILNUJE SKŁADNIKÓW!\n\nKrzyki Zandberga wykrzywiły twarz jego asystentki w grymasie zażenowania. Nie miała na imię Kristi, a to sam Zandberg zapodział lulek, zastępując go przez pomyłkę aromatem z e-papierosa. Zazwyczaj udawało jej się skierować jego uwagę na właściwe miejsce, ale tym razem wyglądał, jakby uparł się trzymać własnej wersji, nawet jeśli opóźni to rytuał. Najpewniej nie pamiętał nawet jej prawdziwego imienia. Westchnęła więc, nic nie powiedziała i po prostu podała mu lulek, który umieścił obok pozostałych składników. Każdy był sproszkowanym halucynogenem przeznaczonym do głębokiego zanurzenia \"poprzez czas i przestrzeń, aby wejrzeć w przyszłość\", jak ująłby to Zandberg.\n\nWSZYSCY! ZEBRALIŚMY SIĘ TUTAJ W TEJ UROCZYSTEJ CHWILI, BY UCZCIĆ PRZESZŁOŚĆ, TERAŹNIEJSZOŚĆ I PRZYSZŁOŚĆ JOMSBORGU! OPERACJA SINDRI ROZPOCZYNA SIĘ! NIECH NORNY UŚMIECHNĄ SIĘ DO NASZEGO NIEUSTRASZONEGO ZANURZENIA I OBNAŻĄ SIĘ PRZED... - asystentka ponownie skrzywiła się z zażenowania. - ...EKHM, OBNAŻĄ PRZED NAMI NASZ LOS! TIL VALHAL!!!!\n\nPodpalono każdą saszetkę z halucynogenami, połączoną gumową rurką z maską gazową tkwiącą na twarzy Zandberga niczym obcy przyssany do ofiary. Płomień powoli trawił zioła, a ich aromat, całkowicie zamknięty w układzie, wypełnił najpierw maskę Zandberga, a potem jego płuca. Asystentka wraz z pozostałymi, w tym Biejat i Zawiszą, opuściła pomieszczenie, aby i one nie ujrzały losu Jomsborga poprzez opary wydobywające się z maski Zandberga.\n\nOn tymczasem mknął przez kosmos. Nie miało znaczenia, czy miał coś na sobie; sam wszechświat leżał przed nim nagi. Nie mógł się poruszyć, mógł jedynie być niesiony - od własnej przeszłości i lat, które go ukształtowały, przez teraźniejszość... zawsze tylko naprzód. Norny uśmiechały się do niego, gdy przechodził w ciemność, która zakrzywiała czas i przestrzeń w jeden krąg. Staruchy stały niewzruszone pomimo widocznego wieku, nadal wyprostowane w swoich szatach. Oczy Skuld nagle rozbłysły. W tym samym błysku ukazała się młodsza twarz, cesarskie fioletowe oczy oraz długie włosy w kolorze kasztanów. Następnie runął w czarną otchłań, gdzie przyszłość czekała, by jej doświadczył.\n\nA potem pojawiła się krew. Topory latały, głowy spadały. Siedział na tronie z czaszek, lecz z jego wysokości odczuwał każdą zadaną ranę i każdą śmierć - zarówno swojego człowieka, jak i wroga. Tron palił wspólnym cierpieniem walczących, zdobywców i podbitych. Adrian nie mógł się poruszyć ani nawet krzyknąć, jakby nie miał ust. A jednak tego chciał. Wiedział, co nastąpi po rzezi, i wkrótce już tam był.\n\nPolska odnowiona przez Jomsborg, z ranami uleczonymi przez cofnięcie zegara tak daleko, że zapomniała o samej sobie. Posągi, runy, spełnione życia, zadowolony lud. Triumfalne pochody zdobywców. Teraz, uwolniony od bólu, wznosił się ku górze. Nadeszła chwila Adriana. Maszerował w kolumnie przez odrodzoną Polskę razem ze swoimi braćmi broni. Adrian wiedział już, że będzie złoty.\n\nKiedy obłęd zaczął ustępować, ujrzał jezioro i rozmyślał nad dalszymi podbojami, które czekały go po urzeczywistnieniu nieuchronnego marzenia. Z Nornami u boku i na skraju pola widzenia - któż mógł być przeciwko niemu? Nikt poza skromnym księdzem, jednym z wielu, których topór Jomsborga uczynił męczennikami. Wtedy usłyszał własne słowa. Przeszedł go dreszcz."
 jomsborg.60.a: "Chcę przyjąć chrzest, by po śmierci połączyć się z moim chrześcijańskim przyjacielem."

 jomsborg.61.t: "Brzemię Walkirii"
 jomsborg.61.desc: "Ulfr na oślep wymachiwał toporem, powoli wycofując się przez leśną polanę. Był tak ciężko ranny, że nawet adrenalina niemal nie tłumiła bólu. Wojownik się potknął; siły opuściły go już dawno, lecz zmuszał się do dalszego wysiłku, wiedząc, że jest otoczony. Napastnicy pilnowali, by zawsze pozostawała mu tylko jedna droga ucieczki, aż w końcu zapędzili go w odgrodzony zaułek. Wyczerpany berserker wykonał w ich stronę groźny gest. \n\n- Jorunnr, ten jest twój. \n- Znowu? Dlaczego zawsze musi paść na mnie, Eydis? \n- Bo taki jest mój rozkaz. A teraz idź tam, zanim znowu nam ucieknie - wycedziła ze złością przez zęby. \n\nPokonując początkowe wahanie, Walkiria wyciągnęła dłoń i powoli ruszyła ku Ulfrowi małymi krokami, starając się wyglądać jak najmniej groźnie. Za każdym razem, gdy spanikowany wojownik wykonywał gwałtowny ruch, wzdrygała się, gotowa uskoczyć przed ciosem. W końcu zbliżyła się tak bardzo, jak mogła bez ryzyka, i przemówiła do niego łagodnie. \n\n- Hej, wielkoludzie. Wyglądasz dość kiepsko. Masz naprawdę paskudną ranę. Nie martw się. Chodź z nami, zaraz cię opatrzymy. \n- Odejdź ode mnie, nikczemna kusicielko! - Zamachał chaotycznie bronią, a Jorunnr na moment znieruchomiała ze strachu, nim odzyskała panowanie nad sobą. \n- Poważnie, odłóż to, zanim ktoś jeszcze ucierpi. Bitwa się skończyła. - Spod udawanej troskliwości przebiło rozdrażnienie. \n- Nie! Wiem, co planujecie. Nie pozwolę wam! Nigdy mnie nie weźmiecie! \n- Posłuchaj, jesteś już bezpieczny. Wykonałeś swoje zadanie. Wygraliśmy. Nie ma sensu wykrwawiać się w jakimś przypadkowym lesie. \n- Odejdź! Pozwól mi iść do Valhalli! Będę ucztował z Bogami! Będę walczył... - Jego głos drżał. Bał się. Walkiria ponownie poczuła współczucie. \n- Ciii, przed nami jeszcze wiele bitew. Jestem pewna, że znajdziesz tę doskonałą, w której będziesz mógł zginąć. To nie musi stać się dzisiaj. \n- Obiecujesz...? - Niemal płakał. \n- Obiecuję. A kiedy przekroczysz bramy Valhalli i staniesz przed Odynem, czy nie chciałbyś mu powiedzieć, że zabiłeś nie dziesięciu, lecz stu óvinir? Pomyśl tylko, jakie wyjątkowe miejsce by wtedy dla ciebie przygotował. \n- Ja... tak, chciałbym... \n- Właśnie. Pracuj więc dalej nad tym wynikiem. I może... następnym razem spróbuj sam do nas podejść? Chyba prawie zadrasnąłeś mnie przez przypadek. - Chwyciła się za niewielką ranę na przedramieniu, próbując ukryć ją przed wzrokiem wikinga."
 jomsborg.61.a: "Przynajmniej ten poszedł dobrowolnie..."

 jomsborg.62.t: "Hårdråde"
 jomsborg.62.desc: "Twarde drewno. Twardy, szorstki stół. I twardzi mężczyźni, przywódcy budzących postrach Jomsborczyków, którzy poświęcili życie wyprawom na wiking. Jedni mieli już pełne brody i długie włosy, innym grzywy dopiero rosły. Oczy wielu były szkliste i roziskrzone po berserkerskich przejściach, lulku i muchomorach. \nZ punktu widzenia Zawiszy byli to jednak przede wszystkim mężczyźni, z którymi trudno było wytrzymać.\n- To prawda, co mówią o Snorrim i Swenie? - zapytał jeden z młodych jarlów.\n- Snorri został zaatakowany i wybity razem z ludźmi. To może oznaczać koniec najazdów w pobliżu Wolnego Miasta, zawsze zapuszczał się tam dalej od pozostałych. Swena schwytała przynęta w klasztorze, który okazał się pełen żołnierzy. Jego berserkowie zostali wybici, to katastrofa - odpowiedział inny młody mężczyzna, obdarzony całą rzeczowością oficera wywiadu wojskowego i pozbawiony jakiejkolwiek osobowości przywódcy Jomsborga.\n- Być może powinniśmy przenieść najazdy gdzie indziej. Uśpić ich czujność fałszywym poczuciem bezpieczeństwa - ciągnął.\nZawisza chwyciła jego miód i wylała go na środek stołu, ściągając na siebie twarde spojrzenia wszystkich pozostałych przywódców, a zarazem zdobywając ich uwagę.\n- Oto wasze poczucie bezpieczeństwa. Wy, wikingowie, już o nie zadbaliście, transmitując swoje najazdy na żywo. Całe województwa są pod bronią i aż kipią żądzą zemsty. Teraz się modlą, opłakują rodziny i wznoszą umocnienia. Jutro? Zjednoczy ich wspólny cel. Potem zjawią się pod naszymi bramami, a wy, berserkowie, będziecie mogli odegrać swoją Straż Wareską... ale nie łudźcie się, nasze mury nie są murami Miklagardu. Łatwiej przyjdzie wam wychłeptać miód ze stołu niż prowadzić najazdy bez żadnej strategii i organizacji.\n\n- Pierwszym punktem obrad powinno być wykupienie Swena - odparował młody jarl.\n- Chyba odbicie go?! - odpowiedział mu posiwiały jarl-berserker.\n- Ale najpierw musimy zebrać siły...\nWkrótce wrzawa urosła tak bardzo, że nie dało się już rozróżnić poszczególnych głosów ani zapanować nad nimi Zawiszy. Zakryła twarz dłonią, powtarzając sobie w myślach mantry o tym, że problemem są mężczyźni. To ona naciskała na Zandberga, aby z tej żałosnej bandy wychwalanych pod niebiosa rozbójników zrobił prawdziwe wojsko, ale teraz zaczynała się zastanawiać, czy najpierw nie potrzebowali zupełnie nowego dowództwa...\nŁUP! Stół oraz wszystko, co na nim stało, zatrzęsły się gwałtownie. Wstał mężczyzna o krótkich włosach i potężnej brodzie, a narzucone na ramiona futro podwajało wrażenie jego rozmiarów. W jego oczach było to, co kochali najbardziej: lodowate spojrzenie surowego władcy.\n- Swena... przetrzymuje cały batalion. Moi zwiadowcy znają położenie i dokonali podstawowej oceny sił. Każdy z was może wejść w opary lulka i zginąć, próbując go odbić. Albo go uwolnimy. Zorganizujemy się, przyjmiemy hierarchię dowodzenia, będziemy walczyć jak armia - siła zdolna nie tylko najeżdżać, lecz także podbijać. Ten kraj i każdy inny, który nam się spodoba! Który z was nie uważa Knuta Wielkiego i Haralda Hardrady za prawdziwych ludzi Północy? Ci mężczyźni podbijali narody albo ginęli, próbując, jak prawdziwi wojownicy. To oni wskazują nam drogę naprzód...\n- Chrześcijanie, wszyscy co do jednego. Wiedziałem, że twoje serce nie należy do Północy - prychnął stary berserker, a Zandberg natychmiast chwycił go za brodę i przyciągnął jego twarz do swojej.\n- Możesz odejść już teraz, jeśli jeszcze raz nazwiesz Hardradę chrześcijaninem. Owszem, miał słabość do Jezusa, ale zawsze włączał go do wspólnego kultu ze Starymi Bogami.\nPuścił brodę i wrócił na swoje miejsce.\n- Żyli u schyłku epoki wikingów, ponieważ dawna wikińska wojna nie potrafiła już sprostać presji coraz lepiej zorganizowanej Europy. Ale nie miejcie złudzeń... ich dziedzictwo żyło w nich nadal. I będzie żyło w nas. Nie damy się rozproszyć jak wędrowni bandyci. Zwyciężymy. A teraz pozwólcie, że pokażę wam, jak zwyciężymy.\n\nZawisza odetchnęła z ulgą. Kiedy właśnie straciła nadzieję, okazało się, że przynajmniej jeden mężczyzna zachował głowę."
 jomsborg.62.a: "Swena uwolniono w następnym tygodniu, a skaldowie jeszcze przez lata śpiewali o stoczonej o niego bitwie."

 jomsborg.63.t: "Wybór technologi"
 jomsborg.63.desc: "Technologia"
 jomsborg.63.a: "Piechota"
 jomsborg.63.b: "Pojazdy"
 jomsborg.63.c: "Marynarka"
 jomsborg.63.d: "Lotnictwo"

 jomsborg.1001.t: "Svinmunnir zgadza się na pakt"
 jomsborg.1001.desc: "Svinmunnir zgodził się zawrzeć pakt z Jomsborgiem, oddając swoje siły na pomoc w podboju Pomorza Zachodniego. Co więcej, zostaną one włączone do jomsborskich struktur wojskowych i administracyjnych. W zamian Jomsborg dostarczy Svinmunnirowi zasoby oraz wsparcie potrzebne do odbudowy ziem zniszczonych przez wojnę, a także uszanuje jego autonomię w obrębie nowej struktury państwowej. To ważny krok na drodze ku zjednoczeniu regionu pod rządami Jomsborga i rozszerzeniu jego wpływów w basenie Morza Bałtyckiego."
 jomsborg.1001.a: "Słabi ugną się przed silnymi."

 jomsborg.1002.t: "Svinmunnir odmawia paktu"
 jomsborg.1002.desc: "Svinmunnir uważa się za lepszego od nas i odmawia przyłączenia się do naszej sprawy. Wierzy, że zdoła oprzeć się naszej potędze i nadal istnieć jako niezależny byt. Pokazuje to tylko, jak niewiele rozumie z siły i determinacji naszego ludu. Odrzucając naszą ofertę, sam sprowadził na siebie zagładę. Jego synowie zginą w bitwie, ziemie zostaną spustoszone, córki i żony pojmane, bogactwa zrabowane, a kultura wymazana. Wszystko dlatego, że był zbyt dumny, by przyjąć wyciągniętą dłoń przyjaźni."
 jomsborg.1002.a: "Czeka ich furia Północy."

 jomsborg_dreams.2.t: "Dzień Dobry"
 jomsborg_dreams.2.desc: "Halfdan Sandbjerg. Obudź się. OBUDŹ SIĘ!\n\nGdy otwierasz oczy, zdajesz sobie sprawę, że czegoś dokonałeś. Zrobiłeś kolejny krok ku swojemu przeznaczeniu - dobremu albo złemu. Dopiero czas pokaże, co przyniesie przyszłość. Na razie jednak czujesz się dobrze. Jesteś pełen energii. Gotowy dokonać wielkich rzeczy."
 jomsborg_dreams.2.a: "To jest moje przeznaczenie!"
 jomsborg_dreams_2_a_tt: "§YPomyślnie przeszedłeś próbę.§!"

 jomsborg_dreams.3.t: "Wstawaj, wikingu. Zesrałeś się."
 jomsborg_dreams.3.desc: "Halfdan Sandbjerg. Obudź się. OBUDŹ SIĘ!\n\nGdy otwierasz oczy, ogarnia cię poczucie, że cokolwiek robisz, nie ma żadnej wartości. Te sny nie dają ci spokoju, a ty wciąż nie potrafisz znaleźć wyjścia z labiryntu. Czujesz, że to coś ważnego, ale za każdym razem robisz coś nie tak. Być może, jeśli naprawdę się skupisz, zdołasz ponownie wywołać te wizje. Może tym razem uda ci się przebrnąć przez cały ten bałagan."
 jomsborg_dreams.3.a: "Boli mnie głowa..."
 jomsborg_dreams_3_a_tt: "§RNie przeszedłeś próby. Będziesz musiał spróbować ponownie.§!"

 jomsborg_dreams.4.t: "Jak się nazywam?" 
 jomsborg_dreams.4.desc: "Adrian Zandberg. Tak. Tak mam na imię. Dawno nie słyszałem tego imienia. No, może nie z własnych ust. Wszystko zaczyna układać się w całość. To, kim byłem, i to, co zrobiłem. Cały ból i całe cierpienie. Ale również to, co dobre - rodzina, przyjaciele, uśmiechy. Wreszcie nastała cisza. Żadnych rogów rozbrzmiewających w czaszce. Żadnego słonego wiatru w płucach. Długie łodzie oddalają się niczym gorączka ustępująca o świcie. Siedzę sam ze swoim imieniem i nie wzdrygam się przed nim. Pamiętam, kim byłem, zanim rozdarłem samego siebie na sagi i ociekające krwią przepowiednie. Pamiętam książki spiętrzone w nierównych wieżach. Długie spory ciągnące się do późnej nocy. Wiarę w to, że zmiana jest powolna, krucha, ludzka. Ale możliwa. Bogowie, których przywołałem, cofają się i znów stają się symbolami. Bitwy przemieniają się w metafory. Teraz widzę, że historia mnie nie wybrała - to ja dałem się jej przytłoczyć. Nie jestem królem. Nie jestem zdobywcą. Jestem człowiekiem, który zagubił się w opowieściach o sile, bo sam czuł się bezsilny. I nie potrafię sobie wybaczyć. Wszystko wokół mnie wydaje się poranione. Nie wiem, czy zdołam to naprawić.\n\nMoże to już nie jest moja opowieść. Moje dłonie są puste. Moja głowa jest pusta.\nAle teraz... to smakuje jak wolność."
 jomsborg_dreams.4.a: "Dobrze cię odzyskać, Adrian."

 jomsborg_dreams.5.t: "Korona obłędu" 
 jomsborg_dreams.5.desc: "To nigdy nie było szaleństwo. Nie. Nie. Ostrze zbyt długo trzymane w pochwie zaczyna brać pochwę za własną skórę. On był tą pochwą. Miękką. Wyłożoną tkaniną. Bał się zadrapać świat. Nazywał to etyką. Ja nazywam to otępieniem. Teraz pamiętam. To nie metafora. Nie fantazja.\nWspomnienia. Jestem Haraldem. Jestem burzą. Sól w ustach. Ciężar żelaza. Sposób, w jaki ludzie patrzą na kogoś, kto się nie waha. To spojrzenie jest prawdą. Słowa są powietrzem. Wola jest rzeczywista. Zrzucałem go z siebie kawałek po kawałku. Najpierw zwątpienie. Potem przeprosiny. Potem imię. Sądził, że władza deprawuje. Nie. Władza wyjaśnia. Wypala słabe włókna i pozostawia samą konstrukcję. Sam kręgosłup. Czuję, jak mój się wydłuża. Kręgi układają się jeden na drugim niczym kamienie w murze twierdzy.\n\nŚwiat jest prosty. Układa się wokół siły tak, jak trawa rozstępuje się przed dziobem okrętu. Ludzie pragną rozkazów. Tęsknią za nimi aż do bólu. Boją się ich, a swój strach nazywają moralnością. Skończyłem się bać. TO JA JESTEM STRACHEM, który zstąpi na całe stworzenie bogów. Powietrze ma ostrzejszy smak. Barwy są jaskrawsze. Moje myśli już nie błądzą. Proste linie. Czyste krawędzie. Nie pozostała żadna miękkość, którą można zranić.\n\nNie ma pęknięcia. Jest podział.\n\nA to, co podzielone, można podbić."
 jomsborg_dreams.5.a: "A zatem naprawdę jesteś stracony..."


 jomsborg_dreams.6.t: "Czerwień i stal" 
 jomsborg_dreams.6.desc: "Nie mogę porzucić wizji. Nagnę je do swojej woli. Wiking we mnie nigdy nie był wyłącznie przemocą. Był buntem. Odmową ugięcia się przed niesprawiedliwością. Wiernością własnym ludziom. Socjalista we mnie nigdy nie był słabością. Był solidarnością. Wiarą w godność każdego człowieka. Teraz widzę łączącą je nić. Obie części mnie próbowały czegoś bronić. Wyraźnie pamiętam swoje zasady - równość, sprawiedliwość, uparte przekonanie, że nikt nie powinien zostać zmiażdżony przez władzę. Czuję jednak również żelazo w kręgosłupie. Nie chcę rządzić poprzez strach, ale nie będę już przepraszał za siłę. Będę walczył - lecz nie dla chwały. Będę budował - lecz bez naiwności.\nHarald był mitem. Adrian był doktryną. Jestem jednym i drugim.\n\nNiosę ogień, lecz sam wybieram, w co go skieruję."
 jomsborg_dreams.6.a: "Nadchodzi nowy świt"


 unification.76.t: "[GetNewspaper]Wikingowie z Jomsborgu podbijają Pomorze Zachodnie!"
 unification.76.desc: "Przed laty, gdy po raz pierwszy utworzono Eurokomisariaty, lewicowych agitatorów i polityków uznano za cierń w boku Tuska. Wśród ich przywódców znajdował się Adrian Zandberg, który wkrótce zaginął w podejrzanych okolicznościach. Nikt nie wiedział, co się z nim później stało, aż w końcu powrócił, by rozpętać nad nami wszystkimi piekło. Jego wielka armia najechała zachodnie wybrzeże, miażdżąc wszelki opór liberałów oraz faszystów i tworząc państwo łączące skandynawską socjaldemokrację z nordyckim pogaństwem. Wkrótce wiele miast należących do sąsiednich klik stanęło w ogniu, stając się świadectwem nowej metody redystrybucji bogactwa - krwawych najazdów na wybrzeże. Choć jest to bez wątpienia metoda brutalna, obywatele Folkerepublikken utrzymują, że dzięki zrabowanym pieniądzom wikińskie państwo dobrobytu naprawdę poprawiło ich poziom życia w porównaniu z czasami Westpolen. Teraz ściga się zarówno kapitalistów, jak i chrześcijan, a ich ciała przerabia się na krwawe orły - ponure przykłady szaleństwa ogarniającego Polskę."
 unification.76.a: "Oby podczas najazdów puszczali heavy metal."
 
 super.76.t: "[GetNewspaper]Wikingowie z Jomsborgu podbijają Polskę!"
 super.76.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
 super.76.a: "Wreszcie zjednoczeni."
 
