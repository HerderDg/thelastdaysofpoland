 JOM_cape_of_good_hope: "Przylądek Dobrej Nadziei"
 JOM_cape_of_good_hope_desc: "Przy przylądkowym głazie ryczą fale,\nmorskie wilki lądują w chwale.\nCzarne ziemie niosą ton rozpaczy,\nłańcuchy wciąż nawiedzają opowieść.\nOdyn nie waży bladej skóry,\nspiżowej ni matki zrodzonej z mrozu.\nWszyscy padają pod gradem,\ntopór i jesion są braćmi.\n\nMaszty niegdyś szukały drogi wokół mórz,\nzłota i przypraw do złupienia.\nBurze rozbijały okręty bezgłośnie,\nprzylądek duchów i gromu.\nDziś rogaty hełm spogląda\nna południe ze szczytów domów.\nPrzeszłość tańczy z teraźniejszością,\nprzysięgi dźwięczą pod stołami."
 
