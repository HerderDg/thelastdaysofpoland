 JOM_dream_1_stage_1_sane: "Morze przechyla się niczym czarne zwierciadło strącone z niebios. Trzysta drakkarów sunie po nim bez wioseł, bez wiatru, a ich smocze dzioby zieją mgłą niczym śpiący bogowie. Tarcze migoczą - czerwienią, złotem, kością.\nNikt nie wiosłuje, a jednak okręty płyną. Nikt nie wydaje rozkazów, a jednak brzeg się zbliża. Anglia wynurza się z mgły niczym nadchodzący los.\nPrzypływ cofa się, jakby bał się dotknąć tego, co nadchodzi. Piasek cię nie wita. On cię rozpoznaje. Powróciłeś odebrać to, co twoje.\nJuż przy pierwszym spojrzeniu widzisz..."
 JOM_dream_1_stage_1_sane_button_1: "Skałę" 
 JOM_dream_1_stage_1_sane_button_2: "Piasek" 
 JOM_dream_1_stage_1_sane_button_3: "Orła" #PING 
 JOM_dream_1_stage_2_sane: "Trawa ugina się bez wiatru. Szeregi Anglosasów ciągną się bez końca, rozmyte niczym tusz na deszczu. Rozbrzmiewa róg, ale dźwięk dobiega z drugiej strony. Jego ton drży w powietrzu, zawieszony między światami.\nZa tobą stoją wojownicy gotowi zagarnąć to królestwo. Ich twarze są kościste i martwe. Czas zaciska się niczym pięść.\nGdzieś tam całe stulecia czekają, by się narodzić. Ziemia jest spragniona, lecz cierpliwa. Łaknie krwi. Jeden krok zdecyduje, które pieśni przetrwają. Twoje serce grzmi głośniej niż armie.\nSłyszysz jeszcze jeden dźwięk...."
 JOM_dream_1_stage_2_sane_button_1: "Grzmot" 
 JOM_dream_1_stage_2_sane_button_2: "Dźwięk rogu" 
 JOM_dream_1_stage_2_sane_button_3: "Płakanie" #PING 
 JOM_dream_1_stage_3_sane: "Most zwęża się, aż nie jest szerszy od myśli. A może to świat się rozszerzył. Anglicy poznają gniew dzikości.\nCZEKAM NA WAS! NO CHODŹCIE! NIE UCIEKAM!\nMost zwęża się, aż ledwie wystarcza na przejście jednej woli.\nŚMIERĆ PO MNIE IDZIE! VALHALLA NA MNIE CZEKA!\nRobi się zbyt ciemno. A może to krew zalewa ci oczy? Nieważne, oni zginą. Wokół leży zbyt wiele ciał.\nMost zwęża się, a następny w krwawym szeregu przyniesie ci zgubę. Wraz z ostatnim oddechem..."
 JOM_dream_1_stage_3_sane_button_1: "Śmiejesz się" #PING
 JOM_dream_1_stage_3_sane_button_2: "Krzyczysz"  
 JOM_dream_1_stage_3_sane_button_3: "Modlisz się"  
 JOM_dream_2_stage_1_sane: "Sala jest pusta, a jednak pełna niewidzialnych świadków. Coś walczy nad twoją głową. Nie widzisz tego, lecz czujesz gniew. Dawni bogowie wiszą pod krokwiami niczym niknący dym. Młot wydaje się cięższy, niż powinien. Krzyż spoczywający na stole wygląda, jakby wyrzeźbiono go z polarnego światła. Jesteś Haraldem Sinozębym, ale zarazem nim nie jesteś. Kim jesteś? Rzeczywistość ugina się ku tobie, jakby czekała na wyrok. W żebrach porusza się coś starszego niż duma. Tron wydaje się tymczasowy. Korona - pożyczona. Jakbyś coś ukrywał.\nWyciągasz dłoń po..."
 JOM_dream_2_stage_1_sane_button_1: "Młot" 
 JOM_dream_2_stage_1_sane_button_2: "Krzyż" 
 JOM_dream_2_stage_1_sane_button_3: "Pióro" #PING 
 JOM_dream_2_stage_2_sane: "Woda chrzcielna jest zimniejsza od wspomnienia i cieplejsza od strachu. Gdy dotyka twojego czoła, świat się przechyla. Sala rozpływa się. Stare runy pękają niczym lód podczas wiosennych roztopów. Krzyż staje się horyzontem. Upadasz wstecz, prosto w światło. Przez chwilę nie jesteś synem bogów - tylko oddechem zawieszonym w srebrnej ciszy wpełzającej do twojego umysłu. Coś odchodzi. Coś wstępuje. Tłum jest odległym grzmotem. Dłonie kapłana są niewzruszone jak kamień. Powstajesz, ale czy to nadal ty? Jakby twój cień pozostał na dole.\nCzujesz..."
 JOM_dream_2_stage_2_sane_button_1: "Cel" 
 JOM_dream_2_stage_2_sane_button_2: "Wolność" #PING 
 JOM_dream_2_stage_2_sane_button_3: "Gniew" 
 JOM_dream_2_stage_3_sane: "Noc nadchodzi łagodnie. Idziesz samotnie pod niebem, które nie wydaje się już podzielone. Wiatr nie niesie ani kruków Odyna, ani wojennych bębnów - tylko bezruch. Gwiazdy zdają się bliższe, cierpliwe, a nie czujne. Ciężar w twojej piersi zmienił kształt. Nie zniknął, lecz się przeobraził. Nie wiesz jednak w co. Siła nie jest już żelazem w pięści. Jest ciepłem dłoni. Dawni bogowie nie szaleją. Gdzie oni są? Byli tutaj. Ale teraz... jest tylko to światło. Oślepiające światło. I ogień. I furia. Nie. Nie furia. Osąd. Wypala wizję w twoim umyśle.\nWizję..."
 JOM_dream_2_stage_3_sane_button_1: "Miłosierdzia" #PING
 JOM_dream_2_stage_3_sane_button_2: "Sprawiedliwości"
 JOM_dream_2_stage_3_sane_button_3: "Zemsty"
 JOM_dream_3_stage_1_sane: "\"Jeszcze jedna myśl na stos, dalej.\"\nMiało usta, lecz żadnych oczu, którymi mogłoby osądzać. Wiecznie głodne nowych idei, dumne z tego, jak wiele wie, choć skrzętnie ukrywało co dokładnie. Tradycja tak stara, jak sięga pamięć, karmiąca je krzyżami z niemal niewypełnionego czeku.\n\"Ptak może wyrwać serce, ale może też wypełni po nim pustkę? A może to właśnie serce jest trucizną?\"\nByło mu wszystko jedno, bo nie ono dźwigałoby ten ciężar. Nawet gdyby sam głód stał się farsą, i tak by go karmiło.\nTrzymasz w dłoniach atrament i pióro. Dlaczego miałbyś nie podtrzymywać tego cyklu?"
 JOM_dream_3_stage_1_sane_button_1: "Ptak"  
 JOM_dream_3_stage_1_sane_button_2: "Nie mógłbym..." #PING  
 JOM_dream_3_stage_1_sane_button_3: "Serce"  
 JOM_dream_3_stage_2_sane: "Liczby migoczą, zmieniają kolejność, wahają się. Zwolennicy pomrukują urwanymi zdaniami. Powietrze staje się gęste i metaliczne. Stoisz zupełnie nieruchomo. Bez gniewu. Bez nadziei. Jakbyś nasłuchiwał czegoś pod głosami - rytmu ukrytego za percepcją. Wyniki pojawiają się i znikają, za każdym razem nieco inne. Szepty przesuwają się niczym przeciąg pod zamkniętymi drzwiami.\nNa zewnątrz naród wstrzymuje oddech. W środku coś pęka bezgłośnie. Niczym przerwane w pół zdanie. Ten koszmar chwyta cię w samym środku głowy. Brakuje miejsca na oddech. Ciemność. Ciemność. Ogień. Pustkowie.\nPróbujesz myśleć o..."
 JOM_dream_3_stage_2_sane_button_1: "Przyszłości" 
 JOM_dream_3_stage_2_sane_button_2: "Rodzinie" #PING
 JOM_dream_3_stage_2_sane_button_3: "Narodzie" 
 JOM_dream_3_stage_3_sane: "Poranek jest bezbarwny. Słońce przestało świecić. Patrzysz w lustro i nie od razu rozpoznajesz własną twarz. Próbujesz się uśmiechnąć. To... nie działa. Widzisz przebłyski żywotów, które nie należą do ciebie: polityka, historyka, twórcy.\nCzy to byłeś ty? Niemożliwe. A jednak czujesz stratę. Strata była prawdziwa. Zwątpienie było prawdziwe.\nCzy to możliwe, że tamto życie było prawdziwe? Gdzie podziała się zemsta? Gdzie są bogowie? Bez nich jest tak pusto. A jednak coś... spływa na ciebie niczym poranek w Asgardzie. Coś utraciłeś.\nJak chcesz to odzyskać?"
 JOM_dream_3_stage_3_sane_button_1: "Razem" #PING
 JOM_dream_3_stage_3_sane_button_2: "Krwią i potem"
 JOM_dream_3_stage_3_sane_button_3: "NIE CHCĘ"

 JOM_dream_1_stage_1_viking: "Morze wypluwa cię na obcy piasek. Czy na pewno obcy? Wydaje się znajomy. Długie okręty ryczą niczym smoki spuszczone z łańcuchów. Wzdłuż brzegu rozkwitają tarcze. Powietrze smakuje żelazem, choć nie przelano jeszcze krwi. Każda fala syczy jedno słowo: zemsta. Za co? Nieważne. Musisz ją wymierzyć. Czujesz, jak przechodzi przez szeregi niczym ogień pod skórą. Jest was tak wielu, jakby cały kontynent zstępował na wroga. Niebo wisi nisko, sine i purpurowe, czekając. W oddali drży zielona, niczego nieświadoma Anglia.\nDlaczego tu jesteśmy?" 
 JOM_dream_1_stage_1_viking_button_1: "Podbój"
 JOM_dream_1_stage_1_viking_button_2: "Duma"
 JOM_dream_1_stage_1_viking_button_3: "Zemsta" #PING
 JOM_dream_1_stage_2_viking: "Bramy Jórvíku pękają niczym żebra. Dym wije się ku górze spiralami pozbawionymi modlitw. Ulice przeobrażają się w labirynt krzyków i stali. Sztandary padają. Kapłani pierzchają. Złoto wysypuje się z rozbitych skrzyń i toczy lśniącymi łukami przez krew. Nazwa miasta zmienia się w twoich ustach. York. Jórvík. Kruki nadlatują, zanim ciała zdążą ostygnąć. W oknach rozkwitają płomienie niczym nowe słońca. Zwycięstwo smakuje słodko - i dziwnie pusto. Dlaczego to robimy? Miasto klęka. Twój głód jednak nie ustępuje.\nMusisz zdecydować, co dalej..."
 JOM_dream_1_stage_2_viking_button_1: "Odbuduj"
 JOM_dream_1_stage_2_viking_button_2: "Okupuj"
 JOM_dream_1_stage_2_viking_button_3: "Złup" #PING
 JOM_dream_1_stage_3_viking: "Król klęczy pod niebem, które nie chce odwrócić wzroku. Jego oddech unosi się krótkimi, zwierzęcymi kłębami. Krąg zamyka się wokół niego, teraz już milczący. Rytuał jest wolniejszy od bitwy. Ostrze kreśli proroctwo wzdłuż kręgosłupa. Nie czujesz pośpiechu. Tylko nieuchronność. Żebra rozkładają się niczym ciemne skrzydła. Krew paruje w zimnym powietrzu. Ziemia pije głęboko. Obserwujący mężczyźni nie wiwatują - dają świadectwo. Zemsta stała się ceremonią. A gdy czerwony orzeł rozpościera skrzydła, patrzysz, jak odlatuje, tym razem biały.\nCo zrobiłeś? DLACZEGO TU JESTEŚ?!"
 JOM_dream_1_stage_3_viking_button_1: "ZEMSTA!" #PING!
 JOM_dream_1_stage_3_viking_button_2: "WYZWOLENIE!"
 JOM_dream_1_stage_3_viking_button_3: "SPRAWIEDLIWOŚĆ!"
 JOM_dream_2_stage_1_viking: "Wielka świątynia jest wyższa od nieba, a jej wieże sięgają korony Yggdrasilu. Złote posągi spoglądają pustymi oczyma, które wydają się niemal wilgotne. Od wody? Czy od krwi? Powietrze jest gęste od dymu i sosnowej żywicy. Uspokajające. Znajome. Nad tobą rzeźbione belki wiją się niczym skamieniałe węże.\nKlękasz, lecz podłoga lekko pulsuje jak śpiące serce. Próbujesz przemówić. Twój głos nie rozbrzmiewa echem. On się mnoży. Posągi pochylają się bliżej. Słuchają.\nBogowie słuchają.\nOch, są tutaj. Albo żerują. Albo... polują.\nPrzynosisz pierwszą ofiarę..."
 JOM_dream_2_stage_1_viking_button_1: "Jagnię" 
 JOM_dream_2_stage_1_viking_button_2: "Kruk"  
 JOM_dream_2_stage_1_viking_button_3: "Wąż" #PING 
 JOM_dream_2_stage_2_viking: "Ogień trzaska błękitnym płomieniem. Najpierw drętwieje język. Potem kości.\nŚciany świątyni wyginają się do środka, oddychając wraz z tobą. Rzeźbienia zaczynają pełzać po belkach. Z cieni wyrastają kruki i ponownie się w nich rozpływają. Twoje dłonie pozostawiają w powietrzu smugi niczym dym pod wodą.\nWidzisz nici łączące każdą żywą istotę. Widzisz, jak się napinają.\nBębny brzmią z oddali albo z wnętrza twojej czaszki. Bicie serca zagłusza myśli.\nWidzisz korzenie największego ze wszystkich drzew"
 JOM_dream_2_stage_2_viking_button_1: "Wspinaj się" 
 JOM_dream_2_stage_2_viking_button_2: "Tańcz" #PING 
 JOM_dream_2_stage_2_viking_button_3: "Módl się" 
 JOM_dream_2_stage_3_viking: "Krąg się zamyka. Pochodnie migoczą zielenią. Wybrana ofiara klęczy przed ołtarzem - a może to ty. Nóż lśni, choć nie odbija światła. Tłum nuci nisko i miarowo niczym morze pod lodem.\nKrew pachnie dziś słodko. Jest konieczna. Świat zawęża się do ostrza i oddechu. Chwila rozciąga się, aż zdaje się wieczna.\nBogowie są teraz blisko. Tak blisko, że czujesz ich głód napierający na żebra.\nOdynie, czy to ty? Nóż drży. Nie ze strachu. Z rozpoznania.\nCo będzie twoją ostatnią ofiarą?"
 JOM_dream_2_stage_3_viking_button_1: "JA!" #PING
 JOM_dream_2_stage_3_viking_button_2: "ŚWIAT!" 
 JOM_dream_2_stage_3_viking_button_3: "KREW!" 
 JOM_dream_3_stage_1_viking: "Niebo rozdziera się na dwoje. Stoisz u bram Valhalli, choć sala jest większa niż góry i mniejsza niż uderzenie serca. Wojownicy wylewają się z jej wrót niczym iskry z kuźni, zbroje płoną, a oczy są już martwe, lecz wciąż goreją. Odyn przechodzi obok ciebie - krocząc i rozwijając się, podczas gdy jego kruki krążą wokół niego wspak. W twoich dłoniach spoczywa Gjallarhorn.\nJest ciepły. Jest nieunikniony. Niebiosa pękają niczym lód pod naporem.\nJeden. Ostatni. Raz. Za śmierć i po zniszczenie. Czerwony świt drży.\nUnosisz głos i krzyczysz:"
 JOM_dream_3_stage_1_viking_button_1: "ŚMIEEEEEEEERĆ!" #PING
 JOM_dream_3_stage_1_viking_button_2: "DO ATAKU!"
 JOM_dream_3_stage_1_viking_button_3: "NAPRZÓD EINHERJARZY!"
 JOM_dream_3_stage_2_viking: "Szczęki Skölla zamykają się wokół słońca. Thor się zatacza. Jad płynie w jego żyłach.\nDwie minuty do upadku. Frejr krwawi światłem. Odyn pada bezgłośnie, pochłonięty przez głód starszy niż proroctwo. Jedno po drugim bóstwa zapadają się nie w ziemię, lecz w ciszę. Ich krew nie jest czerwona.\nStoisz pośród ich ciał, nietknięty. Niebo płonie zielenią. Gwiazdy cofają się w pustkę. Nie wznoszą się żadne modlitwy. Nie odpowiada żaden cud. Ziemia zaczyna pękać.\nŚwiat nie kończy się krzykiem. Wydaje ostatnie tchnienie.\nA ty..."
 JOM_dream_3_stage_2_viking_button_1: "Rozpaczasz" 
 JOM_dream_3_stage_2_viking_button_2: "Powstajesz z kolan" 
 JOM_dream_3_stage_2_viking_button_3: "Stajesz się" #PING 
 JOM_dream_3_stage_3_viking: "Surtr nie kroczy. Jest horyzontem sunącym naprzód. Jego miecz rozciąga się w poprzek nieba, zamieniając światło dnia w popiół. Asgard pęka niczym szkło upuszczone z wielkiej wysokości. Bifröst topnieje w deszczu żaru. Sale zapadają się do wewnątrz, a złote kolumny składają niczym umierające drzewa.\nStoisz na skraju płonącego świata. Żar cię nie parzy. Wszystko, co zbudowano, obraca się w dym. Wszystko, co wieczne, okazuje się kruche. Ostatni akt woli pragnącej wznieść się ku nowemu świtowi.\nJest w twoim zasięgu.\nCHWYĆ GO."
 JOM_dream_3_stage_3_viking_button_1: "WALCZ" 
 JOM_dream_3_stage_3_viking_button_2: "PŁOŃ" #PING
 JOM_dream_3_stage_3_viking_button_3: "WSTĄP" 

 ##tooltips##
 JOM_oder_companies_tt: "Odblokowuje kilku kontrahentó, takich jak §YYara Vendland, Gryfskand, Carlsberg Wendia§! i §YZakład Pojazdów Szynowych Stargard§!"
 JOM_deep_raids_upgrade_tt: "§RPodwaja§! ilość łupów zdobywanych podczas §Ynajazdów wikińskich§!"
 JOM_looting_churches_tt: "§RBogactwa czekają! Odbierzemy tym nieznośnym chrześcijanom wszystko, co powinno należeć do ludu!§!"
 JOM_razing_churches_tt: "§RRaz na zawsze zrównamy z ziemią wszystkie kościoły katolickie, a ich bogactwo zostanie rozdzielone!\n\nUWAGA! Ten krok może w przyszłości przynieść straszliwe konsekwencje...§!"
 JOM_defund_church_tt: "Miesięczne koszty utrzymania §Yświątyni§!: §G-100%§!"
 JOM_svinmunnir_tt: "Poprosimy wyspiarzy ze Svinmunniru, by dołączyli do naszej sprawy i pomogli nam w podbojach.\n§RUWAGA! Jeśli odmówią, nasz jarl z pewnością wypowie im wojnę!§!"

 JOM_unfinished_content_tt: "Ten cel §Gwczytałby§! kolejne drzewko celów, §Rgdyby takowe istniało.§! Niestety cały budżet moda został §Rzrabowany§! przez wikingów, więc produkcja posuwa się w §Rwolnym§! tempie, §Ro ile w ogóle.§! Twoje drzewko celów §Gzmieni się§! jednak na generyczne, aby umożliwić grę aż do §Gzjednoczenia.§!"

