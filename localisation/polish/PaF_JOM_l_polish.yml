 JOM_lost_inca_treasures_desc: ""
 
 JOM_safari_equator: "Safari na równiku"
 JOM_safari_equator_desc: "Słońce tnie liściaste bicze,\ngorący wiatr dławi jeźdźców.\nLwy skradają się przez włócznię traw,\nrogi łamią kości skrytych.\nBębny wspominają dni kajdan,\nbiali rządzili ogniem.\nZłoto wciąż karmi żyły\ngłęboko pod stosem.\n\nSzakale wyją przy grobowych chatach,\npopiół wciąż znaczy granicę.\nKrokodyle leżą w błotnych koleinach,\noczy milczącego porządku.\nŻelazo porusza blask snu,\nropa i klejnoty w głębi.\nLudzie Północy ważą wiedzę otchłani,\na chciwość szybko podąża ich śladem."
 
 JOM_horn_of_africa: "Róg Afryki"
 JOM_horn_of_africa_desc: "Okręty o stalowych kadłubach niosły ludzi Północy,\nziemia Rogu - susza i głód,\npył wznosił się wokół starego Mogadiszu,\ncisza otulała grzmot.\nRozbite miasta czekały,\nzdruzgotane mury i groby,\nwiatr wiał mocno przez Bosaso,\ncienie skrywały niewolników.\n\nCzarne żagle przecięły linię nieba,\noczy piratów były jak ogień,\nkarabiny śpiewały w ciszy,\nwiosła uderzały z żądzą.\nKrew plamiła piasek i morską wodę,\nwłócznie zwarły się przy brzegu,\nludzie Północy spotkali ciemność,\na śmierć przyszła jak dawniej."
 
 JOM_realm_of_the_ancient_gods: "Królestwo starożytnych bogów"
 JOM_realm_of_the_ancient_gods_desc: ""
 
