##Characters##

 POLITICS_HALFDAN_SANDBJERG_DESC: "Był taki człowiek, który marzył o lepszej Polsce. O sprawiedliwości społecznej i równości. O pokojowej walce o prawa i przeciwko wyzyskowi. Człowiek ten ostrożnie nawigował fale wzburzonego morza politycznego, starając się balansować pomiędzy potrzebami ludu a wymaganiami liberalnej demokracji. Wszystkie te starania spaliły na panewce.\n\nInterwencja Unii Europejskiej, która z początku wyglądała na dobry obrót spraw - przyniosła jedynie większą katastrofę Polsce. Drzwi prowadzące do sprawiedliwego i równego Europejskiego społeczeństwa tak jak były, tak pozostały zamknięte. Adrian Zandberg nie omieszkał rozpocząć krytyki rządu okupacyjnego, a wściekłe społeczeństwo szybko i ochoczo podchwyciło jego pełne gniewu słowa. To sprawiło, że Tusk wydał nakaz aresztowania Zandberga i osadzenia go w jednym z najgorszych obozów reedukacyjnych prowadzonych przez najgorszych zbirów jakich posiadał. Zandberg nigdy nie wspominał żadnych szczegółów, ale uciekł z obozu jako całkowicie zmieniony człowiek.\n\nUdał się jako wygnaniec na wybrzeże Bornholmu, gdzie często stojąc na brzegu wpatrywał się w dal. Mógł uciec za morze, to prawda, ale jego korzenie są właśnie tutaj - na północy. Krew zaczęła się w nim gotować a jego dusza wzywała zemsty. Jaki pożytek jest z bezustannych kłótni i próbie przepychania zmian pokojowymi sposobami? Zandberg jest ocalałym, jest wojownikiem, jest Normanem - jest wikingiem. Jeśli Polska nie jest w stanie stać się sprawiedliwym i cywilizowanym krajem - tym gorzej dla Polski.\n\nSandbjerg, jak się teraz zwie - chce rozpocząć zmianę ostrzem topora a zakończyć ją pomocną ręką. Redystrybucja dóbr może zostać osiągnięta tylko przy pomocy siły, a tej Sandbjerg ma wiele. Zarówno tej osobistej, jak i tej skupionej w innych źródłach; w odklejonych neopoganach, rozczarowanych rewolucjonistach, czy zradykalizowanych socjaldemokratach. Ktokolwiek jest gotów walczyć o swoje racje - znajdzie miejsce u boku Jarla. Ciężko odpowiedzieć na pytanie czy to jest bardzo niekonwencjonalna interpretacja socjalizmu, albo po prostu czyste urojenie jakich u watażków wiele - czas pokaże.\n\nPóki co, §0z północy nadciąga burza, a czas Polaków przeminął.§!"

##Decisions##
 
