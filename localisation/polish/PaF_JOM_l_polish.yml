 ##spirits##
 JOM_exiles: "Banda wygnańców"

 JOM_exiles_desc: "Długa jest podróż do złych przyjaciół,\nChoć niedaleko mieszkają;\nLecz do dobrego druha na przełaj się pędzi,\nNie bacząc, czy daleko.\n\nRuszać w drogę należy, gościowi nie wolno\nDługo siedzieć pod tą samą strzechą;\nKto miłym był, natrętem się stanie\nGdy cięgiem siedzi na ławie.."
 JOM_duality_of_man: "Dwoistość człowieka"
 JOM_duality_of_man_desc: "Orzeł, gdy łowi, szuka wypatruje,\nNad brzegiem morskim się zatrzymawszy -\nTak też i człowiek, gdy się w tłum zamiesza,\nA ma stronników niewielu.\n\nStawiać pytania też umieć trzeba,\nGdy chcesz, by cię mądrym zwano;\nJeden tylko ma wiedzieć, nie kilku,\nWie trzech - wie świat cały."
 JOM_northern_spirit: "Północna dusza"
 JOM_northern_spirit_desc: "Zdycha ci bydło, umierają krewni\nI ty sam umierasz;\nLecz sława, którąś zdobył\nNie umrze nigdy.\n\nZdycha ci bydło, umierają krewni\nI ty sam umierasz;\nWiem jedną rzecz, co nigdy nie umrze;\nSąd o umarłym."

 JOM_viking_raids_coast: "Najazdy wikingów"
 JOM_viking_raids_coast_desc: ""
 JOM_viking_raids_deep: "Najazdy wikingów"
 JOM_viking_raids_deep_desc: ""
 JOM_land_contacts: "Kontakty na lądzie"
 JOM_land_contacts_desc: "Poleciał Loki, pióra szumiały,\nAż wyfrunął z kraju Olbrzymów,\nI przybył do Asów grodu.\nPośrodku grodu spotkał Thora:\nTen słowy takimi wraz się odezwał:\n\nCzy warto było jechać?\nDaj mi pókiś w locie, upragnioną wieść;\nSiedzącym często mówić się nie chce,\nLeżącym - kłamstwo na myśl przychodzi."

 JOM_tyr_idea: "Błogosławieństwo Týra"
 JOM_tyr_idea_desc: "Zwycięstwa runy znać musisz, gdy zwycięstwo chcesz odnieść,\nRysować je na miecza rękojeści;\nA inne na jelcu, znów inne na brzeszczocie,\nI dwakroś wezwać Tyra."
 JOM_tyr_idea_5: "Świt Normanów"
 JOM_tyr_idea_5_desc: "Zwycięstwa runy znać musisz, gdy zwycięstwo chcesz odnieść,\nRysować je na miecza rękojeści;\nA inne na jelcu, znów inne na brzeszczocie,\nI dwakroś wezwać Tyra.\n\nChwackiemu lepiej w wojaczce szczęście sprzyja,\nNiż temu co nie jest zuchem;\nBeztroski lepiej sobie radzi niż bojaźliwy\nJakakolwiek by bieda była."

 JOM_tyr_idea_5_alt: "Wikingowie współczesnego pola walki"
 JOM_tyr_idea_5_alt_desc: "Zwycięstwa runy znać musisz, gdy zwycięstwo chcesz odnieść,\nRysować je na miecza rękojeści;\nA inne na jelcu, znów inne na brzeszczocie,\nI dwakroś wezwać Tyra.\n\nChwackiemu lepiej w wojaczce szczęście sprzyja,\nNiż temu co nie jest zuchem;\nBeztroski lepiej sobie radzi niż bojaźliwy\nJakakolwiek by bieda była."

 JOM_frigg_idea: "Błogosławieństwo Friggi"
 JOM_frigg_idea_desc: "W śmiertelnym zmęczeniu młoda matka,\nOzwała się, to były pierwsze jej słowa:\nNiech dopomogą ci bogi,\nFrigg i Freyja i inni potężni,\nZa to, żeś mnie wyzwoliła w grozy godzinie."

 JOM_christian_uproar_1: "Chrześcijańskie oburzenie"
 JOM_christian_uproar_1_desc: "Ósmą śpiewam pieśń, jeśli cię zastanie\nNoc na ciemnej drodze:\nNiech cię nie spotka zło\nOd chrześcijańskiej zmarłej kobiety."
 JOM_shipbuilding_frenzy: "Szał budowy statków"
 JOM_shipbuilding_frenzy_desc: "Wiosłowali gwałtownie, że aż kil się złamał,\nWiosłowali w tył plecami, szaleństwo ich opętało;\nDulki się połamały, rzemienie porozrywały,\nNie przycumowali łodzi, gdy brzeg opuścili."
 JOM_shipbuilding_frenzy_2: "Władcy mórz"
 JOM_shipbuilding_frenzy_2_desc: "Wiosłowali gwałtownie, że aż kil się złamał,\nWiosłowali w tył plecami, szaleństwo ich opętało;\nDulki się połamały, rzemienie porozrywały,\nNie przycumowali łodzi, gdy brzeg opuścili."

 JOM_shipbuilding_cuts: "Cięcia w marynarce"
 JOM_shipbuilding_cuts_desc: "Na wietrze drzewa ścinaj,\nprzy korzystnej bryzie żegluj,\nW mroku z dziewczyną szepcz:\ndzień ma wiele oczu.\nOd statku wymagaj szybkości,\nod tarczy, że da ochronę,\nOd miecza - ostrego cięcia,\nod dziewczyny - całusa."

 JOM_state_investment_fund_1: "Państwowy Fundusz Inwestycyjny"
 JOM_state_investment_fund_1_desc: "O świcie wstać musi, kto ma sług mało,\nI dziarsko iść do dzieła;\nWiele prześlepi, kto długo śpi,\nPilnemu pół drogi do bogactwa."
 JOM_state_investment_fund_2: "Państwowy Fundusz Inwestycyjny"
 JOM_state_investment_fund_3: "Państwowy Fundusz Inwestycyjny"
 JOM_silicon_coast: "Wyobrażenie przyszłości"
 JOM_silicon_coast_desc: "Salę widzę, od słońca piękniejszą,\nDach złotem kryty na Gimlei:\nSprawiedliwi tam mieszkać będą,\nSzczęścia wiecznego doznawać będą."

 JOM_oder_estuary1: "Zabezpieczenie ujścia Odry"
 JOM_oder_estuary1_desc: "Wnet każdy pachołek na koniu siedział,\nWalońskie niewiasty wsadzono na wozy;\nSiedem dni ciągnęliśmy zimnym krajem,\nNastępnych siedem pruliśmy fale,\nA w trzeciej siódemce na suchy ląd wyszliśmy.\nTam strażnicy wysokiego zamku\nBramę otworzyli i konno wjechaliśmy na dziedziniec."
 JOM_oder_estuary2: "Zachodnia Brama"
 JOM_oder_estuary2_desc: "Wnet każdy pachołek na koniu siedział,\nWalońskie niewiasty wsadzono na wozy;\nSiedem dni ciągnęliśmy zimnym krajem,\nNastępnych siedem pruliśmy fale,\nA w trzeciej siódemce na suchy ląd wyszliśmy.\nTam strażnicy wysokiego zamku\nBramę otworzyli i konno wjechaliśmy na dziedziniec."
 JOM_heregeld: "Heregeld"
 JOM_heregeld_desc: "Nie przyszłam tu na pomoc tobie\nDlatego, żeś tego warta;\nPrzysięgę złożyłam - i dotychczas dotrzymałam,\nŻe każdemu we wszystkim pomagać będę."

 JOM_lizard_proving_grounds: "Bój z Jaszczurami"
 JOM_lizard_proving_grounds_desc: "Smok ciemny tam nadlatuje\nWąż lśniący, z dołu od Nidafjoll;\nNa piórach Nidhogg - lecąc nad polem,\nNiesie trupy - teraz ginie."
 JOM_words_of_raven_idea: "Huginn i Muninn"
 JOM_words_of_raven_idea_desc: "Hugin i Munin co dzień latają\nNad ziemią;\nBoje się o Hugina, że może nie wróci,\nLecz o Munina jeszcze większą mam troskę."
 JOM_nordic_model_idea: "Budowa modelu nordyckiego"
 JOM_nordic_model_idea_desc: "Daru wymowy runy znać musisz, gdy chcesz\nBy nikt gniewu twego zemstą nie odpłacił;\nMasz je przekręcać, masz je wikłać,\nI masz je wszystkie przytoczyć,\nNa tym tingu, gdzie przed zgromadzonym ludem,\nPełna liczba sędziów sądzić będzie."
 JOM_jarl_commonwealth_idea: "Uprzywilejowani Jarlowie"
 JOM_jarl_commonwealth_idea_desc: "Nie jest całkiem nieszczęsny mąż, choć nie ma zdrowia;\nJednym synowie są szczęściem,\nInnym przyjaciele, a innym bogactwa,\nTamtemu - czyny jakich dokonał."

 JOM_back_to_nature_idea: "Inicjatywa Szkółek Roślin"
 JOM_back_to_nature_idea_desc: "Widzę, jak znów się wyłania,\nZiemia z morza, zieleniejąca;\nLecą wodospady, a orzeł nad nimi,\nTen co w górskiej krainie ryby łowi."

 JOM_identity_problems_idea: "Rozdarta dusza narodu"
 JOM_identity_problems_idea_desc: "To mi Atli w cztery oczy powiedział,\nŻe mi nie wyda mojego wiana,\nNi złota, ni ziem, gdy nie wyjdę za mąż,\nNiczego z należnego mi spadku,\nNi ziem, mnie, dziedziczce, nie przekaże,\nNi złota, mnie, dziedzicze, nie przekaże"

 JOM_identity_problems_idea_pol4: "Jeszcze Wendia nie zginęła!"
 JOM_identity_problems_idea_pol4_desc: "Po drugie: gdy wyszedłeś z domu, i gotów jesteś do drogi,\nA dwóch zobaczysz na ganku stojących, skorych do bitki chłopów.\nPo trzecie: gdy usłyszysz jak wyje, wilk pod konarem jesiona,\nDane ci będzie zwycięstwo nad wrogami, jeśli ich pierwszy zobaczysz."

 JOM_asatru_revival: "Odrodzenie Asatru"
 JOM_asatru_revival_desc: "Odyn zwę się teraz, dawniej Ygg się zwałem,\nThundrem byłem swoim czasie,\nWAkr i Skilfing, Wafudr i Hroptatyr,\nGautr i Jalk wśród bogów, Ofnir i Swafnir - oni wszyscy,\nZjednoczeni we mnie jedynym."
 
 JOM_vikings_farming_potatoes: "Sezon najazdowy skończony"
 JOM_vikings_farming_potatoes_desc: "Przy ognisku popijaj piwo,,\na po lodzie jedź na łyżwach,\nKup chudą szkapę i zardziewiały miecz,\nKonia tucz w domu, a psa na cudzym podwórzu."
 JOM_vikings_farming_kills: "Sezon najazdowy w toku"
 JOM_vikings_farming_kills_desc: "Tam był łoskot wioseł, zgrzyt żelaza,\nTarcz trzask o tarcze, wiosłowali wikingowie;\nJak błyskawica leciała z wojskiem,\nKrólewska flota, daleko od lądu"

 JOM_nine_worlds_idea: "Mądrość Dziewięciu Światów"
 JOM_nine_worlds_idea_desc: "Pomnę olbrzymów przed wieki poczętych,\nCo piastunami byli moimi.\nI pomnę dziewięć światów,\nI dziewięć Świętego drzewa,\nkorzeni w głąb ziemi."

 JOM_northern_industry_idea: "Rewitalizacja północnego przemysłu"
 JOM_northern_industry_idea_desc: "Miecz błyszczy Nidudowi u pasa,\nTen który ostrzyłem, jakem mógł najzręczniej,\nHartował w ogniu najżarliwszym - jak mi się zdało.\nMiecz ten lśniący na zawsze mi zabrany:\nTeraz nosi Bodwild pierścień rudozłoty,\nMojej dziewczyny - zemsty nie doczekam się nigdy"
