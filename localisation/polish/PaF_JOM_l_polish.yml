 JOM_emerald_island: "Szmaragdowa Wyspa"
 JOM_emerald_island_desc: "Zielona jest oblubienica morskiej mgły,\nzachodni wiatr złotem ją koronuje.\nJej wzgórza miękkie jak oddech dziewczyny,\na głazy pamiętają pradawne hymny.\n\nChmury piją głęboko z wielkiego rogu nieba,\na rzeki śpiewają w cienistych dolinach.\nGdzie kroczyli druidzi i płakali królowie,\nzasłona między światami staje się cienka.\n\nO Éire, płomieniu zachodnich mórz,\ntwą duszę osnuwa srebrzysty deszcz.\nŻaden miecz nie posiądzie twego tkanego serca\nani nie spali korzeni świętej równiny.\n\nPrzybyliśmy nie jako bogowie, lecz śmiali wędrowcy,\ni znaleźliśmy w tobie krainę snu.\nTwe imię wyryliśmy na żaglach i kamieniu,\nszeptaną modlitwę do wszystkiego, co lśni."

 JOM_green_pastures: "Zielone pastwiska Færeyjaru"
 JOM_green_pastures_desc: ""

 JOM_ashes_of_danelagh: "Popioły Danelaw"
 JOM_ashes_of_danelagh_desc: ""

