unification.134.t: "[GetNewspaper]Republika Tarnobrzega jednoczy Podkarpacie!"
unification.134.desc: "Podczas gdy inne województwa pogrążają się w szaleństwie i radykalizmie politycznym, na spokojnym Podkarpaciu powróciła normalność. Zamiast ulec retoryce demagogów i despotów, mieszkańcy regionu postanowili zabrać głos. Ponieważ na rozdartym wojną terytorium była to ostatnia demokratyczna frakcja, ludzie masowo poparli rząd Elżbiety Witek. Połączone siły niedobitków armii i ochotników zdołały odeprzeć zarówno ukraińskich najeźdźców, jak i inne państewka watażków. Stabilność powraca do województwa, lecz odbudowa jest daleka od zakończenia. Choć dziś mieszkańcy świętują ciężko wywalczone zwycięstwo, wciąż cierpią z powodu biedy i głodu. Wojna wyrządziła Polsce nieodwracalne szkody, a ponura rzeczywistość jest taka, że nawet zjednoczone Podkarpacie nie może zostać pozostawione samemu sobie i oszczędzone przez nadchodzący rozlew krwi. Niech mieszkańcy regionu nacieszą się tą chwilą pokoju, bo jest ona znacznie bardziej ulotna, niż śmią przypuszczać."
unification.134.a: "Zwyciężył zdrowy rozsądek. Szkoda, że nie można tego powiedzieć o reszcie kraju..."

super.134.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.134.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.134.a: "Wreszcie zjednoczeni."
