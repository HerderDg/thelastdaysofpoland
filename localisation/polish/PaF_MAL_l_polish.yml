POLITICS_LESZEK_BUBEL_DESC: "Do trzech razy sztuka, jak wielu lubi mawiać. Choć Bubel dwukrotnie przegrał w wyborach na urząd prezydenta Polski (i to dość mocno), wygląda na to, że ponownie chce spróbować szczęścia w walce o zostanie najwyższym przywódcą kraju - tym razem mieczem, a nie kartą wyborczą. Gdy przejął Malbork, do jego ruchu dołączyło wielu bardziej umiarkowanych polityków, nie z powodu rzeczywistego poparcia dla jego poglądów, lecz ze strachu przed szaleństwem, jakie mogły sprowadzić inne ugrupowania na Warmii i Mazurach.\nBubel jest pod wieloma względami postacią dość kontrowersyjną. Jego kampanie polityczne z lat 90. i początku XXI wieku można było uznać za śmieszne przedsięwzięcia, lecz późniejsza działalność wywoływała coraz to liczniejsze fale oburzenia z powodu chociażby jego skrajnego antysemityzmu.\n\nJednak wszystko, co wydarzyło się wcześniej, nie ma już znaczenia. Upadek porządku PiS dał Bublowi szansę na odkupienie dawnych porażek, a jego wysiłki na rzecz odbudowy Polski nie będą już dłużej hamowane przez żydowskich agentów w Sejmie."

##Events##
unification.93.t: "[GetNewspaper]Malbork jednoczy Warmię i Mazury!"
unification.93.desc: "\"W nowo narodzonej polskiej anarchii wiele upadłych ruchów politycznych otrzymało drugą szansę na odzyskanie znaczenia.\" To stwierdzenie wielokrotnie okazywało się prawdziwe wraz z masowym pojawianiem się marginalnych polityków i ideologii w roli fundamentów licznych polskich państewek watażków.\nJednemu z takich wcześniej nieistotnych polityków, Leszkowi Bublowi, według doniesień właśnie udało się pokonać wszystkich swoich rywali na Warmii i Mazurach oraz ustanowić w pełni funkcjonujące państwo zbudowane według własnej wizji.\nBubel rozpoczął swoją drogę po władzę w Malborku, który przekształcił w twierdzę, z której obecnie sprawuje władzę nad całym województwem. Ze względu na marginalne znaczenie działalności politycznej Bubla w czasach zjednoczonej Polski niewielu zareagowało szczególnie mocno na przejęcie przez niego władzy, lecz ostatnio zaczęła szerzyć się panika, gdyż dawne antysemickie tyrady Leszka stały się podstawą wielu nowych ustaw."
unification.93.a: "BOGUROOOODZIIIICAAAAA"

super.93.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.93.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.93.a: "Wreszcie zjednoczeni."

