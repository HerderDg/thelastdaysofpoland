unification.117.t: "[GetNewspaper]Siły Policji pacyfikują Dystrykt Stołeczny!"
unification.117.desc: "Porządek znowu panuje w Warszawie. Ostatnie punkty oporu w stolicy są właśnie bezlitośnie miażdżone przez nieustępliwych funkcjonariuszy Policji. Kibole, skłotyści, i wszystkie inne elementy wywrotowe sprzeciwiające się porządkowi zostały albo złapane, zabite, lub uciekły z miasta. Wraz z przejęciem Warszawy, Policja zabezpieczyła największy ośrodek miejski w regionie i przekierowała swoje siły do ościennych gmin. Zwycięstwo w stolicy jest znaczącym krokiem na drodze do ponownego zjednoczenia całego kraju. Policjanci zademonstrowali swoją skuteczność oraz oddanie sprawie przywrócenia porządku i jedności w kraju. Ale rygorystyczny reżim narzucony przez Policję spotkał się również z wieloma głosami krytyki dochodzącymi od pozostałej ludności, którzy domagają się przywrócenia swobód i zwracają uwagę na przyszłość nowego państwa. Warszawa idzie do przodu, ale balans pomiędzy bezpieczeństwem a wolnością będzie na długo poważnym problemem."
unification.117.a: "GLEBA KURWA, GLEBA!"

super.117.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.117.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.117.a: "Wreszcie zjednoczeni."

