unification.30.t: "[GetNewspaper]Torcida Zabrze jednoczy Górny Śląsk!"
unification.30.desc: "Wbrew wszelkim przeciwnościom ultrasi Górnika Zabrze, prowadzeni przez słynną Torcidę, zdołali zjednoczyć całą Metropolię Śląską. Trener drużyny, Adam Nawałka, skomentował to wydarzenie z kamienną twarzą jednym zdaniem: \"Bardzo dobrze walczymy, zarówno w ofensywie, jak i w defensywie\". Kibice pozostają jednak zdezorientowani i nie wiedzą, czy ten rozwój wydarzeń może im wynagrodzić brak sukcesów na boisku. W Zabrzu rozbrzmiały dzwony, a trenerowi oficjalnie wręczono ceremonialną kurę na nowo odbudowanym stadionie Górnika. Dzięki swoim dokonaniom Nawałka stał się ikoną Śląska i, w przeciwieństwie do swojego odpowiednika z Truskolasów, nie musiał budować przymusowego kultu jednostki. Jak jednak zorganizować państwo rządzone przez bandę tępych chuliganów i kierowane przez przeciętnego trenera piłkarskiego, który ledwo potrafi zmotywować jedenastu zawodników, a co dopiero ludność całego regionu?"
unification.30.a: "My jesteśmy chłopcy z Zabrza!"