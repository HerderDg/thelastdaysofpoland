 ##Events##
 
unification.119.t: "[GetNewspaper]TVP jednoczy Okręg Stołeczny!"
unification.119.desc: "Każdy kanał, każda częstotliwość i każda drukarnia w Okręgu Stołecznym nadaje te same wiadomości w tym samym bezczelnie napastliwym tonie - Jacek Kurski, prezes TVP, zdołał porwać ludzi patriotycznym apelem o odzyskanie ojczyzny z rąk wszelkiego zła i zepsucia. Sensacyjne wiadomości i niekończący się strumień propagandy to najwyraźniej wszystko, co wydostaje się ze szklanych wieżowców przy Woronicza 17, a wszystkie doniesienia wskazują, że Warszawa znalazła się pod wyłączną i niepodzielną kontrolą telewizji państwowej. Audycje pełne oszczerczych, podburzających materiałów, przerywane jedynie tureckimi melodramatami i programami kulinarnymi, rozbudziły w wielu mieszkańcach stolicy patriotyczny, a zarazem pełen nienawiści fanatyzm. Popycha ich on do gotowości, by żyć i umierać w imię odzyskania Polski z jej dosłownej i moralnej ruiny. Wkrótce prawdę, której przez tak długi czas nie mogli poznać, usłyszy każdy dom - nawet ten bez bieżącej wody."
unification.119.a: "Darmowe telewizory, proszę państwa!"

super.119.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.119.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.119.a: "Wreszcie zjednoczeni."

