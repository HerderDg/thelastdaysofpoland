 ##Events##
unification.78.t: "[GetNewspaper]Wrocławskie MPK jednoczy region wrocławski!"
unification.78.desc: "Upadek Polski otworzył drogę najróżniejszym organizacjom, dając wielu z nich wyjątkową szansę na przekroczenie granicy dzielącej je od państwowości. A jednak spośród setek możliwości Dolny Śląsk znalazł się pod kontrolą jednej z najmniej rokujących i najbardziej znienawidzonych organizacji - wrocławskiego MPK, niegdyś odpowiedzialnego za codzienne łzy i przekleństwa tysięcy pasażerów, a teraz zarządzającego całym województwem. Reżim Balawejdera, powołany początkowo wyłącznie do utrzymywania rozpadającej się infrastruktury miejskiej, zdołał jednak wyprzeć cywilne władze miasta, a następnie wykorzystać zasoby Wrocławia do podbicia całego regionu. Na razie klika zamierza pozostać wierna swojemu pierwotnemu celowi i nie planuje zagarniać ziem sąsiadów, zwłaszcza że jej baza władzy wciąż ogranicza się do granic stolicy województwa. Tylko czas pokaże, czy rządy MPK zdołają wykroczyć poza te granice."
unification.78.a: "Może tym razem będą skuteczniejsi"

unificationreg.78.t: "[GetNewspaper]Proklamowano Śląskie Państwo Kolejowe"
unificationreg.78.desc: "Wygląda na to, że klika wrocławskich tramwajarzy rozrosła się, ponieważ przejęcie władzy nad Dolnym Śląskiem przez przedsiębiorstwo doprowadziło do jego przemiany i rozszerzenia działalności na wszystkie rodzaje transportu szynowego. Choć ich przeciwnicy wykazywali się lepszą organizacją i większym duchem walki, reżim Balawejdera zdołał zwyciężyć dzięki wykorzystaniu pomysłowej sieci logistyki opartej na tramwajach. Po przejęciu kontroli nad rozległymi, wysoko rozwiniętymi terenami klika jest gotowa upomnieć się o władzę nad całym krajem, zwłaszcza że przemianowała się na Śląskie Koleje, co sugeruje ekspansjonistyczne ambicje skierowane na wschód. A jednak MPK zamiast skupiać się na jakiejkolwiek złożonej sztuce rządzenia, wykorzystuje nowo zdobyte zasoby do czegoś znacznie prostszego: wreszcie doprowadzić do tego, by tramwaje kursowały punktualnie... i przestały wypadać z szyn - co wydaje się niemożliwe, mimo że przeznaczono na ten cel połowę budżetu województwa."
unificationreg.78.a: "Tramwaje, pociągi... jaka to właściwie różnica?"

unificationsupreg.78.t: "[GetNewspaper]Śląsk pada łupem kolejowej kliki"
unificationsupreg.78.desc: "Zamiast legalnych rządów, radykałów czy nawet bandytów, władzę nad jedną czwartą tego, co niegdyś było Polską, przejęło zwykłe przedsiębiorstwo, któremu przypadło monumentalne zadanie odbudowy kraju z ruin... a przynajmniej naprawy rozpadającej się infrastruktury regionu, ponieważ życie zwykłych obywateli jak dotąd w dużej mierze pozostawiono w spokoju. W końcu ludzie i tak znajdą sposób, by przetrwać, natomiast większe przedsięwzięcia wymagają natychmiastowego finansowania. Należą do nich choćby budowa sieci tramwajowej w każdym mieście i rozbudowa systemu logistyki kolejowej. Dostęp do benzyny wciąż stanowi problem, ale wizjonerskie plany Balawejdera, by stworzyć pierwszą w Europie gospodarkę opartą na kolei, wywołały ogólnokrajowe poruszenie, a eksperci z zapałem dyskutują o ich wykonalności. Wciąż jednak nie ustają obawy o zdolność kliki do zapewnienia niezawodnych usług, ponieważ mimo wielkich wizji wrocławskie tramwaje pozostają równie niesprawne jak zawsze. Jak państwo może uchodzić za kompetentne, jeśli nie potrafi nawet zrealizować swojego podstawowego zadania?"
unificationsupreg.78.a: "Dziedzictwo PKP na pewno im nie pomoże"

super.78.t: "[GetNewspaper]Naród na szynach"
super.78.desc: "W niezwykłym pokazie wizji, pomysłowości oraz czystej dominacji infrastrukturalnej i logistycznej MPK Wrocław, podupadające przedsiębiorstwo tramwajowe, stało się siłą napędową zjednoczenia Polski. Teraz, sprawując kontrolę nad całym krajem, rząd nadal skupia się na dokończeniu przejścia od transportu i gospodarki opartych na asfalcie do tych opartych na kolei, czemu służy budowa najbardziej rozbudowanej sieci transportowej na świecie. W odradzającym się państwie tramwaje stały się symbolem postępu i łączności, spajając niegdyś odizolowane miasta, miasteczka, a przede wszystkim ludzi. Klika spotyka się jednak z krytyką za tłumienie demokracji zarówno na szczeblu lokalnym, jak i krajowym, ponieważ o wszystkich decyzjach administracyjnych rozstrzyga niewybierana korporacyjna hierarchia. Balawejder, podobnie jak jego dawny włoski odpowiednik, pozostaje jednak przekonany, że wybory są sprawą drugorzędną wobec punktualności pociągów - czego MPK wciąż nie potrafi zapewnić."
super.78.a: "Wszyscy na pokład, ku wielkości!"