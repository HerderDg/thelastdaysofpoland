 ##Events##
unification.96.t: "[GetNewspaper]Polski Związek Wędkarski jednoczy Warmię i Mazury!"
unification.96.desc: "Wygląda na to, że PZW nie wystarczyło okradanie najświętszych symboli polskiej cnoty, jakimi są niezależni wędkarze, więc ukradli sobie całe województwo warmińsko-mazurskie, by wykorzystać je jako punkt wyjścia w swojej maniakalnej misji ograbienia każdego ostatniego polskiego, a wkrótce także bałtyckiego wędkarza z jego ciężko zarobionych pieniędzy i szacunku.\nMiliony zawyły z rozpaczy, gdy tyrani z Polskiego Związku Wędkarskiego wyszli zwycięsko z walki o władzę na Warmii i zabezpieczyli kontrolę nad każdym ostatnim akwenem na północnym wschodzie.\nChoć większość państewek szybko dogasającej polskiej anarchii wyraziła swoje niezadowolenie i przysięgła chronić przeciętnego wędkarza przed chciwością organizacji, istnieją również tyraniczni watażkowie, którzy planują współpracować ze Związkiem, licząc na korzyści finansowe płynące z eksploatacji swoich rzek."
unification.96.a: "Chowajcie wędki!"

super.96.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.96.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.96.a: "Wreszcie zjednoczeni."
