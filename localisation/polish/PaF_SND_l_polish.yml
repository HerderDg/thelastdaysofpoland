 ###   Ideas   ###
 SND_zik: "Zakład Inżynierii Kolejowej Sandomierz"
 SND_pilkington: "NSG Pilkington Polska"
 SND_cement_ozarow: "Cement Ożarów"
 SND_dwikozy: "Zakłady Przemysłu Owocowo-Warzywnego"
 SND_pbi: "Grupa PBI"

 SND_commision: "Sukces przed komisją"
 SND_commision_desz: "DO UZUPEŁNIENIA"
 
 SND_war_censorship: "Propaganda wojenna"
 SND_war_censorship_desc: "W czasach wielkiego chaosu naginanie zasad obowiązujących media jest nie tyle dozwolone, ile konieczne. Nie możemy pozwolić wrogom szerzyć dezinformacji i propagandy wewnątrz naszego kraju. Lepiej, żebyśmy robili to sami. Dla większego dobra. Dla Rzeczypospolitej."

 SND_cityonahill: "Lśniące miasto na wzgórzu"
 SND_cityonahill_desc: "Sandomierz - nietknięta latarnia pośród oazy pokoju! Ukryty w zakątku, do którego żadna wojna ani przemoc nie potrafi naprawdę dotrzeć, góruje nad większością innych miast. Nawet gdy walki ogarnęły województwo świętokrzyskie, pozostał od nich daleko. Dzięki wcześniejszej pomocy nieistniejącej już Ukraińskiej Misji Humanitarnej rośnie tu stabilne i potężne miasto."

 SND_disgruntledpop1: "Niezadowolona ludność"
 SND_disgruntledpop1_desc: "Mieszkańcy Sandomierza wołają o zmianę! Drażni ich i rozwściecza przedłużająca się wojna z Ziobrą oraz autorytarna kontrola Sienkiewicza nad rządem. Jeśli Sandomierz ma przetrwać, zwłaszcza w obliczu Ziobry, trzeba uspokoić ludność."
 
 SND_disgruntledpop2: "Oburzona ludność"
 SND_disgruntledpop2_desc: "O Boże... Ulice płoną. Po zakończeniu wojny z Ziobrą mieszkańcy wreszcie uświadomili sobie, że ich administracja i państwo są osamotnione oraz wyniszczone. Skromna pomoc Starachowic nie wystarcza, a Sienkiewicz planuje na skalę zdecydowanie zbyt wielką jak na niewielkie miasto. Równowaga Sandomierza jest zagrożona."
 
 SND_disgruntledpop3: "Niezadowolona ludność"
 SND_disgruntledpop3_desc: "DO UZUPEŁNIENIA - po wyjebaniu Sienkiewicza ludziom jest trochę lżej, ale nadal jest chujowo."
 
 SND_rally: "Zjednoczeni pod sztandarem"
 SND_rally_desc: "My, mieszkańcy Sandomierza, nie możemy i nigdy nie pozwolimy, by ten sztandar upadł. Jeśli runie, nasz lud zostanie zdziesiątkowany. Dołączcie więc do nas! Walczcie! Obrońcie niepodległość naszego państwa przed straszliwym prokuratorem Ziobrą. Przetrwamy, by walczyć kolejnego dnia!"
 
 SND_last_push: "Ostatnie natarcie"
 SND_last_push_desc: "Nadeszła pora, bracia! Ziobro i jego armia są w odwrocie. Musimy zmiażdżyć ich teraz, bo druga taka szansa może się już nie pojawić! Niech wyczerpane oddziały drżą przed siłą naszego odrodzonego ducha."
 
 SND_crime1: "Kłopoty w królewskim mieście"
 SND_crime1_desc: "Wojna z Ziobrą dobiegła końca, lecz na powierzchnię wypływają nowe problemy. Wraz z odzyskaną niepodległością i wolnością Sandomierz bardziej niż kiedykolwiek przypomina miasto występku i rozpusty."
 
 SND_anticrime_sienkiewicz: "Środki przeciw przestępczości"
 SND_anticrime_sienkiewicz_desc: "Wysiłki Sienkiewicza i jego administracji w walce z przestępczością nie przynoszą rezultatów. Program jest niedofinansowany i źle zarządzany, a mieszkańcy coraz bardziej się złoszczą! Sienkiewiczowi kończą się karty i nie wiadomo, czy zdoła jeszcze rozbić choć jeden gang..."
 
 SND_antipriest_sienkiewicz: "Środki przeciw fanatykom"
 SND_antipriest_sienkiewicz_desc: "Siedziba rządu płonie! Ojciec Mateusz podważa władzę w Sandomierzu, a odpowiedzią Sienkiewicza jest ograbienie miejscowego Kościoła?! Mieszkańcy stają się coraz bardziej wściekli, a miasto czerwienieje od gniewu! Mały Sandomierz zatruły obyczaje wielkiego miasta. Dla Sienkiewicza i jego administracji rozpoczęło się odliczanie."
 
 SND_kamienna_trade: "Handel nad brzegami Kamiennej"
 SND_kamienna_trade_desc: "Handel przyniósł prawdziwe owoce rozkwitu, a nasze partnerstwo jest wręcz wspaniałe! Sandomierz i Starachowice nie słyną wprawdzie zbyt szeroko, lecz znacznie lepiej sprawdzają się jako partnerzy handlowi niż sojusznicy na polu walki. Gospodarki obu niewielkich państw otrzymały potężny impuls do rozwoju."
 
 SND_crime2: "Przełamanie aksjomatu"
 SND_crime2_desc: "Walka z przestępczością może wreszcie przynieść pełne rezultaty! Dzięki właściwie zorganizowanej policji oraz pomocy Ojca Mateusza przy rozwiązywaniu spraw, po raz pierwszy od początku wojny z Prokuraturą wskaźniki przestępczości spadły! Niech Sandomierz stanie się prawdziwą gwiazdą pośród przygasłych świateł."
 
 SND_army_of_saints: "Armia świętych"
 SND_army_of_saints_desc: "Rozpoczyna się rozwój armii. Wprowadzimy cywilizowane zasady prowadzenia walki, wzorowane na konwencjach genewskich, a także właściwą taktykę i organizację wojskową, niepodobną do partyzanckich bojówek walczących z Prokuraturą. Rozbudujemy również szpitale polowe, by ograniczyć straty w ludziach."
 
 SND_army_of_saints2: "Armia świętych"
 SND_army_of_saints2_desc: "DO UZUPEŁNIENIA"
 
 SND_army_of_saints3: "Armia świętych"
 SND_army_of_saints3_desc: "DO UZUPEŁNIENIA" 
 
 SND_army_of_saints4: "Armia świętych"
 SND_army_of_saints4_desc: "DO UZUPEŁNIENIA"
 
 SND_holy_alliance: "Najświętszy sojusz"
 SND_holy_alliance_desc: "Na mrocznej mapie Polski dumnie jaśnieje latarnia jasna niczym słońce! Przypieczętowany sojusz Sandomierza i Starachowic ustanawia na trupie Polski wielki precedens - choć zaskakujący i zawdzięczający niemało zwykłemu szczęściu."
 
 SND_halfhearted_strikes: "Strajki bez przekonania"
 SND_halfhearted_strikes_desc: "Po upadku Starachowic przywódca związkowy Piotr Ikonowicz stanął na czele rozmaitych dysydentów w mieście. Choć jego prawdziwe zamiary pozostają niejednoznaczne, wydarzenia te pokazują, że obecny rząd znalazł się na równi pochyłej i może runąć ze swojej wieży."

 SND_handling_economy_1: "Zarządzanie gospodarką" 
 SND_handling_economy_1_desc: "Liberalne podejście do gospodarki pozostawiło wielu ludzi w biedzie i głodzie. Musimy zmienić priorytety, aby gospodarka naszego kraju wreszcie służyła czemuś dobremu, a nie wyłącznie zarabianiu pieniędzy. Dysponujemy ograniczonymi zasobami, toteż musimy wykazać się pomysłowością i wsłuchać w potrzeby mieszkańców."

 SND_price_prevention: "Cena zapobiegania"
 SND_price_prevention_desc: "DO UZUPEŁNIENIA"

 SND_teatime: "Popołudniowa herbata"
 SND_teatime_desc: "Czasem trzeba po prostu odetchnąć, usiąść przy herbatce i kawałku ciasta, wyznać grzechy, a może i rozegrać partię szachów. Ojciec Mateusz chętnie przyjmuje gości na plebanii, by lepiej zrozumieć troski swojej trzody, zbliżyć się do niej, a czasem po prostu słuchać - i przez samo słuchanie pomagać. Ciepłe słowa, ciepły uśmiech, ciepła herbata. Tylko tyle i aż tyle."
 ###   First Tree   ###
 
SND_dusk_in_royal_city: "Zmierzch w królewskim mieście"
SND_dusk_in_royal_city_desc: "Ach, Sandomierz... jedyne miejsce, do którego nie dotarł Upadek. Tutaj życie na cichych brukowanych uliczkach nadal toczy się tym samym rytmem co przez minione stulecia. Królewskie miasto - oaza spokoju i dom dla wszystkich uciekających przed prześladowaniami. Najjaśniejsze światło w regionie, który poza nim pogrążył się w ciemności. Choć Polska nadal rozpada się na kawałki, a każdy z nich poświęca wszystkie siły walce z pozostałymi, Rzeczpospolita Sandomierska będzie górować nad nimi wszystkimi, wolna od zniszczeń, jakie sprowadzają na kraj. Z czasem miasto odzyska pełnię historycznego blasku i nic nie zakłóci jego spokoju, chyba że..."
  
SND_so_long_peace: "Żegnaj, pokoju..."
SND_so_long_peace_desc: "...chyba że Ziobro przyjdzie dokończyć dzieła. Oczywiście. I musiało stać się to akurat w Boże Narodzenie. Jakby ten człowiek kiedykolwiek znał wstyd. Pod zarzutem \"udzielania schronienia znanemu przestępcy Bartłomiejowi Sienkiewiczowi, skazanemu przez prawowity rząd Trzeciej Rzeczypospolitej na dożywocie\" uznał naszą Rzeczpospolitą za państwo zbójeckie i wysłał ludzi, by położyli kres jej suwerenności. Żałosna wymówka. Jakim pokrętnym rozumowaniem można uzasadnić tym samym powodem równoczesną inwazję na Starachowice? Prawda jest prosta - Prokurator pragnie krwi i nie zatrzyma się, dopóki całe województwo przed nim nie uklęknie. Zamiast zostać kolejną posłuszną satrapią, będziemy walczyć w obronie wolności. Szanse są przytłaczająco niekorzystne, ale jeśli przed końcem zdołamy choć trochę go poturbować, uznamy to za moralne zwycięstwo."
  
SND_turn_media_attention: "Skierowanie uwagi mediów na wojnę"
SND_turn_media_attention_desc: "Jest czas na pluralizm mediów, lecz gdy wroga armia błyskawicznie zbliża się do naszego terytorium, nie potrzebujemy kolejnych redakcji bez przerwy krytykujących administrację. Ustalmy więc wspólną wersję. Jeśli cenisz swoją wolność, Prokuratura odbierze ci ją w całości. Jeśli nosisz na piersi czerwone serce, zieloną koniczynę albo cokolwiek innego niż ten przeklęty niebieski orzeł, po naszej porażce CZEKAJĄ CIĘ prześladowania. A jeśli choćby krzywo na niego spojrzałeś albo dziesięć lat temu napisałeś pogardliwy komentarz, o którym dawno zapomniałeś - §RZIOBRO. IDZIE. WŁAŚNIE. PO. CIEBIE.§! Na każdym kanale, aż po najbardziej nieistotną stację regionalną, ta wiadomość ma być najważniejszym tematem."
  
SND_in_for_the_long_haul: "Wojna na wyniszczenie"
SND_in_for_the_long_haul_desc: "Miesiące impasu, krok wstecz za kolejnym krokiem... a my nadal udajemy, że wszystko działa jak zwykle. Jeśli nie chcemy wykrwawić się do reszty i pewnego dnia odkryć, że ostatnie zapasy się skończyły, pora na drastyczne środki. Pola, które wciąż kontrolujemy na północy, nawet w przybliżeniu nie zaspokajają obecnego zapotrzebowania. Albo racje żywnościowe teraz, albo głód za miesiąc. Możemy zacząć od czegoś prostego - niewielkie ograniczenia liczby towarów dostępnych jednej osobie powinny wystarczyć, by zapobiec najgorszym niedoborom. A jeśli mieszkańcom się to nie spodoba, cóż... nadal jest to znacznie lepsze od alternatywy."

SND_demonize_their_forces: "Demonizowanie sił wroga"
SND_demonize_their_forces_desc: "Pierwsze miesiące wojny pokazały, że większość żołnierzy nie pali się do zabijania rodaków, nawet jeśli są ziobrystami. Aby wykrzesać z naszych wojsk jakąkolwiek skuteczność, potrzeba właściwej zachęty... i odpowiedniego obrazu wroga. Musimy wbić wszystkim do głów, że ludzie po drugiej stronie frontu nie są ich braćmi. To bezwzględni, ślepo posłuszni mordercy, którzy zapewne dla zabawy łupiliby i palili wioski, gdyby nie wcielono ich w szeregi Ziobry. Jeśli nie chcemy, by te psy robiły, co im się podoba, każdy zdolny do walki człowiek musi dać z siebie wszystko dla Rzeczypospolitej, dla rodziny i dla wszystkich mieszkańców miasta, którzy nie mogą bronić się sami."

SND_call_more_volunteers: "Rekrutacja kolejnych ochotników"
SND_call_more_volunteers_desc: "Sandomierz pogrąża się w rozpaczy, bo brak ludzi zatrzymał nasz wysiłek wojenny. Tak być nie może! Jeśli tryby zwolnią, a impet zaniknie albo przejdzie na stronę wroga, wszyscy możemy runąć. Pora, by media rozpoczęły kampanię propagandową na skalę największych konglomeratów! Analizując przekaz amerykańskich mediów, być może nauczymy się produkować równie ABSURDALNĄ propagandę."

SND_against_battered_giant: "Przeciw poturbowanemu olbrzymowi"
SND_against_battered_giant_desc: "Cóż za bezczelność Ziobry. Jego ludzie cierpią przez wojnę, a on mimo wyczerpania armii i społeczeństwa nadal ją prowadzi. Naprawdę stał się brutalem, fałszywym Cezarem. Gdy pomimo poniesionych strat ogłosił, że walka będzie trwać, przez Sandomierz przeszła nowa fala patriotyzmu. W Prokuraturze dzieje się coś dokładnie odwrotnego. Siły Ziobry zaczynają odczuwać skutki przedłużającej się wojny. Wyczerpanie staje się nieznośne, żołnierze prawie nie śpią, a morale rozpada się wraz z coraz gorszym położeniem. Nadeszła pora, by uderzyć olbrzyma jeszcze mocniej."

SND_rudimentary_ambush_tactics: "Podstawowe taktyki partyzanckie"
SND_rudimentary_ambush_tactics_desc: "Ofensywa Ziobry zaczyna ścierać naszą żelazną obronę! Pora sięgnąć po ciekawsze metody walki i stać się namiastką Vietcongu. Drobne pułapki, ataki z doskoku oraz ogólne działania destabilizacyjne można włączyć do głównego planu i arsenału taktycznego. Przeciw słabo wyszkolonym milicjom Ziobry, po odrobinie nauki - czy to w ogniu walki, czy poza frontem - metody te mogą naprawdę przebić jego siły!"

SND_build_temporary_fortifications: "Wznoszenie tymczasowe umocnień"
SND_build_temporary_fortifications_desc: "Wobec zaciekłych ataków Ziobry i jego sił dowództwo Sandomierza jednomyślnie uznało, że należy zbudować tymczasowe, lecz solidne umocnienia. Niewielkie sieci okopów, leśne obozy, pale punji i wiele innych przeszkód. Mieszkańcy poparli przedsięwzięcie, tworząc liczne małe oddziały ochotnicze, które pomogą przyspieszyć prace."

SND_start_renewed_offensive: "Wznowienie ofensywy"
SND_start_renewed_offensive_desc: "Rozkaz zostanie wydany! Ziobro się chwieje, a siły Prokuratury całkowicie słabną. Nadeszła pora prawdziwego natarcia. Wszyscy dowódcy polowi otrzymali stanowczy rozkaz ataku z siłą przekraczającą wyobraźnię wroga i furią zdolną powalić niedźwiedzia. Jedno jest pewne: możemy rozszerzyć terytorium. Olbrzym runie pod naszym naciskiem i utraci ziemie, a my wymusimy liczne ustępstwa. Najpierw jednak musimy pozostawić z niego pustą skorupę, wypełnioną jedynie zakrwawioną glebą."

SND_our_future_secured: "Nasza przyszłość zabezpieczona?"
SND_our_future_secured_desc: "Hę, to... naprawdę koniec. Aż trudno uwierzyć, lecz pomimo przytłaczającego uderzenia sił Ziobry jakimś sposobem nadal stoimy. To znaczy, że najgorsze mamy już za sobą, prawda? Przecież wcale nie rzuciliśmy na wroga wszystkiego, co posiadaliśmy, nie rozwścieczyliśmy przy tym własnych mieszkańców, nie pozwoliliśmy, by sytuacja wewnętrzna wymknęła się daleko poza kontrolę, nie zrujnowaliśmy całkowicie gospodarki miasta, nie pozostawiliśmy wracającym weteranom żadnych perspektyw i nie odwołaliśmy wszystkich... Czy jest sens dalej wymieniać wszystko, co obecnie nie działa w Sandomierzu? Czeka nas mnóstwo pracy. To nie pora na świętowanie."

###   Sandomierz Post-War Tree   ###

SND_war_fallout: "Pokłosie wojny"
SND_war_fallout_desc: "Dobrze, zaczynamy od nowa. Pora zakasać rękawy i zmierzyć się z bezmiarem problemów i niestabilności, zwanym dla wygody powojennym Sandomierzem. Jakimś sposobem fakt, że właśnie odparliśmy inwazję ziobrystów, niemal nie ma znaczenia dla zaskakująco licznej mniejszości, która obwinia nas o dopuszczenie do takiego pogorszenia sytuacji. Nieważne. Ich gniew minie, gdy tylko pokażemy konkretne rezultaty. Musimy po prostu... yyy... możemy zacząć od... No dobrze. Przywrócenie miastu dawnej świetności, a nawet stanu, który można uznać za znośny, może okazać się nieco trudniejsze, niż liczyliśmy."

SND_confused_approaches: "Chaotyczne podejście"
SND_confused_approaches_desc: "Odpowiadając na żądania ludności domagającej się natychmiastowego działania, z dumą spełniliśmy wszystkie postulaty i podjęliśmy stanowcze kroki - powołaliśmy Komisję Badawczą do spraw Problemów Społecznych i Zniszczeń Wojennych w Mieście Sandomierzu oraz Powiatach Ościennych. Już za kilka krótkich miesięcy przedstawimy pierwsze wstępne ustalenia. Później wystarczy tylko trochę czasu, by znaleźć właściwych ludzi i rozpocząć prawdziwe działania. Wyłącznie rozsądne podejście może ograniczyć... dlaczego nikt nie klaszcze? Skąd te gwizdy i szyderstwa? Próbujemy wam pomóc, ludzie! Takie rzeczy wymagają czasu!"

SND_dealing_with_economy: "Czas na gospodarkę"
SND_dealing_with_economy_desc: "No tak... zajmijmy się gospodarką. Technicznie rzecz biorąc, nie istnieje tu żadna gospodarka, którą można byłoby zarządzać, więc przynajmniej zaczynamy z mniej więcej czystą kartą. Minusy? NO WŁAŚNIE NIE MAMY ŻADNEJ GOSPODARKI. Owszem, posiadamy kilka średnich zakładów, garść drobnych prywatnych przedsiębiorstw i trochę poważnie uszkodzonej infrastruktury, lecz trudno uważać to za powód do dumy. Jeśli nie chcemy na zawsze pozostać prowincjonalnym zaściankiem żyjącym wyłącznie własną historią, musimy wreszcie rozpocząć sensowne inwestycje."

SND_pilkington_glassworks: "Rozbudowa huty szkła Pilkington"
SND_pilkington_glassworks_desc: "Kompleks przemysłowy Pilkington od zawsze był godnym zaufania sojusznikiem, zapewniając naszemu reżimowi wsparcie finansowe niezbędne podczas obrony przed Ziobrą. Wypada odwdzięczyć się za przysługę, zwłaszcza że sukces korporacyjnych partnerów jest również naszym sukcesem. Czy ktokolwiek sprzeciwi się tworzeniu nowych miejsc pracy dla bezrobotnych albo budowie fundamentu przyszłego eksportu? Rozbudowa Pilkingtona to znacznie więcej niż zwykły prezent. Jest znakiem, że Rzeczpospolita wkrótce stanie się liczącym graczem w regionie."

SND_sandomierz_opatow_railway: "Kolej Sandomierz-Opatów"
SND_sandomierz_opatow_railway_desc: "Mozaika linii kolejowych pozostawiona przez Trzecią Rzeczpospolitą, delikatnie mówiąc, zupełnie nie odpowiada geografii naszego państwa. Obecne połączenie z Sandomierza natychmiast przecinają po obu stronach granice Podkarpacia, co praktycznie uniemożliwia rozsądne wykorzystanie transportu kolejowego. Czego nie dało nam szczęście, osiągniemy sami. Linia ze stolicy do naszej wysuniętej placówki w Opatowie będzie początkiem sieci, która pewnego dnia połączy wszystkie istotne miejscowości z centralnym węzłem w Sandomierzu... choć nastąpi to w dość odległej przyszłości."

SND_tradeport_on_vistula: "Budowa portu handlowego na Wiśle"
SND_tradeport_on_vistula_desc: "Upadek zdziałał cuda dla odrodzenia handlu na polskich rzekach. Zasadniczo atak na opancerzoną łódź płynącą środkiem rzeki, skąd wszystko doskonale widać, jest nieco trudniejszy niż urządzenie zasadzki na przypadkowym zalesionym lub pagórkowatym odcinku zaniedbanej drogi. Nasi partnerzy poszukują bezpieczeństwa. Jeśli chcemy ich zatrzymać i sięgnąć handlem dalej niż do granic pierwszego wrogiego watażki stojącego na drodze kupców, warto przekształcić część niezagospodarowanych mokradeł w port zdolny wysyłać jednostki na całą długość Wisły."

SND_repairing_north_roads: "Naprawa dróg na północ"
SND_repairing_north_roads_desc: "Trudno sprawować jakąkolwiek kontrolę nad terytorium, gdy zaraz po opuszczeniu administracyjnych granic stolicy drogi zmieniają się w nieutrzymany koszmar pełen dziur. Jak mamy zachować regularne łańcuchy dostaw między Sandomierzem a północnymi bastionami, skoro każdemu pojazdowi większemu od rodzinnego vana przejazd sprawia ogromne trudności? Pora zacząć myśleć szerzej niż tylko o samym mieście. Zresztą kilka ekip remontowych powinno wystarczyć. To przecież niedaleko. Ile właściwie może być do naprawienia?"

SND_new_powerlines: "Odbudowa sieci energetycznej"
SND_new_powerlines_desc: "To żałosny i, szczerze mówiąc, wyjątkowo wymowny dowód opłakanego stanu kraju: większość terenów wiejskich nadal nie ma prądu, ponieważ... podczas samego Upadku mieszkańcy ukradli wszystkie przewody. Gdy zużycie energii gwałtownie spadło, zaczęliśmy oszczędzać na elektrowniach, zarówno centralnej w Sandomierzu, jak i lokalnych źródłach odnawialnych na wsi. Wszystkie wymagają naprawy. Technicznie moglibyśmy napaść na złomowiska, którym ludzie sprzedali przewody za szybką gotówkę i inne przydatne części. Wbrew temu, co twierdzą niektórzy obywatele, jesteśmy jednak dobrotliwym rządem, który nie ma nic przeciw wydaniu części budżetu na ponowne połączenie wsi ze współczesnym światem. Tylko... gdy już ułożymy brakujące kable, wystawmy straże, żeby znowu ich nie rozkradziono."

SND_dwikozy_cannery: "Rozbudowa przetwórni w Dwikozach"
SND_dwikozy_cannery_desc: "Spółdzielnia rolnicza w Dwikozach pozostaje jednym z nielicznych jasnych punktów krajowej produkcji. Jej wydajność bez trudu przewyższa większość innych przedsiębiorstw, a my otrzymaliśmy doskonałą okazję, by uczynić z niej ogólnopolskiego giganta. Zastanówmy się: kiedy popyt na konserwy jest największy? W czasach kryzysu, gdy wszyscy gorączkowo gromadzą żywność o długim terminie przydatności. A my bez wątpienia przeżywamy jeden wielki kryzys. Jeśli zwiększymy produkcję, sandomierskie wyroby mogą wypełnić bunkry od Gdańska po Zakopane i jeszcze dalej."

SND_dealing_with_crime: "Walka z przestępczością"
SND_dealing_with_crime_desc: "Przestępczości nie da się całkowicie wyeliminować - nie w tych rejonach, a już na pewno nie w obecnej sytuacji. Jakiś nieszczęśnik zawsze zabłądzi do niewłaściwej dzielnicy, a pewne przedmioty nieuchronnie znikną. Takie jest życie. Nie możemy jednak tolerować sytuacji, w której ktoś w biały dzień włamuje się do domu jednego z ministrów, a policja nie potrafi zrobić z tym ABSOLUTNIE NIC. Dość. Mamy tego dosyć. Otwarte bezprawie dobiega końca. Nie będziemy tolerować anarchii na ulicach naszego pięknego miasta!"

SND_extraordinary_commission: "Nadzwyczajna Komisja do spraw Przestępczości"
SND_extraordinary_commission_desc: "Jeśli jedna komisja nie wystarcza do opanowania niedawnego wzrostu przestępczości, musimy podjąć bezprecedensowy krok i powołać JESZCZE. JEDNĄ. KOMISJĘ. Zgadza się. Pełna potęga dwóch tuzinów doświadczonych ekspertów legislacyjnych spadnie na każdego głupca, który ośmieli się naruszyć rządy prawa. Nasi informatorzy w czołowych organizacjach przestępczych już donoszą, że bossowie drżą przed naszym racjonalnym i wyważonym podejściem. Wystarczy znaleźć odpowiednie rozwiązanie konsensualne, które odpowie na obawy wszystkich zainteresowanych, i wszystko będzie załatwione. Powinno to nastąpić już niedługo... mniej więcej."

SND_police_funding_bill: "Ustawa o finansowaniu policji"
SND_police_funding_bill_desc: "Nasz obecny budżet wygląda w najlepszym razie ponuro, lecz niektóre działania są tak konieczne, że z radością zejdziemy dla nich chwilowo pod kreskę. Miejscowa policja dysponuje budżetem operacyjnym koła gospodyń wiejskich. Skutecznie odstrasza to niemal wszystkich kandydatów, a pełniący służbę muszą utrzymywać się z regularnych darowizn i łapówek. Jeśli funkcjonariusze mają wreszcie zacząć wykonywać obowiązki i zdławić niekończącą się falę przestępczości, musimy radykalnie zwiększyć ich finansowanie - jeśli trzeba, do granic przesady. Konsekwencje niech się wypchają."

SND_cameras_at_every_corner: "Kamery na każdym rogu"
SND_cameras_at_every_corner_desc: "Największy problem ze ściganiem przestępców nadal beztrosko terroryzujących Sandomierz polega na tym, że praktycznie niczego nie potrafimy udowodnić. Zwykle pozostaje nam wyłącznie zeznanie siedemdziesięcioletniego, na wpół ślepego emeryta, który w środku nocy nie odróżniłby podejrzanego od odpowiednio wielkiego worka ze śmieciami. Skoro oczom na ziemi nie można ufać, musimy zainstalować własne. Kamery będą obserwować wszystkie ulice i zaglądać w zapomniane głębiny każdego ciemnego zaułka. W tym mieście nie wydarzy się już nic, co pozostałoby niewidoczne."

SND_reopen_castle_prison: "Więzienie na zamku"
SND_reopen_castle_prison_desc: "Lud domaga się rozprawy z przestępcami? Och, dostanie ją. Będziemy tak skuteczni, że potrzebujemy dodatkowego miejsca na trzymanie za kratami bandytów, awanturników, włóczęgów i całej reszty. Na szczęście istnieje dość prymitywne rozwiązanie, które zwiększy pojemność więzień o prawie połowę bez ponoszenia dodatkowych kosztów. Przez stulecia zamkowe piwnice często służyły jako prowizoryczne loch... więzienie. Porównania z dawnymi reżimami korzystającymi z tego rozwiązania na pewno nie będą pochlebne. Jeśli jednak przeniesiemy muzealne eksponaty zagracające dawne cele, bez trudu zapełnimy je każdym, kogo trzeba usunąć z widoku publicznego."

SND_dealing_with_priest: "Grzechy naszego Ojca"
SND_dealing_with_priest_desc: "Oczywiście zawsze musi znaleźć się taki jeden. Niewdzięczny wichrzyciel przekonany, że wykonałby pracę lepiej od doświadczonych urzędników państwowych. W obecnym stanie Rzeczypospolitej nie możemy pozwolić, by lud zwrócił się ku urojonej równoległej władzy, zwłaszcza tak absurdalnej jak podróbka udająca fikcyjnego księdza. Naprawdę tylko my widzimy, że to wszystko jest bzdurą? Dziś może wydawać się niegroźny, lecz przy całej uwadze, którą przyciąga, \"Ojciec Mateusz\" wkrótce stanie się zagrożeniem. Musimy pokazać jego prawdziwą twarz - zwykłego oszusta."

SND_push_against_church: "Dyskretne ataki na Kościół"
SND_push_against_church_desc: "Wszyscy boją się przyznać do prawdy, lecz Kościół katolicki jest zapewne najgorszym pasożytem żerującym na polskich ziemiach. Wybryki jego przywódców dowodzą, że kler służy wyłącznie własnym próżnym interesom, jednocześnie wygłaszając moralne wyroki i podburzając lud przeciw każdemu rozsądnemu świeckiemu rządowi. Nie możemy jeszcze zaatakować go wprost, ale potrafimy zasiać pierwsze ziarna wątpliwości w umysłach mieszkańców. Zdobyliśmy poufne informacje dotyczące kilku bardziej... podejrzanych interesów Kościoła. Byłoby straszną szkodą, gdyby wiedza ta nagle wyciekła do każdej redakcji w Sandomierzu."

SND_plant_provocateurs: "Prowokatorzy na spotkaniach"
SND_plant_provocateurs_desc: "Jeśli ksiądz sam nie powie ani nie zrobi nic kontrowersyjnego, zmusimy go do tego. Grupa lojalnych agitatorów będzie śledzić każdy jego krok, czekając na lukę i okazję do uderzenia. Gdy najmniej się tego spodziewa, rzucą mu wyzwanie przed tłumem. Zobaczymy, jak długo wytrzyma jego rzekoma \"humanitarna natura\" w starciu z naszymi prowokatorami. Wiemy, że w końcu pęknie i powie coś, czego będziemy mogli się uczepić - coś, co na zawsze zniszczy fałszywy wizerunek budowany wokół jego osoby. Musimy tylko poczekać."

SND_stanislaw_of_szczepanowo: "Stanisław ze Szczepanowa"
SND_stanislaw_of_szczepanowo_desc: "Nie pozostawiono nam wyboru. \"Ojciec Mateusz\" jest niebezpiecznym szaleńcem i dla dobra Rzeczypospolitej nie pozwolimy mu dłużej podważać naszej władzy. Przy odpowiednio korzystnej interpretacji możemy technicznie uznać jego działania za nawoływanie do obalenia rządu. Da nam to uzasadnioną podstawę, by tymczasowo go aresztować, aż emocje opadną i umocnimy pozycję. Mieszkańcy z pewnością się rozgniewają, a nas czeka ostry sprzeciw, lecz zatrzymanie samozwańczego księdza jest jedynym właściwym rozwiązaniem. Z czasem nam za to podziękują."

SND_management_of_new_lands: "Administracja nowych ziem"
SND_management_of_new_lands_desc: "Wszystkie analizy wskazywały, że będziemy mieli szczęście, jeśli przetrwamy wojnę z Ziobrą choćby w okrojonym kształcie. Jakimś sposobem wyszliśmy z niej z większym terytorium niż przedtem. Wielu ludzi nadal świętuje, jakby właśnie skończyły się wszystkie nasze problemy, zapominając, że trzeba jeszcze... tym miejscem zarządzać. Zmarnowaliśmy już stanowczo zbyt wiele czasu na triumfalne paradowanie po okolicy bez dokonania choć jednej istotnej rzeczy. Zaczyna to wyglądać komicznie. Wzywamy wszystkich z powrotem. Koniec rund honorowych, dopóki nie opracujemy realistycznego planu zarządzania zdobyczą."

SND_expand_our_administration: "Rozbudowa administracji"
SND_expand_our_administration_desc: "Na jedno z pewnością nie możemy narzekać: przytłaczającą liczbę doświadczonych administratorów, z których większość nadal pozostaje bez pracy. Coś w nieustannych prześladowaniach politycznych Ziobry i siłowym usuwaniu każdego, kto odmawia poparcia jego wojowniczego, bezprawnego programu, sprawia, że miejscowi urzędnicy uciekają do jedynego miejsca w województwie naprawdę działającego jak demokracja. Po miesiącach przygnębiającej bezczynności rozpaczliwie pragną wrócić do pracy i wygodnych posad w lokalnej biurokracji. Na szczęście mamy doskonałą wiadomość dla najzdolniejszych i właściwych ideologicznie kandydatów."

SND_new_defence_lines: "Nowe linie obrony"
SND_new_defence_lines_desc: "Mogliśmy wygrać tym razem, lecz nie wolno popadać w samozadowolenie. Ziobro wróci i wtedy rzuci przeciw nam wszystko, co posiada. Cios zadany Prokuraturze nie był śmiertelny, a jedynie doda jej determinacji. Skończyły się uprzejmości. Jeśli nie chcemy przekonać się, jak daleko sięga ich mściwość, musimy przygotować się do obrony każdego centymetra ziemi. Prymitywna linia fortów granicznych nie zagwarantuje bezpieczeństwa, lecz gdy rozpocznie się armagedon, będzie lepsza niż nic."

SND_towards_new_tomorrow: "Ku nowemu jutru"
SND_towards_new_tomorrow_desc: "Ostatnie miesiące były trudne, być może nawet bardziej niż sama wojna, lecz liczy się jedno - nadal się trzymamy. Od rzekomo niemożliwej do wygrania wojny po podobno nierozwiązywalny kryzys wykazaliśmy odporność dalece przewyższającą oczekiwania niemal wszystkich. Choć wciąż jesteśmy powszechnie znienawidzeni, a stojące przed nami wyzwania pozostają równie potężne, możemy rozpocząć realizację długoterminowego planu zamiast jedynie reagować na każdy nowy problem. Być może pewnego dnia to miejsce przestanie być nieznośnym i niewdzięcznym zaściankiem."

###   Mateusz First Tree   ###

SND_rebirth_of_faith: "Odrodzenie wiary"
SND_rebirth_of_faith_desc: "Mieszkańcy Sandomierza odrzucili oba partyjne zła dręczące Polskę przed Upadkiem i zwyciężyli je dobrem. Zrzuciwszy kajdany starego systemu, ogłosili popularnego kaznodzieję o połowicznej legitymacji, Ojca Mateusza Żmigrodzkiego - żywe wcielenie ukochanego fikcyjnego bohatera - swoim pasterzem. To postać skrajnie kontrowersyjna. Wielu widzi w nim ostatniego dobrego księdza w Polsce, inni bluźniercę, a jeszcze inni błądzącego idealistę. Bez wątpienia jest jednak jedynym możliwym władcą w sandomierskiej próżni. Nawet najzacieklejsi przeciwnicy powstrzymują się od gwałtownych działań, dopóki nie znajdą odpowiedniego pretendenta. Ten czas może pozwolić \"Mateuszowi\" umocnić władzę. Przekonamy się, jak w nowej roli poradzi sobie człowiek mający niewielkie doświadczenie kapłańskie i jeszcze mniejsze polityczne."

SND_turn_toward_industrial_sector: "Zwrot ku przemysłowi"
SND_turn_toward_industrial_sector_desc: "Od secesji Sandomierza i przerwania szlaków handlowych prowadzących do Kielc oraz dalej, nasi wytwórcy i producenci zmagają się z problemami, których nikt właściwie nie rozwiązał. Owszem, rząd Sienkiewicza podjął kilka nieudolnych prób pomocy sektorowi przemysłowemu, wprowadzając symboliczne ulgi podatkowe i programy wsparcia finansowego. Środki te były jednak zbyt drobne, by przynieść odczuwalną zmianę. Pora na prawdziwą pomoc. Wydatki społeczne połączone z kontraktami rządowymi rozniecą iskrę naszej produkcji. Skorzysta na tym zwłaszcza duma Sandomierza - huta szkła Pilkington. Hmm... może powinniśmy zamówić nowe witraże?"

SND_historical_market: "Ożywienie zabytkowego rynku"
SND_historical_market_desc: "Niegdyś był ośrodkiem sandomierskiego handlu, później zabytkiem pełnym kawiarni i małych sklepików z pamiątkami, które miały oczarowywać turystów jego pięknem. Po załamaniu wymiany i wyczerpaniu środków na remonty nie spełnia żadnej z tych funkcji. Przy odpowiedniej trosce możemy odnowić gotyckie kamienice oraz ratusz, a następnie ponownie otworzyć rynek na szeroki handel przypominający średniowieczne czasy. Zwabieni dawnym pięknem serca Sandomierza kupcy będą przybywać do miasta, by uczciwie wymieniać towary pod czujnym spojrzeniem Niepokalanej Matki Bożej. Wkrótce dobra wiezione ze wschodu drogą krajową nr 77 oraz z południa łodziami po Wiśle wzbogacą naszych obywateli."

SND_feed_the_hungry: "Głodnych nakarmić"
SND_feed_the_hungry_desc: "Jan im odpowiadał: \"Kto ma dwie suknie, niech jedną da temu, który nie ma; a kto ma żywność, niech tak samo czyni\".\nŁk 3,11\n\nLecz co można zrobić, gdy ledwie starcza na jedną suknię, a żywności prawie nie ma? Lessowe i aluwialne gleby otaczające Sandomierz doskonale nadają się pod uprawę, lecz nadal nie potrafimy wyprodukować tyle, by wykarmić wszystkich. Plony pracy rolników są przy tym zbyt mało różnorodne, aby nawet najedzeni otrzymywali wszystkie niezbędne składniki odżywcze. Pomóc mogłyby zagraniczne karawany. To jednak wymaga czasu oraz wykwalifikowanych handlarzy specjalizujących się w sprzedaży żywności. Potrzebują oni kapitału, a wielu zbankrutowało podczas burzliwych lat. Rządowe pożyczki na niski procent mogą postawić ich na nogi i przywrócić usługi tak potrzebne mieszkańcom."

SND_soup_kitchens: "Jadłodajnie dla ubogich"
SND_soup_kitchens_desc: "Żywność jest dziś w Sandomierzu łatwiej dostępna. Ludzie jedzą do syta, lecz to wciąż za mało dla Ojca Mateusza, który nie potrafi siedzieć bezczynnie, dopóki głód - choć ograniczony - nadal nęka mieszkańców. Prawdziwy dobrobyt nadejdzie, gdy na ziemiach prowadzonych przez Apostołów Chrystusa odrodzi się handel. Być może wtedy rosnące nadwyżki żywności obniżą straszliwe ceny, bo kazania Żmigrodzkiego wywołały na rynku jedynie drobną zmianę. Dopóki nie nadejdzie pomyślniejsza przyszłość, rząd musi wziąć sprawy we własne ręce i otworzyć liczne kuchnie społeczne oferujące tanie posiłki najbardziej potrzebującym. Jeśli zajdzie taka potrzeba, sam Ojciec Mateusz będzie obsługiwał biednych, dając przykład pozostałym."

SND_temporary_shelters: "Tymczasowe schronienia"
SND_temporary_shelters_desc: "Uchodźcy i bezdomni błąkają się po ulicach Sandomierza. Niektórzy pochodzą z miasta i okolicznych wsi. Inni przybyli z daleka, zwabieni legendą ukochanego sandomierskiego księdza, który ożył, by pomagać biednym. Bez względu na pochodzenie wszyscy uciekają przed tym samym - zniszczeniem niesionym przez wojnę, zrujnowanymi miastami i spalonymi wioskami. Już tutaj są, a odprawienie ich byłoby bezduszne. Także niebezpieczne, gdyby źle przyjęli taką decyzję. Mamy więc obowiązek zapewnić im choćby najskromniejsze dachy nad głową. Obecnie liczba jest ważniejsza od jakości, dlatego większość schronień przybierze postać namiotów i bud skleconych niczym w najgorszych slumsach. To jednak tylko rozwiązanie przejściowe. Z czasem część wędrowców opuści nasze państwo, a wtedy rozpoczniemy prawdziwy program budownictwa społecznego."

SND_stench_of_heavy_industry: "Smród ciężkiego przemysłu"
SND_stench_of_heavy_industry_desc: "Ojciec Mateusz najchętniej przychyliłby nieba wszystkim potrzebującym. Niestety Sandomierz otaczają liczni wrogowie, gotowi zniweczyć osiągnięcia Apostołów i prześladować miejscową ludność. Daleko nam do czasów mesjańskiego pokoju, musimy więc kuć miecze. Wiele wody upłynie pod sandomierskim mostem, zanim przekujemy je na lemiesze. Niestety w naszym państwie niemal nie ma kuźni. Prawdę mówiąc, poza niewielką hutą szkła Sandomierz praktycznie nie posiada ciężkiego przemysłu. Musimy to zmienić. Wierni mogli oczekiwać dalszych programów dobrobytu, a nie przemysłowego źródła hałasu i zanieczyszczeń. Pasterz musi jednak uczynić to, co konieczne, by ochronić trzodę - nie ważne czy będzie to popularne lub nie."

SND_trade_with_starachowice: "Odnowiony handel ze Starachowicami"
SND_trade_with_starachowice_desc: "W tych ciężkich czasach dobrze wiedzieć, że nie jesteśmy zupełnie sami w walce z tyranią. Dzielni mieszkańcy Starachowic również powstali przeciw Prokuratorowi Generalnemu. Gdy wielu zamieniło rozsądek na szaleństwo, oni pozostali bastionem umiaru i zdrowego rozsądku. Są również naszymi bliskimi sąsiadami, a dzięki względnemu bezpieczeństwu na drogach mieszkańcy obu państw mogą dość swobodnie podróżować z jednego do drugiego. Skoro zaczęliśmy ożywiać raczkujący sektor przemysłowy, wzajemny handel jest czymś naturalnym. Możemy zaoferować hartowane szkło potrzebne przemysłowi motoryzacyjnemu, a także artykuły papiernicze i paszę. W zamian najbardziej interesują nas ich słynne ciężarówki STAR, zarówno do zastosowań cywilnych, jak i wojskowych."

SND_getting_our_hands_dirty: "Brudzenie rąk"
SND_getting_our_hands_dirty_desc: "Sandomierz sprzed Upadku nigdy nie był tak brutalny, jak przedstawiał go serial \"Ojciec Mateusz\". Dramatyczne i często nieprawdopodobne intrygi kryminalne wydawały się kiedyś przesadzoną fikcją. Jak na ironię, w porównaniu z dzisiejszym stanem ulic wyglądają niemal idyllicznie. Morderstwa, napady z bronią i kwitnący handel narkotykami są teraz codziennością. Rozsądniej byłoby pozostawić sprawę zawodowym policjantom. Bystry umysł i zdolność rozwiązywania zagadek to jednak najbardziej rozpoznawalne cechy Mateusza Żmigrodzkiego. Jego przenikliwość i niewzruszony kompas moralny muszą stać się dla ludzi symbolem nadziei. Właśnie dlatego osobiste zaangażowanie w najgłośniejsze sandomierskie sprawy nie podlega negocjacji. Pora, by Mateusz zakasał rękawy, wsiadł na skromny rower i przywrócił spokój na ulicach miasta."

SND_picking_where_they_left: "Powrót do pracy"
SND_picking_where_they_left_desc: "Lista grzechów Bartłomieja Sienkiewicza jest ogromna. Zdrada, podstępność, korupcja, złe zarządzanie Sandomierzem i splamienie dobrego imienia rodu Henryka Sienkiewicza to tylko kilka przewin. Nawet największy grzesznik jest jednak zdolny do dobra. Jeśli zaś można powiedzieć o Sienkiewiczu coś pozytywnego, to bez wątpienia poważnie traktował walkę z przestępczością i prowadził obszerne archiwum akt. Podczas ucieczki zniszczył wiele dokumentów bezpośrednio dotyczących własnych działań i zbrodni, lecz praktycznie wszystkie materiały na temat sandomierskiego półświatka pozostały nietknięte. Mamy do dyspozycji nazwiska podejrzanych, dowody oraz opisy spraw zakończonych przedwcześnie. Grzechem byłoby ich nie wykorzystać. Znacznie przyspieszą łapanie przestępców, a może nawet pomogą odkryć gangi i sprawy, o których dotąd nie wiedzieliśmy."

SND_friends_in_blue: "Przyjaciele w błękitnych mundurach"
SND_friends_in_blue_desc: "Zarówno w telewizji, jak i rzeczywistości Ojciec Mateusz nie może działać jak samozwańczy stróż prawa, lekceważąc doświadczonych policjantów i oficerów. Brak koordynacji albo choćby oznaki buntu byłyby dla naszego państwa katastrofalne. Z drugiej strony przy rządzie muszą być widoczni członkowie jego kultowej ekipy, naturalnie zajmując stanowiska wspomnianych doświadczonych funkcjonariuszy. Na szczęście obecny minister wojny, pułkownik Grzegorz Kobylarz, oraz komendant sandomierskiej policji, podinspektor Grzegorz Jaworski, uchodzą za zwolenników rządów Mateusza. Miejmy nadzieję, że zrozumieją i zaakceptują mianowanie swoim nowym przełożonym Oresta Możejki, kolejnej postaci z serialu, pomimo jego oczywistego braku doświadczenia. Żmigrodzki będzie musiał wykorzystać całe aktorskie przygotowanie, by przekonać ich dobrocią i dowcipem fikcyjnego pierwowzoru."

SND_bicycles_for_police: "Rowery dla policji"
SND_bicycles_for_police_desc: "To nie jest żart. Wbrew szeptom naszych wrogów rowery stanowią równie użyteczny i prawowity środek transportu wojskowego jak jeepy czy ciężarówki. Naprawdę! Rowery wojskowe pojawiły się na przełomie XIX i XX wieku. Korzystały z nich wyspecjalizowane oddziały armii włoskiej, niemieckiej i japońskiej. Umożliwiają transport, łączność i zwiad, a działania te można prowadzić znacznie ciszej niż przy użyciu pojazdów silnikowych. Są też tańsze od samochodów i bardziej humanitarne niż wykorzystywanie koni. Nie wspominając już, że niezawodny rower jest kultowym środkiem transportu Ojca Mateusza. W idealnych warunkach używalibyśmy specjalnych modeli wojskowych z pojemniejszym bagażnikiem, lecz na razie muszą wystarczyć zwykłe rowery cywilne, sprzedawane i przekazywane przez mieszkańców."

SND_rehabilitation_campaigns: "Programy resocjalizacyjne"
SND_rehabilitation_campaigns_desc: "Surowa rzeczywistość po Upadku może służyć za wymówkę dla bezdusznego traktowania schwytanych więźniów. Nie możemy na to pozwolić. Mimo wszystkiego, co zrobili, nadal są ludźmi - osobami zepchniętymi na skraj przez ekstremalne okoliczności wywołane rozpadem polskiego państwa. Uwierzyli, że przetrwać można wyłącznie dzięki bezwzględności. Kto, jeśli nie my, wskaże im właściwą drogę? W polityce więziennej położymy największy możliwy nacisk na resocjalizację. Znalezienie zawodowych psychologów, pracowników socjalnych i księży będzie wymagało wielkiego wysiłku oraz początkowo zwiększy koszty. Z czasem metoda okaże się jednak tańsza niż bezterminowe uwięzienie, zwłaszcza gdy osadzeni staną się moralnymi i produktywnymi członkami społeczeństwa."

SND_as_long_as_it_takes: "Tak długo, jak będzie trzeba"
SND_as_long_as_it_takes_desc: "Najważniejszym zadaniem policji i służby więziennej jest zapewnienie ludności bezpieczeństwa. Choć może to brzmieć okrutnie, naszym priorytetem jest oddzielenie ziarna od plew, nawet jeśli oznacza to surowsze wyroki dla niektórych. Dysponujemy skromnymi zasobami, niewielką liczbą sędziów oraz specjalistów zdrowia psychicznego. Komendant policji szacuje więc, że praktycznie wszyscy przestępcy otrzymają dożywocie. To prymitywne i barbarzyńskie, lecz nie możemy liczyć na więcej, gdy mamy inne priorytety, a u bram stoją wrogowie. Godny pożałowania obrót spraw. W sercu Żmijewski przysięga, że gdy ucichnie burza nad Wisłą, więźniowie zyskają możliwość apelacji, a zasługujący otrzymają krótsze wyroki. Właśnie dlatego musimy pośpiesznie przynieść Polsce prawo i moralność, aby misja Apostołów mogła przybrać zamierzony kształt."

SND_big_steps: "Wielkie kroki ku szlachetniejszemu celowi"
SND_big_steps_desc: "Wygląda na to, że rozwiązaliśmy najgłośniejsze sprawy nękające Sandomierz przez ostatnie lata. W archiwach nadal kurzy się jednak mnóstwo akt. Mimo to ulice stały się wyraźnie bezpieczniejsze, choć praca Ojca jeszcze się nie skończyła. Nie miejmy złudzeń: Mateusz nie spocznie na laurach i z czasem zajmie się pozostałymi sprawami, nawet jeśli nie wszystkie przyciągną uwagę mediów tak jak te, które Apostołowie już rozwiązali. Na wszystko przyjdzie pora. Obecnie musimy skupić się na przestępcach działających poza naszymi granicami."

SND_the_believers: "Wierni"
SND_the_believers_desc: "Wielka jest trzoda podążająca za Ojcem Mateuszem. Wielka i oddana, lecz również podzielona. Niektórzy w pełni uznają go za prawowitego księdza i wierzą w jego opowieść. Grupę tę tworzą zdeklarowani katolicy. Wielu z nich, tak zwanych \"niepraktykujących\", nawet nie zauważyło, że Mateusz Żmigrodzki nigdy wcześniej nie był proboszczem w Sandomierzu. Inni odnoszą się bardziej sceptycznie. Zastanawiają się, czy Mateusz nie jest wyłącznie kreacją aktora. Niektórzy są tego cholernie pewni. Mimo to wierzą w jego humanitarną sprawę, oddanie walce z przestępczością i szansę na odrodzenie popularności katolicyzmu. Pomimo wątpliwości, a nawet pewności co do oszustwa, zachowują milczenie, by nie szkodzić sprawie Ojca ani nie paść ofiarą bardziej fanatycznych wiernych. Najważniejszym przedstawicielem takiej postawy jest Krzysztof Nitkiewicz - biskup, który pozwolił Mateuszowi bez przeszkód działać w Sandomierzu."

SND_the_non_believers: "Niewierni"
SND_the_non_believers_desc: "Gdy Tomasz zwątpił w żywego, zmartwychwstałego Jezusa z krwi i kości, dotknął ran Pana, aby uwierzyć. Wtedy naprawdę Go ujrzał. Dziś ludzie widzą Ojca Mateusza, słyszą go i mogą go dotknąć, a mimo to nie wystarcza im to do wiary. Tworzą osobliwą mieszaninę sprzecznych przekonań. Mniej więcej połowa to ateiści, agnostycy, liberałowie i sceptycy, przeważnie mieszkańcy miast oraz przedstawiciele klasy średniej. Nie potrafią pojąć, jak wielka desperacja musiała ogarnąć Sandomierz, skoro mieszkańcy przystali na coś, co nazywają \"oczywistym i niedorzecznym podstępem\". Niektórzy wcześniej popierali reżim Sienkiewicza. Drugą połowę tworzą głęboko wierzący katolicy. Ich zdaniem \"przebieranki Żmijewskiego\" są świętokradztwem, mimo pobłażliwości miejscowych władz kościelnych. Na szczęście niewierzący nie są liczni ani dobrze zorganizowani."

SND_and_those_between: "Co mówią w wiadomościach?"
SND_and_those_between_desc: "Mateusz Żmigrodzki nie istniałby bez telewizji. Całkiem dosłownie. Ojciec i jego Apostołowie dobrze o tym wiedzą, nie mogą więc zignorować potężnej machiny propagandy telewizyjnej zbudowanej przez Sienkiewicza. Co jednak powinni z nią zrobić? Moralniej byłoby rozbić ogromną spółkę telewizji państwowej i pozostawić małe lokalne stacje publiczne oraz liczne prywatne agencje informacyjne. Ale czy byłoby to rozsądne? Owce potrzebują przecież pasterza, który odciągnie je od niebezpieczeństw zejścia z bezpiecznej ścieżki. Być może zdołamy zamienić ten zły konglomerat w siłę dobra?"

SND_first_time_into_breach: "Pierwszy raz przy ołtarzu"
SND_first_time_into_breach_desc: "Nadeszła pora. Odkąd Mateusz rozpoczął popularne kazania uliczne, każdy uczestnik zastanawiał się, kiedy usłyszy jego mądre i pełne współczucia przesłanie sprzed ołtarza. Ten dzień wreszcie nadszedł, i to w samą porę. Ludzie byli coraz bardziej niespokojni i nie rozumieli, dlaczego Mateusz nadal nie uczestniczy w mszach. Samo mieszkanie na plebanii przy jednoczesnym unikaniu wszelkich posług rzeczywiście wyglądało podejrzanie. Głosy twierdzące, że nie jest prawdziwym księdzem, stawały się coraz liczniejsze i głośniejsze. Połóżmy temu kres. Doświadczenie Żmijewskiego w odgrywaniu kapłana powinno wystarczyć, by z powodzeniem wygłosił oficjalne kazanie. Ministranci i akolici będą oczywiście obecni, aby wszystko przebiegło bez zakłóceń."

SND_bike_trip_in_countryside: "Rowerowa wyprawa na prowincję"
SND_bike_trip_in_countryside_desc: "Jednym z największych grzechów liberalnych elit było skupienie na ośrodkach miejskich i wynikające z niego lekceważenie wsi. To główny powód, dla którego ich rząd obaliły niezadowolone masy. Niestety planując krucjatę przeciw zorganizowanej przestępczości, sam Mateusz również skupił się przede wszystkim na Sandomierzu. Pora zmienić kierunek. Mieszkańcy wsi potrzebują wyraźnego symbolu, że rząd o nich pamięta. Doskonałym rozwiązaniem będzie masowa wyprawa rowerowa na wzór pielgrzymki, odwiedzająca kolejne miejscowości. Zaproszenie obywateli do wspólnej podróży z Mateuszem zmieni niewinną wycieczkę w marsz poparcia. A właściwie przejazd poparcia, jeśli chcemy być dokładni. Procesja rosnąca z każdą odwiedzoną wioską będzie dla ludzi prawdziwie inspirującym widokiem."

SND_teatime_at_presbitery: "Herbatka na plebanii"
SND_teatime_at_presbitery_desc: "Największym atutem Ojca Mateusza jest przystępność. Spokojne zachowanie, pełne zrozumienia spojrzenie i otwartość pomagają jednoczyć mieszkańców, łagodzić przeciwników oraz nakłaniać przestępców do skruchy. Dają ludziom spokój ducha - dobro coraz rzadsze w obecnych czasach. Możemy wzmocnić to poczucie bezpieczeństwa, organizując spotkania przy herbacie z Ojcem Mateuszem, aby każdy czuł, że rząd pozostaje naprawdę blisko zwykłych ludzi. Od czasu do czasu mieszkańcy będą mogli zapisać się na rozmowę z księdzem-detektywem, opowiedzieć o troskach, pogawędzić i przekazać kilka słów uznania dla władz. Jesteśmy pewni, że spotkania staną się niezwykle popularne, choć odciągną Mateusza od innych obowiązków, takich jak walka z przestępczością."

SND_smile_and_wave: "Asklepios czy Kaduceusz?"
SND_smile_and_wave_desc: "Chorzy, ranni i noszący blizny w umysłach. Sieroty Upadku potrzebują, byśmy ich leczyli i otoczyli profesjonalną opieką. Wymaga to rozbudowanej organizacji szpitali, wykształconych specjalistów oraz drogiego sprzętu, który trudno zdobyć. Znacznie łatwiej byłoby skierować środki do systemu opieki społecznej. Wypłacanie prostych świadczeń to łatwiejszy, a nadal skuteczny sposób pomagania potrzebującym. Byłby to krok we właściwym kierunku, lecz nie rozwiązałby sedna problemu. Jaki pożytek choremu z dodatkowych pieniędzy, gdy brakuje lekarstw? Realizacja każdego z tych projektów będzie niezwykle trudna, nawet jeśli jeden jest trochę prostszy i tańszy od drugiego. Nie wspominając już o tym, że Ojciec Mateusz najchętniej zrealizowałby oba naraz."

SND_riding_on_forwards: "Jedziemy dalej!"
SND_riding_on_forwards_desc: "Dokonało się! Poskromiliśmy niebezpieczeństwa i wyzwania dręczące nasze ziemie. Możemy wreszcie spojrzeć poza granice, pewni, że nierozwiązane problemy wewnętrzne nie wbiją nam noża w plecy. Dalej rozciąga się zupełnie inny świat, w którym żaden dobry Samarytanin ani rozjemca nie zdołał ustanowić łagodnego porządku. Nowi przestępcy, niewiele różniący się od tych, którzy dręczyli naszych obywateli, są gotowi skoczyć sobie do gardeł, odkąd nienawiść do Ziobry przestała ich jednoczyć. Możemy tylko liczyć, że niektórzy usłuchają przesłania miłości i złożą broń, choć wydaje się to bardzo mało prawdopodobne. Niech Bóg ma w opiece ziemię świętokrzyską."

###   War Tree   ###

SND_sandomierz_gambit: "Gambit sandomierski"
SND_sandomierz_gambit_desc: "Wojna nie jest niczym pięknym. To brzemię, które nadal ciąży na sumieniach ludzi. Lecz jak ciało bez ducha jest martwe, tak i wiara bez uczynków jest martwa. Ziemia świętokrzyska została rozszarpana najpierw przez tyranię Ziobry, a potem raz jeszcze przez radykałów, którzy dziś traktują ją jak własny plac zabaw.\n\nNie możemy bezczynnie patrzeć, jak tuż obok naszego domu niewinni padają ofiarą kolejnych okrucieństw. Zbyt długo nasze ukochane województwo pozostawało bez przywódcy, który przygarnąłby jego mieszkańców i obdarzył ich ciepłem równym światłu naszego miłosiernego Pana.\n\nJeżeli musimy walczyć, będziemy walczyć dla większego dobra."

SND_humane_art_of_war: "Humanitarna sztuka wojny"
SND_humane_art_of_war_desc: "Upadek sprowadził ludzi niemal do poziomu bestii, walczących wszystkim, co potrafi w najkrótszym czasie zabić najwięcej osób albo najmniejszym kosztem zadać ludności jak największe cierpienie psychiczne. Jeśli mamy przybyć jako wyzwoliciele, musimy nauczyć się powściągliwości.\n\nNie brutalną siłą ani barbarzyńskimi czynami mamy wypełniać wolę Boga. Dla większości ludzi zasady prowadzenia walki są dziś zapomnianym pojęciem, lecz my wyłamiemy się z tego nurtu i popłyniemy pod prąd. Każde przestępstwo popełnione przez naszych żołnierzy spotka się z surową karą, a niepotrzebne użycie broni przeciw obszarom niemilitarnym zostanie ściśle ograniczone, by do minimum zmniejszyć ryzyko krzywdy cywilów."

SND_pilgrimage_to_starachowice: "Pielgrzymka do Starachowic"
SND_pilgrimage_to_starachowice_desc: "Starachowice i Ostrowiec stanęły wraz z nami do walki przeciw Ziobrze. Podczas jego napaści doświadczyły tego samego gniewu co my. Być może teraz, gdy nad horyzontem coraz wyraźniej zbiera się wojna, zdołamy zawrzeć jakiś sojusz. Najpierw potrzebny jest jednak gest dobrej woli. W tym celu z ochotników oraz przedstawicieli Ojca Mateusza utworzymy pielgrzymkę do Starachowic, której przypadnie delikatniejsze zadanie. Ma wybadać grunt pod stosunki dyplomatyczne między naszymi państwami. "

SND_detente_with_materek: "Odprężenie w stosunkach z Materkiem"
SND_detente_with_materek_desc: "Wbrew naszym obawom serdeczne przyjęcie ze strony prezydenta Materka pozwoliło nawiązać właściwe stosunki dyplomatyczne ze Starachowicami. Rozmowy między naszymi państwami doprowadziły do zawarcia porozumienia pokojowego wobec gróźb płynących z pozostałej części województwa. Nie będzie między nami wojny!\n\nW nadchodzących tygodniach Ojciec Mateusz spotka się z prezydentem Materkiem w Ostrowcu Świętokrzyskim. Będzie to dowód dobrej woli oraz okazja do dalszych rozmów o przyjaźni naszych państw!"

SND_no_other_choice: "Nie ma innego wyjścia"
SND_no_other_choice_desc: "Mimo wszelkich starań o współpracę Starachowice nas odtrąciły. Smutna prawda jest taka, że może to oznaczać tylko jedno - tamtejszy rząd zamierza nas zaatakować. Mieszkańcy obu państw wystarczająco wycierpieli podczas napaści Ziobry, a jednak znów trzeba będzie przelewać krew z powodu bezsensownego sporu. Nie chcieliśmy tego, lecz najwyraźniej wojna jest jedynym językiem, który rozumieją. Nie możemy dać się zaskoczyć. Musimy uderzyć pierwsi."

SND_united_agains_the_chaos: "Razem przeciw chaosowi"
SND_united_agains_the_chaos_desc: "Nie ulega wątpliwości, że Starachowice są naszym jedynym przyjaznym sąsiadem. Otoczeni ze wszystkich stron przez wrogów i pozostawieni sami sobie musimy się zjednoczyć, by ramię w ramię stawić czoła zagrożeniom nadciągającym z każdego kierunku. Przyjmując pielgrzymkę, Materek wykonał gest dobrej woli, który znacznie ułatwi dalsze rozmowy. Teraz wszystko spoczywa w rękach wysłannika Boga, Ojca Mateusza. Obie strony pragną zacieśnienia więzi dyplomatycznych - Mateusz musi przekonać Materka do zawarcia sojuszu, inaczej przyszłe plany wyzwolenia mogą się poważnie skomplikować."

SND_just_normal_people: "Zwyczajni ludzie"
SND_just_normal_people_desc: "Po naszym wkroczeniu do Starachowic w najważniejszych ośrodkach przemysłowych spontanicznie wybuchły protesty zorganizowane przez związki zawodowe. Najbardziej radykalni działacze, prowadzeni przez Piotra Ikonowicza, zebrali się, by walczyć z głoszonym przez nas dobrym słowem. Boją się, nawet jeśli dobrze maskują lęk hałaśliwymi przemowami i drobnymi aktami wandalizmu. Mimo ich zachowania musimy pokazać, że nie żywimy wobec nich złych zamiarów i tak samo jak oni chcemy jedynie dobra naszych ludzi. Ojciec Mateusz wkrótce spotka się w Starachowicach z przywódcą strajku, wysłucha skarg i wyjaśni wszelkie nieporozumienia."

SND_save_all_you_can: "Ocalić każdego, kogo się da!"
SND_save_all_you_can_desc: "Powtarzające się i narastające straty oznaczają powolną, wyczerpującą śmierć - niczym krew sącząca się z otwartej rany postrzałowej. Przy naszym słabiej zurbanizowanym zapleczu właśnie takiego losu musimy się obawiać. Możemy zatamować to symboliczne wykrwawianie podczas otwartej wojny, zapewniając żołnierzom skuteczną pierwszą pomoc. Raz po raz przekonujemy się, że zbyt wielu umiera z powodu ran, których nie opatrzono na czas. Im drobniejsze i łatwiejsze do wyleczenia obrażenia, tym większą tragedią staje się taka śmierć.\n\nMamy nadzieję, że sieć szpitali polowych przydzielonych naszym oddziałom pozwoli zapobiec wielu niepotrzebnym stratom. Wydamy rozkazy, by bezpieczeństwo i zdrowie stawiać ponad zdobycze wojskowe. Nawet jeśli obróci się to przeciw nam, musimy zachować przy życiu i w zdrowiu tylu ludzi, ilu tylko zdołamy.\n\nNasze namioty oznaczone czerwonym krzyżem muszą być otwarte dla wszystkich - nie tylko dla naszych. W potrzebie każdy będzie równy."

SND_rattling_of_thousand_chains: "Szczęk tysiąca łańcuchów"
SND_rattling_of_thousand_chains_desc: "Rowery nie są najbardziej oczywistym wyborem na wojnę, dlatego często nie dostrzega się ich użyteczności. Każdy watażka chce tylko więcej: najcięższego czołgu, najbardziej wybuchowych bomb i samochodów wyglądających na kupione za najbrudniejsze pieniądze. Musimy odzyskać właściwe spojrzenie, okiełznać chciwość i zachcianki. Rowery świetnie sprawdzają się na wojnie. Nigdy ich do niej nie projektowano, lecz w rozpaczliwych realiach Polski po Upadku zaczynają błyszczeć. Są tanie w produkcji, więc wyposażenie całego batalionu w nowe jednoślady nie potrwa długo, oszczędzają cenne paliwo, a co najlepsze - dbają o kondycję naszych żołnierzy! Aby zachęcić ludzi do tej zmiany, w Sandomierzu i okolicach urządzimy maraton z udziałem najlepszych wojaków oraz, oczywiście, Ojca Mateusza!"

SND_greed: "Chciwość"
SND_greed_desc: "W sercu Buska-Zdroju spoczywa wąż o wielu imionach. Kelthuz, Libertaryat, Kelthuzzar - Tomasz Czapla. Jeszcze przed Upadkiem człowiek ten był utrapieniem, choć wówczas stosunkowo nieszkodliwym. Nigdy nie wyrósł z nastoletniego buntu i ciągnął go za sobą zdecydowanie zbyt długo. Gdy podczas przejęcia ziemi świętokrzyskiej przez Ziobrę zyskał znaczenie, zebrał pstrokatą gromadę podobnych sobie pochlebców. Nie pragną niczego poza bezgranicznym zbytkiem dla siebie, osiąganym kosztem mniej szczęśliwych. Dla dobra całego województwa jego klika nie może dłużej istnieć."

SND_violence: "Przemoc"
SND_violence_desc: "Okupacja ziemi świętokrzyskiej przez Ziobrę miała nieszczęsny skutek: wydobyła na powierzchnię dawne ideologie - upiory minionych czasów, pobudzone nowym pragnieniem krwi. Jednym z nich była Gwardia. Wzorując się na odpowiednikach z czasów II wojny światowej, bez zwłoki ustanowiła rządy terroru i brutalnych represji wobec każdego, kogo uznała za zdrajcę tak zwanego wyzwolenia. Komisarz Dobrzyniecka i jej najbliżsi współpracownicy mają na rękach krew wszystkich niewinnych skrzywdzonych w pogoni za władzą i dominacją. Musimy raz na zawsze przerwać ten krąg tortur."

SND_treachery: "Zdrada"
SND_treachery_desc: "Niegdyś podległe Ziobrze, a dziś działające na własny rachunek Towarzystwo Świętokrzyskie jest bandą morderców i oszustów. Kwietnymi słowami przekonuje zwolenników, że dla dalszego istnienia ich ukochanej ojczyzny konieczne jest uderzanie w świat i wszystkich, którzy nie podzielają ich poglądów. Przyrzekają wierność wzniosłemu celowi ukarania mgliście określonych \"onych\", do których opisu zawsze pasuje ten, kogo zamierzają prześladować w następnej kolejności. Najpierw zdradzili Ziobrę, a teraz zdradzają również Boga, którego rzekomo tak miłują, plując w twarz Jego naukom o dobroci. Takie czyny kalają duszę i trzeba położyć kres ich bezmyślnemu niszczeniu."

SND_wrath: "Gniew"
SND_wrath_desc: "Gdy ziemia świętokrzyska zaczęła się rozpadać, nikt nie rwał się do walki z Ziobrą bardziej niż Zbigniew Stonoga. Niezliczone razy skrzywdzony przez wymiar sprawiedliwości, z każdym kolejnym ciosem wymierzonym jemu lub jego rodzinie przez długie, pokrętne ramię prawa pałał coraz większą nienawiścią do ówczesnego ministra sprawiedliwości. Niepewna sytuacja Prokuratury dała mu sposobność do zemsty. Porywając tłumy pełnym jadu okrzykiem, walczył już nie tylko z Ziobrą, lecz z każdym symbolem choćby przypominającym jego wielkiego, dawnego wroga. Ludzie Stonogi w potworny sposób rozprawiają się ze wszystkimi dysydentami, którzy kiedykolwiek sympatyzowali z obalonym reżimem. Musimy powstrzymać tych samozwańczych stróżów prawa, zanim wyrządzą mieszkańcom jeszcze więcej krzywdy!"

SND_chasing_the_serpent: "Wypędzenie węża z Edenu"
SND_chasing_the_serpent_desc: "Po całkowitym rozpadzie partyzanckiej bandy Kelthuz zniknął pod osłoną nocy, pozostawiając jedynie kozły ofiarne z własnego najbliższego kręgu. Pod żadnym pozorem nie możemy pozwolić mu chodzić wolno, zwłaszcza po krzywdach wyrządzonych za jego rządów. Masowo rozwieszamy listy gończe, nadajemy komunikaty radiowe i korzystamy z właściwie każdego innego środka łączności, aby ostrzec ludność, że wydano nakaz jego aresztowania. Jeśli nie zdołamy go schwytać, powinien przynajmniej wiedzieć, że musi trzymać się z dala od naszych ziem."

SND_caina_and_antenora: "Kaina i Antenora"
SND_caina_and_antenora_desc: "Po zakończeniu procesów zarówno Ludmiła Dobrzyniecka, jak i Robert Bąkiewicz otrzymali wyroki dożywotniego pozbawienia wolności za zbrodnie popełnione w ich imieniu przez funkcjonariuszy obu klik. Wybranych członków najbliższego kręgu spotkała ta sama kara, lecz niektórzy - zwłaszcza Henryk Milcarz z Gwardii Ludowej - usłyszeli łagodniejsze wyroki i już za kilka lat będą mogli wrócić do życia cywilnego. Ojciec Mateusz osobiście apelował o przyjęcie i przebaczenie tym, których zwiodły radykalne ideologie. Ma nadzieję, że jego słowa zasieją nowe zrozumienie w ludziach żyjących dziś pod naszym opiekuńczym skrzydłem."

SND_put_storm_back_in_bottle: "Rozganianie ciemnych chmur"
SND_put_storm_back_in_bottle_desc: "Upadek kliki Stonogi stawia nas przed zagadką: jak włączyć jego dawnych zwolenników do naszego społeczeństwa? Liczyliśmy, że skoro Ziobro już dawno opuścił województwo, ich płomienna nienawiść z czasem sama wygaśnie. Myliliśmy się. Dziś aż nadto wyraźnie widać, że radykalizm przeniknął ich do szpiku kości. Współczuciem i wielkim wysiłkiem musimy pomóc im wydostać się z ciemności."

SND_limbo: "Przedpiekle"
SND_limbo_desc: "Jak Jerycho padło od grzmotu izraelskich trąb, tak i my zdobędziemy Kielce. Mieszkańcy tego miasta cierpią z powodu złych rządów i niedoli ponad wszelką miarę. Dusze uciskane przez Tarczyńskiego czeka jednak los sprawiedliwy i miłosierny. To ostatni krok naszego marszu po całe województwo. Nikt wiele się po nas nie spodziewał - ascetycznych pielgrzymach mających jedynie wolę i wiarę. A jednak dziś to my rzucimy wyzwanie potędze Kielc w ostatecznej bitwie. Niech Bóg okaże miłosierdzie naszym żołnierzom, a mieszkańcy miasta niech wkrótce poznają ciepło uścisku i gorącego posiłku. Przede wszystkim mamy obowiązek pomóc tylu ludziom, ilu zdołamy. A stolica regionu... jest właściwym miejscem dla tak wielkich czynów."

SND_mercury: "Merkury"
SND_mercury_desc: "Alfa i Omega. Początek i Koniec. Dokonało się. Całe województwo świętokrzyskie stoi dziś pod naszym sztandarem. Niewierzącym ukazano chwałę. Wierzący z trudem pojmują, że naprawdę do tego doszło. Sceptycy mówili o obłudzie, lecz trudno mówić o niej wobec rzeczywistości: ludziom żyje się teraz lepiej. Zwyciężył pokój, głód niemal zniknął, a ziemie niegdyś spustoszone wojną znów rozkwitają, po raz pierwszy od wieków skąpane w porannych promieniach nadziei.\n\nJest wiele prawdy w przekonaniu, że czasem najbardziej nieoczekiwana dusza potrafi wskazać innym drogę - a ten, który niegdyś wykonywał swój fach jedynie z przyzwyczajenia, zaczyna dziś wierzyć w moc własnych uczynków.\n\nBóg zatriumfował. A wraz z Nim Jego błogosławiony lud, prowadzony przez Ojca."
  
  
 ###   Country Events   ###
 
sandomierz.1.t: "Ziobro kapituluje!"
sandomierz.1.desc: "Około 9:30 sandomierskie oddziały maszerujące na zachód wkroczyły do maleńkiego miasteczka, które ledwie wykraczało poza rynek - jednego z wielu podobnych w regionie. Poza blokadą drogi kilometr wcześniej i kilkoma maruderami w wiosce położonej na uboczu nie napotkały oporu. Żołnierze nawet nie próbowali walczyć. Twierdzili, że zawieszenie broni już obowiązuje, a wszystkie siły Ziobry są w odwrocie. \n\nMimo to sandomierzanom polecono zachować zwykłą ostrożność podczas wjazdu na rynek. Gdy prowizoryczny wóz pancerny wyłączył silnik, zapadła zupełna cisza - niepokojąca nawet jak na tak podupadłą mieścinę. Miasto było martwe. Żołnierze wysiedli i zapukali do kilku drzwi, próbując znaleźć jakąkolwiek formę życia obdarzoną przynajmniej przeciętną inteligencją. Po chwili jedne z nich się otworzyły, ukazując wycieńczonego mężczyznę. \n- Widział pan siły Ziobry? - zapytał sandomierski sierżant. \n- Ano widziałem. \n- Gdzie teraz są? \n- Na piętrze - mężczyzna wskazał lekko głową pierwszą kondygnację. \n- I... ilu ich jest? \n- Trzy plutony. \n\nOkna tego domu oraz kilku sąsiednich otworzyły się, a z każdego wysunęło się po kilka luf, granatów albo prowizorycznej broni miotanej. \n- Komisarz Zardecki, Prokuratura Generalna, miło mi poznać. \n- C-c-czy nie miało już obowiązywać zawieszenie broni? - wyjąkał sandomierzanin, robiąc kilka ostrożnych kroków w tył, by ocenić rozmiar gówna, w które właśnie wdepnął. \n- Wie pan co, właściwie nie mam pojęcia. Chwileczkę, zadzwonię do dowództwa. \n\nKomisarz wyjął służbową Nokię 3310 i wybrał numer. \n- Boże, oby tylko znowu nie ten idiota... Dzień dobry, może mi pan powiedzieć, czy zawieszenie broni już obowiązuje? Rozumiem... Zupełny chaos? Czyli to już koniec? Dobrze... W porządku, dziękuję, do widzenia. Proszę na siebie uważać. \n- Panowie - powiedział komisarz - wygląda na to, że dalsze działania wojenne nie mają sensu. Jeśli pozwolicie, opuścimy miasto i wycofamy się. Żołnierze, opuścić broń. Farsa skończona."
sandomierz.1.a: "Chwila spokoju?"

sandomierz.2.t: "Ziobro odmawia kapitulacji!"
sandomierz.2.desc: "Około 9:30 sandomierskie oddziały maszerujące na zachód wkroczyły do maleńkiego miasteczka, które ledwie wykraczało poza rynek - jednego z wielu podobnych w regionie. Poza blokadą drogi kilometr wcześniej i kilkoma maruderami w wiosce położonej na uboczu nie napotkały oporu. Żołnierze nawet nie próbowali walczyć. Twierdzili, że zawieszenie broni już obowiązuje, a wszystkie siły Ziobry są w odwrocie. \n\nMimo to sandomierzanom polecono zachować zwykłą ostrożność podczas wjazdu na rynek. Gdy prowizoryczny wóz pancerny wyłączył silnik, zapadła zupełna cisza - niepokojąca nawet jak na tak podupadłą mieścinę. Miasto było martwe. Żołnierze wysiedli i zapukali do kilku drzwi, próbując znaleźć jakąkolwiek formę życia obdarzoną przynajmniej przeciętną inteligencją. Po chwili jedne z nich się otworzyły, ukazując wycieńczonego mężczyznę. \n- Widział pan siły Ziobry? - zapytał sandomierski sierżant. \n- Ano widziałem. \n- Gdzie teraz są? \n- Na piętrze - mężczyzna wskazał lekko głową pierwszą kondygnację. \n- I... ilu ich jest? \n- Trzy plutony. \n\nOkna tego domu oraz kilku sąsiednich otworzyły się, a z każdego wysunęło się po kilka luf, granatów albo prowizorycznej broni miotanej. \n- Komisarz Zardecki, Prokuratura Generalna, miło mi poznać. \n- C-c-czy nie miało już obowiązywać zawieszenie broni? - wyjąkał sandomierzanin, robiąc kilka ostrożnych kroków w tył, by ocenić rozmiar gówna, w które właśnie wdepnął. \n- Wie pan co, właściwie nie mam pojęcia. Chwileczkę, zadzwonię do dowództwa. \n\nKomisarz wyjął służbową Nokię 3310 i wybrał numer. \n- Boże, oby tylko znowu nie ten idiota... Dzień dobry, może mi pan powiedzieć, czy... och, to ty... Nie, nie robię sobie jaj, to dosyć ważne... Słuchaj, powiedz tylko, czy zawieszenie broni... Nie zmyślam tego gówna, jestem właśnie w... Nie, mówię o pieprzonym zawieszeniu broni, czy ono... A ty też spierdalaj, to nie ja powiedziałem zastępcy prokuratora, że może mi wsadzić swoje... Ssij pałę! \n\nKomisarz wepchnął telefon do kieszeni i spojrzał na pusty rynek. Ciężarówka pędziła ulicą i docierała już na skraj miasta."
sandomierz.2.a: "Chwilowe niepowodzenie."

sandomierz.3.t: "Starachowice negocjują z Ziobrą"
sandomierz.3.desc: "Nasi wysłannicy w Starachowicach donoszą, że sukces sojuszu w wojnie przeciw Ziobrze zaczyna przynosić owoce! Dyplomaci Prokuratury oraz rządu Materka spotkają się, by omówić pokój między naszymi państwami! Być może pokój jest już na horyzoncie!"
sandomierz.3.a: "Oby się poddał."

sandomierz.4.t: "Zajęcie pogranicza"
sandomierz.4.desc: "Około 9:30 sandomierskie oddziały maszerujące na zachód wkroczyły do maleńkiego miasteczka, które ledwie wykraczało poza rynek - jednego z wielu podobnych w regionie. Poza blokadą drogi kilometr wcześniej i kilkoma maruderami w wiosce położonej na uboczu nie napotkały oporu. Żołnierze nawet nie próbowali walczyć. Twierdzili, że od dobrych kilku dni nie słyszeli niczego od dowództwa. \n\nMimo to sandomierzanom polecono zachować zwykłą ostrożność podczas wjazdu na rynek. Gdy prowizoryczny wóz pancerny wyłączył silnik, zapadła zupełna cisza - niepokojąca nawet jak na tak podupadłą mieścinę. Miasto było martwe. Żołnierze wysiedli i zapukali do kilku drzwi, próbując znaleźć jakąkolwiek formę życia obdarzoną przynajmniej przeciętną inteligencją. \n\n- Sierżancie, niech pan na to spojrzy! - dobiegł krzyk z jednej z bocznych uliczek. Pod płotem, niedbale rozciągnięty jak na prawdziwego akapka przystało, leżał podziurawiony kulami żołnierz Waffen $$$$, najwyraźniej gotów przenieść się do lepszego świata. \n- Opatrzcie go - rozkazał sierżant, kucając przy rannym. - A teraz bądź tak miły i powiedz, kim ty, do cholery, jesteś. \n- Jestem rycerzem... wolnego rynku - odparł żołnierz. - Upadek eurokomunizmu jest bliski. \n- Eurokomunizmu? To on tak cię urządził? \n- Nie wiem. Chyba mieli czarne mundury. Albo czerwone? Czy... nie wiem. Przyszli z zachodu. Otworzyli ogień. Mój oddział się wycofał. Jestem męczennikiem... \n- Dobra. Kryć się, ludzie. Muszą być blisko. \n- Nieee, oni... też spierdolili tam, z powrotem - ranny wskazał na zachód. - Wszyscy się tu, kurwa, kręcą jak gówno w przeręblu. Nie mam pojęcia, co się dzieje, przeszliśmy chyba aż od Jędrzejowa... \n- Jędrzejowa? To znaczy, że przebiliście się przez siły Ziobry... \n- Jakiego, kurwa, Ziobry? Nie widziałem ziobrysty od... Teraz jest kompletny chaos. Każdy sobie. Tak właśnie będzie... w waszym, kurwa, akapie... \n\nŻołnierz stracił przytomność. Sandomierzanie krzątali się nerwowo, obserwując okolicę. Poza wiatrem szeleszczącym w liściach nie było słychać niczego."
sandomierz.4.a: "Zostajemy na dobre."

sandomierz.5.t: "Fala nostalgii"
sandomierz.5.desc: "Bartłomiej Sienkiewicz siedział na skraju łóżka w przydzielonym mieszkaniu, minutę drogi od ratusza. Było niewygodne - boleśnie niewygodne - przez co jakakolwiek próba porządnego snu graniczyła z niemożliwością. Plecy go mordowały, a gardło nieustannie piekło i nie pomagał żaden sposób leczenia. Po ciągłym stresie ostatnich miesięcy polityk czuł się tak, jakby w ciągu jednej nocy postarzał się o dziesięć lat. Od chwili przybycia Ziobry do województwa pozostawał w ucieczce. Gdy Prokurator zaczął usuwać wszystkich możliwych przeciwników w regionie, ludzie związani z partiami innymi niż PiS stanęli przed prostym wyborem: ukryć się i liczyć, że nie są dość ważni, by ich ścigać, albo wydostać się z okolicy, póki mieli szansę. Dla Sienkiewicza prawdziwe było jedynie drugie wyjście. \n\nZostało mu tylko kilka fotografii przypominających miasto, które musiał porzucić. Z żalem przycisnął jedną do piersi. Choć wygnanie nie trwało nawet roku, Kielce wydawały się już odległym wspomnieniem. Sandomierz przyjął go życzliwie, lecz zawsze pozostawał obcy: ulice nieznajome, twarze nierozpoznawalne. Poza garstką kolegów, którzy uciekli razem z nim, Sienkiewicz czuł się samotny wśród obcych, złączonych jedynie wspólnym celem. \n\nNawet w tym ostatnim, zapomnianym zakątku województwa p.o. ministra nie mógł czuć się bezpieczny wobec nieustępliwych ambicji Ziobry. Od początku było jasne, że Prokurator nie zaakceptuje niczego poza całkowitym usunięciem sprzeciwu na ziemi świętokrzyskiej. Gotowość Sandomierza do przyjmowania uchodźców politycznych stała tej misji na drodze. Gdy wreszcie nadeszła ofensywa, Rzeczpospolita niemal pogodziła się z losem, pogrążona w przygnębionej bezradności. Przyparty do muru, ściśnięty między dwoma reżimami związanymi z PiS-em i pozbawiony dalszej drogi ucieczki, Sienkiewicz poprzysiągł stawić ostatni opór zamiast biernie czekać na nieuniknione. \n\nStworzenie zalążka ruchu oporu okazało się dla doświadczonego polityka znacznie łatwiejsze, niż oczekiwał. Nie potrzebował uroku ani szczególnych obietnic. Sama myśl o ocaleniu historycznego miasta przed losem jego ukochanych Kielc w zupełności wystarczyła. Kiedy niedługo później uciekł dotychczasowy burmistrz, Sienkiewicz przejął władzę nie z własnego wyboru, lecz dlatego, że nikt inny nie chciał tego zrobić. \n\nWspomnienie tych zmagań niespodziewanie wycisnęło mu łzę z oka. Mijały niemal równo trzy miesiące. Początkowo dawał sobie najwyżej tydzień. Jakimś sposobem, ku własnemu nieustannemu zdumieniu, nadal trwał. Sroga zima 2026 roku bardzo pomogła utrzymać front w miejscu. Teraz dni stawały się dłuższe, odwilż zamieniała lód w błoto, a Sienkiewicz wiedział, że ostateczne starcie zbliża się wielkimi krokami. Odłożył fotografię. Czuł się słaby i zmęczony, lecz obiecał sobie, że ukryje to, dopóki Sandomierz nie będzie bezpieczny. Nawet jeśli ostatecznie wszystko miało pójść na marne."
sandomierz.5.a: "Wspomnienie utraconego domu kazało mu wytrwać."

sandomierz.6.t: "Błoga nieświadomość"
sandomierz.6.desc: "W zwyczajną sobotę Grzegorz wracał samochodem do domu w wyjątkowo radosnym nastroju. Zbliżający się do czterdziestki pracownik biurowy właśnie skończył cotygodniowe zakupy i z entuzjazmem myślał o weekendzie spędzonym z żoną oraz dwoma małymi synami. Krzysiek obchodził dziś piąte urodziny, więc ojciec kupił kilka zabawek oraz bardzo prostą grę planszową, przy której wieczorem mogła bawić się cała rodzina. Po krótkiej drodze ze sklepu zaparkował mercedesa na podjeździe, niezdarnie wyciągnął torby z bagażnika, uparcie próbując zabrać wszystko naraz, i wszedł do środka. \n\nGdy żona zaczęła rozpakowywać zakupy, Grzegorz poszedł do składziku szukać papieru prezentowego. Bezowocnie przekopywał się przez gromadzone od dziesięcioleci części i przedmioty, którym - jak zarzekał się sam przed sobą - pewnego dnia na pewno znajdzie nowe zastosowanie. Ostatecznie zadowolił się więc najlepszym dostępnym zamiennikiem, by nie wracać do zamykanego już sklepu. Rozwiązanie było toporne i mało eleganckie, lecz dzięki przeciętnym zdolnościom manualnym Grzegorz zaczął owijać zabawki stosem starych, wyrzuconych gazet. \n\nWbrew optymistycznym oczekiwaniom praca okazała się znacznie trudniejsza z powodu ciągle rozdzierającego się papieru. Jakimś cudem owinął grę bezbożną ilością taśmy, która trzymała poszarpane kawałki razem, lecz nieregularne kształty zabawek go pokonały. Sfrustrowany i lekko spocony usiadł na podłodze składziku, czytając skrawki historii, których nie zdołał wykorzystać ponownie. \n\n13 czerwca 2025 - Niewyjaśniona eksplozja jądrowa na Bałutach \n\n30 kwietnia 2026 - Proklamowanie Rzeczpospolitej Sandomierskiej \n\n24 grudnia 2026 - Prokuratura Generalna wypowiada wojnę \n\nZe zdziwienia zmrużył oczy. Tytuł początkowo wydawał się pozbawiony sensu. Sprawdził jeszcze raz. Nie było wątpliwości: data się zgadzała. Gazeta była lokalna, więc raczej nie chodziło o żadne inne miejsce. W panice Grzegorz zaczął składać rozrzucone fragmenty, próbując przywrócić stronie czytelność. Artykuł rozwiewał wszelkie wątpliwości - Rzeczpospolita była w stanie wojny. Wojna trwała od trzech miesięcy i najwyraźniej nikt jej nie zauważył. Gdzieś tam ludzie walczyli i ginęli w obronie kraju, podczas gdy w Sandomierzu życie toczyło się jak zwykle. Oddziały Prokuratora mogły w każdej chwili zająć miasto, a on dowiedziałby się dopiero po fakcie. \n\nWstrząśnięty Grzegorz pobiegł ostrzec rodzinę. Od tej chwili musieli być gotowi na wszystko."
sandomierz.6.a: "W Sandomierzu nie ma wojny."

sandomierz.7.t: "Propaganda na kolanie"
sandomierz.7.desc: "W dość skromnym studiu STV, jednego z najważniejszych lokalnych nadawców w Sandomierzu, dwoje niezbyt charyzmatycznych prezenterów kończyło codzienny serwis informacyjny. Tuż za nimi, poza kadrem kamer, stażyści pracujący dla dyrektora programowego chaotycznie biegali tam i z powrotem ze starymi taśmami, notatkami i wszystkim, co mogło spełnić nowe wytyczne p.o. ministra Sienkiewicza. Od czasu do czasu ich hałas przebijał się przez kiepskie filtry dźwięku. Gdy jeden z nowych pracowników potknął się o przewód głównej kamery i wyrwał go z gniazda, ekipa w pośpiechu zarządziła nieplanowaną przerwę reklamową. Zwiększyło to jedynie presję czasu. \n\n- Dobra, wszyscy. Wracamy na żywo za piętnaście sekund. Co macie? - dyrektor programowy rozpaczliwie liczył na choć odrobinę dobrych wiadomości. \n- Przejrzałem całe archiwum, szefie. Mamy mniej więcej trzy godziny materiału. \n- Na dzisiejszą ramówkę, prawda? Powiedz, że już to podzieliłeś i to tylko porcja na dziś. \n- Łącznie. Dziewięćdziesiąt procent treści dotyczy wyłącznie wydarzeń regionalnych. Wiesz, jak trudno znaleźć cokolwiek choćby wspominającego Ziobrę? Większość zespołu nie spała całą noc, szukając klipów, które da się wykorzystać. Sklejenie tego, co już mamy, było koszmarem. Połowa w ogóle nie trzyma się kupy. \n- I to wszystko? Nic więcej? \n- Zawsze możemy coś znaleźć przy drugim oglądaniu. Ale niewiele. Pewnie najwyżej parę ujęć w tle. \n- A inne stacje? Na pewno mają ten sam problem. Nie mogą wymienić się z nami materiałami? \n- Eee... właśnie w tym rzecz. Większość ma równie mało, więc pilnują wszystkiego jak skarbu. Kiepsko wygląda puszczanie tylko nagrań, które pokazali już wszyscy pozostali. \n\nPrzez chwilę rozważał sytuację. Nie było szans, by wypełnili cały dzień dwoma reportażami, jednym materiałem śledczym i serią montaży złożonych z niepowiązanych, wyrwanych z kontekstu klipów. Przyparty do muru widział tylko jedno rozwiązanie. \n\n- Pieprzyć to. Wyrzućcie cały pomysł. Robimy po swojemu. \n- Co? Jak? Nie mamy budżetu, żeby w środku wojny nagle uprawiać dziennikarstwo śledcze. Nie mamy nawet kogo wysłać w teren. \n- Marek, kto mówił o czymś takim? Przynieś kostiumy, każ Adamowi założyć perukę i daj mu do powtarzania jakieś typowe kwestie złoczyńcy. Od teraz to nasz Prokurator. Wstawiajcie go w tle wszystkiego, co akurat pokazujemy, i po sprawie. \n- Przecież od razu będzie widać, że materiał przerobiono. \n- I co z tego? Albo to, albo wszystko wyrzucamy. Jak widzowie zechcą, mogą go po prostu ignorować. \n- Mhm. A kreskówki w paśmie dla dzieci o osiemnastej? \n- Nie wiem. Naklejcie twarz Ziobry na złoczyńcę czy coś. Montażem nauczcie dzieci, jakie zło niesie jego reżim. Bądźcie kreatywni. Cokolwiek się nada. \n- Dobrze... Chyba rozumiem..."
sandomierz.7.a: "Wyciągnąć pacynki Ziobry!"

sandomierz.8.t: "Wyrównanie rachunków"
sandomierz.8.desc: "- Czyli to tutaj? Wygląda trochę... tłoczno. \n- Szef dał jasne instrukcje, Michaś. Chcesz do niego iść i powiedzieć, że pomylił adres? \n- Nie, tylko mówię: dlaczego, do cholery, Młynarz miałby robić interesy akurat tutaj? \n- Właśnie dlatego nie płacą ci za myślenie. O to chodzi: kto przy zdrowych zmysłach podejrzewałby, że dwie ulice od rynku dzieje się coś podejrzanego? \n- Taa... Miejmy to już z głowy. I tak zwracamy na siebie za dużo uwagi. \n\nZałożyli kominiarki i wyskoczyli z furgonetki przemalowanej tak, by niepozornie przypominała samochód techniczny. Wdarli się przez wzmocnione drzwi budynku oznaczonego jako cel napadu, na oślep wymachując kijami i próbując powalić wszystkich potencjalnych obrońców. Gdy nieskoordynowana agresja w końcu opadła, gangsterzy rozejrzeli się po betonowej posadzce zasłanej potłuczonym szkłem, popękanymi donicami i kopcami ziemi. Ogłuszająco wył alarm, a oni z coraz większym zmieszaniem szukali jakiegokolwiek łupu. \n\n- Cholera, wykiwali nas! Nic tu nie ma. \n- Jak Szef się dowie, mamy przejebane. \n- To nie nasza wina, że dał zły adres. Wynośmy się. Jeśli złapią nas gliny, wpakujemy się w dużo większe kłopoty. Wyjaśnimy mu później. \n- Zwariowałeś? Na zewnątrz kręci się za dużo ludzi. Nie wyjdziemy bez świadków. \n- A co wolisz, co? Ukryć się tutaj i liczyć, że wszyscy po prostu zapomną o włamaniu? \n- No... tak. \n- Nie, idioto. Będzie tylko gorzej. Albo uciekamy, albo dostaniemy od pięciu do dziesięciu lat. Chodź. \n\nPo krótkim namyśle para postanowiła szybko opuścić zdemolowany sklep, zanim ktokolwiek zdoła zareagować. Niestety hałas przyciągnął już niewielki tłum. \n\n- Eee, niczego nie widzieliście. Jak któryś zacznie sypać, będzie miał do czynienia z Bielakiem. Jasne? \n- Ja pierdolę, Michaś. Przestań pajacować. Widzieli nas, tak? Wiesz, co robić. \n\nRobiąc to, co potrafili najlepiej, bandyci chwycili kije i zatłukli pechowych gapiów do nieprzytomności. Zostawili ofiary własnemu losowi i bez namysłu wskoczyli z powrotem do furgonetki, zastanawiając się jedynie, jak dokładnie przedstawią Szefowi tę porażkę. Ostatnim, co zobaczyli, była ciemna postać, ledwie widoczna w słabym blasku latarni, zmierzająca ku miejscu przestępstwa."
sandomierz.8.a: "Tyle zachodu, żeby zachować tajemnicę, a potem wszystko spieprzyć..."

sandomierz.9.t: "Nieproszony gość"
sandomierz.9.desc: "To była chwila jego triumfu. Na całym Rynku Starego Miasta wiwatowały tysiące ludzi, którzy w szczególnie wietrzny piątkowy wieczór tłumnie przybyli, by podziękować swoim wybawcom za dokonanie czegoś, co pod koniec 2026 roku, gdy wybuchł konflikt, wydawało się niemal niewyobrażalne - skuteczną obronę Sandomierza przed napaścią Prokuratora. Bartłomiej Sienkiewicz znajdował się w centrum wszystkiego. Wcale nie czuł się bohaterem, bo głównie zajmował się sprawami wewnętrznymi, podczas gdy milicje walczyły do upadłego, by zatrzymać natarcie Ziobry na błotnistych polach na zachód od Opatowa. Chętnie jednak pławił się we wdzięczności za kolosalny wysiłek włożony w obronę miasta, którego prawie nie znał. \n\nPo krótkiej, improwizowanej paradzie, która zamiast rzeczywistej siły wojskowej ukazała raczej brak organizacji i wyposażenia zwycięskich oddziałów, wyjątkowo entuzjastyczni konferansjerzy powitali Sienkiewicza na scenie. Źródła zwycięstwa upatrywali w jego osobistym uporze i poświęceniu. Choć częściowo mieli rację, przypisywanie sobie całej zasługi budziło w nim lekki dyskomfort. Na przemówienie miał prosty plan: uznać wkład wszystkich, pochwalić milicje i przekazać triumfalną pałeczkę następnemu mówcy. Nic szczególnie kontrowersyjnego. Podszedł do mikrofonu. Atmosfera pozostała radosna, lecz widział, że tłum tak naprawdę nie przyszedł dla niego. \n\n- Drodzy obywatele! - zaczął Sienkiewicz wyćwiczoną dykcją doświadczonego polityka. - Ogromnie się cieszę, że przybyliście tak licznie. Jestem z was wszystkich dumny. Dumny z tego, czego dokonaliście. Z waszego hartu, z determinacji, by walczyć i zwyciężyć mimo przytłaczającej przewagi wroga. Gdy niewiele ponad rok temu po raz pierwszy przybyłem do tego miasta, nigdy nie spodziewałem się... \n\nUrwał. Z tyłu tłumu wybuchło zamieszanie. Patrzył, jak kolejne części zgromadzenia pogrążają się w zupełnym chaosie, a ludzie w panice rozbiegają się każdą ulicą wychodzącą z rynku. Stał bezradnie i bezskutecznie próbował ich uspokoić, aż podbiegł do niego wyraźnie zdyszany sierżant policji. \n\n- Panie ministrze, doszło do ataku na ulicy Długosza. Siedmiu rannych. Dwóch nie reaguje. \n- Cholera, teraz? To naprawdę musiało się wydarzyć akurat teraz? \n- Wygląda na porachunki gangów. Długo to planowali. Musieli wykorzystać uroczystości jako przykrywkę, ale coś poszło bardzo źle i wmieszało się kilku cywilów. \n- Świetnie. Tyle zostało z pozorów porządku. Odpowiecie za to niedopatrzenie, sierżancie. Do roboty. Macie już jakichś podejrzanych? \n- Tylko jednego. Znaleźliśmy go kręcącego się przy miejscu zbrodni. Cały ubrany na czarno, alibi zupełnie bez sensu... \n- Dobrze, sprowadźcie go na przesłuchanie. \n- No właśnie, w tej sprawie..."
sandomierz.9.a: "...już uciekł z okolicy."

sandomierz.10.t: "Chronić i służyć"
sandomierz.10.desc: "Dzień zbliżał się ku końcowi, a posterunkowy Limanowski siedział zgarbiony nad biurkiem, tonąc po kolana w papierach. Na dworze było już ciemno, lecz według jego szacunków zdołał przetworzyć dopiero połowę dzisiejszych zgłoszeń. Co dwie godziny sumiennie wrzucał wprowadzone do systemu akta do przepełnionego pudła spraw oczekujących, ale stosy papierów po obu stronach biurka nadal groziły zawaleniem. Od początku tygodnia tkwił na komisariacie i bez powodzenia próbował nadążyć za niekończącą się falą przestępczości paraliżującej miasto. Oczywiście nie narzekał. Było tu zaskakująco przytulnie, znacznie przyjemniej niż na bezprawnych ulicach Sandomierza. Po co miałby ryzykować tam własne bezpieczeństwo, skoro mógł zgarniać tę samą marną pensję bez oddalania się od biurka na więcej niż dwadzieścia metrów? Dopóki wyglądał na zajętego, jego największym zmartwieniem było przypadkowe zawieruszenie dokumentów, które od czasu do czasu osuwały się na podłogę. \n\n- Limanowski! Dobre wieści: odpoczniecie od papierów. Potrzebujemy was na ulicach. - Głos sierżanta był surowy i stanowczy mimo wyraźnego wyczerpania przepracowaniem. Nie pozostawiał wiele miejsca na dyskusję. \n- Eee, ale panie sierżancie, co z nowymi sprawami? Nadal muszę wprowadzić je do systemu - powiedział z nadzieją, że przekona przełożonego, by pozwolił mu zostać. \n- A chrzanić nowe sprawy. Brakuje nam ludzi i potrzebujemy w terenie każdego. Nawet was. Bierzcie sprzęt i ruszajcie. Gdy następnym razem będę robił obchód, nie chcę was tutaj widzieć. \n\nRozczarowany Limanowski sięgnął po pierwsze zgłoszenie, którego jeszcze nie zarejestrował. Mechanik zaginął po kłótni z lichwiarzem i jego zbirami. Funkcjonariusz szybko wsunął dokument z powrotem w środek stosu. Przez ostatnie cięcia budżetowe nie dostał nawet pistoletu. Nie był na tyle szalony, by bez broni próbować aresztować bandę oprychów. Wyciągnął następną teczkę - serię rabunków powiązanych z lokalnym gangiem wyznaczającym terytorium na Rokitku. Także ją odrzucił. Przeglądał kolejne zgłoszenia, pomijając wszystko, co wykraczało poza jego grupę zaszeregowania. W końcu się zatrzymał. Znalazł idealny problem, na którym mógł wykorzystać swoje zdolności śledcze: \n\nDziewięcioletnia Zuzia K. szuka zaginionej kotki, ostatni raz widzianej dwa dni temu na ganku jej domu. Reaguje na imię \"Łapka\". Nagroda dla znalazcy wynosi 100 zł. \n\nWidząc niedolę biednej dziewczynki, posterunkowy Limanowski ruszył do działania. Ludzie wołali o pomoc, a on odpowiedział. Nadeszła pora wymierzyć sprawiedliwość."
sandomierz.10.a: "Nie znalazł kotki. Dzień później Łapka wróciła do domu cała i zdrowa."

sandomierz.11.t: "Wróg Rzeczpospolitej"
sandomierz.11.desc: "Bartłomiej Sienkiewicz siedział w wygodnym fotelu biurowym i niecierpliwie stukał palcami w lekko podniszczone, stylowe biurko z ciemnego dębu, co chwila zerkając kątem oka na zegar wiszący w rogu pokoju. Była 12:13, a więc człowiek, z którym miał się spotkać, spóźniał się już trzynaście minut na pilną rozmowę. Zapamiętał ten fakt i z irytacją zaczął rozważać, kto w przyszłości zastąpi funkcjonariusza, próbując odwrócić uwagę od protestów za oknem. Polityk pociągnął jeszcze dwa łyki letniej czarnej kawy, gdy seria puknięć zapowiedziała spóźnione przybycie gościa. Komendant Górecki wszedł bez cienia pośpiechu, zachowując godną postawę, i wręczył przełożonemu plik nieuporządkowanych dokumentów. \n\n- Oto akta, o które pan prosił. Niewiele jednak znaleźliśmy. Ten człowiek to zagadka. \n- Spóźniliście się, komendancie. Lepiej, żeby zawartość była warta czekania. \n- Wszystkie siły rzuciliśmy na utrzymanie porządku. Naprawdę niewiele zostało nam na poboczne projekty. - Niesubordynacja komendanta była oczywista. Szacunek, którym zwykle darzył p.o. ministra, chwilowo przegrał z licznymi bezowocnymi poszukiwaniami, nad którymi musiał osobiście czuwać. \n- Ten \"poboczny projekt\" stanowi obecnie największe zagrożenie dla jakichkolwiek pozorów stabilności w mieście. Oczekuję należytej powagi. \n- On? Nie gangi ani setki wściekłych obywateli tuż pod pańskim gabinetem? \n- Tak. To równoległy ośrodek władzy, Górecki. Wiedzielibyście o tym, gdybyście czasem raczyli opuścić wygodny komisariat i zająć się prawdziwą pracą policyjną. - Sienkiewicz był już bardziej niż niezadowolony z miernych wyników komendanta, pod którego nadzorem sytuacja tylko się pogarszała. - Dopóki ten człowiek działa, pozostaje postacią, wokół której może skupić się opozycja. \n- Aha. I czego właściwie od nas oczekujecie, panie ministrze? Próbowaliśmy śledzić go przy każdej okazji. Z tego, co wiemy, nie robi nic podejrzanego. Jeśli już, to wygląda na człowieka, który naprawdę próbuje pomagać ludziom. \n- Zatem nie szukacie dostatecznie uważnie. - Po raz trzeci przejrzał dokumenty i zwrócił uwagę, że na kilkunastu stronach nie ma żadnych konkretnych, obciążających informacji. - Życie to nie bajka. Ludzie nie robią niczego z dobroci serca. Musi mieć ukryty cel, a waszym zadaniem jest go znaleźć. Jeśli nie zdołacie, przynajmniej sprawcie wrażenie, że knuje coś niegodziwego. Dla dobra Rzeczpospolitej musimy jak najszybciej usunąć go z ulic. A teraz do roboty. Wychodząc, zostawcie drzwi uchylone."
sandomierz.11.a: "Bezinteresowność bywa największą zbrodnią."

sandomierz.12.t: "Nareszcie pokój"
sandomierz.12.desc: "Wiesz, co zrobiłeś"
sandomierz.12.a: "Założę się, że nie naciśniesz przycisku"

sandomierz.13.t: "Rozrachunek z losem"
sandomierz.13.desc: "Po kolejnym wyczerpującym dniu pracy Bartłomiej Sienkiewicz był wreszcie gotów położyć się spać. Minione tygodnie dały mu w kość. Przywykł już do zwyczajnego zgiełku protestów zakłócających resztki odpoczynku, które udawało mu się wydrzeć nocy, lecz czuł, że działa właściwie na oparach. Wyczerpany zgasił lampkę nocną, zamknął oczy i rozmyślał o napiętym planie następnego dnia. Gdy myśli zaczęły odpływać, mógłby przysiąc, że znajoma melodia nieustannie rozbrzmiewa w jego głowie, powoli się zbliża i burzy spokój. Zirytowany ponownie zapalił światło i znieruchomiał ze zgrozy na widok stojącej przed nim postaci. \n\n- Bartłomieju, musimy porozmawiać. - Mężczyzna stojący u stóp łóżka przemówił tonem tak spokojnym i kojącym, że biła z niego władza dalece przewyższająca rzekomą pozycję. \n- Ty! Co tu robisz? J-jak? Osobiście dopilnowałem, żebyś siedział za kratami... - wyrzucił z siebie polityk. \n- Owszem. I wybaczam ci to. Nie dlatego jednak tu jestem. \n- W-więc dlaczego? \n- Oszukiwałeś, Bartłomieju. Nigdy nie miałeś dotrzeć tak daleko. \n- Oszukiwałem? O czym ty mówisz? Co tu się właściwie dzieje? - W głosie Sienkiewicza pojawiła się panika, gdy ksiądz ciągnął oskarżenie. \n- Majstrowałeś przy konsoli. Zobaczyłeś rzeczy, których nigdy nie powinieneś oglądać. Na swój sposób to imponujące, lecz nie możesz sprzeciwić się przeznaczonemu ci losowi. \n- A czym dokładnie miałby być ten los? - zapytał z rezygnacją. \n- Gdyby wszystko przebiegło zgodnie z zamysłem, nie zachowałbyś obecnego stanowiska. Tylko tyle wolno mi powiedzieć. Nie obawiaj się. Twoje błędy zostaną naprawione. \n- Słuchaj, nie możesz tego zrobić - błagał teatralnie. - Ja... dopiero zacząłem stawiać to miejsce na nogi. Wiem, że nie jest idealnie, ale wreszcie sytuacja się stabilizuje. Włożyłem w to tyle wysiłku, przeprowadziłem miasto przez wojnę, nawet... \n- A jednak oszukiwałeś. Przykro mi, lecz tak być musi. Ten odcinek i tak trwa już stanowczo za długo. Wkrótce spotkamy się ponownie, w zupełnie innych okolicznościach. \n\nPostać nadal stała nad Sienkiewiczem, a melodia powróciła, głośniejsza niż wcześniej. Zagłuszyła jego myśli. Przed oczami przemknęła mu długa lista nazwisk, aż wraz z triumfalnym wybrzmieniem ostatniej nuty wszystko znieruchomiało, gdy licznik dotarł do ostatniej sekundy."
sandomierz.13.a: "Pora włączyć następny odcinek."

sandomierz.31.t: "Środki nadzwyczajne"
sandomierz.31.desc: "Naradę kryzysową od początku przygotowano porządnie. Sienkiewicz przyjął to z ulgą. Ktoś wykazał się przezornością i przeanalizował sytuację, zanim gówno uderzyło w skałę, a on uważał to za najwyższy przejaw kompetencji, do jakiego zdolny był zwykły podwładny. Po kilku minutach wszystko najwyraźniej wypadło jednak z torów. \n- Niech pan posłucha, mówię tylko, że mamy dwa wyjścia. Możemy zejść do podziemnej sieci korytarzy i piwnic pod starym miastem, o której tylko my wiemy dzięki kontroli nad archiwum miejskim, i uciec przez miejsce, gdzie oni nie odważą się... \n- Albo? \n- Słucham? \n- Jak brzmi drugie wyjście? - zapytał Sienkiewicz znużonym głosem. - Nie zamierzam łazić po jakiejś ponurej podziemnej trasie turystycznej. Szczerze mówiąc, ten pomysł jest podejrzany w chuj. Naiwny. Wręcz prymitywny. Tylko kretyn mógłby wymyślić coś takiego. Albo mój pradziadek. Albo nerd. Albo... \n- Albo wywiozą nas z miasta na taczkach. \n- To nie jest wyjście. \n- Od początku nie było żadnego wyjścia, na Boga! Musimy uciekać! Natychmiast! \n\nJak na zawołanie z zewnątrz dobiegł rumor. Sienkiewicz uświadomił sobie, że już dawno powinien otrzymać meldunek od policji. Skoro nikt poza tym idiotą od lochów go nie poinformował, zaczął się niepokoić. \n- Może pan zadzwonić do komendanta... \n- Próbowałem przez ostatnią godzinę i nikt nie odebrał - odpowiedział stażysta, natychmiast unosząc dłoń, by uciszyć Sienkiewicza. - Właśnie miałem do tego przejść, tylko najpierw chciałem poruszyć najważniejszą kwestię, czyli... \n\nSądząc po wyraźnym odgłosie, gdzieś stłukła się szyba - wewnątrz budynku. Sienkiewicz westchnął i wstał z krzesła. \n- Naprawdę mają taczki? \n- T-tak. Ładne i duże. \n- Coś jeszcze? Widły? Siekiery? Kije bejsbolowe? \n- Chyba nie. Gdyby byli dość agresywni, żeby je zabrać, już dawno by tu weszli. Wygląda na to, że przynajmniej pod tym względem Mateusz dobrze ich wychował. \n- No dobrze - Sienkiewicz zapiął marynarkę. - Niech będą taczki. Przynajmniej łatwiej będzie wyjechać z miasta. Dojazd tutaj był koszmarem."
sandomierz.31.a: "Żegnajcie, frajerzy."

sandomierz.14.t: "Witaj w domu, Don Matteo"
sandomierz.14.desc: "Jeszcze niedawno Pasterz Sandomierza siedział na skromnym drewnianym krześle w plebanii przy kościele św. Jakuba. Teraz z fotela burmistrza w ratuszu stawiał pierwsze kroki w zarządzaniu państwem. Pocieszał się, że to tylko przeprowadzka z jednego dominikańskiego przybytku do drugiego. Jak się okazało, przekonać samego siebie jest trudniej niż całe miasto.\n\nNigdy nie zamierzał wspiąć się tak wysoko. Podszywanie się pod księdza z kultowego serialu również nie było jego pierwszym wyborem. Artur Żmijewski chciał jedynie pomagać ludziom, choć niewiele łączyło go z Sandomierzem. Gdyby wszystko zależało od niego, organizowałby akcje humanitarne i wypowiadał własne zdanie jako znany, lecz ostatecznie całkiem zwyczajny aktor. Pająki Sienkiewicza szybko by go jednak uciszyły, tak jak wcześniej wielu potencjalnych dysydentów. Aby zostawiono go w spokoju, potrzebował jeszcze wyższego poziomu sławy, a najlepiej również sakralnego błogosławieństwa. Nie po to, by nakarmić ego. Było to konieczne do przetrwania. Za zgodą biskupa Nitkiewicza Artur Żmijewski zniknął w cieniu, a Ojciec Mateusz Żmigrodzki zaczął wygłaszać kazania o potworności wojny i bandytyzmu, a w końcu również o korupcji władz. Gdy niezadowoleni mieszkańcy obalili wreszcie tyranię Sienkiewicza, wybrali właśnie jego - jedynego człowieka, który głośno wypowiadał myśli wszystkich - i niemal zanieśli go do ratusza na rękach. Nie zdążył jeszcze w pełni pojąć zawiłości prawdziwego kapłaństwa, a obywatele powierzyli mu misję zostania mężem stanu, a przynajmniej zagrania tej roli. Mieszkańcy Sandomierza w niego wierzyli. Musiał unieść ciężar ich marzeń i dać najlepszy występ swojego życia!"
sandomierz.14.a: "Światła! Kamera! Akcja!"

sandomierz.15.t: "Jeszcze jedna łyżka"
sandomierz.15.desc: "- Daj spokój, zostaw te pudła, bo nic dla nas nie zostanie - Grzegorz ponaglał kolegę.\n- Ej, w pracy trzeba dawać z siebie sto procent.\n- Ozdoba, my tylko sortujemy pudła w magazynie.\nGrzegorz zakpił z przyjaciela.\n- Zasady nadal obowiązują. Poza tym to nie tak, że zabraknie czegoś konkretnego - narzekał Sławek.\nNie leżało w jego naturze poleganie na innych. W idealnym świecie byłoby go stać na dość żywności dla siebie i rodziny.\n- Och, daruj sobie. Pamiętam, jak wczoraj obżerałeś się rosołem z państwowego przydziału - Grzegorz próbował uciąć dyskusję. - Nie bądź chujem i po prostu chodź ze mną.\n\nKiedy dotarli na miejsce, kolejka była już ogromna. Przez wysokie ceny żywności wielu sandomierzan musiało schować dumę do kieszeni.\n- Widzisz? - Podczas mozolnego oczekiwania Grzegorz wznowił dyskusję. - Nieważna jakość, liczy się ilość. I to, że rząd naprawdę troszczy się o szarego człowieka.\n- Tak się nie dba o ludzi. Gdyby ten \"Mateusz\" naprawdę się o nas troszczył, myślałby przyszłościowo i uruchomił porządny przemysł, żeby ludzie mogli zarabiać godne pieniądze. Wtedy kuchnie społeczne nie byłyby potrzebne - odparł Sławek.\n- To czemu nie wyjdziesz z kolejki? - Grzegorz zaczynał żałować, że ciągnął rozmowę z wiecznie niezadowolonym kolegą. - Sam fakt, że rozdaje biednym jałmużnę, dowodzi, że jest prawdziwy, a nie żaden aktor, jak próbują wam wmówić ci kucharze.\n- Uwierz mi, gdyby Apostołowie mądrzej wydawali pieniądze, nie byłbym tak zdesperowany - bronił się Sławek. - Zmusili mnie.\n- Dobra, dobra. - Grzegorz miał już dosyć tyrad Sławka. - Teraz bądź cicho. Zbliżamy się do kotłów. Jeszcze jedno słowo i odmówią ci porcji.\nPotrzebującym nalewała zupę sama Natalia Borowik. Grzegorz pokornie podziękował za posiłek. Sławek postanowił po raz ostatni zażartować kosztem gospodarzy.\n- Pani Natalio! Przy takim nazwisku spodziewałem się grzybowej!\nGospodyni długo mu się przyglądała, po czym bez słowa podała porcję.\nOstatecznie Sławek przełknął dumę razem z łyżką zupy. Mimo niechęci musiał przyznać, że smakowała całkiem dobrze."
sandomierz.15.a: "Tylko dlaczego smakuje jak wczorajszy rosół?"

sandomierz.16.t: "Tutaj kiedyś będzie fabryka"
sandomierz.16.desc: "Antoni Guzik spoglądał na pola Kamienia Łukawskiego. Oczami wyobraźni widział już odlewnie i fabryki gotowe wynieść to zadupie na wyższy poziom. Nadbereżny miał rację - to była żyła złota. Ten cały Mateusz wydawał się dość rozsądny, by nie wpaść w wojenny szał, gdy tylko pomogą mu rozruszać gospodarkę. Co więcej, Apostołowie najwyraźniej nie wiedzieli nic o przemyśle ani zarządzaniu, więc Guzik mógł wciskać im dowolny kit. A przynajmniej tak uważał planista przemysłowy.\n- Przepraszam pana. - Negocjator wysłany przez Ojca chciał wyrazić swoje wątpliwości... ponownie.\nBrak fachowej wiedzy nie przeszkadzał akolitom Mateusza w zamęczaniu Guzika gadaniem.\n- Tak tylko pomyślałem - ciągnął akolita - czy naprawdę musimy budować zakłady w Kamieniu? Mamy już coś w rodzaju dzielnicy przemysłowej w Zarzekowicach.\n- Mhm. Zarzekowice. - Planista musiał znosić te bzdury jeszcze tylko odrobinę dłużej. - Dzielnica nazwana tak dlatego, że leży *za rzeką*. Tuż pod nosem waszych wrogów. Nie sądziłem, że aż tak poświęcacie się dobroczynności, by oddawać przemysł sąsiedniemu watażce.\n- Tak tylko pomyślałem... - przedstawiciel Sandomierza odezwał się niepewnie - że realizacja projektu w wybranym przez pana miejscu zmusi wiele rodzin do przeprowadzki.\nTrudno. Myślałem, że pomoc potrzebującym to wasza specjalność. Co za różnica, jeśli dojdzie kilka rodzin?\n- Chyba nie mówi pan poważnie...\n- Owszem, mówię - przerwał Guzik. - To standardowa procedura. Jedna chałupa nie może zatrzymać budowy autostrady. Potem wypłaca się odszkodowanie. Proste. A teraz, jeśli to wszystko, chciałbym wrócić do kończenia planów.\nNa szczęście dla Guzika akolita wyszedł.\n- Nareszcie sobie poszedł - pomyślał planista. - Przynajmniej dopóki nie zapyta, gdzie będziemy wyrzucać odpady. Jak myślą, dlaczego chciałem mieć zakład tak blisko rzeki? Powinni się cieszyć, bo głównie zatrujemy wodę już poza granicami miasta.\nZostawszy sam, mógł dokończyć spis wszystkich gospodarstw i zamknąć dzień pracy. Kowalski, Ozdoba, Juszczuk... razem dziesięć domostw. Pora zaczynać przedstawienie."
sandomierz.16.a: "Czy ludzie będą mieli za co kupić chleb?"

sandomierz.17.t: "Pierwszy odcinek"
sandomierz.17.desc: "Mateusz siedział na plebanii i przeglądał gazety w poszukiwaniu przestępstw, którymi wkrótce będzie musiał się zająć. Tak jak prawdziwy Ojciec Mateusz powinien polegać na intuicji. Zadanie zapowiadało się niebezpiecznie, lecz było konieczne. Gdy ktoś myśli o jego serialu, najpierw przypomina sobie walkę z przestępczością. Nawet jeśli będzie w dużej mierze polegał na policji, nie uniknie osobistego zaangażowania.\nRozmyślania przerwało pukanie do drzwi.\nSam wstał, by otworzyć. W końcu Kinga Preis nie zamierzała tego za niego robić, mimo że odgrywała jego gospodynię. Najwyraźniej metoda Stanisławskiego nie była dla niej.\n- Szczęść Boże, ojcze. - Kobieta, której akcent zdradzał ukraińskie pochodzenie, przywitała Mateusza smutnym głosem. - Chciałabym urządzić pogrzeb męża.\n- Oczywiście. - Mateusz ukrył niepewność, zasłaniając usta w geście współczucia. - Proszę mówić.\n- Policja powiedziała, że to samobójstwo, ale to nie może być prawda. Mój Ołeksandr był dobrym chrześcijaninem. To znaczy... był. Nigdy by tego nie zrobił. Nie odebrałby sobie życia. Nie zostawiłby mnie. Nie odrzuciłby Bożego daru.\nNie była w stanie mówić dalej.\n- Wkrótce spróbuję zorganizować ceremonię. Porozmawiajmy jutro o szczegółach, dobrze? - Z powodu jego niedoświadczenia organizacją i tak zająłby się ktoś inny.\nSkinęła głową.\n- Z Bogiem - pożegnał ją Mateusz.\nPogrzeb pogrzebem, lecz miała rację: coś się nie zgadzało. Jej wiara była szczera. Skoro nie potrafiła uwierzyć, że mąż odebrał sobie życie, przed policją mogła zostać ukryta prawda.\nKtoś powinien się tym zająć. Tym kimś był Ojciec Mateusz.\n- Wygląda na to, że wkrótce zajmę się pierwszą sprawą.\nBiorąc wszystko pod uwagę, miał szczęście - jakkolwiek makabrycznie brzmiało to w tych okolicznościach. Zanim zmierzy się z poważniejszymi przestępstwami, takimi jak morderstwa i rozboje, dobrze będzie przyjąć sprawę, która choć tragiczna, wydaje się dla niego mniej niebezpieczna. W końcu będzie musiał zaryzykować życie, lecz miał nadzieję, że nastąpi to później niż wcześniej. Zapyta funkcjonariuszy, czy wiedzą coś o Ołeksandrze. Zacznie od sprawdzenia jego miejsca pracy.\nOdnajdując na razie nowy cel, Mateusz nie chciał marnować czasu. Wskoczył na rower i natychmiast postanowił wziąć sprawy w swoje ręce."
sandomierz.17.a: "*rozbrzmiewa muzyka Michała Lorenca*"

sandomierz.18.t: "Za mało informacji"
sandomierz.18.desc: "Negocjacje z pułkownikiem Grzegorzem Kobylarzem przebiegły zaskakująco łatwo. Kiedy jednak przyszło co do czego, stało się jasne, że zdecydowanie woli pracę w terenie od ministerialnej biurokracji. Polscy oficerowie od dawna przywykli do mniej lub bardziej kompetentnych cywilnych zwierzchników, więc wojskowy przyjął propozycję Mateusza, by na stanowisku ministra zastąpił go podinspektor Orest Możejko, znany również jako Piotr Polk. Paradoksalnie Mateusz spodziewał się większych problemów z komendantem miejscowej policji. Jak zawsze miał rację.\n\n- Chcecie, żebym ustąpił ze stanowiska komendanta powiatowego, panowie... To znaczy, proszę pana i ojcze? - Podinspektor Grzegorz Jaworski był przerażony propozycją Mateusza.\nOficjalna kontrola nad ministerstwem była jednym, lecz dla pełnej wiarygodności serialowy Orest Możejko musiał przejąć bezpośrednie dowództwo nad miejscową policją. Żmijewski i Polk spojrzeli sobie w oczy, spodziewając się najgorszego.\n- Rozumiem, że podinspektor jest ode mnie starszy stopniem - Jaworski dalej wyliczał wątpliwości. - Nie znalazłem jednak żadnych akt dotyczących pańskiego doświadczenia. Ani w Sandomierzu, ani nigdzie indziej.\n- Cóż - \"Możejko\" próbował się bronić - dokumentacja musiała spłonąć podczas Upadku.\n- Zrozumiałe - odpowiedział Jaworski. - Jaka była pańska specjalizacja?\n- Wydział kryminalny - odparł Polk dokładnie tak, jak kazał mu Mateusz podczas prób.\n- Tego się spodziewałem. Pytałem, który podwydział lubił pan najbardziej. Napady? Włamania? Może przestępstwa seksualne?\n- Eee... - Polk nie wiedział, co powiedzieć.\n- Może pokażesz podinspektorowi, co już zrobiłeś? - wtrącił się Mateusz, ratując kolegę. - Tak dla rozwiania obaw.\nTa informacja jeszcze bardziej zestresowała Jaworskiego.\n- No właśnie! - Możejko przypomniał sobie plan B. - Nie chciałem niczego zmieniać, dopóki nie poznam miejscowej specyfiki. Chciałem tylko sprawdzić, jak dobrze tutejsza policja zna musztrę. Za mną.\nCała trójka wyszła na dziedziniec, gdzie czekały trzy pododdziały w mundurach galowych oraz reprezentacyjna orkiestra policyjna. Kilkuminutowa musztra zakończyła się salwą honorową, a wszystkiemu towarzyszyła muzyka.\n- Cóż, musztra nie była niczym szczególnym, mogli bardziej się przyłożyć - ocenił Jaworski. Obaj aktorzy spodziewali się porażki. - Ale orkiestra dała występ życia! Ani jednego fałszywego dźwięku, rytm jak należy i tak dalej. Prawdę mówiąc, trochę przesadnie broniłem swojego małego posterunku, ale najwyraźniej wie pan, co robi. Nie pamiętam komendanta, który potrafiłby sprawić, żeby tych ludzi dało się słuchać.\nJaworski zasalutował.\n- To zaszczyt mieć pana w naszych szeregach. Powinienem był uwierzyć, że Ojciec Mateusz nie pozwoli policji się rozpaść.\nGdy Jaworski odszedł, Mateusz i Możejko odetchnęli z ulgą. Wykorzystanie wykształcenia muzycznego Polka było ich najlepszą szansą i wbrew wszystkiemu się udało.\n- Jak dotąd idzie dobrze - Mateusz próbował zachować optymizm."
sandomierz.18.a: "Inspektor Możejko musi się jeszcze wiele nauczyć"

sandomierz.19.t: "Bracia w jałmużnie"
sandomierz.19.desc: "Biskup Krzysztof Nitkiewicz czekał na plebanii przy bazylice katedralnej Narodzenia Najświętszej Maryi Panny.\nPróbował jak najwygodniej ułożyć się w ulubionym fotelu, oczekując gościa.\nNajważniejszego człowieka w Sandomierzu po Upadku.\nDomyślał się, czego Mateusz będzie od niego chciał, lecz nie ułatwiało to nadchodzącej rozmowy.\n- Już jest - biskup pomocniczy doktor Edward Marian Frankowski zapowiedział Ojca Mateusza, niepewny, jak zwracać się do władcy Sandomierza.\n- Dziękuję, wpuść go - polecił Nitkiewicz.\n\nNastępnie cała trójka usiadła razem w pokoju gościnnym i pogrążyła się w ciszy.\nPrzez kilka długich sekund nikt nie chciał rozpoczynać tej osobliwej rozmowy.\nPierwszy odezwał się Żmijewski.\n- Na początek chciałbym podziękować Waszym Ekscelencjom za to, że pozwolili mi bez przeszkód kontynuować misję. To bardzo wiele znaczy dla mnie i mieszkańców Sandomierza.\n- Była to kwestia konieczności - biskup Nitkiewicz odpowiedział na pochlebstwo znacznie ostrzejszym tonem. Lata kontaktów z Polską Radą Ekumeniczną nauczyły go negocjować i debatować bez podporządkowywania siebie ani własnych przekonań drugiej stronie. - Potrzebowaliśmy kogoś, kto obali skorumpowanego, bezbożnego Sienkiewicza bez naszego bezpośredniego udziału.\n- Oczywiście bardzo cenimy pańskie oddanie pomocy ubogim i walce z przestępczością - w przeciwieństwie do biskupa Nitkiewicza, specjalisty od prawa kanonicznego, biskup Frankowski znacznie bardziej zajmował się katolicką nauką społeczną dotyczącą pracy, dlatego był o wiele bardziej ugodowy wobec uzurpatora.\n- Proszę nam jednak odpowiedzieć, panie Żmijewski - ciągnął Nitkiewicz - dlaczego mielibyśmy zamienić antyteistę na świętokradcę?\n- Wasze Ekscelencje - zaczął Mateusz - nigdy nie chciałem przynieść wstydu Bogu, Kościołowi ani wiernym. Sam jestem praktykującym katolikiem. Nie wybrałem tej roli. Złożyła mi ją na barki zewnętrzna siła. Ludzie potrzebowali kogoś, w kogo mogliby uwierzyć, a ja zrozumiałem, że pod ukochaną postacią mogę uczynić znacznie więcej dobra. Ośmielę się powiedzieć, że mógł to być znak od Boga.\n- Gdyby tak było, Bóg poleciłby panu zostać prawdziwym księdzem - Nitkiewicz przerwał apologię Żmijewskiego. - Czy właśnie po to pan tu przyszedł?\n- Niezupełnie. Nie jestem gotowy na święcenia kapłańskie. Pokornie proszę jednak, by pozwolono mi wygłosić kazanie podczas następnej mszy.\nBiskup oniemiał wobec jego zuchwałości.\n- Powtarzam - bronił się Żmijewski - nie proszę z pychy, lecz dlatego, że ludzie tego ode mnie oczekują. To wola ludu uprawomocnia moją misję. Jak powiedział błogosławiony Alkuin: Vox populi, vox Dei.\nBiskupi stanęli przed nie lada dylematem.\nPrawdą było, że czyny Mateusza cieszyły się wśród ludzi wielką popularnością i przynosiły pożytek Świętemu Kościołowi. Od dawna msze nie przyciągały takich tłumów. Wierni od pewnego czasu przysyłali listy z pytaniami o terminy kazań Ojca Mateusza. A ponieważ hierarchowie nie potępili jego działalności na samym początku, sami znaleźli się już w sieci kłamstw Żmijewskiego.\nFrankowski spojrzał na Nitkiewicza. Nie musiał nic mówić. Wcześniej omówili już między sobą kwestię Żmigrodzkiego i przygotowali wiele wariantów działania na różne scenariusze, a biskup sandomierski znał poglądy swojego sufragana.\nNitkiewicz skinął głową.\n- Jesteśmy gotowi pozwolić panu wygłosić kazanie do wiernych. Do uczynienia tego wyjątku skłania nas większe dobro Kościoła oraz pańskie pozornie szlachetne zamiary - powiedział Frankowski, ośmielony aprobatą przełożonego.\n- Proszę jednak wiedzieć, że to jedynie rozwiązanie tymczasowe - Nitkiewicz chciał zachować ostatnie słowo. - Jeśli zamierza pan kontynuować tę nieoficjalną posługę, w przyszłości oczekujemy rozpoczęcia drogi ku święceniom.\nŻmijewski szeroko otworzył oczy.\n- Ależ, ojcze. Mam żonę.\n- Małżeństwem nie musi się pan martwić - ciągnął Nitkiewicz. - W wyjątkowych przypadkach można wystąpić o papieską dyspensę pozwalającą żonatym mężczyznom zostać księżmi. A pański przypadek jest niewątpliwie wyjątkowy.\n- To nie jest szantaż z naszej strony - Frankowski próbował złagodzić przekaz. Być może należało to zrobić. Żmijewski wydawał się dobrym człowiekiem, a żądanie wyraźnie nim wstrząsnęło. - Po prostu wraz ze wzrostem pańskiej popularności coraz więcej duchownych może zacząć zadawać pytania. Duchownych stojących wyżej od nas i mniej skłonnych do współpracy.\n- Rozumiem - odpowiedział Żmijewski. - Dziękuję Waszym Ekscelencjom za pomoc. Nie zawiodę.\n- Co my wyprawiamy, Edwardzie? - zapytał Nitkiewicz, gdy Ojciec Mateusz wyszedł.\n- Robimy to, co najlepsze dla Kościoła i wiernych. Cierpliwości, przyjacielu. Wkrótce te na poły bluźniercze wyjątki dobiegną końca, gdy Stolica Apostolska uzna Żmijewskiego za naszego brata."
sandomierz.19.a: "Misericordias Domini cantabo "

sandomierz.20.t: "Zielony poblask"
sandomierz.20.desc: "- Dzień dobry, witamy w kolejnym wydaniu Telewizji Prawdy - Sandomierz. Jedynej niezależnej telewizji regionalnej, która nie boi się mówić Prawdy, nieskrępowanej przez system i cenzurę. Ostatnio omówiliśmy dowody wskazujące, że na Bałutach nie doszło do żadnej eksplozji, a dzielnica pozostaje nienaruszona i w pełni nadaje się do zamieszkania.\nDziś chciałbym zająć się sprawą bliższą naszym domom. Tożsamością tak zwanego Ojca Mateusza. Redakcja omówiła temat i cała nasza dwójka doszła do wniosku, że samozwańczy Apostoł Chrystusa jest nikim innym jak aktorem Arturem Żmijewskim. Zacznijmy od nazwisk: Żmijewski i Żmigrodzki brzmią jak wyjątkowo leniwe oszustwo. To żart naszym kosztem. Gdy zajrzymy głębiej do archiwów kościelnych, odkryjemy, że żaden Mateusz Żmigrodzki nigdy nie otrzymał święceń ani nie przebywał w Sandomierzu. To samo dotyczy jego kolesiów podszywających się pod policjantów - w policyjnej bazie danych nie ma o nich ani słowa. Czy przed Upadkiem ktokolwiek widział któregoś z nich? Jeśli nadal nie jesteście przekonani, pokażę przedupadkowe zdjęcie Artura Żmijewskiego oraz fotografię Mateusza Żmigrodzkiego z wczorajszej lokalnej gazety. To bezsprzecznie ten sam człowiek. Wierzycie, że każda zagrana przez niego rola jest prawdziwa? W takim razie coś wam pokażę. Z góry przepraszam osoby o słabych nerwach. Oto kadr z filmu \"Psy\", na którym Radosław Wolf, grany przez Żmijewskiego, trzyma dwie odcięte głowy. To również wasz Ojciec? Czy tylko następna jego rola?\nDlaczego ktoś miałby urządzać taką farsę? Według mojej teorii to spisek mający przywrócić Sienkiewicza do władzy. Owszem, teraz \"Mateusz\" deklaruje, że chce pomagać ludziom, bo jest dobrym człowiekiem. Lecz dobrzy ludzie nie kłamią. Prawdopodobnie wkrótce spróbuje sabotować własne państwo, by odebrać mieszkańcom nadzieję. Wtedy Sienkiewicz wróci, ocali Sandomierz i będzie rządził ludźmi oszukanymi tak, by uwierzyli, że nie ma dla niego alternatywy.\nCo o tym sądzicie? Zajrzyjmy do komentarzy! Użytkownik 0restNocul pisze: \"Ty głupi grubasie, twoja idiotyczna teoria nie trzyma się kupy. Przecież Żmijewski nosi okulary, a Ojciec Mateusz nie\"..."
sandomierz.20.a: "Zablokuj użytkownika"

sandomierz.21.t: "Brak wiadomości to dobra wiadomość"
sandomierz.21.desc: "- Przybył w najmroczniejszej godzinie Sandomierza, obalił skorumpowanego przywódcę miasta i obiecał dobrobyt. Ojciec Mateusz to postać niezwykle kontrowersyjna. Wielu pyta, skąd się wziął, jaki ma cel i czy wraz ze swymi kolesiami nie manipuluje pobożnymi mieszkańcami dla własnych korzyści. Z Sandomierza Aleksandra Domańska.\nPalec Kingi Preis położył kres bluźnierstwom prezenterki.\n- Niewiarygodne! Po wszystkim, co zrobiłeś. Po wszystkim, co planujemy, oni nadal nas oczerniają!\n- Mają prawo do własnej opinii. Zresztą całkiem wyważonej.\n- Ta niejednoznaczność jest tylko na początku, żeby przyciągnąć obie strony. Potem zaczną przepychać swoją agendę.\nWbrew radom Mateusza Kinga \"Natalia Borowik\" Preis nadal oglądała kolejne wiadomości. \"Sam mnie w to wciągnąłeś, więc muszę wiedzieć, co o nas mówią\".\n- Myślisz, że robią to z własnej woli? - Natalia ciągnęła tyradę - To oczywiście pozostałość wpływów Sienkiewicza! Trzeba coś z tym zrobić!\n- Na przykład co? Wsadzić ich do więzienia? - zapytał spokojnie Mateusz - Sienkiewicza już nie ma. Może to po prostu szczera opinia ludzi. Może powinniśmy mocniej się postarać, żeby pokazać im prawdę o naszych zamiarach.\n- Ależ ty jesteś naiwny. Nic dziwnego, że dostałeś tę rolę - Natalia nie mogła sobie odmówić złośliwej odpowiedzi. - Uważam, że powinieneś wyprostować sytuację.\nMateusz spojrzał na nią z zaciekawieniem. Domyślał się odpowiedzi, lecz nie chciał niegrzecznie przerywać Natalii.\n- Masz do dyspozycji te same możliwości, których Sienkiewicz używał do wciskania ludziom całej tej papki. Możesz wykorzystać je w dobrym celu. Uruchomić całą kampanię, która obroni cię przed bezpodstawnymi oskarżeniami.\n- Kinga. Musimy dowieść, że nie jesteśmy tacy jak poprzedni reżim. Musimy coś zrobić z tym konglomeratem medialnym, ale podzielenie go i sprzedanie mniejszym redakcjom oraz stacjom telewizyjnym byłoby prawdziwym dowodem naszych szlachetnych zamiarów.\n- Przecież nie mówię, żebyśmy robili dokładnie to samo co Sienkiewicz. - Natalia uspokajała Żmijewskiego. - To tylko rozwiązanie tymczasowe. Najpierw usuniemy z eteru fałszywe informacje, a dopiero potem oddamy miejsce oszołomom i kłamcom.\n- Nie jestem przekonany.\n- Właśnie dlatego jesteś odpowiednim człowiekiem do takiego działania. Będziesz wiedział, kiedy te środki przestaną być potrzebne, i wtedy rozmontujesz maszynę. Jaka jest alternatywa? Zostawić samym sobie ludzi, którzy nie wiedzą już, co jest prawdą? - Natalia musiała przerwać, by znaleźć określenie, które lepiej przemówi do myślącego abstrakcyjnie idealisty. - Czy pasterz nie powinien prowadzić owiec? Czy ma pozwolić im zejść z drogi?"
sandomierz.21.a: "Jestem ich pasterzem"
sandomierz.21.b: "Prawda was wyzwoli"

sandomierz.22.t: "Pierwsze kazanie"
sandomierz.22.desc: "- Kiedy więc dajesz jałmużnę, nie trąb przed sobą, jak obłudnicy czynią w synagogach i na ulicach, aby ich ludzie chwalili. Zaprawdę powiadam wam: otrzymali już swoją nagrodę.\nKiedy zaś ty dajesz jałmużnę, niech nie wie lewa twoja ręka, co czyni prawa,\naby twoja jałmużna pozostała w ukryciu. A Ojciec twój, który widzi w ukryciu, odda tobie.\nOto słowo Pańskie.\n- Chwała Tobie, Chryste - odpowiedzieli wierni, liczniejsi niż kiedykolwiek wcześniej w kościele św. Jakuba.\n- Dziś odwiedza nas szczególny gość - oznajmił ojciec Dominik Krysztof. - Często pytaliście, kiedy wygłosi własne kazanie. Tego człowieka nie trzeba było dalej przedstawiać. Ojciec Mateusz podszedł do ambony. Jak zawsze zdenerwowany. Próbował wmówić sobie, że to tylko kolejna sztuka teatralna.\n- Bracia i siostry, żyjemy w czasach wielkiego zamętu, otoczeni przez licznych wrogów, i płoniemy ogniem zemsty. Musimy jednak pamiętać, że Chrystus Pan powiedział nam, byśmy nie żądali oka za oko, lecz nadstawiali drugi policzek. Pamiętajcie, że miłowanie bliźniego jak siebie samego jest drugim największym przykazaniem, ustępującym jedynie przykazaniu miłowania Boga całym sercem. Mądrzy są ci, którzy kroczą drogą miłosierdzia i dobroczynności. Takie przesłanie kieruję do ludzi, którym trudno jest kochać swoich nieprzyjaciół.\nTych, którzy pomagają zarówno wrogom, jak i przyjaciołom, proszę, by nie uginali się pod ciężarem pychy. Dobroczynność nie może wynikać z pragnienia uznania ani zdobycia popularności. Nie możemy traktować bliźnich jako środka do celu. Pomagajcie w ukryciu, wyłącznie z dobroci serca.\nW średniowieczu kronikarze i pisarze wymazywali własne imiona z historii. Papieże od stuleci ukrywają je pod czcigodnymi imionami patronów. Nie znamy nawet autorów Ewangelii. Ewangelii według Mateusza, Marka, Łukasza i Jana prawdopodobnie nie spisali sami Apostołowie, lecz ich uczniowie, pragnący uczcić nauki mistrzów. Wszystko dla większej chwały Boga oraz idei, którą chcieli szerzyć. Można powiedzieć, że nosili maski. Zapamiętajcie kolejną naukę: nie osądzajcie ludzi po tym, co widoczne na zewnątrz. Czasem rzeczy nie są tym, czym się wydają. Tylko Bóg i oni sami znają prawdę. Spragnieni sławy mogą w istocie być pokorni. Ci, którzy zdają się wysuwać siebie na pierwszy plan, mogli naprawdę poświęcić własną tożsamość. Nie sądźcie, abyście i wy nie byli sądzeni.\nMateusz zamilkł, niepewny, co zrobić dalej. Spojrzał na akolitę. Chłopiec uniósł dłoń w pomocnym geście.\n- Myślę, że to właściwa chwila, by powstać i wyznać naszą wiarę."
sandomierz.22.a: "Wierzę w Boga, Ojca Wszechmogącego"

sandomierz.23.t: "Odpoczynek od przebrania"
sandomierz.23.desc: "Opiekun Sandomierza przechodził trudne chwile. Nieustanne podtrzymywanie iluzji, presja związana z drugą tożsamością, która miała uspokajać masy... Wszystko to męczyło równie mocno jak pierwszego dnia. Tak długo odgrywał postać, że zatęsknił za możliwością bycia po prostu sobą. Siódmego dnia Ojciec Mateusz odpoczął. Z ulgą zdjął znoszoną czarną sutannę i włożył zwykłe cywilne ubranie. Nie było to doskonałe przebranie, lecz uznał, że musi wystarczyć. Cel podróży - lekko wzniesione Góry Pieprzowe, z których roztaczał się dobry widok na miasto - nie należał do miejsc szczególnie uczęszczanych, więc dość łatwo mógł uniknąć rozpoznania. Z tym planem Artur wymknął się tylnym wyjściem z plebanii i ruszył dalej na wiernym starym rowerze - również będącym głównie rekwizytem. \n\nJazda okazała się zaskakująco spokojna. Choć brak kondycji sprawił mu zawód, Artur dotarł na \"szczyt\" w około dwadzieścia minut. Po raz pierwszy od dawna, przejeżdżając przez bardziej podejrzane wschodnie części miasta, nie czuł zagrożenia ani potrzeby omijania szczególnie rozwścieczonych tłumów. Było w tym coś niemal oczyszczającego. Siedząc na ciepłym, kojącym wzgórzu Gór Pieprzowych, aktor wreszcie zaznał spokoju i wygrzewał się w południowym słońcu. \n\n- Całkiem ładna dziś pogoda, prawda? - Za jego plecami odezwał się głos kobiety w średnim wieku. Odwrócił się. \n- Co? Och... tak, zdecydowanie. Idealna na taką wycieczkę - odparł Artur, zaskoczony nagłym towarzystwem. \n- Prawda. Rzadko tu przychodzę, ale dziś... Chwileczkę, chyba skądś pana kojarzę. To pan jest tym aktorem... eee... Żmijewskim, prawda? \n- Zgadza się. Może zabrzmi to dziwnie, ale naprawdę nie spodziewałem się, że ktoś mnie rozpozna. Przynajmniej nie dzisiaj. \n- Och, proszę pana, zrobił pan dla Sandomierza chyba więcej niż większość tutejszych władz. Jest pan właściwie naszym miejscowym bohaterem. Do tego stopnia, że teraz biega tu nawet pański naśladowca. Twierdzi, że jakimś sposobem naprawdę jest Ojcem Mateuszem. \n- A pani mu wierzy? \n- Może tak, może nie. Ostatnio zdarzały się dziwniejsze rzeczy. Na razie dobrze sobie radzi, a tylko to naprawdę mnie obchodzi. Nie będę za wszelką cenę dowodzić, czy jest oszustem. \n- Czyli... nie przeszkadza pani ta niewiedza? \n- Niekoniecznie. Ale pan zdecydowanie powinien go poznać. Proszę sobie wyobrazić tę scenę: aktor i postać w jednym pokoju. \n- Eee... to z pewnością byłoby coś. Dopiszę... to spotkanie do kalendarza."
sandomierz.23.a: "Kiedyś będą musieli się dowiedzieć, prawda?"

sandomierz.24.t: "Taktyka humanitarna"
sandomierz.24.desc: "Czasem konfliktu nie można uniknąć. Nawet jeśli nie chcesz grać, dopóki siedzisz przy stole, przeciwnik i tak wykona swój ruch. \n\nPlansza była gotowa. Ojciec Mateusz czekał cierpliwie na nadchodzące zagrożenie. Nie chciał ruszać figur bez wyraźnej przyczyny. Moralny obowiązek nie pozwalał mu odgrywać roli agresora. Dlatego czarne pasowały do niego - zarówno tutaj, jak i w życiu. Lecz nawet oddany rzecznik pokoju musi czasem bronić siebie oraz tych, którzy nie potrafią obronić się sami. \n\nPrzeciwnik rozwijał pozycję. Atak był trochę chaotyczny i pospieszny, lecz nadal wyglądał o wiele skuteczniej niż wszystko, co robił ksiądz. Mimo narastającej presji Ojciec Mateusz zadowalał się przesuwaniem skoczków tam i z powrotem. Szybko tracił teren, zepchnięty na własną połowę szachownicy. A gdy wróg zapuścił się dostatecznie głęboko... \n\nWystarczyło kilka ruchów, by wszystko się skończyło. Po serii prostych błędów przeciwnika ksiądz bez odpowiedzi zdobył trzy figury. A kiedy inicjatywa przeszła na jego stronę, spokojnie wycofał skoczki na pozycje wyjściowe, jakby nigdy ich nie ruszał. W jego działaniu nie było żądzy krwi ani potrzeby zwycięstwa za wszelką cenę. Dla Ojca Mateusza konflikt stanowił jedynie ponurą konieczność, dlatego nie zamierzał zadawać cierpienia większego niż absolutne minimum. \n\nDziałał z najwyższą ostrożnością i unikał zbędnych wymian, nawet jeśli mogło to postawić go w gorszej sytuacji. Partia przeciągała się do bólu, a ksiądz powoli umacniał pozycję. Minęła godzina, potem następna, aż w końcu... \n\n- Goniec na C2. Zdaje się, że to mat. Dobra partia, Orest. \n- Taa, prawie cię miałem. Któregoś dnia to otwarcie obróci się przeciw tobie. \n\nTaka jest natura gambitu sandomierskiego - zwyciężyć samą biernością, niczym niewzruszona skała przyjmująca całą siłę rozbijających się o nią fal. Na wojnie oznacza to pozwolić, by siły wroga rozpadły się na twoich oczach, i ograniczyć szkody mimowolnie niesione przez wichry konfliktu. Jeżeli Polski nie można poskładać pokojem, Mateusz uczyni wszystko, co w jego mocy, aby żar wojny pozostawił na ziemi narodu jak najmniej martwych ofiar."
sandomierz.24.a: "To co, rewanż, inspektorze?"

sandomierz.25.t: "Droga na Golgotę"
sandomierz.25.desc: "Zdenerwowana czwórka doradców tłoczyła się przed starym laptopem. Ekran, przez którego prawą część biegła na całej wysokości dwumilimetrowa linia martwych pikseli, od czasu do czasu migotał, gdy urządzenie z trudem próbowało się uruchomić. \n\n- Mówiłem, żeby nie ogłaszać pielgrzymki przed zakończeniem planowania. I zobacz, w co nas wpakowałeś, Paweł. \n\nZa oknem rozbrzmiewały hymny wpadające do plebanii przez uchylone okno. Setki ludzi cierpliwie czekały na wymarsz. \n\n- Co właściwie miałeś w głowie, kiedy powiedziałeś, że zacznie się \"natychmiast, bez zwłoki\"? NAPRAWDĘ nie przewidziałeś konsekwencji? \n- Słuchaj, przepraszam, dobrze? Po prostu... wybierzmy największy kościół albo coś takiego, a resztę zaimprowizujemy. \n- Taa. Łatwiej powiedzieć, niż zrobić. Praktycznie niczego tam nie ma poza starymi fabrykami STAR-a. Powodzenia w tłumaczeniu wszystkim, że przekraczamy granicę tylko po to, by obejrzeć kilka świątyń mniejszych od tych, które mamy u siebie. Może jeszcze parę ołtarzy, jeśli trafimy na jakieś po drodze. \n- Poczekaj, daj mi spojrzeć. Na pewno coś się znajdzie... \n\nZ bolesną powolnością Paweł przeciągał kursor po mapie i przybliżał każdą niepozorną wieś na trasie. Dziurów... nic. Rzepin... nic. Cierpliwość tracili nawet najbardziej wyrozumiali uczestnicy narady. Jabłonna... nic. Kałków... chwileczkę... czy to... \n\nGrupa z niedowierzaniem wpatrywała się w lekko rozpikselowany obraz. Trzypiętrowa budowla w kształcie zigguratu, zwieńczona wielkim krzyżem i oblepiona nierównymi rzędami tarcz, stała naprzeciw marnej repliki samolotu, który rozbił się pod Smoleńskiem w 2010 roku. Przez fałszywe okno wyglądało zdjęcie prezydenta, który zginął w katastrofie. Tuż obok znajdowały się wyrzeźbione sceny przedstawiające pierwotną drogę krzyżową, a cały chaotyczny obraz nosił tytuł \"Golgota Polska\". \n\n- Powiedz, że naprawdę o tym nie myślisz. \n- Znajdź mi lepszą możliwość, Marcin. Wiesz, że nie potrafisz. Sam powiedziałeś: w Starachowicach nie ma nic do oglądania. A temu miejscu nie odmówisz jednego - zapada w pamięć. \n- Jeśli już, to aż za bardzo. To miała być podróż duchowa, a nie wiejski odpust. \n- Nie, Marcin. To przede wszystkim zagrywka polityczna. I jeśli odwiedzenie tej parodii naszej wiary zwiększy gotowość komuchów z północy, żeby nas wpuścić, to niech mnie diabli - idziemy do smoleńskiego zigguratu i przez całą drogę będziemy śpiewać na jego cześć. Powiedz kapelanowi: nadkładamy drogi."
sandomierz.25.a: "Takiego przeżycia doświadcza się raz w życiu."

sandomierz.32.t: "Cel podróży osiągnięty"
sandomierz.32.desc: "Maszerowali cały dzień i znużeni szykowali się do nocnego odpoczynku. Bez względu na liczbę przebytych kroków nieustanne hymny oraz ogólna atmosfera nabożeństwa zdawały się nieść ich naprzód. Granica była tuż-tuż. Choć słabo bronionej linii strzegł niewielki garnizon Starachowic, pielgrzymi zamierzali wytrwale iść do celu i rozbić obóz dopiero po drugiej stronie. Gdy pochód się zbliżał, żołnierz mocno ściskał karabin, niepewny dokładnego znaczenia rozkazów. Wiedział, jakie konsekwencje przyniesie każda z możliwych decyzji. Po krótkiej rozmowie telefonicznej jego przełożony wyszedł ze strażnicy. Pielgrzymów należało przepuścić z odpowiednią eskortą, a później odesłać z powrotem za granicę."
sandomierz.32.a: "Niech koniecznie przywiozą nam pocztówki!"

starachowice.38.t: "Ostry zwrot z powrotem"
starachowice.38.desc: "Maszerowali cały dzień i znużeni szykowali się do nocnego odpoczynku. Bez względu na liczbę przebytych kroków nieustanne hymny oraz ogólna atmosfera nabożeństwa zdawały się nieść ich naprzód. Granica była tuż-tuż. Choć słabo bronionej linii strzegł niewielki garnizon Starachowic, pielgrzymi zamierzali wytrwale iść do celu i rozbić obóz dopiero po drugiej stronie. Gdy pochód się zbliżał, żołnierz mocno ściskał karabin, niepewny dokładnego znaczenia rozkazów. Wiedział, jakie konsekwencje przyniesie każda z możliwych decyzji. Po krótkiej rozmowie telefonicznej jego przełożony wyszedł ze strażnicy. Pielgrzymów należało natychmiast zawrócić. Jeśli o niego chodziło, mogli maszerować całą drogę z powrotem do Sandomierza."
starachowice.38.a: "W drodze powrotnej hymny brzmiały znacznie ciszej."

sandomierz.26.t: "Jabłko grzechu"
sandomierz.26.desc: "Jak każdy przywódca wart swego stanowiska Kelthuz zniknął na długo przed tym, nim którykolwiek wróg zdołał go zobaczyć. Naturalnie w krótkiej perspektywie utrudniło to sytuację jego ludzi, lecz w dłuższej mogło okazać się znacznie bardziej obiecujące. W Polsce nic nie wydawało się naprawdę stabilne, a rządy Sandomierza nie stanowiły wyjątku. \n\nSandomierscy urzędnicy nie wierzyli, że wysyłanie szpiegów do sąsiednich watażków na cokolwiek się zda, więc skupili poszukiwania wewnątrz kraju. Wydrukowano mnóstwo plakatów i rozwieszono je nawet w najmarniejszych wsiach. Niestety większość ludzi nigdy osobiście nie widziała Kelthuza. Miejscowi, mający jedynie mgliste pojęcie, że wydanie pewnego długowłosego mężczyzny może przynieść fortunę, zgłosili od cholery ukrywających się byłych bojowników Waffen-$$$$, którzy nadal starannie naśladowali wygląd wodza. Samo w sobie okazało się to użyteczne, lecz ani trochę nie zbliżyło władz do znalezienia celu. \n\nW końcu nastąpił przełom. Wśród całej niepewności ktoś puścił opowieść, że Kelthuz ukrywa się w górach niczym prawdziwy bohater ludowy - podobny dawnym zbójnikom i rozbójnikom - pomaga potrzebującym oraz walczy z klerykalnymi najeźdźcami. Ktokolwiek to wymyślił (żaden z sandomierzan nie chciał przypisać sobie zasługi), idealnie trafił w czuły punkt. Niemal wszyscy weterani Kelthuza wystąpili i oznajmili, że to stek bzdur, a ich wódz nigdy nie upadłby tak nisko, by zajmować się jakąś przyziemną, redystrybucyjną dobroczynnością. Wobec braku jakiegokolwiek śladu dawnego przywódcy zaprzeczenia ogromnie pomogły zbagatelizować problem miejsca jego pobytu. Owszem, od czasu do czasu donoszono o kradzieży kur albo innych drobiazgów, a plotki nie słabły. Jednak z każdym kolejnym tygodniem zdarzenia coraz bardziej stawały się memem niż przedmiotem prawdziwej wiary. Nikt naprawdę nie sądził, że sporadyczne przestępstwa są dziełem Człowieka z Krainy Żelaza..."
sandomierz.26.a: "A może jednak?"

sandomierz.27.t: "Kaina i Antenora - wydarzenie"
sandomierz.27.desc: "opis opis"
sandomierz.27.a: "guzik!"

sandomierz.28.t: "Rozbite marzenia"
sandomierz.28.desc: "To, co od początku wydawało się mało prawdopodobne, doczekało się nieuniknionego końca. Sojusz Sandomierza i Starachowic mógł okazać się użyteczny w odpieraniu watażków ziemi świętokrzyskiej, lecz ogromne różnice ideologiczne doprowadziły do całkowitego zerwania współpracy. Dawni bracia broni spoglądają teraz na siebie z nieufnością, niepewni, kto pierwszy pociągnie za spust. Droga pokojowego zjednoczenia została nieodwracalnie przekreślona, pozostawiając wojnę jako jedyną możliwość. Województwo wkrótce zapewne zostanie zjednoczone. Nie wiadomo jedynie, czy za jego jedność będzie musiało zginąć kilkudziesięciu ludzi, czy wiele tysięcy."
sandomierz.28.a: "Sprawa jak wiele innych"

sandomierz.29.t: "Zamknąć burzę z powrotem w butelce - wydarzenie"
sandomierz.29.desc: "opis opis"
sandomierz.29.a: "guzik!"

sandomierz.30.t: "Merkury - wydarzenie"
sandomierz.30.desc: "opis opis"
sandomierz.30.a: "guzik!"

sandomierz.33.t: "Szczyt zdrowego rozsądku"
sandomierz.33.desc: "Spotkanie zaplanowano w cichym pokoju z oknami wychodzącymi na las. Materek kazał wynieść biurko i pozostawił tylko dwa wygodne fotele oraz mały stolik z herbatą, kawą i talerzem ciastek. Krzyża wiszącego nad drzwiami od dawna nikt nie dotykał, co rodziło drobny dylemat: wytrzeć kurz, sugerując tym samym, że zawisł wyłącznie na tę okazję, czy zostawić go w obecnym stanie, jakby nie otaczano go należnym szacunkiem. Gdy Materek rozważał możliwości, przybycie gościa zupełnie go zaskoczyło. Bez żadnej zapowiedzi poza kilkoma delikatnymi puknięciami Mateusz wszedł sam do pokoju i uścisnął dłoń gospodarza. \n\n- Niech będzie pochwalony Jezus Chrystus. Proszę usiąść, ojcze. \nMateusz usiadł w fotelu i złożył dłonie. \n- Może zaczniemy modlitwą, ojcze? - zapytał Materek, nieco oszołomiony tym onirycznym widokiem gwiazdy telewizji, która siedziała przed nim, by rozmawiać o sprawach życia i śmierci. \n- Och, dajmy spokój, nie trzeba - odpowiedział Mateusz. - Jeśli pan tego potrzebuje, proszę się pomodlić. Może jednak najpierw załatwmy to, co mamy do zrobienia. \nMaterek od razu uznał się za naiwnego, skoro sądził, że ma do czynienia z prawdziwym człowiekiem Kościoła. Z drugiej strony czy naprawdę mógł mieć pewność? Na południu dzieją się jakieś naprawdę dziwne rzeczy, a według plotek na północy również. \n- Przyszedłem do pana, bo jest pan jedynym rozsądnym człowiekiem w regionie. Może nie jedynym, lecz jedynym, z którym możemy się dogadać. Albo trzymamy się razem, albo toniemy osobno. Tyle. \n- To dla mnie zaszczyt, że tak ojciec o mnie myśli - Materek powoli skinął głową - ale jeśli mamy się porozumieć, zapytam wprost: co z tego dostaniemy? \n- Jesteście i pozostaniecie głównym ośrodkiem przemysłowym regionu. Nasze północne i wschodnie granice są bezpieczne, więc to dogodna pozycja. A przede wszystkim jesteśmy tu dla ludzi. To się liczy. Działamy chyba w najbardziej spustoszonym wojną regionie całej Polski. Wszyscy mają już dosyć ekstremistów. Chcą nadziei. Normalnego życia. A my jesteśmy normalni. Na tyle, na ile normalny może być facet przebierający się za księdza, ale na skali normalności i tak plasuje się to całkiem wysoko. \n- Z tym mogę się zgodzić. Co jednak konkretnie ojciec proponuje? \nMateusz zastanawiał się przez chwilę. \n- Powiedzmy... pakt o nieagresji. Powinniśmy wymienić wysłanników. Ambasadorów, jeśli pan woli. Gdy coś pójdzie źle, łatwiej będzie współpracować. Wy zatrzymacie ich na północy, my nadejdziemy ze wschodu, i odwrotnie. W międzyczasie zyskacie miejsce do handlu. Przez przyjazne terytorium uzyskacie dostęp do Wisły. \n- Zgoda - Materek skinął głową. - Oboje możemy na tym skorzystać. \n- To było dość oczywiste. - Mateusz wstał z fotela i wyciągnął dłoń. - Jest tylko jeden dodatkowy warunek..."
sandomierz.33.a: "Dla opinii publicznej rozmawiał pan z księdzem."

sandomierz.35.t: "Cena sumienia"
sandomierz.35.desc: "Z ciężkim sercem przemierzał kolejne piętra szpitala. Wszystkie korytarze wyglądały podobnie - sterylnie białe albo przygaszone, wilgotnożółte. W niektórych salach pacjenci zwijali się z bólu, w innych bliscy wylewali bezradne łzy smutku. On także był bezradny, niezdolny ulżyć cierpiącym. Słowa wydawały się puste, a modlitwy pełne fałszywej obietnicy - niewinnym kłamstwem, że być może dzięki Bożej opatrzności wszystko w końcu się ułoży. Dwóch lekarzy przebiegło obok niego do kolejnego nagłego zatrzymania krążenia. Jeden dopiero co skończył studia. Był przerażony. Zrobili wszystko, co mogli, ale nie było już nadziei. Dziesięć minut później mężczyzna nie żył - bezwładne ciało na zimnej, twardej podłodze. Po kilku następnych rozpaczliwych uciśnięciach lekarz opadł wyczerpany i pogodzony z porażką. Śmierć zawsze jest częścią tej pracy. Człowiek mimowolnie bierze ją pod uwagę, wybierając zawód, lecz zupełnie czym innym jest naprawdę stracić kogoś na własnych oczach i wiedzieć, że osobiście nie zdołało się go ocalić. W innych okolicznościach pacjent może by przeżył. Lepszy sprzęt pozwoliłby wykryć skrzeplinę, która zatkała jego lewą tętnicę wieńcową. Można było leczyć migotanie przedsionków. Można było wszczepić stenty i utrzymać drożność naczynia. Tyle żalu. Tyle tragedii, którym dało się zapobiec. A on... on czuł się winny każdej z nich. \n\nOjciec Mateusz ponownie przemierzał te same korytarze, wracając po własnych śladach. A może były inne? Z trudem je rozróżniał. W każdym mieszkał ten sam rodzaj cierpienia. W Sandomierzu tak wiele było nie tak, tak wiele należało jeszcze naprawić, lecz to miejsce wydawało się najgorsze ze wszystkich. Sięgnął do kieszeni. Pusta. Podobnie jak miejska kasa - w środku nie było po prostu nic. Niczego, czym można złagodzić ból. Żadnych pieniędzy, które dałoby się rzucić na problem, by zniknął. Nie potrafił jednak tylko patrzeć. Nie mógł ciągle tu wracać wyłącznie ze słowami współczucia i zachowywać spokoju, patrząc w błagające oczy dziesiątek nowych pacjentów. Wiedział, że jeśli nic się nie zmieni, za dzień, tydzień, może miesiąc przy odrobinie szczęścia, kryjące się w nich ciepło i życie ustąpi pustemu spojrzeniu skierowanemu w zaświaty. Szukał dalej. Jedna moneta. Jedna dla gasnących w szpitalnych łóżkach. Jedna dla tych, których nieszczęśliwe wybory życiowe doprowadziły do zamarzania na ławce w chłodnym nocnym powietrzu, gdzie liczą, że następny oddech nie będzie ostatnim. Jedna moneta, by zapobiec tragedii. Miażdżący dług, którym trzeba zapłacić za całe cierpienie świata. Czy koszt właściwego postępowania okaże się zbyt wysoki, by go przyjąć?"
sandomierz.35.a: "Zatroszczymy się o chorych."
sandomierz.35.b: "Nikogo nie pozostawimy samemu sobie."
sandomierz.35.c: "Bez względu na koszt zrobimy jedno i drugie."

sandomierz.37.t: "Stara postać, nowa rola"
sandomierz.37.desc: "Wynik zaplanowanego spotkania z kierownikiem produkcji był w większości do przewidzenia, lecz i tak mocno uderzył w morale. Kolejne opóźnienie, tym razem o trzy tygodnie... przynajmniej według wstępnych szacunków. Podobno do końca wojny nie wolno niczego kręcić - rozkaz p.o. ministra, bez możliwości negocjacji. Dzięki hojnym dotacjom obsada nadal mogła liczyć na takie same zarobki jak podczas pracy na planie, lecz przymus bezcelowego snucia się przez następny bliżej nieokreślony czas wyraźnie wszystkich przygnębiał. Artur mógł przynajmniej zabijać czas, nie wychodząc z roli podczas codziennych spacerów po Parku Miejskim. Zakładał czarną sutannę pożyczoną z planu na czas nieokreślony i ćwiczył kwestie, które po wznowieniu zdjęć miał nadzieję w końcu wypowiedzieć przed kamerami. \n\nPubliczne wystąpienia od dawna przyciągały do Artura uwagę, dlatego zawsze nosił długopis na wypadek prośby o autograf. Z czasem jednak coraz częściej słyszał niepokój w głosach zwracających się do niego ludzi. Każdego trapił własny, wyjątkowy problem. \n\nGdy potrzebował odpocząć od zainteresowania, aktor chronił się przy filiżance ciepłej herbaty w zwykle pustej plebanii - właściwie jedynym miejscu w mieście, gdzie potrafił zebrać myśli. Nie dało się ukryć, że tęsknił za domem. Był biernym obserwatorem, który nie mógł zrobić nic poza czekaniem na poprawę sytuacji. Tak pogrążył się w rozmyślaniach, że prawie nie usłyszał nieśmiałych puknięć poprzedzających wejście niespodziewanego gościa. \n\n- Ojcze! Bogu dzięki, że ojca tu znalazłam. Ojcze Mateuszu, na zewnątrz panuje chaos! Ostatnio przez to wszystko nie mogę zmrużyć oka. Mój syn walczy gdzieś za nasze miasto, sama ledwo daję sobie radę z domem... A Mirek, mój mąż, w zeszły piątek został napadnięty. Wyobraża sobie ojciec? Chaos, mówię. Czy może ojciec coś z tym zrobić? \n- Eee, z pewnością mogę zgłosić sprawę władzom. Jestem pewien, że znajdą... - zaczął zaskoczony Artur. \n- Nie, nie. Myśli ojciec, że już nie próbowałam? Powiedzieli, że najpierw muszę czekać na swoją kolej. Sami oszuści. Bezużyteczni, skorumpowani oszuści. Nie zdziwiłabym się, gdyby w tym siedzieli. Ojciec jest moją jedyną nadzieją. \n- Proszę pani, czego dokładnie pani ode mnie w takim razie oczekuje? Chciałbym pomóc, lecz jestem tylko... \n- Och, ojcze, gdyby tylko udało się ustalić, kto to zrobił. Ojcu i temu inspektorowi... Moż... jak on miał na nazwisko... Zresztą nieważne. Byłabym dozgonnie wdzięczna. Dla kogoś takiego jak ojciec to z pewnością żaden problem. Proszę, czy pomoże ojciec biednej starszej kobiecie? \n- Mogę... popytać, jeśli przyniesie to pani odrobinę spokoju. \n- Och, dziękuję, ojcze. Nie będę już przeszkadzać. Z pewnością jest ojciec bardzo zajęty wszystkimi pozostałymi, którzy czekają w kolejce po pomoc. \n- Pozostałymi? \n- Chyba... wspomniałam kilku osobom, że tu przychodzę. Z góry przepraszam..."
sandomierz.37.a: "Po zmroku kolejka nieco się przerzedziła, by następnego dnia powrócić."

sandomierz.38.t: "Zwykli ludzie"
sandomierz.38.desc: "opis opis"
sandomierz.38.a: "guzik!"

 
 ###   News Events   ###

unification.124.t: "[GetNewspaper]Apostołowie Chrystusa jednoczą ziemię świętokrzyską!"
unification.124.desc: "W rozdartej wojną Polsce symbole zyskały nową siłę - bez względu na to, czy są przedmiotami, ideami czy... ludźmi. Senny Sandomierz skrywa jeden z takich przykładów, być może potężniejszy od wszystkich pozostałych. Pewnego niepozornego dnia mieszkańcy zgromadzili się na rynku, by ujrzeć coś niewyobrażalnego: ukochaną ikonę miasta, Ojca Mateusza, żywego i z krwi i kości. Zjednoczył ludzi przesłaniem katolickiego humanitaryzmu i pokojowo przejął władzę w Sandomierzu. Następnie głosił harmonię oraz wolność kolejnym społecznościom regionu, aż całe województwo ogłosiło wierność kaznodziei. Prawdziwa tożsamość przywódcy pozostaje tajemnicą, a wokół jego rzeczywistych zamiarów krążą liczne plotki o różnej wiarygodności. Być może jednak cuda naprawdę się zdarzają, a to nie zwykły aktor, lecz prawdziwa postać, która ożyła."
unification.124.a: "Pan błogosławi swoją trzodę."

super.124.t: "[GetNewspaper]Polska zjednoczona pod sztandarem [FROM.GetName]!"
super.124.desc: "Minęły lata od upadku Polski jako państwa, lecz Polska jako idea nigdy nie umarła. Rząd pod przywództwem [FROM.GetLeader] jasno dowiódł, że zjednoczenie w ciągu jednego pokolenia nie było odległym marzeniem, lecz osiągalną rzeczywistością. Wbrew wszelkim przeciwnościom, stawiając czoła wrogom ze wszystkich stron - zarówno wewnętrznym, jak i zagranicznym - [FROM.GetName] pozostaje prawdziwie zjednoczone. Państwo przekuło naród polski i jego różnorodnych mieszkańców w monolit, dowodząc, że zaufanie obywateli do przywództwa i przekonań rządu nie było błędem. Blizny konfliktu będą goić się długo, lecz dzięki jedności wykutej w ogniu wojny przyszłość Polski wygląda jasno. Gdy nad krajem wschodzi słońce, obywatele [FROM.GetName] patrzą naprzód z dumą i podniesionym duchem, przetrwawszy ostateczną próbę polskiej wojny domowej."
super.124.a: "Nareszcie zjednoczeni."


