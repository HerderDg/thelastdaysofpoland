l_polish:

 ###   Characters   ###
 POLITICS_BARTLOMIEJ_SIENKIEWICZ_DESC: "Do dziś Bartłomiej Sienkiewicz pozostaje autorem najtrafniejszej diagnozy stanu polskiego państwa: §t\"istnieje tylko teoretycznie... Chuj, dupa i kamieni kupa\"§!. Słowa te, choć pierwotnie nie odnosiły się do całej Polski, są również przykładem samospełniającej się przepowiedni. Polacy wierzyli w nie wystarczająco długo, aż pewnego dnia - bum - zaczęły pasować dosłownie, w stu procentach i co do litery. \n\nSienkiewicz nie chciałby jednak, aby okazały się prawdą. Nigdy nie należał do ludzi zadowalających się półśrodkami. Jako jeden z najaktywniejszych i najbardziej prominentnych działaczy Platformy Obywatelskiej oraz człowiek Tuska do zadań specjalnych szczerze nienawidził Prawa i Sprawiedliwości, co uczyniło go jednym z głównych celów niedobitków ancien régime'u. Po nieudanej próbie zorganizowania oporu w rodzinnych Kielcach musiał uciekać na wschód, do Sandomierza, gdzie stworzył jeden z ostatnich bastionów przeciw nadciągającym siłom Ziobry. \n\nTo nie jest zwykłe polowanie na człowieka. Sienkiewicz stanowi symbol wszystkiego, co Prawo i Sprawiedliwość uważa za źródło zła. Wykształcony, obyty, antyklerykalny liberał - jego wizerunek utrwalił się w chwili, gdy nagrano go w ekskluzywnej warszawskiej restauracji, jak wygłaszał wspomnianą diagnozę. Cały PiS mógłby mu dziękować. Gdyby nie dało się wykorzystać jego postaci jako alegorii arogancji Platformy Obywatelskiej, partia nigdy nie przejęłaby władzy. Teraz przedstawienie zbliża się do wielkiego finału, a Sienkiewicz musi upaść. \n\nAle Sienkiewicz nie upadnie. W przeciwieństwie do pisowskich pachołków naprawdę był doświadczonym ministrem spraw wewnętrznych. I w przeciwieństwie do nich nie urzeczywistnił własnymi rękami swojej przepowiedni. Sandomierz pozostanie wolnym, europejskim miastem - światłem, którego można uchwycić się w obliczu despotyzmu. Bez względu na cenę."
 
 POLITICS_OJCIEC_MATEUSZ_DESC: "Pod koniec lat dwudziestych historyczny Sandomierz, podobnie jak cały kraj, przeszedł przez przysłowiowe piekło, wydostając się z jednej katastrofy tylko po to, by natychmiast stanąć w obliczu kolejnej. Choć miasto w dużej mierze uniknęło bezpośrednich zniszczeń Upadku, rozpad państwa zdruzgotał spokojny porządek, którym dotąd cieszyli się mieszkańcy. W czasach nieustannej niepewności, gdy każdy nowy dzień mógł przynieść konflikt, zamieszki albo głód, Ojciec Mateusz uosabia to, czego Sandomierz potrzebował najbardziej - spokojną dłoń przewodnika, zdolną dodać otuchy zmęczonemu ludowi. Dla nieszczęśników, którzy nie potrafią poradzić sobie ze szkodami wyrządzonymi przez Upadek i jego następstwa, ksiądz pozostaje ostatnią latarnią nadziei, wokół której mogą się zgromadzić, choćby był niesprawdzonym idealistą. \n\nMimo błyskawicznego wyniesienia człowiek noszący ukochaną przez widzów twarz nigdy nie zamierzał zostać bohaterem miasta. Ani razu nie twierdził, że naprawdę jest postacią, którą odgrywał, ani nie szukał rozgłosu wykraczającego poza warunki kontraktu. Kiedy jednak sytuacja wewnętrzna Sandomierza zaczęła się pogarszać, a zaufanie do władz spadło do niespotykanego wcześniej poziomu, żartobliwe powitania wypowiadane w roli szybko ustąpiły miejsca zatroskanym mieszkańcom. Zdesperowani ludzie zwracali się po radę do jedynego autorytetu, któremu nadal ufali - jedynego człowieka okazującego szczerą troskę o ich dobro. Pod wieloma względami Ojciec Mateusz jest zbiorowym urojeniem miasta, pragnieniem kurczowego trzymania się normalności, choć świat wokół wali się w gruzy. Fikcja rzekomo ożywiona, ksiądz bez święceń, genialny detektyw bez żadnego formalnego przygotowania - sprzeczności nie mają znaczenia dla ludzi, którym nie pozostało już nic innego, w co mogliby wierzyć. \n\nWyniesiony do roli zbawcy miasta na fali powszechnego poparcia, witany przez tysiące pełnych nadziei serc oczekujących rozwiązania wszystkich problemów, Ojciec Mateusz znalazł się w położeniu, którego zawsze pragnął uniknąć. Choć najchętniej trzymałby się z dala od władzy politycznej i nadużyć, które nieuchronnie za nią podążają, \"ksiądz\" nie ma innego wyjścia, jak objąć ją w całości - dla nich i dla milionów ludzi walczących o przetrwanie pośród szczątków dawnej Polski, zapomnianych, samotnych i przerażonych. Musi pokazać wszystkim, że duch humanitaryzmu może przetrwać nawet najciemniejsze czasy, a gdy wszystko wydaje się stracone, wspólny, bezinteresowny wysiłek troskliwej społeczności zawsze potrafi stworzyć lepsze jutro."
 
