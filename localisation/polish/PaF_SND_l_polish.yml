 ###   Decision Categories   ###
 
 solving_crime: "Akta spraw kryminalnych"
 solving_crime_desc: "Z biegiem czasu sterta zgłoszeń na miejscowym komisariacie urosła do rozmiarów uniemożliwiających rozsądne przechowywanie i porządkowanie dokumentów. Sienkiewicz nie znalazł sposobu na rozwiązanie problemów pchających miasto ku upadkowi, lecz być może Ojciec Mateusz zdoła wreszcie przywrócić w Sandomierzu choć odrobinę prawa."
 
