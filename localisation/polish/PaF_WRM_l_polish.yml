 ##Events## 
unification.97.t: "[GetNewspaper]Warmia jednoczy Warmię i Mazury!"
unification.97.desc: "Gdy pozostałości reżimu Putina z Kaliningradu przekroczyły granicę i najechały Warmię i Mazury, większość przewidywała, że zostaną w końcu odparte, gdy tylko któryś z polskich rządów zdoła się przeorganizować. W końcu ich wojskowa \"potęga\" pokazała już, na co ją stać, podczas inwazji na Ukrainę w 2022 roku.\nNiewielu przewidywało jednak, że przyszłymi wyzwolicielami Warmii okażą się weterani talibów i migranci z Bliskiego Wschodu, dowodzeni przez byłego europosła. Republika Warmii Sikorskiego ogłosiła dziś zwierzchnictwo nad dawnym województwem warmińsko-mazurskim po serii zwycięstw nad rywalami, zapewne równie szalonymi, oraz rosyjskimi najeźdźcami. Wielu wciąż zastanawia się, jak muzułmańska banda dowodzona przez konwertytę zdołała zapuścić korzenie w jednym z najbardziej katolickich społeczeństw Europy. Jak dotąd bardziej zaangażowani teologicznie członkowie Republiki odpowiadają na te pytania słowami: \"Taka jest wola Allaha\"."
unification.97.a: "Takbir!"

unificationreg.97.t: "[GetNewspaper]By Allah, we are unstoppable!"
unificationreg.97.desc: "The whole region of Al-Prussiya is under our control! Banners of the Prophet fly sky-high on every building and street corner, and our brave Mujahideen fighters of Warmianistan already took to celebrating our victory in the streets. We say our most heartfelt salah for their victims.\n\nNow, it's time to consolidate our territories, root out any heresies that spit in the face of Allah and proceed forward. For just as the Prophet united the warring tribes of Arabia, our great leader Radosław Sikorski shall unite the warring tribes of Poland!"
unificationreg.97.a: "Alhamdulillah!"

unificationsupreg.97.t: "[GetNewspaper]Half of Poland under sharia!"
unificationsupreg.97.desc: "Praise Allah, our forces have taken over all of Eastern Poland! There is no time to rest, however, for the enemies of the Prophet mobilize their forces, fearing our might. The final battle over the control of the Polish nation begins today. With the power of Allah wielded by our venerable Caliph Sikorski, the warriors of Islam are invincible!\n\nThe final battle is upon us!"
unificationsupreg.97.a: "Onwards, soldiers of Jihad!"

super.97.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.97.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.97.a: "Wreszcie zjednoczeni."