l_polish:
 
 krakow_cw.1.t: "Wybór drogi dla Krakowa"
 krakow_cw.1.desc: "Nasz prezydent to człowiek wielu talentów. Profesor, prezydent, członek ruchu monarchistycznego. To sprawia, że pytanie o naszą przyszłość jest szczególnie interesujące. Dokąd powinniśmy zmierzać?"
 krakow_cw.1.a: "Demokracja"
 krakow_cw.1.b: "Scjentokracja"
 krakow_cw.1.c: "Monarchia"

krakow_krul.1.t: "Powołanie regenta"
krakow_krul.1.desc: "Monarchia to kapryśna bestia, a znalezienie idealnego kandydata nie jest łatwym zadaniem. Podczas gdy trwa debata, pytanie o to, kto będzie nami rządził, pozostaje bez odpowiedzi. Dlatego potrzebujemy regenta, który będzie sprawował tymczasową władzę do czasu znalezienia odpowiedniego monarchy. Magistrat uważa, że nie ma lepszej alternatywy niż pozwolić naszemu prezydentowi objąć to zaszczytne stanowisko. Bo... kto inny?"
krakow_krul.1.a: "Kolejny regent?"

krakow_krul.2.t: "Utworzenie Rady Regencyjnej"
krakow_krul.2.desc: "Dziś powołaliśmy Radę Regencyjną dla Królewskiego Miasta Krakowa. Dzwon Zygmunta rozbrzmiał w całym mieście, jakby monarcha został już wybrany, ale to tylko Majchrowski próbujący udowodnić swoją dominację. Niemniej teraz rozpoczyna się żmudne zadanie znalezienia idealnego kandydata. Takiego, który zasiądzie na Wawelu i będzie doglądał naszego majestatycznego miasta. Takiego, który naprawdę zna Polskę i jej mieszkańców. Takiego, który stanie się idealnym symbolem. Ale czy taki kandydat w ogóle istnieje?"
krakow_krul.2.a: "Miejmy nadzieję, że tym razem naprawdę wykonają swoją robotę."

krakow_krul.3.t: "Petycja z Łowicza"
krakow_krul.3.desc: "Otrzymaliśmy napisany w ostrym tonie list, w którym \"żąda się\", byśmy natychmiast przekazali koronę Jackowi Bartyzelowi albo, jeszcze lepiej, jakiemuś przypadkowemu Łowiczaninowi, o którym nigdy nie słyszeliśmy. Dlaczego? Tutaj sprawa staje się nieco mglista. Wspominają o tym, że \"kiedyś byliśmy stolicą\", i innych podobnych niedorzecznościach. Następnie list przechodzi do opisywania całej historii tego miasta i każdej najmniejszej wioski w okolicy, a także tego, jak wielkie miały znaczenie... kiedyś. Gdyby nie był napisany tak pretensjonalnym tonem, byłaby to całkiem niezła fikcja. Na końcu wiadomości autorzy wzmacniają swoje żądania całą litanią obelg, podkreślając, że są księstwem, mają wyjątkową historię, wyjątkowy język i wyjątkową kulturę, a zatem należy im się najwyższy szacunek."
krakow_krul.3.a: "Co jest nie tak z ludźmi z tego miasta?"

krakow_krul.4.t: "List od kolejnego regenta"
krakow_krul.4.desc: "Regent Polski i Polskiego Ruchu Monarchistycznego, Leszek Wielki Książę WIERZCHOWSKI, Wielki Książę Ukrainy-Rusi, Kniaź Imperium Rosyjskiego i Emir Tatarów twierdzi, że tylko jemu przysługuje prawo do zasiadania na tronie wawelskim. Wierzchowski, przebywający obecnie w Leżajsku, rzeczywiście przez wiele lat był jednym z przywódców ruchu monarchistycznego w Polsce, ale nie jest przy zdrowych zmysłach, by obejmować tak odpowiedzialne stanowisko. Niech zostanie królem jakiejś wioski, a rządzenie pozostawi poważnym ludziom."
krakow_krul.4.a: "To już chyba dno, prawda?"

krakow_krul.5.t: "Uzurpator z Tykocina"
krakow_krul.5.desc: "Jakby poprzednie próby nie wystarczyły, teraz mamy jeszcze uzurpatora z Tykocina, który rości sobie prawa do tronu. To już farsa. Marek Świętopełk Świętopełk Zawadzki, rządzący z jakiejś zapadłej dziury jako Świętopełk I Jagiellon (choć twierdzi, że jest potomkiem Bolesława I Piasta...), przysłał nam list ze swoją kandydaturą do tronu. Cóż, ten człowiek niegdyś chwalił się, że \"leczy\" zaburzenia psychiczne, takie jak depresja i schizofrenia, a także biseksualność, homoseksualność i masturbację. Zdecydowanie jest to człowiek totalnie zdrowy na umyśle. Nie zawracajmy sobie nawet głowy odpowiedzią."
krakow_krul.5.a: "Boże, zachowaj nasz kraj od takich władców..."

krakow_krul.6.t: "Żałosna próba"
krakow_krul.6.desc: "Na sam koniec, gdy wszystko wydawało się już stracone, pojawił się Konrad Berkowicz z jednym ze swoich genialnych pomysłów. Według niego nie powinniśmy szukać króla, lecz stworzyć nowego. Nowa dynastia, nowy ród. A czy wie, gdzie znaleźć odpowiedniego kandydata do tego przedsięwzięcia? Oczywiście, że wie - to on sam. Choć to tylko kolejny idiotyczny żart Berkowicza, być może jest w tym ziarno prawdy. Znalezienie żyjącego szlachcica, który nie byłby szaleńcem żądnym władzy, graniczyłoby bowiem z cudem. Być może będziemy więc musieli założyć nową dynastię. Oczywiście nie z Berkowiczem na czele."
krakow_krul.6.a: "Spadaj, Konradzie... mamy lepszy pomysł."

krakow_krul.7.t: "Wyborczy impas"
krakow_krul.7.desc: "W tym kraju nie ma żadnych prawdziwych, poważnych kandydatów, których warto byłoby rozważyć. Poszukiwanie ich za granicą pozbawiłoby nas legitymacji. To nie czas na obcych monarchów, niezależnie od tego, jakie roszczenia do polskiego tronu mogliby wysuwać. Musimy znaleźć rozwiązanie w granicach naszego kraju. Jedynym możliwym wyjściem jest stworzenie nowej dynastii. Na liście rady elekcyjnej znalazło się tylko jedno nazwisko warte rozważenia - nasz prezydent, Jacek Majchrowski. Ale... jeden lub dwóch elektorów uznało, że zabawnie będzie dopisać do listy Roberta Makłowicza. To, co miało być ledwie zauważalnym żartem, nabiera rozpędu w miarę rozchodzenia się plotek."
krakow_krul.7.a: "Jacek Majchrowski"
krakow_krul.7.b: "Robert Makłowicz"

krakow_sci.1.t: "Najwyższy rektor"
krakow_sci.1.desc: "Nauka jest kluczem do władzy. Jacek Majchrowski doskonale o tym wie, będąc jednocześnie uczonym i politykiem. Tym razem będzie jednak potrzebował wszystkich kluczy, jakie istnieją w tym mieście. Stanowisko Najwyższego Rektora zapewniłoby mu bezprecedensowy wpływ na środowisko akademickie i naukowe Krakowa. Oczywiście to broń obosieczna, ponieważ oznacza również poddanie go intensywnej kontroli i presji. Jeśli nie uda mu się zjednoczyć akademickich frakcji, konsekwencje mogą być opłakane."
krakow_sci.1.a: "Mama zawsze powtarzała, że trzeba się uczyć..."

krakow_sci.2.t: "Granty dla uniwersytetów"
krakow_sci.2.desc: "Przydział grantów dla uniwersytetów to kluczowa decyzja, która może ukształtować przyszłość badań naukowych i edukacji w Krakowie. Jacek Majchrowski musi starannie rozważyć, które uczelnie wesprzeć, równoważąc potrzeby różnych wydziałów i dbając o efektywne wykorzystanie zasobów w celu wspierania postępu naukowego."
krakow_sci.2.a: "Wzmocnij UJ"
krakow_sci.2.b: "Nie faworyzujmy nikogo"
krakow_sci.2.c: "Wzmocnij AGH"

krakow_sci.3.t: "Spór akademicki"
krakow_sci.3.desc: "Gorąca debata, która podzieliła krakowskie środowisko akademickie, wymknęła się spod kontroli. Teraz dwie najbardziej wpływowe uczelnie są ze sobą skłócone, a cała ludność miasta wstrzymuje oddech."
krakow_sci.3.a: "Opowiedz się po stronie UJ"
krakow_sci.3.b: "Opowiedz się po stronie AGH"

krakow_sci_uj.1.t: "Plus Ratio Quam Vis"
krakow_sci_uj.1.desc: "Plan prezydenta Majchrowskiego nie przyniósł oczekiwanych rezultatów. Wpływy Uniwersytetu Jagiellońskiego są większe niż kiedykolwiek, umacniając jego pozycję w akademickiej hierarchii. Uczelnia nie zgadza się na cywilny nadzór ze strony Magistratu."
krakow_sci_uj.1.a: "Ależ to szybko poszło..."

krakow_sci_uj.2.t: "Kwestia grantów dla AGH"
krakow_sci_uj.2.desc: "Teraz, gdy Uniwersytet Jagielloński sprawuje władzę w mieście, mamy wyjątkową okazję, by wpłynąć na przydział grantów. Pojawia się pytanie: czy powinniśmy wesprzeć również AGH, czy skupić się wyłącznie na Uniwersytecie Jagiellońskim? To nasi przeciwnicy, a środków mają wystarczająco dużo. Nam pieniądze przydadzą się bardziej niż im."
krakow_sci_uj.2.a: "Obetnij im finansowanie"
krakow_sci_uj.2.b: "Zostaw ich w spokoju"

krakow_sci_uj.3.t: "Bunt pomniejszej akademii"
krakow_sci_uj.3.desc: "AGH otwarcie się zbuntowało. Ci niewdzięczni, podrzędni akademicy próbują wymusić na nas ustępstwa, występując przeciwko nam. Tym razem musimy pokazać im, że pióro może i jest potężniejsze od miecza, ale nie oznacza to, że nie możemy użyć miecza, by zachować wewnętrzny porządek. Pożałują tej decyzji."
krakow_sci_uj.3.a: "Zmiażdżyć ich!"

krakow_sci_uj.4.t: "Pierwszy Kongres Akademicki"
krakow_sci_uj.4.desc: "Udało się uniknąć katastrofalnego konfliktu, a przywódcy różnych środowisk akademickich zebrali się, by omówić przyszłość szkolnictwa wyższego w Krakowie. A wraz z nią - politykę, która będzie wiązać się z przejęciem tej roli. Oczywiście czołowy uniwersytet ma największe wpływy spośród wszystkich pozostałych, co prawdopodobnie stawia Uniwersytet Jagielloński na drodze do zostania główną siłą administracyjną w mieście. Pojawiła się jednak również propozycja profesora Antoniego Dudka, który przed Upadkiem uczestniczył w projekcie akademickim mającym na celu stworzenie zupełnie nowego systemu politycznego dla kraju. Być może warto spróbować go teraz..."
krakow_sci_uj.4.a: "Postawmy na Polskę - Antoni Dudek"
krakow_sci_uj.4.b: "Pozostańmy przy akademikach"

krakow_sci_agh.1.t: "Labore Creata, Labori et Scientiae Servio"
krakow_sci_agh.1.desc: "Plan prezydenta Majchrowskiego nie przyniósł oczekiwanych rezultatów. Wpływy AGH są większe niż kiedykolwiek, umacniając jej pozycję w akademickiej hierarchii. Uczelnia nie zgadza się na cywilny nadzór ze strony Magistratu."
krakow_sci_agh.1.a: "Ależ to szybko poszło..."

krakow_sci_agh.2.t: "Kwestia grantów dla Uniwersytetu Jagiellońskiego"
krakow_sci_agh.2.desc: "Teraz, gdy AGH sprawuje władzę w mieście, mamy wyjątkową okazję, by wpłynąć na przydział grantów. Pojawia się pytanie: czy powinniśmy wesprzeć również Uniwersytet Jagielloński, czy skupić się wyłącznie na AGH? To nasi przeciwnicy, a środków mają wystarczająco dużo. Nam pieniądze przydadzą się bardziej niż im."
krakow_sci_agh.2.a: "Obetnij im finansowanie"
krakow_sci_agh.2.b: "Zostaw ich w spokoju"

krakow_sci_agh.3.t: "Brutalna fala arogancji"
krakow_sci_agh.3.desc: "Uniwersytet Jagielloński otwarcie się zbuntował. Ci niewdzięczni, podrzędni akademicy próbują wymusić na nas ustępstwa, występując przeciwko nam. Tym razem musimy pokazać im, że pióro może i jest potężniejsze od miecza, ale nie oznacza to, że nie możemy użyć miecza, by zachować wewnętrzny porządek. Pożałują tej decyzji."
krakow_sci_agh.3.a: "Zmiażdżyć ich!"

krakow_sci_agh.4.t: "Pierwszy Kongres Akademicki"
krakow_sci_agh.4.desc: "Udało się uniknąć katastrofalnego konfliktu, a przywódcy różnych środowisk akademickich zebrali się, by omówić przyszłość szkolnictwa wyższego w Krakowie. A wraz z nią - politykę, która będzie wiązać się z przejęciem tej roli. Oczywiście czołowa uczelnia ma największe wpływy spośród wszystkich pozostałych, co prawdopodobnie stawia AGH na drodze do zostania główną siłą administracyjną w mieście. Pojawiła się jednak również propozycja profesora Antoniego Dudka, który przed Upadkiem uczestniczył w projekcie akademickim mającym na celu stworzenie zupełnie nowego systemu politycznego dla kraju. Być może warto spróbować go teraz..."
krakow_sci_agh.4.a: "Postawmy na Polskę - Antoni Dudek"
krakow_sci_agh.4.b: "Pozostańmy przy akademikach"

krakow_dem.1.t: "Wolnościowy squat"
krakow_dem.1.desc: "Na kampusie studenckim AGH jest wielu studentów pragnących wolności. Konrad Berkowicz stał się symbolem ich wolności. Siedzą na kampusie, piją, marudzą i próbują się nawzajem pobić, a my otrzymujemy coraz więcej skarg od sąsiadów, że zaczyna to przypominać coś więcej niż zwykły studencki wieczór. Staje się to problemem politycznym, a nie możemy pozwolić sobie na jątrzącą się ranę libertarianizmu tuż obok centrum miasta. Pacyfikacja może obrócić się przeciwko nam, ale ugłaskanie ich również wydaje się niemożliwe, skoro nie mamy argumentów, których by posłuchali."
krakow_dem.1.a: "Pacyfikacja"
krakow_dem.1.b: "Ustępstwa"

krakow_dem.2.t: "Msza Zjednoczeniowa"
krakow_dem.2.desc: "Jan Maria Rokita, niegdyś konserwatysta związany z Platformą Obywatelską, obecnie szerzy prawicową propagandę próbując podważyć nasze rządy. Zorganizował Mszę Zjednoczeniową w Łagiewnikach i dzięki swojej reputacji zdołał zaprosić wielu miejskich urzędników. Zna ich osobiście, a to może stać się zalążkiem nowej opozycji. Nie możemy przecież pozwolić by nasza administracja straciła wiarę w nasze rządy. Jeśli jednak zabronimy im pójść... mogą udać się tam i tak na przekór naszym zakazom."
krakow_dem.2.a: "Niech idą"
krakow_dem.2.b: "Zabronić im udziału"

krakow_dem.3.t: "Ogłoszenie wyborów roku [GetYear]"
krakow_dem.3.desc: "Ogłoszono nadchodzące wybory a miasto aż huczy z oczekiwania. Obywatele przygotowują się do oddania głosów, a frakcje polityczne opracowują strategie swoich kampanii. Wynik wydaje się niemal przesądzony, ale stawka pozostaje wysoka. Kto zyska największe wpływy po partii rządzącej, może okazać się rysą na żelaznej kurtynie politycznej, która opadła nad Krakowem."
krakow_dem.3.a: "Wiemy kto wygra, prawda?"

krakow_dem.4.t: "Nieproszony uczestnik"
krakow_dem.4.desc: "Łukasz Gibała, wróg naszego reżimu, ukrywający się obecnie gdzieś w Nowej Hucie, chce wziąć udział w wyborach. Nigdy niczego nie wygrał i tym razem również mu się to nie uda, ale nawet dopuszczenie go do udziału może dać mu platformę do szerzenia swoich poglądów. Oczywiście zawsze możemy zabronić mu startu, a być może nawet spróbować pozbyć się go raz na zawsze."
krakow_dem.4.a: "Nie ma mowy - to przestępca"
krakow_dem.4.b: "Pozwolić mu wystartować"
krakow_dem.4.c: "Przygotujcie akcję aresztowania"

krakow_dem.5.t: "Gibała aresztowany"
krakow_dem.5.desc: "Perfekcyjnie przeprowadzona operacja zakończyła się wielkim sukcesem. Udało nam się aresztować jednego z największych wrogów naszego państwa - Łukasz Gibała nieustannie próbował podważać naszą pozycję, ale teraz nie będzie nam już więcej przeszkadzał."
krakow_dem.5.a: "Magistrat zawsze zwycięża"

krakow_dem.6.t: "Gibała uciekł"
krakow_dem.6.desc: "Gibała zdołał wymknąć się z naszej pułapki i ukrywa się teraz gdzieś razem z innymi reakcjonistami. To niedobrze, ponieważ niepowodzenie tej misji poważnie uderzy w naszą stabilność, ale... przynajmniej przez najbliższe tygodnie nie będzie naszym problemem."
krakow_dem.6.a: "Wymknęło się to spod kontroli..."

krakow_dem.7.t: "Nasze terytorium zostało zaatakowane"
krakow_dem.7.desc: "Pachołki Magistratu przekroczyły nasze granice i wkroczyły do serca Nowej Huty, by schwytać jednego z wygnańców, którzy znaleźli tu u nas schronienie. Nie pierwszy raz wystawiają naszą determinację na próbę i próbują udowodnić nam swoją dominację. Traktują nas jak psy i oczekują, że będziemy się kulić ze strachu i ukrywać w norach za każdym razem, gdy przyjdą nam dokuczać. Czy wreszcie staniemy do walki i się im przeciwstawimy, czy znów uciekniemy do swoich kryjówek?"
krakow_dem.7.a: "W dupie mamy Gibałę"
krakow_dem.7.b: "NA WOOOOOOOOOOOOOOJNĘ"

krakow_dem.8.t: "Wybory w Krakowie roku [GetYear]"
krakow_dem.8.desc: "Mieszkańcy Krakowa udają się do urn, by zdecydować o przyszłym przywództwie miasta. Różne frakcje polityczne walczą o władzę, każda z własną wizją rozwoju miasta. Wydaje się niemal pewne, że zwycięży koalicja Majchrowskiego, ale wciąż istotne pozostaje pytanie, która frakcja zostanie drugą siłą w mieście."
krakow_dem.8.a: "Krakowska Akcja Zjednoczeniowa"
krakow_dem.8.b: "Koalicja Krakowska"
krakow_dem.8.c: "Zmiana Kursu"
krakow_dem.8.d: "Front Wolności"

krakow_dem.9.t: "Protest na Błoniach"
krakow_dem.9.desc: "Tuż za rogatkami rynku trwa ogromny protest. Obywatele domagają się zmian i wyrażają niezadowolenie z obecnej administracji. Wygląda na to, że demonstracja nie wygaśnie w najbliższym czasie i może przerodzić się w niebezpieczny bunt. Czas opowiedzieć się po którejś ze stron."
krakow_dem.9.a: "Popieramy Majchrowskiego"
krakow_dem.9.b: "Rokita zjednoczy nasze miasto!"

krakow_dem.10.t: "Okupacja Starego Miasta"
krakow_dem.10.desc: "Siły opozycji połączyły siły, by spróbować obalić nasze rządy! Obecnie okupują Stare Miasto i zmuszają nas do przeniesienia administracji do innych części miasta. Zaczyna wyglądać na to, że możemy nie znaleźć się po zwycięskiej stronie tego konfliktu..."
krakow_dem.10.a: "Rokita prowadzi lud na Magistrat!"

krakow_dem.11.t: "Drugi Skłot Wolności"
krakow_dem.11.desc: "Na obrzeżach naszego miasta odbywa się drugi Skłot Wolności. Obywatele domagają się zmian i wyrażają niezadowolenie z obecnej administracji. Wygląda na to, że protest nie wygaśnie w najbliższym czasie i może przerodzić się w niebezpieczny bunt. Czas opowiedzieć się po którejś ze stron."
krakow_dem.11.a: "Popieramy Majchrowskiego"
krakow_dem.11.b: "Wolność! Własność! Sprawiedliwość!"

krakow_dem.12.t: "Marsz na Magistrat"
krakow_dem.12.desc: "Siły opozycji połączyły siły, by spróbować obalić nasze rządy! Obecnie okupują Stare Miasto i zmuszają nas do przeniesienia administracji do innych części miasta. Zaczyna wyglądać na to, że możemy nie znaleźć się po zwycięskiej stronie tego konfliktu..."
krakow_dem.12.a: "Berkowiczowi udaje się przejąć władzę!"

krakow_dem.13.t: "Protest wyborczy Gibały"
krakow_dem.13.desc: "Tuż za rogatkami rynku trwa ogromny protest. Obywatele domagają się zmian i wyrażają niezadowolenie z obecnej administracji. Wygląda na to, że demonstracja nie wygaśnie w najbliższym czasie i może przerodzić się w niebezpieczny bunt. Czas opowiedzieć się po którejś ze stron."
krakow_dem.13.a: "Wniosek odrzucony"
krakow_dem.13.b: "Gibała poprowadzi nas ku wolności!"

krakow_dem.14.t: "Tym razem pierwszy"
krakow_dem.14.desc: "Łukasz Gibała i jego zwolennicy otwarcie wypowiedzieli bunt siłom Magistratu! Wiedzieliśmy, że zawsze będzie solą w naszym oku, ale tym razem dojdzie do ostatecznego starcia między nami, ponieważ tylko jedna strona może rządzić tym miastem. Ostateczna rebelia się rozpoczęła. Miasto szykuje się do wojny domowej."
krakow_dem.14.a: "Królewskie Miasto spłynie krwią"

krakow_dem.15.t: "Wieczny prezydent"
krakow_dem.15.desc: "Nie ma polityka, który mógłby się równać z przebiegłością i polityczną dominacją Jacka Majchrowskiego. Zdołał przechytrzyć każdego lokalnego przeciwnika politycznego i trzymał się władzy tak mocno, jak drzewo trzyma się ziemi. Głęboko zakorzeniona administracja, po wprowadzeniu drobnych zmian, jest teraz gotowa rozszerzyć swoje rządy poza granice Krakowa, ponieważ przyszłość tego miasta pozostaje taka sama jak dotąd: pod stabilnym i niezmiennym przywództwem Majchrowskiego."
krakow_dem.15.a: "Nie było innego wyjścia"
 
krakow_news.1.t: "[GetNewspaper] Wojna domowa w Krakowie!"
krakow_news.1.desc: "Polskie samorządy wykazały zadziwiającą trwałość w obliczu upadku. W wielu większych lub mniejszych miejscowościach dalej rządzą ci sami włodarze co dawniej. Pomimo rozpadu Polski sesje rad miast dalej się odbywają, a urzędy rejestrują samochody. Do tej pory najlepszym przykładem tego zjawiska był Kraków. Jego prezydent, Jacek Majchrowski zdołał utrzymać władzę i stosunkowy spokój w swoim mieście. Czuł się na tyle pewnie, by podjąć próbę organizacji demokratycznych wyborów. \n\nJednakże, niedawno sytuacja gwałtownie się pogorszyła - choć początkowo nic tego nie zapowiadało. Lokalna kampania wyborcza przebiegała spokojnie, a wśród mieszkańców odczuwalny był entuzjazm z możliwości wyboru włodarzy. \n\nNiestety, kandydaci pogrążyli się we wzajemnych oskarżeniach i kontrowersjach, a ich wiece zmieniły się w wojny gangów. Całe dzielnice opanował chaos, na większych ulicach powstają barykady i posterunki milicji. Kraków podzielił się na wojujące frakcje."
krakow_news.1.a: "Miały być demokratyczne wybory, a wyszła wojna domowa."

krakow_news.2.t: "[GetNewspaper]Koronacja Majchrowskiego"
krakow_news.2.desc: "Jacek Majchrowski rządził Krakowem przez ostatnie 25 lat. \"Wieczny prezydent\" utrzymał swoją władzę nawet w obliczu Upadku Polski i wynikającego z niego chaosu.\n\nJednakże, miasto pozostaje zagrożone przez watażków z niemal każdej strony. Poza tym cierpi ono z powodu potężnych trudności gospodarczych. Brakuje żywności, a niemal wszystkie miejsca pracy upadły z powodu załamania się turystyki i odcięcia od internetu. Jacek Majchrowski ogłosił, iż demokracja działa zbyt wolno i nieskutecznie by sprostać tym wyzwaniom. \n\nUznał on, że odpowiedzi na problemy teraźniejszości Kraków musi szukać w swojej bogatej, wielowiekowej historii. A w przeszłości miasto było stolicą monarchów. W związku z tym Wieczny Prezydent został koronowany na króla Jacka I podczas mszy w wawelskiej katedrze. Dla wielu mieszkańców było to tylko potwierdzenie faktów dokonanych: po co komu wybory, skoro i tak zawsze wygrywa je ten sam kandydat?"
krakow_news.2.a: "Boże, chroń króla!"

krakow_news.3.t: "[GetNewspaper]Makłowicz Regentem Krakowa!"
krakow_news.3.desc: "Od czasu Upadku wielkie miasta Polski cierpią z powodu klęski głodu. Rzeczywistość brutalnie uświadomiła ich mieszkańcom, że jedzenie nie bierze się ze sklepu. Kraków nie jest wyjątkiem. \n\nNiektórzy krakowianie wciąż desperacko przeszukują dyskonty, tocząc bitwy o ostatnie plastry zgniłego łososia. Inni próbują hodować rośliny na balkonach i osiedlowych podwórkach - z marnym skutkiem. Jednakże nie doszło do wybuchu anarchii - tylko do powstania monarchii. \n\nO dziwo nowe królestwo nie ma króla - tylko regenta. Roberta Makłowicza. \n\nJObiecuje on, że pokaże krakowianom jak przyrządzić pożywne i smaczne dania za pomocą łatwodostępnych składników. Nie są to czcze słowa - nowy władca jest mistrzem sztuki kulinarnej i historykiem, więc wie jak wykorzystać skromne zasoby, żeby zaradzić klęsce głodu. Początek jego rządów został przyjęty z powszechnym entuzjazmem i nadzieją."
krakow_news.3.a: "Wykarm nas Zbawco!"

krakow_news.4.t: "[GetNewspaper]Uniwersytety rządzą Krakowem!"
krakow_news.4.desc: "Upadek sprowadził na Kraków największy kryzys co najmniej od czasu wojen światowych. Kanały komunikacji zostały przerwane, a na ulicach zapanował bandytyzm i bezprawie. Bezpiecznie jest tylko na terenie najważniejszych urzędów i uniwersytetów. \n\nUznano, iż w obliczu tak trudnego położenia władzę muszą sprawować ludzie najmądrzejsi. A gdzie szukać światłych jak nie na uczelniach? Nic dziwnego zatem, iż nowym władcą miasta został [ROOT.GetLeader]. \n\nTen powszechnie uznany uczony obiecuje rozwiązać problemy Krakowa w najbardziej efektywny, bo naukowy sposób. Proponuje on technokratyczne rządy, wolne od partyjnych wojenek i ślepego dogmatyzmu. Mają one polegać na najbardziej efektywnym wykorzystanie dostępnych środków do osiągania pragmatycznych celów. Reakcja zwykłych Krakowian na to pozostaje umiarkowana - ich uwagę bardziej zaprząta zdobywanie wody, czy kombinowanie skąd wziąć paliwo do generatorów prądu."
krakow_news.4.a: "Gaude Mater Polonia!"

krakow_news.5.t: "[GetNewspaper]Pokojowe wybory w Krakowie!"
krakow_news.5.desc: "Wydawało się, że organizacja demokratycznych wyborów w Krakowie jest niemożliwa. Wyborcom zagrażały gangi z maczetami, a znalezienie bezpiecznych miejsc dla lokali wyborczych było ogromnym wyzwaniem. A napięta kampania prawie przerodziła się w wojnę domową. \n\nMimo tych trudności nastąpił cud nad urną. Wybory przebiegły bez poważniejszych incydentów, a wszystkie strony sceny politycznej uznały ich wyniki: zwyciężył [ROOT.GetLeader]. Jest to sukces nie tylko tego kandydata, ale wszystkich krakowian. Ich miasto pozostaje latarnią demokratycznego ładu otoczoną przez ciemności chaosu. \n\nNiestety, nowy prezydent Krakowa musi zmierzyć się z wieloma problemami. Wewnątrz niego wciąż wielu mieszkańców cierpi z powodu głodu, wojen gangów i chorób. Natomiast na zewnątrz bastion demokracji pozostaje otoczony przez bezwzględnych watażków, którzy spoglądają na niego łakomym wzrokiem."
krakow_news.5.a: "Święto demokracji!"


