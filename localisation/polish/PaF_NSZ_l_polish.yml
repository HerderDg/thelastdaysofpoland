 NSZ_storm1: "Nadchodząca burza"
 NSZ_storm1_desc: "PLACEHOLDER - Metaforycznie. Z czasem ten spirit się pogarsza. Doomeryzm i prepperyzm rośnie i rośnie. Upadek był tylko pierwszym dominem rozpadu cywilizacji. Dotarliśmy do szczytu Dekadencji wielkich imperiów. Wschód i Zachód upadną, a Polska musi przetrwać Burzę."
 
 ###   News Events   ###
 
unification.123.t: "[GetNewspaper]Towarzystwo Świętego Krzyża jednoczy województwo Świętokrzyskie!"
unification.123.desc: "Po raz pierwszy od wybuchu Upadku województwo świętokrzyskie zaznało pokoju, co obwieszczono dziś z wielką pompą w stolicy regionu, Kielcach. Przez miasto przemaszerowała wielka defilada, wzorowana na Marszach Niepodległości z minionych lat, przed dziesiątkami tysięcy widzów. Na jej czele szedł Robert Bąkiewicz - człowiek, który przekształcił marginalny ruch w niepowstrzymaną milicję, samemu zaś wydobywając się z niemal całkowitej ruiny i zdobywając ogólnokrajową sławę. Tuż za nim, równym krokiem, maszerują żołnierze Towarzystwa Świętokrzyskiego - lojalni fanatycy walczący o Polskę opartą na sile narodu i odrzuceniu zachodniej degeneracji. \nDalej ciągną jeńcy wojenni, których ostatnim zadaniem jest zaprezentowanie własnego upokorzenia. Prawa, z których dotąd korzystali obywatele, są stopniowo ograniczane w imię walki z \"niebezpiecznymi zmianami wywołanymi przez niemieckie wpływy\", podczas gdy przez granice regionu napływają kolejne fale uchodźców. Od czasu podboju województwa nasila się prześladowanie wszystkich, którzy nie mogą wykazać się czysto polskim pochodzeniem."
unification.123.a: "To wydarzyło się tutaj."

super.123.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.123.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.123.a: "Wreszcie zjednoczeni."
