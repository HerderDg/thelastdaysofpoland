 ##Ideas##
POG_wave_of_kidnappings: "Fala porwań"
POG_wave_of_kidnappings_desc: "Pod osłoną nocy białe vany sieją terror na ulicach miast Konsorcjum, porywając tych nieszczęśników, którzy nie zdążyli na czas znaleźć schronienia we własnych domach. Przyjaciele, małżonkowie, dzieci... nikt nie jest bezpieczny przed złowrogimi mężczyznami w czarnych maskach. Dokąd zabierają porwanych, pozostaje tajemnicą - o ile w ogóle gdziekolwiek ich zabierają. Jedno jest pewne: ci, którzy znikają w vanach, §Rnigdy nie wracają.§!"
POG_Keeping_the_system: "Chory system"
POG_Keeping_the_system_desc: "Medycy zatrudnieni przez Narodowy Fundusz Zdrowia przywykli do apokaliptycznych warunków na długo przed Upadkiem. System już od dawna rozpaczliwie potrzebował reformy. Jej wdrożenie wymaga jednak czasu i zasobów. Łódzkie Pogotowie Ratunkowe nie ma ani jednego, ani drugiego, dlatego póki co będzie trzymać się sprawdzonych metod. Ratownicy nadal będą przemierzać łódzkie pustkowia, niosąc pomoc wszystkim, którzy jej potrzebują, podczas gdy ich partner - Konsorcjum Kwiatowe - zajmie się kwestiami finansowymi, tak aby ani pacjenci, ani ŁPR nie musieli się nimi przejmować."
POG_venomous_snakes: "Jadowite węże Asklepiosa"
POG_venomous_snakes_desc: "Wprawne oko księgowego może zauważyć, że budżet Pogotowia Ratunkowego nie powinien się spinać. Pieniądze z ubezpieczeń, dotacje Konsorcjum, zintegrowana lokalna prywatna opieka zdrowotna - wszystko to są legalne źródła dochodów, ale nie powinny wystarczać na pokrycie całej działalności ŁPR. Musi istnieć dodatkowe źródło przychodów ukryte za kulisami. Najwyraźniej ratownicy prowadzą jakieś podejrzane interesy, lecz z zaskakującym doświadczeniem zacierają swoje ślady przed wścibskimi oczami. Niczym węże wielokrotnie wymykali się z zastawionych na nich sieci. A jeśli ktoś podejdzie naprawdę blisko, wiedzą, jak ugryźć."
 ##First Tree##

 ##Events#

krosniewice.1002.t: "Pogotowie przejmuje Konsorcjum"
krosniewice.1002.desc: "Nieuchwytny przywódca sprywatyzowanego oddziału łódzkich ratowników medycznych w końcu zdecydował się wyjść z cienia i zająć miejsce nowej twarzy Konsorcjum. Niewiele wiadomo o tajemniczym doktorze Ebrantilu poza pogłoskami, że jego współpraca ze Skrzydlewskim sięga czasów na długo przed Upadkiem. Jego rzecznicy twierdzą, że ratownicy zdobyli dominującą pozycję dzięki swojej innowacyjności oraz sprytnemu wykorzystaniu zasobów zgromadzonych jeszcze przed Upadkiem. Ich plan biznesowy, choć spowity tajemnicą, będzie kontynuowany pod ich czujnym okiem.\nNiektórzy oskarżają Ebrantila o to, że był sprawcą niesławnej afery łowców skór i że z biegiem czasu będzie jedynie rozbudowywał swoje nikczemne machinacje. Takie głosy są jednak szybko uciszane za pomocą łapówek, pozwów sądowych lub... innych środków."
krosniewice.1002.a: "Uosobienie jatrofobii" 


unification.35.t: "[GetNewspaper]Łódzkie Pogotowie jednoczy województwo Łódzkie"
unification.35.desc: "Przez długi czas Łódź pozostawała jednym z niewielu regionów niepogrążonych w nieustannej wojnie, a lokalne kliki zamiast tego zasiadały do stołu negocjacyjnego, próbując rozwikłać tajemnicę wybuchu jądrowego na Bałutach. Wygląda na to, że współpraca wyszła łódzkim graczom politycznym na dobre, ponieważ region został właśnie zjednoczony przez sojusz trzech frakcji funkcjonujących ze sobą w symbiozie. \nTak zwane 'Konsorcjum Kwiatowe' jest triumwiratem Krzysztofa Rutkowskiego, H. Skrzydlewskiej oraz Łódzkiego Pogotowia Ratunkowego, które obecnie zarządza większością przedupadkowych służb cywilnych i zajmuje się administracją państwa. Otrzymaliśmy jednak również doniesienia, że Pogotowie jest w rzeczywistości działającą w cieniu ręką Konsorcjum, pełniącą rolę jego siatki szpiegowskiej i tajnej policji, wykonującą mokrą robotę oraz obsługującą kontakty kliki z czarnym rynkiem. Ludność Łodzi wydaje się jednak nieświadoma tego faktu dzięki kontroli Triumwiratu nad informacjami docierającymi do obywateli."
unification.35.a: "Wiedziałem, że coś mi dodali do tabletek..."

unification_alt.35.t: "[GetNewspaper]Łódzkie Pogotowie jednoczy województwo łódzkie"
unification_alt.35.desc: "Cała Łódź wstrzymała oddech, gdyż okazało się, że węże Asklepiosa potrafią kąsać. Tajemniczy doktor Ebrantil ujawnił swoją tożsamość jako niesławny członek przedupadkowego gangu łowców skór. Gdy miał już dość ukrywania się za grupą Skrzydlewskiego, postanowił zamiast tego wbić mu nóż w plecy. Wtedy rozpoczęły się jego rządy terroru. Po rozprawieniu się z rodziną Skrzydlewskiego oraz swoim dawnym sojusznikiem, Krzysztofem Rutkowskim, przejął cały majątek Kliki i wykorzystał go przeciwko pozostałym łódzkim watażkom. Skoro nie może już dłużej działać z ukrycia, rządzi teraz za pomocą terroru, gdyż żaden zdrowy na umyśle człowiek nie zaakceptowałby jego reżimu. Wszyscy dysydenci znikają; najprawdopodobniej kończą rozczłonkowani, a części ich ciał trafiają na czerwony rynek. Pomimo tych ponurych perspektyw eksperci zapewniają, że reżim Ebrantila jest skazany na upadek, chyba że jakiś cud pozwoli mu utrzymać się przy władzy pomimo otwartej nienawiści społeczeństwa."
unification_alt.35.a: "Wiedziałem, że coś mi dodali do tabletek..."

super.35.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.35.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.35.a: "Wreszcie zjednoczeni."



 ##Characters##
POLITICS_EBRANTIL_DESC: "Przerażające odkrycie czeka każdego, kto ośmieli się zajrzeć głębiej w politykę Konsorcjum Kwiatowego. Pomimo pozorów kontroli sprawowanej przez Skrzydlewskiego, prawdziwa władza spoczywa w rękach człowieka tak nikczemnego, że samo ujawnienie pełni jego zepsucia mogłoby wystarczyć, by zjednoczyć wszystkich pozostałych watażków w próbie jego powstrzymania. Ukryta za maską z ludzkiego ciała wykrzywiona twarz doktora Ebrantila nawiedza Polskę, podczas gdy groza niegdyś widoczna w gasnących oczach jego pacjentów rozlewa się po Łodzi. Jego wpływy przeistoczyły służby ratunkowe z bezinteresownych humanitarystów dawnych czasów w jego osobisty plac zabaw - rząd cieni w korytarzach władzy i bezdusznych zabójców na ulicach Kutna.\n\nNieświadome niczego §Rszczury laboratoryjne§!, znane w pozostałej części województwa po prostu jako §G\"ludzie\"§!, nie wiedzą, że korzenie karuzeli grozy pochłaniającej upadły naród sięgają aż początków III Rzeczypospolitej. To właśnie wtedy, podczas praktyk w pogotowiu ratunkowym, ten wcześniej niczym niewyróżniający się człowiek zdał sobie sprawę, że jest... inny niż reszta jego kolegów. Gardził ich miękkimi sercami, ich gotowością do zrobienia wszystkiego, by uratować życie drugiego człowieka. Oczywiście nadal niechętnie wykonywał swoją pracę - w końcu dla pieniędzy zrobi się wszystko - i ta historia mogłaby równie dobrze zakończyć się właśnie wtedy, gdyby nie znalazł człowieka gotowego umożliwić mu działanie. Tak samo jak dziś, pieniądze Witolda Skrzydlewskiego łaskawie spuściły szaleństwo doktora Ebrantila ze smyczy i pozwoliły mu skierować je przeciwko ludności. Gdy umierali w agonii wywołanej Pavulonem, wpatrując się w pozbawione duszy oczy swojego przyszłego przywódcy, bezbronni mieszkańcy Łodzi po raz ostatni dobroczynnie przysłużyli się interesom obu mężczyzn - dla jednego stając się źródłem zysku, dla drugiego źródłem wypaczonego poczucia celu. \n\nGdy po raz drugi przyjął szalonego naukowca pod swoje skrzydła, Skrzydlewski naprawdę wierzył, że zdoła kontrolować doktora Ebrantila. Zamiast tego sam stał się marionetką demona w ludzkiej skórze. Nekropolia Kutna każdego dnia pochłania coraz więcej ciał - jedne przeznaczone są do makabrycznych eksperymentów tworzących bluźniercze amalgamaty, inne dla ich cennej §Rkrwi§!, a pozostałe po prostu dla chorej przyjemności nowego przywódcy. Nie pozostał już nikt, kto mógłby powstrzymać jego obłąkany umysł. \n\n§RTeraz nawet Bóg nie jest już w stanie uratować Polski. \n\nLudziom pozostaje jedynie modlić się o szybką i bezbolesną śmierć.§!"
