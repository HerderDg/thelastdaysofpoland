l_polish:
 ## National Spirits ##
SLU_country_of_the_peoples_of_the_streets: "Kraj Ludzi Ulicy"
SLU_country_of_the_peoples_of_the_streets_desc: "Dla postronnego obserwatora mogą wyglądać jak niezorganizowana banda chuliganów, ale Ludzie Ulicy to zżyta grupa, która szczerze szanuje i przestrzega Kodeksu Ludzi Ulicy, którego zasady ustanowił nie kto inny jak sam Rychu \"Peja\". Raper, który został watażką, prowadzi teraz wierne tłumy wyznawców odzianych w barwy niebiesko-białe, pragnących położyć kres skorumpowanemu systemowi i naprawdę zaprowadzić Kodeks Ludzi Ulicy w Poznaniu."
SLU_looming_chaos: "Nadchodzący chaos"
SLU_looming_chaos_desc: "Znienawidzeni funkcjonariusze poznańskiej policji zostali w taki czy inny sposób usunięci, ale powstała po nich próżnia doprowadziła do szerzenia się ogólnego bezprawia w dzielnicach. Rywalizujące gangi, a nawet niezależni przestępcy, bez skrupułów łupią nasze miasto, lekceważąc Kodeks Ludzi Ulicy."
SLU_generations_war: "Wojna pokoleniowa"
SLU_generations_war_desc: "W szeregach Ludzi Ulicy doszło niedawno do rozłamu. Większość członków starej gwardii podąża za muzyką i wzorcami lat dziewięćdziesiątych, wyznaczonymi przez takich oldschoolowych raperów jak sam Peja, podczas gdy młodsze pokolenie skłania się ku współczesnemu rapowi. Brak jedności jest co najmniej problematyczny, ponieważ często prowadzi do wewnętrznych bójek w naszych szeregach."

unification.61.t: "[GetNewspaper]Slumsy Poznania jednoczą północną Wielkopolskę!"
unification.61.desc: "Po chaosie, który nastąpił po upadku Eurokomisariatu Westpolen, nastała anarchia i kompletny rozgardiasz. Ostatecznie cały ten chaos został jednak wyparty przez państwo, które wprawia w zakłopotanie większość wykształconych komentatorów. Terytorium dawnego województwa znalazło się pod \"kontrolą\" Slumsów Poznania - anarchistycznej komuny \"kierowanej\" przez Ryszarda \"Peję\" Andrzejewskiego, uznanego rapera niemającego niemal żadnego doświadczenia przywódczego. Zainspirowane twórczością swojego rzecznika Slumsy można najlepiej opisać jako społeczeństwo oparte na \"ideologii blokowisk\", czyli zasadzie \"żyj po swojemu i daj innym święty spokój\". Choć Slumsy uparcie odcinają się od tradycyjnego podziału politycznego na lewicę i prawicę, niektórzy przedstawiciele europejnej skrajnej lewicy już okrzyknęli je nadejściem anarchizmu, a nawet anarchokomunizmu, oraz wzorem dla reszty kraju. W porównaniu z przeciętnym polskim państewkiem watażków ich polityka jest znacznie bardziej humanitarna."
unification.61.a: "Co tam, ziomuś?"

super.61.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.61.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.61.a: "Wreszcie zjednoczeni."