 self_propelled_mortar_brigade_desc: "Pojazdy pancerne uzbrojone w moździerze. Dzięki długiemu zasięgowi, opancerzeniu i - przede wszystkim - dodatkowej mobilności są zdolne do bezpiecznego prowadzenia ognia pośredniego."
 heavy_artillery_brigade: "Artyleria"
