CAL_silence4_desc: "Nowa Calisia ogląda wreszcie wschód słońca i podziwia go bez słowa. Pretorianie niepodzielnie rządzą Imperium i wszyscy o tym wiedzą. Zarówno Calisius, jak i Vinicius opuścili ten świat, a naszym zadaniem jest odbudować go w lepszej postaci. Już nigdy nikt nas nie powstrzyma. Przelano jednak krew i łzy, a każdy w ciszy zadaje sobie pytanie: \"Czy było warto?\""
CAL_silence5: "Cisza"
CAL_silence5_desc: "Nowa Calisia ogląda wreszcie wschód słońca i podziwia go bez słowa. Pretorianie niepodzielnie rządzą Imperium i wszyscy o tym wiedzą. Zarówno Calisius, jak i Vinicius opuścili ten świat, a naszym zadaniem jest odbudować go w lepszej postaci. Już nigdy nikt nas nie powstrzyma. Przelano jednak krew i łzy, a każdy w ciszy zadaje sobie pytanie: \"Czy było warto?\""

CAL_preatorian_hegemony_in_army_idea: "Pretoriańska hegemonia nad armią"
CAL_preatorian_hegemony_in_army_idea_desc: "Wraz z narodzinami nowej res publica ktoś musi zapewnić jej silną i kompetentną ochronę. Najzdolniejszych pretorian powołano na najwyższe stanowiska oraz politycznych nadzorców kalizjańskiego wojska. Legiony nie wykonają żadnego ruchu bez zgody nowych przełożonych."

CAL_new_constitution: "Nowa konstytucja"
CAL_new_constitution_desc: "Nie możemy pozwolić, aby Calisia powtórzyła błędy z epoki Ricardusa. Ludowi ogłoszono zupełnie nową konstytucję, która spotkała się z powszechnym poparciem. Dokument nadaje pretorianom znaczne przywileje i pozwala im interweniować w określonych sprawach państwa. Już nigdy jeden człowiek nie zagrozi naszej republice!"

CAL_populist_promises: "Populistyczne obietnice"
CAL_populist_promises_desc: "Granice między populus a jego rządem zostały zburzone. Z sal rodzącego się Senatu wyszła seria reform opatrzonych zielonym stemplem \"zatwierdzono\". Do życia publicznego Calisii powróciły sprawiedliwe przepisy dotyczące zgromadzeń i protestów. Utworzono też niewielki fundusz pomocy dla ludzi poszkodowanych przez zmianę władzy. Miejmy tylko nadzieję, że okażą wdzięczność..."

CAL_finis_vandalii: "Finis Vandalorum"
CAL_finis_vandalii_desc: "Nasza ukochana planeta ma skłonność do powtarzania tych samych błędów, a naszym obowiązkiem jest je naprawiać.\nWandalowie nie potrafili pozostać na śmietniku historii i w tej właśnie chwili przeklinają żyzne ziemie dawnej Polski! Legiony maszerują, ale nie na wojnę. Nie zaszczycajmy ich mianem przeciwnika. To zwykła deratyzacja."

CAL_finis_khonnone: "Finis Hunnorum"
CAL_finis_khonnone_desc: "Podlachię najlepiej opisać jako zgniłą, zacofaną krainę pełnej neohunów. Nasza inwazja jest aktem miłosierdzia wobec jej ludności. Śmierć, niewola albo przymusowe nawrócenie na kalizjański sposób istnienia - każdy z tych losów jest znacznie lepszy od niezależnego życia na tej przeklętej ziemi. Na litość zasługują jedynie nasze legiony, które muszą tam wkroczyć."

CAL_finis_jutii: "Finis Iutorum"
CAL_finis_jutii_desc: "Kolejny dzień, kolejna ziemia do oczyszczenia z błędów ludzkości.\nJutowie zdają się niewiele lepsi od zwierząt, którymi ich karmimy. Boska mądrość Cesarza mówi zatem, że wściekłe psy należy uśpić, zanim same zaatakują. Z tą słuszną sprawą w sercach ponownie ruszamy naprzód."

CAL_finis_scythia: "Finis Scythiae"
CAL_finis_scythia_desc: "Cesarz żąda sprawiedliwości, a legiony ją wymierzają.\nScytowie, znani z nieustannego naruszania granic Imperium, wkrótce poniosą konsekwencje swoich czynów. Musimy bronić się przed tymi dzikusami! Każdy prawdziwy Kalizjanin popiera ten prosty fakt i w jego imię chwyta za ostrze."

CAL_finis_visigothia: "Finis Visigothorum"
CAL_finis_visigothia_desc: "Zdolność przystosowania jest podstawą zwycięstwa w każdej bitwie. W przeciwieństwie do nas Wizygoci jej nie posiadają. Poczekamy więc, aż pogrążą się w chaosie po skutecznej eliminacji ich przywództwa. Kura bez głowy nie nadaje się do niczego poza zjedzeniem."

CAL_barbarians_in_our_midst_idea: "Barbarzyńcy pośród nas"
CAL_barbarians_in_our_midst_idea_desc: "Stworzenie nowego porządku jest niemożliwe bez rozwiązania problemu cudzoziemców żyjących wśród naszego ludu. Nie jesteśmy mordercami ani tyranami, lecz musimy chronić naród, za który wzięliśmy odpowiedzialność. Każdy barbarzyńca zostanie odnotowany i odpowiednio potraktowany. Nie oczekujemy od nich zrozumienia."
CAL_barbarians_in_our_midst_idea2: "Barbarzyńcy pośród nas"
CAL_barbarians_in_our_midst_idea2_desc: "Stworzenie nowego porządku jest niemożliwe bez rozwiązania problemu cudzoziemców żyjących wśród naszego ludu. Nie jesteśmy mordercami ani tyranami, lecz musimy chronić naród, za który wzięliśmy odpowiedzialność. Każdy barbarzyńca zostanie odnotowany i odpowiednio potraktowany. Nie oczekujemy od nich zrozumienia."

CAL_PRETORIANIE_amber_flow: "Handel bursztynem"
CAL_PRETORIANIE_amber_flow_desc: "Po złagodzeniu praw handlowych i przeprowadzeniu serii projektów wydobywczych nastąpił boom gospodarczy napędzany bursztynem. Krajowa biżuteria stała się nowym krzykiem mody, a każdy zapragnął nosić tak wykwintne luksusy. Bursztyn jest również eksportową sensacją, która błyskawicznie wypełnia pretoriańskie skarbce złotem."
CAL_PRETORIANIE_agents: "Pretoriańscy agenci"
CAL_PRETORIANIE_agents_desc: "Na ulicach ludzie szepczą o nadciągającym zagrożeniu ze strony pretoriańskich agentów, kryjących się w cieniu na każdym rogu. Szepczą, ponieważ tych, którzy mówili głośno, spotkał niefortunny koniec. Pretoriańscy urzędnicy oczywiście odrzucają te niedorzeczne teorie spiskowe, lecz liczba podejrzanych wypadków budzi niepokój."
CAL_PRETORIANIE_agents_2: "Pretoriańscy agenci"
CAL_PRETORIANIE_agents_2_desc: "Na ulicach ludzie szepczą o nadciągającym zagrożeniu ze strony pretoriańskich agentów, kryjących się w cieniu na każdym rogu. Szepczą, ponieważ tych, którzy mówili głośno, spotkał niefortunny koniec. Pretoriańscy urzędnicy oczywiście odrzucają te niedorzeczne teorie spiskowe, lecz liczba podejrzanych wypadków budzi niepokój."
CAL_PRETORIANIE_agents_3: "Wpływy pretorian"
CAL_PRETORIANIE_agents_3_desc: "Paranoja w Senacie osiągnęła punkt wrzenia. Widmo pretoriańskiej infiltracji szeregów konsulów zawładnęło umysłami wszystkich. Nikomu nie można ufać, ponieważ każdy może znajdować się na liście płac pretorian."

CAL_LEGIONY_breadbasket_of_calisia: "Spichlerz Calisii"
CAL_LEGIONY_breadbasket_of_calisia_desc: "Pola południowego wschodu mają doskonałą glebę, lecz pełne wykorzystanie jej możliwości wymaga wysiłku. Najwierniejsi i najdzielniejsi legioniści otrzymali ziemię, aby odrodzić rolnictwo regionu, podczas gdy skazani za zdradę lub tchórzostwo trudzą się teraz na polach, odpokutowując winy."
CAL_LEGIONY_spirit_true_commander: "Duch prawdziwego dowódcy"
CAL_LEGIONY_spirit_true_commander_desc: "Każde ciało potrzebuje głowy, a dla Legionu jest nią legat. Od rekrutów po weteranów wszyscy zwracają się ku przywódcy po wskazówki - i otrzymują je z nawiązką. Rzadko zdarza się, aby wojska były równie natchnione jak Legiony pod dowództwem legata Viniciusa, za którego gotowe są pomaszerować do piekła i z powrotem."
CAL_LEGIONY_blockade: "Blokada galicyjska"
CAL_LEGIONY_blockade_desc: "Od dawna żadna karawana ze zbożem nie opuściła prowincji Legionistów. Zgodnie z rozkazem legata Viniciusa wprowadzono embargo. Napięcia między państwami Triumwiratu zbliżają się do punktu krytycznego, a fora w całej kalizjańskiej krainie zamiast świeżych produktów wypełniają głodujący plebejusze."

CAL_SENAT_off_to_killing_again: "Znowu ruszamy zabijać..."
CAL_SENAT_off_to_killing_again_desc: "Seria nieco podejrzanych wypadków spotkała kilku najbogatszych obywateli. To tragedia, choć fakt, że wszyscy zapisali cały majątek Senatowi, wywołuje nieprzychylne plotki na ulicach. Prokuratorzy zajmą się dalszymi teoriami spiskowymi, ponieważ z pewnością była to jedynie seria niefortunnych zdarzeń."
CAL_SENAT_threats_from_abroad_within: "Calisia w oblężeniu"
CAL_SENAT_threats_from_abroad_within_desc: "W każdym zakątku Senatu szerzą się szepty. Konsulowie mówią o spisku i niepokojach wśród wszystkich stanów Calisii. Princeps Senatus Caletus zmobilizował Senat i powołał komisję prokuratorów, która naprawdę wytropi oraz zniszczy każdy spisek przeciw nowemu porządkowi."

CAL_primacy_of_the_senate_idea: "Prymat Senatu"
CAL_primacy_of_the_senate_idea_desc: "Kalizjański Senat, bastion republikanizmu, z czasem zyskiwał wpływy. Po niedawnym utworzeniu dowodzonej przez senatorów Gwardii Republikańskiej objął wiodącą rolę w ustawodawczej kontroli nad państwem, ograniczając absolutną władzę Augusta."

CAL_cold_war: "Cesarska zimna wojna"
CAL_cold_war_desc: "Po niedawnym wybuchu wrogości między frakcjami Triumwiratu Wenedia została podzielona na Wschód i Zachód. Legioniści Legio I Alfa oczyścili północne prowincje z pretorian, lecz nadmiernie rozciągnięte linie zaopatrzeniowe uniemożliwiły marsz na samą Calisię. Bursztynowa Kurtyna Limes opadła teraz na kalizjańskie ziemie, umacniając podział i podtrzymując niepewne zawieszenie broni."

CAL_administrative_turmoil: "Zamęt administracyjny"
CAL_administrative_turmoil_desc: "W Calisii zaczyna kształtować się nowy porządek, a wraz z nim pojawiają się wszystkie trudności związane z wymianą administracji. Nowi duchowni i przywódcy wojskowi powoli integrują się z cesarskimi strukturami państwa. Oby nie okazali się ZBYT powolni. Calisia nie może sobie pozwolić na kolejne porażki."

CAL_patriots_in_control: "Patrioci przejmują kontrolę"
CAL_patriots_in_control_desc: "Wygląda na to, że nawet bez jego \"świętej\" wiedzy imperium Calisiusa stabilizuje się imponująco dobrze. Lojalne siły pretorian maszerują przez miasto, przywracając porządek i aresztując ostatnich zdrajców."

CAL_chaos: "Chaos w Calisii"
CAL_chaos_desc: "§RCesarz nie żyje.§!\nWszyscy jego najbliżsi współpracownicy zostali uciszeni. Calisia właśnie odcięła sobie własną krwawiącą głowę i próbuje chodzić bez niej. Wszelki cesarski porządek zdaje się rozpadać. Ludzie panikują i giną na ulicach, a legioniści opuszczają posterunki. Marsie, zachowaj Calisię..."

CAL_curfew: "Godzina policyjna"
CAL_curfew_desc: "Senat otrzymał nadzwyczajne uprawnienia, a we wszystkich miastach wprowadzono godzinę policyjną. Zaniepokojony i zdezorientowany lud Calisii stara się nie wchodzić w drogę żadnemu legatowi wiernemu Optymatom. Niestety, choć większość mieszkańców podporządkowała się nowemu reżimowi, nadchodzący chaos może okazać się nieunikniony."

CAL_expulsion_of_barbarians_idea: "Wypędzenie barbarzyńców"
CAL_expulsion_of_barbarians_idea_desc: "Nasze dzielne siły specjalne dumnie osiedlają się na prawowicie chronionych ziemiach i oczyszczają je z pozostałych \"komplikacji\" związanych ze zdradzieckimi barbarzyńcami. Wszyscy niepożądani cudzoziemcy są pokojowo przenoszeni poza granice chronione przez pretorian. A przynajmniej tak twierdzą. Czy mamy jakikolwiek powód, by nie wierzyć słowom najdzielniejszych spośród nas?"

CAL_we_will_build_a_wall: "Zbudujemy mur..."
CAL_we_will_build_a_wall_desc: "Żaden z nich nie wejdzie, żaden nie wyjdzie, ŻADEN NIE PRZEJDZIE! Skoro własnymi rękami szybko położyliśmy kres barbarzyńcom, naszym obowiązkiem jest również zadbać, aby już nigdy nie stali się problemem. Z każdym dostrzeżonym dzikusem mur będzie rósł. Jeżeli jeszcze kiedyś przyjdzie nam bronić domów przed tymi bestiami, mury dopilnują, żeby tym razem żaden nam nie uciekł."

CAL_and_make_germanii_pay_for_it: "...i każemy Germanom za niego zapłacić"
CAL_and_make_germanii_pay_for_it_desc: "Dzięki szybko wykorzystanej okazji północne plemiona germańskie są teraz głównymi sponsorami pieniężnymi renowacji naszej miejskiej izolacji. To sprawiedliwe, aby pieniądze na \"ochronę\" przed barbarzyńcami pochodziły z ich własnych skarbców. Zarządcy budowy mogą nie podzielać tego zdania, ale lud Calisii jest wdzięczny, że nie musi finansować żadnych przedsięwzięć związanych z wrogami. A przynajmniej tak mu się wydaje..."

CAL_domination_in_germania: "Triumf nad Germanią"
CAL_domination_in_germania_desc: "Nasz lud raduje się z szybkiego zwycięstwa nad Germanami. W tym świecie najsilniejszy bierze to, co mu się prawowicie należy. Ostatnie dni dowiodły, że chwalebny naród Calisiusa jest zdecydowanie najsilniejszy, a każda kolejna wojna to jedynie następna kostka domina prowadząca ku całkowitej kalizjańskiej dominacji."

CAL_spartakus_revolt: "Powstanie Spartakusa"
CAL_spartakus_revolt_desc: "Chaos po raz kolejny obejmuje Calisię niczym stary przyjaciel. Zbuntowane oddziały wyzwolonych niewolników i barbarzyńców ścierają się z legionami na ulicach miast i po wsiach. Niektórzy porównują bunt do romantyzowanego, sprawiedliwego powstania Spartakusa. Głupcy i zdrajcy, wszyscy bez wyjątku! Przypomnimy im, jak tamto powstanie zakończyło się w historii. Do tego czasu musimy jednak żyć ze społecznymi i gospodarczymi trudnościami stanu wojennego."

CAL_divide_and_conquer: "Dziel i rządź"
CAL_divide_and_conquer_desc: "Cesarski lud gromadzi się pod sztandarami i jednoczy przeciw wspólnemu wrogowi - hordom barbarzyńców. W obliczu wielkiego i morderczego, lecz skłóconego oraz rozbitego zagrożenia z zewnątrz zwykle walczące ze sobą stany odłożyły różnice na bok i utworzyły wspólny front z Augustem."

CAL_nation_of_many: "Naród wielości"
CAL_nation_of_many_desc: "Ludność Imperium rośnie z każdym udanym podbojem. Mniejszości etniczne są liczne, a wraz z nimi przychodzi wielka różnorodność kulturowa, która wnosi mnóstwo barw do codziennego życia kalizjańskich obywateli. Kontrolowanie tak zróżnicowanej ludności obciąża Cohortes Urbanae, a tym samym stabilność samego państwa, lecz jest to niewielka cena w porównaniu z siłą tolerancyjnego i zjednoczonego społeczeństwa."

CAL_calisian_over_all: "Kalizjańskość ponad wszystko"
CAL_calisian_over_all_desc: "W miarę jak ludność Imperium rośnie i staje się bardziej różnorodna, musimy zasymilować możliwie wielu niekalizjańskich mieszkańców. Nauczymy ich języka, obyczajów i praw oraz zażądamy, by żyli tak jak my. Z pewnością zjednoczy to Imperium, choć polityka może nie spodobać się najbardziej fundamentalistycznym barbarzyńcom."

CAL_indentured_servitude_idea: "Służba kontraktowa"
CAL_indentured_servitude_idea_desc: "Gdy Senat zebrał się, aby omówić sposoby poprawy gospodarki, jedna z propozycji przypadła Augustowi do gustu. Państwo mogłoby \"zachęcać\" bezrobotnych i niewykształconych plebejuszy do \"ochotniczej\" służby w ramach Contractus Opus przy robotach publicznych albo na polach. Podobnie można potraktować więźniów i dłużników. Taka inicjatywa z pewnością zwiększy zdolności produkcyjne, lecz osoby objęte Contractus Opus mogą potrzebować dodatkowej \"perswazji\", aby pracować sumiennie."

CAL_treaty_of_kornik_idea: "Traktat Prowentyjski"
CAL_treaty_of_kornik_idea_desc: "Po niedawnym incydencie granicznym w mieście Provent wynegocjowano i podpisano traktat zapobiegający wojnie z północnymi sąsiadami. Rozwiązanie dyplomatyczne było korzystniejsze, lecz niektóre frakcje Senatu i grupy obywateli są oburzone upokarzającym porozumieniem."

CAL_taxxed_the_barbarians: "Podatek barbarzyński"
CAL_taxxed_the_barbarians_desc: "Imperium daje i Imperium odbiera. Po zapewnieniu przybyszom żywności oraz mieszkań państwo nakazało im pracować i płacić podatki jak wszystkim pozostałym obywatelom Calisii. Z pewnością pobudzi to gospodarkę, lecz rozgniewa również niezadowoloną i marginalizowaną mniejszość barbarzyńską."

CAL_abducted_women: "Porwania kobiet"
CAL_abducted_women_desc: "Przez kraj przetacza się seria tragicznych zdarzeń: kobiety z miast i wsi graniczących z Calisią znikają. Raporty mówią o grupach mężczyzn odzianych w segmentaty, którzy przekraczają granice i wchodzą do lasów, aby polować na niewinne kobiety oraz je porywać. Tak dalej być nie może. Trzeba coś z tym zrobić!"

CAL_citizenship_for_the_few: "Obywatelstwo dla nielicznych"
CAL_citizenship_for_the_few_desc: "Głupotą jest sądzić, że każdy mężczyzna, kobieta i dziecko mogą zostać uznani za godnych kalizjańskiej tożsamości. Nasze imperium narodziło się dzięki sile najlepszych ludzi, jakich mógł wydać dawny naród polski. Bycie Kalizjaninem należy zatem postrzegać jako następny etap bycia Polakiem. Wybrani przez samego Marsa, naprawdę jesteśmy Augustami wśród narodów."

CAL_earn_your_citizenship: "Zasłuż na obywatelstwo!"
CAL_earn_your_citizenship_desc: "Bycie Kalizjaninem nie jest tylko ideą - to stan istnienia. Ostateczny etap dojrzałości, do którego może dążyć człowiek. Nasz wielki naród zbudowano na ruinach dawnej Polski, lecz fundamentów nowych miast nie wzniosła polska krew. Uczyniły to ciężka praca, stalowa wola i cnotliwa lojalność wobec Cesarza. Nie każdy może zostać nazwany Kalizjaninem, ale każdy z was z pewnością może spróbować nim zostać!"

CAL_fourth_rome: "Czwarty Rzym"
CAL_fourth_rome_pp: "Czwarty Rzym"
CAL_fourth_rome_war_support: "Czwarty Rzym"
CAL_fourth_rome_desc: "Jeżeli wcześniej nie było to dla kogoś oczywiste, dowody są teraz jasne jak słońce. To my, i nikt inny, jesteśmy prawdziwymi spadkobiercami cywilizacji rzymskiej. Od narodzin Romulusa po wyniesienie Ricardusa nasza chwalebna rzymska tożsamość nadal żyje w sercach prawowitych właścicieli.\n§RROMA AETERNA EST!§!"

CAL_byzantine_bureaucracy: "Biurokracja bizantyjska"
CAL_byzantine_bureaucracy_desc: "Wypełnij formularz, aby otrzymać dokument uprawniający do złożenia wniosku o kolejny dokument, bez którego nie można wypełniać formularzy. Olbrzymia machina administracyjna, która w teorii pozwala sprawnie zarządzać Imperium, rozrosła się tak bardzo, że rozwiązanie nawet najprostszych spraw zajmuje tygodnie albo miesiące, utrudniając codzienne życie ogółu ludności."

CAL_praetorian_plot_1: "Rodzący się spisek"
CAL_praetorian_plot_1_desc: "Pod osłoną nocy wyszeptywane są herezje. Ostrzone są sztylety. Łamane przysięgi. Plotki głoszą, że dopuszczenie barbarzyńców do Senatu nie będzie tylko kolejną kontrowersją, którą Cesarz po prostu zignoruje. Pojawią się konsekwencje. Być może po raz pierwszy w swojej krótkiej historii los Calisii trafi w ręce jej obrońców."

CAL_praetorian_plot_2: "Spisek barbarzyńców"
CAL_praetorian_plot_2_desc: "Kurtyna opadła, a ukryte za nią rzeczy nie są szczególnie trudne do uwierzenia. Niedawno zaprzysiężonych barbarzyńców oskarżono o prowadzenie niewdzięcznego spisku przeciw ludowi Calisii i jego Cesarzowi. Jak wszyscy zdrajcy - przysięgają na życie swoich matek, że są niewinni. Niestety dla nich nikogo poza wspomnianym Cesarzem to nie obchodzi. Jaka szkoda..."

