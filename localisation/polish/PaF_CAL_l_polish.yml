CAL_contacts_in_the_senate_tt: "§1Optymaci§! są równie §Rzniesmaczeni§! jak my, ale musimy zapewnić sobie ich milczącą zgodę na nasze §Rdziałania§!."
CAL_cunning_stratagem_tt: "Plan jest prosty: za jednym zamachem usunąć skorumpowanego §YImperatora§! i tych nieznośnych §Sbarbarzyńców§!. Dwie pieczenie na jednym ogniu, a rozwiązanie jest równie proste - §ROGIEŃ§!."
CAL_united_in_hatred_tt: "Skoro §SBarbari§! mogą robić, co tylko zechcą, część §0Kalizjan§! zaczęła głośno wyrażać swoją niechęć. Powinniśmy zachęcić i sfinansować tych §Rsygnalistów§!."
CAL_proper_officers_for_the_job_tt: "Nadszedł czas, by włączyć nowe, §Glojalne§! elementy §Narmii§! do §0spisku§!. Nasz plan wymaga ogromnego wysiłku, potrzebujemy więc mnóstwa §Nsiły żywej§!."
CAL_quiet_purge_in_the_guard_tt: "Jednocześnie nie możemy tolerować żadnych §Rwichrzycieli§! we własnych §0siłach§!. Jak wszystkich §Rzdrajców§!, należy ich odnaleźć i uciszyć §Rna zawsze§!."
CAL_assignments_for_the_big_night_tt: "Wszystko jest §Rgotowe§!. Każdy wie, co ma §Rrobić§!. Od wykonania §Rplanu§! dzielą nas zaledwie dni. Niech bogowie prowadzą nas i chronią, gdy będziemy §Roczyszczać Cesarstwo z zepsucia§!."
CAL_oath_of_undying_loyalty_tt: "Musimy upewnić się, że §YCesarz§! niczego nie podejrzewa, a jest na to jeden sposób - §Gprzysięgi§!. Cała §0Gwardia Pretoriańska§! ponowi swe §Gprzysięgi§! przed §YRicardusem§!."
CAL_servants_in_the_palace_tt: "Służący - prawdziwi panowie §YPałacu§!. Ich poparcie jest kluczowe dla realizacji naszego planu, a niektórych być może łatwo kupić. Staną się naszymi §0oczami i uszami§! w §YPałacu§!, a w §Rgodzinie potrzeby§! także naszymi kluczami."
CAL_false_plot_tt: "§0Spisek§! może stać się zbyt wielki, by go §Rukryć§!, dlatego musimy podsunąć §YCesarzowi§! i §0ludowi§! innego podejrzanego. Tak się składa, że znamy idealnego §Skozła ofiarnego§!."
CAL_plant_the_evidence_tt: "Mamy §Skozła ofiarnego§!, lecz potrzebujemy również twardych §Rdowodów§!. Możemy wykorzystać ciała kilku §SBarbari§!. W ogniu i zamieszaniu będzie to przecież wyglądać jak akt §Rsamospalenia§!."
CAL_explosive_mixture_tt: "Do Ostrovii zmierza transport §N\"wojskowych materiałów łatwopalnych\"§!, ale... §Rnigdy nie dotrze do celu§!."
CAL_our_little_nero_tt: "§YCesarz§! jest stary i zapominalski. Możemy wyrwać z kontekstu kilka jego §Ypłomiennych przemówień§! i wykorzystać je przeciwko niemu. Kolejny doskonały §Ykozioł ofiarny§! i uzasadnienie naszych §Rdziałań§!."
CAL_invite_the_barbarians_tt: "Wyślemy §0emisariuszy§! do części §SBarbari§!, zapraszając ich do §0miasta Calisia§!. Nieświadomi §Sniczego§!, po przekroczeniu §0bram§! już §Rnigdy nie opuszczą miasta§!."
CAL_stashes_of_greek_fire_tt: "§RŁatwopalne materiały§! trzeba rozmieścić w strategicznych punktach §0miasta§!, aby je sparaliżować, lecz ograniczyć liczbę ofiar wśród prawdziwych §0Kalizjan§!. Staną się oni §Gświadkami§! potworności wywołanych przez §SBarbari§! i §YCesarza§!."
CAL_great_fire_of_calisia_tt: "§RPodpalono§! lont, a §0miasto§! szybko strawił §Rogień§!. Niech bogowie nam wybaczą.\n\n§RPłomienie oczyszczą Calisię z obcych barbarzyńców i pogrążonego w urojeniach Cesarza.§!"
CAL_sic_semper_tyrannis_tt: "§YCESARZ§! §RNIE ŻYJE§!, A Z POPIOŁÓW §0NARODZI SIĘ NOWA CALISIA.§!"
CAL_ethnic_tensions_tt: "Plany osadnicze §RPopularów§! zaczynają obracać się przeciwko §SBarbari§!. §0Dumni obywatele Calisii§! coraz podejrzliwiej patrzą na swych napływowych sąsiadów w świetle §0ostatnich doniesień§!, co prowadzi do §Ynapięć etnicznych§!.\nZiemie objęte nikczemnymi programami §RPopularów§! §Sosiedlania barbarzyńców§! otrzymują §R-20§! §Ycotygodniowej siły żywej§! oraz §R-10%§! §Ymiesięcznego przyrostu ludności§!"
CAL_barbarian_pogroms_tt: "§YNapięcia etniczne§! przeradzają się w otwarte §Rpogromy§!, gdy rozchodzą się wieści o aktach §Swandalizmu§! i §Sprzemocy§! popełnianych przez §SBarbari§! w naszym §0wielkim Cesarstwie§!.\nZiemie objęte nikczemnymi programami §RPopularów§! §Sosiedlania barbarzyńców§! otrzymują §R-40§! §Ycotygodniowej siły żywej§! oraz §R-20%§! §Ymiesięcznego przyrostu ludności§!"
CAL_barbarian_round_ups_tt: "Ziemie objęte nikczemnymi programami §RPopularów§! §Sosiedlania barbarzyńców§! otrzymują §R-80§! §Ycotygodniowej siły żywej§! oraz §R-30%§! §Ymiesięcznego przyrostu ludności§!."
CAL_barbarian_round_ups_2_tt: "Ziemie objęte nikczemnymi programami §RPopularów§! §Sosiedlania barbarzyńców§! otrzymują §R-100§! §Ycotygodniowej siły żywej§! oraz §R-40%§! §Ymiesięcznego przyrostu ludności§!"
CAL_barbarian_gladiators_tt: "Ziemie objęte nikczemnymi programami §RPopularów§! §Sosiedlania barbarzyńców§! otrzymują §R-120§! §Ycotygodniowej siły żywej§! oraz §R-50%§! §Ymiesięcznego przyrostu ludności§!"
CAL_barbarian_sus_tt: "Ziemie objęte nikczemnymi programami §RPopularów§! §Sosiedlania barbarzyńców§! otrzymują §R-60§! §Ycotygodniowej siły żywej§! oraz §R-35%§! §Ymiesięcznego przyrostu ludności§!"
CAL_barbarian_exile_tt: "Ziemie objęte nikczemnymi programami §RPopularów§! §Sosiedlania barbarzyńców§! otrzymują §R-80§! §Ycotygodniowej siły żywej§! oraz §R-40%§! §Ymiesięcznego przyrostu ludności§!"
CAL_aqueducts_on_prosna_tt: "§YWydajność przepływu wody:§! §G+50%§!"

### Flagi ###
CAL_crisis_of_the_third_decade_flag: "Kryzys trzeciej dekady uderzył w Cesarstwo..."
CAL_palace: "Wzniesiono nowy §YPałac§! godny naszego §YCesarza§!."

CAL_empty_coffers_flag: "Nasze §Fskarbce§! świecą §Rpustkami...§!"
CAL_vinicius_plea_flag: "Nasze §NLegiony§! są zbyt §Rrozciągnięte§!"
CAL_rawicz_slaughter_flag: "W Ravitium wydarzyło się coś §Rnie do opisania§!"
CAL_abduction_of_the_amazonians_flag: "Nasze §NLegiony§! uprowadziły §wamazońskie kobiety§!"
CAL_philosophical_disputes_flag: "Doszło do §Rgorącego sporu§! wśród naszych §Qfilozofów§!"
CAL_daydreaming_of_rome_flag: "Nasz lud zaczął się §1romanizować§! coraz §0bardziej§! i §rbardziej§!"

## Pierwsze drzewko ##

CAL_dobrze_jest_byc_cesarzem: "Dobrze być Cesarzem"
CAL_dobrze_jest_byc_cesarzem_desc: "Obywatele Calisii! Oto nad naszym wspaniałym miastem wstaje świt, niosąc obietnicę kolejnego dnia przepełnionego bogactwem pradawnych obyczajów i codziennych rytuałów. Macellum Arcum jest już otwarte dla handlu! Niech wszyscy spragnieni pożywienia i rozkoszy tłumnie ruszą na targowiska, gdzie zwabią was aromaty przypraw i przepych egzotycznych towarów. W południe na stadionie rozpocznie się widowisko teatralne, w którym legendarne opowieści o Herkulesie ożyją dzięki urzekającym występom i zapierającej dech scenografii.\n\nNa posadzce Senatu odbędzie się kolejny spór o redystrybucję ziemi publicznej! Połączmy siły i serca, by chronić nasz bezcenny Ager Publicus i zapewnić jego żyznym polom przetrwanie przez następne pokolenia."

CAL_zwyczajowe_dary_od_senatorow: "Zwyczajowe dary od senatorów"
CAL_zwyczajowe_dary_od_senatorow_desc: "Cesarz Ricardus Calisius ogłasza wszystkim zainteresowanym stronom: za tydzień w Pałacu Embolusia Iovis odbędzie się senacka uczta. Od wszystkich uczestników oczekuje się przyniesienia darów ku czci Cesarza, jak nakazuje utrwalony zwyczaj podobnych uroczystości. Najlepsze wina i potrawy zostaną zapewnione na koszt kalizjańskiego skarbca. W granicach rozsądku można przyprowadzić członka rodziny lub bliską osobę - najwyżej jednego gościa na zaproszonego senatora. \nWypieki na uroczystość zapewni Cech Piekarzy Italii. Najwyborniejsze kalizjańskie ciasta z najprzedniejszych kalizjańskich składników."

CAL_merytokratyczny_psikus: "Stronnicy ludu"
CAL_merytokratyczny_psikus_desc: "Wiadomość opłacona i przekazana przez frakcję Popularów wszystkim zainteresowanym. Każdy obywatel Calisii, który pragnie przedstawić swoje skargi lub omówić z członkami Popularów dowolną sprawę polityczną, będzie mógł to zrobić podczas jednego z ożywczych spotkań pod gołym niebem, zaplanowanych na najbliższy Veneris. Zgromadzenie odbędzie się w Ogrodzie Bogini Diany przy rozwidleniu Prosny. Gospodarze serdecznie zapraszają wszystkich zainteresowanych i tym usilniej zachęcają ich do zadawania wszelkich pytań, jakie przyjdą im do głowy. Wydarzenie potrwa od godziny 11 do 15. Zrzeszone cechy zapewnią bezpłatne napoje i przekąski do wyczerpania zapasów."

CAL_wyslanie_kwestorow_w_teren: "Wysłanie kwestorów w teren"
CAL_wyslanie_kwestorow_w_teren_desc: "Straszliwe wieści z Senatu! Dzięki sumiennej pracy niektórych członków Popularów ujawniono potworne nadużycia władzy! Na ziemiach należących do prominentnych przedstawicieli frakcji Optymatów odkryto ślady korupcji, oszustw i wyzysku plebsu. W nadchodzących dniach odbędą się nadzwyczajne wybory nowych kwestorów, których zadaniem będzie kontrola każdej działki przyznanej w ramach systemu Ager Publicus. Winni któregokolwiek z wymienionych przestępstw zostaną surowo ukarani."

CAL_odwdzieczenie_sie: "Najlepsi z najlepszych"
CAL_odwdzieczenie_sie_desc: "Wiadomość opłacona i przekazana przez Optymatów wszystkim zainteresowanym. W nadchodzących dniach senatorowie Optymatów odbędą w Restauracji Roma swoje organizowane dwa razy w miesiącu spotkanie ze stronnikami. Zaproszenia wysłano do najbardziej znamienitych gości i wkrótce powinny do nich dotrzeć. Stoły uginać się będą od najlepszych potraw, a jedną z największych atrakcji wieczoru będzie prawdziwe kalizjańskie wino z własnej winnicy Petrusa Caletusa. W spotkaniu może uczestniczyć każdy dobrze wychowany obywatel, nawet bez formalnego zaproszenia, lecz organizatorzy nie gwarantują wolnych miejsc. Przy wejściu bezwzględnie wymagany jest strój galowy."

CAL_budowa_siatki_kontaktow: "Cynk od nowych przyjaciół"
CAL_budowa_siatki_kontaktow_desc: "Straszliwe wieści z Senatu! Prywatne śledztwo przeprowadzone przez zaniepokojonych członków Optymatów ujawniło na posiadłościach senatorów Juno Priscusa i Remusa Sisenny rażące nadużycia systemu Ager Publicus. Proces senatorów ma odbyć się w ciągu miesiąca, a doniesienia o ich czynach wyglądają ponuro. Zarzuty obejmują wyzysk plebejskich robotników, fałszowanie dokumentacji podatkowej, uiszczanie niewystarczającej daniny Cesarzowi Ricardusowi Calisiusowi oraz niewolnictwo. Senatorowie odpowiedzialni za ujawnienie tych przestępców poprosili o zachowanie anonimowości, twierdząc, że służą nie sławie, lecz Res Publice."

CAL_niebywale_doniesienia: "Niewiarygodne doniesienia"
CAL_niebywale_doniesienia_desc: "Nowe informacje w sprawie skandalu Ager Publicus! Podążając tropami ujawnionymi przez Senat, kwestorzy odkryli podczas śledztwa ogromną korupcyjną machinę. Wielu właścicieli ziemskich - patrycjuszy, zamożnych plebejuszy, a nawet senatorów - uznano za winnych licznych zarzucanych im wcześniej przestępstw! Cesarz Ricardus Augustus Calisius jest oburzony nikczemnością elit Res Publici i żąda natychmiastowej reakcji Senatu. Tymczasem dalsze dochodzenia będą kontynuowane. Od tej chwili aż do rozwiązania sytuacji właściciele ziemscy mają prawny obowiązek przekazywać kwestorom rzetelne zestawienia dochodów oraz umożliwić w najbliższym dogodnym terminie inspekcję wszystkich posiadłości objętych Ager Publicus."

CAL_sprawa_ager_publicus: "Casus Ager Publicus"
CAL_sprawa_ager_publicus_desc: "Na horyzoncie majaczą wielkie zmiany prawne! Z błogosławieństwem Cesarza Ricardusa Calisiusa Senat zakończył przygotowania do serii debat prawnych, które mają rozstrzygnąć palącą kwestię Ager Publicus - reformy rolnej wiązanej odtąd z licznymi skargami prawnymi i podsycającej wrogość między senatorami Optymatów i Popularów. Kierowani dobroczynnością, dobrą wolą i żadną inną pobudką poza pragnieniem przywrócenia sprawiedliwości i porządku w naszym pięknym Cesarstwie senatorowie wkrótce przedstawią propozycje ostatecznego rozwiązania tej sprawy. Takie oddanie z pewnością zapewni im przychylność bogów."

CAL_mowa_o_naduzyciach: "Przemowa o nadużyciach"
CAL_mowa_o_naduzyciach_desc: "Dziś w uświęconych murach Senatu konsul Compa wygłosi płomienne przemówienie na temat wszechobecnych nadużyć trapiących nasz święty Ager Publicus.\nNiech wszyscy senatorowie i obywatele skupią swoją uwagę, gdyż los naszej ukochanej ziemi wisi na włosku. Konsul zapowiada, że rzuci światło na rażące niesprawiedliwości dotykające naszej domeny rolnej, rozbudzając zapał do zmian i inspirując naszych czcigodnych prawodawców do wspólnego działania.\nPrzybądźcie, obywatele Calisii, gdyż ta historyczna chwila zwiastuje świt nowej epoki zarządzania naszym wspólnym majątkiem. Wyzwoleńcy i niewolnicy nie mogą uczestniczyć."

CAL_cyceronski_sznyt: "Cyceroński sznyt"
CAL_cyceronski_sznyt_desc: "Konsul wygłosił przemówienie, w którym uznał reformę Ager Publicus za sprawę najwyższej wagi, lecz przestrzegł przed przepaścią rewolucji.\nZ mądrością i umiarem błagał nas o roztropność i równowagę, abyśmy nie dali się porwać wichrowi doraźnej sprawiedliwości społecznej. Posłuchajmy tego donośnego wezwania do rozsądku, wygłoszonego z żarem godnym samego Cycerona!\n\nChoć reforma nas wzywa, kroczmy ku niej rozważnie, prowadzeni pewną ręką namysłu. W tyglu rządzenia to bowiem mądrość, nie impuls, wyznaczy bieg naszego szlachetnego przedsięwzięcia.\n\nNiech słowa konsula rozbrzmiewają w annałach dziejów wraz z nieśmiertelnym duchem naszej czcigodnej Res Publici i odwiecznym dążeniem do sprawiedliwości miarkowanej rozumem."

CAL_rozkradanie_res_publici: "Rozkradanie Res Publici"
CAL_rozkradanie_res_publici_desc: "Konsul Andreas Compa nie zdołał przywrócić Senatowi sprawności. Senatorowie nadal się kłócą, a wszelkie próby znalezienia rozwiązania problemu korupcji w systemie Ager Publicus zostały tymczasowo wstrzymane. Od zeszłego miesiąca nie poczyniono żadnych postępów w opracowywaniu planów redystrybucji ziemi i zaradzenia bolączkom Kalizjan, a Optymaci i Popularzy deklarują gotowość do jednostronnego wdrażania własnych środków. Nie można jednak uzgodnić żadnego podejścia i Curia Calisiana tkwi w całkowitym impasie."

CAL_stracone_szanse: "Stracone szanse"
CAL_stracone_szanse_desc: "Wieści o sytuacji w Senacie! Propozycja Optymatów dotycząca utworzenia specjalnego urzędu kwestorskiego do spraw nadużyć ziemi publicznej doprowadziła do chwilowej odwilży w konflikcie z Popularami w Curia Calisiana, dzięki czemu Senat mógł częściowo wznowić prace nad sprawą Ager Publicus. Senatorowie zgodzili się co do potrzeby powołania administracyjnego organu antykorupcyjnego i przewidzianych w projekcie kar. \n\nNiedługo później Senat ponownie padł ofiarą chaosu i kłótni."

CAL_gniewnosc_demostenesa: "Gniewność Demostenesa"
CAL_gniewnosc_demostenesa_desc: "Konsul przemówił z żarem i pasją, wygłaszając gwałtowną filipikę przeciwko Optymatom i orzekając, że reforma Ager Publicus jest nie tylko konieczna, lecz musi zostać przeprowadzona z radykalną, nieugiętą precyzją!\n\nNiech jego słowa odbiją się echem w uświęconych salach rządów jako jasne wezwanie do boju przeciw ciemiężycielom plebejuszy! W tyglu reformy nie może być kompromisu ani litości dla tych, którzy sprzeciwiają się woli ludu.\n\nPłomienna retoryka konsula roznieca ducha buntu przeciw ustalonemu porządkowi, prowadząc Popularów ku przyszłości, w której króluje sprawiedliwość, a Ager Publicus świadczy o triumfie ludu nad tyranią!"

CAL_ubozenie_zwyklych_obywateli: "Zubożenie zwykłych obywateli"
CAL_ubozenie_zwyklych_obywateli_desc: "Wieści z Senatu! W toku reform Ager Publicus przedstawiono nową uchwałę. Wszystkie grunty objęte Ager Publicus zostaną odebrane dotychczasowym właścicielom, aby następnie równomiernie rozdzielić je między patrycjuszy. Choć na posiadłościach wielu uczciwych gospodarzy nie znaleziono dowodów poważnych przestępstw, odkryto liczne działki o rażąco zawyżonej lub zaniżonej powierzchni. Opracowana przez Popularów ustawa ma jedynie naprawić niesprawiedliwość wynikającą z widocznych prób monopolizacji gruntów przez niektórych właścicieli. Plebejuszy nieposiadających ziemi zachęca się do składania u właściwych władz wniosków o działki rolne, o ile mają doświadczenie lub kwalifikacje w pracach rolniczych."

CAL_glod_ziemi_o_stali: "Głód ziemi i stali"
CAL_glod_ziemi_o_stali_desc: "Kolejne wieści o reformie Ager Publicus! Ogłoszono najnowszy projekt Popularów. Po wejściu reformy w życie we wszystkich obecnych i przyszłych prowincjach, komicje centurialne otrzymają dodatkowe zadanie bezwzględnego egzekwowania zasad Ager Publicus. Członkowie komisji będą osobiście odpowiadać za każde naruszenie nowych praw na podległym im obszarze; kary obejmą potrącenia z wynagrodzenia, utratę stanowiska, a w skrajnych przypadkach nawet więzienie. Komisjom zostanie powierzone zwalczanie wszelkich przypadków korupcji, nepotyzmu i praktyk monopolistycznych przy użyciu wszystkich dostępnych im środków."

CAL_chaos_na_komisjach: "Chaos w zgromadzeniach!"
CAL_chaos_na_komisjach_desc: "Chaos ogarnął nasz piękny kraj, zrodzony z tumultu w Senacie wokół reformy Ager Publicus. Oto zamęt rozpostarł swe macki, oplatając nawet zgromadzenia centurialne i niższe szczeble władzy, a niekiedy przeradzając się w samosądy nad właścicielami ziemskimi.\n\nNiegdyś niewzruszone filary rządów drżą dziś pod ciężarem sporów i sprzeciwu. Walki frakcyjne rozdzierają tkankę naszego społeczeństwa, zagrażając samym fundamentom ukochanej Res Publici.\n\nW części prowincji ogłoszono STAN WOJENNY, gdyż świętość prawa i porządku wisi na cienkiej nici. Niech bogowie wybaczą naszej ukochanej Res Publice. W tych trudnych czasach zachowajcie wiarę w Ricardusa Augustusa Calisiusa, który jeszcze obdarzy nas swym rozstrzygnięciem!"

CAL_armia_obywatelska: "Kwestia Donativum"
CAL_armia_obywatelska_desc: "Sprawa Donativum, od dawna blokowana przez Senat, zostanie dziś rozpatrzona na dworze Ricardusa Augustusa Calisiusa! Oczekuje się wznowienia zwyczajowych premii dla sił zbrojnych, lecz z powodu ograniczeń budżetowych jednorazową wypłatę mogą otrzymać tylko pretorianie albo legioniści. Obie strony dostaną możliwość wyjaśnienia, dlaczego ich wierna służba Cesarzowi zasługuje na nagrodę. Wybrani obywatele o potwierdzonej lojalności i zdolności dochowania tajemnic państwowych będą mogli przysłuchiwać się obradom i poświadczyć zasadność roszczeń obu formacji."

CAL_wyzszy_zold_dla_pretorian: "Łapówka dla pretorian"
CAL_wyzszy_zold_dla_pretorian_desc: "Wieści dla kalizjańskiej Gwardii Pretoriańskiej! Cesarz Ricardus Calisius pragnie wynagrodzić wysiłki swych najwierniejszych obrońców. Gwardia otrzyma cztery beczki wybornego wina prosto z cesarskiej piwnicy oraz wielką sumę kalizjańskich denarów. Pretoriański Prefekt Christianus Cinastovicus osobiście odbierze bogactwa i rozdzieli je w swych szeregach wedle własnego uznania. Cesarz ma nadzieję, że Gwardia Pretoriańska odpłaci za ten dowód uznania i hojności dalszą, wzorową służbą."

CAL_wino_w_koszarach: "Wino w koszarach"
CAL_wino_w_koszarach_desc: "Ogłoszenie dla przedsiębiorczych Kalizjan pragnących napełnić swe sakiewki! Wszystkim obywatelom i kupcom posiadającym alkohol, wyborne jadło i orzeźwiające napoje zaleca się sprzedaż towarów w obozach pretorian! Poszukiwani są także wykwalifikowani kucharze i ulegli służący do pracy tymczasowej. Z okazji otrzymania premii Donativum odbędzie się prywatna uczta, na którą wstęp będą mieli wyłącznie posiadacze oficjalnych zaproszeń. Uwaga: w pobliżu obozów pretorian mile widziane będą jedynie osoby o nienagannych manierach. Nie próbujcie zamienić tego miejsca we własny burdel!"

CAL_wyzszy_zold_i_wieksza_dyscyplina: "Wyższy żołd, większa dyscyplina"
CAL_wyzszy_zold_i_wieksza_dyscyplina_desc: "Wieści dla legionistów Calisii! Aby wzmocnić najpotężniejsze z naszych Legionów, Cesarz Ricardus Calisius szczodrze postanowił przyznać naszym najlepszym obrońcom wielką sumę kalizjańskich denarów. Spośród wielu legatów, centurion Marcus Vinicius otrzyma największą kwotę, by jak najlepiej wynagrodzić oddanie i mężne poświęcenie Legionu Alfa w pierwszych dniach naszej wielkiej Res Publica. Wszystkie legiony mają prawo wydać uczciwie zarobione denary wedle własnego uznania, aby poprawić sprawność swych legionistów."

CAL_krew_na_piachu: "Krew na piasku"
CAL_krew_na_piachu_desc: "Wieści dla żołnierzy Calisii!\nNa rozkaz Senatu urzędnicy odpowiedzialni za wewnętrzną kontrolę sprawności i zachowania wojska mają skupić się na przywróceniu dyscypliny w naszych legionach z powodu częstych doniesień o wymykających się spod kontroli ekscesach związanych z pijaństwem, hazardem i brutalnymi bójkami. Najgorszych winowajców czeka chłosta, więzienie lub wydalenie ze służby z hańbą.\n\nW okolicach koszar ceny wina wzrosły w minionym miesiącu o 20%, podobnie jak ceny winogron, usług seksualnych i antykoncepcji! Następujący żołnierze skazani za przewinienia dyscyplinarne zostali ułaskawieni i nie wolno ich krzywdzić..."

CAL_lojalnosc_wiecznego_miasta: "Spadkobiercy Aureliana"
CAL_lojalnosc_wiecznego_miasta_desc: "Wieści dla wolnych mieszkańców Calisii!\n W związku z niedawnym rozszerzeniem Legionów wykwalifikowani weterani mogą teraz ubiegać się o przyjęcie do nowej, najnowocześniejszej Kalizjańskiej Szkoły Oficerskiej! Jako oficer nauczycie się wykorzystywać przywództwo, odwagę i honor w walce, a przede wszystkim dowodzić naszymi Legionami tak, by zwielokrotnić ich wartość bojową! Po ukończeniu nauki otrzymacie stabilne stanowisko, świetny żołd i doskonałe perspektywy w nagrodę za wysiłek włożony w edukację! Nim się obejrzycie, osiągniecie dobrobyt, a wasze żony wreszcie zobaczą w was prawdziwych mężczyzn!"

CAL_imperator_gwarantem_pokoju: "Cesarz interweniuje!"
CAL_imperator_gwarantem_pokoju_desc: "Rozwiązanie impasu w Senacie jest bliskie! Cesarz Ricardus Calisius zapowiedział osobistą interwencję w Curia Calisiana, aby dopilnować szybkiego podjęcia decyzji w sprawie nadużyć przy podziale ziemi publicznej i zarządzaniu nią. Skłóconym stronom nakazano natychmiastowe zaprzestanie dalszej wrogości oraz utrudniania procesu decyzyjnego. Jeśli Senat nie zajmie ostatecznego stanowiska, Cesarz osobiście podyktuje sposób rozwiązania sytuacji."

CAL_lex_commutationis_et_perspicuitais: "Lex Commutationis et Perspicuitatis"
CAL_lex_commutationis_et_perspicuitais_desc: "Wieści z Senatu! Z rąk Optymatów wyszła ustawa - środek ograniczonej reformy mający ukrócić korupcję i nadużycia, lecz pozbawiony okrutnej i niesprawiedliwej redystrybucji! \nEwolucja zamiast rewolucji! Prawo to dowodzi, że Senat dostrzega potrzebę reform, choć wyłącznie w granicach tradycyjnych rządów!\nNiniejszym zarządza się powołanie Urzędu Kwestorskiego, którego zadaniem będzie ochrona systemu Ager Publicus. Wszyscy podejrzani o korupcję zostaną gruntownie prześwietleni! \nBrońmy zasad uczciwości i odpowiedzialnego zarządzania, podążając ku jaśniejszej przyszłości naszej ukochanej Res Publici!"

CAL_lex_lustitiae_socialis: "Lex Iustitiae Socialis"
CAL_lex_lustitiae_socialis_desc: "Wieści z Senatu! Kierowana śmiałą wizją Popularów izba zatwierdziła ustawę o monumentalnym znaczeniu - szeroko zakrojoną reformę, która pokona korupcję i otworzy epokę bezprecedensowej równości!\nZiemia odrodzi się w płomieniach redystrybucji, zapewniając każdemu obywatelowi należny udział!\nJarzmo nierówności nie będzie już ciążyć na naszych barkach! Z radosnym zapałem witamy nowy świt, w którym zapanują sprawiedliwość i prawość!\nNadzór przechodzi w ręce zgromadzeń centurialnych, dając ludowi władzę ochrony naszego wspólnego dziedzictwa!"

### DRUGIE DRZEWKO ###

CAL_order_behind_prosna: "Alea Iacta Est!"
CAL_order_behind_prosna_desc: "Przeżarte rozkładem germańskie Eurokomisariaty wreszcie upadają! Garnizon w Iarotinie opustoszał, a ziemie za Prosną pogrążyły się w chaosie. \nNasz czcigodny Cesarz Ricardius Augustus Calisius postanowił przekroczyć Prosnę i odbić zachodnią część naszego wiecznego miasta! Legaci pospiesznie prowadzą legiony przez granicę, gdyż nie tylko my spoglądamy w tym kierunku! Hordy barbarzyńskich Scytów i Sarmatów z północy także zapuszczają się w głąb germańskich ziem.\nZ ostrzami wzniesionymi wysoko ku niebu i sercami płonącymi duchem wolności pokonamy wrogów, przywrócimy Calisii należną chwałę i obrócimy wniwecz resztki barbarzyńskich ciemiężycieli kalających nasze ukochane zachodnie ziemie!"

CAL_regrouping_on_west: "Przegrupowanie na zachodzie"
CAL_regrouping_on_west_desc: "Legioniści! Dobrze służyliście Cesarstwu, lecz obowiązek ponownie wzywa, a Res Publica potrzebuje was wszystkich do swej obrony! Barbarzyńskie wodzostwa na naszych zachodnich rubieżach szykują się do wojny i wkrótce ich bezlitosne, niezdyscyplinowane fale rozbiją się o nasz Limes. Pragną palić i grabić; tylko Jowisz wie, jaki chaos nastanie, jeśli im na to pozwolimy! Legat Vinicius nakazuje wszystkim zdolnym do walki mężczyznom stanąć w obronie wszystkiego, co im drogie, i natychmiast ruszyć do obozów na froncie! Odeprzemy ich, zepchniemy tam, skąd przybyli, i sprawimy, że pożałują dnia, w którym ośmielili się zmierzyć z potęgą Calisii!"

CAL_steppe_savages: "Stepowi dzikusi"
CAL_steppe_savages_desc: "Czasy nieustannych sarmackich najazdów dobiegają końca! Cesarz wysłuchał waszych próśb o zemstę. Błyskawiczna kampania skruszy scytyjskie jarzmo i ucywilizuje step. Wszystkich obywateli prosi się o wsparcie wysiłku wojennego. Tych, którzy nie mogą wstąpić do wojska, usilnie zachęca się do przekazania wolnych środków miejscowemu urzędowi zbiórek. \n\nMieszkańcy ziem przygranicznych powinni niezwłocznie ewakuować się na czas konfliktu. Przed wyjazdem mają pozostawić w bezpiecznych miejscach odpowiednie zapasy dla nadciągających legionów. Potęga kalizjańskiej armii zapewni nam druzgocące zwycięstwo."

CAL_triumph_in_mercuria_maior: "Triumf w Mercuria Maior"
CAL_triumph_in_mercuria_maior_desc: "Wielkie zwycięstwo na froncie zachodnim! Nasze dzielne legiony pokonały dzikie, barbarzyńskie plemiona Sarmatii, przynosząc regionowi pokój w imieniu Cesarza! Radujcie się, gdyż granice cywilizacji rozciągają się teraz i na nieujarzmione równiny. Chętni koloniści i administratorzy otrzymają wsparcie, aby pomóc w przejściu regionu pod cesarskie władanie. \n\nWszyscy są dziś zaproszeni na uroczystości, by zobaczyć, jak Koniarze korzą się przed potęgą naszej Res Publici. Zobaczycie jak upokorzony wódz osobiście zabawia nasze legiony podczas ich triumfalnego powrotu do Calisii!"

CAL_cavalry_experience: "Kasta Ekwitów"
CAL_cavalry_experience_desc: "Na mocy dekretu Cesarza Ricardusa Augustusa Calisiusa w mieście Equestria zostaną utworzone nowe legiony nieposkromionych konnych wojowników. Każdy kandydat musi zdobyć własnego konia albo przekazać miejscowemu centurionowi odpowiednią liczbę denarów na zakup w jego imieniu. Oddziały Ekwitów będą szkolone przez scytyjskich weteranów, którzy poddali się Calisiusowi po kapitulacji swego upadłego państwa. Od Ekwitów oczekuje się nienagannego zachowania i stanowienia wzoru dla wszystkich legionistów."

CAL_triumph_in_equestria: "Triumf w Equestrii"
CAL_triumph_in_equestria_desc: "Wieści z frontu!\nDziś wizja libertariańskiego chaosu znana jako Złota Wolność obróciła się w pył i została sprowadzona do roli szyderczych rekwizytów w triumfalnych pochodach Calisii! Triumf świętuje nie tylko nasz podbój, lecz także zwycięstwo porządku nad chaosem, możliwość niesienia naszych sprawiedliwych praw na nowe rubieże oraz rychły dzień powrotu armii z łupami. Z tej okazji dzień ogłoszono świętem wolnym od wszelkiej zbędnej pracy. Przyjdźcie zobaczyć barbarzyńców i ich króla-minstrela oraz skosztować darmowych mocnych trunków ufundowanych przez Cech Bimbrowników."

CAL_triumph_in_lessna_polonorum: "Triumf w Lessna Polonorum"
CAL_triumph_in_lessna_polonorum_desc: "Raport z zachodnich rubieży! Siły legata Viniciusa, z błogosławieństwem Marsa i w imię Junony, całkowicie podporządkowały sobie dzikie wodzostwo Lessny. Jutro do stolicy ma przybyć tabor łupów wraz z pokaźną grupą nowych Servi. Licytacja będzie otwarta dla znamienitych obywateli i obejmie wszystkich pojmanych barbarzyńców poza tymi zarezerwowanymi dla areny. \n\nLegiony pozostaną na tym terytorium aż do jego pełnego włączenia w cesarską biurokrację. Po zneutralizowaniu ostatnich ognisk barbarzyńskiego oporu ziemie wejdą w skład struktur administracyjnych większej prowincji. W międzyczasie mile widziane są ofiary za dalszą pomyślność legata."

CAL_commission_papers: "Przejęcie majątków Leszczyńskiego"
CAL_commission_papers_desc: "Niezwłocznie zostanie przejęty majątek barbarzyńskiego uzurpatora! Komisja senacka rozpoczęła parcelację ziem na nowych zachodnich rubieżach Calisii, które zostaną przekazane weteranom kampanii oraz ludziom wielkiej rangi zasłużonym dla wysiłku wojennego. \n\nZgłoście swe roszczenia i szczegółowy wykaz zasług magistratowi prowincji, aby otrzymać część odpowiadającą waszemu wkładowi. Do każdego nadania dołączony zostanie dokładny rejestr ziemi, zwierząt gospodarskich i służby wchodzących w skład darowizny. Niech posłużą wam do pomnażania dobrobytu naszego Cesarstwa! Ave Calisia!"

CAL_calisian_region: "Veni, Vidi, Vici"
CAL_calisian_region_desc: "W uznaniu spełnienia naszych cesarskich ambicji Cesarz Ricardus Calisius ogłosił miesiąc uroczystości w całym państwie! Na czas świętowania wszyscy obywatele otrzymają hojną sumę denarów. Działalność handlowa zostanie ograniczona do niezbędnych dziedzin, a udział w zaplanowanych hulankach jest oczekiwany. \n\nWszyscy winiarze otrzymają ryczałtową zapłatę za udostępnienie całych zapasów do użytku publicznego. Na głównym placu wkrótce rozpocznie się wielka libacja ku czci naszych dzielnych legionów. Uczestnikom zaleca się ograniczenie niszczenia mienia publicznego do akceptowalnego minimum."

CAL_early_elections: "Przedterminowe wybory"
CAL_early_elections_desc: "Na mocy suwerennego mandatu naszego czcigodnego Cesarza dostojne sale Senatu przejdą przemianę ku niezrównanej wspaniałości i jeszcze pełniejszej reprezentacji ludu. Zgromadzenie nie będzie już ograniczone do stu głosów; odtąd Senat wzbogaci się o pięćdziesięciu nowych członków, osiągając imponującą liczbę 150. Wybory odbędą się w pierwszą niedzielę po Mercuraliach!\n\nAby jednak dołączyć do tego szlachetnego chóru, trzeba posiadać kalizjańskie obywatelstwo, ukończyć trzydzieści zim, mieć majątek o wartości co najmniej 10 000 denarów, wypełnić obowiązek służby i nie dopuścić się ciężkich przestępstw. Bankierzy, kupcy i wszyscy przedsiębiorcy pragnący kandydować muszą przekazać swą działalność Cesarstwu.\nNiewolnicy i wyzwoleńcy nie mogą kandydować."

CAL_appointing_new_officials: "Powołanie nowych urzędników"
CAL_appointing_new_officials_desc: "Cesarz zarządził rozszerzenie Senatu. Wybory dobiegły końca, teraz zaś potrzebujemy urzędników - konsulów, trybunów, pretorów i prefektów. Miejcie się jednak na baczności, bo frakcje walczą o te stanowiska. Optymaci i Popularzy zaciekle rywalizują o władzę, a część ich wewnętrznych walk może rozlać się na ulice. Uważajcie na polityczne bojówki, które mogą działać, dopóki wszystkie stanowiska nie przypadną nowej frakcji rządzącej.\n\nTylko Junona wie, która frakcja zapanuje odtąd w salach Senatu, a my, pokorni słudzy Res Publici, musimy poczekać, aż opadnie bitewny kurz.\n\nBo nie wiem, kto mi za to zapłaci..."

CAL_factions_are_restless: "Niespokojne frakcje"
CAL_factions_are_restless_desc: "Nowy podział niedawno podbitych ziem rodzi liczne spory, choć zacny lud Calisii wciąż dochodzi do siebie po sezonie wojennym! Obywatele winni wiedzieć, że skargi i odwołania prawne dotyczące starych, wciąż trwających waśni frakcyjnych oraz nowych umów w sprawie podziału świeżo zdobytej ziemi i praw do niej zapchały wokandy sądowe już od ponad miesiąca! Zamiast ulegać krótkowzroczności i prostackiemu pieniactwu, obywatele proszeni są o rozstrzyganie sporów poza sądem. W miarę możliwości usilnie zaleca się, by przemoc nie była pierwszym środkiem."

CAL_assimilated_velites: "Zasymilowani Welici"
CAL_assimilated_velites_desc: "Wieści dla mieszkańców Ostrovii i Campno! Wszystkich niezatrudnionych czynnie w służbie państwa i jego cechów wzywa się do porzucenia nieformalnej, niezorganizowanej pracy i zaciągnięcia do miejscowego legionu, założonego osobiście z rozkazu wielkiego Ricardusa Calisiusa! Każdy, kto przybędzie wysłuchać słów naszych centurionów werbunkowych, otrzyma bezpłatne piwo, wino i gorzałkę! Uprzedzamy jednak, że od osób korzystających z darmowych trunków oczekuje się zaciągnięcia do służby. Zapiszcie się już dziś po dobre i chwalebne życie!"

CAL_barbarian_equipment: "Barbarzyński ekwipunek"
CAL_barbarian_equipment_desc: "Włóczędzy i szabrownicy z Kesselbergu oraz wszystkich ziem podległych niegdyś germańskim garnizonom mają przyjąć do wiadomości, że łupy odzyskane po bitwie zostają niniejszym uznane za własność państwową Cesarstwa. Na rozkaz samego Ricardusa Calisiusa wszelkie zagrabione kosztowności w ich posiadaniu muszą zostać zwrócone do najbliższego posterunku legionu! Osoby, które szybko dostarczą znaleziska, otrzymają za trud zapłatę w sestercjach. Przynieście wszystko, nawet rzeczy niewiele warte ponad złom - niech legiony osądzą, co nadaje się do użytku."

CAL_ask_vinicius_to_train_the_new_legions: "Apel do Viniciusa o wyszkolenie nowych legionów"
CAL_ask_vinicius_to_train_the_new_legions_desc: "Na mocy dekretu Senatu Marcus Vinicius został wezwany do świętego obowiązku sformowania i wyszkolenia nowych legionów na niedawno podbitych ziemiach. Dzięki sile jego męstwa i mądrości dowodzenia legiony te staną się bastionem potęgi naszego państwa, chroniąc dobrobyt i bezpieczeństwo przed germańskimi hordami, które wciąż czają się w cieniu!\n\nLegiony wystawione w Ostrovii i Campno zostaną wyszkolone i wyposażone zgodnie ze standardami godnymi żołnierzy Cesarstwa. W razie potrzeby z pewnością będą bronić naszego Wiecznego Miasta do ostatniego człowieka!"

CAL_open_up_gladiator_pits: "Otwarcie aren gladiatorów"
CAL_open_up_gladiator_pits_desc: "Prawdziwy dramat!! Prawdziwa akcja!! Prawdziwy rozlew krwi!! Ku uciesze wszystkich Cesarz Ricardus Calisius postanowił sponsorować turnieje gladiatorów w całej naszej ukochanej Res Publice. Jeńcy wojenni i inni drobni przestępcy mogą zgłosić się do walk, zyskując szansę na odzyskanie wolności i podbicie serc widowni. Żądni chwały Kalizjanie i Kalizjanki również mogą stanąć do zawodów, jeśli uważają się za godnych próby. Każdy wojownik otrzyma zakwaterowanie, regularne posiłki i podstawowe wyposażenie."

CAL_the_first_provincia: "Pierwsza Provincia"
CAL_the_first_provincia_desc: "Wojna dobiegła końca! Legiony wracają do Calisii zwycięskie po kampanii na zachodzie! Ziemie po zachodniej stronie Prosny zostaną włączone do biurokracji naszej Res Publici jako pierwsza z Provinciae. Okazując jednak wielką łaskawość, Cesarz Ricardus Augustus Calisius zarządził utworzenie prefektury w najbardziej wysuniętej na południe części nowych ziem. Nie będzie ona zarządzana bezpośrednio z Calisii, lecz przez Gwardię Pretoriańską, podobnie jak ziemie przyznane wcześniej Legionowi Alfa. Prefektura otrzyma częściową autonomię w sprawach wewnętrznych, lecz prawo kalizjańskie zawsze będzie miało pierwszeństwo przed miejscowymi ustawami. To zwycięstwo jest pierwszym z wielu nadchodzących dni chwały! Chwała Cesarzowi, chwała Res Publice!"

CAL_reconnect_the_eternal_city: "Ponowne zjednoczenie Wiecznego Miasta"
CAL_reconnect_the_eternal_city_desc: "Calisia znów jest zjednoczona! Barbarzyńscy uzurpatorzy nie są w stanie już zagrozić Wiecznemu Miastu. Barykady i wieże obronne wzniesione nad Prosną mają zostać usunięte w ciągu trzech tygodni. Po zakończeniu porządków natychmiast rozpoczną się naprawy i odbudowa mostów, a dalsze projekty renowacji miasta ruszą bez zwłoki. Wspaniała parada legionistów przekroczy pierwszy naprawiony most ku chwale naszej Res Publici."

CAL_nationalization_of_industry: "Nacjonalizacja przemysłu"
CAL_nationalization_of_industry_desc: "Cały przemysł niedawno podbitych prowincji, dotąd pracujący dla germańskich najeźdźców, zostanie włączony w ramy gospodarcze naszego Cesarstwa. Robotnicy pragnący zachować posady muszą zdać egzamin obywatelski sprawdzający wiedzę i wartości niezbędne do asymilacji z naszym wyższym społeczeństwem albo dobrowolnie przyjąć służbę kontraktową. Ponadto wszyscy barbarzyńscy przedsiębiorcy zostaną wywłaszczeni, a nadwyżka bogactwa rozdzielona między obywateli Calisii. Tak brzmi dekret naszego czcigodnego Cesarza Ricardusa Augustusa Calisiusa, kierowanego swoim łaskawym sercem.\n\nNiewolnicy i wyzwoleńcy nie są uprawnieni do tej darowizny."

CAL_constitutio_calisiana: "Constitutio Calisiana"
CAL_constitutio_calisiana_desc: "Wiedzcie, obywatele potężnego Cesarstwa Kalizjańskiego, że na mocy dostojnego dekretu naszego czcigodnego Cesarza podbite krainy zostają odtąd uświęcone w świętych granicach naszego wspaniałego dominium.\n\nNiech zostanie jasno i uroczyście ogłoszone, że mieszkańcy nowo przyłączonych ziem otrzymają zaszczytny przywilej kalizjańskiego obywatelstwa, jeśli okażą wierność Cesarstwu, posłuszeństwo prawom i niezachwiane oddanie wspólnemu dobrobytowi.\n\nZ otwartymi ramionami i sercami pełnymi wielkoduszności przyjmujemy nowo odnalezionych braci do naszego szlachetnego Cesarstwa i ślubujemy trwać zjednoczeni. Wszyscy uprawnieni obywatele otrzymają również darowizny na odbudowę po latach tyranii germańskich barbarzyńców. Niech żyje Ricardus Augustus Calisius!"

CAL_appropriation_of_church_holdings: "Przejęcie majątku Kościoła"
CAL_appropriation_of_church_holdings_desc: "Szlachetny Senat i Cesarz ogłosili edykt w sprawie nadmiarowych katolickich dóbr kościelnych. Odtąd zbędne ziemie i posiadłości Kościoła będą rozdzielane między ludność, zapewniając uczciwość i równość w całym ukochanym kraju.\n\nNiech wszyscy wiedzą, że dekret ten nie zwiastuje represji ani ataku na wiernych. Jest szlachetnym przedsięwzięciem mającym zapewnić sprawiedliwość wszystkim obywatelom Calisii bez względu na wyznanie i pozycję.\nCi, którzy długo trudzili się pod jarzmem ubóstwa, otrzymają należny udział, a potęga Kościoła pozostanie nienaruszona, a jedynie sprawiedliwiej rozdzielona.\n\nWszystkich obywateli uprasza się, aby kpiny z katolików i ich jedynego Boga ograniczyli do odpowiedniego minimum."

CAL_expansion_of_ager_publicus: "Rozszerzenie Ager Publicus"
CAL_expansion_of_ager_publicus_desc: "Oto zgodnie z prawami naszego czcigodnego Senatu system Ager Publicus rozszerza się na ziemie podbite na Eurokomisariatach.\n\nWy, którzy pragniecie udziału w tych żyznych ziemiach, słuchajcie wezwania! Obywatelstwo, służba w legionach oraz lojalność wobec szlachetnego Senatu i Cesarza będą rozstrzygać o przydziale tych cennych terytoriów. Ci, którzy służyli z honorem i męstwem w kalizjańskich legionach, otrzymają pierwszeństwo wyboru ziemi. Udokumentowany wkład w dobrobyt Cesarstwa zostanie przychylnie oceniony. Każdy odbiorca ziemi musi zobowiązać się do przestrzegania praw i przepisów miejscowych komisji oraz odpowiedzialnego zarządzania nowym majątkiem.\n\nUwaga! Ziemię z Ager Publicus mogą otrzymać wyłącznie obywatele Calisii."

CAL_creation_of_collegia: "Collegia"
CAL_creation_of_collegia_desc: "Wielki dzień w Calisii! Senat przychylił się do wniosku o usankcjonowanie tworzenia kolegiów! Ludzie wszelkiej profesji mogą od teraz zrzeszać się w legalne stowarzyszenia zarówno cywilne, jak i religijne a nawet i militarne. Już od rana w centralnym urzędzie utworzyły się gargantuiczne kolejki w celu zarejestrowania organizacji.\n\nPrzechodząc do ogłoszeń, kolegium piekarzy ogłasza że na Złotym Rogu otwierają ponownie piekarnię tylko dla prawdziwych Calisian. Collegium Vinariorum ogłasza że zostali sponsorem trunków na tegorocznych Bachanaliach i zaprasza do wpłacania składek na ufundowanie Świątyni Bachusa. Collegium...zbieraczy złomu...ogłasza wielkie religijne sprzątanie miasta ze złomu by przeznaczyć je na datki świątynne...następnie...Collegium cór Koryntu...ehm... może wystarczy na dzisiaj."

CAL_legions_march_on_north: "Legiony maszerują na północ"
CAL_legions_march_on_north_desc: "W północnych municipiach ogłoszono stan wojenny! Dla bezpieczeństwa zamieszkujących region obywateli Calisii zarządzono rozmieszczenie legionistów. Na nadchodzące miesiące należy zgromadzić nadwyżki żywności, gdyż na horyzoncie zbiera się wojna. Wszystkim zdolnym zaleca się wspomaganie stacjonujących legionów wszelkimi dostępnymi sposobami, w tym zapewnienie im schronienia i racji na czas rozmieszczenia. W najbliższych tygodniach obowiązywać będzie godzina policyjna, której wolno nie przestrzegać tylko w wyjątkowo ważnych okolicznościach. Wszelkie podejrzane działania i przypadki dostrzeżenia mężczyzn w strojach z późnego średniowiecza należy zgłaszać właściwym władzom."

CAL_land_of_tyrants: "Ziemia tyranów"
CAL_land_of_tyrants_desc: "Z błogosławieństwem bogów i na rozkaz naszego szlachetnego Imperatora nasze piękne miasto prowadzi teraz wojnę z despotycznym królem Gnesny! Nasze elitarne legiony pod dowództwem najlepszego legata tych ziem torują sobie drogę do barbarzyńskiej stolicy. Każdy prawy obywatel, który odkryje działalność partyzantów wodzostwa, ma obowiązek wyrządzić im krzywdę, jeśli tylko jest w stanie! Z tego powodu tymczasowo obowiązuje godzina policyjna. Każdy znaleziony na ulicy po zmroku zostanie uznany za wrogiego kolaboranta i natychmiast zabrany na konieczne przesłuchanie. Niech żyje Imperator Ricardus, zbawca Calisii!"

CAL_triumph_in_gnesna: "Triumf w Gnesnie"
CAL_triumph_in_gnesna_desc: "Wieści dla wszystkich obywateli miasta Gnesna! Triumf odbędzie się w najbliższą sobotę. Nasze siły zbrojne przemaszerują dostojnie ulicami pięknego miasta, prezentując zwycięską broń, żołnierzy i podbitych barbarzyńców! Wyparty z kolebki narodu Wenedów barbarzyński król ukaże się wszystkim obywatelom w swej hańbie. Jego niecywilizowane oblicze zostanie nieco złagodzone, aby nie zepsuło smaku bezpłatnych trunków ufundowanych przez Cech Bimbrowników.\nCech Bimbrowników pędzi wyłącznie najlepsze mocne trunki. Prawdziwa kalizjańska gorzałka dla prawdziwych Kalizjan."

CAL_auxilia_gnesnesis: "Auxilia Gnesnesis"
CAL_auxilia_gnesnesis_desc: "Cesarz okazał łaskę! Pokonani przywódcy Gnesny i jej dawnych państw marionetkowych otrzymali ułaskawienie. Nagrody za ich głowy zostały cofnięte, a jeśli zostaną odnalezieni żywi, należy niezwłocznie doprowadzić ich na Dwór Cesarski. \n\nWszyscy mieszkańcy Gnesny i okolic zostaną wdrożeni w kalizjański sposób życia, a ci, którzy pomyślnie się zintegrują, otrzymają pełne obywatelstwo. Dowódcom wrogich państw nakazuje się dobrowolne stawienie w najbliższej placówce na reedukację. Nieposłuszeństwo będzie skutkować natychmiastowym wygnaniem."


### TRZECIE DRZEWKO - POLITYKA ###

CAL_calisia_aeterna_victrix: "Calisia Aeterna Victrix!"
CAL_calisia_aeterna_victrix_desc: "Obywatele Calisii! Popadliśmy w samozadowolenie! Wykopaliśmy okopy na brzegach Prosny, spodziewając się niekończącego oblężenia przez barbarzyńców. Zawsze wiedzieliśmy, że w końcu ich wyprzemy, lecz nie sądziliśmy, że nastąpi to tak szybko. Nasze elity nie przygotowały po prostu planu zarządzania rozległymi nowymi ziemiami pod naszą kontrolą. Nie rozpaczajcie jednak, gdyż senatorowie mają mnóstwo pomysłów na reformy, które pozwolą rozwiązywać problemy natychmiast po ich wystąpieniu i dadzą nam większą elastyczność. Czekajcie na kolejne wiadomości, które szczegółowo przedstawią nadchodzące zmiany. I pamiętajcie: już przejęliśmy ziemie barbarzyńców! Nie pozwolimy, by wymknęły nam się z rąk wskutek zaniedbań administracyjnych."

CAL_emperors_feast: "Uczta Cesarza"
CAL_emperors_feast_desc: "Drodzy Obywatele! Dzisiaj wieczorem w nowo wybudowanym pałacu cesarskim odbędzie się uczta, która pojedna zwaśnione frakcje senackie. Będą tam konsultowane najpoważniejsze sprawy wagi państwowej, które niezwłocznie wymagają rozmowy wszystkich najważniejszych ludzi w Imperium. Reprezentanci Optymatów, Popularów, legaci cesarscy, prefekci, trybuni - wszyscy zasiądą jak równi z równymi by wspólnie debatować o tym, w jaki sposób polityka może nas łączyć jednym celem - dobrem o nasze Imperium.\n\nWstęp oczywiście tylko dla zaproszonych, ale Cesarz postanowił że wszelkie pozostałości z uczty zostaną rozdane najbardziej potrzebującym obywatelom, jest to wspaniałomyślne pokazanie, że w naszym imperium władza troszczy się o wszystkich i odrzuca jakiekolwiek elitarystyczne hedonistyczne podejścia.\n\nNa efekty nie trzeba będzie długo czekać, już niedługo połączonymi siłami wszystkich politycznych sił będziemy szli po zwycięstwo! Ave Ricardus Augustus Calisius!"

CAL_arte_et_marte: "Arte et Marte"
CAL_arte_et_marte_desc: "Uwaga, wszyscy chorujący na biedę artyści i sławni mistrzowie twórczego świata! Cesarz otacza osobistym mecenatem ludzi biegłych w klasycznym pięknie, którzy mistrzowskim pędzlem potrafią uchwycić najsubtelniejsze szczegóły życia. Odrzućcie dekadenckie wpływy modernizmu, przyczyńcie się do odrodzenia prawdziwej doskonałości artystycznej i zdobądźcie sowicie opłacone zamówienia! Dowiedźcie swej wartości i dostąpcie zaszczytu uwiecznienia majestatycznego oblicza Jego Cesarskiej Łaskawości Ricardusa Calisiusa na naturalnej wielkości portrecie, który ozdobi główną salę Pałacu. Zapiszcie się w historii sztuki jako pierwsze pokolenie ruchu neokalizjańskiego!"

CAL_per_aspera_ad_astra: "Per Aspera ad Astra"
CAL_per_aspera_ad_astra_desc: "Obywatele! Gdy po raz pierwszy stanęliśmy w obliczu fundamentalnego kryzysu, wiara kalizjańskiego ludu pozostała niezachwiana. Ricardus Calisius dostrzegł żelazną wolę mieszkańców i pragnie podziękować tym, którzy pomogli nam przejść przez niebezpieczeństwa. W hołdzie ich cnocie zarządził zatem, że każdy obywatel Calisii otrzyma ze skarbca publicznego sumę 100 denarów! Oferta nie obejmuje niewolników ani wyzwoleńców. Ponadto 2000 zasłużonych rodzin otrzyma gospodarstwa na ziemiach publicznych wokół Equestrii. Zachowajcie ufność w Cesarzu, a zbierzecie należną nagrodę!"

CAL_heirs_to_the_empire: "Spadkobiercy Cesarstwa"
CAL_heirs_to_the_empire_desc: "Przełomowe odkrycie senatora Ilscusa! Skrupulatne prześledzenie geopolitycznego rodowodu Cesarstwa Rzymskiego i jego państw sukcesyjnych ujawniło wyraźną linię łączącą Calisię z czasami Augusta! Jako jedyny naród wierny chwalebnym tradycjom upadłych przodków odziedziczyliśmy rzymski tytuł i teraz każdy z nas musi nieść pochodnię cywilizacji przez jej trzecie tysiąclecie! \n\nNa cześć odkrycia 21 kwietnia zostanie ogłoszony świętem państwowym. Obywatele nie będą już mogli używać niekalizjańskich imion! Wszystkie klasy społeczne mają zachowywać się z wdziękiem godnym spadkobierców Rzymu. Naruszenia tej zasady nie będą tolerowane."

CAL_civilization_imperative: "Imperatyw cywilizacyjny"
CAL_civilization_imperative_desc: "Misja cywilizacyjna została uświęcona jako fundamentalna zasada! Odtąd barbarzyńcy wzorowo służący Cesarstwu otrzymają drogę do obywatelstwa. W każdej colonii na nowo włączonych ziemiach powstaną amfiteatry, świątynie i termy. Kalizjańska administracja i obyczaje dotrą do każdego zakątka państwa, a programy kulturalne będą prowadzone aż do dostatecznego oświecenia miejscowej ludności. \n\nWeterani barbarzyńskiego pochodzenia mają zgłosić się do odpowiedniej jednostki w celu potwierdzenia przebiegu służby. Indywidualne zasługi zostaną należycie uwzględnione. Urzędnicy mogą składać wnioski po 3 latach. Rozpatrywane będą również inne zasługi."

CAL_calisia_semper_invicta: "Calisia Semper Invicta!"
CAL_calisia_semper_invicta_desc: "Ku czci Jego Cesarskiej Łaskawości Ricardusa Calisiusa zwołano uroczysty pochód! Wszystkie legiony wezwano do Wiecznego Miasta i przybędą w ciągu nadchodzącego tygodnia. Podczas wydarzenia wojsku towarzyszyć będzie kolumna cywilna złożona z obywateli, wyzwoleńców i niewolników. Obecność jest obowiązkowa. Nieobecności zostaną odnotowane i przykładnie ukarane. \n\nTego dnia wymagany jest odpowiedni strój wysokiej jakości. Wszystko poniżej tego poziomu zostanie uznane za bezpośrednią zniewagę Cesarza. U stóp Pałacu Cesarskiego należy pozostawić dary o wartości stosownej do własnej pozycji. Służący muszą podążać za panami podczas pochodu i mogą zostać swobodnie ofiarowani, jeśli taka będzie ich decyzja."

CAL_pax_calisiana: "Pax Calisiana?"
CAL_pax_calisiana_desc: "Przewidziano wysoką nagrodę za sprowadzenie wszystkich zbiegłych lub uprowadzonych chłopów pańszczyźnianych z Ravitium z powrotem na pola. Informujemy, że we wszystkich miastach liczących ponad 4000 mieszkańców obowiązuje godzina policyjna; każdy znaleziony na ulicy po zachodzie słońca zostanie poddany doraźnemu osądowi. Cech Karczmarzy ogłasza, że bójki wywołane sporami politycznymi nie będą tolerowane, a wszystkim schwytanym awanturnikom zostaną postawione zarzuty! Niech żyje nasz wielki Cesarz Ricardus Calisius, strażnik pokoju i zbawca ziem! Jego łaskawa wola zapewni powszechny dobrobyt i kres wszelkiej przemocy!"

CAL_provincial_industria: "Prowincjonalna industria"
CAL_provincial_industria_desc: "Ważne wieści! Po długich obradach mądry Cesarz i jego zaskakująco zgodni doradcy ustalili, gdzie i kiedy cesarscy budowniczowie rozpoczną ambitne dzieło przemiany kalizjańskiej prowincji! Ustalono, że luksusy cywilizacji przypadną nie tylko rodowitym Kalizjanom, lecz również nowo podporządkowanym Wenedom, Germanom, Scytom i Żydom! Niech wszystkie ludy kąpią się w chwale Industria Calisiana! Wkrótce ruszy mozolna praca budowniczych i inżynierów. Proszę wszystkich obywateli i poddanych: nie przejmujcie się hałasem budowy. Inaczej nie da się osiągnąć postępu. W najgorszym razie zatkajcie uszy i myślcie o chwale Calisii."

CAL_developing_our_agriculture: "Rozwój naszego rolnictwa"
CAL_developing_our_agriculture_desc: "Obywatele! Kierując się wizją postępu i dobrobytu, państwo podejmuje szlachetną inicjatywę wspierania rolników i zwiększania wydajności sektora rolnego. Cesarstwo wprowadza dotacje i programy wsparcia dla naszych ciężko pracujących gospodarzy. Zapewnią one pomoc finansową, dostęp do szkoleń i zasobów oraz wskazówki dotyczące zrównoważonych metod uprawy. Rozszerzymy także programy edukacji rolniczej, oferując kompleksowe szkolenia i materiały zarówno początkującym, jak i doświadczonym rolnikom.\n\nDobrze prosperujące rolnictwo oznacza bezpieczeństwo żywnościowe, stabilność gospodarczą i tętniącą życiem wieś dla wszystkich obywateli Calisii. Przede wszystkim jednak oznacza prawdziwe kalizjańskie zboże na prawdziwy kalizjański chleb, dostarczany wyłącznie przez Cech Młynarzy i wyłącznie prawdziwym Kalizjanom."

CAL_agricultoris_mechanicus: "Agricultoris Mechanicus"
CAL_agricultoris_mechanicus_desc: "Kalizjanie! Dzisiejszego dnia ogłaszamy ważną decyzję w sprawie wsparcia rolników i zwiększenia wydajności rolnictwa. Przestarzałe metody ustąpią mechanizacji, a najnowocześniejsze maszyny podniosą sprawność i produkcję w całej rolnej domenie Ager Publicus.\n\nPaństwo obiecuje dotacje i programy pomocy przy zakupie nowoczesnego sprzętu. Inicjatywy te zapewnią nie tylko wsparcie finansowe, ale też wiedzę techniczną, coroczne przeglądy oraz łatwy dostęp do części zamiennych i warsztatów. Nasza gałąź Mechanicus z pewnością chętnie pomoże i pokaże ludowi cud maszyn oraz wydajności, jaką przyniosą błogosławionym polom Matki Terry."

CAL_integral_migration: "Migracja wewnętrzna"
CAL_integral_migration_desc: "Wiadomość dla wszystkich nowo przybyłych do stolicy i okolic! Rada miejska Calisii wita was i uczyni wszystko, co w jej mocy, aby zapewnić mieszkania oraz niezbędne usługi ułatwiające przywyknięcie do życia w Wiecznym Mieście. Zarejestrujcie się w najbliższym punkcie przyjęć, aby uwzględniono was przy podziale podstawowych dóbr. \n\nDo czasu wybudowania stałych mieszkań zapewnimy tymczasowe kwatery na obrzeżach miasta. Prosimy nie rozbijać obozowisk na ulicach dzielnic wewnętrznych. Patrole pretorian będą przeprowadzać regularne nocne kontrole, a każde niezatwierdzone schronienie zostanie usunięte wraz z lokatorem."

CAL_barbarian_migration: "Eksodus barbarzyńców"
CAL_barbarian_migration_desc: "KALIZJANIE! OGŁOSZENIE SPECJALNE! PILNE WIEŚCI! ZACHÓD UPADŁ!\nGERMANIA ROZPADŁA SIĘ NA TYSIĄCE WOJUJĄCYCH ZE SOBĄ PLEMION. NATURĄ BARBARZYŃCÓW JEST POŻERAĆ SIĘ WZAJEMNIE POŚRÓD ZGLISZCZ WŁASNYCH OSAD. \n\nLECZ STRZEŻCIE SIĘ! BARBARZYŃCY NADCIĄGAJĄ KU NASZYM ZIEMIOM! ICH ODÓR ZATRUJE WSZYSTKIE MIASTA, ICH DŁONIE ZŁUPIĄ CALISIĘ I STRATUJĄ JEJ GLEBĘ! PRAGNĄ ROZCIĄĆ NASZ ŚWIAT OSTRZEM! ICH RYK BUDZI GROZĘ I JEST RÓWNIE WSTRĘTNY JAK ICH IMIONA! \n\nALE NIE LĘKAJCIE SIĘ, GDYŻ TYLKO POD SZTANDAREM BYKA ZNAJDZIECIE OCHRONĘ! CESARZ NIE POZWOLI HORDOM SPUSTOSZYĆ NASZEJ ZIEMI. DLATEGO W CESARZU I CESARSTWIE POKŁADAMY OBRONĘ I SZUKAMY ZBAWIENIA!"

CAL_minerals_of_mother_terra: "Minerały Matki Terry"
CAL_minerals_of_mother_terra_desc: "Ludu Equestrii! Mądry Calisius zwrócił wzrok ku tej ziemi, którą Matka Terra pobłogosławiła obfitymi bogactwami ukrytymi pod powierzchnią. Zamierza w pełni wykorzystać ich potencjał przez odbudowę i rozbudowę istniejących kopalń węgla. Co więcej, planuje rozpocząć wydobycie licznych złóż gazu ziemnego ukrytych w regionie. Equestria wkrótce będzie szczycić się własnymi dostawami gazu, niezależnymi od Constanii, Costianu, Castry czy Pirum, zyskując prestiż i dobrobyt. A teraz kopcie! Kopcie ku bogactwu Calisii i Equestrii! Kopcie aż do Hadesu!"

CAL_central_portus_of_konin: "Centralny Portus Equestrii"
CAL_central_portus_of_konin_desc: "Obywatele i poddani Calisii! Wielce zaradny Imperator Ricardus Calisius uznał miasto Equestria za godne roli bijącego serca przemysłu stoczniowego Res Publica, które będzie wtłaczać statki w rzeczne arterie Polonii. Dzięki rozmiarom i położeniu jest to odpowiednie miejsce na wielki Portus dorównujący starożytnej Ostii. Za sprawą pobliskiego Canalis Slesinicensis nasi kupcy i flota będą mogli żeglować przez Viadrus i Wisłę aż do Mare Balticum. Wszystkim chętnym żeglarzom z Urbs Calisia zaleca się przeprowadzkę do Equestrii, aby w przyszłości zapewnić wykwalifikowaną siłę roboczą. Niech Neptun błogosławi naszym morskim przedsięwzięciom!"

CAL_our_iron_railways: "Nasze żelazne koleje"
CAL_our_iron_railways_desc: "Powstańcie, obywatele, i poprzyjcie inicjatywę odbudowy kolei! W cieniu potężnych lokomotyw i przy huku młotów zwołano doniosłe zgromadzenie patriotów, by omówić stan naszych kolei - arterii życia narodu.\n\nTory, niegdyś symbol potęgi i współpracy, ucierpiały w sztormach konfliktów i chaosu. Teraz jednak, w duchu odbudowy i odrodzenia, przystępujemy do naprawy oraz modernizacji tych wspaniałych żelaznych dróg.\n\nNiech będzie wiadome, że wykwalifikowani rzemieślnicy i niestrudzeni robotnicy będą pracować bez wytchnienia, prowadząc nasze koleje ku odrodzeniu. Od tętniących życiem portów Equestrii po zielone pola Ridinum każda stacja i każdy węzeł ujrzą powrót naszej sieci transportowej."

CAL_all_roads_lead_to_calisia: "Wszystkie drogi prowadzą do Calisii"
CAL_all_roads_lead_to_calisia_desc: "Współobywatele Calisii, \nDzięki wspólnemu wysiłkowi wykwalifikowanych robotników i oddanych legionistów nasze drogi przejdą przemianę. Dziury zostaną załatane, nawierzchnie wyrównane, a tam, gdzie to potrzebne, powstaną nowe odcinki. Te życiodajne arterie znów staną się niezawodnymi szlakami przepływu towarów, ludzi i idei.\n\nNa tym jednak nie poprzestaniemy. Równolegle z robotami drogowymi rozpoczniemy upiększanie i ozdabianie traktów. Wzdłuż dróg posadzimy drzewa, które dadzą cień i uprzyjemnią krajobraz podróży. Wzniesiemy kamienie milowe i drogowskazy, prowadząc wędrowców ku celowi i sławiąc wspólne dziedzictwo.\n\nNiech wieść rozejdzie się po naszych ziemiach; niech każdy człowiek wie, że wszystkie drogi istotnie prowadzą do Calisii!"

CAL_factories_of_gnesna: "Fabryki Gnesny"
CAL_factories_of_gnesna_desc: "Ludu Gnesny! Radujcie się! Mądry Cesarz docenia prestiż waszego miasta! Wie, że przed złupieniem przez obcych najeźdźców Gnesna była niegdyś \"Calisią Wenedów\". Wielki Calisius postanowił obdarzyć was łaską! Wkrótce przybędą tu jego wierni budowniczowie i odbudują potężny przemysł, który napędzi kuźnię podbojów. Szklarze, dekarze, kominiarze, krawcy oraz inni robotnicy i rzemieślnicy znów podejmą pracę w nowych, większych zakładach! Majestatyczny Imperator ze szczególną radością zapowiada powstanie przyszłej perły waszego przemysłu: zakład produkcji energii, odtąd znany jako \"Aeneas\". Niech dostarcza jaśniejącego światła, które przez następne dekady zasilać będzie potęgę Calisii!"

CAL_sugar_of_mercuria_maior: "Cukier z Mercuria Maior"
CAL_sugar_of_mercuria_maior_desc: "Chwała Merkuremu, bogu handlu, i pobłogosławionemu przezeń miastu! Dzięki jego boskiej przychylności niezłomny przemysł Mercuria Maior nie ugiął się przed Trzecią Germańską Hordą, Pestis Rubra ani zaniedbaniami i złośliwością demona Baal'cerovicusa. Przetrwał, a teraz, po długim okresie niepokojów, może odetchnąć i rozkwitać pod mądrym zarządem naszego Cesarza i jego kwestorów. Ricardus Calisius osobiście wyróżnił perłę miasta: cukrownię - prawdziwego feniksa powstającego z popiołów nieudanych przedsięwzięć. Mądry Imperator zamierza odbudować zniszczony zakład, a nawet go rozbudować. Prymitywni i nieposłuszni Scytowie nie dokonali tego, choć uczynili Mercurię swą stolicą. W zamian Cesarz oczekuje, że lud Mercurii będzie mu w przyszłości wiernie służył. Wiadomość przygotowano przy pomocy Merkuriańskiego Cechu Cukrowników."

CAL_imperial_mint: "Mennica cesarska"
CAL_imperial_mint_desc: "Wiadomość dla wszystkich mieszkańców rozwiązanego Ducatus Gnesnensis! Cesarz uznał wasze ziemie za najwłaściwsze miejsce dla przyszłych mennic. Zachwycą was możliwości gospodarcze związane z tą inwestycją, a także wyjątkowa szansa regularnego podziwiania boskiego oblicza naszego princepsa. Wkrótce zrozumiecie, że Imperium Calisianum pod względem wymaganego posłuszeństwa i szacunku wcale tak bardzo nie różni się od waszego dawnego państwa. Oczywiście tamto było tylko marną imitacją tego pierwszego. Za kilka tygodni wasza praca wzbogaci nasze społeczeństwo! Monety bite w Gnesnie, Rocie i Equestrii dotrą do najdalszych zakątków świata! Nie będziecie już płacić kupcom zwierzętami ani wymieniać się nieporęcznymi przedmiotami! Radujcie się!"

CAL_pecunia_non_olet: "Pecunia non olet"
CAL_pecunia_non_olet_desc: "Mennica Cesarska Calisii, z pełnym błogosławieństwem Cesarza, rozpoczęła bicie nowej, ujednoliconej serii monet upamiętniających niedawne nabytki terytorialne! \n\nDenar ten, ozdobiony nieomylnie rozpoznawalnym, adonisowym obliczem Ricardusa Calisiusa, stanie się oficjalnym środkiem płatniczym w każdym zakątku Cesarstwa. Od tej chwili wszelki handel wymienny jest nielegalny, a przestarzałe waluty można w okresie przejściowym wymienić za odpowiednią rekompensatę. Po sześciu miesiącach od niniejszego ogłoszenia stracą wartość i nie będą już uznawane za dopuszczalny środek płatniczy przez żaden zatwierdzony urząd ani targ."

CAL_rawicz_slaughter: "Rzeź w Ravitium"
CAL_rawicz_slaughter_desc: "Strzeżcie się, ludu Calisii! Na skraju naszych obecnych granic, w Ravitium, w tej właśnie chwili trwa rzeź! Nieposłuszni Scytowie, niewątpliwie podburzeni przez dawną szlachtę, powstali przeciw naszym rządom i bezlitośnie mordują Kalizjan. Nikt nie jest bezpieczny, gdyż barbarzyńcy zabijają nie tylko pracowitych plebejskich osadników, ale też znamienitych patrycjuszy. Od ich włóczni giną mężczyźni, kobiety, a nawet dzieci, bo te koniarskie monstra nie znają litości. Potężny Ricardus Calisius wysłał do regionu wierne legiony, by ukarać buntowników. Miejmy nadzieję, że powstrzymają krwiożerczych Scytów przed zyskaniem dalszego poparcia prymitywnych pobratymców. Ze względów bezpieczeństwa wszystkim obywatelom i poddanym Calisii zakazuje się zbliżania do Ravitium aż do stłumienia rebelii."

CAL_indentured_servitude: "Służba kontraktowa"
CAL_indentured_servitude_desc: "Ważna wiadomość dla najbiedniejszych poddanych Imperatora Calisiusa! W swej mądrości chwalebny Cesarz zarządził zniesienie niewolnictwa w całym państwie. Patrycjusze nie będą już mieli nieograniczonej władzy nad robotnikami! Dotychczasowi niewolnicy staną się odtąd służącymi związanymi z panami tylko przez określony czas. Będzie ich chronić kalizjańskie prawo, zmuszające patrycjuszy do przestrzegania swojej części umowy. Ricardus Calisius ma nadzieję, że w przyszłości instytucja ta stanie się kręgosłupem cesarskiej gospodarki. Wszyscy odpowiedzialni za Trucidatio Ravitiensis zostaną zmuszeni do takiej służby na surowszych niż zwykle warunkach. Oby nowe, sprawiedliwsze prawo nie dopuściło już nigdy do tragedii podobnej do tej w Ravitium."

CAL_enslave_all_barbarians: "ZAKUĆ WSZYSTKICH BARBARZYŃCÓW W KAJDANY"
CAL_enslave_all_barbarians_desc: "Podły bunt barbarzyńców został stłumiony! Teraz sprawcy i wszyscy pozostali przy życiu powstańcy poznają wartość kalizjańskiej dyscypliny! Każdy zdrajca zostanie zniewolony i skierowany do najcięższej możliwej pracy za podniesienie ręki na boskiego Cesarza. Miłosierny Calisius zamierzał znaleźć lepszy sposób asymilacji obcych z naszym społeczeństwem. Lecz Scytowie wbili nóż w plecy jemu i nam wszystkim! Odtąd, dla ochrony kalizjańskich obywateli i stabilności Cesarstwa, ogromna większość prymitywnych ludów podbitych w przyszłości... ZOSTANIE! ZAKUTA! W KAJDANY! Trucidatio Ravitiensis nauczyła nas, że przemoc jest jedynym językiem zrozumiałym dla barbarzyńcy! Niech ich prymitywna, brutalna siła zostanie przekuta w szlachetne narzędzie postępu!"

CAL_vinicius_plead: "Prośba Viniciusa"
CAL_vinicius_plead_desc: "Wszystkie przydrożne zajazdy, uważajcie: odnotowano wielki przemarsz zwolnionych ze służby i świeżo zaciągniętych żołnierzy ku pozycjom legionów! To wspaniała okazja, by poznać bohaterów Calisii i zarobić dodatkowego denara, zapewniając im odpowiednią kwaterę! Według zaufanych źródeł Marcus Vinicius był widziany w Wiecznym Mieście i ma wkrótce otrzymać audiencję u Cesarza, by omówić sprawy wojskowe, ponieważ niejeden legionista skarżył się na warunki służby."

CAL_wide_auxilia: "Rozbudowana Auxilia"
CAL_wide_auxilia_desc: "Uwaga, wszyscy nieobywatele! Jesteś przegrywem, któremu nic w życiu nie wychodzi? Matka kazała ci dotknąć trawy, a bimber jest coraz droższy? Zaciągnij się już dziś do kalizjańskich Auxilii i odmień życie na lepsze! Płacimy prawie tyle denarów co w prawdziwej pracy, nie obciążając cię żadnymi kosztami utrzymania. Służ za osobisty podnóżek dla ego centuriona i noś wszystko, czego legioniści nie chcieli tknąć. Nie pożałujesz!"

CAL_professional_calisian_army: "Zawodowa armia kalizjańska"
CAL_professional_calisian_army_desc: "Wszyscy obywatele winni wiedzieć, że Legiony Calisii nie będą już pozwalały żołnierzom wracać do domu na żniwa ani z innych podobnych wymówek! Służba w Legionach jest stałym, wieloletnim kontraktem dostępnym wyłącznie dla pełnoprawnych obywateli Calisii! Nasi zawodowo wyszkoleni i dobrze opłacani legioniści są dumą Cesarstwa Kalizjańskiego! To oczywiste, lecz niewolnicy i barbarzyńcy nie mogą się zaciągać."

CAL_coffes_are_getting_empty: "Skarbce zaczynają świecić pustkami..."
CAL_coffes_are_getting_empty_desc: "Zarządzono dodatkowe środki oszczędnościowe w celu zwalczenia przejściowej recesji! Dotacje socjalne zostają wstrzymane do czasu ustabilizowania sytuacji finansowej. Czynnych i emerytowanych kwestorów wzywa się do pomocy w utrzymaniu wypłacalności ich Municipium. \n\nNie martwcie się, obywatele, i zaufajcie aparatowi administracyjnemu Cesarstwa. Z błogosławieństwem Merkurego senatorowie już pracują nad poprawioną ustawą budżetową, która zlikwiduje deficyt. Zachowajcie czujność i ufajcie elitarnym biurokratom Calisii. Wyprowadzą nas z kryzysu."

CAL_tax_the_rich: "Opodatkowanie bogatych"
CAL_tax_the_rich_desc: "Przyjęto nowe prawo skutecznie równoważące księgi Cesarstwa! Najbogatsi obywatele Calisii zapłacą podatek sięgający 75 procent wszystkich dochodów w najwyższym progu. Wprowadzone zostaną również dodatkowe podatki od dóbr luksusowych i wydarzeń kulturalnych oraz miesięczna składka na państwo za każdego zatrudnionego służącego. \n\nKażdemu przyłapanemu na ukrywaniu dochodów lub niezarejestrowanych transakcjach majątek zostanie przymusowo odebrany, a obywatelstwo cofnięte. Wkrótce rozpocznie się pobór zaległych podatków. Aby uniknąć konsekwencji prawnych, należy w pełni współpracować z wizytującym urzędnikiem i przekazać wszystkie żądane środki."

CAL_tax_the_barbarians: "Opodatkowanie barbarzyńców"
CAL_tax_the_barbarians_desc: "Wszyscy nieobywatele mają zgłosić się do najbliższego kwestora w celu oceny działalności gospodarczej! Na rozkaz Senatu barbarzyńcy, chłopi pańszczyźniani i włóczędzy nie są już zwolnieni z podatków! Ucieczka lub uchylanie się od zapłaty grozi grzywną do 50% majątku, więzieniem albo służbą kontraktową! Skargi na niewłaściwie przeprowadzone kontrole można składać do kosza obok urzędu Wysokich Kwestorów. Pamiętajcie! Jeśli chcecie być traktowani jak Kalizjanie, musicie wnosić wkład w społeczeństwo jak my wszyscy. Albo nawet większy..."

CAL_abduction_of_the_poznanian_women: "Porwanie Amazonek"
CAL_abduction_of_the_poznanian_women_desc: "Wieści z miasta Predecium! Miejscowe garnizony zmobilizowano i utworzono grupę najazdową, której celem jest pozyskanie dla państwa kalizjańskiego silnych i sprawnych Amazonek. \n\nDo stolicy oraz miast Equestria, Rota i Clodavia ma trafić wielka liczba pojmanych amazońskich wojowniczek i robotnic, które napędzą lokalne gospodarki. \n\nSzlachcie i przedsiębiorcom zainteresowanym regionem, a także wolnym ludziom szukającym pracy na północno-wschodnich rubieżach, zaleca się uważne śledzenie dalszych wydarzeń."

CAL_treaty_of_kornik: "Traktat Prowencki"
CAL_treaty_of_kornik_desc: "Obywatele Res Publici! Wielkie poruszenie wśród cór Junony na ulicach naszych miast zmusiło nasz rząd do refleksji i podpisania traktatu w malowniczym mieście Provent. Wszyscy słyszeliśmy o dramacie jaki rozegrał się na granicy z Cuiavią, gdzie nasi legioniści, wierząc oczywiście że przeprowadzają ratunek - uprowadzili dziesiątki kobiet kryjących się w lasach. \n\nWstrząs jaki ta sytuacja dostarczyła opinii publicznej w naszej stolicy przerósł nawet i rządzącą frakcję! Przeprowadzona ustawa w senacie o prawach kobiet stanowi fundament podpisanego traktatu z naszym północnym sąsiadem, z którym pomimo wszystko stosunki pozostają napięte. Na szczęście udało nam się uniknąć wyniszczającej wojny. Niech żyje wspaniałomyślność Senatu! Chwała Junonie i kobiecemu żywiołowi który buduje nasze Imperium!"

CAL_like_helen_of_troy: "Jak Helena Trojańska"
CAL_like_helen_of_troy_desc: "Piękne damy Calisii! Bądźcie pewne, że wszystkie kalizjańskie kobiety będą bezpieczne w naszych granicach. Dotyczy to zarówno rodowitych córek Calisii, jak i dzielnych Amazonek, które uratowaliśmy przed barbarzyństwem Cuiavii. Znajdują się teraz pod opieką Calisii, gdyż zostały pojmane w imię chwalebnego Ricardusa Calisiusa, tak jak potężny Herkules zdobył pas Hippolity. Cesarz ogłosił, że każdy obcy brutal pragnący podważyć jego władzę może szturmować nasz limes i stanąć z nami do walki. Dzielni legioniści są gotowi bronić nowych poddanych z odwagą Hektora. Możecie być pewne, że wyciągnąwszy naukę z historii, nasz mądry przywódca dopilnuje, by tym razem synowie Troi nie padli ofiarą podstępnych taktyk Hellenów."

CAL_philosophical_disputes: "Spory filozoficzne"
CAL_philosophical_disputes_desc: "Szanowni obywatele Calisii! Przygotujcie się na bezprecedensowe wydarzenie na Forum Calisianum - bitwę filozofów! Na tej arenie idei będziemy świadkami starcia tytanicznych umysłów, gdyż wybitni myśliciele z całego miasta podejmą debatę o istocie kalizjańskości.\n\nCzy prawdziwego Kalizjanina określa urodzenie w Calisii, czy wierność Cesarstwu? Czy osoby urodzone po Upadku na kalizjańskim terytorium są bardziej autentyczne od pochodzących z ziem, do których rości sobie prawa nasze państwo? A co z tymi, którzy niegdyś uważali się za Polaków - czy należą do naszej zbiorowej tożsamości, czy są poza nią?\n\nDołączcie do nas, gdyż będziemy stawiać czoła tym głębokim pytaniom i wspólnie szukać oświecenia. Wynik filozoficznej bitwy ukształtuje samą tkankę społeczeństwa i wskaże nam drogę ku jaśniejszemu zrozumieniu własnej istoty. Nie przegapcie tego historycznego wydarzenia - dziś w samo południe!"

CAL_homo_novus: "Homo Novus"
CAL_homo_novus_desc: "Raduj się, ludu Calisii! Z wielkiej mądrości Cesarza niech będzie wiadome, że każdy z was pracujący dla dobra Cesarstwa jest przeznaczony, by zwać się prawdziwym Kalizjaninem. Każdy mężczyzna i każda kobieta w wieku co najmniej 18 lat, którzy nie zostali skazani na niewolę karną ani nie mają wobec państwa długu średniej kategorii, mogą teraz odebrać osobistą deklarację i dokumenty poświadczające kalizjańskie obywatelstwo.\nOsoba składająca wniosek o obywatelstwo w najbliższej placówce administracji państwowej musi posiadać dokument potwierdzający wykonywanie pracy zawodowej w Calisii przez 2 lata. Kandydat musi także złożyć odręcznie napisaną lub wydrukowaną deklarację lojalności wobec naszego błogosławionego Cesarza Ricardusa Calisiusa.\nNiech jego imię niesie chwałę i będzie wymawiane z wdzięcznością!"

CAL_calisian_identity: "Tożsamość kalizjańska"
CAL_calisian_identity_desc: "Dumni obywatele Calisii! Chrońcie swoją tożsamość! Pobłogosławiony mądrością bogów Imperator Calisius wydał edykt uznający za prawdziwych Kalizjan wszystkich pracowitych ludzi pochodzenia wenedzkiego - i tylko tych urodzonych na terytorium dawnej Polonii. Z tej okazji cesarska stolica ogłasza, że pierwszy piątek Aprilis rozświetlą uroczystości sławiące kulturę kalizjańską jako naturalną spadkobierczynię upadłych zwyczajów Wenedów.\nKażdemu dorosłemu mężczyźnie i każdej kobiecie posiadającym dokumenty potwierdzające wenedzkie pochodzenie co najmniej dwa pokolenia wstecz zaleca się podróż do najbliższej Komisji Administracyjnej w celu złożenia wniosku o obywatelstwo. Każdy Wened służący Cesarstwu jako robotnik przez co najmniej 3 lata lub żołnierz przez 1 rok otrzyma pierwszeństwo w procesie asymilacji."

CAL_thinking_about_the_roman_empire: "Marzenia o Rzymie"
CAL_thinking_about_the_roman_empire_desc: "Uwaga, obywatele Calisii! Przygotujcie się na podróż w czasie ku wspaniałości starożytnego Rzymu dzięki naszej nowej inicjatywie edukacyjnej! Ten wszechstronny program zanurzy każdego chętnego obywatela w bogatym dziedzictwie kulturowym przodków!\n\nOd epickiej poezji Wergiliusza po traktaty filozoficzne Seneki poznacie piękno i mądrość słowa pisanego, które tak cenili obywatele Rzymu. Odkryjecie zawiłości dawnej mody - od wdzięcznych fałd togi po praktyczność tuniki - i z dumą przywdziejecie strój starożytności. Pozwolicie zmysłom rozkoszować się kulinarnymi przysmakami, od wyrazistego garum po dekadencką słodycz miodowych deserów.\n\nNauczcie się ucieleśniać ideały starożytnego Rzymu w codziennym życiu i pielęgnować dziedzictwo Cesarstwa czynami. W ten sposób wspólnie uczcimy przeszłość i zbudujemy odrodzone społeczeństwo kalizjańskie! Zapisy odbywają się w każdy dzień roboczy w gmachu Ministerstwa Kultury Starożytnej. Nie zwlekajcie! Duchy Cesarstwa Rzymskiego wzywają!"

CAL_legacy_of_ancient_world: "Dziedzictwo starożytnego świata"
CAL_legacy_of_ancient_world_desc: "Pamiętajcie, jak powstał Rzym! Nasi przodkowie nauczyli się rządzić od Etrusków, filozofii i religii od Greków, a walki od Galów! Gdziekolwiek przybywali, asymilowali miejscowe kultury i religie. Kim jesteśmy, by sprzeciwiać się rzymskim metodom? Jako ich następcy powtórzymy ich sukces! Choć nasza kultura zawsze zachowa wyraźnie kalizjański fundament, część umiłowanych zwyczajów przetrwa. Miejscowe potrawy, takie jak pyry z gzikiem, rogale świętomarcińskie i... sz... szneki z galnz... glancem znajdą się w jadłospisie każdego Kalizjanina. Nadal świętować będziemy 11 i 29 listopada, choć nazwy związane ze świętym Marcinem i świętym Andrzejem mogą się zmienić. Spodziewajcie się również corocznych festiwali upamiętniających zwycięskie powstanie Wenedów przeciw Germanom z 1918 roku, tak podobne do naszej walki z ich Europrowincjami. Oczywiście wraz z ekspansją nasza kultura będzie przyswajać coraz więcej miejscowych elementów, by naprawdę zakorzenić się na nowych ziemiach."

CAL_when_in_rome: "Kiedy wejdziesz między wrony..."
CAL_when_in_rome_desc: "Nie bez powodu odnieśliśmy sukces tam, gdzie inni ponieśli klęskę! Nie bez powodu Calisia podbiła Venetia Maior! Nie bez powodu Urbs Calisia jest dziś jej stolicą!\nStało się tak dlatego, że nasza starożytna kultura, która ukształtowała cały świat i dziś powstaje z popiołów, jest bezsprzecznie wyższa! Jeśli więc chcemy, by nasza cywilizacja rozkwitała i podbijała pomniejsze ludy, musimy zachować czystość kultury. Wszystkie zwyczaje o niekalizjańskim charakterze zostaną usunięte z publicznych uroczystości. Nie będzie to zresztą szczególnie trudne. Większość przeciwników podporządkuje się kalizjańskim normom, gdy ujrzy chwałę prawdziwej cywilizacji. Nie będą już potrzebować swych zaściankowych kultur."


### TRZECIE DRZEWKO - SENAT ###

CAL_in_service_of_calisia: "W służbie Calisii"
CAL_in_service_of_calisia_desc: "Senat obraduje ponownie! Na mocy dekretu Cesarza Ricardusa Augustusa Calisiusa dzisiejszego ranka zniesiono tymczasowe wojenne zawieszenie debat. Wkrótce omówione zostaną ważne sprawy państwowe, a Senat powróci do zwyczajowych obowiązków. Obywatele znów mogą wysyłać listy w sprawach, które uznają za wystarczająco istotne. Za korespondencję obrażającą senatorów lub wyśmiewającą ich grozi grzywna 50 denarów. Pogłoski o kłótniach i brutalnych starciach w salach Senatu to bezpodstawne kłamstwa. Cesarz gwarantuje, że wszystkie organy Res Publica są dostojnymi, nieskazitelnymi miejscami sumiennej pracy, wolnymi od wichrzycieli i osiłków."

CAL_another_early_elections: "Kolejne przedterminowe wybory"
CAL_another_early_elections_desc: "Pierwsze wieści z Senatu! Aby dostosować izbę do nowych rozmiarów Cesarstwa, liczba miejsc zostanie podwojona do 300. Wybory odbędą się dokładnie za dwa tygodnie. Obywatele pragnący uczestniczyć w procesie demokratycznym mogą głosować w najbliższym lokalu, którego adresy zostaną ogłoszone tydzień przed wyborami. Chwalebny tytuł senatora wiąże się z licznymi przywilejami, między innymi zakwaterowaniem w luksusowej willi senackiej, gdy tylko któraś się zwolni."

CAL_lex_indentatae_servitutis: "Lex Indentatae Servitutis"
CAL_lex_indentatae_servitutis_desc: "Podczas trwającego posiedzenia Senatu poruszono kwestię niewolnictwa! Po tragicznych wydarzeniach w Ravitium grupa Popularów zajęła mównicę, żądając natychmiastowego zakończenia systemu pracy przymusowej w Calisii! Po długim sporze frakcje zgodziły się poddać sprawę pod głosowanie. Reformatorzy przedstawili umiarkowany projekt przejścia ku czasowej służbie z możliwością wykupienia kontraktu po określonym okresie pracy. Optymaci, obawiając się skutków gospodarczych, żądają, by pracę wykonywały podporządkowane ludy, których status Servi zostałby usankcjonowany w zamian za państwowe mieszkanie i odpowiednie wyżywienie. Przeciw projektowi wybuchły wielkie protesty grup barbarzyńskich."

CAL_lex_militae: "Lex Militae"
CAL_lex_militae_desc: "Nadciągają posiłki dla armii, gdyż Senat kończy prace nad nową ustawą poborową! W odpowiedzi na prośby legata Viniciusa i innych wysokich dowódców izba szybko i zgodnie postanowiła rozszerzyć pobór, aby wystawić większe siły zdolne wspierać wszystkie teatry wojny. Po obiecującym początku prace utknęły na kwestii grup objętych dekretem. Popularzy chcą utworzenia formacji barbarzyńskich jako rozwiązania problemu niedoboru ludzi. Optymaci gwałtownie sprzeciwiają się temu pomysłowi, uznając barbarzyńców za niegodnych zaufania i niepewnych w swej lojalności wobec Calisii. Ich zdaniem można poświęcić liczebność, gdyż mniejsza armia zawodowa skuteczniej odeprze zewnętrzne zagrożenia. Przy takiej polaryzacji o ostatecznym kształcie ustawy zdecyduje zapewne garstka niezdecydowanych senatorów, chyba że uda się znaleźć możliwy do przyjęcia kompromis."

CAL_lex_tributorum: "Lex Tributorum"
CAL_lex_tributorum_desc: "Rozwiązanie finansowych bolączek Cesarstwa jest coraz bliższe! Wszystkie frakcje zgadzają się co do konieczności reformy podatkowej, a obie strony przedstawiły Senatowi plany zdobycia dodatkowych środków dla skarbca. Zgodnie ze swą nazwą Popularzy żądają zwiększenia podatków dla bogatych, by nie tylko zlikwidować deficyt, ale też ulżyć ubogim. Optymaci, oburzeni tym, co nazywają \"atakiem na ludzi wnoszących największy wkład we wspólny dobrobyt\", proponują zamiast tego większe obciążenia dla barbarzyńców mieszkających w Cesarstwie jako od dawna należną zapłatę za czerpane przez nich korzyści. Wobec zaangażowania licznych frakcji i grup nacisku impas zapewne jeszcze potrwa."

CAL_lex_mercatoria: "Lex Mercatoria"
CAL_lex_mercatoria_desc: "Senat ponownie tkwi w impasie! Po dyskusji o eksporcie kalizjańskich dóbr luksusowych obie frakcje przedstawiły rozwiązania dotyczące otwarcia rynków na handel zagraniczny! Popularzy utrzymują, że nie wolno skupiać się wyłącznie na wzroście liczb, lecz trzeba też zwalczać monopolistyczne praktyki nieuczciwych pośredników. Optymaci zablokowali ich projekt, wskazując na konieczność obniżenia ceł i rozszerzenia sieci eksportowych. Obie strony koncentrują się teraz na zgromadzeniu poparcia potrzebnego do przyjęcia jednej z propozycji. Czekajcie na dalsze wieści."

CAL_lex_securitatis: "Lex Securitatis"
CAL_lex_securitatis_desc: "Senat ponownie obraduje! Podczas dzisiejszego posiedzenia obie frakcje w rzadkim pokazie jedności zgodziły się co do potrzeby wzmocnienia bezpieczeństwa wewnętrznego Cesarstwa. Szanse na wspólną ustawę szybko jednak pogrzebał upór Optymatów przy licznych zapisach uznanych za nazbyt surowe i krwiożercze. W odpowiedzi frakcje znów zerwały kontakty i przedstawiły izbie dwa odrębne plany. W ciągu miesiąca dowiemy się, który zdobędzie wystarczające poparcie."

CAL_lex_subsidiarum_socialum: "Lex Subsidiarum Socialum"
CAL_lex_subsidiarum_socialum_desc: "Wieści dla obywateli Calisii! Gdy Senat przeszedł do spraw opieki społecznej i zasiłków, między Popularami a Optymatami wybuchła gorąca dyskusja. Strony zajmują skrajnie odmienne stanowiska: Popularzy postulują rozszerzenie i wzbogacenie opieki społecznej, natomiast Optymaci proponują cięcia, które uwolnią zasoby państwa i pozwolą uniknąć nowych podatków. \n\nUprawnieni do głosowania mogą śledzić propozycje obu stron na ich stronach internetowych. Narastający konflikt senatorów zatrzymuje prace Senatu, dlatego wyborcom zaleca się wywarcie presji na polityków, by uniknąć kolejnego impasu..."

CAL_cura_annonae: "Cura Annonae"
CAL_cura_annonae_desc: "Wieści dla uciśnionych i porzuconych! Senat podjął ostateczną decyzję w sprawie zasiłków dla obywateli, a teraz debatuje nad pomocą dla żyjących poniżej granicy ubóstwa, pragnąc uleczyć plagę bezdomności i nędzy wywołaną Upadkiem Polonii. \n\nPrawodawcy proponują między innymi schroniska dla bezdomnych, jadłodajnie i wsparcie finansowe. Wyborcy pragnący pomóc ubogim powinni zabrać głos."

CAL_annonae_militaris: "Annonae Militaris"
CAL_annonae_militaris_desc: "Wprowadzono dodatkowe wsparcie dla klasy wojskowej! Senat zatwierdził 50-procentową podwyżkę żołdu legionistów od następnego okresu płatniczego. Magistraci zostają upoważnieni do wypłaty środków według nowego podziału, a oficerowie mogą przejąć wszelką pozostałą nadwyżkę. \n\nWeteranom mieszkającym w cesarskiej prowincji przysługuje comiesięczne świadczenie zależne od liczby ukończonych kampanii. Szczegółowy spis wyłonił już uprawnionych. Każdy przypadek podszywania się pod weterana zostanie odnotowany i ukarany."

CAL_lex_poenae_capitalis: "Lex Poenae Capitalis"
CAL_lex_poenae_capitalis_desc: "Więźniowie drżą w celach, gdyż ich los rozstrzygną obrady mądrych senatorów! Wkrótce najlepsi synowie Calisii zagłosują nad karą śmierci za najcięższe zbrodnie. Wniosek o wprowadzenie poenae capitalis przedstawili Optymaci. Twierdzą, że najpodlejsi przestępcy powinni umrzeć bolesną śmiercią - i to publicznie. Wbrew pogłoskom ukrzyżowanie popiera jedynie niewielka mniejszość Optymatów i metoda ta nie znajdzie się w ustawie. Jak zwykle sprzeciwiają się im Popularzy, według których skoro z czasem potrafimy ucywilizować barbarzyńców, powinniśmy dać im szansę na odkupienie, zwłaszcza że część przestępców to rodowici Kalizjanie."

CAL_lex_iuononis: "Lex Iunonis"
CAL_lex_iuononis_desc: "Senat podejmuje zdecydowane działania w sprawie pozycji kobiet w Cesarstwie! Między frakcjami szaleje gorąca debata i przedstawiono dwa projekty ustaw. Delegacja Popularów obiecuje radykalne reformy, przyznające obywatelkom pełnię praw i ochrony prawnej, w tym całkowity zakaz krzywdzenia i porywania barbarzyńskich kobiet bez ich zgody. Optymaci proponują zwiększenie praw przy podkreśleniu tradycyjnych ról i obiecują ochronę wyłącznie kobietom podlegającym kalizjańskiemu prawu. Głosowanie powinno zakończyć się w nadchodzącym miesiącu."

CAL_lex_civitatis: "Lex Civitatis"
CAL_lex_civitatis_desc: "Nadchodzą zmiany w procesie nabywania obywatelstwa! Dostrzegając potrzebę reformy, Senat rozpoczął obrady nad ustawą rozszerzającą obecne drogi do oficjalnego uznania za Kalizjanina. Popularzy obiecują szerokie zmiany i chcą przyznać obywatelstwo każdej osobie o odpowiednim statusie mieszkającej na terytorium Cesarstwa, jeśli dowiedzie służby Jego Łaskawości Ricardusowi Calisiusowi. Optymaci odrzucają tę zgodną propozycję i opowiadają się za jednorazową daniną równą miesięcznemu utrzymaniu manipułu. Wszystkich zainteresowanych prosi się o powstrzymanie od publicznego popierania wybranej opcji, aby nie zakłócać naturalnego przebiegu debaty."

CAL_lex_acculturationis: "Lex Acculturationis"
CAL_lex_acculturationis_desc: "Drodzy obywatele! Na osobistą prośbę Cesarza, wobec rosnącego terytorium i stałego przyrostu liczby niekalizjańskich poddanych, Senat zgodził się rozważyć, czy ludzie barbarzyńskiego pochodzenia mogą naprawdę zostać włączeni do naszej wyższej kultury. Popularzy oświadczyli: \"Kalizjańskość nie jest kwestią urodzenia, lecz przyjęcia wspólnych wartości\". Lojalni wobec frakcji senatorowie chcą sfinansować szerokie programy kulturalne oświecające podbite ludy. Optymaci odpowiadają, że niektóre grupy są barbarzyńskie z natury, a uczenie ich naszych obyczajów byłoby marnotrawstwem zasobów. \n\nObywatele mogą wyrazić swoje zdanie. Wkrótce odbędzie się sondaż, czy mieszkańcy Wiecznego Miasta czuliby się swobodnie, uznając osobę barbarzyńskiego pochodzenia za współobywatela Calisii."

CAL_lex_amoris_liberi: "Lex Amoris Liberi"
CAL_lex_amoris_liberi_desc: "Prawa par jednopłciowych znajdą się w porządku obrad najbliższego posiedzenia Senatu! Głośne postępowe skrzydło Popularów wymusiło włączenie sprawy do prac izby, domagając się uznania i ochrony długotrwałych związków. Projekt wywołał oburzenie konserwatywnego skrzydła Optymatów, które nazywa go jawnym atakiem na kalizjańskie wartości i tradycje. Ich kontrprojekt odwołuje się do przykładu starożytnych przodków i pozwala mężczyznom sypiać wyłącznie z osobami o niższym statusie, o ile dany obywatel odgrywa rolę dominującą. \nOstateczna wersja ustawy ma wejść w życie przed końcem następnego Mensis."

CAL_lex_aesculapii: "Lex Aesculapii"
CAL_lex_aesculapii_desc: "Za tydzień Senat zbierze się, by omówić opiekę zdrowotną w Res Publica. Optymaci i Popularzy przedstawili następujące propozycje: \nPopularzy pragną stworzyć scentralizowaną, państwową służbę zdrowia dla wszystkich obywateli Calisii, twierdząc, że jest konieczna do utrzymania każdej części społeczeństwa w doskonałym zdrowiu. \nOptymaci proponują natomiast oprzeć kalizjańską opiekę zdrowotną na szerokiej sieci prywatnych placówek i terapiach, które - według ich własnych słów - nie szkodzą duszy. Jak dotąd obie propozycje mają równe poparcie."

CAL_lex_religionis: "Lex Religionis"
CAL_lex_religionis_desc: "Przed Senatem stanęła kwestia kierunku religijnego! Żądania pełnej sekularyzacji Cesarstwa wysuwane przez radykałów Popularów doprowadziły do rzadkiego trójpodziału izby, gdyż opozycja nie potrafi uzgodnić jedynego prawdziwego panteonu. Kult Jowisza zdobył znaczną popularność wśród Optymatów, lecz wielu uważa powrót do politeizmu za krok za daleko. Szeroka koalicja ponad podziałami powstała, by zachować szczególny status katolicyzmu i formalnie uznać go za główną religię Calisii. Według prominentnego członka ukochanej legislatury impas trwa od początku posiedzenia i zapewne przeciągnie się na następne tygodnie."

CAL_edictum_lichensis: "Edictum Lichensis"
CAL_edictum_lichensis_desc: "Jego Łaskawość Ricardus Calisius wydał oficjalną proklamację rozszerzającą tolerancję religijną na wszystkie wyznania obecne w Cesarstwie! Po mądrej decyzji Senatu chroniącej naszą duchową drogę Cesarz bezzwłocznie zagwarantował wolność religijną wszystkim poddanym. Wyznawcy Chrystusa i Jowisza, a nawet pomniejszych bogów takich jak Jahwe, mogą odtąd praktykować osobisty kult. Świątynie wolno wznosić zgodnie z obyczajami i wierzeniami miejscowej wspólnoty, o ile zachowana zostanie tolerancja określona edyktem. \n\nUrzędników religijnych i misjonarzy wzywa się do powstrzymania od głoszenia kazań w dzielnicach cesarskiej i senackiej. Próby nawracania członków rządu będą karane jako zakłócanie pokoju."

CAL_first_pontifex_maximus: "Pierwszy Pontifex Maximus"
CAL_first_pontifex_maximus_desc: "Wieści od potężnego Ricardusa Augustusa Calisiusa! Cesarz zarządził utworzenie najwyższego autorytetu moralnego i religijnego państwa kalizjańskiego. \n\nUrząd Pontifexa Maximusa - najwyższego kapłana - przejmie odtąd pieczę nad wszystkimi instytucjami, budowlami, ceremoniami i prywatnymi sprawami religijnymi, w tym pochówkami, małżeństwami i adopcjami, a także nad wszelkimi kwestiami moralnymi ludu Calisii. Wszystko po to, by zadowolić bogów i zapewnić Calisii ich łaskę. \nPomniejsze sprawy Pontifexa, takie jak pogrzeby czy śluby pospólstwa, będą w jego imieniu prowadzone przez miejscowe władze religijne."


### TRZECIE DRZEWKO - EKSPANSJA CALISII ###

CAL_eternal_city: "Wieczne Miasto"
CAL_eternal_city_desc: "Ludu stolicy! Gdy świat stracił sens, a Polonia upadła, staliście się kolebką nowej cywilizacji! Zgodnie z obietnicą Calisia powstanie na ruinach Kalisza - dla was i ku chwale Cesarza! Choć dziś nasze wspaniałe miasto przypomina Rzym czasów Saecula Obscura, po zakończeniu cesarskich prac dorówna starożytnemu Rzymowi u szczytu potęgi, a nawet go przewyższy! Projekt obejmuje lepszą infrastrukturę, nowe masowe budownictwo dla plebejuszy, ekskluzywną dzielnicę senatorów i nowy Palatium Calisianum. W ten sposób wszystkie warstwy społeczne skorzystają z pracy robotników. Budowa może przejściowo zakłócić codzienne życie, lecz taka jest cena postępu. Cech Budowniczych jak zawsze prosi mieszkańców, by nie przeszkadzali robotnikom - zwłaszcza gdy piją vinum na placu budowy."

CAL_calisian_neighbourhoods: "Kalizjańskie osiedla"
CAL_calisian_neighbourhoods_desc: "Wieści dla mieszkańców miasta Calisia! Cesarz ogłosił budowę nowych domów w dzielnicach Paradisi, Ripinus, Bono i Horti. Do 2045 roku ma powstać ponad dwieście tysięcy mieszkań, liczne budynki publiczne oraz dwa nowe place handlowe w Bono i Ripinus. Na nowych osiedlach zamieszka obecna ludność dzielnicy Calvaria, która opuści domy wskutek rozbudowy dzielnicy senackiej. \n\nZ państwowych budowniczych, wolnych pracowników branży i robotników prywatnych firm powstaną trzy centuriae budowlane. Kolejna zajmie się odnową zaniedbanych części miasta. \n\nWłaściciele gospodarstw w Bono, Horti, Paradisi nad Prurnią i Ripinus nad Prosną mogą ubiegać się w magistracie o odszkodowanie. Posiadacze prawidłowych aktów własności wybiorą pieniądze albo nowe działki we wsi Mundus Novii koło Lessna Polonorum."

CAL_in_marble_blocks: "W blokach z marmuru"
CAL_in_marble_blocks_desc: "Chwała Cesarzowi! W swej nieskończonej mądrości i wizji postępu zarządził monumentalne przedsięwzięcie: przemianę Calisii w prawdziwe miasto z marmuru. Odtąd wszystkie nowe osiedla będą wznoszone z najlepszego marmuru dostarczanego przez cech kamieniarzy. Majestatyczne gmachy wyniosą panoramę Calisii na niespotykane dotąd wyżyny wspaniałości.\n\nCesarz zarządził również staranną renowację starszych budynków. Otrzymają one izolację i nowe elewacje naśladujące szlachetny marmur, aby każdy zakątek Calisii odzwierciedlał wspaniałe ambicje Cesarstwa."

CAL_local_supermercatae: "Lokalne Supermercatae"
CAL_local_supermercatae_desc: "Obywatele Calisii! Wszyscy nosimy blizny po korporacyjnych wojnach handlowych dawnego świata. Cesarstwo dopilnuje, by żadnego obywatela nie zwiodły puste słowa korporacji.\nOdtąd każdy supermarket w mieście otrzyma nazwę w szlachetnej łacinie, przywołując chwałę naszej świetnej przeszłości. Fasady ozdobią motywy inspirowane starożytnością, połączone z nowoczesnym wnętrzem.\n\nAby zachować świętość miejskiego krajobrazu, Cesarz zakazał reklam wielkopowierzchniowych. Niebo nie będzie już zaśmiecone komercyjnymi komunikatami, lecz ozdobione ponadczasowym pięknem miasta. \n\nPonadto w każdej dzielnicy powstaną nowe supermarkety zapewniające wszystkim obywatelom wygodny dostęp do podstawowych dóbr. Te współczesne cuda handlu płynnie wtopią się w odnowiony krajobraz Wiecznego Miasta."

CAL_emporium_in_every_district: "Emporium w każdej dzielnicy"
CAL_emporium_in_every_district_desc: "Współobywatele! W ramach rozwoju handlu i lokalnych wspólnot rozpoczęto kolejny etap ekspansji kupieckiej! Według planów urbanistycznych każda dzielnica o znaczącym rozmiarze lub randze otrzyma handlowe Emporium - wielkie centrum podobne do dawnych galerii. Istniejące obiekty zostaną przebudowane według jednolitego stylu, oznaczenia zlatynizowane, a reklamy ograniczone do minimum.\n\nEmporia staną się latarniami handlu i wspólnoty, żywymi ośrodkami, w których obywatele korzystają z obfitości dóbr i usług. Będą nie tylko centrami handlowymi, lecz również miejscami budowania więzi społecznych. Dzięki licznym sklepom, jadłodajniom i rozrywkom staną się gwarnymi miejscami spotkań każdego prawdziwego Kalizjanina."

CAL_gardens_and_vineyards: "Ogrody i winnice"
CAL_gardens_and_vineyards_desc: "Cesarstwo, oddane pięknu i dobrobytowi, zarządziło utworzenie ogrodów w stylu starożytnego Rzymu w każdej dzielnicy ukochanej kalizjańskiej stolicy.\n\nTe wykwintne oazy spokoju i przepychu zostaną ozdobione przez marmurowe posągi, kunsztowne mozaiki i starannie przystrzyżone żywopłoty. Będą nie tylko źródłem estetycznej rozkoszy, ale również ośrodkami życia wspólnoty i wzbogacenia kulturalnego. Amfiteatry, biblioteki i kawiarnie uczynią je tętniącymi życiem miejscami, gdzie obywatele w każdym wieku będą mogli wspólnie świętować bogactwo naszego dziedzictwa.\n\nWizja upiększania wykracza jednak poza dzielnice. Na zielonych polach wokół metropolii powstaną rozległe winnice dostarczające luksusowych trunków dla wyrafinowanych gustów klas wyższych oraz niższych."

CAL_senatorial_villas: "Wille senatorskie"
CAL_senatorial_villas_desc: "Błogosławiony dzień dla wszystkich czcigodnych członków Senatu! Cesarz, oddany budowaniu dobrobytu i prestiżu, zarządził budowę licznych luksusowych willi dla szanownych senatorów na obrzeżach ukochanego miasta.\nPowstaną w prestiżowym stylu neoklasycznym, z rozległymi ogrodami, marmurowymi kolumnami i ozdobnymi fontannami. Wewnątrz znajdą się biblioteki pełne dawnej mądrości, galerie wykwintnej sztuki i łaźnie ogrzewane podziemnym ogniem.\n\nPrzywilej zamieszkania w tych willach nie będzie jednak przyznawany lekką reką. Cesarstwo określiło surowe wymagania: członkostwo w Senacie Calisii lub innym znamienitym organie państwowym, oddanie dobrobytowi Cesarstwa, wypłacalność pozwalająca utrzymać willę i grunty, lojalność wobec Cesarza oraz przestrzeganie praw i zwyczajów."

CAL_temple_of_jupiter: "Świątynia Jowisza Najlepszego, Największego i Najpiękniejszego"
CAL_temple_of_jupiter_desc: "Postanowione! W imię wszystkich bogów pod przewodnictwem Jowisza i ku czci powrotu do wiary przodków, na mocy dekretu Cesarza na Polach Marsowych stanie wielka świątynia Jowisza Najlepszego, Największego i Najpiękniejszego.\nMarmurowe kolumny, kunsztowne fryzy przedstawiające czyny bogów i górujący posąg Jowisza uczynią ją latarnią pobożności i oddania dla wszystkich obywateli Calisii.\n\nPo ukończeniu świątyni odbędą się wystawne rytuały i uroczystości. Kapłani i kapłanki odprawią święte obrzędy, na ołtarzu złożone zostaną wino i kadzidło, a pochody obywateli ze wszystkich zakątków Calisii zgromadzą się na Polach Marsowych, by ucztować, tańczyć i radować się błogosławieństwem Jowisza oraz jednością Cesarstwa.\n\nChwała Jowiszowi! Chwała bogom!"

CAL_temples_on_fields_of_mars: "Świątynie na Polach Marsowych"
CAL_temples_on_fields_of_mars_desc: "Pola Marsowe wkrótce staną się miejscem nowych świątyń ku czci naszego Panteonu Bogów! Ze względu na skalę budowy Cesarz Ricardus Augustus Calisius prosi wszystkich zdolnych obywateli o pomoc. Imiona ochotników zostaną na zawsze chwalebnie uwiecznione w murach świątyń, a skarbiec Res Publici wypłaci im sowite wynagrodzenie. Na terenie świątyń bezwzględnie zakazana będzie ponadto cześć bóstw judaistycznych. Strzeżcie się! Znieważenie Bogów w pałacach wzniesionych w ich imieniu nie zostanie zlekceważone. Ich gniew będzie najmniejszym zmartwieniem tych, którzy wystąpią przeciw boskiej woli."

CAL_house_of_bacchus: "Dom Bachusa"
CAL_house_of_bacchus_desc: "Hulanki! Ekstaza! Hedonistyczne rytuały i uroczystości! Od wystawnych uczt i bankietów ociekających winem po ekstatyczne tańce i przedstawienia - wyznawcy Bachusa wspólnie uczczą boga w sposób najradośniejszy i niczym nieskrępowany.\n\nUczynią to podczas otwarcia nowo wzniesionej wielkiej świątyni samego Bachusa! Budowę sfinansowali oddani wyznawcy boga wina zrzeszeni w oficjalnie zatwierdzonym Collegium Bachusa.\n\nNiech będzie wiadome, że choć praktyki te mogą się niektórym wydawać niekonwencjonalne, stanowią umiłowaną część naszego dziedzictwa i różnorodności religijnej. Mądre Cesarstwo obejmuje wszystkie wiary i tradycje, wiedząc, że jedność rodzi się nie z jednolitości, lecz ze świętowania różnic.\n\nIn Vino Veritas!"

CAL_expansion_of_cathedral: "Rozbudowa Katedry św. Mikołaja Biskupa"
CAL_expansion_of_cathedral_desc: "Od czasów Konstantyna Wielkiego, a potem Mieszka I nasze ziemie pozostają pod opieką jedynego prawdziwego Boga w Trójcy! Aby uczcić jego chwałę i zapewnić godne miejsce kultu trzodzie, rozpoczniemy wielkie prace. Cathedralis Sancti Nicolai Episcopi zostanie powiększona! Rdzeń kościoła zachowa styl barbarzyńskich Gotów, lecz nowe części harmonijnie dopasują się do przebudowanego miasta. Mamy nadzieję, że z czasem katedra przyćmi Sacellum Sixtinum w Starym Rzymie. Oby obecny Pontifex Maximus w Watykanie pojął, gdzie naprawdę jaśnieje dziedzictwo Rzymu, i uczynił Calisię swą nową stolicą."

CAL_donation_of_calisus: "Donacja Calisiusa"
CAL_donation_of_calisus_desc: "Boski Calisius w swej nieskończonej mądrości ogłosił nowy akt, którym obdarza Święty Kościół! Odbudowana Katedra św. Mikołaja oraz dawne ziemie Archidioecesis Gnesnensis przejdą pod bezpośrednie rządy wkrótce wybranego Archiepiscopusa. Zgodnie z tradycją nowy hierarcha zostanie Primas Calisiae i głową Kościoła na naszych ziemiach. Wielkoduszna donacja stanowi dobrowolne zadośćuczynienie za konfiskatę dóbr kościelnych u zarania potęgi Calisii. Ten gest dobrej woli zakończy wszelkie przyszłe spory w tej kwestii. Chwała Cesarzowi i jego hojności!"

CAL_graveyards_into_catacombs: "Cmentarze w katakumby"
CAL_graveyards_into_catacombs_desc: "Ludu Calisii! Dotychczasowe czyny wielkiego Ricardusa Calisiusa dowiodły jego głębokiej pobożności. Pobożności nie wolno jednak mylić z fanatyzmem. Mądry Cesarz zauważył, że marnujemy ziemię daną przez Boga. Przestrzeń pod szkoły, świątynie, forty i osiedla zajmują pozornie niewinne przeszkody - cmentarze. Wasz szok jest zrozumiały, lecz Cesarz nie chce bezcześcić zmarłych. Przeciwnie: pragnie zbliżyć wiernych do Boga! Zmarli zostaną przeniesieni do nowo zbudowanych katakumb, które najlepsi górnicy i architekci upodobnią do dawnych. Pierwsi chrześcijanie Rzymu modlili się za zmarłych pod ziemią i właśnie z katakumb szerzyli słowo Chrystusa po krańce starożytnego Cesarstwa. Imperator liczy, że surowe warunki przyniosą podobne przebudzenie religijne. Tak wdzięczne połączenie sacrum i profanum cesarskich rządów pokazuje prawdziwą mądrość Wielkiego Calisiusa!"

CAL_administratum_calisium: "Administratum Calisianum"
CAL_administratum_calisium_desc: "Obywatele Calisii i okolicznych przedmieść! Cesarz Ricardus Augustus Calisius ogłasza wszystkim osobom z wyższym wykształceniem nabór na nowe stanowiska w administracji miasta! Rozbudowa Wiecznego Miasta wymaga nowych gałęzi zarządzania, które zapewnią stały wzrost. Miasto zostanie podzielone na cztery dzielnice: senacką, centralną, cesarską i plebejską. Każda otrzyma radę nadzorczą, a piąta rada zajmie się edukacją. Szczególnie zachęcamy obywateli z doświadczeniem administracyjnym, lecz nie jest ono konieczne dla osób gotowych podjąć pracę na niższych szczeblach."

CAL_central_district: "Dzielnica centralna"
CAL_central_district_desc: "Wkrótce ruszy renowacja dzielnicy centralnej! Dostojni Kalizjanie i Kalizjanki w nowej radzie dzielnicy ciężko pracują nad projektami, które uczynią centrum prawdziwą dumą miasta. Ogród Bogini Diany ozdobią nowe posągi, a pośrodku stanie wielka fontanna z obliczem Cesarza Ricardusa Augustusa Calisiusa. Stare miasto i rynek także doczekają się niezbędnych napraw, by sprostać godnym standardom Res Publici. Rada zaprasza wykształconych obywateli oraz pasjonatów florystyki do pomocy w dekorowaniu Ogrodu i rynku, gwarantując zapłatę w denarach."

CAL_forum_calisianum: "Forum Calisianum"
CAL_forum_calisianum_desc: "Mieszczanie Urbs! Forum jest sercem każdego miasta! Jeśli pozostanie barbarzyńskie, będzie pompować brutalną krew w Cesarstwo, a nasza misja cywilizacyjna pójdzie na marne! Cesarz postanowił więc przebudować Forum Calisianum w bardziej klasycznym stylu. Marmurowe gmachy, strzeliste kolumny i piękne tympanony napełnią wasze serca i dusze boskim spokojem. Ponieważ dostosowanie architektury potrwa długo, wydarzenia handlowe, kulturalne i polityczne zostaną tymczasowo wstrzymane. Wkrótce jednak Kalizjanie znów będą świętować najukochańsze uroczystości! Euforia Dies Natalis Solis Invicti i obfitość festiwalu Carrucae Cibi będą większe niż kiedykolwiek!"

CAL_colossus_of_calisia_in_city_park: "Kolos Calisii w Parku Miejskim"
CAL_colossus_of_calisia_in_city_park_desc: "Ludu! Nawet w najmroczniejszych dniach metropolii pamiętaliście o starożytnych korzeniach. Jeszcze niedawno można było fotografować się ze wspaniałym posągiem Calisii - bogini opiekuńczej naszego miasta! Gdyby nie niszczycielski najazd Germańskiej Hordy, wciąż sycilibyśmy oczy jej szlachetnym obliczem. Na początek nowej epoki historii rzymsko-kalizjańskiej wypełnimy park licznymi rzeźbami Calisii i innych bóstw. Powróci też ikoniczny posąg rodzimej bogini z tarczą i corona muralis. Zostanie odtworzony dokładnie, lecz z jedną zasadniczą różnicą: będzie miał ponad 30 metrów wysokości! Wzniesiony nad Prosną przywita wszystkie statki zmierzające do miasta, godnie zastępując Kolosa Rodyjskiego wśród Cudów Świata."

CAL_thermae_ricardiae: "Thermae Ricardiae"
CAL_thermae_ricardiae_desc: "Cesarz zarządził budowę wspaniałych Thermae w Ogrodzie Diany! Według architektów Łaźnie pomieszczą liczne baseny, w których będzie można wygotować z siebie wszelkie nieczystości, 7 mniejszych basenów z wodami leczniczymi oraz wiele rekreacyjnych jacuzzi, saun, a nawet stołów do masażu. \n\nCesarz i architekci z dumą ogłaszają, że na wielkie otwarcie Thermae Ricardiae przybędzie delegacja dyplomatów z odległej Nitrii. Tak wielki podziw świata budzi wspaniałość Calisii!"

CAL_turning_city_stadium_into_colosseum: "Przekształcenie Stadionu Miejski w Koloseum"
CAL_turning_city_stadium_into_colosseum_desc: "Cesarz potrzebuje wielkiego amfiteatru, a lud Calisii stadionu będącego czymś więcej niż przesadnie sławionym boiskiem piłkarskim... Amphitheatrum Calisianum będzie znacznie większe i majestatyczniejsze od obecnej żałosnej budowli, a ikoniczne rzymskie łuki ochronią widzów przed gniewem żywiołów. Zapewni też szlachetniejszy i bardziej różnorodny repertuar. Oprócz ukochanego pediliudium Koloseum zaoferuje pojedynki gladiatorów, rekonstrukcje bitew, egzekucje z udziałem ludzi i bestii, a nawet inscenizowane starcia morskie! Wszyscy są zaproszeni, by wreszcie ujrzeć prawdziwą rozrywkę klas wyższych."

CAL_turning_cycling_track_into_circus_maximus: "Przekształcenie toru kolarskiego w Circus Maximus"
CAL_turning_cycling_track_into_circus_maximus_desc: "Mimo stuleci germańskiej propagandy kolejne ślady wskazują na starożytne rzymskie dziedzictwo Calisii. Jednym z dowodów jest tor kolarski, wyraźnie wzorowany na słynnym Circus Maximus. Wspaniałomyślny Ricardus Calisius nakazał odnowić tor i przywrócić mu dawną chwałę. Bez obaw, obywatele! Nie wprowadzimy pojazdów silnikowych, bo byłoby to sprzeczne ze starożytną ideą sportu! Wyścigi rydwanów powrócą po długiej przerwie, lecz Cesarz w swej nienasyconej ciekawości zezwolił także na zawody rowerowe. Najodważniejsi kolarze mogą, jeśli zechcą, ścigać się z końmi."

CAL_reconstruction_of_defence_walls: "Odbudowa murów obronnych"
CAL_reconstruction_of_defence_walls_desc: "Obywatele! Aby zapobiegawczo zabezpieczyć Wieczne Miasto przed barbarzyńskim zagrożeniem, stolicę wkrótce otoczą nieprzebyte mury chroniące nawet przed największymi armiami świata! Muri Ricardiani powstaną na pozostałościach dawnych umocnień, podwajając ich wysokość i grubość oraz zamykając Calisię w niemożliwej do skruszenia skorupie. \n\nMieszkańców domów przy wewnętrznej stronie muru prosi się o szybką przeprowadzkę. Okolice rozwidlenia Prosny zostaną wykorzystane jako pozycje obronne i po rozpoczęciu budowy staną się strefą zamkniętą. Wtargnięcie będzie surowo karane."

CAL_imperial_district: "Dzielnica cesarska"
CAL_imperial_district_desc: "Rozkazy Rady Dzielnicy Cesarskiej! Wszyscy obywatele mieszkający w granicach miasta na wschód od via Varsovia i via Navis mają natychmiast opuścić teren. Odmowa spotka się z szybką reakcją Gwardii Pretoriańskiej i możliwym więzieniem. Wysiedleni otrzymają tymczasowe mieszkania w Dzielnicy Plebejskiej, lecz jeśli zechcą w nich pozostać, będą musieli wykupić je w miesięcznych ratach. Każdy maruder znaleziony na tym obszarze zostanie zatrzymany i uwięziony za utrudnianie działania Res Publica."

CAL_new_palace_for_emperor: "Nowy Pałac dla Cesarza"
CAL_new_palace_for_emperor_desc: "Bujne ogrody, ogromne posągi, figowce, bananowce, palmy daktylowe, wierzby płaczące, brzozy oraz rozległy pałac godny samego Jowisza. Na północy Wiecznego Miasta w rekordowym czasie powstanie olbrzymi pałac, dzieło najlepszych rzemieślników Cesarstwa.\nTo wielkie przedsięwzięcie wynika ze świętego obowiązku uczczenia dostojnej pozycji Cesarza i zapewnienia mu spokojnej siedziby godnej jego szlachetnej rangi.\n\nBudowa stworzy liczne miejsca pracy dla wykwalifikowanych rzemieślników, robotników, architektów i artystów z całej Calisii. Kamieniarze, cieśle, malarze, rzeźbiarze i przedstawiciele wielu innych fachów znajdą mnóstwo okazji do wniesienia talentu w ten prestiżowy projekt. \nDołączcie do wysiłku! Niech bogowie go pobłogosławią, a pałac świadczy o wiecznej lojalności wobec ukochanego Cesarza i Calisii!"

CAL_architects_from_france: "Architekci z Francji"
CAL_architects_from_france_desc: "Budowa Pałacu trwa! Wyznaczono działki, wysiedlono ludność, by oczyścić teren, i zgromadzono potrzebne materiały! Aby dzieło było jeszcze doskonalsze, wkrótce przybędą sławni architekci z Galii, znani z mistrzostwa projektowania i inżynierii, by pokierować prestiżowym projektem. \n\nNajlepsi z najlepszych; ich przodkowie tworzyli największe cuda Galii, oni sami pracują bez wytchnienia, a plotki głoszą, że zawdzięczają to magicznemu napojowi. Cóż, my też mamy własne magiczne mikstury! \n\nPod ich biegłym kierownictwem pałac stanie się arcydziełem architektury, harmonijnym połączeniem artyzmu i funkcjonalności. Powitajmy galijskich przyjaciół z otwartymi ramionami i pracujmy ramię w ramię dla wspólnej wizji przyszłej wspaniałości Calisii!"

CAL_local_architects: "Miejscowi architekci"
CAL_local_architects_desc: "Obywatele Calisii! Wzywamy utalentowanych miejscowych architektów do udziału w szlachetnym dziele budowy wielkiego Pałacu dla Cesarza! Poszukujemy rzemieślników głęboko rozumiejących dziedzictwo architektoniczne miasta i żarliwie dążących do doskonałości.\n\nWymagania obejmują: biegłość w projektowaniu i planowaniu, szeroką znajomość lokalnych przepisów budowlanych, umiejętność współpracy z innymi architektami i ekipami, twórczą wizję i nowatorskie pomysły, wysoką odporność na upicie się oraz dostępnego szwagra.\n\nKandydaci spełniający kryteria mogą przedstawić portfolio i propozycje Komitetowi Budowy Pałacu. Wspólnie stwórzmy pałac świadczący o kunszcie architektonicznym Calisii i jej trwałym dziedzictwie!"

CAL_calisia_caput_mundi: "Calisia Caput Mundi"
CAL_calisia_caput_mundi_desc: "Radujcie się, bo nadeszły podniosłe czasy! Czekają nas trzy dni nieustannej zabawy na zakończenie infrastrukturalnych przedsięwzięć miasta. Przygotujcie się na niezrównaną ferię muzyki, tańca, uczt i radości!\n\nUroczystości otworzy majestatyczny pochód ulicami Calisii, prowadzony wspólnie przez dostojników, rzemieślników i obywateli.\nDrugiego dnia miasto wypełnią widoki, dźwięki i zapachy wystawnej uczty - niech Bachus błogosławi wasze kielichy!\nGdy zmierzch zapadnie nad ostatnim dniem, miasto rozświetli wspaniały pokaz świateł, fajerwerków i pirotechniki. Firmament Calisii zalśni kalejdoskopem barw i blasku, zwiastując promienną przyszłość metropolii.\n\nNasze miasto przyćmiło nawet chwałę Rzymu! Pałac, świątynie, marmurowe bloki, drogi, biblioteki, urzędy, ogrody i winnice. To wszystko i jeszcze więcej lśni teraz w klejnocie Okcydentu, którym stała się Calisia! Jesteśmy stolicą całego cywilizowanego świata!\n\nCALISIA CAPUT MUNDI!"

CAL_senate_disctrict: "Dzielnica senatorska"
CAL_senate_disctrict_desc: "Wieści od - niech jego imię będzie błogosławione - Cesarza Calisii! Ricardus Augustus Calisius mobilizuje najlepszych rzemieślników i budowniczych oraz oficjalnie ogłasza początek budowy nowej Dzielnicy Senatorskiej dla miasta i całego Cesarstwa! Obejmie ona południowy brzeg Prosny od Forum Calisianum oraz oba brzegi Canalis Submersor. Miejscowe kamienice zostaną przebudowane albo, jeśli zajdzie potrzeba, zburzone i zastąpione nowymi. \n\nLudność zostanie przeniesiona na osiedla w dzielnicach Paradisi, Ripinus, Bono i Horti. Przesiedlenia zaczną się, gdy tylko mieszkania zostaną uznane za gotowe. \n\nChwała Calisiusowi, chwała Calisii, a boskie moce niech obdarzą senatorów łaską."

CAL_imperial_university_of_calisia: "Cesarski Uniwersytet Calisii"
CAL_imperial_university_of_calisia_desc: "Obywatele Calisii, Rada Edukacji ma dla was ogłoszenie! Uniwersytet Kalizjański przejdzie wkrótce liczne zmiany potrzebne do osiągnięcia naszych chwalebnych standardów. Odtąd będzie nosił nazwę Cesarskiego Uniwersytetu Calisii, a jego patronem zostanie łaskawy Cesarz Ricardus Augustus Calisius. Wkrótce rozpocznie się wielka rozbudowa, obejmująca nowe wydziały na obrzeżach miasta. Biblioteka prosi o darowizny podręczników, materiałów naukowych i dokumentów! Kalizjanie! Pomóżcie kształcić przyszłe elity intelektualne!"

CAL_building_campus: "Budowa kampusu"
CAL_building_campus_desc: "Uczeni i studenci, radujcie się! Na terenie akademików przy ulicy Nova Mundus powstanie kampus Cesarskiego Uniwersytetu Calisii. Znajdą się tam nowe instytuty i wydziały, między innymi Sztuk Pięknych, Filozofii i Teologii. Uniwersytet przypomina obywatelom, że każdy chętny może ubiegać się o członkostwo w kadrze akademickiej! Pierwszeństwo mają doświadczeni kandydaci, lecz każdy dostatecznie oddany swej dziedzinie może złożyć wniosek niezależnie od formalnego wykształcenia. Zgłoście się już dziś! Nadal jest wiele wakatów, a wkrótce będzie ich jeszcze więcej - kto wie, jak szybko nauczyciele rzucą się ku szansie wychowania następnego pokolenia kalizjańskich myślicieli?"

CAL_great_calisian_library: "Wielka Biblioteka Kalizjańska"
CAL_great_calisian_library_desc: "Synowie i córki Calisii! Żyjemy w prawdziwie oświeconych czasach. Aby zachować wiedzę dla przyszłych pokoleń i tych, którzy kiedyś będą badać nasze osiągnięcia, Cesarz bezpośrednio sfinansował ogromną, strzelistą bibliotekę dorobku naszej cywilizacji. Trafiły do niej już dzieła z prywatnej kolekcji Ricardusa Calisiusa, hojne dary prominentnych osób i cenne prace ze wszystkich zakątków Cesarstwa. \n\nPosiadaczy rzadkich lub historycznych ksiąg prosi się o wzbogacenie rosnącej kolekcji. Szczególnie pożądane są kopie tekstów uznanych za zaginione, za które przewidziano nagrodę 100 denarów za sztukę."

CAL_building_worthy_of_senate: "Gmach godny Senatu"
CAL_building_worthy_of_senate_desc: "Rozpoczęła się budowa nowej Curia Ricardia! Nowa siedziba Senatu na opuszczonej działce przy via Onussus II ma, według Cesarza, świadczyć o chwale i wspaniałości Calisii. Na plac budowy wolno wejść wyłącznie najlepszym architektom, budowniczym, kamieniarzom, złotnikom, brązownikom, mosiężnikom, srebrnikom, cieślom i tkaczom osobiście zatwierdzonym przez Cesarza i jego komisję. Wszystkim wymienionym fachowcom w Calisii nakazuje się natychmiast przedstawić portfolio przed Cesarskim Tronem. Mieszkający dalej od stolicy mogą prezentować wybrane prace przez najbliższe dwa miesiące. \n\nMniej zdolni robotnicy zajmą się przestrzeniami publicznymi na działkach otaczających przyszłą Curia Ricardia. Budowa ruszy po bezpiecznym przesiedleniu miejscowej ludności..."

CAL_central_imperial_departament: "Centralny Departament Cesarski"
CAL_central_imperial_departament_desc: "Cesarski Rząd Calisii otrzymał wszystkie budynki między Via Libertatis a Canalis Submersor, z wyjątkiem Sądu Okręgowego! Zostaną one odnowione, przebudowane lub zastąpione, by lepiej służyć nowej funkcji i celom reprezentacyjnym. Obecni mieszkańcy przeniosą się do nowych lokali w Dzielnicy Plebejskiej, gdy kamienice będą gotowe. \n\nPo konsultacjach z resztkami ludności wenedzkiej Rada Miejska sprzeciwiła się woli Senatu i nakazała zachować posąg mitycznego barbarzyńskiego bohatera przed Sądem. Planowane figury Cesarza Calisiusa i Jowisza staną więc obok niego zamiast całkowicie go zastąpić."
CAL_central_imperial_department_tt: "§HNowy kompleks§! usprawni §Hintegrowanie nowych ziem§!"
####\"Osiedla Ricardiusa\" mają się odnosić do tych nowych budynków mieszkalnych na Rajskowie, Rypinku, Dobrze i Ogrodach. z racji że państwo pewnie co chwila trąbiłoby o tych osiedlach to i ludziom by rozmowy o nich spowszedniały, to i chciałem dorobić im dodatkową nazwę powszechną

CAL_grand_tabularium: "Wielkie Tabularium"
CAL_grand_tabularium_desc: "W swej nieskończonej mądrości Cesarz polecił najlepszym administratorom stworzyć wyczerpujące archiwum wszystkich dokumentów dotyczących rządów i historii państwa! W ciągu miesiąca miejscowi magistraci mają przekazać kopie istniejących akt oraz szczegółową listę brakujących orzeczeń, przepisów i kodeksów. Niewykonanie dekretu spowoduje przejęcie całej dokumentacji przez Cesarski Korpus Administracyjny. \n\nObywatele Calisii mają dokładnie przeszukać dobytek w poszukiwaniu akt zagubionych podczas Upadku. Znaleziska należy oddać Cesarskiemu Archiwum; jako prawowita własność państwa nie podlegają rekompensacie!"

CAL_calisian_infrastructure: "Infrastruktura kalizjańska"
CAL_calisian_infrastructure_desc: "Współobywatele Calisii! Przygotujcie się na przedsięwzięcie o niespotykanej skali i ambicji, gdyż kładziemy podwaliny pod epokę, w której wszystkie drogi prowadzą do Calisii. Projekt obejmie wiele dziedzin infrastruktury: drogi, trakty, mosty, akwedukty, wieże łączności oraz sieci publiczne, w tym wodociągi i kanalizację. \n\nPoszukiwani będą wykwalifikowani rzemieślnicy, architekci i inżynierowie, którzy pomogą wznosić wielkie budowle i torować żołnierzom drogę ku chwale. Chętni do zdobycia cennych umiejętności w budownictwie i inżynierii otrzymają możliwość praktyk oraz szkolenia zawodowego.\n\nNie czekajcie! Zaciągnijcie się już dziś!"

CAL_aqueducts_on_prosna: "Akwedukty na Prośnie"
CAL_aqueducts_on_prosna_desc: "Potęga Prosny zostanie ujarzmiona! Płynąc wielkimi akweduktami, zapisze opowieść o triumfie w ziemi Calisii. Projekt rozpocznie się od pełnych pomiarów dorzecza, mapowania jego kształtu i badania przepływu, by wyznaczyć najlepsze trasy. Dzięki licznym kanałom istniejącym już w mieście będzie to jedynie formalność. \n\nPo ukończeniu badań mistrzowie architektury i hydrotechniki precyzyjnie zaprojektują akwedukty, a pewnego dnia ich majestatyczne łuki i strzeliste filary ozdobią horyzont. Radujcie się, bo woda popłynie niczym symfonia życia, karmiąc serce miasta każdą spadającą kroplą!"

CAL_new_bridges_on_varta: "Nowe mosty"
CAL_new_bridges_on_varta_desc: "Rada miejska ogłosiła ogromny projekt budowy mostów! Liczne nowe przeprawy połączą oba brzegi Prosny w jedną wielką metropolię! Obecne nielegalne kładki mają zostać rozebrane przez właścicieli, a zastąpią je konstrukcje z najlepszego kamienia, dzieło cechu murarzy i najzdolniejszych miejscowych rzemieślników. Podczas robót ruch nad rzeką może być zakłócany bez uprzedzenia. \n\nPotrzebna pomoc przy usuwaniu gruzu z południowych brzegów. Kamienie można zatrzymać i sprzedać cechowi po stałych stawkach. Na prośbę cechu przyjmowane będą wyłącznie całe, nieuszkodzone sztuki."

CAL_pillars_of_mercury: "Filary Merkurego"
CAL_pillars_of_mercury_desc: "Obywatele stolicy! Aby usprawnić więź z boskimi sferami, w całym kalizjańskim municipium wzniesiemy najnowocześniejsze anteny VG, podnosząc infrastrukturę łączności na niespotykany poziom.\n\nMożecie być pewni, że zostały starannie zaprojektowane i przetestowane pod kątem bezpieczeństwa oraz niezawodności. Rozumiemy obawy wobec nowych technologii, lecz zapewniamy, że anteny nie wyrządzą obywatelom szkody.\n\nOstrzegamy tych, którzy pragną podważyć władzę: każda próba sabotażu lub zniszczenia filarów spotka się z szybką i bezlitosną odpłatą. Z Filarami Merkurego nie wolno igrać; ucieleśniają boską potęgę i wszechmoc!"

CAL_via_calisiana: "Via Calisiana"
CAL_via_calisiana_desc: "Wieści dla mieszkańców miasta Calisia! Cesarz ogłasza renowację i modernizację via Calisiana, dawniej znanej pod przestarzałą i pozbawioną blasku nazwą via Electri. Ponieważ trasa będzie nieprzejezdna, dojeżdżającym zaleca się zaplanowanie alternatywnej drogi do pracy albo wykorzystanie okazji do przejścia na zdrowszy środek transportu. \n\nPracownicy budowy dróg mają zgłosić się do Rady Miejskiej po instrukcje. Cesarz obiecał solidną nagrodę, jeśli szybko ukończą roboty. Nie chcecie jej przegapić."

CAL_viae_publicae: "Viae Publicae"
CAL_viae_publicae_desc: "Na mocy dekretu Cesarza izolacja stolicy od reszty Cesarstwa wkrótce dobiegnie końca! W całym kalizjańskim interiorze trwa ogromny projekt łączący główne ośrodki administracyjne, handlowe i wojskowe gęstą siecią Viae, która zapewni niespotykany przepływ dóbr i zasobów. Uwaga: w kluczowych miejscach od pojazdów cywilnych i handlowych pobierane będzie myto zależne od wartości ładunku. \n\nNa odcinku Calisia-Urusulus występują poważne opóźnienia. Ośmiu nadzorców stracono za rażącą niekompetencję i złe zarządzanie środkami. Do czasu znalezienia odpowiednich następców budowę tymczasowo wstrzymano."

CAL_interchange_hubs: "Węzły przesiadkowe"
CAL_interchange_hubs_desc: "Dumni obywatele Calisii! Przekształcamy ukochane miasto we wzór innowacji i dobrobytu, przeto z dumą ogłaszam ulepszenia sieci transportowej zarządzone mądrością Cesarza. Przy głównych wjazdach powstaną parkingi \"parkuj i jedź\", pozwalające przesiąść się z powozów do nowoczesnych autobusów stylizowanych na rydwany. We wszystkich dzielnicach zbudujemy centralne węzły zapewniające płynne połączenia między gwarnymi targami a spokojnymi osiedlami.\nW związku z rozwojem poszukiwane są osoby zdolne prowadzić nowe autobusy. Kandydaci mogą się zgłaszać, o ile nie należą do kłopotliwego Cechu Przewoźników, gdyż strajki i zakłócenia są bezwzględnie zakazane w zawodach kluczowych dla transportu publicznego."

CAL_viae_vicinales: "Viae Vicinales"
CAL_viae_vicinales_desc: "Wieści dla zewnętrznych prowincji Calisii! Najhojniejszy Ricardus Augustus Calisius skierował wojska do budowy dróg w całym Cesarstwie. Wszystkie główne nieutwardzone połączenia między wsiami i miasteczkami zostaną wybrukowane, a istniejące drogi niższej rangi przebudowane z myślą o trwałości i przemarszu wielkich grup. \n\nPonadto armia połączy setki kluczowych miejsc. Z powodu ograniczeń czasowych wynikających ze stale zmieniających się granic rosnącej Calisii połączenia te na razie pozostaną nieutwardzone."

CAL_suburban_horrea: "Podmiejskie Horrea"
CAL_suburban_horrea_desc: "Smród gnijących plonów nie będzie już nawiedzał wsi! Znamy skargi, że reformy Ager Publicus doprowadziły do nagromadzenia zbóż i żywności znacznie ponad przewidywaną normę, przepełniając istniejące magazyny. Rozwiązanie nadejdzie wkrótce: Senat planuje rozbudowę infrastruktury przez nowe magazyny i silosy zbożowe w zewnętrznych dzielnicach Calisii. Systemy chłodzenia zapewni Collegium Elektryków Fulgur. Fulgur - ujarzmiamy błyskawice od 2026 roku."

### CZWARTE DRZEWKO - WOJSKO ###

CAL_exercitus_calisus: "Exercitus Calisius"
CAL_exercitus_calisus_desc: "Cesarz i państwo zarządzili rozbudowę oraz modernizację całej armii kalizjańskiej! Wkrótce Legiony będą walczyć u boku potężnych vehiculi armatae, a zwinne aeroplany zbombardują pozycje wroga z niebios! \nWszystkim osobom i przedsiębiorstwom związanym z wojskiem, inżynierią, pojazdami i uzbrojeniem *nakazuje się* uważnie śledzić przyszłe ogłoszenia armii i rządu. Administracja oraz infrastruktura wojskowa zostaną przeorganizowane wraz z wprowadzeniem nowych formacji i sprzętu. Prywatnym inwestorom zaleca się wspieranie i rozszerzanie kalizjańskiego wysiłku wojennego. \n\nCesarz ma nadzieję, że po reorganizacji młode państwo kalizjańskie zdoła stawić czoła nawet armiom spoza Wenedii, w tym Germanom i Tatarom. \nChwała Cesarzowi i chwała Res Publice."

CAL_machines_from_the_myths: "Mityczne maszyny"
CAL_machines_from_the_myths_desc: "Stale rosnące Cesarstwo Kalizjańskie rozpościera skrzydła i wzbija się niczym polujący orzeł! Potężny Ricardus Calisius ogłasza utworzenie Exercitus Aerem Calisiae! Kalizjańskie siły powietrzne pomogą armii rozszerzać granice, wspierać oddziały frontowe, obserwować pozycje wroga i zbuntowane tereny oraz bezkarnie razić kluczowe cele głęboko za liniami przeciwnika. Według Cesarza inwestycje te wyniosą Calisię - już górującą nad żałosnymi miasteczkami reszty Europy - do grona najbardziej szanowanych potęg wojskowych kontynentu. \n\nArmia przejmie wszystkie maszyny dawnego Exercitus Aerem Poloniae, a każda osoba posiadająca je lub znająca ich położenie ma natychmiast zgłosić się do najbliższego garnizonu. \nZatajenie informacji lub zatrzymanie pojazdu będzie karane jako zdrada państwa."

CAL_calisian_icarii: "Ikariusze"
CAL_calisian_icarii_desc: "Wieści z armii kalizjańskiej! Ośrodki szkolenia lotniczego są już oficjalnie otwarte - Calisia wzywa wszystkich patriotów, którzy marzyli o niebie! Dołączcie do Exercitus Aerem Calisiae i podbijcie przestworza w imię Calisii! \n\nWymagania: wiek od XVII do XLII lat, dobry stan zdrowia, brak historii narkotyków i poważnych przestępstw oraz co najmniej wykształcenie średnie. \nKandydaci muszą zdać egzaminy z rozumowania arytmetycznego, słownictwa i rozumienia tekstu. Osoby bez wyższego wykształcenia z fizyki lub matematyki zdają także egzaminy z tych dziedzin. \n\nWolni ludzie nieposiadający obywatelstwa, lecz spełniający warunki, również mogą kandydować. Służba gwarantuje obywatelstwo."

CAL_on_the_wings_of_giants: "Na skrzydłach olbrzymów"
CAL_on_the_wings_of_giants_desc: "Ricardus Calisius Victor Caelos zarządza utworzenie pełnowymiarowego przemysłu lotniczego Imperium Calisianum! Państwo przejmuje dawne zakłady produkcji samolotów, a wszystkim związanym wcześniej z branżą nakazuje natychmiast zgłosić się do rządu - otrzymają dobrze płatną pracę i mieszkanie zgodne z zawodem. Do budowy maszyn latających zapraszamy też inżynierów i robotników. \n\nCesarz zachęca inwestorów i prywatne firmy do tworzenia własnej floty powietrznej Calisii. Niech nazwiska waszych rodów staną się znane całemu światu - niech będą synonimem przerażających maszyn wojny."

CAL_aerial_screw_of_our_times: "Śruba powietrzna naszych czasów"
CAL_aerial_screw_of_our_times_desc: "Ricardus Augustus Calisius - zdobywca niebios - mobilizuje inżynierów, projektantów, pilotów i inwestorów do wykucia śmiercionośnych, zwinnych copterii! Armia żąda maszyn zdolnych wspierać ogniem, prowadzić rozpoznanie oraz transportować ładunki i rannych. Osoby związane z dawnym wenedzkim przemysłem lotniczym mają natychmiast zgłosić się do rządu, a wszystkie dawne fabryki lotnicze zostają przejęte przez państwo. \n\nCesarz zachęca inwestorów i prywatne przedsiębiorstwa do budowy floty powietrznej. Niech nazwiska waszych rodów staną się znane światu - i kojarzone z potwornymi maszynami wojny."

CAL_swarm_of_anisoptera: "Rój Anisopterae"
CAL_swarm_of_anisoptera_desc: "Współczujący Calisius kocha swych synów i córki oraz roni łzę za każdym wojownikiem poległym na polu bitwy. Choć śmiertelność żołnierzy jest znikoma, Cesarz postanowił ograniczyć ich cierpienie przez masową produkcję teleplana, zwanych także \"dronami\". Te bezzałogowe statki są zdalnie sterowane przez pilota znajdującego się daleko od walki, a mimo to potrafią zadawać precyzyjne i śmiertelne ciosy. Wkrótce wrogowie zadrżą przed rojem pożerającym żołnierzy niczym szarańcza plony! Model Anisoptera wyfrunie niebawem z fabryk i zaprezentuje pełnię chwały podczas nadchodzącej parady!"

CAL_imperial_aquilae: "Cesarskie Aquilae"
CAL_imperial_aquilae_desc: "Wieści dla przyszłych rekrutów Calisii! Ogłoszenia o nadchodzącej powietrznej dumie Cesarstwa musiały wzbudzić niecierpliwość. Wielu patrzy w niebo i pyta: \"Kiedy zobaczę te niezwykłe maszyny?\". Bez obaw. Latające cuda wkrótce przemierzą przestworza ku waszej uciesze! Zbierzcie całe rodziny na powietrzny triumf Calisii! Widowisko jest bezpłatne! Nowo wyszkoleni piloci wdzięcznie ułożą formacje przedstawiające kalizjańskie insygnia i szlachetne oblicze samego Dominusa. Wypatrujcie nieba!"

CAL_heores_of_aeneid: "Bohaterowie Eneidy"
CAL_heores_of_aeneid_desc: "Nasz lud jest przeznaczony morzom i rzekom! Tysiące lat temu Rzym założył Romulus, potomek Eneasza - trojańskiego wygnańca i odkrywcy. Wieki później potomkowie Romulusa wypłynęli z Rzymu przez Mare Balticum i Vartę, by osiąść nad Prosną i założyć ukochaną Calisię. Ich pełna morskiej soli krew wciąż płynie w naszych żyłach! Cesarz słusznie postanowił wykorzystać potencjał dziedzictwa i gruntownie zreformować marynarkę. Spodziewajcie się wspaniałych okrętów na brzegach miejscowych rzek! Przypomnijcie sobie to ogłoszenie, zanim zgłosicie vigiles pojawienie się morskich potworów."

CAL_titan_submersibles: "Jednostki podwodne 'Tytan'"
CAL_titan_submersibles_desc: "Wkrótce dzielni kalizjańscy marynarze zejdą do podwodnego królestwa, by powitać tytana Okeanosa we własnych tytanicznych pojazdach! Próby pozwolą wprowadzić do arsenału okręty podwodne, zdolne skrycie i śmiertelnie atakować wrogów. Nie będziemy już biernymi ofiarami podstępu z własnym koniem trojańskim. To znaczy, konikiem morskim.\n\nWkrótce wypuścimy potężną ławicę Charybdi, by dręczyła przeciwników. Tym razem Odyseusz im nie pomoże."

CAL_light_lembus_boats: "Lekkie łodzie Lembus"
CAL_light_lembus_boats_desc: "Choć wszechwidzące oczy Cesarza tęsknie spoglądają ku morzu, wie on, że aby dotrzeć do Bałtyku, marynarze muszą przedrzeć się rzekami. Wielkie okręty będą tam nieskuteczne. Potrzebujemy szybkich, małych i zwrotnych jednostek. Inżynierowie zaprojektowali więc okręt oparty na starożytnych łodziach lembus. Mimo rozmiaru stanie się cennym dodatkiem do floty, przewożąc żołnierzy i służąc jako pełnoprawna jednostka bojowa w potyczkach."

CAL_reintroduction_of_quinquereme: "Powrót Kwinkweremy"
CAL_reintroduction_of_quinquereme_desc: "Oto najpotężniejsze okręty, które wkrótce walczyć będą ku chwale Calisii. Kwinkwerema - statek z pięcioma rzędami wioseł - nie była największym okrętem Rzymian, lecz wystarczyła, gdy musieli przystosować się do walki z krwiożerczą Kartaginą. Ich sytuacja przypomina naszą, bo my także musimy nauczyć się wojny morskiej. A gdy naprawdę opanujemy morza, zbudujemy jeszcze potworniejsze okręty!"

CAL_ramming_speed: "Cała naprzód!"
CAL_ramming_speed_desc: "Nie lękajcie się, ludu Calisii. Barbarzyńców i ich brutalne taktyki można pokonać w odpowiednio nieskomplikowany sposób. Złożone manewry i artyleria morska są zbędnymi sztuczkami. Wystarczy, by prawi synowie Calisii ruszyli do szarży, wskoczyli na wrogie okręty i szerzyli tam sprawiedliwą rzeź. Jeśli kiedyś zmierzymy się z kimś bardziej zaawansowanym, być może potrzebne będą lepsze taktyki. Na razie jednak taka perspektywa jest odległa."

CAL_steel_chariots: "Stalowe rydwany"
CAL_steel_chariots_desc: "W uznaniu naszej nowej potęgi i potrzeb współczesnego pola bitwy cesarski sztab generalny zabiega o stworzenie infrastruktury i przemysłu potrzebnych do budowy własnych stalowych rydwanów - najciężej opancerzonych machin wojennych! Niech ta dalekowzroczność przyniesie nam niezliczone przełamania i niezmierzoną siłę!"

CAL_armoured_behemoths: "Opancerzone behemoty"
CAL_armoured_behemoths_desc: "Wieści dla obywateli Calisii! Wkrótce pojawią się nowe modele wojskowe! Pierwszy prototyp rodzimych rydwanów bojowych wysłano na próby w warunkach wojennych! Pod roboczą nazwą \"Titus Pullo\" jego potężny, nieprzenikniony pancerz i straszliwe tormentae nie znajdą sobie równych na żadnym polu bitwy, na którym Cesarstwo będzie zmuszone walczyć! \n\nMiejcie się na baczności i kupujcie obligacje wojenne, obywatele, by nasza pancerna pięść stała się jeszcze silniejsza!"

CAL_modern_testudo: "Nowoczesne Testudo"
CAL_modern_testudo_desc: "Kolejny przełom w kalizjańskiej sztuce wojennej! Jakby rydwany bojowe nie były dość potężne, Magister Militum postanowił wprowadzić nowy model pancerza reaktywnego Testudo, zwiększający przeżywalność sił! \n\nTestudo powstało specjalnie z myślą o współczesnych zagrożeniach przeciwpancernych: teleplanach, rakietowych pilum i innych, gorszych rzeczach. Nowy, *kalizjański* pancerz reaktywny odeprze każde zagrożenie niczym dawna formacja Testudo! \n\nNiech stalowe bestie wojny zapewnią nam nieskończone triumfy!"

CAL_ironclad_vehicula: "Pancerne Vehicula"
CAL_ironclad_vehicula_desc: "Wieści dla Legionów Calisii! Ministerstwo Wojny rozpoczyna mechanizację piechoty i wkrótce jednostki otrzymają pierwsze partie opancerzonych pojazdów. \n\nProces rozpocznie się w tym tygodniu i potrwa kilka miesięcy. Początkowo do prób trafią tylko lekko uzbrojone transportery; pierwsze Vehiculii Peditum Pugnatum powinny wejść do służby w nadchodzących tygodniach. \n\nJak zawsze Cesarstwo zachęca inwestorów i prywatne firmy do tworzenia oraz rozwijania kalizjańskich kohort pancernych. Niech nazwiska waszych rodów będą znane na całym świecie i kojarzone z przerażającymi maszynami wojny."

CAL_imperial_land_raiders: "Cesarscy najeźdźcy lądowi"
CAL_imperial_land_raiders_desc: "Po pomyślnych próbach pierwszego modelu Armatae Personas Currus Ministerstwo Wojny jest gotowe wprowadzić Vehiculii Peditum Pugnatum do służby. Pojazdy trafią do wojska w ciągu dwudziestu-trzydziestu dni, a pierwsza partia dotrze do garnizonów jeszcze w tym tygodniu. \n\nCesarz Ricardus Augustus Calisius ufa przyszłym kohortom pancernym. Sprawcie, żeby był dumny, żołnierze. Dowiedźcie swemu władcy, że na polu bitwy jesteście godnymi spadkobiercami Luciusa Vorenusa!"

CAL_bellum_fulminatis: "Bellum Fulminatis"
CAL_bellum_fulminatis_desc: "Wieści dla ludu Sylvania Maiora Polonia! Magister Militum ogłasza, że od przyszłego tygodnia Pogorelia będzie przez miesiąc zamknięta dla wszystkich poza personelem wojskowym! Mieszkańcy Pogorelii i okolic mają tymczasowo opuścić domy i przenieść się do sąsiednich miast. \n\nObszar przeznaczono na miesięczne ćwiczenia z nowymi pojazdami pancernymi Legionu. Będą je obserwować i oceniać członkowie Ministerstwa Wojny w towarzystwie Cesarza Ricardusa Augustusa Calisiusa. \n\nNa czas manewrów mieszkańcy mogą bezpłatnie korzystać z pobliskich kwater. Armia z góry przeprasza za wszelkie szkody w lokalnej infrastrukturze cywilnej."

CAL_disciples_of_mars: "Adepci Marsa"
CAL_disciples_of_mars_desc: "Cesarz ogłasza utworzenie własnych *ujednoliconych*, *zawodowych* sił specjalnych Calisii! \nIstniejące wyspecjalizowane oddziały pomocnicze zostaną całkowicie przeorganizowane. Od podstaw zaplanowano struktury dowódcze i jednostkowe oraz program szkolenia formacji specjalnych. Powstanie też kilka nowych kohort, których liczba nie została jeszcze ustalona. \n\nReorganizacja zacznie się za dwa dni i potrwa około dwóch tygodni. Wszystkie obecne jednostki specjalistyczne mają czekać na rozkazy na stanowiskach. Personel opuszczający miejsce służby zostanie uznany za dezerterów. \n\nMinisterstwo Wojny poda dalsze informacje wraz z oficjalnym ogłoszeniem zmian. Potencjalni rekruci powinni czekać na komunikaty. \n\nChwała Calisii i chwała Jej Legionom."

CAL_champions_of_hercules: "Czempioni Herkulesa"
CAL_champions_of_hercules_desc: "Wieści dla górali Calisii! Przygotowując przyszłe podboje południowej Polonii, Cesarstwo tworzy wyspecjalizowane kohorty górskie! Cesarz osobiście wzywa wszystkich obeznanych z górskim terenem do Adsertes Herculii. \n\nChętni do \"Herkulesów\" powinni skontaktować się z najbliższym ośrodkiem rekrutacyjnym lub garnizonem pocztą elektroniczną albo telefonicznie. Dane kontaktowe znajdują się na odpowiednich stronach. \nPaństwo zastrzega sobie prawo automatycznego wcielania godnych barbarzyńskich górali z podbitych ziem. \n\nChwała Calisii."

CAL_hounds_of_neptune: "Ogary Neptuna"
CAL_hounds_of_neptune_desc: "Wieści dla rzecznych wędrowców Calisii! Państwo wzywa dumnych Kalizjan mających doświadczenie w pływaniu, wiosłowaniu, żeglowaniu lub pokonywaniu rzek do piechoty morskiej! \n\nJednostki Specjalne Canes Neptunii rozpoczynają dziś nabór. Urzędnicy wojskowi udali się do wszystkich nadrzecznych osad. Obywatele pragnący się zaciągnąć mają czekać w oficjalnym miejscu zamieszkania. \nBarbarzyńcy i nieobywatele uznani za przydatnych zostaną wcieleni automatycznie. Mieszkańcy osad oddalonych od wody muszą przedstawić dokument własności łodzi lub trofea wędkarskie. \n\nRekruci otrzymają dalsze instrukcje od jednostek w ciągu tygodnia."

CAL_harbingers_of_mercury: "Zwiastuni Merkurego"
CAL_harbingers_of_mercury_desc: "Cesarz Ricardus Augustus Calisius osobiście zarządza utworzenie Praenuntiae Mercurii - własnych wojsk powietrznodesantowych Calisii! Spadochroniarze będą przeprowadzać zaskakujące ataki w niedostępnych i niebronionych miejscach oraz tworzyć przyczółki powietrzne podczas wielkich ofensyw. Dodatkowa mobilność przyda się również w mniejszych starciach, na przykład z partyzantami. \n\nGodni legioniści, skoczkowie spadochronowi i dawni spadochroniarze z armii pokonanych przez Legiony mogą zgłaszać się do Praenuntiae Mercurii. Kandydować wolno także nieobywatelom z doświadczeniem spadochronowym, o ile dowiodą umiejętności."

CAL_sons_of_calisia: "Synowie Calisii"
CAL_sons_of_calisia_desc: "Wieści dla sił specjalnych Calisii! Po pierwszej fali ochotników Ministerstwo Wojny tworzy Kwaterę Główną i Centralne Dowództwo Virium Specialis dla Adsertes Herculii, Canes Neptunii i Praenuntiae Mercurii. Personel Centralnego Dowództwa zostanie wybrany przez Ministerstwo spośród jego własnych kadr, Legionów i ochotników. \n\nPo utworzeniu dowództwo wraz z Ministerstwem opracuje procedury działania wojsk specjalnych i skieruje regularnych żołnierzy do budowy baz operacyjnych."

CAL_vinician_army_reforms: "Winicjańskie reformy armii"
CAL_vinician_army_reforms_desc: "Wieści dla Legionów Calisii! \n\nMinisterstwo Wojny oficjalnie rozpoczyna długo oczekiwaną reformę jednostek regularnych! Według Marcusa Viniciusa - autora większości zmian - wszystkie Legiony i niewyspecjalizowane siły pomocnicze przejdą gruntowną reformę administracji, wyposażenia, szkolenia i taktyki. \n\nMinisterstwo planuje również aktywnie udoskonalać doktrynę armii na podstawie danych z pierwszych działań nowego modelu wojsk. \n\n\n*Cały personel wojskowy* ma czekać na dalsze ogłoszenia. Dodatkowe instrukcje mogą przyjść pocztą tradycyjną. Niewykonanie ich w ciągu 5 dni spowoduje konsekwencje określone przez organ wzywający."

CAL_standarization_of_our_armaments: "Standaryzacja uzbrojenia"
CAL_standarization_of_our_armaments_desc: "Wieści dla Legionów Calisii! W nadchodzącym tygodniu cały sprzęt wojskowy zostanie ponownie skatalogowany i ujednolicony. W ciągu trzech dni cały personel poza strażą graniczną ma zwrócić do kwater jednostek wyposażenie państwowe i prywatne. Wojska na pograniczu pozostaną na stanowiskach i tam otrzymają nowe zestawy. \n\nLegiony dostaną również nowoczesny model pancerza. Ze względu na skalę reorganizacji jego wydawanie zaplanowano na następne trzy tygodnie."

CAL_lorica_ballistica: "Lorica Ballistica"
CAL_lorica_ballistica_desc: "Wieści dla żołnierzy Calisii! Jutro rozpocznie się sześciodniowa dystrybucja nowej Lorica Ballistica. Pancerz z potężnego kevlaru, wyposażony w nośniki płyt balistycznych i liczne kieszenie na zamki, przeznaczono do walki z konwencjonalnymi armiami świata. \n\nWojska na granicach mają pozostać na stanowiskach pod groźbą wydalenia ze służby z hańbą. Limitanei otrzymają pancerze jako pierwsi. Mają pierwszeństwo przed oddziałami strzegącymi granic wenedzkich."

CAL_invest_in_auxilia: "Inwestycje w Auxilię"
CAL_invest_in_auxilia_desc: "Ministerstwo Wojny zarządza całkowitą reorganizację jednostek pomocniczych! Auxilia będą odtąd używać standardowych kalizjańskich struktur, biurokracji i wyposażenia, a ich żołnierzy obejmą formalne warunki służby. Zachowają rolę wyspecjalizowanych wojsk Cesarstwa, lecz dzięki standaryzacji i włączeniu w aparat armii wzrośnie ich skuteczność u boku Legionów i samodzielnie. \n\nWieści dla nieobywateli mieszkających w Calisii! Armia zaprasza was do Auxilii! Weźcie udział w rozbudowie największego, najszlachetniejszego i najbardziej dostojnego państwa Europy - jedzenie, braterstwo i chwała gwarantowane! Wolni ludzie spoza granic również mogą kandydować, jeśli spełniają warunki służby!"

CAL_siege_engines_of_empire: "Machiny oblężnicze Cesarstwa"
CAL_siege_engines_of_empire_desc: "Rozpoczyna się nowa epoka oblężeń, gdyż do Legionów zawitały pierwsze jednostki Tormentae! \nKalizjańska artyleria będzie bombardować umocnione pozycje w miastach, pozostawiając oblężonym jedynie prowizoryczne osłony z gruzu i pozwalając naszym wojskom niemal bez oporu zajmować miejscowości. \n\nWraz z rozwojem produkcji uzbrojenia rola Tormentae będzie się zmieniać. Bardziej zaawansowane działa i amunicja pozwolą atakować odległe magazyny, hangary machin wojennych, węzły logistyczne i ważne budynki polityczne."

CAL_calisian_way_of_war: "Kalizjański sposób wojowania"
CAL_calisian_way_of_war_desc: "Spójrzcie na nowe legiony Calisii! Chwała legatowi Marcusowi Viniciusowi. Krwawe zjednoczenie Venetia Maior nauczyło go, jak ulepszyć armię, a ogień rozbudowanej gospodarki pozwolił spełnić marzenia. Niech barbarzyńcy się strzegą! Tak jak przodkowie nauczyli się sztuki wojny od Galów, my nauczyliśmy się od własnych wrogów. Walcząc z nami, zaprojektowali własną zagładę. Zmiażdżymy wszelki opór między Viadrus a Bugą, gdyż prymitywy rozumieją tylko zaśpiew miecza. Oni będą cierpieć, lecz ich wnuki okażą wdzięczność, bo nawet służba u cywilizowanego człowieka jest lepsza od życia dzikusa."

CAL_schola_armaturarum: "Schola Armaturarum"
CAL_schola_armaturarum_desc: "Nie dotarlibyśmy tu bez dzielnych żołnierzy. Czas prostych potyczek dobiega jednak końca, a wojny będą coraz bardziej złożone wraz ze zbrojeniem się przyszłych wrogów. Potrzebujemy więc czegoś więcej niż liczebności i brutalnej siły: podstępu, zdolności adaptacji i logistyki. Jednym słowem - taktyki. Oraz ludzi za nią odpowiedzialnych. Cesarz Calisius zarządził zatem utworzenie Schola Armaturarum, która wyszkoli oficerów w strategii i zaawansowanej walce. Jak Calisius prowadzi Cesarstwo, tak oni poprowadzą armie jako przedłużenie cesarskiej woli. Z czasem zyskamy dowódców dorównujących sławą i umiejętnościami Scypionowi Afrykańskiemu czy Marcusowi Agryppie."

CAL_great_gladiatorial_training_school: "Ludus Magnus"
CAL_great_gladiatorial_training_school_desc: "Ludu! Calisius wie, że lojalnym obywatelom dla zaspokojenia ducha wystarczyłaby sama radość z wieści o postępach wojska. Mimo to łaskawy Cesarz postanowił wykorzystać nowe doświadczenie bojowe dla cywilów. Zainspirowany zaawansowanym szkoleniem Schola Armaturarum tworzy instytucję uczącą ludzi pojedynków i małych inscenizowanych bitew. Tak jest! Cesarz nakazał budowę Ludus Magnus - Wielkiej Szkoły Gladiatorów. To profesjonalne miejsce, gdzie niewolnicy i ochotnicy zdobędą namiastkę honoru, przelewając krew i wykonując egzekucje ku waszej uciesze! Nie będą walczyć jak bandyci w ciemnych zaułkach. Nauczą się przyciągać uwagę widowni i zapewniać rozrywkę. Ich występy zbliżą się do teatru, zachowując równowagę między sztuką a prawdziwą walką. Wznieśmy okrzyk na cześć hojnego Dominusa!"

CAL_foederati_officers: "Oficerowie Foederati"
CAL_foederati_officers_desc: "W Calisii ponad wszystko cenimy wiedzę i doświadczenie. Merytokracja Res Publici odróżnia nas od skorumpowanych królestw, które zniszczyliśmy. Teraz cierpimy z powodu sukcesu. Wraz z granicami wydłużyły się potencjalne fronty. Mamy dość żołnierzy, lecz za mało generałów. Calisius postanowił więc przyjąć śluby posłuszeństwa części pokonanych dowódców. W naszej armii odpokutują zbrodnie służby barbarzyńskim królom i archontom. Zanim pochopnie osądzicie tę kontrowersyjną decyzję, wysłuchajcie! Przez 10 lat generałowie nie będą mogli otrzymać obywatelstwa. Po tym czasie poznamy ich prawdziwą lojalność, a oni nauczą się, co znaczy być obywatelem Cesarstwa!"

CAL_si_vis_pacem_para_bellum: "Si Vis Pacem, Para Bellum"
CAL_si_vis_pacem_para_bellum_desc: "Ludu! Ustąpcie drogi dzielnym młodzieńcom! To oficerowie zmierzający do nowej Schola Armaturarum! Zdobędą tam doświadczenie, przygotują się do walki i zgromadzą trofea długich kampanii. Spójrzcie na te dumne twarze, jak maszerują dumnie w lśniących pancerzach doskonalić sztukę wojny. Najlepsi synowie Calisii! Z pewnością okażą się znakomitymi uczniami i szybko opanują nowe taktyki oraz formacje. Przełożeni będą dumni, gdy przyniosą chwałę rodzinom i całemu Imperium Calisianum."

CAL_establish_the_high_naval_magistrate: "Wysoki Magistrat Morski"
CAL_establish_the_high_naval_magistrate_desc: "Nasze dowództwo morskie cierpi na anarchię. Dowódcy poszczególnych okrętów są znakomici taktycznie i niszczą wrogie jednostki, lecz brak nam szerszej strategii. Obecna doktryna - a raczej jej brak - pozwalała im stosować indywidualne metody, czyniąc nas elastycznymi i nieprzewidywalnymi. Nieprzewidywalność jest jednak mieczem obosiecznym: sami nie potrafimy przewidzieć wyników bitew. Dotąd nie mogliśmy temu zaradzić. Po podboju Civitas Gdinensis możemy wreszcie utworzyć Wysoki Magistrat Morski. Zyskaliśmy swobodę na Mare Balticum i możemy wykorzystać wiedzę miejscowych. Wybierzemy najlepsze idee z mozaiki taktyk i połączymy je w spójną doktrynę! Rege, Calisia! Calisia, rege undas!"

CAL_fields_of_mars_training_grounds: "Poligon na Polach Marsowych"
CAL_fields_of_mars_training_grounds_desc: "Legioniści! Niosę radosne wieści z serca Cesarstwa! Na Polach Marsowych powstanie dla was olbrzymi ośrodek szkoleniowy! Macie dość gonienia dzików po lasach podczas ćwiczeń z orientacji? Nuży was wybieranie nieczystości z latryn Finis Mundi? Wkrótce będą to tylko wspomnienia!\n\nOśrodek będzie najnowocześniejszy w całej Europie. Po szkoleniu wyjdziecie nie tylko jako sprawni legioniści, ale jako najtwardsi synowie Hadesu, jacy stąpali po świecie! Chwyćcie gladiusy i przygotujcie się! Do pierwszego szkolenia zakwalifikują was wyłącznie ambicja i dowiedziony potencjał! Liczba miejsc jest ograniczona, łapcie okazję!"

CAL_school_of_daedalus: "Szkoła Dedala"
CAL_school_of_daedalus_desc: "Człowiek od zawsze marzył, by wzbić się ku niebu lekki jak wolny ptak, żeglować wśród chmur i chłonąć wiatr oraz słońce niczym ambrozję. Teraz i wy możecie dołączyć do niebiańskiego korpusu! Z ruin poprzedniej cywilizacji powstaje całkowicie odbudowana akademia lotnicza!\n\nKażdy kandydat przejdzie rygorystyczne próby wytrzymałości i zdolności, które ocenią jego przydatność do przemierzania merkuriańskich płaszczyzn rzeczywistości. Tylko najlepsi przejdą do rozszerzonego kursu, by uniknąć losu Ikara i podążyć śladami Dedala ku mistrzostwu lotnictwa!\n\nObywatele Calisii, ku niebiosom!"

CAL_institute_of_vitruvius: "Instytut Witruwiusza"
CAL_institute_of_vitruvius_desc: "Cesarz Ricardus Augustus Calisius ogłasza wielkie otwarcie Instytutu Witruwiusza i zaprasza wszystkich pragnących uczyć się i służyć Calisii! Kadrę utworzyli najlepsi eksperci Calisii i Polonii w inżynierii cywilnej oraz wojskowej, osobiście wybrani przez państwo, by Kalizjan uczyli wyłącznie *najwybitniejsi* wykładowcy kraju. \n\nCesarz osobiście zaprasza osoby biegłe w inżynierii wojskowej, logistycznej, materiałowej lub budowlanej do dalszego rozwoju i pełnego wykorzystania potencjału. \n\nNabór ruszy jutro o 7:00. Kandydować mogą wyłącznie obywatele Calisii."

CAL_homo_calisiensis: "Homo Calisiensis"
CAL_homo_calisiensis_desc: "Słuchajcie, obywatele Cesarstwa! Z wielką dumą ogłaszamy świt nowej epoki, w której duch Rzymu odrodzi się w naszych domach i sercach. Epoki przyjmującej ponadczasowe ideały przodków, pielęgnującej łacińską edukację i życie przesycone czcigodną tradycją.\n\nWyobraźcie sobie przyszłość, w której dzieci recytują Tacyta i Cycerona, a honor, obowiązek i dyscyplina wpajane są od kołyski. Przyszłość, w której ten sposób życia znów rozkwita, prowadząc ku niezrównanej jedności i sile.\nDla urzeczywistnienia wizji wprowadzamy gruntowną reformę edukacji z łacińskim programem w każdej szkole, by młode umysły kształtowała mądrość wieków. \n\nPropaganda wzmocni tożsamość kulturową i przypomni każdemu obywatelowi o wielkości, z której pochodzimy. Przyjmijcie tę drogę, gdyż odrodzenie starożytnych tradycji wykuje jaśniejszą i silniejszą przyszłość Calisii."

### CZWARTE DRZEWKO - KRYZYS TRZECIEJ DEKADY ###

CAL_crisis_of_the_third_decade: "Kryzys trzeciej dekady"
CAL_crisis_of_the_third_decade_desc: "Osoby wciąż używające kalendarza gregoriańskiego mają obowiązek przejść na kalendarz rikardiański. Cała korespondencja państwowa będzie odtąd datowana według niego. Dla wyjaśnienia: kalendarz rozpoczyna się w 1989 roku i składa z 10 miesięcy. Błędy w datach nie będą tolerowane.\n\nZ mniej istotnych wieści... cała kohorta zaginęła w Lesie Arkońskim. Patrycjusz Stanislaus Ianusus oferuje hojne nagrody za dostarczenie mu zbiegłych niewolników. W Francofurtum obserwujemy rosnącą liczbę barbarzyńców zmierzających ku limesowi, lecz Limitanei czujnie strzegą Viadrusu.\n\nAch! I najważniejsze - jutro w klubie Mons Dives odbędzie się wielka orgia organizowana przez Collegium Bachusa. Wstęp za symboliczną opłatą 20 denarów, niebiańskie rozkosze gwarantowane."

CAL_hippocratic_corpus: "Korpus Hipokratesa"
CAL_hippocratic_corpus_desc: "Młodzi adepci sztuki lekarskiej! Oto szansa dołączenia do szanowanych mistrzów dyscypliny. Dzięki osobistemu mecenatowi Cesarza, Akademia Medyczna otworzy bramy od następnego semestru, oferując niezrównane kształcenie w medycynie polowej. Studenci doświadczą chwały towarzyszenia Legionom, uczestnicząc w kampaniach w ramach programu i lecząc rany dzielnych synów Calisii, których obrażenia świadczą o ofierze dla Cesarstwa! \n\nNabór rozpocznie się w ciągu miesiąca. Zainteresowanych prosi się, by nie bezcześcili pobliskich grobów dla ćwiczeń anatomicznych. Każdy przyłapany na zabieraniu niezatwierdzonych pamiątek z operacji zostanie natychmiast wydalony."

CAL_catonian_academy: "Akademia Katońska"
CAL_catonian_academy_desc: "Wyobraźcie sobie przyszłość, w której przywódcy są nie tylko potężni, lecz także mądrzy; dyplomaci biegli w perswazji, a sędziowie wymierzają sprawiedliwość inspirowaną Rzymem. Nowa Akademia Katońska stworzy takich ludzi, ucząc wartości i wiedzy, które przetrwały próbę czasu. Najlepsi uczeni pogłębią studia klasyczne, rozwijając badania. Wspólne dziedzictwo zjednoczy naród, ograniczy konflikty i zbuduje harmonię.\n\nAbsolwenci, wykształceni w retoryce i filozofii, staną się wybitnymi doradcami i mężami stanu. Zasady prawa rzymskiego wzmocnią wymiar sprawiedliwości i walkę z korupcją. Akademia zwiększy też nasz prestiż na świecie, przyciągając uczonych i dostojników pragnących zobaczyć odrodzenie klasycznej edukacji.\n\nZapiszcie się dziś! Tylko najjaśniejsze umysły staną obok starożytnych gigantów jak Cyceron i Demostenes!"

CAL_roads_are_no_longer_safe: "Drogi nie są już bezpieczne"
CAL_roads_are_no_longer_safe_desc: "W odpowiedzi na wzrost liczby bandytów brutalnie napadających niewinnych cywilów na najnowocześniejszych prowincjonalnych drogach Calisii rozmieszczono specjalną grupę zadaniową. Zapewni bezpieczeństwo podróżnym, zlikwiduje ostatnie ogniska bezprawia i zwróci łupy prawowitym właścicielom. Dzięki regularnym patrolom w dawnych siedliskach przestępczości wszystkie drogi uznaje się odtąd za bezpieczne i nie ma potrzeby stosować dodatkowych środków ostrożności między municipiami. Cesarz osobiście gwarantuje, że złodzieje i bandyci nie stanowią zagrożenia dla przytłaczającej potęgi Calisii, a wkrótce zostaną doszczętnie pokonani i przykładnie ukarani."

CAL_establish_cohortes_urbanae: "Cohortes Urbanae"
CAL_establish_cohortes_urbanae_desc: "Dla bezpieczeństwa Cesarstwa dawne nieregularne patrole pretorian zastąpiono nową formacją strzegącą ulic każdego większego Municipium! Cohortes Urbanae mogą swobodnie przesłuchiwać, zatrzymywać i więzić podejrzanych o przestępstwa, by usunąć z Calisii wszelkie pozostałości bezprawia. Obywatele mają w pełni współpracować i słuchać rozkazów. Sprzeciw będzie traktowany jako jawne utrudnianie pracy Kohort i karany według uznania patrolujących. \n\nSkargi na nadużycie siły można składać w Głównym Urzędzie Dyscyplinarnym, a po wewnętrznym śledztwie może zostać przyznana rekompensata. Skargi bezzasadne i zmyślone będą traktowane jako jawne utrudnianie pracy Kohort i karane według uznania patrolujących."

CAL_collapse_of_the_export_system: "Upadek systemu eksportowego"
CAL_collapse_of_the_export_system_desc: "Obywatele! Barbarzyńcy tkwiący w prymitywnych obyczajach i przestarzałym myśleniu nie potrafią dostrzec prawdziwej wartości kalizjańskich produktów! Odrzucają i nękają naszych kupców. Z dzikusami nie da się prowadzić interesów, dlatego handel z ich wodzostwami został obustronnie zawieszony, aż nauczą się zachowywać. \n\nW Dzielnicy Merkuriańskiej dostępne będą przecenione zapasy luksusowych towarów, których nie można wywieźć. Najwyższa kalizjańska jakość w najbardziej konkurencyjnych cenach! Skorzystajcie z jedynej takiej okazji, wspierając miejscowych kupców i rzemieślników oraz własną kieszeń. Poczujcie się jak szlachta wśród ogromu luksusowych produktów."

CAL_inefficient_taxation: "Nieskuteczny system podatkowy"
CAL_inefficient_taxation_desc: "Wstrząs w Senacie! Popularzy przedstawili najbardziej radykalny projekt, chcąc nie tylko naprawić gospodarkę, ale też zmiażdżyć oligarchiczne elity. Żądają natychmiastowego, całkowitego zrównania majątków wszystkich obywateli bez względu na status oraz osobiste lub rodzinne zasługi. Oburzyło to opozycję i wielu umiarkowanych senatorów, których program opiera się na usuwaniu luk podatkowych i karaniu znanych oszustów dla podniesienia morale publicznego. Choć ta propozycja ma znaczne poparcie, wielu uważa ją za niewystarczającą i pozbawioną realnego wpływu. Liczni senatorowie pozostają nieprzekonani."

CAL_forced_equalization_of_wealth: "Przymusowe zrównanie majątków"
CAL_forced_equalization_of_wealth_desc: "Aby zwalczyć niedopuszczalne nierówności, powołano specjalną komisję nadzorującą finanse obywateli Calisii! Odtąd wszystkie wpływy i płynne rezerwy należy zgłaszać i natychmiast przekazywać Komisji, która rozdzieli je po równo, gwarantując każdej warstwie odpowiedni poziom życia w trudnych czasach. \n\nCesarz wzywa bogatych, by dla dobra Calisii w pełni wykonali dekret. Kwestorzy odwiedzą majątki prominentnych osób i szczegółowo zbadają źródła dochodów oraz wydatki. Współpraca zostanie doceniona, ale w razie oporu posłuszeństwo będzie wymuszone!"

CAL_public_punishments: "Kary publiczne"
CAL_public_punishments_desc: "Jutro na Forum Calisianum odbędzie się doraźna kara nikczemników, którzy bezprawnie gromadzili bogactwo należne Cesarstwu! Środki gnijące w ich piwnicach mogły służyć pomocy uciśnionym, dlatego winni popełnili zbrodnię nie tylko przeciw Cesarzowi, lecz także samemu ludowi. \n\nZa karę ich złodziejskie dłonie zostaną publicznie odcięte. Za 10 denarów widzowie mogą kupić kamień do rzucenia w przestępców. Wolno kupić dowolną liczbę, ale za chybiony rzut nie przysługuje zwrot ani druga próba."

CAL_to_the_last_denarius: "Do ostatniego denara"
CAL_to_the_last_denarius_desc: "Aby utrzymać wypłacalność chwalebnego Cesarstwa, natychmiast wprowadzono tymczasową dyrektywę jednolicie podnoszącą o dziesięć procent podatek od wszelkich dochodów każdego obywatela i mieszkańca, w tym pracy, spadków i zakupów! To drobna opłata wobec licznych usług i ochrony zapewnianych przez cesarskie instytucje, lecz dalszy dobrobyt zależy od tego wkładu w kluczowej trzeciej dekadzie systemu. Na wszystko co nam drogie, przetrwamy i wyjdziemy silniejsi niż kiedykolwiek."

CAL_reform_of_administrative_division: "Reforma podziału administracyjnego"
CAL_reform_of_administrative_division_desc: "Nadzwyczajne posiedzenie Senatu o administracji regionalnej! Niedopuszczalna nieskuteczność rządów poza centrum doprowadziła do licznych propozycji, które skupiły się wokół dwóch planów popieranych przez większość odpowiednich frakcji. Popularzy chcą centralizacji i Centralnego Komitetu nadzorującego najważniejsze decyzje, by lokalne interesy nie przesłaniały wielkiej wizji Calisii. Optymaci skłaniają się ku decentralizacji, gotowi dać legatom większą autonomię w sprawniejszym zarządzaniu domenami niż urzędnicy stolicy. Ze względu na pilność kryzysu skrócono tradycyjny czas debaty!"

CAL_central_popular_committee: "Centralny Komitet Ludowy"
CAL_central_popular_committee_desc: "Po serii niezadowalających raportów o administracji lokalnej i pracy legatów powstał Centralny Komitet złożony z najlepszych biurokratów Calisii. Będzie nadzorował wdrażanie dekretów Cesarza i dbał, by dobrobyt interioru dotarł na nowo zdobyte ziemie. \n\nDotychczasowi administratorzy nie muszą obawiać się o stanowiska i powinni traktować instytucję jako pomoc. Najważniejsze decyzje zapadną centralnie, lecz legaci mogą przedstawiać sugestie dotyczące preferowanych projektów."

CAL_federalization_of_the_empire: "Federalizacja Cesarstwa"
CAL_federalization_of_the_empire_desc: "Więcej władzy trafi w ręce legatów prowincji! Prawo łagodzące ciężar zarządzania rosnącym Cesarstwem przyznało im prerogatywy do rozwiązywania spraw lokalnych bez interwencji centrum. Stolice regionalne otrzymały dodatkową autonomię oraz prawo tworzenia instytucji częściowo zarządzających funduszami na inwestycje i porządek publiczny, a także sądów rozstrzygających drobne sprawy niegodne ucha Cesarza. Działania legatów w okresie przejściowym będą ściśle kontrolowane. Nadużycie lub tyrańskie wykorzystanie władzy należy natychmiast zgłaszać i zakończy się usunięciem winnego z urzędu."

CAL_bureaucratic_behemoth: "Biurokratyczny behemot"
CAL_bureaucratic_behemoth_desc: "Aby usprawnić rządy i zapewnić przestrzeganie przepisów, w kluczowych sektorach gospodarki wprowadzono nowy zestaw niezbędnych licencji! \n\nOdtąd każdy sprzedawca musi do końca przyszłego tygodnia uzyskać Licencję A38 z Urzędu Sprzedaży i Targowisk Publicznych po wypełnieniu niebieskiego formularza i kwestionariusza \"Właściwych Praktyk Rynkowych\", wydawanego przez Departament Ochrony Konsumenta w zamian za Wniosek H5 z załącznikiem B65, dostarczanym osobno przez Urząd Zarządzeń Tymczasowych po pozytywnej decyzji w sprawie Listy D22 dotyczącej nowej ustawy o \"Rozmiarze i Krzywiźnie Warzyw\", wydawanej po uzyskaniu Zezwolenia na Złożenie Wniosku Licencyjnego w oddziale \"Zezwoleń i Zatwierdzeń\" Biura Licencji, po przedstawieniu ważnej Licencji Sprzedawcy podstemplowanej przez..."

CAL_there_was_once_a_dream: "Był kiedyś taki sen..."
CAL_there_was_once_a_dream_desc: "Ostatnie reformy i oszczędności przyniosły względną stabilność! Jego Łaskawość Ricardus Calisius dziękuje dumnym Kalizjanom, którzy przeprowadzili państwo przez kryzys wstrząsający fundamentami. Dzięki waszej czujności znów górujemy. Z poprawą sytuacji nadchodzi wyczekiwana odwilż. Cesarz wraz z Senatem ukochanej Res Publici obiecuje szybko złagodzić ostatnie surowe, tymczasowe przepisy! Wkrótce znów będziemy normalnie funkcjonować i żyć jak królowie. \n\nPo doniesieniach o barbarzyńskich hordach migracyjnych poza granicami wysłano już legiony. Plemiona nie stanowią większego zagrożenia dla zdyscyplinowanych sił i nie ma powodów do obaw."

CAL_bread_and_circuses: "Chleba i igrzysk"
CAL_bread_and_circuses_desc: "Szanowni obywatele! Cesarstwo wie, że jesteście głodni! Cesarstwo wie, że jesteście źli! I Cesarstwo się wami zajmie. Codzienny trud może przytłaczać, lecz na początku przyszłego miesiąca zniknie, jako że w stolicy odbędą się dwa wielkie wydarzenia!\n\nPo pierwsze, największe igrzyska współczesnego świata, przy których dzisiejsza olimpiada wyda się równie nudna jak coroczny konkurs wrzucania przestępców do Prosny.\nWalki gladiatorów, teatr i wyścigi rydwanów porwą serca i umysły ludu.\n\nPo drugie, ogromne ilości chleba trafią do każdego zakątka kraju, by żaden obywatel nie głodował. Zmobilizowano piekarnie całego Cesarstwa - oczywiście tylko prawdziwy chleb dla prawdziwych Kalizjan od Collegium Piekarzy."

CAL_first_calisian_spartakiad: "Pierwsza Spartakiada Kalizjańska"
CAL_first_calisian_spartakiad_desc: "Nadszedł czas święta siły, jedności i nieposkromionego ducha naszego ludu! Na mocy dekretu Jego Cesarskiego Majestatu w ukochanym mieście odbędzie się pierwsza Spartakiada Kalizjańska! Zobaczcie atletów inspirowanych dawnymi bohaterami w wyścigach rydwanów, zapasach, rzucie oszczepem i biegach; Spartakiada ukaże sprawność i wytrwałość najlepszych mężczyzn i kobiet.\n\nUwaga! Walki gladiatorów i inne konkurencje bojowe nie są przewidziane! Każdy obywatel może zgłosić się do eliminacji odbywających się w każdy Saturni i Solis przez następny miesiąc! Konkurencje jeździeckie w Maximusie, pozostałe w Koloseum."

CAL_march_of_unity: "Marsz Jedności"
CAL_march_of_unity_desc: "Dołączcie, obywatele Calisii, do wspólnego maszerowania w solidarności i dumie! Czeka Marsz Jedności - wielki pochód przez serce Wiecznego Miasta, jednoczący wszystkie frakcje pod jednym chwalebnym sztandarem!\n\nMarsz rozpocznie się o świcie najbliższego Solis. Z Pałacu Cesarskiego przejdziemy Via Stavissina do Forum Calisianum, gdzie odbędą się święte rytuały. Następnie Via Libera poprowadzi nas obok świętych miejsc przodków, gdzie oddamy hołd duchom przeszłości. Finał nastąpi przy majestatycznym Koloseum podczas rekonstrukcji bitwy o Calisię.\n\nKażdy uliczny kupiec próbujący zarobić na trasie zostanie usunięty siłą. Niewolnicy także nie mogą uczestniczyć."

CAL_the_bloody_games: "Krwawe Igrzyska"
CAL_the_bloody_games_desc: "Przygotujcie się na Krwawe Igrzyska! Dzicy gladiatorzy, krwiożercze bestie i śmiertelne próby doprowadzą uczestników do granic wytrzymałości! Znane wam konkurencje olimpijskie zostaną przekształcone! Rzut oszczepem, dyskiem czy młotem jest przecież lepszy, gdy ma się do czego albo kogo celować! Po co biec, jeśli nic cię nie goni? To nie zabawa dla ludzi o słabych nerwach. Będzie mnóstwo krwi, łez i krzyków!\n\nKażda cohors ma obowiązek wystawić reprezentanta, a każdy właściciel niewolników przekazać jednego podwładnego organizatorom. W razie śmierci służącego właściciel otrzyma sowite odszkodowanie. Od najniższych niewolników po najpotężniejszych wojowników wszyscy dowiodą wartości w tyglu walki."

CAL_wine_women_and_singing: "Wino, kobiety i śpiew"
CAL_wine_women_and_singing_desc: "Przygotujcie się, obywatele Calisii, na niezrównane święto! Ulice wypełnią uroczystości, wino popłynie rzekami, a powietrze zabrzmi radosną muzyką. Od Forum Calisianum po Circus Maximus każdy zakątek miasta ożyje duchem zabaw! Będą widowiska, konkursy, zajęcia dla wszystkich i, co najważniejsze, darmowe wino! Zaczniemy o świcie i skończymy dopiero wraz z tygodniem!\n\nNieposłuszeństwo, przemoc i zakłócanie pokoju nie będą tolerowane. Cohortes Urbanae otrzymały zadanie utrzymania porządku i wykonają je z niezachwianą stanowczością."

CAL_grain_redistribution_centres: "Ośrodki redystrybucji zboża"
CAL_grain_redistribution_centres_desc: "Obywatele Cesarstwa! Senat z dumą ogłasza utworzenie Ośrodków Redystrybucji Zboża. Będą gromadzić, przechowywać i rozdzielać zboże regionom cierpiącym niedobory.\n\nKażdy ośrodek otrzyma obfite zapasy z najżyźniejszych ziem i nadwyżek zbiorów. Zasady dostępu są proste: potrzebujący obywatel zgłasza się z dokumentem tożsamości do najbliższej placówki. Po potwierdzeniu potrzeby otrzyma rację wystarczającą dla siebie i rodziny na określony czas.\n\nŻaden obywatel nie będzie głodny, a hojność naszych ziem zostanie sprawiedliwie podzielona między wszystkich mieszkańców Cesarstwa! Od każdego według jego zapasu, każdemu według jego potrzeb!"

CAL_central_command_economy: "Gospodarka centralnie sterowana"
CAL_central_command_economy_desc: "Szanowni obywatele! Gospodarka Cesarstwa od dawna była mieszaniną odrębnie działających czynników. W teorii wszystko pracowało ku chwale Cesarza, lecz rzeczywistość jak zawsze odbiegała od ideału. Rozdrobniony przemysł, sprzeczne interesy i niespójne decyzje hamowały nasz potencjał.\n\nRząd zdecydował więc strategicznie skonsolidować władzę i usprawnić działanie, by przywrócić stabilność i wydajność. Państwo przejmie decyzje, zapewniając jasne dyrektywy wszystkim sektorom. Centralne planowanie i przydział zasobów usuną biurokratyczne przeszkody i niesprawność.\n\nPrzejście ku centralnie sterowanej gospodarce może chwilowo zakłócić życie podczas dostosowania przemysłu i instytucji. Zmiana bywa trudna, lecz podjęte zostaną wszelkie środki zapewniające płynny proces."

CAL_its_almost_war_season: "Nadchodzi sezon wojenny"
CAL_its_almost_war_season_desc: "Obywatele! Dzielni legioniści przeszłości i teraźniejszości! Z tęsknotą żegnamy czas pokoju i witamy sezon wojenny! Wszyscy przydzieleni do jednostek mają natychmiast opuścić ziemie i majątki oraz zgłosić się do najbliższych koszar, by wstąpić do wybranej formacji!\n\nJesteście siłą napędową Cesarstwa, a wasza ofiara przyniesie dobrobyt wszystkim. Czekają przygody w najdalszych zakątkach kraju, spotkania z innymi kulturami i doświadczenie przydatne w przyszłej karierze obywatelskiej!\n\nNie czekajcie, aż przyjdą po was siłą! Zgłoście się teraz!"

CAL_economy_based_on_plunder: "Gospodarka oparta na łupach"
CAL_economy_based_on_plunder_desc: "Obywatele Calisii! Wraz ze zmianą pór roku, wiatr wojny przestaje dąć nad naszymi ziemiami. Nowy miesiąc zwiastuje zmierzch kampani wojennej, a legiony wracają do stolicy z egzotycznymi dobrami, które wkrótce trafią na targi!\n\nPiękna biżuteria z pomorskiego bursztynu, najlepsze drewno z Prus, karawany zboża ze Wschodniego Limesu, wyborne wina z Iaslum, maszyny przemysłowe, miedź z prowincji Lugidunum i mnóstwo śląskiego węgla. Spieszcie do Emporium Iris!\n\nTargi niewolników odbędą się przez trzy najbliższe Mercurii. Najlepsze okazy znajdziecie wtedy na Forum Tertio Maii - coś na każdą potrzebę i kieszeń!"

CAL_inflation_1: "Inflacja?"
CAL_inflation_1_desc: "Nadszedł czas comiesięcznego ogłoszenia cen codziennych towarów! Przygotujcie budżet i ruszajcie na targ, bo oferta obowiązuje do wyczerpania zapasów! W porównaniu z poprzednim miesiącem ceny wzrosły o 10,4%.\nChleb - 2 denary i 99 sestercji\nWino - 19 denarów i 99 sestercji\nOliwa - 26 denarów i 99 sestercji\nMajonez Vinearii - 8 denarów i 79 sestercji\nWoda - 3 denary i 10 sestercji\nZiemniaki, 1 kg - 3 denary i 99 sestercji\nWieprzowina bez kości, 1 kg - 11 denarów i 99 sestercji\n\nPełną ofertę znajdziecie na głównym forum, gdzie ceny są stale aktualizowane. Przypominam o zakazie handlu w parku wokół Forum i przed cesarskimi urzędami."

CAL_inflation_2: "INFLACJA!"
CAL_inflation_2_desc: "Nadszedł czas codziennego ogłoszenia cen! Planujcie budżet rozsądnie i nie przesadzajcie z wydatkami! W porównaniu z poprzednim miesiącem ceny wzrosły o 76,4%.\n\nChleb - 129 denarów \nWino - 860 denarów \nOliwa - 1120 denarów \nMajonez Vinearii - 345 denarów \nWoda - 135 denarów \nZiemniaki, 1 kg - 190 denarów \nWieprzowina bez kości, 1 kg - 480 denarów\n\nPełną ofertę znajdziecie na głównym forum, gdzie ceny są stale aktualizowane. Prosimy nie płacić sestercjami i używać nowych większych nominałów. Przypominam o zakazie handlu w parku wokół Forum i przed cesarskimi urzędami."

CAL_hyperinflation: "HIPERINFLACJA!!!"
CAL_hyperinflation_desc: "Nadszedł czas cogodzinnego ogłoszenia cen! W porównaniu z poprzednim dniem wzrost wyniósł... 956%... 970%... 990%... ech, nieważne. Godzinę temu ceny wyglądały tak:\n\nChleb - 4 600 000 denarów \nWino - 30 600 000 denarów \nOliwa - 41 400 000 denarów \nMajonez Vinearii - 13 500 000 denarów \nWoda - 4 750 000 denarów \nZiemniaki, 1 kg - 6 130 000 denarów \nWieprzowina bez kości, 1 kg - 18 400 000 denarów\n\nPełną ofertę znajdziecie na głównym forum, gdzie ceny zmieniają się co godzinę. W chwili odczytywania ogłoszenia mogą być już nieaktualne. Prosimy też nie blokować przejść wozami wypełnionymi pieniędzmi. Niech Merkury ma nas w opiece... bo najwyraźniej nikt inny nie ma."

### CZWARTE DRZEWKO - CLIMAX BARBARORUM ###

CAL_barbarian_crisis: "Kryzys barbarzyński"
CAL_barbarian_crisis_desc: "Dziś rano hordy plugawych barbarzyńców przekroczyły Zachodni Limes i niespodziewanie zaatakowały nasze dzielne legiony. Lecz nawet wojownicy równi siłą Heraklesowi nie pokonają przytłaczającej przewagi liczebnej. Francofortum Orientalis, Costrinum, Gryphonia i Svina Ostium zostały oblężone przez przeklętych najeźdźców z Hadesu! \n\nNa wschodzie potworne hordy Hunów, Scytów i Estów łakomie patrzą na nasze dostatnie ziemie. Kraina może płonąć, lecz nie będziemy bezczynnie czekać i otwierać bram na grabież i gwałt!\n\nLegiony mobilizują się do obrony. Każdy mężczyzna i każda kobieta zdolni nosić broń są wzywani do szeregów, bo tylko jedność i niezłomna wola przyniosą nam zwycięstwo!\n\nWypełnijcie więc swój obowiązek, współobywatele! Uzbrójcie się i pokażcie barbarzyńcom, że mierzą się nie tylko z armią, lecz z nieposkromioną wolą Cesarstwa! Z odwagą w sercach i stalą w dłoniach zwyciężymy! Calisia Invicta!"

CAL_enforce_the_limes: "Umocnienie Limes"
CAL_enforce_the_limes_desc: "Gdy piekielne hordy pełzną ku naszym bramom, tylko jednej formacji można zaufać w niezachwianej walce o waszą przyszłość! Limitanei potrzebują pomocy; straż graniczna boleśnie odczuwa ciężar najazdu. Każdy gotowy oddać życie za Cesarstwo powinien dołączyć do jednostek granicznych!\n\nPrzyjmujemy też darowizny pieniężne i rzeczowe - wszystko przydatne na wojnie zostanie dobrze wykorzystane. Zachęcamy również do wspierania collegiów niestrudzenie organizujących żywność dla obrońców.\n\nStrażnicy Cesarstwa! Nie lękajcie się! Wytrzymajcie jeszcze odrobinę, posiłki są w drodze. Walka trwa, lecz wy już jesteście wielcy i zapewniliście sobie miejsce w panteonie bohaterów!"

CAL_emergency_limitanei_legions: "Rezerwowe legiony Limitanei"
CAL_emergency_limitanei_legions_desc: "Wybrańcy Marsa! Los postawił przed wami wielkie wyzwanie, ale nie jesteście sami! Najdzielniejsi towarzysze z całego Cesarstwa staną ramię w ramię, by bronić bezbronnych! Wkrótce ruszycie w podróż, która może być waszą ostatnią, lecz jedno jest pewne - czeka was wieczność, niezależnie czy wrócicie z tarczą, czy na tarczy!\n\nOchotnicy na front wschodni proszeni są do Sali C w celu załatwienia dokumentów. Osoby ze specjalnym przydziałem na południe - do Sali B. Reszta pozostaje tutaj, gdyż większość ruszy na zachód bronić kalizjańskiej cywilizacji.\n\nNie lękajcie się ciemności! Cesarstwo nie zapomni, a Cesarz zadba o wasze rodziny. Pamiętajcie tylko podpisać dokument B119; nie chcecie przecież pozbawić bliskich dodatkowych 1000 denarów."

CAL_appease_our_subjects: "Uspokojenie poddanych"
CAL_appease_our_subjects_desc: "Cesarstwo nie odda ani jednej prowincji! Gubernatorzy mogą odetchnąć, gdyż Senat jednogłośnie przyjął prawo gwarantujące podstawowe bezpieczeństwo w każdej prowincji rozległego państwa. Rząd centralny będzie współpracował z lokalnymi administratorami, aby nawet najdalsze zakątki nie czuły się odizolowane.\n\nPomoc ze stolicy ruszy niezwłocznie, a do każdej prowincji uda się attaché senacki nadzorujący obronę przed zagrożeniami zewnętrznymi i wewnętrznymi. Linie zaopatrzenia będą płynąć bez przerwy pod ochroną uzbrojonych patroli.\n\nOd Pomeranii po Antecarpathię obywatele Calisii mogą być spokojni o życie i mienie - będziemy wszędzie tam, gdzie potrzeba, zawsze gotowi i zawsze blisko."

CAL_we_will_defend_every_inch_of_our_land: "Twierdzą nam będzie każdy próg!"
CAL_we_will_defend_every_inch_of_our_land_desc: "Gdziekolwiek postanie noga obywatela Calisii, tam leży nasze Cesarstwo! Barbarzyński napór ze wszystkich stron rośnie, lecz mogą być pewni, że niosących wojnę powita stal i ogień! Zapłaciliśmy cenę krwi za wzniesienie tej wspaniałej cywilizacji, i żadna inna wartość nie dorówna tej cenie. Bohaterowie, których walka umożliwiła powstanie Cesarstwa, stanowią naszą duchową twierdzę i musimy ją zachować za wszelką cenę!\n\nHordy niosące śmierć i rozkład zagrażają dziedzictwu największych synów i córek tej ziemi! Są plagą, którą usunie tylko siła! Obywatele! Brońcie własnych rodzin, bo nie zostaną oszczędzone; brońcie mienia, bo zostanie zagrabione! Brońcie Cesarstwa! Drugiego nie będzie."

CAL_lex_barbarorum: "Lex Barbarorum"
CAL_lex_barbarorum_desc: "Zjednoczoną wolą konsulów Senat obraduje dziś nad jednym z największych wyzwań cywilizacyjnych naszych czasów! Masy barbarzyńców chcą sforsować bramy i zalać kraj potopem, który zmyje cały dorobek!\n\nMimo zupełnego braku ogłady hord Popularów trwają przy radykalnym stanowisku, pragnąc złagodzić kryzys przez asymilację, kontrolowane osadnictwo i włączenie barbarzyńców do cesarskiego aparatu, by nie mieli powodu go niszczyć. Optymaci widzą natomiast kolejne zagrożenie, które trzeba zmiażdżyć jak najszybciej i najbrutalniej, by każdy następny barbarzyńca dwa razy pomyślał przed przekroczeniem granic!\n\nDekret Prefekta Cohortes Urbanae stanowi, że próby destabilizacji stolicy agitacją którejkolwiek strony zostaną stłumione, zgromadzenia polityczne są zakazane, a collegia przejdą kontrolę, by ograniczyć polaryzację i panikę. Wszystko jest pod kontrolą."

CAL_adapt_or_perish: "Ewolucja albo śmierć"
CAL_adapt_or_perish_desc: "Na rozkaz konsula Compa i z mocy prawa ustanowionego przez Senat ogłasza się, co następuje! Hasła nawołujące do bezmyślnej eksterminacji wszystkich barbarzyńców podlegają karom cywilnym; zabronione jest podżeganie do nienawiści lub zbrojnej konfrontacji z masami na granicy.\n\nKażdy z nich jest człowiekiem i zasługuje na taki sam altruizm jak każdy obywatel. Dobrocią pokonamy nienawiść, a zamiast zamykać bramy i udawać oblężoną twierdzę, podejdziemy do sprawy w sposób cywilizowany. Obywatele, bądźcie spokojni! Cesarstwo czuwa i przeprowadzi asymilację z poszanowaniem mienia oraz poczucia bezpieczeństwa. To nie są bezlitośni najeźdźcy, lecz uchodźcy! Ich zdrowa prostota ożywi Calisię tonącą w bezczynności i nudzie."

CAL_partial_appeasement: "Częściowe ustępstwa"
CAL_partial_appeasement_desc: "Pilne wieści! Wielkoduszni senatorowie i sam Cesarz postanowili przy pierwszej okazji rozpocząć negocjacje z wodzami Barbarii, by zaprowadzić pokój na granicach. Wielu ludzi na naszych ziemiach żyje pod barbarzyńskim jarzmem. Wyznaczeni przywódcy ich społeczności przybędą do Wiecznego Miasta na rozmowy o traktacie regulującym obecność uchodźców w Calisii.\n\nWzywamy do spokoju i ograniczenia nastrojów antybarbarzyńskich. Cohortes Urbanae potępią każdy akt agresji. Zachowajcie rozsądek; nie warto trafić do lochu przez nienawistne zachcianki duszy pozbawionej dignitas. Największe umysły obu cywilizacji wykują porozumienie otwierające epokę pokoju i zrozumienia, z której skorzystamy wszyscy."

CAL_settle_saxons_and_francs: "Osadnictwo Sasów i Franków"
CAL_settle_saxons_and_francs_desc: "Ludu Calisii! Zachodnie ziemie nad Viadrusem zostały straszliwie spustoszone po Upadku. Z pewnością znajdziemy tam odpowiednie terytorium dla Sasów i Franków. Odbudują je z popiołów wojny i ożywią region. Pomogą nam podnieść się z najgorszych czasów, bo właśnie tacy ludzie do nas przybywają - pragnący budować, nie niszczyć.\n\nSilesia Inferior otrzyma impuls potrzebny do odzyskania roli wielokulturowego serca Europy Środkowej. Niech nie lękają się ci, którzy widzą w tym redystrybucję majątku na rzecz Barbarii, bo przodkowie germańskich migrantów zamieszkiwali te ziemie. Ager Publicus zapewni uczciwość i równość. Robotnicy! Unieście głowy i maszerujcie wspólnie w pracy pod jednym czerwonym sztandarem!"

CAL_limes_occidentalis: "Limes Occidentalis"
CAL_limes_occidentalis_desc: "Dzięki zdecydowanym działaniom na granicy Francofortum stało się wielokulturowym tyglem i symbolem przyjaźni kalizjańsko-germańskiej! Na ulicach widać coś dawno niewidzianego: nadzieję. Obywatele! Najgorsze za nami! Pozostaje się pojednać i zbratać!\n\nSenat nie ogranicza się do słów. Na Zachodnim Limesie powstanie większa straż limitanei oraz punkty dla uchodźców, by ratowanie ludzi uciekających przed mrocznym spustoszeniem Germanii przebiegało w sposób zorganizowany. Nie jesteśmy surowymi strażnikami skarbu; chcemy dzielić się nim cywilizowanie. Limes Occidentalis zostanie umocniony! Nie będzie groźną twierdzą, lecz latarnią pokoju pośród morza ciemności."

CAL_offer_to_the_goths: "Oferta dla Gotów"
CAL_offer_to_the_goths_desc: "Ludu Calisii! To, co larwa nazywa końcem świata, bogowie nazywają motylem. Przybycie Germanów nie jest zagrożeniem, lecz szansą na ostateczne pojednanie i zjednoczenie narodów pod sztandarem wspólnych ideałów Imperium Calisianum.\n\nPółnocne ziemie, zwłaszcza Pomerania, są słabo zaludnione. Nieludzkim byłoby odrzucić braci w potrzebie, skoro mamy dla nich miejsce. Największej grupie uchodźców, plemionom Gotów, zaoferowano autonomiczne terytoria w pomorskich lasach, które mogą rozwijać według własnych upodobań.\n\nTraktat będzie nadzorował Donaldus Tusc, nasz człowiek w germańskim obozie, który w imię pokoju i dobrobytu zapewni sprawne wykonanie paktu. Wkrótce będziemy żyć razem w jednym wielkim Cesarstwie ponad podziałami."

CAL_germanic_bannerlords: "Germańscy chorążowie"
CAL_germanic_bannerlords_desc: "Napięta sytuacja ujawniła korzyści z posiadania Germanów jako sojuszników, nie wrogów. Ich wojownicy należą do najzacieklejszych przeciwników, z jakimi mierzyli się legioniści. A wy, ludu, zaznaliście strachu przed barbarzyńskimi hordami gotowymi stanąć u bram Wiecznego Miasta!\n\nNie ma się czego bać! Traktat z Gotami daje nam godnego zaufania sojusznika i mnóstwo straszliwych wojowników gotowych walczyć ramię w ramię przeciw wszystkim zagrażającym nowemu Pax Europeana, którego filarami będą Calisia i Germania. Na mieczach przyniesiemy Europie cywilizację! Razem!"

CAL_eastern_settlers: "Osadnicy ze wschodu"
CAL_eastern_settlers_desc: "Drodzy obywatele! Upadek był katastrofą dla mieszkańców kalizjańskich ziem, lecz ostatecznie zbudowaliśmy raj pośród morza dekadenckiej anarchii i rozkładającego się kapitalizmu. Dlatego na nasze terytorium - klejnot w koronie starożytnego kontynentu - uciekają masy ludzi pragnących lepszego życia i zmęczonych codzienną walką o przetrwanie. Tak wygląda życie większości mieszkańców Baltii, Ruthenii, Alba Ruthenii, Scythii i wielu odległych krain aż po Sinae.\n\nWschodnia ściana Cesarstwa wymaga ludzkiego potencjału, a wobec postępującej romanizacji nie musimy obawiać się asymilacji. Nowo przybyli chętnie będą rywalizować o prawo do obywatelstwa dzięki prestiżowi, który wy, drodzy obywatele, reprezentujecie!"

CAL_limes_orientalis: "Limes Orientalis"
CAL_limes_orientalis_desc: "Wieści ze wschodu! Regiomontum, Alba Cliva, Lublinum i Premislia to jasne punkty na mapie Cesarstwa. Dowodzą, że różne ludy mogą żyć w pokoju zamiast prowadzić wyniszczające wojny. Handel kwitnie, widmo wojny znikło, gdy otworzyliśmy bramy i przyjęliśmy wszystkich z otwartymi ramionami. Odrobina empatii zmienia wroga w przyjaciela.\n\nNie oznacza to braku wojska! Na Wschodnim Limesie rozbudujemy straż limitanei i punkty dla uchodźców. Silne garnizony zapewnią bezpieczeństwo obywatelom Calisii oraz tym, którzy pragną zostać naszymi krewnymi. Limes Orientalis zostanie umocniony! Nie jako groźna twierdza, lecz latarnia pokoju w morzu ciemności."

CAL_divide_et_impera: "Divide et Impera"
CAL_divide_et_impera_desc: "Bellum omnium contra omnes! Barbarzyńcy nie stanowią jednego frontu; rozdzierają ich spory i waśnie! To tylko kwestia czasu, nim wąż pożre własny ogon, a my będziemy czekać w gotowości. Legiony dzielnie odpierają kolejne fale tych, którzy ośmielili się nas zaatakować.\n\nNasi legaci należą do największych oficerów zrodzonych przez Matkę Gaję, a dzięki ich przebiegłości i niezłomności legionistów zmiażdżymy wielokrotnie liczniejsze siły! Jeden z legatów pod Sedinum pojedynczą dobrze spreparowaną plotką skłócił dwa małe plemiona jutlandzkie! Jutowie porzucili najazd na serce Pomerania Occidentalis, bo byli zbyt zajęci wzajemnym wyrzynaniem się!"

CAL_vandalic_despoilers: "Wandalscy grabieżcy"
CAL_vandalic_despoilers_desc: "Dla wszystkich mieszkańców Silesia Inferior ogłoszono stan wyjątkowy! Wandalowie znów zagrażają integralnej części Cesarstwa! Wzmocnieni germańskimi hordami Wandalowie Genzeryka II wrócili zza Viadrusu! Ich wódz ucieleśnia najgorsze demoniczne wartości, pije krew niewinnych Kalizjan i czci bogów chaosu! Nie zasługuje na litość, a każdy sprawny obywatel powinien spróbować go zabić! Za jego głowę wyznaczono pół miliona denarów!\n\nSpustoszenie które niosą te plemiona przypomina huragan, a pozostawiony odór czyni ziemię niezdatną do życia. Lecz jak Belizariusz w czasach Bizancjum uderzymy z mocą i odeprzemy najeźdźców! Vandalia delenda est!"

CAL_lusatia_superior: "Lusatia Superior"
CAL_lusatia_superior_desc: "Legiony triumfują! Pod dowództwem największych generałów Calisii wyparliśmy barbarzyńców ze Silesii i pogoniliśmy daleko za Albis! Genzeryk nie żyje, a resztki plemion uciekły w panice ku zagładzie w Germańskiej Anarchii. Sasi nie stanowią już zagrożenia.\n\nŻyzne ziemie Lusatii czekają na obywateli i zasłużonych żołnierzy, by odbudowały je niestrudzone ręce weteranów. Ochotnicy do programu osadniczego otrzymają pomoc Cesarstwa w odbudowie i rewitalizacji. Liczba działek jest ograniczona. Na rubieże, marsz! Barbarzyńcy uciekają, możemy wielkimi masami ruszyć na zachód!"

CAL_scourge_of_god: "Bicz Boży"
CAL_scourge_of_god_desc: "Wieści ze wschodu! Nazywają go zwiastunem końca świata, boskim biczem grzesznej ludności Gai i karą za dekadencję. Wielki chan Hunów Khonon najechał Podlachię, a pierwszą ofiarą jego dzikości padł ukochany gubernator prowincji, czczony centurion Majorix. Pole bitwy mroziło krew w żyłach. Hunowie ścinali głowy poległych, a szczęśliwszym trupom odcinali tylko uszy.\n\nNie wiadomo, co napędza tak okrutną żądzę krwi ani jakie ma pobudki poza całkowitym zniszczeniem. Nie da się z nim negocjować, bo żaden wysłannik nie wrócił. Wobec takiej nienawiści i spustoszenia dumnemu obywatelowi pozostaje jedna postawa. OPÓR. ZA WSZELKĄ CENĘ!"

CAL_citizens_of_podlachia: "Obywatele Podlachii"
CAL_citizens_of_podlachia_desc: "Dzielni obrońcy ludzkości pokonali wielkiego huńskiego demona! Nad odległymi rubieżami ukochanej ziemi znów powiewa dumny sztandar Cesarstwa. Zniszczenia prowincji są jednak ogromne, i nie tylko materialne. Spustoszenie umysłów przez najazd cofnęło mieszkańców do prymitywnego stanu niewiele różniącego się od samych dzikusów. Musimy przynieść im pochodnię oświecenia i ponownie wprowadzić do cywilizacji.\n\nWzywamy odważnych obywateli, by dołączyli do szlachetnego przedsięwzięcia i stanęli na czele osadnictwa w Podlachii.\n\nPodlachia wzywa wszystkich szukających przygody, szansy i trwałego dziedzictwa. Wspólnie wykujmy przyszłość, w której dobrobyt, kultura i wspólnota znów rozkwitną w sercu ukochanej Calisii."

CAL_jutish_reavers: "Jutlandzcy łupieżcy"
CAL_jutish_reavers_desc: "Ludy Morza przyniosły niegdyś ruinę największym starożytnym cywilizacjom. Dziś głębiny Bałtyku znów są otchłanią, z której wychodzą wysłannicy zła. Jutowie, niestabilna lecz niebezpieczna konfederacja nordyckich plemion, regularnie wyprawiają się łupić wybrzeża, niszczyć miasta i porywać kobiety. Nasze kobiety!\n\nPróby przekupstwa są daremne, bo nawet po otrzymaniu okupu wracają po więcej. Nie spoczną, póki nie wyrwą ostatniego denara z naszych martwych dłoni. My też nie spoczniemy! Obywatele prowincji nadmorskich! Zaciągajcie się do obrony terytorialnej! Zgłaszajcie każdą niezidentyfikowaną aktywność na morzu! Zachowajcie czujność, a nasze siły odeślą morskie szczury do Hadesu!"

CAL_pomerania_citerior: "Pomerania Citerior"
CAL_pomerania_citerior_desc: "Wieści z Pomeranii! Legiony przełamały front na Viadrusie i odzyskały starożytne ziemie prawnie należące do Cesarstwa! Albisia staje się kolejną prowincją niezwyciężonej Calisii! Od dawna wiadomo, że najlepszą obroną jest najlepszy atak, a dostatecznie mocno uderzony wiking pokornie błaga, by służyć silniejszemu! Udowodnił to legat, który po pokonaniu Jutów utworzył z nich własną Gwardię Wareską.\n\nA teraz ziemie! Żyzne pola Albisii czekają na obywateli i zasłużonych żołnierzy. Ochotnicy do programu osadniczego otrzymają pomoc w odbudowie. Liczba działek ograniczona. Na rubieże, marsz! Barbarzyńcy uciekają, możemy wielkimi masami ruszyć na zachód!"

CAL_empire_or_death: "CESARSTWO ALBO ŚMIERĆ"
CAL_empire_or_death_desc: "Na rozkaz konsula Caletusa i z mocy prawa Senatu ogłasza się, co następuje! A więc wojna! Cały wysiłek Cesarstwa musi zmierzać w jednym kierunku. Wszyscy jesteśmy legionistami. Myślmy tylko o walce aż do śmierci ostatniego barbarzyńcy! Ci, którzy nie otrzymali listów, mogą być spokojni - werbownicy wkrótce zapukają do waszych drzwi. Wszyscy musimy odpowiedzieć na wezwanie!\n\nNie ma pokoju z niosącymi apokalipsę! Każdy dom, las i pole zostaną oczyszczone z najeźdźców. Tych, którzy wdarli się na nasze terytorium, dosięgnie zemsta całej potęgi Cesarstwa! Zemsta za niezliczonych obywateli zamordowanych na rubieżach! Blask naszych ideałów oświetli drogę ku chwale i zwycięstwu! Stoimy w najważniejszym punkcie dziejów cywilizowanego świata. Wielu widzi koniec świata, lecz nic bardziej mylnego! Synowie Calisii! Dziś nie ulegniemy złu! Słońce znów wzejdzie nad Cesarstwem Kalizjańskim!"

CAL_operation_varus: "Operacja Varus"
CAL_operation_varus_desc: "Zdrada!\n\nWichrzyciele wewnątrz naszego imperium dopięli swego losu! Nasi żołnierze wyruszyli na sekretną misję wyplenienia barbarzyńców z Borów Dolnośląskich. Wskutek zdradliwego i niespodziewanego ataku zostali okrążeni i wybici co do jednego. Czy czegoś jeszcze trzeba politycznym wrogom senatu żeby dowieść że jest to inwazja i ludobójstwo a nie kryzys uchodźczy?! Ciała legionistów zostały tak bardzo zmasakrowane że nawet nie możemy ich zidentyfikować ani pochować!\n\nZemsta!\n\nTo jedyne słowo jakie może dzisiaj wybrzmieć we wszystkich prowincjach naszego Imperium! I możecie o to być spokojni. Kilka dni temu rozpoczęła się masowa operacja która sprawi że żaden z najeźdźców nie dożyje jej końca! A Ci którzy pierzchną będą jedynie mogli opowiadać o szlachetnych wojownikach niezłomnego Imperium!\n\nAVE CALISIA! AVE CONSUL CALETUS!"

CAL_break_franco_saxon_alliance: "Rozbicie sojuszu frankijsko-saskiego"
CAL_break_franco_saxon_alliance_desc: "Słuchajcie! Wiecie, co jest gorsze od jednego plemienia barbarzyńców? Dwa współpracujące plemiona. Są jak Cerber, wściekły wielogłowy pies gryzący każdego, kto podejdzie! Po co o tym mówię? Z boskiej łaski sojusz frankijsko-saski właśnie się chwieje! Nie trzeba być uczonym, by zobaczyć nadchodzący rozłam.\n\nDlaczego? Otóż \"przypadkiem\" wyszła na jaw tragiczna wieść, że frankijski wódz przyprawił saskiemu wodzowi rogi! Co gorsza, żona Sasa była podobno zachwycona młodszym i silniejszym mężczyzną. Plotka głosi, że poszły w ruch topory. My, przyzwoici obywatele cywilizowanych obyczajów, z męskiej empatii możemy tylko mieć nadzieję, że fallus frankijskiego wodza nie stał się odrębnym członkiem plemienia."

CAL_dreams_of_limes_saxoniae: "Marzenia o Limes Saxoniae"
CAL_dreams_of_limes_saxoniae_desc: "Ave Petrus Germanicus Caletus! Magna Germania klęczy i błaga o litość! W Berolinum sztandary z turem wiszą na najważniejszych gmachach dawnej stolicy barbarzyńców. Legiony mężnie wyparły wszystkie formacje za Albis, gdzie nie stanowią już zagrożenia. Brandenburgum wkracza w epokę kalizjańskich rządów. Na mocy prawa podboju - dlaczego nie mielibyśmy zatrzymać tych ziem? Jak najwięksi cesarze przodków ujarzmimy Germanię, zabezpieczając przyszłość Cesarstwa!\n\nOperacja oczyszczania resztek oporu trwa, lecz Fortuna sprzyja odważnym, a ten który pierwszy zadziała jest lepszy. Nie chcecie chyba, by inni zarezerwowali nasze starożytne ziemie dla siebie? Zgłoście się do Departamentu Kolonii!"

CAL_strike_at_the_visigothic_leadership: "Uderzenie w dowództwo Wizygotów"
CAL_strike_at_the_visigothic_leadership_desc: "Wieści z frontu! Dowódcy odkryli taktykę szybkiego zwycięstwa. Barbarzyńska horda nie ma żadnej niezależnej świadomości organizacyjnej ani taktycznej. Po wyeliminowaniu oddziału trzymającego motłoch w ryzach reszta rozpada się jak domek z kart i ucieka w panice, niestety grabiąc i paląc po drodze.\nNie jest to idealne dla cywilów w regionie walk, lecz wojna wymaga ofiar.\n\nJeśli przeprowadzimy więcej takich precyzyjnych uderzeń z użyciem nowoczesnych maszyn, w tydzień wszystkie plemiona gockie mogą przejść do historii i uciec w śmiertelny uścisk germańskich lasów, gdzie w anarchii czeka ich jedynie głód, ciemność i śmierć."

CAL_ostrogothia_delenda_est: "Ostrogothia Delenda Est"
CAL_ostrogothia_delenda_est_desc: "Kolejne wieści z frontu! Kto pamięta ogłoszenie z zeszłego piątku, wie, że mówiłem o tygodniu potrzebnym do rozbicia Gotów. Zajęło trochę dłużej, ale szanowni obywatele - dokonaliśmy tego! Rozbite na cztery strony świata plemiona gockie oficjalnie zapisano w historii jako nieistotny relikt przeszłości! Przybyli w furii z ogniem i stalą, lecz spotkali przebudzonego olbrzyma, który sprawiedliwym gniewem przyniósł obywatelom sprawiedliwość i położył kres wojnie.\n\nNiech boska łaska spłynie na władców i wszystkich synów Calisii walczących w bitwach. Z nieoficjalnych raportów mogę zdradzić, że do stolicy zmierza tyle wozów z niewolnikami, ilu nie widzieliście w życiu! Następne tygodnie handlowe będą obfitować w łupy!"

CAL_drive_the_scythians_back_to_the_abyss: "Zepchnąć Scytów do otchłani!"
CAL_drive_the_scythians_back_to_the_abyss_desc: "Dopiero silne rządy łaskawej frakcji Optymatów pozwoliły raz na zawsze wypędzić Scytów za Bugę! Przez dekady włóczyli się po Antecarpathii i osiedlali jak na własnej ziemi! Teraz wraz z przybyciem legionów Ruthenia Rubra znów zajmuje czołowe miejsce wśród prowincji!\n\nPotrzebni nowi osadnicy! Głównym celem będzie Sanocum, od lat wyludnione przez wojny, scytyjskie bandy i prześladowania. Departament Kolonii wypłaci hojne premie za objęcie ziem w tym żyznym regionie! To złota okazja dla obywatela pragnącego rozpocząć nowe życie na rubieżach."

CAL_borussian_vespers: "Nieszpory Boruskie"
CAL_borussian_vespers_desc: "REGIOMONTUM DELENDA EST!\n\nOsiągnęliśmy cel! Zemsta na wrogu dopełniona! Regiomontum i cała Borussia znów są wolne. Niestety smutny widok ulic stolicy prowincji przypomina okrutny pogrom po wybuchu kryzysu. Kilka tysięcy obywateli Calisii brutalnie zamordowanych przez oprawców, głównie pochodzenia ruteńskiego. Ich ciała przybito do krzyży w pozycji \"przypominającej orła\" ku uciesze tłumu.\n\nŻołnierze odpłacili oprawcom tym samym. Stolica Borussii opustoszała, a ci, którzy nie uciekli, stali się stratami ubocznymi. To smutna rzeczywistość, lecz surowa dłoń kalizjańskiego żołnierza musiała wymierzyć sprawiedliwość. Inaczej ukryte pragnienia mordu i zdrady mogłyby znów wyjść na jaw."

CAL_barbarians_in_the_senate: "Barbarzyńcy w Senacie"
CAL_barbarians_in_the_senate_desc: "W Senacie wreszcie wprowadzono monumentalny krok ku uczciwej i równej reprezentacji! Po haniebnych próbach Optymatów zachowania systemu ucisku kulturowego i długiej blokadzie mównicy przez pokonanych senatorów osobista interwencja Cesarza zapewniła wdrożenie wyczekiwanej Lex Barbarorum! Od następnego posiedzenia do Senatu dołączą przedstawiciele uciskanych plemion, aby wszyscy obywatele mogli decydować o przyszłości. \n\nZaprzysiężenie nowych senatorów rozpocznie się w poniedziałek, po czym otrzymają pełne prawa głosu. Nic dziwnego, że cała delegacja wybrała Popularów, dowodząc niezachwianego oddania powszechnej równości."

CAL_reward_the_most_loyal: "Nagrody dla najlojalniejszych"
CAL_reward_the_most_loyal_desc: "W podzięce za przeprowadzenie Calisii przez najtrudniejsze czasy, część rocznego budżetu przyznano urzędnikom, którzy wykazali wzorowe przywództwo podczas kryzysu, oraz oświeconym wodzom Barbari, dzięki którym pokojowo połączyliśmy nasze światy! \n\nŚrodki pochodzą ze skarbców wrogów pokoju; każde naruszenie i wezwanie do broni przeciw plemiennym sojusznikom będzie karane grzywną zależną od rangi i ciężaru czynu. Rekwizycje ruszą wkrótce. Brak żądanych pieniędzy spowoduje przymusowe zajęcie majątku. \n\nNie martwcie się, obywatele! Ani jedna sestercja nie zostanie odebrana praworządnym Kalizjanom! Kto nie ma nic do ukrycia, nie ma czego się bać."

CAL_legion_of_senators: "Legion senatorów"
CAL_legion_of_senators_desc: "W odpowiedzi na potrzeby powiększonego Senatu zatwierdzono budżet czterokrotnie większy niż w poprzednim roku! Od każdego wyborcy pobrana zostanie opłata równa jednej dziesiątej dochodu po opodatkowaniu na pensję przedstawiciela, która zostanie podwojona, by wyeliminować korupcję. \n\nDla utrzymania powagi Senatu powstało Prezydium Konsularne. Powtarzające się wybuchy Optymatów wobec każdej propozycji, która nie napełnia ich kieszeni niezasłużonym bogactwem, nie będą tolerowane i zakończą się wykluczeniem największych winowajców z obrad."

CAL_seven_nation_army: "Armia siedmiu narodów"
CAL_seven_nation_army_desc: "Legat Legio LXXXVIII Gothica pilnie poszukuje tłumaczy języków barbarzyńskich! Wymagana jest podstawowa znajomość; wystarczy słownictwo potrzebne do ćwiczeń i przekazywania rozkazów. Kandydaci otrzymają 1000 denarów dziennie i dodatkowe 500 za próbę osiągnięcia biegłości. Zalecana znajomość dialektów scytyjskich, saskich lub frankijskich, gdyż legion nie ustalił z pełną pewnością, czy rekruci rzeczywiście są Gotami.\n\nAdiutor Legionis przypomina, że wymyślanie słów przez dopisywanie losowych barbarzyńsko brzmiących końcówek nie jest mówieniem po gocku i zostanie łatwo wykryte... tym razem."

CAL_majority_in_the_senate: "Większość w Senacie"
CAL_majority_in_the_senate_desc: "Protokolant Senatu donosi o przyjęciu 27 ustaw podczas wczorajszego posiedzenia! Popularzy, razem w koalicji z delegacją Barbari zapewnili przełomowe zmiany Kalizjanom wszystkich warstw w ciągu jednego dnia. 52 senatorów Optymatów usunięto za tchórzliwe próby obstrukcji, a głosowania trwały bez nich do rana. \n\nLudu Calisii! Dziesięć ustaw zablokowanych wetem konsularnym położyło kres ostatniemu zgrzybiałemu reliktowi reakcjonizmu Optymatów. Hańba konsulowi Caletusowi i całej jego rodzinie! Niech usłyszy wasz głos! Długo nie oprze się woli ludu!"

CAL_barbarian_consul: "Barbarzyński konsul"
CAL_barbarian_consul_desc: "Nowa epoka zmian ogarnęła Senat! Mimo wściekłego oporu reakcjonistów miejsce po skompromitowanym konsulu Optymatów otrzymał czcigodny przywódca senatorów Barbari - Donaldus Tusc. W przeciwieństwie do kolegi z drugiej strony izby jest człowiekiem prawego charakteru, któremu można powierzyć interes ludu. I będzie go chronił! Nominacja honorowego senatora Tusca kończy nadużywanie weta konsularnego, stosowanego dotąd lekkomyślnie do blokowania ustaw podważających utrwalony status quo. Teraz niesprawiedliwość zostanie naprawiona."

CAL_constantine_plan: "Plan Konstantyna"
CAL_constantine_plan_desc: "Pretorianie! Cesarz dostrzegł wasze nieposłuszeństwo! Nazywacie się obrońcami, lecz komu służycie? Sobie? Własnym kieszeniom? Czy plebs korzysta, gdy wymuszacie pieniądze za oszczędzenie brutalności? Władca żąda posłuszeństwa i końca tyranii! Jeśli odmówicie, poznacie bicz Konstantyna jak poprzednicy, których coraz bardziej przypominacie. Ta gałązka oliwna to więcej, niż zasługujecie. Trwajcie przy swym postępowaniu, a zostaniecie wrogami Calisii. Wtedy o waszym losie zdecyduje lud, który terroryzujecie."

CAL_bring_legio_i_alpha: "Sprowadzenie Legio I Alfa"
CAL_bring_legio_i_alpha_desc: "Na żądanie Cesarza siły Legio I Alfa pod dowództwem legata Viniciusa wezwano do stolicy! Dla ochrony ludowych rządów przed egoistyczną reakcją jednostka po chwalebnym ukończeniu wcześniejszych zadań zmierza w okolice Calisii. Jutro legion rozbije obóz na obrzeżach jako niezwyciężony środek odstraszający każdego, kto sprzeciwi się woli Ricardusa Calisiusa, Defensor Populi. Obywatele! Cesarz oczekuje, że powitacie obrońców i spełnicie wszelkie żądania niezbędne dla waszego bezpieczeństwa! Leży im na sercu wyłącznie wasze dobro."

CAL_rally_the_cohortes_urbanae: "Mobilizacja Cohortes Urbanae"
CAL_rally_the_cohortes_urbanae_desc: "Dla zachowania stabilności wewnętrznej Cesarz zarządził natychmiastową mobilizację Cohortes Urbanae! Jednostki z garnizonów całego Cesarstwa mają tymczasowo przenieść się do stolicy i zająć koszary oraz budynki opuszczone przez pretorian. Dodatkowe nocne patrole w dzielnicach cesarskiej i senackiej zapewnią bezpieczeństwo wysokich urzędników, a w mieście od 21:00 do 7:00 będzie obowiązywać godzina policyjna. Naruszający zostaną zatrzymani i przesłuchani. Aby Kohorty mogły swobodnie działać, tymczasowo zniesiono maksymalny czas aresztu!"

CAL_fight_fire_with_fire: "Zwalczać ogień ogniem"
CAL_fight_fire_with_fire_desc: "Wobec nieudolności Rady Miejskiej w walce z korupcją i przestępczym półświatkiem Cesarz uznał interwencję za konieczną dla przywrócenia porządku w stolicy! Jednostki o wątpliwej skuteczności przeniesiono i zastąpią je elitarne siły o niezachwianej lojalności. Za informacje prowadzące do schwytania znanych wrogów pokoju przewidziano wielką nagrodę. \n\nBezprawie nie zapanuje w Calisii! Nie pod okiem Imperatora Ricardusa Calisiusa i sumiennych Popularów. Nawet jeśli przestępcy ze strachu wrócą do nor, wykurzymy każdego i postawimy przed ludowym trybunałem!"

CAL_sack_the_city_officials: "Czystka miejskich urzędników"
CAL_sack_the_city_officials_desc: "Śledztwo w sprawie członków Rady Miejskiej ujawniło liczne nikczemne interesy, dowodząc prawdziwości pogłosek o wielkiej sieci spiskowej tuż pod naszym nosem! Dzięki wzorowej pracy Cohortes banda spiskowców udających urzędników została szybko usunięta i zastąpiona lojalnymi kadrami poleconymi przez godnych zaufania Popularów. Obywatele! Wycięliśmy rosnący guz, nim zaszkodził ciału państwa, lecz jego tajemniczy patroni nadal knują! Zachowajcie czujność i zgłaszajcie oznaki zdrady patrolom. Oni zajmą się resztą."

CAL_arrest_the_plotters_in_the_senate: "Aresztowanie spiskowców w Senacie"
CAL_arrest_the_plotters_in_the_senate_desc: "Wrogie elementy usunięto z Senatu! Śledztwo schwytanych przestępców ujawniło ślad pieniędzy prowadzący do prominentnych Optymatów! Wielu ze wstydu przyznało, że uczestniczyli w szerszym spisku mającym obalić Cesarza i narzucić oligarchiczną tyranię. Jednostki wierne jedynemu prawowitemu władcy schwytały zdradziecką hołotę, szturmując Senat, by raz na zawsze przerwać nikczemne knowania. Nie będzie litości dla tych, którzy niemal zniszczyli ukochane Cesarstwo. Do końca życia będą gnić w więzieniu ze świadomością klęski. Ave Calisius!"

CAL_accidental_invasion_on_the_praefecture: "\"Przypadkowe\" wtargnięcie do Prefektury"
CAL_accidental_invasion_on_the_praefecture_desc: "Synowie Calisii! Choć granice Cesarstwa wydają się bezpieczne, w naszych szeregach wciąż działają wrogie elementy występujące przeciw Cesarzowi i woli ludu. Z tajnych kwater samolubni pretorianie terroryzują miejscową ludność. Uznają bezczynność za słabość i rozszerzają wpływy daleko poza swoją prowincję. Nie możemy dłużej na to patrzeć. Dla ochrony Calisii i ludu pozostała nam jedyna możliwość, którą dziś musimy zastosować. Sytuacja wymaga natychmiastowego i zdecydowanego działania. \n\nDziś legiony przekroczyły granicę Prowincji Pretoriańskiej. Cała odpowiedzialność za możliwy rozlew krwi spoczywa na sumieniu jej reżimu. W ciągu trzech dni, ani jednego więcej, terror Cinastovicusa dobiegnie końca, a nasze siły przyniosą regionowi sprawiedliwość!"

CAL_trial_of_praefectus: "Proces Prefekta"
CAL_trial_of_praefectus_desc: "Senatorowie! Patrycjusze! Patriarchowie! W najbliższy czwartek odbędzie się publiczny proces nikczemnego, pozbawionego honoru Prefekta Pretorian Christianusa Cinastovicusa. Wstęp bezpłatny; zobaczycie upokorzenie przestępcy i wykonanie kary śmierci, na którą bez żadnych wątpliwości zasługuje! \n\nUczestnicy mają okazywać najwyższą pogardę. Gorąco zaleca się konkretne obelgi, groźby i rzucanie przedmiotami. Po ogłoszeniu wyroku publiczne głosowanie demokratycznie wybierze metodę egzekucji. Preferowane będą opcje powolne i bolesne, a propozycje niewystarczającej odpłaty mogą zostać zawetowane!"

CAL_raiders_of_the_lost_tribe: "Najeźdźcy zaginionego plemienia"
CAL_raiders_of_the_lost_tribe_desc: "Barbari! Długo odwoływaliśmy się do waszej pokojowej natury i przyjęliśmy w ramiona kalizjańskiej cywilizacji, lecz teraz musicie po raz ostatni uwolnić pierwotne instynkty! Zdradzieccy pretorianie spiskują, by zniszczyć cały nasz dorobek. Chcą wypędzić was i rodziny poza granice, nie pozwalając wrócić! \n\nCesarz zezwala wam dowolnymi środkami wykorzenić wszystkie pretoriańskie posiadłości i zatrzymać wszelkie łupy! Palcie, równajcie z ziemią, grabcie - wszystko wolno, jeśli usuniecie każdego wroga Calisii!"

CAL_shield_the_civilian_population: "Ochrona ludności cywilnej"
CAL_shield_the_civilian_population_desc: "Dzięki sumiennym wysiłkom Barbari potęga pretorian została złamana! Przypominamy jednak sojusznikom, by ograniczyli się do pozycji Gwardii i nie grabili każdej wioski po drodze. Aby kierować... nadgorliwymi kolumnami i chronić mieszkańców, rozmieściliśmy Limitanei w kluczowych punktach trasy. Barbari! Nie atakujcie tych garnizonów. Administratorzy dostarczą listę znanych celów; nie wolno działać ani plądrować bez potwierdzenia. Okazaliśmy najwyższą tolerancję. Lepiej nie zdradzajcie naszego zaufania!"

CAL_dissolution_of_the_praetorian_guard: "Rozwiązanie Gwardii Pretoriańskiej"
CAL_dissolution_of_the_praetorian_guard_desc: "Na mocy dekretu Ricardusa Calisiusa, obrońcy państwa i ludu, za próbę bezprawnego siłowego przejęcia władzy oraz spisek na życie Cesarza, Gwardia Pretoriańska zostaje rozwiązana we wszystkich formach i po usłyszeniu komunikatu ma natychmiast porzucić swoje obowiązki! \n\nNiżsi członkowie złożą broń i współpracując z administracją przekażą stanowiska, tytuły oraz funkcje następcom. Opór będzie zdradą, a odmawiających rozbrojenia uzna się za wyjętych spod prawa! \n\nOficerowie Gwardii, to koniec! Poddajcie się Cesarzowi, a otrzymacie szansę na łaskę. Jeśli cenicie życie, nie wystawiajcie jego cierpliwości na próbę. Dalsza daremna walka przyniesie wam tylko śmierć."

CAL_progedi_populus: "Progedi Populus!"
CAL_progedi_populus_desc: "Kalizjanie! Barbari! Zaledwie rok temu staliśmy po przeciwnych stronach rodzącego się pola bitwy. Tchórze bojący się o pozycję robili wszystko, by nas podzielić i pchnąć do bezsensownego konfliktu, który zniszczyłby obu. Na szczęście Popularzy przejrzeli kłamstwa i wyrzucili wykluczające, supremacjonistyczne idee na śmietnik historii. Dołączcie do tygodnia świętowania jedności ludów i wielkiej uczty na Forum Calisianum, łączącej najlepsze elementy kultur. Zobaczycie Imperatora Ricardusa Calisiusa i najwybitniejszych senatorów ucztujących z wodzami Barbari jak równi. Weźcie udział w plemiennych wydarzeniach dowodzących, że siła tkwi w różnorodności. Pochodzimy z dwóch światów, lecz mamy wspólną przyszłość! Razem jesteśmy niezniszczalni! Calisia Aeterna Victrix!"



CAL_conspiracy_of_stavissin: "Spisek Stavissiński"
CAL_conspiracy_of_stavissin_desc: "W liście otwartym do Cesarza dowódca Gwardii Pretoriańskiej Christianus Cinastovicus jednoznacznie wyraził dezaprobatę swoją i wielu senatorów wobec ostatnich ustaw Popularów. Stając po stronie Optymatów, pretor ostrzegł chwalebnego Cesarza Ricardusa Augustusa Calisiusa i lud przed obawami jego oraz rzekomej milczącej większości dotyczącymi reprezentacji germańskich osadników w Senacie. Cinastovicus prosi też wszystkich obywateli urażonych przemową o przesłanie listu wyjaśniającego ich punkt widzenia, gdyż jest otwarty na wysłuchanie drugiej strony."

CAL_contacts_in_legions: "Kontakty w Legionach"
CAL_contacts_in_legions_desc: "W imieniu Gwardii Pretoriańskiej Christianus Cinastovicus pokornie zaprasza dowódców niezłomnych Legionów! W Hotelu Rzymskim w sercu Posnanii odbędzie się majestatyczny bankiet. Głównym tematem będzie bezpieczeństwo ojczyzny, kontrola granic i skuteczne egzekwowanie prawa. Cywile mają surowy zakaz wstępu, gdyż ścisła kwarantanna informacyjna utrzyma kluczowe tajemnice Res Publici w murach hotelu. Zaproszenia dla gości honorowych zostaną dostarczone przy najbliższej okazji."

CAL_contacts_in_the_senate: "Kontakty w Senacie"
CAL_contacts_in_the_senate_desc: "Przez cały przyszły tydzień via Senatus będzie zamknięta, a Cohortes Ubranae nie przepuszczą żadnych pojazdów, w tym rydwanów i wozów. Jest to konieczne z powodu wiecu senatora Thaddaeusa Scarginscisa na schodach Senatu. Wezmą w nim udział ważni Optymaci i goście specjalni, między innymi dowódca Gwardii Christianus Cinastovicus, solidaryzując się z cierpieniami opozycji. Po wiecu Cinastovicus i Scarginscis odpowiedzą na pytania ludzi."

CAL_cunning_stratagem: "Przebiegły fortel"
CAL_cunning_stratagem_desc: "W bezprecedensowym geście przejrzystości dowódca Gwardii Pretoriańskiej Christianus Cinastovicus ogłosił szeroki audyt struktur. Nagły ruch to reakcja na skandal z udziałem niższych gwardzistów organizujących przemyt opium w Gedanum. Praetor oświadczył, że nie będzie tolerował bezwstydnych czynów niszczących wiarygodność Gwardii i zaufanie zwykłych Kalizjan do obrońców Cesarza. Wyniki śledztwa zostaną opublikowane po jego zakończeniu."

CAL_united_in_hatred: "Zjednoczeni w nienawiści"
CAL_united_in_hatred_desc: "Protesty na ulicach Res Publici! Po kontrowersyjnej ustawie Popularów wymagającej zatrudnienia jednego barbarzyńcy na 10 pracowników rozwścieczeni robotnicy wyszli na ulice głównych miast. Żądają cofnięcia lub zmiany prawa tak, by Kalizjanie nie tracili pracy, lecz te głosy pozostały bez odpowiedzi. Mimo apeli Optymatów o ponowne głosowanie Popularzy odmawiają współpracy. \n\nZ innych wieści: bezprecedensowy najazd na graniczne Svina Ostium zabił 34 obywateli i ranił 73. Głównym celem grabieży były małe firmy Kalizjan. Zanim przybyli legioniści, łupieżcy zostawili ogromne zniszczenia. Wkrótce odbędą się modlitwy za zmarłych i rannych."

CAL_proper_officers_for_the_job: "Właściwi oficerowie do zadania"
CAL_proper_officers_for_the_job_desc: "Wieści o Gwardii Pretoriańskiej! Po zeszłotygodniowym usunięciu skorumpowanych członków wiele ważnych stanowisk pozostało pustych. Pierwszy Prefekt Christianus Cinastovicus ogłosił awanse dla gwardzistów wyróżniających się prawym charakterem i zdolnościami. Zapewnił, że napływ świeżej krwi do kierownictwa nie zakłóci działań, lecz tchnie nowe życie dzięki nowym pomysłom. Oficjalna ceremonia awansów odbędzie się w Budorgis, stolicy pretoriańskiej prowincji."

CAL_quiet_purge_in_the_guard: "Cicha czystka w Gwardii"
CAL_quiet_purge_in_the_guard_desc: "Nepotyzm i korupcja! Tak mówi Christianus Cinastovicus, dowódca Gwardii Pretoriańskiej. Długie tajne śledztwo ujawniło olbrzymią sieć powiązań: stanowiska dla rodziny i przyjaciół, denary i barbarzyńskie waluty wymieniane za zamkniętymi drzwiami - to początek listy zbrodni gwardzistów zbyt wygodnie czujących się u władzy. Choć proceder dotyczył głównie niższych rang, winni są też weterani, jak gubernator Pomeranii Phaon Alnus. Ze względu na dalszą służbę Res Publica i Cesarzowi uniknął jednak więzienia, które spotkało wielu bezczelnych sprawców podważających praworządność."

CAL_assignments_for_the_big_night: "Przydziały na wielką noc"
CAL_assignments_for_the_big_night_desc: "Chwała Legionom! Na mocy dekretu Cesarza Ricardusa Augustusa Calisiusa Legio XXI Rapax dostąpi zaszczytu Triumfu w Wiecznym Mieście. Cesarz wynagradza wzorową służbę w kampanii o Silesię Inferior i niezachwianą dyscyplinę. Wydarzenie odbędzie się przy bramie triumfalnej Urbs, a miejscowe collegia wystawią stoiska z ciepłym jedzeniem i towarami. Przybędą senator Petrus Caletus, konsul Andreas Compa i pierwszy prefekt Christianus Cinastovicus. Sam Cesarz nie będzie mógł uczestniczyć z powodu wcześniejszych nieprzewidzianych komplikacji."

CAL_oath_of_undying_loyalty: "Przysięga dozgonnej lojalności"
CAL_oath_of_undying_loyalty_desc: "Pośród politycznych przepychanek Senatu i fal niepokojów Gwardia Pretoriańska jasno określiła lojalność! Najwyżsi oficerowie pod wodzą pierwszego prefekta Christianusa Cinastovicusa symbolicznie okazali uległość. Przed tronem Cesarza Ricardusa Augustusa Calisiusa uklękli, złożyli gladiusy i ogłosili wieczne oddanie jego ochronie aż do śmierci ich lub jego. Cesarz bardzo dobrze przyjął gest i po ceremonii poprosił o osobistą audiencję z pierwszym prefektem."

CAL_servants_in_the_palace: "Służący w Pałacu"
CAL_servants_in_the_palace_desc: "W Pałacu Cesarskim są nowe miejsca pracy! W najbliższych tygodniach administracja Dzielnicy Cesarskiej przeprowadzi rozmowy na stanowiska osobistego degustatora i kucharza dworskiego Cesarza. Rozpatrywani będą wyłącznie najlepsi kucharze kalizjańscy lub barbarzyńscy. Lata doświadczenia i wyższe wykształcenie to minimum, a kandydaci muszą wykazać najwyższe wyrafinowanie kulinarne. Dostępne są też posady dozorców. Przyjęci zostaną tylko ludzie o najwyższej dyscyplinie i niezachwianej etyce pracy."

CAL_false_plot: "Fałszywy spisek"
CAL_false_plot_desc: "Po anonimowym donosie Cohortes Urbanae odkryły zalążki spisku przeciw Cesarzowi! W pustym mieszkaniu barbarzyńskiej części Dzielnicy Plebejskiej znaleziono nielegalną broń, materiały wybuchowe i manifest ogłaszający postać zwaną Ambioryksem wyzwolicielem wszystkich barbarzyńskich osadników. Nikogo nie schwytano, lecz mieszkańcy słyszeli nocnych gości i fanatyczne śpiewy potępiające samo istnienie Res Publica! Gwardia Pretoriańska wraz z Cohortes Urbanae usilnie tropi niedoszłych terrorystów, nim staną się poważnym zagrożeniem."

CAL_plant_the_evidence: "Podrzucenie dowodów"
CAL_plant_the_evidence_desc: "Rada Miejska Urbs ogłasza nabór sprzątaczy ulic po masowym wandalizmie. Ściany urzędów, bloków i prywatnych sklepów pokryło nocą graffiti. Najczęściej powtarza się niedorzeczny manifest wzywający do zniszczenia Res Publici i supremacji plemion nad Kalizjanami oraz wizerunek brodatego mężczyzny o ostrych rysach. Cohortes Urbanae oferują wielką nagrodę w denarach lub wybranej walucie za informacje, które posuną śledztwo naprzód."

CAL_explosive_mixture: "Wybuchowa mieszanka"
CAL_explosive_mixture_desc: "Uwaga, obywatele! Z zakładu amunicji pod Calisią zniknęły trzy skrzynie greckiego ognia! Gwardia Pretoriańska prosi każdego posiadającego informacje, a zwłaszcza zdjęcia lub nagrania, o natychmiastowe zgłoszenie do najbliższej placówki. Czas ma znaczenie, bo materiałów nie odnaleziono. Za pomoc w ujęciu sprawców przewidziano wysokie nagrody w kalizjańskich denarach. Mimo pilności obywatele nie powinni panikować, lecz zachować rozsądną czujność."

CAL_our_little_nero: "Nasz mały Neron"
CAL_our_little_nero_desc: "Dzisiejsze wieści donoszą o niedorzecznych uwagach łaskawego Cesarza Ricardusa Calisiusa podczas zeszłomiesięcznego spotkania z najpracowitszymi senatorami Optymatów. Na ujawnionym nagraniu Cesarz mówi, że niczym osławiony Neron pragnie ujrzeć Wieczne Miasto spalone przez samych barbarzyńców!\n\n//Chwila, co... Jesteś pewien, że to dzisiejsze wiadomości? Widzę pieczęć, ale przysiągłbym, że...no dobrze. //\n\nSzczerze przepraszam za zamieszanie. Z innych wieści: cena chleba spadnie o dziesięć denarów zgodnie z obietnicą Collegium Młynarzy, które produkuje wyłącznie najwyższej jakości chleb z najlepszego ziarna dla każdego Kalizjanina."

CAL_invite_the_barbarians: "Zaproszenie dla barbarzyńców"
CAL_invite_the_barbarians_desc: "Zagadkowe wieści z Senatu! Delegacje różnych plemion germańskich przybyły na audiencję u Cesarza z zaproszeniami osobiście podpisanymi i opieczętowanymi ricardiańską pieczęcią. Popularzy, którzy mieli ich przyjąć, okazali się zupełnie nieprzygotowani. Faux pas sprawiło, że część barbarzyńskich senatorów zerwała z koalicją, czując się znieważona przez kalizjańskich kolegów. Ambasadorowie pozostaną w Urbs przez tydzień; prosimy obywateli, by im nie przeszkadzali."

CAL_stashes_of_greek_fire: "Składy greckiego ognia"
CAL_stashes_of_greek_fire_desc: "Cohortes Urbanae pilnie ostrzegają mieszkańców Wiecznego Miasta! W śmietniku przy Kwaterze Gwardii znaleziono skrzynię materiałów zapalających pokrytą germańskim pismem, prawdopodobnie galijskim. Odczytane fragmenty to potok obelg wobec Gwardii i pierwszego prefekta, a większość równie wulgarnego tekstu pozostała na prowizorycznym ładunku. Śledczy potwierdzili, że użyto greckiego ognia pochodzącego zapewne ze skrzyń skradzionych z fabryki. Gwardia wzywa do czujności. Podobnych urządzeń nie wolno dotykać; należy je natychmiast zgłaszać."

CAL_great_fire_of_calisia: "Wielki Pożar Calisii"
CAL_great_fire_of_calisia_desc: "Urbs płonie! Atak terrorystyczny spustoszył wielkie połacie Wiecznego Miasta! Po serii eksplozji stanęły w ogniu Senat, Wielkie Tabularium i główna siedziba Legionów. Los Marcusa Viniciusa jest nieznany; ostatnio widziano go organizującego legion do pomocy Vigiles. W chaosie Gwardia Pretoriańska przejęła obowiązki utrzymania pokoju. Trwa ewakuacja walących się budynków, a Vigiles próbują ratować ludzi spod gruzu i płonących ruin. Res Publica wzywa chętnych obywateli do łańcuchów z wiadrami i gaszenia pożarów."

CAL_sic_semper_tyrannis: "Sic Semper Tyrannis"
CAL_sic_semper_tyrannis_desc: "Cesarz nie żyje! Gdy ugaszono ogień wokół Pałacu, Gwardia wkroczyła, by schwytać sprawców widzianych wcześniej przy wejściu. Widok nie był dla ludzi o słabym sercu ani żołądku. Ricardus Augustus Calisius leżał rozszarpany przed tronem, a osobistych gwardzistów dało się rozpoznać niemal wyłącznie po pancerzach. Marcus Vinicius, bohater Calisii, także nie żyje; wydobyto go z ruin sztabu Legio I Alfa nieopodal Pałacu. W czasie kryzysu pierwszy prefekt Christianus Cinastovicus wygłosi ważne oświadczenie. Rodziny zaginionych mogą zgłaszać się do Gwardii lub Vigiles po informacje."


CAL_ides: "Idy"
CAL_ides_desc: "Uwaga, obywatele! Ze względów bezpieczeństwa podczas następnego posiedzenia Senatu obowiązuje godzina policyjna. *Nikomu* nie wolno opuszczać domu, a łamiących zakaz czekają kary, których NIE CHCECIE poznać. \n\nPrzez następny tydzień nie będzie dalszych ogłoszeń. Obywatelom zaleca się nie zadawać pytań urzędnikom ani gwardzistom i unikać polityki w rozmowach publicznych oraz prywatnych."

CAL_expulsion_of_barbarians: "Wypędzenie barbarzyńców"
CAL_expulsion_of_barbarians_desc: "Na rozkaz Senatu *wszyscy barbarzyńcy* w kraju zostają uznani za *wrogów Calisii!* Prawi obywatele mają zgłaszać ich działalność lub przekazywać do najbliższego posterunku. Jeśli nie mogą tego zrobić albo pokojowe środki zagrażałyby życiu, wolno im wymierzyć najeźdźcom sprawiedliwość według własnego uznania. \n\nMajątek porzucony przez barbarzyńców należy zgłosić straży. Część przedmiotów może wrócić do znalazcy jako nagroda. \n\nBarbarzyńcy dobrowolnie oddający się straży będą mogli opuścić kraj bez szkody. \n\nChwała Res Publice. Chwała Calisii."

CAL_caletus_wall: "Mur Caletusa"
CAL_caletus_wall_desc: "\"Kiedy Barbari przysyłają swoich ludzi, nie przysyłają najlepszych\" - mówi Petrus Caletus. \nNa prawych brzegach Viadrusu i Nissa Lusatiana powstanie więc mur powstrzymujący barbarzyńców! Senat nakazuje uczynić germański limes nieprzeniknionym i łatwym do obrony. Budowę poprowadzą najlepsi inżynierowie wojskowi, a żaden człowiek nie przemknie nad ani pod murem! Magister Militum rozszerza też siły graniczne - wszyscy obywatele są zaproszeni do punktów werbunkowych. \nJeśli personelu nadal będzie zbyt mało, armia zastrzega prawo do przymusowego poboru. \n\nWszystkie posterunki Limitanei otrzymają materiały w ciągu trzech dni. \n\nChwała Calisii i Res Publice."

CAL_settle_soldiers_in_the_frontier: "Osiedlanie żołnierzy na rubieżach"
CAL_settle_soldiers_in_the_frontier_desc: "Uwaga, żołnierze Calisii! Magister Militum zarządził przesiedlenie dodatkowych trzydziestu tysięcy żołnierzy na Limes Occidentalis. Armia przejmuje nieruchomości na najdalszym zachodzie. Właściciele ziem Zachodniego Pogranicza mają oczekiwać listów tradycyjnych lub cyfrowych. Państwo oferuje w ramach rekompensaty majątek przesiedlonych żołnierzy albo odszkodowanie pieniężne. \n\nPersonel wojskowy i rodziny mają czekać na wezwania, które nadejdą wkrótce. Od dostarczenia listu mają dwadzieścia dni na osiedlenie się we wskazanym miejscu. \n\nNiewykonanie rozkazu pociągnie za sobą ciężkie konsekwencje."

CAL_tributes_from_germania: "Daniny z Germanii"
CAL_tributes_from_germania_desc: "Germanie zgodzili się na traktaty neutralności zaproponowane przez armię i państwo kalizjańskie! \nW zamian za otwarcie rynków dla naszych przedsiębiorców oraz półroczne daniny w uzbrojeniu, ciężkim sprzęcie, pojazdach cywilnych i detergentach, a także comiesięczne dostawy dobrego zboża, owoców i napojów, Calisia przestanie bombardować barbarzyńskie posterunki i obozy uchodźców poza dawnymi granicami Polonii. Barbarzyńcy w Calisii będą odtąd deportowani zamiast skazywani na śmierć, a Kalizjanie w sąsiednich państwach germańskich oraz ich posiadłości otrzymają osobistą ochronę. \n\nOsoby z interesami gospodarczymi i politycznymi w Germanii powinny uważnie śledzić sytuację. Produkcja i stan dostaw będą kontrolowane przez urzędników. \n\nTraktat wejdzie w życie po utworzeniu kalizjańskich ambasad w Germanii."

CAL_eternal_spirit_of_germanicus: "Wieczny duch Germanika"
CAL_eternal_spirit_of_germanicus_desc: "Duch Gaiusa Claudiusa Drususa Germanicusa uśmiecha się promiennie, patrząc jak potężny Petrus Germanicus Caletus odnosi całkowite zwycięstwo nad plemionami! Calisia wygrała, a najeźdźcy nie stanowią już bezpośredniego zagrożenia! \n\nZa trzy dni rozpocznie się największy i najdłuższy Triumf w historii, trwający 70 godzin. Sam pochód *wszystkich* germańskich machin, broni, jeńców, banitów, milicjantów, ciężkiego sprzętu, drogich pojazdów i reliktów dawnych imperiów potrwa 40 godzin, nie licząc przerw na ucztę i rozrywkę. Finałem będzie hołd Petrusa Caletusa złożony bogom i starożytnemu Germanicusowi za jego zwycięstwa nad barbarzyńcami. \n\nLegionowe orkiestry zapowiadają liczne koncerty, a artyści i kupcy z całego Cesarstwa rozstawiają stoiska. Można reklamować je na oficjalnej stronie i w aplikacji Wiecznego Miasta.\n\n\nNiech zwycięstwo będzie wiecznie czczone w annałach! \nAve Petrus Germanicus Caletus i Ave Gaius Claudius Drusus Germanicus!"

CAL_surround_the_palace: "Otoczyć Pałac"
CAL_surround_the_palace_desc: "Uwaga, obywatele! Aby jednostki doskonaliły rozwiązywanie kryzysów, dziś w Dzielnicy Cesarskiej i okolicy odbędą się \"ćwiczenia wojskowe\". Mieszkańcom *nakazuje się* nie wchodzić w kontakt z siłami w Calisii, nie panikować i nie kontaktować się bezmyślnie z gwardzistami, urzędnikami ani ich krewnymi w sprawie sytuacji. \n\nW ramach szkolenia zerwana zostanie wszelka łączność świata z Pałacem, Cesarzem i jego otoczeniem, a rząd cywilny nie wyda komunikatów. \n\nOperacja ruszy za trzydzieści minut i potrwa kilka dni. \n\nChwała Calisii. Chwała Cesarstwu. Chwała armii kalizjańskiej."

CAL_purge_the_populares_leadership: "Czystka kierownictwa Popularów"
CAL_purge_the_populares_leadership_desc: "Wieści dla obywateli Cesarstwa! \n\nPo licznych konsultacjach eksperci wojskowi i polityczni zgodzili się, że nieudolność Popularów oraz ich głupia polityka zagraniczna i bezpieczeństwa były główną przyczyną skali kryzysu i szkód wyrządzonych przez German! \nDlatego po dalszych rozmowach Cesarz, Optymaci i armia ogłosili wszystkich polityków Popularów *wrogami Calisii* za narażenie Cesarstwa, wywołanie kryzysu i brak ograniczenia szkód! \n\nKażdy obywatel powinien im wyrządzić krzywdę, jeśli może! Schwytanie lub zabicie będzie sowicie nagrodzone po przedstawieniu dowodu! Wsparcie Popularów - demonstracje albo ukrywanie z pobudek humanitarnych - stanowi *zdradę państwa* karaną śmiercią. \nNazwiska i zdjęcia poszukiwanych wraz z dokumentami o ich udziale w inwazji trafią na Forum Calisianum, a plakaty w całym kraju ułatwią identyfikację. \n\nChwała Cesarstwu i Calisii!"

CAL_hour_of_the_lynx: "Godzina Rysia"
CAL_hour_of_the_lynx_desc: "Optymaci ogłaszają zwycięstwo nad wrogami Calisii! Aby zapobiec dalszemu zniszczeniu i chaosowi, wprowadzą środki żelaznej ręki: frakcja przejmie całkowitą kontrolę nad Senatem i na czas nieokreślony pozostanie jedyną siłą polityczną. Legiony, Gwardia Pretoriańska i wszystkie służby będą odtąd podlegać Senatowi bez prawa do samodzielnych decyzji. \n\n*FRAKCJA OSTRZEGA WSZYSTKIE SIŁY ZEWNĘTRZNE I WEWNĘTRZNE PRZED DALSZYMI NIEPOKOJAMI, GDYŻ NIE ZAWAHA SIĘ UŻYĆ ŚMIERCIONOŚNEJ SIŁY.* \n\nPrzez 30 dni obowiązuje godzina policyjna. \n\nChwała Cesarstwu i chwała... Calisii."

CAL_servile_war: "Powstanie niewolników"
CAL_servile_war_desc: "Obowiązuje stan wojenny! Z powodu powstania niewolników i barbarzyńców obywatelom odradza się podróże poza miasta! Senat i Legiony podwajają wysiłki, by zmiażdżyć bunt. Za każdego zbiegłego niewolnika schwytanego i dostarczonego władzom przewidziano wysoką nagrodę! Winnych ukrywania i wspierania powstańców czeka doraźny osąd! Módlcie się o szybki, surowy wyrok dla buntowników i rychły kres ich podłej wojny!"

CAL_via_crucis: "Via Crucis"
CAL_via_crucis_desc: "Podróżujący Autovia A-I powinni wiedzieć, że odcinek drogi zastawiono krzyżami, na których zawisną zbuntowani niewolnicy! Senat zaleca rodzicom, by nie zasłaniali dzieciom oczu, bo nigdy nie jest za wcześnie na naukę o surowości sprawiedliwości wobec zdrady! Każdy, kto pomoże skazańcom, zdejmie ich, skróci cierpienie albo poda ocet, poniesie konsekwencje!"

CAL_shadow_of_an_emperor: "Marność Cesarza"
CAL_shadow_of_an_emperor_desc: "Wprowadzono zmiany prawne! Wczoraj Senat przyjął, a Cesarz podpisał ustawę znacząco rozszerzającą senacką kontrolę nad jego władzą. Analitycy przewidują, że Imperator Ricardus musi porzucić sprzeciw i utrudnianie codziennych rządów oraz podążyć za mądrością Senatu. Biuro Cesarza nie odpowiedziało na prośbę o komentarz. Wiarygodne raporty lekarzy pałacowych mianowanych przez Senat obalają spekulacje o złym zdrowiu Imperatora!"

CAL_reconstruction_fund: "Fundusz odbudowy"
CAL_reconstruction_fund_desc: "Z dobroczynnością i łaską Senat zatwierdził nadzwyczajne inicjatywy odbudowy, umożliwiając organizacjom, firmom i patrycjuszom bezprecedensowe inwestycje w powojenną rekonstrukcję sektora cywilnego! Cech Młynarzy, Grupa Inwestycyjna Kato i Fundacja Zamożnego Społeczeństwa to trzej najwięksi darczyńcy! Niech hojność przyniesie im wieczną wdzięczność! Przekażcie dość, by wejść do rankingu, a nazwa organizacji zostanie wymieniona w następnym ogłoszeniu!"

CAL_rewards_for_the_faction: "Nagrody dla frakcji"
CAL_rewards_for_the_faction_desc: "Za odrzucenie legalności Senatu liczni współpracownicy Popularów stają przed doraźnym sądem i proskrypcją w mianowanych przez Senat sądach! Sprawiedliwość wymierzy legion specjalnych prokuratorów, zapobiegając przeciążeniu wymiaru sprawiedliwości! Z niezwiązanych wieści: Senat nagrodził ziemią i majątkiem ludzi zasłużonych dla obrony demokracji. Kto stoi przy Calisii, zawsze będzie prosperował!"

CAL_senatus_consultum_ultimum: "Senatus Consultum Ultimum"
CAL_senatus_consultum_ultimum_desc: "Strzeżcie się, powstańcy! W odpowiedzi na Popularów, niewolników i inne zagrożenia praworządności, które doprowadziły Calisię nad przepaść pod fasadą demokracji, wchodzi w życie Senatus Consultum Ultimatum! SCU daje magistratom i służbom prawo sprowadzenia gniewu Senatu, nieskrępowanego prawem, na krajowych terrorystów, zbuntowanych niewolników i wszystkich utrudniających senackie rządy. Niech drastyczne środki przypomną wichrzycielom o marzeniu większym niż każdy z nas: silnej i stabilnej Calisii!"

CAL_total_administration_takeover: "Całkowite przejęcie administracji"
CAL_total_administration_takeover_desc: "Zniesmaczony korupcją, nadużyciami władzy i bezprawiem zbuntowanych elementów administracji Senat ogłosił całkowitą przebudowę sektora publicznego! Sądownictwo otrzyma specjalnych prokuratorów pod senackim nadzorem, którzy prześwietlą każdego urzędnika bez względu na rangę. Energiczne śledztwa przyniosły już setki spraw przeciw skorumpowanym funkcjonariuszom, natychmiast zawieszanym do wyroku i szybko zastępowanym! Niech zawsze sprawiedliwość Senatu wiecznie chroni nas przed publicznym występkiem!"

CAL_triumph_in_calisia: "Triumf w Calisii"
CAL_triumph_in_calisia_desc: "Dziś świętujemy chwałę ukochanego Senatu, jego doskonałe przewodnictwo i odrodzenie Calisii! W południe handel ustanie, a główne ulice zostaną oczyszczone z ruchu. Naruszający zakaz będą chłostani! Dotyczy to wszystkich miejscowości o statusie miasta. Dzień będzie świętem państwowym wolnym dla wszystkich niekluczowych pracowników! Radujcie się owocami pracy prowadzonej ku wielkości przez najlepszych! Radujcie się jak to robią wszyscy! Naprawdę wszyscy!"

CAL_renovatio_imperii: "Renovatio Imperii"
CAL_renovatio_imperii_desc: "Dzięki niezwykłym wysiłkom Senatu niestabilność i niepokoje należą do przeszłości! Gospodarka ugina się pod ciężarem inwestycji, płace rosną rekordowo, a sondaż Senatu wykazuje zaufanie do niego i sądów u 99,1% respondentów! Poparcie według renomowanych pracowni wynosi około 80%. Zmiany Optymatów ulepszyły, lecz nigdy nie przebudowały niebezpiecznie Cesarstwa, a nasze miejsce pod słońcem jest bezsporne. Chwała Senatowi i tysiącletniej Calisii na zawsze!"

CAL_cry_havoc: "Spuścić psy wojny"
CAL_cry_havoc_desc: "Słuchajcie najważniejszych wieści w życiu! Wiecie już, że każdy prawy obywatel ma ścigać i zabijać kochających barbarzyńców zdrajców! Ustalono jednak, że nie tylko przywódcy Popularów odpowiadają za infiltrację. Sam Imperator Ricardus Calisius został zgodnie z prawem mądrych senatorów uznany za przestępcę i stracony przez dzielnych pretorian. Rozumiem wasz szok. Mimo zaszczytnego urzędu był tylko obywatelem, a nikt nie stoi ponad kalizjańskim prawem. Zasługi dla kraju nie zmywają winy. To odróżnia republikę od znienawidzonych barbarzyńskich królestw. Kto wie? Może właśnie po to Calisius wpuścił Germanów - jako podstawę despotycznej władzy? By wzniecić niepokoje i sprawić, że przestraszeni obywatele poprą absolutyzm? By ochronić ich przed problemami, które sam wywołał?\n\nChcecie ujrzeć los tyranów na kalizjańskiej ziemi? Przyjdźcie pod Pałac i zobaczcie wystawione ciało przygotowane na sprawiedliwość ludu."

CAL_optimates_secures_administration: "Optymaci zabezpieczają administrację"
CAL_optimates_secures_administration_desc: "Czas wrogich intryg dobiegł końca! Po usunięciu zdrajców grupa kalizjańskich lojalistów zwana Liberatores obsadziła wszystkie kluczowe ośrodki decyzyjne. Zapewnią, że mieszkańcy nie będą już cierpieć pod złymi rządami tyranów próbujących zalać kraj prymitywnymi brutalami. Silna ręka Optymatów szybko rozwiąże pilne sprawy obywateli. To znaczy *prawdziwych* obywateli!"

CAL_praetorian_guard_secures_the_city: "Gwardia Pretoriańska zabezpiecza miasto"
CAL_praetorian_guard_secures_the_city_desc: "Uwaga, mieszkańcy Urbs Calisia! Do odwołania nie wolno pod żadnym pozorem opuszczać miasta. Próbujących powstrzymają przemocą dzielni pretorianie. Zapewniam, że nie ma powodów, by obawy o bezpieczeństwo skłaniały do ucieczki, ponieważ Vigiles i Gwardia tłumią potencjalne zamieszki, zanim wybuchną. Środki są tymczasowe, a życie wróci do normy po ustabilizowaniu stolicy. Do tego czasu pozostańcie w domach i żyjcie zwyczajnie, gdy najlepsi z nas rozwiązują kryzys. Pamiętajcie! Działania mają wyłącznie chronić miasto przed zbuntowanymi legionami pragnącymi okupacji dla nikczemnych zysków!"

CAL_triumph_of_liberatores: "Triumf Liberatores"
CAL_triumph_of_liberatores_desc: "Porządek przywrócony! Zły tyran nie żyje! Podli barbarzyńcy, których wpuścił, zostali zabici! Zdradzieckie szczury zatruwające jego umysł ukarano! Radujcie się! Stan wojenny dobiegł końca i znów wolno gromadzić się publicznie oraz podróżować! Nową epokę uczczą wspólnym Triumfem Prefekt Cinastovicus, konsul Caleta i przywódca legionistów Marcus Vinicius. Pozostaje jedynie, by legat przebywający w willi w Dzielnicy Cesarskiej publicznie poparł nowe władze i zakończył czas niepokojów! Nie lękajcie się! Choć Vinicius nie brał udziału w tyranobójstwie, był dość mądry, by nie kazać szturmować stolicy. Jego deklaracja to formalność!"

CAL_optimates_rule_over_senate: "Optymaci rządzą Senatem"
CAL_optimates_rule_over_senate_desc: "Po zakończeniu zamętu Senat - instytucja określająca naszą Res Publicę - może znów funkcjonować. Będzie jeszcze cnotliwszy, bo uwolniony od zdrajców. Zwykły kalendarz posiedzeń wkrótce powróci pod czujnym okiem nowych konsulów. Nic dziwnego, że Optymaci zamierzają dominować. To zasłużona nagroda za ocalenie Res Publici, zwłaszcza gdy przywódcy Popularów zginęli lub uciekli. Niezależni senatorowie czują wiatr zmian i gromadzą się pod sztandarem Rysia. Wszyscy są zaproszeni, by podczas transmisji ujrzeć nowe, czystsze i bardziej honorowe oblicze Senatu!"

CAL_declare_the_populares_enemies_of_the_state: "Uznanie Popularów za wrogów państwa"
CAL_declare_the_populares_enemies_of_the_state_desc: "Strzeżcie się wrogów Calisii! Mimo proskrypcji zdradzieckiego elementu Popularzy nadal spiskują przeciw ludowi! Całą frakcję trzeba wykorzenić. Mądrzy senatorowie ogłosili ich wrogami Cesarstwa! Pretorianie rozpoczęli czystki w Senacie, wymierzone w członków i jawnych sympatyków. Każdy dobry obywatel ma obowiązek ich skrzywdzić, jeśli może! Za głowy Turów otrzymacie nagrodę, wielcy bohaterowie Res Publici! Atakujcie ich w domach, na ulicach i w rynsztoku! Każdy ocalały może zagrozić państwu spiskiem! Odtąd każdego przeciwnika Optymatów musi poświadczyć jeden z Liberatores, by zapewnić stabilność i nigdy nie dopuścić do powrotu mrocznych dni barbarzyńskiego terroru!"

CAL_mass_annulment_of_laws: "Masowe unieważnienie ustaw"
CAL_mass_annulment_of_laws_desc: "Dzielni pretorianie i jeszcze dzielniejsi obywatele wykorzenili Popularów! Teraz usuniemy ich dziedzictwo z prawa. Barbarzyńcy nie będą już wypaczać bezspornej woli Senatu! Wszystkie nielegalne ustawy Popularów zostają anulowane! Optymaci wprowadzą nowe prawo, które dopuści do Senatu wyłącznie najbardziej szanowanych i wykwalifikowanych obywateli. Obywatelstwo wymagać będzie większych darowizn, a tytuł senatora przysługiwać tylko mieszkańcom Urbs Calisia i Prowincji Senatorskiej. Zgromadzenia ludowe pozostaną organami doradczymi. Twarde rządy Optymatów zapewnią stabilność, cnotę i zrównoważony budżet!"

CAL_primus_in_optimates: "Primus in Optimates"
CAL_primus_in_optimates_desc: "Ustąpcie orszakowi konsula! Władca Senatu - konsul Caletus - zmierza do Pałacu przedstawić stanowisko Optymatów. Płomienny mówca ma większą władzę polityczną niż którykolwiek Kalizjanin i pokaże swoją retoryczną siłę w negocjacjach. Dostojna postawa wyjaśnia, dlaczego uważa się za prawdziwego gospodarza wielkiego spotkania rozstrzygającego przyszłość, mimo skromnego poparcia wojska. Prawdziwy Primus Inter Pares. Powitajmy go gromkimi oklaskami. Chwała konsulowi Petrusowi Caletusowi!"

CAL_praetorian_rule_over_army: "Pretorianie panują nad armią"
CAL_praetorian_rule_over_army_desc: "Pamiętajcie, że choć aprobata Viniciusa dla nowego reżimu jest niemal pewna, nie będzie naszym legatem wiecznie! Może zginąć z rąk wrogów, zachorować albo umrzeć śmiercią naturalną. Aby zapewnić posłuszeństwo armii także po jego odejściu, Prefekt Cinastovicus wysłał gwardzistów do nadzoru wojska. Będą służyć radą i zgłaszać zdradę, by żaden legion nie zbuntował się przeciw prawowitym obrońcom! To oczywiście rozwiązanie tymczasowe do czasu stabilizacji i ostatecznego rozprawienia się z Popularów. Jak hojnie przywódcy oddają osobistych strażników dla bezpieczeństwa i dobrobytu Cesarstwa. Prawdziwi synowie Calisii!"

CAL_border_camps_for_barbarians: "Obozy graniczne dla barbarzyńców"
CAL_border_camps_for_barbarians_desc: "\"Odesłać ich tam, skąd przyszli!\" Tak brzmi oficjalna wola ludu ustalona na ostatnim zgromadzeniu! Germańscy, scytyjscy i estyjscy barbarzyńcy zostaną wysłani do ziem pochodzenia. Defetyści Popularów próbujący przemycać ich przez granice i podważać Calisię zostaną zatrzymani i osądzeni. Oszczerstwa wobec Limitanei nie będą tolerowane! Podejrzani barbarzyńcy trafią do obozów przy limesie, gdzie ustalimy, czy rzeczywiście nimi są i dokąd ich wysłać. Władcy nie są okrutnymi despotami! Każdy trafi dokładnie do miejsca pochodzenia. Mimo podłego ataku nie będziemy rozdzielać rodzin! Chcemy tylko legalnie chronić granicę! Dla spokojnego przebiegu procesu cywile i skrybowie niezwiązani z Acta Diurna nie mogą odwiedzać pogranicza."

CAL_breaking_the_geneva_convention: "Złamanie konwencji genewskiej"
CAL_breaking_the_geneva_convention_desc: "Ostrzegaliśmy ich! Zawracaliśmy! Wypędzaliśmy! Walczyliśmy! Nie słuchali. Chcieliśmy okazać łaskę, lecz zapomnieliśmy, że prymitywne zwierzęta jej nie rozumieją. Unieście w górę widły! Wypędźcie ich sami! To wasi wrogowie! Chcą zabić was i dzieci, zabrać kobiety oraz majątek! Usuńcie ostatnią plamę nieudanych rządów Popularów! Barbarzyńcy, którzy nie zdołają uciec, mogą zostać wyrżnięci lub zniewoleni! Warunki były proste! Najeźdźcy znali swój los! Bez litości, ludu czystej Calisii!"

CAL_master_of_puppets: "Władca marionetek"
CAL_master_of_puppets_desc: "Z bezpiecznego cienia Prefekt Christianus Cinastovicus dzielnie wychodzi na ulice Calisii, by ujrzeli go obywatele. Na zawsze będzie czczony jako człowiek, dzięki któremu tyranobójstwo odbyło się z minimalnymi zakłóceniami i niechcianymi stratami. Nadchodzące dni są tak ważne, że postanowił osobiście zająć się sprawą. Pretorianie i Frumentarii są potężni, lecz jak przystało na elitę - nieliczni. Dlatego w swej mądrości zgodził się współpracować z dwoma innymi wielkimi mężami epoki dla najskuteczniejszej służby Calisii."

CAL_compromise_with_popular_legions: "Kompromis z legionami Popularów"
CAL_compromise_with_popular_legions_desc: "Dobre wieści, Kalizjanie! Większość Legionów jest wierna roztropnemu Viniciusowi, który dla stabilności Res Publici zabronił ataków na pretorian i prawowitych przedstawicieli państwa. Niektóre zwiedzione Legiony nie znały szaleństwa Calisiusa i zaczęły łupić praworządnych obywateli. To prości żołnierze nieświadomi intryg; ich umysły nie rozpoznały złej demagogii Popularów! Konsulowie chcą karać tylko spiskujących zdrajców, a każdy rozsądny widzi, że legioniści nie są winni. Wielkodusznym Cinastovicusowi i Caletusowi zależy na życiu Kalizjan, dlatego wysyłają emisariuszy, by przekonali zbuntowanych legatów do tradycyjnego ładu! Na pewno się uda i konsulowie nie będą musieli użyć osobistych straży. Są jednak gotowi."

CAL_lands_for_the_legionaries: "Ziemie dla legionistów"
CAL_lands_for_the_legionaries_desc: "Wieści dla legionistów, którzy nie przysięgli Liberatores! Wielcy obrońcy Calisii! Ostatnie miesiące były... co najmniej skomplikowane. Lecz stary porządek nie wróci, a sprawa Popularów jest przegrana i nie warto za nią umierać. Obiecywali publiczną ziemię i zboże. Widzieliście je? Skupili się na zadowalaniu barbarzyńców, zapewne opłacani przez obce imperia. Chcecie zasłużonych nagród? Wracajcie na łono Optymatów! Pod rządami Liberatores dostaniecie wszystko! Żołnierze \"zbuntowanych legionów\", którzy złożą przysięgę, otrzymają żyzne ziemie Antecarpathii i bogate wsie Venedii Minor. Pamiętajcie: Optymaci troszczą się o biednych Kalizjan, a nie o barbarzyńców i ich zrabowane bogactwo!"

CAL_personal_offer_for_vinicius: "Osobista oferta dla Viniciusa"
CAL_personal_offer_for_vinicius_desc: "Uważnie słuchajcie przyszłych wiadomości! Calisię czekają wielkie zmiany i gruntowna reforma Res Publici, ofiary własnego sukcesu. Szczegółów nie mogę zdradzić. Jedno pewne: Marcus Vinicius będzie kluczową postacią nowego ładu! Nie odpowiedział jeszcze na zaproszenie Liberatores, zapewne niepewny, czy nowi władcy ocalą Cesarstwo. Wszyscy możemy poświadczyć, że ich wspólne rządy zdały próbę. Legat też to widzi i zmierza do stolicy z Legionami, gotów współpracować z władzami cywilnymi dla dobra wszystkich Kalizjan! Obywatele mają okazać należny szacunek, choć wobec jego popularności rozkaz jest zbędny."

CAL_vulgar_beast: "Wulgarna bestia"
CAL_vulgar_beast_desc: "Strzeżcie się! Śmiały legat jedzie negocjować z Liberatores! Cnotliwy i umiłowany za apolityczność cierpliwie oceniał nowych władców. Najwyraźniej ujrzał światło i zdecydował, że jego Legiony wiernie posłużą Calisii zamiast pogrążać ją w kolejnej wojnie domowej. Przybycie uprawomocni nowy ład, a wiedza wojskowa wzbogaci plany na przyszłość. Możemy odetchnąć z ulgą, wiedząc, że groźne legiony pod granicami Urbs stoją po naszej stronie. Ave Legiones! Ave Legatus!"

CAL_lawful_tyrannicide: "Prawowite tyranobójstwo"
CAL_lawful_tyrannicide_desc: "To, co wiedziano, zostało sformalizowane: Ricardus Calisius był tyranem! Trzej wielcy mężowie epoki z gronem prawników ustalili, że akty z ostatniego miesiąca jego rządów były bezprawne. Mędrcy wskazali starość i propagandę Popularów szeptaną do ucha jako przyczynę. Możliwe też, że podawali Cesarzowi halucynogeny, by wywołać szaleństwo! Nikczemne intrygi zmusiły Liberatores do działania, lecz mamy wreszcie akt dowodzący, że egzekucja biednego, zwiedzionego Calisiusa była uzasadniona. Nawet fanatycznie lojalny Marcus Vinicius uznał ich rację. Przywódcy debatują teraz nad terminem wyborów! Bądźcie cierpliwi; klimat polityczny pozostaje niepewny, wrogowie kryją się w cieniu, a Cesarstwo jest zbyt wielkie, by szybko ich znaleźć."

CAL_the_first_triumvirate: "Pierwszy Triumwirat"
CAL_the_first_triumvirate_desc: "Słuchajcie, Kalizjanie! Nadchodzą wielkie zmiany! Petrus Caletus i Christianus Cinastovicus ustąpili ze stanowisk! Porozumieli się z Marcusem Viniciusem i ogłosili Triumwirami Calisii oddanymi ochronie Res Publici. Państwo zostanie podzielone na trzy równe części dla sprawniejszych rządów! Każdy Triumwir będzie niemal niezależnie zarządzał ziemiami i wprowadzał najlepsze według siebie reformy. Konkurencja systemów wskaże najlepszy kierunek po zjednoczeniu i zapobiegnie wojnom domowym z braku zgody co do polityki wewnętrznej. Niech żyje jedność! Niech żyje Triumwirat! Niech żyje Calisia!\n\nDodatkowa wiadomość dla podróżnych i kupców: słuchajcie miejscowego lektora, by poznać właściwą jurysdykcję."

### EPILOG - PRETORIANIE ###

CAL_eternal_city_falls_silent: "Wieczne Miasto milknie"
CAL_eternal_city_falls_silent_desc: "Sic Semper Tyrannis! Cesarstwo zostało wyzwolone spod rządów tyrana. Mimo wszystko był on jednak naszym władcą. Zgodną wolą wszystkich frakcji uroczystości pogrzebowe odbędą się w Dies Solis na Forum Calisianum. Prosimy zachować odpowiednią powagę i cywilizowane maniery.\n\nOd dnia po pogrzebie obowiązuje stan wojenny! Dla bezpieczeństwa obywateli grupy większe niż trzech mężczyzn nie mogą gromadzić się publicznie. Od dziś obowiązuje godzina policyjna! Każdy na ulicy po zmroku zostanie doraźnie osądzony. \n\nNiech żyje Cesarstwo! Niech żyją pretoriańscy wybawcy!"

CAL_sheep_in_the_den_of_wolves: "Owca w jaskini wilków"
CAL_sheep_in_the_den_of_wolves_desc: "Słuchajcie, obywatele Calisii! Liberatores, potężni strażnicy Cesarstwa, są dziś arbitrami losu. W ich rękach spoczywa moc kształtowania przeznaczenia i prowadzenia nas przez wzburzone wody niepewności. Nie lękajcie się jednak, bo Gwardia Pretoriańska zapewnia, że zapanuje porządek.\n\nDla nas życie toczy się zwyczajnie! Wszyscy boimy się jutra, ale Prefekt ma na sercu wyłącznie nasze dobro! Dla nas, zwykłych obywateli, obalili tyranię! Możemy odpłacić jedynie wiarą, że wybiorą właściwą drogę. Ja ją mam! Kto stanie przy mnie?! Ave Praefectus Cinastovicus!"

CAL_discordia: "Discordia"
CAL_discordia_desc: "Zbierzcie się, obywatele, bo powietrze jest gęste od napięcia. Dekretem Gwardii rozpoczyna się nowa epoka, lecz cień tyranii pozostaje, póki Senat zachowuje wpływy. Zapamiętajcie: pod fasadą jedności wrze niepokój. Mieszkańcy szepczą z obawą, gdy uścisk Optymatów zaciska się na sercu rządów. \n\nRównowaga władzy chwieje się na ostrzu noża. Posłuchajcie ostrzeżenia i umocnijcie swojego ducha. W burzliwych czasach jedność będzie wałem przeciw sztormowi. Czuwajcie, bo los Calisii wisi na włosku. Bądźcie wierni wyzwolicielom; bądźcie wierni Prefektowi Christianusowi Cinastovicusowi!"

CAL_lynx_blinded: "Zaślepiony Ryś"
CAL_lynx_blinded_desc: "Obywatele Calisii, słuchajcie dekretu Urzędu Cesarskiej Regencji! Aby ochronić państwo przed wewnętrzną waśnią i zdradą, frakcja Optymatów zostaje uznana za wrogów Cesarstwa!\n\nNiczym czujny ryś z symboliki przeciwników pretorianie rozpoznali ich przywódców jako zagrożenie dla stabilności i bezpieczeństwa Res Publici. Muszą działać szybko, by nie zwodzili ludu niebezpiecznymi ideologiami i buntowniczymi spiskami.\n\nTo nie złośliwość, lecz święty obowiązek ochrony Cesarstwa. Stańcie przy dzielnych pretorianach, gdy oczyszczają politykę z korupcji i zapewniają jaśniejszą przyszłość! Każdy, kto dostrzeże Optymatów, ma ich schwytać lub zrobić im krzywdę - oczywiście za sowitą nagrodą."

CAL_incorporate_the_legions: "Inkorporacja Legionów"
CAL_incorporate_the_legions_desc: "Szanowni obywatele! Legiony są pozbawione centralnej władzy legatów! Niektórzy z nich odmawiają złożenia przysięgi wierności wobec nowej władzy, która z łaski bogów została namaszczona na piastowanie najwyższych stanowisk w Imperium! Podsycani nienawiścią senatorskich kłamstw, legaci co bardziej oddalonych legionów zdecydowali się podnieść bunt!\n\nLecz nie bójcie się szanowni obywatele, wszak nie grozi nam przeto wojna domowa, są to odosobnione przypadki. Każda rodzina posiada swoje czarne owce, a przeważająca większość dowódców armii stoi razem z nami i gwardią Pretoriańską ramię w ramię i nie dopuści do jakiegokolwiek rozlewu krwi! To tylko kwestia czasu zanim buntownicy zorientują się że są osamotnieni."

CAL_dinner_with_lions: "Obiad z lwami"
CAL_dinner_with_lions_desc: "Szanowni obywatele! Wystarczająco długo senatorscy ciemiężyciele uciskali nas swoimi prawami, zakazami, nakazami i ograniczeniami! Teraz role się odwróciły - przyszła kolej ludu by odpłacić się pięknym za nadobne. W nadchodzące Dies Solis, w miejskim Koloseum odbędzie się wyjątkowy spektakl, który liberatores dedykują wszystkim tym którzy łakną sprawiedliwości!\n\nKrwiożercze bestie, które nie powstrzymają się przed tym żeby zwykłego człowieka rozszarpać na strzępy tak żeby nic z niego nie zostało, okrutne potwory które nie mają w sobie ani uncji empatii, drapieżniki dla których liczy się tylko następny posiłek. A obok nich - królowie dżungli - lwy! Kto wygra? Możemy się jedynie domyślać. Wstęp wolny!"

CAL_battle_with_urban_cohorts: "Bitwa z Kohortami Miejskimi"
CAL_battle_with_urban_cohorts_desc: "Obywatele! Dzisiaj rano dostaliśmy doniesienia o zbrojnych rozruchach w największych miastach naszego imperium. Cracovia, Constantia, Gedanum, Budorgis - wszystkie z nich donoszą o starciach na ulicach pomiędzy członkami wyzwoleńczej gwardii pretorian a obrońcami tyranii, cohortes urbanae.\n\nNie lękajcie się! Nasi gwardziści są o wiele lepiej wyposażeni i wyszkoleni, and they shall make really quick work of them. Kohorty miejskie są zdegenerowanym siedliskiem bandytów, których od najgorszego sortu ludzkiego odróżnia jedynie mundur dany im przez opresyjne władze. I tak jak właśnie ta władza, kohorty stały się elementem egzekucji opresji wobec nas - zwykłych obywateli!\n\nŁączymy się w solidarności z dzielnymi gwardzistami i czekamy na ich powrót w chwale!"

CAL_so_many_barbarians: "Tak wielu barbarzyńców..."
CAL_so_many_barbarians_desc: "Ohydne zbrodnie! Bezsensowne morderstwa! Bezwstydne zniszczenie! Wszystko to dzieło dzikich najeźdźców zwanych barbarzyńcami. Spokojne wsie leżą w ruinach, mieszkańcy żyją w ciągłym strachu. To skutek słabości Popularów! Oni pościelili łóżko, a my musimy w nim leżeć! Nie ostrzegli, że jest w ogniu i ma kolce!\n\nPrzeciw grabieżcom zostaną podjęte szybkie działania! Z woli Gwardii wydano listy gończe za najbardziej osławionymi przestępcami. Za każdego barbarzyńcę oddanego sprawiedliwości Cesarstwo sowicie wynagrodzi! Złoto, ziemia i honor czekają na usuwających plagę!\n\nZjednoczeni pod sztandarem Calisii przeciwstawimy się fali barbarzyństwa!"

CAL_so_few_arenas: "...a tak mało aren"
CAL_so_few_arenas_desc: "Obywatele! Zbieramy obfite plony naszej niestrudzonej pracy nad wyplenieniem pól Calisiańskich z barbarzyńskiej narośli. Lochy pękają w szwach, a pierwsza tura biletów na wielkie igrzyska została wyprzedana w pięć minut! Dlatego też wprowadzamy system turowy, dzięki któremu każdy kto jeszcze nie uczestniczył w spektaklach sprawiedliwości, będzie mógł ich doświadczyć.\n\nNajbliższe igrzyska odbędą się w Ostrovii za dwa dni, w Posnanii za cztery, a równo za tydzień mamy widowiska zarówno w Navis i Carbonium, jak i Sedinum i Gedanum dla tych którzy są gotowi udać w dłuższą podróż. Przypominam że liczba miejsc jest mocno ograniczona ze względu na niewystarczającą ilość aren na gargantuiczne ilości ochotników którzy czekają na swe walki gladiatorskie.\n\nZapiszcie się na listę oczekiwania już teraz! Za moment może już nic nie być!"

CAL_fight_for_your_lives: "Walczcie o życie!"
CAL_fight_for_your_lives_desc: "GLADIATORZY! Stajecie przed obliczem imperium by walczyć o swoją przyszłość. Nie liczy się to co się stało przed, nie liczy się to co się stanie po. To co dla was ważne jest tu i teraz! Zapomnijcie o tym kim byliście, porzućcie swe marzenia. Teraz jesteście narzędziem boju, elementem przedstawienia, i to od następnych kilkunastu minut zależy to czy ten piach po którym będziecie stąpać będzie dla was zbawienny, czy będzie chłonął waszą krew.\n\nMożecie myśleć że nie ma już dla was ratunku! Ale Ci których czyny na arenie będą wybitne, będą w stanie doczekać jutra. A nawet i pojutrza. Kwestia jest prosta - walczcie, bądźcie dzielni a wasza historia nie skończy się dzisiaj.\n\n(...czy oni w ogóle zrozumieli co ja do nich mówię?)"

CAL_grace_of_the_mars: "Łaska Marsa"
CAL_grace_of_the_mars_desc: Triumfatorzy! Walczyliście zaciekle, walczyliście dzielnie. Wiele przeciwników padło pod naporem waszego ostrza. Siła którą prezentujecie jest wyjątkowa ze wszystkich którzy uczestniczyli w tych wydarzeniach. Zostaliście wybrani, wy którzy stanowicie najlepszych z najlepszych. Widownia was pokochała, a Imperium was potrzebuje. \n\nDostajecie bowiem szansę. Ofertę nie do odrzucenia. Za wasze czyny dostąpiliście zaszczytu dołączenia do jednostek Foederatii. Krwawa ofiara usatysfakcjonowała Marsa i otworzyła wam bramy do świata w którym wy i wasze rodziny będą miały przyszłość w Imperium Calisiańskim. Jeżeli jednak odrzucicie tę wspaniałomyślną ofertę, wrócicie na arenę.\n\nPrzemyślcie to dobrze. Drugi raz takiej szansy nie dostaniecie.

CAL_a_divine_law_of_imperator: "Boskie prawo Imperatora"
CAL_a_divine_law_of_imperator_desc: "Słuchajcie obwieszczenia! W tych niepewnych czasach, gdy tron jest pusty, a głos Cesarza milczy, na potężną Gwardię spada obowiązek ochrony świętych praw! Czy nie są niezłomnymi obrońcami Imperium, ślubującymi chronić interes Cesarza i ludu?\nCzy nie wyzwolili nas od tyranii? Czy nie są najwyższym porządkiem, który powinniśmy przyjąć?\n\nNiech wszyscy wiedzą, że władza Gwardii pochodzi nie tylko ze śmiertelnego dekretu, lecz z samych niebios! Jako strażnicy boskiego prawa Imperatora ucieleśniają sprawiedliwość, porządek i prawość. Ich osąd jest jasny - nie będziemy długo czekać na kolejnego Cesarza, który nadchodzi z błogosławieństwem ukochanego Prefekta!"

CAL_ridiculous_notions_of_liberty: "Niedorzeczne sny o wolności"
CAL_ridiculous_notions_of_liberty_desc: "W burzliwych czasach musimy odróżnić prawdę od głupoty i cnotę od występku. Strzeżcie się syreniego śpiewu wolności i demokracji, pustych obietnic i ulotnych iluzji prowadzących wyłącznie do chaosu, waśni i tyranii!\n\nNiech błędne idee przeszłości nie zaciemniają osądu ani nie sieją buntu. Niezachwiana czujność Gwardii zapewniła bezpieczeństwo i świętość Imperium. To jest najważniejsze - bezpieczeństwo we własnych domach! Niedorzeczni są ci, którzy podważają pokój i stabilność dzielnie wykute przez pretorian! \n\nStańmy razem, bo póki Gwardia czuwa, przyszłość jest pewna, a dobrobyt bezpieczny!\nNiech żyje Gwardia Pretoriańska! Niech żyje wieczny pokój Calisii!"

CAL_military_administration: "Administracja wojskowa"
CAL_military_administration_desc: "Drodzy obywatele! Dotychczasowa administracja okazała się słaba i nieskuteczna. Z ciężkim sercem, lecz stanowczą wolą pretorianie obejmą więc większą rolę w rządzeniu. Pod ich kierownictwem gordyjski węzeł biurokracji zostanie przecięty i zastąpiony sprawnym systemem służącym ludowi szybko i sprawiedliwie.\n\nTo nie porzucenie władzy cywilnej, lecz konieczny krok ku oczyszczeniu aparatu. Niezłomni strażnicy poprowadzą proces sumiennie i uczciwie, dbając, by każda decyzja służyła Calisii i obywatelom.\n\nRozwiązanie jest tymczasowe. Po przywróceniu porządku i dobrobytu rządy cywilne wrócą na należne miejsce. Do tego czasu ufajcie pretorianom. Ave Calisia!"

CAL_council_of_prefects: "Rada Prefektów"
CAL_council_of_prefects_desc: "Radujcie się, nadchodzi nowy świt! Ogłaszam dekret powołujący Radę Prefektów!\n\nTo dostojne ciało ze znamienitych prefektów mianowanych przez Boskiego Cesarza będzie przewodnią ręką Cesarstwa. Pod kierunkiem starannie wybranych przedstawicieli Rada nadzoruje wszystko - od bezpieczeństwa po dobrobyt gospodarczy. Koniec biurokratycznego zastoju i politycznych walk. Rada będzie decydować szybko i stanowczo w najlepszym interesie Kalizjan.\n\nSenat zachowa honorowe miejsce, lecz odtąd tylko doradcze. Prawdziwa władza należy do Rady działającej pod mądrym przewodnictwem ukochanego Cesarza."

CAL_senate_deliberates_guard_decides: "Senat debatuje, Gwardia decyduje"
CAL_senate_deliberates_guard_decides_desc: "W zeszłym tygodniu czcigodny Praefectus podjął zdecydowane działania w świętych salach Senatu, który stał się siedliskiem waśni i upadku. Dzielni pretorianie weszli do gmachu i wymusili przyjęcie ustaw kluczowych dla bezpieczeństwa i dobrobytu.\n\nNiektórzy kwestionują metody, lecz każde działanie mieściło się w świętych prawach i tradycjach. Jako czujni obrońcy Cesarstwa Gwardia miała pełne prawo wkroczyć do Senatu! W interesie państwa mogła siłą przejąć budynek i uczyniła to, bo senatorowie bardziej dbali o siebie niż o kraj.\n\nSenat pozostanie, ale tylko pod czujnym okiem Gwardii. Władza nadana przez Cesarza zapewnia, że żadne zagrożenie dla stabilności nie zostanie zlekceważone."

CAL_slave_empire: "Cesarstwo niewolników"
CAL_slave_empire_desc: "Zaznaczcie datę w kalendarzu, bo jutro o świcie bramy targu na Forum Tertio Maii otworzą się dla kupców i nabywców z daleka! Będzie to niezrównane widowisko.\n\nPrzyjdźcie zobaczyć kwitnący handel niewolnikami napędzający Cesarstwo. Silni robotnicy, zręczni rzemieślnicy, posłuszni służący i egzotyczni artyści - coś dla każdego wymagającego kupca.\n\nTo nie wszystko! Collegium Handlarzy Niewolników zaprasza na warsztaty właściwej opieki i zarządzania nowym majątkiem. Nauczycie się negocjacji, poznacie najbardziej zyskowne profesje i zapewnicie maksymalny zwrot z ludzkiego mienia.\n\nChwyćcie sakiewki i przyjdźcie na Wielki Targ Niewolników, gdzie śmiali znajdą bogactwo i władzę. Licytacja zaczyna się już jutro!"

CAL_tribunal_of_citizenship: "Trybunał Obywatelstwa"
CAL_tribunal_of_citizenship_desc: "Słuchajcie, obywatele Calisii, uroczystej obwieszczenia o powstaniu nowego Cesarskiego Trybunału Obywatelstwa! Stworzony, by nadawać upragnione kalizjańskie obywatelstwo godnym osobom. Lecz droga nie jest dla ludzi o słabym sercu ani dla pospólstwa.\n\nPrzygotujcie się na podróż bardziej krętą niż labirynt Minosa! Droga do obywatelstwa pełna jest prób tak trudnych, że prędzej znajdziecie barbarzyńcę w piwnicy! Kandydaci muszą dowieść dozgonnej lojalności, oddania i wzorowej służby - zadanie trudne jak wyciskanie wody z kamienia. Nie zapominajmy o wkładzie finansowym, potężnym jak sama Calisia!\n\nOdważnym marzycielom radzę: porzućcie wszelką nadzieję, wy, którzy tu wchodzicie, bo w biurokratycznym bagnie Trybunału wasze wnioski będą tkwić w czyśćcu przez dekady. Ave Calisia i powodzenia!"

CAL_gargrantuan_praetorian_paychecks: "Gargantuiczne pensje Pretorian"
CAL_gargrantuan_praetorian_paychecks_desc: "Szanowni obywatele! Ostatnimi czasy reakcyjne siły podnoszą głowę by dyskredytować naszych wyzwolicieli, jakoby marnowali oni pieniądze zagarniając je dla siebie. Jedyne co można odpowiedzieć na takie oszczerstwa i kałumnie - wstyd dla tych co to szerzą. Uderzanie w gwardzistów pretoriańskich jest uderzaniem w Imperium, i wiecie o tym doskonale! \n\nTak, rzeczywiście pretoriańska gwardia otrzymali nagrody za ciężką, uczciwą pracę i te pieniądze im się po prostu należały! To były nagrody oficjalne, które zostały przyznane w ramach budżetu uchwalonego w Senacie, a nie łapówki od kolegów popularów. Ci obrońcy naszego Imperium ciężko pracowali i pracują nadal na to żeby wszyscy obywatel mogli cieszyć się z rozwoju Calisii, a nie tylko wybrane grupy społeczne.\n\nStoimy przy Prefekcie! Cinastovicusie, Calisię zbaw!"

CAL_our_little_augustus: "Nasz mały Augustus"
CAL_our_little_augustus_desc: "Zbierzcie się, obywatele, bo na Polach Marsowych czeka was królewskie widowisko! Cesarstwo koronuje nowego władcę: Cesarza Martinusa Augustusa Calisiusa Naimanusa, Pierwszego Tego Imienia, Augusta Cesarstwa Kalizjańskiego, Obrońcę Cesarskiego Dominium, Strażnika Wiecznego Płomienia Marsa, Wyzwoliciela, Najwyższego Legata i Arbitra Cesarskiego Prawa.\n\nCzekając na wstąpienie człowieka o tylu tytułach i przymiotnikach, że brak mi słów, zastanawiamy się nad głębią przyszłych przemówień. Obdarzy nas perłami mądrości czy skąpie w wymownej ciszy majestatu? Czas pokaże.\n\nAve Imperator, niech jego rządy będą długie i pokojowe!"

CAL_empire_in_shackles: "Cesarstwo w kajdanach"
CAL_empire_in_shackles_desc: "Uwaga... UWAGA, OBYWATELE!\nMiałem przemówić o dobrobycie i przyszłości nowego Cesarstwa. Uznałem jednak... że tekst wymaga zmian. Oto one.\n\nPrzygotujcie się na widowisko tyranii i ucisku dzięki znamienitemu Cesarzowi Martinusowi Naimanusowi i jego pretoriańskim panom! Patrzcie, jak wilki przebierają się za wybawców, szczerząc kły i ostrząc pazury, gotowe pożreć ducha wolności oraz wolę ludu!\n\nSpójrzcie na dumne niegdyś sale rządów, dziś zatrute smrodem korupcji i szeptami zdrady! Patrzcie, jak sprzeciw tonie w kakofonii ucisku, a krzyk prześladowanych trafia w głuche uszy!\n\nNiech tyrani drżą, bo duch wolności nigdy nie zgaśnie! Niech ży-\n\n // PROSZĘ SIĘ ROZEJŚĆ, MIASTO PODLEGA STANOWI WOJENNEMU. NIEWYKONUJĄCY ROZKAZÓW WŁADZ ZOSTANĄ DORAŹNIE STRACENI. PROSZĘ SIĘ ROZEJŚĆ. //"

CAL_concordia: "Concordia"
CAL_concordia_desc: "Optymaci i pretorianie zawarli sojusz polityczny! Aby ocalić Republikę przed zniszczeniem, te patriotyczne frakcje zdecydowały się współpracować. Dzięki zbrojnej potędze Gwardii, Optymaci przywrócili porządek w pogrążonych w chaosie urzędach; od dziś codzienne sprawy wracają na właściwy tor!\n\nGwardia zapewni wam bezpieczeństwo; nic was nie skrzywdzi tam, dokąd sięga ochronna tarcza pretorian! To czas dzielnych bohaterów, którzy właśnie piszą kolejny rozdział historii Calisii!\n\nNiech żyją Optymaci! Niech żyją pretoriańscy wybawcy!"

CAL_in_the_steps_of_cincinnatus: "Śladami Cyncynata"
CAL_in_the_steps_of_cincinnatus_desc: "Wielkie wieści! Tak jak Cyncynat, niezrównany wzór przodków, tak i nasi władcy zdecydowali, że władza powinna wrócić do ludu, do was wszystkich! Tym właśnie winna być republika: wspólną sprawą każdego obywatela i powszechną wartością wszystkich nazywających to miasto domem!\n\nPrawdziwie szlachetnych odróżnia to, że otrzymawszy szansę absolutnej władzy, odrzucają ją dla dobra ludu!\n\nPrecz z tyranami! Precz z Dominatem! Władza od ludu i dla ludu!\n\nNiech żyją Optymaci! Niech żyją pretoriańscy wybawcy! Niech żyje RES PUBLICA!"

CAL_preatorian_hegemony_in_army: "Pretoriańska hegemonia w armii"
CAL_preatorian_hegemony_in_army_desc: "Straszliwe wieści! Ukochany generał Marcus Vinicius zginął w pożarze wywołanym przez barbarzyńców. Jego ciało znaleziono dziś podczas odgruzowywania koszar w Dzielnicy Senatorskiej. To niepowetowana strata, zwłaszcza dla armii pozbawionej największego dowódcy naszych ziem.\n\nWobec tego Prefekt Cinastovicus postanowił wesprzeć naczelne dowództwo, wysyłając pretoriańskich oficerów do tymczasowego uzupełnienia ciężko dotkniętych kadr. To szlachetny czyn ponownie dowodzący jedności ponad podziałami, nie dla frakcji, lecz wspólnoty!\n\nWszyscy jesteśmy Kalizjanami!"

CAL_favours_for_the_optimates: "Przysługi dla Optymatów"
CAL_favours_for_the_optimates_desc: "Wolny ludu Calisii! Żelazny uścisk tyranii już nie dławi; złączcie głosy z naszymi - PRECZ Z TYRANIĄ, DESPOTAMI I DOMINATEM! Sojusz wyzwolicieli Optymatów i Pretorian zwiastuje odrodzenie wolności oraz demontaż reliktów dawnych rządów.\n\nCzy wyobrażacie sobie skarby ukryte w hedonistycznej norze zwanej Pałacem Cesarza? Egzotyczne rośliny jak ze snu... gdy sami nie mogliście posadzić tulipana! Prywatna winnica mogąca upić człowieka tysiąc razy! Złote ozdoby warte więcej niż dorobek pokoleń rodzin! Niezliczone bogactwa zrabowane z każdego krańca państwa... wszystko wróci do ludu dekretem przywódców! Wszyscy skorzystamy z demontażu tyranii!"

CAL_concillium_plebis: "Concillium Plebis"
CAL_concillium_plebis_desc: "Przełomowe wieści! Słuchajcie, obywatele wszystkich stanów! Senat zawsze należał do najbogatszych, przez co nie rozumiał potrzeb was - soli ziemi, plebejuszy, którzy na barkach wznieśli potęgę Cesarstwa!\n\nNa rozkaz rządu tymczasowego ogłaszam nową izbę parlamentu! Concilium Plebis otrzyma wszystkie uprawnienia Senatu, który od następnych wyborów będzie ograniczony liczebnie i wykonawczo! Kandydować może każdy pełny obywatel po 21. roku życia nieskazany przez trybunał.\n\nWładza wróci w ręce ludu!"

CAL_barbarians_in_our_midst: "Barbarzyńcy pośród nas"
CAL_barbarians_in_our_midst_desc: "Ogłoszenie dla wolnych obywateli! Zdradziecka polityka Popularów pozwoliła hordom gwałcicieli i przestępców rozprzestrzenić się po kraju niczym najgorsza zaraza! Brak norm i procedur na granicy uruchomił lawinę, którą obecna władza słusznie postanowiła radykalnie usunąć!\n\nKażdy ukrywający barbarzyńców zostanie przykładnie stracony za działanie przeciw Cesarstwu! Za wskazanie miejsca pobytu najeźdźcy przewidziano 100 denarów, a za osobiste dostarczenie władzom - 300. Niełatwo iść na limes i nałapać zwinnych, silnych barbarzyńców w sieć. Lecz musimy oczyścić kraj z tej plagi!"

CAL_forceful_disarmament_of_invaders: "Przymusowe rozbrojenie najeźdźców"
CAL_forceful_disarmament_of_invaders_desc: "Dumni i wolni obywatele! Bezpieczeństwo ma pierwszeństwo, a Senat uroczyście je zapewni! Rezolucją przyjętą dziś rano ogłasza się:\n\nWszyscy uznani za barbarzyńców mają złożyć broń i oddać się władzom. Plemiona pozostające na granicach zostaną rozbrojone... polubownie albo siłą.\n\nŻaden barbarzyńca ani osoba takiego pochodzenia nie znajdzie miejsca w siłach zbrojnych. Koniec z uśpionymi agentami! Koniec z wrogiem rozdzierającym naród od środka!"

CAL_exile_the_most_dangerous: "Wygnać najniebezpieczniejszych"
CAL_exile_the_most_dangerous_desc: "Barbarzyńcy... Wiecie, skąd ta nazwa? Barbarus w języku przodków oznacza dzikusa, obcego. Przybysze ucieleśniają to słowo. Są prości, zaciekli i zdziczali, pozbawieni wdzięku cywilizowanej duszy, niezdolni żyć w społeczeństwie nieopartym na przemocy i sile.\n\nKalizjanin w sporze idzie na agorę i używa argumentów, by przekonać przeciwnika. Dzikus unika rozmowy i wybiera argument siły. Zamiast mówić, rozłupie czaszkę toporem. Takich ludzi należy natychmiast poddać ostracyzmowi i usunąć ze społeczeństwa, nim wydarzy się tragedia!\n\nDołączcie dziś do miejscowego Komitetu Poszukiwania Barbarzyńców!"

CAL_problem_for_decades: "Problem na dekady"
CAL_problem_for_decades_desc: "Kości zostały rzucone! Skład etniczny kraju zmienił się na zawsze. Możemy i musimy z tym walczyć, lecz nie zwyciężymy jednej nocy. To żmudne i trudne zadanie. Tylko systematyczne, konsekwentne działanie w ramach kalizjańskiego prawa zagwarantuje bezpieczną przyszłość.\n\nDrodzy współobywatele! Nadejdzie dzień, gdy nie będziecie oglądać się za siebie ani bać podróży do rodziny z powodu dzikiego barbarzyńcy. Ufamy, że wolni obywatele sumiennie wypełnią obowiązki. Każdy barbarzyńca lub populista podnoszący rękę na władzę niech wie, że Calisia mu tę rękę odrąbie dla obrony kraju, Ojczyzny i Wiecznego Miasta."

CAL_abolishment_of_populares_laws: "Zniesienie praw Popularów"
CAL_abolishment_of_populares_laws_desc: "Dumni i wolni obywatele! Natychmiast powstaje Wysoki Trybunał Transformacji, mający płynnie przeprowadzić nas od despotycznych rządów Popularów, agentów zdrady, do państwa, w którym panują nasi obywatele bez barbarzyńskiej ingerencji!\n\nPrzywileje barbarzyńców zostają anulowane! Unieważnimy prawa o germańskich chorążych, redystrybucję ziemi i ustawy równościowe. Nie będzie barbarzyńca pluł nam w twarz, ni dzieci nam Germanił. Autorzy zdradzieckich praw odpowiedzą przed sprawiedliwością ludu! Dość działania Popularów przeciw obywatelom!"

CAL_constitution_for_the_people: "Konstytucja dla ludu"
CAL_constitution_for_the_people_desc: "Dumni i wolni obywatele! Precz z chaosem prawnym! Tylko Liberatores zapewnią godne warunki i prawo do wolności! Te wartości będą podstawą nowej konstytucji tworzonej pod czujnym okiem Zgromadzenia Konstytucyjnego złożonego z najlepszych ekspertów. Dokument zagwarantuje stabilność zamiast chaosu sprowadzonego przez barbarzyńską koalicję.\n\nRepublika Kalizjańska stanie się świetlanym przykładem ładu prawnego; cywilizacje świata będą zazdrościć jasności i precyzji praw. Zasady będą mocne i proste! A dla łamiących je... żadnej litości."

CAL_populist_not_popular: "Dla ludu, a nie ludowy"
CAL_populist_not_popular_desc: "Dumni i wolni obywatele! \nJesteśmy istotą Calisii! W sercach tylko Calisia; bez Judejczyków, Związku Germańskiego, Amoris Liberi, decymacji nienarodzonego potomstwa i progresywnych podatków! Taka jest wola ludu!\nPod rządami Liberatores żadna z tych degeneracji się nie wydarzy! Patrioci są u władzy i nie poddadzą się zdrajcom, agentom Hadesu ani germańskim kolonizatorom.\n\nCalisia dla Kalizjan! Proste hasło, a jak wielki niesie ciężar! To motyw hymnu odbudowy godności Cesarstwa! Harmonijna symfonia otulająca obywateli duchowym uniesieniem i dumą! To bezpieczeństwo; rodziny niosące na barkach społeczeństwo; wszystko, co możemy nazwać... naszym, kalizjańskim."

CAL_first_elections: "Pierwsze \"równe\" wybory"
CAL_first_elections_desc: "Dumni i wolni obywatele! Dawne wybory senackie były farsą! Teraz poznacie prawdziwe oblicze wolności poparte potęgą Rysia i Gwardzisty! Monopol Popularów został złamany, pluralizm wrócił do polityki. Liczne frakcje czekały na upadek lewicowo-barbarzyńskiej koalicji, by powstać jako wolni ludzie nieskrępowani tyranią rządzących mas!\n\nWolne, równe i uczciwe wybory - tego lud oczekuje i to otrzyma! Ruszajmy masowo do urn, bo barbarzyńcy nie stanowią już śmiertelnego zagrożenia! Odrodzenie demokracji jest w naszych rękach, a przyszłość ma na imię Calisia!"

CAL_overshadowing_senate: "Przyćmienie roli Senatu"
CAL_overshadowing_senate_desc: "Być może zapytacie o rolę Senatu w nowej demokracji. Pomyślcie o nim jak o mądrych starszych podmiejskiej wioski. Są od zawsze, pilnują spraw i dbają o płynność działania. Nadal mają ważne zadanie.\n\nCo się zmienia? Zgromadzenie Ludowe będzie więcej mówić i współdecydować z Senatem. Zaproponuje nowe prawa i pomoże dopilnować właściwych wydatków. To jak dodanie kolejnej warstwy mięsa do lazanii - od razu lepiej!\n\nSenat pozostaje kluczowy, lecz wznieśmy okrzyk dla dzielnych członków Zgromadzenia, którzy stają do zadania! Razem wzmocnią kraj! Ave Res Publica!"

CAL_reintroduction_of_socmarket: "Powrót społecznej gospodarki rynkowej"
CAL_reintroduction_of_socmarket_desc: "Dumni, wolni i wkrótce bogaci obywatele! Niesprawiedliwości gospodarcze głęboko martwią władców. Eksperymenty uczyniły z nas króliki doświadczalne dla egzotycznych rozwiązań zupełnie niepasujących do społeczeństwa.\n\nMusimy wrócić do ostatniej działającej gospodarki, w której obywatele żyją dostatnio, bogaci nie żerują na biednych, a hedonistyczne elity odpowiadają za czyny. Musimy wrócić do...\n\nSPOŁECZNEJ GOSPODARKI RYNKOWEJ."

CAL_citizens_of_res_publica: "Obywatele Res Publici"
CAL_citizens_of_res_publica_desc: "Szlachetni rodacy! Kwestia obywatelstwa od lat rzuca cień na Cesarstwo. Pod Popularów stało się ono równie błahe jak worek ziemniaków kupiony na targu za dwa denary! Dostawali je barbarzyńcy i niegodni, niemający nic wspólnego z kalizjańską tożsamością ani chęci integracji!\n\nDość! Od przyszłego tygodnia wraz z nowymi dokumentami tożsamości ponownie zbadamy rodowody i prawo do obywatelstwa. Każdy dowodzący wenedzkiego pochodzenia automatycznie dołączy do szlachetnych obywateli Calisii.\n\nWszyscy Kalizjanie to jedna rodziną! Zastrzega się odmowę w razie dowodu barbarzyńskich korzeni lub powiązań z obcymi agenturami."

CAL_fate_of_the_throne: "Los Cesarskiego Tronu"
CAL_fate_of_the_throne_desc: "Dumni i wolni obywatele! Usunięcie ludzi z władzy to tylko część powrotu do normalności. Kolejny krok to demontaż aparatu ucisku, lecz równie ważne jest zniszczenie symboli, na których skupiają się pamięć i świadomość. Gdy znikną, tyrania odejdzie w zapomnienie i zbudujemy nowy, wspaniały świat.\n\nW Dies Solis w południe na Forum Calisianum odbędzie się aukcja majątku cesarskiego dla wolnych obywateli. Pod młotek pójdą korona, regalia i przede wszystkim tron. Może wkrótce stanie się wyposażeniem kuchni albo krzesłem na ubrania. Co z nim będzie? Dowiecie się niebawem."

CAL_proclaim_the_republic: "Proklamacja Republiki Kalizjańskiej"
CAL_proclaim_the_republic_desc: "Wielka! Odrodzona! Najjaśniejsza! Republika Calisii wraca w pełni chwały! Res Publica przestaje być hasłem zwolenników tyranii usprawiedliwiającym niegodne czyny i udawanie demokratycznych standardów! Nigdy ich nie było i dopiero święta wola Optymatów oraz Pretorian przywraca je z najgłębszej otchłani Hadesu!\n\nRadujcie się, Kalizjanie! Nadchodzą czasy dobrobytu i wolności! Wiatr zmian wieje właściwie! Monarchię pogrzebano na cmentarzu historii! Święte zasady Res Publici przywrócą wielkość społeczeństwu i ożywią państwo. Tylko ta ewolucja przybliży nas do snu o kalizjańskiej supremacji!"

CAL_winds_of_change: "Wichry dobrej zmiany"
CAL_winds_of_change_desc: "Dumni! Bogaci! Wolni! Wielcy! Sprawiedliwi! Po prostu - obywatele Calisii. Stoję przed wami nie jako praeco, lecz brat i mieszkaniec najwspanialszego kraju świata. Nawet bogowie zazdroszczą dobrobytu! W smutnej dolinie łez stworzyliśmy prawdziwe Elizjum! Wspólnym trudem przekształciliśmy dysfunkcyjną tyranię w promienną republikę!\nLecz słuchajcie! To nie koniec! To nawet nie początek końca! To dopiero koniec początku! Nowa złota era Calisii zaczyna się teraz! Rejs po nieznanych wodach Dobrej Zmiany będzie pełen wyzwań, lecz widzę w was ogień odpędzający strach! Z takim ludem można podbić sam Hades! Największą wartością kraju są zwykli ludzie tak wspaniali, że można ich pomylić z półbogami!\nUnieście głowy! Wraz z rządem maszerujemy ku słońcu, by zapewnić Calisii wieczną dominację!"

### EPILOG - CALISIUS ###

CAL_labor_omnia_vincit: "Labor Omnia Vincit"
CAL_labor_omnia_vincit_desc: "Kalizjanie wszystkich wyznań! Niestrudzeni prolet... eee... plebejusze! Pracowici patrycjusze! Optymaci marnowali dni, próbując was podzielić! Szerzyli elitaryzm, dzielili klasy i twierdzili, że pracujący dniem i nocą dla Cesarstwa mają marznąć i głodować, gdy garstka bogaczy wydaje zrabowane zyski na orgie i libacje! Dzięki olbrzymim wysiłkom Ricardusa Calisiusa epoka oligarchicznego ucisku wreszcie dobiegła końca! Radujcie się, robotnicy, bo kajdany pękły! Niewdzięczny syn właściciela niewolników, który nie przepracował dnia, nie będzie już śmiał się wam w twarz, zabierając owoce pracy. Cesarz i wszyscy następcy pozostaną niezachwianie oddani równości, sprawiedliwości i dobrobytowi wszystkich od dziś ad infinitum!"

CAL_edict_of_friendship: "Edykt przyjaźni"
CAL_edict_of_friendship_desc: "Przedstawiciele wszystkich plemion Cesarstwa są proszeni o przybycie do Pałacu dziesiątego dnia przyszłego miesiąca w celu ratyfikacji traktatu wiecznej przyjaźni i wzajemnej pomocy! Sygnatariusze otrzymają hojny przydział ziemi, a w regionach licznej obecności Barbarii powstaną równoległe kodeksy szanujące miejscowe zwyczaje. Mający nierozwiązane spory z Calisią lub jej urzędnikami mogą przedstawić skargi bezpośrednio Imperatorowi. \n\nTęskniący za ojczyzną, których pierwsza fala migracji wepchnęła w granice, otrzymają bezpieczną drogę powrotu. Ponieważ Germania jest dziś niebezpieczna, plemiona pragnące ją zamieszkać mają trzy miesiące na deklarację. Potem wyruszą, wyposażone w najlepsze legiony i szkolenie obywatelskie, by stworzyć własne stabilne państwo. Niech ich rządy przyniosą nowy dobrobyt."

CAL_primus_inter_pares: "Primus Inter Pares"
CAL_primus_inter_pares_desc: "Szanowni obywatele Urbs Calisiensis! Choć prawe czyny ukochanego Cesarza mogą sugerować inaczej, żadna niekontrolowana władza nie oprze się pokusie tyranii! Dziś uniknęliśmy tej drogi: Imperator Ricardus Calisius podpisał jeden z najważniejszych aktów, dobrowolnie przekazując większość uprawnień demokratycznemu Senatowi. Monarchia będzie odtąd czysto reprezentacyjna, zachowując jednak prawo weta wobec ustaw podważających integralność instytucji cesarskich lub zasady sprawiedliwości i praworządności! Wzmocnienie Res Publici nakłada na każdego Kalizjanina większą odpowiedzialność za pełne korzystanie z wolności demokratycznych! Ave Calisius! Ave Populi!"

CAL_trials_optimates: "Procesy Optymatów"
CAL_trials_optimates_desc: "Wszyscy są zaproszeni na proces stulecia, ostateczne rozliczenie nikczemnych, zaplutych karłów reakcji, którzy spiskowali przeciw sprawiedliwości, podważali praworządność i chcieli zabić Cesarza oraz towarzyszy Popularów, oraz zniewolić każdego Kalizjanina bez brudnej oligarchicznej krwi! Przyjdźcie tłumnie, plebejusze i Barbarii! Okażcie pogardę dla tych nędznych stworzeń i uwolnijcie gniew tłumiony przez lata krzywd! Wielkoduszny Ricardus Calisius obiecał łagodne kary, lecz pozwolił strażnikom patrzeć w drugą stronę. On może wybaczyć, ale lud ma prawo wymierzyć dowolnie surową sprawiedliwość. Dla potrzeb propagandy państwowej dopilnujcie, by przeżył co najmniej jeden skazaniec."

CAL_renewed_factionalism: "Odnowione walki frakcyjne"
CAL_renewed_factionalism_desc: "Uważni obserwatorzy demokracji! Senatorowie Frontu Wyzwolenia Barbares wydali wspólny komunikat potępiający występki i korupcję we Froncie Wyzwolenia Barbares. Choć obie grupy obiecały nie współpracować przy przyszłych ustawach, według konsula Compy potwierdziły niezachwiane oddanie Popularów i sprawie postępu społecznego. Doniesienia o rozłamie we frakcji rządzącej to kolejna desperacka agitacja oślizgłych Optymatów. Hańba im za próby podważenia jedności koalicji!"

CAL_easing_the_lus_criminale: "Złagodzenie Ius Criminale"
CAL_easing_the_lus_criminale_desc: "Łaskawy Cesarz Ricardus Calisius trwa w obronie praw człowieka wszystkich poddanych! Serce krwawi mu na widok kpiny ze sprawiedliwości Optymatów, którzy trzymają się brutalnych egzekucji bez uczciwego procesu. Calisia jest Cesarstwem prawa i porządku, czas więc odejść od dawnych metod i uznać winy. Kara śmierci i niesprawiedliwe kary zostają zakazane, a wyroki oczekujących na egzekucję zamienione na dożywocie. Rodziny straconych otrzymają comiesięczne świadczenie. Nie zmienimy przeszłości, lecz może odnajdą odrobinę pokoju."

CAL_popular_tribunals: "Trybunały ludowe"
CAL_popular_tribunals_desc: "Obywatele! Za sprawiedliwym przewodnictwem Popularów Cesarz uznał, że nie wystarczy złagodzić najsurowsze kary. Reforma wymaga rozmontowania skorumpowanego systemu skazującego niewinnych i służącego najhojniejszemu łapówkarzowi! Gdy arystokratyczna dłoń zaciska się na praworządnym Kalizjaninie, tylko połączona siła ludu ochroni zwykłych ludzi. Sądowa tyrania elit dobiega końca! Odtąd sprawy interesu publicznego rozstrzyga niezależny trybunał ludowy. Zgłaszajcie dostępność i chęć służby w sądzie jako ostateczni strażnicy prawa!"

CAL_were_all_calisians: "Wszyscy jesteśmy Kalizjanami"
CAL_were_all_calisians_desc: "Barbarii! Niewolnicy! Wyzwoleńcy! Koniec z traktowaniem was przez zarozumiałych szowinistów jako niższej klasy! Instytucje nie odmówią wam praw! Od dziś wszyscy jesteście obywatelami Calisii ze wszystkimi przywilejami. Nie urodziliście się tu, lecz jako przybrane dzieci otrzymacie pełny szacunek. Imperator Ricardus Calisius w nieskończonej łaskawości legitymizuje wasze rody, przyjmując wszystkich pod skrzydła jako bezpośrednich potomków linii cesarskiej. \n\nOdrzućcie imiona ucisku! Odtąd możecie dumnie nosić miano \"Calisius\"! Uczyńcie je swoim i wznieście się na nieosiągalne dotąd wyżyny!"

CAL_eternal_nemesis: "Wieczna Nemezis"
CAL_eternal_nemesis_desc: "Cesarz pozostaje w stanie krytycznym i odosobnił się w Pałacu! Odwołano spotkania i wydarzenia, a obowiązki tymczasowo przejął następca tronu Princeps Ignatius, który zastąpi ojca. W pełni wierzymy w jego zdolności. \n\nPoddani wszystkich religii mają modlić się o zdrowie zgodnie z własnym rytem. Spędzający dzień w świątyni otrzymają wolne od pracy. Suma błogosławieństw i żelazna wola pozwolą mu wyzdrowieć jak zawsze i jak jeszcze sto kolejne razy!"

CAL_requiescat_in_pace: "Requiescat in Pace"
CAL_requiescat_in_pace_desc: "Ludu Calisii! Cesarstwo opłakuje nieposkromionego założyciela, bezinteresownego tytana, który wyniósł nas na niezwykłe wyżyny, oddając ciało i ducha dla triumfu aż po ostatnie dni. Ronimy łzę i ślubujemy czcić pamięć, tak długo jak oddychamy. \n\nOgłoszono tydzień żałoby, po którym ostatnia procesja odprowadzi Cesarza na miejsce spoczynku. Wielki osobisty majątek zostanie zgodnie z testamentem przekazany wybranym organizacjom dobroczynnym, a pragnący oddać hołd lub pocieszyć rodzinę mogą uczynić to w ciszy mauzoleum. Po raz ostatni uczcijmy Cesarza: Ave Calisius!"

CAL_empire_of_the_people: "Cesarstwo ludu"
CAL_empire_of_the_people_desc: "Kalizjanie! Ileż razy stałem na tej mównicy i podawałem oficjalną wersję wydarzeń, ozdobioną propagandą sławiącą osiągnięcia bez względu na rzeczywistość. Dziś zamiast wiadomości proszę, byście rozejrzeli się i ujrzeli dobrobyt przyniesiony przez Popularów i mądrego Cesarza z ich szeregów. Przypomnijcie sobie mroczne dekady, gdy metropolia była głodującym prowincjonalnym miastem, a ruiny szpeciły ulice. Żyjemy w oświeconej złotej erze, której owoce dzielimy wszyscy pomiędzy siebie. Plebejusze i patrycjusze żyją obok siebie bez granic majątku i klasy. Pierwszy raz mówię z serca bez jednego denara zapłaty. Mimo to przychodzą mi na myśl dwa słowa, bracia i siostry: Ave Calisia!"

CAL_ave_imperator_ignatius: "Ave Imperator Ignatius!"
CAL_ave_imperator_ignatius_desc: "Imperator Calisianum, Defensor Populi, Rex Milleniae Gentes, Primus Inter Pares, Pierwszy Tego Imienia Ignatius Calisius zaprasza wszystkich obywateli i mieszkańców Res Publica na koronację jako jedynego Cesarza Calisii, drugiego z linii ricardiańskiej, na Polach Marsowych w obecności delegacji pracowitych Popularów, dzielnych Legiones i lojalnych Barbarii! Mądry ponad swój wiek Ignatius obiecał kontynuować politykę zmarłego ojca - niech spoczywa w pokoju - i chronić bezbronnych przed tyranią! \n\nRobotnicy Wiecznego Miasta otrzymają wolne, by oddać hołd monarsze. Obecność i dary dobrej woli bez względu na wartość są usilnie zalecane."

CAL_homo_homini_lupus_est: "Homo Homini Lupus Est"
CAL_homo_homini_lupus_est_desc: "Podstępna dezinformacja wymierzona we frakcję rządzącą! Eksperci opozycji opublikowali tekst potępiający reakcję Optymatów na kryzys. Twierdzą, że sprzątanie szkód po Popularach i Barbari było zamachem na władzę wykorzystującym tragedię dla osobistych korzyści! \n\nWedług danych usunięcie wszystkich barbarzyńców i Popularów sparaliżowało Cesarstwo, pozostawiając setki wakatów, których frakcja nie potrafi obsadzić nawet niekompetentnymi lojalistami. Mimo legionów na ulicach przestępczość wzrosła, a gospodarka nie odżyła; mali przedsiębiorcy ograniczają działalność, a giełda szoruje po dnie. \n\nTekst jest politycznie obciążony i nie dostarcza *prawdziwych* danych. Politycy Optymatów obawiają się przyjaźni inteligencji z opozycją i wzrostu \"źle usposobionej, cynicznej\" klasy. \nEkonomiści zapewniają, że społeczeństwo potrzebuje czasu, a wkrótce wejdzie w epokę odrodzenia i dobrobytu! \nChwała Calisii i Cesarstwu!"

CAL_purple_terror: "Purpurowy terror"
CAL_purple_terror_desc: "Publikacja opozycji wywołała debatę w barbarzyńskich mediach - społeczność międzynarodowa *stoi przy Optymatach* i uznaje, że Kalizjanie pozostają im przytłaczająco lojalni! \n\nNiezależni obserwatorzy zapytali ludność o rządy Senatu sprzyjającego Optymatom. Ku zaskoczeniu barbarzyńskich instytucji praw człowieka i demokracji oraz opozycji wyniki pokazały wysokie zadowolenie z opanowania Barbari i Popularów oraz odbudowy kraju. \n\nOrganizacje bliższe opozycji mówią, że \"wśród Kalizjan panuje autorytarne myślenie\", lecz prawdziwi obywatele odrzucają to, wiedząc, że nigdy dobrowolnie nie oddaliby wolności. \nNiech kalizjański Tur rośnie i leczy rany zadane przez Popularów oraz ich barbarzyńskich pomagierów..."

CAL_royal_hostage: "Cesarski zakładnik"
CAL_royal_hostage_desc: "Wieści z Senatu! Optymaci ugięli kolano przed wolą Cesarza i wycofali propozycję wprowadzenia dla oddziałów straży miejskiej broni automatycznej. Ricardus Calisius uznał ją za \"zbędny pokaz siły\" i \"dowód szkodliwej paranoi w szeregach Optymatów\", przekonując dość członków frakcji, by projekt upadł. \n\nCesarz zapowiedział też zmniejszenie liczby wojsk w Dzielnicy Cesarskiej: \"Są tu, by utrzymywać Pałac jak zakładnika, nie go chronić\". \nPolitycy Optymatów nazwali to \"oznaką pogorszenia stanu umysłu Cesarza\" i \"politycznym samobójstwem\". \n\nPretorianie strzegący Pałacu potwierdzili słowa senatorów, uznając, że wspaniałość i inteligencja Cesarza mogą nie być dziś w najlepszym stanie..."

CAL_persecution_of_the_opposition: "Prześladowanie opozycji"
CAL_persecution_of_the_opposition_desc: "Politycy opozycji zebrali się w Calisii, protestując przeciw uwięzieniu sojusznika. Lucius Matthius Octobrianus został skazany na 27 dni za wysłanie służących do zdewastowania sąsiedniej posiadłości działacza Optymatów. \n\nMimo skandalu opozycja uczyniła go męczennikiem, twierdząc, że Optymaci używają wpływy do uciszania krytyków. Optymaci słusznie odpowiedzieli w Senacie nagraniami z kamer najbliższych współpracowników podczas czynu i stwierdzili, że \"politycy popełniający tak ohydne czyny nie powinni zbliżać się do aparatu państwa\", a \"takie zachowanie osoby wysoko postawionej daje straszny przykład dzieciom\"."

CAL_imperial_faction: "Frakcja Imperialna"
CAL_imperial_faction_desc: "Senatorowie Optymatów porzucili dawną nazwę i symbole! Odtąd będą znani jako \"Imperialni\", a ich delegacja jako \"Frakcja Imperialna\"! \n\nOświadczyli, że Cesarz zakopał topór wojenny i przydziewa nowe szaty, by odzwierciedlić wspólny grunt i wysiłki ochrony Cesarstwa. \n\nCzęść opozycji obawia się znacznie bardziej nikczemnej genezy i celu. Sam Cesarz jak dotąd odmawia informacji o relacjach z frakcją rządzącą."

CAL_dura_lex_sed_lex: "Dura Lex Sed Lex"
CAL_dura_lex_sed_lex_desc: "Wieści dla obywateli! Senat pozwolił Cohortes Urbanae prowadzić na miejscu procesy sprawców złapanych na gorącym uczynku, przyspieszając kary. Opozycja początkowo protestowała, lecz po rozmowach z przedstawicielami Cesarza niepokoje ucichły, dając Frakcji Imperialnej kolejne zwycięstwo jako obrońcom i prawodawcom narodu. \n\nCzęść polityków z pogranicza chce pójść dalej i przyznać uprawnienia sądowe wszystkim wojskowym, przynajmniej przy ziemiach barbarzyńców."

CAL_high_magistrate_of_justice: "Wysoki Magistrat Sprawiedliwości"
CAL_high_magistrate_of_justice_desc: "Senat przyjął opozycyjny projekt urzędu Wysokiego Magistratu Sprawiedliwości! Odtąd władza senatorów będzie kontrolowana, a najważniejsze sprawy polityczne badane pod kątem nadużyć najbardziej wpływowych ludzi. \n\nZapytani o nagły sukces opozycjoniści są \"ostrożnie optymistyczni\" co do funkcji Magistratu. Tak bardzo nienawidzą rywali, że choć projekt jest ich własny, zainteresowanie Imperialnych jego utworzeniem już zgasiło entuzjazm..."

CAL_were_not_same: "Nie jesteśmy tacy sami"
CAL_were_not_same_desc: "Rządy prowincji Scythia i Gallicia przyjęły prawo pozwalające właścicielom ograniczać wstęp osobom z określonych warstw społecznych! \nSympatycy Popularów odpowiedzieli niepokojami, nazywając to \"cesarską próbą zniewolenia całej Calisii\". \n\nKierownictwo Frakcji Imperialnej odpiera zarzuty, wyjaśniając, że prawo przyjęli autonomicznie gubernatorzy i nie ma planów wdrażania go w całym państwie. Podziały społeczne są jednak *konieczne* dla spójności, a Frakcja będzie chronić ich rolę przed zakłóceniami opozycji."

CAL_obstacle_in_palace: "Przeszkoda w Pałacu"
CAL_obstacle_in_palace_desc: "Ostatnie publiczne wystąpienia wywołały gorącą debatę medialną o zdrowiu Cesarza! Temat z anonimowych forów spopularyzowały telewizyjne panele, a dyskusja staje się z każdym dniem bardziej zażarta. \n\nCesarz zaprzecza, jakoby ulegał klątwie starości, lecz pomniejsi politycy i analitycy sądzą, że niewiele życia mu pozostało, a Senat powinien przygotować się na nagłe trzęsienie ziemii całego systemu..."

CAL_forced_abdication: "Przymusowa abdykacja"
CAL_forced_abdication_desc: "Wieści z Pałacu! Za radą lekarzy i doradców starożytny, czcigodny i troskliwy Ricardus Augustus Calisius zgodził się ustąpić! \n\nWedług służby burza medialna pogorszyła zdrowie psychiczne, a potem fizyczne, skłaniając lekarzy do prośby, by Senat i Gwardia zmusili słabnącego Cesarza do godnego odejścia, póki jest do tego zdolny. \n\nW ciągu kilku godzin Calisius zgodził się abdykować, publicznie głosząc, że \"nie będzie dłużej ignorował obaw ludu o swój stan i jutro pokojowo opuści Cesarski Tron\". \n\nPrzyznaje, że decyzja wynika wyłącznie z wyroku mediów, a jego własna ocena zdrowia się nie zmieniła. Z ciężkim sercem mówi: \"Źle, niemal zdradziecko, jest porzucać czuwanie nad Calisią w tak niebezpiecznym stanie. Wciąż jest tak wiele do zrobienia\"."

CAL_empire_of_the_nobles: "Cesarstwo szlachty"
CAL_empire_of_the_nobles_desc: "Po abdykacji część opozycji ustąpiła i udała się na dobrowolne wygnanie! \n\nW ostatnim wywiadzie byli senatorowie oznajmili: \"...bez Cesarza Calisiusa nic nie stoi na drodze całkowitemu pozbawieniu zwykłych Kalizjan praw przez Imperialnych. Calisia z republiki o szlachetnym sercu stała się republiką szlachecką, rządzoną wyłącznie przez arystokrację i dla niej\". \n\nMimo potwierdzenia krytycznego stanu Cesarza pozostała opozycja odrzuca rzeczywistość i złożyła ślub milczenia w proteście."

CAL_ave_imperator_franciscus: "Ave Imperator Antonius!"
CAL_ave_imperator_franciscus_desc: "*Cesarz nie żyje!* \n\nRicardus Augustus Calisius zmarł dziś rano, ulegając starości i stresowi kumulowanego od czasów Kryzysu Barbarzyńskiego. Ambitny założyciel potężnego Cesarstwa będzie opłakiwany przez 2 tygodnie. \n\nW czasie żałoby zakazane są rozrywki, głośne rozmowy i stroje inne niż czarne. Brak szacunku dla zmarłego zakończy się procesem. \n\n\nNa tron wstąpi Antonius Calisius, pasierb Cesarza. Równie ambitnego następcę witają Imperialni oraz opozycja, a niektórzy przewidują wielkie zmiany polityczne. \n\n\nPogrzeb odbędzie się za trzy dni. Pochód przejdzie wszystkimi ulicami zbudowanymi za jego rządów i zakończy się przy przyszłym Mauzoleum Calisiusa. Publikacja relacji medialnych wymaga zgody Pałacu. \n\nInauguracja Antoniusa nastąpi po żałobie. Szczegóły podamy dzień wcześniej. \n\nAve Antonius Calisius! Ave Ricardus Augustus Calisius Maximus! \n...i §0AVE! CALISIA! SEMPER! VICTORIA!§!"

CAL_dream_called_calisia: "...sen zwany Calisią"
CAL_dream_called_calisia_desc: "Obywatele Cesarstwa, słuchajcie! Dziś jest dzień triumfu! Wrogowie byli niezliczeni, a ich próby liczne, lecz ich marne państwa są ruiną, a jedno dominium trwa i to Cesarski sztandar powiewa nad Polonią! Od tętniących metropolii z białego marmuru po mgliste krańce cywilizacji nasza kultura niesie oświecenie! Dowiedliście wartości ponad miarę i dzięki wam zbieramy owoce złotej epoki! Cieszcie się, lecz nie zapominajcie o wierności strażnikom Pax Calisiana! Bohaterom, którzy wyryli wieczny ślad w historii! Nie zapomnijmy ich ofiary, dzięki której żyjemy w bezgranicznym dobrobycie! §YAve Imperator!§! §0Ave Calisia!§!"


### EPILOG - TRIUMWIRAT ###


CAL_pressure_of_circumstances: "Presja okoliczności"
CAL_pressure_of_circumstances_desc: "Na rozkaz Triumwiratu zdecydowanie odradza się podróże między prowincjami poza koniecznymi wyjątkami! Wobec niestabilności po tyranobójstwie stan wojenny w całym Imperium przedłużono o dwa tygodnie! Zerwanie relacji między Senatem, Legionami i pretorianami zalało sądy sporami i zniszczyło zaufanie do instytucji. Podział prowincji utrwala się, a gubernatorzy deklarują lojalność wybranej frakcji. W razie bójki lub strzelaniny, zwłaszcza politycznej, zachowajcie spokój i ukryjcie się! Grabież i udział w zamieszkach karane są ukrzyżowaniem! Ukochane Imperium musi przetrwać i nie upadnie przez wewnętrzne waśnie!"

CAL_dividing_the_calisia: "Podział Calisii"
CAL_dividing_the_calisia_desc: "Calisia, faktycznie podzielona od niemal miesiąca, oficjalnie przestała być jednym państwem i rozpadła się na trzy części! Ukochany Senat rządzi zachodem, Pretorianie południem, a Legiony wschodem! Niech tymczasowy krok wstecz zapoczątkuje wielki skok naprzód! Musimy wytrwać i zachować wiarę! Niepokoje opadną, gdy Triumwirowie rozlokują siły według uzgodnionych granic. Przyszłość może niewprawnemu oku wydawać się niepewna, lecz Jowisz mi świadkiem, wkrótce nadejdzie pokój. Wykorzystajmy go!"

CAL_legionary_provinces: "Prowincje Legionowe"
CAL_legionary_provinces_desc: "Obywatele pragnący przenieść się na żyzne ziemie południowego wschodu są proszeni o cierpliwość! Urzędy imigracyjne prowincji gaulicyjskich pracują po godzinach, rozpatrując kandydatów zwabionych dobrobytem i bezpieczeństwem żywnościowym rozsądnej administracji legionistów. Sławna i stabilna Gaulicia, pomijając problemy Scytów, pozostanie klejnotem Triumwiratu przez dekady. Wy także zakosztujecie jej bogactw, jeśli prawidłowo przejdziecie przez procedury!"

CAL_breadbasket_of_calisia: "Spichlerz Calisii"
CAL_breadbasket_of_calisia_desc: "Legioniści Gaulicii! Na rozkaz Triumwira Viniciusa osoby bez bezpośrednich przydziałów wojskowych mają ruszyć na zrujnowane pola, użyźnić glebę i uprawiać ziemniaki dostarczone przez Urząd Logistyki i Rolnictwa! Niech wasza roztropność przywróci całej Calisii niegdyś wszechobecny obiad: schabowego z ziemniaczkami!"

CAL_spirit_of_a_true_commander: "Duch prawdziwego dowódcy"
CAL_spirit_of_a_true_commander_desc: "Bohaterowie Calisii! Zarezerwujcie wolne terminy na serię uczt ku czci potężnego legata Marcusa Viniciusa. Będą one otwarte dla legionistów z co najmniej dwuletnią potwierdzoną służbą! Żołnierze barbarzyńskiego pochodzenia, nieobywatele, wyzwoleńcy i niewolnicy podlegli Legionom nie mogą uczestniczyć. Wstępu nie mają też oskarżeni o przestępstwa lub dawniej zhańbieni. Z innych wieści o Viniciusie: prokuratorzy odmawiają sprawy Marianusa C., który twierdzi, że legat go pobił."

CAL_ancient_capital_in_cracovia: "Starożytna Stolica Cracovii"
CAL_ancient_capital_in_cracovia_desc: "Obywatele i właściciele Cracovii świętują rekordowe ceny nieruchomości w centrum, wyższe nawet niż w Wiecznym Mieście i Constantii - wyraźny znak sukcesu i dobrobytu! Niezrównane bezpieczeństwo żywnościowe, stabilność i bezpieczeństwo to kolejne zalety. Wielu wskazuje brak intryg politycznych jako główną atrakcję, a Legiony stale przystosowują nowe insulae dla rosnącej ludności! Nie zwlekajcie. Przenieście się do starożytnej stolicy i dołączcie do cesarskiej elity!"

CAL_desire_for_revenge: "Pragnienie zemsty"
CAL_desire_for_revenge_desc: "Potężny legat Marcus Vinicius ustanowił nowe święto, które każdy lojalny Kalizjanin ma natychmiast wpisać do kalendarza. Ku czci poległego przyjaciela Ricardusa nadchodzący piątek będzie wolny na wszystkich ziemiach Legionów. Na głównych ulicach miast handel zostanie zawieszony, a hazard i prostytucja zakazane! Zakłócenia będą surowo karane, zwłaszcza podczas minuty ciszy o godzinie śmierci Ricardusa! W całej prowincji wyemitowane zostanie podobno straszliwe przemówienie."

CAL_senatorial_provinces: "Prowincje Senackie"
CAL_senatorial_provinces_desc: "Uwaga, wszyscy obywatele pod rządami Senatus Calisiensis. Wprowadzono racjonowanie całej żywności, w tym podstawowych środków utrzymania! Codziennie należy zgłaszać się do pałacu gubernatora, a w Prowincji Senatorskiej do najbliższego oddziału Rady Miejskiej, po znaczki na racje! Wszelki kontakt z podłymi barbarzyńcami i naśladowanie ich brutalnych obyczajów są surowo zakazane!"

CAL_threats_from_abroad_and_within: "Zagrożenia wewnętrzne i zewnętrzne"
CAL_threats_from_abroad_and_within_desc: "Na rozkaz Senatu powstaje Kalizjańskie Centrum Prawa Ubóstwa, komisja prokuratorów i prawników profilująca i delegalizująca ruchy wywołujące niepokoje lub pogardę dla prawa i Senatu! Grupy uczestniczące w zamieszkach lub zorganizowanej przestępczości mogą zostać uznane za krajowych wrogów Calisii i odpowiednio ścigane! Neo-Popularów, abolicjoniści i inni powinni zakończyć agitację, nim spadną na nich praworządność, Senat i lud!"

CAL_desperate_need_for_money: "Desperacka potrzeba pieniędzy"
CAL_desperate_need_for_money_desc: "Uwaga, znawcy kodeksu finansowego! Ujawniono budżet Wiecznego Cesarstwa Calisii. Najbardziej wyróżniają się rekordowe deficyty mimo wyższych podatków. Dochody podatkowe maleją, zaś konfiskaty źle nabytego majątku i opłaty uznaniowe rosną. To oczywiście skutek zdrady i korupcji pozostałych Triumwirów! Niech pomysłowość Senatu ocali nas w potrzebie jak podczas wcześniejszych kryzysów!"

CAL_off_to_killing_again: "Znów ruszamy zabijać"
CAL_off_to_killing_again_desc: "Zbierzcie się na chwilę ciszy! Wypadek rydwanu zabił tuzin ludzi, w tym właściciela browaru i całą rodzinę. Niech drodzy patrioci zaznają wiecznej rozkoszy w Elizjum, na którą zasłużyli pobożnym przekazaniem całego majątku Senatowi w testamentach! To przykład dla nas wszystkich: wypadek może spotkać każdego, lecz wieczną błogość osiągną tylko oddający dobra doczesne większej sprawie! Niech Jowisz nas chroni, bo to druga taka tragedia w tym tygodniu!"

CAL_hunger_and_unrest_in_the_eternal_city: "Głód i niepokoje w Wiecznym Mieście"
CAL_hunger_and_unrest_in_the_eternal_city_desc: "Stan wojenny wrócił do Calisii! Vigiles podwajają walkę z nielegalnym finansowaniem terrorystów, lecz tłumienie rozruchów żywnościowych wywołanych przez zdrajcę z południa przekracza ich siły! Kilka tygodni blokady Viniciusa dramatycznie pogorszyło sytuację. Browary i gorzelnie zamknięto, bo buraki i jęczmień służą za żywność! Obowiązują racje. Fałszerzy kartek czeka doraźny osąd! Unikajcie Dzielnicy Plebejskiej pochłoniętej zamieszkami, choć służby pacyfikują buntowników, krzyżując najgorszych sprawców! Ufajcie Senatowi i ludowi, a przetrwamy!"

CAL_eastern_provinces: "Prowincje Wschodnie"
CAL_eastern_provinces_desc: "Dekretem Gwardii mianowany zostanie nowy szereg magistratów i gubernatorów ziem pod jej władzą, a pretorianie odejdą od bezpośrednich rządów ku sprawom wojskowym. Preferowani będą apolityczni kandydaci związani z lokalną społecznością; wnioski z podpisaną listą zwolenników można składać Prefektowi. Choć Christianus Cinastovicus ma wyłącznie doświadczenie wojskowe, wierzy, że miękkie podejście zwiększy zdolność utrzymania porządku!"

CAL_amber_must_flow: "Bursztyn musi płynąć"
CAL_amber_must_flow_desc: "Christianus Cinastovicus zatwierdził największy projekt wydobywczy w historii. Wraz z bogatymi darczyńcami pretorianie stworzą łańcuch wydobycia i obróbki bursztynu na dochodowy eksport, przynoszący bogactwo dorównujące Cesarskiemu Rdzeniowi! Inwestycje z całej Calisii stworzą miejsca pracy w wydobyciu i rzemiośle bursztynniczym!"

CAL_agents_of_the_empire: "Agenci Cesarstwa"
CAL_agents_of_the_empire_desc: "Uwaga, obywatele Cracovii! Magistrat Lucius Vorenus został dziś znaleziony martwy w willi! Historia zapamięta go jako nieustraszonego, uczciwego sługę publicznego, autora nowych przepisów urbanistycznych i ostrzeżeń przed niebezpieczną aktywnością pretorian. Pogrzeb bohatera odbędzie się w sobotę, a ku pamięci powstanie pomnik! Spekuluje się o agentach Gwardii, lecz Rada Miejska przypomina, że bezpieczeństwo prowincji jest silne i takie naruszenie niemożliwe!"

CAL_oriental_jewel_in_constantina: "Perła Wschodu w Constantii"
CAL_oriental_jewel_in_constantina_desc: "Zrujnowana strefa Varsovii została rozkazem Gwardii połączona z kwitnącą metropolią Constantia! Nowa przestrzeń i przystosowane nieruchomości dawnej stolicy Wenedów stanowią ekscytującą inwestycję w rozwój Klejnotu Wschodu, umacniając gospodarczą i kulturalną hegemonię regionu nad zwiedzionymi pretendentami z zachodu. Miejmy nadzieję, że w przeciwieństwie do rzekomego \"Wiecznego Miasta\" nasza metropolia nigdy nie zgaśnie ani nie straci blasku."

CAL_plotting_for_plots: "Działania dla działek"
CAL_plotting_for_plots_desc: "Opublikowano wiarygodne zarzuty, że legat Marcus Vinicius dopuścił się ciężkich grzechów przeciw obyczajności, w tym pederastii, szokującej korupcji i - co najgorsze - brutalnego zabicia szczeniaka! Taka bezbożność nie może być tolerowana, a według najwyższego sądu nadciągają liczne akty oskarżenia. Prawnicy ostrzegają, że skazanie może być trudne, bo Vinicius tchórzliwie zaszył się na swoich ziemiach. Spokojnie! Jeśli nikt nie wymierzy sprawiedliwości, pretorianie zrobią to sami!"

CAL_demand_the_grain: "Zażądaj zboża od Viniciusa!"
CAL_demand_the_grain_desc: "Ludu, nie będziecie dłużej głodować! Chciwy Vinicius żąda podwójnej, nawet potrójnej ceny za zboże. Nie pozwolimy mu na to! Zdradziecki legat musi zrozumieć, że mimo podziału wciąż jesteśmy jednym Cesarstwem działającym jak całość. Zazdrosny Triumwir nie może szantażować innych uprzywilejowaną pozycją! Caletus zażądał więc wydania nadwyżek pszenicy. ZA DARMO! Reprezentuje Senat; jaką legitymację ma Vinicius, by odmówić? Jeśli się sprzeciwi, pomaszerujemy do Cracovii i weźmiemy żywność siłą! Liczymy jednak na rozsądek, dlatego senatorowie napisali list o harmonijnej współpracy i Triumwiracie jako organizmie, którego części muszą działać razem. Za obronę granic przed najpodlejszymi barbarzyńcami należy nam się uczciwy udział. Największe umysły dobrały słowa o cierpieniu wywołanym egoizmem. Nikt nie ma serca tak zimnego, by odmówić. Tak czy inaczej, konsul Caletus i Senat zapewnią wam żywność!"

CAL_galician_blockade: "Blokada Gaulicyjska"
CAL_galician_blockade_desc: "Konsul Caletus, zaślepiony chciwością, śmie nękać nas żądaniami! Każe wysłać zboże albo \"przyśle legiony, by je zabrały\". Dlaczego mamy oddać skromną nadwyżkę? Za morderstwo ukochanego Cesarza? Skorumpowane rządy? Rozbicie Calisii? Dla pokoju Vinicius powstrzymuje się od agresji, lecz groźby mogą zmusić go do działania. Od dziś zakazujemy nie tylko eksportu zboża, ale wszelkiego handlu z uzurpatorami i zdrajcami. Nie będziemy karmić wrogów własnym kosztem. Przemytników zatrzymają Limitanei, którym w tej sprawie kazano najpierw działać, potem pytać."

CAL_ultimatum_for_praetorians: "Ultimatum dla Pretorian"
CAL_ultimatum_for_praetorians_desc: "Nie będziemy tolerować obcej ingerencji! W ostatnich tygodniach wykryto agentów szpiegujących urzędników, fałszujących wybory i szerzących propagandę. Mądry przywódca ustalił źródło: pretorianie. Mimo umowy o autonomii naruszyli rdzeń stabilności. Mamy prawo stracić Frumentarii i spalić Constantię, lecz Triumwir Caletus daje dawnemu wspólnikowi ostatnią szansę. Cinastovicus ma wycofać wszystkich Frumentarii, a zapanuje pokój. Inaczej wojna!"

CAL_prefects_pride: "Duma Prefekta"
CAL_prefects_pride_desc: "Kłamstwa! Oszczerstwa! Nieuczciwy kundel Caletus oskarża nas o wysyłanie Frumentarii w celu sabotażu. Wyobrażacie sobie? To uprzejmi dyplomaci i dzielni dziennikarze obserwujący pacyfikację licznych, BARDZO LICZNYCH buntów w prowincjach senackich. Pilnują, by zwłaszcza powstania Kalizjan nie były tłumione zbyt okrutnie. Obarczanie nas odpowiedzialnością za ICH problemy to absurd i maskowanie niekompetencji. Żałosne. Nieustraszony przywódca nie ugnie się pod kłamstwami. Urzędnicy i obywatele będą działać jak dotąd, bo nie złamali żadnego prawa Senatu."

CAL_dogs_of_war: "Spuścić psy wojny!"
CAL_dogs_of_war_desc: "Vae Nobis! Mimo starań o pokój armie dwóch Triumwirów maszerują ku granicom! Rodziny z rubieży uciekają w panice. Kolejna wojna domowa wydaje się nieunikniona. Harcownicy Auxilii wroga prowokują nasze wojska strzałami ostrzegawczymi. Pozostaje nikła nadzieja, że pokojowy przywódca powstrzyma podżegaczy. Módlcie się do wszystkich bogów, by mu się udało."

CAL_fall_of_the_triumvirate: "Upadek Triumwiratu"
CAL_fall_of_the_triumvirate_desc: "To koniec... Porządek mający gwarantować pokój zniknął! Wszystko przez ambicję nowych wrogów! Pogrzebali idee stabilności i współpracy, a teraz mordują dzielnych weteranów, odbierając im rodzinę i emeryturę. Nieważne! Nasi wojownicy są najlepsi. Uczynią z tej walki jedynie konieczny krwawy prolog przyszłej pieśni Pax Calisiana Aeterna."

CAL_mars_exulte: "Mars! Exulte!"
CAL_mars_exulte_desc: "Zdrajca nie żyje! Pomszczono bezprawnie straconego ukochanego Cesarza Ricardusa Calisiusa! Legionowe gladii przecięły gordyjski węzeł kłamstw Liberatores! Prawda wychodzi na jaw! Potępienie wielkiego Calisiusa wygłoszone przez Marcusa Viniciusa w najmroczniejszych dniach było fałszywym zeznaniem wymuszonym groźbą śmierci. Nie powstrzymało go to przed zemstą! Czekając na właściwą chwilę, schwytał i stracił jednego współspiskowca. Drugi krzywoprzysięzca pozostaje poza zasięgiem, lecz sprawiedliwość go dosięgnie - ziemska albo boska. Wtedy Calisia się zjednoczy."

CAL_cold_war_with_the_west: "Zimna wojna z zachodem"
CAL_cold_war_with_the_west_desc: "Zadaliśmy prowincjom Senatu potężny, być może śmiertelny cios. Ciągła walka osłabia jednak naród, opróżnia skarbce i zmniejsza zasoby ludzi. Mimo słusznego gniewu Marcus Vinicius słyszy prośby żołnierzy pragnących zobaczyć rodziny. Musi odłożyć krucjatę przeciw Caletusowi. Przyjmiemy strategię vulpes zamiast leo: zbudujemy sojusze, odtworzymy Frumentarii pod ścisłą kontrolą i znów poczekamy na moment ataku! Na razie cieszcie się pokojem Viniciusa!"

CAL_eastern_legionary_empire: "Wschodnie Cesarstwo Legionowe"
CAL_eastern_legionary_empire_desc: "Ave Marcus Vinicius Calisius! Wobec braku następcy Marcus Vinicius ogłosił się Cesarzem i prawowitym władcą całej Calisii, w tym zachodu i Urbs Calisia! Lud potrzebuje prawdziwego państwa, biurokracji i stolicy w Varsovii - dawnej stolicy Wenedów. Potrzebuje nowego Senatu wolnego od skorumpowanych, pozbawionych cnót senatorów. Zasiądą w nim najwięksi: dzielni żołnierze i oficerowie wiernie służący Calisii, doświadczeni wojownicy nieskłonni marnować życia. Skupienie na państwowości nie znaczy, że zapominamy o prawdziwej stolicy. Vinicius wie tylko, że nie możemy być kohortą panującą nad wschodem. Musimy dowieść zdolności nie tylko do kalizjańskiej wojny, lecz i budowy narodu!"

CAL_vae_victis: "Vae Victis"
CAL_vae_victis_desc: "Zdrajcy pokonani! Zbuntowani legioniści nie żyją! Marcus Vinicius popełnił samobójstwo przez rozprucie własnego brzucha. Wiedząc, że nie usprawiedliwi czynów przed prawowitym sądem, wybrał tchórzliwą śmierć. Radujcie się! Kochający tyranów podżegacz nie zagraża i możemy zaznać pokoju. Niestety półniezależna prefektura pretorian także skorzystała na pacyfikacji. Nadal podważają nasze rządy, lecz przynajmniej rozmawiają, inaczej niż brutalny legat. Może teraz skłonią się przed nami."

CAL_primacy_of_the_senate: "Prymat Senatu"
CAL_primacy_of_the_senate_desc: "Co jest fundamentem Calisii? Nie osoba Cesarza, nie imię Calisiusa ani dynastia, nie legion ani Urbs. To republikańska instytucja: Senat! Odróżnia nas od barbarzyńców i jest przykładem dla świata. Jako frakcja o największej republikańskiej legitymacji i z pierwotnym Senatem mamy pełne prawo żądać uległości od zwykłych ochroniarzy. Samo prawo nie wystarczy. Musimy zbudować armię, gospodarkę i widoczną dignitas. Wtedy zostaniemy uznani za państwo przewyższające wschód we wszystkim, co ważne."

CAL_correction_of_eastern_borders: "Korekta wschodnich granic"
CAL_correction_of_eastern_borders_desc: "Kształtowanie granic gladiusami jest prymitywne, lecz przy barbarzyńcach to jedyne skuteczne wyjście. Na szczęście przywódca Wschodnich Prowincji mimo swoich wad, barbarzyńcą nie jest i da się z nim rozmawiać. Wspólna granica jest daleka od ideału, obciąża administrację i utrudnia stabilny limes. Wymienimy ziemie, żądając lub oferując pieniężną rekompensatę, aby przyszły kształt służył obu jurysdykcjom."

CAL_morituri_te_salutant: "Morituri te Salutant"
CAL_morituri_te_salutant_desc: "Idący ku śmierci dotarli do celu. Po długiej walce żołnierze pokonali zbuntowanego legata. Agenci przeniknęli do Castrum Vavelus, schwytali go i stracili za zbrodnie! Pozostaje zjednoczyć dwie połowy Calisii, tym razem z pretorianami nadzorującymi Senat, by nie powtórzyła się tragedia rządów Popularów. To potrwa, bo pompatyczny Senat odmawia uznania naszych metod. Na razie czekamy i cieszymy się pokojem."

CAL_western_puppets: "Zachodnie marionetki"
CAL_western_puppets_desc: "Mimo starań Petrus Caletus nie chce się z nami zintegrować. Pomimo bezpodstawnych oskarżeń Frumentarii nadal szukamy pokoju. Skontaktujemy się z zaufanymi senatorami, którzy wykorzystają stanowiska, by rząd zachodu uchwalał prawa korzystne dla prawdziwych Kalizjan. Zatrudnimy dziennikarzy monitorujących prześladowania legalnej opozycji. Może zapewnią pokojowe i dostatnie zjednoczenie. Ich tożsamość pozostanie tajna dla bezpieczeństwa. Nie użyjemy jednak szpiegów, by nie narażać sąsiadów."

CAL_eastern_praetorian_empire: "Wschodnie Cesarstwo Pretoriańskie"
CAL_eastern_praetorian_empire_desc: "Ave Christianus Cinastovicus Augustus! Zmęczony bezczynnością Caletusa Triumwir i Prefekt Pretorian ogłosił się Cesarzem Wschodniej Calisii. Nie będziemy czekać jak ziemska kohorta, gdy zachód kąpie się w cesarskiej chwale! Koniec roli poniżanych! Oznacza to centralizację i większy nadzór nad miejscowymi prefektami, których nadużycia wywołały skargi. Odtąd będą wybierani przez centralny organ wolny od intryg lokalnych klik."

CAL_quo_vadis_calisia: "Quo Vadis, Calisia?"
CAL_quo_vadis_calisia_desc: "Lacrima, Calisia! Czy taki ma być twój los? By paść ofiarą chciwych sępów? Cierpieć niezliczone wojny domowe? Rozpaść się na dwie podejrzliwe połowy? Pokój wydaje się odległy. Czy przetrwamy kolejny najazd barbarzyńców albo bratobójczy konflikt? Czy pozostaje tylko walczyć ze współobywatelami i drugą połową wyjątkowej cywilizacji? Co gwarantuje, że ten przeklęty scenariusz się nie powtórzy? Czy Triumwirat nie miał zapewnić wiecznego pokoju? Módlmy się o kres rozlewu krwi."



## Wydarzenia ##



calisia.1.t: "Pierwszy kontakt"
calisia.1.desc: "NADZWYCZAJNY RAPORT CESARSKIEGO MINISTERSTWA WOJNY Z OPERACJI \"FINIS GERMANICUM\": \n\n\nDokładnie o 7:00 centuria należąca do struktur Legio I Alfa rozpoczęła ograniczone działania zaczepne na drugim brzegu rzeki. Nasze Auxilia donoszą, że początkowy opór był umiarkowany, przy dotkliwych niedoborach ludzi na całym froncie, katastrofalnym morale i opóźnionych dostawach wyposażenia. Liczne posterunki graniczne zostały całkowicie opuszczone, a wiele kolejnych obsadzono jedynie minimalnymi załogami, by zachować pozory funkcjonowania. Po nawiązaniu kontaktu obie jednostki, w tym centuria, wykazały ograniczoną skuteczność bojową, jednak naszym siłom udało się przebić przez pierwsze dwie linie germańskiej obrony, po czym wycofały się zgodnie z pierwotnymi rozkazami. Ministerstwo ocenia, że Eurokommissariat jest obecnie całkowicie niezdolny do prowadzenia wojny - zarówno błyskawicznej, jak i długotrwałej. Istnieje duże prawdopodobieństwo, że jego siły zupełnie się rozpadną, a ewentualna operacja będzie mogła zostać przeprowadzona przy minimalnych stratach. Po zestawieniu tych ustaleń z pierwotnymi szacunkami i analizie gotowości bojowej legionów Ministerstwo wydaje następujące stanowcze zalecenie:"
calisia.1.a: "Kesselberg delenda est!"

calisia.2.t: "Za purpurową kurtyną"
calisia.2.desc: "- Co teraz zrobi Cesarz? - wybuchnął Conradus, jeden z pałacowych służących, niezdolny dłużej znieść narastającego napięcia.\n- Słyszałem, że zamierza zreformować system ziemi publicznej - jego kolega spróbował uspokoić towarzysza.\n- Och, Kacprze, nie bądź śmiesz... - mimo zdenerwowania zdołał powstrzymać się przed powiedzeniem czegoś, co mogłoby obrazić Cesarza. Nikt nie wiedział, kto może ich podsłuchiwać. - To znaczy, dlaczego miałby to robić?\n- Przecież to on ukrócił samowolę skorumpowanego duchowieństwa i odebrał mu ziemię - Caspar uzasadnił swoje zdanie. - Troszczy się o biednych.\n- Ale rozdanie jej masom - Conradus dobierał teraz słowa znacznie ostrożniej - przeczyłoby jego wcześniejszym działaniom. Wykorzystał te ziemie, by ugłaskać żołnierzy i elitę finansową.\n\nRozmowa trwała jeszcze jakiś czas i, zgodnie z obawami Caspara, ktoś rzeczywiście szpiegował ich oraz wielu innych służących. Imperator Ricardus Calisius rozkazał swoim agentom przysłuchiwać się krążącym o nim plotkom. Chciał odnaleźć wszelkie ślady spisku i... zaspokoić własne ego. Dominus pławił się w uwadze służby, żołnierzy i senatorów. Nikt nie wiedział, jaki będzie jego następny ruch. Blask cesarskiej chwały nie był jednak w stanie przyćmić żaru korupcji, który powoli zaczął trawić jego domenę. Trzeba było podjąć znaczące działania. \nCoś w jego wnętrzu domagało się radykalnych posunięć, które pomogłyby biednym masom. Wspomnienie wyryte gdzieś poza granicą świadomości. Wspomnienie czerwono-złotych sztandarów dawnego imperium - lecz nie starego Rzymu. Czegoś nowszego. Czegoś, co znał... o wiele bardziej osobiście. \nCalisius wziął łyk ulubionego wina z Lacjum, by uspokoić wzburzony umysł. Niezależnie od tego, jak szlachetne były jego zamiary, już dawno zrozumiał, że to bogaci senatorowie finansują państwo i napędzają rozwój gospodarczy. Mimo to trzeba było położyć kres nadużyciom skorumpowanych kwestorów, nawet jeśli w narastającym konflikcie wymagałoby to opowiedzenia się po stronie patrycjuszy. \nJedno było pewne - musiał przerwać milczenie i przeprowadzić rewolucyjne bądź ewolucyjne reformy systemu Ager Publicus. Zwlekał z tym tak długo, że napięcie i oczekiwania wzrosły do poziomu, o którym wiedzieli już nawet bogowie na Olimpie. Będzie musiał wygłosić mowę wystarczająco wielką, by im sprostać."
calisia.2.a: "Agere Sequitur Esse"

calisia.3.t: "Na kolanach"
calisia.3.desc: "- ...a według pomiarów mojego pracownika samochód powinien był bez problemu przejechać i zmieścić się w sali! Specjalnie wycięliśmy pół wschodniej ściany! \n- ...o Jezu-Chryste-Jowiszu, po prostu... idź. Odejdź. Dzięki. \n- O-o-o-oczywiście. Ave Calisius... \n\nCesarz był już zmęczony całym tym bałaganem. Od trzech godzin słuchał paniki i jąkania zawstydzonych senatorów, którzy nie potrafili wpasować się w motyw uroczystości, a od ciągłego siedzenia w jednej pozycji wszystko zaczynało go naprawdę boleć. \nNie pomagali również głupcy, którzy złożyli już przed nim swoje dary - zbili się w grupkę w jednym z rogów sali i wykłócali o własną niekompetencję oraz brak organizacji. Jedni przyszli z urodzinowymi kubkami i czapeczkami, inni opakowali podarki jak prezenty bożonarodzeniowe, a jeszcze inni ostentacyjnie rzucali się Cesarzowi do stóp. I nawet to robili źle - jakby był faraonem, a nie Augustem. \n\nWszystkich przebiło jednak głupota dwóch szczególnych gagatków: pierwszy postanowił wkroczyć do sali *z rozmachem* i właśnie został odprawiony przez Cesarza, gdy przeznaczona na prezent Scoda Superbus nie zmieściła się w otworze specjalnie wybitym w ścianie, omal nie pozbawiając Palatio Embolutia dachu nad skrzydłem restauracyjnym; drugi zaś - Iacobus, dawniej student, a dziś osobisty pomocnik Calisiusa (czy raczej pokojówka) - naraził się na stratowanie przez tłum senatorów i ich strażników opuszczających salę tylko po to, by wręczyć swemu władcy toster. Pierdolony *toster*. \n\nParaolimpiada w podlizywaniu się Cesarzowi trwała jeszcze godzinę albo dwie, aż ostatni senator wypadł z budynku, wcześniej obdarowawszy tron parą antypoślizgowych skarpet i kompletem pościeli z motywem Aves Iratae. Nareszcie - pałac opustoszał z urzędników, których miejsca zajęła niewielka fala służby. Calisius natychmiast zaczął zmęczonym, poirytowanym głosem osobiście rozdzielać im zadania. \n- Ty. Weź szczotkę i uporządkuj półki. Ty, ty i ty - zajmijcie się tym gównem na stołach. Wy troje ogarniecie podłogę. Ty! Zadzwoń po budowlańców, którzy jeszcze pracują o tej porze, i każ im załatać tę cholerną ścianę, a *TY*, Iacobusie..."
calisia.3.a: "...zrobisz mi porządnego tosta z serem - burczy mi w brzuchu."

calisia.4.t: "Nieoświecone masy..."
calisia.4.desc: "Andreas Compa i Raphael Hvedorcus, dwaj nieoficjalni przywódcy Popularów, spotkali się, by wysłuchać sprawozdania z tego, jak przebiegło składanie darów Calisiusowi.\n- Wspaniały, o Konsulu, wszystko poszło bez najmniejszego problemu - zaśmiał się nerwowo wysłannik. \n- Wynoś się! - Compa przejrzał jego kłamstwa. - Gdybym nie miał na głowie lawiny pracy, sam bym tam poszedł i zrobił to jak należy.\nIstotnie, jako wykwalifikowany historyk późnego antyku Compa doskonale nadawał się do poruszania po meandrach dworskiej etykiety, zwłaszcza że specjalizował się przede wszystkim w intrygach historii bizantyjskiej.\n- W tym tempie nigdy nie przekonamy Calisiusa do realizacji naszych planów - lamentował Hvedorcus.\n- Raczej twoich planów - pomyślał Compa.\nChoć wszyscy Popularzy pragnęli ulżyć cierpieniom biedoty i zdemokratyzować Cesarstwo, Hvedorcus należał do bardziej radykalnych członków i chciał posunąć się jeszcze dalej. Planował uczynić syndykaty robotnicze - sodalitates i collegia - podstawową formą organizacji gospodarczej.\n- Dzięki Bogu... albo bogom, że jestem tu, by go hamować - pogratulował sobie w duchu Compa. Prawdę mówiąc, razem stanowili potężny polityczny duet: Hvedorcus opracowywał programy reform, a Compa sprzedawał je Cesarzowi opakowane w autentyczną rzymską terminologię.\nChoć na dworze obaj błyszczeli, jako intelektualiści i przybysze z zewnątrz napotykali pewne trudności w kontaktach z rzekomym kręgosłupem ich ruchu - niższymi warstwami społecznymi. Te oczywiście ceniły ich szlachetną, akademicką prezencję, ale bezpośrednie rozmowy zwykle wychodziły dość niezręcznie. Dlatego mieli ludzi od brudnej roboty. Kiedy trzeba było udobruchać miejscowego burmistrza, zazwyczaj wysyłali kogoś pokroju Silviusa Iacobinusa, starszego Ferrulum, by odwiedził go z alkoholem, wkupił się w łaski i proszę - burmistrz jest po twojej stronie. Nawet Iacobinus nie może jednak być wszędzie i pić z każdym poddanym Cesarstwa (wbrew temu, co twierdzi). Dlatego ktoś taki jak przywódca legionistów, Marcus Vinicius, byłby dla sprawy Popularów ogromnym nabytkiem. Byłby, gdyż mimo formalnej przynależności do frakcji niewiele go ona obchodzi; woli skupiać się na służbie Cesarzowi i pozostawać apolityczny.\n- Dobra, koniec przedstawienia! - zarządził Compa. - Wszyscy wracać do pracy. Jeśli Optymaci mają ten sam problem co my, nasz rząd może jeszcze utrzymać się przy władzy."
calisia.4.a: "...z pewnością potrafią wydać osąd."

calisia.5.t: "Dupokracja"
calisia.5.desc: "- Naprawdę przynieśli mu toster? - Petrus Caletus nie mógł przestać się śmiać, gdy usłyszał nowinę. Reszta obecnych w sali Optymatów dołączyła do niego, choć ze znacznie mniejszym entuzjazmem.\n- Och, skoro tak radzą sobie bez nadzoru, może nie powinienem ich poganiać, by robili to lepiej. To jest po prostu kurwa zbyt śmieszne - pomyślał Caletus. - Dobrze, następnym razem przeczytajcie protokoły i nauczcie się łaciny, bo znowu spieprzycie... *admissio*. Oficjalna część spotkania dobiegła końca. Napijmy się wina w moim atrium. Możecie iść. Za chwilę do was dołączę.\n\nGdy pozostali zwolennicy sprawy Optymatów opuszczali pomieszczenie, Caletus rozmyślał nad przyszłością frakcji.\nMimo radości płynącej z oglądania kolejnych spektakularnych wpadek Kaleta... Caletus wiedział, że jeśli jego ugrupowanie ma odnieść sukces, musi się wreszcie ogarnąć. Już raz zlekceważył Popularów, a Calisius wybrał ich na swoich obecnych doradców. Zrobił to mimo znajomości lokalnej polityki od podszewki, jaką posiadali on i Thaddaeus Scarginscis. Mimo cichej aprobaty Cinastovicusa i jego pretorian. Nawet mimo tego, że Optymaci cieszyli się większą sympatią samego populus, który Popularzy rzekomo reprezentowali.\n\n- A jednak nie powinno mnie to dziwić - pomyślał Caletus. - Mimo swoich wad jajogłowi przybysze zachowali się bardziej pragmatycznie, gdy okazało się, że Calisius na poważnie próbuje wskrzesić Rzym w Polonii. Szybko przyswoili właściwy żargon, przywdziali togi i używali łacińskich wtrąceń tak często, jak tylko mogli. Tradycjonalistyczny przywódca Optymatów początkowo nie chciał podporządkować się nowym regułom. I zapłacił za to cenę. Kiedy Calisius upokorzył go, opowiadając się po stronie Popularów, zrozumiał, że jeśli chce rządzić Calisią, musi zostać senatorem Caletusem. Teraz, gdy przemiana dobiegła końca, sprawnie naoliwiona machina Optymatów - napędzana ujmującą prostolinijnością Caletusa, wsparta autorytetem potężnego Gaiusa Ceplusa i sekretami odkrywanymi dla nich przez Cinastovicusa - będzie nie do zatrzymania.\n- Uch, dość myślenia jak na jeden dzień. Thaddaeusie, chodźmy do atrium, zanim ci pijacy opróżnią wszystkie moje beczki."
calisia.5.a: "Na zdrowie!"

calisia.8.t: "Agro Publico Relatus IV"
calisia.8.desc: "Rok: [GetYear]\nMiejsce: Abbasinum\n\nAve Imperator Ricardus Calisius.\nZgodnie z rozkazem Waszej Wysokości przeprowadziłem szczegółową kontrolę spraw Ager Publicus w Abbasinum. Z uwagi na bliskość Urbs miejscowy patrycjusz, Vilius Avarus, był zdeterminowany, by ukryć swe zbrodnie. Udając właściciela gospodarstwa przeciętnej wielkości, w rzeczywistości zbudował własne latyfundium. Stosując przemoc i zastraszanie, zmuszał coloni do płacenia mu czynszu albo konfiskował ich ziemię. To drugie umożliwiał mu sojusz z miejscowym iudex. Jego wspólnik wrabiał kolejnych coloni i skazywał ich na dożywotnią niewolę. Avarus przejmował ziemię, kupował owych niewolników, osadzał ich na roli i nakazywał przedstawiać się jako niezależni coloni na wypadek rutynowej kontroli kwestora. Dlatego musiałem działać w tajemnicy. Przebrałem się za robotnika poszukującego zatrudnienia. Byłem stale obserwowany, a moją swobodę poruszania się ograniczono. Stałem się niewolnikiem trzymanym w prawdziwie spartańskich warunkach, dopóki nie zdołałem zbiec i zdać Waszej Wysokości sprawy z sytuacji w Abbasinium. Z moich obserwacji wynika, że w ten sam sposób traktuje wszystkich robotników w swym majątku. Jak Wasza Cesarska Mość może się domyślić, stan kalizjańskiej wsi jest katastrofalny. Zamożni właściciele kontrolują ziemię i zbierają owoce naszej żyznej gleby. Biedni cierpią pod ich żelazną pięścią. Rozdźwięk między wizją Waszej Cesarskiej Mości a praktycznym funkcjonowaniem Ager Publicus jest uderzający. Zalecam natychmiastowe i radykalne działania."
calisia.8.a: "Podpisano: kwestor Agrippa Opertus."

calisia.9.t: "Banknoty na Donativum"
calisia.9.desc: "- Okazałeś wielką mądrość, wybierając mnie na swego rytownika, o Cesarzu. \nPrawdę mówiąc, ów młodzieniec był jedynym uczniem płci męskiej w liceum plastycznym, który przyznał, że myśli o Cesarstwie Rzymskim. I pracował za mniej niż płaca minimalna. \n- Dość gadania. Pokaż mi projekty! - rozkazał Calisius. \nPołożono przed nim kilka banknotów. Na awersie widniał zwyczajowy profil Cesarza. Na rewersie - wizerunki legionów przekraczających Prosnę po prowizorycznym moście, zdobywających czołg albo walczących z barbarzyńcami. \n- Czy to Germanin? Zdzielony po hełmie? Ponadczasowa klasyka. Jestem pewien, że chłopcy to docenią. \n- O, Cesarzu! Zaszczycasz mnie, ale proszę, przemyśl, kogo wynagrodzisz. Ci legioniści to brudne łotry, a ich Vinicius jest nic niewartym nierobem. Nie pozwól, by banknoty trafiły w ich brudne ręce; roztrwonią je w jeden dzień. Pretorianie natomiast...  \n- Doskonale wiem, że zobaczę te pieniądze raz w życiu i nigdy więcej. Prawdziwym problemem jest uczta dla tych, którzy dostaną Donativum. \n- Co masz na myśli, o boski? \n- Legioniści zapewne ucieszyliby się z całej sterty ogromnej, taniej pizzy w stylu wenedzkim. Tłustej, grubej, zasypanej serem. Do tego tona taniego wina. Nawet jaboli. Nie jestem pewien, czy właśnie do tego powinniśmy dążyć. Chleba, igrzysk i całodziennej orgii - westchnął Calisius. - Pretorianie oczekiwaliby zaś prawdziwej napoletany i choć sam lubię dobrą napoletanę, byłoby to odrobinę zbyt dosłowne. Ci ludzie są przede wszystkim bandytami i nie odróżnią dobrego umbryjskiego wina od Fresco z Ranuli. Chcą jedynie bogactwa, a wraz z nim - władzy. \n\nCesarz chwycił banknot, by otrzeć pot z czoła. Bez względu na to, kogo wybierze..."
calisia.9.a: "...obie strony nadal będą głodne."

calisia.10.t: "Cena lojalności"
calisia.10.desc: "Przez całą noc miejsce zwykle spowite tajemnicą rozbrzmiewało kolejnymi salwami wiwatów i śmiechu. Koszary ledwie przypominały samych siebie, przemienione w wystawną, choć improwizowaną salę biesiadną. Mimo to cała wymuszona ogłada i pompatyczność późnego soirée z trudem skrywały prawdziwe zezwierzęcenie świeżo wyniesionej elitarnej gwardii Calisii. Z każdym haustem najlepszego miejscowego czerwonego wina starannie wyćwiczone maniery, dzięki którym pretorianie mogli obcować z samym Cesarzem, zderzały się z ich plebejską naturą, powoli zmieniając spotkanie w ucztę, na którą przychylnie spojrzałby jedynie Bachus. \n\nSpośród tuzina głosów wysokich rangą oficerów, próbujących przekrzyczeć się nawzajem w pijanym strumieniu świadomości, uwaga stopniowo przesuwała się ku centralnej postaci grupy, wciąż odzianej w pełną zbroję. Christianus Cinastovicus nie wyglądał może szczególnie imponująco, lecz cesarska purpura zdobiąca jego sylwetkę roztaczała zupełnie inną aurę - prestiżu i autorytetu. Gdy uniósł puchar, gwar natychmiast ucichł. \n\n- Bawcie się dziś dobrze, żołnierze, bo za nasze trunki płaci skarbiec Cesarza! Ave Calisius! - słowom odpowiedział zgodny wiwat. Pretorian nie trzeba było namawiać do opróżnienia kolejnej rundy, ale świadomość, że ucztę funduje Denarius ich władcy, czyniła wino jeszcze słodszym. \n- Jego Wysokość wreszcie postanowił nagrodzić naszą wzorową służbę miłym dodatkiem. Ochrona musi sporo kosztować, gdy jest się najbardziej znienawidzonym człowiekiem w Calisii - ciągnął drwiąco. \n- Och, daj spokój. Staremu piernikowi serce wysiądzie na długo przed tym, nim ktokolwiek zdąży się na niego zamachnąć - przerwał wesoły gwardzista, zapominając się w pijackiej rozmowie. \n- Ten \"stary piernik\" to twoja jedyna droga do wypłaty, Gaiusie. I jedyna szansa, by naprawdę coś znaczyć. Lepiej módl się, żeby żył wystarczająco długo, byś zdążył zapracować na wygodną emeryturę. \n- A co, jeśli nasz ukochany Cesarz zacznie kiedyś skąpić pieniędzy za ochronę, Christianusie? \nPrzywódca pretorian uśmiechnął się ze zrozumieniem. \n- Och, to bardzo proste..."
calisia.10.a: "...wtedy po prostu go zastąpimy."

calisia.11.t: "Kebabus Europae"
calisia.11.desc: "To było centrum wydarzeń. Jedno z wielu, lecz być może najbardziej niesławne. Nie szło się tam bez odpowiedniego przygotowania, wina - i broni. Zwłaszcza po zmroku. Mężczyźni wszczynali bójki o wszystko. Gry, dziewki, politykę, przeszłość i przyszłość - co tylko zechcesz. Byli gorsi niż ich ojcowie i bracia, młodzieńcy z poprzedniego pokolenia. Bardziej pijani, bardziej wojowniczy. Naprawdę przekonani o własnej bezkarności. Przynajmniej dopóki nie zaczęto ich chłostać w koszarach. \n\nMimo wszystko starzec patrzył na nich bez większego strachu czy urazy. To prawda, niektórzy nie uważali \"kebaba\" za coś, na co warto wydawać swoje salarium. Nie było sensu się z nimi wykłócać; wystarczało krótkie skinienie do cohortes urbanae, gdy przybywali zabrać sprawców tej nocy. Większość gości była jednak na tyle pijana i wielkoduszna, że zostawiała więcej sestercji, niż należało, tylko po to, by się popisać. Najwyraźniej szacunek do człowieka za ladą ważył więcej niż uznanie własnych towarzyszy. \n\nGdy pijani legioniści padali pod ciosami pałek albo wskutek działania alkoholu, stary Saracen pomyślał, że ta maskarada jest całkiem... przyjemna. Każdy musiał odegrać swoją rolę, a jego była dość łatwa: nikt nie wiedział, jak powinien wyglądać \"rzymski kebab\", mógł więc improwizować. Klienci, zwłaszcza legioniści, zachowywali się jednak inaczej. Owszem, nadal byli bandą agresywnych, pijanych i zapewne rasistowskich młodych ludzi z potrzebą przewrócenia kogoś albo zapłodnienia - zupełnie jak wcześniej. Tym razem mieli jednak cel. Chcieli walczyć za miasto. Chronić je. Być może tylko dlatego, że obecnie lepiej im płacono.\n\nA może dlatego, że naprawdę zaczęło im zależeć. \n\nWłaściciel wzruszył ramionami, namoczył mop i zaczął ścierać z podłogi wymiociny, krew oraz sos. Kolejna noc dobiegła końca."
calisia.11.a: "Dla niego mogło być gorzej."

calisia.12.t: "Lex Ager Publicus"
calisia.12.desc: "§1Lex Commutationis et Perspicuitatis - projekt Optymatów§!\n1.1. Celem niniejszej ustawy jest przeprowadzenie ograniczonej reformy, skupionej na ograniczeniu korupcji i nadużyć w zarządzaniu ziemiami publicznymi (ager publicus), bez postanowień dotyczących redystrybucji gruntów.\n\n2.1. Wszyscy urzędnicy zarządzający ager publicus mają przestrzegać rygorystycznych procedur antykorupcyjnych ustanowionych niniejszą ustawą.\n\n2.2. Każdy przypadek korupcji, łapownictwa lub nadużycia władzy przez urzędników będzie podlegał surowym karom określonym w dalszych przepisach.\n\n3.1. Ustanawia się urząd pod nazwą Urzędu Kwestorskiego, zwany dalej \"Urzędem\".\n\n3.2. Urząd odpowiada za nadzór nad ager publicus i zarządzanie nim, zapewniając przestrzeganie niniejszej ustawy oraz zapobiegając wszelkim formom wyzysku i niewłaściwego postępowania.\n\n\n§RLex Iustitiae Socialis - projekt Popularów§!\n1.1. Celem niniejszej ustawy jest przeprowadzenie radykalnej reformy, zmierzającej do wyplenienia korupcji i nadużyć w zarządzaniu ziemiami publicznymi (ager publicus), wraz z kompleksową redystrybucją gruntów.\n\n2.1. Wszyscy urzędnicy zarządzający ager publicus mają przestrzegać rygorystycznych procedur antykorupcyjnych ustanowionych niniejszą ustawą.\n\n2.2. Każdy przypadek korupcji, łapownictwa lub nadużycia władzy przez urzędników będzie podlegał dotkliwym karom określonym w dalszych przepisach.\n\n3.1. Niniejsza ustawa nakazuje pełną redystrybucję ziem publicznych w celu zapewnienia obywatelom równego dostępu do nich i ich użytkowania.\n\n3.2. Redystrybucja zostanie przeprowadzona zgodnie ze zreformowanymi kryteriami ustanowionymi niniejszą ustawą, z pierwszeństwem dla najbardziej potrzebujących."
calisia.12.a: "Przejdźmy do dyskusji!"

calisia.13.t: "Czelność Grakcha"
calisia.13.desc: "Kolejne posiedzenie Senatu, kolejne kilka godzin słuchania senatorów rozprawiających z wyraźnie wymuszoną elokwencją o potrzebie budowy wybiegu dla psów gdzieś pośrodku niczego. Zwykle konsul Andreas Compa nudziłby się jak mops, przysypiał, wymieniał wrogie spojrzenia z którymś z Optymatów albo po prostu rozmawiał z senatorami siedzącymi po obu stronach. Dziś jednak nie miał czasu na bezsensowne pogawędki. Właściwie nie miał czasu na nic, gdyż siedział spięty, ściskając w dłoniach niewielki plik dokumentów. Compie przypadł wątpliwy zaszczyt wygłoszenia mowy, która mogła albo nadać reformie Ager Publicus rozpęd, albo uśmiercić ją jeszcze przed startem. Czas mijał nieubłaganie i wkrótce nadeszła jego kolej, by przemówić do kolegów. Wstał i, czując na barkach ciężar całego świata, wszedł na mównicę. \n\n- Sprawa, o której będę dziś mówił, ma najwyższą wagę. Przemawiam nie jako członek Popularów, lecz jako senator zaniepokojony trwającym kryzysem. Jak przypuszczam, wszyscy wiecie, że niedawne ustalenia ujawniły liczne nieefektywności i wady systemu Ager Publicus. Plebejusze uprawiający ziemie niektórych patrycjuszy, a nawet senatorów, są wyzyskiwani, przepracowani i niesprawiedliwie wynagradzani za swój trud. Co więcej, odkryto również przypadki fałszowania sprawozdań podatkowych, z których wpływy miały finansować Res Publica.\n\nPo sali senackiej rozszedł się pomruk - każdy głos z osobna cichy, lecz razem tworzyły ogłuszający zgiełk. Najgłośniejsze i pozornie najbardziej zaniepokojone szepty dobiegały z miejsc zajmowanych przez Optymatów. Zanim hałas zdążył jeszcze wzrosnąć, Compa odchrząknął, ponownie skupiając na sobie uwagę sali. Kontynuując mowę, utkwił wzrok w jednym człowieku: Petrusie Caletusie, nieoficjalnym przywódcy Optymatów.\n\n- Jaskrawym problemem w całej tej sprawie jest niewybaczalne zachowanie Optymatów. Odkąd ujawniono doniesienia o nadużyciach w ramach Ager Publicus, nie kiwnęli nawet palcem, by cokolwiek naprawić. Czyny mówią głośniej niż słowa i każdy Kalizjanin doskonale zapamięta ich bezczynność. Nie powinno zresztą dziwić, że zajęli takie stanowisko; większość przypadków korupcji i wyzysku o różnym nasileniu odnotowano w dobrach należących bezpośrednio lub pośrednio do członków Optymatów.\n\nCompa poczuł satysfakcję, widząc, jak twarz konsula Caletusa zmienia wyraz z maski pewności siebie w grymas ledwie powstrzymywanej furii. Pomruk ponownie zagłuszył wszelkie inne dźwięki w sali, tym razem przeplatany chichotami ze strony Popularów. Po chwili szepty ucichły samoistnie i konsul mógł mówić dalej bez przeszkód.\n\n- Członkowie Popularów również nie są jednak bez winy. Wbrew temu, co sądzą niektórzy obecni na tej sali, nie jest to powód, by skakać sobie do gardeł. Ager Publicus jest wadliwy, a my, jako pokorni słudzy Res Publici, musimy go naprawić. Faktem pozostaje jednak, że reforma..."
calisia.13.a: "§1...nie może być przeprowadzana lekkomyślnie.§!"
calisia.13.b: "§R...jest od dawna palącą koniecznością!§!"

calisia.14.t: "Idylliczna rewolucja"
calisia.14.desc: "Paulus był zamożnym człowiekiem, a jego dwór stanowił pokaz przepychu tak typowy dla karierowiczów. Wielu zastanawiało się, w jaki sposób byłemu rolnikowi udało się zgromadzić dość bogactwa, by zostać jednym z największych posiadaczy ziemskich Calisii, skoro nigdy nie miał żadnego znaczącego źródła dochodu. Zawsze jednak znajdował dość złota, by wszystkich uciszyć. Dzięki wpływowym przyjaciołom zarówno na szczytach, jak i na nizinach w Calisii nic nie działo się bez wyraźnej zgody Paulusa. Aż do chwili, gdy przed jego posiadłością zjawił się rozwścieczony tłum. \n\nPaulus przywykł już do tego, że jego poddani od czasu do czasu zaczynali się stawiać. Ilekroć jakiś przesadnie ambitny Popular przedstawiał reformę skazaną na porażkę, motłoch się burzył, rozpaczliwie wypatrując szansy uwolnienia się spod władzy pana. Nic, czego nie naprawiłoby kilka batów. Właściciel ziemski przyzwyczaił się jednak, że jego protegowani wśród Optymatów ostrzegali go z wyprzedzeniem. Odkąd zaczął finansować frakcję, ani razu nie zapomnieli uwzględnić interesów swojego dobroczyńcy. Tym razem było inaczej. Coś zdecydowanie było nie tak. \n\nChoć strach ścisnął mu pierś, Paulus dumnie uniósł brodę i podszedł do służby z typową dla szlachcica ogładą. Na jego widok szczególnie znany wichrzyciel, Andrzej, splunął panu pod nogi. \n\n- Twój czas dobiega końca, tyranie! Nie będziemy ci dłużej służyć! Wkrótce to ty będziesz łamał sobie kark przy pługu, żeby związać koniec z końcem, a my zbierzemy owoce długich lat ciężkiej pracy. \n- Znowu to samo, Andrzeju? Już przez to przechodziliśmy. Nie wiem, jaką obłąkaną propagandę tym razem widziałeś, ale jak zwykle zapominasz o sile naszego wspaniałego status quo. Wracaj na pole, a nawet nie podwoję ci normy. \n- Och, na pewno to zrobisz! Nie masz już nad nami żadnej władzy. Gdy reforma tego twojego \"Ager Publicus\" wreszcie przejdzie przez Senat, nie zostanie ci nic. Jeśli zachowałeś choć odrobinę rozumu, radzę ci uciekać, bo inaczej siłą odbierzemy wszystko, co jesteś nam winien. Chociaż... właściwie proszę, zostań. Wtedy będziemy mieli z tego znacznie więcej radości. \n\nPaulus czuł, jak serce zaczyna mu walić. Spodziewał się, że sytuacja w stolicy jest poważna, lecz śmiałość chłopskich roszczeń wystarczyła, by naprawdę zaczął bać się o życie. W każdej wcześniejszej sytuacji łagodzili ton, pozostawiając sobie pokojową drogę powrotu do jego łask na wypadek, gdyby sprawy nie potoczyły się po ich myśli. On zaś zawsze był miłosierny - przynajmniej tak sobie powtarzał. Sąsiedzi byli przecież znacznie gorsi. Nigdy nikogo nie spalił, nie oślepił ani nie wykastrował, więc jeśli nawet on stał się celem takiej nienawiści, sytuacja musiała być krytyczna. Porzucając władczą pozę, Paulus wbiegł pośpiesznie do dworu i kazał przygotować powóz. Po raz kolejny jechał prosto do Calisii naprawiać cudzy bałagan."
calisia.14.a: "Lepiej, żeby później wynagrodzili go nowymi ziemiami."

calisia.15.t: "Triumf w Gnesnie"
calisia.15.desc: "W cieniu nadciągających chmur marsz zwycięzców zwiastował upadek Gniezna, niegdyś dumnego bastionu państwa Przemysła III. Ulice, dawniej tętniące życiem, cicho lamentowały, gdy kalizjańskie legiony narzucały im swą władzę. Starożytne kamienie, przesycone echem burzliwych dziejów Polski, oglądały obraz spustoszenia - łkały nad losem królestwa wyrytego w samych jego fundamentach. Nie było wiwatów, triumfalnego wkroczenia ani uroczystości. \n\nUjarzmiona cytadela Gniezna stała się świadkiem nieubłaganego biegu losu. Przemysł III, niegdyś władca, dziś jeniec, wleczony był pośród swoich ciemiężycieli, a ciężar klęski przygasił jego królewską postawę. Bezwzględni zwycięzcy prowadzili przez opustoszałe ulice byłego króla, pokonanego wodza i nieskrępowanego obrońcę swych wasali niczym Wercyngetoryksa w jego haniebnym pochodzie przez starożytną Galię. Ulicami nie niosły się radosne okrzyki, nie powiewały świąteczne sztandary. W powietrzu wisiała ciężkie uczucie żałoby po utracie suwerenności i końcu epoki. Legiony nie zważały na niemy smutek spowijający miasto; ich oczy wpatrzone były w horyzont, nad którym zwycięsko wschodziło słońce kalizjańskiej hegemonii, utrwalającej swój pierwszy ważny podbój.\n\nI tak pośród ruin niegdyś wielkiego miasta maszerował dalej Przemysł III - pokonany, lecz nieugięty. Wydawał się symbolem oporu wobec przeciwności, z duchem niezłamanym mimo krępujących go łańcuchów. Miał jednak przez długie lata gnić w lochu. Opór wojsk Księstwa Gnieźnieńskiego przypieczętował ich los i po wojennej wyprawie nie czekał na nich ciepły dom. Czekało tylko zimne żelazo kajdan i perspektywa spędzenia reszty życia w ciemnej celi. Taką przyszłość przyniosła Calisia. Podróż w przeszłość w roli więźnia wschodzącego imperium."
calisia.15.a: "Taka jest cena nieposłuszeństwa."

calisia.16.t: "Triumf w Lessna Polonorum"
calisia.16.desc: "W Lesznie, dawnej historycznej siedzibie rodu Leszczyńskich, dogasały zgliszcza. Wojciech Edward Leszczyński zadbał, by nic nie wpadło w ręce nadciągającej armii kalizjańskiej. Zniszczono wszystkie najważniejsze dokumenty, spalono główne ośrodki administracyjne, a samo miasto początkowo przypominało opuszczone pole bitwy. Brukowane ulice Leszna, które jeszcze niedawno rozbrzmiewały bitewnym zgiełkiem, wypełniał teraz równy krok kalizjańskich wojsk. Mieszkańcy wychodzili z cienia domów i z nieufnością patrzyli na przechodzących zdobywców. Na ich twarzach widniały ślady niedawnych cierpień, lecz w oczach migotała ostrożna nadzieja, rozpalona obietnicą stabilizacji i nowego początku niesioną przez kalizjańskie legiony.\n\nPośród podboju miał odbyć się wielki triumf zwiastujący świt kalizjańskich rządów nad Lesznem. Na czele pochodu jechał sam Cesarz Ricardus Calisius, którego obecność budziła zarazem podziw i respekt. Spoglądał na zgromadzony tłum pogodnie, lecz władczo. Za nim maszerowały szeregi legionistów w lśniących zbrojach i z wysoko uniesionymi sztandarami. Ten imponujący widok niósł obietnicę ładu oraz odrodzenia. W całej paradzie brakowało jednak jednego elementu - nie było przywódcy podbitego państwa, który mógłby na własne oczy zobaczyć upadek całego swego królestwa.\n\nW miarę jak pochód posuwał się naprzód, mieszkańcy Leszna gromadzili się coraz liczniej. Początkowe wahanie ustępowało ostrożnym oklaskom - gestowi niechętnej akceptacji zmieszanej z nadzieją na lepszą przyszłość. Zdyscyplinowani i stanowczy żołnierze kalizjańscy odpowiadali ludziom pełnymi szacunku skinieniami, sygnalizując odejście od okrucieństwa poprzednich władców. Mieszkańcy Leszna nie poznali jeszcze prawdziwych realiów życia w Cesarstwie Kalizjańskim, lecz na razie byli jedynie prowincją oczekującą na integrację, więc obchodzono się z nimi z najwyższą troską. Cesarz rozpoczął przemówienie, kreśląc wizję przyszłości, w której Leszno rozkwitnie pod dobroczynnymi rządami Calisii, rany wojenne się zagoją, a każdy obywatel będzie miał udział w odrodzeniu miasta. To wystarczyło, by uwierzyli. Na lojalność trzeba będzie jednak zapracować."
calisia.16.a: "I mieli przekonać się o tym na własnej skórze."

calisia.17.t: "Triumf w Mercuria Maior"
calisia.17.desc: "Sarmacka bestia została ujarzmiona, tętent koni na stepach Jarocina ustąpił odgłosowi miarowemu kroku legionów Calisii. Na zamku w Kórniku, lider pokonanej Terra Felix, Jacek Kowalski został zmuszony do podpisania aktu bezwarunkowej kapitulacji. Starożytny Rzym nie słynął z humanitarnego traktowania jeńców wojennych, więc Kowalski spodziewał się najgorszego. Lecz często losem gorszym od śmierci było publiczne upokorzenie. Takowe miało nadejść wraz z przybyciem cesarza Calisii, Ricardusa Calisiusa na triumf, który odbyć miał się w Środzie Wielkopolskiej oficjalnie przemianowanej na Mercuria Maior.\n\nObywatele tego miasteczka nie czuli zbytniego przywiązania do hegemona panującego ze swojego rodzinnego Kórnika, więc wyszli na ulicę by przywitać swoich oswobodzicieli, jakkolwiek obcy by się oni im nie wydawali. W końcu przetrwali powrót do przeszłości złotej epoki szlacheckiej, ale teraz mieli cofnąć się w czasie jeszcze bardziej. Rynek Mercurii został ozdobiony w sposób niespotykany dotąd w historii miejscowości. Mnogość proporców, sztandarów i symboli cesarskich sprawiała wrażenie ogromnego przepychu, a na stadionie zgromadzono mnóstwo fajerwerków które miały uświetnić całe wydarzenie.\n\nPrzybycie cesarza zostało okraszone wielkim wiwatem ze strony legionistów, których to Ricardus pozdrawiał ciepłym uśmiechem i skinięciem ręki gdy mijał ich w swojej złotej kwadrydze. Za cesarzem podążali pretorianie, którzy wieźli ze sobą wóz z żelazną klatką w której spoczywał pokonany i upokorzony Kowalski. Widok był to smutny, a sam profesor-hetman był dobity jeszcze dodatkowo faktem, że tak właśnie ludzie cieszyli się z jego upadku. Z ogromnym aplauzem. Złotą wolność zamienili na cesarskiego gladiusa.\nNa samym rynku podczas przemowy cesarza Ricardusa tłum coraz bardziej zaczął przekonywać się do swojego nowego namiestnika. Całość wystąpienia zakończyła się koncertem, lecz bynajmniej był to festiwal w Jarocinie. Pod strażą żołnierzy, Kowalski został wyprowadzony na scenę by móc zaintonować po łacinie słowa piosenki:."
calisia.17.a: "Veni, vidi, cecini."

calisia.18.t: "Ekwici Sarmaccy"
calisia.18.desc: "- A co to, kurwa, ma być? \nPrefekt Quintus patrzył z niedowierzaniem na stojący przed nim szereg odzianych w szlafroki jeźdźców w workowatych spodniach. Niektórzy mieli czapki w andyjskim stylu - takie, które w lepszych czasach kojarzono z ówczesnym premierem Tuskiem. Inni nosili prowizoryczne hełmy i srebrzyste kombinezony przypominające rybią łuskę, które podobno miały wyglądać jak zbroje lamelkowe. \n- Słyszeliście kiedyś o łaźniach albo brzytwach, wy barbarzyńskie ścierwa? - zapytał prefekt. \n- Z całym szacunkiem, mocium panie - przywódca jeźdźców wysunął się naprzód - pod nową władzą nie chcieliśmy utracić swojej tożsamości ani pokaźnego zarostu. Ale skoro uznano nas za ekwitów Cesarstwa, uznaliśmy, że musimy się, ee... dostosować. Nadal jesteśmy Sarmatami, tylko tymi starożytnymi. Prawdziwymi, jeśli wolisz, mocium panie. \n\nCisza była równie niezręczna jak ich lamelkowe kombinezony. Po dłuższej chwili odezwał się młody optio. \n- Quintusie... Quintusie, nie denerwuj się... \n- Jak mam się nie denerwować? \n- Spokojnie, zlatynizują się... \n- Nie zlatynizują się! Nic się nie zlatynizuje! Nie dostanę drugiej takiej grupy ekwitów! Mieliśmy zwerbować porządnych jeźdźców, a nie jakichś niedoszłych gardłowych śpiewaków ze stepu! Założę się, że nie potrafią nawet oddać strzału podczas jazdy! \n\nJak na komendę kilka strzał pomknęło w stronę rzymskiej delegacji. Chybiły. Quintus zamyślił się na chwilę, aż jego koń runął na ziemię, a on sam wyrżnął twarzą w błoto. Sarmacki przywódca podjechał bliżej, podkręcając wąsa."
calisia.18.a: "- Pożyczę ci jednego z moich koni."

calisia.19.t: "Los dóbr Leszczyńskiego"
calisia.19.desc: "Nie był to pierwszy raz, gdy rodzinie Leszczyńskich odbierano majątki, lecz mógł być ostatni. \n\nGdy donośny dźwięk trąb zbliżał się coraz bardziej, hrabia Wojciech szykował się do ostatniego oporu, a jego słudzy chwytali za szable, miecze i wszelkie ostre przedmioty, jakie udało im się znaleźć. Bramy pałacu zamknięto, a w każdym oknie czekał strzelec gotowy na rozkaz otwarcia ognia. \n\nPlotka głosiła, że do zajęcia posiadłości wysłano cały legion. Jakże stosowne, że monarchia lechicka miała zostać unicestwiona przez swych odwiecznych rzymskich wrogów! A może jednak nie - pomyślał hrabia. Sprawę Lechitów podejmie przecież kolejny watażka w jakimś innym, spowitym mgłą zakątku dawnej Polonii. Nie ma potrzeby robić z tego dramatu. \n\nPrzechodząc korytarzami pałacu, Leszczyński zauważył portret swego wielkiego przodka: króla Polski, wielkiego księcia litewskiego, księcia Lotaryngii Stanisława Leszczyńskiego. Jego czyny i zmagania napełniły go inspiracją. Hrabia zatrzymał się i zamyślił. Co zrobiłby Stanisław? \n\nWojciech Edward I Leszczyński spierdolił więc ze swojego pałacu i uciekł do Francji."
calisia.19.a: "To u nich rodzinne."

calisia.20.t: "Cena nieposłuszeństwa"
calisia.20.desc: "Posłaniec wbiegł pośpiesznie do głównej sali, niemal bez tchu. \n\n- Szefie, przyjechał poborca podatkowy. Pierdoli coś o \"haraczu\". \n- Znowu? To już trzeci raz w tym miesiącu. To musi być jakaś pomyłka. Odeślij go i dopilnuj, żeby nie dostał ani grosza. \n\nPaweł doświadczył już wielu najazdów w latach po Upadku. Niemcy byli dopiero początkiem. Od tamtej pory rzadko zdarzał się miesiąc, w którym jakaś banda łupieżców nie próbowała spalić i ograbić jego ziem. Przywykł także do okupacji następujących niemal dwa razy w roku. Limanówka przechodziła z rąk do rąk częściej, niż potrafił zliczyć, a pod naporem niezliczonych ataków i tyrańskich władców nauczyła się bronić. Prywatny garnizon, pułapki na całym obwodzie majątku... stanowczo zbyt wiele zachodu jak na skromne łupy zgromadzone w środku. \n\nCzuli się bezpieczni. Wielkoduszni pretorianie musieli mieć kłopoty administracyjne i omyłkowo wysłali urzędnika pod niewłaściwy adres. Paweł spodziewał się, że emisariusz wróci z przeprosinami. Zamiast tego przyprowadził pod ich próg armię, gotową uczynić przykład z każdego, kto ośmieli się sprzeciwić Prefektowi. \n\nLimanówka stawiła piekielny opór. Zanim pierwsze oddziały dotarły do jej granic, połowa awangardy już nie żyła, a reszta musiała haniebnie się wycofać. Lecz za każdego poległego legionistę do walki stawało dwóch kolejnych niczym mściwa, tysiącgłowa hydra. Z każdą minutą najeźdźcy zbliżali się coraz bardziej, ignorując straty dzięki niemal fanatycznej, żelaznej dyscyplinie. W końcu obrońcom zaczęła kończyć się amunicja. Trzeba było ją racjonować. Napastnicy deptali ciała poległych towarzyszy i parli niepowstrzymanie naprzód, aż Paweł uznał, że nie ma wyboru i wywiesił białą flagę. \n\nDowódca obrony posiadłości dostąpił litości. Tak przynajmniej nazywali to pretorianie. Paweł miał przeżyć kolejny dzień, zmuszony patrzeć, jak cały jego dobytek płonie na jego oczach. Ilekroć pokonany właściciel odwracał wzrok od stosu pochłaniającego dom, trzask bicza oprawców zmuszał go do ponownego spojrzenia. Pozostawiony na wsi bez jednego denara przy duszy, od tamtej pory wędruje po kraju - niespokojny tułacz spędzający tak ostatnie dni. Co miesiąc wraca do Limanówki, by oddać hołd poległym towarzyszom i sługom. Ich martwe ciała do dziś wyznaczają drogę, wisząc na przydrożnych krzyżach jako ponure przypomnienie tego, co spotyka każdego, kto ośmieli się wejść pretorianom w drogę."
calisia.20.a: "Gdy świece zgasną, wraz z nimi przeminie pamięć."

calisia.21.t: "Homo Novus"
calisia.21.desc: "Kieliszek wina wieczorem? Czemu nie - pomyślał Janusz. Dawno już nie pił takich specjałów. Choć był przewodniczącym rady miejskiej Jarocina, nie narzekał na nadmiar gotówki. Po pierwsze był jedynie wykonawcą rozkazów władz Eurokommissariatu, po drugie w czasie kryzysu gospodarczego rząd centralny ciął wydatki, gdzie tylko mógł, a słaba administracja podległa nie była nawet w stanie głośno zaprotestować. Ostatnie miesiące przeżył na ziemniakach i cebuli. A teraz, cholera, było jak w raju. Ci Kalizjanie w niedorzecznych zbrojach pozostawili go na stanowisku i dzięki nowemu prawu o nazwie Constitutio Calisiana wymagali jedynie, by w pracy nosił togę. Podnieśli mu pensję, a na stół wróciły pomidory, pieczywo chrupkie, olej rzepakowy, jabłkowy ocet balsamiczny i, co najważniejsze, wino. Sprowadzane z Bułgarii, lecz nazywane Trackim. Janusz od dawna nie czuł takiej dumy jak podczas niedawnego przyjęcia z okazji swoich 45. urodzin. Widział zdumienie na twarzach wszystkich niższych urzędników i dawnych znajomych, którzy dziś kopali rowy, by przeżyć, gdy oglądali antyczny przepych jego willi. Wiele rzeczy musiał im wyjaśnić osobiście - że nie wypada jeść na siedząco, lecz na leżąco, że wino należy rozcieńczać (choć oczywiście dotyczyło to wyłącznie gości) oraz że octu balsamicznego się nie pije. Wprawdzie o tym ostatnim wiedzieli, ale nie zaszkodziło im przypomnieć. W końcu byli barbarzyńcami ledwie muśniętymi przez cywilizację. Z uśmiechem na ustach Janusz rozmyślał o wszystkich żałosnych próbach latynizacji imion - jakiś Tomasz przedstawiał się raz jako Tomcus, innym razem jako Tomasius i tak dalej. Tymczasem jego imię - Ianus - brzmiało należycie dostojnie i kalizjańsko, bez żadnej dziwaczności. Przewodniczący rady miejskiej. Musiał jeszcze trochę poduczyć się łaciny, ale jedno zdanie znał już na pamięć i często go używał:"
calisia.21.a: "Nullum magnum ingenium sine mixtura dementiae fuit."

calisia.22.t: "Przedstawienie musi trwać"
calisia.22.desc: "- Muszę przyznać, Cornelio, że to bardzo miło z twojej strony, iż załatwiłaś nam bilety na tak wielkie widowisko. Ostatnio w mieście jest potwornie nudno i przydałaby mi się jakaś rozrywka - postawna dama mówiła z całą fałszywą uprzejmością wyższych sfer. \n- Och, daj spokój, kochana. Wiesz, że to żaden kłopot. Mam tylko nadzieję, że spektakl sprosta oczekiwaniom - odpowiedziała matrona z wyraźną nutą dumy z nowo zdobytego statusu. Szlachecki styl życia jej odpowiadał, a nieustanne, agresywne obnoszenie się z bogactwem otworzyło przed nią niemal wszystkie drzwi Cesarstwa. \n- Nie martw się o to. Odbyłam małą... rozmowę z jednym z lanistów. Sprowadzają świeżą krew. Pojmanych barbarzyńców. Wiesz, co to znaczy, prawda? \n- Oczywiście. Będą zdesperowani. \n\nObie zachichotały, po czym głośno przeszły do innych tematów. Przerwał im dopiero głos konferansjera. \n\n- Panie i panowie, mam nadzieję, że jesteście gotowi na niezapomniane widowisko! Chcieliście akcji i właśnie ją dostaniecie. Przygotujcie się na widok odważnych wojowników oraz straszliwych bestii walczących o życie, śmierć i wolność! A na początek zobaczcie, jak banda odrażających rozbójników mierzy się ze stadem wygłodniałych karpackich wilków! \n\nWalka Szymona była piątą tego wieczoru. Umysł przesłaniały mu obrazy zniszczenia. Jego rodzina zginęła z rąk tych samych potworów, które miał teraz zabawiać. Gniew przesączał się przez całe ciało. Gdy tylko zabrzmiał sygnał rozpoczęcia rundy, rzucił się na przeciwnika. Jego częściowo zardzewiały gladius nie mógł równać się ze starannie utrzymywaną zbroją miejscowego czempiona, lecz Szymona to nie obchodziło. Skoro miał umrzeć, równie dobrze mógł dokonać ostatniego aktu zemsty. Precyzyjne cięcie rozorało mu ramię. Nie czuł bólu, nawet gdy ostrze wbiło się głęboko w ciało. To była jego szansa. Doskoczył do wroga, przełamał obronę i dźgał go raz za razem, aż na ziemi pozostała jedynie martwa powłoka dawnego gladiatora. \n\nWyczerpany zwycięzca stanął wreszcie przed oszalałym tłumem. Nasyciło to jego żądzę krwi i choć liczyła się dla niego wyłącznie zemsta, czekał jednak na wolność. \n\n- Cesarz zarządził śmierć! - zawołał radośnie konferansjer. \n\nWśród huku i szalejącej adrenaliny Szymon nawet nie usłyszał wyroku. Triumfując, przyglądał się twarzom swoich oprawców z pogardą. Wiedział, że pewnego dnia powróci, by zemścić się na każdym bez wyjątku. \n\nPalący ból przerwał jego myśli. Padł na kolana. Wszystko pociemniało..."
calisia.22.a: "...a tłum wiwatował."

calisia.23.t: "Elegancja polityki"
calisia.23.desc: "Niewielu zachwycało się bogactwem kultury Calisii równie mocno jak Sebastianus. Większość jego kolegów odrzucała udawaną tożsamość Res Publici. On kpił z nich wszystkich. Po dziesięcioleciach rozkładu Polskę i jej kulturę zaczęto kojarzyć z najgorszymi odmianami moralnego zepsucia. Cesarz wskazał nową drogę, pełną ogłady i blasku klasycznego złotego wieku. Sebastianus przyjął tę wizję całym sercem, a jego twórczość literacka wspierała Calisię w najcięższych chwilach. Za lojalność miał zostać nagrodzony. \n\nOdkąd otrzymał mandat senatorski, z podekscytowania ledwie przesypiał noc. Perspektywa zmierzenia się z duchowymi spadkobiercami Cycerona w najwspanialszych pokazach teatru retorycznego motywowała go jak nic innego. Niemal cały wolny czas spędzał na rozważaniu wyimaginowanych dyskusji i pisaniu mów, które miały porwać serca i umysły. W długo wyczekiwanym dniu oficjalnego wprowadzenia do izby młody deputowany, z błyskiem w oku i sprężystym krokiem, ruszył ku bogato zdobionej marmurowej budowli, która do końca kadencji miała być jego drugim domem. \n\nChoć widywał gmach niemal codziennie, Sebastianus nie potrafił rozstrzygnąć, czy bardziej zapierał dech z zewnątrz, czy od środka. Senat był dla niego wyspą cywilizacji na bezkresnym morzu barbarzyństwa. Każdy stuk płytek podłogowych budził nowe marzenie o odzyskaniu ogłady utraconej przez stulecia. Dotarł do ozdobnych drzwi izby. Był gotowy. A przynajmniej tak mu się wydawało. \n\n- NA PIZDĘ JUNONY, ANDREASIE - NIE MOŻESZ NAPRAWDĘ WIERZYĆ W TO, CO MÓWISZ. TO CZYNIŁOBY CIĘ GŁUPSZYM OD AWENTYŃSKIEGO OSŁA. CHOĆ I NA AMEBĘ SIĘ NIE KWALIFIKUJESZ. \n- ODEZWAŁ SIĘ - JESTEŚCIE BANDĄ ZŁODZIEI I WYZYSKIWACZY! NAJLEPIEJ BYŁOBY PRZYBIĆ WASZE SKORUMPOWANE ŁAPY DO DRZWI SENATU. \n\nTe słowa doprowadziły tłum senatorów do szału. A może zrobił to but rzucony przez jednego z Optymatów. Tak czy inaczej, dobrze, że liktorzy odeszli, bo inaczej Petrus Caletus z pewnością użyłby jednego z ich fasces, by zatłuc rozwścieczonych Popularów i wyrzucić ich z budynku. \n\nA w kącie tego wszystkiego stał Sebastianus - bez słowa, z rozdziawionymi ustami. Cywilizacja naprawdę upadła, a Calisia była centrum jej zagłady. Ignorując zamieszanie, zatoczył się zrezygnowany w stronę swego miejsca. To bez wątpienia będą potwornie długie lata."
calisia.23.a: "Dość powiedzieć, że nie będzie się ubiegał o reelekcję."

calisia.24.t: "Legio się rodzi"
calisia.24.desc: "- Słuchaj, na pewno może wiele wnieść, ale to nie wystarczy. To nie jest wiarygodna metoda rekrutacji. \n- Jest profesjonalistą. Legiony dużo zainwestowały w tę operację i wyraźnie widać, że się opłaciło. \n- Dwie ciężarówki gorzały i laptop z szerokim wyborem pirackich filmów *nie były* dobrą inwestycją. Oby nie został zastawiony albo rozwalony. \n\nGdy stary mikrobus marki Mercedes zbliżał się do placu, na którym wczoraj odbywała się uroczystość, pod kołami grzechotały puste butelki po tanim winie marki Seneca. Poranne powietrze było zimne, a szare niebo ciążyło nad śmiertelną ciszą wioski. Dwóch dekurionów wysiadło w postapokaliptycznym otoczeniu i ruszyło ku budynkowi gminy, gdzie podobno \"zmagazynowano\" świeżych rekrutów gotowych do transportu do castrum legio. \n- Mam nadzieję, że w środku nie śmierdzi... NA JOWISZA, TOTALNE BARBARZYŃSTWO! - wrzasnął oficer najgłośniej, jak potrafił z zasłoniętymi ustami i nosem. Żaden z mężczyzn w środku się nie obudził. Ani ci leżący w holu, ani w biurach, ani na schodach, ani nawet w łazience. Żaden z ludzi wypełniających cały pieprzony budynek. \n- Jest ich dość na całą centurię. Potrzebujemy więcej ciężarówek. \n- Jest tu kartka. \"JESTEM W OGRODZIE Z TYŁU\". \nPrzekraczając nieprzytomnych mężczyzn, dekurioni dotarli do tylnych drzwi i na chwilę zamarli. \n\nCały ogród wypełniały namioty. Zwyczajny, porządny obóz, choć bez murów, rowów, czujnych strażników i z pewnością bez latryn. W każdym namiocie świeżych legionistów starannie ułożono do snu; nadal spali jak zabici. Jedyny dźwięk poza chrapaniem dobiegał z namiotu stojącego z tyłu, w miejscu zwykle zajmowanym przez dowódcę. \n\nWewnątrz, pośród stosów umów werbunkowych, Silvius Iacobinus rozsiadł się na krześle z opróżnioną do połowy butelką w jednej dłoni, drugą naciskając pozornie przypadkowe klawisze laptopa. \n- Nareszcie jesteście - wymamrotał. - Zaczyna mi się kurwa nudzić, odkąd w połowie Quo Vadis jeden z tych skurczybyków zajebał twarzą w laptop i teraz nie działa."
calisia.24.a: "In vino militas."

calisia.25.t: "Triumf w Equestrii"
calisia.25.desc: "Konin był pierwotnie jednym z najbardziej lojalnych lenn Gniezna. Lecz historia uczy nas że relacje feudalne są kruche, a osobiste konflikty wasali są w stanie rozsadzić od środka nawet najpotężniejsze królestwo. Włodarze Konina okazali się nie posiadać zbytniej lojalności wobec ich zwierzchniego władcy, a szybka zmiana lojalności została przypieczętowana kilkoma przywilejami i sekretnymi nagrodami. Toteż właśnie dlatego samo miasto uniknęło konsekwencji wynikających z wyniszczających działań wojennych. \n\nI to właśnie z włości mistrzów koni, Calisia może skorzystać by rozwinąć swoje umiejętności kawaleryjskie, które z pewnością przydadzą się w nieuchronnym starciu z Sarmackimi hordami. Użyteczność dla machiny imperialnej decyduje często o przetrwaniu w nowym systemie, i Konin dostąpił tego zaszczytu. Triumf w samym mieście odbył się - ale nie była to parada zdobywców nad upokorzonym miastem, lecz symboliczny uścisk dłoni pomiędzy uciskanymi wasalami a ich wyzwolicielami, którzy zrobią z nich nie jeńców, lecz partnerów.\n\nDlatego też cesarz Ricardus przybywając do miasta, wyglądał jakby przyjechał na wiec kampanijny rodem ze swojej przedupadkowej parlamentarnej kariery. Uściski dłoni, obfite stoiska z lokalnymi przysmakami, festynowa atmosfera, muzyka, śpiew i taniec. Koniński triumf mocno kontrastuje z innymi, bardziej przygnębiającymi obrazkami które widać podczas wojen unifikacyjnych. Gdyby tylko większość populacji posiadała takie nastawienie, jak ta nowa prowincja Calisii - Equestria."
calisia.25.a: "Equestria wreszcie zaznała pokoju."

calisia.26.t: "Pijackie gdybanie"
calisia.26.desc: "Gdy odcienie pomarańczu, różu i błękitu ścierały się na wieczornym niebie, a pierwsze gwiazdy szykowały się, by rozświetlić nadchodzącą noc, Cesarz wypoczywał na balkonie Cesarskiego Pałacu, spoglądając na miasto z kieliszkiem wina w dłoni. Było to jego miejsce ukojenia, z dala od nieustannych sporów Senatu, niedoli ludu, a zwłaszcza niekończącej się walki o wpływy między frakcjami Cesarstwa. Często przychodził tu, gdy ciężar rządzenia Calisią go przytłaczał. Zwykle uciekanie się do najgorszych nawyków było dla Ricardusa jedynie ucieczką, lecz tym razem miał powód do satysfakcji. Jego nieprawdopodobne państewko rozrosło się w regionalne mocarstwo, ciągnące się od kujawskich pojezierzy aż po śląskie wyżyny. A jednak czuł niepokój. \n\nGłęboki łyk. Kolejny kieliszek. Kolejne wspomnienie. Porzucony naród. Beznadziejne marzenie poza zasięgiem. \n\nNarastające wątpliwości skaziły cesarskie świętowanie. Czego właściwie dokonał? Zbudował państwo bardziej dysfunkcyjne niż wszystkie poprzednie? Calisia mogła wyglądać jak kolos, lecz od środka już się rozpadała. Niezgoda między czterema głównymi blokami władzy przemieniła planowane uporządkowane przywództwo w skorumpowaną sieć zmiennych sojuszy. Gdyby ich wzajemna wrogość wzrosła, mogliby rozszarpać kraj na kawałki, a on nawet by się nie zorientował. Rozciągnięcie rozpadającej się administracji na całe województwo mogło jedynie przysporzyć nowych problemów. \n\nKolejny haust. Ten przechodził przez gardło trudniej. Ricardus skrzywił się. Nawiedziło go nowe wspomnienie. Występ. Farsa. \n\nSpojrzał na ciągnące się po horyzont miasto. Nawet w obecnym stanie wyraźnie dostrzegał jego wady. W najlepszym razie prowincjonalne, samym widokiem rozwiewało wszelkie wyobrażenia o cesarskiej chwale. \"Wieczne Miasto\" było równie nędzną imitacją jak samo Cesarstwo - warstwą purpurowej farby na rzeczywistości nieodróżnialnej od dawnej. Jak długo fasada mogła wytrzymać? \n\nWestchnienie. Jeszcze kilka łyków. Butelka była pusta. Druga tej nocy. Szaleniec. Jego ofiara. \n\nTeraz widział to wyraźnie - tętniąca życiem metropolia z białego marmuru rozciągała się przed nim. Stare kamienice ustępowały wielkim projektom i cudom architektury, ciągnącym się po kres wzroku. Harmonijny Senat czuwał nad pomyślnością narodu. Warstwy społeczne mieszały się ze sobą, ciesząc nową epoką dobrobytu zarówno szlachty, jak i ludu. Cesarski sztandar powiewał nad całą Polską. Jego chwalebna Calisia... Invicta."
calisia.26.a: "Zasnął, a wizja ta wciąż krążyła mu po głowie."

calisia.27.t: "Między młotem a kowadłem"
calisia.27.desc: "Odkąd został obywatelem Calisii i postanowił zaangażować się w politykę Res Publici, były radny czuł się rozdarty między dwoma światami. Żaden nie wydawał mu się szczególnie interesujący, a ich jedyną siłą było nieustanne nagabywanie.\n\nJednego dnia odwiedzał go senator Popularów, Iacobinus, przynosząc butelkę wódki albo wina i proponując, by wypili ją razem. Innym razem przychodził Caletus, by debatować z nim o polityce, po czym wpadał w złość i wychodził obrażony. Potem zjawiał się Compa, przepraszał za to, że Iacobinus zwymiotował na dywan, i rozprawiał o historii Bizancjum oraz jej możliwym zastosowaniu w Calisii.\n\nOd czasu do czasu pocztą przychodziła też paczka, która w oczywisty sposób miała skłonić go do dołączenia do jednej ze stron. Zaczynało mu brakować miejsca na wszystkie komplety zastaw, dziwne pamiątki luźno związane z Rotą, misie ubrane w purpurowe i czerwone togi oraz, niech bogowie bronią, niezliczone pudełka czekoladek smakujących jak kreda.\n\nW pewnym sensie doceniał okazywany mu szacunek, ale często miał wrażenie, że to stanowczo za dużo. Pewnego razu Compa i Caletus jakimś sposobem zsynchronizowali wizyty, co doprowadziło do niezwykle niezręcznego spotkania przy herbacie. Ilski, znany teraz jako Flavius, widział, że obaj czekają tylko na idealną chwilę, by rzucić się sobie do gardeł.\n\nZwykle zadowalałaby go rola złotego środka, lecz udział w Senacie nie był taki prosty. Choć przynależność do jednej z dwóch partii formalnie nie była konieczna, w praktyce nie zaszło się daleko, jeśli nikt nie potrafił wyobrazić sobie człowieka w czerwieni albo purpurze, pod turem albo rysiem. W końcu musiał wybrać.\n\nOstatecznie przelały czarę zwyczajne kartki, jakie wręcza się komuś na urodziny. A właściwie dwie. Jedna podpisana wspólnie przez Popularów, druga przez Optymatów. Obie dotarły tego samego dnia.\n\nWtedy Flavius się poddał. Naprawdę nie mógł dłużej znieść tego \"rozpieszczania\". Jeszcze jeden tandetny prezent, a postrada zmysły. Usiadł z kartką papieru i zaczął pisać."
calisia.27.a: "Drogi Konsulu Compo,"
calisia.27.b: "Drogi Konsulu Caletusie,"

calisia.28.t: "Status Quo Aeternus"
calisia.28.desc: "Przeciągająca się polityczna walka wokół Lex Ager Publicus doprowadziła zwaśnione obozy do napiętego impasu. Gdy początkowy zapał zgasł, a sprawa zaczęła tlić się powoli, w grupie Andrzeja narastała obawa, że daleko poza ich zasięgiem Optymaci stopniowo przechylają szalę na swoją stronę. Paulus tymczasem ciężko pracował w stolicy, smarując tryby demokracji kilkoma niezbędnymi łapówkami, przysługami i tym podobnymi. Mimo znacznego napływu nowych senatorów równie łatwo przychodziło mu zjednywanie szeregowych członków izby, w tym kilku bardziej... ugodowych Popularów. Choć od ostatniego użycia swych wpływów minęło wiele czasu, na korytarzach władzy wciąż obowiązywała jedna zasada - pieniądze przemawiają do rozsądku i nie istnieją granice tego, co mogą osiągnąć. \n\nObozując w majątku swego pana i powoli wyczerpując skromne zapasy zgromadzone na bunt, chłopi mogli jedynie mieć nadzieję, że początkowa większość jakimś cudem się utrzyma. Czy w ogóle kiedykolwiek istniała? Nie wiedzieli już, czy to tylko ich paranoja, czy resztki rozsądku kołaczące się z tyłu głowy. Dla nich trwało to tygodnie, może miesiące, niemal całą wieczność, ale rewolucja się nie waha. Choć jedynie bezczynnie siedzieli w granicach jednej posiadłości, buntownicy stylizowali się na komisarzy szybko nadciągającego światowego przewrotu, który obali zakorzenioną oligarchię. Z każdym dniem pogrążali się głębiej w urojeniach wielkości, być może podsycanych majakami z niedożywienia. \n\nW pewnym sensie odgłos powracającego rydwanu ich pana przyniósł ulgę, kończąc męczącą niepewność. Szybko pobiegli przed ganek, by stanąć twarzą w twarz z tak znienawidzonym człowiekiem. \n- Tyranie! Przybyłeś sformalizować kapitulację? W imieniu Wolnej Komuny Ludowej Studzianki przyrzekam okazać ci łaskę i pozwolić odejść z jednym wybranym przedmiotem, jeśli zgodzisz się współpracować. \n- Och, przestań marnować mój czas, Andrzeju - rzucił w niego kawałkiem pergaminu, niemal trafiając go w nogę. - Przeczytaj to reszcie swoich odmieńców. To ustawa, którą właśnie przyjął Senat. Dodam, że przy mojej znaczącej pomocy. Koniec zabawy. A teraz wracajcie na pole I ODRÓBCIE KAŻDEGO DENARA, KTÓREGO PRZEZ WAS STRACIŁEM! \nW trakcie czytania dokumentu zarozumiała pewność siebie chłopa ustępowała wyrazowi czystego przerażenia. Jak rażony piorunem padł na kolana i błagał właściciela, by powstrzymał się od upragnionej zemsty. - T... tak, panie, przepraszamy za chwilę słabości. Natychmiast - odpowiedział pokornie, pochylając głowę. Wiedział, że odtąd bicz będzie odnajdywał jego plecy codziennie, jeśli nie co godzinę."
calisia.28.a: "Rewolucja stłumiona w zarodku."

calisia.29.t: "Libertas Universalis"
calisia.29.desc: "Tygodnie debat nad reformą Ager Publicus okazały się dla Paulusa co najmniej katastrofalne. Gdy zajmował się w stolicy rzucaniem pieniędzmi w każdego senatora, którego mógł przeciągnąć na swoją stronę, wesoła kompania Andrzeja zajęła posiadłość właściciela. Paulus wiedział, że sytuacja jest tragiczna. Chłopi odcięli jego główne źródło dochodów, a kieszenie opróżniały się w alarmującym tempie. Tu łapówka dla kilku niezdecydowanych centrystów, tam prezent dla paru chwiejnych Optymatów; wszystko kosztowało, ale gdy sytuacja wróci do normy, zawsze zdoła odzyskać denary. Niewdzięczni poddani będą pracować na dwie zmiany, dopóki nie odrobią całej straty. Och, jeszcze za to zapłacą. \n\nGdy zbliżało się głosowanie i odesłano go do dworu, Paulus mógł tylko mieć nadzieję, że zrobił wystarczająco dużo. Napływające z obu stron poufne listy dowodziły, że miał znaczną większość - być może nawet zbyt wielką, by była prawdziwa. Przeglądał korespondencję i zaznaczał każdą deklarację poparcia na pogniecionej kartce. Prawie osiemdziesięciu senatorów zobowiązało się zagłosować zgodnie z jego interesem: każdy Optymata, większość Popularów, nawet kilku radykałów... Czy przesadził? Właściciel zaczął żałować niektórych bardziej panicznych darowizn. \n\nPo przybyciu do majątku i krótkim urządzeniu się w budynkach gospodarczych Paulus powitał nadchodzącego urzędnika z widoczną radością. Nie był to brutalny wojskowy typ, jakiego oligarcha się spodziewał, ale jeśli potrafił zastraszyć chłopów i zmusić ich do uległości, nie było na co narzekać. Wszystko było gotowe do ostatecznej konfrontacji. Widząc poruszenie, buntownicy kolejno wychodzili z dworu, oczekując swego losu. \n\n- Hmm, dobrze, ilu was jest? Około trzydziestu, tak? - urzędnik zaczął znudzonym, administracyjnym tonem. \n- Trzydziestu dwóch, proszę pana. I nigdzie się nie ruszamy. To teraz nasza ziemia! \n\nIgnorując obie strony, które obrzucały się wyzwiskami zbyt obscenicznymi, by umieścić je w raporcie końcowym, biurokrata wyjął przyrządy miernicze, obszedł całą posiadłość, a następnie wydzielił w jej tylnym rogu niewielką działkę z jabłonią i dwoma uschniętymi krzakami. \n\n- Dobrze, panie Stericusie, ta parcela przypadnie panu. Mogę przysłać kogoś, kto pomoże przenieść pański dobytek. \n- MOJA parcela? Tak mi dziękują za to, że samodzielnie pomogłem tym niewdzięcznym sukinsynom pogrzebać reformę? Powinni zasypywać mnie prezentami! Natychmiast powiedz mi, że w ramach rekompensaty dostanę lepszą ziemię! Żądam posiadłości nad Prosną! Gotowej do zamieszkania i ze służbą, która nie jest tak cholernie pyskata! \n- Ee, cóż, przykro mi to Panu mówić..."
calisia.29.a: "Reforma przeszła. To wszystko, co Pan dostanie. Tak samo jak każdy."

calisia.30.t: "Niespodziewana rada"
calisia.30.desc: "Urbs Calisia budziła się ze snu. Gdy ludzie szykowali się do pracy w nieśmiałym blasku porannego słońca, Imperator Ricardus Calisius cierpiał na potworny ból głowy.\n- Mam nadzieję, że wymyślę, co zrobić z nowymi ziemiami, bo inaczej czekają mnie kolejne pijackie audiencje obu frakcji. A tego nawet Bachus by nie przeżył! - mózg Calisiusa z trudem formułował jakiekolwiek myśli. - Muszę coś zjeść.\nW pijanym zamroczeniu szybko zdał sobie sprawę, że dał kucharzom wolne, a jego gość nie zostawił po ostatniej nocy żadnych resztek.\n- *Futuete*. To znaczy, że będę musiał wyjść i coś kupić.\nWłożył lnianą tunikę i proste drewniane sandały. Nie chciał umniejszać chwale cesarskiego urzędu, pokazując się publicznie w takim stanie. A co ważniejsze, nie chciał, by jacyś wazeliniarze zaczęli wychwalać go na ulicy. Pragnął tylko zjeść spokojne śniadanie i wrócić do pałacu, żeby dojść do siebie.\n\nWkrótce po opuszczeniu kompleksu jego uwagę przyciągnął zielony szyld sklepu Ranula. Szybko ruszył w jego stronę i wszedł do środka.\n- Przykro mi - powiedział sprzedawca z Ranuli, gdy poprosił o hot doga. - Dopiero otworzyliśmy i hillae calentes nie są jeszcze gotowe. Będzie pan musiał poczekać.\n- Dobrze - odparł Calisius i wyszedł zaczerpnąć świeżego powietrza, by złagodzić kaca.\nPo chwili podszedł do niego miejscowy menel.\n- Hej, widziałeś mojego kumpla Odysa? Miał znaleźć nam coś do picia, ale zniknął... Hej, ty jesteś tym cesarzem Calisiusem.\n- Nie, musiałeś mnie z kimś pomylić.\n- AVE CEZAR - menel nie przejął się odpowiedzią albo jej nie usłyszał i wykonał rzymski salut. Ten *niewłaściwy* rzymski salut.\n- Ciszej! Nie chcę zostać rozpoznany. Jak masz na imię? - próbował odwrócić rozmowę od swojej tożsamości.\n- Imię? Nie pamiętam. Wołają na mnie po prostu \"menel...\". Uch, moja głowa - najwyraźniej nie tylko Calisius zajęty był \"negocjacjami\".\n- To musi być Menelaos - pomyślał Calisius. - To wyjaśnia ognistoczerwone włosy.\n- W każdym razie - bredził mimo bólu - wiesz, co ja bym zrobił jak bym rządził? - nie czekał na odpowiedź. - Pozbyłbym się barbarzyńców. Albo ich szefów. Żeby zabrać im pieniądze. I za nie postawiłbym... pomnik samego siebie, a może nawet załatał te cholerne dziury w drogach. Takie rzymskie rzeczy, nie? Kupiłbym żołnierzom takie samo wyposażenie, żeby mogli posiekać każdego zbuntowanego barbarzyńcę. Co ty na to?"
calisia.30.a: "Muszę to zapisać."

calisia.31.t: "Pecunia non olet"
calisia.31.desc: "Za panowania Ricardiusa Calisiusa przeprowadzono denominację i wielu obywateli obawiało się, że ich majątki niesprawiedliwie stopnieją. Gdy do niej doszło, parafianie z Urusulus zebrali się i uknuli plan ocalenia jak największej ilości pieniędzy. Wysłali swoich przedstawicieli do księdza. \n\n- Ojcze! - powiedzieli. - Wiemy, że jesteś uczciwy i nauczasz drogi Bożej zgodnie z prawdą. Nie zabiegasz o niczyją przychylność, ponieważ nie zważasz na pogańskie obrzędy. Powiedz nam zatem, co sądzisz: czy godzi się wrzucać nowe pieniądze na tacę? \n\nKapłan dostrzegł ich dobre intencje i odparł: - Cóż, nie musicie ich przede mną ukrywać. Pokażcie mi monetę, którą chcecie ofiarować. \n\nPrzynieśli mu denara. - Czyj to wizerunek? - zapytał ksiądz. - I czyj napis? \n\n- Cesarza - odpowiedzieli. \n\n- Na pewno? Wygląda jakoś szczupło. Nieważne, może być. \n\nWtedy parafianie powiedzieli: - Ależ ojcze, czy Jezus nie nakazał oddawać Cesarzowi tego, co cesarskie? - po czym zostawili go i odeszli. \n\n- Aleście sprytni! - zawołał za nimi kapłan. - Cesarz nie zobaczy ani jednej z tych monet! Oszustw podatkowych uczycie się od czasów Lescusa Millerusa!"
calisia.31.a: "- Tylko nie proście mnie na weselu o tę piosenkę ze Shreka!"

calisia.32.t: "Labor Ipse Voluptas"
calisia.32.desc: "Od początku był to pomysł Premislausa. Szybko myślał, ten gość. Naprawa ciężko uszkodzonej Autovii A-II była pod każdym względem wyczerpująca, więc jak zabić czas? Oczywiście trzema skrzynkami najtańszego wina, jakie dało się zdobyć! Plac budowy leżał tak daleko od Urbs i właściwie od każdego miejsca, które przed Upadkiem miało ponad tysiąc mieszkańców, że była to niemal zbrodnia doskonała.\n\nZapach topionego asfaltu naprawdę psuł nastrój, ale tania gorzała smakowała na budowie o wiele lepiej, zwłaszcza przy takiej pogodzie. Może i był to rozcieńczony spirytus zmieszany z kartonem soku winogronowego i barwnikiem spożywczym, ale dla ciężko pracującego legionisty w sam raz. Wywinęli ten numer już trzeci, może czwarty raz. Pomagało rozładować napięcie i łagodziło trudy codziennej harówki. Do diabła, sprawiało nawet, że mieli większą ochotę pracować, gdyż nie byli wściekli na przełożonych za to, że kazali im kopać dziury, wypełniać je kamieniami i zalewać smołą.\n\nNa budowie wszystko szło pięknie, dopóki Conradus, kolejny mądrala, nie nadbiegł wzdłuż całego odcinka od przerwy w ekranach dźwiękochłonnych, machając rękami jak szaleniec i coś krzycząc. Dyszał, cały zlany potem, ale w końcu znalazł się dość blisko, by dało się go zrozumieć.\n\n- Chłopaki! Jedzie jebany inspektor! Chować gorzałę!\n\nW panice wszyscy legioniści natychmiast ruszyli do akcji. Działali jak w zegarku, rzucając puste butelki w krzaki i zakopując wciąż zakorkowane w luźnej ziemi przy taczkach. Chwycili łopaty albo ubijaki i ze wszystkich sił starali się przynajmniej wyglądać na ciężko pracujących.\n\nWkrótce zjawił się inspektor na swym wspaniałym rumaku - poobijanym Fiacie Seicento. Wysiadł z samochodu, który w zestawieniu z obwodem jego talii wydawał się maleńki. Bardzo ostrożnie przeszedł przez piasek i błoto, pilnując, by na jego nieprzyzwoicie drogie szaty nie osiadł nadmiar brudu. Nosił stosunkowo małą odznakę dumnie oznajmiającą jego niezwykle szanowane stanowisko, zdobyte - jak mawiał - ciężką pracą, choć wszyscy wiedzieli, że był zwykłym lizusem. Powierzchownie rozejrzał się po budowie, a na jego twarz wpełzł lekki uśmiech. Była to zapewne pierwsza odwiedzona dziś budowa, na której ludzie naprawdę ciężko pracowali. Kołysali się wprawdzie trochę przy robocie, ale przypisał to ogromnemu wysiłkowi. Obszedł teren, ledwie mijając kopiec ziemi skrywający wino, zapisał coś w notatniku i odjechał w tej samej zardzewiałej puszce, którą przybył."
calisia.32.a: "Brygada Robocza XII - wzorowe zachowanie na budowie."

calisia.33.t: "Wielka wędrówka"
calisia.33.desc: "Historia zwykła się powtarzać, lecz nigdy świadomie. Idee przeżuwano, przepakowywano w tanie, tandetne opakowania, a następnie sprzedawano zagubionym masom. Pomieszane fantazje o przeszłości i przyszłości kaleczyły ludzkie umysły i czyniły najbardziej niedorzeczne rozstrzygnięcia pożądaną możliwością. Ich brutalne, fizyczne konsekwencje spijano jak efektowne popisy kina klasy B i tragedie rodem z brukowców.\n\nGdy Polonię dotknął Upadek, w umysłach ludzi Wschodu i Zachodu pojawiła się nikła myśl, że wbrew popularnemu powiedzeniu *coś* rzeczywiście może się stać, a koniec znanego świata jest realną możliwością. Gdy Germania i Tartaria pogrążyły się w wewnętrznych walkach oraz wojnie domowej, myśl tę przyjęto powszechnie. Pewnego dnia ludzie nie tyle się obudzili, ile pozostali w gorączkowym śnie, w którym wszystko było możliwe, dopóki podtrzymywało strumień świadomości. \n\nKiedy fale uchodźców napłynęły do sukcesora Polonii, zwanego Calisią, trafili do miejsca nieco bezpieczniejszego, lecz o wiele dziwniejszego - swoistego mechanizmu radzenia sobie z traumą, terapii albo masowej ucieczki od rzeczywistości. Do pewnego stopnia zdawało to egzamin, lecz nie dla uchodźców. Byli obcy, liczni, hałaśliwi i poniżeni, zakłócali z trudem wywalczony spokój - a mechanizm znalazł sposób, by poradzić sobie także z nimi. Nazwał ich barbarzyńcami: nie-Kalizjanami, nie-obywatelami, ludźmi niższych cywilizacji. Brzmiało to dziwacznie - jak wszystko. Przede wszystkim było jednak upokarzające. \n\nLudzie Germanii Maior i Scytii, mieszkańcy upadłych i poniżonych państw, sięgnęli więc po nową-starą tożsamość. Mężczyźni z tygli kulturowych i wielokulturowych miast wskrzesili całkiem nowoczesne mity o straszliwych teutońskich wojownikach z Lasu Teutoburskiego i bezwzględnych Wandalach, o panach stepów i biczach Bożych. Ponownie zebrali się pośród największej burzy, jaką Europa widziała od mniej więcej stulecia. Dzięki temu nie musieli czuć wstydu ani strachu, stając naprzeciw nowych Rzymian."
calisia.33.a: "Barbarzyńcy wiedzieli bowiem, że raz już ich pokonali."

calisia.34.t: "Koń, jaki jest, każdy widzi - podobnie jak akwedukt"
calisia.34.desc: "Maximus stał przed akweduktem z zaciśniętymi ustami. \n- Cóż, robi wrażenie - powiedział do niezwykle zadowolonego budowniczego stojącego obok. \n- Prawda? Spójrz na ten marmur, te ogromne łuki... \n- No tak... - Maximus podrapał się po głowie. Potrzebował chwili, by ubrać myśl w słowa.\n- Powiedz mi tylko, skąd chcecie doprowadzić tę wodę? \nBudowniczego całkowicie zaskoczyło pytanie. Spojrzał na Maximusa, a potem na akwedukt wzbijający się ku chmurom. Trzeba przyznać, że tego dnia chmury wisiały dość nisko, lecz i tak było to coś. \n- Ale... co masz na myśli? \nMaximus głęboko westchnął. \n- Pokaż mi plany, według których to zbudowaliście. \n\nBudowniczy pobiegł do zabudowań gospodarczych i szybko wrócił z plikiem dokumentów. Potem otwierali je po kolei i wspólnie przeglądali. \n\n- O, tutaj, spójrz. Masz tu plan ogólny. A teraz zobacz, co spieprzyliście. \n\nBudowniczy porównał plan z rzeczywistym efektem, a jego twarz nieco pobladła. \n- Ee... \n- Na planie jest jebany tunel. Kanał. Akwedukty były przeważnie kanałami. A te, które nimi nie były, sprowadzały wodę z gór. Rozejrzyj się i powiedz, gdzie widzisz tu jakiekolwiek góry. Albo nie. Powiedz mi, jakim cudem zbudowaliście to zamiast kanału? \n- No, kiedy przyszli z zamówieniem i usłyszeliśmy, że chcą akwedukt, pomyśleliśmy... że... \n- Że co? \n- Że nie ma sensu zaglądać do planów, bo każdy wie, jak wygląda akwedukt. \n- Brawo. Powiedz mi teraz, jak mam go uruchomić. Jutro ma nim popłynąć woda, Cesarz ma być na otwarciu - Maximus złapał się za głowę. Zamknął oczy. Dość. Nie ma sensu za dużo myśleć. Bo jak człowiek myśli, to wybiega przed szereg. Trzeba działać. \n\n- Tiberiusie! Wezwij żołnierzy. Niech biorą wiadra. \n\nPrzez cały następny dzień i całą kolejną noc kohorta eskortująca Maximusa wchodziła na akwedukt i wnosiła wiadra napełnione wodą z pobliskiego jeziora. Powoli, lecz nieprzerwanie woda zaczęła płynąć w stronę Calisii. Skończyła się podczas ceremonii otwarcia, a dzień później cały akwedukt zamknięto i postawiono przy nim tabliczkę: \"Nieczynne, trwają prace konserwacyjne\"."
calisia.34.a: "I tak to się kręci w tej Calisii."

calisia.35.t: "Ego Enim, vel Contra Illum"
calisia.35.desc: "- Dobrze, w kwestii nowych bloków mieszkalnych ustaliliśmy, że okolice Bonum rzeczywiście nadają się pod zabudowę. Pola trzeba będzie wykupić od rolników, a z uwagi na skalę projektu grunt będzie wymagał dość kosztownego zagęszczenia, jednak jest to możliwe. Szacowane koszty widzą państwo w rogu slajdu, obok wykresu kołowego. Proszę mi wybaczyć na sekundę, zanim przejdziemy dalej.\n\nFlavianus prezentował dane zgromadzonemu zarządowi już od około półtorej godziny. Nie miał chwili, by odetchnąć ani napić się wody, co właśnie teraz robił. Presja emanująca z widowni była ogromna. Oto filary Calisii - konsulowie Caletus i Compa, kilku najbogatszych patrycjuszy w Urbs oraz Ces... no, nie Cesarz, lecz jeden z jego delegatów. Najwyraźniej był zbyt zajęty, by przybyć osobiście.\n\n- Przejdźmy zatem do kwestii Cesarskiego Pałacu... o rany... Zgodnie z planami przekazanymi zespołowi geodetów budowa wymaga obszaru mniej więcej 200 na 300 metrów. Według założeń teren ten musi znajdować się gdzieś w mieście. Pozostaje nam więc jedynie wyburzenie domów wzdłuż...\n\nZanim Flavianus zdążył przekazać złą wiadomość, konsul Compa wszedł mu w słowo, niemal zrywając się z miejsca. \n\n- Chcesz nam powiedzieć, że mamy wyrzucać ludzi z domów tylko po to, by zbudować jakiś pałac? Cała wieś stoi wolna i dostępna.\n\nFlavianus zupełnie nie był przygotowany na natarcie Konsula. Poczuł, jakby cios wybił mu powietrze z płuc. Nim zdołał ułożyć odpowiedź, konsul Caletus zwrócił się do Compy z zarozumiałym uśmiechem.\n\n- A gdzie byłby w tym prestiż? Myślisz, że Cesarz chciałby spacerować pośród błota i smrodu bydła? Osobiście wątpię, Andreasie. Pozwól młodzieńcowi mówić. \n\n- Petrusie, od kiedy tak przeszkadza ci nawóz? Czy to nie twój wspaniały pomysł, by Wille Senatorskie zbudować pośrodku bagna?\n\nW tej chwili obaj Konsulowie niemal już stali; Caletus powoli czerwieniał ze złości, podczas gdy Compa mierzył go nieodgadnionym spojrzeniem.\n\n- Andreasie! Jeszcze jedno słowo z twoich ust, a przysięgam na Jowisza, że skopię ci dupę.\n\nDelegat Cesarza i pozostali uczestnicy odsunęli się na krzesłach, jakby wyczuwali, co za chwilę nastąpi. Konsulowie stali już wyprostowani i dziko gestykulowali. Cokolwiek Compa odpowiedział Caletusowi, nie miało nawet znaczenia, gdyż obaj zaczęli mocować się przez stół konferencyjny, aż pod naporem ich połączonych sił część mebla całkowicie się rozpadła, pozwalając im dać wspaniały pokaz kalizjańskiej demokracji."
calisia.35.a: "Jak dzieci w przedszkolu."

calisia.36.t: "Tymczasowy retrofuturyzm Senatu"
calisia.36.desc: "Andreas Compa połknął kolejną tabletkę paracetamolu. Ostatnio męczyły go potworne, nawracające bóle głowy - i to nie tylko dlatego, że były ryzykiem zawodowym polityka. Odkąd z powodu remontu starego gmachu cały Senat musiał przenieść obrady do budynku tymczasowego, ból jedynie się nasilił. Zwłaszcza gdy ktoś przemawiał z mównicy. Właśnie to działo się teraz. Senator Bribanus przejął ledwie działający mikrofon i zaczął wyjaśniać, dlaczego należy podnieść opłaty dla kupców na Forum Calisianum. Pogłos rozchodzący się po sali gimnastycznej jednego z kalizjańskich liceów był porażający. Na twarzach senatorów siedzących w szkolnych ławkach dominowały grymasy znużenia zmieszanego z rezygnacją. Nagle Bribanus przerwał wystąpienie, a jeden z Konsulów polecił podwładnym rozdać karty do głosowania. Zajęło to dobre dziesięć minut. Po zakończeniu głosowania senator Compa złożył wniosek o przerwę, na który zgodzili się wszyscy obecni. \n\nKilka chwil później duża grupa senatorów paliła już papierosy w toaletach. Damską zajęli Optymaci, a męską Popularzy. \n\n- Panie i panowie, tak dłużej być nie może - powiedział Andreas Compa. - Ile można remontować ten budynek? Przecież czuję się, jakbyśmy zaraz mieli tu pisać maturę. \n- Niczego lepszego nie było - odpowiedział jeden z Popularów. \n- Dobra, podajcie nożyczki. Robi się duszno. \n\nCompa szybko je dostał i zabrał się do pracy. Ponieważ okno nie miało klamki, trzeba było grzebać nożyczkami w mechanizmie, aż coś kliknęło i dało się je otworzyć. Po tygodniach powtarzania tego rytuału Compa nabrał takiej wprawy, że udało mu się za pierwszym razem. Przez zakratowane okno wpadło rześkie powietrze, rozrzedzając atmosferę gęstą od dymu."
calisia.36.a: "Pozostaje mieć nadzieję, że tym razem dotrzymają terminów."

calisia.37.t: "Nadzwyczajne posiedzenie budżetowe"
calisia.37.desc: "- I...chcesz mi powiedzieć, że wydaliśmy całe złoto... na to? \nCinastovicus pokazał zdjęcie świeżo zbudowanego neorzymskiego kompleksu mieszkalnego. Prawa strona sali zaszemrała. \n- To jakaś ekstrawagancja rodem z cyganerii! Nie potrzebujemy styropianowego marmuru, żeby budować insulae dla plebejuszy! Czy wy w ogóle studiowaliście rzymską archi... \n- Uważaj na ton, Christianusie - przerwał Calisius. - Nie możesz zaprzeczyć, że mieszkalnictwo publiczne jest sprawą najwyższej wagi. \n- W przeciwieństwie do tej Dzielnicy Pałacowej - dodał Hvedorcus. - Ten bezsensowny pokaz bogactwa obróci się przeciw nam, jeśli zabraknie choćby jednego grosza dla potrzebujących. \n\nWybuchł chaos. Ricardus Calisius wstał z krzesła i ryknął jak za czasów starego parlamentu. \n- Uspokójcie się! Podjęliśmy te projekty, więc doprowadzimy je do końca. Rapienda rebus in malis praeceps via est! Musimy zacisnąć pasa w wydatkach społecznych, aby nie zaniedbać spraw bardziej zasadniczych. \nLegioniści i Pretorianie nie powiedzieli ani słowa. Jakimś sposobem było to bardziej niepokojące niż wcześniejszy tumult. \n\n- To nie wystarczy. Ktoś będzie musiał ponieść ciężar politycznej ofiary - zauważył Compa. \n- Nadszedł czas, by patrycjusze udowodnili, że są kalizjańskimi patriotami. Niech bronią własnych interesów. \n- Patrycjusze wystarczająco długo wspierali masy. Tymczasem mamy mnóstwo barbarzyńców, którzy nie okazują należytej wdzięczności za przywilej przebywania na bardziej cywilizowanych ziemiach. Dlaczego nie wycisnąć najpierw ich, zanim przejdziemy do prawdziwych Kalizjan? \n\nSytuacja jest jasna - pomyślał Cesarz. Wszystko sprowadza się teraz do tego, co Senat chętniej zaakceptuje... i za jaką cenę."
calisia.37.a: "Przynajmniej nie sprawdzili cesarskich rachunków z SuperCoeno..."

calisia.38.t: "Turma Insulae"
calisia.38.desc: "Damianus wracał spokojnie z siłowni, bo był to dzień nóg i nie chciał się potknąć. Zbliżał się wieczór, słońce zachodziło, a nadciągała środowa noc - najlepsza pora dla ziomków z osiedla. Każdy wie, że w środowa noc to wódy czas, a ponieważ czwartek to taki małym piątek, na logikę dzisiaj środa, to powoli można zaczynać. Nagle głośne dudnienie kazało naszemu bohaterowi przystanąć i wsłuchać się w słowa dobiegające zza rogu.\n\n\"CHWDV, JV 100%, TAK ŚPIEWA CAŁA CALISIA PO NOCY...\"\nMuzyka z samochodowego głośnika niosła się po całej dzielnicy. Damianus uśmiechnął się, bo wiedział, kto za tym stoi. Za rogiem zobaczył starą, zardzewiałą kupę złomu - pomarańczowego Polonicusa z trzema białymi pasami - a obok swoich przyjaciół, Valusa i Adalbertasa. Otwierali już zimne piwa zacnej, taniej marki Urus.\n- Iuventus Calisia to najlepszy klub! - krzyknął Damianus, a oni odpowiedzieli:\n- A kto nie wierzy, to chuj mu w dziób! \n- Co tam, ziomki? Co robimy dziś w nocy?\n- Byliśmy już w Supernovej, ale dupy nie biorą, a jakieś lamusy z rewiru Legionowego tam się kręcą. Czekaliśmy na ciebie. Trzeba im najebać. Masz, napij się - powiedział Valus, wręczając Damianusowi puszkę zimnego browara. Ten opróżnił ją jednym haustem i wrzasnął z podniecenia.\n- Dobra, dawajcie tych skurwysynów! Adalbertas! Odpalaj furę!\n\nPięć minut szaleńczej jazdy przez czerwone światła później nasza trójka podjechała pod najbardziej podejrzany klub nocny w mieście. O tej porze zwykle można było tam spotkać tylko pracujące dziewczyny i wyznawców Bachusa. Tym razem siedziała tam jednak grupa czterech typów, którzy nie byli stąd. Jasne, mieszkali kilka ulic dalej, ale to już inny rewir. A kodeks ulicy mówi jasno - kto na nieswoim rewirze się kręci, ten wpierdol obskoczy i chuj.\n- Ej, lamusy! Spadać, to nie wasz teren!\n- Bo co, kurwa?\n- Bo ten tutaj spuści wam wpierdol jak pod Alezją - Valus wskazał na Damianusa. \nPrzybysze jednak się nie przestraszyli; w końcu było ich czterech, a naszych chłopaków tylko trzech. A kodeks ulicy mówi... Cóż, tak czy inaczej mieli przewagę liczebną. Takie sytuacje nigdy nie kończą się dobrze. Ani spokojnie.\n\nGdzie dwóch się bije, tam trzeci korzysta, lecz tym razem nie skorzystał nikt, a już zwłaszcza miejska społeczność.\nKolejny piękny dzień na kalizjańskich osiedlach dobiegał końca. Bójka w klubie, kilka wybitych zębów, skradzione rydwany i pomazane ściany bloków. Jakiś pijak znowu rozwalił znaki drogowe, a gliny zjawiły się długo po tym, gdy wszyscy już zniknęli."
calisia.38.a: "Szkody oszacowano na trzy denary i czternaście sestercji."

calisia.39.t: "Nieprzystosowanie do współczesności"
calisia.39.desc: "W starym, cichym domu siedziała rodzina Boreico. Byli uchodźcami z Posnanii. Uciekli przed fanatykami Nowego Syjonu do Calisii, gdzie osiedlili się w opuszczonym budynku. Nikomu szczególnie nie przeszkadzali, bo sami również nie przepadali za ludźmi. Woleli własne towarzystwo, które uważali za jedyne na odpowiednim poziomie. \n- Silentium! - powiedział dziadek do dziecka, które mamrotało zbyt głośno. - Panie Dziadku, Plenus venter non studet libenter, proszę zauważyć, że Mistrz raczył napisać: \n\nWszczął się naprzód szmer, potem gwar i krzyk wesoły,\nJak w ulu pustym, kiedy weń wlatają pszczoły.\nBył to znak, że wracali goście z polowania,\nI krzątała się służba około śniadania.\n\n- Brawo! - powiedział dziadek i w nagrodę podał chłopcu kromkę chleba. \n\nNagle drzwi domu otworzyły się z hukiem. A dokładniej runęły na ziemię pod naporem kilku rosłych żołnierzy. Jako pierwszy wszedł dziwny mężczyzna w białej todze, który jak gdyby nigdy nic zaczął kreślić kredą prostą linię po drzwiach, a potem po podłodze. Następnie stanął pośrodku salonu, rozejrzał się z wysuniętym językiem i krzyknął: \nNatychmiast wynieście mi stąd ten stół! \n\nŻołnierze szybko wykonali rozkaz, wyrzucając skromnie zastawiony stół przez okno. Zaskoczona rodzina, nadal trzymając sztućce, nawet nie wstała z krzeseł. Wtedy ojciec postanowił się odezwać. \n\n- Co tu się dzieje, cui bono? \n\nNiski mężczyzna, nie przerywając kreślenia linii w miejscu, gdzie wcześniej stał stół, odpowiedział: \n- O co tyle zamieszania? Tutaj stanie Pałac Cesarza. O, a tu będzie palma. A tam, obok tej palmy, będzie wielka aleja z mnóstwem posągów! Aleja imienia Mnóstwa Posągów! A tam - ogrody. No wiesz; figowce, bananowce, daktylowce, wierzby płaczące, brzoza... A tam - pałac! Ogromny, przestronny, taka chata! I dziedziniec pełen tancerek, i wszystkie będą robić taaaaak! - architekt wyprostował się i radośnie zakołysał biodrami. - A tutaj... malutkie geranium. Tak. Pełen wypas. Wypas po pachy. Odrobinę wyobraźni! \n- Ale my mamy... \n- Panowie, wynieście te krzesła. Wojsko na was czeka. \n\nŻołnierze szybko wynieśli siedzenia razem z oszołomionymi domownikami. \n\n- Dziwni Ci ludzie - pomyślał architekt, wytyczając dalej ściany przyszłego pałacu."
calisia.39.a: "Trochę... starodawni jeśli mam być szczery."

calisia.40.t: "Geodeta-druid"
calisia.40.desc: "Louis nerwowo mieszał wielką chochlą w potężnym kotle. Wokół niego stało kilku krzepkich żołnierzy w perkalowych zbrojach, z wielką uwagą obserwujących jego pracę. \n\n- Boże, co mnie podkusiło, żeby tu przyjechać? - pomyślał. - Mogłem wcześniej zrozumieć, że coś tu jest nie tak. Najpierw zapłata miała być w euro, a potem w jakichś denarach czy innych sestercjach. Najwyraźniej Europa Wschodnia ma własne dziwne waluty. A po ostatnich przygodach w Monako naprawdę potrzebowałem pieniędzy... i bezpiecznej kryjówki. Jaki byłem naiwny... \n\n- Ile jeszcze będziemy czekać? - warknął ktoś z ciągnącego się daleko szeregu robotników. \n- Non, non! Zaraz będzie gotowe - odpowiedział nerwowo, tak by wszyscy usłyszeli. \n\nCholera, miałem tylko zbadać grunt i sprawdzić, czy nadaje się pod budowę jakiegoś pałacu. A ci idioci kazali mi przygotować napój dający nadludzką siłę. Przecież to chore. Jak oni mogą tak żyć? \n\nLouis dodał do gotującego się wywaru garść tymianku. Nigdy nie był szczególnie dobrym kucharzem, ale teraz musiał wykazać się pomysłowością, by ocalić skórę. Ugotował więc jedyną zupę, jaką znał - kapuśniak. Miał tylko nadzieję, że zdąży uciec z miasta, zanim robotnicy i żołnierze zorientują się, że robi z nich głupców. \n\n- Eee... gotowe! - krzyknął niepewnie. \n- Już? - warknął jeden z żołnierzy. - A gdzie tu magia? Żadnych inkantacji ani innych galijskich zaklęć? \n- Uch, och, racja, już robię. Zapomniałem o jednej rzeczy, heh. \n\nPot spływał po czole starzejącego się geodety. Myśl, Louis, myśl... \n\n- Auauauauauauauauauauuauauau - wyjąkał, wymachując rękami nad kotłem. \n- Ee, teraz gotowe! \n\nRobotnicy bez mrugnięcia okiem ruszyli z małymi miskami po swoje porcje. Louis nalał pierwszemu trochę kapuśniaku. Po wypiciu robotnik dziko podskoczył, machając rękami, i pełnym sprintem pobiegł na budowę. Kucharz patrzył wybałuszonymi oczami, jak tamten chwyta taczkę pełną gruzu i bez większego wysiłku zaczyna ją opróżniać."
calisia.40.a: "Placebo czyni cuda..."

calisia.41.t: "Budexopolis"
calisia.41.desc: "W małym blaszanym budynku panował bałagan. Claudinus, właściciel przybytku, krzyknął do młodzieży, by zwróciła na niego uwagę: \n- CISZA, jesteśmy tu po to, żeby nauczyć się budować! To nie forum! \nAdepci obojga płci nieco ucichli i skierowali wzrok na Claudinusa. \n- Za karę pójdziecie do odpowiedzi. \n- Nie, panie Majstrusie, nieee... \n- Bez dyskusji! Sebastianusie, ty pierwszy na rozgrzewkę. Zaśpiewaj mi melodię do układania marmurowych bloków. \nUczeń zamknął oczy, by się skupić, po czym powoli zaczął śpiewać: \n\nPer tuos oculos virides, \nAmore insanio, \nOmnia nocte de te somnio, \nOculi tui lucent tam suaviter \n\n- No, Sebuś, byłaby piątka, gdyby nie jeden zasadniczy błąd. To piosenka do układania pustaków, a nie bloków marmurowych. Pomyśl jeszcze raz, nie śpiesz się... \n\nSebastianus ponownie zamknął oczy, zacisnął usta i wytężył umysł. Nagle szeroko je otworzył i zaśpiewał: \nEs insana, dico tibi. \nSemper non fuisti, somniare desine tandem \nNon es angelus, dico tibi. \nEs insana. Es insana. \n\nClaudinus szeroko się uśmiechnął i nagrodził wysiłek ucznia oklaskami. \n\n- Brawo, idealnie. Masz piątkę z odpowiedzi. I tak właśnie powinno być. Musicie znać klasykę, bo od tego zależy wasz sukces w życiu. Dobrze, następna osoba. Lucretio, powiedz mi - co trzeba zrobić, gdy podczas pracy widzisz przechodzącego przystojnego chłopaka? \n- Proste, zagwizdać. \n- Dobrze, a dlaczego? \n- Bo tak każe tradycja, panie Majster. \n\nClaudinus z trudem ukrywał dumę. Nowe czasy może i przynosiły zmiany, poprawki oraz nowe prądy, lecz dzięki jego wysiłkom dorobek wcześniejszych pokoleń budowlańców nie umarł, ale rozkwitał. Nie wątpił, że właśnie tacy pilni uczniowie utrwalą chwałę Calisii na wieki wieków. W końcu mieli do tego wszelkie niezbędne predyspozycje."
calisia.41.a: "Dobrze, możemy iść dalej."

calisia.42.t: "Przeklęci turyści"
calisia.42.desc: "Horatius zamiatał ulice Calisii wiklinową miotłą z kwaśną miną. Spoglądał z góry na grupę ludzi, którzy najwyraźniej przybyli spoza miasta, a nawet spoza Cesarstwa. Mieli na sobie zwykłe ubrania zamiast tóg czy tunik i - o zgrozo - pełne buty zamiast sandałów. \n\n- Przeklęci przybysze - warknął. - Tylko roznoszą brud tymi buciorami. Barbarzyńcy... TO JEST CALISIA, TUTAJ SIĘ CHODZI W SANDAŁACH!!! - krzyknął w ich stronę, grożąc pięścią. Najwyraźniej go nie usłyszeli, pochłonięci oszałamiającym pięknem i splendorem. \n\nIstotnie było co podziwiać. Cała ulica, jeszcze niedawno szara i smutna, lśniła teraz marmurem. Od czasu do czasu rozlegał się stukot rydwanów, a na Forum Calisianum za odpowiednią opłatą można było znaleźć towary, o jakich nie śniono nawet przed upadkiem Res Publici Polonica. Gdzieś w oddali wznosił się Cesarski Pałac, przewyższający wszystko, co zbudowano w pierwszym, drugim, a tym bardziej trzecim Rzymie. Nikt, kto tu przybywał, nie miał wątpliwości, gdzie dziś bije serce tej części świata. To jednak rodziło problem - splendor przyciągał wielu przybyszów pragnących się osiedlić. Horatius splunął na bruk, lecz szybko zrozumiał, co zrobił, i zaczął wycierać ślinę szmatą. \n\n- Przeklęci goście, to wszystko ich wina. Brudzą, śmierdzą, tłoczą się, obrzydzają życie, ech... Tyle wysiłku, a oni tylko wszystko zniszczą. I nawet nie powiedzą Salve mnie, rodowitemu obywatelowi Cesarstwa i Wiecznego Miasta. Co za obyczaje. Człowiek może oszaleć. Dobrze, że niedługo walka gladiatorów. Ostatnim razem, gdy klub piłkarski źle sobie radził, kibice wysłali zawodników na arenę. Przynajmniej będzie jakaś rozrywka w tym smutnym życiu. Podobno pozwolili nawet sprzedawać na trybunach rozcieńczone wino."
calisia.42.a: "Może ten dzień jeszcze dobrze się skończy."

calisia.43.t: "Wzloty i upadki plebejskiego życia"
calisia.43.desc: "Miete... ee, Exuperantius siedział na marmurowej ławce. W dłoni trzymał dzban świeżo napełniony tanim winem. Jak przystało na men... bezrobotnego plebejusza, niezbyt przejmował się całą tą wojną i polityką. Owszem, kilka lat temu spadły bomby, potem coś wydarzyło się w ratuszu, ale dla niego oznaczało to głównie konieczność pędzenia własnego bimbru jak za dawnych czasów. Wzdrygnął się na samą myśl. Pociągnął słodkiego wina z dzbana, by zmyć nieprzyjemne wspomnienia. To dopiero życie. Na ulicy można kupić wino prosto z dębowej beczki. Stary rynek, niegdyś podupadły, lśnił teraz nowością. Pomalowany na biało beton wyglądał niemal jak marmur, który udawał. Odnowione fasady staromiejskich budynków robiły na Exuperantiusie ogromne wrażenie; piękne wysokie kolumny dawały więcej osłony przed słońcem niż nieliczne ocalałe drzewa. Najbardziej olśniewał jednak ratusz. Zburzony i wzniesiony od nowa z ogromną kopułą pośrodku, przyciągał wzrok gości zdumionych, że w niegdyś zrujnowanym kraju można dokonać czegoś takiego. Exuperantius położył się zadowolony na ławce. Nagle usłyszał głośny turkot na bruku. Podniósł głowę i ledwo uskoczył przed nadjeżdżającym rydwanem zaprzężonym w dwa konie. Dzban wina spadł na ziemię i roztrzaskał się z brzękiem. \n\n- Przepraszam bardzo! Nie można tak ludziom przelatywać przed nosem. To nie autostrada! \n\nW odpowiedzi usłyszał jedynie trzask bata, gdy pojazd odjeżdżał. Cholera - pomyślał. Zbudowali te drogi zbyt szerokie. Teraz młodzi wariaci szaleją. Przyszło mu do głowy, by zawołać członka miejskiej kohorty, lecz szybko zrezygnował. W końcu nie zapłacił za wino."
calisia.43.a: "A było tak pięknie..."

calisia.44.t: "Milites Gloriosi"
calisia.44.desc: "Lud wiwatował, gdy legiony Calisiusa maszerowały ulicami Wiecznego Miasta, skąpane w jasnym południowym słońcu. Legatus Adalbertus Solicovus prowadził paradujących żołnierzy ku podium, na którym czekali już Cesarz Ricardus oraz Legatus Marcus Vinicius. Dla doświadczonego dowódcy była to najbardziej upragniona chwila chwały. Solicovus stanowił mózg większości reform, lecz to Vinicius był twarzą propozycji zwiększenia środków na projekt. Kampanie wojskowe nie są przecież możliwe bez politycznych. Te drugie okazały się równie krwawe, ale nareszcie przyniosły owoce.\n\nŻołnierze byli już tak blisko, że mógł zobaczyć ich w pełnej chwale. Równy marsz, funkcjonalne, lecz piękne zbroje, karabinki i te ryczące potwory - działa artyleryjskie! Trudno było przypomnieć sobie czasy, gdy Vinicius i Solicovus dopiero zaczynali ich szkolić. Gdy garstka posiadanych żołnierzy nie potrafiła uformować testudo nawet po zebraniu dostatecznej liczby policyjnych tarcz i pokryw od śmietników. Na rany Tartaru, nie rozumieli nawet rozkazów po łacinie. - Chyba widzę w nadciągającej kolumnie kilku chłopaków z dawnych czasów! - pomyślał z dumą Vinicius, gdy legioniści zbliżali się do wyznaczonego miejsca.\n\n- Ave Calisius - Solicovus pozdrowił Cesarza.\n- Ave! - odpowiedzieli jednym grzmiącym głosem legioniści. Centurioni przejęli następnie dowodzenie i ustawili żołnierzy w dwóch parach szeregów. Solicovus wszedł na podium. Nadszedł czas, by Vinicius wydał rozkaz, który doda paradzie jeszcze więcej blasku. - Salwa honorowa! - zarządził.\n- Legion! - Solicovus przystąpił do wykonania rozkazu. - Baczność! Drugi szereg - krok w tył, marsz! Broń - na pas! Spocznij! Salwa honorowa! Po trzy - ładuj!\nMiędzy strzałami odzywała się również artyleria ustawiona poza stolicą. Jakby sam Jowisz był jednym z wiernych żołnierzy Calisiusa. Tłum wiwatował! Dzieci machały plastikowymi figurkami legionistów, mężczyźni wyglądali, jakby chcieli pobiec do najbliższego punktu werbunkowego, a kobiety wpatrywały się w męskich żołnierzy... i oczywiście ich przystojnego dowódcę.\n- Tak, to zdecydowanie mój dzień - podsumował Vinicius."
calisia.44.a: "Brudnej auxilii nie trzeba tu pokazywać."

calisia.45.t: "Zmiana kierownictwa"
calisia.45.desc: "- Dobrze, Centurio! Co to jest?! - centurion Oppidus uniósł małego gada ze skorupą na grzbiecie.\n- Żółw! - odpowiedział nieuważny legionista. Kolega natychmiast zdzielił go w tył głowy. - Auć! To znaczy *testudo*.\n- Poprawnie! Nie wiem już, jak mam do was mówić, żebyście zrozumieli! To wasza szósta próba! Proszę więc. Bardzo uprzejmie. UFORMUJCIE CHOLERNE TESTUDO, ALBO DO KOŃCA SŁUŻBY BĘDZIECIE CZYŚCIĆ LATRYNY!\nŻołnierze wpadli w panikę, niezdarnie próbując ustawić się w szyku. I niemal im się udało.\n- Co to, kurwa, jest?\n- Żółw, którego nam pokazałeś, miał wysuniętą głowę - powiedział legionista, wystawiając głowę z formacji.\n- A teraz zróbcie chowającego się żółwia! - rozkazał centurion, podnosząc jeden z zapasowych hełmów i rzucając nim w głowę przemądrzałego żołnierza.\nPrzestraszony żółw schował głowę, dając legionistom ostatnią wskazówkę co do prawidłowego wyglądu formacji.\nLegionista ukrył głowę pod tarczami i Testudo nareszcie powstało.\n- Kurwa, nareszcie - Oppidus westchnął z ulgą. - Rozejść się.\n\n- Jakim cudem znalazłem się w tym miejscu? - Adalbertus Solicovus obserwował całą farsę ze swego namiotu. - Banda amatorów dowodzona przez amatorów. I szaleńców.\nŻadnego formalnego wykształcenia, żadnej metody, tylko wymyślanie koła na nowo. Częściowo sam był temu winien. Gdy przybył do Calisii z garstką wiernych żołnierzy, by ufortyfikować ją przed germańskimi najeźdźcami, mógł powstrzymać to szaleństwo. Jego bezczynność pozwoliła jednak Viniciusowi wykazać się jako przywódca, choć głównymi atutami tego przecenianego legata były jedynie szczęście i charyzma. Po udanych rajdach nawet ludzie Solicovusa stali się zwolennikami Legatusa Marcusa Viniciusa, człowieka odpowiedzialnego za doktrynę wojskową Cesarstwa. Dodać do tego niechęć Solicovusa do polityki i rzymskich wygłupów - i oto rezultat.\n- Teraz formacja manipulus! - centurion uznał, że oddział miał dość odpoczynku.\nNie mogąc zawrócić biegu historii, Solicovus musiał żyć ze swoimi błędami i jak najlepiej wykorzystać sytuację, w której się znalazł. Miał nadzieję, że Vinicius nadal będzie go słuchał, wykonywał swoją pracę i doprowadzi ten niby-rzymski projekt do końca. A jeśli się potknie, cóż, Adalbertusowi nie powinno być trudno znaleźć zatrudnienie gdzie indziej."
calisia.45.a: "Fortius quo Fidelius."

calisia.46.t: "Alis Aquilae"
calisia.46.desc: "Pierwsza parada lotnicza była wielkim wydarzeniem w całym Imperium. Świeżutkie samoloty prosto z linii produkcyjnej zostały udostępnione pilotom, którzy jednak nie mieli zbyt dużo czasu żeby się do maszyn przystosować, a symulatory nie zastąpią nigdy prawdziwych doświadczeń. Ale rozkaz to rozkaz, a jeżeli na twojej paradzie ma być sam cesarz, to nie możesz tak po prostu odmówić.\n\n- Popatrz Andreasie, lecą! Zooobacz jakie machiny! Nówki sztuki nieśmigane! - cesarz Ricardius wraz z resztą VIP-ów ze swojego podium mieli najlepszy widok na nadlatujące formacje odrzutowców, które w pewnym momencie złamały szyk i zaczęły wirować między sobą tworząc w powietrzu fantastyczny spektakl.\n- Pomyśl, ile to musisz trenować żeby móc bez problemu robić takie piruety!\n\nTymczasem na częstotliwości radiowej pilotów z pierwszej formacji panował chaos. W żadnym wypadku ich akrobacje powietrzne nie były częścią zaplanowanego spektaklu dla widowni.\n- CZERWONY PIĘĆ ODBIJAJ W LEWO\n- ZEJDŹ MI Z OGONU ŻÓŁTY TRZY-SIEDEM\n- CZY KTOŚ LECI PODE MNĄ? NIC NIE WIDZĘ!\n\nA Ricardus Calisius bawił się wyśmienicie.\n- Wiesz, jednak to też jest sztuka. Popatrz, nawet orła utworzyli. Cudowne, zobacz tamten nawet wypuszcza jakieś dymy z tyłu. Ooo, jakież to opanowanie, minęli się dosłownie o włos! \n\n- TUTAJ BAZA, WRÓĆCIE DO CHOLERNEJ FORMACJI!\n- DOBRA ŻOŁNIERZE - TESTUDO!\n- PANIE KAPITANIE, JAK MAMY ZROBIĆ TESTUDO W POWIETRZU?\n\nNa widownię właśnie wniesiono refreshments and more importantly - barbecue was ready.\n- O to ja może bym tej goloneczki spróbował. Kiedy będą lecieć drony?\n\n- PULL UP! PULL UP!\n- KURWAAAAAAAAAA\n\nW momencie konsumpcji przez cesarza mięsnych wyrobów z grilla, za sceną w niewidocznym już przez dygnitarzy miejscu, daleko za miastem nastąpiła eksplozja, ledwo słyszalna przez festiwal który odbywał się na ziemii. Jednego z pilotów przerosły możliwości pilotowania nowoczesnej maszyny i przez przypadek się katapultował. Na szczęście przeżył." 
calisia.46.a: "Samolot... miał mniej szczęścia."

calisia.47.t: "Mare Nostrum"
calisia.47.desc: "Ricardus siedział w pałacu i oglądał fotografie z raportów o niedawnych powodziach na północy Cesarstwa. Nie wyglądało to najlepiej.\n- Wygląda na to, że prawie połowa Sedinum jest pod wodą. Wały przeciwpowodziowe puściły. Przeklęty Viadrus! Przeklęty Bałtyk! Na litość Junony! Tam jest apokalipsa. Adalbertusie! Wyślij legion na pomoc. Czas odpowiedzieć atakiem!\n- Atakiem na kogo...?\n- Oczywiście, że na wodę! Przecież walczymy z powodzią. Co innego mamy zrobić?\n- Och, racja... To znaczy: tak jest! Ave Imperator!\n\nKiedy po kilku bardzo długich godzinach cały oddział przerzucono w rejon kryzysu, żołnierze zobaczyli, że kalizjańska marynarka już tam jest i próbuje odebrać im całą chwałę. Cichy konflikt między rodzajami sił zbrojnych miał dzięki rywalizacji uczynić je lepszymi, lecz zazwyczaj kończył się urażeniem rozdętego ego dowódców i zmuszał ich do wyścigu pod tytułem \"Kto wyda głupszy rozkaz?\".\nDowódca marynarki Titus Avillus był już gwiazdą widowiska. Ze swojej triremy wykrzykiwał rozkazy do żołnierzy, którzy na maleńkich łodziach ratunkowych próbowali wylać wodę z ulic, nabierając ją do wiader i wylewając z powrotem do morza. Nieskuteczne jak kalizjańskie akwedukty, lecz legat Adalbertus nie zamierzał przegrać z morską pomysłowością, nawet jeśli jej skuteczność była w najlepszym razie wątpliwa. Zwłaszcza jeśli była bezsprzecznie idiotyczna.\n- Legionarii! Spójrzcie na marynarzy w tych maleńkich łódeczkach! Pokażmy im, kto tu naprawdę rządzi! Formować szyk! Pojedyncza linia! - krzyknął legat. Żołnierze stali na plaży, czekając na kolejny rozkaz. Jeśli dobrze pamiętali, przybyli pomagać obywatelom, a nie walczyć z innymi Kalizjanami. Umysł żołnierza jest jednak osobliwym miejscem, w którym nie ma miejsca na wątpliwości ani ponowne rozważanie rozkazów.\n- Na mój sygnał zaatakować wodę! Pokażmy Neptunowi, kto tu rządzi!\nI wtedy to się stało. Zamknięte umysły legionistów otworzyły się na świat nowych możliwości. Przez szeregi przeszedł pomruk. Co oni, do cholery, mieli zrobić? Naprawdę? Lecz wątpliwość zniknęła równie szybko, jak się pojawiła. Kolejny rozkaz wymazał ją całkowicie, a jej miejsce zajęły mechaniczne odruchy.\n- DO ATAKUUUU!\n\nNa widok legionistów dźgających wodę mieczami i włóczniami dowódca Avillus był wstrząśnięty świętokradztwem. Neptun był ich patronem i niezależnie od okoliczności zawsze miał rację. Powodzie były jedynie przejawem jego istnienia, a marny legat wypowiadający wojnę potężnemu bogu dopuścił się zbyt wielkiej zniewagi.\n- ZADĄĆ W ROGI! LĄDUJEMY! CAŁA NAPRZÓD!\n- Ale dominusie, osadzimy okręty na mieliźnie!\n- WIOSŁOWAAAAĆ!\nI tak zrobili. Osadzili okręty na plaży, lecz dowiedli wyższości nad wojskami lądowymi, wypierając je z miasta. Kilku żołnierzy zostało rannych; na szczęście nikt nie zginął. Choć naczelne dowództwo może uznać inaczej po otrzymaniu raportów."
calisia.47.a: "A Sedinum nadal jest zalane."

calisia.48.t: "Skoczek Iacobinus"
calisia.48.desc: "PanIE i... p-pAnoWie! Rydwan... wysoki, jakieś metr... pięćdziesiąt! Zajebiście wysoki, no.\nSilvius Iacobinus wyraźnie odszedł od swoich zwyczajnych rzymskich zmysłów i był w stanie lepszej świadomości. W końcu in vino veritas.\n- No więc, panie i panowie, wskakuję, na czołg bojowy, sprawdzam, patrzę na stan techniczny...\nW tej chwili zaczął wykonywać lubieżne ruchy w stronę płyty pancernej i polizał wieżyczkę.\n- Jebane... promocje, dzwońcie pod 0700, pytajcie o rydwan bojowy... hic!\nNiezdarnie wdrapał się na podwozie, próbując odzyskać równowagę i wejść na wieżę.\n- Nowy... lakier, idealny stan techniczny i jebany ja, Iacobinus! Jedziemy, kurwa... dawaj! No, legionisto Marcusie, nadal... to się kurwa kameruje?\n- Tak jest!\n\nIacobinus doczołgał się do włazu dowódcy, wychylił... i runął głową w dół.\nŁUP!\n- O kurwa, rzeczywiście! Kurwa! Ała, wszystko mnie boli. Ała, ała... kurwa... au...\n- Coś ty, kurwa, zrobił?\n- Nieważne, wskakuj, jedziemy na tę... jebaną paradę...\n\nMarcus szybko otworzył właz i zajął miejsce kierowcy.\n- Hej, chyba układ kierowniczy jest zepsuty.\n- JEBAĆ kierofnicę, jedziemyyy! - powiedział Iacobinus, wyciągnął go z fotela i sam zajął jego miejsce. - Obsadzić stanowisko dowódcy!\nNie chcąc zostać ukrzyżowanym, Marcus posłuchał i patrzył, jak jego przywódca rusza... po czym mimo powtarzanych wrzasków o zatrzymanie przejeżdża przez mur willi.\n- Cholera! Jestem... hardkorem! - jęknął Iacobinus, gdy z willi wybiegła kobieta krzycząca coś o zerwanym kablu internetowym.\n- Kto tu na Jowisza, kierowcą kurwa był? - nadszedł Vigil.\n- Nie... ja... cholera - Iacobinus wyczołgał się z włazu, odpychając biednego Marcusa, i chwiejnie stanął obok gruzu oraz czołgu. Wyglądał, jakby miał zabić zarówno Vigila, jak i Marcusa."
calisia.48.a: "- Spokojnie... pojedziemy moim rydwanem!"

calisia.49.t: "Zbędna załoga"
calisia.49.desc: "Dźwięk wirnika śmigłowca z trudem przebijał się przez huk wzburzonego morza. Przez otwarte po obu stronach maszyny drzwi wpadały lodowate krople wody. Panowała całkowita ciemność. Z jednym wyjątkiem - ktoś palił cygaro. Jego czerwony żar rzucał nikłe światło na twardą, jakby wykutą twarz. \n\n- Optio Maximusie, przygotuj się. Zaraz wysiadamy - powiedział palący cygaro mężczyzna do postaci skulonej w cieniu. \n\n- Tak jest, Princepsie Ianusie - odpowiedział żołnierz, po czym zaczął rozwijać liny do kontrolowanego desantu. \n\nDowódca spojrzał w dal, gdzie na horyzoncie zaczęło migotać początkowo niewyraźne światło. Z każdą sekundą stawało się jaśniejsze. Zbliżali się do celu misji. \n\n- Panie i panowie, nie wahamy się. Wchodzimy i robimy wszystko dokładnie tak, jak na szkoleniu. Planowany czas operacji to cztery minuty i trzydzieści sekund. - Centurion odczekał kilka sekund i spojrzał na cygaro. Zaciągnął się, a narysowana na nim czarna kreska zniknęła pod naporem żaru. \n\n- Teraz. \n\nSześć sylwetek w czarnych kevlarowych zbrojach natychmiast wyskoczyło z obu stron śmigłowca. Strażnik stojący na burcie nawet nie zauważył, kiedy pilum przebiło mu pierś. Wpadł do wody niezauważony przez towarzyszy. Drugiego przeszył tytanowy gladius. Kamizelka kuloodporna nie stanowiła przeszkody. Ten sam los spotkał następnych siedemnastu przeciwników. Kiedy Cohortes Speciales zeszli pod pokład, nie minęła nawet minuta. \n\nGdy byli blisko celu, nagle usłyszeli alarm. Wyskoczyło na nich kilku strażników uzbrojonych w broń automatyczną. \n\n- Testudo! - warknął centurion, a cała szóstka rozłożyła dotąd złożone, zwarte tarcze z włókna szklanego. Po kilku sekundach wrogowie wystrzelali całą amunicję, nie zostawiając na scutum nawet rysy. Gladiusy uciszyły ich na zawsze. \n\n- Doskonale - pomyślał Ianus, zerkając kątem oka na cygaro, które nie wypaliło się nawet do połowy. Kopnięciem otworzył drzwi jednej z kajut i chwycił plik dokumentów. Pod biurkiem umieścił ładunek wybuchowy. \n\n- Mamy to, po co przyszliśmy. Wracamy. - Jak rozkazał, tak zrobili. Strażnicy ledwie ich opóźnili. Gdy tylko zajęli miejsca w śmigłowcu, uderzyła ich fala gorąca, a oczy wypełnił potężny blask pożaru. Ianus uśmiechnął się i wypluł do morza całkowicie dopalone cygaro."
calisia.49.a: "- Misja wykonana."

calisia.50.t: "Ranula Aeterna Vendix"
calisia.50.desc: "- Wasza Ekscelencjo, mam niestety złe wieści. Nie wiem do końca jak to powiedzieć bo sytuacja jest trochę trudna, ale...nie mamy ciemnego pieczywa. Może być białe?\nRicardus stał w kolejce do kasy w sklepie Ranula jak każdy zwykły obywatel. Ale to co usłyszał było jak splunięcie w twarz. Przecież jest na diecie, nie może jeść pszennego. W zasadzie to na trzech dietach, bo jedna nie spełnia wymagań kalorycznych, ale nadal - ciemne pieczywo to świętość.\n- Jak to nie ma? Dostaw nie macie? \n- Znaczy się...no mamy. Tylko że...szczerze powiedziawszy, nie mam pojęcia czy to pieczywo jest dobre. Nowy kalendarz nam trochę...popsuł obliczenia.\n\nNie dość, że wredny to jeszcze i bezczelny. Nie nakarmi go, i w dodatku jeszcze będzie narzekał na polityczne decyzje swojego władcy. Myśli Ricardiusa zmierzały w stronę coraz to bardziej agresywnych. Głodny nie był sobą, ale polityczne doświadczenie i opanowanie w sytuacjach kryzysowych wzięło na szczęście górę. \n- Dobrze, w takim razie poproszę z jasnym pieczywem.\nWyraz twarzy ekspedienta nie zdradzał żadnych emocji, ale w środku jego głowy rozgrywała się apokalipsa. Wiedział, że to co zaraz powie sprawi że następny weekend spędzi na arenie w Koloseum, a nie na działce w Colubredze. Mimo wszystko - zaryzykował.\n- Nie ma żadnego. A poza tym parówki są zimne. Nie stać nas na czynsz. Wandale już trzeci raz pomalowali witrynę sklepu. W zeszłym miesiącu naliczyłem czternaście kradzieży alkoholu. Imperium idzie na dno. Optymaci to złodzieje, a Popularzy to idioci.\n\nCalisius od dawna nie został tak zszokowany jak teraz. Nie przerażały go wieści o barbarzyńcach. Nie ruszały go doniesienia o morderstwach, porwaniach i wojnie. To wszystko sprawiało że zaczął zastanawiać się nad swoim bytem. Czy tracił kontakt ze społeczeństwem? Czy stawał się tym, co poprzysiągł zniszczyć? Jakim cudem nie było dla niego gotowego hot doga? Wtedy, jakby doznał objawienia, zwrócił się do kasjera:\n- Młody człowieku, przysięgam ci... naprawię tę sytuację. Masz rację. Nie możemy sobie pozwolić żeby w cesarstwie nie było pieczywa. Ciemnego, jasnego, jakiegokolwiek! Tak, tak. To musi być nasz priorytet...a macie może te takie dobre panini z promocji?"
calisia.50.a: "- Nie uwierzysz, Wasza Cesarska Mość. Nie mamy."

calisia.51.t: "Carpe Vinum"
calisia.51.desc: "To był słoneczny dzień. Legat Silvius Iacobinus uwielbiał w takie poranki przejść się do swojego ulubionego sklepu monopolowego po małe co nie co żeby dobrze rozpocząć dobę. Jego droga zazwyczaj wiodła również obok wielkiego magazynu w którym składowano różnorakie egzotyczne dobra na eksport, w tym lokalnie wytwarzane wina. O jakaż słodycz dla podniebienia kosztować najwspanialsze trunki produkcji imperialnej. Co prawda, testowanie win w przypadku Iacobinusa zazwyczaj kończyło się na upartym proszeniu o kolejne butelki w celu potwierdzenia jakości danego wina, co z kolei sprawiało że przed południem legat już był gotowy udać się na wymuszoną drzemkę.\n\nTym razem jednak coś było nie tak. Czuć było to w powietrzu, sytuacja była zła. Nie dość że sklep monopolowy był zamknięty, to znad rzeki dobiegały go jakieś krzyki. Jako porządny obywatel i jeden z generałów, udał się tam by sprawdzić sytuację i uratować dzień. Ale to co zobaczył przerosło jego najśmielsze oczekiwania. Pracownicy magazynu wylewali wino z beczek do rzeki ku oburzeniu miejscowych pijaków! Silvius zastanawiał się czy by nie dołączyć w proteście do krzyków miejscowej śmietanki, lecz nagle wpadł mu do głowy o wiele lepszy pomysł. Przypomniał sobie o własnej randze i wkroczył do owego magazynu niczym rycerz na białym rumaku.\n\n- Kto tutaj jest prefektem tego przybytku?! - wrzasnął donośnym głosem legat. Oczom ukazał mu się mierny urzędnik który był widocznie przerażony tą niezapowiedzianą wizytą. \n- A-ave Augustus, legacie. W czym możemy pomóc?\n- Co ma znaczyć ten proceder? DLACZEGO WYLEWACIE WINO?! TAK NIE MOŻNA!\n- Szanowny legacie, z całym szacunkiem ale nie jesteśmy w stanie go sprzedać, nie możemy nic przeznaczyć na eksport bo nikt już od nas nie daje rady skupywać rzeczy, musimy je spisywać na straty...to wylewamy. Co innego mamy robić?\n\nIacobinusowi zaświeciły się oczy jak gdyby dostał właśnie pod choinkę zestaw małego żula. Co prawda nie był pewien czy to aby na pewno nie jest sen, gdyż wielokrotnie marzył o takiej sytuacji, ale brak alkoholu w jego krwi sprawiał że był bardzo pobudzony. To jest to. \n- Kierowniku...skołujcie furmankę. Ja wiem co z tym winem zrobić. Przejmuje je na własność, jak będziecie mieli jakiekolwiek wino do utylizacji...przywieźcie do mojego domu. Wiesz gdzie mieszkam? Nie? No to ja powiem. Ale pamiętaj, to ważne, bo to rozkaz samego cesarza. Ani jedna kropla więcej nie może być zmarnowana. Bo inaczej wiecie. No, to zdrowie!\n\nI tak o to zapasy cesarskiego wina zostały uratowane przez dzielnego legata. Wziął na siebie ogromną odpowiedzialność, a jego poświęcenie nie zostanie zapomniane. A przynajmniej przez wszystkich innych, bo Iacobinus...z pewnością nie będzie pamiętał zbyt wiele."
calisia.51.a: "Zaiste kraina mlekiem, winem i miodem płynąca."

calisia.52.t: "Barbari ante portas!"
calisia.52.desc: "- Tarcze na mnie! Pojedyncza formacja! - krzyczał centurion próbując ustawić swoich żołnierzy w szyku. Kolejna fala german ruszyła na nich w nieładzie próbując przebić się przez zdyscyplinowanych legionistów trzymających straż na limes. Był to trzeci zbrojny wypad w ciągu jednego dnia, a każdy kolejny stawał się coraz silniejszy i liczniejszy. Jednak za każdym razem albo Germanie rozbijali się o siły limitanei niczym fala o skały, albo zostawali rozbici przez centurie ekwitów stacjonujące niedaleko. \n\nTak się stało i tym razem kiedy dwie setki German przeprawiło się przez rzekę Viadrus by pustoszyć wioski niedaleko grodu Cedene. Piechota związała walką siły wroga, by w odpowiednim momencie ustąpić miejsca nadjeżdżającej kawalerii. A jazda calisiańska była nie byle przeciwnikiem, największy postrach wśród barbarzyńców siały rydwany uzbrojone w kosy które ścinały wrogów niczym zboże. Szybka szarża zakończyła się całkowitym zwycięstwem, i na polu niedaleko mostu zebrali się legioniści z ekwitami by pogratulować sobie kolejnego wspaniałego zwycięstwa.\n\n- Salve, znowu ratujemy wam tyłki, może nauczylibyście się sami wygrywać bitwy,?\n- Dobra, dobra, wiesz co - lepiej skocz tym swoim rydwanem po jakieś wino. Chłopaków suszy.\n- W sumie dobry pomysł towarzyszu, wskakuj na konia, pomożesz mi nosić. \n\nW tym samym momencie okropny ryk przeszył niebiosa, jak gdyby siedem trąb zaczęło grać sygnał do rozpoczęcia apokalipsy. Zaiste, dla żołnierzy znajdujących się na granicy otworzyły się bramy piekła, a diabelskie kohorty ruszyły na polowanie. Na horyzoncie zaczęły majaczyć setki, a następnie tysiące sylwetek. Jednak to nie tysiące wojowników barbarzyńskich sprawiło że zamarła cała limes. Na przedzie poruszały się ogromne bestie wojenne, co najmniej kilkadziesiąt słoni bojowych kroczyło właśnie przed siebie by zniszczyć cywilizowany świat. Bębny zaczęły grać przerażającą muzykę, która tylko dopełniała widoku kataklizmu jaki właśnie zmierzał ku legionistom. Ci natomiast widząc co ich czeka kontemplowali ucieczkę. Byli wszak jedynie rezerwowymi żołnierzami, nie zaprawionymi w bojach legionami. Jeden z centurionów ekwitów zawrócił swój rydwan w stronę wroga, nałożył na głowę hełm, głęboko westchnął, i zakomenderował.\n\n- ŻOŁNIERZE CESARSTWA, FORMOWAĆ SZYKI! STAWIMY IM CZOŁA! SZARŻAAAAAA!,\n\nI tak oto jeźdźcy ruszyli przed siebie, w szaleńczym pędzie gnając wprost na spotkanie ze śmiercią. Reszta żołnierzy wiedziała że to jest dzień którego się obawiali, kiedy ich zguba przybyła na wielkich bestiach by położyć kres ich życiu. Wiedzieli, że cokolwiek nie zrobią - i tak już nie żyją. Więc z pieśnią na ustach, podążyli za kawalerią w samobójczej szarży prosto w otchłań, z której nie powrócił żaden z nich."
calisia.52.a: "Tak weszli do panteonu bohaterów."

calisia.53.t: "Najgorsi przegrani"
calisia.53.desc: "- I na dwa okrążenia przed końcem rydwan kalizjańskich zawodników zdecydowanie prowadzi przed rozklekotanym wozem Wenedów! Nasi reprezentanci najwyraźniej otrzymali błogosławieństwo Merkurego, skoro osiągają takie prędkości! Oto ponownie zbliżają się do Zachodniego Łuku. Spójrzcie, z jaką gracją pokonują zakręt... Och, wygląda na to, że Kalizjanie stracili przyczepność! Uderzyli w mur! A to znaczy... nie, to niemożliwe! Wypadają z wyścigu! Wenedzi właśnie ich minęli! Nawet nie spróbowali pomóc naszym dzielnym zawodnikom. Zwalniają. Jadą rundę zwycięstwa! Co za hańba! Panie i panowie, Wenedzi przekroczyli linię mety, a zatem technicznie rzecz biorąc - wygrali! \n\nPrzez tłum przeszedł rozczarowany pomruk, a wiwaty, które wcześniej wstrząsały fundamentami stadionu, ucichły w jednej chwili. Skromna delegacja kibiców Wenedów, stłoczona w jedynym sektorze przyznanym przez organizatorów, niemal oszalała ze szczęścia, wściekle waląc w ogromne bębny i prawie demolując całą trybunę. Kalizjanie po przeciwnej stronie próbowali tymczasem zrozumieć, co właśnie zaszło. Powoli, lecz nieuchronnie tłum wykorzystał wspólną moc umysłową, by dojść do jedynego naturalnego wniosku wyjaśniającego, jak ich czempioni mogli przegrać z drużyną kompletnych amatorów. \n- Oszuści! \n- Rozlali olej na torze, żeby nasi woźnice się rozbili! \n- Nie możemy pozwolić, żeby uszło im to na sucho! \n- Brać ich, chłopaki! \n\nFuria rozlała się po stadionie, jakby starannie zasiana i pielęgnowana przez boginię Irę. Radosna atmosfera wydarzenia całkowicie się ulotniła, a zwycięzców podczas rundy honorowej przywitała lawina szyderstw i buczenia. Gdy główny woźnica zespołu Wenedów wszedł na podium i uniósł trofeum przed oszalałą publicznością, w głowę trafiło go jedno z setek krzeseł rzuconych z trybun. Kiedy nieprzytomny upadł na ziemię z rozciętą całą skórą głowy, porzucono resztki pozorów cywilizacji, a fale czerwonych koszul runęły na mur oddzielający kibiców obu drużyn. Rozpętała się rzeź. Przyjezdni próbowali utrzymać linię, lecz wszystkie wyjścia były zamknięte i wkrótce napierająca na nich masa ciał okazała się nie do zniesienia... \n\n\nFRAGMENT RAPORTU SPECJALNEGO CESARSKIEGO BIURA STATYSTYCZNEGO O SKUTKACH SPARTAKIADY: \nUczestnicy: \nKalizjanie - 18425 // Wenedzi - 1627 \nZatrzymani: \nKalizjanie - 319 // Wenedzi - 17 \nHospitalizowani: \nKalizjanie - 109 // Wenedzi - 541 \nZgony: \nKalizjanie - 14 // Wenedzi - 892 \n\nWNIOSEK - Z uwagi na wzajemną nienawiść ludności stanowczo zaleca się unikanie organizacji przyszłych zawodów obejmujących bezpośrednią rywalizację sportowców kalizjańskich i wenedzkich. Każde takie wydarzenie należy klasyfikować jako imprezę wysokiego ryzyka, a patrol Vigiles powinien pozostawać w gotowości. Dla dobra Cesarstwa sprawą najwyższej wagi jest natychmiastowe odwołanie planów drugiej edycji Spartakiady."
calisia.53.a: "Przynajmniej mogą być dumni ze zwycięstwa... kiedy już dojdą do siebie."

calisia.54.t: "Famis Iudi"
calisia.54.desc: "Koszmar zacznie się dopiero kiedy otworzysz oczy. Wierzysz że jeszcze możesz być wolny. Obiecali Ci to. Wygraj - a okowy spoczywające na Tobie zostaną zerwane. Tym się motywujesz. To trzyma Cię przy życiu. Wdech. Wydech. Powtórz. Otwierająca się brama wpuszcza oślepiający blask dochodzący z zewnątrz. Arena jest otwarta. Nadszedł twój czas. Przez pięć sekund wiara Cię jeszcze nie opuszcza. Słyszysz ryk. Ale nie jest to odgłos ludzki, lecz zwierzęcy. Należy do potężnej bestii. Chwilę później do niego dołącza wiwat tłumu. Stoisz w bramie, lecz nie dostajesz żadnej broni. To nie jest zwykła walka gladiatorska. Ale i tak wychodzisz, chcąc chociaż przez chwilę poczuć na swojej skórze ciepło promieni słonecznych. \n\nKrok do przodu, drugi, trzeci. Jedna część areny jest odgrodzona od drugiej. Po przeciwnej stronie widzisz uzbrojonego w pilum legionistę. Podburza tłum do większego dopingu. Nie widzisz nigdzie jeszcze zwierząt. Rozlega się głos rogu. Żołnierz po drugiej stronie bierze zamach. Oszczep leci w twoją stronę. Nie masz za dużo miejsca do uniku. Nie trafia. Zawodnik bierze kilka kroków do przodu. W ziemię wbity jest kolejny oszczep. Przed nim zostały jeszcze trzy. Musisz uniknąć pięciu. Rzut. Pudło. Dystans pomiędzy Tobą a legionistą zmniejsza się. Three to go. Za tobą otwierają się wrota. Dwóch opiekunów prowadzi lwa na łańcuchu. Zmniejsza Ci to jeszcze bardziej pole manewru. Rzut. Pudło. Łańcuch lwa jest poluzowany jeszcze bardziej. Jesteś osaczony. Rzut. Nie zdążyłeś uniknąć. Przeszywa Cię olbrzymi ból. Klękasz na jedno kolano, ale starasz się nie zemdleć. Oszczep nadal tkwi w twojej piersi. Tłum wiwatuje. Cieszą się z twojego cierpienia. Pomimo wszystko zbierasz w sobie resztki sił. Legionista szykuje się do ostatniego rzutu. Słyszysz głos konferansjera podliczającego punkty legioniście. Przed Tobą leży jeden z pilum które Cię nie trafiły. Podnosisz go okupując to ogromnym wysiłkiem. Dużo czasu Ci nie zostało. Zaczyna Ci się kręcić w głowie, oczy zachodzą ciemnością. Rzucasz oszczepem w zawodnika w tym samym momencie w którym on miotał swoim. Nie wiesz czy trafiłeś. \n\nUpadasz na ziemię. Przez całą arenę przeszedł ogromny aplauz. Ostatnie co słyszysz to tłum domagający się spuszczenia lwa z łańcucha. Piasek na którym leżysz jest taki ciepły. Smak krwi w ustach nawet nie przeszkadza. Nie kłamali. Teraz nareszcie będę wolny.\nWydajesz ostatni oddech w swoim żywocie. Lew dokończy dzieła. Zasłużył na posiłek, a ty jesteś niczym deser. Na szczęście, nie doświadczysz już bólu rozrywania Cię na kawałki. Pola Elizejskie stoją już przed Tobą otworem. Ciemność Cię otacza. Czy to może jednak Hades? Stajesz się nicością. To koniec."
calisia.54.a: "- CZTERY PUNKTY DLA ARCADIUSA VANELLUSA ZE SCIPIORNA!"

calisia.55.t: "Conventus Subitis"
calisia.55.desc: "Dies Solis, 19:00. Pięciu Wysokich Kwestorów zebrało się w sztabie kryzysowym, by omówić konsekwencje nowego Kalendarza Rikardiańskiego. Od powstania Imperium Calisianum ich Kwintumwirat stanowił ostateczną władzę we wszystkich sprawach finansowych i często musiał pośpiesznie korygować budżet, by zatkać odpływ pieniędzy wywołany nieprzemyślaną ustawą jakiegoś Senatora. Nic nie wskazywało, by dzisiejsze posiedzenie miało się czymkolwiek różnić. \n\nKiedy zaczęli pochylać się nad niezliczonymi księgami, które w większości znali już na pamięć, najstarszy z urzędników, ich Primus Inter Pares, przerwał ciszę i przedstawił porządek obrad. \n\n- Dobrze, Cesarz w swej nieskończonej mądrości właśnie wymazał z kalendarza około dekady. To chyba psuje tylko... każdą płatność dokonaną w tym okresie. Bez presji. Jakieś pomysły? - spod zwyczajowego władczego tonu przebijała konsternacja. \n- Hmm, skoro daty przesuwają się naprzód, to znaczy, że jesteśmy winni legionom około dziesięciu lat żołdu - jeden z kwestorów wtrącił się, zanim poprzednik skończył, desperacko przekrzykując każdego, kto próbował dojść do słowa. - Ale dostaniemy też wszystkie dodatkowe podatki, prawda? Czyli się wyrówna? \n- Jestem niemal pewien, że to idzie do tyłu, Patriciusie. Czyli dosłownie nic z tego nie jest prawdą. \n- No tak, nie. Zdecydowanie wstecz - wtrącił urzędnik o szczególnie psim wyglądzie. - W takim razie to oni zwracają żołd. \n- Chwila, czy to dotyczy też nas? \n- Hmm, dobrze, może to skreślmy. Albo zróbmy dla siebie wyjątek. \n- Zaraz, jeśli po prostu wymażemy dziesięć lat z naszych rejestrów, to technicznie rzecz biorąc, wszyscy urodzeni w ostatniej dekadzie jeszcze nie istnieją. \n- Na odwrót, Matthiusie - przerwał zarozumiały głos. - Jeśli czas idzie naprzód, to są po prostu starsi. I muszą zapłacić zaległe podatki. \n- Nie! ILE RAZY MAM CI MÓWIĆ, ŻE TO KURWA NIE IDZIE DO PRZODU! \n\nChoć nagromadzone napięcie znalazło nieuniknione ujście, a atmosfera nadal była przyjaźniejsza niż na zwykłym posiedzeniu, rosnąca chęć Wysokich Kwestorów, by wrócić do domów i porządnie się wyspać przed początkiem nowego tygodnia, zmusiła ich do wypracowania kompromisu wystarczająco dobrego, by cesarski system administracyjny i finansowy nie zawalił się zaraz po otwarciu rynków o poranku. Milczący dotąd nieoficjalny dyplomata grupy dorzucił swoje dwie sestercje. \n\n- Dobrze, dziś niczego nie wymyślimy. Zrzućmy sprawę na szczebel lokalny i niech niżsi rangą rozwiązują ją indywidualnie. Jeśli coś zadziała, skopiujemy to we wszystkich pozostałych okręgach. \n\nPo sali przeszedł niepewny pomruk. Wszyscy wiedzieli, że to niewystarczające rozwiązanie, lecz lepszego nie uda im się osiągnąć. Zawarto porozumienie, a teraz należało uczcić je kilkoma kubkami taniego wina."
calisia.55.a: "Aż trudno uwierzyć, że nawet im za ten kłopot nie zapłacą..."

calisia.56.t: "Język przemocy"
calisia.56.desc: "Byłe przejście graniczne w Słubicach (obecnie Slubica) stało się jednym z największych punktów zapalnych w całym kraju. Po niemieckiej stronie Frankfurt przekształcił się z 50-tysięcznego miasta w kilkuset tysięczną enklawę ludności uciekającej z terenów ogarniętych anarchią i wojną domową. W samym środku miasta zaczęły powstawać getta uchodźców, które z każdym dniem rozrastały się i napierały w stronę wschodu. A na rzece Viadrus, nieugięta stała straż imperialna. Nie przepuszczali oni nikogo przez granicę, wyłapując co rusz nielegalnych imigrantów próbujących na własną rękę przeprawić się przez rzekę. Jednak i wzmocnione siły limitanei nie są w stanie zapanować nad morzem uchodźców którzy coraz mocniej dobijali się do bram Calisii.\n\nDzisiaj, na moście miało dojść do spotkania przedstawiciela barbari z oficerem posterunku granicznego, Adalbertusem Crudeliterem. Ten był spokojny, odprawiał już z kwitkiem kilkunastu posłów germańskich którzy przybyli tu błagać. Teraz miało być tak samo. Dziesięć metrów za nim stało dwóch żołnierzy gotowych na wszystko. W jego stronę zmierzało trzech rosłych barbarzyńców. Tylko jeden podszedł bezpośrednio do Adalbertusa i skinął mu głową w geście przywitania. Ten wyjął z kieszeni słownik rozmówek polsko-niemieckich i szybko wertował strony w poszukiwaniu odpowiedniego zwrotu\n- GUTEN MORGEN - wykrzyczał Adalbertus zadowolony z samego siebie. Niestety było właśnie pięć minut po godzinie dwunastej więc ten zwrot już nie miał sensu. \n- Guten Tag, Herr Crudeliter - odpowiedział posłaniec\n\nCała \"rozmowa\" trwała okrutnie długo, ze względu na to że każde zdanie musiało zostać ręcznie przetłumaczone co uniemożliwiało w zasadzie jakiekolwiek negocjacje. Spokój i opanowanie ustąpiło miejsce frustracji i gniewu, który zaczął się gotować w przybyszu. Na kolejny komentarz Adalbertusa który sugerował że mogliby wrócić do swoich domów, barbarzyńca nie wytrzymał i wykrzyczał groźnie\n- SIE ZERSTÖRT UNSERE HÄUSER, WO SOLLTEN WIR GEHEN?\n- Ej, ej, ale weź się nie unoś, co? - ręka Adalbertusa przez chwilę wylądowała na rękojeści gladiusa. Wiedział że Hause to dom, ale co to było “zerstört”? Szybko przekartkował słownik do kategorii słówek na literę \"Z\" i to co tam zobaczył zmroziło mu krew w żyłach. \"Zerstören - Niszczyć\".\n- Osz... no to sobie palancie przegiąłeś. Chcesz niszczyć? Chcesz grabić nasze domy? To dostaniesz na co zasługujesz! Chłopaki, brać ich!\n\nCalisianie rzucili się z tymi słowami na zaskoczonych German, którzy nie mieli pojęcia co się stało. Próbowali się bronić, ale to tylko utwierdziło legionistów w przekonaniu że to barbarzyńcy chcieli ich zaatakować. Po zabiciu trzech posłańców, Adalbertus pobiegł do posterunku wszczynając alarm generalny na całej granicy. Obserwujący to z drugiego brzegu rzeki uchodźcy byli w szoku, ale nie trwał on długo. Następne co się stało to ogromna wściekłość tłumu, który ruszył wprost na posterunek. Padły strzały. A to do czego miało doprowadzić to jedno małe nieporozumienie miało zmienić bieg historii."
calisia.56.a: "Matka zawsze mówiła, że powinienem uczyć się języków..."

calisia.57.t: "Prośba Viniciusa"
calisia.57.desc: "- Marcus Vinicius przybył cię odwiedzić - głos przebił się przez spokojny szum płynącej wody. Ricardus Calisius przetarł zaparowane okulary. Mężczyzna w legionowej zbroi przeszedł przez jego prywatne thermae ku tepidarium, w którym Cesarz właśnie wypoczywał. \n- Ave, Caesar. Niech wszyscy bogowie obdarzą cię pomyślnością, zwłaszcza Asklepios i Kypryda. \nCesarz burknął. - Ze wszystkich bogów dlaczego uznałeś, że najbardziej potrzebuję właśnie Kyprydy? Czy wyglądam, jakbym wymagał jej pomocy? - wynurzył się z basenu i rozłożył ręce, prezentując nuda veritas swojego wyglądu. - Nie masz wrażenia, że odbyliśmy już kiedyś dokładnie tę rozmowę? \n- Wybacz, o Cesarzu. To była taka... mimowolna reakcja na tę sytuację. Sam chętnie spędziłbym dłuższy czas w thermae. \n- Och, Marcusie, wiesz przecież, że możesz korzystać z moich thermae, kiedy tylko potrzebujesz - Calisius uśmiechnął się krzywo. \n- Jesteś łaskawy jak zawsze, mój Panie - Vinicius skłonił się gwałtownie. - Wybacz, lecz muszę odmówić. Sprawy wojskowe pochłaniają mnie bez reszty. \n- Z pewnością mógłbyś na jakiś czas przekazać obowiązki pomocnikom. \n- To niemożliwe. Wszyscy oficerowie są stale zajęci. Brakuje nam ludzi na każdym stanowisku, a żołnierze masowo biorą urlopy. Nie chcą siedzieć w obozie za marny żołd, skoro mogą pracować w domu. \n- Rozsądniej byłoby pozostać na froncie - Calisius skinął głową, a dwóch służących przybiegło z wielkim ręcznikiem. Cesarz wyszedł z basenu i owinął się nim niczym togą. - Ile kosztowałoby utrzymanie większej liczby ludzi pod bronią? \n- Winny jest system, mój Panie. Naszą armię zaprojektowano tak, by mobilizować ją w całości jedynie w porze najbardziej sprzyjającej kampaniom. Po jej zakończeniu większość ludzi powinna wracać na rynek pracy albo na pola, inaczej zrujnujemy gospodarkę. \n- Dobrze wiesz, że musimy pracować z tym, co mamy. Przypuszczam jednak, że moglibyśmy opłacać na stałe mniej ludzi, jeśli zapewniłoby to lepsze wyniki. \n- Moglibyśmy przekształcić legiony w siłę zawodową. Obawiam się jednak, że stworzyłoby to profesjonalną kastę wojowników oddzieloną od reszty obywateli. \n- Jeśli masz na myśli jakąś alternatywę dla armii zawodowej, to wyrażaj się śmiało - powiedział oschle Calisius. \n- Moglibyśmy przyjąć więcej nieobywateli do oddziałów pomocniczych. Pozwolić im bronić Calisii jak własnej ojczyzny. Dałoby im to szansę poprawienia losu i być może wzbudziło pewną lojalność. \nCesarz wykonał nieokreślony gest, jakby szukał argumentu."
calisia.57.a: "Pomyślę o tym we frigidarium."

calisia.58.t: "Conversatio Privata"
calisia.58.desc: "Gabinet był pogrążony w półmroku i oczy Cinastovicusa potrzebowały chwili, by przywyknąć do ciemności. Ricardus Calisius siedział sam, opierając łokcie na biurku, ze splecionymi palcami i kciukami podpierającymi czoło. Na głowie miał wieniec laurowy - przesadnie teatralny nawet jak na kogoś takiego. \n- Ave, Cesarzu. Wezwałeś mnie na prywatną naradę. \n- Siadaj, Kinastowski - Calisius wskazał krzesło przed biurkiem. Było to zwyczajne krzesło biurowe, tak normalne, jak tylko mogło być. Siadając, Pretorianin zrozumiał, że pomieszczenie w ogóle nie zostało zromanizowane, przez co toga Cesarza i jego własna zbroja wyglądały jeszcze bardziej niezręcznie. \n- Czytałeś najnowsze raporty, prawda? - zapytał Calisius. \n- Oczywiście, Cesarzu. Zmobilizowałem gwardię pretoriańską. Jest gotowa wymaszerować na... \n- Nie wzywałbym cię tu tylko po to, by przedstawiać oczywistości. Pytam, czy zdajesz sobie sprawę z tego, co się dzieje. \n- Wybacz, Panie... \n- Gdyby pięć lat temu ktoś powiedział ci, że godzinę drogi od twojego domu trwa bunt niewolników, co byś zrobił? \n- Zawsze sprzeciwiałem się terroryzmowi i aktom przemocy wymierzonym w... \n- Nie. Bunt *niewolników*. Zastanów się, Christianusie. Mamy *niewolników*, a oni zabijają teraz właścicieli ziemskich. Uznałbyś, że oszalałem, gdybym sugerował, iż coś takiego może zdarzyć się tutaj, a nie w jakimś Bantustanie czy gdziekolwiek indziej. \nA więc to prawda - pomyślał Cinastovicus. Naprawdę traci rozum. Na twarzy Pretorianina pojawił się odruchowy uśmiech, lecz opanował się w mgnieniu oka. - Pan raczy żartować, Cesarzu. To Pan wskazał nam drogę do obecnej i chwalebnej... \n- Nie wskazywałem drogi do przeklętego buntu niewolników! - wybuchł Calisius, uderzając pięścią w podniszczone biurko. - Za kogo mnie masz? Za poganiacza niewolników, dzięki któremu twoi maluccy przyjaciele utuczą się na tej nędznej ziemi? To szaleństwo musi zostać napra... - przerwał, ciężko oddychając, poprawił okulary i, nieco szorstko, wieniec laurowy. - Trzeba to naprawić. Popularzy domagają się zniesienia niewolnictwa w obecnej postaci. Uważam, że to całkiem rozsądne. Z pewnością przyznasz, że lepiej mieć sługę kontraktowego niż niewolnika gotowego poderżnąć ci gardło. \n- Wybacz, o boski Cesarzu, lecz teraz jest już za późno. To barbarzyńcy; podrzynanie gardeł leży w ich naturze. Nie wyciąga się ręki do bestii, która chce Cię ugryźć. Niewolnicy poznają swoje miejsce... - \"albo ty stracisz swoje\" - dokończył Cinastovicus w myślach. \n- Na szczęście nie ty podejmujesz tu wszystkie decyzje. Na razie każ pretorianom pozostać w gotowości."
calisia.58.a: "Pozostaną... na razie."

calisia.59.t: "Wizyta w Senacie"
calisia.59.desc: "...a poza tym uważam, że Germania powinna zostać zniszczona. \nLewa strona sali jęknęła. \n- Jak długo mamy słuchać tych bredni? Ten typ myśli, że jest Katonem? Uciąć mu jaja, jebanemu pederaście! Przez pięć minut nie potrafi utrzymać kutasa w spodniach! \n- Zamknij tę plebejską mordę! Was, Popularów, dymają codziennie! Każdego dnia barbarzyński kutas wchodzi wam w dupę i chodzi tak w tę i z powrotem, w tę i z powrotem - schodzący z mównicy Senator gestykulował. \n- Dość. Dość. Wracaj na miejsce - rozkazał trybun. - Przejdziemy teraz do głosowania nad... \n- Wniosek formalny, trybunie, wniosek formalny! - jeden z Popularów podbiegł do mównicy i zanim trybun zdążył cokolwiek powiedzieć, zaczął od nowa. \n- Optymaci ukradli 70 milionów denarów przeznaczonych dla legionów walczących w ostatniej wojnie! Pieniądze trafiły do ich villae i na zagraniczne konta bankowe! Zgodnie z tym dokumentem - wyjął z togi podniszczony zwój - wydali milion denarow na żywność dla Cesarza, by go ugłaskać, między innymi parmezan, spianata romana, mozzarella di bufala i... \n\nGłówne drzwi otworzyły się z hukiem, a sala umilkła. Senatorowie z podziwem spojrzeli na majestatyczną sylwetkę w wejściu. \n- Pomyślałem, że wpadnę na chwilę zobaczyć obrady - powiedział Cesarz. - Nie zwracajcie na mnie uwagi. Chętnie dowiem się, czy można tu dostać dobrą mozzarellę. \nSala zastygła w niezręcznej ciszy. Wreszcie trybun zaczął mamrotać: \n- Może... może przejdziemy do głosowania nad, eee... - zaczął nerwowo przerzucać papiery. - Ee, gdzie ja to położyłem... \n- Może podzielę się czymś z własnego doświadczenia parlamentarnego - powiedział Calisius. - Przede wszystkim nie traktujcie polityki jak wojny totalnej. Jutro możecie zostać zmuszeni do współpracy albo, co gorsza, jakaś sprawa podzieli was jeszcze bardziej. Jeśli będziecie zachowywać się tak, jakbyście tkwili w konflikcie, który musi zakończyć się zdeptaniem i proskrybowaniem jednej ze stron, oboje będziecie godnymi pożałowania przegranymi. Wybaczcie te banały. Niektórzy z was mogą mieć mniejsze doświadczenie polityczne. \n\nSłużący przynieśli Calisiusowi złoty stołek oraz tacę z winem i antipasti. \n- Jak mówiłem, nie przejmujcie się mną. Jestem tylko zwykłym widzem."
calisia.59.a: "Ponownie zapadła cisza, przerywana jedynie odgłosami przeżuwania."

calisia.60.t: "Lex Tributorum"
calisia.60.desc: "§1Lex Tributum Minoritatis - projekt Optymatów§!\n1.1. Nową stawką podatkową obejmuje się wszystkie osoby i podmioty barbarzyńskie zamieszkujące terytorium Cesarstwa. Prawne określenie tego, komu przysługuje miano \"barbarzyńcy\", reguluje następujący akt: Lex Civitatis.\n\n2.1. Stawkę podatkową dla tych osób i podmiotów podwyższa się o 200%, co uznaje się za konieczne do uzyskania dochodów wystarczających do pokrycia deficytu budżetowego. \n\n3.1. Zwiększone zobowiązania finansowe barbarzyńców uzasadnia się jako spłatę za ochronę, infrastrukturę i korzyści wynikające z zamieszkiwania w Cesarstwie. Dodatkowe dochody zostaną przeznaczone na potrzeby budżetowe Cesarstwa bez nakładania nadmiernego ciężaru na obywateli kalizjańskich.\n\n4.1. Na osoby uchylające się od zwiększonych zobowiązań podatkowych nakłada się surowe kary, w tym grzywny i pozbawienie wolności.\n\n5.1. Wszelkie wcześniejsze prawa i przepisy sprzeczne z postanowieniami niniejszej ustawy uchyla się lub zmienia w celu dostosowania do niej.\n\n§RLex Tributum Progressivi - projekt Popularów§!\n1.1. Nową stawką podatkową obejmuje się osoby posiadające znaczny majątek. \nWprowadza się progresywne podwyższenie podatków:\na. Dodatkowy podatek w wysokości 30% od dochodów powyżej 100 000 denarii rocznie.\nb. Dodatkowy podatek w wysokości 60% od dochodów powyżej 250 000 denarii rocznie.\n\n2.1. Stawkę podatkową dla przedsiębiorstw podwyższa się o wartość uznaną za niezbędną do uzyskania dochodów wystarczających do pokrycia deficytu budżetowego.\n\n3.1. Ustanawia się szczególne ulgi i zwolnienia, aby najubożsi obywatele odnieśli z reformy największe korzyści.\n\n4.1. Na osoby uchylające się od zwiększonych zobowiązań podatkowych nakłada się surowe kary, w tym grzywny i pozbawienie wolności. Przedsiębiorstwa nieprzestrzegające niniejszych przepisów zostaną wydalone z kraju."
calisia.60.a: "Projekt Popularów"
calisia.60.b: "Projekt Optymatów"

calisia.61.t: "Lex Militae"
calisia.61.desc: "§1Lex Exercitus Permanens - projekt Optymatów§!\n1.1. Wszyscy obywatele płci męskiej w wieku od 17 do 45 lat podlegają poborowi, jak uprzednio stanowiło prawo rzymskie. Niniejsza ustawa rozszerza przedział wieku poborowego na wszystkich obywateli płci męskiej w wieku od 17 do 50 lat, zwiększając tym samym pulę kalizjańskich poborowych.\n\n2.1. Siły poborowe składają się wyłącznie z obywateli kalizjańskich, co zapewnia spójną i lojalną strukturę armii.\n\n3.1. Specjalistyczne programy szkoleniowe zostaną rozszerzone w celu zwiększenia skuteczności i profesjonalizmu żołnierzy poborowych. Poborowi przechodzą rygorystyczne i ciągłe szkolenie, by utrzymywać wysokie standardy kompetencji wojskowych i dyscypliny.\n\n3.2. Ustanawia się programy rozwoju zawodowego mające doskonalić umiejętności żołnierzy i przygotowywać ich do ról dowódczych w armii.\n\n§RLex Lata Conscriptionis - projekt Popularów§!\n1.1. Wszyscy obywatele płci męskiej w wieku od 17 do 45 lat podlegają poborowi, jak uprzednio stanowiło prawo kalizjańskie. Oprócz obywateli kalizjańskich niniejsza ustawa nakazuje pobór na co najmniej trzy lata wszystkich barbarzyńców płci męskiej w wieku od 17 do 45 lat zamieszkujących terytorium cesarskie.\n\n2.1. Na potrzeby niniejszej ustawy \"barbarzyńcami\" określa się nieobywateli zamieszkujących w granicach Cesarstwa, w tym między innymi osoby pochodzące z Germanii, Scytii, Tartarii oraz innych uznanych regionów plemiennych.\n\n3.1. Poborowi zostaną włączeni do specjalnie wyznaczonych formacji barbarzyńskich pod kalizjańskim dowództwem w celu zapewnienia spójności i lojalności.\n\n4.1. Poborowi barbarzyńscy przechodzą równie rygorystyczne szkolenie jak żołnierze kalizjańscy, co zapewnia jednolitość umiejętności i dyscypliny. Ustanawia się programy integracyjne mające rozwijać lojalność i koleżeństwo między żołnierzami kalizjańskimi a barbarzyńskimi, w tym wspólne ćwiczenia oraz inicjatywy wymiany kulturowej.\n\n5.1. Na osoby uchylające się od poboru nakłada się surowe kary, w tym grzywny, pozbawienie wolności i przedłużenie okresu służby."
calisia.61.a: "Projekt Popularów"
calisia.61.b: "Projekt Optymatów"

calisia.62.t: "Lex Indentatae Servitutis"
calisia.62.desc: "§1Lex Servilis - projekt Optymatów§!\n1.1. Podporządkowane populacje, w tym między innymi podbite grupy barbarzyńskie, określa się mianem Servi Cesarstwa.\n\n1.2. W zamian za pracę na rzecz Cesarstwa Servi mają prawo do zakwaterowania zapewnianego przez państwo oraz odpowiedniego wyżywienia.\n\n2.1. Servi gwarantuje się podstawową ochronę, w tym prawo do humanitarnego traktowania, uczciwych warunków pracy i opieki zdrowotnej. Rząd ustanowi mechanizmy nadzoru zapewniające przestrzeganie praw i zabezpieczeń przyznanych Servi.\n\n3.1. Rząd przeznaczy środki na zakwaterowanie i utrzymanie ludności Servi, skupiając się na ograniczeniu wpływu gospodarczego na pozostałe warstwy społeczeństwa. Wprowadza się środki zachęcające do wykorzystywania pracy Servi w kluczowych branżach i sektorach gospodarki.\n\n§RLex Indentatae Servitutis - projekt Popularów§!\n1.1. Wszyscy obecni niewolnicy w Cesarstwie otrzymują możliwość przejścia na czasową formę służebności, w ramach której zapewnia się im podstawowe prawa i ochronę.\n\n1.2. Osoby objęte czasową służebnością mogą po określonym okresie pracy wykupić swój kontrakt, uzyskując wyzwolenie i możliwość integracji ze społeczeństwem.\n\n2.1. Czasowi słudzy otrzymują podstawowe prawa, w tym prawo do uczciwego wynagrodzenia, humanitarnego traktowania oraz dostępu do edukacji i szkolenia zawodowego. Rząd ustanowi programy wsparcia pomagające w przejściu ze służebności do wolności, w tym pośrednictwo pracy i pomoc mieszkaniową.\n\n3.1. Za wdrażanie i nadzorowanie postanowień niniejszej ustawy odpowiada Ministerstwo Pracy i Opieki Społecznej."
calisia.62.a: "Projekt Popularów"
calisia.62.b: "Projekt Optymatów"

calisia.63.t: "Lex Securitatis"
calisia.63.desc: "§1Lex Contra-Terrorismus et Limes Securitatis - projekt Optymatów§!\n1.1. Państwo przeznaczy znaczne środki na budowę zaawansowanych fortyfikacji i wzmocnienie istniejących umocnień granicznych. Powołuje się Limitanei, złożonych z doskonale wyszkolonych żołnierzy i jednostek specjalistycznych, w celu zapewnienia najwyższego bezpieczeństwa na granicach Cesarstwa. Prowadzi się stały nadzór i częste patrole, by wykrywać oraz zapobiegać wszelkim przypadkom nieuprawnionego przekraczania granicy, gwarantując integralność granic Cesarstwa.\n\n2.1. Państwo znacząco zwiększy finansowanie organów ścigania, aby wzmocnić ich zdolność zwalczania przestępczości w całym Cesarstwie. Wobec przestępczości zorganizowanej i recydywistów stosuje się politykę zerowej tolerancji, obejmującą surowe kary oraz szybkie postępowania sądowe mające odstraszać od działalności przestępczej. Do identyfikacji i zatrzymywania przestępców wykorzystuje się zaawansowane technologie oraz jednostki wywiadowcze, ze szczególnym naciskiem na działania wyprzedzające.\n\n3.1. Vigiles otrzymują rozszerzone uprawnienia do zatrzymywania, przesłuchiwania i natychmiastowego karania podejrzanych, wraz ze środkami zapewniającymi szybkie wymierzanie sprawiedliwości. Zatrzymani mają ograniczone prawo do pomocy prawnej i odwołań, co ma przyspieszyć postępowanie sądowe oraz utrzymać porządek. Kary dla zatrzymanych są surowe; w przypadku poważnych przestępstw dopuszcza się kary cielesne i karę śmierci, podlegające kontroli trybunału wojskowego.\n\n§RLex Securitatis Popularis - projekt Popularów§!\n1.1. Państwo przeznaczy dodatkowe środki na wzmocnienie ochrony granic, w tym budowę nowych fortyfikacji i ulepszenie istniejących. Powołuje się Limitanei, złożonych z wyszkolonych żołnierzy i zwiadowców, by skutecznie obserwować oraz zabezpieczać granice. Regularne patrole prowadzi się we wszystkich głównych punktach granicznych w celu zapobiegania nieuprawnionym przekroczeniom i zapewnienia bezpieczeństwa terenów przygranicznych.\n\n2.1. Państwo zwiększy finansowanie organów ścigania, aby poprawić ich zdolność zwalczania przestępczości w Cesarstwie. Powołuje się wyspecjalizowane jednostki do walki z przestępczością zorganizowaną, skupione na gromadzeniu informacji i szybkiej interwencji. Vigiles mają prawo zatrzymywać i przesłuchiwać podejrzanych, lecz wszyscy zatrzymani muszą być traktowani humanitarnie i zgodnie z ustalonymi normami prawnymi.\n\n3.1. Zatrzymanym przysługuje prawo do pomocy prawnej oraz do odwołania się od zatrzymania i nałożonych kar. Kary muszą być proporcjonalne do popełnionych czynów i podlegać kontroli niezależnego sądownictwa."
calisia.63.a: "Projekt Popularów"
calisia.63.b: "Projekt Optymatów"

calisia.64.t: "Lex Mercatoria"
calisia.64.desc: "§1Lex Promotionem Exportationis - projekt Optymatów§!\n1.1. Standardowy podatek eksportowy w wysokości 8% obniża się do 3% dla wszystkich towarów wywożonych z Calisii, z wyjątkiem dóbr luksusowych, które podlegają wyższej stawce 5%, obniżonej z 12%.\n\n2.1. Dobra luksusowe, zdefiniowane jako szlachetne wina, metale szlachetne i dzieła sztuki, otrzymują pierwszeństwo w eksporcie w celu maksymalizacji dochodów państwa. Wszyscy kupcy muszą posiadać licencję eksportową, a pierwszeństwo przyznaje się handlarzom dobrami luksusowymi.\n\n3.1. Państwo będzie wspierać produkcję i eksport towarów o wysokiej wartości poprzez dotacje oraz zachęty podatkowe dla producentów specjalizujących się w dobrach luksusowych. Powołuje się elitarną radę handlową, która ma wyszukiwać i promować dochodowe rynki dla kalizjańskich dóbr luksusowych, ze szczególnym uwzględnieniem regionów o dużej sile nabywczej.\n\n4.1. Państwo przeznaczy środki na utrzymanie i ulepszanie głównych szlaków handlowych, zwłaszcza tych najczęściej wykorzystywanych do przewozu dóbr luksusowych.\nPowołuje się wyspecjalizowaną jednostkę straży, Vigiles Commerciales, chroniącą kupców i towary luksusowe przed zagrożeniami na kluczowych szlakach handlowych.\n\n§RLex Contra Monopolii - projekt Popularów§!\n1.1. Na wszystkie towary wywożone z Calisii i do niej sprowadzane nakłada się standardowy podatek eksportowy w wysokości 15%.\n\n2.1. Z podatku zwalnia się dobra podstawowe, zdefiniowane jako żywność, zioła lecznicze i surowce o kluczowym znaczeniu dla dobrobytu publicznego.\n\n2.3. Dla dóbr podstawowych ustanawia się maksymalny kontyngent eksportowy, tak aby potrzeby krajowe zostały zaspokojone przed wywozem nadwyżki.\n\n3.1. Państwo będzie wspierać produkcję i centralną wymianę towarów o dużym popycie, w tym tkanin, ceramiki i wyrobów metalowych, poprzez dotacje dla producentów oraz scentralizowany skup. Powołuje się radę handlową mającą bronić praw rynku wewnętrznego, ze szczególnym naciskiem na likwidację niebezpiecznych praktyk prowadzących do monopoli i niesprawiedliwego traktowania ludności."
calisia.64.a: "Projekt Popularów"
calisia.64.b: "Projekt Optymatów"

calisia.65.t: "Lex Subsidiarum Socialum"
calisia.65.desc: "§1Lex Subsidii Militaris - projekt Optymatów§!\n1.1. Państwo ograniczy finansowanie istniejących programów opieki społecznej o 15%, kierując środki na najważniejsze usługi.\n\n1.2. Niektóre programy opieki społecznej zostaną zlikwidowane, w tym:\na. Dopłaty do opieki nad dziećmi dla rodzin o dochodach przekraczających 50 000 denarii rocznie.\nb. Wsparcie opieki nad osobami starszymi dla obywateli posiadających znaczne oszczędności.\nc. Świadczenia dla osób z niepełnosprawnościami, które mogą wykazać zdolność do zatrudnienia.\n\n2.1. Uprawnienia do korzystania z programów opieki społecznej podlegają ścisłej weryfikacji dochodowej, a świadczenia rezerwuje się dla najbardziej potrzebujących obywateli. Obejmują one niezbędną pomoc finansową i dostęp do podstawowej opieki zdrowotnej przy ograniczonym wsparciu edukacyjnym dla dzieci. Dopłata do minimalnego wynagrodzenia wystarczającego na utrzymanie przysługuje wyłącznie obywatelom żyjącym poniżej granicy ubóstwa, zdefiniowanej jako dochód niższy niż 10 000 denarii rocznie.\n\n3.1. Oszczędności wynikające z ograniczenia wydatków na opiekę społeczną zostaną przeznaczone na inne priorytety państwa, takie jak infrastruktura i obrona, bez konieczności wprowadzania nowych podatków.\n\n§RLex Subsidii Popularis - projekt Popularów§!\n1.1. Państwo zwiększy finansowanie istniejących programów opieki społecznej o 20%, zapewniając pełny zakres pomocy wszystkim uprawnionym obywatelom.\n\n1.2. Wprowadza się nowe programy opieki społecznej, w tym:\na. Dopłaty do opieki nad dziećmi dla rodzin z dziećmi poniżej 12. roku życia.\nb. Wsparcie opieki nad osobami starszymi dla obywateli w wieku co najmniej 65 lat.\nc. Świadczenia dla osób z niepełnosprawnościami fizycznymi lub psychicznymi.\n\n2.1. Uprawnienia do programów opieki społecznej ustala się na podstawie poziomu dochodów, z pierwszeństwem dla rodzin i osób o niskich dochodach. Świadczenia obejmują comiesięczną pomoc finansową, dostęp do opieki zdrowotnej oraz wsparcie edukacyjne dla dzieci. Dopłata do minimalnego wynagrodzenia wystarczającego na utrzymanie ma zapewnić wszystkim obywatelom dostęp do podstawowych dóbr."
calisia.65.a: "Projekt Popularów"
calisia.65.b: "Projekt Optymatów"

calisia.66.t: "Lex Iunonis"
calisia.66.desc: "§1Lex Traditionis - projekt Optymatów§!\n1.1. Obywatelkom przyznaje się szersze prawa, w tym między innymi:\na. Prawo do udziału w radach lokalnych i pełnienia funkcji doradczych.\nb. Rozszerzone prawa własności i dziedziczenia, zapewniające sprawiedliwe traktowanie zgodnie z prawem kalizjańskim.\nc. Dostęp do edukacji i możliwości zatrudnienia z poszanowaniem tradycyjnych ról.\nd. Ochronę przed przemocą i dyskryminacją w ramach kalizjańskich tradycji.\n\n2.1. Ochroną obejmuje się wyłącznie kobiety kalizjańskiej krwi, zapewniając im bezpieczeństwo i dobrobyt w strukturze społecznej.\n\n3.1. Państwo będzie promować znaczenie tradycyjnych ról i wartości rodzinnych, wspierając kobiety w roli matek i opiekunek.\n\n3.2. Ustanawia się programy wsparcia i zasobów dla kobiet w tradycyjnych rolach, w tym:\na. Opiekę zdrowotną dla matek.\nb. Opiekę nad dziećmi i wsparcie rodzinne.\nc. Szkolenie umiejętności oraz edukację w zakresie obowiązków domowych.\n\n§RLex Feminarum Liberationis - projekt Popularów§!\n1.1. Obywatelkom przyznaje się wszystkie prawa przysługujące obecnie obywatelom płci męskiej, w tym między innymi:\na. Prawo do głosowania i sprawowania urzędów publicznych.\nb. Równe prawa własności i dziedziczenia.\nc. Równy dostęp do edukacji i możliwości zatrudnienia.\nd. Ochronę przed wszelkimi formami dyskryminacji.\n\n2.1. Wprowadza się całkowity zakaz złego traktowania i chwytania barbarzyńskich kobiet wbrew ich woli, zapewniając humanitarne traktowanie wszystkich kobiet znajdujących się pod jurysdykcją Calisii.\n\n2.2. Państwo finansuje i wspiera programy edukacyjne promujące równość płci oraz zwiększające świadomość praw kobiet.\n\n3.1. Prowadzi się kampanie publiczne informujące obywateli o nowych prawach i zabezpieczeniach przyznanych kobietom niniejszą ustawą."
calisia.66.a: "Projekt Popularów"
calisia.66.b: "Projekt Optymatów"

calisia.67.t: "Lex Civitatis"
calisia.67.desc: "§1Lex Tributum Civitatis - projekt Optymatów§!\n1.1. Obywatelstwo przyznaje się każdej osobie zamieszkującej terytorium Cesarstwa, która jest w stanie uiścić jednorazowy trybut finansowy równy miesięcznemu utrzymaniu manipułu (10 000 denarii).\n\n1.2. Z obowiązku wniesienia trybutu zwalnia się:\na. Osoby, które służyły w kalizjańskich siłach zbrojnych przez co najmniej pięć lat.\nb. Osoby, które wniosły znaczący i uznany wkład w rozwój państwa, zgodnie z oceną Senatu.\n\n2.1. Urząd Trybutu Obywatelskiego weryfikuje płatność i zaleca Senatowi przyjęcie lub odrzucenie wniosku.\n\n3.1. Środki zebrane z trybutu obywatelskiego rozdziela się następująco:\na. 50% dla wojska na utrzymanie i rozbudowę.\nb. 30% na infrastrukturę publiczną i projekty rozwojowe.\nc. 20% do ogólnego skarbu państwa na różne wydatki.\n\n§RLex Residentis - projekt Popularów§!\n1.1. Obywatelstwo przyznaje się każdej osobie zamieszkującej terytorium Cesarstwa, która może dowieść swojej służby i lojalności wobec Jego Łaskawości Ricardusa Calisiusa.\n\n1.2. Kryteria dowodzące służby i lojalności obejmują:\na. Służbę wojskową trwającą co najmniej dwa lata.\nb. Służbę publiczną lub pełnienie funkcji administracyjnej w Cesarstwie przez co najmniej trzy lata.\nc. Udokumentowany wkład w gospodarczy, kulturalny lub naukowy rozwój Calisii.\nd. Wszelkie inne akty wyjątkowej służby uznane przez Senat.\n\n2.1. Wnioskodawcy muszą przedłożyć szczegółowy wykaz służby nowo utworzonej Komisji Weryfikacji Obywatelstwa, złożonej z przedstawicieli Senatu, wojska i społeczeństwa obywatelskiego. Komisja ocenia każdy wniosek według podanych kryteriów i zaleca Senatowi jego przyjęcie lub odrzucenie. Od decyzji można odwołać się do wyższej komisji weryfikacyjnej w ciągu 30 dni od jej otrzymania.\n\n3.1. Po nadaniu obywatelstwa obywatele korzystają ze wszystkich wynikających z niego praw i przywilejów, w tym: prawa do głosowania i sprawowania urzędów publicznych, ochrony prawnej i należytego procesu zgodnie z prawem kalizjańskim, dostępu do usług publicznych i edukacji oraz prawa własności."
calisia.67.a: "Projekt Popularów"
calisia.67.b: "Projekt Optymatów"

calisia.68.t: "Lex Acculturationis"
calisia.68.desc: "§1Lex Integrationis - projekt Optymatów§!\n1.1. Osoby pochodzenia niekalizjańskiego, które wykazały się wyjątkową służbą lub lojalnością wobec Cesarstwa, mogą zostać dopuszczone do ograniczonych programów kulturowych. Kryteria kwalifikacji obejmują:\na. Co najmniej pięć lat nienagannej służby wojskowej.\nb. Znaczący wkład w rozwój państwa uznany przez Senat.\nc. Udokumentowaną asymilację ze społeczeństwem kalizjańskim poprzez małżeństwo lub długotrwałe zamieszkanie.\n\n1.2. Państwo ustanowi ograniczone programy kulturowe skierowane do nie-Kalizjan spełniających kryteria kwalifikacji. Programy obejmują:\na. Podstawowe kursy języka łacińskiego.\nb. Zajęcia wprowadzające z historii Calisii i jej systemu prawnego.\n\n§RLex Acculturationis - projekt Popularów§!\n1.1. Każda osoba pochodzenia niekalizjańskiego zamieszkująca terytorium Cesarstwa, która wykaże gotowość przyjęcia kalizjańskich wartości i kultury, kwalifikuje się do programów integracji kulturowej. Kryteria obejmują:\na. Udział w programach edukacyjnych poświęconych historii, językowi i obyczajom Calisii.\nb. Zaangażowanie w służbę społeczną i działalność obywatelską.\nc. Okazywanie lojalności wobec Cesarza i państwa.\n\n2.1. Państwo ustanowi i sfinansuje programy integracji kulturowej, których celem jest edukowanie i włączanie niekalizjańskich poddanych do społeczeństwa kalizjańskiego. Programy obejmują:\na. Kursy języka łacińskiego i dialektów kalizjańskich.\nb. Zajęcia z historii, filozofii i systemu prawnego Calisii.\nc. Warsztaty z praktyk kulturowych, tradycji i norm społecznych.\nd. Projekty służby społecznej rozwijające zaangażowanie obywatelskie.\n\n3.1. W miarę potrzeb ze skarbu państwa przeznacza się dodatkowe środki na pomyślne wdrożenie tych programów."
calisia.68.a: "Projekt Popularów"
calisia.68.b: "Projekt Optymatów"

calisia.69.t: "Lex Amori Liberi"
calisia.69.desc: "§1Lex Conservatione Valoris - projekt Optymatów§!\n1.1. Relacje jednopłciowe są dozwolone wyłącznie pod następującymi warunkami:\na. Relacja musi łączyć obywatela płci męskiej z mężczyzną o wyraźnie niższym statusie społecznym (np. niewolnikiem lub nieobywatelem).\nb. Obywatel musi odgrywać w relacji rolę dominującą.\n\n1.2. Niniejsza ustawa nie uznaje związków jednopłciowych osób o równym statusie ani związków obejmujących obywatelki.\n\n2.1. Każde odstępstwo od określonych warunków może skutkować konsekwencjami prawnymi, w tym grzywnami lub innymi karami uznanymi przez sąd za stosowne.\n\n§RLex Amoris Liberi - projekt Popularów§!\n1.1. Związek jednopłciowy definiuje się jako długotrwałą, dobrowolną relację między dwiema osobami tej samej płci.\n\n1.2. Związkom jednopłciowym przyznaje się takie same prawa i ochronę jak małżeństwom heteroseksualnym, w tym między innymi:\na. Prawa własności.\nb. Prawa dziedziczenia.\nc. Ulgi podatkowe.\nd. Prawa dotyczące opieki zdrowotnej i podejmowania decyzji medycznych.\ne. Prawo do adopcji.\n\n2.1. Zakazuje się wszelkich form dyskryminacji osób z powodu uczestnictwa w związku jednopłciowym.\n\n2.2. Osobom doświadczającym dyskryminacji przysługują środki prawne, a sprawców obejmuje się grzywnami i innymi karami."
calisia.69.a: "Projekt Popularów"
calisia.69.b: "Projekt Optymatów"

calisia.70.t: "Lex Aesculapii"
calisia.70.desc: "§1Lex Privatae Curis - projekt Optymatów§!\n1.1. Na terenie całego Cesarstwa legalizuje się swobodną praktykę leczniczą. Prywatne placówki ochrony zdrowia prowadzą niezależni praktycy i organizacje, niezależnie od Ministerstwa Zdrowia. Powstała sieć oferuje szereg usług i terapii zgodnych z kalizjańskimi wartościami kulturowymi oraz moralnymi, wspierając całościowy dobrostan ciała i duszy.\n\n2.1. Rząd zapewni zachęty i wsparcie sprzyjające rozwojowi prywatnych placówek ochrony zdrowia w Cesarstwie.\n\n2.2. Prywatnym praktykom i organizacjom świadczącym usługi zdrowotne przyznaje się ulgi podatkowe i dotacje.\n\n3.1. Niezależne organy akredytacyjne otrzymują uprawnienia do prowadzenia ocen i potwierdzania zgodności z obowiązującymi normami.\n\n§RLex Valetudinis - projekt Popularów§!\n1.1. Pod jurysdykcją Ministerstwa Zdrowia powstaje scentralizowana służba zdrowia z oddziałami we wszystkich głównych miastach i regionach Cesarstwa. Zapewnia ona wszystkim obywatelom kompleksową opiekę medyczną - profilaktyczną, diagnostyczną, leczniczą i rehabilitacyjną - bezpłatnie lub za symboliczną opłatą.\n\n2.1. W celu finansowania scentralizowanej służby zdrowia wprowadza się dwuprocentową podwyżkę podatku od dochodów przekraczających 50 000 denarii rocznie. W miarę potrzeb ze skarbu państwa przyznaje się dodatkowe środki na pokrycie kosztów funkcjonowania służby zdrowia.\n\n3.1. Egzekwuje się rygorystyczne normy jakości i przepisy zapewniające bezpieczeństwo oraz skuteczność terapii i procedur medycznych oferowanych przez scentralizowaną służbę zdrowia. Regularne kontrole i audyty monitorują przestrzeganie tych norm i przepisów.\n\n4.1. Za wdrażanie i egzekwowanie postanowień niniejszej ustawy odpowiada Ministerstwo Zdrowia."
calisia.70.a: "Projekt Popularów"
calisia.70.b: "Projekt Optymatów"

calisia.71.t: "Lex Religionis"
calisia.71.desc: "§1Lex Religionis - projekt Optymatów§!\n1.1. Katolicyzm i politeizm rzymski zostają formalnie uznane za główne religie Calisii, a ich wyznawcom przyznaje się szczególne przywileje i ochronę. Państwo zapewni wsparcie i zasoby na utrzymanie oraz promowanie katolickich praktyk i instytucji religijnych.\n\n1.2. Choć katolicyzm zajmuje szczególne miejsce w historii tej ziemi, Cesarstwo będzie szanować różnorodność wierzeń i praktyk religijnych swoich obywateli. Niekatolickim wspólnotom religijnym gwarantuje się swobodę kultu i zgromadzeń pod warunkiem przestrzegania praw Cesarstwa.\n\n2.1. Zachęca się do nauczania religii w szkołach i na uniwersytetach, ze szczególnym naciskiem na promowanie wartości i nauk katolicyzmu lub politeizmu rzymskiego.\n\n3.1. Ministerstwo Edukacji współpracuje z władzami religijnymi nad wytycznymi programowymi i materiałami do nauczania religii.\n\n§RLex Secularis - projekt Popularów§!\n1.1. Wszystkie instytucje państwowe i organy rządowe zostają ściśle zsekularyzowane, bez powiązania ani poparcia dla jakiejkolwiek konkretnej wiary. W budynkach rządowych i podczas oficjalnych uroczystości państwowych zakazuje się symboli, rytuałów i praktyk religijnych.\n\n2.1. Wszystkim obywatelom Cesarstwa, niezależnie od przynależności religijnej, chroni się i gwarantuje wolność wyznania oraz kultu.\n\n3.1. Dyskryminacja lub prześladowanie ze względu na religię są surowo zakazane i podlegają karze.\n\n4.1. Szczególny status katolicyzmu jako głównej religii Calisii zostaje zniesiony, a Cesarstwo oficjalnie staje się państwem świeckim."
calisia.71.a: "Projekt Popularów"
calisia.71.b: "Projekt Optymatów"

calisia.72.t: "Lex Poenae Capitalis"
calisia.72.desc: "§1Lex Poenae Capitalis - projekt Optymatów§!\n1.1. Wprowadza się karę śmierci za następujące przestępstwa:\na. Zdradę stanu.\nb. Morderstwo z premedytacją.\nc. Przestępstwa z użyciem przemocy skutkujące ciężkim uszczerbkiem na zdrowiu.\nd. Akty terroryzmu.\n\n2.1. Karę śmierci wykonuje się publicznie, między innymi poprzez ukrzyżowanie, walkę na arenie i powieszenie. Dopuszczalne metody obejmują również ścięcie oraz rozstrzelanie.\n\n2.2. Wszystkie sprawy zagrożone karą śmierci podlegają rygorystycznemu postępowaniu sądowemu obejmującemu:\na. Obowiązkową kontrolę zespołu starszych sędziów.\nb. Prawo oskarżonego do pomocy prawnej.\nc. Możliwość odwołania do sądu wyższej instancji.\n\n3.1. Nakaz egzekucji wymaga zgody Pretora, co zapewnia dodatkowy szczebel nadzoru.\n\n§RLex Rehabilitationis - projekt Popularów§!\n1.1. Kara śmierci, czyli poenae capitalis, zostaje zniesiona za wszystkie przestępstwa w Calisii. Istniejące wyroki śmierci zamienia się na dożywotnie pozbawienie wolności z możliwością warunkowego zwolnienia po 25 latach, uzależnioną od dobrego zachowania i dowodów resocjalizacji.\n\n2.1. Państwo ustanowi kompleksowe programy resocjalizacji skazanych, obejmujące:\na. Edukację i szkolenie zawodowe zwiększające szanse zatrudnienia.\nb. Poradnictwo psychologiczne i terapię rozwiązującą przyczyny problemów.\nc. Prace społeczne i inicjatywy sprawiedliwości naprawczej służące naprawieniu krzywd wyrządzonych ofiarom i społeczeństwu.\n\n2.2. Programy finansuje się z dwuprocentowej podwyżki podatku dochodowego dla osób zarabiających ponad 150 000 denarii rocznie."
calisia.72.a: "Projekt Popularów"
calisia.72.b: "Projekt Optymatów"

calisia.73.t: "Operacja \"Porządki\""
calisia.73.desc: "- Trzymajcie się planu, a wszystko pójdzie gładko. Dobra, ruszamy. \n\nZadanie było proste: przemknąć przez linię drzew, uważać na zagrożenia i wycofać się z jak największą liczbą pojmanych kobiet. Następnie zapakować \"łup\" na ciężarówki czekające w lesie i odjechać, zanim pojawi się opór. \nCele przebywały w przygranicznej osadzie Bycz, położonej w pobliżu przedupadkowej granicy między Kujawami a Wielkopolską. \n\nPoczątkowo wyglądało na to, że Amazonki opuściły wieś: nigdzie nie było uzbrojonego personelu, a najbliższe ślady aktywności wroga znajdowały się prawie kilometr dalej, przy małym posterunku w Wyrobkach. Gdy operator drona upewnił się, że nikt ich nie obserwuje, mężczyźni otoczyli wieś i jednocześnie wtargnęli do kilku pierwszych budynków, chcąc pozostawić ofiarom jak najmniej czasu na reak... UWAGA, MINA! \n\nW jednej chwili eksplozja rzuciła całą grupę na ziemię i zmiotła połowę działki nr 30. Zaraz potem pełna kompania żołnierek zaatakowała z dwóch stron i rozbroiła ich w kilka sekund. Najeźdźców zabrano następnie do miejscowej remizy, spędzono razem, znokautowano i wepchnięto do furgonetek czekających w garażach. \n\nPółnocne pogranicze Calisii, wczesny ranek. Dowódca miejscowego garnizonu właśnie się obudził, kipiąc z podekscytowania. Jego chłopcy musieli wrócić z celami! Cóż za rozkosz! To trzeba uczcić! \n\nMężczyzna wstał, włożył wygodne ubranie, chwycił portfel i ruszył do miejscowego Supermercatusa. Hmm... kilka piw? Nie, trzeba czegoś bardziej wyszukanego. O! Może rum? Rum z poranną kawą brzmi nieźle. Albo dobre wino? W końcu jesteśmy teraz Rzymianami, prawda? \nWesoły dowódca maszerował więc dalej, zastanawiając się, co wybrać. Gdy dotarł na parking marketu, jego myśli na chwilę zatrzymały się przy półce z alkoholem. \n\nTam również znalazł swój pluton - leżący bez przytomności w samych gaciach, z głowami wepchniętymi do skrytek paczkomatu."
calisia.73.a: "No gładko to to nie było."

calisia.74.t: "Argumentum ad Tuam Vestram"
calisia.74.desc: "Rodzące się Forum Calisianum tętniło odgłosami walki. Puste dzbany po winie zostały już wyczerpane, więc tłum sięgnął po kostkę brukową i dachówki. Siły porządkowe - ta garstka, która w ogóle przybyła - nie próbowały powstrzymać zamieszek. Skupiły skromne siły na eskortowaniu dwóch oszołomionych mężczyzn ze środka placu do jednej z kamienic. \n\n- Cóż... - wymamrotał jeden z nich. - Nigdy nie podejrzewałem, że filozofia może poruszyć ludzi aż tak bardzo. \n- To nie filozofia, tylko alkoholizm - odpowiedział drugi. - Mimo wszystko zaskoczyło mnie, że w ogóle zechcieli słuchać mówców. \n- Gdyby tylko skupili uwagę w innym momencie. Obawiam się, że wzmianka o edykcie Karakalli nieco ich wzburzyła. \n- Chciałem ci powiedzieć, że wymienianie tego imienia nie było roztropne. Za bardzo przypomina \"karakana\". \n- Cóż, i tak musiało do tego dojść. Nie można dyskutować o obywatelstwie bez wspomnienia Karakalli. \n- Można i należy. Edykt wydano wieki po tym, gdy Cesarstwo Rzymskie zakorzeniło się na ziemiach barbarzyńskich. Lud był już wtedy dobrze zromanizowany. \n- Och, ale *my* nie jesteśmy dobrze zromanizowani. Wszyscy przeszliśmy przez bardzo prostą przemianę w ciągu zaledwie kilku lat. Teraz, dzięki scentralizowanemu i prawowitemu rządowi, proces ten zachodzi jeszcze szybciej. \n- Nasz rząd ledwie zmusza barbarzyńców do kąpieli raz w tygodniu. Nie staną się Kalizjanami nawet za milion lat. Zwłaszcza jeśli naprawdę spróbują zachowywać się jak my. \n- Słuchaj, po prostu mylisz kulturę miejską z kalizjańską tożsamością. Tak, może brakuje im miejskich manier, do których przywykliśmy, ale to tylko kwestia warunków życia, a nie... \n- To Kalizjanie z Calisii zbudowali to Cesarstwo i nikt inny. Sugerujesz, że wszystko wydarzyło się przypadkiem? \n- Jakie to ma znaczenie? Czy wcześniej nie byliśmy jednym ludem? Czy nie byliśmy Wenedami? Czy Rzymianie nie byli pierwotnie tylko jednym z plemion italskich? \n- Wenedowie, owszem, być może mogliby być Kalizjanami. Ale barbarzyńcy? Jak mieliby to pojąć? Zaczęli w zupełnie innym miejscu niż my i nie czują się tu jak u siebie, prawda? Jeśli Kalizjanin jest ewolucją Weneda, to oni powinni wyewoluować we własną stronę. O ile w ogóle potrafiliby to zrozumieć. \n- Nie sądzisz, że moglibyśmy wykorzystać szansę podarowaną przez los? Że mamy nową-starą, plastyczną kulturę zdolną zjednoczyć wszystkich, tak jak uczyniła to kultura rzymska? Że możemy stworzyć lepszy świat, budując zupełnie nowy dom, który wreszcie pomieści nas wszystkich? \n\nNa chwilę zapadła znaczna - jak na bójkę szalejącą na zewnątrz - cisza. \n- Pomieści nas wszystkich? Wczoraj wieczorem twój ojciec powiedział to samo o twojej matce, kiedy chciał się dołączyć. \nRozległ się trzask i po raz kolejny nikt na Forum Calisianum nie próbował rozwiązywać problemów rozmową."
calisia.74.a: "Jakby to było konieczne..."

calisia.75.t: "Mundus Familiae Vitiosorum"
calisia.75.desc: "Każdego ogarniało nieswoje uczucie, gdy wchodził na plan. Owszem, krzesła zastąpiono lecti triclinia, a obrazy groteskami i niby-marmurowymi popiersiami, lecz wnętrze miało te same proporcje co pewien pokój sprzed lat, znajdujący się w studiu telewizyjnym daleko stąd, za kilkoma granicami politycznymi i kulturowymi. Zdjęcia miały się właśnie rozpocząć, a kamery wycelowano w wchodzącego do pokoju mężczyznę w średnim wieku o nieco zaniedbanym wyglądzie. \n\n- Nie, no nie, co to kurwa jest? - krzyknął reżyser. - Natychmiast ogolić tego gbura! \nCzłonkowie ekipy spojrzeli na siebie zdezorientowani. \n- Co... To znaczy, mamy... \n- On ma pieprzonego wąsa! Wygląda jak barbarzyńca! To ma być serial o Rzymianach! Biednych Rzymianach, pijanych Rzymianach, najbardziej nędznych Rzymianach ze wszystkich - ale Rzymianach! Tak tego nie mogę puścić - westchnął. - Marcusie, weź brzytwę i zabierz go do charakteryzatorni. \n- Nie zamierzam się golić - oświadczył aktor. Reżyser ponownie wypuścił powietrze, ledwie panując nad złością. \n- Andreasie, zarabiasz tu pięć kawałków. Nie jesteś w pozycji, by narzekać. Proszę, bądź Rzymianinem i zgól tego jebanego wąsa. \n- Słuchaj, nie rozumiesz sedna. Nie robimy serialu o Rzymianach. Jest o Kalizjanach. \n- Kochany, wiem, wiem, niektórzy nadal noszą zarost, jakby był rok 2023. Gdybym chciał kręcić dokument, poszedłbym do National Geographic. Ale tutaj robimy serial, który ma przekonać ludzi, że bez względu na to, jak nisko upadli, nadal są Rzymianami. I powinni zachowywać się jak Rzymianie. Także nosić zarost jak Rzymianie. A ten sarmacko-dyskotekowo-sumowy wąs nie należy do tej kategorii. \n- Mów sobie, co chcesz, nie zgolę go. Zwolnij mnie, jeśli masz ochotę. Albo wykonuję tę pracę z wąsem, albo wcale. \n\nAtmosfera była tak napięta, że można ją było pomylić z plusquamperfectum. Reżyser przetarł twarz dłonią i zaczął od nowa. \n- Wyobraź to sobie: twoja pracująca żona wraca do domu po wykańczającej zmianie w ambulatorium i widzi twoją proletariacką dupę rozwaloną na lectusie, pijącą wino z kretyńskim synem. Zamiast zapytać, czy szukałeś pracy, musi powiedzieć: \"Dlaczego jeszcze się nie ogoliłeś? Byłeś u tonsora?\". I co odpowiesz? \n- Cóż... \"Nie byłem, bo w tym Cesarstwie nie ma tonsora dla ludzi z moją gravitas\"."
calisia.75.a: "- Chyba możemy tak zrobić."

calisia.76.t: "Foedus Profanus"
calisia.76.desc: "Złożenie broni i podróż pod silną eskortą prosto do serca Imperium Calisianum nie były dla barbarzyńskich przywódców łatwą decyzją. Wszystko nosiło znamiona spisku: próby odizolowania ich, wyrżnięcia, a następnie wkroczenia do Germanii niemal bez oporu. Zazdrościli tym, którzy okazali dość uporu, by zostać, przekonani, że w końcu trafi się lepsza okazja. Dopóki Popularzy nie weszli do sali negocjacyjnej z równie skromną ochroną, czuli przy karkach zimną, twardą stal gladiusów. Teraz obie strony tkwiły w tej samej pułapce. \n\n- Dobrze, będę mówił krótko, bo na całe spotkanie mamy tylko piętnaście minut - zaczął najwyższy rangą uczestnik, przynajmniej sądząc po jaskrawości jego togi. - Wszystko ponad to wzbudzi podejrzenia Optymatów. Pierwsze dwa głosowania już przegraliśmy. Czego zatem chcecie? \n- Zakładam, że już wiesz, Konsulu, iż Germania upadła. Nie mamy dokąd uciekać. Przyprowadzamy dobrych ludzi gotowych do uczciwej pracy. Calisia z pewnością znajdzie miejsce dla kilku milionów dodatkowych, lojalnych poddanych - jeden z Barbari błagał z oratorskim talentem doświadczonego polityka. Andreas Compa mógłby przysiąc, że wyglądał znajomo. Musiał kiedyś dawno temu widzieć tę twarz. I ten podejrzany brak germańskiego akcentu... Gdyby nie łachmany, cudzoziemiec z łatwością uchodziłby za kolejnego Senatora. Mrożąca krew w żyłach myśl. \n- Poddanych, którzy nie znają języka, kultury i z pewnością nie cenią estetyki. Nie jesteśmy zwolennikami szowinistycznego bicia w bęben, lecz już teraz ledwie sobie radzimy. \n- Konsulu, osobiście dopilnuję, by każdy z moich rodaków się zasymilował. A tym, którzy tego nie zrobią, przypomnimy, że zawsze mogą wrócić na niewłaściwą stronę Viadrusu. Ze skarbu państwa nie trzeba będzie wydać ani jednego denara. \n- A gdzie haczyk? Wydajesz się zdecydowanie zbyt... posłuszny jak na krwiożerczych grabieżców, przed którymi nieustannie ostrzegają nas \"przyjaciele\" po drugiej stronie sali. \n- Za dużo propagandy Optymatów, Konsulu? - barbarzyńca cicho zachichotał. \n- Cóż, kiedy człowiek jest bombardowany nią dniem i nocą, nic dziwnego, że część uprzedzeń przenika do głowy. Przyzwyczaisz się. Kiedy dostatecznie długo pomieszkasz w stolicy, zaczniesz przysięgać, że członkowie plemion, z którymi dzielisz się chlebem, są bestiami w ludzkiej skórze. To właściwie część inicjacji. \n- Czy to znaczy, że pozwolicie naszym ludziom się osiedlić? - w głosie barbarzyńcy zabrzmiała stłumiona nadzieja. \n- Och, proszę cię, to oczywiste. Decyzję podjęto na długo przed waszym przybyciem. Nie dlatego was zaprosiliśmy. Na horyzoncie zbiera się burza. Optymaci nie spoczną, dopóki nie zabijemy albo nie wygnamy każdego z was. Jedynym wyjściem jest stępienie ich kłów. A do tego potrzebujemy waszego wsparcia. \n- Wolelibyśmy nie mieszać się w kolejną polityczną awanturę, ale jeśli to jedyny sposób... nie mamy wyboru i musimy się zgodzić. \n- Świetnie. Mogę poznać imię mojego współspiskowca? \n- Tusc. Donaldus Tusc - odpowiedział, gdy obaj uścisnęli sobie dłonie."
calisia.76.a: "Cholera, naprawdę brzmi znajomo..."

calisia.77.t: "Senatus PopulusQue Barbarianus"
calisia.77.desc: "Cała debata nad Programem Integracji Barbarzyńców była, delikatnie mówiąc, protekcjonalna. Gdyby Donaldusa Tusca nie ciągnęło z natury ku ośrodkom władzy, poważnie rozważyłby wycofanie się z umowy z Kalizjanami. Niestety dobro ludów germańskich wymagało, by przełknął resztki dumy i grzecznie stawił się w Senacie zgodnie z rozkazem. Zabroniono mu nosić togę, aby nikt przypadkiem nie pomyślał, że należy do nieskazitelnie marmurowych wnętrz gmachu, toteż Donaldus musiał znosić hańbę jaskrawej kamizelki odblaskowej dostarczonej przez państwo, z ogromnym napisem \"BARBARI\" na całej długości. Dla jego godności niemal równie upokarzające było stanie parami z rodakami, podczas gdy chyba każdy dostępny Optymata przybył, by z nich szydzić. Bezcelowe błąkanie się po krętych korytarzach przypominało okrutną torturę. Byli już bliscy wyjścia i porzucenia całej farsy, gdy wreszcie wkroczył senator Compa i przerwał ich cierpienie. \n\n- Ach, panie Tusc, jak cudownie, że do nas dołączyłeś. Przepraszam za... ograniczone horyzonty moich kolegów. Nauczenie ich podstawowych manier okazało się sporym wyzwaniem. \n- Nic nie szkodzi, Konsulu - odpowiedział stoicko barbarzyńca. - Spodziewałem się demonizacji od chwili, gdy postawiłem stopę na polskiej... ee... wenedzkiej ziemi. Złe wspomnienia, rozumiesz. \n- Naprawdę... przykro mi to słyszeć. Mam nadzieję, że ta szansa choć trochę ci to wynagrodzi. Nie miałeś chyba wcześniej okazji oglądać procesu demokratycznego z bliska? \n- Hmm, powiedzmy, że parałem się czymś podobnym w domu - odpowiedział Tusc z bladym uśmiechem, ukrywając łzę pojawiającą się w kąciku oka. \n\nPatron zaprowadził ich na górną galerię i polecił \"cieszyć się widowiskiem\". Delegacja barbarzyńców rozsiadła się w teatralnych fotelach, by omawiać subtelniejsze szczegóły kalizjańskiej polityki przy odgłosach chrupania gór popcornu i siorbania napojów zapewnionych przez Popularów. Gdy rozmowy ucichły, światła przygasły, a senatorowie zaczęli kolejno wchodzić do sali. Konsul Compa natychmiast zajął centralne miejsce. \n\n- Rodacy, oto naprawdę doniosła chwila. Mimo szerzenia strachu przez Optymatów poczyniliśmy wielkie postępy w dziedzinie akceptacji społecznej. Dlatego, jako symbol tego postępu, dzisiejsze posiedzenie Senatu będzie obserwowane przez lojalną grupę przywódców Barbari! Chciałbym oficjalnie podziękować... \n\nAndreas Compa z hukiem runął na podłogę, odepchnięty przez konsula Caletusa próbującego przejąć mównicę. \n\n- Tak, tak, powitajmy wszyscy nadchodzącą zgubę naszego Cesarstwa. Genialne, Andreasie, naprawdę, ty przebiegły sukinsynu. Wpuść ich, zastąp wszystkich Kalizjan barbarzyńskim ścierwem, a potem śmiej nam się w twarz, gdy wszystko, co zbudowaliśmy, rozsypie się w pył. Powiem ci coś, Andreasie! Jeśli sądzisz, że możesz odwrócić się od Calisii, ciężko się mylisz. Dopilnuję, by każdy z tych kundli został deportowany za limes! A Jowisz mi świadkiem, jeśli nawet sam Cesarz ośmieli się stanąć przeciwko mnie, zadbam, by spotkał go ten sam koniec co każdego innego zdrajcę! \n\nOpróżniając torbę i jedząc po kilka płatków naraz, oczarowany pokazem politycznego teatru, Tusc zachichotał i pomyślał:"
calisia.77.a: "Niektórzy naprawdę nigdy się nie zmieniają, pośle Kaleta."
calisia.77.b: "Niektórzy naprawdę nigdy się nie zmieniają, pośle Kaleta."

calisia.78.t: "Lex Barbarorum"
calisia.78.desc: "§1Lex Invadoris - projekt Optymatów§!\n1.1. Bezpieczeństwo granic zostaje wzmocnione dodatkowymi patrolami i fortyfikacjami, by zapobiegać nieuprawnionemu przedostawaniu się mas barbarzyńskich na terytorium Calisii.\n\n1.2. Wszelkie próby naruszenia granicy spotkają się z szybką i zdecydowaną odpowiedzią, a wojsko otrzymuje upoważnienie do użycia wszelkich środków koniecznych do odparcia najeźdźców.\n\n2.1. Barbarzyńcom uznanym za zagrożenie dla bezpieczeństwa i stabilności Calisii odmawia się wstępu do Cesarstwa; w celu wykrywania i zatrzymywania potencjalnych zagrożeń wprowadza się ścisłe kontrole graniczne i procedury weryfikacyjne.\n\n2.2. Barbarzyńcy już przebywający w granicach Calisii podlegają deportacji albo internowaniu w wyznaczonych ośrodkach odosobnienia do czasu zbadania i rozstrzygnięcia ich statusu.\n\n3.1. Zakazuje się wszelkich prób destabilizowania sytuacji w stolicy poprzez agitację lub zgromadzenia polityczne, a władze będą je szybko tłumić. Wiecom głoszącym niebezpieczne poglądy zagrażające bezpieczeństwu obywateli odmawia się zezwolenia.\n\n§RLex Barbarorum - projekt Popularów§!\n1.1. Barbarzyńscy imigranci przechodzą proces asymilacji, obejmujący naukę języka i kultury, aby ułatwić ich integrację ze społeczeństwem kalizjańskim.\n\n1.2. Ustanawia się kontrolowane programy osadnicze służące przyjmowaniu i monitorowaniu napływu ludności barbarzyńskiej oraz zapewnieniu jej pokojowego współistnienia z obywatelami kalizjańskimi. Barbarzyńcy okazujący lojalność i przestrzegający kalizjańskich praw i wartości otrzymują możliwości integracji z aparatem cesarskim, w tym poprzez służbę wojskową, administrację cywilną i inne instytucje państwowe.\n\n1.3. Wprowadza się szczególne przepisy zachęcające wspólnoty barbarzyńskie do udziału w zarządzaniu Cesarstwem i jego obronie oraz ułatwiające ten udział.\n\n2.1. Zakazuje się wszelkich prób destabilizowania sytuacji w stolicy poprzez agitację lub zgromadzenia polityczne, a władze będą je szybko tłumić. Collegia i inne zorganizowane grupy podlegają szczegółowej kontroli, by zapobiegać polaryzacji i panice oraz utrzymać cesarską stabilność.\n\n3.1. Za wdrażanie i nadzorowanie postanowień niniejszej ustawy odpowiada Ministerstwo Integracji i Spraw Barbarzyńskich."
calisia.78.a: "Projekt Popularów"
calisia.78.b: "Projekt Optymatów"

calisia.780.t: "Lex Coequatio"
calisia.780.desc: "§1Lex Punitivus - projekt Optymatów§!\n1.1. Kodeks podatkowy zostaje zmieniony w celu usunięcia istniejących luk i zapewnienia sprawiedliwego opodatkowania we wszystkich przedziałach dochodowych, ze szczególnym naciskiem na zwiększenie dochodów bez nakładania nadmiernego ciężaru na ludność.\n\n1.2. Na osoby i przedsiębiorstwa dopuszczające się uchylania od opodatkowania lub oszustw nakłada się surowe kary, w tym wysokie grzywny i konfiskatę majątku.\n\n2.1. Rozpoczyna się kampanie publiczne uświadamiające obywatelom znaczenie przestrzegania przepisów podatkowych oraz rolę podatków w finansowaniu niezbędnych usług publicznych i projektów infrastrukturalnych.\n\n2.2. Podejmuje się inicjatywy nagradzające przestrzeganie przepisów i zachęcające do niego, w tym ulgi dla osób oraz przedsiębiorstw wzorowo wywiązujących się z obowiązków podatkowych.\n\n§RLex Tributum Iustitialis - projekt Popularów§!\n1.1. Wszystkie aktywa, nieruchomości i zasoby finansowe posiadane przez obywateli powyżej wyznaczonego progu podlegają natychmiastowej redystrybucji wśród ogółu obywateli.\n\n1.2. Wprowadza się równy system podatkowy zapewniający sprawiedliwy podział bogactwa, w którym wyższe przedziały dochodowe podlegają zwiększonym stawkom.\n\n2.1. Na osoby gromadzące majątek lub próbujące uchylać się od opodatkowania nakłada się surowe kary, w tym konfiskatę majątku i pozbawienie wolności.\n\n2.2. Powołuje się specjalne trybunały badające i osądzające przypadki wyzysku gospodarczego oraz nierówności, zapewniając odpowiedzialność i sprawiedliwość.\n\n3.1. Za wdrażanie i nadzorowanie postanowień niniejszej ustawy odpowiada Ministerstwo Równości Gospodarczej."
calisia.780.a: "Projekt Popularów"
calisia.780.b: "Projekt Optymatów"

calisia.781.t: "Lex Administrationis"
calisia.781.desc: "§1Lex Foederationis - projekt Optymatów§!\n1.1. Gubernatorom przyznaje się szersze uprawnienia do podejmowania decyzji dotyczących administracji regionalnej, w tym rozdziału budżetu, rozwoju infrastruktury i egzekwowania prawa.\n\n1.2. Rząd centralny zapewnia legatom wsparcie i zasoby ułatwiające sprawne rządzenie oraz przestrzeganie cesarskich praw i zarządzeń.\n\n2.1. Regiony zachęca się do opracowywania i wdrażania polityk dostosowanych do ich szczególnych warunków, przy minimalnej ingerencji władz centralnych, co ma wspierać innowacyjność i zdolność adaptacji.\n\n2.2. Gubernatorzy odpowiadają za reprezentowanie interesów swych regionów w Senacie i popieranie polityk sprzyjających rozwojowi lokalnemu oraz dobrobytowi.\n\n3.1. Wzmocnienie legatów i promowanie autonomii regionalnej rozpoczyna się natychmiast po przyjęciu i zatwierdzeniu niniejszej ustawy przez Senat. Rząd centralny zapewnia gubernatorom wytyczne i pomoc, by umożliwić płynne przejście do zdecentralizowanego modelu rządów opisanego w ustawie.\n\n§RLex Centralisationis - projekt Popularów§!\n1.1. Powołuje się Komitet Centralny złożony z mianowanych przedstawicieli, który nadzoruje administrację regionalną i koordynuje z władzami lokalnymi wdrażanie cesarskiej polityki oraz inicjatyw.\n\n1.2. Komitet Centralny ma prawo interweniować w sprawy regionalne uznane za sprzeczne z interesami Cesarstwa lub niezgodne z cesarskimi zarządzeniami.\n\n2.1. Komitet Centralny odpowiada przed Senatem i Cesarzem, regularnie składając sprawozdania ze swoich działań i decyzji w celu zapewnienia przejrzystości i odpowiedzialności.\n\n2.2. Ustanawia się mechanizmy nadzoru monitorujące działalność Komitetu Centralnego i oceniające jego skuteczność w realizacji celów niniejszej ustawy.\n\n3.1. Wszystkie regiony Cesarstwa mają obowiązek pełnej współpracy z Komitetem Centralnym i udzielania pomocy niezbędnej do jego działania."
calisia.781.a: "Projekt Popularów"
calisia.781.b: "Projekt Optymatów"

calisia.79.t: "Rutyna."
calisia.79.desc: "§RPik, pik, pik...§!\n\nDłoń wyłoniła się spod kołdry i jednym ruchem nacisnęła przycisk cyfrowego zegara. Zaspany i wciąż otumaniony Victor wstał, ziewając. Piąta rano - chyba najgorsza pora, by budzić się na zmianę. Chwycił mundur i poszedł do prowizorycznej latryny z tyłu. \n\nW lustrze stał przed nim wysoki mężczyzna z potarganą, zaniedbaną brodą i zmęczoną twarzą. Zdecydowanie nie wyglądał jak żaden zwycięzca. Bez zbroi trudno byłoby go odróżnić od barbarzyńcy. Wystarczyłoby zamienić ubrania i nikt niczego by nie zauważył. \n\nZ kranu leciała zimna woda, a jedynym źródłem światła była latarka na wyczerpującej się baterii oraz odrobina porannego słońca wpadającego z zewnątrz. Nadal nie mieli prądu, a cennego paliwa do generatora nie uznano za wystarczająco ważne, by marnować je na zasilanie koszar, zwłaszcza o tak wczesnej porze. \n\nKilka minut później wyszedł z latryny, potem z koszar i wkroczył w chłodne poranne powietrze. Mgła była tak gęsta, że nie widział drugiego końca pola otaczającego posterunek. Dawniej była to bramka poboru opłat, teraz całkiem przyzwoity umocniony punkt kontrolny na drodze z Goreliz do Budissiny. Nad nim nadal wisiał znak \"Autobahn 4\", tuż obok kalizjańskiego sztandaru. \n\nZ racją śniadaniową w dłoni podszedł do jedynej budki, którą raczyli utrzymać w działaniu, i zapukał w szybę. Odsunęła się, ukazując równie znudzonego, choć prawie gładko ogolonego legionistę z wyraźnymi skaleczeniami po próbach golenia nożem. \n\n- Hej, Octaviusie, przybył twój wybawca. Moja kolej przy grzejniku. \n\n- Och, Victor. Tak, tak, daj mi chwilę. Mam tu trochę śmieci do zebrania. \n\n- Wydarzyło się coś ciekawego na nocnej zmianie?\n\n- Jasne. Ufoludki przywiozły mi z kosmosu zimny kieliszek wina. Oczywiście, że nie. Czego się spodziewałeś?\n\n- Niewiele. Myślałem, że będzie tu trochę więcej akcji. A teraz pośpiesz się i idź spać. Przejmuję budę.\n\nOctavius wkrótce wyszedł, niosąc plastikową torbę z opakowaniami po racjach żywieniowych i różnymi śmieciami oraz gruby tom książki fantasy w drugiej ręce. Victor objął stery budki. Poza koszarami było to właściwie jedyne ogrzewane miejsce dzięki małemu grzejnikowi pod biurkiem. Obok stał niewielki czajnik elektryczny, niemal kopany kilka razy na każdej zmianie, lecz nigdy nieprzestawiany. Victor natychmiast użył go do przygotowania śniadania.\n\nMinęło wiele godzin, zanim wydarzyło się cokolwiek godnego uwagi. Victor z pełnym zaangażowaniem wpatrywał się w przypadkową ścianę. Był już przy ósmym cyklu zmiany punktu, na który patrzył. Wtedy zgasł prąd. Zaklął pod nosem i poszedł po najlepiej wykwalifikowanego inżyniera, Constantinusa - absolwenta technikum elektrycznego."
calisia.79.a: "Ten elektryk miał się zjawić trzy dni temu."

calisia.80.t: "Hic Sunt Dracones"
calisia.80.desc: "Dziennik Remigiusa Savicusa, dzień 5\n\nWybrzeże Balticum jest spokojne jak zawsze. Nie różni się zbytnio od okolic Svina Ostium. Nasza wyprawa obozuje w małym kalizjańskim posterunku między Zinnowitz a Zemplinem. Mimo... hałaśliwej natury Germanów misja zespołu przebiega całkiem dobrze. \n\nStatystyki sprzed rozpadu Germanii wskazują, że większe osady odwiedzone dotychczas utraciły średnio 47% ludności. Na wsiach zachodzi zjawisko odwrotne: napływają uchodźcy z bardziej zurbanizowanych ośrodków. Handel wymienny całkowicie zastąpił formalną walutę, lecz kalizjańskie denary weszły już do obiegu, jeszcze przed przybyciem Legionów.\n\nO poranku opuścimy obóz po otrzymaniu dodatkowego paliwa i zapasów na drogę. Przed Wolgast mamy w planie jeszcze kilka wsi, a przed Greifswaldem znacznie więcej.\n\nDziennik Remigiusa Savicusa, dzień 7\n\nPeenemunde i tamtejsze lotnisko. Jak dotąd to największy ślad kalizjańskiej obecności na nowo podbitych ziemiach. Dzięki małemu portowi i wspomnianemu lotnisku legioniści, a nawet kilku chętnych obywateli, już czynią z wioski oraz jej okolic swój nowy dom. \n\nTablice z kalizjańską nazwą osady zastępują oznaczenia jej dawnej germańskiej tożsamości, a wszelkie wzmianki o starej nazwie są zdrapywane. Według naszej wiedzy żaden inny nowo podbity obszar nie przyjął jeszcze zlatynizowanej nazwy. Większość rdzennej ludności wsi wyjechała na prowincję albo została siłą wypędzona przez regionalną administrację.\n\nLotnisko stało się czymś w rodzaju legionowego węzła, a dowództwo rejonu Wolgast mieści się tutaj zamiast w samym mieście. Podobno miasto nie jest w stanie przyjąć żadnej administracji. Wkrótce przekonamy się sami, gdyż będzie następnym przystankiem podróży.\n\nDzień 8\n\nMasowe groby. Dziesiątki, przynajmniej tych odnalezionych. Ostrzegano nas przed zniszczeniami w Wolgast, lecz nawet w najgorszych snach nie spodziewaliśmy się widoków, które widniały teraz przed nami. Niemal połowę miasta spalono doszczętnie. Według informacji od oficera garnizonu większość zniszczonych budynków była już w tym stanie, zanim Legiony wkroczyły do miasta. To samo dotyczy większości masowych grobów. \n\nPozabijali się nawzajem. Rzucili sobie do gardeł, gdy ich Konfederacja zaczęła się rozpadać. Z wcześniejszej ludności liczącej około 13 000 zdołaliśmy odnaleźć niewiele ponad tysiąc. Głód przyniósł desperację, desperacja barbarzyństwo, a barbarzyństwo zdziesiątkowało miasto. Po drodze oglądaliśmy groteskowe sceny, lecz tego mój żołądek już nie wytrzymał."
calisia.80.a: "Składam rezygnację."

calisia.81.t: "Filius Fortunatus"
calisia.81.desc: "Przez całe życie miałem pecha. Urodziłem się po niewłaściwej stronie muru oddzielającego Dzielnicę Plebejską od Senatorskiej i odtąd żyłem w cieniu tych niewdzięcznych mend. Kiedy ojciec nie upijał się do nieprzytomności w Świątyni Bachusa, próbował przywracać swój autorytet w domu pasem i biczem. Nauczyłem się uciekać, gdy tylko słyszałem jego kroki. Przez szczelinę w zaporze prześlizgiwałem się, by obserwować dzieci klasy rządzącej, rozpieszczane luksusem i bez troski rozkazujące służbie. Chyba właśnie tam narodziła się ich pogarda dla naszego życia. Nie jestem jednak synem Senatora, więc nie dostanę żadnej drogi na skróty. \n\nTeraz, gdy ostrzę gladius i szykuję się do wojny, perspektywa ich dowództwa pozostaje równie przerażająca. Patrzę, jak mój przełożony, ledwie dość stary, by służyć, żałośnie próbuje podnieść legion na duchu. Ave Calisia - krzyczy. Ave Calisia - mamroczę w odpowiedzi. Rozkazuje nam samotnie maszerować przez Las Markomański. Wejść za linie wroga. Walczę z chęcią protestu i powiedzenia mu, że to na pewno zasadzka. Nie jestem jednak synem milionera, więc maszeruję ku śmierci. \n\nNasz legion przedziera się przez las, a korony drzew coraz bardziej zasłaniają niebo. Mężczyzna przede mną, moja jedyna latarnia w tym morzu, pozostaje bezimienny, bo on również jest zbędny. Kiedy strzała przebija mu czaszkę, nie ronię łzy. Wypełnił obowiązek; zginął dzielnie za kraj. Być może ogłoszą go bohaterem, zapewnią należyty pochówek i wystawny grób. Nie jestem jednak synem wojskowego, więc moja służba zostanie zapomniana. \n\nGdy powietrze wypełnił dźwięk bębnów, a germańskie pieśni zagłuszyły wszystko, patrzyłem, jak legion się rozpada, a żołnierze uciekają na wszystkie strony. Rozważałem ucieczkę i ocalenie się przed barbarzyńską nawałą, lecz jaki był sens? Wyszkolono mnie do walki, urodziłem się, by umrzeć, i nie zasługiwałem na nic więcej niż spoczynek przy korze bezimiennego drzewa. Zostałem więc i wymachiwałem mieczem zgodnie z rozkazem, aż ostrze topora rozorało mi pierś. Ranny upadłem na miękki mech i wziąłem ostatni oddech. Ścisnąłem nieśmiertelnik z napisem \"Iacobus Melnicus\". Może ktoś go znajdzie, może uczci moją pamięć. Nie jestem jednak szczęśliwym synem, więc pozostanie między korzeniami."
calisia.81.a: "I tak moja opowieść kończy się na zawsze."

calisia.82.t: "Nikt nie wychodzi"
calisia.82.desc: "Powiedzieć, że Caletus był zdenerwowany, byłoby niedopowiedzeniem, choć z zewnątrz wyglądało to jak kolejne posiedzenie Senatu. \n- Twoi chłopcy wystrojeni? Dobrze. Zaczynamy przedstawienie. Będziemy ich grillować tak długo, aż poczują się jak Katylina na kanapie z pięcioma Cyceronami za plecami. Pamiętaj: nie wchodźcie do sali Senatu. Nie chcemy zdjęć pretorian za Senatorami. Źle by to wyglądało. \n- Tak jest. Nikt nie wchodzi, nikt nie wychodzi. \n- Świetnie. Ja przemówię pierwszy, potem Scarginscis, a następnie... \nDrzwi sali otworzyły się z impetem. \n- Mamy problem. Dowiedzieli się. \n- Co? \n- Popularzy wiedzą. Zastanawiają się, czy wyjść. \n- Cholera. Cholera. Poślij więcej ludzi na górę. Odciąć wszystkie drzwi. Jeśli spróbują odejść, wepchnijcie ich z powrotem. Delikatnie - odpowiedział Caletus. - Wchodzimy z liktorami. \n\nDrzwi się otworzyły i Optymaci wkroczyli w rozwrzeszczane morze białych tog i czerwonych ze złości głów, które ciskały w nich najdziksze obelgi. Liktorzy, którzy mieli podążać za puczystami, musieli torować im drogę ku mównicy. \n- To pogwałcenie świętości Senatu! Nie pozwolę na to! \nCaletus już miał ulec impulsowi i odpowiedzieć tak, jak na jego miejscu odpowiedziałby każdy. \n- Ja jestem Sena... \nChwila. To nie był senator związany z Popularami. To był Optymata. Lewicujący, ale jednak. Jakiś mało istotny paryteciarz wciśnięty do środka tylko po to, by zgadzała się liczba głosów. Jak się nazywał? Agrippa? Agrippa jaki? Agrippa Apapus - błysnęło w umyśle Caletusa i zachichotał w duchu. Tak mocno, że zapomniał, co miał powiedzieć. \n- Co ty, kurwa, robisz? Jesteś nasz! \n- Co *TY* kurwa robisz? To ma być zamach stanu? Za kogo ty się uważasz? Za jakiegoś pospolitego uzurpatora, którego po tygodniu wrzucą do Prosny! \n- Jesteś z Popularami? Barbarzyńcy za mocno cię wyruchali? Spierdalaj! \n- Właśnie to zrobię! Róbcie, co musicie, ja nie będę w tym uczestniczył! Wychodzę! \n\nGdy Senator ruszył ku drzwiom, do sali wszedł oficer i rozłożył ręce, próbując go zatrzymać. Cholerny idiota - pomyślał Caletus. Hałas był ogłuszający. Liktorzy ruszyli w górę, by schwytać uciekiniera. \n- Zejdź mi z drogi, sługusie - Agrippa spróbował go odepchnąć. Pretorianin odepchnął go z powrotem. Delikatnie. Starszy Senator poleciał na liktorów, na ich fasces, a potem runął na podłogę. Krew poplamiła togę. \n\nRozwścieczeni Senatorowie rzucili się na liktorów i ku drzwiom. Pretorianie wkroczyli, utworzyli kordon i zepchnęli ich do ław. Caletus ze świtą chwycili się mównicy, patrząc, jak leżący mężczyzna zostaje zadeptany. Gdy żołnierze posuwali się naprzód, wszyscy Senatorowie zostali stłoczeni w skuloną masę na swoich miejscach, uciszoną serią wystrzałów. Dwóch Pretorian chwyciło ledwie oddychającego Agrippę i wepchnęło go na siedzenie, gdzie jego nieprzytomne ciało rozlało się z obnażoną piersią sczerniałą od licznych siniaków. \n- Em..., rozpoczniemy dzisiejsze nadzwyczajne posiedzenie Senatu od głosowania nad usunięciem ze stanowisk następujących zdrajców, tchórzy i zwolenników barbarzyństwa..."
calisia.82.a: "899 za, jeden wstrzymał się od głosu."
calisia.82.b: "899 za, jeden wstrzymał się od głosu."

calisia.83.t: "Divide et Impera, po raz kolejny"
calisia.83.desc: "Caletus wziął duży łyk wina i uśmiechnął się do stosu papierów. Była to sterta resztek - pozostałości po tym, co on i jego sojusznicy zagarnęli wyłącznie dla siebie. Gdy zabezpieczyli już zacną zdobycz, pozostała tylko jedna rzecz, zanim będzie mógł się nią nacieszyć. Rozmaici wspólnicy, towarzysze drogi, urzędnicy et alia - wszyscy oczekiwali czegoś w zamian za pomoc udzieloną nowemu porządkowi. Nadszedł czas rozdawania, dobroczynności - i wzajemnego uzależnienia. \n\nSenator spojrzał na pośpiesznie sporządzoną listę ważnych ludzi, którzy jeszcze nie otrzymali rekompensaty. Nadal znajdowało się na niej kilka nazwisk sympatyzujących z Popularów. Caletus szybko je skreślił. Zdecydowali się o wiele za późno. Przywódca Optymatów oderwał kawałek papieru, zapisał na nim ich nazwiska i dopisał \"dodać do proskrypcji\". Odłożył kartkę i wrócił do głównej listy. \n\nTu willa, tam jednorazowa wypłata. Przy nazwiskach bardziej utalentowanych ludzi Caletus zanotował: \"możliwość awansu po weryfikacji\". Nie, może na to za wcześnie. Kto wie, jak powieje wiatr w kolejnych miesiącach? Albo latach? \n\nJak zapewnić lojalność tych ludzi? Czy umieścić ich na liście płac? Jak ich kontrolować? Jeśli tak, może nie potrzebowali nagród? Z każdą minutą lista stawała się bardziej kłopotliwa. \n\nKtoś zapukał. Kto to mógł być? Było zdecydowanie za późno na wizytę. \n- Strażniku, kto tam? \n- Dama, panie. Żona senatora. \n- Wpuść ją - odpowiedział po chwili wahania Caletus. \nKobieta była ubrana na czarno. Usiadła przed biurkiem i odsłoniła twarz spod welonu. Jej twarz kobiety w średnim wieku była zmęczona i wyniszczona. \n- Z kim mam przyjemność rozmawiać? \n- Nazywam się Aemillia Tertia. Mój mąż, świętej pamięci Agrippa Caecilius, był senatorem i Optymatą. Został zamordowany podczas zamieszek w Senacie. \nCaletus odsunął się w krześle. Kobieta przerwała na chwilę, po czym mówiła dalej. \n- Powiedziano mi, że za jego śmierć odpowiadali Popularzy. Nasze majątki zrujnowano podczas ostatniej wojny, lecz mój mąż nigdy nie porzucił służby republice. Wolałabym tego nie robić, ale zostałam bez środków dla siebie i dzieci. Pokornie proszę o pomoc. \n\nCisza. Caletus przejrzał listę, z trudem szukając rozsądnej odpowiedzi. Nie było na niej nazwiska tego Senatora ani nikogo z jego rodziny. Wystarczająco wielu ludzi czekało już na nagrodę. \n- Ja... nie mam prawa tak swobodnie przyznawać nikomu zapomogi. Proszę zapisać mi swoje imię i imiona dzieci, a prześlę je przyjacielowi, który zajmuje się takimi sprawami. \n\nKobieta zapisała na skrawku papieru cztery imiona, ukłoniła się i przez dłuższą chwilę dziękowała Konsulowi, nim się pożegnała. Caletus rozważał nazwiska. Jaki był koszt? Jakie ryzyko? Czy w ogóle było warto? Wieczór był już późny, a przed nim wciąż dużo pracy. Opróżnił kubek wina i pośpiesznie dopisał na dole kartki: \"Dodać do proskrypcji\"."
calisia.83.a: "W szerszej perspektywie wszystko to będzie bez znaczenia."

calisia.84.t: "Słowik w złotej klatce"
calisia.84.desc: "Jako lojalny strażnik Cesarza musiałem być gotowy na wszystko. I sądziłem, że jestem. Dopóki rząd nie wydał rozkazu, że Ricardus Calisius pod żadnym pozorem nie może opuścić Pałacu. Ricardus Augustus Calisius, czyli Ricardulus, jak czule nazywaliśmy go między sobą, był nie tylko wielkim Imperatorem naszego państwa, ale też całkiem zdolnym spryciarzem. Nie zamierzał łatwo się poddać i z wyjątkową determinacją próbował wyrwać się poza pałacowe mury. Moja misja: zatrzymać go za wszelką cenę. Proste, prawda? \n\nGówno prawda.\nPierwszą oznaką kłopotów była prowizoryczna lina zwisająca z balkonu jego pokoju na wewnętrzny dziedziniec. Ricardulus, ubrany w niedorzeczne połączenie piżamy i złotego wieńca laurowego, w którym najwyraźniej spał, szykował się do zejścia. Musiałem działać szybko.\n- PANIE, ROZKAZUJĘ CI WRÓCIĆ DO POKOJU! - krzyknąłem, a mój głos odbił się echem po wielkiej sali.\n- NIE MOŻESZ MI ROZKAZYWAĆ, IANUSIE! TO JA JESTEM TU BOGIEM! - odkrzyknął z bezczelnym uśmiechem. Przewiesił się przez krawędź, trzymając linę. Lina miała jednak inne plany. Pękła z głośnym trzaskiem i Cesarz runął w dół. Na szczęście wylądował na dogodnie ustawionej stercie prania. Niestety było to brudne płótno z całego pałacu oczekujące na pranie.\n- Wolność pachnie gorzej, niż sobie wyobrażałem - wymamrotał, podnosząc się.\n\nRzuciłem się ku niemu, lecz już uciekał. Ricardus wpadł do kuchni, a ja tuż za nim. Chwycił wielką bułkę z blatu i zaczął wymachiwać nią jak mieczem.\n- En garde! - rzucił wyzwanie, machając pieczywem w moją stronę.\n- Poważnie? - westchnąłem, unikając ciosu. - Walczysz ze mną bagietką?\nRicardus odpowiedział, rzucając we mnie bułką, po czym pognał ku drzwiom. Zrobiłem unik, pozwalając jej uderzyć w ścianę, i ruszyłem za nim. Zanim zdążyłem go chwycić, był już w ogrodach, skakał przez krzewy, oblepiony liśćmi oraz gałązkami, i biegł ku stajniom. Jak stary człowiek o takiej masie potrafił sprintować, było dla mnie tajemnicą. Zdołał nawet dotrzeć do konia, lecz ogier nie był zachwycony tak wielkim ładunkiem.\n- Dalej, Micungulo! Jedziemy! - ponaglił konia, który zupełnie go ignorował.\n- Panie, zejdź z konia! - zawołałem, ostrożnie się zbliżając.\n- Gdybyś tylko ty mógł mi rozkazywać - oświadczył, właśnie gdy koń postanowił posłuchać i ruszył wolnym truchtem. Biegłem obok, bez wysiłku dotrzymując kroku.\n- Tak, Panie, ale wie Pan... mogę rozkazywać koniowi. I w przeciwieństwie do Pana będzie zadowolony z kierunku.\nSkierowanie ogiera z powrotem do pałacu nie było trudne. Z pewnością łatwiejsze niż zmuszenie Cesarza do pozostania w pokoju. Gdy wreszcie Ricardus bezpiecznie znalazł się w komnacie, a koń wciśnięty do jednej z największych sal pałacu, wróciłem na posterunek. Kolejny dzień strzeżenia cesarskiego pałacu i kolejny dzień zmagań z wybrykami pałacowego mistrza ucieczek."
calisia.84.a: "Gdzie on niby chce pójść?"

calisia.85.t: "Romanus i Iulia"
calisia.85.desc: "Iulia Caepasia szła alejką w Dzielnicy Plebejskiej. Miała na sobie podartą szatę, a głowę zakrywał kaptur. Spoglądała na instrukcje w telefonie. Na ulicach zakazanych dla jej klasy czuła się jak ryba wyciągnięta z wody.\nMimo to szybko dotarła na właściwe miejsce.\n- Iulio? - dobiegł ją łagodny męski głos Romanusa Munatiusa.\nPobiegła do ukochanego, objęła go i delikatnie pocałowała w policzek.\n- Tak dobrze cię widzieć! - zawołała.\nSpędzili noc, spacerując po lesie i plażach. Zobaczyli nawet wschód słońca nad Mare Balticum.\n- Nie wiem, czy mogę dalej tak żyć - wyznała Iulia, gdy spotkanie zbliżało się do końca. - Ojciec zaczyna coś podejrzewać.\n- Wiem, kochana, ale wytrzymaj jeszcze trochę. Mam plan, jak dostać się do Dzielnicy Patrycjuszy. Za oszczędności kupiłem fałszywy paszport. Będę udawał sługę gotowego do pracy. A potem... coś wymyślę.\n- To niebezpieczne, mój ukochany!\n- To jedyny sposób, by z tobą być.\nPocałowali się i ruszyli w drogę powrotną do Gedanum.\n\nRano Romanus jak najszybciej skierował się ku granicy dzielnic. Zastał ogromną kolejkę ludzi czekających na otwarcie posterunku, by jak najwcześniej dotrzeć do pracy w Dzielnicy Patrycjuszy. Cierpliwie czekał na swoją kolej, mając nadzieję, że fałszywy paszport zadziała.\n\n- Nie udało się - napisał Romanus. Iulia była w swoim pokoju, gdy telefon przyniósł wiadomość o jego porażce.\nByła zdruzgotana.\n- Czy twój ojciec nie szuka kolejnych służących? - przeczytała następną wiadomość. - I tak bardzo potrzebuję pieniędzy.\n- Nie. Podczas rozmowy z matką stanowczo twierdził, że mamy już dość służby.\n- Boli mnie, że muszę to powiedzieć, ale chyba będę zmuszony opuścić Gedanum - dłoń Iulii zaczęła drżeć, gdy czytała. - Nie ma tu dla mnie pracy, a świadomość, że jesteś tak blisko, a zarazem tak daleko, mnie zabije. Jeśli twój paranoiczny ojciec zacznie przeglądać telefon, stracę nawet tę możliwość kontaktu. Chyba najlepiej będzie, jeśli wyjadę.\n- Czekaj! - szybko napisała, by zatrzymać ten tok myślenia.\nPotrzebowała wakatu w świcie ojca. Potrzebowała go natychmiast. Dla Romanusa. Przez chwilę się wahała, lecz wiedziała, co musi zrobić.\nGdy ojciec był zajęty, weszła do jego pokoju i ukradła jeden z zegarków. Następnie podłożyła go w szafce w kwaterze ogrodnika. Nie żywiła urazy do biednego człowieka, ale wiedziała, że równie krzepki Romanus będzie jego naturalnym następcą. Ojciec zapewne ucieszy się też, że może zastąpić Scytę Wenedem. Teraz należało tylko czekać na rozwój wydarzeń.\n- Wkrótce herold mojego ojca ogłosi, że patriarcha gens Caepasia szuka sługi. Zgłoś się jak najszybciej - poleciła Romanusowi. - Jeśli to nie zadziała, uciekaj z miasta dla dobra nas obojga."
calisia.85.a: "W blokach z marmuru nie ma wolnej miłości."

calisia.86.t: "Causa Finita"
calisia.86.desc: "Pałac Imperialny był dość smutnym pobojowiskiem o tej porze. Princeps Antonius przybył na spotkanie ze swoim ojcem. Ten był jednak cieniem swojej własnej osoby. Długie miesiące  nieoficjalnego aresztu domowego odbiły się mocno na zdrowiu cesarza. Jakkolwiek depresyjna by nie była sytuacja ich otaczająca, stół był zastawiony jak na najznamienitszą ucztę. Antonius wiedział czego może się spodziewać, ale i tak trochę zaskoczył go stan jego ojca. Przez chwilę zrobiło mu się go po prostu szkoda, lecz chwilę później przypomniał sobie o własnych celach i po co tu przybył.\n\n- Ojcze, nikt nie chce patrzeć jak się marnujesz w ten sposób. Spójrz na siebie, ledwo jadasz, nie jesteś w stanie już prawie chodzić o własnych siłach. Wszyscy doceniamy twoje poświęcenie ale wiesz, zawsze mówiłeś że trzeba wiedzieć kiedy ze sceny zejść niepokonanym. Martwię się o Ciebie - jego ton był współczujący, ale koniec końców to była tylko iluzja. Antonius był co najwyżej wściekły. Przez tyle lat faworytem ojca był Ignatius, pomimo że w ogóle nie nadawał się na władcę. \n- Antonius, synku. Imperium mnie potrzebuje. Nie mogę go opuścić w chwili potrzeby. \n- Tato...nie ma już wojny. Wygraliśmy. Możesz odpocząć.\n\nPrinceps stawał się podirytowany upartością cesarza, ale zimna kalkulacja nie pozwalała mu na pokazanie słabości, która nadal gdzieś tam była w nim. Żałował ojca, ale tylko on mógł teraz uratować cesarstwo od popadnięcia w zależność od Senatu. A ostatnią przeszkodą niestety był Ricardus. Pomiędzy pierwszym a drugim daniem postanowił w końcu postawić wszystko na jedną kartę.\n- Augustus. Tak na Ciebie mówili. Wiesz jak teraz Cię nazywają? Imperator, który stracił lud. Ludzie odwrócili się od Ciebie - zaczął Antonius. Cesarz na dźwięk tych słów prawie zadławił się kawałkiem mięsa, i zaczął się robić czerwony. Od razu zaczął mieć problemy z oddychaniem. Próbował panicznie sięgnąć po kielich z winem. Antonius wstał i podszedł do ojca, i odsunął ów kielich patrząc wprost w oczy Ricardusa który z przerażeniem zaczął się wpatrywać na jego pasierba, ale nie mógł z siebie wykrztusić ani jednego słowa. \n- Straciłeś rodzinę. Straciłeś frakcję. Straciłeś cesarstwo. Ignatius nie uratuje nas, i dobrze o tym wiesz. Ile godzin spędziłem na siedzeniu u prywatnych nauczycieli? Dałeś mi najlepszą edukację, za co Ci jestem wdzięczny. I dlatego mówię Ci to wprost - lud i senatorzy mi ufają. Wiem co trzeba zrobić żeby zachować chwałę Calisii. Nie możesz oddać władzy senatorom! Jeżeli nie abdykujesz...wiesz co ONI z Tobą zrobią. Bardzo dobrze wiesz. Nie chcę żeby do tego doszło. Ustąp. Proszę Cię.\n\nZ tymi słowami wziął do ręki czarę z napojem i delikatnie podsunął cesarzowi. Ten wahał się chwilę, ale w końcu ze zrezygnowaniem przyjął kielich i opróżnił go w kilka sekund. Wyglądał jakby przebiegł właśnie maraton, i z okropnym wyczerpaniem w głosie rzekł:\n- Synu...\n- Tak, ojcze?\n- Tak bardzo przypominasz mi swoją matkę...muszę odpocząć. Zaprowadź mnie proszę do komnaty..."
calisia.86.a: "...i przynieś mi pergamin."

calisia.87.t: "Kolejna gra o tron"
calisia.87.desc: "No, no. Skończone. Udało się, Christianusie; dobrzy wygrali.\n\nPrefekt i Konsul siedzieli w pierwszym rzędzie sali tronowej Calisii, gdzie koronowano nowego, lepszego i bardziej uległego Cesarza. Kapłan wypowiadał słowa, które tak niewiele znaczyły dla Caletusa, a Cesarz Antonius powtarzał formuły, których sens pozostawał nieznany Cinastovicusowi. I właśnie to go niepokoiło.\n\n- Petrusie, mylisz się w obu kwestiach. Po pierwsze, nie jesteśmy dobrzy, a im szybciej przestaniemy udawać, tym lepiej dla naszego zdrowia psychicznego. Po drugie, nic się nie skończyło. Wygraliśmy dawno temu, a teraz rozgrywamy kolejną rundę. Następną grę. To się nie kończy. Zawsze pojawi się jakiś nowy pretendent, problem albo człowiek roszczący sobie prawo do władzy absolutnej. Skończy się, gdy umrzemy albo przejdziemy na emeryturę, z honorami lub bez. Chcesz odejść?\n\n- Nie, ale Cesarz jest nasz, Senat jest nasz, a ty dusisz wszelki sprzeciw. To nie tylko gra; to wyścig, w którym zataczamy kręgi wokół każdego, kto może się pojawić.\n\n- Czyżby, Petrusie? Czy Cesarz jest teraz nasz? Spójrz na niego. \n\nAntonius w skupieniu powtarzał puste słowa, lecz jego spojrzenie nie było puste. Patrzyło na ludzi daleko za plecami obu rozgrywających, gdyż patrzyło na samą Calisię. Było intensywne do granic, jakby gotowe skupić całą jego siłę woli, wolę mocy... wolę władzy w niszczycielskim promieniu. \n\n- Cesarz pamięta, co spotkało Ricardusa, i wie, jakie korzyści daje trzymanie nas przy sobie. Będzie znał swoje miejsce - Caletus ledwie wierzył we własne słowa. \n\n- Jesteśmy autokracją - Cinastovicus przeszedł do rozstrzygającego ciosu w cichej debacie. - A w autokracji o tym, kto rządzi, decydują dwie rzeczy: bezwzględność i inteligencja. W bezwzględności jesteśmy świetni, a idiotami też nie jesteśmy. Co do Antoniusa... był dość sprytny, by utrudnić nam zdobycie wyniku testu IQ, który zrobił kilka lat temu. Był dość bezwzględny, byśmy w ogóle uznali, że coś z niego będzie. I...\n\nCinastovicus podał rodakowi, sojusznikowi z wygody i współgraczowi niewielką kartkę. Petrus Caletus przeczytał ją, a na jego czole wystąpił zimny pot. Po cichu oddał notatkę. Wkrótce się uspokoił i zmusił do uśmiechu, gdy wstali i zaczęli klaskać po zakończeniu koronacji. \n\n- Cóż, jest dostatecznie wcześnie, by dzięki przewadze trzymać go w szachu. \n\n- Jest, o ile rozumiesz, jak ważne jest, bym stał po twojej stronie - Cinastovicus uśmiechnął się, znając prawdziwy wynik IQ nowego Imperatora, o dziesięć punktów niższy niż ten, w który pozwolił uwierzyć Kalecie. Nie zmieniało to faktu, że Antonius był sprytniejszy od nich obu. Lecz dość rozmów. Potężne oczy Antoniusa spoczęły na nich. Zaczął mowę koronacyjną."
calisia.87.a: "Oklaski ludu i przyjęcie nowego Cesarza zwiastowały nadchodzącą grę."

calisia.88.t: "Regnum Virtutis"
calisia.88.desc: "Chwała ceremonii koronacyjnej przewyższała wszystko, czego człowiek mógł doświadczyć. Tak cierpliwie na to czekałem. Odkąd ojciec został Cesarzem, wiedziałem, jakie musi być moje przeznaczenie. Nie mój brat, nie ci skorumpowani Senatorowie, nie żądni władzy Pretorianie. Ja. Może nie jestem jego prawdziwym synem... ale jestem jedynym prawdziwym następcą. Każde marzenie ostatnich piętnastu lat przygotowywało mnie na tę chwilę. Wszystkie kostki domina upadły dokładnie tak, jak należało. Parcae wyraźnie sprzyjały mi bardziej niż wszystkim pozostałym uzurpatorom. \n\nTeraz do mojej dyspozycji będzie cała potęga Cesarstwa. Los każdego mężczyzny, kobiety i dziecka czekającego na zewnątrz zostanie związany z moim. Pokochają mnie, jak kiedyś kochali ojca, i rozkwitną pod moim przewodnictwem. Wiem to. Większość już mnie kocha. Wykształcenie, wychowanie, pozycja społeczna i obecność polityczna przyniosły owoce. Jestem ucieleśnieniem najwspanialszych kalizjańskich wartości. Czas uznać moje panowanie. Oczywiście odczuwałem stres. Nie czułby go tylko głupiec albo bóg. A ja nie jestem głupcem. Nie jestem też bogiem. Jeszcze. Lecz czeka mnie wniebowstąpienie.\n\n> Pięć kroków naprzód (Wreszcie nadszedł mój czas, by rządzić...)\n> Uklęknij przed Pontifexem (Jeśli wybrał mnie wszechmocny Jowisz, dlaczego mam klękać przed jakimś kapłanem?)\n> Wymamrocz krótką modlitwę i przyjmij błogosławieństwo (Wkrótce podczas modlitwy będziesz wymawiał moje imię.)\n> Jeszcze trzy kroki \"wyszukanej elegancji\" (Och, świetnie odegram swoją rolę...)\n> Wyciągnij prawą dłoń i przyjmij Cesarskie Berło (...a oni nie będą mieli pojęcia...)\n> Podejdź do wieńca laurowego (...co ich czeka...)\n> Zdejmij go z poduszki i delikatnie połóż na głowie (...bo Calisia może mieć tylko jednego władcę.)\n> Rozłóż ręce i czekaj, aż słudzy zapną paludamentum na ramieniu (Władza naprawdę zmienia spojrzenie na zwykłego człowieka...)\n> I wreszcie wygłoś porywającą mowę do ludu (WSZYSCY MNIE PRZYJMIJCIE!)\n\nSzanowni obywatele. Tej pierwszej chwili przed wami nie poświęcam własnej chwale, lecz uczczeniu mojego ojca! Na jego cześć ogłaszam, że moje rządy zapoczątkują nową epokę. Epokę cnoty moralnej i godności. Rozpuście i chaosowi, które znosiliśmy, musimy położyć kres! Calisia znów stanie się taka jak dawniej. Dumnym Cesarstwem cnotliwych kobiet i uczciwych mężczyzn! To właśnie wy powinniście cieszyć się i dziękować, że jesteście częścią czegoś równie wielkiego jak sama Calisia. Każde zwycięstwo okupione jest jednak kilkoma porażkami. Nigdy nie możemy zapomnieć tych bolesnych lekcji, bo to one czynią nas silnymi i zjednoczonymi! Obiecuję wam, ukochani bracia i siostry, że jeśli ponownie staniemy przed podobnym kryzysem, poruszę niebo, by nasze Cesarstwo było bezpieczne. A jeśli nie zdołam, rozpętam piekło dla naszych wrogów. Cały świat pozna naszą potęgę, ulęknie się gniewu, który możemy na nich sprowadzić, i skosztuje błogosławionych owoców szerzonej przez nas cywilizacji! Jesteśmy tarczą i mieczem Okcydentu! Jesteśmy potomkami Rzymu! JESTEŚMY KALIZJANAMI! AVE CALISIA!\n\nA teraz... pierwszy akt przedstawienia dobiegł końca..."
calisia.88.a: "...możecie już wszyscy klaskać."

calisia.89.t: "Excellentia in Labore"
calisia.89.desc: "Dla Adrianusa rzadko który dzień w jakikolwiek sposób wyróżniał się spośród innych. Poza zwyczajowymi kilkoma piwami wypijanymi na kanapie z nikłą przyjemnością po dniu katorżniczej pracy, starzejący się spawacz nie miał na co czekać. Przez trzy dekady mizernej \"kariery\", spędzonej głównie na tej samej budowie, w tym samym miejscu, pod tym samym kierownikiem i za tę samą pensję nieskorygowaną o inflację, która ledwie pozwalała związać koniec z końcem, dawno nauczył się porzucać ambicje i po prostu sumiennie pozostawać poza radarem. Tym bardziej zaskoczyła go wiadomość, że wyniki pracy przypadkiem przyniosły mu tytuł \"przodownika\", uprawniający do pokaźnej nagrody pieniężnej wręczanej bezpośrednio przez Princepsa Ignatiusa. \n\nZ nowym poczuciem celu, a może zwyczajnie z chęci uniknięcia konsekwencji ośmieszenia firmy, Adrianus zaczął przygotowywać się do bezsprzecznie największej uroczystości swojego życia. Porządnie się ogolić, przetrząsnąć szuflady w poszukiwaniu jedynej znośnej flaneli, poprosić żonę o przyszycie brakujących guzików, wyciągnąć starą prasę i wyprasować zagniecenia, dobra, przymierzmy... uch, nie, nie ma szans, żeby pasowała... \n\n- Helenio! Kupisz mi nową flanelę? Ta musiała się skurczyć w praniu czy coś! \n\nW sumie biedny spawacz potrzebował niemal tygodnia wysiłków, by osiągnąć stan, który większość zamożnych mieszkańców miasta nazwałaby \"dopuszczalnym\". Niewymuszona elegancja Princepsa, odzianego w szlachetne tkaniny i miękkiego jak ktoś, czyim najcięższym obowiązkiem było podniesienie pucharu wina, ostro kontrastowała z surowym wyglądem Adrianusa. Choć zwykle nauczył się nie przejmować żadną władzą, królewska aura Ignatiusa wystarczyła, by go onieśmielić. \n\nZ wyuczoną arystokratyczną uprzejmością następca kalizjańskiego tronu uścisnął dłoń oszołomionego robotnika, gratulując osiągnięć z ledwie ukrywanym brakiem zainteresowania. Gdy służący Princepsa wtoczyli ogromny czek na sumę większą niż wszystko, co Adrianus kiedykolwiek widział, nagrodzony poczuł, że z oczekiwania zaczyna hiperwentylować. \n\n- Niniejszym wręczam ci tę nagrodę za wysiłki na rzecz rozwoju kalizjańskiej pracy. Niech dobrze służy tobie i towarzyszom, gdy podzielicie ją między siebie. \n- Podzielimy? M... mój panie, sądziłem, że cała nagroda będzie moja. \n- Och, nie, nie. To byłoby niesprawiedliwe wobec pozostałych kolegów. Praca jest przecież wysiłkiem zbiorowym. Jestem pewien, że pracowali równie ciężko, a wiesz, jak niewłaściwe byłoby faworyzowanie kogokolwiek. \n- A... ale... ile zostanie dla mnie? \n- Około 20 denarów, mniej więcej. Może wszyscy wykorzystacie pieniądze, by uczcić okazję? Słyszałem od ojca, że pobliska Ranula oferuje świetne hot dogi. Zdecydowanie powinniście ich spróbować. \n- T... tak, mój Panie - odpowiedział Adrianus, przygnieciony rozczarowaniem."
calisia.89.a: "Słoność łez naprawdę podbija smak."

calisia.90.t: "Finis Historiae"
calisia.90.desc: "Po wyczerpującym dniu pracy Martinus usiadł na zakurzonej kanapie w salonie i otworzył najnowsze wydanie Acta Diurna. Choć dawno porzucił myśl, że jego głos ma jakiekolwiek znaczenie na forum publicznym, postanowił być na bieżąco ze wszystkim, co działo się na kalizjańskiej scenie politycznej. Być może pewnego dnia, jeśli dostatecznie długo poczeka na uśmiech losu, spełni marzenie o dołączeniu do grona Senatorów. Wizja dodała mu niezbędnej motywacji mimo zmęczenia całego ciała; rozłożył gazetę i rzucił okiem na pierwszą stronę. \n\n> CESARZ RICARDUS CALISIUS PRZYŁAPANY NA OPALANIU SIĘ NAD MARE BALTICUM!\n\nTurystów odwiedzających spokojny kurort Coslinum powitała niezwykła namaszczona wizyta. Zza prowizorycznego fortu parawanów wyłonił się brzuch Cesarza, by pozdrowić plażowiczów i udzielić zaskoczonym gościom jedynej w życiu audiencji. Cesarsko burcząc w odpowiedzi na prośby obywateli, monarszy bebech sumiennie wykonywał obowiązki państwowe podczas snu właściciela, głośno warcząc na znak zgody z każdą ważniejszą petycją i cicho przelewając się, by każdą odrzucić... \n\nMartinus przewrócił stronę, licząc, że wreszcie dotrze do prawdziwych wiadomości. \n\n> IMPERATOR CALISIUS DAJE Z SIEBIE WSZYSTKO NA KORCIE TENISOWYM! \n\nWygląda na to, że nasz Cesarz nie zawsze jest surowym strażnikiem dyscypliny, jakim znamy go my, lud. W pewien wyjątkowo spokojny piątek, gdy Senat obradował nad jakąś niezwiązaną z niczym i, szczerze mówiąc, nudną ustawą finansową, Ricardus został przyłapany na przyjacielskiej rozgrywce ze swoim przyjacielem Silviusem Iacobinusem! Choć trudno określić, który z taktycznie i taktownie kołyszących się tytanów rakiety wygrał pojedynek, zdobyliśmy ekskluzywne fotografie meczu, dostępne jedynie... \n\nBrak jakichkolwiek informacji zaczynał irytować Martinusa. Zdesperowany, by znaleźć choć jeden artykuł dający jakikolwiek wgląd w sytuację, zaczął przerzucać strony. \n\n> SKROMNI, WYSTAWNI I NIEPRZYZWOICIE BOGACI. ZWIEDZAMY PRYWATNE POSIADŁOŚCI POLITYKÓW! \n\n> CESARZ RICARDUS PRZYŁAPANY W MIEJSCOWEJ RANULI! WYBÓR SOSÓW ZATKA TĘTNICE NAWET NAJBARDZIEJ DOŚWIADCZONYCH SMAKOSZY! \n\n> OLIWKI, SERY I SOLIDNA DAWKA LACJUM. CESARZ ZDRADZA PRZEPIS NA DŁUGIE I SZCZĘŚLIWE ŻYCIE! \n\nNie znalazłszy niczego choćby odrobinę godnego uwagi, Martinus ze złością cisnął gazetę w najbliższą ścianę. Jeszcze rok temu bez trudu śledził epickie zmagania Popularów i Optymatów, kryzys barbarzyński oraz nieustannie zmienne wiatry dworskich intryg... teraz donoszono najwyżej o bezsensownych bredniach. Wyglądało na to, że nie ma już o czym informować, a powolny cykl wiadomości stał się nową normą. Być może w państwie tak bardzo wyrwanym poza ramy czasowe naprawdę nastał koniec historii."
calisia.90.a: "Sezon ogórkowy w pełni. "

calisia.91.t: "Verba Ultima"
calisia.91.desc: "Świece migotały słabo, ich blask równie nikły jak puls Cesarza. Na każdej wolnej powierzchni stały kadzidła, wypełniając powietrze przytłaczającym zapachem, który zatykał nozdrza, a mimo to ledwie maskował wszechobecny odór rozkładu. Przy łóżku klęczała postać, rozpaczliwie ściskając dłoń Cesarza, jakby próbowała przekazać umierającemu własną siłę życiową. Dwie dekady wojny odcisnęły na Ricardusie straszliwe piętno, odbierając mu resztki sił, aż zmieniły go w chodzącego trupa. Teraz, gdy przyszłość Calisii była zabezpieczona, wreszcie mógł odpocząć. \n\n- Ojcze, proszę, nie odchodź. Cesarstwo cię potrzebuje... ja cię potrzebuję. Nie jestem gotowy. Przejdziesz przez to, tylko... zostań ze mną. \n\n- Ignatiusie, zrobiłem wszystko, co mogłem, by wychować cię w krótkim czasie, jaki miałem - słaby głos Cesarza wymagał herkulesowego wysiłku, by zebrać powietrze nawet na najcichszy dźwięk, a mimo to uspokajał pogrążonego już w żałobie Princepsa. - Przepraszam, że nie zawsze przy tobie byłem. Wiem jednak, że wyrosłeś na godnego następcę. Wszystko, co zbudowałem, wkrótce będzie twoje, mój synu. Nie traktuj tej roli jak ciężaru, lecz jako szansę zmiany kraju na lepsze, a przyniesie ci tyle radości i satysfakcji, ile zawsze dawała mnie. \n\n- Nie... to nie musi się tak kończyć. Nadal masz dla czego żyć, tyle do osiągnięcia. Musisz tylko wytrzymać... Proszę, dla mnie. \n\n- Synu, jestem reliktem minionej epoki. Pamiętam życie przed Upadkiem, przed Calisią. Dla mnie nigdy nie będzie ona prawdziwą ojczyzną. Odegrałem swoją rolę, lecz Cesarstwo potrzebuje teraz kogoś nowego, kogoś, kto szczerze wierzy w jego misję. \n\n- Ojcze, zbudowałeś to Cesarstwo z niczego. Ono... zawsze będzie twoją ojczyzną. I zawsze będzie cię czcić. Ale... nadal potrzebujemy twojego przewodnictwa... \n- Ignatiusie, moje pokolenie jest stracone. Gdy większość życia spędziło się w tym, co dziś nazywamy Polonią, nie można po prostu o wszystkim zapomnieć i zacząć od nowa. Czasem żałowałem, że musimy nosić te niewygodne togi i mówić udawaną łaciną. To, co dla mnie było codzienną walką, dla ciebie jest naturalną rzeczywistością. \n\nIgnatius próbował odpowiedzieć, lecz łzy dławiły słowa. Chciał dalej błagać ojca o kolejny oddech, jeszcze jedno uderzenie serca. Czuł się bezsilny, zmiażdżony uciskiem w piersi. W głębi duszy wiedział już, że to nieuniknione. \n\n- Będziesz wspaniałym Cesarzem - Ricardus uśmiechnął się resztką sił. - Obiecuję, że zawsze będę przy tobie. Wiem, że uczynisz mnie dumnym, synu. \n\nZ każdym słowem coraz cichszy Cesarz zamknął wreszcie oczy po raz ostatni. Przez krótką chwilę komnatę wypełniała cisza, natychmiast przerwana rozpaczliwym, zawodzącym szlochem Princepsa."
calisia.91.a: "Dopiero po dwóch godzinach zebrał siły, by wyjść."

calisia.92.t: "Wytchnienie weterana"
calisia.92.desc: "Choć zwyczajowego zgiełku jego legionów nie sposób było zignorować, hałas tłumu zgromadzonego na Forum Calisianum zrobił wrażenie nawet na odznaczonym legacie Viniciusie. Podczas wszystkich prób przeżytych w trakcie nadzorowania licznych kampanii Cesarstwa prawie nigdy nie miał okazji usiąść i nacieszyć się chwilą. To, co dla innych stanowiło wydarzenie najwyższej wagi - pierwszą pokojową koronację w dziejach Calisii - dla sędziwego dowódcy było przede wszystkim spóźnionym urlopem. Podczas gdy dostojnicy biegali w syzyfowej pracy pełnej perfekcyjnego zaplanowania, zorganizowania i wykonania każdego elementu ceremonii, Marcus Vinicius rozsiadł się z kubkiem wina z Lacjum. Surowe realia legionowego życia zmuszały go do topienia smutków i świętowania zwycięstw tanią gorzałą, więc ledwie pamiętał ostatnią okazję skosztowania ulubionej płynnej rozkoszy zmarłego Cesarza. Skrzywił się. Była zdecydowanie zbyt słodka jak na jego prosty gust. \n\n- Jak smakuje wino, Marcusie? Być może będziesz musiał zająć się zapasami teraz, gdy Ricardusa nie ma - przyjazny głos zapytał uprzejmie, zajmując obok legata wyściełane siedzenie. \n- Wiesz, Andreasie, że nie mam zwyczaju rozważać o subtelnych właściwości wina. Choć jest... przyjemne, tak mi się wydaję. Dobry sposób uczczenia pamięci poległego tytana. \n- Gdyby tylko komplement mógł oddać jego wzniosłość - westchnął. - Bez jego przewodnictwa nie będzie łatwo. \n- Nie będzie, ale chyba właśnie dlatego mnie tu ściągnąłeś? \n- Być może. Powiedz, Marcusie, czy całe życie w obozie wojskowym nie jest męczące? Wspaniale służyłeś Cesarstwu na froncie, lecz teraz potrzebujemy cię tutaj. Przy wszystkich wygodach, jakie możemy zapewnić, byłoby to niemal jak wcześniejsza emerytura. \n- Wiesz, że nie robię tego dla pieniędzy ani sławy, Andreasie. Jeśli Ignatius potrzebuje mnie w stolicy, jestem do jego dyspozycji i mogę ruszyć natychmiast.\n- Skoro mowa o Princepsie Ignatiusie... ahem, Imperatorze Ignatiusie, co o nim sądzisz? Nie wątpię, że w jego żyłach płynie krew Ricardusa, lecz obawiam się, czy dorówna ojcu. Boli mnie myśl o tym, co może się stać, jeśli ciężar rządów go przytłoczy. \n- Nie wyciągałbym tak pochopnych wniosków. To dobry chłopak o sercu po właściwej stronie. Tylko to się liczy. Zabrałem go kiedyś na kampanię, gdy był młodszy. Jeśli jest dziś choć w połowie tak bystry jak wtedy, Ricardus pozostawił Cesarstwo w zdolnych rękach... \n- ...a jeśli będzie potrzebował pomocy w nauce, cóż, wtedy wkroczymy my. Zdrowie, Marcusie. Za naszego nowego Cesarza! \n\nGdy dwaj urzędnicy powoli sączyli wino, świętując jasną przyszłość Imperium Calisianum, do której sami się przyczynili, przez tłum przeszedł głośny jęk, bo Ignatius podczas ceremonii runął na ziemię. Kiedy Cesarz wstał i otrzepał cesarskie szaty, obaj wybuchnęli serdecznym śmiechem."
calisia.92.a: "- Cóż, Marcusie, wygląda na to, że twoja emerytura będzie pracowita."

calisia.93.t: "Regnum Populare"
calisia.93.desc: "Hałas był ogłuszający, światło niemal oślepiające. Całe życie kazano mi przygotowywać się do tej chwili, lecz czy ktokolwiek może być naprawdę gotowy? Wokół lud wiwatował i skandował moje imię na długo przed pojawieniem się. Ciężar odpowiedzialności na barkach stawał się tylko większy. Wszystkie wyczekujące oczy miały ten błysk, jakby próbowały powiedzieć mi coś, czego jeszcze nie rozumiem. Nadzieja? Strach? Powtarzałem sobie, że jest w nich choć odrobina sympatii. Ci ludzie praktycznie czcili mojego ojca. Teraz chcieli, bym kontynuował jego dziedzictwo. Jakby podążanie śladami tak monumentalnej postaci było proste... \n\nPrzez lata nauczyciele wbijali mi do głowy przebieg koronacji. Nazywali ją najważniejszym wydarzeniem życia. Byłem za to wdzięczny. Przy tylu ludziach czekających na przewodnictwo ledwie słyszałem własne myśli, nie mówiąc o przypomnieniu sobie ruchów potrzebnych, by nie ośmieszyć się przed całym Cesarstwem. Gdy zbliżała się chwila formalnego rozpoczęcia panowania, serce waliło tak mocno, że czułem każdy skurcz. Głęboki oddech. Dasz radę, Ignatiusie. \n\n> Pięć kroków naprzód (Tylko się nie potknij. Tylko się nie potknij.) \n> Uklęknij przed Pontifexem (Nie waż się oceniać mojego występu. Improwizujesz bardziej niż ja.) \n> Wymamrocz krótką modlitwę i przyjmij błogosławieństwo (Czy tylko mi się wydaje, czy wszystko, co powiedział, było niespójne?) \n> Jeszcze trzy kroki \"wyszukanej elegancji\" (Vincentiusie, nigdy ci nie wybaczę tej niejasnej części.) \n> Wyciągnij prawą dłoń i przyjmij Cesarskie Berło (D... dlaczego jest takie ciężkie?) \n> Podejdź do wieńca laurowego (To niewłaściwe. Ja... nie zasługuję.) \n> Zdejmij go z poduszki i delikatnie połóż na głowie (Nie panikuj. Nie panikuj.) \n> Rozłóż ręce i czekaj, aż słudzy zapną paludamentum na ramieniu (Mogliby szybciej? Naprawdę źle się czuję.) \n> I wreszcie wygłoś porywającą mowę do ludu (Dobra, raz kozie śmierć.) \n\nKalizjanie! Rodacy! Obywatele wszystkich wyznań! Wiem, że nadal opłakujecie śmierć mojego ojca i ogromnie dziękuję za okazane mu współczucie. Ricardus miał sen. Sen żyjący w naszych sercach, przekraczającą osobiste interesy i małostkowe spory. Choć odszedł, jego dziedzictwo zawsze będzie z nami. Tą wizją, tym snem jest Calisia, w której dziś żyjemy, zbudowana jego niestrudzonym wysiłkiem. Wiem, że nie dokonam czynów równie monumentalnych. Obiecuję jednak jedno! Dopóki żyję, marzenie Ricardusa będzie prowadzić nas ku sprawiedliwszemu, równiejszemu Cesarstwu, które każdy - Kalizjanin czy Weneda - może nazwać domem! Obywatele, powtarzajcie za mną! Ave Ricardus Calisius! Ślubuję zrobić wszystko, by był ze mnie dumny. \n\nGdy niekończący się wiwat przetaczał się przez pogrążony w uwielbieniu i zapale tłum, młody Cesarz wykorzystał chwilę, szybko zniknął ludziom z oczu i odszedł za scenę."
calisia.93.a: "Runął na awaryjny stos poduszek, pokonany przez stres i zmęczenie."

calisia.94.t: "Teraz jesteśmy wolni"
calisia.94.desc: "Wielu cierpiało i umarło. Jeszcze więcej ludzi załamało się psychicznie i zrzuciło dawne dziedzictwo niczym wąż zrzuca skórę. Lud tej ziemi przyjął zupełnie nową tożsamość, mając nadzieję pewnego dnia wskrzesić chwałę trwającą ponad tysiąc lat. Sen zwany Rzymem. Zrodzony z wilczycy i jej ludzkich dzieci. Wskrzeszony w najmniej prawdopodobnym czasie i miejscu. Calisia. Czyny milionów i tak odbijają się echem w wieczności. Lecz bez względu na to, jak mała lub wielka jest Calisia czy samo miasto, bez względu na to, kto nazywa się potężnym...\n\nAnonim#6431> Nie wierzę, że na targu nie ma jajek. Nie powinienem był dziś wychodzić z domu. Teraz usmażę tylko wieprzowinę.\n\nAnonim#1434> Masz działający gaz?\n\nAnonim#6431> Nie, nie wiem nawet, czy importujemy gaz. Musimy radzić sobie z tą indukcją, strasznie to dziwne. Czy mogę odzyskać stare dobre czasy sprzed Upadku?\n\nAnonim#9986> MASZ INDUKCJĘ???\n\nAnonim#6431> W przyszłym roku dostanę jedną i kupię lepszy internet. Wreszcie będę mógł oglądać filmy na żądanie. Na tym złomie mogę tylko torrentować przedupadkowe indyki. Ale i tak lepsze to niż gotowanie obiadu w kominku. Rok temu nie miałem nawet stałego prądu.\n\nAnonim#5328> A ja nadal nie wierzę, że muszę zadowolić się pirackim Corda Ferrea V. W każdym innym kraju mój komputer byłby złomem.\n\nAnonim#9986> Spójrz na to w ten sposób: ledwie kilka lat temu trzeba było stale sprawdzać wiadomości, żeby wiedzieć, kto gdzie rządzi. Od tego zależało, czy zbiedniejemy, pójdziemy do wojska albo spotka nas coś gorszego. Teraz? Zapomniałem już, kto rozdaje karty w Senacie! To nie ma dla nas znaczenia. Kiedy nie trzeba przejmować się polityką, wiadomo, że jest dobrze. Będzie dobrze. Odzyskaliśmy już dostęp do internetu! Z czasem odzyskamy samochody, duże mieszkania i abonamenty streamingowe.\n\nAnonim#6431> Chyba masz rację. Zawsze, jeśli naprawdę chcę jajek, następnym razem po prostu kupię żywe kury.\n\n... Taka rozmowa znaczy, że nie umieraliśmy na próżno. Polonia nie zmieniła się i nie została ukształtowana tak bez powodu. Nadal możemy narzekać. Nadal możemy mówić bez wdzięczności, a czynem i sercem kłaniać się ziemi, dziękując za kolejny dzień, w którym stać nas na małostkowość i zazdrość, by potem przy winie znów stać się braćmi.\n\nTo dla wszystkich, którzy zginęli, by mogło się wydarzyć. Byli żołnierzami Calisii."
calisia.94.a: "Uczcijmy ich!"

calisia.95.t: "Dziś wieczorem zacznie się wieczność"
calisia.95.desc: "Od Pożaru nie minęło nawet tak wiele czasu. Wszystkie niewybuchy uprzątnięto, a dostatecznie wiele dowodów, by zatopić okręt, podrzucono wszędzie tam, gdzie Cohortes Urbanae albo łatwowierni niżsi rangą członkowie Gwardii mogli spojrzeć.\n\nPrzed Pałacem ustawiono scenę. Cinastovicus miał przemówić do ludu. Potrzebował odpowiedzi i zamierzał dać mu najlepiej skonstruowane półprawdy oraz zmyślenia, jakie potrafili wymyślić. Wszedł na podest wraz z innymi wysokimi rangą członkami i senatorami Optymatów, po czym przemówił.\n\n- Kalizjanie! Wszyscy słyszeliście o śmierci naszego chwalebnego Cesarza. Uważam jednak, że nie wszyscy znacie prawdę. Ricardus Augustus Calisius został zabity przez grupę oszalałych barbarzyńców. Jego ciało zostało brutalnie zmasakrowane. \n\n§0Musieliśmy go dobić. Przez cały ten tłuszcz trudno było trafić w trzewia.§!\n\n- Interwencję Straży Pałacowej uniemożliwiły pożary wzniecone wokół wszystkich wejść. Ciała napastników znaleziono pośród zwłok gwardii imperialnej Cesarza. Gdy Vigiles dotarli na miejsce, nikogo nie dało się uratować.\n\n§0Obie strony pozostały lojalne do ostatniego tchu.§!\n\n- Wstyd, że muszę ujawniać wam to w takich okolicznościach. Cesarz Ricardus Augustus Calisius był tyranem. \n\n§0Okoliczności nie mogły być lepsze.§!\n\n- Gwardia odkryła dokumenty sięgające skandalu Ager Publicus, które dowodzą ingerencji Cesarza w Senat. Łapówki i przysługi polityczne były rutyną przy uchwalaniu prawa. Popularzy otrzymywali przywileje, o jakich Optymaci mogli tylko marzyć.\n\n§0Naciągane, jasne, ale dokumenty nie kłamią. Popularzy mocno polegali na jego interwencjach.§!\n\n- Pozostaje też sprawa Marcusa Viniciusa. Wielka to tragedia, że największy obrońca Calisii padł ofiarą tak odrażającego ataku. Był prawdziwym bohaterem i ogromną inspiracją dla wielu, w tym dla mnie. Został bezceremonialnie zmiażdżony pod gruzami, gdy podczas Pożaru pomagał Vigiles. \n\n§0Szczęśliwy zbieg okoliczności... Gdyby był odrobinę mniej altruistyczny, stałby się wielkim cierniem w naszym boku.§!\n\n- Na razie Gwardia Pretoriańska przejmie tymczasowe rządy nad Res Publicą, dopóki napięcia w mieście nie ustaną. To konieczność dla dobra wszystkich obywateli. Posiedzenia Senatu zostają chwilowo zawieszone, a wszystkie sprawy rządzenia przekazane Gwardii."
calisia.95.a: "§0Teraz zaczyna się zabawa§!"

calisia.96.t: "Najgorszy kac w dziejach"
calisia.96.desc: "- Cholibka, wino się skończyło. Komu w drogę temu trzy denary...czy coś. Nie wiem, łeb mnie boli.\nQuintus nie należał do najbardziej odpowiedzialnych obywateli. Plebejskie i wulgarne podejście do życia sprawiły że większość czasu przesiadywał w swojej piwnicy którą nazywał apartamentem grając w gry komputerowe. Ostatnie dni spędził spożywając pizzę i pijąc wino, nie mając żadnego kontaktu ze światem zewnętrznym. Przy wyjściu z bloku czekał go apokaliptyczny szok.\nMiasto było pogrążone w dymie. W niektórych kamienicach nadal dogasały płomienie, drogi usłane były popiołem i gruzem. Nikogo w okolicy nie było widać, wszystko dookoła zamknięte albo spalone. Absolutna cisza panowała w całym mieście. Świat się skończył i nikt nie poinformował Quintusa o tym fakcie. \n- Co tu się odwaliło? A może to przez to cholerne wino...?\nPostanowił przejść się w stronę placu Cezara bliżej rynku licząc na to że jednak zobaczy jakąś żywą ludzką duszę. W bramie jednej z kamienic zobaczył jednego z lokalnych bezdomnych wiozącego na małym wózku swój dobytek, ale on sam wyglądał jakby dopiero co wyszedł z piekielnego kotła. Ten widząc Quintusa zaczął go przywoływać gestem ręki.\n- Dominusie, poratujcie trzema denarami bo muszę z miasta się wydostać a na sucho to ciężko się idzie.\n- No dobra, jak mi powiesz w ogóle dlaczego to wszystko wygląda jak koniec świata.\n- A! Ja wiem co się stało, ja wszystko widzę, ja wszystko słyszę! To Ci barbarzyńcy! Oni podpalili całe miasto! I mówią że nasz cysorz to on w ogóle nie żyje! Spalili go żywcem i wrzucili na krzyż!\n\nW tym momencie usłyszeli krzyki z pobliskiej kamienicy i ujrzeli pretorian wychodzących z klatki schodowej wyciągających wręcz siłą jakąś rodzinę na ulicę. Byli przerażeni, a pretorianie wydawali się bardzo zadowoleni z faktu że mogą poprześladować jakichś cywili. Dlaczego? Och, Quintus i towarzyszący Menelaos zaraz mieli się dowiedzieć, jako że żołnierze natychmiast ich zauważyli.\n- Ej, wy tam! Stać! - krzyknął jeden z pretorian, a dwójka bohaterów nawet nie była w stanie drgnąć ze strachu przed nimi\n- Z imperialnego rozkazu wszyscy mają udać się na Forum Calisianum. Zakaz siedzenia w domu, idźcie i świętujcie - słowa pretorianina nie miały sensu. Miasto spłonęło i mają się cieszyć?\n- A...z jakiej to okazji? Święto jakieś przespałem? - zapytał niepewnie Quintus. Pretorianin spojrzał na niego tak przenikliwie że aż go zabolał\n- Tyran nie żyje. Jesteście wolni.\n- Ah. Tak, tyranobójstwa. Święto ruchome, dlatego zapomniałem. Rozumiem. Oczywiście. Tak, pójdziemy naturalnie na forum. Wolność, kocham i rozumiem. Wolności oddać nie umiem, tak, tak.\nPaniczną tyradę Quintusa przerwał drugi z pretorian popychając przed sobą rodzinę którą wcześniej wywlekli na ulicę.\n- I dopilnujcie żeby oni też tam byli. Bo jak nie...to wiemy gdzie mieszkacie."
calisia.96.a: "Chyba tego jednak nie zrobili barbarzyńcy..."

calisia.97.t: "Quis custodiet ipsos custodes?"
calisia.97.desc: "- Chwała wyzwolicielom! - tymi słowami Pretorianie wznieśli toast, świętując swoje tyranobójstwo w pałacu cesarza. W komnacie gdzie ongiś urzędował cesarz, teraz ważyły się losu imperium. Najważniejsi prefekci zostali zgromadzeni przez ich dowódcę, Christianusa Cinastovicusa który po raz pierwszy od kilkunastu lat nie krył zadowolenia.\n- Drodzy koledzy, towarzysze, salutuję wam wszystkim i każdemu z osobna, nasz plan został wykonany bez skazy, osiągnęliśmy wszystko co założyliśmy, a egzekucja była bezbłędna. Nie byłbym w stanie tego osiągnąć bez waszego zaangażowania. Cały projekt był obarczony wieloma zmiennymi, i to naprawdę jest cud, że udało się dociągnąć go do końca bez radykalnych zmian. Marzyłem o tym dniu odkąd zostałem łaskawie oddelegowany z pozycji prezydenta miasta. Zabrali mi w ciągu chwili to o co walczyłem latami, jak gdyby to była zabawka którą zabiera się niegrzecznemu dziecku. Ale dziecko równie dobrze jak i dorosły może spalić cały dom. Zemsta jest słodka, tak mówią. Ale to wino jest jeszcze słodsze, i w końcu po tylu latach mogę bez oporów powiedzieć: WASZE ZDROWIE!\n\nPo poruszającej przemowie prefekci przeszli do pokoju obok, gdzie Cinastovicus zasiadł na fotelu przeznaczonym dla cesarza, otworzył plik z dokumentami i wyciągnął z niego list.\n- Panowie, zanim przejdziemy do hedonistycznej części...jeszcze ostatnia sprawa biznesowa. Jutro obudzimy się w nowej Calisii. Trzymamy rękę na pulsie i to od nas zależy w jakich barwach będzie mienił się jutrzejszy poranek. Tutaj mam list, który otrzymałem od konsula Caletusa. Zawarte jest w nim poparcie dla naszej sprawy i gotowość do działania w przypadku jeśli zaistniałaby taka konieczność. W skrócie - Optymaci chcą się z nami ułożyć. Marzy im się odnowiona republika. Bez monarchów.\n- Jeśli nie będzie cesarza, to po co wtedy Gwardia Pretoriańska? - zapytał jeden z prefektów\n- Do diabła z Optymatami! Do diabła z republiką! Mamy ich wszystkich w garści! Zróbmy to co powinniśmy! Mianujmy swojego własnego cesarza - podniósł głos inny z oficjeli\n- Panowie, powinniśmy przynajmniej rozważyć za i przeciw. Nie sposób podjąć taką decyzję na szybko! Oferują nam wsparcie, pozwoliłoby to nam uniknąć niepotrzebnych ofiar, no i mielibyśmy solidne fundamenty. A Optymatów...zawsze da się kontrolować\n- Spróbuj kontrolować tego szaleńca Caletusa - odezwał się Gaius Ceplus dotąd milczący - Optymaci to zwierzęta. Nieprzewidywalni, nie myślący logicznie. Dla nich liczy się tylko łapówka w kieszeni i posada w senacie. Są gotowi rozpętać piekło jeżeli sprawi to, że będą wybrani na kolejną kadencję. Myślicie że Popularzy wpuszczając barbarzyńców byli zdrajcami? Oni to robili w zgodzie z własnymi poglądami. Caletus by się skurwił z samym królem Gotów jeżeli by oznaczało to że jego frakcja będzie dalej rządzić.\n- Nie mamy politycznego zaplecza, administracyjnie też stoimy kiepsko. Nie będziemy w stanie rządzić jedynie silną ręką wojska, którego też do końca nie kontrolujemy...\n\nCinastovicus w końcu podniósł dłoń uciszając wszystkich natychmiastowo."
calisia.97.a: "Panowie... policzmy głosy."

calisia.98.t: "Szybcy i wściekli"
calisia.98.desc: "Środek nocy na skrzyżowaniu Via Legionis oraz Via Industrialis. Caletus czekał dwa tygodnie na ten moment. W końcu dzisiaj udało mu się na własne oczy zlokalizować wandala który zrywał jego plakaty wyborcze. Podekscytowany wyskoczył z krzaków skąd obserwował czujnie horyzont, i ruszył w stronę tego wrednego przestępcy.\n- Salve, chuju złamany! Stój w imieniu senatu! Dokonuję interwencji senatorskiej, spędzisz resztę życia na aren...\nSenator Caletus nie powstrzymywał nigdy języka. Ale ten utknął mu w gardle gdy zobaczył, że ten który niszczy jego plakaty był członkiem gwardii pretoriańskiej. Szok szybko ustąpił jednak kolejnej fali gniewu, gdy ten nawet nie zareagował na przybycie polityka.\n- Ej, fallus minorus! Mówię do Ciebie!\nZapewne niezbyt mądrym ruchem było posunięcie się do przemocy fizycznej wobec zaprawionego w bojach pretorianina, nie mniej jednak Caletus nie należał do ludzi którzy najpierw myślą a dopiero potem działają. Chwycił za płaszcz strażnika i próbował go przygwoździć do ściany. Ten, z gracją wyrwał się z uścisku senatora i dwoma szybkimi ruchami położył go na ziemię.\n\n- Posłuchaj mnie raz a dobrze, bo powtarzać się nie będę. Jesteś nikim. Cała wasza frakcja jest bezużyteczna. Jesteście pasożytami. Co ty myślisz, że wybory wygrasz? Jakie kurwa wybory? W co ty grasz? Naprawdę wydaje Ci się że teraz wszystko będzie tak jak wcześniej? Jesteście naszymi dziwkami, więc wbij sobie to raz na zawsze do łba i nie podskakuj bo utniemy Ci ten pusty łeb. Rozumiesz?\n- T-tak, oczywiście - Caletus został doprowadzony prawie do płaczu, albo przynajmniej dobrze odgrywał ofiarę. Pretorianin puścił go i odszedł do zaparkowanego nieopodal rydwanu. To oczywiście nie powstrzymało senatora, który błyskawicznie podniósł się i ruszył w stronę pojazdu, który już zaczął się poruszać w jego stronę.\n- PRETORIANIE TO PRZEŻYTEK, NIE MA CESARZA, NIE BĘDZIE I PRETORIAN - zaczął wykrzykiwać na cały głos. Ktoś z bloku obok wydarł się \"ZAMKNIJ MORDĘ\", ale senator wpadł już w swoją standardową furię.\n- WY KURWIARZE, BĘKARTY HADESU, KTOŚ MUSI Z WAMI W KOŃCU ZROBIĆ PORZ...\n\nCaletus nie był w stanie dokończyć zdania, gdyż rydwan prowadzony przez pretorianina właśnie przemknął koło niego i zwinnym ślizgiem potrącił senatora tak, że ten stracił przytomność. Oprócz złamanej ręki nie stało się Caletusowi nic poważniejszego. Ale najgorsza była jego urażona duma. Zamiast uciszenia lidera Optymatów, ten na następny dzień nagrał film do wszystkich mediów o zamachu na jego życie ze strony Pretorian. Prefekt był jednak zadowolony z obrotu spraw. W końcu Caletus wystawił się na ostrzał, w wulgarnych słowach określając całą gwardię pretoriańską i ich liderów, obrażając tychże do trzech pokoleń wstecz. Więcej im nie było trzeba, żeby zacząć potężne sprzątanie w szeregach ostatniej frakcji senatu."
calisia.98.a: "A więc wszystko układa się w całość."

calisia.99.t: "Pierwsze pierdolnięcie"
calisia.99.desc: "- Wchodzimy w nich na takiej kurwie że zmiatamy ich z powierzchni ziemi. Jest pierwsze pierdolnięcie i oni kurwa nie żyją.\nWielcy stratedzy antycznego świata pozazdrościliby z pewnością kunsztu strategicznego tego prefekta Pretorian, który w prostych słowach lecz z żarliwą pasją i troską o swoich podopiecznych wykładał im taktykę na zbliżające się starcie z buntowniczą kohortą miejską pod Gedanium. Pretorianie co prawda mieli fach w ręce i w nodze, lecz nie należała do nich ta wybrana umiejętność logicznego i krytycznego myślenia, to ich brak właśnie gwarantował im miejsce w gwardii. Zatem stali i słuchali.\n- Pamiętajcie, bijemy gladiusami. Jak lecicie z doskoku to wypierdalacie pilum w pierwszego kogo widzicie albo wraz z nią wlatujemy na pełnej kurwie we wroga. Wtedy robicie rozpierdol tarczą i powalacie gościa, doskakujecie i zaczynacie go bić na pizdę. Musicie patrzeć co się dzieje dookoła, oczy wszędzie czujne, jak zobaczycie że ktoś się przewrócił, pomóż koledze, wypierdol mu bułę.\n\nNie było pewne czy do odzianych w fiolet siepaczy dociera jakiekolwiek słowo, prefekt również o tym wiedział więc przeszedł do demonstracji, ustawił jednego z pretorian naprzeciwko siebie i rozpoczął omawianie na przykładzie:\n- I widzicie, teraz najważniejsze jest wejście. Głowa nisko, tarcza wysoko, pilum przed siebie, i teraz wchodzimy, JEEEEEB. - pasja z jaką prefekt zaprezentował szarżę sprawiła że przebił na wylot włócznią biednego pretorianina robiącego za kukłę treningową.\n- I jak, widzicie? Działa. Posprzątajcie go, dobra teraz zrobimy selekcję, podzielimy się na dwie centurie i robimy rozgrzewkę. I jak będziecie już w boju, pamiętajcie co się liczy! Pierwsze pierdolnięcie! Potem już będzie z górki.\n\nNa całe szczęście trening przed właściwą bitwą dokończony został bez kolejnych strat w ludziach. Dotarcie do rogatek miasta też okazało się bezproblemowe, kłopoty jednak zaczęły się w momencie kiedy obie umówione na bitwę strony nie potrafiły się odnaleźć w gąszczu blokowisk Gedanium. Ostatecznie okazało się że cała kohorta miejska udała się po prostu na obiad w Burgerrexie, a Pretorianie krążyli dookoła centrum. Jednakże wypchani mięsem miejscy strażnicy stanowili łatwy cel dla fanatycznych gwardzistów. Gdy obie strony zgromadziły swoje siły naprzeciw siebie w centrum miasta, przez pół godziny miał miejsce spektakl wrzasków, krzyków i obelg. Gdy w końcu ruszyli, pretorianie w kilka minut rozbili szeregi cohortes urbanae, i bardzo łatwo wygrali tę walkę. A wszystko dzięki pierwszemu pierdolnięciu."
calisia.99.a: "Czy można osiągnąć taki poziom mocy bez przeklinania?"

calisia.100.t: "Makaron to kłamstwo"
calisia.100.desc: "\"Krew. Wnętrzności. Ziemia usłana trupami. Nadal pamiętam tego jednego przerażonego młodzieńca. Nie mógł mieć więcej jak 18 lat, chudy jak patyk, ale waleczny. Bał się. Tak bardzo się bał...rozerwałem mu gardło zębami żeby przestał krzyczeć. Musiałem. Naprawdę musiałem! Mówili że jak pokonam wszystkich zobaczę swoją rodzinę. Trzymali ich jako zakładników i kazali walczyć dalej. Kolejna arena, kolejna rzeź. A oni tylko patrzyli jak wyrzynamy swoich pobratymców.\"\n\nDietrich siedział pośrodku starego baraku który przypominał bardziej klitki z obozów pracy niźli koszary. Rozpamiętywał ostatnią walkę na arenie. Nie był sam, razem z nim przebywało tam jeszcze pięciu barbarzyńców. Czterech Germanów, jeden Scyt. A raczej czterech Niemców i jeden Ukrainiec. Nie liczyło się już to jak ich nazywają. Zdehumanizowali ich wystarczająco. Siedzieli w martwej ciszy, ich oczy błądzące po ścianach jednocześnie przenikały do innego świata. Ci, którzy mieli jeszcze jakieś złudzenia myśleli o swoich ukochanych. Inni, których ich doświadczenia gladiatorskie jeszcze jakimś cudem nie złamały, próbowali wyprzeć ze swojego umysłu wrzaski i wszechobecną śmierć jakiej doświadczyli. Nie komunikowali się ze sobą. Nie mieli odpowiednich słów aby wypowiedzieć jakiekolwiek zdanie. Nadzieja została im odebrana przez tłumy wiwatujące na widok rozrywanych ciał i dekapitacji. \n\nW pewnym momencie do baraku weszło trzech uzbrojonych żołnierzy.\n- Salve, barbarī. Ale daliście popis! Plebs was pokochał, jesteście ich ulubieńcami. Macie szczęście, to była wasza ostatnia walka na arenie - powiedział oficer pretorian. Nikt z gladiatorów nie podniósł głowy, oprócz Scyta, który zaczął się nagle trząść - Będziecie od dzisiaj żołnierzami Imperium! Tak jest, tutaj ze sobą mam akt konskrypcyjny który wciela was do pierwszej kohorty trzeciego legionu Foederatii. Dostaniecie przywileje, no i wasze rodziny będą mogły pozostać w Imperium jako służący u patrycjuszy w Calisii. Głowy do góry! Wygraliście największą nagrodę jaką mogliście sobie wyobrazić w waszej sytuacji!\n- J-j...jakie przywilej niby dostać? - zapytał Dietrich łamaną łaciną, w końcu spoglądając pretorianinowi prosto w oczy.\n- Jak to jakie? Przywilej życia, Germāne. A, i macie dzisiaj dodatek. Dostaniecie za chwilę na obiad spaghetti.\nPretorianie zaczęli się śmiać jak gdyby ktoś powiedział najśmieszniejszą rzecz na świecie albo inny żart o chłopie przebranym za babę. Gdy wyszli, nadal nikt się nie był w stanie odezwać, ani nawet ruszyć. Mają walczyć za tych ludzi którzy odebrali im człowieczeństwo? Nie dość tych upodleń? Myślą że miska ciepłego makaronu załatwi sprawę?\n- MAKARON TO KŁAMSTWO!!! - wrzasnął Scyt już w tym momencie nie będąc w stanie kontrolować swojego dygotania. Wstał, zdjął swój pasek ze spodni i poszedł z nim do pomieszczenia które miało imitować toaletę. Nikt nie próbował go ratować, przemówić do rozumu. Kiedy myśleli że Calisia zabrała im wszystko, Imperium skontratakowało i zabrało im jeszcze więcej. Tylko ktoś będzie musiał posprzątać ciało Scyta zanim zacznie cuchnąć bardziej niż obecnie."
calisia.100.a: "Jedna gęba mniej do wykarmienia?"

calisia.101.t: "Pecunia Olet"
calisia.101.desc: "Nie, to niewiarygodne. Osiem lat w auxilia, cztery na limes, pięć w kohorcie pretoriańskiej, służba jako evocati - dwadzieścia lat doświadczenia, a płacą mi jak by mi w mordę dali. Jakim cudem Flavius dostał większy worek?\n- Ja pierdolę, na pizdę Junony!\n\nDziedziniec Cesarskiego Skarbca tętnił oczekiwaniem. Był dzień wypłaty Gwardii Pretoriańskiej i żołnierze przybywali po nowe \"podwyższone\" pensje rydwanami, wozami, a nawet starożytnymi ciężarówkami - wielkimi wozami z dodatkowymi końmi. Każdy zabrał niewolników do niesienia majątku. Sebastianus uznał jednak, że dostał za mało. Sam nie potrafił unieść worka, a zazdrościł koledze odrobinę większej wypłaty. Przypadkiem podstawił Flaviusowi nogę, rozrzucając jego uczciwie zarobione pieniądze po sali.\n\nNa widok latających denarii wszyscy oszaleli. Flavius chwycił Sebastianusa za tunikę i zaczęli się siłować. Ich niewolnicy podjęli walkę w imieniu panów. Jeden olbrzym powalił drugiego na wóz z sianem, który się przewrócił, rozsypując siano i monety. Kolejni niewolnicy oraz Pretorianie, którzy zostawili godność w koszarach, rzucili się po denarii.\n\n- NATYCHMIAST PRZERWAĆ TO SZALEŃSTWO! - ryknął centurion. - JESTEŚCIE ŻOŁNIERZAMI GWARDII PRETORIAŃSKIEJ I MACIE SIĘ TAK ZACHOWYWAĆ. SPRZĄTNĄĆ TO GÓWNO, BO KAŻĘ WAS WYCHŁOSTAĆ! ROZEJŚĆ SIĘ!\n\nZ centurionem się nie dyskutowało. Pieniądze zmieniały Pretorian w małpy, lecz rozkaz oficera czynił z nich posłuszne owce. Dziedziniec wrócił do porządku; po chaosie zostało kilka monet błyszczących w słońcu. Gdy ostatni żołnierze odeszli, centurion westchnął.\n\n- Dzień wypłaty... - mruknął."
calisia.101.a: "...zawsze jest jak circus maximus."

calisia.102.t: "Fama Mixta Martialis Artes"
calisia.102.desc: "- MARTINUS EL TESTOSTERONUS NAIMANUS PRIMUS! - głos spikera rozbrzmiał po wszystkich czterech kątach przestronnej Arena Calisia, gdzie odbywała się właśnie największa ze wszystkich gal sztuk walki w nowożytnej historii świata. To tutaj, pośród najznakomitszych gladiatorów z całego kraju, miała nastąpić chwila w której to nowy cesarz wstąpi do panteonu władców Calisii, wyniesiony na najwyższe stanowisko i honor jakiego można dostąpić w Imperium.\n\nI wyszedł on. Cały na fioletowo, w jednej dłoni dzierżąc gladiusa, drugą pozdrawiając zgromadzone tłumy, które nie wiedziały czy mają się śmiać, czy rozpaczać. \n- Bądźcie pozdrowieni, obywatele Calisii! Cesarz freakfightów wita was w moich skromnych progach! Dzisiaj, na tej ziemi, odbędzie się szczególna walka o kolejny tytuł cesarski.. - Martinus nie dokończył swojej wypowiedzi gdy przerwał mu właśnie spiker chcąc zapowiedzieć jego przeciwnika\n- A PRZECIWNIKIEM NASZEGO CESARZA BĘDZIE PROSTO Z GERMANII, DWU...\n- GDZIE MI SIĘ KURWA WCINASZ CHUJU? - Naimanus nie mógł znieść takiej obelgi i szybkim ciosem pięści w głowę powalił spikera na łopatki. Podniósł jego mikrofon i kontynuował.\n- Dzisiaj odbędzie się walka o cesarstwo. Tak jest proszę państwa, zgadza się. Kto dzisiaj wygra tę walkę wieczoru, ten będzie cesarzem. Chcę wam tym udowodnić że tylko najpotężniejszy wojownik może władać imperium! Dawajcie mi go tutaj! No chodź germański bałwanie! Posmakujesz mojego ostrza!\n\nW tym momencie zza kulis wyłonił się jego przeciwnik. Potężny, wysoki mężczyzna odziany w skóry i futro, z dwuręcznym toporem który wydawało się że ledwo utrzymuje pomimo swojej ogromnej postury. Nie czekając na żadnych sędziów, na żaden sygnał - Naimanus z okrzykiem \"AVE JA\" rzucił się na zdezorientowanego barbarzyńcę. Jednak taką szarżę uniknęłaby nawet starsza babcia na wózku. Widownię czekały trzy rundy pokazu absolutnej żenady gdzie obie strony z gracją pijanego mistrza kung-fu próbowały wzajemnie trafić się w ogóle orężem.\nOstatecznie, w trzynastej sekundzie czwartej rundy wielki germanic przewrócił się o własne nogi próbując zamachnąć się na Naimanusa. Ten, z gracją otyłego łabędzia zanurkował na barbarzyńcę i przebił mu mieczem krtań. Cały zakrwawiony, podniósł się i zwycięsko zaczął podbudzać tłum do skandowania jego imienia.\n- TAAAAK, TAAAAAAAAAAAK! AVE CAESAR MARTINUS NAIMANUS! AVE JA!\n\nTłumy nie wiedziały, że wszystko ustawili Pretorianie. Barbarzyńca był nieszczęsną ofiarą: odurzonym i zdezorientowanym germańskim wojownikiem złapanym w polityczną intrygę.\n\nDla Martinusa nie miałoby to znaczenia. Pławił się w wiwatach i przez chwilę czuł jak prawdziwy Cesarz, władca wszystkiego, co widział. Wiedział, że to dopiero początek jego panowania..."
calisia.102.a: "...a przynajmniej tak naiwnie sądził."

calisia.103.t: "Acta est Fabula"
calisia.103.desc: "W Nowej Calisii gdzie światła gasną, na horyzoncie maluje się groza. Imperium zostało przekształcone na nowo, rewolucja wewnątrz szeregów politycznych zmieniła wszystko by na końcu zmieniło się niewiele. Nowe budynki mieszkalne stanęły na obrzeżach zrujnowanej przez pożar centrum Calisii, ale niektóre rejony nadal tak długi czas po feralnych wydarzeniach które skończyły się zamachem pretoriańskim stoją opustoszałe niczym się obecnie nie różniące od wszelkich innych starożytnych ruin.\n\nKażdy kolejny dzień staje się coraz większym wyzwaniem dla cierpliwości zwykłych obywateli. Ale strach okazuje się być potężnym narzędziem, który wykorzystują pretorianie co rusz wyciągając kogoś na ulicę celem aresztowania, pobicia, poniżenia, nawet jeżeli dana osoba nie zrobiła absolutnie nic. Efekt szoku i wszechobecnego terroru działał na obywateli, którzy zgodnie z chrześcijańskim przykazaniem nastawiali drugi policzek.\n\nSzczególnie w momencie gdy na ulicy pokazywał się sławny Imperator Martinus Naimanus, dla którego nie było tygodnia w którym dałby o sobie zapomnieć. Teraz pozbawiony wszelkich skrupułów, a przede wszystkim ograniczeń prawnych - mógł bawić się w boga kroczącego pośród swoich minionów. Abstrahując od jego wyobrażeń samego siebie jako wielkiego wojownika-gladiatora i upodobania do walczenia w ustawionych walkach na arenie, ale prostota i agresja wychodziła z Naimanusa nawet w zwykłych momentach życia, gdy stojąc w kolejce potrafił pobić kogoś, gdyż tak mu się podobało, a poza tym kolejka była za długa. Nie ważne nawet, że nie musiał w tej kolejce stać. Pretekst nie jest tu do niczego potrzebny, i nikt już nie udaje że jest inaczej.\n\nAdministracja cudem trzyma się w ryzach, ale prawdopodobnie głównie dlatego iż paradoksalnie pretorianie zdecydowali się aprobować decentralizację władzy wysuwając lokalnych watażków na pierwszy szereg, sami rządząc z cieni, gdzie jest im najwygodniej. Dlatego też władzę w tym kraju sprawuje nie cesarz, lecz prefekt Cinastovicus. I wszyscy o tym wiedzą, ale nikt nie jest w stanie wypowiedzieć tego na głos. Bo wiedzą, że jeśli to zrobią, to będą mogli już następnego ranka wstać o 5 rano by zaparzyć herbaty agentom Frumentarii którzy przybędą go aresztować. I tutaj nie pomoże nawet wszechobecna korupcja, dzięki której bogaci mogą załatwić swoje najbardziej chore interesy. Bo tak zepsuty system potrzebuje zepsutych ludzi, jednocześnie ich kreując. Niewolnictwo na masową skalę było tylko wisienką na torcie, a w niewolę zaczęli coraz częściej popadać i zwykli obywatele, dla których nie było żadnego innego wyjścia.\n\nI prędko żadnego nikt nie zobaczy."
calisia.103.a: "Dosłownie MCMLXXXIV."

calisia.104.t: "Divisio Aeterna"
calisia.104.desc: "Czy kiedykolwiek byliśmy przyjaciółmi? Rodakami? Czy słuchaliśmy zmarłego Imperatora? Titus powiedziałby, że nie. Inaczej nie znaleźlibyśmy się tutaj.\n\nNiegdyś należał do kochającej, zamożnej rodziny utrzymywanej z centurionskiego żołdu brata Petrusa i premii pretoriańskich. Było wino, muzyka, nawet elektryczność, nie wspominając o doskonałych niewolnikach: uległych dziewczętach i chłopcach gotowych wykonać każdy rozkaz panów.\n\nTo przeszłość. Petrus zabrał chłopców, Titus odszedł z dziewczętami. Rodzice prawie ich nie widywali, zresztą Titus i tak rzadko bywał w domu. Wezwał obowiązek pretoriański, a on odpowiedział. Kraj przestał być całością. Jedyną rzecz, która go spajała, zniszczyli przywódcy Titusa. Z rozdętych zwłok Imperatora wypłynęła tłusta niezgoda i rozdzieliła przyjaciół, rodziny... Calisię.\n\nNie łudził się, że zobaczy brata. Miał nadzieję, że nie. Petrus był człowiekiem Viniciusa, Titus - Cinastovicusa. Następnym razem spotkają się jako wrogowie.\n\nPakując rzeczy, poszedł coś zjeść do kuchni matki. Być może po raz ostatni skosztuje domowego jedzenia bez obowiązkowej libacji z towarzyszami. Gdy wszedł, w milczeniu kończyła jego ulubioną potrawę. Próbował rozpocząć rozmowę, lecz nie odpowiadała. Pogoda, ojciec, Petrus... nic. Podała mu zapiekane kanapki dokładnie takie, jak lubił. Najbardziej niezręczny posiłek jego życia.\n\nGdy skończył i wstał, stara kobieta u schyłku życia wreszcie przemówiła. \n\n- Ta rodzina, ten kraj, te pizdy, które obaj nazywacie panami, kimkolwiek są... Nigdy nie przestaną się dzielić. Nigdy nie przestaną walczyć. Rozszczepiać. Rozbili tę rodzinę i wszystko, czym był kraj. A ty oddajesz życie jednemu z nich. \n\nŚledziła dość polityki, by wiedzieć, gdzie są i dokąd zmierzają. Żałoba. Smutek. Bez pogardy. Nawet teraz, mówiąc w najbardziej przygnębiony sposób, nie okazywała pogardy. Nie byłem rozczarowaniem. Po prostu robiłem to, co musiałem, tak samo jak Petrus. \n\n- Matko, wiesz, że...\n\n- Synu... - w jej oczach stanęły łzy."
calisia.104.a: "- Módl się, żebym umarła przed ojcem."

calisia.105.t: "Dary soli i chleba"
calisia.105.desc: "Ile dni maszerował przez kraj? Ile unikał barbarzyńskich degeneratów, tylko po to, by trafić na najgorsze przejawy ich zła? Jak długo musiał żywić się ludzkim mięsem? Niewiele go to obchodziło. Z każdym krokiem czujność i strach wypędzały wyższe myśli i usypiały je. Stał się równie barbarzyński jak najgorsi z nich, a chłód i brutalność podróży nauczyły go zwierzęcych sztuk: jak zachować ciepło bez zwracania uwagi, jak dostrzec zagrożenie wcześniej niż inni. W tym zezwierzęceniu tkwił pewien... spokój. Im bardziej pogrążał się w przetrwaniu, tym mniej bolały dawne traumy.\n\nA jednak... gdy tylko czuł się bezpieczny, tęsknił za smakiem chleba z masłem, schabowych i polędwiczek z kurczaka, jedzonych z... NIE, NIE, NIE!\n\n\nSpokój. Głęboki oddech. Nie wolno tracić skupienia. Co z tego, że jest już na terytorium Legionów? Niebezpieczeństwo może być wszędzie. Ludzie. Zwierzęta mniej. Wilki boją się ludzi, niedźwiedzie też, jeśli wiadomo, co robić. Wszystko mniejsze jest pożywieniem. Jesteśmy drapieżnikiem szczytowym. Jesteśmy... \n\n\nWyszedł z lasu na łąkę i zrozumiał: przed nim leżała prawdziwa osada skąpana w świetle świtu. Spokojne, uporządkowane ulice świadczyły, że była zamieszkana i zamożna. Mógł wreszcie... Nie. Nie skończył, dopóki przez marchie nie dotrze do Cracovii. Żołądek zaburczał. Przez większość tygodnia głodował. Ale co z tego... Maszerował ulicą między skromnymi, krytymi strzechą domami... głód... dlaczego nogi odmawiają posłuszeństwa... nie... \n\n\nObudził się w wygodnym łóżku. Jakie dziwne uczucie; zapomniał je po tygodniach na zimnej ziemi i drzewach, gdzie pościelą były mrówki. Zagracony, wilgotny pokój wyglądał, jakby cofnął się o co najmniej 80 lat. A jednak był urokliwy. Ciepły zapach zapraszał do kuchni, drażniąc wygłodniały żołądek.\n\n- Podróżniku, siadaj. Musisz być głodny. Chodź. Moja sól i chleb są twoje. Jedz. Tutaj jesteś bezpieczny.\n\nStara babcia w chustce i kuchennym fartuchu postawiła przed nim chleb oraz solone masło. Patrzył jak na ducha, przypominając sobie zmarłą babcię i jej doskonałe placki oraz wypieki. Zanurzył się w dawno zapomnianym komforcie, całym sercem przyjął gościnność południa Viniciusa i napełnił żołądek po brzegi."
calisia.105.a: "Podziękował Bogom za całe dobro świata."

calisia.106.t: "Bogowie strachu i głodu"
calisia.106.desc: "MARIUS! NIE ZOSTAWIAJ MNIE! MAAAA...\n\nMarius budzi się i ociera pot z czoła. Tydzień temu wstawał we własnym łóżku przy żonie i małej córce. Tydzień temu wszystko runęło, gdy najeźdźcy zajęli jego wieś. Dziś żywi się paczkowanymi krakersami i śpi pod drzewem w śpiworze, tak niepozornie, jak potrafi.\n\nPrzy takim niedoborze żywności w zachodnich prowincjach, zwłaszcza blisko stolicy, łatwo zrozumieć, czemu bandy łupieżców pustoszą kraj. Kontrola jest minimalna, jedzenia brak. Ponieważ jednak produkuje się je na wsi, najazdy tylko pogłębiają niedobór.\n\nDla uciekającego człowieka złamanego utratą rodziny jedyną drogą jest południe, gdzie żywności nie brakuje. Nie ma do kogo iść, więc równie dobrze może dołączyć do legionów Viniciusa. Na pewno nie wstąpi do sił Senatu, który dopuścił do tragedii.\n\nZbiera śpiwór, pożera żałosne krakersowe śniadanie i rusza lasem na południe. Brak samochodu? Żaden problem: zbójcy łatwiej złapaliby go na drodze.\n\nMinuty. Godziny. Maszerując i wypatrując zagrożeń, stracił poczucie czasu. Jego światem był on, las i wszystko, co mogło stanowić niebezpieczeństwo. Rozsądnie się uzbroił: przy boku miał wspaniałą Berettę, nawet lornetkę. Czas nic nie znaczył. Minuty były godzinami, godziny mijały jak minuty. Aż...\n\nPolana. Groteskowy widok, którego nie dostrzegł, dopóki nie stanął na skraju: cztery paleniska i totem pośrodku. Nie... człowiek? Martwy, przywiązany do totemu. Chorobliwa ciekawość czy samobójcza głupota kazała mu podejść. Górna część czaszki była przepiłowana, nabito na nią stalowe kolce. Wynędzniałe, szkieletowe, okaleczone i nagie ciało przypominało pień młodego drzewa. Kończyny... to nie były kończyny, lecz zszyte kości wystające z...\n\nNędzne śniadanie Mariusa wylądowało jako wymiociny przed figurą - ofiarą dla barbarzyńskiego boga. Przy paleniskach zobaczył szaszłyki. Wciąż wymiotując, zabrał je. Mięso wyglądało na dobrze upieczone, lecz nie przypominało niczego, co jadł. Czując potworną niewłaściwość, schował szaszłyki do torby i uciekł. Po kilkuset metrach usłyszał z polany dzikie wrzaski i krzyk dziewczynki; przed oczami stanęła mu córka. Nieważne. Ten słaby ból go nie zatrzyma. Musi żyć dla rodziny. Nie pomoże nikomu poza sobą... Lecz gdy odzyskał rozsądek i pojął, że porzucił rodzinę oraz kolejną ofiarę, a być może znów sprofanował ludzkie ciało... zaczął bać się przetrwania, wiedząc, że strach i głód mogą przestać odwracać uwagę od jego demonów."
calisia.106.a: "Modlił się do Jowisza, służąc Strachowi i Głodowi."

calisia.107.t: "Tyrania"
calisia.107.desc: "Gwardia Pretoriańska nigdy nie miała zajmować się administracją i nie powinna. Byli intrygantami, często dekadentami, zawsze dwulicowymi. Może dlatego niegdyś stanowili tajną policję Cesarstwa. By złapać szpiega, potrzeba skrytego umysłu.\n\nWszystko straciło znaczenie wraz z Triumwiratem. Calisii już nie ma. Pozostało dalsze rozszczepienie niegdyś wielkiej wizji, najpełniej wyrażone przez system pretoriański. Nie bardziej zjednoczony niż konfederacja, administracyjnie i prawnie był mieszaniną państewek watażków: ludzi zdobywających pozycję nie retoryką ani sprawnością zarządzania, lecz prymitywną charyzmą i większą siłą ognia.\n\nŻadnej erudycji. Najlepsi mieli naturalną inteligencję i niski spryt; najgorsi byli prostakami, pionkami na pretoriańskiej szachownicy. Pretorianie pobierali trybut z Constantii, miasta odnowionych wieżowców i białego betonu. Ograniczenia administracyjne obchodzili, korzystając z talentów szpiegowskich: cofali się w cień, gdzie byli najlepsi, i pozwalali watażkom działać.\n\nDziewczyna uciekająca po obronie przed zbirami jednego z nich miała jedno wyjście: zgłosić się do Pretorian, którzy czynili ją służącą-infiltratorką albo prostytutką-szpieginią. Wiejscy watażkowie wymuszali haracze od ludzi chcących handlować lub produkować, sami wikłając się w walkę o władzę; alternatywą była nadzieja na bezpośredni kontrakt z Pretorianami. Watażkowie pogrążali się w biedzie, despotyzmie i tyranii, które Kalizjanie przypisywali niegdyś wyłącznie barbarzyńcom. Pretorianom to odpowiadało. Bogaty watażka był zagrożeniem, chyba że inni skakali mu do gardła, więc wobec panów nie miał siły negocjacyjnej. Konflikty przeradzały się w potyczki i zabójstwa, a poza wielkimi miastami bezpieczeństwo zniknęło. Pretorianie przesuwali pionki z cienia, jednych wynosząc, innych obalając wyłącznie dla zwiększenia własnych wpływów. Szachownica tej części Polonii stała się bezprawnym piekłem, gdzie nikt nie był bezpieczny, a dobrobyt pozostał wspomnieniem. Wszystkie pionki kontrolował jedyny gracz - Cinastovicus. \n\nWielka Gra trwała, a wraz z nią najwyższe rządy pretoriańskiej tyranii."
calisia.107.a: "Omnipotentia aeterna: sic nunc tyrannis."

calisia.108.t: "Potentia Sanguinis"
calisia.108.desc: "Proste katakumby. Sześć palenisk. Granitowe ściany, piękna kamieniarka pod stopami. Prymitywna wentylacja odprowadzająca dym. Trochę kadzidła. Vinicius stał u wejścia do zaadaptowanej katakumby. Niegdyś mieściła zmarłych, teraz misę na ołtarzu. Sześć palenisk otaczało ją kręgiem światła. Na ścianach wyryto przedkalizjańskie modlitwy, czaszki i coś przypominającego nagrobki. Tym lepiej.\n\nVinicius wszedł, czując przez sandały zimny granit. Zimny i twardy. Tak powinno być. Taki powinien być Vinicius jako pan Legionów. Nieugięta, niepowstrzymana siła, która wbrew wszelkim szansom przywróciła starożytną epokę. Mówiono, że dawna Polonia nisko upadła. Legiony dowodziły, że tylko spełnia przeznaczenie.\n\nStarzec rozsypywał nad ołtarzem kadzidło i płatki, śpiewając inspirowane pogaństwem pieśni. Czy były prawdziwymi modlitwami do Marsa i Jowisza? To nieistotne. Prawdziwy sens płynął w żyłach Viniciusa.\n\nPodszedł do ołtarza. Zardzewiała, lecz użyteczna stalowa misa. Wokół więcej świec. Stary kapłan w purpurowej todze rozpoznał generała i podał sztylet. Vinicius podwinął rękaw, przebił skórę i naciął żyłę, powtarzając za kapłanem:\n\n\n- Przysięgam\n\nŻe od dziś do końca świata\n\nBędę wrogiem Gwardii Pretoriańskiej\n\n- Krew skapywała do misy.\n\n- I kalizjańskiego Senatu.\n\n- Cienka ciemnoczerwona strużka zbierała się na dnie. Kapłan rozsypał kolejne płatki.\n\n- Tyrana. Caletusa.\n\n- Potrząsnął ramieniem, rozpryskując krople krwi.\n\nWęża. Cinastovicusa!\n\nA teraz najważniejsze: wyciągnąć wacik nasączony etanolem i dopilnować, by nie wylała się już ani kropla."
calisia.108.a: "Poza krwią wymienionych w rytuale."

calisia.109.t: "Miasto nie może upaść"
calisia.109.desc: "Miesiąc temu Forum żyło. Powietrze wypełniały rozmowy i handel. Choć widziało lepsze dni, podobnie jak Calisia, niektórzy wciąż żywili naiwną nadzieję. Ludzie spacerowali i rozmawiali, inni słuchali krzykaczy rozprawiających o polityce. Czasem przechodził Senator i po koleżeńsku odpowiadał na pytania. Wszystko było dobrze.\n- SENATOROWIE!!! SŁUCHACIE?!\nWokół grupy Senatorów zebrał się mały tłum. Szare suknie, dresy; jeśli byli to dostojni obywatele, najlepsze ubrania już sprzedali. Zwiastun przyszłości. Senatorowie odpowiedzieli zatroskanym ludziom całą mocą retoryki:\n\n- Calisia się rozpadła. Odzyskajmy ją! \n- Ale jak?\n- Senacie, zbuduj lepsze miasto, dla wszystkich!\n- Wszystkich?! Sympatyku barbarzyńców, w dyby!\n\nZ każdym dniem rozmowy stawały się bardziej rozpaczliwe i naglące. Coraz mniej Senatorów schodziło na Forum; szlachetne togi zastąpili Vigiles w oporządzeniu do tłumienia zamieszek.\n\n- Senatorowie... od przejęcia władzy przez Triumwirat tylu rzeczy nam brakuje...\n- Lud głoduje! Mniej jedzenia, więcej gąb do wykarmienia!\n\nTo była granica. Z woli Senatu żywność stanowiła tabu. Nikt nie chciał, by niedobory uderzyły w miasto i wywołały rozruchy głodowe, które wymknęłyby się spod kontroli. Musieli kłamać.\n\n- Traktują nas jak barbarzyńców, zostawiają na uduszenie!\n- Szlachta ma całą ziemię, niewolnicy całą pracę! A my?!\n- Kto nakarmi nasze rodziny?\n- SENACIE?! TA NĘDZA ZABIJE CALISIĘ!\n\n- SENACIE!!! \nWkrótce wspólnota zniknęła. Przez ostatni tydzień Forum było puste poza kilkoma odważnymi, dobrze chronionymi kupcami. I tłumami. Vulgus zlewał się w masę biegającą za czymś do kradzieży i kimś do obwinienia. Przechodzący Senator musiał stawić im czoła z potężną świtą:\n\n\n- GDZIE DOMY, KTÓRE OBIECALIŚCIE?\n- RÓWNA PŁACA ZA RÓWNĄ PRACĘ!\n- CALISIA DLA KALIZJAN!\n- POCHOWALIŚCIE CALISIĘ RAZEM Z IMPERATOREM RICARDUSEM! TERAZ ZAPŁACICIE!!!\n\nKoktajl Mołotowa poleciał ku Senatorowi i rozbił się o tarczę. Zaczęła się rzeź. Inny Senator, bezpieczny w pałacu, usłyszał wyjące syreny obwieszczające nieszczęście Wiecznego Miasta."
calisia.109.a: "Senatorze... słyszałeś?! Miasto... miasto nie może..."

calisia.110.t: "Johnny Polish"
calisia.110.desc: "Dziecięce, lecz zawsze czujne oczy. Uśmiech tak szeroki, że przestał być zabawny. Agent Ioannesulus miał dziś dobrą passę. Przeniknie przez czujne spojrzenia legionowych strażników i zinfiltruje obóz... przebrany za krzak. Siedział w kostiumie na suchej drodze pośród pagórkowatego, bezdrzewnego terenu przypominającego łąkę przechodzącą w sawannę. Baza była pół kilometra dalej za bramą i drutem kolczastym. Legionista przez minutę patrzył w jedną stronę. Gdy zmieniał pozycję, Ioannesulus ruszał, szeleszcząc, kucając i pełznąc. Kiedy strażnik spoglądał na niego, padał na ziemię. W obłąkanej grze w czerwone-zielone wiejski wartownik zastanawiał się, czy krzaki na drodze zmieniają miejsca, a wiejski wariat-szpieg podpełzał coraz bliżej w chaotycznym przebraniu.\nIoannesulus wcale nie prosił o tę pracę. Był jednym z niewielu, których los poprawił się po Upadku. Dawniej, jako woźny w miejskim akademiku, był odrzucany jako upośledzony, niepełnosprawny i inne podobne bzdury. Wszyscy mówili, że mu współczują, ale nikt nie chciał mieć z nim nic wspólnego. Nie mógł iść na urodziny; zbywali go wymówkami, jakby nie wiedział, co robią. Po Upadku wrócił do wsi i stał się wszystkim, czego bali się miejscy znajomi: klaunem, wiejskim głupkiem. Wiedział o tym. Wiedział też, że wieś zrobi coś, czego miasto nigdy by nie rozważyło - zaakceptuje go jako swojego. \n\nPretorianie nie wydawali się inni, gdy zaoferowali mu zadanie. Zapłata. Nowy przyjaciel. Czemu nie? Miał tylko dostać się do bazy.\nPrawie mu się udało, gdy z otwieranej bramy wyjechał pojazd. Zatrzymał się, a wysiadający centurion kopnięciem zrzucił przebranie biednego Ioannesulusa. \n\nDalszy los biedaka nie miał znaczenia. Strażnik i centurion skupili się na nim, wykrzykując pytania, które uważał za bezsensowne. Zdawał się ich nie słyszeć.\n- Przepraszam, co panowie tu robią? - powtarzał w odpowiedzi.\nWreszcie:\n- O!\nMężczyźni postanowili odwieźć Ioannesulusa bliżej wsi. Dali mu nawet worek mleka. Uznali go za nieszkodliwego głupka, co w tym kraju nie było rzadkością.\nPrawdziwe zagrożenie czaiło się jednak w cieniu i gdy obaj zajmowali się Ioannesulusem, niezauważone wpełzło w pełnym pustynnym kamuflażu.\n\n- Kryptonim Vulpes Inculta, raport nr 1:\nInfiltracja zakończyła się pełnym sukcesem. Wszystko poszło dobrze, niemal zbyt dobrze. Manewr Faba zapewnił bezproblemowe wejście. Mieliście rację. Wiejski głupek nic im nie powiedział i nie jesteśmy zagrożeni dekonspiracją. Misja może przebiegać zgodnie z planem. Dowody zostaną podrzucone, a w razie potrzeby zdobędę jednego lub dwóch poufnych informatorów..."
calisia.110.a: "O!"

calisia.111.t: "Rzeź to najlepsze lekarstwo"
calisia.111.desc: "Poniedziałek. Pobudka o 5:00. Bieg przed świtem. Pajacyki. Wrzosy lśnią w świetle poranka wśród wrzasków centuriona. Jasna mgła. Nie ma czasu na widoki, trzeba wracać do bazy. Skandować pochwały Viniciusa. Skandować śmierć Pretorianom i senackim kundlom. Potem zwyczajna rutyna: służba przy latrynach, jedzenie pachnące jak z latryny. Kolejny rekrut trafił do karceru, bo podobno powiedział centurionowi, że zgubił drogę do Berolinum. Zgadnijcie, kto miał \"przyjemność\" wymierzyć baty.\n\nJak strzecha ciemnieje z wiekiem, tak w moich oczach ciemnieją namioty. Monotonia żołnierskiego życia mnie zabija. Z nudów nie potrafię czuwać, z rozdrażnienia nie potrafię spać. Stan idealny dla żołnierza: może nauczę się spać połową mózgu, a drugą trzymać wartę.\n\nDo tego czasu przestrzegaj niepisanych zasad, których nie ma w podręcznikach. Ostatni łyk alkoholu zawsze dla dowódcy. Śpij, kiedy możesz. Na stojąco, jeśli potrafisz. Nie spółkuj z barbarzyńcami ani ze zwierzętami. Tak, niektórym skurwysynom trzeba było to mówić. W strefie walk nie zgłaszaj się na ochotnika, chyba że wolisz być zapamiętany niż żywy.\n\nA potem... zamiast taniego bimbru dostarczono wino. Zamiast czegoś, co musiało być karmą dla psów, na stołach pojawiły się schabowe i galijskie frytki. Chrupiące, pyszne frytki. Wtedy wiedzieliśmy. Cała paplanina o złu Pretorian i Caletusa miała się urzeczywistnić.\n\nVinicius wiedział, co robi. Przyzwyczaić nas do ciężkiego i gównianego losu żołnierza. Potem trochę rozpieścić. Napompować przed eskalacją, gdy znienawidzony Triumwirat wydaje ostatnie tchnienie. Po co w ogóle był? Ach tak: by Caletus postawił na swoim i powstrzymał szał Viniciusa przeciw mordercom Imperatora.\n\nWrząca nienawiść agitatorów. Pomyje w stołówce. Krzyki głupców obrażających centurionów. Bicz. Oczekiwanie na wizytę Viniciusa. Szkolenie, senność, wyczerpanie. Wszystko się kończy. Zaczyna się coś znacznie gorszego. Gdy ruszy rzeź, zapewne nie będę spał całymi dniami.\n\nLecz między szansą wyładowania gniewu na pretoriańskim ścierwie a wjazdem do Wiecznego Miasta u boku triumfującego Viniciusa..."
calisia.111.a: "Nie chciałbym, żeby było inaczej."

calisia.112.t: "Evocatio Militaris"
calisia.112.desc: "- Wrogowie na czwartej! - wykrzyczał centurion Pretium.\n- Za Viniciusa! Za Calisiusa! - ludzie odpowiedzieli ogniem w pozycje wojsk wiernych Pretorianom.\nWspierały ich VPM Mantichoras, dopóki nie zniszczyła ich wyrzutnia przeciwpancerna. Po krótkiej wymianie ognia żołnierze Legata Legio XIX wyparli wroga na głębsze pozycje. Był wśród nich legionista Ioannis Saponis, kiepski strzelec szybko zgarnięty z ulicy do łatania frontu. Vinicius potrzebował jak najwięcej ludzi przeciw pozostałym Triumwirom, niezależnie od swego strategicznego geniuszu.\nW zdobytych okopach Ioannis przeszukiwał zwłoki żołnierzy Cinastovicusa. Szukał kuzyna Constantiusa, walczącego po drugiej stronie. Los przydzielił go do garnizonu Constantii, gdy Ioannis został z rodziną w Cracovii. Po rozpadzie Calisii więzy krwi nie obchodziły żadnego Triumwira. Liczyła się ambicja. Vinicius twierdził, że walczy o honor i zemstę za Cesarza, choć własnym podpisem zalegalizował tyranobójstwo.\n\n\nNa szczęście żaden zabity nie miał twarzy Constantiusa. Głowa jednego była zmasakrowana, więc Ioannis z mdłościami sprawdził nieśmiertelnik. To nie był kuzyn. Wiedział przynajmniej, że nie zabił go własną ręką.\n- Bene, dość rabowania grobów. Pokażmy tym... Strzelać do skurwysynów! - krzyknął kolega.\nZ bezpiecznego okopu Ioannis oddał kilka przypadkowych strzałów, po czym udał zacięcie broni. Nie był gotów porzucić spokoju sumienia. Gdy ludzie prefekta wycofali się, Decanus Manes spojrzał na niego.\n- Ty! Dlaczego nie strzelałeś?\n- Ee, broń mi się zacięła. - Ktoś musiał donieść. Posmarował stary karabin Corvus tak, by naprawdę się zaciął. Na szczęście zadziałało.\n\nSaponis wiedział, że nie może tak walczyć, martwiąc się o rodzinę po drugiej stronie. Nie zdezerterował w transporcie, bo musiałby utrzymywać się z rabunku. Teraz, tak blisko frontu, poważnie rozważał przejście do przeciwnika. Sprawy Triumwirów nic go nie obchodziły, lecz nikt nie pytał go o zdanie. Skoro musiał za kogoś walczyć, równie dobrze mógł za stronę kuzyna."
calisia.112.a: "Pieprzyć wszystkich, którzy do tego doprowadzili."

calisia.113.t: "Calisiusie, spoczywaj w ciszy"
calisia.113.desc: "Vinicius czekał w namiocie obozu pod Holstinem. Choć mógł zasiąść na tronie w Constantii, chciał jak najdłużej odkładać życie dworskie i odmówić gościowi zaszczytu sądu w pałacu. Więzień przybył szybciej, niż oczekiwał.\n- Znaleźliśmy go, Panie. Próbował uciec morzem! - żołnierze postawili jeńca przed Legatem.\n- Powinieneś wiedzieć, że węże nie pływają.\n- Właściwie pływają - żart przerwał cios Legata. - Sądziłem, że zajmiesz się Caletusem, skoro skakaliście sobie do gardeł.\n- To był podstęp. Jestem aktorem. A on naprawdę mnie wkurwiał. Constantia była też znacznie bliżej frontu niż Calisia.\n- Dlaczego to robisz? - Cinastovicus poprawiał związane ręce. - Tak pragniesz władzy?\n- Nie chodzi o władzę. Wymierzam sprawiedliwość - przystawił spathę do gardła dawnego prefekta - ludziom, którzy zabili największego człowieka powojennej Polonii, tego który zakończył chaos Upadku i mającego prawdziwą wizję przyszłości.\n- Który przywrócił znaczenie drugorzędnemu aktorowi - kolejny cios, tym razem głowicą, trafił Cinastovicusa w twarz. - Nie przywrócisz go. Ta eskapada przyniesie tylko kolejne śmierci Pretorian i Optymatów, a potem nie zostanie nikt, kto rządziłby resztką marzenia Calisiusa. Tak chronisz jego dziedzictwo? Taka jest cena sprawiedliwości?\n- Jeśli próbujesz się ratować, to tylko mnie bardziej denerwujesz. Zakneblować go! - Legioniści wepchnęli szmatę w usta Pretorianina.\nZabójstwo ojca narodu jest równie złe jak każde ojcobójstwo, jeśli nie gorsze - Vinicius mógł monologować bez przeszkód. - Dawni Rzymianie mieli właściwą karę: Poena Cullei. W Constantii wsadzimy cię do worka z kilkoma zwierzętami i wrzucimy do Vistuli. Potem lud odpowiednio doceni twoje zwłoki. - Twarz Christianusa stawała się coraz bledsza. - Wyprowadzić go.\nGdy wyszli, Vinicius z uśmiechem spojrzał na mapę, oczekując starcia z Caletusem."
calisia.113.a: "Sprawiedliwość zostanie wymierzona."

calisia.114.t: "Krzyże rosną wzdłuż dróg"
calisia.114.desc: "Jeden po drugim zwykli żołnierze i oficerowie wierni Viniciusowi byli krzyżowani. Potworny szlak biegł od Calisii do Cracovii, wyznaczając drogę pokonanych armii.\nKonsul Petrus Caletus nie uważał jednak sukcesu za pełne zwycięstwo. Gdyby jego ludzie pojmali Viniciusa, nie potrzebowałby tylu egzekucji, ale zmuszono go do działania. \"Honorowy\" Legat popełnił samobójstwo, przebijając się gladiusem. Caletusowi odmówiono nie tylko ciała Viniciusa, lecz także jego ziem, co drażniło Konsula jeszcze bardziej.\n\nPo pewnym czasie przybyło drugie źródło bólu głowy.\nCinastovicus miał na sobie najwspanialszy aksamit. Gdyby Caletus nie siedział na tronie, trudno byłoby wskazać suwerena.\n- Wygląda na to, że twoi ludzie nie schwytali Viniciusa na czas - powiedział Cinastovicus z ostrożnym samozadowoleniem.\n- Za to twoi przejęli jego ziemie - Caletus przeszedł do sedna. - Mimo że mój wysiłek wojenny przewyższał twój.\n- Nie miałem na to wpływu - praefectus wzruszył ramionami. - Miejscowi gubernatorzy uznali nasze rządy albo legiony poddały się. A skoro mowa o ziemi, wiem o twoich legionach wkraczających na moje północne terytorium.\n- Nie pogrywaj ze mną, śliski sukinsynu! Niczego nie zostawiasz przypadkowi.\n- Cała sytuacja wynikła przypadkiem. Spiralą wydarzeń poza moją kontrolą.\n- Dość! Obecny podział narusza równowagę.\n- Dlaczego? Wszystkie ziemie zdobyto zgodnie z umową...\n- Chcę, żebyś uznał moje rządy nad resztą Pomeranii i Vartii - Caletus uśmiechnął się szyderczo. - Cieszę się, że o tym wspomniałeś.\n- Nie masz prawa! - Pretorianin stracił panowanie. - Nie pozwolę!\n- Pozwolisz! - Konsul wstał. - Chyba że chcesz kolejnej wojny. Jestem rozsądny. Tylko połowy dwóch prowincji.\nCaletus podszedł bliżej, próbując go zastraszyć.\n- Dobrze - poddał się Christianus.\n- Świetnie. I tak dostałeś lepsze części. Sam znajdziesz wyjście.\nPo jego odejściu Caletus usiadł na tronie, nadal niezadowolony z kolejnego częściowego zwycięstwa."
calisia.114.a: "Bez obaw, nadal lecimy połową statku."

calisia.115.t: "Aut cum Scuto"
calisia.115.desc: "- Ach, potężny Vinicius! - Cinastovicus powitał \"gościa\" z nieukrywaną radością. Na tronie Constantii pośród wiernych Pretorian wydawał się nietykalny. - Rozwiązać go.\nVinicius był zdumiony.\n- Skąd ta łagodność? Oczekujesz, że uklęknę przed zdrajcą? Nigdy!\n- Już raz to zrobiłeś, lecz teraz nie będzie potrzeby. Narobiłeś bałaganu i mimo talentów egzekucja jest nieunikniona.\n- Wszystko przewidziałeś, śmieciu?\n- Wcale nie - Praefectus brzmiał szczerze. - Gdyby tak było, dawno byś nie żył, a ja nie użerałbym się z bufonem na zachodzie. Musiałem oddać mu dwie prowincje, żeby nie urządził kolejnej awantury.\nPrzerwał, by otrząsnąć się z frustracji.\n- Co próbowałeś osiągnąć? Pamiętasz, jak mówiłem, że Triumwirat zaprojektowano tak, by żaden członek nie mógł zwyciężyć, atakując pozostałych? To niezbyt skomplikowane nawet dla prostego trepa.\n- Po pierwsze, bo jebać cię! - odparł zawsze rozważny Vinicius. Cinastovicus nie drgnął. - Po drugie, skoro złamałem Triumwirat, umowa nie obowiązuje. Wkrótce ty i Caletus zaatakujecie się nawzajem. Dwaj zdrajcy skoczą sobie do gardeł. To najlepsze, co mogłem zrobić, by pomścić Cesarza.\n- Jesteś naprawdę monotonny. Dam ci żołnierską śmierć przed plutonem egzekucyjnym. Zapewne bardziej miłosierną niż ta, którą planowałeś dla mnie - zwrócił się do straży. - Do celi. Jutro ma egzekucję."
calisia.115.a: "Aut in scuto."

calisia.116.t: "Inceptum \"Democritus\""
calisia.116.desc: "Główny inżynier Robertus Aperdomus jechał wojskowym jeepem wzdłuż granicy i oglądał gromadzących się po obu stronach Vistuli żołnierzy.\n- Lepiej się pośpieszyć - radził kierowca. - Nie wiemy, kiedy zaczną strzelać. Sytuacja może szybko eskalować, a jesteś zbyt cenny, by ryzykować życie, dominusie.\nW Institutum Caput Scientiae Nucleariae Robertus szybko podziękował kierowcy i pobiegł do laboratorium, mijając recepcję oraz straże bez słowa. Personel znał już dziwactwa naukowca.\n- Zaczynamy? - powiedział z uśmiechem.\n- Ach, Aperdomus! - powitał go legat Ladislaus Nemus. - Rozmawiałem z panią Silvaną o jej... wątpliwościach.\n- Jakich?\n- Nie wiem, czy powinniśmy kontynuować projekt.\n- Zostawię wam sprawy osobiste - Nemus ruszył do wyjścia. - Wystarczy, że muszę tłumaczyć wasze wybryki przed Komisją.\n- Co masz na myśli, Leono? - Robertus zignorował żołnierza.\n- Miliony zginą, jeśli konflikt Trium... Duumwirów eskaluje - odpowiedziała młodsza badaczka Silvana. - Ten system nie jest stabilny, wszyscy to dostrzegaliśmy! Ufasz nowemu cesarzowi, ale nie wiemy, kto go zastąpi albo obali.\nRobertus pojął, że Ladislaus wyszedł, by nie usłyszeć rebelianckich słów, które musiałby zgłosić.\n- Nasza praca zapewnia stabilność. Gdy druga strona zobaczy bombę atomową, ruszy z pomocą mimo politycznych konfliktów.\n- Naiwność. A jeśli nie zaczekają? Jeśli wojna wybuchnie jutro? Widziałeś wojska i ich ofiary. Będziemy mogli unicestwić drugą stronę.\n- To argument za przyspieszeniem badań! Druga strona na pewno ma analogiczny projekt. Posłuchaj, Leono - chwycił ją za ramiona. - Jeśli odniesiemy sukces, zakończymy wojnę przed początkiem. Zachodni Świat znosił niestabilność, a groźba wzajemnego zniszczenia powstrzymała użycie broni jądrowej nawet po Incydencie Baluckim, który i tak był amatorszczyzną.\n- To prawda, że taki wynik jest najbardziej prawdopodobny - przyznała niechętnie Leona Silvana. - Musisz jednak pamiętać, że na truchle Polonii wydarzenia nieprawdopodobne są bardzo częste.\nOdeszła, pozostawiając szefa Projektu Democritus z myślami."
calisia.116.a: "W istocie istnieją tylko atomy i pustka."

calisia.117.t: "Dictum Factum"
calisia.117.desc: "Delegacja optymatów dziarskim krokiem zmierzała w stronę pretoriańskiego oficjum umiejscowionego tymczasowo w zajętym pałacu cesarskim. W końcu wedle oficjalnych ogłoszeń, pretorianie uważali się za regentów cesarskich, i bardzo chętnie zaopiekowali się wszystkim co cesarskie siedlisko miało do zaoferowania. Ale z drugiej strony, to pretorianie wyciągnęli pierwsi rękę i zaprosili na rozmowy.\nThaddaeus wraz ze swoją główną negocjatorką senator Cathariną Gaius oraz skrybą Camillusem, którego nazwiska nigdy nikt nie pamiętał, siedzieli w oczekiwaniu aż w końcu zjawi się ktoś z kim będą mogli porozmawiać. Po kwadransie przybył do pomieszczenia młody pretorianin, którego senatorzy nie poznali. Uśmiechał się od ucha do ucha i czym prędzej przeprosił za opóźnienie.\n- Ekscelencje wybaczą, mamy tutaj niezły chaos. Coś do picia mogę zaproponować? Kawy? Herbaty? Może wina? - oficer przynajmniej sprawiał wrażenie uprzejmego. Thaddaeus trochę się rozluźnił, ale chciał czym prędzej przejść do sedna sprawy.\n- Dziękujemy bardzo, chcielibyśmy po prostu omówić to z czym przyszliśmy. Kiedy przybędzie prefekt Cinastovicus? - zapytał Scarginscis. Twarz oficera przeszła purpurą, a uśmiech ustąpił natychmiast miejsca nerwowemu grymasowi.\n- Nie przybędzie. Dostałem polecenie przyjęcia waszych postulatów, wszystko zostanie przekazane prefektowi jak tylko wróci do stolicy. Nie chcieliśmy przesuwać spotkania, wszak przyjaciół trzeba wysłuchać jak najprędzej.\n- Dobrze, w takim razie słuchaj tego - odezwała się nagle Catharina - po pierwsze nie może być mowy o powrocie do monarchii. \nPrzerwała obserwując pilnie reakcję oficera, ale ten wpatrywał się w nią bezpośrednio ponownie się uśmiechając i potakując głową. Zmieszało to trochę panią senator, ale ostrożnie kontynuowała.\n- Dlatego też jedynym wyjściem jest wprowadzenie republiki. Ale żeby to osiągnąć to musimy zacząć przywracać rozwiązania przedupadkowe. Druga izba parlamentu, niezależne media, miejsca w spółkach dla senatorów, reforma sądownictwa, reforma podatkowa...\nPretorianin dalej kiwał głową z zaciekawieniem słuchając. Thaddaeus zastanawiał się jak daleko mogą to pociągnąć więc dodał od siebie wtrącenie:\n- Sankcjonowana opozycja, trybunał dla popularów, trybunał dla barbarzyńców, reforma ekonomiczna?\n- Oczywiście! - odparł oficer\n- Chcesz sobie może to...zapisać? - zapytał Thaddaeus\n- Zapamiętam, dziękuję!\n- Camillusie, może użycz panu kopii naszych postulatów. Przekażcie to prefektowi. Będziemy oczekiwać odpowiedzi, musimy już iść.\n\nDelegacja oddała żądania i opuściła Pałac, niepewni, całkowicie nieświadomi że kopie właśnie wylądowały w niszczarce. Rozmowa była krótka i obraźliwa, a Optymaci wyszli, gdy wszystkie postulaty pozornie przyjęto. Tyle że... to wcale nie były negocjacje."
calisia.117.a: "Czy to jakiś podstęp?"

calisia.118.t: "Adversa Conprima"
calisia.118.desc: "- Poglądy na sytuację gospodarczą? \n- Musimy zapewnić plebejuszom lepsze zabezpieczenia. Programy socjalne, sanitarne i podobne. Nikt nie może głodować na ulicy. \n- Mhm, a wojsko? \n- W czasach ciągłego konfliktu legiony potrzebowały każdego denara. Dziś są głównie obciążeniem, więc rozsądny obywatel powinien poprzeć ograniczenie finansowania i rozwiązanie zbędnych jednostek, by oddać pieniądze ludowi. \n- Zbyt populistyczne. Może się przyjąć. Jeszcze raz, mniej radykalnie. \n- Em.., nie możemy lekceważyć bezpieczeństwa wewnętrznego. Barbarzyńskie zagrożenie może teraz drzemać, ale powrócić z nową siłą. Musimy działać wyprzedzająco. \n- Teraz powtarzasz linię naszej partii. Masz być członkiem Nova Sinistra, Pompeiusie. Zachowuj się jak lewicowiec. Umiarkowany. BARDZO umiarkowany. \n- My... do cholery, Eduardusie, nie wiem, w co wierzą ci kochający barbarzyńców wazeliniarze. Poza tajnymi marzeniami o zniszczeniu Calisii. Ale tego nie powiem... \n- Wybełkotaj coś o cięciach płac i nazwij żołnierzy niewdzięcznymi. To uczyni cię dostatecznie niepopularnym. Ostatnie pytanie: jaki masz stosunek do Optymatów? \n- Ja... nie zgadzam się z kierunkiem gospodarczym Optymatów, lecz cenię ich wkład w przeprowadzenie Cesarstwa przez największy kryzys naszego życia. Choć nasze wartości pozostają zasadniczo sprzeczne, pozostaję... ee... otwarty na współpracę w razie potrzeby. \n- Dobrze. Naucz się tego na pamięć, bo brzmisz jak z kartki. Ale czy Optymaci nie współuczestniczyli w zabójstwie Cesarza Ricardusa i niedemokratycznych czystkach? \n- Cóż, uczestniczyliśmy, Eduardusie. I było wspaniale. Sam schwytałem Senatora. Strach na jego twarzy był nie do opisania. \n- To powiesz dziennikarzom, kretynie? Że przywódca głównej opozycji był podżegaczem Id? Jeszcze jedna wpadka i koniec z tobą, Pompeiusie. Nie tylko polityczny. \n- Tak, przepraszam. Jestem dobrym, posłusznym lewicowcem. \n- Jutro zarejestrujesz partię u urzędnika. Masz dwa miliony denarów na początek. Dalsze środki zależą od wyników. Od początku: jaki masz stosunek do Optymatów?"
calisia.118.a: "Nie zgadzam się z Optymatami w kwestii..."

calisia.119.t: "Nie na krzyż"
calisia.119.desc: "Po ogłoszeniu dekretu Res Publici wiele rodzin wyciągnięto z domów na miejscowe fora. Wśród nich rodzinę Hlodowiga Smiþy - przynajmniej tak nazywali go kalizjańscy biurokraci. Każdy patriarcha miał podejść do urzędnika i wyciągnąć los. Masowe wygnanie byłoby mniej upokarzające niż to widowisko. Najczęstszą \"nagrodą\" było wydalenie z Res Publici, lecz terminy różniły się: tydzień, miesiąc albo pół roku przed brutalnym wypędzeniem. Nieliczne losy, zwykle jeden na rodzinę, pozwalały zostać w Calisii i żyć dostatnio.\n\nCzekanie było koszmarem.\nMolinarius - miesiąc. Sniþar - pół roku. Wagnar - pół roku. Svanir - może zostać.\n- Smiþa! - zawołał dowódca legionistów.\n- Tatusiu... - bała się mała Hildigarda.\nOjciec ścisnął jej dłoń, po czym przekazał ją żonie Cludhildzie. Powoli sięgnął do pojemnika i starannie wybrał kartkę, jakby mogło to coś zmienić.\n- Smiþa - tydzień! - odczytał dowódca.\nHlodowig wrócił do płaczącej rodziny i próbował ich pocieszyć.\n\nPrzed pakowaniem poszedł utopić smutek w barze. Oleifr Svanir świętował tam zwycięstwo. Pijany krzyczał i skakał po stołach, aż podszedł do Smiþy.\n- TAAA! Kto wygrał loterię? JA! Czujesz to powietrze? Można je pić jak wino! HAHA! Nie zobaczycie mnie przekraczającego Viadrus! To dla frajeróóóów!\nHlodowig miał dość. Nie zasługiwał na wygnanie, gdy pełne pogardy ścierwo jak Svanir mogło zostać. Jeśli republikański aparat tego nie naprawi, zrobi to sam. Nie miał nic do stracenia. Wyciągnął nóż kieszonkowy i zadźgał szczęśliwego zwycięzcę w barze."
calisia.119.a: "Degeneraci tacy jak on nie należą do Calisii."

calisia.120.t: "Najlepsze miejsce w całym domu"
calisia.120.desc: "Dwaj oficerowie Pretorian, Marcus i Aurelius, wpadli na wspaniały pomysł. Z oficjalnego konta Cesarza zrobili kilka zdjęć Cesarskiego Tronu, napisali przesadnie pompatyczny opis i wystawili go w kategorii \"Antyki i kolekcjonerstwo\". Po co? Dla symbolu, pieniędzy i śmiechu. Na pewno nie był to żart.\n\nWYPRZEDAŻ! STYLOWY ANTYCZNY TRON CESARSKI, 1 SZT. - 500 000 DENARÓW!\nIdealny do skromnego domostwa. Odrobina cesarskości w salonie, biurze lub lochu. W pakiecie z historią i lekkim zapachem władzy. Nie zaleca się plebejuszom ani niewolnikom.\n\nKliknęli \"opublikuj\" i czekali. Wiadomości napłynęły natychmiast.\n\"Solicocus69\": \"Hej, czy tron wytrzyma mój zestaw gamingowy? Musi podtrzymać intensywne sesje Pugnacampus V\". Marcus odpisał: \"Oczywiście. Przetrwał niezliczone oblężenia i zamachy. Grę też zniesie\".\n\n\"PontifexMaximus_XXI_XXXVII\": \"dam 500 denar\". Marcus: \"Zgubiłeś trzy zera, proszę - 000\". Odpowiedź: \"600 denar\", a potem \"to se kurwa sam na nim siedź nara hóju\".\n\n\"Legionarius_MM\": \"ile za tron, dam 500k\". \"500 000 denarii, jest w opisie\". Odpowiedź \"CO?!! OSZALAŁEŚ?\" skończyła się blokadą.\n\n\"NissaAeternaVictrix\" pytał o darmową dostawę do Nissy w zamian za trzy tony kukurydzy. \"conradus_uojdiua\" chciał użyć tronu do udowodnienia, że Ziemia jest płaska. \"Tylko jeśli usiądziesz i bardzo mocno pomyślisz\" - odpisał Aurelius. \"scibidi_latrina\" pytał, czy tron ma dość blasku, by konkurować ze złotą toaletą. Zapewniono go, że tylko on może przyćmić porcelanę.\n\nOferty obejmowały stado lam, dożywotni zapas folii bąbelkowej i kolekcję rzadkich komiksów anime, którą \"GregoriusGladius\" próbował wymienić na tron sześć razy. W końcu Pretorianie nie wiedzieli już, kto kogo trolluje. Zaczęli sądzić, że lepiej sprzedać tron na złom albo za granicę, gdzie może znajdzie się prawdziwy kupiec i nie będą musieli odgadywać, czy rozmówca jest półgłówkiem, amebą czy barbarzyńcą."
calisia.120.a: "Może dobrze wyglądałby w moim ogrodzie?"

calisia.121.t: "Mutatio Bonum Est"
calisia.121.desc: "Wielkie forum w sercu Calisii tętniło energią pod sztandarami Optymatów. Wiec przypominał konserwatywny festyn, na który przybyli obywatele wszystkich warstw, by okazać lojalność.\n- CA-LE-TUS, CA-LE-TUS!\nOkrzyki były dostojne albo agresywne, lecz zawsze pełne pasji.\n- ŚMIERĆ POPULAROM!\nWielu po raz pierwszy przyjechało do stolicy. A raczej przywieziono ich autobusami i zapłacono za udział.\nSprzedawcy oferowali tuniki i bibeloty z logiem Optymatów, inni rozdawali ulotki przeciw Popularom i barbarzyńcom.\n- CAŁA CALISIA ŚPIEWA Z NAMI, WYPIERDALAĆ Z BARBARZYŃCAMI.\nZapytany uczestnik odpowiadał sloganami albo nazywał pytającego germańskim, populareskim albo scytyjskim zdrajcą. Zawsze zdrajcą.\n- RES PUB-LICA! RES PUB-LICA!\nNie wiadomo, czy skandowali za odnowieniem demokracji, czy nazwę ulubionej stacji telewizyjnej. Niektóre rzeczy zmieniły się niewiele.\n- KONSTYTUCJA! PRAWO! SPRAWIEDLIWOŚĆ!\nDekady latynizacji nie usunęły mentalnej plamy zostawionej przez rządy sprzed Upadku. Rzymskie ideały nie pokonały dziedzictwa dobrej zmiany. Jej politycy zeszli do podziemia, dołączyli do Optymatów i przetrwali pod nową marką.\n- DEUS! HONOR! PATRIA!\nGniew tłumu osiągnął szczyt. Płonęły kukły barbarzyńskich przywódców oraz senatorów Popularów. Vigiles nie interweniowali nawet przy ścinaniu podobizn Calisiusa i Tusca. Może nie mogli, może przestali się przejmować.\n- COMPA MATOLE, TWÓJ RZĄD OBALILI PROLE!\nNikt nie wie, od czego zaczęły się zamieszki. Jedni mówią o prowokacji, inni o prawie ludu do wyładowania lat ucisku Popularów. Najpopularniejsze usprawiedliwienie wandalizmu brzmiało: byli szczęśliwi. Dlaczego? Bo Calisia znów jest republiką."
calisia.121.a: "Hurra?"

calisia.122.t: "Przerzuty wieczności"
calisia.122.desc: "Ioannis Nissus w końcu zapracował na swoją wypłatę. Po długich latach bycia pionkiem w politycznej grze która przestawiała go z kątą w kąt, płacąc mu za propagandowe teksty wygłaszane na Forum Calisianum - teraz dostał niepowtarzalną okazję. Posadę prowadzącego główne wydanie wiadomości w nowo zreformowanej Caliskiej telewizji, której wiele z segmentów miało przypominać przedupadkową TVP. \n\nIoannis był bardzo podekscytowany wchodząc do głównego budynku telewizji przy Via Voronicus XVIII. Przemierzał kolejne korytarze z zaciekawieniem wpatrując się w studia które mijał po drodze. Po prawej słyszał wiadomości sportowe o kolejnej wygranie Zielonych w wyścigach rydwanów i zamieszkach które dzięki temu wywołały się w mieście, po lewej widział studio informacyjne które podawało najświeższe wiadomości z Limes, dwa pokoje dalej mieściło się studio przystosowane do transmitowania propagandowych treści z Imperium za granicę. Ale jego celem było jedno z największych pomieszczeń - sala głównego wydania Nuntia.\n\nWszyscy przywitali go niczym heralda dobrych wiadomości, bo przecież nim był - zwiastunem dobrej zmiany który przywróci Calisię na tory praworządności i demokracji. Usiadł na krześle głównego dziennikarza. Przejrzał notatki. Komu przeszkadza silna Calisia, barbarzyńcy zazdroszczą nam dobrobytu, proces Tusca odbędzie się w następnym tygodniu, Legioniści wygrywają kolejne bitwy na limes. Wszystko jest w porządku. Nie przeszkadzało mu specjalnie, że wiadomości które będzie przekazywał są wypaczoną wersją rzeczywistości. Wypłata wynagradzała mu wszystkie krzywdy które wyrządzi społeczeństwu. Ioannis przypomniał sobie przedupadkowe wydania wieczornych wiadomości. Przebiegło przez niego uczucie potężnej nostalgii. Kiedyś to było. Ale na szczęście przywracamy swoimi czynami to co już było, tylko w nowej oprawie.\n\n5 minut do wejścia na antenę. \n\nPaństwo ma swoje własne problemy. Ale nie możemy zawracać głowy nimi naszych obywateli. Muszą skupić się na pozytywach, i to właśnie im będziemy przekazywać. Bo inaczej, fala pesymizmu i defetyzmu rozprzestrzeni się pośród obywateli niczym najgorsza zaraza, wszak tak upadają społeczeństwa. Jesteśmy strażnikami tych którzy sami się bronić nie mogą. Dzięki codziennym ogłoszeniom będziemy w stanie ukształtować umysły Calisian, byśmy mogli żyć i prosperować.\n\nTak trzeba żyć. A życie jest dobre."
calisia.122.a: "I będzie jeszcze lepsze."

calisia.123.t: "\"Pogrzeb\" Calisiusa"
calisia.123.desc: "Gdy Vinicius dotarł do pałacu Calisiusa, tłum zebrał się już na dziedzińcu. Nikt nie śmiał dotknąć ciała mimo aluzji prezentera.\n- Droga dla Legata - żołnierze rozproszyli ludzi.\n- To Vinicius! - zauważył ktoś.\n- Sojusznik Calisiusa!\n- Przybyłeś wyrzec się pana?\n- Obronisz jego dobre imię?\n\nMarcus Vinicius podszedł do ciała Calisiusa. Zacisnął pięść, patrząc na dawnego Cesarza. Dawnego przyjaciela. Gdyby zrobił to, czego pragnął, uniósłby gladius i wezwał tłum do rozprawy ze zdrajcami. Nie mógł.\nW oddali dostrzegł snajpera, z pewnością gotowego zastrzelić go za \"zdradzieckie\" słowa. Zapewne byli też tajni Frumentarii, którzy uzasadniliby jego śmierć. Musiał być subtelny, choć subtelność nie leżała w naturze Marcusa Viniciusa. Nie musiał jednak przemawiać jako Marcus Vinicius. Paweł Deląg był aktorem i wiedział, czyje słowa należy teraz wypowiedzieć."
calisia.123.a: "Raz kozie śmierć."

calisia.321.t: "Kalizjanie, bracia, rodacy,\nużyczcie ucha mym słowom"
calisia.321.desc: "Przyszedłem tutaj pochować Calisiusa, nie by go chwalić. Zło, jakie się czyni, ma to do siebie, że jest długowieczne - przeżywa tego, który je wyrządził. Natomiast dobro przepada z nim w grobie. I tak też będzie z dziedzictwem Calisiusa. Szlachetny Caletus powiedział przed chwilą, że Calisius był człowiekiem żądnym władzy. To ciężka wina, jeżeli tak było, i Calisius poniósł za nią ciężką karę. Lecz ja, za zgodą Caletusa i innych - a są to ludzie czcigodni i prawi - przemawiam oto nad grobem Calisiusa. A był on moim wiernym przyjacielem - wiernym i prawym; prawym i czcigodnym. Lecz Caletus mówi, że był żądny władzy, a przecież Caletus to człowiek czcigodny. Calisius przywodził do Rzymu tłum jeńców, by za ich wykup zasilać skarb państwa. Czy to jest pycha? To jest żądza władzy? A kiedy widział nędzarza, to płakał. To ma być twardość cechująca pychę? Lecz Caletus mówi, że był pełen pychy, A przecież Caletus to człowiek czcigodny. Nie mówię tego, aby mu zaprzeczać. Mówię jedynie, co jest mi wiadome.Jeszcze niedawno i z pewnością szczerze wszyscyście tutaj wielbili Calisiusa. Czemu więc dziś go nie opłakujecie? Gdzie podział się wasz rozum? Dokąd zbiegł? Pomiędzy dzikie bestie?!... - Proszę was, Wybaczcie mi tę słabość: moje serce jest teraz w trumnie - tam, razem z Calisiusem. Dajcie mi chwilę, bym doszedł do siebie.\n\nA jednak, mimo to... Popatrzcie, mam tu - Pismo Calisiusa - opieczętowane - które znalazłem w jego gabinecie. Jest to rozporządzenie jego woli. Ostatniej woli. To znaczy testament. Gdybyście mogli go poznać! - niestety, nie mogę wam go odczytać w tej chwili - Tobyście się rzucili do zmarłego i całowali jego biedne rany, a w jego świętej krwi maczali chustki. Bo każdy chciałby mieć po nim pamiątkę; chociażby włos, by móc go tuż przed śmiercią przekazać w spadku swym bliskim lub dzieciom jako najdroższą rzecz, którą posiada.\n\n- Chcemy usłyszeć testament! Czytaj, Marcusie Viniciusie! - zawołał ktoś z tłumu.\n\n- Testament, testament! Chcemy usłyszeć testament Calisiusa! - ryknął cały tłum.\n\nKochani, cierpliwości! Mnie nie wolno. zresztą i dla was lepiej jest nie wiedzieć, jak Calisius was miłował. Ostatecznie nie macie serc z kamienia ani drewna, ale czujecie po ludzku, więc gdybym przeczytał wam, co jest tu napisane, tobyście wpadli w gniew, a nawet w szał. Dlatego właśnie lepiej, że nie wiecie, co wam zapisał jako spadkobiercom! Wolę nie myśleć, co by się tu działo!\nTłum doprowadzony był już żałobą na skraj szaleństwa. Vinicius uznał, że nadeszła pora na wielki finał.\n- Jeśli macie łzy, to płaczcie teraz. - Vinicius odsłonił ciało Calisiusa, a rozwścieczony tłum rzucił się na pobliskich pretorian, wywołując zamieszki w mieście."
calisia.321.a: "Acta est fabula, plaudite."

calisia.124.t: "Odpoczywający Ryś"
calisia.124.desc: "Mimo niedawnych politycznych wstrząsów życie w Pałacu Cesarskim toczyło się jak zwykle. Służba robiła wszystko, by miejsce odpowiadało powszechnym wyobrażeniom o cesarskim przepychu, choć obecnie nie mieszkał w nim żaden Cesarz.\n - Na Jowisza, jak dobrze, że go nie ma. - Konsul Petrus Caletus pomyślał, unosząc kielich wina i podejmując długie, mozolne zadanie opróżniania zapasów Calisiusa. - A sposób, w jaki go wykończyli - mistrzostwo. Aż trudno uwierzyć, że to ludzie Cinastovicusa.\n\n Przywódca pretorian zazwyczaj wolał układać staranne spiski, stanowczo zbyt skomplikowane jak na gust Caletusa. Po co jednak tyle planować, skoro kilka cięć przez tors załatwia sprawę równie dobrze?\nUpił kolejny łyk. Zrealizował większość swoich planów, więc mógł pozwolić sobie na odrobinę rozpusty w nagrodę za sukces. Dzięki niemu tyrania dobiegła przecież końca, ludność Calisii była bezpieczna przed najazdem barbarzyńców, a pokój został zapewniony. Mniej więcej. Nadal musiał poradzić sobie z Viniciusem i Cinastovicusem, lecz jak trudne mogło to być? Owszem, potrzebował ich do rządzenia państwem, ale oni potrzebowali jego jeszcze bardziej. Vinicius cieszył się popularnością, Cinastovicus miał ogromną władzę, lecz tylko Caletus był wśród nich politykiem z krwi i kości. Politykiem mocno trzymającym najważniejsze prowincje Imperium.\n\n - To powinno pójść łatwo - powiedział Caletus, dopijając wino i ruszając do sali negocjacyjnej, gdzie miał oczekiwać gości."
calisia.124.a: "- Niech przybędą do mojego leża."

calisia.125.t: "Ostatni Tur"
calisia.125.desc: "Gdy Vinicius jechał przez miasto w stronę Pałacu Cesarskiego, tłum wiwatował. Były to jedne z nielicznych braw, jakie otrzymał w ostatnich dniach, które wydawały się szczere. Wszyscy z zachwytem witali bohatera Calisii, przybywającego do stolicy wymierzyć sprawiedliwość.\n- Pomścij Cesarza! Pomścij Calisiusa! - krzyknął w jego stronę jakiś biedak. Najpewniej zatrzymają go pretorianie. Uwiężą za wypowiedzenie myśli, o których Vinicius sam ośmielał się jedynie myśleć. Po mowie nad ciałem Calisiusa planował wydostać się z miasta z pomocą legionów i ludowego powstania. Szybko jednak odkrył, że Pretorianie i Optymaci utworzyli kordon odcinający stolicę od reszty Calisii. Próba przebicia się w którąkolwiek stronę oznaczałaby jego śmierć. Na myśl o konieczności odłożenia zemsty zaciskał zęby. Wśród rozkrzyczanego tłumu, z głową pełną nienawiści, nie potrafił jasno myśleć, więc próbował po prostu cieszyć się chwilą. Uśmiechał się, machał i puścił oko do jakiejś kobiety - jak zwykle.\n Czuł, że nie jest gotowy stanąć przed Cinastovicusem i Caletusem w Pałacu Cesarskim. Rozkazał świcie skierować się do jego rezydencji.\n\nNa miejscu zaczął rozważać możliwości. Pierwszy odruch podpowiadał mu, by wejść do pałacu, poderżnąć gardła zdrajcom, zabić tylu ich strażników, ilu zdoła, nim sam polegnie, i pozostawić rozsądnym ludziom naprawienie wywołanego bałaganu. Tyle że rozsądnych ludzi już nie było. Calisius, Compa i Hvedorcus nie żyli. Jakimś sposobem to on - najmniej ideowy z nich wszystkich - stał się ostatnim płomieniem sprawy Popularów. Nie z własnego przekonania, lecz dlatego, że tego chciałby Calisius, człowiek, któremu zawdzięczał wszystko. Postąpi słusznie, nawet jeśli nie wie jak.\nNiepewny przyszłości ruszył do pałacu, by zobaczyć, jak rozwinie się sytuacja. Na jego korzyść działało to, że Liberatores zapewne uważali go za bezwstydnego hedonistę pozbawionego wyższych wartości. Dla własnego dobra odegra rolę, którą mu przydzielili. A gdy nadejdzie pora, ku ich zaskoczeniu zrzuci maskę."
calisia.125.a: "Czas na przedstawienie."

calisia.126.t: "Knujący Wąż"
calisia.126.desc: "Na ulicach Calisii tłum wiwatował na powitanie prefekta Cinastovicusa - zwiastuna pokoju i współpracy. Cóż, wiwatowali głównie opłaceni klakierzy, a płynący z prądem tłum radził sobie co najwyżej znośnie. Nic dziwnego, że nikt nie lubił ludzi stojących na czele tajnych służb. Do tego po haniebnym zamachu stanu Calisiusa w 2025 roku Christianus wycofał się z polityki. Jego odsunięcie dobiegło końca dopiero niedawno. \nJednak to nie opinia motłochu zajmowała myśli prefekta, lecz błędy jego ludzi, przez które znalazł się w tym dalekim od ideału położeniu. Winni zostali już ukarani, lecz zamiast planować przejęcie pełni władzy, musiał uśmiechać się i machać do tłumu traktującego go jak platformę podczas parady. Wszystko po to, by przystąpić do negocjacji, które prawdopodobnie zakończą się jakąś formą rządów kolegialnych.\n - Za dużo się martwię - Cinastovicus poczuł krople potu powoli zbierające się na czole. Podkopał pozycję ojca narodu, a nawet odpowiadał za jego śmierć. Mimo to wciąż tu był. Żywy. Przetrwał nawet długą mowę Viniciusa nad ciałem Cesarza. Nie tylko przetrwał - rozkwitł. Mógł poczekać jeszcze trochę, nim osiągnie ostateczny cel: pełną kontrolę nad Calisią. Los, na jaki zasługiwał, zanim Calisius usunął go z urzędu. Kto mu się sprzeciwiał? Błazen i zdrajca, przynajmniej w oczach ludu. Napełniony nową odwagą wydał rozkaz sługom niosącym jego lektykę."
calisia.126.a: "Ostrożnie zbliżmy się do pałacu."

calisia.127.t: "Cesarska rezydencja - znów jak nowa"
calisia.127.desc: "Służba znała swoje obowiązki. Pałac musiał lśnić na przybycie Cinastovicusa i Viniciusa. Niezależni nadzorcy dokładnie poinstruowali wszystkich, co robić. Caletus nie miał szczególnych życzeń - zwykłe sprzątanie i dekoracje. Poza tym wszystko jak zawsze. Konsul był zajęty napawaniem się tym, że to on gościł tak ważne wydarzenie.\n\nGdy Cinastovicus przybył, wszystko było w najlepszym możliwym stanie. Marmurowe posągi wypolerowano, a podłogi odkurzono tak starannie, że nie pozostała ani drobina pyłu. Cinastovicus był mile zaskoczony skrupulatnością, której zwykle nie spodziewał się po Caletusie. Prefekt wszedł do sali negocjacyjnej.\n - Witaj, Prefectusie - Caletus powitał pierwszego gościa. - Usiądź. Jeśli zechcesz, kamerdyner poda ci wino.\n- Nie, dziękuję - odparł oszczędnie Cinastovicus.\n- Nie ma potrzeby przesadzać ze wstrzemięźliwością. Calisius zostawił pokaźny zapas. - Konsul nalegał. - Ale jak kto woli. Wiesz, kiedy Vinicius zamierza przybyć?\n\nLegatus Calisii Marcus Vinicius kazał Liberatores czekać około pół godziny.\n- Nareszcie! - Caletus nie krył irytacji. - Nie zgubiłeś się przypadkiem?\n - Potrzebowałem więcej czasu, by ustalić, ile zażądam w zamian za to, że was nie zabiję - odparł legat.\n - Posłuchaj no, legionowy trepie!\n- Dość! - wtrącił się Cinastovicus. - Przybyliśmy zapobiec wojnie domowej, a nie ją wywołać!\n- Nie pozwolę, by mnie poniżał! - Caletus nie zamierzał odpuścić.\n- Doprowadźmy negocjacje do końca, a już nigdy nie będziecie musieli się oglądać! - Teraz pretorianin miał ich uwagę.\n - Czego ode mnie chcecie? - zapytał Vinicius.\n- Czym jest rząd, który nie zważa na prawo? - Cinastovicus zaczął filozoficznie. - Jedynie brutalną tłuszczą, podobną do barbarzyńskiego królestwa albo jeszcze gorzej. Dlatego wszystko, co robimy, musi zostać uznane za zgodne z prawem. I dlatego, Marcusie Viniciusie, potrzebujemy twojego podpisu pod tym aktem.\nCinastovicus przesunął dokument w stronę legata i ciągnął dalej.\n - To akt oskarżenia przeciw Ricardusowi Calisiusowi. Zarzuca mu tyranię, a jeśli sądy przychylą się do naszej opinii - a przychylą się - zabójstwo Cesarza i masowe unieważnienie ustaw Popularów staną się legalnymi, uzasadnionymi działaniami podjętymi w obronie republiki. Oskarżenie wniesione jedynie przeze mnie i Caletusa zapewne zostałoby podważone. Potrzebujemy poparcia kogoś wiarygodnego. Kogoś, czyje świadectwo nada naszym twierdzeniom tak potrzebną legitymację niezależnie od wyroku tych znienawidzonych sądów.\n- No, masz to podpisać - Caletus podsumował wykład prefekta.\nMarcus musiał się zastanowić. Był gotów zagrać w ich małą grę, lecz nikt nie mógł o tym wiedzieć. Czy po zgodzie pozostanie mu jeszcze choć odrobina honoru?\n- Co dostanę w zamian?\n- O nie, tak to nie działa - Caletus uciął pytania.\n- Najpierw podpiszesz - Cinastovicus zgodził się ze sprzymierzeńcem. - I tak nie masz wyboru."
calisia.127.a: "Nie miejcie Viniciusowi tego za złe."

calisia.128.t: "I tak właśnie należy rozumieć Calisię"
calisia.128.desc: "\n- Skoro już sprzedałem duszę, możecie mi zapłacić, żebym mógł odejść w swoją stronę? - Vinicius wstał, gotując się do wyjścia.\n- Potrzebujemy siebie nawzajem, by rządzić - Cinastovicus znów postanowił wyjaśnić sprawę, krążąc wokół tematu - inaczej Imperium z pewnością się rozpadnie. Wynika to z jego rozmiarów i walk frakcyjnych... Jedna osoba nie zdoła władać Calisią, ale trzech dżentelmenów może nią zarządzać! Triumwirat, jeśli wolicie. Chciałeś zapłaty, Viniciusie? Co powiesz na własny kawałek Imperium?\nLegat nie spodziewał się takiego obrotu spraw.\n- Skąd wiemy, że nie zaatakuje nas, gdy damy mu władzę? - zapytał Caletus, poirytowany tym, że Cinastovicus przejął rolę mistrza ceremonii. - Już groził konsulowi Calisii!\n- Spokojnie - rzucił Vinicius swobodnym tonem. Chwycił kielich wina z tacy kamerdynera, zanim sługa zdążył postawić go na stole. - Gdybym chciał władzy, przejąłbym ją już w 2026 roku, zanim którykolwiek z was zaczął się liczyć. - Upił łyk. - Jestem tylko starym legionistą. Dajcie mi dość ziemi dla moich ludzi i wystarczające dochody, żebym mógł pić, ucztować i wychędożyć sobie drogę do wczesnego grobu. Wtedy będę waszym wiernym żołnierzykiem.\n- A nawet jeśli nie będziesz - prefekt kontynuował argumentację - połączona siła dwóch pozostałych triumwirów powstrzyma tego, który zboczy z drogi.\n- Skoro tak - Vinicius dobył miecza, a Caletus sięgnął po własny, spodziewając się ataku.\nVinicius odwrócił się jednak do niego plecami i podszedł do wiszącej na ścianie mapy. Legat zaczął ją ciąć. - Wezmę to.\nPokazał pozostałym fragment obejmujący mniej więcej terytoria Galicji, Scytii, Vartii i Silesii Superior.\n- Najbogatsze, najżyźniejsze i mniej więcej nietknięte przez barbarzyńców? Czy to jakiś żart? - zaprotestował Caletus. - Cracovia powinna należeć do mnie.\n- Sądzę, że *konsul Calisii* powinien zarządzać przede wszystkim samym Urbs - odparł Vinicius. - Poza tym chcę władać rodzinnym miastem. \n- Nie oddam ci Vartii ani Silesii Superior. Będą mi potrzebne do odbudowy zachodnich części Imperium.\n Dobrze, i tak nie potrzebuję prowincji z atomowym kraterem - odparł, po czym spojrzał na Cinastovicusa. - Wygląda na to, że dwóch z nas otrzyma historyczną stolicę. Uczciwie będzie, jeśli ty także dostaniesz jedną. - Wyciął północno-zachodni fragment Calisii i pokazał go pretorianinowi.\n - Ostatnie... wstrząsy mocno osłabiły miejscową administrację, ale sobie poradzę.\n - A więc ustalone? - zapytał Caletus i sam odpowiedział, nie czekając na potwierdzenie. - Świetnie, bo umówiłem już spotkanie z ludem, żeby pokazać naszą świeżo osiągniętą jedność. Za pół godziny wyjdźcie na balkon, zasalutujcie, trochę pomachajcie, a tłum powinien to kupić."
calisia.128.a: "Każdy bronił tego, co już posiadał."

calisia.129.t: "Armistitium"
calisia.129.desc: "Uwaga, wszystkie dzieci Calisii! - Przez zniszczone miejskie forum przejechał wojskowy samochód z głośnikami, eskortowany przez dżipa centuriona. - Wasi przywódcy porzucili was, zrozumiawszy beznadziejność swojego położenia. Nasze Imperium jest o krok bliżej zjednoczenia! Wkrótce druga połowa kalizjańskich ziem pokłoni się swemu prawowitemu władcy!\nLudzie zaczęli powoli wyłaniać się spośród ruin. Pełni byli wątpliwości, wszak już raz obiecano im pokój. Gdy jednak zrozumieli, że żołnierze nie zamierzają strzelać do cywilów, wychodziło ich coraz więcej.\nCenturion przyglądał się im, najwyraźniej oczekując wiwatów na cześć nowego rządu. Problem w tym, że zebrani ocaleni nie potrafili rozpoznać, która strona zwyciężyła, bo mundury wszystkich oddziałów wyglądały niemal identycznie. Pył z zawalonych budynków także nie pomagał. Wreszcie ktoś w tłumie, całkiem dobrze zorientowany w ruchach wojsk, zawołał:"
calisia.129.a: "Ave Cinastovicus! Precz ze zdrajcą!"
calisia.129.b: "Ave Vinicius - mściciel Cesarza!"
calisia.129.c: "Ave Vinicius - Ostatni Tur!"

calisia.130.t: "Calisgula"
calisia.130.desc: "Cinastovicus mógł bezczynnie przyglądać się większości reform w Senacie. Taka była wola ludu. On nie był politykiem, a przynajmniej już nie. Wtedy Senat był przynajmniej demokratyczny.\n\nTeraz prefekt widział jedynie, jak Popularzy ślizgają się do całkowitej kontroli nad Senatem. Barbarzyńcy. Byli plamą na wszystkim, co czyniło Calisię wielką. Straż miała z nimi mordęgę, a teraz nie tylko obchodzono się z nimi jak z niemowlętami, lecz wykorzystywano ich jako narzędzie polityczne. A co robił Cesarz? Nic. Uśmiechał się i machał, podczas gdy jego Imperium staczało się w moralną ruinę. \n\nJego portret szyderczo wisiał na ścianie gabinetu Christianusa. Ten mdląco słodki uśmiech starca, który ledwie potrafił rządzić własnym Imperium. Miał go serdecznie dość i znał innych podzielających tę opinię: kilku senatorów Optymatów i z pewnością pozostałych członków Straży. \n\nWtedy go olśniło. Jaki właściwie był z niego pożytek? Co Cesarz zrobił dla Calisii od chwili jej powstania? Był obciążeniem dla państwowych finansów, a gdy jego interwencja naprawdę mogła się przydać, siedział bezczynnie i patrzył, jak ukochani Popularzy rozszarpują Calisię. Gdyby tylko odciąć tłuszcz, usunąć pewien nadmiar... Czy bez tej obwieszonej klejnotami zawalidrogi wszystko nie byłoby łatwiejsze? Christianus zaczął krążyć po gabinecie, a w jego głowie rodził się plan.\n\nLecz co z barbarzyńcami? Popularami? I najgorsze: co z Viniciusem? Za śmierć Calisiusa należało obwinić barbarzyńców. Wtedy Popularzy nieuchronnie oberwaliby rykoszetem. Lud wpadłby we wściekłość, bo technicznie to oni utorowali drogę do jego śmierci. Na końcu zawsze pozostawał Vinicius. Był zbyt wielkim symbolem, by po prostu go usunąć. Trzeba będzie go jakoś przekupić, a potem jakoś pozbyć się go z gry. \n\nPo wszystkim... ktoś będzie musiał przejąć ster. Władza dekretowa kusiła, lecz odebrałaby mu wszelką wiarygodność. Musieliby albo znaleźć nowego Cesarza, albo wypełnić Senat potakiwaczami...\n\nMusiał wykonać kilka telefonów i zorganizować parę spotkań. Stavissin brzmi pięknie o tej porze roku."
calisia.130.a: "Wszystko w swoim czasie..."

calisia.131.t: "Węże z klasą"
calisia.131.desc: "Hala Sportowa w Stavissin z pewnością nie była najbardziej godnym miejscem na zebranie poświęcone królobójstwu, stanowiła jednak doskonałą przykrywkę. Ogłoszono wesołą imprezę, podczas której mieszkańcy całej Calisii mogli oglądać najlepszych członków Gwardii Pretoriańskiej z różnych miast w pełnym turnieju siatkówki. Dzięki temu można było zgromadzić w jednym miejscu wysoko postawionych pretorian i senatorów, nie wzbudzając niczyich podejrzeń.\n\nSchronieniem dla spiskowców stał się pokój trenera. Cinsatovicus i Scarginscis byli najbardziej rozpoznawalnymi przedstawicielami Straży oraz Optymatów, ustępującymi znaczeniem jedynie Caletusowi. Obecni byli też inni, lecz mieli odegrać role drugoplanowe. Cinastovicus stanął przy szafce pełnej rakiet tenisowych i przemówił.\n\n- Panowie, wszyscy wiemy, dlaczego się tu zebraliśmy, więc przejdę do rzeczy. Każdy ma do odegrania rolę w tej naszej grze. Straż zajmie się zdobyciem fajerwerków i materiałów pirotechnicznych w całym mieście. Oczywiście wyślemy również zaproszenia naszym ukochanym barbarzyńskim przyjaciołom - opatrzone pieczęcią Cesarza. Dopilnujemy, by bawili się znakomicie podczas triumfu. Może nawet dostąpią audiencji u samego Cesarza. Tymczasem Optymaci zrobią to, co potrafią najlepiej. Powiecie ludziom dokładnie, co mają myśleć o barbarzyńcach i o Cesarzu. Jego przemówienie sprzed kilku tygodni można by... opacznie zinterpretować... tak by ukazać go w bardzo złym świetle, a przecież nie chcielibyśmy do tego dopuścić, prawda?\n\nPo sali rozszedł się chichot. Wszyscy byli całkowicie oddani sprawie położenia kresu rządom \"tyrana\" Calisiusa. Choć wszystko tonęło w niedomówieniach, każdy wiedział, co wydarzy się owego pamiętnego dnia. Plan już ruszył, odwrotu nie było, a pracy pozostawało wiele. Tego dnia mogli jednak świętować.\n\nGdy wznieśli kielichy wina, przerwało im pukanie do drzwi. Christianus podszedł i ujrzał jednego z pretorian w fioletowym stroju sportowym.\n\n- Panie Prefekcie Cinastovicusie, Iulius kopnął bramkę i złamał nogę. Musimy spytać trenera, kogo wpuścić na boisko w jego miejsce.\n\nPrefekt przez chwilę patrzył na niego osłupiały, próbując zrozumieć, jak ktoś mógł kopnąć słupek podczas gry w siatkówkę i zrobić to na tyle mocno, by złamać sobie nogę."
calisia.131.a: "- Musisz mi dokładnie wyjaśnić, jak do tego doszło."

calisia.132.t: "In girum imus nocte"
calisia.132.desc: "Vinicius siedział w swojej kwaterze w kalizjańskich koszarach. Coś się szykowało; był tego pewien. Myśl ta pochłonęła go do tego stopnia, że nie poszedł nawet na triumf odbywający się na Polu Marsowym. Ludzie mówili, że barbarzyńcy szykują zamieszki. Może Calisius nie powinien był wpuszczać ich aż tylu. A może była to tylko propaganda Optymatów. Ta niepewność frustrowała go najbardziej. Był wojownikiem dowodzącym wojownikami, a dworskie intrygi znacznie różniły się od wojskowego rozpoznania. Mimo to wysłał kilku speculatores, by zebrali jakieś wskazówki, choć wiedział, że nie mogą się równać z biegłością pretorian i frumentarii, pozostających pod kontrolą Cinastovicusa.\n- Nie podoba mi się to - powiedział z rezygnacją.\n\nRozmyślania przerwał dym wdzierający się do płuc.\nDo jego komnaty wbiegł jeden z legionistów.\n- Legacie, koszary płoną - jego słowom wtórował chór krzyków i dźwięk alarmów.\nViniciusowi i pozostałym legionistom udało się wydostać, choć niektórzy odnieśli ciężkie oparzenia. Inni nigdy nie opuścili budynku. Na ulicach ujrzeli nierówne ściany ognia pożerające zabudowania oraz kohorty vigiles próbujące powstrzymać pożar.\n- Dobra, chłopaki! - Vinicius wciąż potrafił wydawać rozkazy mimo coraz mniejszej ilości powietrza nadającego się do oddychania. - Wszyscy, którzy nie są poparzeni, mają zgłosić się do vigiles i zaoferować pomoc. Lekko poparzeni niech zajmą się ciężej rannymi legionistami. Jazda!\nLudzie Viniciusa natychmiast przystąpili do działania. Wynosili ciała, opatrywali rannych, ewakuowali cywilów i rozbijali zamknięte drzwi. Sytuacja zdawała się opanowana.\n- Pomocy! Pomocy!\nNa trzecim piętrze utknęła starsza kobieta, która nie mogła wydostać się z domu. Wszyscy legioniści i vigiles byli zajęci powstrzymywaniem pożaru albo ratowaniem ludzi w stanie krytycznym.\nWszyscy z wyjątkiem Viniciusa.\nLegatus pobiegł do wejścia, nim którykolwiek z jego ludzi zorientował się, co się dzieje. Kilkoma szybkimi ciosami gladiusa rozrąbał drzwi osłabione ogniem. Spojrzał na schody. Ogień nie rozprzestrzenił się tam tak mocno. Dało się przejść nawet bez sprzętu ochronnego. Ostrożnie ruszył na górę i wyważył drzwi mieszkania. Znalazł kobietę siedzącą na wózku inwalidzkim. Podniósł ją i wyniósł z mieszkania.\n - Już niedaleko - próbował ją uspokoić, schodząc na drugie piętro.\nGdy to mówił, wyjście rzeczywiście znajdowało się w zasięgu jego wzroku. Mimo to nie zdołał zrobić kolejnego kroku, nim ostatni bieg schodów zawalił się pod jego ciężarem.\n\nOstatnim, co usłyszał, były przerażone głosy legionistów wykrzykujących jego imię."
calisia.132.a: "Et consumimur igni."

calisia.133.t: "Anhedonia"
calisia.133.desc: "- Pańskie ciśnienie jest za wysokie. Powinien pan trochę zwolnić. Wiem, że nie jest to łatwe, ale... po co ma pan rząd, jeśli nie właśnie po to? - Doktor Hastius należał do najlepszych medyków w całym Imperium i od niedawna odpowiadał za utrzymanie Cesarza w jak najlepszym zdrowiu. Ze względu na zaawansowany wiek Ricardusa odwiedzał go coraz częściej. Niektórych ran nie zdoła jednak uleczyć nawet najlepszy lekarz.\n- Wiesz, doktorze, czuję się zmęczony... Tak strasznie... zmęczony. Jak keczup rozsmarowany na zbyt wielkiej brioszce. Nawet wstanie z łóżka oznacza walkę z samym sobą. \n- Tym bardziej powinien pan odpoczywać i unikać stresu. Szczerze mówiąc, powinien pan również ograniczyć fast foody. Musi pan utrzymać dobrą formę.\n\nRicardus Calisius właściwie go nie słuchał. Myślami dryfował ku wspomnieniom, próbując zrozumieć, które chwile doprowadziły go do obecnej sytuacji. Nigdy szczególnie nie dbał o zdrowie i żaden lekarz tego nie zmieni, bez względu na to, kogo Optymaci przysłaliby, by podstępem ubezwłasnowolnić Cesarza. Czym jest bogactwo, jeśli nie kolejnym rodzajem więzienia?\n- Dali mi wszystko. Mieszkam w pałacu i mam własną służbę. Wiesz, ile jest tu sypialni? Siedemnaście! Komu to potrzebne?! Jeśli zechcę na obiad gotowaną perliczkę, dostanę ją. Jeśli zapragnę najlepszego wina w całej Europie - proszę bardzo! Jeśli chcę wyjść na spacer, nagle wolno mi krążyć jedynie po ogrodach i menażerii.\n- Nie brzmi to aż tak źle... - odpowiedział doktor Hastius, nie wiedząc, co właściwie powiedzieć. To jak impreza w czyimś domu, z której naprawdę musisz już wyjść, ale rozmówca ciągle mówi, mówi i mówi. Robi się niezręcznie. Dokładnie tak czuł się doktor. Z każdą minutą coraz bardziej.\n\n- Zły... Czy byłem złym ojcem? Złym władcą? Zawsze robiłem, co mogłem. Może bywałem zbyt surowy. Albo zbyt pobłażliwy. Albo... nieświadomy? Sprowadzili mnie do roli pustej skorupy. Przed Upadkiem... bogowie, ale byłem wtedy silny! Potrafiłem sam zjeść całą świnię. Dziś prawie niczego już nie czuję. Jakby wszystko utraciło smak. Zostały tylko czerń i biel, a ja nie mogę nic z tym zrobić! Może mają rację... może mój czas nadszedł i powinienem zniknąć na śmietniku historii. Ale tyle rzeczy chciałem jeszcze zrobić przed końcem! Ech... spójrzmy prawdzie w oczy - wszystko, co kiedykolwiek zrobiłem, było w jakiś sposób złe. Nawet gdy miałem dobre intencje. Zwłaszcza wtedy. Nikt tak naprawdę nie doceniał mnie jako władcy i mam wrażenie... że ja także nie. Czy jest jeszcze dla mnie nadzieja, doktorze?"
calisia.133.a: "- Wie Pan, ja nie jestem *takim* lekarzem..."

calisia.134.t: "Odwrócenie ról"
calisia.134.desc: "Widok kalizjańskich wojsk maszerujących Via Castra był wspaniały. Dla wszystkich zaangażowanych triumf stanowił zwieńczenie dekady wysiłków zmierzających do pokonania niemal każdego, kto stanął Imperium na drodze: Germanów, watażków, barbarzyńców, Popularów... Lista wrogów nie miała końca. Dziś ostatni i najważniejszy przeciwnik Optymatów stał pośród nich na pałacowym balkonie - pokonany, z fałszywym uśmiechem zwróconym ku tłumowi, próbujący przekonać lud, że wszystko jest w porządku, choć wewnętrznie krzyczał o pomoc. \n\n- Machaj ręką żwawiej, ty przereklamowana marionetko! - szydził konsul Caletus, przyciskając sztylet do boku Cesarza. - Kochają cię, wiesz? Pomyśl tylko, jak bardzo by się rozczarowali, gdyby odkryli, że człowiek, którego czczą, jest jedynie posłusznym sługą naszej frakcji. \n\nPrzez chwilę Ricardus Calisius rozważał opór. Na oczach całego tłumu mógł spróbować się wyrwać. Ludzie ujrzeliby jego walkę i z pewnością poparliby go przeciw bezprawnym uzurpatorom. Lecz co stałoby się później? Caletus zapewne spanikowałby i natychmiast przebił mu serce, a zamieszki w każdej chwili mogły przerodzić się w pełną wojnę domową. Czy takie miało być jego dziedzictwo? Dla dobra Calisii zacisnął zęby i pozwolił konsulowi dalej go poniżać. \n\n- Spójrz na scenę pod nami, Ricardusie. Piękna, prawda? Cała ta chwała, wszystkie te wiwaty... To wszystko zawdzięczasz mnie, ja sprawiłem, że stało się to możliwe. A teraz popatrz na to! \n\nZa żołnierzami pojawiła się platforma paradna z ogromnym, przesadnie umięśnionym pomnikiem Petrusa Caletusa, unoszącego miecz ku niebu w geście zwycięstwa. Poza zmarszczkami na twarzy, w dużej mierze wygładzonymi przez rzeźbiarzy, figura niewiele przypominała konsula. Nie miało to jednak znaczenia wobec gigantycznego ego przedstawionego senatora. \n\n- Wspaniały, prawda? Powinienem zamówić taki, na którym trzymam twoją odciętą głowę, żeby wszyscy bogowie mogli ją zobaczyć. Ale na to chyba trochę za wcześnie. Wszystko w swoim czasie. - Ledwie panował nad ekscytacją, wyglądając jak dziecko, którego rysunek po raz pierwszy oprawiono i powieszono na lodówce. \n- Pamiętam wszystkie te chwile, kiedy po szczególnie burzliwym głosowaniu proponowałeś mi kielich Lacjum. Muszę przyznać, że twój gust jest niemal równie zły jak twoje rządy. Może więc, jak za dawnych czasów, skosztujemy twojego ulubionego wina? Obawiam się, że mogłoby skwasić moje wyrafinowane podniebienie, lecz wspólny kielich z przyjacielem nigdy nie zaszkodzi, nieprawdaż, Ricardusie? - Kopnął go prosto w nogę. - A teraz na coś się przydaj i przynieś mi kielich, ty koronowany bohaterze drugiego planu. Ja zajmę się tłumem."
calisia.134.a: "Posłusznie wykonał polecenie. I tak nie mógł się sprzeciwić."

calisia.135.t: "Provocator Novus"
calisia.135.desc: "Talerze pobrzękiwały cicho, a rytm ich dźwięków współgrał z dwornym opanowaniem gości powoli spożywających kolację. Delikatne mięso żubra - najbliższe uczcie z prawdziwego tura - doskonale pasowało do czerwonego Lacjum. Obie strony mierzyły się wzrokiem w milczeniu, szukając słabości, i kontynuowały rytualny taniec idealnie skoordynowanych ruchów. Złamanie którejkolwiek z setek ukrytych norm i konwenansów mogło zrujnować pozycję winowajcy. Petrus Caletus pierwszy przerwał ciszę: \n- Wiesz, Antoniusie, wielka szkoda z tym, co spotkało twojego ojca. - Mówił, przeżuwając i naruszając książęce poczucie porządku. - Nigdy nie uważałem go za zdrajcę. \n- Owszem, szkoda - odparł Antonius dwornym, wyrachowanym tonem. - Ale nie możemy pozwolić barbarzyńcom przenikać do Imperium. To było surowe, lecz konieczne. \n- Ha! Przynajmniej ktoś w tym wymuskanym pałacu to rozumie! - Senator otarł ślinę chusteczką, zdradzając pozory ogłady. - Gdyby tylko twój brat był równie ugodowy! \n- Ma Pan rację, konsulu. Gdyby tylko... - Posłał rozmówcy chytry uśmiech. - Niestety jego wady czynią go niezdolnym do objęcia tronu, nie sądzi Pan? Aż strach pomyśleć, ile szkód mógłby wyrządzić... chyba że ktoś go powstrzyma. \n- Sugerujesz to, co myślę? - Petrus Caletus ledwo powstrzymywał ekscytację, mówiąc z pełnymi ustami i wykonując groźne gesty pod adresem nieobecnego Princepsa. \n- Odrobinę dyskrecji, konsulu. Dobrze. Mam przeczucie, że nie zaprosił mnie pan wyłącznie na przyjacielską rozmowę. Niech zgadnę: mój ojciec coraz głośniej wyraża dezaprobatę wobec obecnej równowagi sił. Być może przygotował pan nawet listę hojnych ofert, które miałyby skłonić mnie do współpracy. Cóż, mam lepszą propozycję, senatorze. Ricardus jest nie do uratowania. Ignatius również. Optymaci nie muszą jednak akceptować monarchy szkodliwego dla Imperium. Gdyby poparli kandydata bliższego ich interesom, Calisia mogłaby naprawdę rozkwitnąć. \n- Hm, ale kogo moglibyśmy wystawić? - zapytał nieśmiało. - Nikt nie ma prawowitej legitymacji... \n- Mnie, ty głu... - Princeps ledwie się powstrzymał. - Wiesz co, ja będę mówił. Obiecaj tylko pełne poparcie swojej frakcji, gdy Cesarz zejdzie nam z drogi."
calisia.135.a: "Wygląda na to, że sukcesja nie przebiegnie tak zgodnie."

calisia.136.t: "Czystka Rysia"
calisia.136.desc: "Czternaście minut. Nowy rekord. Mimo całej wymuszonej powagi Senatu tyle wystarczyło, by obrady przerodziły się w gwałtowną wymianę obelg. Większość różnic ideologicznych można było zignorować, lecz kryzys barbarzyński zaprowadził obie frakcje za punkt bez powrotu, o czym Optymaci z upodobaniem przypominali rywalom. \n\n- Zdrajcy, wszyscy jesteście zdrajcami! Sprzedaliście nas, sprzedaliście nas wszystkich! To Imperium nic dla was nie znaczy, skoro wciąż plugawicie je barbarzyńskim ścierwem! Zostaliśmy zinfiltrowani, naszą szlachetną krew rozcieńczono krwią tych kundli. A ty, senatorze Compa, jesteś tylko germańskim agentem, bezwartościowym narzędziem ich apokaliptycznej fali. Kiedy Calisia spłonie i znikną ostatnie resztki ładu, mam nadzieję, że znajdą drogę do twojej willi, abyś mógł patrzeć, jak robią z twojej córki własną dziwkę. \n\nPetrus Caletus był w swoim żywiole. Lata powściągliwości mogły stępić jego wojowniczego ducha, lecz cieszył się, że wreszcie przestały obowiązywać jakiekolwiek zasady. Każdy hałaśliwy komentarz dominujących Popularów i każda szydercza uwaga Barbares rozniecały w nim pierwotną wściekłość, redukując konstrukcję doświadczonego polityka do kałuży jadowitej nienawiści rozlanej po posadzce Senatu. \n\nTego dnia coś jednak się nie zgadzało. Zamiast odpowiedzieć choć raz, konsul Compa po prostu siedział i znosił nawał osobistych ataków z niemal przesadnym spokojem, jakby w ogóle go nie poruszały. A ten... uśmieszek? Czy właśnie... sięgnął pod stół? \n\n- Ty barbarzyński pomiocie, co ty wyprawiasz, co?! - Ostrzał z mównicy trwał. - Wytłumacz się przed tą izbą! Niech każdy obywatel Calisii dowie się, że odebrałeś im domy, odebrałeś godność, a wkrótce zastąpisz ich niecywilizowanymi kretynami! To twój koniec, konsulu. Dopilnuję, byś ty i twoi wspólnicy...\n\nZ hukiem otworzyły się drzwi sali obrad. Nim ucichło echo, do środka wlała się fala legionistów, wszyscy odziani w zbyt ceremonialne pancerze, by miały jakąkolwiek wartość bojową, jak gdyby rozkoszowali się rolą tymczasowych egzekutorów ludowej sprawiedliwości. \n\nWiększość Optymatów próbowała uciec, część stała przy miejscach, osłupiała wobec rozgrywających się wydarzeń. Pośrodku tego wszystkiego Petrus Caletus kurczowo trzymał się mównicy, a jego wywody coraz bardziej przypominały rozpaczliwe błagania. \n\n- To całkowita kpina z prawa i porządku! Andreasie, rozkazuję ci natychmiast rozpędzić tę hołotę! \n\nMówca był tak pochłonięty żądaniami, że nie zauważył dostojnej postaci zbliżającej się do jego stanowiska. Marcus Vinicius, z niezliczonymi medalami dumnie wyeksponowanymi na piersi, roztaczał autorytet niedostępny nawet najbardziej odznaczonym legatom. Z elegancją i klasą, bez wysiłku łącząc dworski szyk z wojskowym drylem, dowódca uniósł ramię i z nutą długo odkładanej satysfakcji wbił pięść prosto w dolną szczękę senatora, urywając jego przemowę w pół słowa. Bezładnie i bez fanfar ostatni bastion kalizjańskiego oligarchizmu runął na ziemię, po czym został w hańbie wywleczony niczym nieposłuszne dziecko - kopiący i wrzeszczący."
calisia.136.a: "Nigdy więcej nie miał zaszczycić swą obecnością tych marmurowych sal."

calisia.137.t: "Ostatnie ukąszenie żmii"
calisia.137.desc: "Gdy tylko Cesarz ogłosił sąd boży dla jednego z najważniejszych ludzi w państwie, ludzie natychmiast ruszyli kupować bilety. I było to widać. W dniu procesu miejsca zapełniły się na długo przed wyznaczoną godziną. Lud pragnął krwi. Na nieszczęście Christianusa Cinastovicusa - właśnie jego krwi.\nSłońce prażyło i rozgrzewało piasek, dając oskarżonemu przedsmak piekielnego ognia czekającego na niego po śmierci.\nGdy nadeszła pora, Calisius rozpoczął przemowę.\n- Obywatele Calisii, stoi przed wami człowiek oskarżony o zdradę stanu, spiskowanie z Optymatami w celu obalenia Imperium i zamordowania prawowitego Cesarza Calisii. Za to stanie przed sądem na oczach bogów! - Tłum wiwatował z aprobatą. - Jego przeciwnikiem będzie niezastąpiony, niepokonany Marius Pudianus Dominator!\nPubliczność oszalała, słysząc imię bohatera prostego ludu.\nWróg Cinastovicusa nosił ciężki legionowy pancerz. W jednej ręce bez trudu dzierżył dwuręczną spathę, w drugiej trzymał scutum. Były Praefectus Praetorio spodziewał się takiego przeciwnika, dlatego wybrał długą włócznię hasta, dającą przewagę zasięgu. Cóż, także dlatego, że nie był szczególnie dobrym wojownikiem, a włócznie słynęły z łatwości użycia. Brak treningu zmusił go do założenia lekkiego pancerza, by zbyt szybko się nie zmęczyć. Dodatkową ochronę dawała mu tarcza typu parma.\n- Przyznajesz się do zbrodni? - zapytał Pudianus, wyrywając Cinastovicusa z rozważań nad własnymi słabościami.\n- Do niczego się nie przyznaję. - Skoro miał umrzeć, mógł przynajmniej umrzeć z honorem. - Cała ta walka jest farsą! Jasnym dowodem, że nie mają przeciw mnie prawdziwych dowodów!\nWróg runął na niego z furią. Cinastovicus skupił się na obronie, blokował tarczą i włócznią, od czasu do czasu odpowiadając nieśmiałym pchnięciem. Wszystko na nic. Marius był szybszy i silniejszy. Czasem sam cios siłacza w blok wystarczał, by pretorianin stracił równowagę. Pudianus szybko przerąbał tarczę Cinastovicusa, czyniąc ją bezużyteczną. Teraz musiał zaatakować, choćby nieporadnie. Wśród nawały ciosów dostrzegał oczywiste luki, których przeciwnik celowo nie wykorzystywał.\n- Bawi się mną - pomyślał Christianus.\nPodczas szczęku ostrzy zdołał wyszeptać coś do Pudianusa.\n- Kończ waść, wstydu oszczędź.\n- Zatem przyznaj się do winy!\n- Chce mieć pewność, że walczy z przestępcą - pomyślał Cinastovicus. - Mógłbym to wykorzystać, gdyby pozwolono mi porozmawiać z nim przed walką.\nOskarżony spróbował kilku rozpaczliwych ataków, lecz już opadał z sił, podczas gdy jego przeciwnik wyglądał, jakby mógł walczyć tak przez miesiąc.\nCinastovicus rozejrzał się; nie było drogi ucieczki. Nie zdołał nawet drasnąć Pudianusa. Chciał odejść z honorem, lecz w śmierci było go niewiele. Co gorsza, część publiczności zaczęła domagać się, by Pudianus zmiażdżył jego głowę, a on obawiał się, że z czasem Dominator coraz chętniej spełni tę konkretną prośbę.\nNie mając innego wyjścia, krzyknął: PRÓBOWAŁEM ZAMORDOWAĆ NASZEGO CESARZA!\nPudianus rzucił się ku niemu jeszcze szybciej. Cinastovicus uniósł włócznię w ostatnim geście oporu. Atak gladiatora przeciął drzewce i przeszył tors zdrajcy.\nCalisius ogłosił Cinastovicusa winnym, lecz Christianus ledwie go słyszał, gdyż jego świat szybko pogrążał się w ciemności."
calisia.137.a: "Jego lewa ręka śmierć niesie,\na prawej sam się boi."

calisia.138.t: "Senat przyjął ustawę!"
calisia.138.desc: "W przełomowym głosowaniu Senat Calisii zdołał przyjąć ważną nową ustawę! Projekt otrzymał poparcie obu frakcji, odzwierciedlając narastające żądanie reform. Ustawa zapewni większe wsparcie dla odnowy naszego kraju i stanowi kluczowy krok ku przyszłości Imperium. Obywatele całej Calisii świętują zwycięstwo, pełni nadziei na pozytywne zmiany."
calisia.138.a: "Ave SPQC!"

calisia.139.t: "Praca u podstaw"
calisia.139.desc: "Wymknięcie się z Pałacu Cesarskiego było sztuką samą w sobie. Stale zmieniające się grafiki straży, liczne wieże obserwacyjne i personel zawsze gotów go wydać sprawiały, że niezauważone opuszczenie kompleksu graniczyło z niemożliwością. Ignatius spędził jednak w tych ograniczających murach niemal całe życie i znał prawie każde tajne przejście prowadzące na zewnątrz bez przyciągania uwagi. W rzeczywistości mógł wyjść główną bramą, kiedy tylko zechciał, lecz niekończąca się zabawa w kotka i myszkę była jedną z niewielu rozrywek dostępnych następcy cesarskiego tronu. \n\n- Uch, jestem już na to za stary - mruknął Ignatius, otrzepując się po wyjściu z czegoś, co najtrafniej można było nazwać kanałem ściekowym. Zamienił dworskie szaty na plebejskie łachmany i rozczochrał włosy na tyle, by nie wyglądać przesadnie wymuskanie. Wtopił się w tłum, podziwiając widoki forum, które jego nauczyciele uznawali za zbyt niegodne i prostackie. Gdy obserwował sztuczki przyjezdnych trubadurów, przerwał mu słaby, chrapliwy głos. \n\n- Młodzieńcze, pomożesz staruszkowi w małym osobistym projekcie? Przysięgam, że to nie potrwa długo. W razie potrzeby mogę nawet zapłacić kilka denarów. \n\nIgnorując obowiązki i możliwe niebezpieczeństwo, Princeps Ignatius poszedł za seniorem do jego skromnego, rustykalnie urządzonego tenementum. Gdy czajnik kliknął, zaczęli rozmawiać przy filiżance zbyt długo parzonej herbaty. \n\n- Dziękuję za zaproszenie, ale w czym dokładnie mam panu pomóc? \n\n- Jak mówiłem: osobisty projekt. Za moich czasów byłem snycerzem. Rzemiosło artystyczne i takie tam. Dawno nie trzymałem dłuta, a przy dłoniach trzęsących się jak szalone niewiele już zdziałam. Ale ty możesz być moimi rękami. Powiem ci, co robić. Wystarczy, że będziesz mnie słuchał. \n\n- A co właściwie stworzymy? - naiwnie zapytał Princeps. \n\n- Ach, racja. Chyba zapomniałem powiedzieć. Cesarz wkrótce odwiedzi dzielnicę. Wiem, że to mało prawdopodobne, ale chciałem wręczyć mu posąg przedstawiający jego szlachetną postać. \n\n- Tak... z własnej woli? I nawet nikt panu nie płaci? \n\n- Oczywiście! - zawołał donośnie. - Dla Imperatora Ricardusa będzie to jedynie ciekawa błyskotka, lecz przynajmniej tak mogę okazać wdzięczność. \n\n- Wdzięczność? Myślałem, że plebejusze... eee, że nienawidzimy monarchii. Domagamy się prawdziwej demokracji, prawdziwej równości, końca niesprawiedliwego systemu, w którym niewybrani autokraci marnują... - Niemal wpadł w płomienną tyradę, lecz rozmówca mu przerwał. \n\n- Powiem ci jedno, synku. Gdy będziesz w tym wieku co ja, zrozumiesz, że żadna wolność nie jest warta więcej niż posiłek na talerzu. A o Ricardusie mów, co chcesz; umie zadbać, by jego obfite resztki skapywały z powrotem do ludu. Dość gadania. Bierzmy się do pracy."
calisia.139.a: "Poza tym Senat wcale nie jest pod tym względem lepszy."

calisia.140.t: "Pałac Cesarski ukończony!"
calisia.140.desc: "Budowa nowego Pałacu Cesarskiego Calisii wreszcie dobiegła końca. Ta kolosalna budowla w sercu stolicy stanowi potężne świadectwo kunsztu architektonicznego i inżynieryjnej pomysłowości naszych budowniczych.\n\nPałac majestatycznie góruje nad miastem. Jego strzeliste wieże, wykwintne kamienne płaskorzeźby i groźne blanki są prawdziwym cudem projektowania. Ogromny kompleks obejmuje labirynt sal, komnat i dziedzińców, wypełnionych wystawnymi meblami oraz bogatymi dekoracjami. Rozległe ogrody otaczające pałac starannie obsadzono egzotyczną roślinnością i uzupełniono spokojnymi sadzawkami. Zielone przestrzenie dają Cesarzowi i jego świcie możliwość odpoczynku od zgiełku dworskiego życia.\n\nW pałacowych murach najnowocześniejsze udogodnienia zaspokajają każdą potrzebę Cesarza - od luksusowych apartamentów po wyrafinowane biura administracyjne. Dbałość o szczegóły sprawia, że każdy aspekt jego codzienności otoczony jest najwyższym przepychem i sprawnością.\n\nPotraficie sobie choć wyobrazić, ile to kosztowało? My potrafimy..."
calisia.140.a: "...i było to BARDZO DUŻO."

calisia.141.t: "Comitia Anno Domini [GetYear]"
calisia.141.desc: "Rozpoczęły się doroczne wybory do Senatu Calisii! Obywatele ze wszystkich zakątków państwa zbierają się, by oddać głosy i ustalić skład organu rządzącego na nadchodzący rok. Wybory są uświęconą tradycją, wyrażającą wartości reprezentacji i obywatelskiego obowiązku. Tegoroczny wyścig jest wyjątkowo zaciekły, a kandydaci różnych frakcji walczą o wpływy. Znani z konserwatywnej polityki Optymaci mierzą się z silną konkurencją ze strony Popularów, opowiadających się za bardziej postępowymi reformami. \n\nNapięcie rośnie, a w debatach dominują nierówności gospodarcze, wydatki wojskowe i opieka społeczna. Elektorat jest głęboko podzielony, więc wynik wyborów może znacząco zmienić równowagę sił w Senacie. Do wyścigu stanęły ważne postacie z całego Imperium: doświadczeni senatorowie ubiegający się o reelekcję oraz nowe twarze obiecujące zmianę. Kampanie trwają w najlepsze, a wiece, przemowy i debaty przyciągają uwagę opinii publicznej.\n\nWyniki ukształtują politykę i rządy Calisii, wpływając na przyszłość jej obywateli przez długie lata. A przynajmniej przez następny rok."
calisia.141.a: "Rząd pozostaje u władzy!"
calisia.141.b: "Czas na zmianę warty."

calisia.142.t: "Parada hańby"
calisia.142.desc: "W centralnym arsenale Calisii świeciło pustkami. Praefectus Provisionis Andreas Quercus nie był z tego faktu przesadnie zadowolony. W szczególności, że następnego dnia miała odbyć się wielka parada wojskowa na ulicach Wiecznego Miasta. Legiony z całego kraju wysyłają swoje kompanie reprezentacyjne. Ale żaden z Legatów nie jest na tyle hojny żeby użyczyć cięższego sprzętu wojskowego na paradę, więc jedyne na co prefekt może liczyć to, że legioniści chociaż przywiozą swoje wyposażenie personalne, żeby nie musiał szukać po kątach starych gladiusów i złomu przypominającego wyglądem zbroję lorica segmentata.\n\n- Marcus! A co jakbyśmy pożyczyli jakieś rydwany z toru wyścigowego? Na samoloty nie ma co liczyć...ale wyślij ludzi przez całe miasto żeby poszukali ludzi z dronami, jak będą leciały wysoką to nawet nie zorientują się że to badziewia z Sericum, i spróbuj znaleść jakiekolwiek pojazdy gąsienicowe w mieście. Cokolwiek! - prefekt panicznie szukał jakichkolwiek rozwiązań które pozwoliłyby mu przeprowadzić paradę nie narażając się na publiczną śmieszność. W końcu sam Augustus będzie na niej - jak będzie to wyglądało na marsz chłopów średniowiecznych w zamian potężnej armii to rzucą go na pożarcie lwom.\n\n- Panie Prefekcie Kapitanie! - jeden z młodych legionistów którzy za karę zostali przydzieleni do tej służby wbiegł nagle do hali magazynu trzymając w ręku zwój pergaminu.\n- Mam dobre wieści!\n- Salutować to Cię już nie nauczyli w legionie?!\n- P-p-przepraszam panie kapitanie magistrze - odpowiedział legionista wykonując niepewny ruch ręką. Zarówno musztra jak i odpowiednie tytułowanie przełożonych nie było jego silną stroną - Mam wieści od Legionu Alfa! Właśnie wjechali do miasta, jadą tutaj. Mają dla nas czołg!\n- Ave Vinicius! Nareszcie! Zaraz, jak to - czołg? W sensie, w liczbie pojedynczej?\n- A mamy jakieś więcej? Powiedzieli czołg, nie czołgi.\n\nGodzinę później okazało się że wiadomość nie myliła się. Gdy kompania reprezentacyjna pierwszego legionu udała się do koszar na odpoczynek, do hali arsenału udał się jeden czołg z załogą. Wyglądał jak na standardy postupadkowe bardzo okazale. Jak bardzo okazale może tylko wyglądać czołg skręcony ze złomu. Na tyle czołgu powiewał zamontowany sztandar legionu, a cała konstrukcja przynajmniej pozornie wydawała się trzymać. Im bardziej jednak zbliżał się do prefekta, tym gorzej to wyglądało. Zgrzytający dźwięk jaki wydawała ta metalowa bestia z siebie mógłby wystraszyć wszystkich, ale chyba najbardziej załogę. Gdy zaparkowali, Andreas podszedł do pojazdu już lekko udobruchany.\n- Salve, żołnierze. Widzę że przywieźliście mi coś sensownego w końcu - z tymi słowami klepnął czołg w przednią płytę z zadowolenia tak mocno że odpadła boczna płyta. Dowódca czołgu nie przejął się za bardzo tym, widocznie zdarzało się to częściej niż można by się przyznać do tego. \n- Pan się nie przejmuje, ten złom tak ma, to się wyklepie - chcąc najwyraźniej zademonstrować proces, dowódca kopnął w czołg. Druga płyta boczna również odpadła, stalowe płyty z wieży zaczęły się osuwać a sztandar na tyle czołgu przewrócił się. W umyśle Andreasa kotłowało się teraz wiele myśli. Wiele z nich wulgarnych.
calisia.142.a: "- Andreasie, nie denerwuj się..."

calisia.143.t: "Maleńki dołek"
calisia.143.desc: "Iulia wszystko przewidziała. Ten reżim nie miał prawa istnieć: smutna i szczerze obłąkana próba wymazania tysiącletniego narodu poprzez wskrzeszenie narodu sprzed dwóch tysięcy lat. Nie wierzyła, że przetrwa, uzna ją za obywatelkę albo dotrwa choćby do pierwszej rocznicy. Według całej jej wiedzy i obliczeń chwila, w której wszystko miało się rozpaść, nadeszła... właśnie teraz.\n\n- Rynek znalazł się teraz w takim tycim, maleńkim dołku. Wszyscy uznali, że rynek nieruchomości oszalał, więc musi trochę ostygnąć, zanim znów nabierze rozpędu. Tak bywa, kiedy koszty remontów ciągle rosną, prawda? - Pośrednik, który przedstawił się jako Thaddeaus, bez końca opowiadał o świetnej kondycji rynku, jakby próbował odwieść ją od sprzedaży. Wskazał rezydencję na obrzeżach Calisii. - Na przykład ten właściciel jest chyba gotów oddać dom w zamian.\n\n - Dlaczego sprzedaje? - zapytała.\n- Teraz nie pracuje. Dziwny typ. Nawet niewolników nie kupuje.\n- Czyli wyjeżdżają. Dlaczego? Inflacja?\n- Tamtą willę sprzedałem za trzy miliony. Cztery miesiące później była warta cztery.\n- Na pewno to rynek mieszkaniowy, a nie zwykły wzrost cen?\n- Och, to tylko dołek, nic więcej. Zwykła nerwowość.\n- Ilu ludzi w takim razie sprzedaje?\n- Ten dom po lewej należy do mnie. Mógłbym go sprzedać, ale to tylko letnia rezydencja.\n- Letnia rezydencja wyglądająca jak melina ćpunów.\n\nSamochód się zatrzymał, a wyraźnie poirytowany Thaddeaus wysiadł. Nikt nie powiedział Iulii, że jej pośrednik trzymał w walizce ręczną armatę. Wszedł do letniego domu. Rozległo się kilka wrzasków, przypominających raczej odgłosy łosi niż ludzi. Potem dwa wystrzały z ręcznej armaty. Nawet z samochodu dźwięk niemal ogłuszył Iulię. Kilku wynędzniałych barbarzyńców wyskoczyło przez okna, nie zważając na liczne rany od szkła.\n\n- Pierdoleni barbarzyńcy, wszędzie ich pełno jak mrówek! Następnym razem będę do nich strzelał jak do mrówek! - Thaddeaus kipiał ze złości, gdy wrócił do samochodu, lecz Iulia drżała. - Co się stało? - zapytała.\n\n- Jednego z tych \"barbarzyńców\"... znałam z tawerny, do której chodziłam. Jeszcze rok temu był barmanem."
calisia.143.a: "...to nie byli barbarzyńcy."

calisia.144.t: "Na tym właśnie polega bańka"
calisia.144.desc: "Atia była wiecznie sfrustrowana jeszcze przed skokiem cen. Jako zwyczajna wenedyjska gospodyni domowa często rozładowywała emocje plotkami o tym, kto z kim sypia i komu przybyło kilogramów. Po Upadku pozostał jej jedynie mąż i jego ziemie. Pierwsze dni były ponure dla kobiety przywykłej do luksusu. Z biegiem lat mąż Atii uprawiał jednak ziemię w Calisii, kupował niewolników, by ponownie zagospodarować większy obszar, i odbudowywał ich majątek.\n\nTeraz Atia mogła wyładowywać frustracje na niewolnikach. Przygnębiona statusem prawnym kalizjańskich kobiet? Wychłostać najmniej wydajnego niewolnika. Mąż zachowuje się jak typowy facet i nie dostrzega nawet oczywistych sygnałów, takich jak opuszczenie powiek o pół centymetra podczas siedzenia na innych kolanach niż zwykle? Umięśniony niewolnik zawsze był posłuszny i spostrzegawczy. Piekło nie zna furii wzgardzonej kobiety - a Atia już się w nim znajdowała, stojąc zarazem nad przepaścią.\n\nOstatnio było jednak gorzej niż kiedykolwiek. - Ciągle ględzi, że ceny rosną i musimy mniej wydawać. Jak bez kobiecej intuicji może dostrzec bańkę finansową? - plotkowała z innymi kalizjańskimi gospodyniami w jadalni, sącząc ostatnie zapasy z piwniczki win.\n\n- No właśnie, jaja na targu kosztują już dwa razy więcej niż miesiąc temu. Jakieś zamieszki w stolicy, ale to właściwie norma w tej przeklętej krainie. Nikt nie widzi bańki. Na tym właśnie polega bańka.\n\n- Rozumiem, że nikt nie widzi również, iż import leży i kwiczy?\n\n- Cicho, wiesz, jak niebezpiecznie jest tak mówić? Powinnyśmy ograniczyć wino. I tak mamy niedobór.\n\nAtia nie była szczególnie zmartwiona. Ich gospodarstwo sprzedawało pszenicę, a nawet jajka, więc wzrost cen oznaczał dla nich większe zyski! Mimo to mąż chciał oszczędzać. Wczoraj przez cały dzień szukała sposobów na cięcie kosztów. W końcu wymyśliła, że niewolnicy mogą mieszać rozgniecione mięso z sianem i jeść powstałą karmę. Otworzyła też karmę dla psów pozostałą po śmierci jej starego owczarka niemieckiego Titusa. Niewolnicy i tak stali niżej od Titusa.\n\nDziś godzinami spierała się z przyjaciółkami o to, co właściwie działo się wokół nich. Wkrótce wyszły. Normalnie trajkotałyby do północy, lecz tym razem musiały odejść przed zmierzchem, bo nocą ulice nie były bezpieczne. Jakiś czas później, gdy odpoczywała na kanapie, usłyszała zamieszanie, tłuczoną ceramikę i wściekłe krzyki męża. Patriarcha wpadł do środka z zakrwawionym nożem.\n\n- Co tam się, kurwa, dzieje? Niewolnicy właśnie uciekli!\n\n - CO?! Dlaczego strażnicy ich nie... zaraz, zwolniliśmy wszystkich strażników, bo za dużo żądali!\n\n- Cholera, miałaś jedno zadanie... nie karmiłaś niewolników, prawda?!\n\n - Ja... to TWOJA wina. Gdybyś mi nie powiedział..."
calisia.144.a: "Gdybym dostawał denara za każdą taką kłótnię, nadal nie byłoby mnie stać na jeden dzień jedzenia."

calisia.145.t: "Dziewczyna za milion denarów"
calisia.145.desc: "Atia miała dość. Wszystko płonie. Wszystko się rozpadło. Jej beznadziejny mąż stracił willę na rzecz wierzycieli z powodu jakiegoś nonsensu, którego nawet nie chciało jej się zrozumieć. Liczyło się tylko to, że mąż był do niczego, a ona nie zamierzała przy nim zostać, gdy utracił wszystko, co czyniło go mężczyzną - poza sprzętem w spodniach. Miała swoje potrzeby i nie potrzebowała nędzarza.\n\nNieważne, w całej tej przeklętej prowincji nie było już ani jednego bogatego mężczyzny. Jedyny, który choć się do tego zbliżał, podszedł na oczach Atii do pracującej dziewczyny:\n\n- Jesteś wolna?\n- Nie, zapierdalam jak dyliżans.\n- Mam tutaj sto tysięcy! - Vigil wskazał walizkę.\n- Wybacz, chłopcze, jestem dziewczyną za milion denarów i dobrze o tym wiesz.\n- Od kiedy?\n- Od teraz.\n\nDziewczyna za milion denarów. Atia nie miała nawet tyle, choć i tak niczego by za to nie kupiła. Lecz nie w tym tkwił problem. Pośród całego brudu, gdy niczym duch błąkała się po niebezpiecznych ulicach, a co drugą minutę ktoś krzyczał, jakby go mordowano, najbardziej bolało ją to, że jej majątek netto był mniejszy niż majątek prostytutki...\n\nPROSTYTUTKI! ISTOTY STOJĄCEJ LEDWIE PONAD NIEWOLNICĄ! KTÓREJ MIEJSCEM BYŁO POD BUTEM KLIENTA I SUTENERA! - krzyczała w duchu, lecz szybko się uspokoiła. Jakiś mężczyzna wrzeszczał na zawodzącą kobietę. Atia zakradła się do insuli, z której dobiegał hałas, i zajrzała przez okno. Za szybą mężczyzna policzkował pracującą dziewczynę. Zapewne był jej właścicielem. Potem ją odprawił, poprawił biżuterię, omal nie dostrzegł Atii, gdy się odwracał, i ruszył za dziewczyną.\n\nLos dziewczyny nie obchodził Atii; była w stanie umysłu, w którym liczyła się wyłącznie ona sama. Ostrożnie otworzyła więc rozbite okno i wślizgnęła się do biura. Nadeszła pora kraść i rabować, ukoić ego, przetrwać. Nim zdążyła cokolwiek zwędzić, sutener wrócił, więc musiała ukryć się za biurkiem z najcenniejszym dobytkiem w dłoni: sztyletem. Gdy mężczyzna przeszedł obok i ją zauważył, zadrżał i podskoczył.\n\nZanim ktokolwiek zdołał pomyśleć, Atia rzuciła się na niego.\n\nPowaliła sutenera i bez wahania wbiła mu pugio w szyję. Obrzydliwy odgłos stali rozdzierającej ciało, czerwona fontanna na twarzy Atii. Nie przeszkadzało jej to. Prowadziła ją adrenalina. Zerwała złote łańcuchy i zabrała pierścienie - zaraz, to złoto jest kurewsko fałszywe. Nieważne... szuflady. Dokumenty. Więcej dokumentów. Prezerwatywy? Fuj. I bingo! Diamenty, biżuteria z prawdziwego złota i srebra - niemal czuła zapach autentycznych kruszców. A co najlepsze: prawdziwe, najprawdziwsze... pliki scytyjskich hrywien? Musiał kupować lub sprzedawać dziewczyny scytyjskiemu półświatkowi. Atia zabrała wszystko, co miało realną wartość, uciekła przez okno, nim ktokolwiek przybył - a przez następne sześć godzin nikt się nie zjawił - i pobiegła. Po raz pierwszy tego dnia była z siebie dumna. I śmiertelnie przerażona. W końcu była teraz najbogatszą osobą w całym mieście. Następny punkt programu: uciec z tego piekła."
calisia.145.a: "Zawsze powtarzała potencjalnym partnerom, że zostanie miliarderką."

calisia.146.t: "Cywilizacja dla opornych"
calisia.146.desc: "Choć Matthäus mieszkał w Calisii już ponad rok, wciąż nie potrafił przywyknąć do olśniewającego blasku Wiecznego Miasta. Uciekł z Germanii przy pierwszych oznakach niestabilności i osiadł we wskrzeszonej krainie na wschodzie, gdy limes był jeszcze słabo strzeżonym pasmem punktów kontrolnych. Wkrótce jego histeria okazała się rzeczywistością, gdy ojczyznę pochłonął chaotyczny bratobójczy konflikt, którego sam mógłby nie przeżyć. Mieszane pochodzenie pozwalało mu wtapiać się w otoczenie na tyle dobrze, że nie wytykano go codziennie palcami. Tym większe było jego zaskoczenie, gdy otrzymał wezwanie na \"Podstawowe Szkolenie Wprowadzające do Kultury\". \n\nSiedząc przy ławkach w wilgotnej piwnicy niedofinansowanej szkoły na obrzeżach miasta, \"barbarzyńcy\" - Matthäus i grupa jego pojmanych, skutych rodaków - bezczynnie czekali na wykładowcę. Przybył około dwudziestu minut spóźniony, niosąc niepozorne pudło pełne przypadkowych przedmiotów. Odezwał się przesadnie entuzjastycznym tonem: \n\n- Witajcie, biedni, pechowi dzikusi! Cieszę się, że wszyscy zebraliście się, by poznać podstawy bycia Kalizjaninem. Wiem, że warunki nie są nielegalne, ale już wkrótce ruszycie na specjalną wycieczkę po Wiecznym Mieście, przygotowaną właśnie dla was! Najpierw jednak: kto powie mi, co to jest? - Wyciągnął widelec. Odrobinę ozdobny, lecz nadal zupełnie zwyczajny. Matthäus uniósł rękę, lekko zdezorientowany. \n- Eee... widelec? \n- Bingo! Ależ ty jesteś bystry! Proszę, oto złota gwiazdka. Jeśli zdobędziesz ich więcej, podczas wycieczki wymienisz je na jedną ze wspaniałych nagród! Teraz coś naprawdę trudnego. Czy ktoś ma pojęcie, co to może być? - Barbarzyńca znów podniósł rękę. \n- Rolka papieru toaletowego? Serio? Za kogo nas uważacie? Za kompletnych prymitywów? \nIgnorując jego wzburzone okrzyki, wykładowca ciągnął dalej: - Niezwykłe! Ukończyłeś nawet zaawansowane szkolenie z higieny?! A to naprawdę trudne! Brzmisz nawet... trochę jak cywilizowany człowiek, prawie bez tego okropnego germańskiego akcentu. Wiesz co? Zasłużyłeś na wszystkie gwiazdki. Pokaż je centurionowi, który cię tu przyprowadził. Jesteś wolny. Co do pozostałych, zaplanowaliśmy jeszcze jakieś cztery godziny."
calisia.146.a: "Nagroda - torba płócienna pełna magnesów na lodówkę, kartek okolicznościowych i pięciu paczek Tragematae Legionarius."

calisia.147.t: "Oczy pokryte sadzą"
calisia.147.desc: "Forum ociekało wrogością i krzykiem, lecz tym razem nie zwiastowały one niepokojów społecznych. Nienawiść skierowano na zewnątrz, ku barbarzyńcom, na których Imperium zamierzało spuścić młot. W każdym rogu forum płomienny retor przemawiał do tłumu obywateli chłonących każde słowo, kanalizując i skupiając nienawiść w strumień retoryki uderzający w słuchaczy. Mówca w południowo-wschodnim narożniku właśnie zaczął:\n\n- Odrzuciwszy wspólne człowieczeństwo, żyjący wśród nas barbarzyńcy nie cofną się przed niczym, by nas zbezcześcić! Nie sądźcie, że chodzi im o przetrwanie - nie. Wszystko to robią ze złośliwości; kieruje nimi czyste, kurwa, bestialstwo! Ile dziewcząt sprzedali Scytowie? Ile zgwałcili Wizygoci, a ile obrabowali Sasi? Aby ukazać zbrodnie naszych wrogów, przedstawiamy wam tę księgę: Niebezpieczne związki barbarzyńców!\n\n- Moja żona jest Scytką, ty tani pierdolony demagogu! - wtrącił mężczyzna stojący z przodu, a reszta spojrzała na niego, jakby właśnie rozebrał się do naga.\n\n- Twoja żona to twoja odpowiedzialność. Swojej nawet nie dałem nazwiska! Tam na zewnątrz jest jednak dzika kraina, a dzicz rodzi barbarzyństwo. Zapytajcie Velun, zapytajcie Acrimorum, zapytajcie Prasia Elysiorum! Te niegdyś kwitnące, cywilizowane miejsca obrócono w ruinę i popiół wyłącznie dlatego, że BARBARZYŃCY wyładowali na nich zwierzęcą agresję! Nie wystarczyło im dziesięć tysięcy gwałtów, o nie. Nie ma w Calisii miasta, po którym nie chodziłyby ich ofiary, a kobieta zhańbiona przez te bestie przemówi dziś z tej mównicy! Bez końca gwałcą nasze kobiety i dzieci; raz za razem, i znowu, i bez końca! Smarują oczy sadzą jak prostytutki!\n\nTłum zaczął szemrać, a kilku obywateli ryknęło z aprobatą. Radził sobie dobrze, przynajmniej znacznie lepiej niż mówca w przeciwległym rogu Forum.\n\n- Obywatele, dobry barbarzyńca to barbarzyńca na kolanach. Jedyny język, jaki rozumie, to strach i siła. Siłą oręża i strachem, jaki owy wzbudza, poskromimy nawet najgorszych z nich! Dopiero na kolanach, dopiero złamani mogą do czegokolwiek się przydać. Są jak byki. Potrafią tylko ruchać wszystko dookoła i nic z nich nie będzie, dopóki nie wykastruje się ich na woły i nie uczyni naprawdę użytecznymi. Wiele miasteczek poznało najlepsze, co te DEMONICZNE MAŁPY mają do zaoferowania, a wiele innych miast je odparło. Nasze zwycięstwa nad nimi mogą należeć także do was. Wstąpcie do legionów. Wstąpcie do Straży, do Vigiles. Wstąpcie...\n\nMówcę odciągnął podstarzały senator o surowym spojrzeniu i wyszeptał ostre słowa nagany:"
calisia.147.a: "Demoniczne małpy? Sądziłem, że porządna republika rzymska powinna być lepsza w retoryce!"

calisia.148.t: "Wszystkim równo..."
calisia.148.desc: "Gdy cesarski kwestor przybył do ponurej wioski Crerovia, aby zgodnie z dekretem Senatu zapewnić równość majątkową, spotkało go powitanie zupełnie inne niż zwykle. Mimo ulewy, która zmieniła jedyną drogę do osady w niemal nieprzejezdne bajoro, około pięćdziesięciu pozostałych, pogrążonych w nędzy mieszkańców zamiast groźnego muru wideł przyniosło Iuliusowi najlepsze miejscowe towary, wszystkie równie wątpliwej jakości. \n\nPrzez ostatnią dekadę Crerovia prowadziła krucjatę przeciw bezprecedensowemu i niezasłużonemu bogactwu jedynego wpływowego właściciela ziemskiego w okolicy, zabarykadowanego w rodowej posiadłości. Każda próba siłowego przejęcia majątku przez chłopów kończyła się porażką, aż wieś pogodziła się w końcu ze swym żałosnym losem. Dziś Iulius miał zostać ich zbawcą. Dziś mieli wreszcie żyć jak królowie. \n\nGdy ulewa ustąpiła miejsca złowieszczej burzy, chłopi z Crerovii wraz ze skutym i wrzeszczącym nemezis zgromadzili się na niewielkim wzgórzu, przytłoczeni ogromną stertą denarów, i z zapartym tchem czekali na swój udział w łupach. Zaczęło się: \n\n- Pierwszy denar otrzymuje Sergius - zgarbiony wieśniak podszedł i łaskawie przyjął lśniącą monetę. \n- Ten przypadnie Silvii - podeszła wiekowa staruszka podtrzymywana przez dwoje potomków. Chwyciła denara nienaturalnie bladą dłonią, po czym runęła twarzą w błoto, a muchy obsiadły to, co zostało z jej ciała. \n- Dobrze, moneta przypadnie więc Elisei. Podejdź i odbierz to, co ci się prawnie należy. - Zapadła cisza. - Eee, Elisea? Jest tu ktoś o imieniu Elisea? Nie? Hm, chyba przechowam ją zatem na później. Teraz zapraszam Mauritiusa... \n\nPośród wiwatów i gwizdów podział trwał, dzień przeszedł w noc, a noc znów w dzień. Iulius mówił coraz bardziej zmęczonym głosem, lecz sterta monet niemal się nie zmniejszała. \n\n- Sergiusie, oto kolejna moneta dla ciebie, już trzecia dzisiaj. Wygląda na to, że Crassus pobłogosławił cię tego pięknego wieczoru. - Mężczyzna podszedł i odebrał nagrodę, równie uradowany jak wcześniej. \n- I tak oto kończymy sprawiedliwy i równy podział majątku waszej wioski. Mam nadzieję, że wszyscy są zadowoleni, bo temu oligarsze naprawdę utarliśmy nosa! \n- Eee, panie kwestorze... - zapytała słaba postać. - A co z resztą pieniędzy? \n- Hm, z tym? To moje wynagrodzenie za pomoc. To przecież uczciwe, skoro przez cały ten czas byłem w pracy. Wkrótce przyjedzie mój wspólnik i wszystko zabierze. \n\nWidząc narastający gniew wieśniaków, Iulius pospiesznie wskoczył na konia, poza zasięg ich wideł. \n\n- Aha, Sergius ma teraz więcej denarów niż reszta, więc możecie się tym zająć. Valete!"
calisia.148.a: "Kwestor odjechał i nigdy więcej go nie widziano."

calisia.149.t: "Nemo Supra Legem Est"
calisia.149.desc: "Kolejny dzień, kolejna lista. Ściganie przestępstw finansowych i oszustów podatkowych nie było wymarzonym zadaniem żadnego z Vigiles, lecz dla syna biednego kucharza, takiego jak Iulianus, stanowiło jedyną okazję, by zaznać choć odrobiny zasłużonej odpłaty. Poza tym prowizja za każde schwytanie była nie do pogardzenia. Dopóki opłacał rachunki, mógłby zamknąć nawet Cesarza. Zwykle chodziło o skąpego kupca, który sądził, że zarobi kilka dodatkowych monet, fałszując księgi. Czasem zastanawiał się jednak, dlaczego nigdy nie wolno mu aresztować nikogo naprawdę bogatego i wpływowego. Może nie ufali mu na tyle, by powierzyć poważnych przestępców? Sądząc po dzisiejszej liście, nic nie miało się zmienić. Wyglądała... wyjątkowo małostkowo. Rzucił okiem na nazwiska: \n\n- Olivia Morosovica / 2 denary 50 sestercji \n- Carolus Morosovicus / 4 denary 99 sestercji \n- Sophia Novica / 1 denar 99 sestercji \n- ... \n\nDziesiątki nazwisk, przy żadnym rozbieżność nie wystarczała nawet na dużą paczkę chipsów. Przy wszystkich jako główny punkt kontaktowy widniała miejscowa szkoła podstawowa. Czy nauczyciele kradli pracodawcy materiały biurowe? Żałosne, ale i tak musiał ukrócić ich wybryki. \n\nGodziny pracy nie pozwalały Iulianusowi przybyć po zakończeniu lekcji, więc wszedł do pustego szkolnego korytarza i zapukał do pierwszych drzwi. Przerwawszy lekcję podstaw ortografii, funkcjonariusz zwrócił się do nauczycielki: \n- Eee, czy zastałem panią Morosovicę? Olivię Morosovicę? \nRękę podniosła dziewczynka mająca ledwie osiem lat. Odpowiedziała radośnie: \n- To ja, proszę pana. Zrobiłam coś złego? \n- Ty? Ale to... Czyli Carolus jest... \n- Moim bratem! - Jej niewinny uśmiech zmienił się w wyraźny grymas. - Ma kłopoty, panie oficerze? \n\nZaczynając dostrzegać wzór, Iulianus chwycił listę obecności z biurka nauczycielki i porównał ją ze spisem winowajców, których miał ukarać. Idealne dopasowanie. Serce mu zamarło na myśl o tym, co te bezduszne bestie z forum mogą zrobić małym urwisom w ramach odwetu. Chciał odejść z pracy na miejscu, ale ktoś inny natychmiast zająłby jego stanowisko. Ktoś być może mniej delikatny. Niestety, choć było to trudne, praca pozostawała pracą. Zniesmaczony sobą funkcjonariusz jak zawsze wykonał rozkazy. \n\n- Dobrze, dzieci, pakujcie się i bierzcie portfele. Nie mówcie rodzicom, ale wybieramy się na małą wycieczkę na Forum Calisianum. Kto się cieszy?"
calisia.149.a: "Czy ta prowizja naprawdę była warta całego cierpienia?"

calisia.150.t: "Biurokracja skali"
calisia.150.desc: "Oświetlona jedynie bladym blaskiem Luny i przyćmionym migotaniem samotnej żarówki, rozłożona na czterech rogach specjalnie zamówionego stołu biurowego, leżała najdoskonalsza mapa Imperium Kalizjańskiego - magnum opus kilkunastu hojnie opłaconych kartografów. Oznaczenia pokrywały każdy centymetr pergaminu, tworząc gęstą sieć ośrodków ludności: od najpotężniejszych metropolii po najodleglejsze wioski, ledwie muśnięte stanowczą ręką kwestora. Każdą zdobiła notatka z głównymi problemami wskazanymi przez lokalnego gubernatora prowincji. Na obrzeżach piętrzyły się stosy nieotwartych listów, zapewne skarg i sugestii bezsilnych urzędników z najniższych szczebli administracji. Nad mapą tłoczyły się dziesiątki wścibskich oczu, a energiczna paplanina zagłuszała odgłosy pomieszczenia. Każdy z niepozornych uczestników - biurokratyczny aparatczyk, którego boleśnie przeciętnej twarzy nie mogły uszlachetnić nawet najwspanialsze szaty wiszące na wątłej sylwetce - na zmianę głośno zachwalał rzekome zalety własnej wizji i z równą gorliwością umniejszał pomysłowi poprzednika, rozkoszując się niezasłużonym poczuciem wyższości. \n\nNic dziwnego, że atmosfera tej przerośniętej psiarni nie sprzyjała żadnemu porozumieniu. Przy mizernych środkach, które Cesarz zdołał wycisnąć z krwawiącego budżetu, administratorzy mogli jedynie walczyć o ochłapy. \n\n- Ponadto uważam, że absolutnie konieczne jest sfinansowanie rozwoju produkcji zboża w okolicy Alba Pomeraniae. Wzrost o... \n- Naprawdę, Philipusie? Mówisz o tej samej branży, którą niemal całkowicie zmonopolizował twój brat? Może od razu dajmy mu jałmużnę, co? \n- Ty to mówisz, Andriusie! Nie, nie, wróćmy na chwilę do twojej propozycji. Powiedz, kto otrzyma kontrakt na budowę nowej dzielnicy w Sedinum? Czy przypadkiem nie nosi tego samego nazwiska co ty? \n- Eee, nie chciałbym przerywać, ale municipium Suebodinum poprosiło o czystą wodę pitną. Może moglibyśmy... \n- Nie. Zgadzamy się? Dobrze. Wracając do prawdziwych problemów: jestem przekonany, że szereg willi w Septembrum zachęci zamożniejszych obywateli do osiedlenia się i pobudzi miejscowy handel... \n- Martinusie, jeśli jeszcze raz zaproponujesz wille, przysięgam, że wypatroszę cię gołymi rękami! \n\nPo groźbie zapadła napięta cisza. Po raz trzeci podczas zebrania dobyto noży, a nawet dla napompowanych ego biurokratów robiło się tego za wiele. W końcu przemówił jeden ze starszych urzędników, jeden z nielicznych ludzi w sali cieszących się jakimkolwiek autorytetem wśród kolegów: \n- Och, do cholery, dajcie wszystkim po akwedukcie czy coś. Ładnie wygląda, działa... i, co najważniejsze, na jakiś czas zamknie im usta. A teraz znikajcie mi z oczu, mam was wszystkich serdecznie dość. \n\nJeden po drugim wyszli z budynku, zachowując się tak, jakby rozwiązali wszystkie problemy Imperium."
calisia.150.a: "Cóż, to było owocne zebranie."

calisia.151.t: "Biurokratyczna hydra"
calisia.151.desc: "Stanie w kolejkach stało się ostatnio jedną z ulubionych profesji Iuliusa. Petycja do lokalnego magistratu odesłała go do urzędu w najbliższym mieście - Lubinum. Tam po przeczekaniu kilku godzin dowiedział się że sprawy odszkodowaniowe niestety przyjmuje jedynie magistrat komicjalny w Glogovia. Lecz tamże powiedziano mu, że to była pomyłka i będzie musiał się kierować do jednego z prowincjonalnych urzędów który był w Lugidunum. Dopiero w tym miejscu dowiedział się że jego wniosek nie będzie rozpatrzony ze względu na braki w dokumentacji, a poza tym to brakuje mu ustalonego rodowodu Calisiańskiego i jego wszelkie tłumaczenia nie były wystarczające do żądania przez niego odszkodowania.\n\njednak upartym bytem jest, i Iulius Iaius nie zamierzał poddać się łatwo. Kupił czym prędzej bilet na pociąg do Urbs. Zamierzał wejść w trzewia biurokratycznego behemota, wyrwać należność z paszczy tego przepastnego, chaotycznego potwora, pokonać potężnego smoka ucisku, powstać przeciw machinie depczącej jemu podobnych, aby...\n- Proszę usiąść, pański wniosek został przyjęty, przydzielono numer sprawy MMMDXCVII.\n- Przedrzemawszy większość przeklętego oczekiwania, Iulius wreszcie znalazł się na początku kolejki. Wszedł do małego biura.\n\n- Czego potrzebuje? - zapytała urzędniczka znudzonym, obojętnym głosem.\n- Chciałem wystąpić o odszkodowanie za szkody wyrządzone przez pretorian. Przyjechali na moje gospodarstwo i ukradli wszystko, nie została nawet jedna kura. Dom jest zrujnowany, pola rozjechane, niczego nie mogę zasiać, a jeden odjechał moim traktorem, krzycząc, że jest Ursusem. Podejrzewam, że nie byli trzeźwi. Zagrozili śmiercią mojej rodzinie, jeśli cokolwiek zrobię, ale rozumie pani, że takie rzeczy nie mogą pozostać bezkarne?! Żądam zadośćuczynienia i publicznego procesu. Nie wyjdę, dopóki go nie otrzymam.\nSurowy ton Iuliusa nie zrobił na urzędniczce żadnego wrażenia. Wcisnęła przycisk pod biurkiem i dalej recytowała wyuczone przepisy.\n- Zgodnie z nową ustawą o zdecentralizowanej służbie publicznej, artykuł piąty, ustęp trzeci, takie roszczenia może rozpatrywać wyłącznie administracja regionalna. Proszę udać się do regionalnego urzędu pretoriańskiego.\n- PRZECIEŻ ONI MNIE ZABIJĄ!\n- Pańska desygnowana jednostka administracyjna to Centralna Komicja Pretoriańska w Budorgis. Życzymy miłego dnia.\nW tej chwili do biura weszło dwóch strażników i wyrzuciło Iuliusa z budynku. Pozbawiony złudzeń postanowił zrobić coś samobójczego. Pojechał do Budorgis. Przybił manifest do drzwi urzędu pretorian jako zabezpieczenie na wypadek rychłej i niespodziewanej śmierci. Następnie otworzył bramy piekieł i ruszył na spotkanie z Plutonem. Oficjalne stanowisko urzędu następnego dnia było jednoznaczne: Iulius Iaius - taki obywatel nigdy nie istniał, a nawet gdyby istniał, nie przebywał w Budorgis i z pewnością nie wyskoczył przez okno. Poza tym zasłużył sobie. Jego traktor stanął w płomieniach, raniąc jednego ze strażników. A to - jest już przestępstwem."
calisia.151.a: "W prefekturze pretorian nigdy nic się nie dzieje."

calisia.152.t: "Crisis Identitatis"
calisia.152.desc: "Przyjść do urzędu pięć minut przed otwarciem, odbić kartę, zaparzyć najmocniejszą kawę, na jaką pozwala stary, zużyty ekspres - może od razu dwie - i wreszcie opaść na krzesło przy biurku z głośnym westchnieniem. Praca biurokraty była niewdzięczna i monotonna, a Dominicus często marzył, by robić cokolwiek innego, niż spędzać najlepsze lata życia na zapisywaniu w Cesarskim Rejestrze każdej nieistotnej zmiany. Rutyna odbierała mu zmysły, lecz odsunął te myśli i zaczął sumiennie przeglądać ogromny stos listów i raportów piętrzący się przed nim. \n\n> Marcus Visnovicus, 32 lata, pożyczka 10000 denarów z Banku Centralnego - szybka notatka w Rejestrze Dłużników i dokument wylądował z boku. \n> Paulus Copatus, 44 lata, roszczenie ubezpieczeniowe po wypadku przy pracy - bazgroł w kolejnym spisie i łyk kawy. Nieco za gorzka, trzeba poprosić przełożonego o wymianę ekspresu. \n> Ricardus Calisius, 81 lat, znaleziony martwy w pobliżu Pałacu Cesarskiego... \n\nDominicus nie wierzył własnym oczom. Wiedział, że ten dzień kiedyś nadejdzie, ale dlaczego tak szybko? Dlaczego trafiło właśnie na niego? Czuł się winny, jakby własnoręcznie zabił Cesarza. Dlaczego jednak nikt o tym nie doniósł? Czy ktoś próbował to ukryć? A jeśli tak, po co przekazywać wieść przypadkowemu urzędnikowi? Coś było nie tak i przysiągł dotrzeć do sedna rodzącego się spisku. Serce waliło mu jak oszalałe, lecz zdołał się opanować i kontynuował dzień, jakby nic się nie wydarzyło. Jeśli chciał zbadać sprawę, nie mógł wyglądać podejrzanie. Drżącymi rękami podniósł następny raport: \n\n> Ricardus Calisius, 28 lat, urodziła córkę, Ricardus Calisius \n\nCoś było nie tak. Spisek? Kampania dezinformacyjna? Zaczął gorączkowo przeglądać dokumenty: \n\n> Ricardus Calisius, 7 lat, rozpoczął naukę w XXII Szkole Podstawowej \n> Ricardus Calisius, 38 lat, rozwiódł się z żoną, Ricardusem Calisiusem, 35 lat \n> Ricardus Calisius, 22 lata... \n\nWyglądało na to, że niemal każdy raport z Dzielnicy Barbarzyńskiej był taki sam. Musiało chodzić o coś wielkiego, coś... znacznie powyżej jego grupy zaszeregowania. Dominicus westchnął, osunął się na krześle i wrócił do sumiennego zapisywania wydarzeń z życia każdego z nowych Ricardusów."
calisia.152.a: "Przynajmniej nie musiał zajmować się finansami."

calisia.153.t: "Senat odrzucił ustawę!"
calisia.153.desc: "W rozczarowującym obrocie spraw Senat Calisii odrzucił projekt ustawy. Pomimo zdecydowanego poparcia frakcji wnioskodawców sprzeciw okazał się rozstrzygający, a przeciwnicy wskazywali na zagrożenie dla stabilności finansów i nadmierną ingerencję władz. Porażka projektu wywołała gorącą debatę i niezadowolenie obywateli domagających się zmian. Imperium idzie naprzód, lecz wołanie o reformy nie cichnie, zapowiadając kolejne polityczne starcia."
calisia.153.a: "Następnym razem ich dopadniemy"

calisia.154.t: "Spisek został wykryty!"
calisia.154.desc: "Szok, niedowierzanie, zdumienie! Niewiarygodne wieści wstrząsnęły Calisią: rozeszła się wiadomość o planowanym zamachu na Cesarza. Z przecieków wiadomo jedynie, że Ricardus Calisius w jakiś sposób odkrył spisek, który mógł kosztować go życie. Co gorsza, podobno stało za nim wielu wysoko postawionych senatorów i oficerów Gwardii Pretoriańskiej, z samym prefektem na czele! Cesarz z pewnością zachowa teraz znacznie większą czujność i bez wątpienia będzie musiał ponownie ocenić swoje priorytety. Los \"najwierniejszych\" strażników Cesarza wisi na włosku, a sam Marcus Vinicius zapowiedział, że w razie potrzeby będzie czuwał nad Ricardusem nawet nocą. Legioniści zastąpili pretorian, a środki bezpieczeństwa w Pałacu podniesiono do takiego poziomu, że nawet duch nie przemknąłby niezauważony."
calisia.154.a: "O rety..."

calisia.155.t: "Terror z Mechanicus Majoris"
calisia.155.desc: "W zagłębiu Dabrovii wybuchł niespodziewany bunt pod wodzą słynnego gladiatora Lucasa Lituanusa, który ogłosił się nowym Spartakusem. Powstanie, nazwane już przez media powstaniem niewolników, zrodziło się z nieustającego terroru i niesprawiedliwego traktowania niewolników oraz klasy robotniczej przez frakcję Optymatów.\n\nLituanus, niegdyś zniewolony gladiator, stał się symbolem oporu przeciw tyranii. Dzięki strategicznemu talentowi i charyzmatycznemu przywództwu zjednoczył różnorodną koalicję niewolników, chłopów i obywateli pozbawionych praw. Iskrą buntu była brutalna rozprawa z opozycją oraz bezwzględna polityka, która pogrążyła ludność w rozpaczy i nędzy. Doniesienia z regionu wskazują, że spartakiści szybko opanowali kluczowe punkty przemysłowego zagłębia Dabrovii, wykorzystując znajomość terenu oraz szerokie poparcie miejscowych. Optymaci stoją teraz przed poważnym wyzwaniem, gdyż bunt grozi wykroczeniem poza granice zagłębia.\n\nPowstanie obnaża narastający sprzeciw wobec tyranii elit. Gdy Spartakus gromadzi kolejnych zwolenników, Imperium musi stawić czoła rosnącemu zagrożeniu albo zaryzykować pełnoskalową wojnę domową. Oczy całej Calisii zwrócone są ku zagłębiu Dabrovii w oczekiwaniu na dalszy rozwój kryzysu."
calisia.155.a: "Niewolnicy? Wolni? Wyobrażacie to sobie?"

calisia.156.t: "Bachanalia"
calisia.156.desc: "O bogowie, co za popierdolona noc - zawołał Bohdanus Lasuca. Nikt nie wiedział, jak się tu dostał ani czy w ogóle powinien jeszcze żyć. Nie miało to jednak znaczenia. Fontanny przelewające się winem wypełniały pałacowe powietrze tak intensywnymi oparami, że wystarczał jeden głęboki wdech, by się upić. Korowód dostojników, prostytutek i pozornie przypadkowych ludzi sunął po lepkiej posadzce, potykając się o zalanych w trupa biesiadników i śpiewając łamaną łaciną: \"CONDUCTORE GRATIOSUS, NON VARSOVIAE INGLORIOSUS\". Silvius Iacobinus dryfował na lectusie po basenie, próbując dopłynąć do dwóch konkubin po drugiej stronie i używając kitary zamiast wiosła. \n- Nie tutaj, nie tutaj, ty reformatorski odpadzie postmariuszowski! - krzyknął Hvedorcus, odciągając Caletusa od krawędzi fontanny za poplamioną szkarłatem togę. - To fontanna z winem! \n- Milcz, ścierwo! Jestem senatorem i żaden plebejski lizodup-sandał nie będzie mi mówił, gdzie mogę szczać! Ubi sum, ubi mingo! Ave Imperator Calisius! \n- Skoro mowa o Cesarzu, widzieliście go? - zapytał Vinicius, oddając się kolejnej rundzie siłowania na rękę. \n- Nie mam pojęcia... AAAA! - odparł jego przeciwnik, senator o niewielkiej sławie i jeszcze mniejszej masie mięśniowej. - Ostatnim razem myślałem, że poszedł odpocząć z konkubinami. \n\nCoś ciężkiego wpadło do fontanny. - Mówiłem ci, cycerońska małpo! Niech Bachus przeklnie cię kamieniami młyńskimi w nerkach! \n- Nie podoba mi się to. To zbyt dobra okazja do przewrotu - zauważył Compa. - Chodź ze mną. - Skinął na potężnego niewolnika - albo wyzwoleńca, nikt już nie pamiętał - trzymającego wielki wachlarz ze strusich piór. \n- Och, nie psuj staruszkowi zabawy. - Legionista upił z pucharu. - Jedyne, co mu grozi, to impotencja. \n- Lepiej dmuchać na zimne. Co najgorszego może się stać? \n - Powiem ci: pomyli cię z konkubiną! \nGdy senatorowie wybuchnęli śmiechem, przy głównym wejściu rozległo się zamieszanie. Nagle wkroczył szereg strażników, a ponad ich głowami, unosząc się i opadając niczym na łagodnych falach, spoczywał Calisius - jakimś cudem brodaty - z udźcem jagnięcym w jednej ręce i amforą w drugiej. Niosący go tłum wiwatował i śpiewał radosne pieśni we wszystkich językach spotykanych w granicach Calisii. \n- Wybaczcie, szlachetni senatorowie - zawołał Calisius. - Nie mogłem jednak zbyt długo zostawiać ludu głodnego i spragnionego. Sądziłem, że zdołam pozostać incognito, ale chyba jestem zbyt rozpoznawalny! \n - Martwiłem się, o Imperatorze! - Compa podszedł do Cesarza i przemówił mu do ucha. - Nie osiągnęliśmy jeszcze ostatecznego porozumienia. Kto wie, co mogą knuć pretorianie? Occasio furem facit. \nCalisius uśmiechnął się łagodnie. \n- Większość z nich jest pijana, a obecni tutaj będą zajęci tłumem, podczas gdy tłum zajmie się winem, jedzeniem i niezobowiązującym seksem. Nie ma już nikogo, czyja obecność mogłaby... wpłynąć na nasze negocjacje z zewnątrz. Andreasie, każ służbie zebrać wszystkich senatorów, których zdołają znaleźć. Jeśli będzie trzeba, wymoczcie ich we frigidarium. Spotkamy się w wewnętrznej części pałacu. \n\nKonsul Compa, jakimś sposobem zaskoczony, zdołał jedynie krótko skinąć głową. Gdy tłum się rozproszył, szukając resztek, Calisius zszedł na ziemię, ruszył w eskorcie ochroniarzy i mruknął do Viniciusa:"
calisia.156.a: "A teraz niech rozpocznie się prawdziwa uczta."

calisia.157.t: "Senat żąda!"
calisia.157.desc: "NIE PISAĆ TEGO"
calisia.157.a: "Napisałem"

calisia.158.t: "Do Najjaśniejszych Senatorów Calisii..."
calisia.158.desc: "Cytując Sokratesa:\nChędożcie się."
calisia.158.a: "Podpisano: Marcus Vinicius."

calisia.159.t: "Przypowieść o Mariusie" 
calisia.159.desc: "Piątkowe popołudnie. Złoty blask kalizjańskiego zachodu słońca wpadał przez uchylone okno biura, dając zbyt mało światła, by nie warto było zapalać lamp, lecz zarazem dość, by lektura stała się uciążliwa. Większość pracowników poszła już do domów na weekend, ale nie Marius. To on miał pecha zajmować się zaległymi wnioskami o utworzenie nowych Collegiów, pozostawionymi przez poprzedniego urzędnika.\n\nCzytając leżący przed nim projekt, bezmyślnie stukał gumką o mocno sfatygowane drewniane biurko. Collegium Szambonurków... Nie potrafił zrozumieć, dlaczego potrzebna byłaby organizacja o tak wąskiej specjalizacji. Pomyślał:\n\n - Ilu szambonurków jest w całej Calisii - dziesięciu? Czy nie podlegaliby Collegium Hydraulików?\n\n Zmarszczył brwi, próbując sformułować choć trochę sensowne uzasadnienie odmowy. Technicznie wniosek wypełniono prawidłowo, każdą kropkę postawiono nad \"i\", każdą poprzeczkę nad \"t\"... lecz coś mu w nim nie grało. Ostatecznie odrzucił go z powodu \"pokrywania się z zakresem innego collegium\".\n\nPrzebrnięcie przez tę jedną kartkę zajęło mu około piętnastu minut. O pięć dłużej niż poprzednio. Albo zwalniał, albo wnioski zaczynały go wykańczać... choć czy nie oznaczało to tego samego? Drżącą dłonią sięgnął po kubek kawy. Może wypił ich dziś zbyt wiele, ale to bez znaczenia. Wciąż czekał na niego schludnie ułożony stos papierów.\n\nMarius sięgnął więc po następny dokument z całą elegancją pijaka spod osiedlowego sklepu i podsunął go zmęczonym oczom. Najpierw dostrzegł \"Collegium Wielbicieli Zenonasa Ianniciusa\". Finansowany przez państwo fanklub? Z ciężkim westchnieniem chwycił pióro i napisał odmowę z powodu niespełniania kryteriów collegium. Ten wniosek był na szczęście prosty, lecz następny... \"Collegium Fanów Zenonasa Ianniciusa\" zepsuło krótką chwilę zadowolenia. Marius z westchnieniem napisał drugą odmowę, pod każdym względem identyczną z poprzednią.\n\nSięgając po kolejny wniosek, poczuł ścisk w żołądku. \"Collegium Dysput Filozoficznych\". Zastanawiał się przez chwilę. Brzmiało naprawdę sensownie. Sprawdził bazę danych - nie utworzono dotąd żadnego podobnego Collegium, dokumentacja się zgadzała... więc zatwierdził. Trzeci wniosek przyjęty tego dnia spośród kilkudziesięciu. Do końca zmiany zostało kilka minut. Marius upił łyk dawno zimnej kawy i podniósł ostatnią propozycję na dziś."
calisia.159.a: "\"Collegium Zwolenników Zenonasa Ianniciusa\"."

calisia.160.t: "Znalezione, nie kradzione"
calisia.160.desc: "Bernardusie, zejdź z tej cholernej kanapy! W magazynie przy Via Aquilae rozdają rzeczy za darmo! \n - Nie zadręczaj mnie, kobieto! Za żebraka mnie masz? Idź sama, skoro tak ci zależy. I przynieś mi przy okazji kiełbasę! \n\nPo trzydziestu wspólnych latach Iustina wciąż nie rozumiała, dlaczego poślubiła tego wulgarnego gbura. Mimo wszystko zmiana otoczenia i okazja do wyjścia z domu dobrze jej zrobią. Choć stare kości skrzypiały znacznie częściej, niż chciała przyznać, rześkie powietrze i rzadka chwila spokoju działały niezwykle kojąco. Przez całą drogę wpatrywała się w pomarszczonych dłoniach w plakat promujący akcję. Stoły uginały się na nim pod górami restauracyjnych posiłków, wylewających się ze wszystkich czterech stron i natychmiast uzupełnianych z niewyczerpanego rogu obfitości, zawsze równie apetycznych. Myślała o przysmakach, których nigdy nie mogła spróbować przy swoim mizernym budżecie. Apetyt domagał się czegoś bardziej wyrafinowanego niż zwykły kotlet, rozgotowane ziemniaki i okazjonalna zupa pomidorowa w szczególnie śmiały dzień. Choćby tylko raz wreszcie zje sycący posiłek, a mąż nie dostanie ani kęsa - dokładnie na to zasłużył. \n\nDziurawa pamięć nie pozwalała Iustinie przypomnieć sobie dokładnego adresu, lecz krzyki słyszalne z niemal kilometra skutecznie ją prowadziły. Okolica wyglądała na podupadłą, a neon witający potrzebujących obywateli ledwie migotał, lecz nic nie mogło się równać z pandemonium w środku. Rozbite talerze, pozrywane tapety, ludzie okładający się o resztki nogami wspomnianych stołów. Wszystkie prawdziwe skarby magazynu dawno wyszarpali szczęśliwcy, którzy przybyli pierwsi. A może od początku nie było tam żadnego jedzenia? Teraz naprawdę trudno było to stwierdzić. \n\nKierując się wyłącznie instynktem, Iustina wbiegła prosto w oko cyklonu, zdzieliła torebką kilku pechowców i chwyciła pierwszy znaleziony przedmiot. Zanim ktokolwiek zauważył, że trzyma coś wartego więcej niż pięć sestercji, opuściła miejsce najszybszym półtruchtem, na jaki pozwalały obolałe stawy. Nadeszła pora obejrzeć zdobycz."
calisia.160.a: "Żarówka. W sumie nieźle. Może nawet da się dostać za nią denara."

calisia.161.t: "Libatio apud Legati"
calisia.161.desc: "Wywiad robiony do lokalnej telewizji miał być strzałem w dziesiątkę nowego ambitnego dziennikarza Dariusa, ale jego research potencjalnych rozmówców już nie był tak dokładny. Liczył na inteligentną rozmowę a musiał się zniżyć do bardzo niskiego poziomu, żeby wyciągnąć cokolwiek z legionisty, z którym rozmawiał na terenie obozu wojskowego na Polach Marsowych. Nie było to jednak proste zorganizować taką rozmowę, wpierw musiał ubiegać się o trzy różne pozwolenia, a na końcu i tak całej konwersacji bacznie przysłuchiwał się jeden z urzędników frakcji Optymatów który kontrolował całą rozmowę.\n\n- Jakbyś określił sytuację wewnętrzną w Legionie?\n- Generalnie dobrze robią, jest elegancko, ale problem taki że w zasadzie to nie mamy pieniędzy no, ostatnio dwóch chłopaków musiało samemu sobie wykombinować pancerze bo...\n- Warunki, które muszą znosić nasi obrońcy, są absolutnie niedopuszczalne! - przerwał urzędnik Optymatów, wtrącając się do rozmowy - Państwo musi zapewnić dodatkowe środki, abyśmy mogli spać spokojnie i bez lęku przed najazdem, ufając, że ci dzielni patrioci nieustannie czuwają nad zagrożeniami zewnętrznymi i wewnętrznymi.\nBUM BUM BUM BUM.\nPo całym placu rozszedł się dudniący odgłos.\n\n- Sami musicie płacić za wyposażenie? - Darius próbował kontynuować.\n- No właśnie! Też myślę, że to głupie. Powinniśmy dostać więcej fundamentuszy czy jak to tam się nazywa. Kasy. Szmalu. Więcej floty dla zbrojnej hołoty, kumasz?\n- Czyli... mówi pan, że to problem logistyczny?\n- Nie, nie, według mnie to w ogóle nie jest logiczne. Słuchaj - cholera, widziałem nawet, jak chłopaki wynosili krzesła z koszar. No weź! Po cholerę komu krzesło? Nawet wygodne nie jest.\nI słowo stało się ciałem. Jak na zawołanie przez okno koszar wyleciało krzesło. Chwilę później przez świeżo powstałą dziurę wypadł jeden z legionistów. Z wnętrza budynku dobiegała już wyraźnie łomocząca muzyka. Darius wcześniej zastanawiał się nad źródłem wstrząsów, lecz teraz wiedział, że odpowiadał za nie DJ Bassus Maximus. Cała impreza mieściła się w kadrze kamery rozstawionej przez dziennikarza na placu. Widząc to, urzędnik natychmiast gestem nakazał odwrócić kamerę i kontynuować, jakby nic się nie stało.\n- Łooo, Hubertusa poniosła libacja gaulicyjska, ale czad. - Legionista duchem był już z kolegami w środku.\n- Jak więc państwo widzą, biednym legionistom brakuje nawet okien w koszarach. Jak mają przetrwać zimę i zachować siły do obrony kraju? - Urzędnik Optymatów wciąż pozostawał niewzruszony i nic nie mogło skłonić go do zmiany stanowiska."
calisia.161.a: "- Ale szczerze mówiąc, możemy wyciąć ten fragment?"

calisia.162.t: "Doktryna dekadencji"
calisia.162.desc: "Choć ojciec Vladislaus usiłował emocjonalnie przygotować się na tę chwilę, długa podróż do rodzinnej parafii okazała się przytłaczająco sentymentalna. Gdy wóz podskakiwał na polnych drogach prowadzących do niepozornej wioski Roscia, każdy budynek, każde pole i drzewo pamiętające czasy sprzed wygnania wywoływały falę wspomnień. Zabawy z kurami, gdy matka wołała go na kolację, przejażdżki rodzinnym traktorem z ojcem, a potem dzwony; ich bicie wzywające go na cotygodniową mszę. Ten dźwięk i osobista bliskość z Bogiem skłoniły go do zerwania z rodzinną tradycją i poświęcenia się kapłaństwu. W pierwszych latach wszystko wydawało się tak proste. Nie zależało mu na ogromnym szacunku ludzi, lecz widok ławek wypełniających się podczas kazań milczącymi wiernymi ogrzewał serce młodego duchownego. Potem trzoda zaczęła topnieć niczym włosy na jego głowie. Często zastanawiał się, gdzie popełnił błąd. \n\nGdy zbliżył się do kościoła, który nazywał domem, słaba woń alkoholu i wymiocin sprowadziła ojca Vladislausa na ziemię. Z każdym krokiem napaść na nozdrza stawała się brutalniejsza i plugawiła jego powrót. Całe otoczenie, w tym resztki skromnego ogrodu parafialnego, pokrywały puste butelki taniej gorzałki, karafki po winie i... nie odważył się patrzeć dalej. Czuł, że już sam widok niektórych zdeprawowanych przedmiotów pozostawionych przez poprzednich lokatorów mógłby skazić jego duszę. Wbrew rozsądkowi ruszył dalej i dotarł do drewnianych drzwi kościoła, ledwie trzymających się futryn. Na całej długości wyryto napis \"WŁASNOŹDŹ BACHANTUF\", obok imponującej kolekcji obscenicznych rysunków. Przecisnął się do duchowego sanktuarium, przemienionego przez nieczystą sektę w jaskinię najgłębszej degeneracji. Z rezygnacją zaczął oczyszczać najbardziej możliwy do uratowania kąt, o ile o którymkolwiek można było tak powiedzieć. Butelki, kolejne butelki... uch, miał nadzieję nigdy nie dowiedzieć się, czym była nieznana substancja oblepiająca jego palce. A to... nie, do cholery, czy na podłodze leżały zapomniane zwłoki? \n\nObawiając się najgorszego, ojciec Vladislaus lekko szturchnął tors trupa. Pochłonięty paniczną myślą, jak właściwie zgłosi śmierć władzom cesarskim, kapłan nie zauważył, że ciało odzyskuje siły życiowe. \n\n- Ej, wielmożny panie! Przynieś no wina, co? Umieram tu z pragnienia. \n- Wynoś się, pijaku. - Duchowny poczuł odrazę do stojącego przed nim ucieleśnienia grzechu. - Wróć, kiedy wytrzeźwiejesz, a pomogę ci odnaleźć drogę ku światłu. \n- Pijaku? Żebyś wiedział, ty zniewieściała kieckowa pizdo, że jestem przedsta... przedstawi... przedstawicielem największego Kościoła w Imperium. Okaż więc szacunek i przynieś mi wino, bo inaczej... - Zasnął ponownie w połowie groźby."
calisia.162.a: "Przynajmniej łatwiej było go usunąć."

calisia.163.t: "Rytuały przodków"
calisia.163.desc: "- Z radością oznajmiamy, że będziecie pierwszą parą, której ślubu udzieli nasz nowy Pontifex. Proszę wstać do ceremonii. \nDo sali wszedł jakimś sposobem oszołomiony młodzieniec w kapłańskiej todze, trzymający smartfon. \n- Oglądasz zdjęcia gotek? - zapytał pan młody. \n- Nnie, wcale... - Zaczął nerwowo przebierać palcami i otworzył Google. - Próbuję tylko znaleźć dokładnie, jaki rytuał mam odprawić. \n- Masz na myśli... ślub? \n- Tak, tak, wiesz, jestem tu trochę nowy. Uciekłem z Choroscium zaledwie tydzień temu, a gdy tylko tu dotarłem, powiedzieli mi, że mam kontakt z boskością. \n- To... chyba świetnie - powiedziała panna młoda. \n- Dzięki. Nie czuję się szczególnie kompetentny, ale... O, tu jest coś dobrego! - zawołał. - Spójrzcie... Czy jest z nami matka panny młodej? \nZ tyłu wystąpiła starsza kobieta. \n- Świetnie. A więc... Proszę trzymać pannę młodą najmocniej, jak pani potrafi. Tak, właśnie tak. Teraz ty - Pontifex wskazał pana młodego. - Musisz wydrzeć narzeczoną jej matce. \n- To znaczy... tak? - Chwycił pannę młodą za ramię i lekko pociągnął. \n- Nie, macie się naprawdę mocować. Siłą. A pani - wskazał matkę. - Musi trzymać ją z całej siły. Nie wolno puścić córki. Zaczynajcie! \n\nPan młody stał przez chwilę zdezorientowany, po czym pociągnął przyszłą żonę za obie ręce. Starsza kobieta ledwie utrzymywała równowagę, wciąż kurczowo trzymając córkę. \n- Ianusie, dlaczego tak stoisz? Pomóż mi! - zawołała męża. Stojący za nią korpulentny mężczyzna chwycił obie kobiety wielkimi, miękkimi, a zarazem silnymi ramionami. \n - Ej, synku, musisz ciągnąć mocniej - zawołał ojciec pana młodego. - Gdybym ja tak ciągnął, nigdy byś się nie urodził! \n- Stephanusie, zamknij się i pomóż mu! - warknęła żona. Ojciec wzruszył ramionami i pociągnął syna. \n\nPo chwili obie rodziny mocowały się na podłodze, a nowożeńcy zniknęli gdzieś pośrodku. Pontifex stał w kącie, przyglądał się widowisku i chichotał."
calisia.163.a: "- Chciałbym mieć gotkę, z którą mógłbym się mocować..."

calisia.164.t: "Bitwa na Forum nr 1"
calisia.164.desc: "Gdy ciepłe słońce prażyło otwartą platformę Forum Calisianum, Vel Alexandros otrzymał wreszcie chwilę na zebranie myśli. Może także na zwilżenie gardła. Nie potrafił znieść bezczelności swego przeciwnika, senatora Micusa. Nazywać brudnych cudzoziemców i barbarzyńców \"potencjalnymi obywatelami\"? Nie, nie mógł tego tolerować. Nie pozwoli na to. Kilka minut później, gdy tanie bębny znów zaczęły grać, ochoczo wstał. W tamtej chwili nie widział różnicy między sobą a przyjaciółmi z legionów, dzielnie broniącymi każdej kalizjańskiej wartości.\n\n- Patrzcie, rodacy, jak wieprz drzwi otwiera.\nZdrajca i żmija, co sprawę naszą pożera.\nPrawdziwi Kalizjanie, krew łączy nas w czynie.\nWięc sięgnijmy do sedna tego, z czego naród słynie.\n\nZ upadku Polonii naukę dziś mamy.\nNie każdy jest godzien wielkiej kalizjańskiej dramy.\nTylko wybrani, trudzący się wytrwale,\nMogą z naszą świętą ziemią złączyć się na stałe.\n\nNie każde nasienie w ogrodzie wyrośnie,\nKtóra roślina przetrwa, ogrodnik wie najprościej.\nStarannie dobiera się szczep, który z nami się splecie,\nTylko godnych otulą nasze więzi przecie.\n\nPewny siebie uśmiech, tak charakterystyczny dla Micusa, nie zniknął podczas słuchania. Część tłumu rzeczywiście wiwatowała, ale większość zaczęła tylko szemrać. Miał go w garści. Pozostało jedynie - pomyślał - zrobić krok i sięgnąć...\n\n- Senator, tchórz, przez ciebie wybrany.\nJak głośny i głupi może być ten pan nad pany?\nBo siła Calisii i jej moc wspaniała,\nNie we krwi, lecz w każdej godzinie się wykuwała.\n\nKażdy podatnik, każda dłoń, co buduje,\nKażde serce, które kulturę naszą czuje.\nKażdy może być Kalizjaninem, jasnym niczym świt,\nOd pana na szczycie po najniższy pionek i byt.\n\nCzemu bać się biednych, chętnych i sprawnych?\nCzy Imperium wzniesiono jak stajnię dla sławnych?\nKalizjanie to ludzie, nie hodowlany szczep.\nW tej prawdzie odnajdziemy wyzwolenia chleb!"
calisia.164.a: "Jedni wiwatowali. Inni głośno wyrażali swoje zażenowanie."

calisia.169.t: "XVI - Odwrócona"
calisia.169.desc: "Widowisko było spektakularne, być może bardziej, niż Cinastovicus kiedykolwiek sobie wyobrażał. To, co miało jedynie odsunąć od niego ewentualne podejrzenia, zakończyło się marszem ramię w ramię z samym Cesarzem, pod eskortą dwóch jego - ich - gwardzistów. Calisius pragnął prywatnie porozmawiać z Christianusem, a jakże wierny sługa mógł odmówić takiemu wezwaniu?\n\nWkrótce dotarli do drzwi pałacowej sali obrad. Była to bogata komnata, jak wszystkie pozostałe, ozdobiona wielkim stołem z o wiele większą liczbą miejsc, niż kiedykolwiek mogła się przydać, żywymi i zadbanymi roślinami oraz regałami pełnymi dzieł cenionych kalizjańskich autorów. Towarzyszący im gwardziści chcieli wejść za nimi, lecz powstrzymał ich szybki gest dłoni Cesarza.\n\n- To nie będzie potrzebne. Zaczekajcie na zewnątrz. Nie potrwa to długo.\n\nPo krótkim skinieniu i zaszeleścieniu pancerzy gwardziści wyszli, zamykając za sobą drzwi. Wierni do bólu, dobrze wyszkoleni i posłuszni, pomyślał. Cinastovicus nie był szczególnie zachwycony stojącym przed nim człowiekiem. Starzejący się, pulchny mężczyzna w wieńcu laurowym. Nie był wzorem silnego władcy, ale i tak należało się do niego uśmiechać. \n\n- Powiedz mi, Christianusie, jakie wino lubisz najbardziej? - Calisius przemówił, idąc ku pożądanej przez wszystkich chłodziarce na wino. Mówił jak do przyjaciela znanego od całego życia, tonem rzadko słyszanym u Cesarza, którego zwykle można było spotkać podczas wielkich historycznych przemówień albo pijackich kłótni.\n\n- Każde, które nie smakuje płynem do płukania ust ani nalewką z winogron - odparł Pierwszy Prefekt niemal instynktownie. Oczywiście miał swoje upodobania, jak każdy szanujący się obywatel, ale nie one były tematem rozmowy. A przynajmniej taką miał nadzieję. Czuł, że jego odpowiedź i tak nie miała znaczenia, gdy Cesarz odwrócił się z dwoma kielichami niemal po brzegi wypełnionymi cudownie głębokim czerwonym płynem.\n\n- Jakże skromnie, Christianusie. Proszę, pij. To Latium. - Cesarz ledwo powstrzymywał uśmiech, gdy Cinastovicus przyjął wino. Chwilę później mówił dalej. - Christianusie, pamiętasz pierwsze dni Calisii? Wtedy była tylko małym miastem, tak jak niegdyś Rzym. Byłeś przy niej od samego początku. Uważam, że już wtedy byłeś niezastąpiony, a dziś jesteś nim jeszcze bardziej. Chciałem osobiście podziękować za ten dowód lojalności. Wypijmy. Za wieczną Calisię! - Pretor uniósł kielich i się uśmiechnął, lecz nie z powodu komplementu. To już niewiele go obchodziło. Kielichem imitacji Latium Calisius przypieczętował własny los. Jego słowa jasno pokazały Cinastovicusowi, że tur utracił rogi. Myśl o Cesarzu, który po najmniejszym geście poparcia zaczyna rozczulać się nad podwładnymi, przyprawiała go o dreszcze. Nie był już człowiekiem, który wykuł Res Publica; stał się starym ramolem posiadającym więcej władzy, niż potrafił sobie wyobrazić. \n\nChoć takie myśli wirowały mu z tyłu głowy, Christianus odpowiedział bez chwili wahania:"
calisia.169.a: "I za twoje zdrowie, mój Cesarzu! Na zdrowie!"

calisia.2137.t: "Aposthasis"
calisia.2137.desc: "- Pizza przybyła, Cesarzu. \n- Proszę wejść i położyć ją na okrągłym stole w rogu. \n\nNiebo było ciemne, lecz spokojne. Szare chmury rozciągały się nad horyzontem i zasłaniały słońce, ale wciąż było dość jasno, by Calisius mógł bez trudu pracować przy biurku. Odłożył ocenzurowany dekret i wyjął z szuflady notatnik - próbę spisania wspomnień, z której nie był jeszcze szczególnie zadowolony, choć praca nad nią sprawiała mu przyjemność. \n\nKroki. Ciężki chód mężczyzny. Potem drugiego. Calisius podniósł głowę i zobaczył trzech oficerów pretorian, z pewną rezerwą wyciągających dłonie na powitanie. \n- Ave, Cezarze. W mieście wybuchły zamieszki. Pałac jest oblężony. Musimy przenieść cię do środka. \n- Kto was przysłał? \n- Jesteśmy twoją strażą, mój Cesarzu. Jestem optio Iulius Galienus z pretorian. Musisz być bezpieczny. Proszę iść z nami, nie mamy wiele czasu. \n- Nie widzę takiej potrzeby. Tutaj jestem bezpieczny. Możecie odejść. \n\nMężczyźni nie drgnęli. Calisius otworzył wspomnienia i przez chwilę rozmyślał, obracając pióro w dłoni. \n- Jeśli myślicie, by zabrać mnie siłą, nie róbcie tego. Proszę. - Sięgnął do innej szuflady i wyjął kunsztownie zdobiony gladius, dar samego Marcusa Viniciusa. - Wbijcie ostrze w moje serce i pozwólcie mi umrzeć jak Cesarz. \n\nPretorianie byli oszołomieni. Cinastovicus osobiście wybrał każdego z nich spośród ludzi łączących bezgraniczną lojalność wobec prefekta z największym zaufaniem Calisiusa. Nawet nie marzyli o zabiciu Cesarza - w przeciwieństwie do niektórych kolegów. To oni mieli zapewnić mu bezpieczeństwo i utrzymać pod kontrolą. Gdyby któryś z przywódców spisku naprawdę chciał pozbyć się Cesarza, zapewne musiałby najpierw pozbyć się właśnie ich. \n\nGladius spoczywał na biurku niczym przerażająca wróżba. Iulius Galienus sięgnął po niego i podniósł, tylko po to, by odłożyć jak najdalej od Cesarza. Przez chwilę trzymał go jednak w dłoni, oglądając kunszt srebrzystego ostrza i jego zdobień. \n\nKiedy nikły promień słońca przebił się przez chmury i odbił w ostrzu, Calisius zrozumiał, że wszystko dobiega końca. Zginie nie tylko jego tożsamość jako Calisiusa. Umrze również Ryszard Kalisz, a pozostanie wyłącznie pył. Przez ułamek sekundy próbował się targować. Czy gra może się na tym skończyć? Tak, bo to nie jest gra. Już nie. Tak jak on nie jest już Cesarzem. Tylko człowiekiem, który błądził, aż utknął nad krawędzią przepaści. \n\nZ zadziwiającą i niespodziewaną szybkością Calisius rzucił się ku oknu i przez nie wyskoczył. Jedną stopą zdołał oprzeć się o gzyms, lecz nie radził sobie z drugą. Pretorianie doskoczyli i chwycili Cesarza za togę. Szarpał się, próbując zrzucić ubranie. Jeden z żołnierzy złapał go za stopę. Calisius zdołał gwałtownie wyrwać nogę, ale stracił równowagę. Druga stopa ześlizgnęła się z gzymsu, a gdy Iulius Galienus pociągnął mocniej, purpurowa tkanina rozdarła się i półnagi Calisius runął w dół, z niedowierzaniem w oczach. \n\nNie było głośnego uderzenia ani makabrycznego widoku. Ricardus Calisius leżał płasko na plecach, nieprzytomny, a cienka strużka krwi wypływała z jego ust na ziemię Calisii."
calisia.2137.a: "I gdy wszyscy pragnęli końca gry, największa kość została (z)rzucona."

calisia.170.t: "Stare nawyki nie umierają"
calisia.170.desc: "Phaon... Nie było to imię, które wybrałby sobie sam, gdyby miał więcej czasu, lecz sprawdzało się dostatecznie dobrze i zapewne było bardziej rozpoznawalne. Łut szczęścia i spotkanie z Delągiem - to znaczy Viniciusem - zapewniły mu całkiem wygodną pozycję w strukturach Calisii. Wspominał niektóre z tamtych dni. Przemknęły w mgnieniu oka: spotkanie z Cinastovicusem, wstąpienie do Gwardii Pretoriańskiej... Na posterunku służył tak dobrze, że otrzymał tytuł Gubernatora. Wpatrywał się w dal, mniej więcej w stronę portretu Cesarza na ścianie swego całkiem wygodnego gabinetu, i niemal cieszył się chwilą ciszy i spokoju. Przerwało ją pukanie, wyrywając go ze wspomnień. Drzwi otworzyły się, ukazując górę mięśni, jednego z najbliższych przyjaciół Gubernatora, a obecnie jego zastępcę - Martinusa Ossadovicusa.\n\n- Hej, list do ciebie, od samego prefekta. Przyszedł dzisiaj razem z całą zwykłą makulaturą. Proszę.\n\nPhaon chwycił list i otworzył go nożem bagnetowym leżącym na biurku. Zaczynał się całkiem miło, nie brakowało formalności, lecz potem wszystko runęło, począwszy od słów: \"Z przykrością informuję, że pomimo pańskiej wybitnej służby pańska ranga w Gwardii Pretoriańskiej zostanie obniżona\". Coś zaczęło wrzeć pod powierzchnią jego opanowania. Ledwie nad sobą panował, gdy wybuchnął.\n\n- Za kogo uważa się ten gówniarz?! Kim myśli że ja jestem?! Wiernie służę Cesarzowi dzień w dzień i tak mi dziękują? Korupcja w moim regionie? Czy jego do reszty pojebało?\n\nMartinus ostrożnie podszedł i przejrzał list. Próbował wymyślić cokolwiek, co uspokoi przyjaciela i powstrzyma go przed zrobieniem czegoś komicznie pochopnego.\n\n- Może to nie było zaadresowane do ciebie? Znasz pogłoski o innych Gubernatores. \n\n- A do kogo? No powiedz, do Naimanusa, tego pozłacanego skurwysyna? Wiesz, że jest małym uczniem Cinastovicusa. Jego żałosnego tyłka nigdy nie spotka krzywda. Zwłaszcza za \"korupcję w szeregach\".\n\nPhaon wstał zza biurka i znów wczytał się w trzymany list. Cały wysiłek świata ledwo wystarczał, by nie rozerwał go na strzępy. Odwrócił się ku oknu i trzasnął częściowo zgniecionym papierem o parapet. Ze wszystkich sił starał się nie wykrzykiwać kolejnych uwag pod adresem Cinastovicusa i każdego z jego podwładnych. Doskonale wiedział, że zarzuty są fałszywe, ale nie miał pojęcia, dlaczego je sfabrykowano. Martinus odezwał się zza jego pleców:"
calisia.170.a: "- Hej, przynajmniej pozwolili ci zatrzymać gabinet."

calisia.171.t: "Nie mów nic złego" 
calisia.171.desc: "Najpierw pobrano mu odciski palców, potem wezwano na przesłuchanie w sprawie niedawnej kradzieży, a teraz był głównym podejrzanym w śledztwie - wyłącznie dlatego, że pracował w magazynie.\n\nDowody przeciw niemu wydawały się przytłaczające. Nagranie monitoringu przedstawiało kogoś łudząco podobnego do niego, skradającego się nocą po obiekcie. Na miejscu były jego odciski, a żona nie potrafiła powiedzieć, czy Stefanos spędził tamtą noc w domu. Z zewnątrz sprawa wyglądała na oczywistą. Niemal złapano go na gorącym uczynku podczas napadu tak nieporadnego i amatorskiego, że aż komicznego. Przynajmniej byłby komiczny, gdyby to on za niego odpowiadał.\n\nZaczynało burczeć mu w brzuchu. Spędził już pięć, może sześć godzin w pokoju przesłuchań kalizjańskiej komendy Gwardii Pretoriańskiej, przyparty do muru i sparaliżowany spojrzeniami dwóch starszych gwardzistów. Nigdy w życiu nie czuł się bardziej winny niż teraz, choć nie był nawet bliski winy ani żadnego współudziału.\n\nBrzęczenie lampy nad głową przypominało ogłuszający ryk, wwiercający się w czaszkę i powoli kruszący psychikę. Gdy wiercił się na niemal celowo niewygodnym krześle, odezwał się starszy gwardzista. Jego głos szorował uszy Stefanosa niczym papier ścierny.\n\n- Panie Stefanosie, naprawdę niewiele od pana chcemy. Prosimy tylko, by powiedział pan, gdzie ukryto ogień grecki. Jesteśmy gotowi wynegocjować krótszy wyrok, jeśli nam pan pomoże.\n\nPretorianin miał na twarzy najbardziej irytujący wyraz świata. Była w nim pewna doza samozadowolenia, jakby wiedzieli, że Stefanos nie odpowiada za kradzież, lecz i tak chcieli go pogrążyć. Czuł się wyśmiewany, jakby to wszystko było jakimś wypaczonym żartem. Choć pragnął obrzucić przesłuchującego wszelkimi możliwymi obelgami, westchnął i powtórzył słowa, które stawały się jego mantrą.\n\n- Jak już mówiłem, panie Savicusie, nie wiem, gdzie jest ogień grecki, ponieważ go nie ukradłem. Macie niewłaściwego człowieka! Moje odciski są na miejscu, bo to ja odpowiadałem za magazyn! Jak można tego nie rozumieć...\n\nGdy jego ton zaczął się podnosić, brutalne spojrzenie drugiego pretorianina natychmiast go uciszyło. Przesłuchujący był doświadczony i przeszkolony w budowaniu relacji, lecz tamten pozostawał zwykłym klawiszem, gotowym z przyjemnością pokazać mu miejsce. Kiedy Stefanos ucichł, przesłuchujący znów się odezwał, tym razem z gniewem, którego wcześniej w jego głosie nie było.\n\n- Panie Stefanosie, nie będziemy więcej tolerować takiego zachowania. To ostatnia szansa, by się przyznać. W przeciwnym razie wróci pan do celi.\n\nStefanos chciał dalej się wykłócać. Gdyby dostał możliwość, mógłby robić to godzinami, dniami, tygodniami, lecz miał już dość. Jaki był w tym sens? Mógł spierać się przez kolejną godzinę albo spędzić w więzieniu o pięć lat mniej, a przy dobrym sprawowaniu może jeszcze krócej. Choć całe ciało protestowało, skinął głową i przemówił.\n\n- Ja... Ma pan rację, panie Savicusie... To ja ukradłem ogień grecki.\n\nPretorianin uśmiechnął się, wyraźnie zadowolony z uległości. Rozkazał Stefanosowi wstać, odwrócić się i stanąć twarzą do ściany. Gdy jednak zakuwano go i wyprowadzano z pokoju, Stefanos dostrzegł jeden drobny szczegół. Skąd wiedzieli, że jego odciski znajdowały się na skrzyni z ogniem greckim, skoro podobno jeszcze jej nie znaleźli?" 
calisia.171.a: "Kolejny trybik wyrzucony"

calisia.172.t: "Niespodziewany przegrany"
calisia.172.desc: "Krzyki trwały już od godziny. Gdy Caletusa przyprowadzono przed Viniciusa, legat chciał usłyszeć ostatnie słowa konsula. Spodziewał się, że prymitywny członek Optymatów wpadnie w szał obelg, lecz nie sądził, że potrwa to tak długo. Teraz żałował, że zdjął więźniowi knebel.\n- Niedoszły aktorzyno! - Caletus wypomniał Viniciusowi przeszłość.\n- Piesku Cinastovicusa! - Vinicius odpowiedział ciosem.\n- Siphilius Maximus!\n - Dresiarzu w todze!\nGdyby na miejscu Caletusa znajdował się prefekt pretorian, zapewne już dostałby rękojeścią gladiusa. Jednak biegłość Caletusa we władaniu plugawym językiem sprawiała, że Vinicius nie potrafił nie odpowiadać. W dziedzinie obelg dostrzegł w więźniu godnego przeciwnika. Stawienie mu czoła stało się, można rzec, kwestią honoru.\n - Naprawdę zaszedłem ci za skórę - Caletus postanowił przejść do bardziej złożonej zniewagi. - Skoro tak szybko ruszyłeś pokonać mnie zamiast Cinastovicusa. Jego stolica znajdowała się praktycznie pod twoim nosem!\nLegat nie odpowiedział.\n- Nie wspominając o tym, że to jego pretorianie odpowiadali za śmierć twojego ukochanego Calisiusa - konsul wykorzystał dostrzeżone otwarcie. - Ja tylko cieszyłem się, że tyran zniknął.\n- Zajęcie Urbs wzmocniło moją legitymację - odparł legat. - Nawet półgłówek taki jak ty musi to rozumieć.\n- A więc nie jesteś honorowym wojownikiem, za jakiego propaganda kazała brać cię plebsowi, lecz kolejnym oślizgłym politykiem służącym sprawie krzywdzącej lud Calisii! Miłośnikiem barbarzyńców, który splugawił moje imię fałszywym twierdzeniem, że miałem coś wspólnego ze śmiercią Cesarza. - Caletus spojrzał z nienawiścią w oczy oprawcy i splunął. - Nie masz honoru! Rozwiąż mnie, a zatłukę cię pięściami i udowodnię, że wojownikiem również nie jesteś.\n- Ci tak zwani barbarzyńcy nie są nawet w połowie tak prymitywni jak ty - Marcus postanowił wreszcie zakończyć tę grę. - Zmarnowałeś dość mojego czasu. Nie muszę udowadniać siły ubijając Optymacką świnię. A jeśli chodzi o mój honor... - Vinicus przerwał. - Otrzymasz możliwość godnego opuszczenia tego świata, popełniając samobójstwo z własnej woli. Nawet to jest dla ciebie zbyt wielką łaską. Moi strażnicy odprowadzą cię do wyjścia."
calisia.172.a: "Optymaci już nie istnieją"


### SPRAWY GNIEŹNIEŃSKO-KALISYJSKIE ###

gniezno_szlachta.6.t: "Sojusz obrotowy"
gniezno_szlachta.6.desc: "Raport za raportem... Takie były plany chwalebnego Cesarza na dziś. Odkąd jego legioniści podbili ziemie za Prosną, ilość dokumentów, na które musiał poświęcać swój niezwykle dostojny czas, wzrosła ponad czterokrotnie. To, co niegdyś było lekko irytującym elementem dnia między śniadaniem a obiadem, stało się osią życia Ricardusa. Niemal znów czuł się jak prawnik... \nSiedząc na tronie - a raczej niezwykle ozdobnym fotelu wykonanym ręcznie przez miejscowego rzemieślnika - czytał i czytał. Raporty wszystkich ministerstw i instytucji zlały się już w bezbarwną masę. Podparł głowę dłonią i leniwym wzrokiem spojrzał ku drzwiom sali tronowej, gdzie dostrzegł jednego z pałacowych zarządców. Starając się nie okazać zaskoczenia, zerknął na zegar, by sprawdzić, czy nie zapomniał o spotkaniu, po czym odchrząknął.\n - Och! Wybacz. Nie słyszałem, jak wchodziłeś. Czego potrzebujesz?\nSługa podrapał się po głowie, nie wiedząc, jak zacząć, lecz wkrótce powiedział:\n - Przybył gość, mój Cesarzu. Twierdzi, że jest posłem z północnego Starostwa i przynosi wiadomość wielkiej wagi.\n - Posłaniec z Roty? Dobrze, wpuść go.\n\nSzybkim ruchem sługa wychylił głowę za drzwi i gestem zaprosił posła, wymieniając z nim kilka słów w języku, który Cesarz mógłby przysiąc, brzmiał jak polski. Ku jego zaskoczeniu do środka wszedł mężczyzna w żupanie i kontuszu, zwieńczonym bogato zdobioną czapką. Zrzucił ją, padając na kolana przed majestatem Cesarza. Zanim Calisius otrząsnął się z szoku albo zdążył sformułować pytanie, delegat przemówił.\n - Cesarzu Ryszardusie Kaliszjusie Pierwszy! Staję przed tobą w godzinie prawdziwej potrzeby. Tyran Przemysł III Gnieźnieński zagraża wolności i bezpieczeństwu Starostwa Koła. Sam starosta Kazimierz oferuje złożenie hołdu waszej Cesarskiej Wysokości w zamian za ochronę przed nadciągającym despotą!\nCesarz odłożył dokumenty i rozważył prośbę. Rota, czyli Koło, jak sami je nazywają, była całkowicie zdana na łaskę Res Publici - a właściwie jego samego. Słabości starosty nie dało się zaprzeczyć. Podporządkowanie jego państewka byłoby najłatwiejszym podbojem Calisii. Kto jednak zagwarantuje, że raz nielojalny poddany nie zwróci się ku innemu seniorowi, gdy jego ziemiom ponownie zagrozi najazd? Po kilku minutach głębokiego namysłu Cesarz ogłosił zdesperowanemu posłowi werdykt."
gniezno_szlachta.6.a: "Powiedzcie staroście, że zostaje Praefectus Urbi Roty."
gniezno_szlachta.6.b: "W Res Publice nie ma miejsca dla zdrajców!"

gniezno_szlachta.8.t: "Oddajcie Calisiusowi"
gniezno_szlachta.8.desc: "Nic nie jednoczy bardziej niż wspólny wróg. Co jednak dzieje się, gdy zostanie pokonany? Albo gorzej: gdy wspólny wróg okazuje się mięczakiem?\nTe pytania krążyły po głowie starosty Kazimierza Ilskiego, gdy rozmyślał nad swoim \"sukcesem\". Szukał ochrony Calisii przed rosnącymi ambicjami Gniezna. Liczył, że książę Przemysł zaatakuje go za zdradę. Wtedy mógłby wykazać się jako dowódca i kupić sobie trochę czasu. Okazało się jednak, że Piast z dyskontu nie chciał już być Kazimierzem I i postanowił odegrać Stanisława II Augusta. Umożliwiło to Calisiusowi natychmiastowe rozpoczęcie aneksji, której zwieńczeniem była obecna sytuacja: całkowite wcielenie Koła.\n\nJeszcze tego dnia przybyła kalizjańska delegacja pod wodzą legata Adalbertusa Solicovusa - wojskowego niepiastującego żadnego urzędu cywilnego. Był to jasny sygnał, że jeśli Ilski spróbuje odrzucić \"hojną\" ofertę Calisiusa, Koło zostanie rozprute przez żołnierzy.\nCała ceremonia musiała odbyć się w centrum miasta, by zaspokoić kalizjańską pychę i tradycje wiecowe mieszkańców Koła.\n- Ludu Roty! Amici! - zaczął Solicovus. - Aby lepiej chronić was przed obcymi najazdami i bezprawiem miejscowych urzędników, mądry Ricardus Calisius postanowił obdarzyć was zaszczytem stania się integralną częścią jego Imperium! Radujcie się! Wspólnie zbudujemy świetlaną przyszłość i ucywilizujemy otaczające nas dzikie ziemie! Nasi najlepsi legioniści ochronią was przed barbarzyńcami! Najbardziej cnotliwi spośród was będą mogli dostąpić godności senatorskiej i wpływać na przyszłość całego Imperium! Nie wspominając o niższych cenach cennych kalizjańskich towarów dzięki zniesieniu ceł! Nie lękajcie się! Nie ograniczymy waszych swobód! Pozostaje jedynie, by starosta Ilski okazał uległość, całując złotego tura Calisii!\nStojący obok Solicovusa Vexillarius rozwinął kalizjański sztandar. Część tłumu była oburzona nadchodzącym upokorzeniem. Widząc wahanie przyszłych Rotan, legat kontynuował.\n- Pamiętajcie, Calisius nie jest tyrańskim monarchą takim jak ten, przed którym was ocaliliśmy! W Calisii podziwiamy mądrych sąsiadów za ich republikańskie tradycje. Nie lękajcie się! Nie odbierzemy wam swobód ani praw! - Słysząc te słowa, tłum się uspokoił.\n - Sprzeciw byłby głupotą - pomyślał Ilski. Znał historię Rzymu aż nazbyt dobrze. Pamiętał też przedstawioną ofertę. Zachowa urząd gubernatora Koła, a on i członkowie jego rady otrzymają tytuł equites. Ilskiego zapewniono ponadto, że dzięki randze i wiedzy o Imperium Rzymskim jego awans na patrycjusza i senatora może zostać znacznie przyspieszony, jeśli tylko sobie tego zażyczy.\nWiedząc, że nie ma wyboru, pochylił się ku szkarłatowi Calisii i pocałował sztandar.\nLegioniści zagrali na trąbach, mając nadzieję zagłuszyć fakt, że wiwatowało tylko kilku mieszkańców Koła."
gniezno_szlachta.8.a: "To, co należy do Calisiusa"

gniezno_szlachta.10.t: "Kalizjańskie zwycięstwo w wojnie nad Wartą!" 
gniezno_szlachta.10.desc: "Zwyciężyliśmy! Nasze dzielne legiony wykorzystały odpowiednią chwilę i zaatakowały osłabionych panów feudalnych Gniezna, obracając ich wewnętrzne zamieszki na naszą korzyść. Przekroczyliśmy Wartę i zagnaliśmy ich w objęcia Plutona! Nie jesteśmy jeszcze gotowi na pełnoskalową wojnę, więc na razie to musi wystarczyć. Wykorzystamy zwycięstwo, przygotowując ostateczne uderzenie. Możecie być jednak pewni, że zadanie właśnie stało się łatwiejsze."
gniezno_szlachta.10.a: "CALISIA AETERNA VICTRIX!!!!" 

gniezno_szlachta.13.t: "Klęska w wojnie nad Wartą!" 
gniezno_szlachta.13.desc: "Nasze legiony nie zdołały przekroczyć Warty podczas niedawnej wojny z panami feudalnymi Gniezna. Obrona wroga okazała się wystarczająco silna, by odeprzeć wszystkie natarcia. Co więcej, zostaliśmy odrzuceni tak daleko, że nie można nawet mówić o powrocie do status quo. Nie jesteśmy jeszcze gotowi na pełnoskalową wojnę, więc musimy podpisać rozejm, wylizać rany i przygotować się do ostatecznego starcia. Niestety, zadanie właśnie stało się trudniejsze."
gniezno_szlachta.13.a: "Nihil novi" 

gniezno_szlachta.15.t: "Pat w wojnie nad Wartą!" 
gniezno_szlachta.15.desc: "Odważyliśmy się rozpocząć wojnę z panami feudalnymi Gniezna, lecz nie uzyskaliśmy żadnych znaczących zdobyczy. Na szczęście oni również nie. Obrona wroga wystarczyła, by odeprzeć wszystkie nasze natarcia, a nasze siły skutecznie powstrzymały każdy z ich ataków. Obie strony zgodziły się na rozejm, zanim konflikt zdąży osłabić oba państwa. Nie łudźmy się jednak - nadejdzie druga runda, a my będziemy gotowi. Zapewne oni także."
gniezno_szlachta.15.a: "Omnia quieta in fronte septentrionali" 
 

### PO CALISII ###

post_calisia.1.t: "Koniec wieczności"
post_calisia.1.desc: "Stało się najgorsze. Kolejny przełomowy etap w dziejach cywilizacji zaraz po Upadku Rzymu i Upadku Konstantynopola. Upadła Calisia. Nie jest do końca wiadomo jak dokładnie przebiegały ostatnie godziny oblężenia miasta, wiadomo tylko że widziano Ricardusa Calisiusa gdzieś w tłumie zagrzewającego obrońców do walki. Cesarz przepadł po tym fakcie. Oblężona stolica wytrzymała dość długo pod naporem hord barbarzyńskich. Ostatnią deską ratunku miały być legiony foederatii pod dowództwem Donaldusa Tusca które miały przynieść odsiecz otoczonemu miastu. \n\nWiadomo jedynie że germańskie wojska faktycznie zostały zmuszone do odwrotu, bramy miasta otwarto witając sprzymierzonych żołnierzy którzy przybyli uratować wieczne miasto. Ale zamiast triumfu wojsk Calisii rozegrała się rzeź. Ci, którzy mieli być wyzwolicielami spod jarzma barbarzyńców stali się ostatecznymi grabarzami Imperium. Wojska pod dowództwem Tusca spustoszyły stolicę doszczętnie. Pałac został przejęty, a w nim dzieci Calisiusa wzięte do niewoli zostały zmuszone do oddania hołdu Tuscowi, który mianował się królem Wenedów. Senat, wymuszonym prawem zatwierdził panowanie Tusca, który od tej pory stał się jedynym i niepodzielnym władcą Imperium. A raczej Królestwa. A niepodzielnym był może przez parę godzin, zanim w najdalsze zakątki cesarstwa nie dotarły wieści o upadku stolicy, które rozpoczęło proces fragmentacji potęgi Calisii.\n\nPosiadanie stolicy umierającego Imperium może mieć duże znaczenie w nowym świecie który wyłoni się spośród ruin...ale może okazać się nie być aż tak wielką zaletą jak mogłoby się wydawać."
post_calisia.1.a: "Żaden Cesarz nie powinien przeżyć swego Imperium."

post_calisia.2.t: "Wielka wędrówka ludów"
post_calisia.2.desc: "Wyniesienie na tron Tusca było kluczowym momentem dla hegemonii barbarzyńców nad neoantycznym światem Calisii. Nie tylko złamało to duch pozostałych obrońców Imperium, ale również doprowadziło do najbardziej zdradzieckiego traktatu od czasów paktu Ribbentrop-Mołotow. Nowo koronowany król Wenedów przydzielił wszystkim watażkom germańskim swoje własne poletko ziemii wykrojonej z truchła Calisii. \n\nNa samej północy, łupieżczy Jutowie otrzymali ujście rzeki Viadrus z ważną metropolią w Sedinum zapewniając im panowanie w tej części Mare Balticum. Od Veluntii po Cholbergę, wybrzeże Pomeranii Occidentalis stanęło w ogniu i padło łupem najazdów Jutów, nie po raz pierwszy w historii.\n\nFrankowie zasiedlili tereny w Germanii które opuścili Goci, a także dostali we władanie ziemie po drugiej stronie rzeki sięgające granic pokrywających się z Terrą Lebusaną, z grodami w Suebodinum, Landsbergum czy Piriseum, pomimo że swojej siedziby z Francofortum nie ruszyli. Teraz posiadają miasto po obu stronach rzeki, w końcu zjednoczone.\n\nSasi stali się jednym z większych hegemonów w regionie, gdyż nie tylko zasiedlili tereny Silesii Inferior sięgające aż po Lugidunum i Prasię Elysiorum, ale również udało im się odbić tereny Saksonii pogrążone w anarchii co dodatkowo wzmocniło ich pozycję.\n\nWandalowie oraz ich odłam, Silingowie zasiedlili całą Silesię od Budorgis aż po Catovicię, i teraz konglomerat tych dwóch plemion posiada wspólnie jedną z najsilniejszych gospodarek która ostała się w tym zrujnowanym świecie. Czas jedynie pokaże czy będą potrafili z tego skorzystać."
post_calisia.2.a: "Kolejny Drang nach Osten."

post_calisia.3.t: "Jeźdźcy na trupio bladych koniach"
post_calisia.3.desc: "Triumf German na zachodzie był niekwestionowalny, wszak to właśnie oddziały składające się głównie z ich plemion podbiły Calisię, ale druga wielka wojna rozgrywała się jednocześnie na wschodniej flance, na której miało miejsce o wiele mniej bitew, lecz nie mniej ważnych. Można pokusić się o stwierdzenie że to właśnie front wschodni niechlubnie zapisał się w annałach historii jako miejsce gdzie siano największe spustoszenie, gdzie całe miasta zostawały obrócone w perzynę, i gdzie straty po obu stronach w bitwach były ogromne, zostawiając niedobitki legionów gdzie łącznie potrafiło przeżyć jedynie ok. 10% całości wojsk.\n\nEstowie splądrowali ziemie aż po bramy twierdzy Mariaeburgum, zdobywając niemal cały region Borussii. Większość ich rekrutów stanowiła rosyjska ludność podporządkowana wcześniej Calisii i wyjątkowo brutalnie okupowana. Teraz role się odwróciły, a konfederacja plemion Estów dokonywała zemsty.\n\nNa samym południu panowali Scytowie, którzy z trzech sił wschodnich okazali się najmniej opresyjni. Wcześniej istniejąca silna populacja ukraińska na terenach Calisii sprawiła że Lublinum na szczęście nie podzielił losów innych miast spalonych przez najeźdźców. Na korzyść populacji lokalnej działało również małe zagęszczenie ludności. Nie oznacza to jednak że obyło się bez wojennej pożogi. Łupem Scytów padło chociażby miasto Rubrumium czy Zamoscia.\n\nNajgorszym jednak zwiastunem śmierci i pożogi była krwiożercza horda Hunów pod dowództwem Khana Khonoona I. Podlachię dotknął los gorszy niż tylko śmierć, gdzie zniszczenia wojenne sięgały ok. 90% zabudowy miejskiej, Albacliva przypominała obecnie gruzowisko, niezdolne do nazwania jej w jakikolwiek sposób miastem. Populacja uciekając w popłochu nie dała rady zbiec przed konnymi zastępami prowadzonymi przez samo wcielenie Hadesu jakim okazał się khan. Liczba zamordowanych ludzi przewyższa jakiekolwiek wyobrażenia o ludzkim okrucieństwie, a tereny po których przechodzi horda sprawia że planeta Mars wygląda jak lepsze miejsce do życia"
post_calisia.3.a: "Wschód upadł."

post_calisia.4.t: "Triumf Gotów"
post_calisia.4.desc: "Tak jak i przed laty, tak i teraz Goci stali się poskromicielami wielkiego Imperium. Ich układ z Tusciem pozwolił im przemierzać pola i równiny Imperium Calisii bez kresu, co doprowadziło ich ostatecznie aż do centrum kraju, gdzie założyli swoje nowe barbarzyńskie królestwa. Ograniczając plądrowanie do minimum, wydaje się że nowi włodarze tych ziem zamierzają tu zostać na dłużej, gdyż akcje osadnicze rozpoczęły się z pełną mocą.\n\nOstrogoci znaleźli się na uprzywilejowanej pozycji, bezpiecznie ulokowani pomiędzy rzeką Vistulą a Notisią, z potężnymi grodami pod ich kontrolą jak Bidgostia, Thorunia czy Vladislavia. Pomimo nieformalnego sojuszu z nowym władcą w Calisii, mówi się o tym, że ambicje króla Ostrogotów sięgają granic Wiecznego Miasta, i możliwe że już niedługo dojdzie do kolejnej wojny, tym razem pomiędzy barbarzyńcami.\n\nWizygoci z drugiej strony powędrowali wzdłuż rzeki Varty, gdzie założyli swoje królestwo. Ich granice ciągną się aż po pasmo Montes Calvi. Ich osiedlanie jednak spotkało się z dość silnym oporem ze strony lokalnej ludności, a największe walki toczą się obecnie o metropolię Navis której zachodnia część jest przejęta przez Gotów a wschodnia przez partyzantów należących do bojówek utożsamiających się z Królestwem Judy."
post_calisia.4.a: "Nie takich Gotów oczekiwaliśmy..."

post_calisia.5.t: "Spadkobiercy ludzkości"
post_calisia.5.desc: "Można zabić człowieka, ale nie można zabić idei. Ricardus Calisius poległ w obronie swojej ukochanej stolicy, miasto upadło, struktury Imperium przestały istnieć. Ale ludzie przetrwali. I to właśnie na barkach tych ocaleńców spoczywała misja zabezpieczenia dziedzictwa Cesarstwa Calisii. \n\nPrzed oblężeniem stolicy, większość skarbca została na szczęście ewakuowana do Constantii, gdzie gubernator Trascovicus hojnie zaopiekował się pozostałościami bogactwa Calisii. Dzięki temu miał również pretekst do ogłoszenia się cesarzem, co zrobił nie czekając na kogokolwiek. Uważając, że w jego rękach dzierży historyczny imperatyw cywilizacyjny i jest zmuszony przez otoczenie do działania, proklamuje on Cesarstwo Wschodniokaliskie przyrzekając, że pewnego dnia Calisia zostanie na nowo złączona w jedno. Okazało się to strzałem w dziesiątkę, gdyż uciekający dygnitariusze obrali sobie Constantię za jedyny słuszny kierunek azylu.\n\nAle Trascovicus nie był jedynym gubernatorem który miał podobny pomysł. Działając na fundamencie nazewnictwa, gubernator Pomeranii, Phaon Alnus ogłosił się spadkobiercą Calisii. Rezydując nomen omen w Nova Calisia, uważał że jest to jedyny prawidłowy model sukcesji. Calisię może zastąpić jedynie Calisia. Niestety jego ekscentryczny styl i skłonność do wulgarnych uniesień nie sprawia że traktuje się go poważnie w wyścigu o dziedzictwo Imperium.\n\nW Antecarpathii również miała miejsce koronacja, gdyż były działacz popularów i zarazem legat, Silvius Iacobinus ogłosił się Królem Kaliszan. Jest to zapewne oddzielna kategoria od ogłaszania się cesarzem, i jest to dość wyraźny spadek w prestiżu, ale Silvius uważa się za władcę ludowego, i że jego domeną są ludzie, a nie metafizyczne przedstawienie państwa jako podmiotu. Jakkolwiek by Silvius nie był istotnie wielkim królem-filozofem, tak jego skłonność do nadużywania alkoholu sprawia, że również nie traktuje się go zbyt poważnie.\n\nNajsilniejsze roszczenia do tronu Calisii mieliby oczywiście synowie Ricardusa, a w szczególności jego pierworodny syn, Ignatius. Ten po upadku Calisii zachował swe życie składając hołd Donaldusowi Tuscowi, i nawet udało mu się uciec z miasta, lecz wpadł z deszczu pod rynnę gdy udał się do miasta Nysa, gdzie lokalny garnizon koronował go na Imperatora od razu po wjeździe przez bramy miejskie. Niestety Silesię zalały hordy barbarzyńców, a Nissa została otoczona ze wszystkich stron. Jedno dzielne miasto wciąż powstrzymuje hordy piekła przed swymi bramami, lecz bramy zaczynają pękać, a przyszłość naszego Cesarza jawi się mrocznie i pełna jest grozy."
post_calisia.5.a: "Ilu jest tych Cesarzy?"

post_calisia.6.t: "Legio Aeterna Victrix?"
post_calisia.6.desc: "Legiony to straceńców los, tak też było niestety w przypadku większości najznamienitszych legionów Calisii które zostały posłane do walki z barbarzyńcami. Po upadku Imperium, te które nie zostały rozbite, rozwiązały się same. Ci jednak którzy pragnęli walczyć dalej o utracone ideały i straconą sprawę - organizowali się w coraz to większe grupy zbrojnych. Z całej machiny wojennej Imperium, w stanie gotowości bojowej i organizacyjnej przetrwały zaledwie dwa legiony.\n\nLegio I Alpha, wręcz legendarny oddział złożony z najwierniejszych i najbardziej zaprawionych w bojach żołnierzy, przeszedł szlak bojowy którego nie powstydziłby się nawet sam Aleksander Macedoński. Okupili jednak swoje doświadczenie bolesnymi stratami, gdyż oprócz sporej części weteranów, życie swoje za Imperium oddał również wybitny wódz pierwszego legionu - Marcus Vinicius. Obecnie legionowi udało się wycofać na sam skraj Montes Carpathii gdzie odzyskują siły i gromadzą niedobitków.\n\nNa Masurii przetrwał drugi z legionów - Legio XXXVII Fanatica, wsławiony w swoich bojach z Hunami, których powstrzymywali przez długi czas, jednakże ostatecznie po przegranej bitwe pod Acrimorum, los zdaje się obracać przeciwko legionistom. Pomimo, że legioniści spod znaku karasia heroicznie utrzymali Suvalca corridor, tak obecnie poprzez walkę na dwa fronty prawdopodobnie będą zmuszeni do odwrotu, gdyż w innym wypadku grozi im anihilacja."
post_calisia.6.a: "Tusc, oddaj mi moje legiony!"

post_calisia.7.t: "Północne możliwości"
post_calisia.7.desc: "Wzdłuż rzeki Vistuli aż do Mare Balticum za czasów Calisii spływały tony różnego rodzaju bogactw, wraz z innymi towarami eksportowymi. Te szlaki handlowe teraz zostały zajęte przez watażków, którzy próbują ratować swoje biznesy, lub po prostu pragną władzy, chcąc ocalić co tylko się da przed kolejną falą barbarzyńskich najazdów.\n\nJednym z głównych bogactw był bursztyn, w którym specjalizowała się spółka Aquilen (zaraz oprócz inwestycji naftowych). Dzięki wykorzystaniu infrastruktury w Plocensii, i ich szerokiej siatki kontaktów, udało im się ocalić wpływy w regionie, i stają się oni póki co pionierem wznowionego handlu pomiędzy pozostałościami imperium. \n\nGłównym respondentem tego handlu stało się Imperium Kartagdyni, które naśladując swój nazewniczy pierwowzór zajęło większość terenów przymorskich, praktycznie całkowicie przejmując morski przemysł imperium jak i całą flotę. W pomorskim Tripolis rodzi się nowa potęga, która jest bardzo chętna na zdominowanie całego regionu pod swoim sztandarem. \n\nLecz żeby to osiągnąć, na ich drodze stoi jedna dość absurdalna przeszkoda. W Sluchovii miała miejsce mistyczna ceremonia wyniesienia proroka do rangi bóstwa. Iaroslaus Ultimus ogłosił się cesarzem dni ostatnich, a wszystko to przypomina wręcz niebezpieczna sektę niźli przeciętnego watażkę. Nie mniej, Iaroslaus zamierza poprowadzić swoich popleczników na ostateczną bitwę z siłami zła, po której nastąpi apokalipsa i królestwo boże. A przynajmniej tak mu się wydaje."
post_calisia.7.a: "Sępy nad konającym trupem..."

post_calisia.8.t: "Daleko za Tatrami"
post_calisia.8.desc: "Zazwyczaj najspokojniejsze terytoria znajdowały się w górskich halach, tak też w zasadzie było w przypadku podboju gór przez Calisię. Nie było tam wielkich bitew, spektakularnych wydarzeń, ani heroicznych pojedynków. Veni, vidi, vici, i w zasadzie potem nastąpiła jedynie cisza. Ale polityka nie znosi pustki, i zaraz po tym jak spłonęła Calisia, lokalne garnizony postanowiły działać. By uchronić górskie grody od dewastacji postanowili wybrać ich własnego Imperatora. Padło na uwielbianego Roberta Makłowicza, który pozycję przyjął, ale tytułu już nie. Żeby nadać całemu bytowi trochę orientalnych przypraw, Makłowicz wziął na swoje barki ochronę ludności ormiańskiej, która w ostatnich latach masowo przybywała w te rejony, a że sam posiada korzenie ormiańskie, to stał się wręcz ichnim idolem.\n\nZ zamętu i chaosu skorzystali również Czesi, którzy to wyzwolili się spod jarzma niemieckich wpływów wyrzucając przez okno całe zwierzchnictwo z Berlina. W momencie jednak rozpadu Calisii poszli o krok dalej, i zdecydowali się przekroczyć granice nie ruszane od czasów II wojny światowej. I tak też Tessin oraz Glacium po raz kolejny stały się częścią Czech, a do kompletu dołączyły również terytoria Ricmondii oraz Leobschucium. Nie wydaje się żeby mieli jednak zwrócić tym razem te tereny..."
post_calisia.8.a: "Nadchodzi deszcz..."

post_calisia.9.t: "Sparta czy Spartakus?"
post_calisia.9.desc: "Spartańskie warunki sprawiają że wychowanie przybiera dość drastyczny przebieg, trudne i ostre środowisko co prawda zrobią z człowieka silnego wojownika, lecz kosztem słabszych jednostek. Te słabsze jednostki często okazywały się padać łupem krwiożerczej polityki Imperium która dopuszczała niewolnictwo. I właśnie to niewolnikami Calisia stała jako jeden z filarów ich gospodarczego dobrobytu. W nowoczesnym świecie jednakże tradycyjna niewola nie jest w stanie na dłuższą metę zaspokoić potrzeb społeczeństwa, a zniewolone grupy bardzo szybko staną się zorganizowaną organizacją która jest już tylko o krok od organizacji terrorystycznej.\n\nPrzemysłowe ziemie Dabrovii, Pinusy czy Osviecimii były wręcz centrum niewolniczej pracy, zakłady działały non stop, a niewolnicy umierali ze zmęczenia niczym w najgorszym obozie koncentracyjnym. Nic dziwnego też, że to właśnie na tych terenach powstała organizacja Związek Spartakusa, który odwołując się zarówno do ich antycznego pierwowzoru jak i niemieckiego naśladowcy, pragnęli zniszczyć całą niewolniczą machinę Calisii. Teraz gdy ona sama padła pod naporem swojego ciężaru, Lucas Lituanus przyrzekł że oswobodzi wszystkich ludzi, zarówno pod jarzmem postimperialnych watażków, jak i pod władaniem barbarzyńskich królów.\n\nSpartakus, Spartanie. W zasadzie to bardzo wszystko do siebie podobne, a tacy byli północni sąsiedzi Związku Spartakusa, którzy na bazie klubu sportowego Sparty Lubliniec oraz jednostek wojskowych zgromadzonych w mieście Lobin założyli całkowicie nowe społeczeństwo które miało na celu odtworzenie ideałów spartańskich. Jak można było się tego spodziewać, nie było to zbyt pobłażliwe dla swoich obywateli państwo, dlatego też szybko po powstaniu znalazło się na celowniku rewolucjonistów ze Spartakusa. Czy ludowo wyzwoleńczy niezłomny duch da radę przezwyciężyć fanatycznych wojowników hołdujących krwawym ideałom antycznej Grecji?"
post_calisia.9.a: "Molon labe."

post_calisia.10.t: "Gaulicyjski chaos"
post_calisia.10.desc: "Gaulicia. Nie ma tam Galów per se. Znaczy się są. Gaulician Confederation stanowi jeden z kluczowych elementów układanki postupadkowej Calisii południowo wschodniej. Odnosząc się jednak bardziej do Galicji niż do Galii, pod przewodnictwem Ricardusa Gaulusa…\nJakkolwiek mylące by to wszystko nie było, obywatele są jeszcze bardziej skonfundowani, lecz z trzech najnowszych frakcji, konfederacja wydaje się być naprawdę porządnym miejscem do życia, bez opresji, wojen i wyzysku.\n\nA propo wyzysku, na północ od Galicji, z konglomeratu partyzantek wywodzących się z klubu piłkarskiego Widzew Łódź, zostało utworzone Królestwo Judy, które co prawda swojego mesjasza jeszcze nie posiada, ale biorąc pod uwagę irracjonalność całej sytuacji, nikogo by to nie zdziwiło. Jednakowoż zajęci są oni walką o swoją ziemię świętą - czyli całkowitą kontrolę nad miastem Navis przeciwko Wizygotom. Z drugiej strony barykady jednakże czyha Cesarstwo Wschodniokaliskie które posiada ambicje odnowienia całego Imperium, więc królestwo Judy może już niedługo być maksymalnie malutką prowincją w wielkiej machinie po raz kolejny.\n\nNa antypodach boskiego państwa proroka Iaroslausa znajduje się równie dziwny twór który swe korzenie posiada w egipskiej mitologii. Wszak kopce znajdujące się na terenie miasta Cracovii to nic innego jak starożytne piramidy! Nie jest to może najbardziej spójna teoria naukowa ale nie przeszkodziła ona w utworzeniu Faraonatu Khraka, gdzie faraon spoczywa zmumifikowany i co prawda nie żyje, ale też przynajmniej nie rządzi. Niestety, w zamian rządzi wielki regent, wyrocznia i nadworny mag - Astram Psychos. Pozostaje tylko najważniejsze pytanie - czy uda się postawić Sfinksa na rynku?"
post_calisia.10.a: "A więc... gdzie jest Kleopatra?"

#### WYDARZENIA INFORMACYJNE ####

unification.31.t: "[GetNewspaper]Calisia jednoczy południową Wielkopolskę"
unification.31.desc: "Na antenie radiowej dla całej Wielkopolski przemówił nie kto inny jak Ryszard Kalisz. Każdy, kto przebywał w regionie, mógł jednak stwierdzić, że mówiący człowiek nie był już tą samą osobą, którą znano przed Upadkiem. Przyjął imię Ricardus Calisius, a wszystko wskazuje na to, że polityk pragnie stworzyć nowe Imperium Rzymskie w sercu Polski. Umiejętnie przeciągając na swoją stronę lokalne postacie polityczne i wprowadzając częściowo unowocześnione reformy rzymskie, stał się jednym z głównych graczy regionu. Armia legionistów, monety z podobizną Cesarza oraz marmurowe budowle, które wkrótce staną w niedawno zromanizowanych miastach, naprawdę dają wrażenie powrotu do odległej przeszłości. Czas pokaże, co wyrośnie z tego państwa pseudorzymskich rekonstruktorów. Nie ulega jednak wątpliwości, że nawet jeśli ich szaleństwo dobiegnie końca, polsko-rzymskie państwo zapisze się w historii jako kolejna pozycja na długiej liście osobliwości zrodzonych przez Upadek."
unification.31.a: "Ave Nero Polonicus?"

unificationreg.31.t: "[GetNewspaper]Calisia jednoczy Wielkopolskę" 
unificationreg.31.desc: "Poznań padł przed maszerującymi na północ legionami w kolejnej zwycięskiej wojnie Imperium Kalizjańskiego. Źródła na miejscu twierdzą, że miasto może wkrótce zasłużyć na status metropolii nie tylko z nazwy. Zamiast starych znaków drogowych i tablic na budynkach administracji pojawiły się już zlatynizowane oznaczenia nazywające miasto Posnanią. Dla większości świeżo włączonej ludności życie raczej się jednak nie poprawi. Zaszczyt zostania \"obywatelami\" Calisii spotyka jedynie nielicznych, a reszta trafia do niższej warstwy zwanej Wenedami, od starożytnej nazwy barbarzyńskiego królestwa istniejącego niegdyś na tych ziemiach. Niepokojące jest to, że osoby niepolskiego pochodzenia w tak zwanej Res Publice padły ofiarą niewolnictwa i systemowych represji. Wezwania ONZ do zaprzestania takiego traktowania, zwłaszcza obywateli niemieckich, pozostały bez odpowiedzi. W najbliższych miesiącach w Berlinie odbędzie się nadzwyczajny szczyt poświęcony tej sprawie."
unificationreg.31.a: "De nobis fabula narratur."

unificationsupreg.31.t: "[GetNewspaper]Calisia jednoczy północno-zachodnią Polskę"
unificationsupreg.31.desc: "Ofensywy Imperium Kalizjańskiego trwają. Tym razem ich celem było uzyskanie dostępu do morza i odcięcie reszty Polski od portów handlowych w Gdańsku i Szczecinie, przemianowanych niedawno odpowiednio na Gedanum i Sedinum. Podobnie jak na ziemiach wcześniej włączonych w struktury państwa, niezliczeni cywile padli ofiarą kalizjańskich represji. Nawet zagraniczne delegacje przybywające do stolicy o tej samej nazwie zostają okrzyknięte barbarzyńcami i traktowane znacznie gorzej od mieszkańców regionu. Nie wiadomo, czy instytucje europejskie zezwolą na handel z tym państwem pomimo starań o przyciągnięcie zagranicznych inwestycji. Choć niewielu chce to przyznać, z każdym dniem staje się coraz jaśniejsze, że pragnący otworzyć ambasadę w Polsce będą musieli wkrótce wyrzucić podręczniki języka polskiego i sięgnąć po komplet do nauki łaciny."
unificationsupreg.31.a: "Nie żeby sami Kalizjanie mówili nią lepiej."

super.31.t: "[GetNewspaper]Polska zjednoczona przez kalizjańskich Optymatów"
super.31.desc: "Po latach walk Polska wreszcie odpoczywa, ponownie w rękach konserwatywnej prawicy, lecz tym razem odzianej w nową warstwę purpury. Po masowych aresztowaniach, brutalnym podboju młodych państw za niemiecką granicą i niemal całkowitym wytępieniu wszystkich, którzy wciąż nosili znak tura, Imperium Kalizjańskie stoi zwycięskie ponad wszystkimi. Optymaci, jedna z frakcji kalizjańskiego Senatu, całkowicie skonsolidowali władzę i sprowadzili Cesarza do roli dumnego lwa w złotej klatce. Szlachta i patrycjusze w całym Imperium radują się, gdyż w nowej utopii ich władza nad plebejuszami i barbarzyńcami pozostaje nienaruszona - w utopii splamionej krwią dysydentów i wszystkich uznanych za niegodnych obywatelstwa. Oko Rysia nieustannie czuwa nad ziemiami jako ich zaprzysięgły opiekun i pan. Więcej insygniów nie dałoby się już chyba na nim zawiesić."
super.31.a: "Ave Caesar! Ave Imperium!"

super_a.31.t: "[GetNewspaper]Polska zjednoczona pod rządami kalizjańskich Popularów!"
super_a.31.desc: "Lud Calisii wiwatuje, gdy legioniści wracają z kolejnego triumfu, lecz tym razem okrzyki nie milkną. Sam Augustus Calisius powitał weteranów, gdy jego legiony wreszcie zjednoczyły Polonię. Z prawdziwie zjednoczonym Imperium, zahartowanym przez wszystkie przeciwności, Augustus Calisius spogląda z nadzieją na stojącego obok Princepsa Ignatiusa. Zdrowie Cesarza słabnie, lecz wie, że może powierzyć władzę ukochanemu synowi, który poniesie dalej jego chwalebne dziedzictwo. Za nimi stoi prawa ręka Imperatora, legat Vinicius, architekt cesarskiej potęgi wojskowej, z dumą patrzący na niezliczonych legionistów. Pokonawszy wszystkich politycznych przeciwników, dowiódł swej wartości przed Imperatorem. Za niezachwianą lojalność i wierną służbę otrzymał tytuł Princeps Senatus. Świat zewnętrzny może teraz jedynie patrzeć, jak nowe Imperium lśni jaśniej niż kiedykolwiek."
super_a.31.a: "Calisia Invicta! Populares Invicta!"

super_b.31.t: "[GetNewspaper]Powstał kalizjański triumwirat"
super_b.31.desc: "Imperium zostało ostatnio wstrząśnięte w posadach, gdy rozbawieni goście świętujący Idy byli świadkami tyranobójstwa wielkiego Augusta. Spisek najpotężniejszych ludzi w państwie, a mianowicie Princepsa Senatus Caletusa i Praefectusa Praetoriae Cinastovicusa, miał położyć kres tyranii Cesarza Ricardusa Calisiusa. Gdy władca bawił się wśród licznych gości, trzej spiskowcy w asyście wielkiego oddziału Straży Senackiej, legionistów i pretorian pochwycili Augusta i odebrali mu życie niezliczonymi ciosami sztyletów. Kalizjański triumwirat narodził się z tyranobójstwa. Gdy cesarska krew wsiąkała w bruk, spiskowcy rozeszli się, by dokończyć przejmowanie władzy. Większość obywateli opłakuje śmierć Przywódcy, lecz niektórzy cicho pytają, czy ten niepewny sojusz przetrwa i czy przed końcem kryzysu nie popłynie jeszcze więcej krwi."
super_b.31.a: "Trzy razy Ave dla trzech Triumwirów..."

super.311.t: "[GetNewspaper]Polska zjednoczona pod rządami kalizjańskich pretorian!"
super.311.desc: "Wiele wody upłynęło w Prośnie, odkąd przewrót pretorian zakończył rządy Imperatora Ricardiusa Calisiusa. Junta pod wodzą Praefectusa Praetoriae spotkała się wówczas z chłodnym sceptycyzmem i kryzysem wynikającym z braku jakiejkolwiek rzeczywistej legitymacji. Dziś wszystkie wątpliwości rozwiał jednak wiatr wiejący nad rozległymi podbitymi ziemiami. W kalizjańskiej stolicy odbyła się wielka uroczystość, podczas której Christianus Cinastovicus ogłosił zjednoczenie wszystkich ziem Polonii. Trzy głośne okrzyki \"Ave!\" odbiły się echem po mieście, nim potężna parada ruszyła pośród wiwatów rozentuzjazmowanych obywateli. Po zjednoczeniu ziem Praefectus Praetoriae kieruje wzrok do wewnątrz. Straż nie może rządzić sama, bez względu na to, ile fałszywych uśmiechów wymusi na ludności. Aby zabezpieczyć dziedzictwo, Cinastovicus musi znaleźć wspólnika. Kto nim zostanie - o ile w ogóle ktoś - pozostaje tajemnicą."
super.311.a: "Ave Polonia Praetoria!"

calisia.1000.t: "Kalizjańska Góra"
calisia.1000.desc: "Na arenie gladiatorskiej pojawiła się wybitna jednostka. Ogromnej postury wojownik który pokonał wszystkich na swojej drodze i został czempionem całej Calisii. Ricardus Calisius widząc jego wyczyny stwierdził jedno - ten człowiek jest ponad walki na arenie. Cesarz zszedł do niego po ostatniej walce i zaproponował mu propozycję nie do odrzucenia - pozycję jako dowódca jednej z kohort. Gigant był zamaskowany, więc nie wiadomo było kim on jest. Ale klękając przed cesarzem odsłonił swoje oblicze - był to legendarny Marius Pudianus. Jak trafił w to miejsce, nie do końca wiadomo, po upadku metropolii Navis, krętymi ścieżkami został gladiatorem. Ale teraz chętnie wykorzystamy jego potencjał, w końcu dowodził on już armiami księstwa Ellander, a taka postać nie może zostać zmarnowana. "
calisia.1000.a: "Teraz nie będziemy się cenić zbyt nisko."

calisia.2000.t: "[GetNewspaper]Przewrót Pretorian w Imperium Calisianum!"
calisia.2000.desc: "Gdy słońce zachodziło nad Imperium Calisianum, a Wieczne Miasto płonęło blaskiem tysiąca ogni, Praefectus Praetoriae Christianus Cinastovicus poprowadził niewielką grupę najbardziej zaufanych gwardzistów do komnat Imperatora Ricardusa Augusta Calisiusa. To, co się wydarzyło, na zawsze zapisze się w annałach historii. Pretorianie obezwładnili garstkę pozostałych wiernych strażników i szybko, lecz bezlitośnie zakończyli rządy kalizjańskiego władcy. Krwawiący, umierający Imperator patrzył, jak Praefectus Praetoriae rozpoczyna czystkę wszystkich nadal lojalnych wobec obalonego monarchy. Nie wiadomo jeszcze, co stanie się z pozbawionym głowy Imperium. Pewne jest tylko, że nowa junta pretoriańska wszelkimi sposobami spróbuje utrzymać władzę. Czy jej rządy mają jakąkolwiek szansę przetrwać, pozostaje jednak co najmniej bardzo niepewne."
calisia.2000.a: "Et tu, Christianus?"

calisia.2001.t: "[GetNewspaper]Powstaje Res Publica Calisiana!"
calisia.2001.desc: "Junta Pretoriańska, która przedwcześnie zakończyła rządy Cesarza Ricardusa Calisiusa, mierzyła się z zarzutami braku legitymacji, a na ulicach mówiono, że jej działania były zwyczajnym, nikczemnym przejęciem władzy przez nielojalnego prefekta. Tego dnia Praefecus Praetoriae udowodnił jednak wszystkim, że się mylili, odnosząc się do oskarżeń podczas porannej mowy przed Senatem. Pięknymi słowami i z dyplomatyczną finezją ogłosił, że jego celem było wyłącznie położenie kresu tyranii Imperatora i oddanie steru władzy konsulom Senatu. Przy owacji na stojąco zrzekł się stanowiska Dictator Perpetua i powrócił do swoich obowiązków. Pretorianie przekształcili się w Straż Senacką, a on sam został okrzyknięty Bohaterem Res Publici. Czas pokaże, czy nowa Res Publica Calisiana pod przewodnictwem Senatus Populusque Calisiensis i Concilium Plebis przetrwa próbę czasu."
calisia.2001.a: "Ave Res Publica!"

calisia.2002.t: "[GetNewspaper]Śmierć Augustowi, niech żyje August!"
calisia.2002.desc: "Niedawny przewrót Pretorian wstrząsnął Imperium w posadach. Mierząc się z kryzysem legitymacji i walcząc o utrzymanie państwa pod kontrolą, Praefectus Praetoriae postanowił ustanowić rządy nowego Augusta. Dziś odbyła się wielka uroczystość, podczas której cesarski tron objął sławny i popularny Martinus Naimanus. Gladiator z zawodu i szanowany gubernator prowincji Vartia zapowiedział bezwzględną rozprawę ze wszystkimi wrogami, których Imperium miało, ma albo będzie miało. August-Wojownik przewodniczył również inauguracyjnym igrzyskom gladiatorskim Fama Mixta Martialis Artes, zapewniając chleb i igrzyska masom obywateli tłoczących się wokół stolicy. Oczy ludu spoczywają teraz na nowym Imperatorze. Czy będzie jednak naprawdę rządzić sam, czy stanie się jedynie popularną figurą, marionetką Praetoriae? To dopiero się okaże."
calisia.2002.a: "Augustus Mortis! Ave Augustus!"

calisia.2003.t: "[GetNewspaper]Napięcie na granicach rośnie!"
calisia.2003.desc: "W pobliżu jednego z kalizjańskich limes doszło do incydentu. Miejscowa straż graniczna podniosła alarm, gdy wielka horda przybyszów wyłamała bramę i wtargnęła do Imperium. Doniesienia są niejasne. Część świadków mówi o wygłodniałych i chorych uchodźcach szukających pomocy, inni ostrzegają, że barbarzyńscy najeźdźcy są ciężko uzbrojeni i żądni krwi. Do wyłomu wysłano lokalne garnizony, lecz wkrótce wezwania o pomoc zaczęły się mnożyć, gdy kolejne posterunki graniczne donosiły o podobnych zdarzeniach. W obliczu narastającego kryzysu Senat wezwał wszystkich senatorów na nadzwyczajne posiedzenie. Rozgorzała wielka i gwałtowna debata między Popularami pod wodzą Compy, którzy twierdzili, że barbarzyńcy są uchodźcami i dobroduszne Imperium powinno okazać im łaskę, a Optymatami Caletusa, żądającymi, by Augustus trwał niewzruszenie i zniszczył najeźdźców. Czas pokaże, która strona zwycięży."
calisia.2003.a: "Polonia Barbarorum?"

calisia.2004.t: "[GetNewspaper]Upadek Eurostaat Deutschland!"
calisia.2004.desc: "Doniesienia zza Viadrusu są szokujące, niemal niewiarygodne. Oficerowie dawnych niemieckich państw marionetkowych twierdzą, że ich patronów dotknął kryzys o skali podobnej do tego, którego Polonia doświadczyła w latach dwudziestych XXI wieku. Po rozwiązaniu Unii Europejskiej gospodarkę Niemiec ogarnął bezprecedensowy, pogłębiający się upadek, podsycający ogień buntu we wszystkich zakątkach Res Publici. Policja była przeciążona, a wojsko uwikłane w działania poza granicami kraju. Niemiecki rząd rozpadł się, a władzę przejęli miejscowi watażkowie walczący między sobą o kontrolę. Gdy kolejne maleńkie państewka odrywały się od Niemiec, naród niemiecki znalazł się między młotem a kowadłem. Większość postanowiła zostać i spróbować odnaleźć się w nowej, rozbitej rzeczywistości, lecz wielu zabrało wszystko, co mogło unieść, i ruszyło ku wciąż istniejącym krajom sąsiednim. Nadeszły wielkie i niespokojne czasy nowej wędrówki barbarzyńców."
calisia.2004.a: "Europa Barbarorum..."

calisia.2007.t: "[GetNewspaper]Calisii już nie ma!"
calisia.2007.desc: "Na ulicach Calisii zapadła cisza. Obywatele uciekli, podobnie jak resztki rozbitego i pokonanego cesarskiego wojska. Wchodząc do miasta, nieprzyjacielskie oddziały ujrzały brudne i opustoszałe ruiny obłąkanego państwa, wcześniej niewidoczne dla obcych i ukrywane przez pompatycznych imperialistów. Najeźdźcy zerwali wiszące kalizjańskie sztandary i puścili je z dymem, a bardziej przedsiębiorczy skierowali uwagę ku Pałacowi Cesarskiemu i ukrytym w nim bogactwom. Logistycy zaopatrujący zdobyte miasto ponownie ustawili znaki drogowe z dawną, niemal zapomnianą nazwą \"Kalisz\". August i senatorowie zniknęli, a niedobitki legionów są ścigane albo rozpierzchły się po głębokich lasach. Można więc śmiało powiedzieć, że tylko cud zdoła ocalić cesarski sen o Calisii. Watażkowie szybko skorzystali z okazji, by wypełnić próżnię pozostawioną przez upadłe Imperium, niczym hieny i sępy walczące nad świeżym trupem."
calisia.2007.a: "Musa, mihi causas memora..."


### POSTACIE ###

POLITICS_RICARDUS_CALISIUS_DESC: "Były socjalista, prawnik, polityk - niezbyt szacowne Cursus Honorum, choć całkiem typowe. Przez całe życie Ryszard Kalisz czuł w głębi umysłu jakąś tęsknotę. Towarzyszyła mu, gdy przechodził obok kolumn Sądu Najwyższego pokrytych starożytnymi maksymami prawnymi, oglądał Asteriksa i Obeliksa: Misję Kleopatra albo po prostu jadł pizzę. Ilekroć przemawiał, czy to w sądzie, czy w Sejmie, czuł za plecami obecność kogoś o wiele potężniejszego i mądrzejszego niż ława przysięgłych czy Marszałek Sejmu. Wtedy po prostu ją ignorował i robił swoje. \n\nTuż po Upadku przebudziła się jego wewnętrzna świadomość. Uciekając - przed eksplozją albo rozwścieczonym tłumem - ukrył się w kaliskiej piwniczce win. To, co wydarzyło się w środku, na zawsze pozostanie tajemnicą. Trzeciego dnia wyszedł owinięty prześcieradłem zabarwionym na purpurowo winem Latium, ze złotym wieńcem laurowym na głowie i doskonałą znajomością wszystkich pięciu łacińskich deklinacji. \n\nChoć Kalisz mógł wydawać się dziwny, miejscowi bardzo cenili jego niespożytą energię i talent organizacyjny. Nikt nie mrugnął okiem, gdy nakazał urzędnikom nosić togi albo narzucił łacińską nomenklaturę. Kiedy jednak ogłosił się potomkiem Jowisza, część ludzi uznała, że posuwa się zbyt daleko. Jego rządy były już wtedy mocno ugruntowane. Kalisz zwrócił się do członków lokalnych elit z atrakcyjną propozycją: ziemia w zamian za władzę polityczną. Wkrótce zebrał się Senat i ogłosił Kalisza - teraz Ricardusa Calisiusa - najpierw dożywotnim konsulem, a zaraz potem Cesarzem Calisii. Pierwszy edykt nowego dyktatora przeraził wielu: przywrócił formę pracy kontraktowej, która okazała się niewiele więcej niż słabo zamaskowanym niewolnictwem. \n\nCalisius balansuje na linie między Optymatami, pragnącymi przejąć jak najwięcej bogactwa i władzy, a Popularami, wskazującymi rażące nierówności w młodym Imperium. Konflikt pogłębia niepewność co do stanu psychicznego Calisiusa. Choć wydaje się szalony, zdołał przekuć ten skrawek Polski po Upadku w silne i sprawnie działające państewko. Jego przeszłość sprawiła, że wielu uważało go za oportunistę, lecz decyzja o podtrzymaniu tradycji demokratycznych poprzez wzmocnienie Senatu dowiodła, iż jest równie mocno Cincinnatusem, co Augustem. Prawdziwy zakres ambicji Cesarza - albo jego szaleństwa - wkrótce się ujawni..."
POLITICS_pawel_delag_DESC: "Dawno, dawno temu aktor Paweł Deląg zagrał łobuza przemienionego w dobrego człowieka Marcusa Viniciusa w monumentalnym rzymskim eposie Quo Vadis. Zdobył dzięki temu pewną sławę i opinię \"najseksowniejszego polskiego aktora 2001 roku\", pomagając zarazem ukształtować obraz krwawego, niemoralnego Imperium Rzymskiego przeobrażającego się w bardziej ludzką, chrześcijańską Europę. \n\nByć może właśnie dlatego, gdy tylko opadł atomowy pył, Deląg przeniósł się tam, gdzie ruiny były nowoczesne, a odbudowa starożytna.\n\nTrudno stwierdzić, czy zaoferował Calisiusowi usługi z przekonania, żądzy władzy, czystego oportunizmu, czy po prostu dał się kupić. Postawiony na czele legionów szybko stał się jednak ikoną reżimu, najpewniej dlatego, że jako jedyny naprawdę wyglądał na właściwego człowieka na właściwym miejscu. Lud słucha jego słów, a przywiązania, z jakim podążają za nim legioniści, nie dałoby się przeważyć pieniędzmi. Wielkoduszny, otwarty i tolerancyjny Vinicius szybko stał się wpływowym sprzymierzeńcem Popularów. Wierzy, że nowe Wieczne Miasto może być miejscem, gdzie każdy zostanie obywatelem o równych prawach i obowiązkach, a chleb i igrzyska służą lepszemu celowi niż kontrolowanie mas. \n\nUrok i popularność Marcusa są kolumną podtrzymującą reżim Calisiusa. Przeszłość Cesarza zdaje się czynić go przychylnym ideom Popularów. Cezar nie mógłby wymarzyć sobie lepszego przyjaciela... Czy jednak przyjaźń może trwać wiecznie?"

# Drobiazgi

CAL_gniezno_cleanup: "Zaatakuj pomniejsze ludy Północy"
CAL_declare_war_on_lisowczycy: "Zniszcz sarmackie niedobitki"
