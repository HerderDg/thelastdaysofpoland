CAL_army_worthy_of_aurelian: "Armia godna cesarza Aureliana"
CAL_army_worthy_of_aurelian_desc: "Imperium potrzebuje i zasługuje na armię lojalną, oddaną, wierną, a nade wszystko zabójczą. Całe legiony zdeterminowanych żołnierzy odzianych w lorica segmentata, z gladiusami i pilum w dłoniach, tworzą kalizjańską armię, która przyniesie tej ziemi pokój oraz dobrobyt. Ave Augustus!"

CAL_repercussions_of_abuses: "Następstwa przemówienia o nadużyciach"

CAL_collegia: "Kolegia"
CAL_collegia_desc: "Utworzenie legalnych zrzeszeń wszystkich organizacji przemysłowych i usługowych Imperium przyniosło owoce, a wydajność każdego sektora gospodarki poszybowała w górę. Lud raduje się, ponieważ jego przedsięwzięcia gospodarcze otrzymują oficjalne licencje."

CAL_legions_march_on_north_idea: "Finis Gnesnae"
CAL_legions_march_on_north_idea_desc: "Legiony zgromadzone na północnej granicy wyruszyły do boju, pozycje wroga zostały dokładnie wskazane, a infrastruktura idealnie naniesiona na mapy. Szybkie i skoordynowane natarcie na Gnesnę złamie wszelki opór i zmiażdży \"błękitnokrwistych\" kundli!"
CAL_regrouping_on_west_idea: "Finis Sarmatiae"
CAL_regrouping_on_west_idea_desc: "Zachodnie stepy ponownie zaznają wojny, gdy nasze dzielne legiony ruszą dobrze przygotowane do starcia z barbarzyńcami Zachodu. Dni ich koczowniczych najazdów i grabienia naszych rubieży są policzone!"

CAL_sarmatian_cavalry_tt: "Zostaną zwerbowane dwie dywizje sarmackich Ekwitów"

CAL_growing_bureaucracy: "Rozrastająca się biurokracja"
CAL_growing_bureaucracy_desc: "Wypełnij formularz, aby otrzymać dokument uprawniający do złożenia wniosku o kolejny dokument, bez którego nie można wypełniać formularzy. Olbrzymia machina administracyjna, która w teorii pozwala sprawnie zarządzać Imperium, rozrosła się tak bardzo, że rozwiązanie nawet najprostszych spraw zajmuje tygodnie albo miesiące, utrudniając codzienne życie ogółu ludności."

CAL_agricultural_subsidies: "Cesarskie rolnictwo"
CAL_agricultural_subsidies_desc: "Wytrzymała ludność Calisii trudzi się na polach od świtu do zmierzchu, pielęgnując dary Matki Terry wyrastające z żyznej gleby. Wokół cesarskich miast powstają wielkie majątki, przynoszące obfite plony i wypełniające Forum Magnum każdego miasta pysznymi, ręcznie zbieranymi produktami."
CAL_agricultural_subsidies_2: "Cesarskie rolnictwo"
CAL_agricultural_subsidies_2_desc: "Światowej sławy winnice pokrywają faliste wzgórza, a mechaniczne woły orzą niezliczone pola Calisii, sięgające teraz poza horyzont. Dzięki maszynom wspierającym ciężko pracujących rolników cała Wenedia posmakuje zbóż, owoców i warzyw wyhodowanych w Imperium. Z pełnymi brzuchami i pełnymi skarbcami Imperium jest skazane na sukces."

CAL_praetoriae_et_optimates_gain: "§0Pretorianie i Optymaci skorzystają na tej decyzji§!"
CAL_legiones_et_populares_gain: "§tLegiony i Popularzy skorzystają na tej decyzji§!"
CAL_legiones_gain: "§tLegiony skorzystają na tej decyzji§!"
CAL_populares_gain: "§tPopularzy skorzystają na tej decyzji§!"
CAL_optimates_gain: "§0Optymaci skorzystają na tej decyzji§!"

CAL_political_disputes: "Spory polityczne"
CAL_political_disputes_desc: "Każdy wielki sukces wystawia rachunek długo po swoim osiągnięciu. Po zmiażdżeniu wrogów polityczne skrzydła Calisii wróciły do walk między sobą zarówno o podbite ziemie, jak i o rodzinne miasto. Krótko mówiąc, do naszego imperium powrócił naturalny porządek rzeczy."
CAL_political_disputes2: "Spory polityczne"
CAL_political_disputes_desc2: "Ostateczne starcie naszych sił politycznych zdaje się wreszcie zbliżać do stolicy. W nadchodzących dniach Cesarz wybierze tych, którzy najbardziej zasługują na jego łaskę. Do tego czasu ukochaną Calisię czekają jednak spory polityczne i pokazy popularności jeszcze gwałtowniejsze niż dotąd."
CAL_political_disputes3: "Spory polityczne"
CAL_political_disputes_desc3: "Ostateczne starcie naszych sił politycznych zdaje się wreszcie zbliżać do stolicy. W nadchodzących dniach Cesarz wybierze tych, którzy najbardziej zasługują na jego łaskę. Do tego czasu ukochaną Calisię czekają jednak spory polityczne i pokazy popularności jeszcze gwałtowniejsze niż dotąd."

CAL_palma_non_sine_pulvere: "Palma Non Sine Pulvere"
CAL_palma_non_sine_pulvere_desc: "Żadne zwycięstwo nie przychodzi bez wysiłku - tak mawiają nasi najstarsi filozofowie (w przerwach między pijackimi hulankami). Prawdą jest jednak, że Calisia wkroczyła w kolejny okres wytężonej pracy. Rządzenie państwem to delikatna sztuka, a część reform trzeba wdrażać za pomocą niewygodnych ograniczeń nakładanych na ludność cywilną."
CAL_pax_calisiana_idea: "Pax Calisiana"
CAL_pax_calisiana_idea_desc: "Po ustanowieniu hegemonii kalizjańskiego Imperium wszystkie większe i mniejsze potęgi drżą przed jego wszechogarniającą mocą. Po pokonaniu wszystkich głównych wrogów na naszej drodze nadchodzą dobrobyt i bogactwo. Każdy mąż stanu na ziemiach Europy musi przyjąć do wiadomości, że Calisia stała się prawdziwym regionalnym mocarstwem."

CAL_empty_coffers: "Pusty skarbiec"
CAL_empty_coffers_desc: "\"Nasz skarbiec jest pusty, mój panie!\"\nTo najgorsze zdanie, jakie władca może usłyszeć w dowolnym momencie historii. Dzięki złotu mogliśmy opłacać armię, finansować dotacje, budować pałace, przekupywać potrzebnych ludzi - robić wszystko.\n\nDopóki nie naprawimy sytuacji, musimy jednak trzymać się starej, sprawdzonej maksymy:\n\n\"Bez złota nie ma budynków.\nBez budynków nie ma Calisii.\nA bez Calisii... nie ma Calisii\"."
CAL_campaign_seasons: "Sezony wojenne"
CAL_campaign_seasons_desc: "\"Zbliża się pora żniw\" stało się popularnym powiedzeniem w naszej armii. Legioniści nie są przystosowani do współczesnych praktyk wojskowych wymagających stałej gotowości do natarcia. Mentalność tak zwanych \"sezonów wojennych\" sprawia, że okresowo tracą ochotę na walkę za Cesarza, powodując chaos logistyczny, którego nie rekompensują żadne nowe zwycięstwa."
CAL_servile_war_idea: "Powstanie niewolników"
CAL_servile_war_idea_desc: "Masakra w Ravitium wstrząsnęła ludem Calisii do tego stopnia, że powróciły namiętne nastroje antybarbarzyńskie. Lokalne walki wewnętrzne i masowe aresztowania sparaliżowały gospodarkę tego obszaru, zmuszając nas do jak najszybszej odpowiedzi na najważniejsze pytania: \"Jak zapobiegniemy kolejnemu buntowi niewolników?\" oraz \"Jakie będzie nasze ostateczne rozwiązanie kwestii ludności barbarzyńskiej?\"."
CAL_curse_of_sybilla: "Klątwa Sybilli"
CAL_curse_of_sybilla_desc: "Bezprawne porwanie kobiet wywołało niefortunne problemy w naszym rodzinnym mieście. Nasze żony maszerują ulicami, wściekle domagając się uwolnienia ofiar najazdu. Nie jest to nic, z czym nie poradzilibyśmy sobie tradycyjnym spacyfikowaniem zgromadzenia, ale cała sytuacja stworzyła wyjątkowo niezręczny incydent dyplomatyczny z barbarzyńskim watażką Wielkopolski."
CAL_crisis_of_identity: "Kryzys tożsamości"
CAL_crisis_of_identity_desc: "Od samego początku rozpustnicy wyśmiewali naszą tożsamość spadkobierców rzymskiej chwały. Każdy Kalizjanin musi zatem wiedzieć, dlaczego właśnie tak się nazywa. Ostatnio jednak coraz więcej obywateli ma problem z odpowiedzią na to podstawowe pytanie. Bez tożsamości nie może istnieć naród."
CAL_nostalgic_for_rome: "Tęsknota za Rzymem"
CAL_nostalgic_for_rome_desc: "Lud Calisii pragnie powrotu do obyczajów Imperium Rzymskiego. Togi znów są modne, a łacina wyparła polszczyznę z ulic. Ta pożądana przez Augusta sytuacja ma jednak niechciany skutek: nauka i edukacja cierpią, gdy ludzie powracają do starożytnych metod. Wojsko również zaczęło przedkładać miecz i tarczę nad nowoczesną broń palną."

CAL_ricardus_denar: "Denar Ricardusa"
CAL_ricardus_denar_desc: "Cesarskie mennice, pobłogosławione przez Augusta, rozpoczęły bicie serii ustandaryzowanych monet. Denar kalizjański jest teraz podstawowym środkiem płatniczym na ziemiach rządzonych z Calisii, a dzięki prawdziwej walucie bitej przez państwo handel wymienny ustępuje miejsca naprawdę nowoczesnej i kwitnącej gospodarce."

CAL_administrative_reorganisation: "Reorganizacja administracji"
CAL_administrative_reorganisation_desc: "Czym byłoby nasze imperium bez sprawnej administracji? Wraz z jej nieustannym rozrostem musi się jednak reorganizować i unowocześniać. Nowe standardy zatrudnienia, metody pomiaru oraz sposoby komunikacji między ośrodkami państwowymi uczynią Calisię nie tylko potężnym krajem, lecz również krajem możliwym do kontrolowania."

CAL_ateneum_calisiae: "Ateneum Calisiae"
CAL_ateneum_calisiae_desc: "Rzym nie był wyłącznie miastem wojowników i cesarzy. Stanowił również stolicę filozofii i centrum przełomowych odkryć naukowych. To naturalne, że naśladujemy jego ogromne poszerzanie dostępu do wiedzy. Nasze skrzydło akademickie otrzymało właśnie nową, wydzieloną infrastrukturę oraz państwowe dotacje na potrzebny sprzęt badawczy dla uczonych i ich studentów."
CAL_grand_calisian_tabularium: "Wielkie Kalizjańskie Tabularium"
CAL_grand_calisian_tabularium_desc: "Tabularium, wzniesione jako część nowej dzielnicy senackiej w mieście Calisia, jest olbrzymim kompleksem cesarskich archiwów. Na papier przelewane są tutaj wszystkie dokumenty, przepisy i kodeksy, dzięki czemu obecne oraz dawne prawa zostaną zachowane dla przyszłych pokoleń Kalizjan."

CAL_monotheist_temples: "Świątynie monoteistyczne"
CAL_monotheist_temples_desc: "Dzisiaj zacieśniliśmy więzi z drugim wielkim panem, którego kochamy: Jezusem Chrystusem. Wielka katedra św. Mikołaja przechodzi gruntowną renowację. Uczynimy ją równie wspaniałą jak wszystko w naszym imperium. Gdy skończymy, nawet Watykan zgrzeszy z zazdrości."

CAL_polytheist_temples: "Świątynie politeistyczne"
CAL_polytheist_temples_desc: "Bogaty panteon kalizjańskich bóstw zasługuje na miejsca kultu dorównujące przepychem samemu Augustowi. Świątynie Jowisza, Marsa, Bachusa, Ceres, Neptuna oraz wszystkich pozostałych bogów i bogiń, wzniesione w każdym mieście, miasteczku i wsi, oświecą ludność oraz napełnią ją nadzieją i wiarą nawet w najciemniejsze dni."

CAL_supermercatae: "Supermercatae"
CAL_supermercatae_desc: "Dzięki niedawnym zmianom przepisów gospodarczych i handlowych cesarski handel rozkwita. Świeże produkty, najróżniejsze przyprawy, wypieki, narzędzia do majsterkowania, a nawet odnowione mechaniczne rydwany - rozrastające się sieci supermarketów zapewniają cesarskim obywatelom dobrobyt i egzotyczne towary w przystępnych cenach, wzmacniając gospodarkę Imperium."

CAL_construction_palace: "Budowa pałacu"
CAL_construction_palace_desc: "Zgodnie z osobistym życzeniem Cesarza w centrum Calisii rozpoczęto olbrzymie prace. Wzniesienie zupełnie nowego pałacu cesarskiego w ciągu niespełna trzech miesięcy, przy naszym obecnym poziomie technologicznym, niektórym wydaje się niemożliwe, a wręcz szalone. Bzdura. Mądrość Ricardusa i jego archiwa filmów komediowych wskażą nam drogę!"
CAL_construction_palace2: "Budowa pałacu"
CAL_construction_palace2_desc: "Zgodnie z osobistym życzeniem Cesarza w centrum Calisii rozpoczęto olbrzymie prace. Wzniesienie zupełnie nowego pałacu cesarskiego w ciągu niespełna trzech miesięcy, przy naszym obecnym poziomie technologicznym, niektórym wydaje się niemożliwe, a wręcz szalone. Bzdura. Mądrość Ricardusa i jego archiwa filmów komediowych wskażą nam drogę!"
CAL_construction_palace3: "Budowa pałacu"
CAL_construction_palace3_desc: "Zgodnie z osobistym życzeniem Cesarza w centrum Calisii rozpoczęto olbrzymie prace. Wzniesienie zupełnie nowego pałacu cesarskiego w ciągu niespełna trzech miesięcy, przy naszym obecnym poziomie technologicznym, niektórym wydaje się niemożliwe, a wręcz szalone. Bzdura. Mądrość Ricardusa i jego archiwa filmów komediowych wskażą nam drogę!"

CAL_monuments_glory: "Pomniki chwały"
CAL_monuments_glory_desc: "Nasze niedawne kolosalne przedsięwzięcia, mające wznieść posągi godne rozmiarów imperium, przyniosły liczne miejsca pracy i przypływ patriotycznego zapału. Wspólną wolą, prowadzeni przez Cesarza, postawimy pomniki tak wysokie i szczegółowe, że przodkowie zdołają podziwiać je z niebios. I uronią łzę z dumy."

CAL_eternal_city_of_calisia: "Wieczne Miasto Calisia"
CAL_eternal_city_of_calisia_desc: "Dzięki niedawnym renowacjom nasze chwalebne miasto przeszło niezwykłą przemianę. Odnowione place, bujne parki i pięknie odrestaurowana architektura zapraszają mieszkańców oraz przybyszów do doświadczenia jego niezastąpionego blasku. Gdy Sol zachodzi i oblewa miasto złotym światłem, niemal można poczuć spojrzenia dawnych cesarzy Rzymu, spoglądających z dumą z wysokości. Ich dziedzictwo żyje w barwnej kulturze i odzyskanym przepychu Calisii - świadectwie jej niezłomnego ducha i ponadczasowego piękna."

CAL_eternal_dream_of_flying: "Odwieczne marzenia o lataniu"
CAL_eternal_dream_of_flying_desc: "Wreszcie dotknęliśmy niebios nie tylko naszą chwałą, lecz także własnymi dłońmi. Przedupadkowe maszyny latające zostały odnowione i mogą teraz przelatywać nad głowami dzikich barbarzyńców. Kto nie potrafi powstrzymać gromu, nie zdoła powstrzymać również nas."

CAL_like_aeneas_before_us: "Śladami Eneasza"
CAL_like_aeneas_before_us_desc: "Nasze okręty mogą wreszcie przemierzać rzeki i morza. Od tej chwili będziemy sprowadzać i wysyłać towary z innych światów. Być może pewnego dnia staniemy się morską potęgą jak dawny Rzym, a może nawet go odzyskamy. O morze, zwodniczy błękicie. Miłość do ciebie tylko pewną śmierć przynosi."

CAL_caesarea_cadre: "Kadry Cezarejskie"
CAL_caesarea_cadre_desc: "Instytut Witruwiusza wychował kadrę doskonale wykształconych inżynierów i uczonych. Starannie wybrani i utrzymywani ze stypendiów samego Augusta, ci światli Kalizjanie stanowią trzon cywilnego oraz wojskowego postępu technologicznego Calisii."

CAL_homo_calisiensis_idea: "Homo Calisiensis"
CAL_homo_calisiensis_idea_desc: "Ostatnio zakorzeniła się u nas nowa norma społeczna, która z błogosławieństwem Augusta została powszechnie przyjęta. To wzór nowego kalizjańskiego mężczyzny - silnego i odważnego żywiciela oraz obrońcy ukochanej żony i licznych dzieci czekających w domu. Konserwatyści chwalą to długofalowe rozwiązanie, które sprowadzi na świat wielu Kalizjan, lecz liberałowie nim gardzą."

CAL_armoured_behemoths_idea: "Stalowe rydwany"
CAL_armoured_behemoths_idea_desc: "W obliczu wrogów otaczających wszystkie granice Imperium nasze wojsko stało się prawdziwie nowoczesną siłą bojową. Dobrze wyszkoleni żołnierze na grzbietach stalowych bestii, zwartych niczym szyk testudo i uzbrojonych po zęby, ruszą do bitwy i zniszczą każdego, kto sprzeciwi się woli Augusta."
CAL_armoured_behemoths_idea2: "Stalowe rydwany"
CAL_armoured_behemoths_idea2_desc: "W obliczu wrogów otaczających wszystkie granice Imperium nasze wojsko stało się prawdziwie nowoczesną siłą bojową. Dobrze wyszkoleni żołnierze na grzbietach stalowych bestii, zwartych niczym szyk testudo i uzbrojonych po zęby, ruszą do bitwy i zniszczą każdego, kto sprzeciwi się woli Augusta."

CAL_disciples_of_mars_idea: "Uczniowie Marsa"
CAL_disciples_of_mars_idea_desc: "Pod przewodnictwem boga wojny utworzono zdyscyplinowaną, zabójczą i elitarną formację stanowiącą awangardę cesarskiej armii. Jej lojalność nie podlega dyskusji. Żołnierze są gotowi rzucić się w piekło i wyrwać zwycięstwo ze szczęk porażki. To prawdziwa siła, szanowana przez Kalizjan i budząca strach w każdym, kto ma czelność opierać się woli Augusta."

CAL_legionarius_armor: "Lorica Ballistica"
CAL_legionarius_armor_desc: "Nawet gdybyśmy bardzo tego chcieli, nie żyjemy w starożytności. Ludzie potrafią zabijać na odległość narzędziami znacznie lepszymi od łuków. Naszym obowiązkiem jest więc dostosowanie wojskowych pancerzy i kamizelek do obecnych czasów. Nie uratują wszystkich, ale z pewnością powstrzymają wiele pocisków przed dotarciem do ich dzielnych serc."

CAL_tributum_ponaenae: "Tributum Poenae"
CAL_tributum_ponaenae_desc: "Zgodnie z niedawnymi zmianami prawa zatwierdzonymi przez Senat i samego Augusta każdemu skazanemu za korupcję lub kradzież zostaną publicznie odcięte dłonie, aby ukazać sprawiedliwość w działaniu. Rozgniewany lud może kamienować sprawców wedle uznania. To bez wątpienia skuteczny sposób zapobiegania korupcji, choć niektórzy mogą uznać tę politykę za tyrańską i barbarzyńską."

CAL_aeque_in_tributa: "Aeque in Tributa"
CAL_aeque_in_tributa_desc: "Aby zwalczać nierówności szerzące się w Imperium, wprowadzono system redystrybucji majątku. Kilku bogatych patrycjuszy szemrze po konfiskacie swoich ogromnych fortun, lecz masy mniej uprzywilejowanych ludzi się radują. August polecił Senatowi wysłać kwestorów nadzorujących redystrybucję i pilnujących, aby pieniądze trafiały do najbardziej potrzebujących."

CAL_great_games: "Wielkie Igrzyska"
CAL_great_games_desc: "Nie wszystkie problemy da się rozwiązać natychmiast za pomocą żelaznej woli Cesarza i jego rozległej wiedzy. Niektóre wymagają czasu - i właśnie po to organizuje się wydarzenia publiczne. Niestety skala obecnych przygotowań z łatwością dorównuje przedupadkowym mistrzostwom w piłce nożnej. Będzie nas to kosztować, ale postęp również ma swoją cenę."

CAL_reform_of_administrative_division_idea: "Reforma podziału administracyjnego"
CAL_reform_of_administrative_division_idea_desc: "W Calisii zaczyna kształtować się nowy porządek, a wraz z nim pojawiają się wszystkie trudności związane z wymianą administracji. Nowi duchowni i przywódcy wojskowi powoli integrują się z cesarskimi strukturami państwa. Oby nie okazali się ZBYT powolni. Calisia nie może sobie pozwolić na kolejne porażki."

CAL_central_popular_committee_idea: "Centralny Komitet Ludowy"
CAL_central_popular_committee_idea_desc: "Ponieważ inne prowincje stają się od nas coraz bardziej zależne, nie tracimy czasu i zacieśniamy te więzi. Silniej scentralizowana administracja daje większą kontrolę nad poddanymi i przyspieszy przyszłe reformy państwa. Dzięki tym możliwościom poradzimy sobie z każdym protestem gubernatorów bezskutecznie domagających się szerszej autonomii."

CAL_federalization_of_the_empire_idea: "Federalizacja Imperium"
CAL_federalization_of_the_empire_idea_desc: "Nasze imperium szybko rośnie, a poza Cesarzem żaden człowiek nie zdoła przez nieskończony czas zarządzać olbrzymią liczbą nowych ziem z zadowalającymi rezultatami. Dlatego decentralizujemy administrację i nadajemy nowe przywileje lokalnym gubernatorom prowincji. Dopóki pozostaną lojalni i będą przestrzegać naszych praw, otrzymają zaufanie władzy centralnej."

CAL_defensio_calisiae: "Defensio Calisiae"
CAL_defensio_calisiae_desc: "Barbarzyńcy ponownie zagrażają naszemu sposobowi życia. Cesarz słusznie oświadczył, że będziemy się bronić, lecz wybór dokładnego sposobu pozostawił Senatowi. Co zaskakujące, część senatorów chce rozegrać kalizjańskie karty z rozwagą i rozpocząć rozmowy dyplomatyczne z niektórymi plemionami. Nawet jeśli zdołają przeforsować tę skandaliczną ustawę, Imperium nadal musi szykować się do wojny. Każdym ostrzem BĘDZIEMY się bronić."

CAL_inflation1_idea: "Pełzająca inflacja"
CAL_inflation1_idea_desc: "Nasi ekonomiści zauważają, że cesarska waluta weszła w stan inflacji. Nie ma jednak powodów do obaw. Każda waluta potrzebuje cyklicznego spadku wartości wynikającego z rozrostu państwa. Wystarczy kontynuować starannie zaplanowane inwestycje i patrzeć, jak liczby zmieniają kolor na zielony."
CAL_inflation2_idea: "Galopująca inflacja"
CAL_inflation2_idea_desc: "Nasza waluta nadal traci wartość i robi to coraz szybciej. Problem nie osiągnął poziomu krytycznego... przynajmniej nie na ten moment. Ekonomiści twierdzą, że musimy zrezygnować z części planowanych inwestycji, ale co oni właściwie wiedzą o budowaniu imperium? Nic nam nie będzie. Cesarz wie, co robi... prawda?"
CAL_inflation3_idea: "Hiperinflacja"
CAL_inflation3_idea_desc: "Katastrofa, klęska, całkowity upadek! Nasze monety są warte znacznie mniej niż metale, z których je wykonano. Poziom życia obywateli gwałtownie spada, a banki państwowe zamykają się jeden po drugim. MUSIMY coś zrobić! Dlaczego nikt nas nie ostrzegł?! O bogowie... niech ktoś wezwie Cesarza!"

CAL_settle_francs_and_saxons_modifier: "Osadnictwo Franków i Sasów"
CAL_settle_francs_and_saxons_modifier_desc: ""

CAL_offer_to_the_goths_modifier: "Oferta dla Gotów"
CAL_offer_to_the_goths_modifier_desc: ""

CAL_ethnic_tensions_modifier: "Kalizjańsko-barbarzyńskie napięcia etniczne"
CAL_ethnic_tensions_modifier_desc: ""

CAL_barbarian_pogroms_modifier: "Pogromy barbarzyńców"
CAL_barbarian_pogroms_modifier_desc: ""

CAL_eastern_settlers_modifier: "Wschodnie osadnictwo"
CAL_eastern_settlers_modifier_desc: ""

CAL_resettlement_efforts_modifier: "Wysiłki przesiedleńcze"
CAL_resettlement_efforts_modifier_desc: ""

CAL_emergency_legions_tt: "Powołamy rezerwowe siły pod broń, aby opanować zagrożenie ze strony barbarzyńców"

CAL_treaty_with_barbarians: "Traktat z barbarzyńcami"
CAL_treaty_with_barbarians_desc: "Podpisano oficjalny traktat między migrującymi plemionami a rządem Imperium. W zamian za niezachwianą lojalność barbarzyńcy otrzymali hojne pastwiska, na których mogą założyć autonomiczne osady. Ci, którzy pragną powrotu na własne ziemie na zachód od rzeki Viadrus, otrzymają szkolenie i wyposażenie, tworząc przyszłe Legio Barbarorum mające przywrócić porządek w Germanii."

CAL_purple_terror_idea: "Purpurowy terror"
CAL_purple_terror_idea_desc: "W miarę jak Optymaci zaciskają uścisk na Imperium, urzędnicy i dziennikarze popierający Popularów oraz ich politykę integracji barbarzyńców, którzy sprzeciwiali się hegemonii Princepsa Caletusa, zaczęli... znikać w tragicznych okolicznościach. Ależ szkoda."

CAL_prizes_for_loyalists: "Nagrody dla lojalistów"
CAL_prizes_for_loyalists_desc: "Jeżeli Cesarz poszukuje czegoś u swoich przedstawicieli, jest to lojalność. Bez lojalności nie ma jedności. Bez jedności nie ma narodu. A bez narodu nie ma pałacu. Postanowiono zatem, że najwierniejsi słudzy w Senacie zostaną nagrodzeni łaskawie przez majestat cesarski. Każdy Kalizjanin wie, że bycie przyjacielem Cesarza jest nie tylko bezpieczniejsze, lecz po prostu... lepsze."

CAL_international_army: "Międzynarodowa armia"
CAL_international_army_desc: "Zgodnie z cesarskim charakterem nasza armia stała się wreszcie prawdziwie wielokulturowa. Legioniści w końcu pogodzili się z faktem, że Kalizjanie nie są jedynym narodem na świecie i nie zdołają podporządkować go sobie samodzielnie. Dlatego wykorzystujemy teraz każdą przewagę, jaką poborowi wynieśli ze swoich ojczyzn. Bez względu na to, kim byli wcześniej, domem, którego zawsze będą bronić, pozostanie Calisia."

CAL_senate_for_the_people: "Senat dla ludu"
CAL_senate_for_the_people_desc: "Tam, gdzie panuje demokracja, szukanie jedności jest głupotą. Na szczęście Calisia zdaje się być na dobrej drodze do jej osiągnięcia. Partia Popularów rządzi zdecydowaną większością w Senacie, a przeciwnicy niewiele mogą z tym zrobić. Jedni Kalizjanie nazywają to zapewnieniem ludowi szerszej reprezentacji, inni zaś opisują sytuację jako powolną śmierć tejże reprezentacji."

CAL_inspiration_from_constantine: "Inspiracja Konstantynem Wielkim"
CAL_inspiration_from_constantine_desc: "Bycie Cesarzem oznacza nierozerwalną więź z poprzednikami i ich nieskończoną mądrością. Korzystając z tego przywileju, Ricardus Calisius rozpoczął wdrażanie najnowszych reform. Decentralizacja Imperium oraz odebranie przywilejów osobistej gwardii to zaledwie kilka nadchodzących zmian, które wkrótce przyniosą Calisii nowy świt."

CAL_striking_hydra_in_its_heart: "Cios w serce hydry"
CAL_striking_hydra_in_its_heart_desc: "Największe zagrożenie dla woli Cesarza nie miało nadejść od sąsiadów. Prawdę mówiąc, niemal narodziło się wśród jego najbliższych współpracowników i obrońców. Niemal... ale już nigdy się to nie powtórzy. Pretorianie zostali ostatecznie spacyfikowane, a ich wpływy należą do przeszłości. Ostatnie tchórzliwe niedobitki wkrótce podzielą ich los i Calisia otrzyma wreszcie zasłużony pokój."

CAL_popular_tribunals_idea: "Trybunały ludowe"
CAL_popular_tribunals_idea_desc: "System sądowniczy Imperium został zreorganizowany i oczyszczony z korupcji. Lud raduje się, ponieważ sędziów starej gwardii zastąpiły ławy przysięgłych złożone ze współobywateli. Wyroki będą wydawane w imię prawdy i sprawiedliwości, a nie łapówek."

CAL_barbarian_games_idea: "Wielkie Igrzyska"
CAL_barbarian_games_idea_desc: "Przez nasze ulice i wsie przetoczyła się wielka czystka. Nie da się zbudować prawdziwie bezpiecznego imperium, gdy w jego wnętrzu kryją się zdrajcy i niepożądane jednostki. Oddziały najwierniejszych żołnierzy i obywateli schwytały przerażającą liczbę barbarzyńców i przekazały ich cesarskim władzom do inkarceracji. Ostatecznie nikt się nie ukryje - tak jak nikt nie ukryje się na arenach..."

CAL_barbarian_hunting_idea: "Polowanie na barbarzyńców"
CAL_barbarian_hunting_idea_desc: "Przez nasze ulice i wsie przetoczyła się wielka czystka. Nie da się zbudować prawdziwie bezpiecznego imperium, gdy w jego wnętrzu kryją się zdrajcy i niepożądane jednostki. Oddziały najwierniejszych żołnierzy i obywateli schwytały przerażającą liczbę barbarzyńców i przekazały ich cesarskim władzom do inkarceracji. Ostatecznie nikt się nie ukryje - tak jak nikt nie ukryje się na arenach..."

CAL_slave_empire_idea: "Imperium niewolników"
CAL_slave_empire_idea_desc: "Nasza gospodarka rozkwita dzięki targom niewolników i ich pracy. Z całego świata przybywa coraz więcej kupców wzgardzonych przez dekadencki Zachód (i Wschód, i właściwie też Północ...). Złoto płynie tym szerszym strumieniem, im więcej kajdan zakłada się na czyjeś ręce.\nMiejmy nadzieję, że nie przyniesie to żadnych nieprzewidzianych konsekwencji gospodarczych..."

CAL_captured_legions: "Ujarzmione legiony"
CAL_captured_legions_desc: "Aby zabezpieczyć władzę, skróciliśmy smycz legionów i zmusiliśmy je do posłuszeństwa. Ostatnich sympatyków wroga schwytano i skazano, dzięki czemu naszym dzielnym żołnierzom mogą przewodzić prawdziwi patrioci Calisii. Poza kilkoma legatami nikt naprawdę ważny nie zaprotestował przeciw reformom. Jest zatem oczywiste, że podążamy sprawiedliwą drogą."

CAL_silence: "Cisza"
CAL_silence_desc: "Nowa Calisia ogląda wreszcie wschód słońca i podziwia go bez słowa. Pretorianie niepodzielnie rządzą Imperium i wszyscy o tym wiedzą. Zarówno Calisius, jak i Vinicius opuścili ten świat, a naszym zadaniem jest odbudować go w lepszej postaci. Już nigdy nikt nas nie powstrzyma. Przelano jednak krew i łzy, a każdy w ciszy zadaje sobie pytanie: \"Czy było warto?\""
CAL_silence2: "Cisza"
CAL_silence2_desc: "Nowa Calisia ogląda wreszcie wschód słońca i podziwia go bez słowa. Pretorianie niepodzielnie rządzą Imperium i wszyscy o tym wiedzą. Zarówno Calisius, jak i Vinicius opuścili ten świat, a naszym zadaniem jest odbudować go w lepszej postaci. Już nigdy nikt nas nie powstrzyma. Przelano jednak krew i łzy, a każdy w ciszy zadaje sobie pytanie: \"Czy było warto?\""
