CAL_ager_publicus_modifier_desc: "Ziemie zarekwirowane przez naszych kwestorów są uprawiane przez bezrolnych chłopów pańszczyźnianych, aby zaspokajać najpilniejsze potrzeby państwa. To właśnie tam powstają produkty niezbędne kalizjańskiemu przemysłowi, takie jak wiklina, olej rzepakowy czy pomidory, bez których cały sektor produkcyjny stanąłby w miejscu, a ludność wszczęłaby zamieszki na Forum Calisium. Do sali tronowej Cesarza dotarły jednak niepokojące wieści: senatorowie podobno nadużywają uprawnień, a państwowe fundusze są nieustannie marnotrawione. Musimy się temu przyjrzeć..."
