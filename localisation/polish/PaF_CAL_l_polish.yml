CAL_senate_info_tt: "Senatus Populusque Calisiensis, podobnie jak sama Calisia, jest złożonym i wielowarstwowym organem pełnym skłóconych frakcji.\n\nKażdą frakcję - Popularów, Optymatów, Legiony, Pretorian, a nawet samego Cesarza Ricardusa - reprezentuje Gravitas. Wskazuje ona siłę każdego gracza wewnątrz Imperium. Co kwartał każda frakcja zyskuje Gravitas zależnie od szeregu czynników:\n£white_dot 5 punktów bazowych\n£white_dot 10 za każdego konsula\n£white_dot 0,1 za każde miejsce w Senacie\n£white_dot 0,1 za każdą jednostkę posiadającą generała z cechą frakcji\n£white_dot 5 za każdego gubernatora lojalnego wobec frakcji\n\nCesarz ma własny zasób Gravitas, silnie uzależniony od lojalności i wpływów frakcji. Jeżeli Gravitas którejkolwiek frakcji przewyższy cesarską, zacznie on tracić zaplecze polityczne. Podobnie jest z lojalnością - gdy spadnie zbyt nisko, Gravitas Cesarza również zacznie się kruszyć. Aby utrzymać kontrolę, trzeba zachować równowagę.\n§RUWAGA! Gravitas Cesarza należy wykorzystywać wyłącznie w ostateczności. Jeżeli poziom Gravitas Ricardusa spadnie poniżej 50 procent, nastąpią tragiczne konsekwencje.§!\n\nPoza Gravitas każda frakcja oprócz Cesarza ma poziom Lojalności, wyrażający jej oddanie nie tyle Calisii, lecz Ricardusowi. Jeżeli rozgniewa którąkolwiek z frakcji, szczególnie te najbliższe sobie, konsekwencje będą dotkliwe.\n\nW Senacie zasiadają tylko dwie frakcje: wspomniani Popularzy i Optymaci. Żadne ugrupowanie nie jest oczywiście jednolitym ciałem. Każdą frakcję senatorską można podzielić na twardogłowych i chwiejnych senatorów. Twardogłowi zawsze zachowują dyscyplinę frakcyjną i głosują za każdą propozycją swojego stronnictwa. Tego samego nie można powiedzieć o reszcie. Gdy do Senatu trafia Lex, to właśnie tych chwiejnych trzeba przekonać, aby projekt miał jakąkolwiek szansę przejścia. W przeciwnym razie opozycja z pewnością zaoferuje dostatecznie wiele łapówek i przysług, by przeforsować własną wersję."

