CAL_civic_faith: "Wiara obywatelska"
CAL_civic_faith_desc: "Imperium i Cesarz są naszą wspólną dumą. Wypełnia ich boska łaska i czyni ucieleśnieniem cnoty - najwyższej formy moralności. Przeciwstawimy się wszystkiemu, co skaziła gnuśność współczesnego świata.\nW imię Naszej Prawdy i Godności!"

CAL_civic_army: "Armia obywatelska"
CAL_civic_army_desc: "Żelazna dyscyplina jest kluczem do sukcesu. Każdy Legion, każdy manipuł i każda centuria muszą znać swoje miejsce oraz cele niezbędne do wykonania zadania. Każdy obywatel musi być tego świadomy. Wszyscy mają być gotowi żyć, walczyć i umierać w imię Imperium."
CAL_civic_army2: "Armia obywatelska"
CAL_civic_army2_desc: "Żelazna dyscyplina jest kluczem do sukcesu. Każdy Legion, każdy manipuł i każda centuria muszą znać swoje miejsce oraz cele niezbędne do wykonania zadania. Każdy obywatel musi być tego świadomy. Wszyscy mają być gotowi żyć, walczyć i umierać w imię Imperium."
