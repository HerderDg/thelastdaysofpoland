CAL_silence3_desc: "Nowa Calisia ogląda wreszcie wschód słońca i podziwia go bez słowa. Pretorianie niepodzielnie rządzą Imperium i wszyscy o tym wiedzą. Zarówno Calisius, jak i Vinicius opuścili ten świat, a naszym zadaniem jest odbudować go w lepszej postaci. Już nigdy nikt nas nie powstrzyma. Przelano jednak krew i łzy, a każdy w ciszy zadaje sobie pytanie: \"Czy było warto?\""
