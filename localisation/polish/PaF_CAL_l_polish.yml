### ŁATKA KALISYJSKA ###
CAL_aurelian_army_tt: "§RJuż podczas pierwszych starć granicznych szybko okazało się, że nasze legiony nie są tak wspaniałe, jak nam się wydawało.§!"
CAL_gladiators_idea: "Areny gladiatorów"
CAL_gladiators_idea_desc: "Areny gladiatorów stanowią znakomity sposób nie tylko na podniesienie morale obywateli, lecz także na szkolenie przyszłych żołnierzy. Gladiatorzy nie należą wprawdzie do najbardziej zdyscyplinowanych wojowników, ale są odważni i silni, a po odpowiednim treningu mogą stać się cennym uzupełnieniem naszych sił. Zapewniają również doskonałą rozrywkę masom, utrzymując je w dobrym nastroju i odwracając ich uwagę od trudów życia w Imperium."

