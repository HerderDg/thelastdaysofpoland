unification.8.t: "[GetNewspaper]Narodowy Lubartów jednoczy województwo Lubelskie!"
unification.8.desc: "Dotarły do nas nowe informacje ze wschodniej Polski. Całe województwo lubelskie znalazło się pod kontrolą ONR-u, Obozu Narodowo-Radykalnego - skrajnie prawicowego ruchu, który przez wielu był uznawany za organizację faszystowską, a nawet neonazistowską.\nNowym państwem zdaje się rządzić Marian Kowalski, który w latach 2010. był dobrze znanym nacjonalistą, zanim popadł w polityczne zapomnienie. Biorąc pod uwagę jego brak wpływów i rozpoznawalności w dekadzie poprzedzającej upadek kraju, a także dawno zerwane związki z ONR-em, niektórzy zastanawiają się, w jakim stopniu rzeczywiście jest głównym decydentem skrajnie prawicowego rządu, a w jakim jedynie wykorzystuje się go jako rozpoznawalną twarz mającą skupić wokół siebie lokalnych nacjonalistów. Tak czy inaczej, według doniesień ONR wprowadza na kontrolowanych przez siebie terenach surową politykę, obejmującą między innymi prześladowania mniejszości etnicznych oraz widoczną militaryzację życia codziennego."
unification.8.a: "Falanga króluje nad Lublinem."

super.8.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.8.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.8.a: "Wreszcie zjednoczeni."