CONTEXT_DEFAULT: "§H============================================================\nCo to jest za watażka?\n============================================================§!\n\n-----\n\n§H============================================================\nCo oni tu robią?\n============================================================§!\n\n------\n\n§H============================================================\nKim są postacie z tej frakcji?\n============================================================§!\n\n---------\n\n§H============================================================\nCzym inspirowana jest ta frakcja?\n============================================================§!\n\n--------\n\n§H============================================================\nPomniejsze szczegóły lorowe\n============================================================§!\n\n--------"

CONTEXT_JOM: "§H============================================================\nCo to jest za watażka?\n============================================================§!\n\nLudowa Armia Północna, jak to w dowolnym tłumaczeniu zwie się owa frakcja, jest zbieraniną uchodźców którzy udali się na duńską wyspę Bornholm. Dowodzeni są przez Adriana Zandberga, lecz temu...doskwiera pokłosie pobytu w Eurokomisariackim więzieniu. Obecnie, posługuje się imieniem Halfdan Sandbjerg i twierdzi że rozmawia z bogami. Nordyckimi. Reszta jego pobratymców...nie do końca kupuje jego przesłanie. Przez większą część czasu jedynie roleplejują ku uciesze Sandbjerga, ale coraz więcej osób zaczyna to brać na poważnie. Wygnańcy składają się głównie z popleczników ruchów lewicowych z przedupadkowej Polski takich jak Nowa Lewica czy Partia Razem. Ich cel? Wrócić do Polski. Ale jako kto? To się jeszcze okaże...\n\n§H============================================================\nCo oni tu robią?\n============================================================§!\n\nW naszym świecie jest dokładne wytłumaczenie tego. Są to uchodźcy. Uciekli z Eurokomisariatów. Niektórzy nie tylko musieli uciec z okupowanych miast, lecz także ze specjalnych obozów internowania które EK pozakładało. Dania okazała się pierwszym przystankiem na morzu Bałtyckim, i tak już tam zostali w specjalnych obozach dla uchodźców stworzonych przez rząd duński. Główny obóz szybko zaczęli zwać 'Folkvangr' od krainy bogini Freji\n\nA co do miejsca gdzie planują wylądować...Jomsborg to inna nazwa na współczesne polskie miasto Wolin, które wedle odkryć archeologicznych jest miejscem gdzie znajdowała się właśnie legendarna wikińska forteca Jomsborg. Na samej wyspie odbywa się również coroczny Festiwal Wikingow i Słowian, a lokalna populacja chętnie przyjmuje te legendy jako swoje. I to nie jest byle legenda, istnieją stanowiska archeologiczne które naprawdę znalazły tam wiele mogił wikingów i elementy ich wyposażenia. Istnieje również teoria, że sam Harald Sinozęby umarł na Wolinie, ale póki co nie zostało to potwierdzone przez naukowców.\n\n§H============================================================\nKim są postacie z tej frakcji?\n============================================================§!\n\nHalfdan Sandbjerg to nordycka wersja imienia i nazwiska współlidera partii Razem, Adriana Zandberga. I tak się akurat składa, że sam Zandberg posiada pewne konotacje z Danią, jako że urodził się w duński mieście Aalborg, a popularne memy chętnie określają go jako \"Potężnego Duńczyka\". To głównie dlatego, że chyba naprawdę w jego żyłach płynie krew gigantów Jotunów - dlatego jest taki wielki. Tak czy owak, był on jednym z najważniejszych przedstawicieli Polskiej sceny politycznej. Jest absolutnie bezkompromisowy i to widać nawet w podejściu do bycia wikingiem. Ale akurat jego szaleństwo to oczywiście jedynie swoboda twórcza.\n\nMagdalena Biejat to lewicowa polityczka, w realnym świecie już nie jest członkinią partii Razem, gdyż opuściła ją na rzecz innej lewicowej siły - Nowej Lewicy, i nawet z jej ramienia próbowała kandydować w wyborach prezydenckich. Bez większego sukcesu. Jest silną orędowniczką sprawczości. Opuściła stronnictwo Zandberga gdyż czuła, że przez ich bezkompromisowe odrzucenie propozycji wejścia do koalicji rządowej, nie będą oni w stanie nic osiągnąć. W modzie natomiast, nigdy nie opuściła partii Razem, ale nadal przejawia pewne problemy co do modelu zarządzania frakcją.\n\nMarcelina Zawisza to wieloletnia i lojalna współpracowniczka Zandberga i członkini partii Razem. Była tam od samego jej początku i twardo stoi za wszystkim co prezentuje partia i sam Zandberg. Reszta gabinetu rządowego jak Kościelak czy Grucela to również są lokalni przedstawiciele partii Razem.\n\n§H============================================================\nCzym inspirowana jest ta frakcja?\n============================================================§!\n\nGłówne założenie oparte jest oczywiście na postaci Adriana Zandberga i jego przeszłości, głównie dlatego że urodził się w Danii i memosfera chętnie przedstawia go jako wikinga. Żeby wszystko było jasne - nie jest wikingiem. Żył w Danii zaledwie kilka lat, ale sam przyznaje że nie posiada żadnych specjalnych wspomnień z tym krajem. Nie mniej - to i tak niezła aura.\n\nZdecydowaliśmy się pójść głęboko w ten ton wikingowej otoczki Zandberga i połączyć to z jego socjalistyczną duszą. W ścieżce istnieje wiele odwołań do wszelakich przejawów mitologii nordyckiej w popkulturze. Głównie oczywiście bazowaliśmy na samej mitologii nordyckiej i faktycznych sagach. Ale uzupełniliśmy to wieloma nawiązaniami do gier czy muzyki które wykorzystują nordyckie klimaty w swojej twórczości, np. God of War (te nowsze), serial Wikingowie (to chyba oczywiste), zespoły Wardruna czy Heilung (świetne kapele folkowe), i wiele więcej.\n\nTa bardziej zdrowa na umyśle ścieżka wraz ze ścieżką mieszaną wykorzystują wiele propozycji wziętych żywcem z programu politycznego partii Razem. Wiem, wypada to trochę blado w porównaniu z Ragnarokiem, Walkiriami i innymi mitycznymi bytami, ale...wiecie, może to być jednak troszkę lepsze dla samego społeczeństwa. Tak odrobinkę.\n\n§H============================================================\nPomniejsze szczegóły lorowe\n============================================================§!\n\nWszelkie opisy duchów narodowych to cytaty z Eddy Poetyckiej.\n\nIstnieje teoria, że założycielami państwa Polskiego byli wikingowie i Mieszko I to tak naprawdę Dago - wiking, który przybył ze swoją drużyną i osiedlił się w Polsce. Jest to grubymi nićmi szyte, ale bądź co bądź - jest to tylko teoria.\n\nMechanika ekspedycji zawiera w sobie kilka wypraw o bardzo...nieoczekiwanych rezultatach. I nie mam na myśli ONZ które przybywa Ci wpieprzyć. Grzebaliśmy zbyt głęboko w zbiorowej świadomości autystycznej, i znaleźliśmy tam potwora z Loch Ness czy ukryte bazy nazistowskie. Nawet nie pytajcie. Sami nie wiemy.\n"

CONTEXT_DGR: "§H============================================================\nCo to jest za watażka?\n============================================================§!\n\nTa frakcja reprezentuje różne oblicza miasta Dąbrowa Górnicza.\n\nŚcieżka narodowo-bolszewicka to autorski scenariusz łączący nacjonalistyczną i komunistyczną historię tego miasta. Jest ona także powiązana z fikcyjną wizją twórcy z jego nigdy niewydanej opowieści o zagrożeniach wynikających z posiadania zbyt wielkiej władzy.\n\nŚcieżka komunistyczna opiera się na fakcie, że Komunistyczna Partia Polski przez wiele lat miała swoją siedzibę w Dąbrowie Górniczej, gdy jej liderem był Krzysztof Szwej.\n\n§H============================================================\nCo oni tu robią?\n============================================================§!\n\nKomunistyczna Partia Polski przez długi czas miała swoją siedzibę w Dąbrowie Górniczej. Dodatkowo region ten był silnie rozwijany w czasach komunizmu, co pozostawiło trwały socjalistyczny ślad w społeczeństwie. Przez to cały region czasami nazywany jest \"Czerwonym Zagłębiem\".\n\n§H============================================================\nKim są postacie z tej frakcji?\n============================================================§!\n\nRozpoczynamy grę z Marcinem Bazylakiem, który jest rzeczywistym prezydentem Dąbrowy Górniczej w czasach moda. Został wskazany jako następca Zbigniewa Podrazy, a ponieważ wywodzą się z tej samej lewicowej partii, objęcie przez niego urzędu nie było szczególnie trudne.\n\nKrzysztof Szwej to postać niemal legendarna. Niewiele o nim wiadomo - kim jest, skąd pochodzi i czym się zajmuje - poza jednym: ci, którzy znają to nazwisko, wiedzą, że przez długi czas w XXI wieku był liderem Komunistycznej Partii Polski.\n\nAleksander Bargieła to postać fikcyjna. Jest agresywnym nacjonalistą i oportunistą. Ale spokojnie - to nie jest żaden self-insert ani dziecinna fantazja. To po prostu niezbyt dobry człowiek.\n\nDamian Krępa - bardziej znany jako Bas Tajpan - był piosenkarzem i autorem tekstów, tworzącym muzykę na pograniczu reggae, hip-hopu i raggamuffin. W swoich utworach przemycał także wątki słowiańskiej tożsamości i lokalnej dumy. W wyborach samorządowych w 2023 roku startował nawet z list rządzącej miastem partii lewicowej, lecz bez powodzenia. Zmarł tragicznie w 2025 roku po walce z chorobą nowotworową.\n\n§H============================================================\nCzym inspirowana jest ta frakcja?\n============================================================§!\n\nInspiracje są różnorodne. Komuniści to sprawa oczywista - była tu siedziba KPP i bardzo wiele postradzieckich pomników. Przed II wojną światową Dąbrowa Górnicza była również ważnym ośrodkiem ruchu narodowo-socjalistycznego, a obecność środowisk nacjonalistycznych była tu znacząca, co doprowadziło do połączenia tych wpływów i powstania ścieżki narodowego bolszewizmu.\n\nŚcieżka słowiańskiego rastafari inspirowana jest wyłącznie twórczością Basa Tajpana jako artysty reggae - która jest dość... unikalna.\n\n§H============================================================\nPomniejsze szczegóły lorowe\n============================================================§!\n\nWojny Osiedlowe to mocno przerysowany konflikt między dzielnicami, choć istnieją pewne rzeczywiste animozje. Na przykład w Strzemieszycach były grupy dążące do odłączenia się od miasta. Jednak dotyczyło to raczej półświatka i \"ulicznego społeczeństwa\", a nie zwykłych mieszkańców.\n\nGang Faraonów nawiązuje do faktu, że w mieście znajduje się prawdziwa pustynia! No... właściwie to może i Błędów leży w granicach miasta, ale sama Pustynia Błędowska znajduje się w dużej mierze poza nim. Dodatkowo kręcono tam polski film \"Faraon\", a nawet szkoliły się tam jednostki Afrika Korps...\n\nHuta Katowice to największy zakład tego typu w całym kraju. Jak już wiemy po nazwach - bywa z nimi różnie. Katowice są stąd dość daleko, ale to nie przeszkodziło urzędnikom nadać takiej nazwy.\n\nBroadway i Manhattan to prawdziwe nazwy niektórych części dzielnicy Gołonóg. Przez długi czas były nieoficjalne, ale po latach tak się utrwaliły, że nawet przystanki autobusowe nazwano w ten sposób.\n\nDąbrowa Górnicza to miasto o niezwykle zróżnicowanym krajobrazie. Można tu znaleźć gęsto zabudowane centra miejskie, rzadszą zabudowę, obszary przemysłowe, tereny wiejskie, pola, lasy, równiny, jeziora, rzeki, wzgórza, a nawet pustynię. Przy powierzchni największego miasta w województwie naprawdę można tu znaleźć wszystko.\n\nSławków w rzeczywistości jest osobnym miastem, ale na potrzeby lore został włączony do Dąbrowy Górniczej. Nie jest to aż tak duże naciągnięcie, bo przez pewien czas faktycznie do niej należał. Jednak mieszkańcy nie byli z tego zadowoleni i zdecydowali się odłączyć, przyłączając się do powiatu będzińskiego po przeciwnej stronie Dąbrowy Górniczej, stając się tym samym administracyjną eksklawą.\n\nPodobnie jak w Warszawie, w Dąbrowie Górniczej również znajduje się Pałac Kultury - tylko mniejszy. Były plany jego rozbudowy, ale najwyraźniej teren w mieście, będący kiedyś jedną wielką kopalnią węgla, nie jest aż tak stabilny.\n\nWszystkie opisy celów narodowych pisane są z perspektywy Aleksandra Bargieły, co jest celowym zabiegiem i tak, ma być stronnicze.\n"

CONTEXT_CAL: "§H============================================================\nCo to jest za watażka?\n============================================================§!\n\nCalisia to państwo, które za wszelką cenę próbuje przywrócić chwałę i potęgę Cesarstwa Rzymskiego. Może to wyglądać jak LARP, ale z czasem robi się naprawdę poważnie. Towarzyszą temu wszystkie wzloty i upadki prawdziwego Rzymu - od walk frakcyjnych, przez przewroty pretorian, niesforny Senat, aż po najazdy barbarzyńców. To szybka \"lekcja\" historii klasycznej zamknięta w polskim watażce postupadkowym.\n\n§H============================================================\nCo oni tu robią?\n============================================================§!\n\nMiasto Kalisz uchodzi za mające długą historię, jednak niektórzy twierdzą, że jego korzenie sięgają aż starożytnego miasta Calisia, które widnieje na mapie Ptolemeusza gdzieś w tym regionie. Znaleziono tu także wiele artefaktów z czasów rzymskich. Jeśli chodzi o powiązania z Cesarstwem Rzymskim, nie są one szczególnie mocne, ale to nie powstrzymuje miasta przed pielęgnowaniem tej rzekomej historii. Wiele nazw ulic i budynków nawiązuje do starożytności, a miasto jest z tego dumne.\n\n§H============================================================\nKim są postacie z tej frakcji?\n============================================================§!\n\nRyszard Kalisz to prawnik i lewicowy polityk, który przez wiele lat był częścią polskiego parlamentu. Choć jego najlepsze lata ma już za sobą, nadal pozostaje aktywny w życiu politycznym. Znalazł się tu właściwie wyłącznie ze względu na swoje nazwisko. Jego jedyne powiązania z Cesarstwem Rzymskim to znajomość prawa oraz być może kilka wakacji we Włoszech. Zawsze był jednak pogodnym człowiekiem i - mimo pozorów - kobieciarzem. Nietrudno wyobrazić go sobie jako hedonistycznego cesarza.\n\nReszta postaci to prawdziwi politycy z regionu, a niektórzy z nich to uczeni specjalizujący się w historii starożytnej lub średniowiecznej.\n\nPrawdziwym prezydentem miasta Kalisza jest Krystian Kinastowski, który tutaj pełni rolę prefekta Gwardii Pretoriańskiej.\n\nMarcus Vinicius to postać z polskiego filmu \"Quo Vadis\" (bazującym na książce) opowiadającego o spaleniu Rzymu przez Nerona, grana przez Pawła Deląga. Wygląda po prostu zbyt dobrze, żeby nie wykorzystać tej okazji i uczynić go postacią w grze.\n\nMarcin Najman, który w jednym z zakończeń zostaje cesarzem, naprawdę występował jako \"cesarz\" w jednym ze swoich numerów promujących gale walk. Lubił też komentować bieżące wydarzenia polityczne, przebrany za wspomnianego \"cesarza\".\n\n§H============================================================\nCzym inspirowana jest ta frakcja?\n============================================================§!\n\nRzymem. Bardzo dużą ilością Rzymu.\n\nA także faktem, że Calisia widnieje na mapie Ptolemeusza.\n\nI być może trochę Legionem Cezara z Fallouta - ale nie było to kluczowe.\n\n§H============================================================\nPomniejsze szczegóły lorowe\n============================================================§!\n\nJest tu wiele odniesień do filmu \"Asterix i Obelix: Misja Kleopatra\". Nie muszę chyba mówić, że my, Polacy - uwielbiamy ten film.\n\nTa frakcja została stworzona głównie po to, żeby napisać jak najwięcej wydarzeń o Ryszardzie Kaliszu chodzącym do sklepu Żabka (po łacinie Ranula). To znaczy - nie do końca tylko po to, ale w trakcie tworzenia stało się to pewnego rodzaju wewnętrznym żartem.\n"

CONTEXT_ATM: "§H============================================================\nCo to jest za watażka?\n============================================================§!\n\nAtomowa Krucjata to fikcyjna frakcja, która zaczęła się jako mistyfikacja - zagrożenie starannie wykreowane przez departament propagandy Bractwa oraz książki Starszego Ziemkiewicza. Z czasem jednak to zagrożenie zaczęło realnie przyciągać zwolenników swojej ideologii i Jakub Wiech nie miał innego wyboru, jak tylko podążyć za tym nurtem. Jest to ekologiczna krucjata przeciwko węglowi i emisjom, a co więcej - frakcja pronuklearna, która nie spocznie, dopóki Polska nie osiągnie statusu potęgi atomowej.\n\n§H============================================================\nCo oni tu robią?\n============================================================§!\n\nCzy istnieje lepsze miejsce dla entuzjastów atomu niż Strefa Wykluczenia na Bałutach? To również idealny punkt wyjścia do rozpoczęcia ekologicznej krucjaty przeciwko Bractwu Węgla, które swoimi czarnymi łapskami kontroluje całe województwo.\n\n§H============================================================\nKim są postacie z tej frakcji?\n============================================================§!\n\nJakub Wiech to jeden z bardziej znanych polskich dziennikarzy i ekspertów od energii odnawialnej, który staje przed niemal niemożliwym zadaniem przekonania Polaków, że odnawialne źródła energii nie są ukrytym złem, a energetyka jądrowa jest bezpieczna i niezbędna dla rozwoju kraju. Nie wszyscy jednak darzą go podziwem.\n\n§H============================================================\nCzym inspirowana jest ta frakcja?\n============================================================§!\n\nAtomowa Krucjata silnie nawiązuje do klimatu Fallouta - można tu wyczuć lekkie inspiracje Dziećmi Atomu, ale starano się też wpleść inne nuklearne motywy, takie jak chociażby serie Stalker czy Metro.\n\nW trwającym sporze politycznym Jakub Wiech jest zdecydowanym przeciwnikiem niemieckiej polityki klimatycznej, zwłaszcza programu Energiewende oraz zamykania elektrowni jądrowych, co w lore gry prowadzi do konfrontacji z państwem niemieckim w końcowej fazie rozgrywki.\n\n§H============================================================\nPomniejsze szczegóły lorowe\n============================================================§!\n\nDrzewko celów budowy elektrowni jądrowych inspirowane jest różnymi rzeczywistymi propozycjami budowy pierwszej polskiej elektrowni atomowej. Niektóre z nich zostały odrzucone, inne były poważnie rozważane - skupiliśmy się na tych najciekawszych.\n\nPozyskiwanie złóż uranu w grze jest dość naciągane względem rzeczywistych zasobów Polski - większość z nich uznaje się za nieopłacalne w eksploatacji lub wymagające ogromnych zmian w zagospodarowaniu zamieszkanych terenów. Ale to wciąż tylko gra, a dokładne wyliczenie ilości surowca z każdego złoża byłyby ogromnym problemem, więc liczby zostały uproszczone.\n\nJakub Wiech jest jedną z nielicznych prawdziwych osób, które wiedzą o naszym modzie - i był wobec niego bardzo pozytywnie nastawiony. Nie jesteśmy w stanie wystarczająco go pochwalić, więc jeszcze raz przesyłamy mu nasze pozdrowienia.\n\nPierwsze drzewko fokusów zostało stworzone... w pieprzonym śnie jednego z deweloperów.\n"

CONTEXT_BBW: "§H============================================================\nCo to jest za watażka?\n============================================================§!\n\nBractwo Węgla to fikcyjna frakcja, której jedynym celem jest sprawienie że Polska będzie spalać węgiel. I spalać go w ilościach hurtowych.\n\nZorganizowani są w formie pseudo zakonu wojskowego z lekkim zabarwieniem liberalnego podejścia do gospodarki (przynajmniej na starcie)\n\nPrzeciwstawiają się jakimkolwiek formom ekologizmów i wszystkiego co związane z energią odnawialną.\n\n§H============================================================\nCo oni tu robią?\n============================================================§!\n\nKopalnia Bełchatów jest jedną z największych kopalni węgla brunatnego w Europie. Jest tak gigantyczna że widać ją z kosmosu.\n\nElektrownia Bełchatów, która jest zlokalizowana w bezpośrednim sąsiedztwie kopalni, jest największą elektrownią węglową w Polsce. Odpowiada za produkcję ok. 20-30% całkowitej produkcji energii w kraju.\n\nBractwo Węgla posiada również lokalne frakcje w Lublinie i na Górnym Śląsku, ale główna siedziba zlokalizowana jest w Bełchatowie ze względu na centralną lokalizację.\n\n§H============================================================\nKim są postacie z tej frakcji?\n============================================================§!\n\nPostacie z tej frakcji to głównie dziennikarze i eksperci medialni z odchyleniem prawicowym. Charakteryzują się tym, że wszyscy otwarcie popierają prowęglowy postawy w obecnie toczącej się dyskusji politycznej w Polsce nt. transformacji energetycznej.\n\nRoksana Węgiel jest jedną z najbardziej znanych i uzdolnionych piosenkarek młodego pokolenia, jest tutaj jedynie ze względu na swoje nazwisko.\nDlatego pomyśleliśmy, że będzie to zabawne, szczególnie że jest to jedna z osób które akurat chce od tego węgla odejść...no, nas śmieszyło.\n\n§H============================================================\nCzym inspirowana jest ta frakcja?\n============================================================§!\n\nFrakcja ta jest oczywistą karykaturą Bractwa Stali z serii Fallout, przeniesiona na polskie podwórko. A jako że Polska węglem stała, i obecnie toczy się wielka debata na temat transformacji energetycznej i likwidacji śladu węglowego, to wszystko składa się na ciekawą całość. W dodatku owe postacie biorą czynny udział w tejże dyspucie politycznej.\n\n§H============================================================\nPomniejsze szczegóły lorowe\n============================================================§!\n\nWewnętrzne lore mówi o trzech frakcjach które złożyły się na powstanie Bractwa Węgla przed startem gry; Republika Bełchatowska, Górnicy z Kopalni Bełchatów oraz personel wojskowy z lotniska w Łasku.\n\nBractwo Węgla zaopatruje całą strefę Dialogu w prąd i węgiel. Nie za bardzo chcą, ale muszą. Znaczy nie muszą, ale opłaca im się póki co podtrzymywać ten sojusz.\n\nIstnieją przesłanki o pewnych ukrytych kultach, czczących węgiel i piece, ale to tylko plotki, prawda?\n\nSmog nie istnieje. A nawet jeśli - to jest dobry dla organizmu. Wszak to największy przejaw postępu. Ale uważajcie na pewne skutki uboczne mimo wszystko.\n\nAle za to smogowe cegły istnieją. Pewien chińczyk użył wielkiego odkurzacza przemysłowego by oczyszczać powietrze w jednym z chińskich miast i z syfu który pozostał na filtrach stworzył cegły. To było tak bardzo pięknie Bractwowe, że musieliśmy to wykorzystać.\n"

CONTEXT_BRZ: "§H============================================================\nCo to jest za watażka?\n============================================================§!\n\nZwiązek Wolnych Klubów Truskolaskich to fikcyjny związek piłkarski, który powstał w niewielkiej okołoczęstochowskiej wsi Truskolasy. Jego celem jest odmienienie całej polskiej piłki oraz przeprowadzenie rewolucji w sposobie jej zarządzania i stosowanej taktyce. Jest wszystkim, czym polski futbol nie jest, a zarazem wszystkim, czym jest. Uosabia niższe ligi i ducha piłki nożnej, którego można odnaleźć wyłącznie na lokalnych kartofliskach.\n\n§H============================================================\nCo oni tu robią?\n============================================================§!\n\nTruskolasy są miejscem narodzin dwóch ważnych postaci polskiego futbolu: Jerzego Brzęczka, byłego selekcjonera reprezentacji Polski, oraz jego siostrzeńca, Jakuba Błaszczykowskiego, który stał się legendarnym prawoskrzydłowym znanym ze swoich umiejętności i poświęcenia na boisku. Poza tym region nie wyróżnia się właściwie niczym szczególnym - uznaliśmy więc, że rewolucyjny piłkarski watażka będzie bardzo ciekawym i wyjątkowym pomysłem.\n\n§H============================================================\nKim są postacie z tej frakcji?\n============================================================§!\n\nJerzy Brzęczek był polskim piłkarzem, znanym przede wszystkim jako członek drużyny, która zdobyła złoto na igrzyskach olimpijskich w 1992 roku, a przez stosunkowo krótki okres pełnił również funkcję selekcjonera reprezentacji Polski (2018-2021). Wystarczająco jednak długo, by jego kadencję naznaczyły liczne kontrowersje i cała masa memów. Ze względu na pokrewieństwo z Jakubem Błaszczykowskim pojawiały się oskarżenia o nepotyzm, ale przede wszystkim jego styl prowadzenia drużyny był dla kibiców dość... problematyczny. Przeprowadził reprezentację Polski przez eliminacje do Euro 2020, które zakończyła na pierwszym miejscu. Nie grała jednak z polotem i wszystkim się to nie podobało. W nagrodę za zajęcie pierwszego miejsca Brzęczek został więc zwolniony i nawet nie pojechał na turniej. Zamiast niego PZPN zatrudnił jakiegoś portugalskiego oszusta, który zajął jego miejsce i zniszczył naszą reprezentację. Właśnie dlatego uznaliśmy, że nienawiść do Portugalii będzie jednym z kluczowych elementów jego charakteru. Poza tym pragnie zrewolucjonizować polską piłkę i pozbyć się wszystkiego, co czyni ją słabą.\n\nJakub Błaszczykowski był polskim piłkarzem, słynącym z legendarnych lat spędzonych na prawym skrzydle Borussii Dortmund. Jest również siostrzeńcem Jerzego Brzęczka, przez co samego Brzęczka nazywa się czasem \"Wujkiem\". Kuba był niezwykle lubianym zawodnikiem, ponieważ zawsze zostawiał na boisku całe serce i nigdy nie odpuszczał. Dlatego jest prawą ręką Brzęczka i jego przyszłym następcą, choć nie pochwala wszystkich bezkompromisowych decyzji swojego wuja.\n\nRobert Lewandowski jest najbardziej znanym polskim piłkarzem na świecie, a prawdopodobnie również najbardziej znanym obecnie Polakiem w ogóle. Nie musimy właściwie tłumaczyć, kim jest; powiem tylko, żebyście wpisali na YouTubie \"Lewandowski 5 goli\" i obejrzeli filmik. To wystarczy. W PiU zamierza stanąć na czele reformatorskiego skrzydła ZWKT, ponieważ jako człowiek, który poznał futbol na najwyższym poziomie, wie, jak wynieść polską piłkę do światowej czołówki. Nie da się tego jednak pogodzić z wizją Brzęczka.\n\n§H============================================================\nCzym inspirowana jest ta frakcja?\n============================================================§!\n\nPolską piłką. Klimatem niższych lig. Życiem i karierą Brzęczka. Memami o PZPN, a także... RKS-em Chuwdu z animacji Kapitan Bomba, który bardzo pomógł nam wczuć się w ten klimat. Licznymi dziełami i materiałami poświęconymi piłce nożnej, takimi jak \"Piłkarski poker\", \"Ted Lasso\", kanał na YouTubie \"Kartofliska\" i wiele, wiele innych. Piłka jest wszędzie wokół nas. Musimy tylko po nią sięgnąć i zrobić z niej zawartość do moda HoI4.\n\n§H============================================================\nDodatkowe informacje o świecie\n============================================================§!\n\nJa (Herder) mogłem postradać zmysły podczas prób ponownego zakodowania obu mechanik tego kraju.\n\nW zawartości ZWKT jednym z celów ich gniewu jest Biedronka. Wynika to z faktu, że choć stworzył ją Polak, obecnie zarządza nią portugalska firma Jeronimo Martins.\n\nNiektóre kluby reprezentujące poszczególnych watażków są zmyślone. Inne istnieją naprawdę, ale zmieniliśmy ich nazwy.\n\nOlimpia Truskolasy istnieje jednak naprawdę.\n\n\n"