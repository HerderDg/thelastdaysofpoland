## PATHS ##
PATHS_CAL: "§RUWAGA - SPOILERY!!!§!\n\n============================================================\n§p1. Popularzy:§!\n\nBy osiągnąć §pZakończenie Popularów§!, musisz skutecznie ustanowić dominację nad Senatem, jednocześnie utrzymując lojalność pozostałych §0frakcji§!. §pPopularzy§! muszą pójść na ugodę podczas kryzysu.\n\nMusisz przepchnąć w senacie ustawę §pPopularów§! w celu narodowym §YLex Barbarorum§!.\n\n§12. Optimates:§!\n\nBy osiagnąć §1Zakończenie Optymatów§!, musisz skutecznie ustanowić dominację nad Senatem, jednocześnie utrzymując lojalność pozostałych §0frakcji§!. §1Optymaci§! muszą być nieugięci i bezkompromisowi, szczególnie w czasach kryzysu.\n\nMusisz przepchnąć w senacie ustawę §1Optymatów§! w celu narodowym §YLex Barbarorum§!.\n\n§03. Spisek Pretoriański:§!\n\nBy rozpocząć §0Spisek Pretoriański§!, §0Gwardia Pretoriańska§! musi w pewnym momencie rozgrywki stać się nielojalna wobec §YCesarza§! (osiągnąć poniżej 30% lojalności). Spisek rozpocznie się w czasach Kryzysu, podczas podążania ścieżką §pPopularów§!, wtedy gdy ich knowania w Senacie stają się jawne. Gdy plan zostanie sformułowany, gravitas §0Pretorian§! musi być utrzymane wyżej niż gravitas §YCesarza§! by uniemożliwić mu odkrycie spisku.\n\nIch ścieżka pozwala na zabezpieczenie sobie absolutnej władzy, lub do podążenia w ślady Cyncynata, oddając najwyższą władzę w ręce Senatu, oczywiście z lekką nutą nadzoru.\n\n§03a. Cesarstwo Pretoriańskie:§!\n\nZ powodzeniem przeprowadź §0Spisek Pretoriański§!. Zaraz po nim, §1Optymaci§! będą musieli zostać odsunięci w cień za pomocą celu narodowego §YDiscordia§!\n\n§03b. Odtworzenie Res Publici:§!\n\nZ powodzeniem przeprowadź §0Spisek Pretoriański§!. Zaraz po nim, doprowadź do ugody z §1Optymatami§! za pomocą celu narodowego §YConcordia§!\n\n§g4. Triumwirat:§!\n\nZakończenie Triumwiratu również wymaga od Ciebie, by w pewnym momencie rozgrywki §0Pretorianie§! stali się nielojalni wobec cesarza, aczkolwiek tym razem podążając ścieżką §1Optymatów§!. Jeśli §0Pretorianie§! byli kiedykolwiek nielojalni wobec §YCesarza§! a ich gravitas jest większe niż §1Optymatów§! w momencie gdy §1Optymaci§! chcą zapewnić sobie władzę nad Calisią podczas Kryzysu, §YCesarza§! spotka tajemnicza śmierć.\n\n§R5. Upadek Calisii:§!\n\nWieczne Miasto musi wpaść w ręce §RGerman§!, by umożliwić nowemu §RBarbarzyńskiemu§! władcy wstąpienie na tron w swoim własnym, nowym królestwie.\n\nOsiągnąć to możesz poprzez stracenie Calisii i uzyskanie 60% postępu kapitulacji podczas Kryzysu Barbarzyńskiego, lub 90% postępu kapitulacji posiadając stolicę."
PATHS_BBW: "§RUWAGA - SPOILERY!!!§!\n\n============================================================\n§g1. Rafał Ziemkiewicz - Twardogłowe Bractwo:§!\n\nBy grać jako Rafał Ziemkiewicz, musisz się upewnić, że wybierasz jak najbardziej bezkompromisowe opcje w drzewkach celów narodowych (Pamiętaj, by wybrać Jakuba Zgierskiego na lidera Karbonariuszy). Do tego, gdy dotrzesz do etapu regionalnego będziesz musiał sobie poradzić z kryzysem energetycznym i blackoutem.\n\n§72. Roksana Węgiel - Zreformowane Bractwo:§!\n\nBy grać jako Roksana Węgiel, musisz się upewnić, że wybierasz reformatorskie i bardziej ugodowe opcje w drzewkach celów narodowych (Pamiętaj, by wybrać Roksanę Węgiel jako liderkę Karbonariuszy), szczególnie zwracaj uwagę pod koniec gry na możliwe opcje. Oczywiście, również gdy dotrzesz do etapu regionalnego będziesz musiał sobie poradzić z kryzysem energetycznym i blackoutem.\n\n§H3. Jakub Wiech - Atomowa Krucjata:§!\n\nBy zagrać jako Atomowa Krucjata musisz ponieść porażkę w zwalczaniu kryzysu energetycznego i blackoutu. Najłatwiej osiągnąć to usuwając swoje elektrownie lub wybierając opcje niszczenia odnawialnych źródeł energii w wydarzeniach. Następnie jedynie co musisz zrobić...to wygrać wojnę domową."
PATHS_ATM: "§RUWAGA - SPOILERY!!!§!\n\n============================================================\n§H1. Zakończenie atomowe:§!\n\nPo prostu wybierz cel narodowy §H...zima nuklearna§! w ostatnim drzewku i wygraj wojnę.\n\n§72. Zakończenie pokojowe§!\n\nPo prostu wybierz cel narodowy §H...i jesteśmy gotowi§! w ostatnim drzewku."
PATHS_DGR: "§RUWAGA - SPOILERY!!!§!\n\n§N============================================================\n1. Narodowy Bolszewizm:\n============================================================§!\n\n- Upewnij się że §NKongres Będziński§! zakończy się porażką (możesz to osiągnąć wybierając opcje dla tylko jednej frakcji)\n\n- Podczas mechaniki balansu sił §NRozbieżności Politbiura§! opowiedz się po stronie §NFrakcji Partyzantów§!.\n\n- Podczas kryzysu §NTrzy Życzenia§! zapoczątkowanego przez §NBas Tajpana§!, opowiedz się za legalizacją marihuany.\n\n§R============================================================\n2. Narodowy Komunizm:\n============================================================§!\n\n- Upewnij się że §RKongres Będziński§! zakończy się porażką (możesz to osiągnąć wybierając opcje dla tylko jednej frakcji). W przyszłości ta ścieżka będzie również dostępna poprzez osiągnięcie sukcesu na Kongresie Będzińskim, ale póki co...lepiej przegrać.\n\n- Podczas mechaniki balansu sił §RRozbieżności Politbiura§! opowiedz się po stronie §RFrakcji Śląskiej§!.\n\n- Podczas kryzysu §RTrzy Życzenia§! zapoczątkowanego przez §RBas Tajpana§!, opowiedz się za legalizacją marihuany.\n\n§7============================================================\n3. Słowiańskie Rastafari:\n============================================================§!\n\n- Upewnij się że §7Kongres Będziński§! zakończy się porażką (możesz to osiągnąć wybierając opcje dla tylko jednej frakcji).\n\n- Podczas mechaniki balansu sił §7Rozbieżności Politbiura§! opowiedz się po obojętnie jakiej stronie.\n\n- Podczas kryzysu §7Trzy Życzenia§! zapoczątkowanego przez §7Bas Tajpana§!, opowiedz się PRZECIWKO legalizacji marihuany\n"
PATHS_JOM: "§RUWAGA - SPOILERY!!!§!\n\n§s============================================================\n1. Uzdrowienie - Zdrowa ścieżka Adriana Zandberga :\n============================================================§!\n\n- Podczas mechaniki balansu sił §sZmierzch Człowieka§! dobij do maksymalnego poziomu strony §sWoli§! trzykrotnie. Za każdym razem uruchomi to sekwencję snów. Tam, będziesz musiał wybrać najbardziej prawdopodobne dla tej ścieżki opcje. Po trzech udanych sekwencjach po stronie §sWoli§!, Zandberg zostanie uzdrowiony, a ścieżka którą podążasz już się nie zmieni.\n\n§R============================================================\n2. Odrodzenie - Ścieżka socjalistycznego wikinga Path:\n============================================================§!\n\n- Podczas mechaniki balansu sił §RZmierzch Człowieka§! upewnij się że żadna ze stron nie posiada trzech poziomów ukończenia snów. Podczas sekwencji będziesz musiał wybrać najbardziej prawdopodobne dla tej ścieżki opcje. Jeżeli przejdziesz trzy sny po różnych stronach, Zandberg uświadomi sobie że jest czymś całkowicie nowym, a ścieżka którą podążasz już się nie zmieni.\n\n§1============================================================\n3. Przeznaczenie - Nordycka ścieżka Adriana Zandberga Path:\n============================================================§!\n\n- Podczas mechaniki balansu sił §1Zmierzch Człowieka§! dobij do maksymalnego poziomu strony §1Przeznaczenia§! trzykrotnie. Za każdym razem uruchomi to sekwencję snów. Tam, będziesz musiał wybrać najbardziej prawdopodobne dla tej ścieżki opcje. Po trzech udanych sekwencjach po stronie §1Przeznaczenia§!, Zandberg zostanie opanowany przez duchy przodków, i rozgorzeje rzeź, a ścieżka którą podążasz już się nie zmieni.\n"
PATHS_BRZ: "§RUWAGA - SPOILERY!!!§!\n\n§R============================================================\n1. Ortodoksyjny Klubizm - Jerzy Brzęczek\n============================================================§!\n\n- Podczas mechaniki balansu sił §RMecz o Władzę§! przejdź na stronę §RBrzęczkowców§!. Po ukończeniu ostatniego celu narodowego w drzewku regionalnym, odpali się wydarzenie które potwierdzi twoją ścieżkę.\n\n§s============================================================\n2. Tradycjonalistyczny Klubism - Jakub Błaszczykowski:\n============================================================§!\n\n- Podczas mechaniki balansu sił §sMecz o Władzę§! nie opowiadaj się definitywnie po żadnej ze stron, lecz balansuj w ten sposób by wskaźnik balansu pozostał w środku. Po ukończeniu ostatniego celu narodowego w drzewku regionalnym, odpali się wydarzenie które potwierdzi twoją ścieżkę.\n\n§E============================================================\n3. Klubizm Reformowany - Robert Lewandowski\n============================================================§!\n\n- Podczas mechaniki balansu sił §EMecz o Władzę§! przejdź na stronę §EReformistów Lewandowskiego§!. Po ukończeniu ostatniego celu narodowego w drzewku regionalnym, odpali się wydarzenie które potwierdzi twoją ścieżkę.\n"

