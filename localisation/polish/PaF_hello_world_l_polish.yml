 COUNTRY_INFO_NO_CONTENT: "§YWITAJ W ŚWIECIE PYCHY I UPADKU\n\n§RTA FRAKCJA NIE POSIADA UNIKALNEJ ZAWARTOŚCI§!\n\n§RTo państwo jest obecnie PUSTE, nie posiada nic oprócz szkieletowych wydarzeń i generycznego drzewka celów narodowych, ewentualnie istnieje po to tylko żeby umrzeć. Wszystkie frakcje z zawartością są zaznaczone w zakładce Interesujące Kraje w głównym menu. \n\nProszę, zagraj owymi, jeżeli chcesz mieć rozgrywkę z jakąkolwiek zawartością. Ale jeśli Ci to nie przeszkadza, baw się dobrze! Zachęcamy również do śledzenia nas na naszych mediach społecznościowych (znajdziesz je w zakładce INFORMACJE O MODZIE), by posiadać bieżące informacje na temat rozwoju naszego moda, a może nawet i dołączyć do nas, kto wie?§!"
