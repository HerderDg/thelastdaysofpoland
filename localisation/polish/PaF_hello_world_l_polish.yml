 ## Mod Features
 MOD_INFO_HEADER: "Przewodnik po mechanikach moda\naka Co do kurwy, devowie?"
 MOD_INFO_MECHANICS_BUTTON_1: "Jedzenie"
 MOD_INFO_MECHANICS_BUTTON_2: "Budżet"
 MOD_INFO_MECHANICS_BUTTON_3: "Energia"
 MOD_INFO_MECHANICS_BUTTON_4: "Inne"
 MOD_INFO_MECHANICS_1: "Żeby żyć, trzeba jeść. To chyba normalne, prawda?\n\nDodaliśmy kolejny zasób, którym jest żywność. To zwykły surowiec, który możecie zdobywać poprzez §Yhandel§! albo budowę §YWielkopowierzchniowych Gospodarstw Rolnych.§!\n\nJeśli zauważyliście, na ekranie polityki znajduje się nawet przycisk określający politykę żywnościową waszego kraju. I wiecie co? Możecie ją sobie §Yzmieniać ręcznie.§! Tylko uważajcie, bo zanim ją zmienicie, musicie sprawdzić, czy macie §Ywystarczająco dużo§! żywności w zapasach. Specjalny tooltip przy polityce powinien wam powiedzieć, o ile więcej żywności będziecie zużywać na następnym poziomie.\n\n§RUWAGA!§! Jeśli wasze zapasy spadną poniżej zera - wasza polityka automatycznie obniży się o jeden poziom.\n\n§YDieta Mięsna, Dieta Wegetariańska§! oraz §YDieta Wegańska§! to specjalne poziomy, które możecie uzyskać wyłącznie poprzez cele narodowe albo wydarzenia.\n\nW przyszłości chciałbym też dodać jakiś własny alert informujący, że macie wystarczająco dużo żywności, żeby wejść na wyższy poziom, albo że głodujecie, czy jakieś inne przydatne gówno, ale kurczę, kodowanie alertów jest dziwne."
 MOD_INFO_MECHANICS_2: "§RPO CO WY W OGÓLE...§!\n\nTak, odważyliśmy się. Spokojnie - nie zamierzamy wam tutaj robić pełnego TNO z milionem różnych wykresów i symulacji gospodarczych, które są bezużyteczne. Tutaj - §Yto po prostu jest bezużyteczne.§!\n\nNie, naprawdę. To głównie dla klimatu. Chyba że chcecie, żebyśmy dorzucili wam więcej minusów za ogromne zadłużenie. Znaczy - musicie wiedzieć przede wszystkim tyle, że mechanika ma was trochę spowolnić przed produkowaniem i budowaniem na taką skalę, że cały kraj by od tego eksplodował.\n\n§YBudynki kosztują pieniądze, jednostki kosztują pieniądze, pieniądze dostajecie z podatków, a efektywność podatkowa określa, jaki procent tych podatków faktycznie otrzymujecie.§! Proste. §YDrukowanie pieniędzy jest opcją,§! są też inne decyzje fiskalne, a w trakcie rozgrywki powinniście dostawać różne §Yidee albo modyfikatory§!, które pomogą wam z kasą. §YEksport surowców§! też pomaga - czujesz ten zapach? Tak pachnie sto złotych.\n\nJest też §Yinflacja§!, więc uważajcie - możecie próbować manipulować nią poprzez decyzje. Jeśli gra imploduje od zbyt dużej liczby cyferek, dajcie nam znać.\n\nI nie płaczcie, że macie §Ydług.§! Wielkie mi halo. Teraz każdy jest zadłużony, tak już po prostu jest na tym świecie."
 MOD_INFO_MECHANICS_3: "Zatem...mieliśmy doskonale działającą mechanikę energetyczną na długo przed tym, jak §RParadox§! przyszedł i postanowił zrobić własną mechanikę kompletnie do dupy. Nasza była lepsza, jest lepsza i będzie lepsza.\n\nŻeby funkcjonować, §Ypotrzebujecie energii.§! A jeśli akurat gracie jednym z państw, które jej nie używają - to dobrze dla was! Ale dla całej reszty - energia przyniesie wam świetlaną przyszłość. Żeby mieć energię, potrzebujecie §Yelektrowni.§! Żeby korzystać z elektrowni węglowych, potrzebujecie, no cóż... §Ywęgla.§! Tylko że węgiel nie jest wszędzie, a handlować można nim tylko dopóki nie wykupicie całego Śląska...\n\nKiedy waszemu państwu zabraknie energii, dostaniecie §Yskalujące się minusy§! do produkcji i budowy, więc raczej nie chcecie do tego doprowadzić.\n\nAlternatywnie macie do dyspozycji §YElektrownie OZE§!. Te cudeńka pozwolą wam pozyskiwać energię z innych źródeł bez używania węgla! Świetnie, ale za każdą §YElektrownię OZE§! będziecie potrzebować §Y1 elektroniki§!. Przepraszamy.\n\nZawsze możecie też pójść w §Yenergię jądrową§! poprzez projekty specjalne. O ile wasza ideologia na to pozwala, oczywiście. Powodzenia!"
 MOD_INFO_MECHANICS_4: "§Y===================KULTURA I RELIGIA===================§!\n\nKażde państwo ma swoją §Yoficjalną religię i kulturę.§! Możecie §Ykonwertować§! regiony na swoją oficjalną wiarę i zrobić ze Warszawy śląskie miasto. Dominująca religia i kultura są obliczane na podstawie kategorii regionów. Im większy region, tym większą wartość ma kultura danego regionu w skali całego kraju. Potem wszystko jest po prostu sumowane. Szczerze mówiąc, §Yto wszystko jest tylko dla immersji.§! W przypadku niektórych państw będzie się to zmieniać wraz z zawartością. Ale tak naprawdę niczego wam to nie daje.\n\n§RTO PO JAKĄ CHOLERĘ TO DODALIŚMY?§! Och, lubimy proste rzeczy. A poza tym to przecież tylko gra w kolorowanie mapy. Więc idźcie sobie §Rk§!§Oo§!§Yl§!§Go§!§Br§!§0o§!§Rw§!§Ya§!§Rć§!, jeśli chcecie. Jeśli nie - to nie. Ale ej, ludzie - poroleplayujcie trochę, wczujcie się. To fajne jest.\n\n§Y====================WYPOWIADANIE WOJEN====================§!\n\nPrawie każdy ma ten sam cel - §Yzjednoczyć Polskę.§! Ale jak?\n\nTak naprawdę całkiem prosto - jeśli wasze państwo ma unikalne drzewko, na pierwszym etapie dostaniecie §Ycele prowadzące do wojen§!. Później dostaniecie §Ydecyzje.§! Zjednoczenie przebiega tak: §YEtap Wojewódzki, Etap Regionalny, Etap Superregionalny, Zjednoczenie Polski.§! Przez kretyńskie AI etapy muszą być mniej więcej oddzielone od siebie §Ykilkoma latami§!. Kompromis, rozumiecie?\n\n§Y==========================INTEGRACJA REGIONÓW==========================§!\n\nNo i chuj. Wszystko można teraz zintegrować poprzez §Ydecyzje.§! Na etapie wojewódzkim §Yintegrujecie całymi regionami strategicznymi.§! Potem dostaniecie oskryptowany interfejs i będziecie mogli integrować §Ycałe województwa§! w kilku krokach.\n\nOczywiście w przypadku niektórych państw, które nie są §Yz natury polskie§! albo same się za takie nie uważają, sprawa robi się bardziej skomplikowana - pierwsze podbite województwo poza tym, w którym zaczęliście, zostanie §Yzintegrowane normalnie.§! Potem kolejne będziecie musieli §Ywyzwolić jako marionetki§! w formie czegoś w rodzaju rządów kolaboracyjnych, żeby to one odwalały za was robotę. Jeśli to jest irytujące... cóż, to znaczy, że działa zgodnie z założeniem. Uwielbiamy wkurwiać was naszym autyzmem."
