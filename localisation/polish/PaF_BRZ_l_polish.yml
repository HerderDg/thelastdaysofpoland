 ##First Tree##
BRZ_first_whistle: "Pierwszy Gwizdek"
BRZ_first_whistle_desc: "Gdy upadek Polski otworzył puszkę Pandory, wylały się z niej wszystkie ideologie świata. Mieszkańcy miast podzielili się - jedni przyłączali się do anarchistów, inni do militarystów, kolejni do Kościoła - a peryferyjne miasteczka Truskolasy, Kłobuck i Krzepice skulone czekały na swego zdobywcę. Przewrotny los sprawił, że na ogólnokrajową scenę wyszedł Jerzy Brzęczek. To, co zaczęło się jako projekt pasjonacki mający przywrócić upadłą karierę trenera w jego macierzystym klubie, przerodziło się w fundament nowej mini-państwowości. Na każdym kroku widział rozpacz i trud swoich braci. Nie mogąc ich zostawić na pastwę losu, przejął władzę, ogłosił się Najwyższym Selekcjonerem i szybko skonsolidował sąsiednie terytoria, by zapewnić pomoc potrzebującym. Tak oto ZWKT stoi samotnie pośrodku burzy, mając dwa cele - osobistą chwałę i dobro wspólne. Czy zblazowany Brzęczek sprosta któremukolwiek z nich, tego jeszcze nie wiemy."
BRZ_representing_olimpia: "Reprezentuję Olimpię Truskolasy"
BRZ_representing_olimpia_desc: "Poza prostym boiskiem, od dawna zarośniętym po niemieckiej inwazji, niewiele zostało z macierzystego klubu Najwyższego Selekcjonera; drużyna, w której stawiał pierwsze kroki, to już tylko wspomnienie. Dla obcego trudno byłoby rozpoznać tu cokolwiek znaczącego. Kiedyś piłka wróci do Polski i osiągnie wyżyny, a to pokorne miasto będzie tego świadkiem, gdy nazwę Olimpia Truskolasy wymieni się obok europejskich potęg. Do tego jednak musimy przywrócić obiekt do stanu używalności, by znów można tu było grać w piłkę, tak jak kiedyś."
BRZ_national_football_team: "Reprezentacja Narodowa"
BRZ_national_football_team_desc: "Na przestrzeni stu lat nasza reprezentacja wielokrotnie nie wykorzystywała swego potencjału, z wyjątkiem jednego epizodu niemal pół wieku temu. Od góry do dołu każdy element gry był stłumiony przez korupcję i przestarzałe metody treningowe. Dlatego nigdy nie byliśmy w stanie konkurować z europejską czołówką, zadowalając się pokonywaniem tylko przeciętnych drużyn i świętując nie triumfy z nimi, lecz niekiedy jedynie awanse. Upadek był w pewnym sensie błogosławieństwem, usuwając szkodliwe instytucje, jak PZPN, i pozwalając futbolowi narodzić się na nowo, bez jarzma establishmentu. Gdy Najwyższy Selekcjoner wreszcie będzie mógł kształtować tę dyscyplinę według swojej woli, zapewnimy Polsce należne jej miejsce wśród najlepszych."
BRZ_first_appointments: "Pierwsze powołania"
BRZ_first_appointments_desc: "Gdy obiekty będą już sprawne, możemy skompletować drużynę. Większość naszych dawnych kontaktów uciekła przy pierwszych plotkach o niestabilności, a wielu, którzy zostali, jest nieosiągalnych, więc będziemy musieli skorzystać z mniej wyszukanych metod rekrutacji. Czas obrzucić terytorium ZWKT ulotkami, bilboardami i ogłoszeniami. Jeśli masz doświadczenie piłkarskie i choć trochę formy, przyjdź na testy - zrobimy, co w naszej mocy, by cię przyjąć. Większość graczy zapewne pozostawi wiele do życzenia, ale z czasem, miejmy nadzieję, ściągniemy prawdziwe talenty."
BRZ_creation_of_nsfl: "Utworzenie Północnośląskiej Ligi Piłkarskiej"
BRZ_creation_of_nsfl_desc: "Aby się rozwijać, nasi zawodnicy potrzebują regularnych występów meczowych. Normalnie wpisanie Olimpii do lokalnego systemu ligowego byłoby proste - wystarczyłby jeden telefon - lecz od czasu rozbicia państwa taki system nie istnieje. Dlatego musimy stworzyć go od zera, na szczęście nie jesteśmy jedyni szukający przeciwników. Obecnie na naszym terenie działa kilkanaście klubów, które chętnie wezmą udział w pierwszym sezonie planowanej ligi. Jeśli któreś pokażą się z dobrej strony, ich najlepsze talenty mogą otrzymać szansę reprezentowania ZWKT przeciw innym zespołom po ponownym ustanowieniu Reprezentacji."
BRZ_klobuck_training_centre: "Kłobuckie Centrum Treningowe"
BRZ_klobuck_training_centre_desc: "Każdy trening, który odbywa się na obecnych obiektach Olimpii Truskolasy, boleśnie ujawnia niedostatki rozpadającego się stadionu. Piłki grzęzną na błotnistym boisku, a skręcone kostki od nierównej murawy ośmieszają nasze ambicje profesjonalizmu. Jedyną drogą naprzód jest budowa zupełnie nowego centrum treningowego - takiego, przy którym nawet najbardziej pretensjonalni byli reprezentanci nie mieliby się do czego przyczepić. Przekształcimy Kłobuck z sennej mieściny w peryferiach Jury w najbardziej szanowany ośrodek sportowy w kraju, wyposażony we wszystko, czego potrzebują nasi zawodnicy. Nie będziemy już zmuszeni szukać świeżego narybku; sprawimy, że każdy szanujący się piłkarz będzie wiedział, że jedyną drogą na rozwój jest przyjście do nas."
BRZ_nsfl_inauguration_cup: "Puchar Inauguracyjny PŚLP"
BRZ_nsfl_inauguration_cup_desc: "W miarę przygotowań do startu ligi, co może być lepszym sposobem na rozkręcenie zainteresowania i danie zawodnikom minut meczowych niż turniej z udziałem najlepszych lokalnych drużyn? Puchar będzie świętem odrodzenia piłki w regionie - zadbajmy więc, by miejscowi znów chwycili za swoje wypłowiałe szaliki i koszulki i domagali się kolejnych widowisk. Wynik może być sprawą drugorzędną, ale zdobycie trofeum na pewno doda splendoru."
BRZ_first_training_camp: "Pierwsze Zgrupowanie"
BRZ_first_training_camp_desc: "W porównaniu z warunkami, do których przywykli nasi zawodnicy, nowe obiekty to szczyt nowoczesności. Jednak nawet najwspanialsze budowle nic nie znaczą bez zawodników. Na szczęście przygotowano wszystko, by ściągnąć najlepszych graczy z całego ZWKT do Kłobucka na pierwsze wspólne zgrupowanie. Wiele osób nie zna jeszcze metod Najwyższego Selekcjonera, więc zajmie trochę czasu, by wszyscy zaadaptowali nowe role i zadania. Niektórzy mogą narzekać na konieczność zmiany stylu, ale to niezbędne, jeśli chcemy rywalizować na szczeblu krajowym."
BRZ_match_liswarta_krzepice: "Mecz z Liswartą Krzepice"
BRZ_match_liswarta_krzepice_desc: "Nasz kolejny rywal - Liswarta - symbolizuje wszystko, co złe w przedupadkowej Polsce. Zatwardziali konserwatyści, ich zwolennicy stanowią centrum oporu wobec naszej władzy i chcą cofnąć większość polityk Brzęczka, przywracając ZWKT do \"sprawdzonych metod\", które doprowadziły do ruiny. Mimo ich krótkowzroczności to stanowisko ściągnęło na nich falę poparcia, co może stanowić zagrożenie, jeśli je zignorujemy. Jaka jest lepsza metoda, by pokazać niższość ich metod, niż zmiażdżenie ich na boisku? Dobry wynik powinien przeciągnąć znaczną część ich fanów na naszą stronę."
BRZ_match_znicz_klobuck: "Mecz ze Zniczem Kłobuck"
BRZ_match_znicz_klobuck_desc: "Przed nami być może najbardziej kłopotliwy zespół ligi. Znicz Kłobuck od zawsze przyciągał nacjonalistów; ich kibole mają reputację brutalnych ulicznych wojowników, patrolujących miasto i agresywnie eliminujących wszelkie oznaki \"antypolskości\" - co często obejmuje wspieranie innych klubów lub czegokolwiek, co im się nie spodoba. Nawet zawodnicy przyjezdni nie zawsze czuli się bezpiecznie, a trudno ufać, że autorytet Brzęczka wystarczy, by zapobiec rozlewowi krwi. Plan jest prosty - pobijemy ich tak mocno, by ich zdemoralizować i szybko się wycofamy."
BRZ_truskolasy_leading_role: "Truskolasy w głównej roli"
BRZ_truskolasy_leading_role_desc: "Jest tylko jeden klub godny wygrania PŚLP i tylko jeden trener godny podniesienia tego trofeum. Kluczowe dla fundamentów naszego państwa jest to, by pierwszą edycję ligi wygrała Olimpia Truskolasy. W końcu jak zbudować mit taktycznego geniusza, który wykreuje nas z pokoleniowego wstydu i pozwoli rywalizować z Hiszpanią, Niemcami, a nawet Portugalią, jeśli nie potrafimy pokonać paru wiejskich drużyn? Niezależnie od wyników przeciw rywalom, musimy zapewnić, że tytuł trafi do nas za wszelką cenę. Jeśli zawiedziemy na boisku, będziemy musieli sięgnąć po inne metody, by uniknąć kompromitacji."
BRZ_strike_force_of_truskolasy: "Truskolaska grupa uderzeniowa"
BRZ_strike_force_of_truskolasy_desc: "Polska anarchia to ziemia bezprawia; choć dążymy do pokojowego współistnienia, nie można tego samego powiedzieć o licznych sąsiednich watażkach. Mimo początkowej niechęci, nasz rząd nie przetrwa bez funkcjonujących sił obronnych, gdy sąsiedzi postanowią zjednoczyć kraj. Musimy zmobilizować zasoby i siły ludzkie, by stworzyć armię zdolną stawić czoła temu, kto spróbuje nas podbić, by nie zostać jedynie przypisem w czyjejś historii sukcesu."
BRZ_issue_preparations_in_clubs: "Przygotowania w klubach"
BRZ_issue_preparations_in_clubs_desc: "Pewnego dnia wojna zawita do Truskolasów. Gdy to nastąpi, potrzebujemy jak najwięcej zdolnych bojowników, by przeciwdziałać przewadze ludnościowej naszych sąsiadów. Nasze przetrwanie zależy od zdolności mobilizacji ludzi do walki. Od teraz każdy klub będzie prowadzić listę swoich sympatyków zdolnych do służby oraz będą zakładać magazyny sprzętu i zapasów na terenie własnych obiektów. Co miesiąc wybrani członkowie przejdą tygodniowe szkolenie podstawowe, by w razie inwazji obywatele ZWKT mogli chwycić za broń i odpierać najeźdźców."
BRZ_have_faith_in_hooligans: "Wiara w kiboli"
BRZ_have_faith_in_hooligans_desc: "Jeśli nie potrafimy ich spacyfikować, wykorzystajmy ich. Zagramy na dwa fronty: pozbędziemy się ultrasów z ulic i skierujemy ich na wroga. Podczas gdy większość rekrutów drży na myśl o froncie, ci fanatycy będą szukać walki sami, tworząc jedne z najbardziej bezwzględnych jednostek w regionie. Wystarczy dać im udział w łupach i wolną rękę w zwalczaniu wrogów - i od czasu do czasu przymknąć oko na ich działania."
BRZ_professional_fighting_squads: "Profesjonalne drużyny wojowników"
BRZ_professional_fighting_squads_desc: "Wczesne raporty ze szkoleń dochodzą do biurka Najwyższego Selekcjonera z jednym wnioskiem: w obecnym stanie nasze milicje są całkowicie niezdolne do walki i prawdopodobnie rozpadną się w starciu z każdą kompetentną armią. Sektor Znicza ocenia, że ich jednostki utrzymają linię najwyżej kilka godzin, zanim zostaną pokonane - co i tak jest jedną z łagodniejszych ocen. Jeśli mamy jakąkolwiek szansę obrony, nasze pospolite ruszenie musi zostać sformowane na wzór profesjonalnej armii. Koniec z rutynowym strzelaniem do celu i rozmowami z kolegami - od teraz żołnierze ZWKT poznają znaczenie dyscypliny. Podziękują nam, gdy uratuje im to życie."
BRZ_show_of_brutal_force: "Pokaz brutalnej siły"
BRZ_show_of_brutal_force_desc: "Czas spuścić psy ze smyczy i wysłać kiboli na ziemie Częstochowy. Wzbudzenie paniki wystarczy, by odstraszyć Archidiecezję od ataku na nasze terytorium, dając nam chwilę wytchnienia przed kolejnym etapem działań. Dotrzymanie słowa wobec kiboli i pozwolenie im działać swobodnie zapewni ich lojalność w nadchodzących konfliktach. W końcu nie mają powodu gryźć ręki, która ich karmi."
BRZ_every_man_a_footballer: "Każdy mężczyzna piłkarzem, każdy piłkarz żołnierzem"
BRZ_every_man_a_footballer_desc: "Sukces działań militarnych zależy od pełnej solidarności obywateli. Żołnierze na froncie polegają na wsparciu robotników w kraju, które zapewnia ciągły dopływ wyposażenia. Z uwagi na ciężką pracę potrzebną do zaopatrzenia armii, by utrzymać morale zorganizujemy linie montażowe w fabrykach amunicji tak, by grupować pracowników według sympatii klubowych, gwarantując im, że produkty ich pracy trafiają do żołnierzy reprezentujących ich barwy. Dzięki temu nie będą już produkować dla anonimowych obcych, lecz dla towarzyszy ze stadionu."
BRZ_crusade_of_supreme_coach: "Krucjata Najwyższego Selekcjonera"
BRZ_crusade_of_supreme_coach_desc: "Nasz region był od dawna zaniedbany i niedorozwinięty; nie trzeba było niemieckich bomb, by doprowadzić go do ruiny. Gdy pomoc z Częstochowy ustała, nierównowagi lokalnej hierarchii stały się oczywiste. Bogaci wykorzystali okazję i uciekli, zabierając ze sobą majątek, a zwykli ludzie zostali sami. Bez przewodniej ręki gospodarka sprowadziła się do przetrwania, a często nawet i tego nie zapewniało. Jeśli ma nastać lepsze jutro, Jerzy Brzęczek musi postawić region na nogi, inaczej cierpliwość ludzi wobec jego rządów może się wyczerpać."
BRZ_destroy_biedronka: "Zniszczenie Biedronek"
BRZ_destroy_biedronka_desc: "Przez prawie dekadę w sercu Najwyższego Selekcjonera tliła się wściekłość, wywołana wieloma porażkami przeciwko odwiecznemu wrogowi - Portugalii. Każde spotkanie kończyło się upokorzeniem, podważając jego reputację. Nawet teraz część wroga działa wśród nas, ukrywając się jako jedna z największych polskich firm. Czują się bezpiecznie, ale widzimy przez ich kłamstwa i nie spoczniemy, aż ostatnia Biedronka nie zamieni się w gruz."
BRZ_reopening_erg_klobuck: "Wymuszone ponowne otwarcie ERG Kłobuck"
BRZ_reopening_erg_klobuck_desc: "Przez dekady ERG dawało pracę mieszkańcom Kłobucka. Fabryki leżą teraz odłogiem, ich bankructwo wstrzymało produkcję niemal dwadzieścia lat temu. Puste hale są idealne, by rozkręcić przemysł na nowo, przerzucając produkcję na sprzęt - stroje, piłki i podobne - które są potrzebne u nas i które, przy odrobinie szczęścia, możemy eksportować do innych watażków. Pod naszym nadzorem ERG może stać się motorem dobrobytu regionu."
BRZ_every_school_a_club: "Każda szkoła klubem piłkarskim"
BRZ_every_school_a_club_desc: "Może nas kusić, by przeznaczyć większość funduszy na natychmiastowe wzmocnienia, ale nie możemy zaniedbać najmłodszych. Choć w kraju są tysiące piłkarzy, większość z nich to praktycznie drewno pod względem techniki. A starych psów trudno nauczyć nowych sztuczek. Skoro szkoły ledwo działają z powodu braków materiałowych, czemu nie dać dzieciom alternatywy? Zbudujemy Orlik przy każdej szkole i wprowadzimy obowiązkowe treningi dla najmłodszych. Przy odpowiednim zaangażowaniu i trenerach wychowamy nowe pokolenie, które przewyższy Orły Górskiego."
BRZ_zwkt_supplies: "Przejęcie zaopatrzenia przez ZWKT"
BRZ_zwkt_supplies_desc: "Przejęcie Biedronki dało nam ogromne ilości towarów zalegających w magazynach tej przeklętej firmy. Tysiące ludzi w regionie głoduje, podczas gdy góry niesprzedanych produktów gniją w magazynach. Dzięki nowym środkom możemy wreszcie ulżyć ludności, redystrybuując zapasy w ramach pokazu naszej dobrej woli. Puste sklepy zamienimy w centra dystrybucji, z których pojadą codzienne ciężarówki zaopatrujące nawet najdalsze zakątki państwa, by nikt nie musiał iść spać głodny."
BRZ_zwkt_industry: "Przejęcie przemysłu przez ZWKT"
BRZ_zwkt_industry_desc: "W miarę jak niestabilność ogarniała Rzeczpospolitą, kapitał zagraniczny odpływał, bo obawiano się utraty majątku. W rezultacie wiele fabryk i magazynów stoi porzuconych, a ich własność jest niejasna po panicznych sprzedażach. Jako jedyna względnie legalna władza w regionie mamy prawo przejąć te kompleksy i dać ludziom pracę. Choć nie dorównamy przemysłowym potęgom Zagłębia, zapewnimy, że wszystko, czego potrzebuje mieszkaniec Truskolasów, może być wyprodukowane lokalnie."
BRZ_zwkt_infrastructure: "Przejęcie infrastruktury przez ZWKT"
BRZ_zwkt_infrastructure_desc: "Brak dużych miast sprawił, że nasz region był długo zaniedbany; drogi często nie mają więcej niż jednego pasa łączącego miejscowości. Choć do tej pory wystarczało to do skromnego życia naszych obywateli, nie przystaje to do roli potencjalnego centrum piłkarskiego na skalę krajową. Teraz, gdy mamy środki, naprawimy tę sytuację i zbudujemy nowoczesną infrastrukturę, sprowadzając do Truskolasów młodych graczy marzących o lepszym życiu."
BRZ_introduction_of_clubism: "Wprowadzenie Klubizmu"
BRZ_introduction_of_clubism_desc: "Wreszcie stworzyliśmy państwo zgodne z wizją Brzęczka. Wraz z właścicielami, zawodnikami i najważniejszymi kibicami terenowych klubów oraz naszymi doradcami oficjalnie spiszemy zasady ideologii Klubizmu. To siła jednocząca, obejmująca nominalnych rywali pod sztandarem ZWKT, pozwalająca nam wyjść ponad podziały klasowe, religijne i klubowe. Jesteśmy braćmi, a pod opieką Najwyższego Selekcjonera pracujemy dla lepszej przyszłości, by każdy mógł dzielić chwałę, którą przyniesiemy polskiemu futbolowi."
BRZ_send_envoy_to_lubliniec: "Poselstwo do Lublińca"
BRZ_send_envoy_to_lubliniec_desc: "Nadszedł czas działania. Nie możemy czekać, aż metody Brzęczka stopniowo ukształtują zawodników - burza ogarnie Polskę i możemy przegapić naszą szansę. Komandosi z Lublińca byli wobec nas poniekąd przychylni; jeśli zdołamy ich przekonać do złożenia tymczasowego składu, możemy uznać taki mecz za nasz pierwszy oficjalny występ międzynarodowy. Musimy mieć jednak nadzieję, że przyjmą ofertę, bo znalezienie zastępstwa wśród watażków nie będzie łatwe."
BRZ_match_day: "Dzień meczowy!"
BRZ_match_day_desc: "Nadszedł dzień, w którym napiszemy historię. Choć warunki na boisku i poza nim pozostawiają wiele do życzenia w porównaniu z dawnymi czasami, widowisko, które się zaraz odbędzie, jest kulminacją miesięcy naszej ciężkiej pracy. Przemieniliśmy zarośnięte boiska i zniszczone trybuny w stadiony, zmieniliśmy beznadziejną młodzież w aspirujących piłkarzy i zaszczepiliśmy mieszkańcom ZWKT nadzieję. To święto naszych dokonań i początek nowych wyzwań - pokażmy wszystkim, na co nas stać."
BRZ_truskolasy_top: "TRUSKOLASY GÓRĄ!"
BRZ_truskolasy_top_desc: "Czy ktoś w to wątpił? Dzięki mistrzowskiemu przewodnictwu Najwyższego Selekcjonera rozgromiliśmy obronę komandosów. Wynik może nie oddaje w pełni skali lania, które im zafundowaliśmy, bo gdybyśmy przycisnęli ich trochę bardziej, mogłoby wyjść na jaw że nasz przeciwnik od dawna nie grał w piłkę. Nadal, zwycięstwo smakuje wybornie. Pokażemy światu, że nas nie da się lekceważyć. Teraz czas wrócić na trening i wykorzystać zdobyty impet - nadchodzą trudniejsi rywale."
BRZ_we_will_get_them_anyway: "I tak ich dopadniemy..."
BRZ_we_will_get_them_anyway_desc: "Przegraliśmy... Pomimo przygotowań i zdecydowanie słabszego rywala, straciliśmy bramkę po wątpliwym rzucie karnym, po czym rywal postawił autobus i bronił wyniku do końca. Nie na to się umawialiśmy! To miała być nasza chwila chwały! Tymczasem, napisaliśmy kolejny rozdział w naszej piłkarskiej historii porażek. Dobra robota chłopaki. To kompromitacja - staliśmy się pośmiewiskiem kraju po raz kolejny. Może i nasz prestiż ucierpiał, ale Ci oszuści nie wiedzą z kim zadzierają. Niech świętują swoją niezasłużoną wygraną; stanęli na naszej drodze po raz ostatni."
BRZ_demand_submission: "Żądanie kapitulacji"
BRZ_demand_submission_desc: "Teraz, gdy sprawy boiskowe zostały załatwione, pora wrócić do polityki. Ludzie Kukuły spisali się znakomicie, ale od dawna już przestali być dla nas użyteczni. Co gorsza, w Lublińcu pojawiły się bardziej... ambitne kręgi, które zaczęły postulować wciągnięcie nas w swoją strefę wpływów. Jakbyśmy mieli na to pozwolić! Ich klik nie łączy żadna wielka wizja ani plan pomocy dla Polski. Chcieliby nas jedynie odsunąć na bok i używać jako taniej rozrywki, podczas gdy komandosi prowadzą prawdziwe wojny. Musimy ich sprowadzić na właściwe miejsce, zanim takie pomysły się zakorzenią. Albo dołączą do nas, albo będziemy musieli sięgnąć po mniej przyjemne rozwiązania."
BRZ_send_the_hooligans: "Wyślij kiboli"
BRZ_send_the_hooligans_desc: "Wybrali drogę wojny. Jakże stosowne. Atak frontalny na komandosów byłby praktycznie misją samobójczą, ale mamy narzędzia, które uczynią to zadanie przynajmniej częściowo wykonalnym. Od pewnego czasu trzymamy w rezerwie naszych krwiożerczych ultrasów, lecz wydaje się, że nie mamy wyboru i musimy ich użyć. Rozmieścimy ich na naszej południowej granicy, a w nocy będą siać spustoszenie w formacjach wroga, destabilizując i osłabiając ich obronę, zanim nasze jednostki frontowe zdążą przekroczyć granicę. Oby tylko nie posunęli się... za daleko. Nie chcemy być postrzegani jako bezlitośni dzikusi."
BRZ_march_on_lubliniec: "Marsz na Lubliniec"
BRZ_march_on_lubliniec_desc: "Jesteśmy gotowi. Nasi południowi sąsiedzi wciąż dochodzą do siebie po naszym rajdzie. W jakiś sposób kibole okazali się zbyt skuteczni, całkowicie zniszczyli ich pozycje obronne w makabrycznym pokazie siły i okrucieństwa. Sytuacja wymyka się im spod kontroli i wkrótce może zajść potrzeba ich powstrzymania, ale na razie musimy wykorzystać spustoszenie, które stworzyli. Zanim komandosi zdążą zebrać siły, wyruszymy na Lubliniec, a nasz chwalebny szturm rozświetli oślepiający blask morza rac. Skoro praktycznie leżą u naszych stóp, miejmy nadzieję, że złożą broń i nie sprawią nam zbyt wielu kłopotów. Mimo ich opłakanego stanu, ich jednostki to wciąż wyszkolone, bojowe bataliony. Jeśli przejrzą nasze sztuczki, może się zrobić nieprzyjemnie."

##Second Tree##
BRZ_lubliniec_training_camp: "Zgrupowanie w Lublińcu"
BRZ_lubliniec_training_camp_desc: "Szanowni państwo, z przyjemnością ogłaszamy, że prestiżowy stadion miejski w Lublińcu jest na dobrej drodze, by stać się sercem naszego narodu. To tutaj wykujemy reprezentację wojskową, która pomaszeruje po chwałę polskiego narodu i polskiej piłki. To tutaj weterani wyszkolą świeżą krew, gotową zdobywać chwałę w bitwach przeciwko tym, którzy zechcą rzucić wyzwanie naszej drużynie. Chyba mogę powiedzieć w imieniu wszystkich, że aż kipimy z ekscytacji na myśl o przyszłości reprezentacji. Naczelny Trener właśnie zwołuje nowe zgrupowanie kadry."
BRZ_military_gear: "Profesjonalne wyposażenie wojskowe"
BRZ_military_gear_desc: "Nowa kadra potrzebuje nowego wyposażenia. Jeżeli nasza drużyna ma odnosić sukcesy przeciwko rosnącej liczbie przeciwników, będzie wymagała nowej broni, środków transportu i sprzętu wsparcia. Na szczęście nasi chłopcy znajdą wszystko, czego potrzebują, w arsenałach pokonanych komandosów z Lublińca. Istnieją jednak obawy, czy nowe wyposażenie należycie odda piłkarskiego ducha. Dlatego artyści związani z ZWKT wzbogacają jego wygląd, czyniąc go bardziej znajomym i przystępnym dla naszej wojskowej drużyny. Niektórzy narzekają na jaskrawe naklejki, herby i graffiti, lecz my znamy znaczenie właściwej prezencji."
BRZ_officer_fans: "Oficerowie też są kibicami"
BRZ_officer_fans_desc: "Jedną z największych zalet rządów związku klubów jest to, że nasza sprawa przekracza granice bez jednego wystrzału ani uderzenia. Miłość i pasja do piłki jednoczą cały naród. Gdy wieści o naszej misji będą się rozchodzić, coraz więcej ludzi dołączy do walki. Tymczasem możemy liczyć, że przeciwnicy przejdą na naszą stronę w geście sportowej postawy. Chcecie dowodu? Generał Michał Strzelczyk i pułkownik Wojciech Danisiewicz zgodzili się ostatnio dołączyć do wojskowej drużyny, by prowadzić nasze oddziały i szkolić chętnych dowódców w sztuce wojennej. Z nimi duma polskiej piłki będzie lśnić na polu bitwy tak samo jak na murawie."
BRZ_long_distance_shot: "Strzał z dystansu"
BRZ_long_distance_shot_desc: "Długie piłki są znakiem rozpoznawczym naszej strategii od chwili, gdy Robert Lewandowski wbiegł na boisko. Naturalnym krokiem jest przełożenie tej doktryny na wojsko. Nasi przeciwnicy muszą przygotować się na grad pocisków, który spadnie na nich z doskonałą precyzją - wszystko dzięki zapasom znalezionym w lublinieckich arsenałach. Przy okazji z przyjemnością informujemy, że A-klasowa Sparta Lubliniec oraz Unia Kalety zakwalifikowały się do nadchodzącego sezonu ligi."
BRZ_jurassic_hooligan_fights: "Jurajskie walki kiboli"
BRZ_jurassic_hooligan_fights_desc: "Dotarły do nas informacje, że kibole, zawsze chętni do bitki i zbyt niecierpliwi, by zaczekać na właściwe starcie, przekroczyli granicę i zaczęli nękać posterunek wojskowy Republiki Jurajskiej, wywołując powszechny terror i zamęt wśród żołnierzy, którzy przysięgli wierność Jarosławowi Gowinowi.\nPrezydent Jury żąda od Jerzego Brzęczka działań kończących potyczki, lecz Naczelny Trener zaprzecza udziałowi i sprawowaniu kontroli nad wandalami. Ci tylko sporadycznie słuchają jego rad i ulegają charyzmie, jako że zazwyczaj działają samodzielnie. Po wydarzeniach w Lublińcu niewielu w to wierzy."
BRZ_warta_zawiercie_match: "Mecz z MKS-em Myszków"
BRZ_warta_zawiercie_match_desc: "Po raz kolejny kibole, którzy zapuścili się głęboko na połowę przeciwnika, współpracowali z Brzęczkiem w metodycznym osłabianiu Republiki Jurajskiej. Pomimo oczywistych powiązań Jarosław Gowin wahał się przed podjęciem działań odwetowych, czekając na prawdziwy pierwszy gwizdek Brzęczka. Trener nie tracił czasu i oficjalnie prowadzi dziś swoje legiony do sąsiedniego kraju, by pokonać tych, którzy chcą skrzywdzić polską piłkę. Czego możemy oczekiwać po jurajskiej drużynie? Chaotyczne przywództwo zapewne sprawi, że jej oddziały domyślnie postawią na twardą obronę. Będzie to długi, choć odrobinę nudny mecz."
BRZ_incorporation_of_jurassic_clubs: "Inkorporacja Jurajskich klubów"
BRZ_incorporation_of_jurassic_clubs_desc: "Z każdym zwycięstwem rośnie nasza piłkarska rodzina. Do naszej ligi możemy teraz włączyć Pilicę Koniecpol, która niegdyś zdeklasowała Unię Kalety, oraz MKS Myszków - niedoceniany klejnot i, moim zdaniem, dumę częstochowskiej piłki. Powinno to stworzyć bardzo ciekawą dynamikę między klubami już należącymi do naszej organizacji i zapewnić nam wiele pamiętnych, emocjonujących chwil, na które wszyscy czekamy z ogromną niecierpliwością."
BRZ_role_of_civilian_administration: "Lekcje administracji"
BRZ_role_of_civilian_administration_desc: "Wraz z ekspansją na ziemie niegdyś należące do sprawnie zarządzanego demokratycznego państwa, wyobraźnia Jerzego Brzęczka rozkwitła jak nigdy. Próbując nauczyć się czegoś od regionalnych urzędników i często przyjmując ich do drużyny, ma nadzieję sprawnie rządzić także poza boiskami i stadionami. Jak dotąd zdaje się to działać. Nowa kadra mężów stanu lgnie do niego, bo nie zna tajników piłkarskiego świata, a tym samym pozwala mu rozbudować własne zaplecze, uniezależnić się od lokalnych działaczy piłkarskich i przywódców chuligańskich band oraz skutecznie scentralizować władzę. Niewielka, lecz głośna mniejszość kibiców już wyraziła niezadowolenie z takiego obrotu spraw."
BRZ_pilgrimage_to_czestochowa: "Pielgrzymka do Częstochowy"
BRZ_pilgrimage_to_czestochowa_desc: "Choć długo unikaliśmy ich groźnego spojrzenia, nie mamy wyboru i musimy stawić czoła potężnemu wschodniemu rywalowi. Pomimo naszych postępów, Archidiecezja wciąż widzi w nas względnie słaby cel, więc jeśli nie uderzymy pierwsi, możemy wkrótce stawić czoła pełnej sile ich przewagi. Choć wewnętrzne kręgi arcybiskupa nie będą wiązać przyszłości swego państwa z wynikiem amatorskiego meczu, przedstawimy im ofertę, której nie będą mogli odrzucić. Znają siłę swojej drużyny i naszą słabość. Jeśli obiecamy pełne poddanie naszej suwerenności w razie porażki, porzucą wszelką ostrożność i zgodzą się na układ. Ich pycha będzie ich zgubą."
BRZ_rakow_czestochowa_match: "Mecz z Rakowem Częstochowa"
BRZ_rakow_czestochowa_match_desc: "Nie ma odwrotu. Choć żałosny stan niegdyś potężnego Rakowa odzwierciedla upadek kraju, klub wciąż pozostaje najbardziej rozpoznawalnym i szanowanym w regionie. Nawet bez gwiazd i milionowych transferów, ich zredukowany skład byłych mistrzów kraju nie jest do lekceważenia, zwłaszcza w porównaniu z nami. Dzięki sławie Raków wciąż przyciąga najlepsze talenty Jury, zostawiając nam jedynie resztki. Jeśli kiedykolwiek chcemy przerwać ich monopol, to może być nasza jedyna szansa. Będziemy wielkimi outsiderami - całe istnienie ZWKT może zależeć od tego wyniku. Potrzebujemy niemal perfekcyjnego występu, dużej dawki szczęścia i wszelkich przewag, legalnych lub nie. Nadchodzące 90 minut będzie najbardziej stresujące w karierze Najwyższego Selekcjonera, ale przy odpowiednim podejściu możemy przetrwać. Jeśli nie, wycofanie się z umowy z Archidiecezją nie będzie proste."
BRZ_incorporation_of_czestochowa_clubs: "Inkorporacja klubów z Częstochowy"
BRZ_incorporation_of_czestochowa_clubs_desc: "Udało się! Giganci piłkarscy Częstochowy leżą u naszych stóp, a zwycięzcom należą się zdobycze. Włączenie Rakowa i Skry nie powinno być trudne - przynajmniej poprzednie władze miasta pozostawiły kluby w dużej mierze nietknięte ideologicznie. Pytanie brzmi: ile ich kadry utrzymamy dla siebie? Nawet osłabiony Raków pozostanie groźnym rywalem. Jeśli nie zdołamy ich ograniczyć, mogą zgarnąć tytuł PŚLP. Pokusa całkowitego rozebrania ich na części też nie wchodzi w grę. Cokolwiek postanowimy, ktoś będzie niezadowolony - pytanie, kogo możemy teraz sobie pozwolić rozzłościć."
BRZ_role_of_church: "Gała po mszy"
BRZ_role_of_church_desc: "Rola Kościoła w upadku naszego kraju jest niepodważalna. Pozostawiony bez kontroli oplótł chciwymi mackami aparat władzy i nie ma wątpliwości, że gdy przestaniemy być czujni, zrobi to samo nam. Choć idealnie byłoby odłożyć duchowieństwo na bok, nasi poplecznicy bywają... pobożni w swój wypaczony sposób. Mimo sprzeczności z wartościami chrześcijańskimi, kibole często otaczają się performatywną pobożnością i traktują wiarę jako filar swojego kredo. Każdy ruch przeciwko establishmentowi religijnemu spotka się z najpewniej buntem ich wygłodniałej tłuszczy. Musimy tolerować Kościół, choć pod nadzorem państwa. Jeśli chcą błogosławić naszych zawodników przed meczem, niech tak będzie - udawana serdeczność to mała cena za wewnętrzny spokój."
BRZ_away_game_in_zaglebie: "Wyjazdowy mecz w Zagłębiu"
BRZ_away_game_in_zaglebie_desc: "Kondycja i morale naszych zawodników wystarczyły, by zdominować boiska poprzednich przeciwników. Piłka musi być jednak w grze, a my musimy spoglądać ku kolejnym spotkaniom z kolejnymi rywalami. Zagłębie stwarza niezwykłą okazję do znalezienia godnych przeciwników, a zarazem dalszego poszerzenia granic państewka naszej drużyny. Każdy piłkarz wie przecież, że najgorsze, co może zrobić w karierze, to przestać grać."
BRZ_mugged_supplies: "Zrabowane zapasy"
BRZ_mugged_supplies_desc: "Jak powiedział kiedyś mądry człowiek, logistyka jest kluczem do zwycięstwa. Na murawie - a czasami nawet poza nią - zwycięstwo stoi jednak ponad wszystkim. Ostatecznie to grająca drużyna i genialna strategia trenera przyniosą triumf. Potrzebne zaopatrzenie możemy wytworzyć sami albo zabrać przeciwnikom, bo koniec końców to my wygramy i zaliczymy ich logistykę do swoich łupów. A więc... jak powiedział jeszcze mądrzejszy człowiek: znalezione nie kradzione!"
BRZ_take_away_whatever_you_can: "Bierzcie, co się da!"
BRZ_take_away_whatever_you_can_desc: "Każdy zawodnik i każdy kibic, który w taki czy inny sposób uczestniczy w grze, ma swój honor. Ostatni obrót wydarzeń każe nam jednak skupić się na sprawach, które wcześniej mogliśmy przeoczyć. Aby wypełnić wszystkie pozostawione luki, musimy więc rozejrzeć się i podnieść z ziemi kilka rzeczy, które wykorzystamy skuteczniej niż ich obecni właściciele."
BRZ_czestochowa_minerals: "Częstochowski obszar złóż mineralnych"
BRZ_czestochowa_minerals_desc: "Jedną z największych przewag drużyny jest znajomość boiska, na którym gra. Od chwili przejęcia regionu częstochowskiego zdobyliśmy więcej wiedzy o tych ziemiach i ich bogatych złożach rozmaitych surowców. Rozsądne i konieczne będzie wykorzystanie minerałów, które pomogą nam poprawić stan państwa oraz w razie potrzeby zapewnić drużynie wyposażenie."
BRZ_gusto_factory: "Rozbudowanie fabryki słodyczy Gusto"
BRZ_gusto_factory_desc: "Każdy lubi od czasu do czasu osłodzić sobie życie i nie ma sensu temu zaprzeczać. Rozsądniej będzie wykorzystać ten fakt na naszą korzyść, zamiast z nim walczyć. Dlatego postanowiliśmy rozbudować i odnowić fabrykę słodyczy Gusto, która znalazła się w naszych granicach."
BRZ_solar_stadiums: "Stadiony słoneczne"
BRZ_solar_stadiums_desc: "Do zasilania stadionów potrzebujemy prądu, ale jak produkować go wydajnie i blisko obiektu? Węgiel? Jeżeli nie chcecie widzieć zawodników, proszę bardzo, ale ja zamierzam oglądać mecz, więc odpada. Wiatr? A co, jeśli ktoś kopnie piłkę zbyt wysoko? Atom? Nie rozśmieszajcie mnie. Pozostaje tylko energia słoneczna. Nie ma właściwie żadnych wad, a jej wdrożenie jest dość tanie. ZWKT postanowił więc umieścić panele słoneczne na każdym stadionie, by zapewnić im zasilanie, zmniejszyć ryzyko awarii i dostarczać energię miejscowej ludności."
BRZ_nationalization_xkom: "Nacjonalizacja x-komu"
BRZ_nationalization_xkom_desc: "Trudne czasy po Upadku wymagają dostosowania się do rozmaitych przeciwności. Jedną z nich jest ciągły niedobór bardziej zaawansowanych towarów i wyposażenia. Aby się wzmocnić, musimy zwiększyć produkcję wszystkich tych rzeczy. Możemy sprytnie wykorzystać jedno z najważniejszych przedsiębiorstw, które dawniej sprzedawało elektronikę - x-kom. Zainwestujemy w nie ogromne środki, aby wymusić dalszy rozwój."
BRZ_seize_other_stadiums_and_arenas: "Przejęcie niepiłkarskich stadionów i hal"
BRZ_seize_other_stadiums_and_arenas_desc: "Dawno temu w Polsce istniała szeroka gama gier, sportów i turniejów, którymi miliony Polaków cieszyły się na licznych stadionach i halach. Dziś ten dawny pluralizm niezbyt odpowiada wizji naszego wielkiego trenera. Musimy przenieść mecze i treningi na obiekty, które wkrótce staną się boiskami. Ostatecznie tylko piłka nożna naprawdę się liczy."
BRZ_railway_to_truskolasy: "Linia kolejowa do stolicy"
BRZ_railway_to_truskolasy_desc: "Niegdyś, przed Upadkiem, Truskolasy były tylko małą, spokojną i często pomijaną miejscowością. Od powrotu wielkiego trenera Jerzego Brzęczka i utworzenia państwa skupionego wokół Olimpii Truskolasy zyskały nową sławę oraz znaczenie. Jednym ze skutków rozwoju jest konieczność stworzenia infrastruktury godnej stolicy. Połączymy więc Truskolasy z siecią kolejową odziedziczoną po upadłym państwie polskim. Koszty takich projektów są ogromne, lecz przedsięwzięcie ma kluczowe znaczenie dla poprawy logistyki i z pewnością przyniesie nam korzyści w przyszłości."
BRZ_water_sources_of_jura: "Jurajskie źródła wody"
BRZ_water_sources_of_jura_desc: "Jura nie ma wielu zasobów. Od czasu do czasu można znaleźć coś rzadszego niż kamień, lecz ostatecznie kamienia jest znacznie więcej niż cennych minerałów. Wciąż jednak posiada jeden surowiec, którego my, ludzie, potrzebujemy do życia: wodę. Jura skrywa ogromne i łatwe do eksploatacji zasoby wód podziemnych. ZWKT postanowił więc stworzyć w regionie głębokie studnie, obniżając ceny wody i ryzyko niedoborów. Inwestycja zapewni też pracę wielu ludziom, a tej potrzebuje każdy."
BRZ_new_isotonic: "Nowy izotonik dla naszych żołnierzy"
BRZ_new_isotonic_desc: "Aby nasi piłkarze mogli dawać z siebie wszystko, potrzebują tego, co najlepsze, i tylko to powinniśmy im zapewniać. Jurajska woda doskonale nadaje się do produkcji napojów izotonicznych, dlatego ZWKT postanowił zbudować fabryki wytwarzające je zarówno dla żołnierzy, jak i zawodników, zwiększając ich wydajność na boisku oraz polu bitwy. Budowa będzie niestety bardzo kosztowna, lecz rezultaty zdecydowanie przewyższą poniesione koszty."
BRZ_combine_steelworks: "Kombinat Hutniczy"
BRZ_combine_steelworks_desc: "Co łączy Częstochowę i Dąbrowę Górniczą? Jeżeli odpowiedzieliście, że nic, mylicie się, bo obie mają huty. Huta Częstochowa i Huta Katowice są największymi kompleksami metalurgicznymi w naszym kraju, dlatego Naczelny Trener postanowił połączyć je w jedno przedsiębiorstwo i usprawnić produkcję. Rezultaty już są widoczne, bo oba zakłady zaczęły działać z większą wydajnością."
BRZ_antifa_football_section: "Antifa - sekcja piłkarska"
BRZ_antifa_football_section_desc: "Z czym kojarzy się wam Antifa? Odpowiedzieliście: z antyfaszyzmem, komunalizmem albo wojną? Macie rację, lecz jest jeszcze jedna rzecz - mają drużynę piłkarską. Członkowie Antify świetnie walczą z faszyzmem, a gdy powiedzieliśmy im, że przeciwnicy są faszystami, wygrali każdy mecz. ZWKT postanowił włączyć część ich talentów do Olimpii Truskolasy, by ją wzmocnić, dzięki czemu od teraz powinna zwyciężać znacznie częściej."
BRZ_coach_buses: "Autokary na mecze wyjazdowe"
BRZ_coach_buses_desc: "Choć drużyna piłkarska większość czasu spędza na własnym stadionie, czasem musi zagrać z innymi zespołami. Dotąd nasze drużyny chodziły do pozostałych klubów pieszo, lecz wraz z podbojem kolejnych ziem coraz wyraźniej widać, że potrzebujemy prawdziwych autobusów, które dowiozą genialnych zawodników po najlepszy wynik. Na szczęście w kraju stoi mnóstwo pojazdów czekających, by je ukraś... to znaczy znacjonalizować i należycie wykorzystać. Ich właściciele z pewnością nie będą mieli nic przeciwko."
BRZ_first_away_battalion: "Pierwszy batalion wyjazdowy"
BRZ_first_away_battalion_desc: "Wszyscy znamy i kochamy boiska, do których przywykliśmy. Nasz wielki trener interesuje się jednak nie tylko nimi - cała Polska pełna jest najróżniejszych muraw, na których nasza drużyna jeszcze nie grała. Dlatego od pewnego czasu zawodnicy przygotowują się do nowego wyzwania, daleko od domu. Gracze Olimpii Truskolasy muszą nastawić się na ciężkie zmagania, które mogą wymagać jeszcze większego wysiłku i poświęcenia. Bez względu na wszystko nasza strategia pozostaje niezmienna, a na stałym kursie wyznaczonym przez Jerzego Brzęczka z pewnością zwyciężymy!"
BRZ_seize_pyrzowice_bases: "Prywatne bazy operacyjne w Pyrzowicach"
BRZ_seize_pyrzowice_bases_desc: "Na lotnisku w Pyrzowicach znajduje się wiele prywatnych baz operacyjnych. Dlaczego miałyby pozostać prywatne? Ogromnie wsparłyby wysiłek wojenny, zwłaszcza stojące w nich samoloty. ZWKT doszedł do tego samego wniosku i postanowił je przejąć. Maszyny wreszcie zrobią coś więcej niż siedzenie w hangarach, a tym czymś będzie bombardowanie cywi... ekhm, to znaczy walka z naszymi wrogami."
BRZ_transform_m1: "Państwowe Centrum Handlowe w Czeladzi"
BRZ_transform_m1_desc: "M1 Czeladź doskonale uosabia krwiożerczy kapitalizm. Płynące stamtąd zyski trafiały prosto do sejfów miliarderów, podczas gdy pracownicy otrzymywali marny ułamek należnej części. Teraz to się kończy - ZWKT znacjonalizował M1 Czeladź i przekształcił je w państwowe centrum handlowe, aby pracujący tam ludzie wreszcie otrzymywali należny udział, a państwo mogło wykorzystać obiekt."
BRZ_unia_dg_match: "Mecz z Unią Dąbrowa Górnicza"
BRZ_unia_dg_match_desc: "Unia Dąbrowa Górnicza - kolejna mała drużyna, którą moglibyśmy zmiażdżyć jednym palcem. Aby pokazać jej, jak dobrzy jesteśmy, ZWKT wysłał propozycję rozegrania meczu. Zwycięstwo nad tak słabym zespołem powinno przyjść łatwo, a wywołany nim zapał z pewnością ułatwi walkę w miejskiej dżungli zwanej Dąbrową."
BRZ_zaglebie_sosnowiec_match: "Mecz z Zagłębiem Sosnowiec"
BRZ_zaglebie_sosnowiec_match_desc: "W Zagłębiu działają trzy duże drużyny, ale dziś skupimy się na jednej - Zagłębiu Sosnowiec. Aby pokazać nad nim wyższość, ZWKT wysłał propozycję rozegrania spotkania z naszym wspaniałym zespołem, które rywale z pewnością przegrają. Po meczu Naczelny Trener planuje dokonać inwazji na Sosnowiec, wykorzystując zapał po zwycięstwie."
BRZ_szczakowianka_jaworzno_match: "Mecz ze Szczakowianką Jaworzno"
BRZ_szczakowianka_jaworzno_match_desc: "Szczakowianka Jaworzno. Słyszeliście kiedyś o tej drużynie? Ja nie, bo dosłownie nikt poza mieszkańcami Jaworzna jej nie zna. ZWKT postanowił jednak z nią zagrać, ponieważ planujemy zmierzyć się z każdym większym klubem Zagłębia i nie chcemy, by poczuła się pominięta. Zwycięstwo powinno być łatwe i podnieść ducha naszych ludzi."
BRZ_political_training: "Szkolenie polityczne"
BRZ_political_training_desc: "Sosnowiec był najlepiej zorganizowanym państwem w całym Zagłębiu i szczerze mówiąc, możemy się od niego wiele nauczyć. Nasza obecna administracja jest w rozsypce, a kraj działa na podstawie kilku umów, które w każdej chwili mogą zostać zerwane. Dlatego ZWKT postanowił włączyć część sosnowieckiej biurokracji do rządu i wykorzystać jej systemy do zwiększenia sprawności naszego aparatu."
BRZ_ideological_training: "Szkolenie ideologiczne"
BRZ_ideological_training_desc: "Niestety na naszych ziemiach wciąż żyje wielu ludzi, którzy nie wyznają naszej ideologii, a tradycyjne metody niezbyt na nich działają. Po niedawnym podboju Dąbrowy Górniczej odkryliśmy jednak liczne sposoby nawracania ludzi na naszą sprawę, nawet jeśli niektóre są odrobinę nieludzkie. ZWKT postanowił wykorzystać je w więzieniach, choć na rezultaty trzeba jeszcze zaczekać."
BRZ_communal_training: "Szkolenie społeczne"
BRZ_communal_training_desc: "Drużyna piłkarska jest jednym wielkim organizmem. Zawodnicy muszą grać razem, inaczej przegrają. Niestety część naszych piłkarzy tego nie rozumie, więc biegnie samotnie na bramkę bez podawania, często traci piłkę i osłabia zespół. Istnieje jednak lekarstwo. Antifa Jaworzno zdołała skłonić ludzi do tworzenia komun, w których pracowali dla siebie nawzajem, a jej podejście powinno zadziałać także tutaj. Musimy pokazać ludziom, że bez innych są niczym."
BRZ_incorporation_of_zaglebie_clubs: "Inkorporacja klubów Zagłębia"
BRZ_incorporation_of_zaglebie_clubs_desc: "W Zagłębiu działa wiele klubów, takich jak Unia Dąbrowa Górnicza, Zagłębie Sosnowiec czy Szczakowianka Jaworzno. Po podboju regionu znalazły się pod naszą jurysdykcją, a nie możemy pozwolić, by te ukryte klejnoty nadal pozostawały w cieniu. ZWKT ogłosił więc włączenie klubów do naszej ligi, gdzie będą rywalizować z pozostałymi drużynami na równych zasadach."
BRZ_woes_of_football: "Bolączki polskiej piłki"
BRZ_woes_of_football_desc: "Polska piłka znalazła się niegdyś w czarnej otchłani. Zarząd kasę trwonił, drużyna spadała na dno, a działacze nadal kradli. Na szczęście wkroczył Brzęczek, nasz Naczelny Trener, i zatrzymał upadek, lecz jego skutki wciąż są odczuwalne. ZWKT konsekwentnie naprawia te problemy, ale nadal pozostaje wiele do zrobienia."
BRZ_victory_cup: "Puchar Zwycięstwa"
BRZ_victory_cup_desc: "ZWKT stworzył nowe rozgrywki - Puchar Zwycięstwa - aby uczcić ogromne triumfy w Zagłębiu i Jurze, przybliżenie do zjednoczenia oraz wielki rozwój naszych drużyn. Pierwszy mecz rozpocznie się dzisiaj, a puchar potrwa kilka dni, aż wygra najlepszy zespół, czyli Olimpia Truskolasy."
BRZ_dreams_of_champions_league: "Marzenia o Lidze Mistrzów"
BRZ_dreams_of_champions_league_desc: "WIADOMOŚĆ Z OSTATNIEJ CHWILI! Lewandowski, najlepszy zawodnik reprezentacji piłkarskiej III Rzeczypospolitej, przybył do naszego kraju i planuje zostać na dłużej. ZWKT spotka się z nim osobiście, a być może nawet pozwoli mu do siebie dołączyć, choć jest to bardzo mało prawdopodobne."
BRZ_new_season: "Nowy sezon"
BRZ_new_season_desc: "Zagłębie i Jura należą do nas. Nasze drużyny piłkarskie nigdy nie były silniejsze. Wreszcie możemy się cieszyć i spokojnie grać w piłkę. Skoro kontrolujemy cały region, ZWKT postanowił zakończyć obecne rozgrywki i rozpocząć nowe. Wreszcie nadszedł kolejny sezon. Nie wiemy jeszcze, co przyniesie, poza tym, że znów uczyni polską piłkę wielką."


