BRZ_legacy_of_pzpn: "Dziedzictwo PZPN"
BRZ_legacy_of_pzpn_desc: "Żadna organizacja nie wyrządziła rodzimej piłce - a przy okazji karierze Jerzego Brzęczka - tylu szkód co Polski Związek Piłki Nożnej. Ta skorumpowana klika sportowych dinozaurów wpływała na każdy aspekt najpiękniejszej gry, pozostawiając całe pokolenie piłkarzy i trenerów na pastwę \"polskiej myśli szkoleniowej\". Niemal wszystkie nasze talenty wychowały się w tym systemie, który tłumił wszelką kreatywność i umiejętności techniczne. Jeżeli nie wypłyniemy na nieznane wody i całkowicie nie zreformujemy podejścia do futbolu, na zawsze ugrzęźniemy w przeciętności."
BRZ_nothings_wrong_poles: "Polacy, nic się nie stało"
BRZ_nothings_wrong_poles_desc: "Lata porażek i rozczarowań stworzyły wyjątkową mentalność przeciętnego polskiego kibica. Typowy Janusz uwielbia narzekać, lecz bez względu na wszystko pozostanie przy reprezentacji i tłumnie stawi się na każdy mecz - zazwyczaj przed starzejącym się telewizorem, z piwem w dłoni. Jako urodzeni konformiści większość społeczeństwa nie stawi naszym planom praktycznie żadnego znaczącego oporu, nawet gdy sytuacja stanie się naprawdę rozpaczliwa."
BRZ_bandit_hooligans: "Ultrasi na ulicach"
BRZ_ultras: "Ultrasi na ulicach"
BRZ_bandit_hooligans_desc: "W miastach kontrolowanych przez ZWKT nigdy nie można czuć się naprawdę bezpiecznie. Rozszalałe bandy ultrasów reprezentujących każdą z drużyn działających na naszym terytorium regularnie nękają ludność: zaczepiają wybranych obywateli, żądają wskazania klubowych barw, a za niewłaściwą odpowiedź biją lub okradają. Kiedy nie terroryzują mieszkańców, walczą między sobą, pozostawiając nam usuwanie szkód. Każdy dzień, w którym nie znajdujemy trwałego rozwiązania problemu przemocy, przynosi kolejne miasta płonące blaskiem tysiąca rac."
BRZ_hooligan_raids: "Najazdy kiboli"

BRZ_locker_room_cleaning: "Czyszczenie szatni"
BRZ_locker_room_cleaning_desc: "Każdy pokonany watażka pozostawia po sobie coś użytecznego: karabiny w policyjnych magazynach, ciężarówki w zajezdniach komunalnych i sprzęt piłkarski zbierający kurz pod zawalonymi trybunami. Zespoły odzysku ZWKT schodzą do opuszczonych szatni i zabierają piłki, siatki, stroje, artykuły medyczne oraz wszystko, co może przetrwać kolejny sezon. Nic nie jest zbyt zużyte, by wykorzystać to ponownie, i żaden herb klubowy nie jest święty. Dawni właściciele mogą nazywać to grabieżą, ale dla nas jest to po prostu odpowiedzialna polityka bezpłatnych transferów."

BRZ_zwkt_political_idea: "Rada Polityczna ZWKT"
BRZ_zwkt_political_idea_desc: "Rada Polityczna ZWKT rządzi niczym zarząd prowincjonalnego związku piłkarskiego: bez końca debatuje nad regulaminami, nominacjami i tym, kto zasługuje na najlepsze miejsce na trybunie VIP. Każda decyzja musi przejść przez byłych trenerów, lokalnych sponsorów, związkowców i zasłużonych działaczy, z których każdy uważa się za niezastąpionego eksperta. System jest powolny, podatny na kłótnie i często absurdalny, lecz zapewnia Truskolasom osobliwą stabilność. Każdy ma głos, każdy ma pretensje i nikt nie chce opuścić klubu przed ostatnim gwizdkiem."

BRZ_legacy_of_pzpn_3: "Wymazanie PZPN"
BRZ_legacy_of_pzpn_3_desc: "Dawna federacja rządziła polską piłką za pomocą komisji, licencji, paneli dyscyplinarnych i władyków, którzy zawsze zdawali się znać wynik jeszcze przed pierwszym gwizdkiem. Dziś jej symbole są zrywane, archiwa otwierane, a dawni działacze usuwani z życia publicznego. Truskolasy nie będą już przyjmować rozkazów z odległych gabinetów ani kłaniać się kolejnej grupie nietykalnych prezesów. Model PZPN zostanie całkowicie wymazany, pozostawiając po sobie jedynie przestrogi, pożółkłe protokoły meczowe i wieczne podejrzenie, że sędzia został kupiony."

BRZ_white_red_academy_idea: "Biało-Czerwona Akademia"
BRZ_white_red_academy_idea_desc: "Biało-Czerwona Akademia szkoli nie tylko piłkarzy. Wychowuje nowe pokolenie, które ma biegać, walczyć i myśleć jak jedna drużyna pod narodowymi barwami. Dzieci uczą się pressingu, dyscypliny i pieśni patriotycznych, zanim poznają nazwy zagranicznych stolic, a obiecujących zawodników obserwuje się równie uważnie jak przyszłych oficerów. Metody są surowe, lecz każde wiejskie kartoflisko traktuje się jak potencjalną Maracanę. Gdzieś pośród pachołków, popękanych bramek i wrzeszczących trenerów Truskolasy mają nadzieję odkryć własnego Bońka, Deynę albo Lewandowskiego."

BRZ_bandit_hooligans_3: "Ultrasi w mundurach"
BRZ_bandit_hooligans_3_desc: "Mężczyźni, którzy niegdyś jeździli w przepełnionych autobusach na mecze wyjazdowe, maszerują dziś w kolumnach wojskowych. Nadal dumnie noszą swoje barwy, lecz kije baseballowe zastąpiły karabiny, a skradzione policyjne tarcze pokrywają świeżo namalowane herby klubowe. Lata ulicznych wojen nauczyły ich lojalności, zastraszania i przemieszczania się przez wrogie dzielnice bez łamania szyku. Oficerowie mogą szydzić z ich przyśpiewek i prymitywnej dyscypliny, ale niewielu regularnych żołnierzy dorównuje im agresją. W Truskolasach sektor ultrasów stał się koszarami, a każda kampania przypomina kolejny niebezpieczny wyjazd."

BRZ_untamed_hooligans_1: "Przemoc na ulicach"
BRZ_untamed_hooligans_1_desc: "Ulice należą do tych, którzy potrafią zebrać największą grupę, krzyczeć najgłośniej i uderzyć, zanim przybędzie policja - albo to, co z niej zostało. Kibice rywalizujących klubów rozstrzygają spory kamieniami, nożami i prowizorycznymi racami, a dzielnice oznaczają barwami klubowymi niczym dawne granice plemienne. Dni meczowe jedynie układają przemoc w harmonogram. Bez silnego przywództwa każda obelga może przerodzić się w zamieszki, a każda porażka w noc długich bejsboli. Nasi ludzie mogą kochać piłkę, lecz zbyt wielu pamięta już tylko otaczającą ją nienawiść."

BRZ_dinosaurs_in_club_managements_1: "Beton w zarządach"
BRZ_dinosaurs_in_club_managements_1_desc: "Polska piłka od zawsze miała ludzi, którzy potrafili przetrwać spadek, bankructwo, zmianę właściciela i kilka śledztw kryminalnych, nigdy nie oddając kluczy do gabinetu. Te żywe duchy nadal nawiedzają lokalne kluby, rozprawiają o tradycji, a zarazem zatrudniając kuzynów, nagradzając wiernych agentów i zrzucając każdą porażkę na pogodę, złe boisko albo sędziego. Znają każdą lukę i każdego innego prezesa, lecz nic nie wiedzą o nowoczesnym treningu ani administracji. Dopóki ich nie usuniemy, instytucje Truskolasów pozostaną uwięzione w epoce remisu z Anglią na Wembley, błotnistych kartoflisk i brakujących wypłat dla zawodników."

BRZ_decadent_footballers_1: "Celebryci murawy"
BRZ_decadent_footballers_1_desc: "Nasi najlepiej opłacani piłkarze zaczęli mylić lokalną sławę z prawdziwą wielkością. Treningi traktują jako nieobowiązkowe, odprawy taktyczne jako osobiste zniewagi, a porażki jako niefortunne błędy zawodników drugoplanowych. Przyjeżdżają drogimi samochodami, uciekają przed kibicami i oszczędzają siły na bankiety, kluby nocne oraz występy promocyjne. Kiedy mecz staje się trudny, ich determinacja znika szybciej niż agenci po spadku. Ci ludzie mają talent, ale talent pozbawiony głodu ambicji daje niewiele poza efektownymi zdjęciami i kolejnym sezonem zmarnowanego potencjału. Nie możemy zmarnować następnego złotego pokolenia..."

BRZ_thousand_stadiums_program: "Program Tysiąca Stadionów"
BRZ_thousand_stadiums_program_desc: "Żadna miejscowość nie jest zbyt mała, zrujnowana ani strategicznie nieistotna, by nie otrzymać własnego boiska. W ramach Programu Tysiąca Stadionów wyrównamy pola, wzniesiemy trybuny i złożymy reflektory z wszelkich dostępnych słupów. Niektóre stadiony pomieszczą tysiące ludzi, inne będą składać się z dwóch ławek, krzywego płotu i szatni urządzonej w dawnym przystanku autobusowym. Ich jakość liczy się mniej niż sama obecność. Każde boisko będzie ośrodkiem rekrutacji, propagandy i życia społecznego, dowodzącym, że wszędzie tam, gdzie Truskolasy stawiają bramki, oficjalnie powraca cywilizacja."

BRZ_defunding_disciplines: "Jedyny sport"
BRZ_defunding_disciplines_desc: "Koszykówka marnuje doskonałe hale, lekkoatletyka zachęca ludzi do biegania bez piłki, a siatkówka pozostaje podejrzanie popularna, mimo że nie pozwala nikogo porządnie sfaulować. Wniosek jest oczywisty: środki publiczne nie mogą być dłużej rozpraszane między pomniejsze dyscypliny. Ich obiekty, trenerzy i programy młodzieżowe zostaną wchłonięte przez piłkę nożną - jedyny sport zdolny zjednoczyć wiejskich patriotów, pijanych kibiców i ambitnych urzędników pod jednym sztandarem. Byli mistrzowie mogą protestować, ale szybko zrozumieją, że przy odpowiedniej determinacji każdy kort da się zmienić w boisko."

BRZ_defunding_disciplines_fund: "Centralny Fundusz Jedynego Sportu"
BRZ_defunding_disciplines_fund_desc: "Ogłoszenie piłki nożnej jedynym sportem było tanie. Utrzymanie jej monopolu już nie. Stadiony wymagają napraw, akademie sprzętu, a każdy lokalny prezes upiera się, że jego klub reprezentuje wyjątkowo ważny interes narodowy. Aby cały system nie zawalił się pod ciężarem niezapłaconych rachunków, państwo utworzyło centralny fundusz finansowany z podatków, konfiskat i coraz bardziej pomysłowej księgowości. Obciążenia są znaczne, lecz porzucenie projektu pozostaje nie do pomyślenia. Nie można przecież ogłosić wyższości futbolu, a potem odmówić zapłaty za nowe siatki."

BRZ_zwkt_tm: "ZWKT(R)"
BRZ_zwkt_tm_desc: "Od dzisiaj ZWKT nie jest już tylko związkiem, ruchem ani organem władzy. To chroniona nazwa, zarejestrowany symbol i starannie zarządzana tożsamość. Szaliki, koszulki, odznaki, kubki i pamiątkowe piłki meczowe noszą teraz oficjalny znak, a nieautoryzowani sprzedawcy są ścigani z większym zapałem niż niejeden patrol wroga. Kibiców zachęca się, by wyrażali lojalność poprzez licencjonowane zakupy po zatwierdzonych cenach. To, co narodziło się na błotnistych lokalnych boiskach, stało się marką, a marka musi pozostać spójna, rozpoznawalna i przede wszystkim dochodowa."

BRZ_zwkt_enterprise: "ZWKT S.A."
BRZ_zwkt_enterprise_desc: "Transformacja dobiegła końca. ZWKT zarządza dziś klubami, stadionami, akademiami, kanałami medialnymi, usługami transportowymi oraz stale rosnącym katalogiem markowych gadżetów. Wyniki meczów pozostają ważne, lecz raporty kwartalne zyskały niemal święty autorytet. Trenerzy mówią o wartości rynkowej, urzędnicy omawiają ekspansję terytorialną jak inwestycję, a kibice zostali przeklasyfikowani na niezawodną bazę konsumentów. Przedsiębiorstwo obiecuje sprawność i profesjonalne zarządzanie, choć krytycy zauważają, że nikt nie potrafi już jasno wskazać, gdzie kończy się związek, zaczyna korporacja i czy rząd jeszcze istnieje."

BRZ_goal_diggers: "Kobiecy futbol"
BRZ_art_of_the_deal: "Sztuka robienia interesów"
BRZ_buyout: "Wykup upadających klubów"
BRZ_dropthem: "Przetrwają najsilniejsi"

BRZ_traditional_football: "Polska szkoła futbolu"
BRZ_traditional_football_desc: "Polska szkoła futbolu odrzuca zagraniczne zawiłości na rzecz wiecznych prawd: głęboka obrona, wybicie piłki i pełna nadziei laga do najwyższego dostępnego zawodnika. Wrzutki dostarczane są w ilościach przemysłowych, zwykle ponad każdym napastnikiem, a posiadanie piłki traktuje się jak niebezpieczną pokusę, której najlepiej szybko odrzucić od siebie. Mecze zmieniają się w błotniste zapasy o zebranie drugiej piłki, przypadkowe odbicia i bohaterskie cierpienie. Może nie jest to eleganckie, nowoczesne ani regularnie skuteczne, ale żaden inny system nie tworzy równie autentycznych wspomnień bezbramkowych remisów pośród lodowatego listopadowego deszczu."
BRZ_conservative_football: "Konserwatywny futbol"
BRZ_conservative_football_desc: "Zwycięstwo zaczyna się od dopilnowania, żeby nic się nie wydarzyło. Nasze linie obronne cofają się do współczesnej obrony Częstochowy, dzielnie parkując autobus i pozwalając rywalom wyczerpać się w starciu ze zdyscyplinowaną przeszkodą. Fundamentem jest włoskie catenaccio, choć od tiki-taki zapożyczono kilka starannie racjonowanych podań, by uspokoić intelektualistów. Ryzyko dopuszcza się tylko w wyjątkowych okolicznościach, zwykle po osiemdziesiątej piątej minucie. Krytycy nazywają to tchórzostwem; my nazywamy odpowiedzialnym zarządzaniem przestrzenią, posiadaniem piłki i kruchą możliwością jednobramkowego prowadzenia. Bo dwubramkowe... och, to już zbyt niebezpieczne."
BRZ_revolutionary_football: "Rewolucyjny futbol"
BRZ_revolutionary_football_desc: "Chcecie futbolu totalnego? Nie ostrożnego ani rozsądnego, lecz futbolu bez stałych pozycji, wahania i litości? Każdy obrońca musi atakować, każdy napastnik stosować pressing, a każdy zawodnik stać się tym, czego wymaga spotkanie. Stare ustawienia zostają wywalone jako relikty taktycznego społeczeństwa klasowego, zastąpione nieustannym ruchem i zbiorową agresją. Będzie wyczerpanie, chaos i sporadyczne katastrofalne kontrataki, lecz rewolucji nie buduje się wyłącznie na czystych kontach. Boisko musi należeć do wszystkich - albo zapłonąć pod stopami tych, którzy stawiają opór."

