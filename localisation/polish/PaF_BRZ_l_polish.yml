BRZ_olimpia_truskolasy_do_utraty_tchu_desc: "Zatrzymajmy się na chwilę i przypomnijmy sobie, jak dobra jest Olimpia Truskolasy. Zdobyła pierwszy puchar i obecnie jest najlepszą drużyną w tym kraju. Zawsze strzela idealnie, nigdy nie pudłuje i zawsze wygrywa - poza chwilami, gdy nie wygrywa, ale to zdarza się naprawdę rzadko. Pokazuje, dlaczego jej kibicujemy i dlaczego powinniśmy kibicować jeszcze mocniej! TRUSKOLASY GÓRĄ, JEBAĆ PZPN!"
BRZ_rebuilding_stadiums_desc: "Stadiony są w piłce nożnej niezbędne - bez nich przecież nie da się nawet grać. W naszym kraju jest z nimi jednak ogromny problem: znajdują się w opłakanym stanie. Murawa, którą należało wymienić dziesięć lat temu, połamane krzesełka, niedziałające tablice wyników - tak wyglądają dziś nasze stadiony. Jeśli chcemy mieć prawdziwą ligę, musimy je wyremontować, aby gra na nich była przyjemnością, a nie czymś ledwie znośnym."
BRZ_dabrowa_stadium_desc: "Myśląc o Zagłębiu, zapewne myślicie o Międzypowiatówce, Sosnowcu, socjalizmie i Hucie Katowice. Być może przychodzą wam też do głowy Czarzasty albo Dąbrowa Górnicza, ale na pewno nie stadiony. Dlaczego? To proste: są w tak fatalnym stanie, że żaden Zagłębiak nawet o nich nie wspomni. Teraz jednak to się kończy - ZWKT zburzył stary stadion Zagłębiaka Dąbrowa Górnicza i rozpoczął budowę czegoś znacznie okazalszego."
BRZ_zawiercie_stadium_desc: "Stadion Tysiąclecia w Zawierciu jest niezwykle ważnym miejscem dla piłki nożnej w naszym kraju. Wybudowano go w 1966 roku, za rządów Gomułki, aby uczcić tysiąc lat historii Polski. Z biegiem lat popadał jednak w ruinę, szczególnie u schyłku III Rzeczypospolitej i podczas Upadku. ZWKT postanowił go wyremontować, aby każdy zawiercianin mógł grać w piłkę w należytych warunkach - w przeciwieństwie do czasów sprzed naszych rządów."
BRZ_rakow_stadium_desc: "Raków, najbardziej oddany i wierny ze wszystkich polskich klubów, stoi dziś w obliczu zagłady z rąk heretyków z Truskolasów. Najpierw zagarnęli nasze ziemie i zdetronizowali prawowitych władców, a teraz ich barbarzyńscy najeźdźcy próbują położyć łapy na naszym świętym stadionie i przerobić go na własną modłę. Nie możemy im na to pozwolić, bracia i siostry! Musimy wypędzić pogan! Spalcie ich flagi, pobijcie ich kibiców, a jeśli trzeba - ukrzyżujcie ich zawodników! Nigdy się nie poddawajcie, nig- e-ej, a wy, na miły Bóg, kim jesteście?! Nie wolno wam tu wchodzić! Hej, HEJ, odłóż ten kij-\n\nPrzepraszamy za ten nieoczekiwany incydent. Wdarł się tutaj jakiś bandyta i zaczął wygadywać bzdury. W każdym razie ZWKT postanowił wyremontować stadion Rakowa, aby wreszcie zapewnić mu porządne miejsce do gry w piłkę. Któż nie chciałby mieć za przywódcę tak wspaniałego człowieka?"
BRZ_football_economy_desc: "Po odbudowie stadionów Naczelny Trener rozpoczął nowy program stworzenia gospodarki skupionej wokół piłki nożnej. Z przyjemnością wyjaśniłbym go szczegółowo, lecz Naczelny Trener zrobi to osobiście. Oddaję głos panu Brzęczkowi.\n\nOczywiście. Celem programu jest przywrócenie naszej gospodarce światowej rangi za pomocą piłki nożnej, naszego sportu narodowego. Zaplanowaliśmy już wiele działań, choć część z nich wzajemnie się wyklucza, więc będziemy musieli wybrać te najlepsze.\n\nSłyszeliście Trenera! Czekamy na jego kolejne decyzje!"
BRZ_defund_other_disciplines_desc: "Siatkówka, piłka ręczna, tenis i mnóstwo innych sportów. Komu są potrzebne, skoro mamy piłkę nożną - najlepszy sport ze wszystkich? Rząd doszedł do tego samego wniosku i postanowił odebrać finansowanie wszystkim pozostałym dyscyplinom, po raz kolejny dowodząc swojego zaangażowania we wzmacnianie futbolu. Nie wiadomo jeszcze, co zrobi z pozyskanymi w ten sposób środkami, ale jesteśmy pewni, że Naczelny Trener wykorzysta je mądrze."
BRZ_subsidize_women_football_desc: "Kobieca piłka nożna w Polsce zawsze była niedofinansowana, a nasze drużyny z trudem rywalizowały nawet z zespołami z państw dziesięciokrotnie biedniejszych od naszego. Teraz jednak to się kończy - Naczelny Trener postanowił przeznaczyć środki odebrane innym dyscyplinom na finansowanie kobiecych zespołów. Pokazał tym samym, że silna piłka musi opierać się na ludziach każdej płci, a nie tylko na mężczyznach. Czekamy na więcej równie fantastycznych decyzji!"
BRZ_zwkt_trademark_desc: "Czy kiedykolwiek marzyliście o koszulce z olbrzymim napisem \"ZWKT\"? Teraz możecie ją kupić! ZWKT właśnie ogłosił, że zacznie sprzedawać markowe gadżety, aby pozyskać fundusze. Spodenki ZWKT, korki ZWKT i wszystko inne związane z piłką nożną! Nie czekajcie - idźcie do najbliższego sklepu i sprawcie sobie coś już dziś!"
BRZ_selling_profitable_players_desc: "Szok! ZWKT właśnie ogłosił, że zamierza sprzedać część naszych zawodników innym drużynom! Naczelny Trener powiedział, że bez funduszy nasz kraj nie może funkcjonować i właśnie dlatego podjęto tę decyzję, ale czy naprawdę musieli sprzedawać naszych piłkarzy? Tak czy inaczej, dla rządu będzie to ogromny zastrzyk gotówki, a dla naszej wspaniałej drużyny - dotkliwa strata. Miejmy nadzieję, że nie sprzedadzą już nikogo, bo inaczej zespół się rozpadnie."
BRZ_pioneer_cup_desc: "ZWKT właśnie ustanowił nowy doroczny puchar! Nosi nazwę Pucharu Pionierów, a zakłady i przedsiębiorstwa będą w nim walczyć o dofinansowanie. Wzmocni to ducha robotniczego, a konkurencyjność pozwoli na przekroczenie jakichkolwiek planów gospodarczych. Zaplanowano również pokaźne nagrody za drugie i trzecie miejsce, dzięki czemu nie tylko wygrany będzie mógł pokupować lepszych zawodników z zagranicy."
BRZ_budget_based_on_betting_desc: "ZWKT właśnie ogłosił swoją nową strategię gospodarczą. Z przyjemnością bym ją wyjaśnił, lecz po raz kolejny zaprosiliśmy do studia Naczelnego Trenera, który chętnie przedstawi wam jej szczegóły.\n\nZgadza się. Nasza nowa strategia gospodarcza polega na obstawianiu całego budżetu na konkretne drużyny. Niektórzy krytycy twierdzą, że prędzej czy później stracimy w ten sposób wszystko, ale my po prostu wiemy, na kogo stawiać.\n\nInteresujące. Trzymamy kciuki. Oby to przedsięwzięcie zakończyło się sukcesem, Naczelny Trenerze."
BRZ_financial_disasters_desc: "Niestety niektóre drużyny z trudem przystosowują się do nowych realiów, co w wielu przypadkach prowadzi do niedoborów pieniędzy, ponieważ ich zarządy nie są przyzwyczajone do nowego systemu. Miasta i miasteczka są gospodarczo ściśle związane z lokalnymi klubami, więc kłopoty te wywołują efekt domina w miejscowych gospodarkach. ZWKT musi szybko coś zrobić, aby opanować sytuację."
BRZ_buyout_clubs_desc: "ZWKT właśnie wykupił bankrutujące kluby. Oczywiście pozostawiło to bardzo wyraźną dziurę w rządowym skarbcu, ale działanie powinno szybko ustabilizować zarówno sytuację w miastach, jak i całą gospodarkę. Naczelny Trener już zapowiedział restrukturyzację klubów i oddanie ich pod nowe, bardziej kompetentne zarządy."
BRZ_drop_them_desc: "Szok! ZWKT właśnie ogłosił, że każda zadłużona drużyna zostanie wyrzucona z ligi. Kibice bankrutujących zespołów rozpoczęli już protesty i obrzucili budynki rządowe koktajlami Mołotowa, lecz szybko rozprawili się z nimi fani Olimpii Truskolasy. Jak przedstawia to Robert Lewandowski, inicjatywa ma nagradzać kompetencję. Sam Lewandowski musiał jednak niedawno zatrudnić nowych ochroniarzy, aby bronić się przed protestującymi."
BRZ_funding_problem_desc: "Niektóre drużyny w naszym kraju wciąż nie radzą sobie w nowej sytuacji. Odkąd rząd nałożył na nie znacznie większą rolę w lokalnej gospodarce, wiele klubów nie potrafi wyjść na zero nawet po ogromnych cięciach. To poważny problem, który może dotknąć znacznie więcej zespołów niż poprzedni kryzys finansowania."
BRZ_central_fund_desc: "ZWKT postanowił utworzyć Centralny Fundusz Piłkarski. Jego zadaniem będzie przekazywanie środków od dobrze prosperujących klubów tym, które mają trudności. Według rządu niektóre zespoły ponoszą znacznie większe wydatki, dlatego te obciążone mniejszymi kosztami będą musiały oddawać część zysków potrzebującym. Skutki nie są jeszcze znane: program może postawić słabsze kluby na nogi, ale może też sprowokować sabotaż ze strony bogatszych zespołów."
BRZ_every_club_enterprise_desc: "Reformistyczne skrzydło ZWKT zdołało przekonać resztę organizacji, aby każdy klub przekształcić w przedsiębiorstwo, twierdząc, że rozwiąże to problemy borykających się z trudnościami drużyn. Wiele zespołów otworzyło już sklepy i kupiło zagraniczne akcje. Takie podejście z pewnością może ożywić kluby, ale grozi też przesunięciem uwagi ze zwyciężania w meczach na zarabianie pieniędzy, osłabiając nasze drużyny."
BRZ_economy_vs_brzeczek_desc: "Po pełnym napięcia miesiącu Brzęczek z dumą spogląda na wyzwania, które pozostawił za sobą. Po miesiącach wyczerpującej pracy ujrzał nadchodzące rozstrzygnięcie tego gospodarczego derbowego starcia. I teraz może to zrobić. Może przekazać sobie, swojej drużynie i całemu powiatowi kłobuckiemu wiadomość, którą usłyszy cała Polska: w zarządzaniu biznesem powinno być więcej piłki, a w piłce - mniej zarządzania biznesem. Każdy może teraz być świadkiem finansowego gola, który przyniósł złoty puchar pomysłowości Brzęczka i złoto mieszkańcom Truskolasów. To dopiero początek wielkich mistrzostw narodowych, ale już możemy być pewni, że ujrzeliśmy wyjątkowe wydarzenie, które przejdzie do historii jako fenomen na skalę światową."
BRZ_sisyphean_task_desc: "Szanowni państwo, przygotujcie się na widowisko. Jerzy Brzęczek - człowiek o, delikatnie mówiąc, wątpliwym dorobku trenerskim, zważywszy na mieszane wyniki jego drużyn - chce jednocześnie wskrzesić polską piłkę i polski naród. Zadanie będzie mozolne, ponieważ ani jedno, ani drugie od dawna nie było w szczególnie dobrej formie. Brzęczek przekonuje jednak w wywiadach, że osiągnięcia nic nie znaczą bez poświęcenia i wytrwałości. A o Naczelnym Trenerze można powiedzieć wiele, ale tych cech z pewnością mu nie brakuje. Cała Polska wstrzymuje oddech, szukając źródła narodowej dumy."
BRZ_local_administration_desc: "\"Polska to piłka. Piłka to Polska\" - to jedno z najpopularniejszych haseł wśród zwolenników klubizmu. Brzęczek nie chce, by Polacy dzielili lojalność z jakąś inną strukturą, której futbol zupełnie nie obchodzi. Twierdzi, że to kibice wywalczyli ten naród i że ich sport powinien odgrywać najważniejszą rolę zarówno w administracji centralnej, jak i lokalnej. W oczach ludzi przeciętny burmistrz wydaje się nawet gorszy od kiepskiego trenera, więc reforma z pewnością cieszy się społecznym poparciem. Z ostateczną oceną lepiej jednak zaczekać."
BRZ_state_sport_media_desc: "To jedno z ostatnich wydań \"Ekspresu Piłkarskiego\". W najbliższych dniach, zgodnie z nową polityką Związku Klubów, \"Ekspres\" oraz mniejsze prywatne audycje i stacje sportowe zostaną połączone w jeden konglomerat, który zagwarantuje jakość i rzetelność wiadomości. To był wspaniały czas, podczas którego mogliśmy opowiadać wam o wszystkim, co wiąże się z tym pięknym sportem. Nadal będziecie mogli nas słuchać i oglądać, choć w nowej formule i pod nową marką. Projekt Związku Piłkarskiego obejmie obszerne pasma wywiadów, dziennikarskich spekulacji i filmów dokumentalnych o słynnych zawodnikach i trenerach, dyscyplinach zbliżonych do piłki, a nawet regularny serwis informacyjny poświęcony sprawom niezwiązanym ze sportem. Mamy nadzieję, że znajdzie się tam miejsce dla całej naszej redakcji."
BRZ_from_junior_to_leader_desc: "Napoleon powiedział kiedyś, że każdy żołnierz nosi w plecaku buławę marszałkowską. Podobnie każdy piłkarz nosi w kieszeni trenerski gwizdek. Naczelny Trener Brzęczek uznał, że nadszedł czas, aby pomóc wyjątkowym jednostkom rozwinąć skrzydła. Kursy i obozy szkoleniowe pokażą zawodnikom, jak wygląda gra z drugiej strony boiska. Innym sposobem na przyciągnięcie świeżej krwi będzie podniesienie wynagrodzeń trenerów i prezesów. Tym posunięciem Zarząd Związku pragnie przywrócić kadrze kierowniczej dawno utraconą chwałę."
BRZ_board_of_managers_desc: "Naczelny Trener ogłosił zamiar rozszerzenia swoich klubistycznych idei. Oświadczył, że każdy, kto chce wziąć udział w jego krucjacie, jest mile widziany, ponieważ wszyscy Polacy są jedną rodziną. Zaprosił więc trenerów i selekcjonerów do rozszerzonego zarządu Jurajskiego Związku Klubów. Do organizacji zgodziły się już dołączyć kluczowe postacie z dobrze nam znanych lokalnych klubów, takich jak Grom Miedźno, Naprzód Ostrowy i Liswarta Krzepice, a także z regionalnych potęg: Sparty Lubliniec, Rakowa Częstochowa czy Warty Zawiercie. Widzieliśmy, jak Brzęczek potrafi zarządzać swoją drużyną z Truskolasów i prowadzić ją do zwycięstw; teraz widzimy, jak sięga dalej. Miejmy nadzieję, że ten rozwój stanie się wzorem na przyszłość i że jeszcze ujrzymy zjednoczony naród."
BRZ_raze_the_pzpn_desc: "SZANOWNI PAŃSTWO, WIADOMOŚĆ Z OSTATNIEJ CHWILI! Nowe media, nowe kadry i nowy zarząd doprowadziły do tego śmiałego posunięcia: ZWKT postanawia stanąć na własnych nogach! Jerzy Brzęczek zrywa wszelkie więzi z PZPN, uznając go za organizację nielegalną. W tej chwili związani z Brzęczkiem chuligani burzą budynki należące do krajowego Związku! Pojawiają się niepotwierdzone doniesienia o pobiciach pracowników. Myślę, że mogę powiedzieć w imieniu nas wszystkich, iż ten zwrot wbrew przebiegowi gry zupełnie nas zaskoczył. Miejmy nadzieję, że mimo gorącej atmosfery dzisiejszy dzień wyznaczy nowy początek polskiej piłki. Oby świeża krew i nowa organizacja ponownie uczyniły polski futbol wielkim!"
BRZ_denounce_fifa_desc: "BRZĘCZEK UDERZA PONOWNIE! Po ataku na PZPN Naczelny Trener ogłasza dalsze odcięcie od UEFA i całej FIFA. Brzęczek oskarża te organizacje o wysysanie pieniędzy z krajowych klubów przy niemal całkowitym braku pomocy z ich strony. Wygląda na to, że nadszedł czas, aby nasza drużyna stanęła na własnych nogach, odnalazła podobnie myślących i zagrała we własnej federacji. Owszem, brak meczów międzynarodowych z uznanymi zespołami może sprawiać, że ten ruch wygląda jak gol samobójczy, ale czy krajowe uznanie i duma z odrodzonej drużyny nie są warte więcej? Sądzę, że oddani kibice znają odpowiedź."
BRZ_soccer_poker_desc: "Entuzjazm niektórych mógł się okazać falstartem... Poruszanie się w złożonej sieci systemu piłkarskiego wymaga czegoś więcej niż zatrudnienia kilku nowych twarzy i wypchania ramówki sportowymi treściami. Po odłączeniu od światowej organizacji nasza drużyna musi teraz całkowicie samodzielnie rekrutować, szkolić i utrzymywać nowych zawodników. Mówiąc wprost: albo staniemy się pośmiewiskiem na arenie krajowej, albo stworzymy coś pięknego. To podejście spod znaku wysokiego ryzyka i wysokiej nagrody sprawiło, że dziennikarze nazwali nową doktrynę zarządu \"piłkarskim pokerem\"."
BRZ_dinosaurs_in_club_managements_desc: "Jak ten kraj ma działać prawidłowo, skoro klubami piłkarskimi wciąż zarządzają starzy, chciwi i niekompetentni ludzie? Te dinozaury nie wiedzą nic o futbolu i interesują się wyłącznie zyskami, jakie daje im stanowisko. Właśnie dlatego nasz najcenniejszy sport z roku na rok staczał się coraz niżej. Ale z tym koniec.\n\nNaczelnemu Trenerowi głęboko leży na sercu stan polskiej piłki i wreszcie postanowił coś zmienić. Będziemy uważnie obserwować jego kolejne kroki, lecz być może jest to początek czegoś dobrego - przemiany, która nareszcie zmyje hańbę porażek minionych lat.\n\nWiedź nas do zwycięstwa, Naczelny Trenerze!"
BRZ_corruption_runs_deep_desc: "Korupcja jest głęboko zakorzeniona w naszym systemie. Polska była skorumpowana przez dziesięciolecia jeszcze przed Upadkiem, a kluby piłkarskie nie stanowiły wyjątku. Jeśli nasza drużyna ma odnieść sukces, nie możemy dłużej na to pozwalać - korupcję trzeba wyrwać z korzeniami. Choć Naczelnego Trenera czeka trudne zadanie, uważamy je za absolutną konieczność. Brzęczek może naprawdę zmienić sytuację na lepsze i przeobrazić sport, który kochamy. Nawet jeśli wymaga to brutalnej siły, trzeba to zrobić. Naprzód, Naczelny Trenerze!"
BRZ_decimate_old_guard_desc: "Cóż, ostatnie decyzje Naczelnego Trenera nie brzmią najlepiej, prawda? Uważam, że pozbywanie się wszystkich dyrektorów, prezesów i trenerów tylko dlatego, że są starzy, to kiepski pomysł. Owszem, niektórzy są skorumpowani i niekompetentni, ale wielu mogłoby podzielić się wiedzą strategiczną, która poprawiłaby grę naszych zawodników. Dlatego nie rozumiem jego decyzji - nie musimy być aż tak radykalni. Zdecydowanie nie zgadzam się z twierdzeniem, że wszyscy nie nadają się do współczesnego futbolu. Brzęczek powinien to przemyśleć, zanim podejmie tak drastyczne kroki! Przecież wszyscy chcemy tego, co najlepsze dla polskiej piłki."
BRZ_deal_with_old_bosses_desc: "Cóż, ostatnie decyzje Naczelnego Trenera całkowicie zmieniają układ sił na boisku, prawda? Zamiast wymuszać zmianę składu, Brzęczek postanowił dogadać się ze starą gwardią, przymknąć oko na jej czyny i podjąć współpracę. Jasne, wiele osób uważa tych weteranów biurokracji PZPN za skorumpowanych i zupełnie nieprzystających do współczesnej piłki, ale Brzęczek dokładnie wie, co robi.\n\nNie da się zaprzeczyć, że ci ludzie nadal mają ogromne wpływy, znajomość administracji i rozległe koneksje, które mogą poprawić naszą ogólną skuteczność. Nie musimy być aż tak radykalni i czyścić wszystkiego w pień. Czasami sprytne partnerstwo taktyczne jest właśnie tym, czego potrzebuje polska piłka."
BRZ_purge_referees_desc: "Nie mogę uwierzyć w to, co robi Naczelny Trener - to całkowicie lekkomyślny ruch! Owszem, każdy, kto ma oczy, widzi, że polscy sędziowie nie prezentują najwyższego poziomu. Między ich nieustannymi kontrowersyjnymi decyzjami, osławionymi pijackimi wybrykami i skrajną podatnością na korupcję cały system sędziowski jest kompletnym bałaganem. Ale przeprowadzenie właśnie teraz całkowitej, bezlitosnej czystki wywoła absolutny chaos! Brzęczek sądzi, że w samym środku wojny domowej wyczaruje znikąd nową, kompetentną i w pełni zawodową kadrę sędziowską. Ten radykalny krok zupełnie sparaliżuje ligę i, mówiąc szczerze, jest fatalnym pomysłem dla polskiej piłki!"
BRZ_everyone_has_price_desc: "Wygląda na to, że Naczelny Trener wymyślił kolejną szaloną strategię kontrolowania gry, co? Zamiast usuwać sędziów albo wyrzucać ich z ligi, Brzęczek uznał, że każdy ma swoją cenę. Zamierza po prostu zapłacić im tyle, żeby nikt inny w kraju nie zdołał ich przekupić i sabotować naszych meczów! Niektórzy powiedzą zapewne, że obsypywanie arbitrów pieniędzmi wygląda podejrzanie, ale nie chodzi tu o kupienie bezwzględnej lojalności ani ustawianie wyników na naszą korzyść. To zagranie obronne, które ma zagwarantować, że żadna wroga frakcja ani skorumpowany biurokrata nie zapłaci im za działanie przeciwko piłce. Usuwając pokusę zewnętrznych łapówek, chronimy uczciwość spotkania i zapewniamy, że o wyniku rozstrzygnie boisko. To kosztowny manewr taktyczny, ale czysty gwizdek jest dokładnie tym, czego potrzebuje polski futbol."
BRZ_lack_of_discipline_desc: "Niestety wielu naszych piłkarzy jest niezdyscyplinowanych i nie posiada umiejętności niezbędnych zawodowcom, co przekłada się na fatalne wyniki meczów. Nie możemy tego tolerować, bo inaczej Polska nigdy nie zdobędzie mistrzostwa świata! ZWKT również dostrzegł problem i opracował liczne plany przywrócenia dyscypliny. Skrzydło reformistyczne krytykuje jednak ich surowość i opowiada się za bardziej wyważonym rozwiązaniem. Zobaczymy, która propozycja zostanie przyjęta."
BRZ_footballers_without_resolve_desc: "Naszym piłkarzom brakuje stalowej woli, mentalności zwycięzców i zahartowanych dusz gotowych walczyć za kraj. Zamiast tego są dekadenckimi hedonistami, którzy wykorzystują swoją pozycję wyłącznie dla pieniędzy i sławy, zamiast dążyć do dalszego rozwoju. ZWKT chce temu zaradzić, lecz podział między twardogłowymi a reformistami niezwykle utrudnia przyjęcie odpowiednich przepisów, przez co nie da się niczego zrobić."
BRZ_out_with_lollygaggers_desc: "Drodzy widzowie, czy pracownik, który nic nie robi i wykorzystuje stanowisko dla pieniędzy oraz sławy, powinien zostać zwolniony? W naszej drużynie jest podobnie - wielu piłkarzy nie robi nic, część daje z siebie absolutne minimum potrzebne, by pozostać w składzie, a tylko nieliczni naprawdę chcą się rozwijać i dają z siebie wszystko. Naczelny Trener zauważył ten problem i wybrał najskuteczniejsze rozwiązanie: zwolnić obiboków. Zawodnicy, przestraszeni możliwością utraty pracy, wreszcie zaczęli trenować i pilnować dyscypliny, poprawiając naszą pozycję w lidze. Naczelny Trener po raz kolejny podjął najlepszą decyzję."
BRZ_carrot_and_stick_desc: "Reformistyczne skrzydło ZWKT zdołało przekonać twardogłowych, aby wobec zdemoralizowanych piłkarzy zastosować znacznie bardziej wyważone podejście. Utworzono nowy system, który nagradza zdyscyplinowanych i karze dekadentów. Choć okazał się bardzo kosztowny, zawodnicy wreszcie zaczęli pracować tak, jak powinni, a do naszych szeregów powraca dyscyplina."
BRZ_focus_on_young_talents_desc: "W Polsce żyje wielu młodych ludzi, a wśród nich mnóstwo osób o ogromnym potencjale, który tylko czeka na wykorzystanie. Poprzedni rząd nie robił jednak nic w tej sprawie, więc ukryte gwiazdy futbolu tkwiły w zwyczajnej pracy od dziewiątej do siedemnastej, choć mogłyby znacząco wzmocnić naszą drużynę. Teraz to się kończy - Naczelny Trener właśnie ogłosił liczne programy, dzięki którym każdy nieoszlifowany diament zostanie wyszkolony i nauczony dyscypliny, ponieważ to właśnie ci ludzie są przyszłością naszego zespołu."
BRZ_focus_on_foreign_transfers_desc: "Niestety szkolenie młodzieży zajmie mnóstwo czasu, a doświadczonych zawodników potrzebujemy już teraz. Reformistyczne skrzydło ZWKT przekonało twardogłowych do sprowadzenia kilku talentów z zagranicy, co wzmocni naszą drużynę. Oczywiście będzie to kosztować dużo - i mam na myśli NAPRAWDĘ DUŻO - ale zespół odniesie z tego ogromne korzyści."
BRZ_hooligan_problem_desc: "Ostatnio doszło do olbrzymiego wzrostu chuligańskiej przemocy. W normalnych warunkach nie stanowiłoby to większego problemu, lecz wielu obywateli boi się dziś wychodzić z domów. Chuligani stali się też brutalniejsi, często siejąc zniszczenie i stwarzając więcej problemów, niż rozwiązują. ZWKT nadal nie wie, co z nimi zrobić, a im dłużej trwa impas, tym większe będą straty."
BRZ_disastrous_infighting_desc: "Chuligani zaczęli atakować inne grupy chuligańskie, powodując znacznie większe zniszczenia niż wcześniej. Zwykłe bójki nie wyrządzałyby poważnych szkód, ale odkąd chuligani otrzymali broń, w starciach ginie wiele osób, a liczba ofiar nieustannie rośnie. ZWKT musi szybko zareagować, bo inaczej sytuacja całkowicie wymknie się spod kontroli."
BRZ_nationalize_ultras_desc: "Naczelny Trener właśnie upaństwowił wszystkie organizacje ultrasów. Brzęczek stwierdził, że jeżeli wszystkie staną się częścią państwa, nie będą atakować innych jego części. W teorii brzmi to wspaniale, ale chuligan nadal musi gdzieś dawać upust nienawiści - a rząd będzie musiał szybko zapewnić mu odpowiedni cel."
BRZ_targeted_wrath_desc: "Reformistyczne skrzydło ZWKT zdołało przekonać twardogłowych, aby zamiast próbować zaprowadzić zgodę między chuliganami, znaleźć im wspólnego wroga. Nie wiadomo jeszcze, kto lub co nim zostanie, lecz takie podejście ma znacznie większe szanse powodzenia niż próba powstrzymania przemocy przez upaństwowienie ultrasów."
BRZ_portuguese_common_enemy_desc: "Portugalczycy. To nasi najwięksi wrogowie. Jeżeli chcemy zdobyć mistrzostwo świata, musimy się ich pozbyć. Naczelny Trener zorganizował liczne kampanie antyportugalskie, aby przypomnieć wszystkim - szczególnie chuliganom - kto jest prawdziwym nieprzyjacielem. Ogromnie pomogło to również rozwiązać problem chuligaństwa, ponieważ chuligani wreszcie mają kogo nienawidzić."
BRZ_blow_off_steam_desc: "Reformiści z ZWKT przekonali całą organizację do urządzania specjalnych walk dla chuliganów - bez broni i pod ścisłym nadzorem sędziów. Z pewnością pozwoli im to dać upust nienawiści. Organizacja takich starć nadal trochę kosztuje, ale naprawa szkód jest znacznie tańsza, a liczba ofiar śmiertelnych spadła niemal do zera."
BRZ_cba_desc: "Każdy kraj, a nawet duża organizacja, ma jakiś organ ścigający przestępczość białych kołnierzy, umyślną niekompetencję i wszystko inne, co mieści się pod zbiorczym pojęciem korupcji. Polska miała CBA. Jak na agencję było w porządku. I to nie wystarczyło.\nNasze biuro antykorupcyjne będzie działać szerzej, czuwać baczniej i dysponować obszerniejszym wywiadem niż nawet amerykańskie czy rosyjskie służby. Nasz sport narodowy zasługuje na nie mniej - a wręcz wymaga więcej."
BRZ_white_red_academy_desc: "Państwa postsowieckie, nawet te egalitarne, cierpią na chroniczny i dobrowolnie podtrzymywany brak prestiżowych uczelni. Kto za granicą słyszał o Uniwersytecie Warszawskim? Porównajcie go z London School of Economics, nie wspominając już o amerykańskiej Ivy League. Azjaci Wschodni w dużej mierze obeszli ten problem, narzucając wszystkim brutalne standardy nauczania, ale to pochłania czas, który lepiej przeznaczyć na grę w piłkę.\nNajwiększą tragedią pozostaje jednak żałośnie nieskuteczne wyszukiwanie i rozwijanie talentów w Polsce. Beznadziejne sekcje młodzieżowe. Skauting, który ma więcej wspólnego z rzutem kostką niż werbowaniem uzdolnionych graczy. Biało-Czerwona Akademia stanie się ogólnokrajowym instytutem doskonałości - jednym miejscem skupiającym światowej klasy warunki treningowe oraz łowców talentów wyławiających najlepsze okazy już w wieku sześciu lat, wszędzie tam, gdzie sięga nasza władza. Każdy zna Hogwart. Ta szkoła kunsztu piłkarskiego i futbolomancji będzie jednak prawdziwym Hogwartem."
BRZ_hooligan_army_department_desc: "Trudno nazwać ultrasów wojskiem. Przeciętnemu ultrasowi daleko do dyscypliny i wytrzymałości zawodowego żołnierza. Mimo to są to twardzi i zmotywowani ludzie, którym wystarczy dobry sierżant musztry, aby stali się groźnymi frontowcami. Mamy własnych żołnierzy, więc nie musimy przerabiać ultrasów na wojskowych od podstaw. Wystarczy wcielić najtwardszych z nich do osobnych plutonów, które nasz korpus oficerski wyszkoli i urobi na porywczą, lecz sprawną klasę żołnierską. Kogo obchodzą bóle głowy, jakich przysporzą sądom wojskowym po kolejnej bójce?"
BRZ_rozklad_jazdy_znany_desc: "Nasz obecny stan - kraj przestał istnieć, zostaliśmy naprawdę sami, nie rozwijamy się, tylko walczymy o przetrwanie i trenujemy - jest dla nas zupełnie nowym rodzajem piłki. Dawniej mogliśmy przegrać mecz otwarcia, mecz o wszystko, a w meczu o honor wywalczyć remis. Dziś nasza gra to nie tylko futbol, lecz także podbój innych walczących o zjednoczenie narodu: zwyciężymy albo zginiemy. A naród ten jeszcze nie zginął, póki my żyjemy.\nCzy może istnieć lepsza motywacja?"
BRZ_jazda_z_kurwami_desc: "Najlepsi ludzie Naczelnego Trenera Brzęczka wychodzą na boisko, a kibice wybuchają słusznym rykiem. Morze biało-czerwonych flag i twarzy jest chórem aniołów zwiastujących nasze przyszłe triumfy. Nie będzie już meczów o honor ani nawet o wszystko - będzie tylko gra godna takich trybun! Jednocześnie naszymi trybunami staną się kobiety i dzieci, a wszyscy dorośli zdolni do walki zostaną naszymi reprezentantami. Ruszamy na wojnę o jedność kraju. Zarówno na polu bitwy, jak i na boisku oczekujemy wyłącznie całkowitego triumfu. Naprzód, Polsko! Jazda z kurwami!"
BRZ_tactical_assesment_desc: "Będę z wami szczery. Jesteśmy trochę debilami. Być może kompleks niższości wmawia nam, że musimy albo grać jak grecka falanga - bezpiecznie i bez ruchu - albo wyciągać króliki z kapelusza, żeby przy posiadaniu piłki poniżej 30% wyszarpać remis. A może po prostu rozkradliśmy wszystko, czego potrzeba do grania porządnej piłki. Nigdzie w Europie reprezentacja narodowa nie jest tak bojaźliwa taktycznie jak nasza. Ale już niedługo. Wkrótce staniemy się czarnym koniem Europy i przestaną nas zadowalać zwycięstwa w sparingach z Curaçao czy innym Sierra Leone."
BRZ_obrona_czestochowy_desc: "Obrona Częstochowy jest dla polskiej piłki tym, czym obrona skandynawska dla szachów - a przynajmniej byłaby, gdyby ta druga polegała wyłącznie na przesuwaniu wieży bez końca między dwoma polami. To podstawa naszej defensywy, idealna do utrzymania wyniku 1:0, wyszarpania niepewnego remisu albo niedopuszczenia, by porażka stała się jeszcze bardziej upokarzająca. Zasada jest prosta. Przestajemy choćby próbować strzelać i zapełniamy własną połowę zawodnikami. Każdy zostaje obrońcą - wybacz, Lewy, koniec z golami. To siłowe rozwiązanie pozwala zdusić każdego napastnika i działa, kurwa, jak złoto. Aha, może część tych lekcji uda się zastosować również na polu bitwy."
BRZ_laga_desc: "Wymyślna, piękna piłka jest przereklamowana. Znamy tylko jeden numer i nazywamy go Lagą. To Blitzkrieg polskiego futbolu. Najlepiej działa tuż po zastosowaniu obrony Częstochowy: najpierw najlepszy napastnik zakrada się na połowę przeciwnika, potem bramkarz wykopuje piłkę najdalej, jak potrafi, teleportując grę pod bramkę rywala. Może wspomniany napastnik dopadnie piłki, a może nawet strzeli gola. Dla najlepszych efektów należy stosować na przemian z obroną Częstochowy. Prędzej czy później bramki zaczną wpadać. Skoro już mowa o Blitzkriegu, w wojsku możemy zrobić podobnie: może połączyć ostrzał dalekiego zasięgu z natarciem infiltracyjnym?"
BRZ_jaka_wrzutka_wariacie_desc: "Naszym największym grzechem jest brak wyczucia czasu przy dośrodkowaniach. Dośrodkowanie to średni lub długi pas z boku w stronę środka boiska, tworzący idealne warunki do zdobycia bramki... albo utraty piłki. Koniec z tym. Zaskoczmy obronę wczesną wrzutką albo rozpocznijmy piętrową grę psychologiczną, aby rozpętać idealną burzę. Niech komentatorzy krzyczą: \"Jaka wrzutka, wariacie?!\", a potem niech odszczekują swoje słowa, zagryzając je golem."
BRZ_brexit_football_desc: "Nie możemy okazywać litości drużynom lepszym technicznie. Nasz futbol będzie bezwzględny - piłka może przejść, ale zawodnik już nie. Ta zasada, stosowana swego czasu przez Jacka Góralskiego, uznaje dopuszczenie przeciwnika na dogodną pozycję za grzech kardynalny. Zablokuj go, zderz się z nim bark w bark, a jeśli trzeba, powal go jak w futbolu amerykańskim lub po prostu zrób mu sanki. Niech nasze siły zbrojne też nie będą łagodniejsze. Nie dawajmy im ani chwili wytchnienia."
BRZ_tiki_taka_desc: "Tiki-taka opiera się na bezpiecznych, krótkich podaniach i schematycznych manewrach, które łatwo wyćwiczyć i które pozwalają kontrolować oraz utrzymywać posiadanie piłki. To bardzo skuteczna taktyka, choć jej wykonanie wymaga długiego treningu i żelaznej dyscypliny. Gdy już ją opanujemy, będziemy mogli zapomnieć o Ladze i innych gorszych rozwiązaniach, a pod bramką przeciwnika znajdziemy się jak przy rzucie karnym. Tak grają zwycięskie drużyny."
BRZ_catenaccio_desc: "W przeciwieństwie do naszych rodzimych taktycznych aborcji catenaccio zapewnia znakomitą obronę, pozostawiając przy tym miejsce na świetne kontrataki. Możemy odgrodzić rywali murem i grać na posiadanie, a jeden pomocnik będzie posyłał długie podania do napastników, gdy nadejdzie pora na kontrę - nie należy tego mylić z Lagą. Krytycy nie ośmielają się obgadywać tego stylu w obecności Włochów, przynajmniej nie w ich własnym kraju i języku. Nam to wystarczy, by się od nich uczyć."
BRZ_futbol_totalny_desc: "CZY CHCECIE FUTBOLU TOTALNEGO?! CZY CHCECIE FUTBOLU TAK TOTALNEGO I RADYKALNEGO, ŻE PRZEJDZIE DO HISTORII W RYKU KOMENTATORÓW SPORTOWYCH?! CZY WIERZYCIE W NACZELNEGO TRENERA BRZĘCZKA I TOTALNE ZWYCIĘSTWO POLSKIEJ DRUŻYNY?!\nJeśli tak, futbol totalny jest samą wojną - wojną piłki nożnej. Wojna to chaos, a my będziemy ćwiczyć chaos każdego dnia. Wystarczy, że osiągniemy mistrzostwo w podstawach, które już dobrze znamy. Potem zaczniemy grać i sami nie będziemy wiedzieć, co robimy - ale przeciwnik także nie. W tym chaosie zdecydują wola i wytrzymałość, a tych mamy pod dostatkiem."
BRZ_gegenpress_desc: "Jak powiedziałby Franz Smuda: PRESS. Drużyna przeciwna tak bardzo pogubi się na widok naszych zawodników biegających praktycznie w kółko, że odruchowo spróbuje nas odepchnąć i wywalczyć sobie czystą pozycję. Nie uda się. Będziemy PRESSOWAĆ nich tak mocno, że stracą wszelkie pojęcie o tym, co się dzieje. A właśnie w takich warunkach rozkwitamy, bo od początku na żadnym pojęciu nie polegaliśmy. Odzyskanie piłki będzie w tej sytuacji nieuniknione."
BRZ_panic_playing_desc: "To zwód piłkarski - psychologiczna pułapka, w którą wpędzamy przeciwnika, wzbudzając w nim nadmierną pewność siebie, takiego powolnego i podstępnego zabójcę. Gdy ruszy do przodu i odsłoni się w pogoni za łatwym zwycięstwem, ustawimy szyki i bez litości wykorzystamy lukę. Efekt końcowy? Gol ze skrzydła. Podstęp z dodatkiem catenaccio - danie nagrodzone odwróceniem losów spotkania."
BRZ_w_polsce_nie_ma_juz_slabych_druzyn_desc: "Koniec z szarganiem dobrego imienia polskich drużyn i twierdzeniem, że połowa z nich nie wie, co robi, albo zasługuje na spadek. W POLSCE NIE MA SŁABYCH DRUŻYN. Tutaj jesteśmy silni. Tutaj wiemy, co robimy - zwłaszcza gdy widać coś dokładnie przeciwnego. Tutaj, bez względu na to, jak marnym materiałem dysponujemy, wyniki przemówią same za siebie. Tutaj sprawdzimy obraną drogę w zwycięstwie albo... jeszcze większym zwycięstwie. W Polsce nie ma słabych drużyn. Tutaj jesteśmy bezpieczni przed kolejną kompromitacją.\nTutaj jesteśmy wolni."




 ##Characters##
POLITICS_JERZY_BRZECZEK_DESC: "Jerzy Brzęczek nie miał łatwego życia - nie tylko z powodu upadku państwa. Przyjął ten upadek z nadzieją oczyszczenia plamy na swojej honorze. Mimo to jego nazwisko w Polsce było synonimem przeciętności. Jednak Truskolasy, do których przybył po Upadku, surowo rozliczyły tę niedbałość. Z pomocą milicji klubów, które go poparły, obalił resztki dawnej administracji i ustanowił ZWKT, ogłaszając siebie Najwyższym Selekcjonerem.\nTeraz ludzie tworzą kluby, gdzie jedzą, piją, pracują i trenują, by rozwijać umiejętności piłkarskie. W państwie Brzęczka nie ma miejsca na ociąganie się ani na dwa największe zbrodnie myśli - Peszkizm (hedonizm i alkoholizm) oraz Nawałkizm (korupcja, kłamstwa, brak idei i powierzchowność). Wspomnienia o dawnych trenerach zostały wymazane z ksiąg, podobnie jak ci, którzy najbardziej zniszczyli polski futbol - przeklęci Portugalczycy...\nReszta została przedstawiona jako bezduchowi poplecznicy Polskiego Związku, który w rzeczywistości był winny wszystkiemu złu w życiu Brzęczka.\nTo jednak się zmieni - Najwyższy Selekcjoner poprowadzi nas do zwycięstwa żelazną ręką!\nBracia i Siostry, na boisko! Od teraz każdy z nas jest reprezentantem!"

 ##Events##
 
buzzer.1.t: "Pierwsza połowa"
buzzer.1.desc: "Można powiedzieć, że ostatni gwizdek zabrzmiał dla mnie już dawno temu. Historia nie potraktowała mnie sprawiedliwie. Robiłem, co mogłem dla dobra polskiej piłki, wprowadziłem reprezentację na Euro 2020, a mimo to zwolniono mnie ze stanowiska selekcjonera. Kilka lat później nadszedł Upadek i nikogo nie zdziwiłoby, gdybym zniknął z życia publicznego.\n\nNie. Usunąc się w cień... to nie dla mnie... Mimo wszystkiego, co rzucono mi pod nogi, moja rola w sporcie jeszcze się nie skończyła. Gdy Polska pogrążyła się w wojnie domowej, musiałem znaleźć dla siebie idealne miejsce. Pośród chaosu wróciłem do jedynego, które przyszło mi do głowy - do Truskolasów. Do domu. Przynajmniej nim był, zanim wszystko się spierdoliło.\n\nTo przecież tutaj zaczęła się wielka podróż, tutaj mieścił się mój pierwszy klub. Miałem zaledwie jedenaście lat, gdy zacząłem grać w lidze juniorów, i były to jedne z najlepszych lat mojego życia. Wbrew wszystkiemu klub nadal istnieje. Wiem, że dostanie jeszcze jedną szansę, by dowieść wyższości polskiej piłki, a cały naród - podobnie jak ta drużyna - nie ulegnie przeciętności i ciemności.\n\nSprawy nie były jednak tak proste, jak się wydawały. W rozbitym kraju nikogo nie obchodził sport. Wtedy zrozumiałem, że stworzenie najsilniejszej drużyny w historii Polski nie wystarczy. Na drodze stał mi nie tylko chaos, lecz także groźba powrotu dawnych porządków. Największą tragedią dla kraju byłoby ponowne utrwalenie władzy PiS. Albo przejęcie jej przez inną bandę fanatyków zajmujących się wyłącznie polityką. Nie zamierzam na to pozwolić. Skoro politycy nie naprawią kraju, ktoś inny musi to zrobić. Musi pokierować wszystkim jak należy, bez zwyczajowej korupcji i chciwych przywódców.\n\nPragnąć zmian a rzeczywiście je przeprowadzić to jednak dwie różne rzeczy. Przede mną stoi teraz niezwykle trudne zadanie. Budżet praktycznie nie istnieje, miejscowe boisko jest ruiną, a Olimpia Truskolasy potrzebuje gruntownej przebudowy od góry do dołu, zanim w ogóle zacznie działać jak prawdziwy klub - nie mówiąc już o potędze, o której marzyłem.\n\nW ostatnich dniach spędzam wiele czasu samotnie, rozrysowując ustawienia i zastanawiając się nad tym, co mogłoby powstać. Doskonale wiem, że najtrudniej jest zacząć, a postawienie Truskolasów na nogi będzie wymagało tytanicznej harówki. Ale jeśli ludzie coś o mnie wiedzą, to właśnie to, że się nie wycofuję. Tym razem stawiam wszystko na jedną kartę i zrobię, co konieczne, aby polska piłka znów znalazła się na szczycie."
buzzer.1.a: "Za wszelką cenę."

buzzer.2.t: "Rzut wolny"
buzzer.2.desc: "Powiedzieć, że sytuacja wewnętrzna Truskolasów była zła, to nic nie powiedzieć. Była gówniana. Położone pośrodku niczego państwo Naczelnego Trenera nie mogło sprawnie funkcjonować. Braki żywności, zerwane szlaki zaopatrzeniowe i bieda były tam wszechobecne. Całość spajała jedynie silna wola zwycięstwa.\n\nGospodarka nie była jednak jedynym problemem Truskolasów. Resztki dawnego Polskiego Związku Piłki Nożnej nadal pełzały po okolicy. Biurokraci i skorumpowani działacze pozostali po rozpadzie władzy centralnej ukrywali się w ruinach miejscowych urzędów. Zamiast próbować cokolwiek naprawić, zajmowali się zakulisową polityką, gromadzili resztki zasobów i manipulowali mieszkańcami, aby przywrócić dawne, wygodne czasy łapówek i nepotyzmu.\n\nCo gorsza, lokalne ulice stały się polem bitew pomniejszych frakcji. Osiedlowe grupy i watażkowie nieustannie walczyli o terytorium, skrzynie żywności i zapasy paliwa, zmieniając miasta oraz wsie w chaotyczne pobojowiska. Pośrodku tego wszystkiego znaleźli się miejscowi ultrasi. Nie byli już zwykłymi kibicami: uzbrojeni, agresywni i zupełnie poza kontrolą, całymi dniami malowali po murach, prowadzili czarne rynki i wszczynali plemienne wojny o terytorium z sąsiednimi wsiami. Chuligaństwo i chaos obchodziły ich znacznie bardziej niż rzeczywista odbudowa narodu.\n\nPozostawała jeszcze sama drużyna. Szczerze mówiąc, zawodnicy Olimpii Truskolasy byli kompletnie beznadziejni. Połowa nawet nie chciała przychodzić na boisko, a tym, którzy się zjawiali, brakowało podstawowej dyscypliny. Nie potrafili wymienić dwóch prostych podań, nie mieli żadnej kondycji i większość czasu spędzali na kłótniach, zamiast ćwiczyć schematy. Wyglądali jak żałosna ekipa z ligi osiedlowej, którą siłą zagnano do biegania po błocie i która pozostawała zupełnie ślepa na rewolucyjną rolę, jaką miała odegrać.\n\nStojąc przy linii bocznej, Brzęczek szybko pojął brutalną prawdę. Korupcja, tragiczny poziom, przemoc i zwyczajne lenistwo były wszędzie. Jeżeli naprawdę chciał stworzyć najsilniejszą drużynę w historii Polski, musiał bezwzględnie posprzątać cały ten bałagan od podstaw - zaczynając od ludzi, którzy twierdzili, że stoją po jego stronie."
buzzer.2.a: "Tym razem Jerzy Brzęczek się nie cofnie."

buzzer.3.t: "Konferencja prasowa"
buzzer.3.desc: "Jerzy Brzęczek poczuł coś, czego spodziewał się doświadczyć podczas całkowitego upadku cywilizacji, choć niezupełnie w taki sposób. Nostalgię. Nie zwyczajną nostalgię spod znaku \"kiedyś to było\". Te emocje groziły rozerwaniem go od środka. Już tu był i marzył, by kiedyś powrócić - choć nigdy nie należało to do najprzyjemniejszych doświadczeń.\n- Trenerze, jaki jest sens tworzenia reprezentacji kraju, którego terytorium obejmuje trzy powiaty? - zapytał jeden z dziennikarzy.\nPierwszą konferencję prasową po Upadku trudno było traktować poważnie. Kraj rozpadał się na kawałki, a oni urządzali cyrk wokół powołań do kadry, która nie miała z kim grać. Do tego dochodzili sami dziennikarze. Większość przyszła jedynie po to, by wyciągnąć od Brzęczka jakieś polityczne oświadczenie, a połowa zapewne nawet nie wiedziała, czym jest spalony.\n- Proszę pana, chodzi o to, że w tych trudnych czasach ludzie potrzebują czegoś, co ich zjednoczy. Taką rolę spełni reprezentacja Związku. - Jak zawsze Brzęczek starał się zachować umiar i ukryć wyczerpanie kolejnym bezsensownym pytaniem, choć nawet jego cierpliwość zdawała się dobiegać końca.\n- Jak ma kogokolwiek jednoczyć, skoro grają fatalnie? - odparł dziennikarz.\n- Fatalne to są te pytania. Skończyliśmy? - warknął trener, gestem przywołując asystenta. Mężczyzna pośpiesznie podszedł z plikiem odręcznych notatek i podał je selekcjonerowi. - Przejdźmy zatem do konkretów.\n\nBrzęczek rozłożył kartki zawierające starannie przygotowane przemówienie, lecz po chwili odłożył je z powrotem na stół. Miał jedynie odczytać nazwiska powołanych do reprezentacji, ale w tej krótkiej chwili zrozumiał, że być może dziennikarze mieli rację. Czymże było to świętowanie piłkarskiej przeciętności, jeśli nie farsą?\n\n- Szanowni państwo, reprezentowanie kraju to największy możliwy zaszczyt. Wszyscy wiemy, jak niezwykłe jest uczucie, gdy otrzymuje się przywilej gry z orłem na piersi. Ale ilu z was pozostaje jedynie biernymi obserwatorami? Ilu opuści nas po pierwszej porażce albo jednym wyjątkowo fatalnym remisie? Ilu uzna, że tak naprawdę piłka nigdy ich nie obchodziła, bo to tylko jakiś głupi sport, w którym dwudziestu dwóch mężczyzn biega za piłką, a na końcu Polska i tak przegrywa? Futbol nie jest tylko grą. To jedna z tych wspaniałych rzeczy w życiu, które jednego dnia potrafią sprawić, że czujecie się jak na samym dnie, a następnego - jak władcy świata. Piłka może przemienić zwyczajnych ludzi w bohaterów. Jesteśmy zaledwie narzędziami drużyn należących do całych społeczności. Pewnego ranka się obudzicie, coś nagle przeskoczy wam w głowie i zrozumiecie. Bo to, co tutaj robimy, dotyczy każdego z was - szczególnie w takich czasach jak te.\n\nW sali zapadła śmiertelna cisza. Nie była to cisza niezręczna, lecz taka, w której podziw zawładnął umysłami wszystkich obecnych.\n- Dziękuję za przybycie. Lista powołanych zawodników zostanie wywieszona na drzwiach wejściowych."
buzzer.3.a: "Wszyscy jesteśmy reprezentacją!"

buzzer.4.t.w: "Olimpia Truskolasy 1 : 0 Liswarta Krzepice"
buzzer.4.t: "Olimpia Truskolasy 0 : 1 Liswarta Krzepice"
buzzer.4.desc.w: "\"Stadion\" był zaledwie ogólnodostępnym boiskiem treningowym w Truskolasach. Nie miał nawet trybun, tylko lichy płotek. Nie było też reflektorów. Główna murawa akurat przechodziła remont, lecz skoro jedyną pewną widownię tego meczu mieli stanowić nieroby, ptaki i inne gorsze stworzenia, Truskolasy zmierzyły się tutaj ze znamienitą, potężną Liswartą Krzepice (jak dla nas potężną). Goście mieli wiele do udowodnienia: wcześniej słyszało o nich niewielu spośród ich własnych mieszkańców, a może amatorskie nagranie wykonane smartfonem przez pięcioletniego syna jednego z piłkarzy wreszcie do nich dotrze. Film mógłby nawet nabrać wartości, gdyby internet już nigdy nie wrócił do Polski.\n\nLiswarta przyjęła natarcie jak dzik: stary, okaleczony dzik, który przez ostatni miesiąc żywił się mchem i desperacją. Truskolasy szybko się z nią rozprawiły - brak bramek w każdej połowie, podczas gdy nasza drużyna zdołała doczłapać się do braki dopiero w ostatniej minucie. I tyle. Nie było chwalebnych manewrów ani godnych uwagi zagrań. Tylko dwie okaleczone drużyny okaleczonego narodu, próbujące odnaleźć odrobinę dumy w sporcie, który niegdyś jednoczył świat. Na razie przyniósł im tylko chwilę wytchnienia od czegoś przypominającego apokalipsę oraz bombardowanie ptasim gównem ze strony najwierniejszych kibiców - gołębi."
buzzer.4.desc: "\"Stadion\" był zaledwie ogólnodostępnym boiskiem treningowym w Truskolasach. Nie miał nawet trybun, tylko lichy płotek. Nie było też reflektorów. Główna murawa akurat przechodziła remont, lecz skoro jedyną pewną widownię tego meczu mieli stanowić nieroby, ptaki i inne gorsze stworzenia, Truskolasy zmierzyły się tutaj ze znamienitą, potężną Liswartą Krzepice (jak dla nas potężną). Goście mieli wiele do udowodnienia: wcześniej słyszało o nich niewielu spośród ich własnych mieszkańców, a może amatorskie nagranie wykonane smartfonem przez pięcioletniego syna jednego z piłkarzy wreszcie do nich dotrze. Film mógłby nawet nabrać wartości, gdyby internet już nigdy nie wrócił do Polski.\n\nŚmiałe przedsięwzięcie trenera Brzęczka przyjęło właśnie pierwsze ptasie gówno prosto na głowę - dosłownie i w przenośni. Liswarta nie pozwoliła Truskolasom trafić do swojej bramki, aż sama strzeliła gola w ostatniej minucie. Poza tym spotkanie niczym się nie wyróżniało: bezbarwna gra, odrabianie pańszczyzny i myśli skupione bardziej na przetrwaniu, schronieniu oraz cieple niż na piłce. Trudno oczekiwać czegoś innego w żałosnym położeniu tego narodu. Nie mogło to jednak trwać wiecznie. Truskolasy nie miały zasobów potrzebnych do stworzenia prawdziwej drużyny... jeszcze. Nie ma meczu o honor. Jest tylko następny mecz."
buzzer.4.a: "Pierwsze z wielu zwycięstw."
buzzer.4.b: "NIC SIĘ NIE STAŁO, POLACY, NIC SIĘ NIE STAŁO"

buzzer.5.t.w: "Olimpia Truskolasy 3 : 1 Znicz Kłobuck"
buzzer.5.t: "Olimpia Truskolasy 0 : 2 Znicz Kłobuck"
buzzer.5.desc.w: "Znicz Kłobuck. Ich stadion był ledwo uprzątniętym, w miarę równym polem z bramkami, lasem po jednej stronie i przysiółkiem po drugiej. W naszym żałosnym, odciętym od świata państwie musimy jednak znaleźć kogoś do gry - nawet jeśli jest to wieś, o której nikt nigdy nie słyszał. Pierwsza połowa poszła dobrze: nie odpuszczaliśmy pressingu, utrzymywaliśmy się przy piłce, a nawet przez ponad połowę czasu jej nie gubiliśmy. Nasi pomocnicy sprawili, że wieśniacy ze Znicza biegali jak kury dookoła kurnika, i posyłali podania, które czasem trafiały nawet mniej więcej tam, gdzie powinny. Przynajmniej Znicz jeszcze gorzej radził sobie z posiadaniem; czasami nie musieliśmy robić absolutnie nic, by odzyskać piłkę. Dlatego prawdziwym zaskoczeniem było, gdy po jednej udanej ladze ich napastnik umieścił ją w siatce.\n\nW drugiej połowie jednak strzeliliśmy gola, potem następnego i już się nie podnieśli. W ostatnich dziesięciu minutach wykorzystaliśmy nawet rzut karny. Niestety Znicz miał kilku widzów. Ba, nawet kibiców. Takich jak Kazio Wichura. Mówią, że kiedy był mały, spadł ze schodów na podłogę i prawdopodobnie właśnie wtedy uszkodził sobie głowę. Silny, nieustraszony, o spojrzeniu wsiowego głupka, który miał zostać ludową legendą. Po naszym zwycięstwie jeden z kretynów grających w naszej drużynie pokazał w stronę Znicza środkowy palec. Kazio rozumiał niewiele, ale środkowy palec rozumiał doskonale. Skoczył, pognał przed siebie i pięciu ludzi musiało go trzymać, by nie połamał zawodnikowi nóg - wcześniej zdążył jeszcze znokautować kogoś leżącym obok kamieniem. Uspokoił się dopiero wtedy, gdy ryczącemu i zapłakanemu mama podała kotlety jagnięce."
buzzer.5.desc: "Znicz Kłobuck. Ich stadion był ledwo uprzątniętym, w miarę równym polem z bramkami, lasem po jednej stronie i przysiółkiem po drugiej. W naszym żałosnym, odciętym od świata państwie musimy jednak znaleźć kogoś do gry - nawet jeśli jest to wieś, o której nikt nigdy nie słyszał. Pierwsza połowa poszła dobrze: nie odpuszczaliśmy pressingu, utrzymywaliśmy się przy piłce, a nawet przez ponad połowę czasu jej nie gubiliśmy. Nasi pomocnicy sprawili, że wieśniacy ze Znicza biegali jak kury dookoła kurnika, i posyłali podania, które czasem trafiały nawet mniej więcej tam, gdzie powinny. Przynajmniej Znicz jeszcze gorzej radził sobie z posiadaniem; czasami nie musieliśmy robić absolutnie nic, by odzyskać piłkę. Dlatego prawdziwym zaskoczeniem było, gdy po jednej udanej ladze ich napastnik umieścił ją w siatce.\n\nA jednak nasi losowi napastnicy byli mniej więcej tak celni jak niegdyś Raheem Sterling. Mimo całkowitej dominacji w posiadaniu trener stracił cierpliwość i w osiemdziesiątej minucie ryknął, by drużyna wreszcie się przyłożyła. \"NAPIERDALAAAMYYYY!\", zawołał, nawiązując do starej polskiej kreskówki. Zdołał wycisnąć z nich jedynie faul. Sędzia, osiedlowy dzieciak z gębą mistrza międzynarodowej olimpiady w gnębieniu słabszych, podyktował karnego i wyciągnął kartkę... ale dyskretnie złożona łapówka pod postacią kotletów jagnięcych skłoniła go do zmiany decyzji i poprzestania na drobnym upomnieniu. 0:2 dla Znicza. Już się nie podnieśliśmy. Niestety przywieźliśmy też własnych ultrasów, żeby nas dopingowali, a wynik zdecydowanie im się nie podobał. Trener musiał rzucić się do ucieczki, gdyż wtargnęli na boisko i zaczęli okładać zawodników, którzy nie zdążyli zwiać, oraz kibiców Znicza, czyli grupę nastolatków, grubą ciotkę bijącą jak ciężarówka i miejscowego głupka - syna gospodarza, który był, niestety, inny. Trochę leniwy i niezbyt zwinny, ale nadal potrafił rzucić ultrasem jak mistrz judo."
buzzer.5.a: "Bogowie z Olimpu!"
buzzer.5.b: "NIC SIĘ NIE STAŁO, POLACY, NIC SIĘ NIE STAŁO"

buzzer.6.t: "Boj-isko: trening"
buzzer.6.desc: "- Szanowni państwo, Janek Graczyk mija obronę, przymierza i... GOL! JANEK GRACZYK STRZELA DLA OLIMPII TRUSKOLASY W LIDZE JUNIORÓW! TRYBUNY SZALEJĄ! GRACZYK! GRACZYK! GRACZYK STRZELA GOLA!\nDo tej chwili prowadziło całe osiemnaście lat życia Janka. Gdy po raz pierwszy wziął do ręki piłkę i gdy jako siedmiolatek po raz pierwszy przyszedł na trening, postawił pierwsze kroki na drodze ku wielkości. Po miesiącach treningów i wyczerpujących meczów nie miał już siły. Ledwie stał na własnych nogach. Pamiętał tylko urywki. Uściski, wiwaty, puchar, szatnię i kuśtykanie do samochodu matki - wszystko zlewało się w krótkie migawki. Chyba pamiętał, jak wczołgał się do łóżka. Był wyczerpany i musiał odpocząć przed zaplanowanym na następny dzień przyjęciem.\n\nMimo jego wyraźnych poleceń matka obudziła go wczesnym rankiem.\n- Jacyś panowie do ciebie, kochanie. Chyba coś ważnego.\n- Powiedz im, że nie ma mnie w domu czy coś - odparł sennie Janek.\n- Cóż, oni już są w twoim pokoju.\nChłopak w panice poruszył się w łóżku, próbując przykryć kołdrą.\n- Gratulacje, panie Graczyk. Zasłużył pan na przywilej służby narodowi.\n\nNie było czasu na przygotowania. Z pewnością nie było go na przyjęcie, a na pożegnanie z matką zostało go bardzo niewiele. Jego i innych młodych mężczyzn wysłano na nie wiadomo jak długi obóz pośrodku dziczy.\n- Dzień dobry, rekruci! - powiedział wysoki mężczyzna ubrany w połączenie dresu i munduru. - Jestem sierżant trener Dawid Fuss, a wy jesteście szczęśliwymi wybrańcami, których niezwykłe wyniki sportowe zakwalifikowały do poszerzenia zakresu umiejętności. Przez najbliższy miesiąc przejdziecie w naszym obozie szkolenie żołnierskie, które uzupełni waszą znakomitą cywilną sprawność przygotowaniem wojskowym.\nTwarz Graczyka wyrażała wszystko, co sądził o tym pomyśle. Zamiast świętować z przyjaciółmi i szukać sposobu na rozwinięcie kariery piłkarskiej, tkwił tutaj i uczył się czyścić wiatrówki. Z tęsknotą spojrzał na mężczyzn w koszulkach moro rozgrywających mecz.\n- Dlaczego oni mogą grać w piłkę, a my mamy być trepami?\n- Czy to nie oczywiste, że skoro wy, sportowcy, musicie poznać życie żołnierza, oni muszą nauczyć się życia sportowca? - Sierżant uśmiechnął się paskudnie i dodał: - Kolejne gratulacje! Właśnie zarobiłeś pięćdziesiąt dodatkowych pompek za pyskowanie. A nawet nie zaczęła się jeszcze poranna zaprawa!\nNastępne dni upłynęły na nauce konserwacji i obsługi broni, komunikacji oraz, rzecz jasna, musztry. Potem sierżant powiedział im, że przygotował coś specjalnego.\n\n- Możecie myśleć, że wiecie, co to jest, ale się mylicie - oznajmił Fuss, wskazując piłkę za czymś w rodzaju wielkiego okna. - Nareszcie - odetchnął Graczyk, po czym bez chwili wahania wyskoczył z szeregu, z pełną prędkością ominął okno i ruszył ku piłce.\n- Czekaj! - krzyknął sierżant, ale było już za późno. Graczyk kopnął piłkę, która przeleciała sporą odległość i uderzyła w wojskowego jeepa. Pojazd natychmiast eksplodował w kuli ognia.\n- To było... Ja... - powieka Fussa zaczęła drgać. - MÓWIŁEM, ŻE TO NIE JEST TO, CO MYŚLICIE! To był prototyp miny udającej piłkę! A TY WYSADZIŁEŚ JĄ RAZEM Z WOJSKOWYM POJAZDEM!"
buzzer.6.a: "Ups!"

buzzer.7.t: "Klubować czy nie klubować"
buzzer.7.desc: "Pierwszy nieoficjalny kongres ZWKT miał odpowiedzieć na jedno proste pytanie: czym właściwie jest klubizm? Salę przygotowano z niezwykłą starannością. Za stołem prezydialnym wisiał świeżo zaprojektowany emblemat ruchu - wypolerowany, symetryczny i dostatecznie oficjalny, by uciszyć kilka wątpliwości, zanim zdążyły przerodzić się w pytania. Wokół zasiedli miejscowi trenerzy i delegaci Związku. Na stole spoczywały projekty, diagramy, statuty, harmonogramy treningów, formularze lojalności, listy obecności oraz pojedyncza piłka ustawiona pośrodku niczym święta relikwia. Zebrani eksperci jeden po drugim próbowali zdefiniować doktrynę. Jedni dowodzili, że klub musi stać się podstawową jednostką życia społecznego. Inni proponowali, aby każdy obywatel należał do drużyny, każda drużyna do ligi, a każda liga do państwa. Delegat wiejskiego klubu upierał się, że żaden system nie może być prawowity, jeśli nie uznaje historycznych rywalizacji, tradycyjnych przyjaźni i świętego prawa do nienawidzenia sąsiedniej miejscowości z powodów, których nikt już nie pamięta.\n- Czy to oznacza zastąpienie gmin okręgami klubowymi? - zapytał jeden z trenerów.\n- Tylko tam, gdzie gminie brakuje należytego ducha klubowego - odparł delegat Związku.\n- A kto ma o tym decydować? - dopytał przedstawiciel. Delegat wskazał piłkę.\n\nNikt nie zaprotestował. Nieobecność Brzęczka była wyraźnie odczuwalna. Jak zwykle pozostawiono kierownictwu średniego szczebla, żeby samo wszystko rozgryzło. Trener młodzieżówki podniósł rękę i zapytał, kto zapłaci za piłki. Ktoś z wydziału gospodarki zaczął obliczać, czy kiełbasę sprzedawaną w dniu meczu można zaklasyfikować jako produkcję strategiczną. Były zawodnik zaproponował, aby wszystkie spory między urzędami rozstrzygać seriami rzutów karnych. Pewien urzędnik zapisał ten pomysł, zawahał się i dopisał: \"Wymaga dalszej analizy prawnej\".\nDebata trwała godzinami. Klubizm opisywano jako filozofię, strukturę społeczną, metodę administracji, program rozwoju młodzieży, rewolucję moralną, a jeden szczególnie zmęczony urzędnik zdefiniował go jako \"cokolwiek, co powstrzyma ultrasów przed ponownym spaleniem urzędu skarbowego\". Na długą chwilę sala pogrążyła się w ciszy.\nKlubizm dobrze wyglądał. Dobrze brzmiał. Logo było dobre. Hasła były dobre. Wykresy były kolorowe, przemówienia pewne siebie, a piłka na środku stołu nadawała całemu przedsięwzięciu poczucie dziejowego przeznaczenia. System złożony z tylu dobrze prezentujących się elementów z pewnością nie wymagał obszerniejszych wyjaśnień.\nPo dwóch długich godzinach Tomasz Mazurkiewicz, asystent trenera Olimpii Truskolasy, który przez całe zebranie milczał, nagle podniósł się z krzesła. Sala ucichła, zanim zdążył podejść do piłki. Położył na niej dłoń.\n- Panowie... to po prostu działa. Zaakceptujcie to. Róbcie, co do was należy, zgodnie z otrzymanymi instrukcjami. Macie notatki od Naczelnego Trenera. Powinny wystarczyć do rozstrzygnięcia każdej sprawy. Liczymy na was. Powodzenia."
buzzer.7.a: "CZYLI CO TO WŁAŚCIWIE ZNACZY?"

buzzer.8.t: "Oficjalna deklaracja"
buzzer.8.desc: "- Dlaczego to nie Domagalik została wybrana do wyprawy na terytorium wroga? - To pytanie nieustannie krążyło po głowie biegnącej wysłanniczki Darii Szpak, gdy przemierzała Truskolasy i inne okoliczne lasy, których nikomu nie chciało się nawet nazywać. Znała odpowiedź. Choć Domagalik była bardziej szanowaną dyplomatką, zarząd wiedział, że dumni komandosi - pozostałość oficjalnych sił zbrojnych nieistniejącej już III Rzeczypospolitej - mogą zlekceważyć każdego przedstawiciela Związku Klubów. Ktokolwiek tam pójdzie, może zawisnąć jako zdrajca i bandyta, a Dońską uznano za łatwiejszą do poświęcenia. Oznaczało to również dość skromną eskortę: cztery osoby uzbrojone w kije bejsbolowe i wiatrówki. Wszyscy szli pieszo, a zgodnie z duchem Klubu do Lublińca mieli dotrzeć truchtem.\n\nGranice kontrolowane przez JWK powinny być już blisko. Gdzie jednak byli strażnicy? W ćwierć sekundy komandosi z Lublińca pospadali z drzew i wyskoczyli z krzaków, mierząc z karabinów do biegnącej delegacji.\n- Eee... zaprowadźcie nas do swoich przywódców.\n\nGenerał Kukuła czekał na delegację w nijakim, białym pomieszczeniu bazy wojskowej w Lublińcu, otoczony najwyższymi rangą doradcami, na jakich mógł liczyć.\n- Panno Szpak - Kukuła wyglądał tak, jakby to on właśnie wyszedł z lasu - zwiadowcy poinformowali mnie, że przybyła pani z Truskolasów. Czemu zawdzięczam przyjemność tego spotkania? Mam nadzieję, że nie chodzi o rozpoczęcie ataku na nas?\n- Właściwie... - głos Szpak zdradzał zaskoczenie tym, jak wiele wiedzieli - chodzi właśnie o to. I o coś więcej.\n- Och? - Generał nie spodziewał się takiej bezpośredniości. Oficjalne wypowiedzenia wojny należały ostatnio do rzadkości. - Proszę mówić dalej.\n- Tak, żebyście wiedzieli, czego się spodziewać: nasza linia obrony jest niemal nie do przejścia, a zarazem pozostaje elastyczna. Obrońcy mogą w każdej chwili rozpocząć pressing i ograć pańskich ludzi na skrzydłach.\n\"O co jej chodzi?\", pomyślał Kukuła. Czy miało to być wypowiedzenie wojny? A może uciekła od Brzęczka albo była szpiegiem wysłanym, by szerzyć dezinformację? Głośno dodał: - A co najpotężniejszego możecie przeciw nam wystawić?\n- Och, prawdziwą bombę, panie generale!\nKukuła odwrócił głowę ku podwładnym i samym spojrzeniem zadał im nieme pytanie.\n\"Skąd oni, do diabła, mają bomby?\"\nPróbował zachować spokój.\n- Dziękuję, panno Szpak. Była pani niezwykle otwarta w przekazywaniu informacji.\n- Cóż, musieliście się tego dowiedzieć, żeby nasi i wasi chłopcy mogli się spotkać. - Kukuła uśmiechnął się na ten żart.\n- To będzie niesamowity mecz! - dodała wysłanniczka Truskolasów mrugając w całkowitym oszołomieniu."
buzzer.8.a: "- Mecz?!"

buzzer.9.t.w: "Olimpia Truskolasy [?BRZ_goals] : [?enemy_goals] Sparta Lubliniec"
buzzer.9.t: "Olimpia Truskolasy [?BRZ_goals] : [?enemy_goals] Sparta Lubliniec"
buzzer.9.desc.w: "Wiadomość z ostatniej chwili!\nW słoneczny dzień na Stadionie Sparty w Lublińcu zebrały się dwie drużyny. Związek Klubów wyraźnie pragnął rozegrać swój pierwszy mecz piłkarski z innym watażką na murawie godniejszej niż szkolne boisko w Truskolasach. W oczach zawodników widać było, jak bardzo chcieliby mieć taki stadion wraz z przylegającym do niego ośrodkiem treningowym na własność. Dzięki tym warunkom Sparta Lubliniec mogła czerpać korzyści z gry u siebie, w tym z dopingu przyjaznej publiczności. Nie wszyscy lubliniczanie pamiętali jednak, czym jest sportowe zachowanie. Nasi obecni na miejscu reporterzy przekazali, że kiedy zawodnicy Związku Klubów zmierzali na stadion, niektórzy mieszkańcy obrzucali ich śmieciami i nazywali zdrajcami, którzy powinni siedzieć w więzieniu. Stanowili jednak mniejszość, a spotkanie rozpoczęło się bez dalszych zakłóceń. Zgromadzeni na stadionie kibice obu drużyn zdawali się szczerze wierzyć, że napięcia między frakcjami można rozładować tu i teraz, a piłka okaże się najlepszym sposobem na ukierunkowanie najbardziej gwałtownych ludzkich instynktów.\nTuż przed meczem członkowie obu zespołów uścisnęli się, a Spartanie zaśpiewali klubową pieśń. Drużyna z Truskolasów nie miała ani własnej pieśni, ani żadnego zachowanego po niej śladu - czas zrobił swoje. Zespoły zmierzyły się wzrokiem. Po minucie oczekiwania gwizdek rozpoczął spotkanie.\nDzięki zawodowemu doświadczeniu i rewolucyjnemu treningowi drużyna z Truskolasów pokonała przeciwników, na wiele miesięcy wzmacniając dumę i pewność siebie mieszkańców oraz budując legitymację Związku Klubów jako organizacji piłkarskiej!"
buzzer.9.desc: "Wiadomość z ostatniej chwili!\nW słoneczny dzień na Stadionie Sparty w Lublińcu zebrały się dwie drużyny. Związek Klubów wyraźnie pragnął rozegrać swój pierwszy mecz piłkarski z innym watażką na murawie godniejszej niż szkolne boisko w Truskolasach. W oczach zawodników widać było, jak bardzo chcieliby mieć taki stadion wraz z przylegającym do niego ośrodkiem treningowym na własność. Dzięki tym warunkom Sparta Lubliniec mogła czerpać korzyści z gry u siebie, w tym z dopingu przyjaznej publiczności. Nie wszyscy lubliniczanie pamiętali jednak, czym jest sportowe zachowanie. Nasi obecni na miejscu reporterzy przekazali, że kiedy zawodnicy Związku Klubów zmierzali na stadion, niektórzy mieszkańcy obrzucali ich śmieciami i nazywali zdrajcami, którzy powinni siedzieć w więzieniu. Stanowili jednak mniejszość, a spotkanie rozpoczęło się bez dalszych zakłóceń. Zgromadzeni na stadionie kibice obu drużyn zdawali się szczerze wierzyć, że napięcia między frakcjami można rozładować tu i teraz, a piłka okaże się najlepszym sposobem na ukierunkowanie najbardziej gwałtownych ludzkich instynktów.\nTuż przed meczem członkowie obu zespołów uścisnęli się, a Spartanie zaśpiewali klubową pieśń. Drużyna z Truskolasów nie miała ani własnej pieśni, ani żadnego zachowanego po niej śladu - czas zrobił swoje. Zespoły zmierzyły się wzrokiem. Po minucie oczekiwania gwizdek rozpoczął spotkanie.\nMimo zawodowego doświadczenia Truskolasan i determinacji ich drużyny zawodnicy Sparty Lubliniec, dobrowolnie wsparci przez amatorskich piłkarzy spośród komandosów, wygrali spotkanie. Dla całej Olimpii Truskolasy był to fatalny początek. Skoro Brzęczek zawiódł jako trener już na tak wczesnym etapie, wielu zaczyna się zastanawiać, czy nie zawiedzie również jako przywódca państwa."
buzzer.9.a: "Bogowie z Olimpii!"
buzzer.9.b: "Jakimś cudem Spartanie pokonali Olimpijczyków!"

buzzer.10.t: "Lament sprzątacza" # TRUSKOLASY GÓRĄ
buzzer.10.desc: "Ostatnie minuty meczu. Wszyscy w barze wstrzymywali oddech, czekając na ostateczny wynik.\n- Biegnie z piłką w stronę bramki, obrońcy nie mogą nic zrobić! Strzela i GOOOOL! - podekscytowany głos komentatora rozległ się z telewizora.\n- GOOOOL! - wszyscy w barze wrzasnęli najgłośniej, jak potrafili. Po kilku minutach sędzia wreszcie zagwizdał po raz ostatni. ZWKT zwyciężył. Kibice wylegli z barów, domów i kin.\n- NIECH ŻYJE BRZĘCZEK! NIECH ŻYJĄ TRUSKOLASY! JEBAĆ PZPN! - krzyczeli wszyscy.\n\nMatki zamykały i zasłaniały okna, a marsze trwały dalej.\n\n- Mamo, co się dzieje? Dlaczego tata bije jakichś ludzi? - zapytało wyraźnie zdezorientowane dziecko, wyglądając przez okno.\n- Nie martw się, tata tylko bawi się z kolegami. A teraz idź spać, jutro musisz iść do szkoły - odpowiedziała nieco zaniepokojona matka.\n- Bawi się z kolegami? Mogę dołączyć?\n- NIE! Natychmiast idź spać, bo mama będzie bardzo zła.\n- No dobra, dobra - odparło dziecko z rezygnacją.\n\nTymczasem na ulicach nadal wrzało. Wszędzie leżały potłuczone butelki, a pijani chuligani wciąż krzyczeli \"JEBAĆ PZPN\" i niszczyli płoty, pomniki oraz znaki drogowe. Jeden z nich, trzymając flagę ZWKT, postanowił nawet wdrapać się na balkon.\n- NIECH ŻYJE BRZĘCZEK, ODNOWICIEL POLSKIEJ PIŁKI! - wrzasnął, wymachując flagą. Po chwili spadł z balkonu, lecz szybko się podniósł i dalej machał oraz krzyczał. Ulice uspokoiły się dopiero następnego dnia, choć nadal wyglądały, jakby wybuchła na nich bomba. Wszędzie spali kibole, a ziemię pokrywały flagi, puste butelki i niewybuchłe koktajle Mołotowa. Jeden z rządowych sprzątaczy tylko westchnął i wyciągnął miotłę ze swojego samochodu.\n\n- Ech... - pomyślał."
buzzer.10.a: "- Sprzątanie tego zajmie mnóstwo czasu."

buzzer.11.t: "Jak mogło do tego dojść?"
buzzer.11.desc: "...To pytanie odbijało się echem w głowach Olimpijczyków siedzących w szatni.\n- Mieliście każdą możliwą przewagę! - Brzęczek rozpoczął tyradę skierowaną do zawodników. - Ćwiczyliśmy na ten dzień całymi miesiącami, odkąd tylko wróciłem do Truskolasów. I co dostaję w zamian za swoje wysiłki? Partacką grę i porażkę? Czy nie wyraziłem się dość jasno, że to może być mecz waszego... naszego życia? Mecz, który tchnie nowe życie w polską piłkę i polski naród!\n- Trenerze... - powiedział cicho obrońca Kaźmierczak. - Widział pan niektórych z tych ludzi? Byli o głowę wyżsi od nas, a jakimś cudem również szybsi. Ciężko trenujemy, ale nie możemy rywalizować z wyszkoleniem wojskowym!\n- Gówno prawda! - Nikt nigdy nie słyszał w głosie Brzęczka tyle gniewu. - Chcecie poznać sekret? Lubliniec dowiedział się o meczu dopiero dwa tygodnie temu. Dwa tygodnie! Wystarczyły im dwa tygodnie, żeby pokonać efekt waszej wielomiesięcznej pracy. Brzęczek sądził, że podąża właściwą drogą, ale teraz zaczynał tracić nadzieję. Chciał wrócić do domu. Tyle że już był w domu. Zaczynał od zera i nie mógł iść nigdzie poza naprzód. Wziął głęboki oddech i poprawił apaszkę.\n- Panowie, w następnym meczu musicie spisać się lepiej - powrócił do zwykłego, spokojniejszego tonu. - Jak możecie się domyślić, wasi kibice są wściekli i właśnie zbierają siły, by zemścić się za waszą porażkę. Błagam, abyście następnym razem dali z siebie absolutnie wszystko, dzięki czemu unikniemy równie nieprzyjemnych reakcji. Oczekuję was w przyszłym tygodniu na odprawie taktycznej, podczas której zajmiemy się waszymi brakami. - Na swoją szansę po ostatnim haniebnym zwolnieniu czekał ponad sześć lat. Mógł poczekać dłużej. Opuścił szatnię ku wielkiemu zdumieniu zawodników.\n- Mówił prawdę? - ponownie odezwał się Kaźmierczak.\n- No... tak. To kibole umocnili jego pozycję polityczną - wyjaśnił pomocnik Malinowski.\n- Czyli naprawdę ruszą na Lubliniec z naszego powodu? - w głosie Kaźmierczaka pobrzmiewał szczery niepokój skalą ich porażki.\n- Nie bądź głupi - napastnik Chmielewski pacnął kolegę w głowę. - Brzęczek zebrał w swojej ekipie najbardziej brutalnych zabijaków, a potem pokazał im jak pachnie władza. Ruszyliby na Lubliniec bez względu na to, czy wygraliśmy. Po prostu próbował wzbudzić w nas poczucie winy.\n- To dlaczego nie powiedziałeś mu tego prosto w twarz? - zapytał Malinowski, patrząc kolegom w oczy. Cała drużyna czekała na odpowiedź.\n- Nie ma sensu kłócić się ze starym, zwłaszcza..."
buzzer.11.a: "...że naprawdę daliśmy dupy"

buzzer.12.t: "Sparta, Sparta! Chuja warta!"
buzzer.12.desc: "Autobus z Truskolasów wypełniał harmider. Śpiew mieszał się z opowieściami zwiadowców z dziczy i głośnymi rozmowami. Niektórzy już zaczęli pić i zajadać przekąski, jakby najazd dawno się skończył. Inni prężyli mięśnie podczas siłowania na rękę albo zwyczajnie popisywali się przed chichoczącymi dziewczynami. Zdawało się, że najmniejszy ruch choćby najdrobniejszego mięśnia zmusza pasażerów do ryku, plucia i przeklinania najgłośniej, jak potrafili - jakby chcieli zburzyć Lubliniec samymi falami dźwiękowymi.\nAby ich uciszyć, wystarczyło, że Kosa wstał.\n- Ej! - Wszystkie oczy, zdradzające różny stopień upojenia, zwróciły się ku niemu. Ludzie przestali pić, jeść i macać się nawzajem, oddając głos przywódcy. Kosa przez chwilę rozkoszował się ciszą, po czym przemówił: - Wszyscy wiemy, po co tu jesteśmy. Pokażemy tym skurwysynom z Lublińca, że z kibicami Olimpii się nie zadziera! Zatrzymujemy się, wysiadamy i wpierdalamy każdemu, kogo zobaczymy. Proste. Ale nie bądźcie zbyt pewni siebie. Nie jesteście najlepsi. Najlepsi wyruszyli prawie tydzień temu i przygotowują dla nas teren. Jakieś pytania?\n- T-tak - Kiełbasa wyraźnie przesadził z alkoholem. - Wpierdalamy im dlatego, że my wygraliśmy, czy dlatego, że oni wygrali? Nie pamiętam, heh.\nKosa powoli podszedł i dobrze mu się przyjrzał. Podniósł butelkę piwa, której Kiełbasa nie zdążył jeszcze opróżnić, wyrzucił ją przez okno i zaczął bezlitośnie okładać pijanego mężczyznę. Gdy skończył, odwrócił się do pozostałych.\n- Jakieś pytania, które nie są kurwa głupie?\n\nZatrzymali się pod Herbami. Ich przybycie obwieściły koktajle Mołotowa rzucone w miejscowy posterunek policji. Funkcjonariusze musieli wyjść z budynku i się poddać, by nie spłonąć wraz z nim. Wszystko przebiegało zgodnie z planem Kosy, pozostawiając przedpole Lublińca gotowe do zajęcia przez główne siły ZWKT.\n- Ani kroku dalej!\nCóż. Prawie wszystko. Samotny, w pełni wyposażony komandos mierzył do grupy kiboli z karabinu.\n- Mieli być na froncie! - krzyknął ktoś z tłumu.\nPozbawieni porządnej broni dystansowej najeźdźcy podnieśli ręce - wszyscy poza Kosą. Zrobił krok naprzód.\n- Powiedziałem: stać! - powtórzył żołnierz.\nKosa wiedział, że bez względu na to, czy się podda, najazd na Herby zakończy się porażką. Chyba że...\n- Do ciebie, kurwa, mówię! - Mężczyzna wymierzył karabin prosto w Kosę, gdy chuligan zrobił drugi krok. Nadal jednak nie padł strzał ostrzegawczy. Przy trzecim kroku do Kosy dołączyli stojący najbliżej chuligani. Po czwartym stało się jasne, że karabin \"komandosa\" nie ma amunicji. Wtedy reszta ruszyła razem z nim. Marsz przeszedł w sprint. Na widok pędzącego ku niemu rozwścieczonego tłumu żołnierz uciekł z miasta.\nZa ten podstęp chuligani zburzyli miejscowe domy, infrastrukturę i przedsiębiorstwa, w tym lokalny kebab, który obrabowali, aby urządzić sobie zwycięską ucztę."
buzzer.12.a: "Jak przystało na prawdziwych patriotów"

buzzer.13.t: "Wróg wewnętrzny"
buzzer.13.desc: "To miał być zwyczajny dzień. Przed porannym treningiem Olimpii Truskolasy jeden z obiecujących zawodników klubu poszedł do miejscowej Biedronki po jogurt. Tam, zgodnie z tradycją, natrafił na mur obronny przewyższający nawet największe autobusy parkowane na boisku. Próbował przedrzeć się między przeszkodami. Niestety potknął się o drewnianą paletę pozostawioną przy wejściu służbowym supermarketu i skręcił kostkę. Prawdziwy horror zaczął się jednak dopiero w gabinecie klubowego lekarza. Uraz był na tyle poważny, że zawodnika wykreślono ze składu. W innym kraju sprawa mogłaby się skończyć skargą, formularzem odszkodowawczym i być może gniewnym telefonem do kierownika sklepu. Nie tutaj. Nie tam, gdzie każdy zawodnik jest lokalnym skarbem i bohaterem.\nW ciągu kilku godzin od komunikatu klubu media opublikowały reportaż łączący incydent z szerszym zjawiskiem zaniedbań wymierzonych w piłkę nożną. Jak przekonywano, paleta nie została po prostu źle odłożona. Świadomie pozwolono, by znalazła się na drodze reprezentanta. Co gorsza, supermarket należał do Biedronki - sieci handlowej w portugalskich rękach, już wcześniej kojarzonej przez opinię publiczną z zagraniczną korupcją, przecenionymi pokusami i długotrwałym rozkładem polskiej dyscypliny sportowej.\nPoczątkujący dziennikarz spróbował zapytać rzecznika klubu, czy źle odłożoną paletę naprawdę można uznać za wrogie działanie.\n- Zawodnik miał na sobie barwy Olimpii.\n- Oczywiście - odparł dziennikarz.\n- Został kontuzjowany przed treningiem.\n- Tak, ale...\n- Przez infrastrukturę należącą do portugalskiego podmiotu handlowego.\nDziennikarz spojrzał na notatki i po cichu skreślił słowo \"wypadek\".\n\nTo, co początkowo wydawało się drobnym urazem, stanęło teraz przed narodem jako dowód głębszej prawdy: wrogowie futbolu nie zawsze nosili korki. Niektórzy nosili identyfikatory, inni wykładali do zamrażarek dorsza, a jeszcze inni zostawiali drewniane palety tam, gdzie mogła stanąć przyszłość polskiej piłki. Związek nie musiał wydawać żadnych rozkazów. Gazety zrobiły to za niego. Radio powiedziało to głośniej. Wieczorem klubowe bojówki i ultrasi rozpoczęli skoordynowane najazdy na sklepy Biedronki w całym regionie. Przewracano regały, palono karty lojalnościowe, a niektórych pracowników wywlekano na ulicę, podczas gdy tłumy skandowały hasła przeciwko Portugalii, kapitalizmowi i niebezpiecznym praktykom magazynowym.\nNa zapleczu jednego ze sklepów kasjer obserwował na monitorze ochrony, jak pierwsza grupa wchodzi do środka z szalikami zasłaniającymi twarze i transparentem \"ŻADNA PALETA NIE ZŁAMIE NARODU\". Powiedziano mu, że dzień będzie pracowity. Nikt nie uprzedził, że będzie historyczny. Opowieści o amerykańskich Czarnych Piątkach były niczym przy tym chaosie.\nNa zewnątrz ktoś podpalił stos ulotek promocyjnych. Inny mężczyzna zarekwirował skrzynkę bananów. I jabłek. A właściwie wszystkiego, czego nie przybito do podłogi. Z wyjątkiem palet. Kasjer słyszał, że niektóre markety rzeczywiście spłonęły, a ludzie naprawdę zostali ranni. Natychmiast przypomniały mu się opowieści o pogromach. Co, jeśli tutaj umrze? W płonącej trumnie pod witryną sklepu Biedronka?\n\nTo byłaby gówniana śmierć. A jednak napastnicy ani myśleli się wycofać."
buzzer.13.a: "Kwestia palety wymaga odpowiedzi!"

buzzer.14.t: "Drogi pamiętniczku"
buzzer.14.desc: "Własność Sary Krzeptowskiej:\n\n\"Poniedziałek\nUch, te reformy są najgorsze! Każdego dnia zaczynamy od co najmniej dwóch WF-ów. Szkoła już teraz jest trudna, a spróbujcie jeszcze słuchać nauczycieli, kiedy człowiek jest zmęczony i śmierdzi (oczywiście reforma planu nie przewiduje budowy pryszniców dla wszystkich). Wcześniej nie byłoby z tym problemu, bo trenerzy prawie nie zwracali uwagi na dziewczyny, ale teraz ciężko mają wszyscy. Nie byłoby jeszcze tak źle, gdybyśmy grały w siatkówkę, jak dawniej, kiedy nauczyciele sobie o nas przypomnieli. Przynajmniej mogłabym poprawić kondycję. Ale niespodzianka: teraz nawet dziewczyny muszą grać w piłkę nożną. Czyj to był pomysł? Nie chcę skończyć z grubymi nogami.\n\nWtorek\nDzisiaj na plastyce kazali nam zaprojektować własne logo klubu piłkarskiego. Urocze i w ogóle, ale czy nie jesteśmy na to trochę za starzy? Na następnej lekcji będzie też kartkówka z już istniejących herbów. No jasne, na większości jest nazwa, więc nie powinno być trudno. Trudno jednak oprzeć się wrażeniu, że wszystko zaplanowali w ostatniej chwili.\n\nŚroda\nPiłkarski wirus dopadł również matematykę i fizykę. Kazali nam nie korzystać z podręczników. Zamiast nich dostaliśmy skserowane karty pracy. Mieliśmy obliczać pola różnych rodzajów boisk, objętość piłek i, rzecz jasna, cholerną deltę toru strzału z rzutu karnego. Na fizyce to samo - liczyliśmy energię, prędkość, w tym prędkość kątową, oraz moment pędu najsłynniejszych goli, na przykład Maradony czy Carlosa. Ten motyw robi się trochę męczący.\n\nCzwartek\nNo dobra, plastyczka przerobiła herby, żeby nie dało się odczytać nazw drużyn. Suka. Oczywiście się tego nie spodziewałam, więc niczego się nie nauczyłam. Myślałam, że przynajmniej zdobędę punkt za rozpoznanie GKS-u Katowice, ale pomyliłam go z GKS-em Bełchatów. Trudno. Co mi szkodzi jeszcze jedna jedynka?\n\nPiątek\nPodobno mieliśmy też sprawdzian z historii piłki oraz zgód i kos między klubami. Najwyraźniej Raków Częstochowa nienawidzi wszystkich. Myszków też. Trudniej było wybrać, kogo lubią. Trafiły się łatwe punkty, jak ŁKS i Widzew, więc może dostanę dwójkę. Chyba że pani Piławicz postanowi ukarać mnie za nieznajomość relacji Olimpii Truskolasy. Ale szczerze wątpię, żeby ona albo ktokolwiek inny w ogóle je znał\"."
buzzer.14.a: "Dzięki Bogu, już weekend"

buzzer.15.t: "Najrozsądniejszy plan"
buzzer.15.desc: "Taktyka na mecz z Częstochową jest bardzo prosta i opiera się na tym, że jest tu ich bramka, więc przed nią wstawimy najlepszego napastnika, który w pojedynkę nastrzela kilka goli. A że na boisku musi pojawić się też reszta tej hołoty, to porozrzucam ich gdzie popadnie, pamiętając o tym, by ten z lewej strony cały czas biegł wzdłuż lewej linii i - ku zaskoczeniu rywali - by ten z prawej strony biegał wzdłuż linii prawej, tam i z powrotem, tak szybko, by zasłonić pole widzenia kibicom oraz telewizyjnym kamerom. Wszystko po to, abyśmy mogli wprowadzić w życie mój przebiegły plan wysłania na boisko dodatkowych reprezentantów i byśmy zamiast 11 grali 14, co sprawi, że nasi rywale szybko opadną z sił.\n\nI chociaż po zorientowaniu się, co tu jest grane, na chwilę zadziała ich mieszanka adrenaliny i wstrzykniętego przed meczem dopingu, to ta pozorna zwyżka formy będzie tylko preludium do ich rychłego końca zwieńczonego zgonem z odwodnienia. Moja genialna taktyka 14 graczy zbierze swoje żniwo. Choć oczywiście istnieje też realna szansa na to, że ofiary będą również po naszej stronie, gdyż nie wierzę, by Papszun powstrzymał się od wydania rozkazu rozstawionym na dachu snajperom likwidacji tych trzech ukradkiem wprowadzonych na boisko zawodników ZWKT.\n\nZ czego najmniejszą szansę na przeżycie ma oczywiście najwolniejszy lewy obrońca, który pewnie będzie gryzł jużtrawę, zanim zdecyduje się, którą drogę ucieczki wybrać i czy biec prosto, czy zygzakiem. Wtedy jednak z boków boiska wjadą nasze pojazdy, którymi będą mogli uciec wyselekcjonowani przeze mnie zawodnicy - w tym lewy obrońca, jeśli jeszcze będzie żył. W międzyczasie w naszej bramce, niezauważony przez nikogo bramkarz ukończy właśnie kopanie tunelu, którym ze stadionu będą mogli po meczu uciec pozostali reprezentanci nieprzewidziani do ucieczki pojazdem.\n\nI tak, gdy mecz dobiegnie końca, a ZWKT okaże się zwycięskie, pewnie poza lewym obrońcą i częściowo poza starym szrotem ze Słowacji - bo pół Polak to tylko pół zwycięzca - na doszczętnie zniszczonym placu gry pozostanie jedynie trójka sędziów patrzących z niedowierzaniem na pozostawiony na murawie las krzyży."
buzzer.15.a: "Więc... kto wygrał?"

buzzer.16.t: "Sprawa klubowa"
buzzer.16.desc: "Pierwsze szkolenie urzędników Związku Wolnych Klubów Truskolasów rozpoczęło się od prostej instrukcji: każdy klub należy traktować jednakowo. Zdanie to pozostało prawdziwe przez niemal dwanaście sekund. Prowadzący, blady mężczyzna z Ministerstwa Administracji i Terminarzy, odchrząknął i odwrócił się ku pierwszej planszy. Przedstawiała oficjalną hierarchię zarejestrowanych klubów, stowarzyszeń kibiców, akademii młodzieżowych, historycznych rywalizacji, tymczasowych sojuszy, ceremonialnych przyjaźni, kwestionowanych przyjaźni, dziedzicznych uraz oraz relacji określanych w podręczniku wyłącznie jako \"trudne\". Urzędnikom powiedziano, że zanim wejdą do jakiejkolwiek wsi, urzędu, szkoły, magazynu, stadionu, baru, kaplicy, na przystanek autobusowy czy prywatne wesele, powinni wiedzieć, które barwy można bezpiecznie nosić i jakie przyśpiewki mogą skrócić ich karierę.\n- Jeżeli miejscowy klub ma zgodę z Olimpią Truskolasy - wyjaśnił prowadzący - możecie działać ze standardową urzędniczą pewnością siebie. Jeżeli jest neutralny, zachowujcie uprzejmość. Jeżeli ma kosę z Olimpią, nie wchodźcie sami. Jeżeli twierdzi, że stoi ponad takimi konfliktami, załóżcie, że kłamie.\nUrzędnik w drugim rzędzie podniósł rękę.\n- A jeśli miejscowy klub twierdzi, że ma zgodę z Olimpią, lecz Olimpia nigdy jej nie potwierdziła?\nProwadzący otworzył podręcznik na następnej stronie.\n- Wtedy chwalicie ich entuzjazm, unikacie wszelkich obietnic i informujecie Ministerstwo przed zachodem słońca.\nInny urzędnik zapytał, co zrobić, jeżeli dwa kluby jednocześnie twierdzą, że są prawowitymi duchowymi spadkobiercami tej samej wiejskiej drużyny założonej przed Upadkiem.\n- Nie wspominajcie o ciągłości - odparł prowadzący. - Nie wspominajcie o dziedziczeniu. Nie wspominajcie o starym herbie. Jeżeli to możliwe, zaplanujcie spotkanie w budynku z kilkoma wyjściami.\nKtoś z tyłu zapytał, czy Olimpii przysługuje szczególny status prawny. Prowadzący poczuł się urażony. Oczywiście, że nie. Związek zbudowano na solidarności klubów, a nie na faworyzowaniu kogokolwiek. Żaden przepis nie stawiał Olimpii ponad innymi klubami. Żaden artykuł konstytucji nie nazywał jej sercem państwa. Żaden okólnik ministerialny nie oświadczał otwarcie, że zniewaga Olimpii jest zniewagą narodu, Naczelnego Trenera i samej piłki nożnej.\nNastępnie odwrócił się ku drugiej planszy, zatytułowanej \"Zalecane procedury awaryjne w sprawach dotyczących Olimpii Truskolasy\".\nW sali zapadła głęboka cisza. Plansza zawierała dwanaście kategorii oznaczonych kolorami, trzy symbole ostrzegawcze i osobny aneks poświęcony incydentom z szalikami. Wyjaśniała, kiedy salutować, kiedy wezwać ochronę, kiedy natychmiast rozpatrzyć dokumenty, a kiedy - w imię harmonii społecznej - udawać, że zostały już rozpatrzone. Jeden z akapitów zalecał urzędnikom, aby w żadnym zdaniu zawierającym słowo \"Olimpia\" nie używali wyrażenia \"zwykły klub\".\n- Czyli istnieją wyjątki? - zapytał urzędnik.\n- Absolutnie nie - odparł prowadzący. - To tradycje zakorzenione w naszym społeczeństwie i musimy je szanować.\nSzkolenie trwało sześć godzin. Pod koniec każdy urzędnik rozumiał podstawową zasadę administracji ZWKT: wszystkie kluby są braćmi, wszyscy bracia zasługują na szacunek, a niektórzy bracia wymagają natychmiastowego salutu, szybszego obiegu dokumentów i policyjnej eskorty."
buzzer.16.a: "W teorii wszystko pięknie, dopóki ktoś nie da ci w ryj."

buzzer.17.t: "Jezus obrońcą!"
buzzer.17.desc: "Ksiądz kanonik Adam Koszut stał przed drzwiami gabinetu Brzęczka, ściskając w jednej dłoni różaniec, a w drugiej list od Naczelnego Trenera. \"Pilne spotkanie w sprawie oczekiwań państwa wobec Kościoła\" - głosiła treść. Dla wszystkich było jasne, że Związek Klubów pragnie wypaczyć każdą instytucję zdolną mu się przeciwstawić i wypełnić ją lojalnymi osiłkami. Każdy wiedział, że seria wtargnięć w jakiś sposób dotknie także Kościół, szczególnie po upadku Częstochowy. Niewielu znało jednak skalę planowanej świeckiej integracji. Czy Brzęczek ośmieli się rozmontować całą strukturę i zbudować ją od nowa na własne podobieństwo? Nawet komuniści się na to nie odważyli! Bardziej prawdopodobne, że spróbuje skopiować sowieckie metody i będzie zabiegał o wyniesienie lojalnych księży na wysokie stanowiska kościelne. Podejście subtelniejsze, lecz równie zabójcze dla Mistycznego Ciała Chrystusa. Mimo lęku przed spotkaniem ojciec Adam cieszył się, że po wysłuchaniu Brzęczka sytuacja stanie się jaśniejsza, ponieważ dotychczasowa niepewność niszczyła jedność hierarchów. Pozostali duchowni podejrzewali o szpiegostwo każdego księdza, który odważył się w wolnym czasie grać z dziećmi w piłkę - nawet jeśli robił to przez całe życie! Teraz przynajmniej mogli otrzymać szansę właściwej oceny zagrożenia. Ta myśl dała mu dość wewnętrznej siły, by wejść do gabinetu.\nW środku Jerzy Brzęczek siedział za biurkiem i czekał na gościa.\n- Niech będzie pochwalony Jezus Chrystus. Proszę wybaczyć bezpośredniość, ale czy możemy od razu przejść do rzeczy? Szczerze mówiąc, jestem bardzo zajęty.\n- Oczywiście. - Ksiądz przygotował się do negocjacji i ustalania, jakie prześladowania przyjdzie znosić świętej instytucji.\n- Co Wasza Ekscelencja powiedziałaby na mecz towarzyski? - Brzęczek obdarzył hierarchę ciepłym, szczerym uśmiechem, odsłaniając jasne i lekko rozstawione przednie zęby.\nKościół, próbując zdobyć przychylność Naczelnego Trenera, zgodził się w ramach próby wystawić własną reprezentację, złożoną z księży i ministrantów dekanatu kłobuckiego. Na przygotowania mieli dwa tygodnie. Gdy nadszedł dzień meczu i obie drużyny wyszły na boisko, tłum wiwatował, choć wszyscy zdawali sobie sprawę z niezwykłości sytuacji. Wielu nie potrafiło zdecydować, czy większą lojalność winni piłce i ojczyźnie, czy Kościołowi. Dlatego większość nie przyniosła kolorowych koszulek, szalików ani niczego, co wskazywałoby, komu kibicuje. Najbardziej widoczne były wizerunki świętego Alojzego Scrosoppiego - patrona piłkarzy. Stały się symbolem prawdziwego cudu: trybuny zjednoczyły się w świętowaniu sportu, wolne od plemiennej lojalności wobec poszczególnych drużyn.\nKsiądz-kapitan zebrał kolegów ubranych w granatowo-ciemnoczerwone stroje symbolizujące diecezję częstochowską, aby po raz ostatni omówić plan pokonania Olimpii Truskolasy.\n- Dobra, pamiętajcie, że tym razem \"obrona Częstochowy\" nie może być przełamana! - Wyciągnął rękę do środka, aby pozostali dołożyli dłonie.\n\nMecz się rozpoczął. Olimpijczycy próbowali nacierać, lecz drużyna kościelna skupiła się na obronie i nie pozwalała im posuwać się naprzód. Dezorientacja kibiców udzieliła się także zawodnikom. Wielu przywykło przed spotkaniem modlić się do Boga o zwycięstwo. Teraz, gdy rywalizowali z księżmi, agresywne zagrania wydawały się... niewłaściwe. Kościelni hierarchowie nawet nie próbowali wyjść na połowę przeciwnika.\nOstatecznie taktyka \"obrony Częstochowy\" okazała się godna swojej nazwy. Oblężenie ciągnęło się, aż napastnicy opadli z sił i odeszli z poczuciem zmęczenia."
buzzer.17.a: "Politycznie bezpieczny wynik"

buzzer.18.t: "Ballon d'Cuivre"
buzzer.18.desc: "Córka sołtysa Truskolasów będzie dziś płakać. Jedyne miejsce choć w przybliżeniu odpowiednie na wesele córki pomniejszego notabla, wychowanej w przekonaniu, że przed Upadkiem była księżniczką - miejscowy dworek folwarczny - nie jest dostępne. Będzie musiała zadowolić się piknikiem pod namiotem i romantyczną podróżą poślubną nad jeziorem na świeżym powietrzu. Dworek gości bowiem galę Miedzianej Piłki Truskolasów która ma podwójny cel. To tutaj miejscowi reprezentanci i miłośnicy futbolu, dysponujący dostatecznie hojnym darem dla gospodarza, mogą głosować na najlepszą drużynę, najlepszego zawodnika i całą resztę. Jest to również święto podbojów Truskolasów oraz ich awansu z prowincjonalnego związku piłkarskiego, którego ultrasi są bardziej odurzeni wizjami wielkości niż kiedykolwiek, a kierownictwo ma większe urojenia na punkcie własnego znaczenia niż wielu konkurentów. Dzięki temu triumfowi urojenie staje się odrobinę bardziej realne. Dworek wypełniały łupy wojenne: sztandary wrogich pułków, osmalone kosze na śmieci używane jako armaty, szaliki drużyn rywali zdobyte zarówno na boisku, jak i na polu bitwy, a najdziwniejszy ze wszystkiego był zamknięty w klatce \"naprawdę fajny bóbr\" z tabliczką ostrzegającą, że gryzie.\n\nJeśli chodzi o samą piłkę, zapewne było jasne, kto ją dostanie. Olimpia pozostawała nieuniknionym faworytem tego podwórkowego plebiscytu Ballon d'Or, rozgrywanego w miejscu o niemal odpowiednich ścianach. Dworek mieścił niespełna pięćdziesięciu gości, a przyjął około siedemdziesięciu, zaś sama nagroda wciąż była gorąca po wyjęciu z miejscowej kuźni. Sołtys łaskawie podarował swój miedziany kocioł, który pod młotem starego kowala przemienił się w coś przypominającego piłkę. Ozdoby zostały wykrzywione i zdeformowane, lecz determinacja, którą symbolizowała, nigdy nie była silniejsza.\n\nBrzęczek nie miał wątpliwości, że to krok ku wielkości - choć sposób organizacji czynił z niego raczej potknięcie. Tak zwana Ballon d'Cuivre miała stanowić odpowiedź na prawdziwą francuską nagrodę, tyle że zamiast znakomitości światowego futbolu zgromadziła siedemdziesięciu pijaków i wiejskich pochlebców. Była świętem zarówno podboju wojskowego, jak i piłki: śmieci oraz bobry pełniły funkcję łupów symbolizujących wzlot państwa, a miedziane paskudztwo udające piłkę miało wyrażać oddanie sportowi, choć próba kopnięcia zapewne rozcięłaby stopę. Ale co z tego? Umysł Brzęczka i ogólnonarodowy kompleks niższości były stworzone do tej farsy. Truskolasy wyrosły przecież z niczego - z podwórkowej piłki i ligi powiatowej.\n\nA teraz, nawet otoczone śmieciami, ośmielają się marzyć o samych szczytach sportu. Oddały piłce wszystko. Funkcjonują jako państwo, mają podatki i siły zbrojne - czego nie osiągnął wcześniej żaden klub piłkarski. Są czymś naprawdę nowym. Owszem, istnieli sceptycy, ludzie żyjący w plugawej przeszłości. Dla nich przygotowano jednak wystarczająco dużo wódki wypędzonej z ostatnich zbiorów ziemniaków. Jeżeli w winie tkwi prawda, w wódce znajdują się wyparcie i tłumienie - a to nawet lepiej."
buzzer.18.a: "A zwycięzcą zostaje... Olimpia Truskolasy!"

buzzer.19.t: "Olimpia Truskolasy do utraty tchu!"
buzzer.19.desc: "Mimo nieustannej groźby wojny, zerwanych szlaków zaopatrzeniowych i wszechobecnej biedy dzisiejszy dzień był zupełnie inny. Po raz pierwszy od wielu miesięcy mieszkańcy Truskolasów postanowili odsunąć na bok chaos upadłego kraju. Zebrali się wokół miejscowego stadionu na wspólnym pikniku i dożynkach, próbując choć przez jedno popołudnie zapomnieć o nędzy. Tuż obok żwirowego parkingu wyrósł ogromny, prowizoryczny pchli targ. Ludzie wymieniali stare części samochodowe, targowali się o używane zimowe płaszcze i sprzedawali domowe jedzenie przyrządzone z nielicznych racji, które zdołali zebrać. Powietrze wypełniał zapach grillowanych kiełbas i taniego piwa z miejscowego browaru. Szczerze mówiąc, przypominało to dawne czasy, zanim wszystko się rozpadło.\n\nNajwiększym zaskoczeniem całego festynu był tłum. Pojawili się nawet najbardziej radykalni ultrasi, lecz nie mieli broni i nie szukali zaczepki. Zamiast tego przyprowadzili żony, dziewczyny i dzieci. Ci sami agresywni faceci, którzy zazwyczaj całymi nocami malowali po betonowych ścianach, prowadzili czarnorynkowe przekręty i toczyli brutalne wojny o terytorium z sąsiednimi wsiami, siedzieli teraz spokojnie na zużytych drewnianych ławkach. Śmiali się, dzielili jedzeniem i patrzyli, jak ich maluchy biegają po trawie w za dużych, dziecięcych strojach Olimpii Truskolasy. Na kilka godzin plemienna nienawiść i chuligaństwo całkowicie zniknęły, zastąpione szczerym, przyjemnym poczuciem rodzinnej wspólnoty.\n\nStojąc przy skraju boiska, Brzęczek obserwował tę scenę. Była to surowa, piękna strona lokalnego klubizmu, której skorumpowane skurwysyny z Warszawy nigdy nie potrafiłyby zrozumieć. W rozbitym kraju, gdzie rząd zawiódł, gospodarka się rozpadła, a społeczeństwo zostało całkowicie rozdarte, klub piłkarski był jedyną pozostałą rzeczą, która naprawdę mogła jednoczyć zwyczajnych ludzi. Olimpia Truskolasy nie była już tylko eksperymentem taktycznym ani narzędziem władzy. Stała się żywym, bijącym sercem całej społeczności.\n\nWidząc stadion pełen rodzin, które nadal znajdowały powód do uśmiechu, Naczelny Trener zrozumiał, że jego praca naprawdę coś znaczy. Klub dawał tym ludziom poczucie celu i prawdziwy powód, by dalej walczyć. Dopóki ten uparty, lokalny duch wspólnoty żył i pozostawał związany barwami koszulki, Brzęczek wiedział, że jego drużyna ma szansę. Zdołał przechytrzyć elity i tutaj, pośrodku niczego, wreszcie budował coś, co mogło ponownie uczynić polski futbol wielkim."
buzzer.19.a: "Poczucie jedności w rozbitym państwie."

buzzer.20.t: "Dom nie do poznania"
buzzer.20.desc: "Gdy przysłano dotacje na rozwój, prezes Miłecki z małego lokalnego klubu Orły Kusięta trzykrotnie czytał podaną kwotę, po czym zapytał skarbnika, czy Ministerstwo się nie pomyliło. Ich \"stadion\" składał się z jednego nierównego boiska, dwóch rdzewiejących bramek, szopy na sprzęt i słynnej trybuny zachodniej, która z prawnego punktu widzenia była drewnianą ławką ustawioną przy linii bocznej. Przez lata wiernie służyła społeczności, choć tylko dlatego, że społeczność nigdy wiele od niej nie wymagała. Teraz, zgodnie z dokumentami ze stolicy, klub miał zmodernizować infrastrukturę, zwiększyć pojemność podczas meczów, poprawić warunki treningowe i przygotować się na nową erę narodowego futbolu.\n\nPrezes zrobił to, co zrobiłby każdy odpowiedzialny urzędnik. Pojechał do OBI. Pozbawiony ciągłości dostaw market znajdował się w dość opłakanym stanie, ale miał specjalnie dofinansowany \"dział piłkarski\". Wieczorem w pierwszym sprawozdaniu z wydatków widniały beton, farba, reflektory, sześćset plastikowych krzesełek, cztery tablice taktyczne, uroczysta chorągiewka narożna, trzy przemysłowe grille, podejrzana ilość butelkowanej \"wody\" oraz coś opisanego wyłącznie jako \"sprzęt do tworzenia atmosfery stadionowej\". Zapytany, dlaczego klub kupił dmuchaną bramę, prezes wyjaśnił, że każdy poważny stadion potrzebuje wejścia. Zapytany, po co kupił dwie, odparł, że drużyna gości też musi którędyś wejść.\nSkarbnik zaprotestował tylko raz.\n- Czy naprawdę potrzebujemy sześciuset krzesełek? - zapytał. Prezes spojrzał przez okno na starą drewnianą ławkę.\n- Oczywiście, musimy wyglądać ambitnie! Co pomyślą w stolicy? Że jesteśmy jakimiś wieśniakami, którzy nie potrafią zorganizować porządnego wydarzenia piłkarskiego?\n\nW następnym tygodniu przyjechała kontrola z Ministerstwa Infrastruktury i Przygotowania Meczowego. Urzędnicy zastali prezesa stojącego dumnie obok sterty nierozpakowanych materiałów, wykopanego do połowy rowu melioracyjnego oraz starej drewnianej ławki, oznaczonej teraz papierową tabliczką \"Tymczasowa Trybuna Zachodnia\". Za jego plecami dwóch ochotników próbowało zmontować reflektor, korzystając z instrukcji napisanej w czterech językach, z których żaden nie był polskim.\n- Gdzie jest nowa trybuna? - zapytał inspektor. Prezes wskazał plastikowe krzesełka.\n- Obecnie... w pozycji luźnej!\n- Pan też, widzę. A system odprowadzania wody?\nPrezes wskazał rów.\n- W bud-*hik*-owie. Właśnie... odwadniamy się. Tak.\nInspektorzy przez kilka minut robili notatki. Odwadniacie się przez ilość alkoholu w waszych ciałach, chciałoby się powiedzieć. Ale czego mogli oczekiwać? Nawet pomijając to, raport nie był całkowicie negatywny. Klub nie zbudował stadionu, ale wyraźnie zaczął wierzyć, że go posiada. Miał plan, kilka faktur, uroczystą chorągiewkę narożną i dość butelkowanej \"wody\", by przetrwać oblężenie. W ZWKT to już był postęp.\n\nPod koniec następnego tygodnia Ministerstwo zatwierdziło kolejny etap rozwoju, pod warunkiem że wszystkie dmuchane bramy zostaną należycie udokumentowane, a dodatkowa \"woda\" nie będzie kupowana bez uzasadnienia taktycznego."
buzzer.20.a: "Oby nigdy nie awansowali - dodatkowe wymogi by ich zabiły."

buzzer.21.t: "Niezbyt złote piłki"
buzzer.21.desc: "Minister Dawid Błaszczykowski spodziewał się trudnego spotkania. Niełatwo zrobić coś z niczego. Pytanie postawione przed Ministerstwem Gospodarki było jednak dostatecznie proste: co właściwie ZWKT mógł eksportować? Pierwsza lista okazała się żenująco krótka. Dostawy zboża były niepewne, przemysł pozostawał słabo rozwinięty, a większość warsztatów zdolnych wyprodukować cokolwiek bardziej zaawansowanego niż gwizdek została już przejęta przez kluby, bojówki albo lokalne komitety stadionowe. Przez kilka minut urzędnicy siedzieli w ciszy, wpatrując się w pustą księgę zatytułowaną \"Strategiczny eksport Związku Wolnych Klubów Truskolas\".\n- Więc... stroje meczowe Olimpii? - zaproponował ktoś z końca sali. Błaszczykowski potarł skronie, ale nie przerwał. Gospodarka musiała od czegoś zacząć, a najwyraźniej było to aż tak proste.\n\nKtoś wpisał na początku księgi \"koszulki\". Potem pojawiły się szaliki, klubowe przypinki, plakaty meczowe, kukły sędziów, karty kolekcjonerskie, markowe notesy, znaczki pocztowe z twarzami miejscowych napastników i limitowane gwizdki. Wszystko, na czym dało się walnąć klubowe logo. Jeden z asystentów zaproponował klubowe hymny i przyśpiewki na płytach, dowodząc, że odpowiednio spieniężona nostalgia może uchodzić za zasób odnawialny.\nLista rosła. Miniaturowe bramki. Portrety Brzęczka. Zatwierdzone śpiewniki kibicowskie. Ziemia ze stadionu zamknięta w ozdobnych słoikach. Drewniane ławki reklamowane jako \"autentyczne doświadczenie siedzenia w niższej lidze\". Pewien urzędnik zaproponował sprzedaż kolekcjonerom fragmentów połamanych bramek. Inny wymyślił abonament dostarczający co miesiąc świeże oskarżenia pod adresem sędziów.\nPotem pojawiły się słodycze.\nZaraz, słodycze?\n\nZdenerwowany mężczyzna z Departamentu Żywienia Sportowców zaprezentował kilka tac żelków w kształcie korków piłkarskich, piłek, gwizdków oraz - po długiej chwili milczenia - kilku przedmiotów, które oficjalny protokół miał później określić wyłącznie jako \"niestosowne anatomicznie wyroby z żelatyny\".\n- Czy to naprawdę konieczne? - zapytał Błaszczykowski.\n- Konieczne? Nie - odparł mężczyzna. - A-ale... fabryka produkowała je na długo przed Upadkiem. I były cholernie dochodowe. J-ja... znaczy... jeśli... tego... pan...\n- Wszystko jedno. Dziękuję.\nPod koniec popołudnia pusta księga była pełna pomysłów. ZWKT może i nie posiadał ropy, stali, metali ziem rzadkich ani sprawnej, nowoczesnej bazy przemysłowej, lecz dysponował czymś znacznie groźniejszym: nieograniczoną zdolnością przerabiania piłki nożnej na towary. Każda rywalizacja mogła zostać produktem. Każda porażka - pamiątkowym kubkiem. Każdy skandal - limitowaną serią dostępną do przybycia prokuratora.\nBłaszczykowski zamknął teczkę, spojrzał na zgromadzonych urzędników i skinął głową.\n- Jeżeli świat nie kupi naszej gry - powiedział - przynajmniej kupi wszystko, co ją otacza."
buzzer.21.a: "Eksportujmy piękną grę. I brzydkie pamiątki."

buzzer.22.t: "Zgadza się, jesteśmy dziadami"
buzzer.22.desc: "Gdy obie drużyny wyszły na boisko, pięćdziesięcioośmioletnia Jadwiga Jadczak zastanawiała się, jakim cudem znalazła się na zielonej murawie, aby zarabiać na życie.\nNic w jej życiu nie zapowiadało takiego obrotu spraw. Monotonia urzędniczej kariery przetrwała przecież nawet największe dziejowe zawirowania. Nie było łatwo nawet w pozornie stabilnych czasach. Każde wybory mogły oznaczać czystkę w urzędach, bo czyjś siostrzeniec albo bratanica potrzebowali kariery i pieniędzy za nicnierobienie. Mimo to dzieci nepotyzmu potrzebowały kogoś, kto potrafił poruszać się w labiryncie paragrafów. Tym kimś była Jadwiga - uczciwa specjalistka znająca wszystkie tajniki biurokratycznego procesu. Najbardziej ceniono jej zdolność wypełnienia dokumentów tak, aby zdobyć każdą możliwą dotację państwową. Problem polegał na tym, że nowy reżim niezbyt lubił dokumenty.\nBrzęczek uznał za znakomity pomysł rozdzielanie środków między zakłady pracy na podstawie wyników ich pracowników w piłce nożnej. Jakby to nie było dostatecznie głupie, o dodatkowe fundusze mieli rywalizować ze sobą przedstawiciele różnych zawodów. Dlatego ona i koleżanki z urzędu miejskiego, przeważnie w jej wieku, musiały teraz stawić czoła umięśnionym młodym mężczyznom prosto z kopalni.\nMiała plan: agresywne natarcie w drugiej połowie, w którym linię ataku i pomoc utworzą najstarsze urzędniczki, podczas gdy Kuba, młody stażysta, zajmie się obroną. Niewystawienie najsprawniejszego zawodnika w ofensywie wzbudziło kilka wątpliwości, ale wszyscy wiedzieli, że nie należy kłócić się z Jadzią, gdy już coś sobie postanowiła.\n\nMecz się rozpoczął! Wszystko przebiegało zgodnie z przewidywaniami Jadwigi. Mimo przewagi fizycznej górnicy bali się wchodzić barkiem, żeby nie skrzywdzić starszych pań. Ich cierpliwość miała jednak granice, zwłaszcza gdy drużyna urzędu zbliżała się do bramki górników. Ale jeszcze nie nadszedł czas. Na razie koleżanki Jadzi miały skupić się na obronie, a Maria, bramkarka i zarazem najszersza z nich wszystkich, zdołała wyłapać dziwny strzał przeciwników.\nPora na uderzenie nadeszła pod koniec drugiej połowy. Zgodnie z planem najstarsze urzędniczki ruszyły na połowę górników, którzy zwolnili, starając się nie skrzywdzić słabowitych pracownic biurowych. Ich wahanie pozwoliło jednak jednej z napastniczek, Eufemii, wedrzeć się w pole karne. Urzędniczki pomyślały, że to ich szansa, i zasiały strach w sercach górników. Jeden z nich spanikował i spróbował wykonać wślizg.\nEufemia runęła na ziemię, krzycząc i ściskając nogę. Trudno było stwierdzić, czy rzeczywiście doszło do faulu, ale sędzia wiedział, jak źle wyglądałby brak kary dla drużyny, która skrzywdziła starszą panią. Podyktował więc rzut karny dla urzędu. Nadeszła pora Kuby, by zabłysnąć i być może zdobyć punkt - zamiast kontuzji podczas jakiejś hipotetycznej zwyczajnej akcji.\nBierze rozbieg. Uderza piłkę! Bramkarz rzuca się w lewo! A piłka szybuje w prawo!\n1:0 dla drużyny urzędników!"
buzzer.22.a: "Dziewczyny, dostaniemy nowe ekspresy do kawy!"

buzzer.23.t: "Katastrofy finansowe"
buzzer.23.desc: "- Dawaj, rura! - krzyknął Kamil łamiącym się głosem, obserwując, jak jego drużyna ponosi ogromne straty podczas meczu. Pochylał się tak blisko starego, migoczącego telewizora, że od szumu przechodziły go ciarki.\n\nKamil postawił na ten mecz i własną drużynę cały swój majątek. A ona przegrywała. Każdy skrawek waluty, awaryjne kupony żywnościowe rodziny i oszczędności zakopane pod deskami podłogi zależały od tej dziewięćdziesięciominutowej katastrofy rozgrywającej się na ekranie o niskiej rozdzielczości.\n\nŚledził każdą minutę, nie odrywając wzroku od telewizora, z walącym sercem. Każde złe podanie wywracało mu żołądek, a za każdym razem, gdy przeciwnik przekraczał linię środkową, Kamil ledwie mógł oddychać.\n\nOstatecznie jego drużyna przegrała. Po ostatnim, żałosnym błędzie obrony w doliczonym czasie przeciwnicy strzelili gola, a sędzia zagwizdał po raz ostatni.\n\nKamil był kompletnie zdruzgotany. Siedział w słabym świetle, otępiale wpatrzony w pomeczowy komentarz odbijający się echem od pustych ścian. Stracił całą fortunę, bo grupa leniwych, niezdyscyplinowanych zawodników nie potrafiła utrzymać linii przez jeszcze sześćdziesiąt sekund.\n\nCo teraz zrobi? Co? Jego dom i cała przyszłość rozpłynęły się w powietrzu przez jedno nieudane wybicie pokazane na ekranie telewizora. Cała rodzina jest zgubiona. On jest zgubiony.\n\nSzczerze mówiąc, któż mógł przypuszczać, że osobista gospodarka w całości oparta na zakładach bukmacherskich okaże się niestabilna? Desperacki hazard wybuchł mu prosto w twarz. Adrenalina opadła, pozostawiając jedynie przerażającą świadomość, że musi wyłączyć telewizor, spojrzeć rodzinie w oczy i wyjaśnić, że nie zostało im absolutnie nic."
buzzer.23.a: "Któż mógł przewidzieć, że to nie zadziała?"

buzzer.24.t: "Mnóstwo do zrobienia"
buzzer.24.desc: "Jerzy Brzęczek polecił położyć raporty na swoim biurku przed świtem. Nim pierwsze promienie słońca dotarły do okien gabinetu, stos bardziej przypominał formację geologiczną niż dokumentację. Ktoś próbował nawet uporządkować ją według pilności, ale po trzeciej teczce opatrzonej pieczęcią \"NATYCHMIAST\" system pogrążył się w szczerej rozpaczy.\nRemonty stadionów. Korupcja sędziów. Budżety klubów. Zaginiony sprzęt. Skargi na policję. Harmonogramy akademii młodzieżowych. Przemoc ultrasów. Normy treningowe. Trzy osobne petycje z żądaniem, aby w szkołach wyjaśniano zasadę spalonego. Jedna odręczna notatka pytała, czy Portugalię można ogłosić dziedzicznym wrogiem narodu. Och, interesujące, należy odłożyć ją na bok. Inna domagała się oficjalnego rozstrzygnięcia, czy porażka z zaprzyjaźnionym klubem liczy się jako przegrana, zdrada czy rozwój charakteru.\n\n- To wszystko? Tyle zdołało wyczarować nasze państwo? - zapytał Brzęczek z wyższością. Urzędnik stojący przy drzwiach spuścił wzrok na podkładkę do pisania. Był młody, zdenerwowany i już nosił wyraz twarzy człowieka, który zrozumiał, że administracja piłkarska postarza szybciej niż wojna.\n- To poranny stos, Naczelny Trenerze - odparł.\nBrzęczek nic nie powiedział. Sięgnął jedynie po pierwszą teczkę. To było najgorsze. Państwo się zmieniło. Zmieniło się bardziej, niż mógł oczekiwać. Dzieci trenowały teraz w zorganizowanych akademiach. Lokalne kluby stały się ośrodkami życia publicznego. Dawne lenistwo polskiej piłki nazwano, przeklęto i wywleczono na światło dzienne. Nawet słowo \"reprezentant\" znów zaczynało coś znaczyć. We wsiach, które wcześniej zgadzały się tylko co do tego, że sędzia jest ślepy, ludzie gromadzili się teraz na boiskach, remontowali szatnie, malowali ławki, zapamiętywali historię klubów i wykrzykiwali porady taktyczne chłopcom zbyt młodym, by rozumieć brzemię złożone na ich barkach.\n\nTego właśnie pragnął, a jednak te same problemy wracały na jego biurko w nowych koszulkach.\nChuligani nadal demolowali przystanki tramwajowe po przegranych derbach. Sędziowie wciąż znajdowali w kieszeniach tajemnicze koperty. Zawodnicy nadal wymyślali powody, by nie biegać, prezesi klubów nadal kradli, trenerzy wciąż traktowali krzyk jak zamiennik szkolenia, a każda reforma zdawała się rodzić dwie nowe komisje, trzy nowe wymówki i jeden nowy skandal z miejską dotacją. Na każde dziecko nauczone poprawnie podawać piłkę przypadało troje dorosłych, którzy na nowo odkrywali pradawną narodową sztukę obwiniania sędziego. Brzęczek wziął długopis i skreślił pierwszą pozycję na liście. Potem spojrzał na następną stronę. I kolejną. I kolejną.\n- Przynieść później popołudniowe raporty? - zapytał urzędnik. Gdzieś na zewnątrz chłopcy zaczynali już poranny trening. Gwizdek trenera raz za razem przecinał zimne powietrze, ostry niczym rozkaz. Piłka uderzyła w ścianę pod oknem, odbiła się, po czym została kopnięta ponownie. Brzęczek westchnął, przyciągnął kolejny raport i znów zabrał się do pracy.\n- Przynieś je przed obiadem."
buzzer.24.a: "Piłka toczy się pod górę."

buzzer.25.t: "Łysy diabeł"
buzzer.25.desc: "Olimpia Truskolasy do Prezesa FIFA!\nTy, prezesie, diable z Atlantydy albo innego miejsca, gdzie nigdy nie słyszano o piłce nożnej, przeklętego diabła bracie i towarzyszu oraz ludzi nazywających futbol \"soccerem\", sekretarzu generalny Partii Żarcia Gówna i Nazywania Go Zachętą. Cóż z ciebie za prezes, skoro nie potrafisz dać Amerykaninowi czerwonej kartki, żeby nie dostać zTRUMPowany prosto w dupę! Twoi sędziowie żrą gówno Arabów, a kiedy Chińczycy nauczą się grać w piłkę, zaczną żreć również chińskie.\nNie będziesz, skurwysynu, mówić Polakom, jak mają prowadzić swoją piłkę ani jak mają rządzić samym sobą. Grozisz wyrzuceniem nas z FIFA? Udajesz, że nigdy do niej nie należeliśmy? Ty kopaczu od koszykówki, brazylijska klątwo 7:1, boiskowa chupacabro - to nie ty nas wyrzucasz! To my odchodzimy! Jesteś błaznem dla każdego, kto kiedykolwiek usłyszał słowo \"uczciwość\". Wziąłbyś łapówkę od świniopasów Górnego i Dolnego Egiptu, czyścicieli latryn brytyjskiej rodziny królewskiej, mięśniaków chińskich triad, malwersantów, przy których nawet PZPN musiałby bardziej się postarać, oraz ich kobiet do towarzystwa. Twoi sędziowie zamieniają gole w spalone, a spalone w rzuty karne. I co z tego, że krzywią się na widok prawdziwych polskich drużyn? Ich oczy są na spalonym, ich siostry są braćmi, a wszyscy ruchają się nawzajem jak jedna wielka rodzina! Ich przemówienia i honoraria za występy trafiają w bramkę mniej więcej tak często jak strzały z lagi. Widzieliśmy więcej pokory nawet w Legii Warszawa! Odbierają zwycięstwo prawowitym drużynom, jak Epstein odbierał cukierki małym dziewczynkom, gdy już zdecydują, który zespół wpłacił dość, żebyście nadstawili drugi półdupek na jego faule i spalone!\nO tak Ci ultrasi z Olimpii odpowiadają, plugawcze. Nie dostaniecie nawet posady przy czyszczeniu kibli w klubie Iskra Stolec. Teraz kończymy. Daty nie znamy, bo znowu wyłączyli Starlinka, więc miesiąca wypatrujcie na niebie, a sezon w księgach zapisany, a dzień u nas taki jak i u was, za co możecie nas w dupę pocałować!"
buzzer.25.a: "Zadzwońcie po Ilję Riepina, powinien to namalować."

buzzer.26.t: "Ustawianie tabeli"
buzzer.26.desc: "- Spójrzcie na pierwsze trzy miejsca. I tak to, panowie, wygląda...\nOśmiu spośród najbardziej znamienitych prezesów ligowych klubów obradowało w pomieszczeniu, które przez kłęby dymu papierosowego i opary wódki z trudem dawało się rozpoznać jako sala konferencyjna w siedzibie Tęczy Błędów. Czasy mogły się zmieniać, a rządy wydawać nowe rozkazy, lecz korupcji na pewnych szczeblach nie dało się wykorzenić tak łatwo, jak sądził Brzęczek. Całe gadanie o oczyszczeniu gry docierało do zwyczajnych ludzi, podczas gdy w cieniu trwały te same stare przekręty. Każdy wiedział, że takie rzeczy się dzieją, ale jednocześnie nikt nie wiedział absolutnie nic - bo nigdy nie było dowodów.\n\n- Panowie! Musimy coś zrobić z tym chaosem! Nie możemy zostawić piłki na pastwę losu i pozwolić wilkom ze Związku rozszarpać jej na strzępy! Spółdzielnia to dopiero pierwszy krok. Częstochowa i Truskolasy mogą dziś kontrolować Związek, ale wkrótce odbędą się wybory do jego władz! Dołączcie do spółdzielni, a zagwarantuję wam utrzymanie w przyszłym sezonie oraz dodatkowe finansowanie - zaczął Kazimierz Woźnica, prezes Tęczy Błędów. Trudno było się dziwić. Ze wszystkich klubów ligi właśnie Tęcza była najbardziej zagrożona spadkiem i zamierzała ratować się wszelkimi sposobami.\n- Sam się utrzymam. Po jaką cholerę potrzebna mi jakaś pieprzona spółdzielnia? Doskonale poradzę sobie bez niej. A poza tym - Tęcza? Z całym szacunkiem, na miłość boską, mogliśmy wybrać lepszy klub! - narzekał prezes Przemszy Siewierz.\n- A jednak pan tu jest, panie Szałek. Tak, zwykle spółdzielnię zakłada mistrz. Ale tutaj nikt już nawet nie wie, kto jest kim. Raków ma nami przewodzić? Dobry żart. Raków jest częścią problemu. Panowie, pamiętajcie, skąd pochodzą sędziowie. Większość z Częstochowy. Wszystkie wasze kluby spadną, a Raków pójdzie po mistrza. Razem z Olimpią. I wtedy świat już nigdy nie usłyszy o waszych klubikach. Więc wchodzicie? Na początek dziesięć milionów.\n- Mam ci zapłacić dziesięć milionów? Za co właściwie? - zaprotestował prezes Sarmacji Będzin.\n- Spójrz na tabelę, przyjacielu. Pilica nie jest złą drużyną... Musi pokonać Wartę. Musi. A wtedy Sarmacja... oj, oj. Nie wiem. Druga liga to oczywiście super sprawa, ale trzecia też ciekawa.\n- Co ty, kurwa, znaczy \"musi\"? To jest sport!\n- Sport sportem, ale ktoś nadal musi tym wszystkim zarządzać. Nie udawaj przy mnie niewiniątka, Bolek! Doskonale wiesz, dlaczego tu jesteś, więc pytam wprost: robimy interesy i zrzucamy gigantów z podium czy nadal udajemy, że podoba nam się to, co robi z nami Związek?\n\nWódka stojąca na stole niewątpliwie miała trudny do opisania wpływ na zdolności decyzyjne zebranych prezesów. Ostatecznie każdy zgodził się przystąpić do Spółdzielni, która zamierzała ustawić tabelę ligową tak, by jej kluby zajęły dogodne pozycje. Jeżeli plan się powiedzie, Olimpia wkrótce znajdzie się w poważnych tarapatach.\n- Koledzy, zapiszemy dziś kolejny wspaniały rozdział w historii polskiej piłki! Cieszę się, że zdołaliśmy dojść do porozumienia."
buzzer.26.a: "A zatem - na zdrowie!"

buzzer.27.t: "Obustronny walkower"
buzzer.27.desc: "Właśnie tam, na murawie, sędzia Ryszard Karpat powoli zmierzał ku środkowi. Podczas meczu szedłby w to miejsce, aby takim samym ruchem rozpocząć spotkanie. Tym razem miał rozpocząć rozmowę z trenerem Szczakowianki Jaworzno. Zwykłą przyjacielską pogawędkę, jak obaj lubili robić to prywatnie: w prowizorycznych restauracjach nadających się do przeprowadzenia jednego czy dwóch interesów narkotykowych (w Polsce po Upadku było ich mnóstwo), w lasach, dyskretnych motelach - wszędzie, gdzie trudno byłoby ich śledzić. Temat: jutrzejszy mecz.\n\n- Dobry wieczór. - Trener skinął głową w stronę środka boiska, dokładnie tam, gdzie piłka spoczywa przed pierwszym gwizdkiem.\n- Murawa sucha. Jakby do podłoża dosypali mąki ziemniaczanej - odparł Ryszard.\n- Odrobina przewagi własnego boiska nikomu nie zaszkodzi. Tylko Szczakowianka potrafi grać na tak fatalnej nawierzchni - skontrował trener, zataczając nieregularne kręgi wokół środka niczym zawodnik próbujący w zwolnionym tempie zgubić pomocnika przeciwnika.\n- Cóż, spadanie w górę to wasza specjalność. W lepszych warunkach też potraficie wyrwać porażkę ze szczęk zwycięstwa. A nawet nie zaczynajmy rozmowy o tutejszych kiblach. Trzeba lać na poziomie eksperckim, żeby niczego nie złapać, a jeszcze płaci się za to w euro? Nic dziwnego, że opływacie w kasę. - Uszczypliwość Ryszarda była jak odebranie piłki, więc rozmowa odpowiednio przesunęła się na drugą połowę boiska.\n- Próbujesz coś powiedzieć? - Ruszyli dalej. Trener naciskał, choć kierunek rozmowy pozostał taki jak na początku. Zapadła już noc, a wyłączone reflektory zastępował księżyc w pełni.\n- Niczego nie próbuję powiedzieć. Pytam: jak z gotowością waszej drużyny? - Ryszard dociekał, zbliżając się coraz bardziej do pola karnego.\n- My... cóż, robimy, co możemy, ale... - wyjąkał trener.\n- Wczoraj graliście sparing z juniorami, prawda? Jak poszło? - Bramka była coraz bliżej, a Ryszard nie przestawał naciskać.\n- W pierwszej połowie 0:0... druga zakończyła się... - Trener spojrzał prosto w księżyc, jakby chciał natychmiast się na nim znaleźć.\n\n- Obustronnym walkowerem.\n\n- Nawet tutaj nikt nie zalicza obustronnego walkowera... - zachichotał Ryszard, stojąc kilkadziesiąt kroków na lewo od pola karnego.\n- Spokojnie. Nadal mamy mecz o wszystko, a potem mecz o honor. - Trener odzyskał pewność siebie, gdy na chwilę się zatrzymali. Podanie stąd do środka zakończyłoby się spalonym.\n- Jesteś pewien? Za stówę przymknę oko - zagrał Ryszard niczym zawodnik pewny, że jego podstęp umknie uwadze sędziego.\nTrener zmrużył oczy, jakby demonstrował sposób przymykania oka. Idąc dalej ku polu karnemu, wyciągnął banknot stuzłotowy.\n- Wszystkie gole gości w pierwszej połowie będą ze spalonego.\nRyszard zmrużył oczy jeszcze mocniej, żeby przy świetle księżyca przyjrzeć się banknotowi. Podszedł bliżej, prosto na punkt karny... po czym odsunął pieniądze i wyszeptał:"
buzzer.27.a: "- Miałem na myśli sto euro."

buzzer.28.t: "Ultrasi detektywi"
buzzer.28.desc: "Włoska willa, odrestaurowana najlepiej, jak potrafili robotnicy z Truskolasów z ogrodami, małym sadem i trzema tysiącami metrów kwadratowych wnętrza. Oto co daje praca sędziego w kraju owładniętym obsesją na punkcie piłki. Pomaga również fakt, że Upadek, cóż, doprowadził do upadku cen nieruchomości do tego stopnia, iż jedynym kosztem zamieszkania tutaj był remont.\n\nRyszard westchnął, wrócił do domu i rozłożył się na ogrodowym leżaku. Kolejny mecz, kolejny spalony, który mógł być prawidłowy albo nie, kolejny przeoczony faul - lub ukarany czerwoną kartką tam, gdzie wystarczyłaby żółta. Niektórzy mogliby podważać takie wypaczanie gry i obrazę sportowej uczciwości. Inni mogliby zakwestionować rozsądek człowieka zarabiającego na plugawieniu państwowej obsesji.\n\nCi, którzy rozumieją, wiedzą, że jeśli nie chcieliście takich problemów, nigdy nie należało robić z piłki interesu.\n\nPrzed leżakiem Ryszarda znajdował się parkiet - pusta przestrzeń, którą można było wypełnić krzesłami, grillem albo miejscem na kolację z prasą czy trenerami. Ryszard zebrał już niemal dość, by wykopać tam basen. Tak jak palenisko stanowiło serce zamku, basen był centrum każdej odnoszącej sukcesy amerykańskiej rodziny. Ryszard również był bliski uchwycenia tego polskiego snu i oszukania sobie namiastki klasy średniej w kraju, gdzie samo pojęcie klasy średniej zostało wydrążone z treści.\n\nNagle drzwi wyleciały z zawiasów, a on zerwał się na nogi. To byli ultrasi. Potężni, barczyści faceci, każdy z ogromną masą mięśniową i wystarczającą warstwą tłuszczu, żeby ją obudować, silni jak robotnicy budowlani. Bez wątpienia niektórzy pracowali przy tej willi.\n\n- Ej, czego chcecie? Przecież wygraliście mecz! - wyjąkał sędzia.\n- Doprawdy? Bo właśnie mamy tu wyciągi z twoje konta bankowego. I to co tam jest, jest bardzo ciekawe.\n- Bydlaki! Wydusiliście z nich dane mojego konta?! Jak wy... Prokurator się o tym dowie!\n- Jasne, bo właśnie do niego trafisz. Mamy dość, żeby zakopał cię w takiej stercie gówna, że nie skusiałby się nawet kosmiczna jaszczurka! Sprawdziłeś naszego człowieka w restauracji, czy nie ma podsłuchu. Ale jedyne miejsce, którego nie przeszukałeś, to jego dupa!"
buzzer.28.a: "Te dowody śmierdzą. Ale sędzia cuchnie jeszcze bardziej."

buzzer.29.t: "Uczciwa koperta"
buzzer.29.desc: "Spotkanie odbyło się w małym biurze nad stadionem, którego dach przeciekał, murawa lekko opadała ku południowej trybunie, a prezes jakimś cudem zdołał zadłużyć się w każdym banku, browarze, punkcie bukmacherskim i u każdego dostawcy kiełbasy w powiecie. Dawid Błaszczykowski przybył z prostą misją: przywrócić uczciwość lokalnej piłce. Prezes oczywiście wszystkiemu zaprzeczył. Zaprzeczył ustawianiu meczów, przekupywaniu sędziów, zastraszaniu trenerów młodzieży, dwukrotnej sprzedaży tych samych zawodników, ukrywaniu klubowych funduszy w zakładzie pogrzebowym kuzyna i uzgadnianiu remisów w zamian za tańszy beton. Wszystkiemu zaprzeczał ze znużoną pewnością siebie człowieka, który ćwiczył wypieranie się dłużej, niż niektórzy jego zawodnicy żyli.\n\n- Te oskarżenia są obraźliwe - powiedział prezes. Błaszczykowski cierpliwie wysłuchał, otworzył teczkę i położył na biurku listę długów. Prezes przestał się uśmiechać.\nLista robiła wrażenie jak klęska żywiołowa. Niespłacone kredyty, niewypłacone pensje, niezapłacone faktury, grzywny i łapówki, a do tego tajemnicza comiesięczna płatność na rzecz człowieka opisanego w klubowych księgach wyłącznie jako \"ważny wujek\". Oprocentowanie kilku zobowiązań wskazywało na działalność przestępczą albo matematykę wyższą. Sam dostawca kiełbasy zdawał się mieć dość wpływów, by ustalać wyjściową jedenastkę.\n- To prywatna sprawa klubu - powiedział prezes.\n- To zaraza narodowej piłki - odparł Błaszczykowski.\nOferta była hojna. Długi po cichu zostaną zrestrukturyzowane, najgorsze dokumenty znikną w ministerialnym archiwum, a klub otrzyma skromną dotację rozwojową. W zamian prezes przestanie ustawiać mecze, sprzedawać spotkania bukmacherom, grozić sędziom i - o ile to możliwe - zachowywać się jak fizyczne ucieleśnienie wszystkiego, co jest nie tak z polską piłką.\n\nPrzez chwilę prezes wyglądał na urażonego.\n- Czyli przekupujesz mnie, żebym przestał brać łapówki? - zapytał. Błaszczykowski spojrzał na niego znad teczki.\n- Oferuję panu nadzorowaną przez państwo drogę do moralnego odrodzenia. To więcej, niż dostałby pan w celi. W której zresztą jest pańskie miejsce, ale potrzebujemy doświadczonych ludzi.\nNiestety.\n- Dobra, chłopcze. Umiem rozpoznać okazję. Rozumiem. Gdzie podpisać?\n\nWieczorem finanse klubu były ustabilizowane, prezes podpisał zobowiązanie do uczciwości, a trzej sędziowie nagle przypomnieli sobie, że mają rodziny i sumienia. Metody nie opisano w publicznym komunikacie. Do spotkania nigdy nie doszło. Nigdy ich tam nie było."
buzzer.29.a: "Umowa to umowa..."

buzzer.30.t: "Konstruktywna krytyka" # Piłkarze bez determinacji
buzzer.30.desc: "- Milion za tę piękną willę. Stać cię na nią wogóle?\n- Czy mnie stać? Mógłbym kupić ich dziesięć!\n\nMłody mężczyzna wyjął walizkę z luksusowego samochodu i otworzył ją. W środku znajdowały się banknoty dwustuzłotowe.\n- Proszę. Zabieraj i wynoś się - powiedział. Sprzedawca skinął głową, szybko wziął walizkę, włożył ją do samochodu i odjechał.\n\nAntoni Krawczyk był kiedyś zaledwie kolejnym zawodnikiem Olimpii Truskolasy. Miał kiepskie życie. Grał w przeciętnej drużynie, o której nikt nigdy nie słyszał. Teraz zarabiał miliony. Miał samochody, sławę - praktycznie wszystko.\n\n- Eee, Antek? - odezwał się cicho jego wyraźnie zestresowany agent.\n- Tak?\n- Zarząd właśnie przysłał wiadomość, że jest rozczarowany twoją grą w ostatnim meczu... Bez goli, asyst i podań - agent mówił coraz ciszej.\n- Kogo to obchodzi? Bez względu na to, ile meczów przegramy, zarząd nie robi nic poza wysłaniem ostro sformułowanego maila.\n- Napisali też, że jeśli się nie poprawisz, poniesiesz konsekwencje - odpowiedział z lekkim strachem agent. Antoni wybuchnął długim śmiechem.\n- Ta, jakbym się ich, kurwa, bał! - odparł, nadal rozbawiony.\n\nAgent wyszedł z pokoju. Nagle Antoni usłyszał na zewnątrz pisk opon. Wyszedł na balkon i zobaczył trzy stare, zardzewiałe samochody oblepione emblematami Olimpii Truskolasy. Z jednego wysiadł człowiek trzymający zakrwawiony kij.\n\n- Ej! Co tu robicie? Wynocha! To teren prywatny! - wrzasnął na nich Antoni.\n- Kolego, to nie my stąd wylatujemy - odparł chuligan. Z samochodów zaczęli wysiadać kolejni ludzie. Każdy miał kij albo kastet, a jeden przyniósł nawet koktajl Mołotowa. Piłkarz rzucił się do ucieczki, lecz kibole przeskoczyli płot i go złapali, bo jak tu szybko biegać w klapkach?\n- Wiesz, co robimy z pierdolonymi sabotażystami?\n- Nie wiem. Może odpierdolcie się i zostawcie moją posiadłość w spokoju?\n- Zła odpowiedź. Poprawna brzmi - wpierdol. - Odwrócił się do pozostałych chuliganów. - Przypomnijmy mu, co spotyka wrogów Olimpii! CHŁOPAKI, ROZPIERDOLIĆ WSZYSTKO!\n\nChuligani uzbrojeni w kije zaczęli okładać Antoniego, podczas gdy pozostali zabierali wszystko, co miało jakąkolwiek wartość, i niszczyli resztę. Zawodnik szybko stracił przytomność. Gdy wreszcie się obudził, nikogo już nie było, ale zobaczył, co zrobili z jego majątkiem. Drogie obrazy zniknęły. Tapety zerwano. Ściany zniszczono. Samochód - zniknął. Sejf - zniknął.\n\n- Wszystko jedno. Zawsze mogę kupić następne... ale te skurwysyny... Dostaną to, na co zasłużyły. Słyszałem, że ultrasi Znicza Kłobuck zrobią wszystko za pieniądze..."
buzzer.30.a: "Przekonamy się jutro."

buzzer.31.t: "Młoda krew" # Postawić na młode talenty
buzzer.31.desc: "Krzyś Olbrachski był zwyczajnym nastolatkiem mieszkającym w Truskolasach i grającym w piłkę dla zabawy. Po Upadku i utworzeniu Związku Wolnych Klubów Truskolasów dołączył do młodzieżowej drużyny Olimpii Truskolasy. Grał w niej przez kilka lat, aż pewnego dnia po meczu trener wezwał go na rozmowę. Zaciekawiony Krzyś postanowił przyjść.\n\n- Krzyś, muszę ci powiedzieć coś ważnego - zaczął trener.\n- Co takiego, trenerze?\n- Cóż, zarząd naszej drużyny dostrzegł twój potencjał i chce, żebyś rozpoczął zawodową karierę piłkarską - oznajmił. Krzyś był zszokowany, ale w pozytywnym sensie.\n- Jest jednak jeden warunek. Od teraz będziesz musiał trenować piłkę przez cztery godziny dziennie, a później jeszcze dłużej.\n- Żaden problem! - odpowiedział z dumą Krzyś. Zamierzał opowiedzieć wszystkim.\n- W porządku. Nie będziesz już trenował tutaj, tylko w Kłobuckim Ośrodku Treningowym. Masz tam być jutro o szóstej - zakończył trener. Oczy Krzysia rozbłysły z dumy.\n- W Kłobuckim Ośrodku Treningowym? Tym dla najlepszych z najlepszych? - zapytał.\n- Tak, właśnie w nim. A teraz idź i odpocznij przed jutrem - odparł trener.\n\nKrzyś aż drżał z podniecenia. Kto zachowałby spokój po takiej propozycji? Chwycił plecak i popędził do domu najszybciej, jak potrafił, nie mogąc się doczekać, aż opowie rodzicom, co się wydarzyło.\n\n- Zostanę zawodowym piłkarzem! - krzyknął natychmiast po wejściu do domu.\n- Co się stało? - zapytała oszołomiona matka.\n- Trener właśnie powiedział, że Olimpia chce mnie wziąć na zawodnika! - nadal kipiał z podekscytowania. - Od teraz będę trenować w Kłobuckim Ośrodku Treningowym!\n- Czekaj, naprawdę?\n- Naprawdę! - odpowiedział. Matka go uściskała.\n- Synku! Zawsze wiedziałam, że osiągniesz w życiu wielkie rzeczy! - powiedziała, wyraźnie dumna. W tej samej chwili ojciec wrócił z pracy.\n- Maciej! Twój syn zostanie piłkarzem! - zawołała matka Krzysia.\n- Czekaj, co się stało? - zapytał zdezorientowany.\n- Trener właśnie powiedział, że zarząd chce, żebym został zawodowym piłkarzem!\n- Synu! Czy kiedykolwiek mówiłem ci, jak bardzo jestem z ciebie dumny? - zapytał, czując jeszcze większą dumę niż żona, po czym mocno go uściskał.\n- Dobrze, ale muszę już iść spać. Jutro mam być w ośrodku o szóstej rano! - powiedział Krzyś.\n- No dobrze - odparł ojciec, puszczając go. - Nie zawiedź mnie!\n- Nie zawiodę! - odpowiedział chłopak, będąc już w połowie drogi do swojego pokoju.\n\nGdy budzik zadzwonił o piątej rano, szybko wstał, ubrał się i pojechał autobusem do ośrodka. Pojazd był pełen ludzi w jego wieku, a wszyscy promienieli z dumy. Kiedy dotarli na miejsce, czekał już na nich trener. Pasażerowie szybko wysiedli i ustawili się przed nim w szeregu.\n\n- Dobrze, przyszli piłkarze! Zostawcie rzeczy i idźcie na bieżnię! Zrobicie dziesięć okrążeń - rozkazał trener. Tłum zrobił dokładnie to, co mu polecono.\n\"Jeszcze tylko kilka lat i zostanę następnym Lewandowskim!\", pomyślał biegnący Krzyś."
buzzer.31.a: "- Jeszcze tylko kilka lat!"

buzzer.32.t: "Obcy w obcym kraju" # Postawić na zagraniczne transfery
buzzer.32.desc: "Juris Ozola był zwyczajnym zawodnikiem jednej z wielu słabych łotewskich drużyn. Nie należał do piłkarskich geniuszy - podczas meczów przeważnie siedział na ławce rezerwowych. Pewnego dnia zarząd wezwał go jednak na spotkanie.\n- Czemu zawdzięczam tę przyjemność?\n- Drogi Jurisie, choć bardzo cieszyliśmy się z twojej obecności w drużynie, pewne rzeczy muszą się kiedyś skończyć. Przyjęliśmy ofertę Olimpii Truskolasy i sprzedaliśmy cię do ich klubu.\n- Słucham? Mam tutaj rodzinę, przyjaciół i dom! Nie mogę tak po prostu wyjechać.\n- Możesz. I wyjedziesz. Delegacja Truskolasów zapłaciła za ciebie pięćdziesiąt tysięcy dolarów. Tej oferty po prostu nie mogliśmy odrzucić.\n- Sprzedajecie mnie, tak cennego zawodnika, za marne pięćdziesiąt tysięcy?\n- Szczerze mówiąc, to znacznie więcej, niż się spodziewaliśmy. Zabierz rzeczy, autobus czeka przed budynkiem. Powodzenia w Truskolasach. - Kierownik wypchnął go z pokoju i zamknął drzwi.\n\"Nie ma mowy, żebym tam pojechał. Nie mogę tak po prostu opuścić rodziny. A poza tym... TAM TRWA WOJNA\", pomyślał Juris.\n- Aha, jeśli tam nie pojedziesz, będziesz musiał zapłacić im sto tysięcy dolarów.\n- Co? Dlaczego?\n- Zapisano to w twoim kontrakcie. Albo zapłacisz, albo pojedziesz. Nie masz innego wyjścia.\nJuris zastanowił się. Nie było szans, żeby zebrał tyle pieniędzy.\n- Naprawdę muszę tam jechać? Nie możecie po prostu wycofać transakcji?\n- Nie. A teraz zabierz rzeczy i wsiadaj do autobusu - odpowiedział kierownik.\nPokonany Juris spakował dobytek, zerwał umowę najmu, w ciągu kilku godzin pożegnał się z najbliższą rodziną i wreszcie wsiadł do autobusu. Zauważył innych ludzi i usiadł obok jednego z nich.\n- Jak się nazywasz? - zapytał.\n- Aleksandr Koppel, jestem z Estonii. Kilka dni temu sprzedała mnie moja drużyna, a teraz muszę jechać do Truskolasów zadupia w rozdzieranej wojną Polsce - odparł wyraźnie zestresowany mężczyzna.\n- Spotkał mnie podobny los. Moja drużyna sprzedała mnie za zaledwie pięćdziesiąt tysięcy dolarów.\n- Pięćdziesiąt tysięcy? Mnie sprzedali za dziesięć!\nPo pewnym czasie autobus wreszcie ruszył. Po przekroczeniu granicy łotewsko-litewskiej niewiele się zmieniło, lecz granica litewsko-polska była zupełnie inną historią. Ruiny za ruinami. Włóczędzy za włóczęgami. Juris wiedział o sytuacji, ale nie sądził, że jest aż tak źle. Podczas podróży wielokrotnie słyszał strzały i odgłosy walk, lecz dla własnego zdrowia psychicznego postanowił je ignorować. Po wielu godzinach dotarli do Kłobuckiego Ośrodka Treningowego. Juris widział wszędzie trenujących zawodników. Kopali piłki, strzelali - piłką albo z karabinu - i ćwiczyli podania. Po chwili autobus się zatrzymał, a kierowca kazał piłkarzom wysiąść. Juris wyszedł pierwszy, a reszta podążyła za nim.\nPrzed nimi stał sierżant, dumnie prezentujący trzy medale na piersi.\n- Dobra, piłkarze! Witamy w Kłobucku. Tutaj będziecie trenować przed nadchodzącymi meczami. Kierownik jest tam. Jak chcecie o coś zapytać, to śmiało - powiedział łamaną angielszczyzną sierżant. Juris postanowił podejść do kierownika.\n- Ile płacicie?\n- Sto tysięcy złotych rocznie - odpowiedział kierownik.\n\"Hm\", pomyślał Juris."
buzzer.32.a: "Może życie tutaj nie będzie tak złe, jak myślałem."

buzzer.33.t: "Ustawa o zorganizowanych starciach drużynowych (konfrontacjach amatorskich) 1/2"
buzzer.33.desc: "\n\n**Artykuł §§1. (Zakres regulacji)**\nNiniejsza ustawa określa zasady organizacji, przeprowadzania i nadzoru nad zorganizowanymi starciami drużynowymi o charakterze sportowo-rekreacyjnym, zwanymi dalej \"konfrontacjami\", w celu zapewnienia bezpieczeństwa ich uczestników i osób trzecich.\n\n**Artykuł §§2. (Legalność konfrontacji)**\n1. Konfrontacja zorganizowana zgodnie z przepisami niniejszej ustawy nie stanowi udziału w bójce ani pobiciu w rozumieniu art. 158 Ustawy z dnia 6 czerwca 1997 r. - Kodeks karny.\n2. Udział w konfrontacji spełniającej wymogi niniejszej ustawy uznaje się za amatorską dyscyplinę sportu walki o podwyższonym poziomie ryzyka.\n\n**Artykuł §§3. (Warunki dopuszczalności)**\nKonfrontacja jest legalna wyłącznie po spełnieniu wszystkich następujących warunków:\n1. **Miejsce:** Odbywa się na zamkniętym, prywatnym i ogrodzonym terenie, niedostępnym dla osób nieupoważnionych oraz niewidocznym z miejsc publicznych.\n2. **Zgłoszenie:** Organizator zawiadamia właściwego miejscowo Komendanta Powiatowego lub Miejskiego Milicji o zamiarze przeprowadzenia konfrontacji nie\npóźniej niż siedem dni przed planowanym terminem.\n3. **Uczestnicy:** Wszyscy uczestnicy są pełnoletni, posiadają ważne zaświadczenie lekarskie dopuszczające ich do udziału w sportach walki oraz podpisują pisemne oświadczenie\npotwierdzające dobrowolny udział i świadomość ryzyka odniesienia obrażeń lub śmierci, zgodnie z zasadą *volenti non fit iniuria*.\n4. **Zabezpieczenie medyczne:** Organizator zapewnia na miejscu obecność co najmniej jednego zespołu ratownictwa medycznego oraz lekarza koordynującego.\n5. **Sędziowanie:** Starcie nadzoruje co najmniej dwóch niezależnych sędziów, którzy mają zarówno prawo, jak i obowiązek przerwać walkę w razie zagrożenia życia lub zdrowia uczestnika albo gdy uczestnik przestaje się bronić.\n\n**Artykuł §§4. (Zakazy i ograniczenia)**\n1. Z zastrzeżeniem art. 4a podczas konfrontacji zabrania się używania jakichkolwiek narzędzi, w szczególności narzędzi niebezpiecznych. Walka odbywa się wyłącznie przy użyciu rąk i nóg.\n2. Z zastrzeżeniem art. 4a zabrania się udziału w konfrontacji osobom znajdującym się pod wpływem alkoholu, środków odurzających lub substancji psychotropowych."
buzzer.33.a: "Następna strona!"
buzzer.43.t: "Ustawa o zorganizowanych starciach drużynowych (konfrontacjach amatorskich) 2/2"
buzzer.43.desc: "**Artykuł §§4a. (Rozszerzony protokół parytetowy)**\n1. Osoby znajdujące się pod wpływem alkoholu lub środków odurzających mogą uczestniczyć w konfrontacji, a narzędzia, zwane dalej \"pomocą techniczną\", mogą być używane, pod warunkiem że kapitanowie lub przedstawiciele obu drużyn pisemnie uzgodnili odpowiednie zasady parytetu.\n2. Porozumienie, o którym mowa w ust. 1, przyjmuje formę Protokołu Parytetowego, który należy dołączyć do zgłoszenia przedkładanego właściwemu miejscowo Komendantowi Milicji zgodnie z art. 3 pkt 2.\n3. Protokół Parytetowy określa imiennie:\n   a. **Parytet substancji:** Maksymalną dopuszczalną liczbę osób po każdej stronie, które mogą znajdować się pod wpływem substancji, wraz z maksymalnym dopuszczalnym stężeniem alkoholu w wydychanym powietrzu albo rodzajem danej substancji.\n   b. **Parytet pomocy technicznej:** Dokładną specyfikację techniczną dozwolonych narzędzi, w tym na przykład drewnianych pałek o określonej długości lub przedmiotów gumowych, ich liczbę oraz imiona i nazwiska uczestników uprawnionych do ich posiadania.\n4. Broń palna, broń o zaostrzonych krawędziach, w tym noże i maczety, a także substancje żrące lub wybuchowe w żadnym wypadku nie mogą zostać ujęte w Protokole.\n5. Przed rozpoczęciem konfrontacji sędziowie oraz lekarz koordynujący sprawdzają zgodność faktycznych okoliczności z Protokołem Parytetowym.\n6. Przekroczenie uzgodnionej liczby osób pod wpływem substancji lub wniesienie wyposażenia nieuwzględnionego w zatwierdzonej specyfikacji skutkuje natychmiastowym odwołaniem konfrontacji i utratą jej legalnego statusu zgodnie z art. 5 ust. 1.\n7. Liczba uczestników po obu stronach jest równa i nie przekracza trzydziestu osób na drużynę.\n\n**Artykuł §§5. (Odpowiedzialność karna i cywilna)**\n1. Kto organizuje konfrontację z naruszeniem przepisów niniejszej ustawy, podlega karze pozbawienia wolności od roku do pięciu lat.\n2. Uczestnicy legalnej konfrontacji nie ponoszą wobec siebie odpowiedzialności cywilnej za uszkodzenia ciała odniesione podczas starcia lub w jego wyniku, chyba że obrażenia zadano umyślnie po przerwaniu walki przez sędziego albo w sposób stanowiący rażące naruszenie uzgodnionych zasad walki.\n3. Jeżeli zgodnie z art. 4a podpisano Rozszerzony Protokół Parytetowy, organizator i wszyscy uczestnicy wyrażający zgodę na walkę według zmodyfikowanych zasad wspólnie zrzekają się prawa do dochodzenia roszczeń wynikających z trwałego uszczerbku na zdrowiu.\n4. Pełne koszty hospitalizacji lub skomplikowanych zabiegów chirurgicznych wynikających z użycia pomocy technicznej pokrywa obowiązkowe komercyjne ubezpieczenie organizatora od odpowiedzialności cywilnej i następstw nieszczęśliwych wypadków.\n\n**Artykuł §§6. (Wejście w życie)**\nNiniejsza ustawa wchodzi w życie po upływie czternastu dni od dnia ogłoszenia."
buzzer.43.a: "Czy to naprawdę konieczne?"


buzzer.34.t: "Mistrzowie Galaktyki"
buzzer.34.desc: "Stefan nie mógł uwierzyć w to, czego doświadczał. ZWKT zwyciężył, całkowicie demolując każdego rywala w każdym meczu. Był kibicem piłki od dzieciństwa. Pamiętał gole Grzegorza Laty, które napełniały Polskę dumą na całym świecie, oraz stagnację, która po nich nadeszła. Nie wierzył, że polska potęga kiedykolwiek powróci, ale reprezentacja ZWKT udowodniła mu, że się mylił.\n\nLudzie wylegli na ulice i świętowali jak szaleni. Całe miasto zmieniło się w jedną wielką, chaotyczną paradę zwycięstwa, która kompletnie sparaliżowała okolicę. W samym centrum szaleństwa drużyna jechała odkrytym autobusem, przedzierając się przez gęste morze tysięcy ekstatycznych kibiców wrzeszczących na całe gardło. Zawodnicy machali, unosili trofea i skandowali razem z tłumem. Powietrze było ciężkie i duszne, nasycone biało-czerwonym dymem z setek rac odpalonych przez ultrasów, które przemieniły nocne niebo w dosłowną ścianę ognia. Szczerze mówiąc, nie przypominało to już zwyczajnego święta sportowego. Wyglądało jak pełnowymiarowa rewolucja czystej radości.\n\nSzaleństwo porwało wszystkich - od małych dzieci siedzących na ramionach rodziców po staruszków, którzy nie uśmiechali się od lat osiemdziesiątych. Zupełnie obcy ludzie obejmowali się na środku ulicy, otwierali tani szampan i śpiewali stare hymny stadionowe odbijające się echem od betonowych ścian. Po raz pierwszy od lat lokalne podziały przestały mieć znaczenie. Cała społeczność była całkowicie zjednoczona i skupiona na niemożliwym zwycięstwie, które dokonało się na jej oczach.\n\nPatrząc, jak stary porządek odchodzi w zapomnienie, a autobus jedzie naprzód, Stefan wreszcie poczuł przypływ prawdziwej dumy. Dziesięciolecia upokorzeń i leniwej stagnacji oficjalnie dobiegły końca. Tutaj, pośrodku niczego, Brzęczek nie tylko naprawił rozbitą drużynę z ligi niedzielnej - wykuł niezwyciężone imperium. ZWKT był niekwestionowanym władcą galaktyki i już nikt nigdy nie spojrzy z góry na polską piłkę."
buzzer.34.a: "Polska znów jest dumna."

buzzer.35.t: "Długi marsz polskiej piłki"
buzzer.35.desc: "Równolegle do historii państwa polskiego i jego upadku biegnie plugawa historia taktyki polskiego futbolu. Trawiona korupcją i narodowymi kompleksami nasza myśl taktyczna cierpiała przede wszystkim na brak pewności siebie, pogłębiany przez każdą porażkę i zmianę trenera. Nawet zasadniczo rozsądna doktryna Smudy ugrzęzła w tej przypadłości: zakładała przewagę techniczną przeciwnika i natychmiast przechodziła do przesadnej obrony, gdy tylko rywal stawiał poważniejszy opór.\n\nLogiczne następstwa narodowego lęku skrystalizowały się w ostatnich latach przed Upadkiem. Obrona Częstochowy, w której parkuje się cały autobus - tak, całą drużynę - na własnej połowie, aby maksymalnie zagęścić przestrzeń. Wyjątkowo polski \"centrostrzał\", dosłownie połączenie dośrodkowania i strzału, wykonywany z bocznych sektorów boiska: wygląda jak podanie w środek, lecz dzięki zespoleniu techniki, wiatru i nieuwagi bramkarza kończy się golem.\nLaga, zrodzona z lęku przed grą w środku pola i naszego uzależnienia od Roberta Lewandowskiego, napastnika zdarzającego się raz na pokolenie, polega na wykopie spod własnej bramki na drugą połowę, nadziei, że Lewy przejmie piłkę, i założeniu, że w stylu Leeroya Jenkinsa wedrze się z nią do bramki. Nie potrafiąc uwierzyć w swoje umiejętności, skorumpowaną infrastrukturę ani ogólnie w samych siebie, polegamy na wysokich wykopach chroniących piłkę przed przejęciem i częściej sięgamy po prawo Pascala niż po prawdziwą doktrynę futbolu, aby nagiąć rachunek prawdopodobieństwa.\n\nSztuczki i niepokój zrodzone ze szczerego oddania sportowi oraz pragnienia sukcesu, zranione przez kradzież i sprzeniewierzenie środków potrzebnych do jego osiągnięcia, a następnie przeobrażone w apatię - oto definicja polskiej filozofii taktycznej, wahającej się między rozpaczą a rzeczywistą użytecznością. Przekucie tej filozofii w naszą siłę jest wyzwaniem równie taktycznym, co psychologicznym. Głęboko w psychice polskiej piłki istnieje strona zdecydowana i pewna siebie. Taka, która bierze z przeszłości każdą lekcję, lecz nie przejmuje żadnej traumy; która niczego nie pozostawia przypadkowi i nie cofnie się przed niczym, by zwyciężyć; która rozgrywa mecz jak arcymistrz szachowy, a nie nałogowy hazardzista. Gdy zgromadzimy odpowiednie środki oraz zdobędziemy serca i umysły, los przestanie być naszą klątwą..."
buzzer.35.a: "...To my będziemy nim władać."

buzzer.36.t.a: "W Polsce nie ma już słabych drużyn" # haramball
buzzer.36.t.b: "W Polsce nie ma już słabych drużyn" # tiki-taka
buzzer.36.t.c: "W Polsce nie ma już słabych drużyn" # futbol totalny
buzzer.36.desc.a: "Trener zakończył ocenę umiejętności drużyny, która obejmowała jeden mecz treningowy (z przerwą co piętnaście minut z powodu paskudnej pogody), rozmowę z kapitanem, a następnie sprawdzian zdolności sztabu w piciu alkoholu - i rozpierała go duma. Krążąc bez końca wokół boiska niczym w transie (jedynym transem był lekki wpływ taniego miejscowego wina), wyobrażał sobie, jak wiele zdoła osiągnąć jego drużyna po tym, co mu pokazała. A co widział przed sobą? Triumf za triumfem za triumfem. Zespoły prezentujące podczas sparingów i ćwiczeń futbol światowej klasy, wyciągające króliki z kapelusza tak, jakby urządziły w nim hodowlę. Piłka leci wysoko, ale nie jest już ani spoko, ani koko-koko. Robi się gorąco i poważnie, a nikt nie może mieć wątpliwości, że w Polsce nie ma już słabych drużyn.\n\nKoniec z niepewnością i kompleksem niższości. Wreszcie przekroczyliśmy Rubikon i wkroczyliśmy na pola zamieszkane przez zespoły takie jak Anglia i inne rzekomo antyfutbolowe drużyny. Bezwzględny pragmatyzm. Brudne wrzutki, brudne wślizgi, nic poza wynikiem nie ma znaczenia. Po co dążyć do technicznej doskonałości albo chaosu, skoro wystarczy osiem razy posłać lagę do napastnika zdarzającego się raz na pokolenie, aby zdobyć jedną bramkę? Jeśli komuś się to nie podoba, niech ma pretensje do tego, kto zdecydował, że o zwycięstwie rozstrzygają gole, a nie posiadanie piłki.\n\nWreszcie uwolniony z transu, podczas którego zrobił trzy okrążenia wokół boiska, Trener ruszył do domu. Bezksiężycowe niebo o północy było czarne jak smoła, lecz w jego wyobraźni zasnuwały je czerwone race, drużyna trzymała Puchar Świata, a otaczający go kibice wykrzykiwali słowa, których ani wcześniej, ani później nikt nie wykrzyczał z taką ekstazą i poczuciem triumfalnego wyniesienia."
buzzer.36.desc.b: "Trener zakończył ocenę umiejętności drużyny, która obejmowała jeden mecz treningowy (z przerwą co piętnaście minut z powodu paskudnej pogody), rozmowę z kapitanem, a następnie sprawdzian zdolności sztabu w piciu alkoholu - i rozpierała go duma. Krążąc bez końca wokół boiska niczym w transie (jedynym transem był lekki wpływ taniego miejscowego wina), wyobrażał sobie, jak wiele zdoła osiągnąć jego drużyna po tym, co mu pokazała. A co widział przed sobą? Triumf za triumfem za triumfem. Zespoły prezentujące podczas sparingów i ćwiczeń futbol światowej klasy, wyciągające króliki z kapelusza tak, jakby urządziły w nim hodowlę. Piłka leci wysoko, ale nie jest już ani spoko, ani koko-koko. Robi się gorąco i poważnie, a nikt nie może mieć wątpliwości, że w Polsce nie ma już słabych drużyn.\n\nPolskie drużyny cechowały niegdyś toporne, sklecone na chybcika taktyki i równie marne możliwości techniczne. Koniec z tym. Ujrzeliśmy doskonałość Włochów, zaczerpnęliśmy determinacji i pracowitości, od których zarumieniłby się sam Rock Lee, i przyjęliśmy młodość futbolu odnalezioną w technicznej perfekcji, która pozwala stosować taktyki zbyt szybkie dla większości oczu. Nasze triumfy są piramidami wznoszonymi z pojedynczych podań - raz za razem, rutynowo wyuczonych i rutynowo rozgrywanych, aż znajdziemy się tuż przed bramką. A jeśli to nie wystarczy? Zaparkujemy autobus na własnej połowie i przekształcimy obronę Częstochowy w potwora kontrataku.\n\nWreszcie uwolniony z transu, podczas którego zrobił trzy okrążenia wokół boiska, Trener ruszył do domu. Bezksiężycowe niebo o północy było czarne jak smoła, lecz w jego wyobraźni zasnuwały je czerwone race, drużyna trzymała Puchar Świata, a otaczający go kibice wykrzykiwali słowa, których ani wcześniej, ani później nikt nie wykrzyczał z taką ekstazą i poczuciem triumfalnego wyniesienia."
buzzer.36.desc.c: "Trener zakończył ocenę umiejętności drużyny, która obejmowała jeden mecz treningowy (z przerwą co piętnaście minut z powodu paskudnej pogody), rozmowę z kapitanem, a następnie sprawdzian zdolności sztabu w piciu alkoholu - i rozpierała go duma. Krążąc bez końca wokół boiska niczym w transie (jedynym transem był lekki wpływ taniego miejscowego wina), wyobrażał sobie, jak wiele zdoła osiągnąć jego drużyna po tym, co mu pokazała. A co widział przed sobą? Triumf za triumfem za triumfem. Zespoły prezentujące podczas sparingów i ćwiczeń futbol światowej klasy, wyciągające króliki z kapelusza tak, jakby urządziły w nim hodowlę. Piłka leci wysoko, ale nie jest już ani spoko, ani koko-koko. Robi się gorąco i poważnie, a nikt nie może mieć wątpliwości, że w Polsce nie ma już słabych drużyn.\n\nNasza reprezentacja wzięła swoje największe słabości i przemieniła je w największe atuty. Dezorganizacja stała się elastycznością, chaos - drabiną, po której pewnego dnia wejdziemy na mistrzostwa świata, a desperacja - jednocześnie zwodem i triumfalną szarżą. Gdy inni uczestnicy piłkarskiego świata gonili własne ogony, zajęci wyrafinowanymi wyzwaniami technicznymi i haramballem, od którego zarumieniliby się nawet miłośnicy obrony Częstochowy, my wróciliśmy do podstaw: futbolu totalnego, w którym każdy może pełnić dowolną rolę, a pressing na przeciwniku jest bezlitosny. Powróciliśmy do źródła, do podstaw, do krynicy futbolu wynalezionej przez Johana Cruijffa, i daliśmy piłce nową młodość.\n\nWreszcie uwolniony z transu, podczas którego zrobił trzy okrążenia wokół boiska, Trener ruszył do domu. Bezksiężycowe niebo o północy było czarne jak smoła, lecz w jego wyobraźni zasnuwały je czerwone race, drużyna trzymała Puchar Świata, a otaczający go kibice wykrzykiwali słowa, których ani wcześniej, ani później nikt nie wykrzyczał z taką ekstazą i poczuciem triumfalnego wyniesienia."
buzzer.36.a: "POLSKAAA, BIAŁO-CZERWONI, POLSKAAA..."

buzzer.37.t: "Boleści polskiej piłki"
buzzer.37.desc: "Ostatnio bez przerwy nawiedzają mnie myśli o przeszłości. Zdołałem zjednoczyć Zagłębie i wynieść Truskolasy na szczyt futbolu, a mimo to nadal nie potrafię zapomnieć. PZPN, to skorumpowane ścierwo, zamienił moje życie w piekło. Trenowałem reprezentację Polski, wprowadziłem ją na Euro 2020, a oni i tak mnie zwolnili. To niesprawiedliwe traktowanie dotknęło nie tylko mnie, lecz także całą polską piłkę. A to zaledwie wierzchołek góry lodowej.\n\nPZPN był nowotworem, który przez dziesięciolecia stopniowo niszczył polski futbol. Legendy takie jak Deyna czy Lato potrafiły dać nam trzecie miejsce na mistrzostwach świata w epoce komunizmu, kiedy wszystko było trudniejsze. A teraz? Po transformacji gospodarczej działacze stali się jedynie niewiarygodnie skorumpowani, odbierając motywację naszym zawodnikom i niszcząc wszystko, co kiedykolwiek osiągnęli bohaterowie polskiej piłki.\n\nMogłem ich uratować i poprowadzić reprezentację Polski ku chwale, ale byłem dla nich niewygodny.\n\nPrawda jest jeszcze bardziej gorzka, gdy porównuję zawodników, których musiałem wtedy trenować, z tymi, których widzę dzisiaj. Związek nie tylko kradł pieniądze - całkowicie zniszczył mentalność całych pokoleń polskich sportowców. Nauczył ich lenistwa, szukania wymówek i troszczenia się bardziej o premie oraz kontrakty niż o samą piłkę. Traktując reprezentację jak prywatną dojną krowę, biurokraci na trwałe złamali ducha naszego futbolu i pozostawili dziedzictwo słabości, którego naprawa zajmie całe dziesięciolecia.\n\nCzasami siedzę samotnie w gabinecie, patrzę na stare tablice taktyczne i zastanawiam się, czy wyrządzone szkody nie są po prostu zbyt wielkie. Zrównali cały system z ziemią, a winę pozostawili mnie. Nie docenili mnie jednak. Myśleli, że zwolnienie będzie moim końcem, lecz było dopiero początkiem. Przechytrzyłem ich wszystkich. Tutaj, pośrodku niczego, tuż pod ich nosem, stworzyłem coś, czego nigdy się nie spodziewali: drużynę zdolną dokonać absolutnie wszystkiego."
buzzer.37.a: "Olimpię Truskolasy."

buzzer.38.t: "Dziura w firmamencie"
buzzer.38.desc: "Jakub Błaszczykowski słyszał, jak wuj mówi o dawnym PZPN, więcej razy, niż potrafił zliczyć. Czasami brzmiało to jak lekcja historii, innym razem jak spowiedź. Niekiedy przypominało też kazanie wygłaszane do pustej szatni długo po zakończeniu meczu. Według Brzęczka Związek nie tylko źle zarządzał polską piłką, ale ją zatruł. Nauczył zawodników bać się ryzyka, trenerów czcić przeciętność, działaczy chronić się nawzajem, a kibiców przyjmować rozczarowanie jako narodową tradycję. Każde nieudane pokolenie, każdy zmarnowany talent, każda tchórzliwa zmiana i każdy bezbarwny atak miały źródło w tym samym zgniłym miejscu.\n\nKuba rozumiał ten gniew. Przeżył w tamtym świecie dość, by wiedzieć, jak wiele było w tym prawdy.\nPamiętał szatnie, w których ambicję uznawano za arogancję. Pamiętał uśmiechniętych działaczy ogłaszających decyzje podjęte już gdzie indziej. Pamiętał młodych zawodników uczonych ostrożności, zanim poznali odwagę, oraz starszych mężczyzn nazywających to mądrością. Stary system marnował mecze. Marnował potencjał. Marnował wiarę.\n\nA jednak, oglądając z miejsca dla VIP-ów finał Pucharu Zwycięstwa, widział na własne oczy, czym prawda stała się w rękach ludzi, którzy przestali w siebie wątpić.\nSport miał jednoczyć ludzi. To pierwsza rzecz, jaką mówi każdy, kto chce zabrzmieć szlachetnie. Kształtuje charakter, uczy dyscypliny, daje chłopcom miejsce, do którego mogą pójść, a mężczyznom coś lepszego niż nienawiść, co mogą nieść w sobie. Brzęczek kiedyś w to wierzył. Oby nadal wierzył. Kuba wciąż chciał wierzyć. Lecz zbudowane przez nich państwo zaczynało mylić lojalność z przemocą, dyscyplinę z posłuszeństwem, a ducha klubowego z wojną plemienną. PZPN zawiódł polską piłkę przez korupcję, lenistwo i strach. ZWKT groziła porażka spowodowana niezachwianą pewnością siebie.\n\nJeszcze wczoraj grupa ultrasów osaczyła najwyżej czternastoletniego chłopca. Miał niewłaściwy szalik, kibicował niewłaściwemu klubowi albo nie rozumiał jakiejś lokalnej urazy, która stała się świętością, zanim przyszedł na świat. Dzisiejszy raport stwierdzał, że liczba incydentów przemocy kibicowskiej spadła - pod warunkiem, że nie wliczano zatwierdzonej przemocy kibicowskiej. W jakiś sposób czyniło to wszystko jeszcze gorszym. Nie tacy mieliśmy być, pomyślał Kuba. Wierzył, że wuj widzi sytuację dokładnie tak samo. Tylko... wyciąga inne wnioski.\n\nJego wuj miał rację w sprawie starego systemu. To było najgorsze. Miał rację niemal we wszystkim.\n\nNiemal."
buzzer.38.a: "Ta gra miała nas jednoczyć..."

buzzer.39.t: "Miałem sen"
buzzer.39.desc: "Robert Lewandowski widział dość lotnisk, ośrodków treningowych, tuneli stadionowych i saloników prezydenckich, by rozpoznawać, kiedy z krajem jest coś nie tak. Przybył do Związku Wolnych Klubów Truskolasów z ostrożnością, ciekawością i starannie przygotowanym oświadczeniem o jedności, rozwoju oraz przyszłości polskiego futbolu. Gospodarze otoczyli go czcią zwykle zarezerwowaną dla zwycięskich generałów i świętych, których relikwie przetrwały Upadek. Urzędnicy cytowali z pamięci jego statystyki. To znaczy... pięć goli w dziesięć minut! Kto tak potrafi?! Lewandowski przez lata żył poza zasięgiem krajowego bagna, obserwując z zagranicy, jak Polska niszczy kolejne pokolenia talentów, a potem obwinia zawodników, trenerów, pogodę, trawę, sędziego i od czasu do czasu Portugalię. Gdy nadszedł Upadek, znajdował się u schyłku kariery, ale katastrofa nie zamknęła pytania, które towarzyszyło mu od dzieciństwa: dlaczego naród tak mocno kochający piłkę nie potrafił przemienić tej miłości w coś trwałego?\n\nNa pierwszy rzut oka państwo Brzęczka odpowiedziało na to pytanie z przerażającą pewnością siebie. Boiska były wszędzie. Dzieci trenowały przed szkołą, po szkole, a czasem zamiast szkoły. Ministerstwa mówiły o intensywności pressingu, lojalności klubowej i dyscyplinie narodowej, jakby były to wskaźniki gospodarcze. Każdą ścianę pokrywały hasła. W każdym biurze leżała piłka. Każdy urzędnik miał opinię o właściwej moralnej interpretacji nieudanego kontrataku. Nawet najmniejszy wiejski klub mówił o rozwoju młodzieży, tożsamości taktycznej i historycznej odpowiedzialności wobec polskiej piłki. Przez pięć minut Lewandowski niemal to podziwiał.\n\nPo kilku tygodniach zobaczył jednak resztę. Paranoję. Komisje. Niekończące się oskarżenia o miękkość, debaty o obcych wpływach, złych nawykach, niewłaściwych klubach, niedostatecznym duchu treningowym i ideologicznej płytkości. Kraj, który wreszcie umieścił piłkę w centrum życia publicznego, jakimś cudem uczynił grę mniejszą, a nie większą. Były tu pasja, dyscyplina i głód zdolny stworzyć coś niezwykłego. Pod rządami Brzęczka nawet ambicja musiała jednak stanąć w kolejce i poprosić trenera o pozwolenie. Lewandowski spoglądał na boisko treningowe poniżej, gdzie grupa chłopców raz za razem ćwiczyła ten sam ruch. Żaden nie narzekał. Żaden nie improwizował. Żaden nie próbował podania, którego trener nie nakazał. Ich ruchy były czyste, zsynchronizowane i coraz bardziej puste, aż ćwiczenie przestało przypominać trening, a zaczęło wyglądać jak posłuszeństwo.\n\nPolska może być lepsza, pomyślał.\nTalent tu był. Głód tu był. Nawet marzenie wciąż żyło, pogrzebane pod hasłami, komisjami i gwizdkami. Nie trzeba było go tworzyć. Trzeba było je uwolnić.\n\nPo raz pierwszy od przybycia do kraju Lewandowski pozwolił sobie wyobrazić, że odbiera jego przyszłość ludziom, którzy pomylili kontrolę z wielkością."
buzzer.39.a: "Wielkości nie da się wyćwiczyć rozkazami."

buzzer.40.t: "Wielka gra"
buzzer.40.desc: "Od wielu dni nad korytarzami kompleksu rządowego wisiała śmiertelna cisza, przerywana jedynie nerwowym klikaniem myszy dobiegającym z gabinetu Naczelnego Trenera. Wszystko zaczęło się dostatecznie niewinnie. Po zajęciu Częstochowy przez siły Truskolasów liczne firmy próbowały wszelkimi sposobami wkupić się w łaski nowych władz. Przedstawiciele korporacji x-kom, licząc na przychylność Jerzego Brzęczka, wręczyli mu więc \"skromny podarunek technologiczny\": najnowocześniejszy laptop gamingowy, który pozwalał odpocząć od trudów codziennego życia zawsze i wszędzie. Darczyńcy mieli nadzieję, że Trener ponownie rozważy planowaną nacjonalizację ich firmy. Wujek miał jednak inne plany. Zarządzanie państwem i prowadzenie dyplomacji natychmiast odeszły w zapomnienie, gdy na ekranie rozbłysło menu Football Managera.\n\nIgnorując stan państwa i nakazując ministrom samodzielnie podejmować wszystkie decyzje, Brzęczek podjął się najważniejszej misji: objęcia Olimpii Truskolasy. Pierwszy sprawdzian nadszedł szybko - derby ze Zniczem Kłobuck. Rzeczywistość okazała się jednak brutalna. Geniusz taktyczny Jerzego rozpadł się na jego oczach, a Olimpia dostała olbrzymi, bezdyskusyjny wpierdol.\n\nGabinet zmienił się w pole bitwy. Zamiast przełknąć gorycz porażki, rozwścieczony Naczelny Trener postanowił oszukać sam los. W ruch poszły zewnętrzne programy, edytory bazy danych i potężne hacki. Atrybuty zawodników Truskolasów poszybowały w stratosferę. Zniecierpliwiony Jerzy rozpoczął rewanż, pewny, że cyfrowy triumf jest teraz nieunikniony. Wtedy nadeszła katastrofa.\n\nSilnik gry okazał się bezlitosny. Mimo wszystkich oszustw Olimpia ponownie dostała widowiskowy wpierdol.\n\nWściekłość osiągnęła poziom krytyczny, a monitor ledwie przetrwał spotkanie z pięścią Naczelnego Trenera. Dla Jerzego sytuacja była oczywista: grę ustawiono, a x-kom ingerował w nią, aby podważyć autorytet rządu. Zamiast ponownie rozważyć los korporacji, Trener oskarżył zarząd o zdradę stanu i sabotowanie narodowego morale. Wojsko wkroczyło do częstochowskiej siedziby firmy, a dekret nacjonalizacyjny wszedł w życie ze skutkiem natychmiastowym.\n\nX-kom stał się własnością państwa, a jedynym nowym celem produkcyjnym firmy było stworzenie bota zdolnego wygrać dla Wujka Ligę Mistrzów. Nie przyniosłoby to wprawdzie państwu żadnej istotnej korzyści, lecz mogło przynajmniej uleczyć zranione ego Jerzego Brzęczka. Nie można przecież pozwolić, aby jakiś nieistotny program komputerowy kwestionował dokonania i geniusz taktyczny człowieka, który przy śniadaniu rządził jedną połową kraju, przy obiedzie drugą, a przed kolacją nadal znajdował czas na prowadzenie wojny poza jego granicami."
buzzer.40.a: "Powinien był zagrać klasycznym 4-4-2..."

buzzer.41.t: "Wspólny wróg"
buzzer.41.desc: "Chłopiec chciał tylko zrozumieć. Podczas porannej lekcji Maciek zauważył plakat wiszący obok szkolnego boiska: but miażdżący zielono-czerwoną flagę, a pod nim napis \"PAMIĘTAJ, CO ZROBILI Z NASZĄ GRĄ\". Pod hasłem ktoś narysował uśmiechniętego owada z rogami i przekreślonymi oczami. Nauczycielka nie wyjaśniła plakatu. Jedynie stuknęła w niego wskaźnikiem, po czym rozpoczęła lekcję o słynnych porażkach, nieudanych eliminacjach i moralnych zagrożeniach związanych z zagranicznymi trenerami. Podczas obiadu starsi uczniowie mówili o Portugalii tonem zwykle zarezerwowanym dla sędziów, zdrajców i niewłaściwie oznaczonych klubowych sojuszy. Jeden twierdził, że jeśli dostatecznie głęboko zbada się historię, każde niecelne podanie można powiązać z Lizboną. Inny upierał się, że karty lojalnościowe Biedronki są pierwszym etapem okupacji. Chłopiec śmiał się z pozostałymi, ale pytanie nie opuszczało go przez cały dzień i stawało się coraz cięższe za każdym razem, gdy widział obok siebie zieleń i czerwień.\n\nKiedy wrócił do domu, było już zbyt ciężkie, by nadal tłumić je w sobie.\n- Tato - zapytał - dlaczego nienawidzimy Portugalczyków? - Ojciec odstawił kubek. W kuchni na chwilę zapadła głęboka cisza.\n- Usiądź, synu - powiedział. - Pora na lekcję.\n\nTo, co nastąpiło później, nie było zwykłą odpowiedzią, lecz całym żarliwym wykładem. Ojciec mówił o obietnicach zagranicznych trenerów i ruinie, którą po sobie pozostawili. Mówił o Sousie i Santosie, zmarnowanych latach, złamanym zaufaniu, bezbarwnych atakach, tchórzliwych zmianach oraz reprezentacji, którą zmuszono wyglądać na mniejszą, niż była w rzeczywistości. Mówił o konferencjach prasowych pełnych pustych słów, meczach, w których nikt nie biegał, i nadziejach umierających gdzieś między linią środkową a kolejnym podaniem do tyłu. Potem opowiedział również o Biedronce, ponieważ żadna poważna historia portugalskich wpływów nie mogła pominąć sklepów, uśmiechniętego owada i cichej okupacji polskich zwyczajów zakupowych za pomocą przecenionego dorsza, radosnych promocji, podejrzanych kampanii lojalnościowych oraz baaaardzo długich paragonów.\n- Ale to tylko piłka - powiedział chłopiec. Ojciec spojrzał na niego z nagłym smutkiem.\n- Nic nie jest tylko piłką. Piłka jest życiem.\n\nOd tej chwili chłopiec słuchał uważnie. Niektóre rzeczy zrozumiał natychmiast. Inne miał pojąć później. Liczył się kształt lekcji: Portugalia nie tylko zawiodła Polskę, ale ingerowała w nasze przeznaczenie, którym było zdobycie mistrzostwa świata! Tego wieczoru chłopiec wyszedł do ogrodu z pudłem starych maskotek świeżaków, ułożył je w mały stos i podpalił pod nadzorem starszego kuzyna. Plastik skręcał się, czerniał i znikał w dymie. Ojciec obserwował płomienie z kuchennego okna. Po raz pierwszy tego dnia się uśmiechnął."
buzzer.41.a: "- Dobrze synku. A teraz zagramy."

buzzer.42.t: "Wybory do Zarządu Głównego ZWKT"
buzzer.42.desc: "Dobiegły końca wybory do Zarządu Głównego ZWKT. Po wielu godzinach przemówień, negocjacji i starannego liczenia głosów delegaci wybrali nowy skład najwyższego organu kierowniczego Związku. Żadna frakcja nie zdobyła niekwestionowanej kontroli, a układ sił będzie zależał od sojuszy zawieranych za drzwiami klubowych gabinetów. Głosy oddano, lecz prawdziwe konsekwencje wyborów dopiero zaczynają się ujawniać. Czy Naczelny Trener pozostanie u władzy, czy zostanie zmuszony ustąpić na rzecz kogoś innego? Większość analityków przypuszcza, że jako bratanek przejmie ją Jakub Błaszczykowski, ale niektórzy wskazują również na Roberta Lewandowskiego i jego pragnienie zreformowania kraju na więcej niż jeden sposób."
buzzer.42.a: "Naczelny Trener korzysta z okazji!"
buzzer.42.b: "Pora na prawdziwy nowy początek!"
buzzer.42.c: "Wszystko zostaje w rodzinie."

buzzer.44.t: "Wieczne derby"
buzzer.44.desc: "Wyszedłem z mieszkania o siódmej rano, przeszedłem dwie ulice w stronę Żabki i zobaczyłem, że Aleję Najświętszej Maryi Panny blokuje dwustu mężczyzn w czerwono-niebieskich szalikach, którzy ciskają kostką brukową w szereg ludzi w szalikach niebiesko-białych. Raków kontra Skra. Znowu. Milicja już dawno przestała przyjeżdżać. Obszedłem ich, kupiłem hot doga i wróciłem przez podwórka.\n\nZa moim budynkiem trwała kolejna bójka.\n\nPoczątkowo myślałem, że to zwykły pech. Częstochowa jest dużym miastem. Człowiek z pewnością może uniknąć chuliganów piłkarskich, jeżeli starannie zaplanuje trasę. Zacząłem wychodzić wcześniej. Potem później. Przestałem jeździć tramwajem, gdy kibice Rakowa przewrócili jeden na Zawodziu, bo jego motorniczy rzekomo \"wyglądał, jakby kibicował Skrze\". Zrezygnowałem z autobusów, kiedy ludzie Skry wsiedli do jednego w pobliżu Stradomia i znaleźli pod siedzeniami trzy naklejki Rakowa. Kupiłem rower. Bili się na ścieżce rowerowej. Spróbowałem chodzić przez cmentarz, sądząc, że nawet te zwierzęta uszanują zmarłych. Walczyli między grobami. Jeden mężczyzna wymachiwał wieńcem pogrzebowym jak tarczą, podczas gdy inny wystrzelił racę nad rodzinnym grobowcem. Ukryłem się za aniołem, aż ktoś krzyknął, że posąg nosi barwy Rakowa. Był z pieprzonego kamienia. Z szarego kamienia. I tak go rozbili.\n\nTeraz dzieje się to wszędzie. Na targu biją się mrożonymi rybami. W szpitalu walczą o to, który klub ma więcej krwiodawców. W urzędzie skarbowym używają numerków z kolejki zaostrzonych w małe noże. Nocami słyszę przez ściany przyśpiewki. Czasem Rakowa. Czasem Skry. Czasem obu naraz, doskonale zsynchronizowane, jakby całe miasto przemieniło się w olbrzymi stadion zaprojektowany wyłącznie po to, by mnie dręczyć. Sąsiad mówi, że niczego nie słyszy. Sąsiad kłamie. Ma niebiesko-białe zasłony i czerwono-niebieskie kapcie. Podwójny agent.\n\nMam dość zmieniania tras. Mam dość chowania się za ścianami, nagrobkami i zaparkowanymi samochodami. Mam dość patrzenia, jak te skurwysyny zmieniają każdy chodnik, sklep i przystanek tramwajowy we własne pole bitwy. Nie obchodzi mnie, kto zaczął. Nie obchodzi mnie, czyj stadion jest starszy, czyi kibice są głośniejsi ani który herb należy do której części miasta.\n\nMAM DOŚĆ TYCH JEBANYCH PYTAŃ - KOMU KIBICUJESZ. NIKOMU, NIKOMU, JA NAWET NIE LUBIĘ PIŁKI!\n\nNIE WYBIORĘ. SŁYSZYCIE? KURWA, NIE WYBIORĘ!"
buzzer.44.a: "CHCIAŁEM TYLKO JEBANEGO HOT DOGA"

 
unification.19.t: "[GetNewspaper]Truskolasy jednoczy Zagłębie i Jurę!"
unification.19.desc: "Gol dla Truskolasów! Mimo że żaden bukmacher nie odważył się postawić na nich przed wojną, Związek Wolnych Klubów zdołał przejąć całe terytorium Zagłębia i Jury. Dziś na Nowym Ludowym Stadionie w Sosnowcu zwycięski Jerzy Brzęczek przemówił do zgromadzonych zawodników i obywateli, inaugurując Triumfalny Mecz między Olimpią Truskolasy a Reprezentacją Narodową. Pomimo morderczego sezonu, klub z dzieciństwa Najwyższego Selekcjonera pokonał młodą reprezentację 3:0 otoczeni przez morze ideologicznej propagandy symbolizującej jedność wszystkich klubów pod sztandarem ZWKT. Wygląda na to, że Klubizm stworzył własny unikalny odłam myśli socjalistycznej; jednak kibice mają powody do obaw, bo wynik boleśnie odsłonił słabości projektu odrodzenia Reprezentacji, która - jak Brzęczek zapewnił na konferencji pomeczowej - nadal znajduje się w stanie przejściowym."
unification.19.a: "Campeones, Campeones, Ole Ole Ole?"

unificationreg.19.t: "[GetNewspaper]Łączy nas piłka, my łączymy kraj z powrotem!"
unificationreg.19.desc: "Zabrzmiał ostatni gwizdek! Po miesiącach walk przez ufortyfikowane miasta, wapienne doliny i większą liczbę linii obronnych, niż zdołałby znieść nawet najbardziej oddany wyznawca polskiego haramballu, Związek Wolnych Klubów opanował cały region. Kulminacją obchodów była uroczystość na świeżo znacjonalizowanym stadionie w Częstochowie, gdzie Jerzy Brzęczek oświadczył, że żaden zamek, klasztor ani lokalny prezes już nigdy nie stanie ponad wspólnym interesem piłki nożnej. Następnie rozegrano mecz pokazowy między Olimpią Truskolasy a naprędce złożoną Reprezentacyjną Jedenastką Jury, której zawodnicy według doniesień poznali się zaledwie kilka godzin przed pierwszym gwizdkiem. Olimpia wygrała 4:1, choć jedynego gola gości natychmiast ogłoszono dowodem, że integracja regionalna już przynosi rezultaty. Po wypędzeniu dawnych watażków i przekształceniu ich siedzib klubowych w akademie ludowe klubizm zdobył pierwszy prawdziwy przyczółek poza znajomymi boiskami ojczyzny."
unificationreg.19.a: "Jura dołączyła do ligi!"

unificationsupreg.19.t: "[GetNewspaper]Kolejne zwycięstwo dla [BRZ.GetName]!"
unificationsupreg.19.desc: "Biało-czerwone sztandary Polskiej Socjalistycznej Republiki Klubowej powiewają już nad ogromną częścią dawnej Polski. To, co zaczęło się jako ekscentryczny eksperyment w Truskolasach, rozrosło się w państwo milionów ludzi, rządzone przez komitety klubowe, rady kibiców i politykę transferową coraz trudniejszą do odróżnienia od aneksji wojskowej. Po chaosie wewnętrznym, który ogarnął ZWKT, [BRZ.GetLeader] okazał się jedyną osobą dostatecznie kompetentną, aby poprowadzić ten ekstrawagancki kraj. Nadal prześladują go jednak demony dawnych porażek i nie zamierzają łatwo odpuścić. Każdy rozwiązany problem zastępują dwa kolejne - reaktywna natura systemu klubistycznego może nie być tak stabilna, jak twierdzą państwowe media. Za kulisami pozostaje też kilka pytań. Republika musi teraz pogodzić zaciekłe rywalizacje, niekompatybilne systemy ligowe i tysiące lokalnych prezesów, z których każdy jest przekonany, że to jego klub zasługuje na miejsce w najwyższej klasie rozgrywkowej."
unificationsupreg.19.a: "Gramy do jednej bramki!"

super.19.t: "[GetNewspaper]Ostatni mecz przed nami!"
super.19.desc: "Po latach wojny, spadków i dogrywek Polska została wreszcie zjednoczona. Polska Socjalistyczna Republika Klubowa rozciąga się teraz od wybrzeża Bałtyku po Tatry, spajając naród wspólną własnością, obowiązkowymi akademiami młodzieżowymi i niekwestionowaną kulturową wyższością piłki nożnej. W Warszawie ruiny Stadionu Narodowego ponownie otwarto na Mecz Zjednoczenia Narodowego, w którym uczestniczyli żołnierze, robotnicy, ultrasi, dawni watażkowie oraz każdy ocalały prezes klubu, który dostatecznie szybko przysiągł lojalność. Choć o zamieszkach po meczu nikomu nie wolno mówić, nie ulega wątpliwości, że ostatnie pozostałości dawnej Rzeczypospolitej zniknęły za transparentami ogłaszającymi nową zasadę narodową: Polska jest klubem, a każdy obywatel jego członkiem. Żelazny uścisk Naczelnego Trenera nie słabnie. Krążą nawet pogłoski, że planuje coś związanego z Portugalią, a znając jego nienawiść do tego kraju, możemy spodziewać się wyłącznie najgorszego."
super.19.a: "Następny przystanek: Lizbona!"

super_a.19.t: "[GetNewspaper]Mistrzowie całego kraju"
super_a.19.desc: "Po latach wojny, spadków i dogrywek Polska została wreszcie zjednoczona. Polska Republika Klubowa rozciąga się teraz od wybrzeża Bałtyku po Tatry, spajając naród wspólną własnością, obowiązkowymi akademiami młodzieżowymi i niekwestionowaną kulturową wyższością piłki nożnej. W Warszawie ruiny Stadionu Narodowego ponownie otwarto na Mecz Zjednoczenia Narodowego, w którym uczestniczyli żołnierze, robotnicy, ultrasi, dawni watażkowie oraz każdy ocalały prezes klubu, który dostatecznie szybko przysiągł lojalność. Umiarkowane skrzydło lojalistów Związku zdołało wyciągnąć kraj znad krawędzi katastrofy - i naprawdę się to opłaciło. Teraz musi utrzymać wszystko, co zbudowało, i mieć nadzieję, że system nie rozpadnie się w chwili wejścia na światową scenę. Przywódca ZWKT Kuba Błaszczykowski oświadczył jednak, że zamierza podążać śladami wuja - równie surowo, jak pragnął tamten, albo nieco łagodniej."
super_a.19.a: "Nigdy nie będziemy iść samotni."

super_b.19.t: "[GetNewspaper]Reformy w kraju futbolu"
super_b.19.desc: "Po latach wojny, spadków i dogrywek Polska została wreszcie zjednoczona. Polska Federacja Klubowa rozciąga się teraz od wybrzeża Bałtyku po Tatry, spajając naród klubowymi przedsiębiorstwami, nowoczesnymi akademiami młodzieżowymi i niekwestionowaną kulturową wyższością piłki nożnej. W Warszawie ruiny Stadionu Narodowego ponownie otwarto na Mecz Zjednoczenia Narodowego, w którym uczestniczyli obywatele, dawni watażkowie oraz każdy ocalały prezes klubu przekonany siłą dobrze rozegranych układów. Robert Lewandowski, który wbrew wszystkim lojalistycznym działaczom w kraju został przywódcą ZWKT, marzył z rozmachem. Chciał skierować cały ten okręt na inny kurs - taki, który nie dyskryminowałby pozostałych dyscyplin, lecz stworzył państwo celebrujące wszystkich sportowców takimi, jakimi są. Sądząc po ulicach i panującej na nich atmosferze, odniósł całkowite zwycięstwo."
super_b.19.a: "Pora na zawodowców."

