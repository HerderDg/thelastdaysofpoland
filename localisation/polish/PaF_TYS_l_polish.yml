unification.200.t: "[GetNewspaper]Tychy jednoczą województwo śląskie!"
unification.200.desc: "Zawsze zapracowane, nigdy nieustające w biegu bijące serce polskiego przemysłu przez ostatnie lata zaznało wiele cierpienia i zniszczenia, zwłaszcza po Upadku. Gdy bogactwo gospodarcze zostało rozproszone i podzielone między rozmaite frakcje, było tylko kwestią czasu, aż jedno z walczących państw zwycięży w starciu o najgęściej zaludniony region Polski. Po miesiącach działań wojennych i przebiegłych politycznych intryg region zjednoczyło korporacyjne państwo Tychów. Wykorzystując wpływy lokalnych i zagranicznych przedsiębiorstw, których siedziby znajdują się w mieście, zdobyło pozycję regionalnej potęgi. Lokalne firmy coraz chętniej garną się do siły stabilizującej, która zjednoczyła aglomerację katowicką, a Tychy stały się jednym z kandydatów do zjednoczenia całego Śląska. Czas pokaże, czy \"korporacyjne zadupie Katowic\" utrzyma swoją dominującą pozycję."
unification.200.a: "Wygląda na to, że zadupie już nim nie jest."
