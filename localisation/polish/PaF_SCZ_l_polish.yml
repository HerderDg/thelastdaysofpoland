unification.42.t: "[GetNewspaper]Republika Nowosądecka jednoczy Podhale!"
unification.42.desc: "Gdy upadają państwa uginające się pod wolą zwykłych ludzi, ich miejsce zajmuje państwo stworzone dla nielicznych wybrańców. Po obaleniu demokratycznego rządu Nowego Sącza przez triumwirat biznesowych magnatów wielu cyników wątpiło w trwałość nowego korporacyjnego reżimu. A jednak żadna zewnętrzna krytyka nie zdołała doprowadzić do upadku oświeconej republiki oligarchicznej - podobnie jak watażkowie Podhala. Gdy najemnicy szybko rozprawili się z niewyszkolonymi milicjami, stało się boleśnie jasne, że głębokie kieszenie mają znacznie większą siłę niż stłumiony głos ludu. Teraz góry ponownie stały się domem wolności, lecz wyzwolono nie zwykłych ludzi, a rynki. Na razie korporacyjni władcy wydają się zadowoleni z dalszego zgarniania owoców pracy mieszkańców regionu, lecz ich apetyt może jedynie rosnąć. W końcu bogactwa Krakowa aż proszą się o zagarnięcie."
unification.42.a: "Atlas zrzucił kajdany"

super.42.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.42.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.42.a: "Wreszcie zjednoczeni."