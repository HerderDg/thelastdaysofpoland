POLITICS_WEAPON_DEALER_DESC: "Handlarz Bronią (urodzony §R[ŚCIŚLE TAJNE]§!) - nie wiele wiadomo o tajemniczym handlarzu bronią. Niektórzy mówią że urodził się w południowo-zachodniej Polsce przed 2005 rokiem. Niektórzy twierdzą że jego działania są ściśle finansowane przez zarówno Niemieckie jak i Rosyjskie służby specjalne. To co wiadomo na pewno to fakt, że jest w stanie zaopatrywać każdego w broń rozsądnej jakości w rozsądnej cenie.\n\nCo ciekawe, obecnie poszukuje on krótkiej historyjki nazwanej §R[ŚCIŚLE TAJNE]§!. "
