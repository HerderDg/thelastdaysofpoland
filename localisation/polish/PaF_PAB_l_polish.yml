unification.173.t: "[GetNewspaper]1 Ludowa Brygada Pancerna jednoczy Radomskie!"
unification.173.desc: "Według informacji płynących z Radomskiego, na polu historycznego zwycięstwa polskich wojsk pancernych otworzył się nowy rozdział w historii walki ludowej.Choć niezbyt liczni i zmuszeni do ruszania w bój na żałosnej mieszaninie ledwo działającego sprzętu wojskowego oraz zagarniętych eksponatów muzealnych, 1 Ludowa Brygada Pancerna skutecznie zdobyła serca ludzi i odrodziła w nich optymistyczny, zawadiacki duch pancerniaków. Żołnierze Piechocińskiego, którzy w regionie witani byli jako wybawcy, mogą liczyć na spory kredyt zaufania od lokalnej ludności która żywiołowo uczestniczyła w ich kampanii podboju. Pomimo że mówi się o kolejnych planach podbojów, czołgistów czeka nie lada wyzwanie. Przez wojnę, region został mocno podniszczony, pola zdewastowane lub spalone, wsie opuszczone. Jeśli pokój ma kiedykolwiek jeszcze zawitać do Radomskiego, Brygada będzie musiała udowodnić że są czymś więcej niż tylko wojenną gromadą."
unification.173.a: "Tym razem... było w zasadzie dokładnie czterech pancernych."


super.173.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.173.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.173.a: "Wreszcie zjednoczeni."
