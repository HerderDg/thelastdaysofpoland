 ##Events##
unification.51.t: "[GetNewspaper]Nowy Syjon jednoczy północną Wielkopolskę!"
unification.51.desc: "Z Wielkopolski napływają doprawdy osobliwe wieści, być może stanowiące najlepszy dowód na to, że Polska postradała rozum. Skrajny ruch religijny, przynajmniej nominalnie wyznający chrześcijaństwo, został przez zewnętrznych obserwatorów określony mianem niebezpiecznej sekty i katastrofy, która tylko czeka, by się wydarzyć. Państwo opiera się na niemal niezrozumiałej mieszaninie wierzeń, często bezpośrednio sprzecznych z oficjalną doktryną, a spaja je tylko jedno - obecność rzekomego proroka, Jarosława Lichwały. Każdego dnia z jego ust płyną nowe teorie podważające fundamentalne prawa znanego świata. Zgromadziwszy fanatycznych wyznawców, którzy słuchają każdego jego słowa, potrzebował zaledwie jednego rozkazu, by rzucić ich do walki. Walczyli niczym horda, nieprzejmująca się morale. Watażkowie padali jeden po drugim, niezdolni powstrzymać niepowstrzymanej masy ciał, aż prorok przejął pełną kontrolę nad regionem. Wielkopolskę może teraz ocalić już tylko siła z zewnątrz."
unification.51.a: "Nowy mesjasz, równie szalony jak ta kraina"

super.51.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.51.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.51.a: "Wreszcie zjednoczeni."
 


