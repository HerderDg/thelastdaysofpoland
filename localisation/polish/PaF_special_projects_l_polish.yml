 generic_baloon_recon_network: "Balon stratosferyczny"
 air_fuel_sp: "Tankowanie w powietrzu"

##########################
  ### NAVAL PROJECTS ###
##########################

 sp_barges: "Wojskowa barka"
 sp_barges_desc: "O Panie, to Ty na mnie spojrzałeś,\nTwoje usta dziś wyrzekły me imię.\nSwoją barkę pozostawiam na brzegu,\nRazem z Tobą nowy zacznę dziś łów."
 sp_modern_mine: "Współczesna mina morska"
 sp_modern_mine_desc: "Niezwykle skuteczne podwodne zagrożenie, gotowe unieszkodliwić każdy niepożądany statek. Na szczęście świetnie radzi sobie z trzymaniem się na uboczu - dopóki jej się nie odwidzi."
 sp_railgun: "Okrętowe działo elektromagnetyczne"
 sp_railgun_desc: "Nowoczesna broń, która wykorzystuje magnesy do wystrzeliwania pocisków z zawrotną prędkością. Zniszcz wrogów nauką i magnetyczną mocą!"
 sp_ogien_grecki: "Zapalająca broń morska"
 sp_ogien_grecki_desc: "Niszczycielska broń, która uwalnia niepowstrzymany ogień na powierzchnię wody, paląc wszystko na swojej drodze. Jak ta, której używali Bizantyjczycy. Albo ta z tej sceny z Gry o Tron."
 sp_kontrola_sledzia: "Kontrola fauny morskiej"
 sp_kontrola_sledzia_desc: "Szkolenie stworzeń wodnych do walki - po co komu Navy SEALs, skoro w zanadrzu jest oddział prawdziwych fok?"
 sp_powiekszanie_sledzia: "Modyfikacja fauny morskiej"
 sp_powiekszanie_sledzia_desc: "Genetyczne ulepszanie morskich stworzeń do walki - dzięki temu wszystkie dziwne filmy o laserowych rekinach stają się rzeczywistością"
 sp_hovercraft: "Wojskowy poduszkowiec"
 sp_hovercraft_desc: "Zaprojektowany do szybowania nad lądem, wodą i prawdopodobnie z marzeniami o byciu pojazdem przyszłości. Miejmy tylko nadzieję, że nie zatonie."
 sp_amfibia: "Nowoczesna amfibia"
 sp_amfibia_desc: "Kiedy czołgi nie potrafią pływać, a łodzie nie strzelają, to jest twoja następna najlepsza rzecz. Tylko nie spodziewaj się, że wygrasz nim jakiekolwiek wyścigi."
 sp_taran: "Taranujący statek szturmowy"
 sp_taran_desc: "Statek z jednym zadaniem: ROZDUPIĆ. Chcesz doświadczyć czasów starożytnego Rzymu i Grecji? Wystarczy przyspawać metalowy pręt do swojego statku!"

