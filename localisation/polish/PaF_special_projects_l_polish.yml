 zderzacz_modifier: "Badania w akceleratorze cząstek"

##########################
  ### ROCKET PROJECTS ###
##########################

 sp_rockets_cosmos: "Rakieta nośna"
 sp_rockets_cosmos: "[ROOT.GetName] potrafi w kosmos. Wykorzystując tę rakietę nośną możemy sięgnąć gwiazd. Albo odwrotnie."
 sp_rockets_cosmos_2: "Rakieta nośna wielokrotnego użytku"
 sp_rockets_cosmos_2_desc: "Nasz program kosmiczny stał się właśnie o wiele bardziej praktyczny. Teraz możesz polecieć w kosmos...i odstawić rakietę na kolejną misję."

##########################
  ### AIR PROJECTS ###
##########################

 sp_sterowanie_ptakiem: "Kontrola fauny ptasiej"
 sp_sterowanie_ptakiem_desc: "Projekt ukierunkowany na przejęcie kontroli nad przestworzami. Pierwszy cel: Gołębie. To już nie są latające szczury. Teraz to strategiczny kapitał."
 sp_powiekszanie_ptaka: "Modyfikacja fauny ptasiej"
 sp_powiekszanie_ptaka_desc: "Polski orzeł, tylko z ulepszeniami. Majestatyczny w locie, zabójczy w walce. Skoro ma się taki symbol narodowy to można równie dobrze uczynić go niepokonanym."
 sp_napalm: "Bomba napalmowa"
 sp_napalm_desc: "Broń przeznaczona do przekształcenia całego otoczenia w piekło. Uwielbiam zapach napalmu o poranku. A jak wiadomo, każda okazja na grilla to dobra okazja."
 sp_fosfor: "Bomba z białym fosforem"
 sp_fosfor_desc: "Bomba, która nie tylko podpala, lecz przylepia się do wszystkiego co dotknie. Jeśli to będziesz ty...równie dobrze możecie się zaprzyjaźnić bo szybko sobie nie pójdzie."
 sp_vtol: "Pionowzlot"
 sp_vtol_desc: "Stylowy lot, lądowanie superbohatera. Po co wybierać pomiędzy samolotem a śmigłowcem skoro możesz mieć oba naraz?"
 sp_thermobaric: "Broń termobaryczna"
 sp_thermobaric_desc: "Ta bomba nie tylko wybucha - ona upiecze całą okolicę. Tajnym składnikiem jest tutaj tlen, a twoi przeciwnicy to główne danie."
 sp_heavy_machinery_drop: "Pojazd desantowy"
 sp_heavy_machinery_drop_desc: "Żadnych skrzydeł ani kopii. Tylko ciężki pancerz i dramatyczne opadanie. Nowa skrzydlata husaria właśnie wpadła na imprezę."
 sp_zeppelin: "Współczesny sterowiec"
 sp_zeppelin_desc: "Relikt przeszłości przerobiony na nowoczesny styl. Unosząc się nad wszystkim, czasami najlepszą metodą by ktoś Cię zauważył to po prostu bycie horyzontem."
 sp_balon: "Balon stratosferyczny"
 sp_balon_desc: "Balon który unosi się do góry - wysoooookooooooo. Nikt nie będzie słyszał jak szpiegujesz siedząc praktycznie na orbicie. Idealny do podglądania, albo przypadkowego wejścia w przestrzeń powietrzną innego kraju. Ups!"
 sp_stealth: "Technologia obniżonej wykrywalności"
 sp_stealth_desc: "Jest tak niewykrywalny, że nawet piloci muszą się zastanawiać podczas lotu czy leci z nimi samolot. Niewidzialny dla radarów, niewykrywalny dla wroga. No, chyba że nie wiedzą że jest niewidzialny."
 sp_air_fuel: "Tankowanie w powietrzu"
 sp_air_fuel_desc: "Precyzyjny transfer paliwa na 10 kilometrach wysokości. Samoloty też potrzebują przekąsek. I przy okazji hotdożka z Orlenu jak już jest okazja."
 sp_laser_buster: "Laserowo naprowadzana bomba penetrująca"
 sp_laser_buster_desc: "Bomba która nigdy nie chybi, nawet jeśli jesteś 20 pięter pod ziemią. P"
 sp_laser_buster_desc: "A bomb that doesn't miss, even if it's 20 stories underground. Rozpraw się z poważnym problemem inwazji w stylowy sposób, nie ruszając się z kanapy."
 sp_sun_gun: "Orbitalne działo słoneczne"
 sp_sun_gun_desc: "Broń satelitarna kumulująca energię słoneczną w jedną precyzyjną wiązkę. "
 sp_sun_gun_desc: "A satellite-based weapon that channels solar energy into a focused beam. Wykorzystanie energii słonecznej... kto by pomyślał, że ratowanie planety może wiązać się także z jej spopielaniem?"
 sp_chemtrails: "Substancja rozpylana z powietrza"
 sp_chemtrails_desc: "Rozpyla specjalistyczną mieszankę chemiczną z dużych wysokości, pozostawiając długotrwały efekt w atmosferze. Szury, radujcie się!"
 sp_flak_tower: "Wieża przeciwlotnicza"
 sp_flak_tower_desc: "Potężna broń przeciwlotnicza zaprojektowana do odstraszania wszelkich zagrożeń powietrznych. Niezalecana do pokazów lotniczych."
 sp_iron_dome: "Zaawansowany system obrony przeciwlotniczej"
 sp_iron_dome_desc: "Wykorzystuje najnowocześniejszą technologię, aby precyzyjnie zestrzeliwać nadlatujące pociski. Gdyby tylko wszystkie problemy dało się rozwiązać w powietrzu (z wyjątkiem sytuacji, gdy lecisz do Smoleńska)."
 sp_drone_swarm: "Rój dronów"
 sp_drone_swarm_desc: "Rój dronów, sterowanych z precyzją i napędzanych duchem tanich chińskich modeli. Obsługiwany przez entuzjastów z dużymi wąsami w fazie kryzysu wieku średniego."

