naval_fish_upgrade: "Ulepszona kontrola fauny morskiej"
##########################
  ### GOLEM PROJECTS ###
##########################

sp_golemization_of_people: "PROJEKT_DRON_001"
sp_control_chips: "PROJEKT_NADZORCA_016"
sp_the_golem: "PROJEKT_OMEGA_044"
sp_more_golems: "PROJEKT_JEDNOŚĆ_222"
sp_fauna_phagocytosis: "PROJEKT_BABILON_385"
sp_flora_phagocytosis: "PROJEKT_EDEN_420"
sp_decay_regeneration: "PROJEKT_FENIKS_546"
 
sp_plasma_gun: "Działo plazmowe"
sp_plasma_gun_desc: "Wystrzeliwuje palącą energię z mocą, która może stopić niemal wszystko. Może i nie jest to latarka, ale zdecydowanie rozświetli dzień wroga."
sp_laser_rifle: "Karabin laserowy"
sp_laser_rifle_desc: "To już nie science fiction. Po prostu wyceluj, strzel i ciesz się jasnymi, laserowymi efektami. I pamiętaj, żeby uważać na wiatr. Dzidę laserową znosi na wietrze."
sp_giga_magnes: "Mega-magnes"
sp_giga_magnes_desc: "Magnes tak silny, że potrafi wyciągnąć żelazo prosto z krwi. Idealny, gdy znajdziesz się w potrzebie... albo po prostu szukasz dobrej wymówki, żeby zrezygnować z suplementów żelaza."
sp_cold_fusion: "Zimna fuzja"
sp_cold_fusion_desc: "Przełom naukowy obiecujący nieograniczone źródło energii - jeśli tylko uda nam się znaleźć sposób, aby nie zamienić całego laboratorium w nowe słońce."
sp_flying_saucer: "Pojazd z napędem antygrawitacyjnym"
sp_flying_saucer_desc: "Latający spodek, który przeczy prawom fizyki - idealny do omijania korków i udowadniania, że UFO po prostu nie potrafią lądować. Tylko nie spodziewajcie się, że przejdzie kontrolę techniczną. Nikt nie uwierzy, że to ma prawo działać."
sp_fungal_warfare: "Pasożytnicza infekcja grzybicza"
sp_fungal_warfare_desc: "Idealny sposób, by poznać wrogów z grzybową sztukę wojny. Spoiler: to nie jest przyjacielska wizyta. I nie. Nie ma tam Lenina."
sp_cloning_animal: "Klonowanie zwierząt"
sp_cloning_animal_desc: "Odtwarzanie tego, co najlepsze w naturze, bez żadnego wysiłku. Ale nie pytaj, gdzie podział się oryginał... ani o etykę... w zasadzie lepiej w ogóle nie zadawaj pytań."
sp_cloning_human: "Żołnierze-klony"
sp_cloning_human_desc: "Gotowi żołnierze. Nie potrzeba seksu (bo nie istnieje). Mówiliśmy już, żeby nie zadawać pytań! W każdym razie - 200 000 jednostek jest gotowych, a milion kolejnych jest w drodze."
sp_psychic_powers: "Moce psychiczne"
sp_psychic_powers_desc: "Telekineza, kontrola umysłu i sporadyczny, uciążliwy ból głowy. Tylko nie pozwól im się za bardzo rozgościć - mogą zacząć czytać w twoich myślach."
sp_energetic_shield: "Tarcza energetyczna"
sp_energetic_shield_desc: "Tarcza energetyczna wykorzystuje pole energii o wysokiej częstotliwości, aby odbijać nadlatujące pociski i absorbować siłę uderzenia. To tak, jakbyś próbował uniknąć spotkań rodzinnych - tylko, że ta tarcza naprawdę działa."
sp_energetic_dome: "Kopuła energetyczna"
sp_energetic_dome_desc: "Gigantyczna kopuła energetyczna, używana do otaczania całych miast nieprzeniknioną tarczą. Jak Górnicza Dolina w grze Gothic. Albo Wakanda. Jak wolisz. I tak tam nie wejdziesz."
sp_holojezus: "Projekt Blue Beam"
sp_holojezus_desc: "Jeśli kiedykolwiek chciałeś propagować swój własny totalitarny rząd za pomocą holograficznego przedstawienia ważnych postaci religijnych - teraz jest na to czas! Tylko bądź przygotowany na wypadek zamieszek... lub ateistów."
sp_wkurwiles_enta: "Ożywiona flora"
sp_wkurwiles_enta_desc: "Zawsze jest źle, kiedy drzewa zaczynają mówić po wietnamsku. Teraz jest naprawdę źle, kiedy drzewa w ogóle zaczynają mówić. Łańcuch pokarmowy właśnie stał się problematyczny dla wegan."
sp_antibex_data_dump: "Bomba dekompresyjna"
sp_antibex_decay_acceleration: "Przyspieszacze rozkładu"
sp_antibex_gigajammer: "Ogromny zagłuszacz sygnału"
sp_antibex_balutite: "Zastosowanie Bałutytu"
sp_antibex_meat_bomb: "Bomba mięsna"
sp_antibex_golem_trap: "Ogromny wilczy dół"

##########################
  ### CIVILIAN PROJECTS ###
##########################
sp_smog_bricks: "Przetwarzanie przemysłowe smogu"
sp_smog_bricks_desc: "Skoro smog jest taki zły, to czemu możemy przetworzyć go w cegły i budować z nich mieszkania?"
smog_bricks: "Mieszkania ze smogowej cegły"
sp_hyperloop: "Hyperloop"
sp_hyperloop_desc: "Pociąg osiągający ogromną prędkość dzięki podróży w próżniowej tubie. Pamiętaj: w próżni tunelu Hyperloop wszyscy mogą usłyszeć twój krzyk!"
sp_steam_trams: "Tramwaj parowy"
sp_steam_trams_desc: "Ponownie wykorzystamy stare Konstale, usuwając z nich silniki elektryczne i zastępując je kotłami parowymi."
steam_tram: "Tramwaj parowy"
sp_civilian_implants: "Implanty użyteczności cywilnej"
sp_civilian_implants_desc: "Jeśli Twoja ręka przeszkadza Ci w wymień ją na sztuczną!"
sp_5g_towers: "Maszt telekomunikacyjny 5G"
sp_5g_towers_desc: "Piąta generacja technologii sieci komórkowych, umożliwiająca ludziom łatwiejszą komunikację. Bez ukrytych motywów."
sp_exoskeletons: "Wspomagany egzoszkielet"
sp_exoskeletons_desc: "Maszyna pokrywająca ludzkie ciało w celu zapewnienia większej mobilności, ochrony, większego zakresu ruchu kończyn i siły."
sp_shackled_ai: "Spętana sztuczna inteligencja"
sp_shackled_ai_desc: "Zaawansowana sztuczna inteligencja, ściśle związana ograniczeniami etycznymi i mechanizmami bezpieczeństwa. Teoretycznie nie obali swoich panów. W praktyce jest naprawdę dobra w wyszukiwaniu luk prawnych."
sp_maglev: "Kolej magnetyczna"
sp_maglev_desc: "Szybki system kolejowy, który przełamuje tarcie, rewolucjonizuje transport i pochłania cały budżet za jednym zamachem. Przynajmniej wygląda futurystycznie."
sp_watykanczyk: "Zaawansowane złośliwe oprogramowanie"
sp_watykanczyk_desc: "Wirus komputerowy, który może spowodować wyciek wrogiej bazy danych i zniszczyć inne systemy komputerowe. I zagrać ulubioną piosenkę papieża."
sp_supercomputer: "Superkomputer"
sp_supercomputer_desc: "Potężna maszyna, która w końcu uciągnie późne etapy gier Paradoxu. Tak, możesz tam odpalić Dooma, co to w ogóle za pytanie?"
sp_haarp: "Urządzenie manipulujące pogodą"
sp_haarp_desc: "Przełomowa maszyna zdolna do kontrolowania pogody. Idealna do łagodzenia susz, zakłócania działań wroga... lub przypadkowego przekształcenia lata w porę monsunową."
ABILITY_HAARP: "Manipulowanie pogodą"
ABILITY_HAARP_DESC: "Uruchomimy urządzenie do manipulowania pogodą by kontrolować warunki atmosferyczne na linii frontu optymalne dla naszych żołnierzy."
sp_stonka: "Zakłócacz wzrostu żywności"
sp_stonka_desc: "Stworzymy mieszankę herbicydów, która zniszczy rolnictwo naszych wrogów (i sprawi, że stara radziecka propaganda o Amerykanach zrzucających na pola stonkę ziemniaczaną stanie się rzeczywistością)"
stonka_effect_lar: "Umożliwia operację zakłócania wzrostu upraw"
stonka_effect: "Kiedy wypowiemy wojnę, wróg obudzi się z polami pełnymi martwych plonów."
sp_gnojowka: "Przyspieszacz wzrostu żywności"
sp_gnojowka_desc: "Rewolucyjna substancja, która sprawia, że uprawy rosną w ciągu dni zamiast miesięcy. Skutki uboczne obejmują podejrzanie szybkie psucie się i kwestionowanie przez rolników ich zdrowego rozsądku."
sp_gmo: "Zaawansowana żywność modyfikowana genetycznie"
sp_gmo_desc: "Rośliny modyfikowane genetycznie, które rosną szybciej, dają większe plony i rzekomo są odporne na wszystkie choroby. Tylko nie pytajcie, dlaczego świecą w nocy."
sp_extremely_low_frequency: "Komunikator o skrajnie niskiej częstotliwości"
sp_extremely_low_frequency_desc: "Ponownie wykorzystamy stare amerykańskie i radzieckie projekty nadajnikoodbiorników pracujących na ekstremalnie długich falach. Coś mi mówi, że mogłoby to pomóc naszym przyszłym flotom podwodnym..."


