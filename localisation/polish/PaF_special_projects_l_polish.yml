##########################
  ### LAND PROJECTS ###
##########################
 sp_miotacz_ognia: "Współczesny miotacz ognia"
 sp_miotacz_ognia_desc: "Zaawansowana broń zapalająca o najwyższej skuteczności. Bo czasami, stare dobre metody podpalania rzeczy nie wystarczą."
 sp_ognioczolg: "Czołg z miotaczem ognia"
 sp_ognioczolg_desc: "Dobra, to słuchajcie tego - weźmiemy miotacz ognia, zrobimy go gigantycznym i UPCHNIEMY DO CZOŁGU. Genialne, co nie?"
 sp_pervitin: "Wojskowe stymulanty"
 sp_pervitin_desc: "Najnowocześniejszy wspomagacz sprawiający że żołnierze nie śpią, są czujni i niepowstrzymani. Sen jest dla słabych, ale najwyraźniej taka również jest funkcjonująca wątroba. Uwaga - silnie uzależniające!"
 sp_power_armor: "Pancerz wspomagany"
 sp_power_armor_desc: "Pancerz sprawiający, że jesteś niepokonany. Zupełnie jak w tych starych grach postapokaliptycznych. Szkoda tylko, że nie mamy do nich zapasowych części...albo gigantycznych krypt w których moglibyśmy żyć."
 sp_kontrola_knura: "Kontrola lądowej fauny"
 sp_kontrola_knura_desc: "Program przygotowania zwierząt do działań wojennych - bo po co szkolić ludzi, skoro można poszczuć wroga niedźwiedziem z rakietnicą? PETA może się z tym nie zgodzić..."
 sp_powiekszanie_knura: "Modyfikacja lądowej fauny"
 sp_powiekszanie_knura_desc: "Genetyczne ulepszanie zwierząt w celu stworzenia wielkich i twardych potworów. Zwykły koń jest trochę passe kiedy możesz mieć uzbrojonego słonia bojowego z rakietnicami zamiast kłów."
 sp_fat_tank: "Superciężki czołg"
 sp_fat_tank_desc: "Arcymoloch zniszczenia na gąsienicach. Porusza się wolniej od ślimaka, ale przynajmniej będziesz miał czas by zrobić herbatę zanim wgniecie w ziemię wszystko na swojej drodze. A jak to skręca? To nie skręca, to jedzie prosto na Berlin."
 sp_tesla_gun: "Działo Tesli"
 sp_tesla_gun_desc: "Broń o wysokim napięciu inspirowana geniuszem Nikoli Tesli. O wiele bardziej destrukcyjna niż jakikolwiek samochód elektryczny, ale może dojść do spięcia jeśli zapomnisz jej naładować. I czasem może...wybuchnąć. Tak jak Pan Tesla powiedział."
 sp_remote_mine: "Lądowy pojazd bezzałogowy"
 sp_remote_mine_desc: "Zdalnie sterowana mina. Idealna na linie frontu...i do upewnienia się że nigdy nie dostaniesz pilota z powrotem."
 sp_robopies: "Robo-pies"
 sp_robopies_desc: "Robotyczny piesek zaprojektowany z myślą o ciężkim terenie. Będzie aportować, ale nie zdziw się jeśli zamiast piłki przyniesie z powrotem granat przeciwnika."
 sp_robot: "Wojskowy robot"
 sp_robot_desc: "Perfekcyjna maszyna do zabijania. Asimov prawdopodobnie przewraca się w grobie patrząc na to ile praw robotyki złamaliśmy. Przynajmniej nasi wrogowie również przewrócą się na ich widok. I się już nie podniosą."
 sp_mech: "Mech bojowy"
 sp_mech_desc: "Wielka machina wojenna zaprojektowana z myślą o wgniataniu w ziemię przeciwników. Za szybka to ona nie jest, ale wszyscy ją zapamiętają gdy przybędzie na pole bitwy."
 sp_gigamech: "Supermech bojowy"
 sp_gigamech_desc: "Jeszcze większa machina wojenna miażdżąca wszystko na swojej drodze. Wyobraź sobie Pacific Rim, ale gdy się zepsuje to musisz się użerać z Polską biurokracją."
 sp_android: "Wojskowy android"
 sp_android_desc: "Pozbawiona emocji i w pełni posłuszna maszyna bojowa. Tylko nie proś jej żeby 'znalazła swoją własną drogę' - to nigdy nie kończy się dobrze."
 sp_jetpack: "Plecak odrzutowy"
 sp_jetpack_desc: "Przyszłość osobistych podróży - bo kto potrzebuje dróg kiedy możesz być wolny jak ptak? Tylko pamiętaj że żaden z Ciebie CJ, więc nie celuj w najbliższą górę."
 sp_jammer: "Zaawansowany zagłuszacz sygnału"
 sp_jammer_desc: "Najnowocześniejsze urządzenie zaprojektowane do zakłócania wrogich transmisji. Taki blackout komunikacyjny - idealny do upewnienia się że wróg nie wezwie posiłków...albo jeśli potrzebujesz trochę ciszy i spokoju."
 sp_kwassenwerfer: "Działo strumieniowe o wysokim ciśnieniu"
 sp_kwassenwerfer_desc: "Działko zaprojektowane do niszczenia przeszkód. Zaczęło swoją karierę jako działko wodne, ale bardziej tu chodzi o działko niż o wodę. Poza tym, nikt nie mówił, że to musi być na wodę!"


##########################
  ### CBRN PROJECTS ###
##########################

 sp_bio_engineering: "Bioinżynieria żołnierzy"
 sp_bio_engineering_desc: "Ci żołnierze to najszybsze, najsilniejsze i najbardziej odporne jednostki w armii. Nie potrzebujesz ciężkiego pancerza jeśli to twoje geny są twoją najlepszą obroną. Tylko nie wspominajcie nic o 'chaosie' w ich obecności."
 bio_engineered_soldiers: "Bioinżynieria żołnierzy"
 sp_pavulon_injectors: "Zastrzyki z Pavulonem"
 sp_pavulon_injectors_desc: "Narzędzie wstrzykujące śmiertelną dawkę Pavulonu z zabójczą precyzją. Działa jak środek uspokajający. No, tylko że się już nigdy nie obudzisz."
 sp_gay_bomb: "Gej bomba"
 sp_gay_bomb_desc: "'Broń chemiczna' zaprojektowana w celu dezorientacji i zmylenia wroga. Bez żadnych eksplozji...jedynie z ogromną potrzebą miłości i dumy. Generalnie nic czego można się spodziewać na polu bitwy."
 sp_gas_one: "Nękające bojowe środki trujące"
 sp_gas_one_desc: "Niestabilna mieszanka gazów, która sprawia że wróg pragnie być gdziekolwiek byle daleko stąd. Wojna to piekło, ale to jest po prostu nieuprzejme."
 sp_gas_two: "Obezwładniające bojowe środki trujące"
 sp_gas_two_desc: "Perfekcyjna mieszanka, która uśpi twoich wrogów bez pójścia krok dalej. Będą nieprzytomni, ale nie AŻ tak."
 sp_gas_three: "Uśmiercające bojowe środki trujące"
 sp_gas_three_desc: "Śmiertelna mieszanka przypominająca najgorsze wspomnienia I Wojny Światowej. To nawet nie tyle trucizna co drugi najgorszy historyczny koszmar w nowoczesnym wydaniu."
 sp_emp: "Impuls elektromagnetyczny"
 sp_emp_desc: "Fala uderzeniowa której nie obchodzi twój sprzęt. Jeden puls i wszystko co posiada układ scalony staje się tak użyteczne jak kamienne tablice w erze internetu. No chyba że nadal używasz Nokii."
 sp_sonic_weapons: "Broń soniczna" #brązowa nuta
 sp_sonic_weapons_desc: "Broń zaprojektowana do obezwładniania dźwiękiem. Nie tylko sprawia że piszczą Ci piszczele - efekt uboczny to drastyczny cios w twoją godność."
 sp_heat_ray: "Mikrofalowa Broń Obezwładniająca"
 sp_heat_ray_desc: "Wysyła wiązki fal tak gorące, że cele zmieniają się popiół szybciej niż kiełbasy na grillu w Lipcu. Zawsze wiedzieliśmy że słońce to kawał skurwysyna."
 sp_przeziebienie: "Ukierunkowana śmiertelna choroba"
 sp_przeziebienie_desc: "Choroba specjalnie zaprojektowana pod twojego wroga. Uwaga: rozprzestrzenia się szybciej niż plotki. I kwarantanna tym razem nie pomoże."
 sp_dirty_bomb: "Brudna bomba"
 sp_dirty_bomb_desc: "Bomba łącząca w sobie moc atomu i truciznę. To najgorszego rodzaju przyjęcie urodzinowe, gdzie prezentem jest powolna śmierć z powodu promieniowania."
 sp_mini_nuke: "Miniaturowa bomba atomowa"
 sp_mini_nuke_desc: "Malutka atomóweczka z ogromnym pierdolnięciem. Jeśli wydaje Ci się że już i tak daliśmy zbyt wiele odniesień do Fallouta...to ta nie jest aż taka wielka. Zmieści Ci się w kieszeni."
 sp_dupny_zderzacz_farfocli: "Akcelerator cząstek"
 sp_dupny_zderzacz_farfocli_desc: "Maszyna przyspieszająca cząsteczki do zawrotnych prędkości. Trochę jak żużel - jeździsz w kółko ale tutaj ma to sens. No i nie ma obaw że cząsteczka zostanie napadnięta przez kiboli Falubazu."

 mini_nuke_equipment: "Zminiaturyzowany ładunek atomowy"
 mini_nuke_equipment_1: "Zminiaturyzowany ładunek atomowy"
 heat_ray_equipment: "Mikrofalowa Broń Obezwładniająca"
 heat_ray_equipment_1: "Mikrofalowa Broń Obezwładniająca"
 lethal_infection_tech: "Rozpylanie ukierunkowanej śmiertelnej choroby"
 
 chemical_specialist: "Specjalista chemiczny"
 chemical_specialist_desc: "§LTen dowódca ma dostęp do arsenału broni chemicznej, gotowej do użycia na polu walki przeciwko wrogom.§!"
 chemical_specialist_prerequisite_tooltip: "Ukończono specjalny projekt §YŚrodków Trujących§!."
 ABILITY_CHEMICAL_ATTACK: "Atak chemiczny"
 ABILITY_CHEMICAL_ATTACK_DESC: "Wykorzystamy środki trujące w boju - pokrywając naszych wrogów trującymi oparami, podczas gdy nasi żołnierze będą gotowi na wykorzystanie ich chwili słabości."
 gas_one_tooltip: "Odblokowuje umiejętność generała §YSpecjalista chemiczny§!, która daje dostęp do umiejętności §YAtak chemiczny§!"
 gas_two_tooltip: "Umiejętność §YAtaku chemicznego§! stanie się silniejsza."

 sp_lethal_infection_decision_info: "Odblokowuje decyzje, dzięki której podczas wojny będziemy mogli wykorzystać zaraźliwe patogeny by szerzyć chaos w szeregach wroga."
 lethal_infection_state_decision: "Rozpylanie ukierunkowanej śmiertelnej choroby"
 lethal_infection_state_decision_desc: "Rozpylimy naszą specjalną zarazę by zasiać chaos w szeregach wroga."
 
 sp_emp_decision_info: "Odblokowuje możliwość ataku urządzeniem z impulsem elektromagnetycznym poprzez decyzje."
 emp_state_decision: "Atak impulsem elektromagnetycznym"
 emp_state_decision_desc: "Wykorzystamy impuls elektromagnetyczny, drastycznie obniżając możliwości produkcji energii przeciwnika."
 EMP_attack_state_tooltip: "Produkcja energii spadnie do §Rzera§!"
 
