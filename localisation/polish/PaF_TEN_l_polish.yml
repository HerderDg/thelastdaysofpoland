unification.155.t: "[GetNewspaper]Państwo Dziesiętne jednoczy województwo lubelskie!"
unification.155.desc: "Z peryferyjnego regionu Lubelszczyzny docierają do nas niepokojące wieści. Podobno całe województwo znalazło się pod kontrolą osobliwego rządu Tadeusza Sznuka. Podstawą nietypowego systemu politycznego państwa jest teleturniej \"Jeden z Dziesięciu\", który Sznuk prowadził przez ostatnie trzy dekady. To samo w sobie byłoby już wystarczająco dziwne, ale doniesienia wskazują, że zamiast pokoju mieszkańcy tak zwanego Państwa Dziesiętnego są poddawani coraz brutalniejszym represjom. Obywatele są regularnie zmuszani do udziału w teleturniejach, a błędne odpowiedzi skutkują surowymi karami. Niektóre pogłoski mówią nawet, że zbyt niskie wyniki bywają karane natychmiastową egzekucją. Ludzie coraz bardziej się niepokoją i nie rozumieją, jak Sznuk, słynący z nienagannych manier dżentelmen, zdołał stworzyć tak wynaturzony system. W obliczu jawnie okrutnych prześladowań jego rosnąca władza budzi jednak uzasadniony niepokój."
unification.155.a: "Wygląda na to, że staruszek postradał zmysły."
 
super.155.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.155.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.155.a: "Wreszcie zjednoczeni."