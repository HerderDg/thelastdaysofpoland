CIE_they_are_coming: "Nadchodzą!"
CIE_they_are_coming_desc: ""SZCZYRK UPADŁ!"\n\nTa wieść spadła na Wiślan niczym grom z jasnego nieba. Małysz czuł się jak po nieudanym skoku. Oddziały broniące Szczyrku zostały rozbite i wycofały się w nieładzie do Wisły i Brennej. Odwrót szybko przerodził się w paniczną ucieczkę, podczas której poniesiono większe  straty niż w samej bitwie. \n\nTą sytuację bezwzględnie wykorzystali bracia Golec. Zbójeckie bandy uderzyły w powstały wyłom jak ostra ciupaga. Ich kolumny już widać z najwyższych gór otaczających Wisłę. Na miasto padł blady strach. Wielu starców i dzieci już udało się w stronę czeskiej granicy, aby uciec przed zbójami. Mimo to Adam Małysz nie  opuścił swojej rodzinnej ziemi. Motywuje on Wiślan do walki i zastanawia  się, jak odmienić losy wojny." 

