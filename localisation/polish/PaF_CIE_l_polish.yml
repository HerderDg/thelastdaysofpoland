CIE_keep_malysz: "Pozostaw Małysza na stanowisku"
CIE_keep_malysz_desc: "Od czasu przejścia pod protekcję europejską w Wiśle szumiało od plotek o usunięciu Małysza. Jest on ostatnią przeszkodą na drodze do pełnego włączenia miasta w struktury okupacyjne.\n\nTym większe było zdziwienie, gdy okazało się, że Adam pozostanie na czele Państwa Wiślańskiego. Ta decyzja uspokoiła wielu Górali, dzięki czemu skończyła się fala dezercji z armii - a Wisła zachowała pewną minimalną niezależność. \n\nOczywiście - Niemcy z chęcią wymieniliby polskiego orła na jakiegoś miernego, biernego i wiernego eurokratę. Jednakże znaczącą większość wojsk europejskich w regionie stanowią Czesi, którzy wyrazili zdecydowany sprzeciw wobec tych planów. Wynikał on z obaw przed otwartym buntem, jaki najpewniej nastąpiłby po odwołaniu Małysza. Poza tym ciężka zima wywołała trudności logistyczne, więc Europejczycy muszą współpracować z Góralami, żeby przetrwać."

CIE_czech_investments: "Czeskie inwestycje"
CIE_czech_investments_desc: "Europejska interwencja uratowała nie tylko niepodległość Wisły - ale również jej gospodarkę. Czesi są zainteresowani tym, żeby ich żołnierze nie umierali z zimna ani głodu. I dlatego lokalne hurtownie zostały zalane falą czeskich produktów niemal natychmiast po ustabilizowaniu sytuacji militarnej. Doszło do tego, że łatwiej jest kupić kofolę - niż coca-colę.\n\nPoza tym, rozwija się hotel transgraniczny. Ilość odwiedzających Wielką Czantorię jest niemal tak samo duża, jak przed Upadkiem. Tylko, że obecnie nie są to turyści - lecz handlarze, lub żołnierze na przepustce.\n\nNawet Niemcy, pomimo swojej buty mają pewien wkład tą pozytywną sytuację. Dzięki intensywnym staraniom Małysza wydzielili oni część środków z funduszy unijnych na rozbudowę wiślańskich dróg i magazynów - co poprawiło sytuację zaopatrzeniową zarówno dla cywili, jak i wojska."

CIE_tourist_resort_no_more: "Turyści nie przyjadą."
CIE_tourist_resort_no_more_desc: "Przed Upadkiem Wisła była jednym z największych ośrodków turystycznych w Polsce. Te czasy przeminęły z wiatrem. Luksusowe hotele stały się kwaterami niemieckich generałów - a te mniej wystawne przerobiono na koszary czeskich oddziałów. Nawet pies z kulawą nogą nie przyjedzie tu na wypoczynek.\n\nWywołało to zapaść lokalnej gospodarki. Dawni hotelarze teraz sami desperacko szukają najtańszego lokum, żeby przezimować. Sprzedawcy oscypków i pamiątek nawet nie rozstawiają straganów - i tak nikt niczego nie kupi.\n\nProblemy te spędzają sen z powiek Adama Małysza. Dotychczasowy model gospodarczy Wisły się wyczerpał - i pilnie trzeba wymyślić nowy. Taki, który nie będzie zależał od kaprysu turystów, ani nieprzewidywalnej sytuacji geopolitycznej - tylko pozwoli Wiślanom być Bacami na własnym pastwisku."

CIE_wrong_place_wrong_time: "Złe miejsce, zły czas"
CIE_wrong_place_wrong_time_desc: "Największy kryzys w historii Unii Europejskiej dotarł do Polski. Siły Europaarmee rozpierzchły się na cztery wiatry, a struktury eurokomisariatów rozsypały się jak domek z kart.\n\nWisła nie jest wyjątkiem od tej reguły. Trwający niemal od początku interwencji spór niemieckich generałów z ich czeskimi podwładnymi osiągnął punkt krytyczny. Czesi po prostu przestali wykonywać rozkazy i rozpoczęli odwrót do  Cieszyna. Niemcy byli całkowicie bezsilni wobec tego, więc sami uciekli gdzie pieprz rośnie.\n\nAdam Małysz zawsze szuka pozytywów. I dlatego cieszy się on z takiego obrotu spraw. Unijni oficerowie nie mogą sprawować kontroli nad Wisłą, skoro ich tu nie ma. A zatem Górale odzyskali wolność i swobodę bez przelewu krwi. Niestety: to może nie potrwać zbyt długo. Bracia Golec już ostrzą sobie zęby na miasto pozbawione europejskiej ochrony..."

CIE_vistulan_buffer_zone: "Zaproponuj utworzenie Wiślańskiej Strefy Buforowej"
CIE_vistulan_buffer_zone_desc: "Jedną z przyczyn rozpadu eurokomisariatów były potężne protesty społeczne, które ogarnęły obszar niemal całej okupowanej Polski. Dotyczy to również znajdującego się pod czeskim zarządem Mandatu Cieszyńskiego. Jego struktury chwieją się w posadach i nie przetrwają bez pomocy z zewnątrz.\n\nJest to jedyny sojusznik Wisły, więc jego rozpad pozostawiłby siły Małysza w izolacji. Na szczęście Adam ma plan. Zaproponował on Czechom utworzenie strefy buforowej, dzięki której ich siły zostałyby odciążone, a problem protestów rozwiązany. Nastąpiłoby to dzięki przekazaniu terenów etnicznie polskich pod kontrolę Państwa Wiślańskiego.\n\n Przyjęcie tej oferty byłoby ogromnym sukcesem Małysza. Jego państwo znacznie wzrosłoby w siłę - dzięki czemu miałby więcej środków, żeby bronić się przed najazdem braci Golec. No i Cieszyn stanowiłby dobrą bazę wyjściową do wpływania na sytuację w największym mieście regionu: Bielsku-Białej."

