CIE_plead_for_intervention: "Poproś o interwencję!"
CIE_plead_for_intervention_desc: "Proszenie o wsparcie jest przez niektórych odbierane jako oznaka słabości i tchórzostwa. Nic bardziej mylnego: dojrzały przywódca musi umieć schować dumę do kieszeni, gdy wymaga tego dobro jego ludzi.\n\nWłaśnie takim przywódcą jest Adam Małysz. Po porażce w Szczyrku zwrócił się on o pomoc do sił europejskich stacjonujących w Cieszynie. Wielu krytykuje tę decyzję - niektórzy wręcz oskarżają go o zdradę. Ale czy zdradą jest obrona wolności przed tyranami, którzy chcą ją zniszczyć? Czy jest coś bardziej patriotycznego niż przekonanie Cudzoziemca do przelania krwi za Polskę? \n\nPoza tym, nie wszyscy Europejczycy to Niemcy. Znaczną część wojsk Mandatu Cieszyńskiego stanowią Czesi. Nie będą brutalnymi okupantami - tylko przyjaznymi sojusznikami. Prawda?"

CIE_heavy_price_to_pay: "Wysoka cena do zapłacenia"
CIE_heavy_price_to_pay_desc: "Trudne decyzje przynoszą równie trudne konsekwencje. Nie inaczej jest w przypadku interwencji sił europejskich w obronie Państwa Wiślańskiego. Może ona uratować Wisłę przed zakusami braci Golec - ale za jaką cenę?\n\nNiemieccy oficerowie dowodzący wojskami unijnymi odnoszą się do Górali z pogardą i pychą. W zamian za ochronę chcą narzucić Wiślanom ciężkie jarzmo. Tereny otaczające miasto Wisłę ulegną przekształceniu w strefę buforową, a oddziały wierne Małyszowi będą wcielone do struktur armii europejskiej. Administracja cywilna zostanie niemal całkowicie podporządkowana rozkazom z Cieszyna. \n\nPoza tym, każdy urzędnik, lub oficer będzie poddany ocenie lojalności. Ci, którzy przejdą ją pozytywnie otrzymają kartę G - goralenvolk. A co z tymi, którzy zostaną ocenieni negatywnie? Adam spędził wiele bezsennych nocy zastanawiając się czy warto się zgodzić na tak ciężkie warunki - ale nie miał wyboru."

CIE_grenzzone_weichsel: "Grenzzone Weichsel"
CIE_grenzzone_weichsel_desc: "Rozpoczynając powstanie przeciw tyranii Braci Golec Adam Małysz walczył o demokrację i wolność. Niestety - wygląda na to, że Wisła wpadła ze zbójeckiego deszczu pod niemiecką rynnę.\n\nWiększość oddziałów europejskich stanowią Czesi, którzy dobrze traktują Górali. Jednakże, niemieccy generałowie mają inne podejście. Szczegółowo kontrolują oni każdą, nawet najdrobniejszą decyzję podejmowaną w wiślańskim ratuszu.  Nawet najłagodniejsza krytyka ich postępowania natychmiast spotyka się z oskarżeniami o rewizjonizm i eurofobię. Poza tym, weryfikacja lojalności została rozszerzona na wszystkich Górali. Na szczęście, dzięki działaniom Małysza nieprzyznanie karty G nie wiąże się z większymi konsekwencjami - przynajmniej na razie. Państewko Wiślańskie jest całkowicie zdane na łaskę Mandatu Cieszyńskiego, a złośliwi zaczęli określać je mianem Grenzzone Weichsel.\n\nSytuacja ta ma też swoje dobre strony. Zbójeckie bandy zatrzymały swój marsz i nie odważą się zaatakować unijnego terytorium. Siły wiślańskie mogą złapać oddech - chociaż będą musiały zrobić to pod niemieckim butem."

