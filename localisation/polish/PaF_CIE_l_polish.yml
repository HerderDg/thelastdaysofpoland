#####  CHARACTERS  #####


POLITICS_ADAM_MALYSZ_DESC: "Adam Małysz był bohaterem narodowym. A potem naród jako zjednoczony monolit przestał istnieć, rozdzielony murem. Wrócił do rodzinnej Wisły, pragnąc w spokoju przetrwać nadchodzącą burzę. To... nie było mu dane, ponieważ okazja, by uratować swoją najbliższą okolicę przed ogniem pochłaniającym cały kraj, szybko zmusiła go do porzucenia emerytury. \n\nMałysz dołączył do nowo utworzonej Rady Rządu Tymczasowego Republiki Podbeskidzkiej jako jeden z doradców i przedstawicieli społecznych. Miał nadzieję, że choć w niewielkim stopniu przyczyni się do przetrwania demokracji w Polsce. Pokój jednak nie trwał wiecznie - prezydent Republiki Podbeskidzkiej, Jerzy Buzek, zachorował i zmarł.\n\nWraz ze śmiercią prezydenta i coraz częstszymi najazdami lokalnych awanturników Rada pogrążyła się w chaosie, niezdolna do utrwalenia pozycji swojego państewka. Dni kłótni i paniki zamieniły się w tygodnie, a i tak trudna sytuacja republiki stała się jeszcze gorsza. Po dwóch miesiącach i kilkuset zabitych cywilach bracia Golec - wraz z lokalnymi siłami porządkowymi - siłą wkroczyli do ratusza w Bielsku-Białej, aresztowali członków Rady, ogłosili się tymczasowymi władcami i szybko pogrążyli kraj w walkach wewnętrznych z tymi, którzy nie chcieli służyć i żyć pod nawet tymczasową juntą, skoro była ona gotowa poświęcić wszystko w imię stabilności, sięgając po metody tak krwawe jak stosowane przez górskich zbójników.\n\nMałysz był jednym z nielicznych, których wypuszczono, a to wszystko dzięki jego niepodważalnej opinii publicznej. Po zamachu ruszył na wschód - najpierw do Cieszyna, potem do Wisły - organizując ruch oporu i formując siły kontrrewolucyjne, by odzyskać Bielsko-Białą i przywrócić Republikę.\n\nBracia Golec, dowiedziawszy się o tej zdradzie, złamali przynajmniej jeden puzon i dwie trąbki.\n\nTeraz bębny wojny grzmią coraz głośniej na granicach Beskidu Śląskiego. Czy sama siła woli wystarczy, by ostatni obrońca wolności w regionie odniósł zwycięstwo? Czy może młode państwo naszego Polskiego Orła stanie się tak podłe jak siły, przeciwko którym próbuje walczyć?"

##Events##
malysz_start.8.t: "Uchodźcy ze Szczyrku"
malysz_start.8.desc: "Małysz chciał walczyć do końca. Był gotowy umrzeć razem z ludźmi, którym przewodził. Jednakże nie chciał narażać swojej rodziny ani na widok walk, ani na to, co mogliby im zrobić zbóje. Stał razem z żoną obok samochodu, sprawdzali, czy na pewno wszystko zostało spakowane. Już mieli się przytulić i pożegnać, gdy ich intymną chwilę przerwał błagalny krzyk:\n\n-POMOCY! PANIE ADAMIE, POMOCY! -przed bramą, w kałuży błota klęczała starsza Pani z zawiniątkiem w ręku. Sportowiec podszedł bliżej i zobaczył, że to śpiące niemowlę.\n\n-Czego Pani chce? - odpowiedział nieco zirytowany. Przypomniały mu się wszystkie sytuacje, gdy do jego drzwi pukali rzekomo chorzy ludzie, którzy okazywali się oszustami.\n\n-Ja sobie jakoś dam radę, tu chodzi o dziecko. Zbójcy spalili nasz dom, a rodzice nie zdążyli uciec ze Szczyrku. Gdyby tylko znalazło się dla małej miejsce w tutejszym żłobku, choćby i tymczasowo...-Po tych słowach Adam miał pewność, że kobieta jest uczciwa. Oszuści zawsze prosili o pieniądze dla siebie, a nigdy o realną pomoc dla innych.\n\n-Przyszłyscie same, czy jest Was więcej?\n\n-Panie, ze Szczyrku ludzie uciekają jak owce przed wilkami. Kto tylko umiał chodzić - już jest w Wiśle.\n\n-Mam dwa pomysły na rozwiązanie tej sytuacji. Proszę mi dać chwilkę na zastanowienie - Małysz ułożył swoją dłoń na brodzie. Mógł przyjąć uchodźców w Wiśle albo skierować ich do Czech. Pierwsza opcja przyniosłaby szereg korzyści: jeśli ktoś umie chodzić - to potrafi też pracować. A gdyby uchodźcy wykonywali choćby i proste zadania - to i tak znacząco odciążyliby obrońców Wisły. Poza tym ugoszczenie ich pomogłoby Adamowi w budowaniu wizerunku przyjaznego i łagodnego przywódcy. Z drugiej strony wiązałoby się to z licznymi trudnościami. Trzeba by znaleźć dla tych ludzi schronienie, jedzenie, ubrania... \n\nNo i odesłanie ich do Czech nie byłoby aż tak straszne. Po pierwsze: to rzut beretem z Wisły. Po drugie: droga nie byłaby taka trudna, gdyż zapewniłby byłym mieszkańcom Szczyrku przewodników oraz prowiant. A to wymagałoby dużo mniej pracy i środków niż zakwaterowanie ich na miejscu. No i po trzecie: cały wysiłek Wiślan jest obecnie skupiony na organizowaniu obrony przed zbójeckimi bandami. Jeśli uchodźcy zabiorą więcej, niż dadzą od siebie, to rodzinne miasto Małysza może upaść. A w takim scenariuszu przyjęcie ich zaszkodziłoby wszystkim i nie pomogłoby nikomu. Jednakże był pewien haczyk: co jeśli Czesi nie przepuszczą tych ludzi przez granicę? Co, jeśli będą musieli koczować tuż przed schroniskiem na Czantorii - od którego czeska straż graniczna odpędzi ich gazem łzawiącym i pałkami? W każdym razie Adam wiedział jedno: nie ma czasu, aby rozdrabniać się na drobne. Decyzja, jaką podejmie wobec tej kobiety zostanie zastosowana wobec wszystkich uchodźców. Wszyscy - albo nikt."
malysz_start.8.a: "Przyjmiemy Was."
malysz_start.8.b: "Pomożemy Wam w dalszej drodze."


malysz_start.11.t: "Trudna współpraca"
malysz_start.11.desc: "Kolejka na wiślańskim rynku była dłuższa, niż najdalszy skok Małysza. Ludzie stali w ciszy, pomimo deszczu i zimna. Od czasu do czasu słychać było płacz dziecka, lub głośne kichnięcie. Adam stał jak każdy inny Wiślanin, przemieszczając się powoli jak żółw. Czas dłużył się niemiłosiernie. Co kilka minut pojedyncze osoby wchodziły i wychodziły z domu zdrojowego. Nad wejściem do niego rozwieszono napis: "PUNKT SPISU LUDNOŚCI", a przed drzwiami stali dwaj żołnierze Europaarmee. Nagle z budynku dobiegł głośny krzyk.\n\nPOLNISCHE SCHWEINE! - z domu wyszedł starszy pan, wspierając się o lasce. W jego twarzy widać było zmartwienie i strach.\n\n-Tego już za wiele. - powiedział Małysz, wychodząc z kolejki. Szybkim krokiem podszedł do drzwi.\n\n-Ci Niemcy na za dużo sobie pozwalają - powiedział głośno, gdy otwierał drzwi. Europejczycy nie zatrzymali go. \n\nW sali dawnej restauracji złączono z sobą kilka stołów. Siedzieli za nimi oficerowie unijni w galowych mundurach. Małysz podszedł do nich zdecydowanym krokiem.\n\nKto tu dowodzi?! - zapytał po niemiecku. Jeden z Eurokomisarzy odpowiedział:\n\n-Jeśli ma Pan jakieś zastrzeżenia co do spisu ludności, proszę wypełnić formularz PS-239 i...\n\n-Wkroczyliście, żeby chronić nas przed zbójami, a tymczasem zachowujecie się jak okupanci.\n\n-Pro...\n\nJeśli chcecie utrzymać strefę buforową, to musicie mieć poparcie miejscowej ludności. - Adam nie dał sobie przerwać. - A jeśli będziecie zachowywać się tak dalej, to ludzie szybko dojdą do wniosku, że wolą żyć pod butem zbójów, którzy przynajmniej mówią po polsku. To nie może tak dalej być.\n\nW pomieszczeniu zapanowała cisza, a napięcie było takie, że można by je nożem kroić. Adam wiedział, że podjął ogromne ryzyko. Wiedział, co działo się z tymi, którzy krytykowali Eurokomisarzy. Nie wiedział natomiast, czy popularność ochroni go przed aresztowaniem i zesłaniem na daleką wyspę. Niemiec wziął głęboki oddech.\n\n-Jakie zmiany Pan proponuje? - zapytał, spuszczając głowę. Patrzył na skoczka złym wzrokiem gestapowca, który chciałby skatować kogoś, kogo nie mógł nawet tknąć. Małysz uśmiechnął się - wygrał.\n\n-Po pierwsze, od teraz to wy przychodzicie do ludzi, a nie ludzie do was. Nic nie rujnuje wizerunku tak, jak zmuszanie ludzi do stania w kolejkach. Po drugie, jeśli jeszcze raz będziecie kogoś obrażać - to zerwiemy współpracę. No i po trzecie, po co to wszystko robicie?\n\n-Rozpad Polski spowodował tak duże przemieszczenia ludności, że konieczny jest nowy spis powszechny.\n\n-Skoro to tylko spis powszechny, to czemu na tym stole leżą karty G?- Niemiec był wyraźnie zbity z tropu.\n\n-Powiedziałem to już raz, ale będę powtarzał do skutku. Możecie sobie wydawać te świstki, proszę was bardzo. Ale. Jeśli usłyszę, że ktoś stracił pracę, lub przeżył jakieś nieprzyjemności, bo ich nie miał - to będziecie uciekać jak turysta przed wściekłą kozą. Czy to jest jasne?\n\n-Ja - oficer poczerwieniał ze złości.\n\nDobrze. W takim razie zapamiętajcie sobie jedno:"
malysz_start.11.a: "My szanujemy Was, więc wy szanujcie nas."


malysz_start.13.t: "Odwrót!"
malysz_start.13.desc: "-Zapomnijcie o Grenzzone! Ograniczamy nasze straty i wycofujemy się! Każdy, kto nie stawi się w punkcie zbiórki do 14:20, zostanie uznany za marudera i będzie musiał radzić sobie sam! - powiedziałem do krótkofalówki. Po raz ostatni rozejrzałem się po pomieszczeniu sztabu. Gdy miałem pewność, że nic cennego nie zostało - wylałem na drewnianą podłogę kanister benzyny, a wychodząc, rzuciłem za sobą zapałkę. Gdy tylko znalazłem się w bezpiecznej odległości, poprawiłem swój mundur i monokl. Ordnung must sein, a jako Eurokommissar muszę dbać o wizerunek, zwłaszcza w takich chwilach. Przed sobą widziałem parking, na którym gromadzili się moi podwładni. Niemal wszystkie miejsca były zajęte przez czołgi, wozy opancerzone, lub ciężarówki. Żołnierze uwijali się jak mrówki, pakując do pojazdów, co tylko się dało. Nagle drogę zastąpiło mi trzech Polaków.\n\n-Wycofujecie się, chociaż nie ponieśliście niemal żadnych strat?! Jesteście nie tylko tchórzami, ale i podpalaczami - powiedział najstarszy z nich, wskazując na pożar, który rozgorzał za moimi plecami. Okropnie kaleczył piękną niemiecką mowę. Próbowałem ich wyminąć bez słowa, ale nie pozwalali na to. W końcu odpowiedziałem:\n\n-To nie jest żaden odwrót, tylko przejście na z góry upatrzone pozycje. To reakcja sztabu generalnego Europaarmee na falę eurofobicznych aktów przemocy w Polsce. Zapewniam Państwa, iż Weichsel na zawsze pozostanie głęboko w sercu europejskiej wspólnoty - powiedziałem tak spokojnie, jak się dało.\n\n-Nie w sercu, tylko w dupie. Gdybyście rzeczywiście o nas dbali, to poinformowalibyście nas wcześniej o waszych zamiarach.- jego wulgarność zszokowała mnie.\n\n-Przekazanie Wam ściśle tajnych informacji o naszych manewrach naraziłoby moje oddziały na niebezpieczeństwo. A jeśli dalej będą mi Państwo zagradzać drogę - to uznam to za akt agresji i Eurofobii. - Starszy Polak już chciał mi odpowiedzieć, ale jego wyższy kolega powstrzymał go. Przez chwilę rozmawiali po polsku, podniesionymi głosami. Wyglądali wręcz, jakby się kłócili. Nic z tego nie rozumiałem - a dodatkowo nie mogłem się ruszyć, bo ciągle obserwował mnie trzeci z nich. Był dobrze zbudowany i nosił na sobie mundur ochroniarza. Po chwili starszy pan westchnął i powiedział do mnie: \n\n-Przepraszam, proszę wybaczyć mi moją emocjonalną reakcję. Wynikała ona z tego, iż jestem właścicielem budynku, który teraz płonie. Proszę przekazać Pana kolegom w Cieszynie, iż jesteśmy wdzięczni za Waszą pomoc, oraz że chcemy podtrzymać dobrosąsiedzkie stosunki i kontynuować współpracę. Może Pan przejść. - Polacy rozstąpili się przede mną. Tak gwałtowna zmiana zachowania bardzo mnie zdziwiła, więc powiedziałem tylko: \n\n-Danke! - i pobiegłem do punktu zbiórki. Żołnierze na miejscu uśmiechali się na mój widok. Szybko spojrzałem na zegarek - i wiedziałem już, co ich rozbawiło. Gdy wsiadałem do oficerskiego jeepa, była dokładnie 14:21.\n\n-Wyjeżdżamy! - krzyknąłem do krótkofalówki. Gdy ruszyliśmy, powiedziałem do szofera:"
malysz_start.13.a: “Polska to bardzo dziwny kraj.”


##### NEWS EVENTS #####


unification.38.t: "[GetNewspaper]Orły z Wisły jednoczą Beskidy!"
unification.38.desc: "Nawet po tym wszystkim orły wciąż szybują po niebie. W miejscu zdominowanym przez szaleńców, żądnych władzy i okrutnych, Adam Małysz, zdobywszy ogólnokrajowe uznanie dzięki niezwykle udanej karierze skoczka narciarskiego, zgromadził zwolenników, którzy teraz rządzą państwem od Cieszyna po Gorlice. Na gruzach najdalej na zachód wysuniętych wasalów UE dowodzi umiarkowaną republiką, gotową przywrócić demokratyczne państwo europejskie. \nJednak z głębi nowego państewka dochodzą plotki o jeszcze większych ambicjach. W miejscu belek skoczni, na których Małysz kiedyś zdobywał medale (w tym złote), pojawiają się pogłoski o tajemniczych wyrzutniach. Niektórzy twierdzą, że Małysz kładzie podwaliny pod własny program kosmiczny, mając nadzieję, że on, były sportowiec, wyprowadzi naród z krawędzi ku gwiazdom, choć ich doświadczenie w tej dziedzinie to, cytuję - \"ponad 400 godzin w Kerbal Space Program\"."
unification.38.a: "To nowy rekord skoczni!"

super.38.t: "[GetNewspaper]Adam Małysz unifies Poland!"
super.38.desc: "Adam Małysz dwukrotnie został narodowym bohaterem. Ani przez chwilę nie był postrzegany jako złoczyńca. W oczach ludzi jest czczony niczym papież. Na początku był skromnym skoczkiem narciarskim, kierowcą i trenerem.\n\nDroga z Wisły była długa, a Adam przeszedł od morderczych walk z Braćmi Bandytami do ratowania kraju przed jego najgorszym wrogiem - samym sobą. Gdy podbił Małopolskę, wszyscy dostrzegli wspaniałość jego panowania. Mimo że nie dążył do tego, miał być zbawieniem Polski. Wielu się poddało i przeszło na jego stronę, a ci, którzy tego nie zrobili, ostatecznie zginęli z woli zwolenników Małysza.\n\nTeraz Orzeł z Wisły spogląda w niebo, bo tam leży prawdziwa przyszłość. Nie tylko dla Polski, lecz dla całej ludzkości. I on jest właśnie tym - Bohaterem Ludzkości."
super.38.a: "Per Aspera ad Astra."
