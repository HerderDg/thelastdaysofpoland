unification.22.t: "[GetNewspaper]Legion Honoru jednoczy Górny Śląsk!"
unification.22.desc: "Kolebka Śląska została bezlitośnie splugawiona przez hordy neonazistów. Choć określają się mianem patriotów i nacjonalistów, nie mają żadnych oporów przed odwoływaniem się do symboliki wspólnej dla wszystkich odmian faszyzmu. Ludność Śląska została w znacznej mierze zniewolona i wysłana do przymusowej pracy w rozmaitych obozach. Ci, którzy uniknęli śmierci i niewoli, żyją w nieustannym strachu, ponieważ nie istnieje żadna osłona prawna, za którą mogliby się ukryć przed pachołkami Legionu. Istnieje jednak również zupełnie inne społeczeństwo - wywyższona kasta. Rasa aryjska. Jej członkowie żyją w całkowicie odrębnym świecie, pełnym luksusów, pochodzących w większości z zagrabionych domów, i urzeczywistniającym marzenia Legionu o rasie nadludzi. Tylko nieliczne podbite tereny dostępują jednak tego „zaszczytu”; trafiają do nich przede wszystkim zasłużeni wojownicy i osoby uznane za odpowiednie pod względem genetycznym. Czy reszta kraju zdoła powstrzymać to szaleństwo? Czy świat będzie musiał interweniować? W przeciwnym razie historia zatoczy koło. Tym razem w Polsce."
unification.22.a: "Urodzeni, by być białymi."

unification.211.t: "[GetNewspaper]Legion Honoru jednoczy Górny Śląsk!"
unification.211.desc: "Magia nie istnieje. Jakim więc cudem Górnym Śląskiem rządzi teraz człowiek, który zmarł jakieś trzydzieści lat temu? Niektórzy twierdzą, że potężny nekromanta wskrzesił go z grobu - najpewniej zupełnym przypadkiem.\n\nTen niefortunny \"wypadek\" kosztował Metropolię wolność. Gdy ujawniono tożsamość Szczerskiego, pod jego sztandary zaciągnęło się jeszcze więcej nacjonalistów. Niektórzy ekstremiści uznali go za mesjasza, lecz sam Szczerski kazał stracić tych, którzy odważyli się na takie porównania, a nawet tych, którzy tylko wspominali, że żyje.\n\nMimo to Legion Honoru trzyma już Górny Śląsk w żelaznym uścisku i szykuje się, by poprowadzić kraj ku nowej epoce podbojów i \"dobrobytu\". Jak sami chętnie powtarzają, muszą zapewnić przetrwanie swojemu ludowi i przyszłość białym dzieciom. Bóg naprawdę umarł..."
unification.211.a: "Śląsk wkracza w aryjską przyszłość"

super.22.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.22.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.22.a: "Wreszcie zjednoczeni."
 
super_b.22.t: "[GetNewspaper]Legion Honoru jednoczy Polskę!"
super_b.22.desc: "Gdy neonaziści przejęli Wodzisław Śląski, wielu uważało, że oto osiągnęliśmy szczyt polskiego szaleństwa. Kiedy jednak ludzie zobaczyli legiony nazistowskich szturmowców maszerujące zwycięsko przez Warszawę, obracające Częstochowę w gruzy i rozstrzeliwujące każdego księdza oraz nie-Aryjczyka, którego zdołały znaleźć, nikomu nie było już do śmiechu.\n\nKult Odyna ogłoszono religią państwową, a tych, którzy się sprzeciwiali, brutalnie mordowano i składano w ofierze. Niebo poczerwieniało od pożarów trawiących cały kraj, a rzeki zamieniły się w krwawe strumienie, gdy szczątki polskich katolików spływały Wisłą do Morza Bałtyckiego.\n\nJakby tego było mało, Mariusz Szczerski ogłosił się Synem Odyna i zmienił imię na Magnus Odinsson. Populacja Polski gwałtownie maleje i wkrótce kraj może obrócić się w popiół, stając się jedynie pieśnią o minionej przeszłości."
super_b.22.a: "Ragnarök nadciąga!"