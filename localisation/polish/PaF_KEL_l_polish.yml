 KEL_inzbud: "Inżbud"
 KEL_intester: "Intester"
 KEL_bielik: "Operacja \"Bielik\""
 KEL_bielik_desc: "Precz z Ziobrą! Niech żyje rewolucja kapitalizmu! Zrzucimy Prokuratora Zero z Łysej Góry a żółto-czarna flaga załopocze nad Kielcami! Za wolność! Już nigdy więcej rynek nie będzie na łasce zamordystów!"
 KEL_lewak: "Precz z lewakami!"
 KEL_lewak_desc: "Miażdzyć lewaków! Lewicowcy zawsze agitowali za bzdurami typu 'sprawiedliwa płaca' czy 'prawa robotników', ale ich manipulacje na nikim nie robią wrażenia. Chcą żebyśmy jedli robaki i stali w kolejkach! Wolny rynek pozostanie prawdziwie wolny i żadna nawała lewackiej agitacji tego nie zmieni.\n\nA teraz wracać do zakładu, wasza dwunastogodzinna zmiana jeszcze się nie skończyła."

 ###   News Events   ###

unification.121.t: "[GetNewspaper]Waffen-$$$$ jednoczy województwo Świętokrzyskie!"
unification.121.desc: "Niewielu spodziewało się upadku reżimu Ziobry. Jeszcze mniej ludzi wierzyło, że po tym upadku to Kelthuz wyjdzie zwycięsko z rywalizacji o władzę. 'Najbardziej znienawidzony libertariański bard Polski' skutecznie poprowadził sojusz anarchokapitalistów, pogańskich fanatyków i nihilistów przeciw wszystkim formom lewicowości, chrześcijaństwu i altruizmu.\n Jednym z jego pierwszych działań po przejęciu kontroli nad województwem było splądrowanie Opactwa Trójcy Świętej i sprzedanie relikwii Świętego Krzyża, by zebrać fundusze na armię.\n Cała Polska skrzywiła się z obrzydzenia z powodu tego bluźnierczego czynu, a także dlatego, że Stalowy Dowódca ogłosił, iż po ich pokonaniu zamierza przespać się z matkami innych watażków."
unification.121.a: "SALUTH o/o/o/"

super.121.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.121.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.121.a: "Wreszcie zjednoczeni."

