TIG_digital_haven: "Cyfrowe sanktuarium"
TIG_digital_haven_desc: "Poza wątpliwą postacią lidera i jego równie wątpliwych umysłowych możliwości, terytoria komun zamieszkane są przez wielu utalentowanych hakerów i ekspertów informatycznych którzy woleliby operować poza krępującymi ich juryzdykcjami jakie czekają na nich u innych watażków. Udało im się zadbać o swój własny dobrobyt sprzedając swoje usługi na forach w darkwebie, nierzadko zajmując się działalnością na szarym i czarnym rynku. Są zdeterminowani wspierać anarchistyczne idee cyberwojny przeciwko każdemu kto chciałby wtrącić się w ich świeżo odzyskaną wolność."

TIG_top_gniot: "Hackowanie aut"
TIG_top_gniot_desc: "Hej, Mecedes\nWłącz nagiw...\nHej, Mecedes\nWłącz nagi... na... no właśnie, za szybko\nWłącz nawigacje\n§CSłucham?§!\nA chce się dowiedzieć jaka jest pogoda w...\n§C*Klik*§!\nNo dobra, dziękuje\n\nHej, Mecedes\n§CTak?§!"

 ##Events##
unification.172.t: "[GetNewspaper]Wolne Komuny Infoanarchistyczne jednoczą Łódzkie!"
unification.172.desc: "Przez długi czas Mateusz \"Tiger Bonzo\" Kupiec uchodził jedynie za nieszkodliwego błazna, podejrzanego rapera, który często groził innym watażkom cyberterroryzmem... w czasach, gdy większość jego sąsiadów musiała rozstać się z komputerami i porzucić nadmierne uzależnienie od elektroniki. Jego komuny wspierała garstka wiernych fanów, prawdziwi hakerzy i infoanarchiści korzystający z całkowitego braku ograniczeń. Niewielu postawiłoby na ich sukces, lecz być może to właśnie lekceważenie ze strony przeciwników umożliwiło niespodziewany awans kliki Bonza. W zaskakującym obrocie wydarzeń sabotażyści Kupca przeprowadzili udane ataki na sieci energetyczne wrogów, a jego hakerzy regularnie przechwytywali nieprzyjacielskie informacje wywiadowcze. Rozpowszechniane przez internet przemówienia zainspirowały nawet powstanie kilku uśpionych komórek terrorystycznych za plecami przeciwników. Ostatecznie doprowadziło to do rozbicia wszystkich hierarchii w Łódzkiem i uczyniło Tigera Bonza najbardziej wpływowym człowiekiem województwa."
unification.172.a: "Zjednoczenie... tego typu, ta..."
