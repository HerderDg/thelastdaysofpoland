unification.210.t: "[GetNewspaper]Wieczna Sonata jednoczy Północne Mazowsze!"
unification.210.desc: "Północne Mazowsze pogrąża się w ciszy... aby lepiej słyszeć arcydzieła Fryderyka Chopina! Królestwo Euterpe, nazwane na cześć Muzy Muzyki, zostało założone przez słynnego i wielokrotnie nagradzanego pianistę Krystiana Zimermana. Laureat IX Międzynarodowego Konkursu Pianistycznego im. Fryderyka Chopina, jak sam przyznał, nie mógł bezczynnie siedzieć, gdy jego ojczyzna płonęła, a brutalny watażka rozrywał ją na strzępy. Wyruszył więc ze swojego domu w Bazylei do Żelazowej Woli w powiecie sochaczewskim - miejsca narodzin Chopina - aby chronić dziedzictwo wielkiego kompozytora i stworzyć punkt zborny dla jego zwolenników. W poprzednich latach zgromadził wokół siebie wielu patriotów, roztaczając przed nimi mglistą wizję zjednoczonej Polski, wolnej od imperialistycznych i militarystycznych najazdów. Swoje przesłanie umacniał, dając liczne zachwycające koncerty. Okazało się, że wystarczyło to, by zgromadzić dostatecznie wielu kompetentnych ludzi i podbić północne Mazowsze, mimo niechęci Zimermana do spraw wojskowych."
unification.210.a: "Pierwsza nuta crescendo"




