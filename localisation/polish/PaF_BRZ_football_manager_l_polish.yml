BRZ_league_info_tt: "§RTO NIE JEST TA SAMA DRUŻYNA ANI TE SAME MECHANIKI CO POWYŻEJ§!\n\nTo jest interfejs ligi. W tej mechanice, prowadząc Olimpię Truskolasy, będziesz mierzyć się z wieloma różnymi klubami.\n\nTwoje zadanie? Awansować do następnej ligi.\n\nCo możesz zrobić, żeby pomóc swojemu klubowi? Tak naprawdę niewiele. W końcu to tylko sport. Możesz spróbować wpłynąć na wynik meczu, przekupując sędziego albo przeciwny klub, ale uważaj - na dłuższą metę może się to na tobie zemścić i, tak naprawdę, wcale nie gwarantuje zwycięstwa.\n\nSkoro więc nie mogę wiele zrobić i wszystko jest losowe...to po co to tutaj jest? Cóż - czy nie marzyłeś kiedyś o tym, żeby mieć ligę piłkarską w HoI4? My też nie. Ale oto jest. Więc przynajmniej możemy patrzeć, jak cyferki idą w górę i w dół.\n\nA tak już bez żartów, większość wpływu ligi na rozgrywkę jest zaplanowana na przyszłą zawartość, więc na ten moment...nie ma tego zbyt wiele."

BRZ_national_team_info_tt: "§RTO NIE JEST TA SAMA DRUŻYNA ANI TE SAME MECHANIKI CO PONIŻEJ§!\n\nTo jest interfejs reprezentacji narodowej. Tutaj prowadzisz reprezentację swojego państwa i rozgrywasz mecze z różnymi watażkami. To nie jest ta sama drużyna, którą masz w lidze.\n\nJej zadaniem jest zaoferowanie Ci innego sposobu na wypowiadanie wojen jako [BRZ.GetName]. Tutaj wojny wypowiada się poprzez mecze. Mogą one pójść dobrze, źle albo, no wiecie - mogą zakończyć się remisem. W zależności od wyniku otrzymasz wzmocnienia lub osłabienia w nadchodzącej wojnie z państwem, z którym rozegrałeś mecz. I każdy mecz zakończy się wojną, niezależnie od wyniku.\n\nTutaj możesz jednak wzmacniać swoją drużynę poprzez organizowanie treningów, pozyskiwanie kolejnych zawodników poprzez pokonywanie innych państw oraz zmienianie taktyki. Im lepiej radzi sobie twoja drużyna, tym większą będziesz mieć szansę na zwycięstwo."

