brz_league.1.t: "Gwizdek do szatni"
brz_league.1.desc: "Połowa sezonu już za nami - Olimpia Truskolasy znajduje się w tym momencie niebezpiecznie nisko w dolnej części tabeli. Fani są niespokojni i zniecierpliwieni, prasa grzeje temat spadku od tygodni i wszystko co w tym momencie dzieje się w kraju zdaje się przybierać kolor sportowej porażki. Jeżeli dalej będą tak grać i zakończą sezon na ostatnim miejscu...czekają nas poważne konsekwencje."
brz_league.1.a: "To się staje powoli żenujące..."

brz_league.2.t: "Sezon pełen nadziei"
brz_league.2.d: "Połowa sezonu już za nami - Olimpia Truskolasy znajduje się w tym momencie w górnej części tabeli. Nastrój w klubie zmienił się nie do opisania: trybuny są wypełnione po brzegi, lokalna prasa pompuje balonik, a wszystkie problemy - nawet te polityczne, zdają się nie mieć znaczenia w takiej chwili. Zamierzamy wygrać całą tę pieprzoną ligę!"
brz_league.2.a: "Rozkład jazdy znany."

brz_league.3.t: "Odwróć tabelę, Olimpia na czele"
brz_league.3.d: "Olimpia Truskolasy kończy sezon na ostatnim miejscu. Co było jedynie rozczarowaniem, teraz już stało się istną furią. Trybuny skandują hasła antyrządowe, lokalni sponsorzy znikają z dnia na dzień a upokorzenie klubu stało się jedynie przyczynkiem do większego rozkładu. Rozwścieczeni kibice wyszli na ulice domagając się rezygnacji naszego lidera, Jerzego Brzęczka, który w końcu jest również odpowiedzialny bezpośrednio za wyniki drużyny."
brz_league.3.a: "To już nie jest tylko piłka..."

brz_league.4.t: "Ostatni gwizdek"
brz_league.4.desc: "Sezon dobiegł końca. Olimpię Truskolasy czeka teraz weryfikacja czy całoroczne zmagania wystarczyły by uciec ze znajomego bagna lokalnej ligi..."
brz_league.4.a: "Awans jest nasz! Nigdy nie spadniemy!"
brz_league.4.b: "Trzecia liga też ciekawa..."
brz_league.4.c: "Awans jest nasz! Nigdy nie spadniemy!"
brz_league.4.d: "Ta drużyna jest beznadziejna..."
brz_league.4.e: "Ta drużyna jest beznadziejna..."
brz_league.4.f: "Awans jest nasz! Nigdy nie spadniemy!"
brz_league.4.g: "Czas na kolejny sezon!"

