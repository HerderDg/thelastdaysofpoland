# Postacie #

TOR_tadeusz_rydzyk_desc: "Pod każdym względem życie kapłańskie jest życiem pełnym wyrzeczeń - ostatecznym porzuceniem ziemskich przyjemności w służbie wyższemu celowi. Choć niewielu duchownych zachowało jeszcze jakiekolwiek wpływy, credo wzorowego teokraty wciąż nakazuje: opieraj się pokusom władzy i wykorzystuj ją, by prowadzić swoją trzodę. Nie wszyscy jednak uznają ten obowiązek za drogę, którą warto podążać. \n\nOtoczony próżnością i przepychem Tadeusz Rydzyk stanowi antytezę moralności, którą sam tak żarliwie głosi. Zbudowawszy oparte na wierze imperium medialne wyłącznie dzięki talentowi do interesów i naturalnej charyzmie, kapłan nie pozostawił żadnych wątpliwości co do tego, któremu panu naprawdę służy. Choć skrywa się pod maską chrześcijańskiej pobożności, wszelkie oddanie, jakie mógł niegdyś żywić Rydzyk, pozostaje daleko w tyle za górą korzyści, które czerpie z hojnych datków łatwowiernych wyznawców. Widzą w nim oni wzór cnót - samotnego kaznodzieję, który własnymi siłami powstrzymuje napierającą falę bezbożności. To dzięki ich ofiarom wyrósł z nieznanego prowincjonalnego duchownego na jednego z największych rozgrywających III Rzeczypospolitej. Wkrótce prywatna świątynia kapłana w Toruniu stała się celem niejednej pielgrzymki - nie tylko wiernych mas, lecz także dziesiątek konserwatywnych elit, obsypujących go kosztownymi darami w zamian za polityczne poparcie. \n\nMimo swego kolosalnego wpływu na każdy aspekt życia kraju nawet wydarzenie tak doniosłe jak Upadek nie zdołało zatrzymać machinacji kogoś równie zaradnego i fanatycznie czczonego jak Rydzyk. Odparł każde wyzwanie rzucone jego władzy i wynurzył się z odmętów toruńskiej anarchii jako triumfujący zdobywca. W pewnym sensie, wbrew wszelkiej sprawiedliwości, Ojciec Dyrektor już zwyciężył i może bez przeszkód folgować każdej zachciance. Osiągnąwszy spełnienie swoich pragnień, nie widzi już powodu, by się wysilać, a Kościół cierpi z tego powodu, niezdolny zmienić własnych metod ani przystosować się do nowych wyzwań, z coraz bardziej zniedołężniałą skamieliną u steru. \n\nDuch pozostaje silny, lecz ciało słabnie. Marsz czasu pochłonie nas wszystkich, ale w klepsydrze Ojca Rydzyka pozostało już niewiele piasku. Gdy opadną ostatnie ziarna, jego duszę czekają dwa Sądy Ostateczne - boski i doczesny. Pierwszy skaże go na potępienie. Drugi może uświęcić jego imię albo przekląć je po wsze czasy. Mądrze wykorzystaj swoje ostatnie chwile, Ojcze Dyrektorze."
TOR_tadeusz_rydzyk_reactionary_desc: "Kult jednostki nie może przetrwać śmierci swego twórcy. Dlatego choć dusza dawno opuściła już ziemski padół, a ciało gnije w marmurowej trumnie, Ojciec Dyrektor nigdy nie może spocząć w pokoju, gdyż do niego należy tron Kujaw. Jego blask promienieje z Niebios wraz ze światłem Najświętszej Panienki - błogosławieństwem dla tej ziemi, teraz i na wieki wieków. Rodzina zaś wiernie oddaje cześć swemu świętemu Ojcu, obsypując Kościół bezprecedensowymi darami i przejawami oddania. Tadeusza Rydzyka nie krępuje już grzech pierworodny. Jest symbolem. Filarem. Uosobieniem ideału, do którego wszyscy dobrzy chrześcijanie winni dążyć na drodze ku zbawieniu. \n\nA jednak zza bezwstydnego bałwochwalstwa i religijnej paranoi zaczyna wyłaniać się bardziej cyniczne oblicze. Reakcja ludu na odejście Rydzyka istotnie była przytłaczająca. Gdyby tylko udało się odpowiednio ukształtować jego oddanie, wszelkie ograniczenia doczesnej władzy Kościoła natychmiast ległyby w gruzach. Jego wola jest bowiem boska, a żaden śmiertelnik nie może świadomie się jej sprzeciwić. Ci, którzy działają w cieniu, nadal mogą skrywać się za ochronną zasłoną, którą tak łaskawie im zapewnia. Słudzy pozostają sługami nawet po śmierci swego pana, tyle że teraz służą już wyłącznie samym sobie. \n\nI tak Ojciec Dyrektor przemawia do swojej trzody ustami duchowieństwa i słowami Ojca Króla, karmiąc się pochwałami i przyjmując na siebie winę. Jest idealną marionetką dla tych, którzy sprawują władzę - obdarzoną nieskończonym autorytetem i pozbawioną choćby odrobiny własnej woli. Już nigdy nie zaprotestuje. Już nigdy nie zablokuje tak potrzebnych reform. Jest tym, czym potrzebują go widzieć jego mocodawcy. Dziedzictwo Tadeusza Rydzyka umiera z ręki Tadeusza Rydzyka, a on jest z tego całkowicie zadowolony, bo takim właśnie go uczyniono. \n\nByć może podczas przerw w wiecznej męce Ojciec Dyrektor spogląda z otchłani, w której teraz przebywa, i odnajduje pewną pociechę w czci oddawanej mu przez jego lud. Chyba że widok wyidealizowanego obrazu człowieka, którym mógł się stać, sam w sobie jest torturą."
TOR_slawomir_mentzen_desc: "Polityk, doradca finansowy, opozycjonista... Sławomir Mentzen ma wiele twarzy, lecz przede wszystkim jest kameleonem. Trzeba pewnej zdolności przystosowawczej - albo, jak powiedzieliby jego przeciwnicy, krętactwa i bezkręgosłupowości - by przedstawiać się jednocześnie jako zagorzały konserwatysta i obrońca wolności osobistej, zmieniać programy i przekonania pozornie pod wpływem kaprysu, najpierw wynosić duchowieństwo do władzy, a potem doprowadzić do jego upadku. Mimo wszystkich tych sprzeczności bez trudu porusza się jednak po nieustannie zmieniającym się krajobrazie politycznym, po mistrzowsku wychodząc bez szwanku z każdej kontrowersji i chwilowego niepowodzenia. \n\nPojawienie się Mentzena było jednym z tych początkowo lekceważonych zjawisk, których dalsze konsekwencje stukrotnie przerosły wszelkie przewidywania. Na pierwszy rzut oka dość nieśmiały i pozbawiony przywódczej iskry, swój największy atut zawdzięcza zdolności do pozostawania niezauważonym przez rywali, dopóki nie jest już za późno, by go powstrzymać. Najpierw przejął spuściznę Korwin-Mikkego sprzed nosa bardziej naturalnych i ideowo zbieżnych kandydatów, potem zdobył poparcie całego pokolenia, aż wreszcie - jakby znikąd - ze swojego małego biura obalił imperium Rydzyka i zastąpił je własnym. \n\nZwycięstwo nie przychodzi jednak bez ceny. Liczba przysług i sprzecznych obietnic, których wymagało wyzwolenie Kujaw, zmusza teraz Mentzena do balansowania na niewiarygodnie cienkiej linie. Każde najmniejsze przechylenie na jedną ze stron nieodwracalnie zniszczy kruchą równowagę, która wyniosła go do władzy. Jakikolwiek kurs obierze, z pewnością zrazi do siebie co najmniej jeden z filarów, na których się opiera, podczas gdy bezczynność grozi szybkim skruszeniem ich wszystkich. Najbardziej przytłaczająca wydaje się jednak trzecia możliwość. Jeśli Mentzen spróbuje wytyczyć własną drogę, może szybko odkryć, że walka z systemem staje się znacznie trudniejsza, gdy samemu zostaje się tym systemem. \n\nCzas ucieka, a sojusznicy z wyrachowania oczekują natychmiastowego zwrotu ze swojej inwestycji. Aby przetrwać drogę, która go czeka, niektórych trzeba będzie rzucić wilkom na pożarcie. Jeden fałszywy krok i to jego spotka taki los."
TOR_jan_krol_desc: "Ojciec Jan Król jest ostatnim człowiekiem, którego ktokolwiek spodziewałby się ujrzeć na szczycie kościelnej hierarchii. Niepozorny, powściągliwy; zawsze odnajdywał swoje naturalne miejsce nie w blasku reflektorów, lecz w cieniu, zarządzając codzienną działalnością Kościoła, podczas gdy inni uśmiechali się do kamer - idealny doradca dla kogoś, czyje ego wymagało nieustannego poklasku. Nawet pełna lista licznych tytułów kapłana nie oddałaby sprawiedliwości owocom jego pracy, ochoczo spożywanym przez wiernych i opatrywanym nazwiskiem każdego, tylko nie jego. Nigdy jednak nie zależało mu na uznaniu; otwarcie go unikał, gdyż światło sławy razi oślepiającym blaskiem dłonie, które pracują wyłącznie w ciemności. \n\nPod wieloma względami Król jest całkowitym przeciwieństwem Rydzyka - drugą połową większej całości, która przez ostatnie trzy dekady prowadziła Rodzinę Radia Maryja. Synem i Duchem Świętym. Dwiema trzecimi toruńskiej Trójcy Świętej. Jeden nie może istnieć bez drugiego. A jednak teraz musi przetrwać bez Ojca, dźwigając na zmęczonych barkach cały ciężar spuścizny swego zmarłego mentora. \n\nMimo różnic, mimo przeciwieństw, przeszłość z teraźniejszością łączy jedno słowo - chciwość. Nie mając innego sposobu, by odróżnić się od niezmiennie uwielbianego Rydzyka, Ojciec Król przedstawia swój największy grzech jako dowód rzekomej cnoty, naginając dogmat tak, by ukazać zagrabione bogactwo jako świadectwo boskiej opatrzności. Skoro bowiem Bóg jest wszechmiłujący, czyż nie nagrodzi tych, którzy służą Mu najwierniej? Ale nawet to jest tylko fasadą, starannie reklamowaną, by wypełnić pustkę po odejściu Ojca Dyrektora. W istocie z całego serca nienawidzi tej udawanej wyniosłej obojętności. \n\nI tak Kościół kroczy naprzód, pogrążony w grzechu i sprzecznościach. Bogactwa płyną szerokim strumieniem, finansując rozmaite przedsięwzięcia i pasje Króla, lecz przede wszystkim luksusowe życie, które pragnie zapewnić całej klasie duchownej. Próżność jest cnotą, a skąpstwo przyniesie ci zbawienie. §RMoże i stworzył sobie raj na Ziemi, lecz Ojciec Król dopiero przekona się, że żadna suma pieniędzy nie wystarczy, by kupić bilet do Nieba.§!"
TOR_Sanktuarium_desc: "Bramy zostały zamknięte, wszystkich gości wyprowadzono, a teraz pozostała już tylko złowieszcza cisza. Dla wiecznie wiernych toruńskich parafian Kompleks Sanktuarium jest uosobieniem niedostępnej świętości, dla rosnącej rzeszy krytyków - oderwania od spraw tego świata. Nikt tak naprawdę nie wie, co dzieje się za tymi murami, poza kościelną elitą związaną surowymi ślubami milczenia, której nie wolno odejść, uwięzioną na własnej wyspie duchowej samotności. Mimo całej tajemnicy pogłoski przedostają się na zewnątrz i niczym pożar rozprzestrzeniają po całych Kujawach. Grzechy, cuda - każda opowieść rzuca nowe światło na najcenniejszego ze wszystkich więźniów: człowieka, który zaprojektował nie tylko te mury, ale i fundamenty całego narodu. \n\nWewnątrz Ojciec Dyrektor wije się z bólu, otoczony najbardziej zaufanymi pomocnikami, oddzielony od spojrzeń opinii publicznej trzema i pół metra betonu oraz całym regimentem uzbrojonych strażników. Płomień, który niegdyś w nim płonął i napędzał jego drogę ku potędze, skurczył się do garści żaru, czekającego, aż zgasi go pierwszy podmuch wiatru. Nie jest już wszechwładnym teokratą, lecz pustą skorupą, która ostatnimi oddechami blokuje każdą istotną zmianę. W obecnym stanie nie oddaje się ani Bogu, ani ziemskim przyjemnościom, z których wcześniej korzystał. Jedno i drugie wymaga wysiłku, na który nie potrafi się już zdobyć. Może tylko leżeć bezczynnie, ledwie rozpoznając samego siebie, swój Kościół, swój lud... \n\nWraz z odosobnieniem większości wysoko postawionego duchowieństwa osłabł wreszcie uścisk absolutnej kontroli nad ludem. Wysiłki osób odpowiedzialnych za utrzymywanie porządku skierowały się do wewnątrz, a Kujawy w dużej mierze pozostawiono samym sobie. Głosy niezadowolenia, zwykle uciszane i brutalnie tłumione, mogą po raz kolejny rozbrzmieć, by usłyszeli je wszyscy. Całe województwo może modlić się jednym głosem, lecz ci, którzy snują złowrogie plany, spoglądają na siebie porozumiewawczo i przekazują to, czego nie wolno powiedzieć otwarcie. \n\nNikt - ani wewnątrz, ani na zewnątrz - nie wie, ile czasu pozostało. Ta chwila słabości będzie tylko przejściowa. W końcu Duch wstąpi do Nieba, a cała potęga ziemskiego osądu spadnie na tych, którzy próbowali obciążyć go grzechem. \n\n§RDrugiej szansy na zmianę już nie będzie. Ci, którzy pragną ją zapoczątkować, muszą wyrwać klucze do królestwa z rąk umierającego człowieka.§!"

