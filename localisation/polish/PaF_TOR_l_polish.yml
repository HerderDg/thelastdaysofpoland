TOR_blood_stained_dove_desc: "Drodzy bracia i siostry. Popiół - oto wszystko, co pozostało z naszego pięknego miasta i chwalebnego kraju. Ból i cierpienie wywołane niedawną wojną domową odcisnęły piętno na każdym mieszkańcu Torunia. Rozbite rodziny, zniszczone domy i duch zdruzgotany tragedią bezlitosnego konfliktu. Nie możemy się jednak poddać. Straciwszy tak wiele, zasługujemy na drugą szansę, możliwość odkupienia i odzyskania normalnego życia bez głodu i upokorzenia. Z pomocą Najświętszej Maryi i samego Pana możemy osiągnąć to wszystko. Słońce zachodzi nad Toruniem, a nasza audycja przyniesie duchowe wsparcie każdemu potrzebującemu mieszkańcowi. Jeszcze Polska nie zginęła, póki my wierzymy."
TOR_retaking_our_voice_desc: "Drodzy słuchacze! Choć nasz sukces w przywracaniu porządku w Toruniu jest ogromny, pozostała jeszcze ostatnia granica, ostatnia twierdza, której mury musimy rozsadzić niczym Jozue pod Jerychem! Miejsce, które niegdyś było naszym głównym ośrodkiem nadawczym, zostało skażone i wypaczone przez grzech! Wewnątrz pracownicy trudzą się nad podważaniem chrześcijańskiej prawdy, nad niszczeniem tego, co na świecie święte i dobre! Nie pozwolimy na to, bracia i siostry! Nadszedł czas, by odzyskać to, co naprawdę nasze, odbić naszą Ziemię Obiecaną z rąk pogańskiego zagrożenia! Pomódlmy się zatem za żołnierzy, którzy dokonają tego wielkiego czynu... Pod Twoją obronę uciekamy się, Święta Boża Rodzicielko..."
TOR_beloved_brothers_and_sisters_desc: "Umiłowani bracia i siostry. Pan Wszechmogący pobłogosławił nas kolejnym pięknym dniem w naszym historycznym, świętym mieście. Siły bezbożnego zła zostały raz na zawsze wygnane i po wsze czasy przeklęte. W nadchodzącej audycji sam Ojciec Rydzyk zapewni każdego brata w wierze, że naszą nową drogę wyznacza boska wola Boga. Pragniemy też łagodnie przypomnieć umiłowanym słuchaczom, by wsparli tę świętą misję stosowną ofiarą - w oczach Pana żaden dar nie jest zbyt mały; nawet najdrobniejsza szczera pomoc jest błogosławieństwem, które rozbrzmiewa w wieczności."
TOR_accept_maryja_guidance_desc: "O, drodzy słuchacze. Niech dzisiejszy dzień będzie dniem pamięci o wielkości naszej wspaniałej Królowej, Maryi zawsze Dziewicy. Jej dawny tron mógł rozpaść się wraz z upadkiem Polski, lecz nie oznacza to, że przestanie być naszą wielką patronką. Wydała na świat naszego Zbawiciela, z wdziękiem przyjmując dar Boga i prowadząc tym samym ku zbawieniu całej Ziemi. Dlaczego właśnie dzisiaj? Otóż z powodu orędzia Błogosławionego Ojca Rydzyka: Dziewica Maryja zostanie wielką patronką naszego narodu na drodze ku zgromadzeniu wszystkich polskich chrześcijan pod naszym sztandarem. Wzywam was wszystkich, abyście uczcili tę wspaniałą okazję najlepiej, jak potraficie."
TOR_banish_the_vices_desc: "Świętość naszego miasta spoczywa pogrzebana pod ciężarem zepsucia. Ziemia niegdyś konsekrowana drży dziś pod brzemieniem grzechu. Moralność odrzucono, a serca wielu stały się zimne; odwrócili wzrok od Boga i zatkali uszy na Jego słowo. Nie możemy stać bezczynnie, gdy rozprzestrzenia się ciemność. Każdy z nas został powołany, by powstać w wierze, odzyskać to, co święte, i przywrócić światło Boga temu upadłemu miejscu. Nadeszła pora działania. Nadeszła pora powrotu do Pana. Niech będzie pochwalona Jego mądrość."
TOR_burden_of_our_sins_desc: "Jak mówi Bóg w Księdze Amosa: \"Albowiem znam mnogie wasze występki i liczne wasze grzechy!\" \nWiedzcie, że brzemię waszych grzechów prawdziwie smuci i boleśnie dotyka naszego Pana. Żaden występek nie umknie spojrzeniu Boga, dlatego módlcie się o przebaczenie. \nBracia chrześcijanie! Nie wszystko stracone! \nFundamentem wiary jest skrucha za niegodne uczynki. A jednak gdy święty kapłan pokornie prosi o drobną ofiarę na rzecz naszej wspólnoty, odwracacie się plecami. Zapominacie o kapłanach, plujecie im w twarz, a oni wciąż modlą się za was, prosząc jedynie o symboliczną jałmużnę. \nPokutujcie, póki jeszcze czas! \nW przeciwnym razie łzy Jezusa przepełnią kielich goryczy, który ponownie zostanie wylany na świat - zmywając nieprawość, a wraz z nią krnąbrnych."
TOR_even_the_holy_desc: "Niech będzie pochwalony Jezus Chrystus!\n Drodzy bracia chrześcijanie, nie zapominajcie o świętej roli naszych kapłanów w służbie Bogu. Uświęceni świętym sakramentem, zostają wywyższeni w oczach jedynego Stwórcy. To najlepsi spośród nas - najbardziej pobożni - wstępują do stanu kapłańskiego. Zapewniam was, są pokorni, sumienni i czyści w sumieniu, a ich jedynym celem jest służba Bogu.\n A jednak ludzie skażeni grzechem pierworodnym - w tym nawet duchowni - mogą czasem ulec zepsuciu. Cytując Błogosławionego Ojca Dyrektora: \"Tak, ksiądz zgrzeszył. Zgrzeszył. Ale kto nie ma pokus?\" - tak bronił niesłusznie oskarżonego męczennika, biskupa Edwarda Janiaka. Okażcie wyrozumiałość dla chwil słabości, bo pozostają niemal niewidoczne w strumieniu dobra, którym wasi kapłani praktycznie zawsze się z wami dzielą."
TOR_gone_for_a_price_desc: "Ale uwierzcie mi, słuchacze, nie cała nadzieja stracona! Jak wiemy, Bóg jest łaskawy i przebaczy nam nasze grzechy! Uwolnienia od największych win nie trzeba jednak szukać w często trudnym i wymagającym świecie konfesjonału. Zamiast tego opracowaliśmy nowy pomysł: mszę, podczas której grzechy zostaną wam odpuszczone za samą obecność! Wstęp jest, co zrozumiałe, płatny, lecz wniesienie opłaty uznamy za akt poświęcenia i uwielbienia. W końcu środki trafiają wyłącznie na słuszne cele."
TOR_pardon_disgraced_desc: "Niech będzie pochwalona Najświętsza Maryja Panna!\n \"Kto z was jest bez grzechu, niech pierwszy rzuci kamieniem\" - mówi nam Jezus Chrystus. Pobożni bracia, przyjmijcie tę naukę wprost do serca, gdyż została nam dana dla naszego zbawienia. Pamiętajcie! Zanim osądzicie bliźniego, najpierw zbadajcie własne sumienie. Nie miotajcie słów nienawiści, gdy kapłan zboczy ze swojej duchowej ścieżki - błądzić jest rzeczą ludzką.\n Biblia ponownie nam przypomina: \"Pan bada sprawiedliwego i występnego, nie cierpi zaś tego, kto kocha nieprawość\". Nie szerzcie zatem nienawiści, bo nie jest to droga dobrego chrześcijanina. Prawdziwe miłosierdzie okazuje ten, kto wspiera naszego Błogosławionego Ojca Dyrektora i gdy nadejdzie pora - zgodnie ze słowami Chrystusa - przebacza grzechy nie siedem, lecz siedemdziesiąt siedem razy."
TOR_new_code_of_virtue_desc: "Umiłowani bracia! Rządy tyranów i obłudników znieczuliły zwykłych obywateli, pogrążając ich w zepsuciu i bierności wobec grzechu. Ich czas dobiegł końca! Za wstawiennictwem Wysławionego Ojca Dyrektora Bóg ponownie zstąpi do serc swego ludu i odzyska należne Mu miejsce. Ustanowiony zostanie nowy kodeks prawny oparty na Piśmie Świętym. \n Ślubujemy, że będzie on wyłącznie odzwierciedleniem porządku i chrześcijańskiego braterstwa, o których mówi Biblia. Nie lękajcie się jednak! Bóg bowiem przemawia do was: \n \"Prawo Pańskie jest doskonałe - krzepi ducha; \n świadectwo Pana niezawodne - uczy prostaczka mądrości. \n Nakazy Pana są słuszne - radują serce; \n przykazanie Pana jaśnieje i oświeca oczy\"."
TOR_collection_plate_economy_desc: "Dzień dobry i niech Bóg błogosławi wszystkich naszych słuchaczy! Otrzymujemy wiele listów z podziękowaniami dla Ojca Dyrektora za łagodną politykę podatkową, którą prowadzi jako dobroduszny opiekun swojej trzody. Smuci nas jednak, że wielu z was uznało miłosierdzie Ojca Tadeusza za pozwolenie na zatwardzenie serc. Rozczarowuje nas nikła liczba ofiar składanych Kościołowi pomimo bezcennej pracy duchowej, którą nieustannie wykonuje dla waszego zbawienia. Moglibyśmy podwyższyć składki, by uchronić was przed zejściem na niebezpieczną drogę ciułaczy. Ojciec Tadeusz pamięta jednak o wielkim znaczeniu Wolnej Woli na drodze do zbawienia. Dlatego redakcja Radia Maryja jedynie apeluje o zwiększenie dobrowolnych datków - przynajmniej na razie."
TOR_safe_under_cassocks_desc: "Bracia i siostry, słyszeliście o grzechu plotkarstwa. O obrzucaniu bliźniego błotem, pożądaniu uwagi lub zemsty. O składaniu bezpodstawnego świadectwa przeciwko sobie nawzajem.\nMiejcie się na baczności, bo oszczerstwo może dotknąć nie tylko was czy waszego bliźniego: nasz święty Kościół, jego pasterze, a nawet sam Wysławiony Ojciec Dyrektor są bez końca atakowani przez ludzi zbłąkanych. Nieustannie oskarża się ich o najgorsze grzechy tego świata. Ludzie o zgniłych językach zawsze będą próbować przekonać was, że nasze święte kościoły są siedliskami występku, nasi pasterze najpodlejszymi heretykami, a może nawet schizmatykami. \n Zgłaszajcie kłamstwa, zwalczajcie oszczerstwa, odpierajcie lekkomyślne zarzuty, lecz przede wszystkim nie zakłócajcie spokoju zakrystii ani pomieszczeń administracyjnych naszego Kościoła. Nasze święte dzieło wykonywane jest niestrudzenie dla ciebie, drogi Toruniu, a przeszkadzać mu oznacza godzić w sam nasz sposób życia."
TOR_loyalty_through_sin_desc: "Dobry wieczór, słuchacze. \nPrzepraszam, że przerywam wasze modlitwy lub wcześniejsze kazania. Niestety sprawa, która sprowadza mnie dziś wieczorem przed mikrofon, jest niepokojąca. Jestem tutaj, ponieważ brat Sebastian Krzyż, kapłan naszego Kościoła, złamał prawa spajające nasze społeczeństwo i hierarchię kościelną. Powiązano go z takimi przestępstwami jak sprzeniewierzenie dziesięcin, pranie pieniędzy na ogromną skalę oraz najohydniejsza siatka sodomitów, z jaką kiedykolwiek zetknęli się nasi śledczy. Z bólem ogłaszam ten splot wydarzeń, gdyż dotychczas - nawet podczas sporu wokół naszych poglądów na odpusty - uchodził za cenionego członka Kościoła. \nWyrok zostanie ogłoszony w przyszły poniedziałek. Dziękuję za uwagę i wiedzcie, że jestem nie tyle sędzią, co sługą Pana i naszego Ojca Dyrektora. Niech ten wieczór przypomni nam, że musimy przestrzegać zasad spajających nasz Kościół. Abyśmy nie narazili na niebezpieczeństwo wszystkich naszych wiernych."
TOR_expanding_complex_desc: "Słuchacze,\nGdy grzechy Sodomy skazały ją na śmierć, nawet wtedy Abraham targował się z Bogiem, pytając, czy zgładzi sprawiedliwych razem z występnymi. Bóg zatem obiecał - jeśli znajdzie się dziesięciu sprawiedliwych, miasto zostanie oszczędzone.\nSpójrzcie na biura i domki letniskowe na zachód od naszych warowni. Wiedzcie, słuchacze: w tych miejscach nie mieszka ani jeden człowiek sprawiedliwy. Ba, powiedziano nam, że nie ma tam w ogóle ani jednego człowieka. Niech więc - niczym Sodomę - nasze buldożery, a jeśli trzeba także siarka, pochłoną te rozpadające się grzeszne budowle, by ich miejsce zajęły nowe, świętsze gmachy służące wyższemu celowi. Gdy nasz kochający Kościół się rozrasta, wraz z nim wzrośnie przestrzeń dla jego dzieła i miłości."
TOR_away_from_prying_eyes_desc: "Zważcie na te słowa, drodzy słuchacze. Zważcie i słuchajcie uważnie. \nAby zapewnić niezakłóconą kontynuację naszej pracy oraz umocnić dyscyplinę i obyczajność w świętych przestrzeniach, dostęp do obszarów wykorzystywanych przez przywództwo i administrację zostanie ściśle uregulowany. Wokół tych terenów i budynków staną ogrodzenia. Strefy zamknięte będą pilnie strzeżone. Ani niewiedza, ani potulność nie usprawiedliwią wtargnięcia, a grzechu nieposłuszeństwa nie zmyje żadna ofiara - tylko pot z waszego czoła. \nStrzeżcie prywatności naszych terenów zarówno czynami, jak i donosami, a Bóg spojrzy na was równie łaskawie, jak spogląda na duchowieństwo."
TOR_woe_to_corrupters_desc: "Chwała Chrystusowi!\n Większość z nas wciąż pamięta straszliwe czasy niepokojów i wojny w naszym ukochanym Toruniu. Bóg poddaje nas trudnym próbom, wystawiając na sprawdzian nasze oddanie wierze, tak jak niegdyś biblijnego Hioba. Nie lękajcie się - za swoje cierpienie otrzymacie nagrodę w Królestwie Niebieskim. \n Wróg został jednak odparty, a nie pokonany. Strzeżcie się go! Pismo Święte mówi bowiem:\n \"Heretyka po pierwszym i drugim upomnieniu unikaj;\nwiedząc, że taki jest przewrotny i grzeszy, sam na siebie wydając wyrok\".\n Miejcie oczy szeroko otwarte! Między was zakradli się bezbożnicy! Każdy, kto sieje zgorszenie, kto podstępnym językiem przemawia przeciwko Panu, i wszyscy inni grzesznicy nie unikną Sądu Bożego.\n Zgłaszajcie heretyków władzom!"
TOR_guardians_of_morality_desc: "Szczęść Boże! \nMódlcie się, bracia, za naszego Zbawiciela i Jego namiestnika, Ojca Dyrektora, bo przynoszą nam nowy, prawy porządek! Musimy jednak ponownie wystosować uroczyste ostrzeżenie: istnieją ludzie, którzy za wszelką cenę pragną zniszczyć całe dobro osiągnięte naszą ciężką pracą. \nAby pozbyć się bezbożników i innych wichrzycieli, zostanie wydany specjalny dekret powołujący szczególną cywilną grupę ochotników pod nazwą Pasterze Porządku. Ich kompetencją i świętym obowiązkiem będzie rozpoznawanie, zatrzymywanie i zgłaszanie wrogów Kościoła. \nDobrzy i prawi obywatele - nie lękajcie się! Biblia mówi bowiem: \n\"Prawość raduje uczciwego, \na przeraża złoczyńców\"."
TOR_eyes_in_every_window_desc: "Chwała Chrystusowi! \nDrodzy słuchacze! W tej audycji pragniemy przekazać szczególne pochwały i błogosławieństwa czujnym chrześcijanom, którzy ostatnio przysłużyli się naszej wspólnocie. Jest was coraz więcej, pobożni obywatele, co napełnia nasze serca wielką radością i wywołuje uśmiech na twarzy Boga. \nPomodlimy się o szczególną łaskę Pana dla oddanej pani Krystyny z ulicy Legnickiej. Codziennie słucha naszego radia, wspiera nas hojnymi datkami, a co najważniejsze, w tym tygodniu podczas obserwowania swojej okolicy zgłosiła aż 30 PRZESTĘPCÓW. \nNaśladujcie naszą siostrę w wierze! Każdy może zostać pobłogosławiony, a zatem: CZUWAJCIE!"
TOR_install_offering_terminals_desc: "Niewierni często oskarżają Kościół o odmowę podążania z duchem czasu. Ich argumenty dowodzą, że najgłośniej krytykują naszą świętą instytucję ci, którzy najrzadziej bywają na mszy i dlatego nie mają pojęcia, o czym mówią. Każdy, kto niedawno wszedł do któregoś z toruńskich kościołów, dostrzeże wyraźne oznaki modernizacji: nowe ogrzewanie, mocniejsze oświetlenie i oczywiście automatyczne ofiaromaty. Te nowe urządzenia powstały z myślą o osobach preferujących cyfrowe przelewy lub niechcących przeszkadzać ciężko pracującym ministrantom noszącym tacę. Można wręcz powiedzieć, że Kościół posunął cyfryzację swoich usług tak daleko, jak to możliwe, biorąc pod uwagę liczbę seniorów regularnie uczestniczących w nabożeństwach. Wszystkim wiernym zdezorientowanym nową technologią polecam instrukcję obsługi terminali, którą można znaleźć w najnowszym numerze \"Naszego Dziennika\"."
TOR_sowing_the_grains_desc: "W prawdziwie klasztornym duchu Ojciec Tadeusz obiecał wykorzystać pieniądze zebrane z datków na liczne inwestycje, które poprawią byt wiernych. W najbliższych dniach możecie oczekiwać nowych szkół, dróg i programów mających zapewnić wam dodatkowe miejsca pracy. Z myślą o dzieciach rodziców, którzy wreszcie otrzymają szansę zatrudnienia, powstaną nowe szkoły i przedszkola, pełne wykształconych, troskliwych i pobożnych nauczycieli oraz opiekunów.\nSerdecznie dziękujemy wszystkim hojnym duszom, dzięki którym Ojciec Dyrektor mógł pobłogosławić nas tak dobrymi uczynkami. Jesteście wzorem dla ludzi o zatwardziałych sercach, na których odkupienie nadal będziemy czekać."
TOR_alms_for_needy_desc: "W najbliższych dniach odbędzie się wielka zbiórka pieniędzy. Fundacja Lux Veritatis zgromadzi środki na żywność, ubrania i artykuły sanitarne, które pracownicy organizacji dobroczynnych rozdadzą potrzebującym. Kampania pomoże przyspieszyć wydobywanie wiernych z ubóstwa, abyśmy nie musieli czekać na nieunikniony, choć stopniowy wzrost jakości życia wynikający z mądrych inwestycji Ojca Rydzyka.\nNiektórych niepokoi fakt, że za akcję dobroczynną odpowiada Fundacja Lux Veritatis zarządzana przez samego Ojca Tadeusza, gdyż w przypadku pomniejszych, niewiernych ludzi mogłoby to prowadzić do korupcji. Obawa przed czymś takim ze strony Kościoła jest jednak niedorzeczna. Tylko nadzór Ojca Dyrektora może zapobiec trafieniu pieniędzy do kieszeni podejrzanych, chciwych oszustów z jakiejś niesprawdzonej, zapewne zagranicznej organizacji."
TOR_mountain_of_gold_desc: "Jadowite oszczerstwa nie ustają! Wiecznie wojujący ateiści atakują Kościół za rzekome wyłudzanie pieniędzy od wiernych. Jak zwykle najgłośniej krzyczą ci, którzy jako ostatni złożyliby jakąkolwiek ofiarę na święty cel, woląc folgować najniższym instynktom finansowym. Darczyńcy są natomiast niezwykle zadowoleni ze sposobu, w jaki Kościół i Fundacja Lux Veritatis wydają dobrowolnie przekazane pieniądze, czego dowodzą liczne listy pełne wdzięczności. Ale to zresztą bez znaczenia. Nasze zbiórki nigdy nie miały określonego celu, a wierni wiedzieli o tym, gdy składali datki. Skoro pieniędzmi ma rozporządzać Ojciec Dyrektor, jak mógłby je wyłudzić? Jego niewinność wynika ze zwykłego zdrowego rozsądku."
TOR_grand_pastoral_visit_desc: "Pamiętajcie, że ta pora roku przeznaczona jest na dodatkowe wizyty duszpasterskie. Zaproście kapłanów do swoich domów, a Jezusa do serc. Podzielcie się z nimi troskami, módlcie się razem, pozwólcie poświęcić wasze ogniska domowe i pobłogosławić rodziny. Jeśli wiecie, że wasz sąsiad potrzebuje dodatkowej uwagi w okresie szczególnego zwątpienia, poinformujcie miejscowego duchownego i podajcie mu pełny adres. Pamiętajcie, musicie pozwolić księdzu być dobrym pasterzem i nie ma znaczenia, czy przyjęliście go już podczas zwyczajowej kolędy między Bożym Narodzeniem a świętem Matki Bożej Gromnicznej. \nNie trzeba chyba dodawać, że za wykonanie tego potrzebnego zadania wypada wynagrodzić go w jakiejś, najlepiej pieniężnej, formie. To coś więcej niż kwestia dobrych manier i może wpłynąć na jakość przyszłych usług."
TOR_amplifying_our_signal_desc: "Choć naszym głównym domem jest piękne miasto Toruń, nie możemy zapominać, że przed Upadkiem naszej rozgłośni słuchali najpobożniejsi obywatele całej Polski! Mamy nadzieję, że pewnego dnia przywrócimy ten godny podziwu stan rzeczy, lecz musimy zacząć od małych kroków. Jutro główna transmisja Radia Maryja będzie niedostępna. Osoby poszukujące duchowego przewodnictwa mogą w zamian sięgnąć po strony \"Naszego Dziennika\". Po zakończeniu niezbędnych modernizacji technicznych nasze audycje będą jednak głośniejsze, wyraźniejsze i dotrą dalej niż kiedykolwiek. Pragniemy przemówić do jak największej liczby ludzi, aby wspólnie z nami mogli doświadczyć radości wiary! Zdrowaś Maryjo!"
TOR_round_of_phone_ins_desc: "Słuchacze! Nasza rozgłośnia słynie z bezpośredniego kontaktu ze wspólnotą, a zwłaszcza z audycji telefonicznych, podczas których słuchacze mogą porozmawiać z prowadzącymi duchownymi, wyrazić swoje zdanie i zadać pytania, na które odpowiedzi najbardziej potrzebują ich dusze. Z radością ogłaszamy, że w najbliższych dniach wznowimy te segmenty. Rozumiemy, że obecnie niewielu mieszkańców Torunia ma zasięg telefoniczny, a kolejki do budek telefonicznych będą dłuższe niż kiedykolwiek. Pamiętajcie jednak, że nasi słuchacze pochodzą nie tylko z miasta. Wręcz przeciwnie. Możliwość usłyszenia głosów ludzi spoza naszego uroczego rodzinnego miasta być może poszerzy nasze horyzonty w kwestii warunków panujących w okolicznych regionach i pozwoli nieść posługę tym, których serca tęsknią za światłem Pana."
TOR_fostering_the_flock_desc: "Drodzy słuchacze! Gdy czynimy kolejne postępy na drodze odrodzenia, musimy podkreślić przede wszystkim jedno: jesteśmy OTWARTĄ Rodziną, gotową w każdej chwili przyjąć nowych członków. Nie zamykajcie serc przed grzesznikami, bo nawet oni zasługują na szansę odkupienia poprzez poświęcenie. Błogosławiony Ojciec Dyrektor zapowiedział serię dodatkowych wydarzeń i spotkań z ludnością, abyśmy mogli jeszcze szerzej otworzyć ramiona przed tymi, którzy nie odnaleźli dotąd miejsca pośród nas. Jeśli znacie kogoś potrzebującego zbawienia, przekonajcie go, by porzucił grzeszne życie i dał naszej Rodzinie szansę. Mamy głęboką nadzieję ujrzeć tam was wszystkich. Szczęść Boże!"
TOR_human_side_desc: "Drodzy słuchacze. Choć mierzyliśmy się ze skandalem za skandalem, zniesławieniem za zniesławieniem i całymi murami oszczerstw wznoszonymi przeciwko naszej rozgłośni i jej czcigodnemu założycielowi, żaden z jego zbłąkanych krytyków nie może zaprzeczyć, że Błogosławionego Ojca niezwykle łatwo polubić. Jego pobożność przyciąga nas wszystkich, sprawiając, że codziennie włączamy nasze audycje, lecz wojna i niepokoje uniemożliwiały mu zajmowanie się tym, co kocha najbardziej - bezpośrednią rozmową z wiernymi, bez względu na ich skromne pochodzenie. Widząc powracającą do miasta stabilność, Ojciec Rydzyk uznał, że nadeszła pora pobłogosławić nas częstszymi wystąpieniami publicznymi, zniszczyć rzucane na nas oszczerstwa i pokazać społeczeństwu oblicze naszego założyciela, którego dawno nie oglądało: jego ludzką twarz."
TOR_keeping_it_in_family_desc: "Drodzy bracia! Choć sytuacja w kraju pozostaje tragiczna, zaczynamy widzieć, jak nasza Rodzina się odbudowuje. Ludzie przybywają nawet spoza naszych granic, by uczestniczyć w cotygodniowej mszy w Sanktuarium, mimo niebezpieczeństw, z jakimi często wiąże się podróż przez kraj. Największa rodzina ze wszystkich, rodzina cnoty, goi rany i rośnie! Zarówno powracający, jak i nowi członkowie pozostają lojalni i gotowi szerzyć słowo! Wyszliśmy zwycięsko z walki z Diabłem, a od tej pory wszystko będzie zmieniać się wyłącznie na lepsze!"
TOR_spread_the_virtue_desc: "Nasza obecna sytuacja wygląda tragicznie. Otrzymujemy liczne telefony od zrozpaczonych wiernych opowiadających o doznanych krzywdach i najbliższych odchodzących od chrześcijańskich obyczajów. To nie pierwszy raz, gdy dobrych chrześcijan spotyka taki los. Pamiętamy totalitarne prześladowania XX wieku. W tych trudnych czasach odnajdźcie pocieszenie w historii życia naszego czcigodnego Ojca Rydzyka. Pogański reżim nazistowski zabił męża jego matki, Franciszka Rydzyka, który niczym święty Józef chronił małżonkę i jej syna. W przeciwieństwie do Syna Człowieczego Ojcu Tadeuszowi odebrano szansę poznania człowieka, którego kochała jego matka.\nMimo to wytrwał, wciąż pełen wiary. Przetrwał okrucieństwo II wojny światowej oraz krwawy, ateistyczny reżim komunistów, których prześladowania nie zdołały powstrzymać go przed szerzeniem Słowa Chrystusa. Naśladujcie jego postawę, a wraz z Rodziną Radia Maryja zdołacie przetrwać burzę, która nadeszła po Upadku."
TOR_castitas_desc: "Niech będzie pochwalony Jezus Chrystus i Maryja Zawsze Dziewica. Gościmy dziś kogoś wyjątkowego. Usłyszymy słowa Ojca Tadeusza Rydzyka na żywo. \n\n\"Ci, którzy dla królestwa niebieskiego sami zostali bezżenni\". \nCzystość. To być może najważniejszy ze składanych przez nas ślubów, bo dotyczy nie tylko konkretnych zakonów i zgromadzeń, lecz całego duchowieństwa. Uznaje się go za najważniejszy również dlatego, że dla wielu jest najtrudniejszy. Wyrzec się możliwości posiadania potomstwa... ilu ludzi potrafi dochować takiego przyrzeczenia? Nic dziwnego, że niektórzy spośród nas upadają, zwłaszcza w otaczającej nas bezbożnej kulturze rozwiązłości. \nWzywam wszystkich kapłanów zmagających się z pożądaniem, aby zawsze pozostawali niezłomni. Nie chcemy przecież prowokować lubieżnych, niewiernych mas do obłudnych ataków na duchownych z powodu ich drobnych potknięć."
TOR_mendicans_desc: "Niech Bóg błogosławi wszystkich naszych słuchaczy. Dzisiejszą audycję poprowadzi Ojciec Jan Król, który opowie nam o ślubach naszego zgromadzenia redemptorystów. Niech będzie pochwalony Jezus Chrystus i Maryja Zawsze Dziewica. \n\nNa wieki wieków. Amen. \"Jeszcze raz wam powiadam: łatwiej jest wielbłądowi przejść przez ucho igielne niż bogatemu wejść do królestwa Bożego\". \nTymi słowami Jezus wezwał nas do wystrzegania się bogactwa, które może sprowadzić nas na manowce, jeśli poświęcimy mu zbyt wiele uwagi. Dlatego z ostrożności i poprzez monumentalne poświęcenie słudzy Boży tacy jak Ojciec Tadeusz stronią od dóbr materialnych poza rzeczami osobistymi. To niezwykle szlachetny przykład, który sam staram się przyjąć i do którego naśladowania wzywam także was wszystkich."
TOR_obedientia_desc: "W dzisiejszej audycji, będącej częścią cyklu o ślubach naszego zgromadzenia, moim gościem będzie minister gospodarki Sławomir Mentzen, a tematem rozmowy będzie posłuszeństwo. Panie ministrze, czym jest dla pana posłuszeństwo? \n\nDziękuję za zaproszenie. Posłuszeństwo jest dla mnie kluczowym czynnikiem sprawnie funkcjonującego społeczeństwa. Wymagam go od swoich dzieci i podobnie oczekuję od pracowników, choć oczywiście w innej formie. Sam zaś, podobnie jak wszyscy obywatele, jestem posłuszny prawowitej władzy państwowej. Wszyscy powinniśmy szanować przełożonych za ich inteligencję i kompetencje. Dają nam przykład, byśmy stawali się lepsi. Nie są niesprawiedliwymi tyranami, którymi należy gardzić, jak chciałaby wam wmówić lewica."
TOR_new_trinity_desc: "Słuchacze, gdy anarchia była najstraszliwsza, wszyscy modliliśmy się o wybawienie. I wybawienie zwróciło nam domy w postaci trójcy: Ojca Dyrektora, Ojca Jana Króla i Sławomira Mentzena. Pamiętajcie, że służba naszemu Kościołowi w walce z chaosem zawsze zostaje należycie wynagrodzona: Mentzen ucztuje dziś z naszymi błogosławionymi Ojcami Rydzykiem i Królem. Podczas tego najświętszego spotkania, łamiąc chleb i dzieląc sól z naszymi duchowymi opiekunami, Mentzen otrzyma należne uznanie za swój udział w zabezpieczeniu miasta dla Kościoła oraz błogosławieństwo od naszych znakomitych przywódców. Niech taka hojność skłoni go do zajęcia właściwego miejsca wśród nas, poniżej naszych hierarchów, i uchroni przed zazdrością wobec lepszych od siebie, bo żaden świecki nie może równać się ze sługą Boga."
TOR_savoring_our_fill_desc: "...Pan ustanowił szabat dniem odpoczynku, wskazując, że tydzień ciężkiej pracy zasługuje na należny wypoczynek. Skoro nawet Pan odpoczywał przez jeden dzień po stworzeniu świata, to o ileż bardziej potrzebują odpoczynku, napoju i pokarmu nasi kapłani po odtworzeniu Torunia z popiołów anarchii, by ulżyć swoim brzemionom! Tak, wiele pozostaje do zrobienia. Tak, wielu z was wciąż cierpi. Cierpliwość jest jednak świętą cnotą, równie świętą jak dzień odpoczynku. Pozwólmy zatem naszym pasterzom, a przede wszystkim Ojcu Dyrektorowi, odpocząć i posilić ciało oraz duszę po niestrudzonej pracy, dzięki której doprowadzili nasze piękne miasto aż tutaj. A gdy Pan wezwie nas na sąd, On również uzna chwile, w których byliśmy zmęczeni i potrzebowaliśmy odpoczynku."
TOR_smile_and_wave_desc: "Drodzy bracia i siostry w Chrystusie,\n\nDzięki przewodnictwu Ducha Świętego ostatnie rozmowy Ojca Rydzyka ze Sławomirem Mentzenem zakończyły się znaczącym sukcesem dla naszej wspólnoty wiernych. Pamiętajmy jednak o tej niewzruszonej prawdzie: święta misja Kościoła stoi ponad wszystkimi ziemskimi sprawami i nigdy nie podda się wpływom ani zakłóceniom ze strony żadnej osoby czy władzy. Kościół należy do Chrystusa i to On prowadzi go naprzód. Pozostańmy czujni w modlitwie i niezachwiani w wierze, gdyż czasy wymagają bezgranicznego oddania. W Jezusie Chrystusie pokładamy naszą wiarę!"
TOR_pint_of_populism_desc: "Wyciągnęliśmy ku niemu miłosierną dłoń, oferując drogę do odkupienia i prawości. On jednak się odwrócił, zdradzając łaskę Najświętszej Maryi Panny i majestat Boga Wszechmogącego. To tak zwane \"piwo z Mentzenem\" jest kolejną zasłoną skrywającą grzech i próżność pod pozorem przyjaźni oraz zaufania. Niech będzie wiadome: Sławomir Mentzen pożałuje dnia, w którym podniósł rękę na Święty Kościół. Zdrada Słowa nie jest bowiem drobnym występkiem, a boska sprawiedliwość nie śpi. To, co uczyniono w ciemności, zostanie wywleczone na światło, a prawda osądzi wszystkich."
TOR_feeding_off_their_praise_desc: "Co za łaska! Co za błogosławieństwo. Nasi kapłani i wikariusze zstępują z perłowych bram, by pobłogosławić nas, niegodnych, swoją obecnością. Ojciec Dyrektor zajmie centralne miejsce w procesji przechodzącej przez centrum miasta, a Ojciec Król wyruszy w pełną trasę, by rozmawiać ze zwykłymi parafianami. Skoro poświęcają nam czas, który mogliby przeznaczyć na wypoczynek, pozostaje nam tylko jedno, bracia i siostry: oddawać cześć. Oddawajcie cześć na kolanach, oddawajcie ją leżąc krzyżem, jeśli pozwalają wam na to plecy, śpiewajcie Hosanna na wysokości w podzięce za możliwość przebywania w obecności tak boskich postaci jak nasi przywódcy. Oddawajcie cześć Ojcu, lecz zawsze z wdzięczności za naszego Ojca Dyrektora."
TOR_heel_wayward_son_desc: "Drodzy bracia i siostry w Chrystusie,\n\nPrzytłaczający kryzys wiary doczekał się rozwiązania. Sławomir Mentzen, zrozumiawszy powagę swoich bluźnierczych błędów, zgodził się spotkać z Ojcem Rydzykiem i jego najbliższymi doradcami w duchu pokuty i refleksji. Jest to krok ku pojednaniu, lecz niech będzie wiadome: działania przeciwko Bogu i Jego Świętemu Kościołowi nie będą tolerowane. Nikt, bez względu na nazwisko czy pozycję, nie stoi ponad prawem Nieba. Jako wierni pasterze Pana będziemy niewzruszenie strzec boskiego porządku - teraz i zawsze."
TOR_way_of_the_cross_desc: "Hańba mu - zdradził bowiem świętą wiarę i wzgardził Świętym Kościołem. Hańba mu - jego słowa i czyny wyszydzały to, co święte, i raniły serca wiernych. Niech będzie wiadome: Sławomir Mentzen nie może wystawiać swojej skruchy na pokaz przed tłumami, lecz musi pokornie wkroczyć na ścieżkę prawdziwego żalu, która poprowadzi go krok po kroku przez 14 stacji Drogi Krzyżowej. Przed każdą stacją będzie rozważał cierpienie naszego Pana i porównywał własne grzechy z ciężarem tej świętej ofiary. Tylko poprzez taką pokutę, z obnażonym sercem i odartą pychą, może mieć nadzieję na przebaczenie. Sprawiedliwość Nieba nie ugina się bowiem przed tytułami ani ambicją, a miłosierdzie Boga jest zarezerwowane dla tych, którzy prawdziwie klękają."
TOR_clearing_out_laymen_desc: "Drodzy bracia i siostry w Chrystusie,\n\nPrzez lata byliśmy świadkami moralnego zepsucia ropiejącego na najwyższych urzędach naszego narodu. Krzyże zrywano z miejsc publicznych, a świętego imienia Boga otwarcie się wyrzekano. Te czyny nie są przejawem religijnej obojętności, lecz ofiarami dla Szatana i sił ciemności, które krążą po świecie, szukając zguby dusz.\n\nNigdy jednak nie zapominajmy: próżne ambicje ludzi są zaledwie prochem wobec majestatu Boga. Tylko ci, którzy wyrzekają się ziemskich luksusów i powierzają serca Jego woli, mogą prawdziwie służyć jako narzędzia Jego boskiego zamiaru tu, na Ziemi."
TOR_refill_seminaries_desc: "Drodzy Bracia w Chrystusie,\n\nGdy obserwujemy narastający moralny upadek świeckiego świata, jedna prawda staje się coraz wyraźniejsza: Polska potrzebuje nowego pokolenia przywódców ukształtowanych nie przez ideologię, lecz przez Ewangelię - ludzi zakorzenionych w modlitwie, dyscyplinie i posłuszeństwie wobec Boga Wszechmogącego. \n\nDzięki Jego łasce i za wstawiennictwem Najświętszej Maryi Panny wiele serc, zwłaszcza młodych, odpowie na to wezwanie. Nasza ojczyzna przetrwa bowiem nie dzięki władzy politycznej, lecz dzięki czystości wiary i odwadze przekonań, wierna Bogu, Krzyżowi i Biblii."
TOR_back_where_it_started_desc: "Drodzy bracia i siostry,\n\nNieumiarkowanie w jedzeniu i piciu oraz pycha pozostają ciężkimi przewinieniami wobec Boga, a żaden człowiek nie jest wolny od osądu. Potraktujmy poważnie ostrzeżenie płynące z upadku Sławomira Mentzena. Kto podnosi rękę na Święty Kościół, sprzeciwia się nie człowiekowi, lecz samemu Panu. Głos Ewangelii nie zostanie uciszony. Będziemy nadal głosić prawdę bez lęku, z sercami zakorzenionymi w modlitwie i wierności. Sprawiedliwość Boga jest prawdziwa, a Jego miłosierdzie - choć wielkie - nie przymyka oczu na arogancję. Pozostańmy wierni. Chrystus jest naszą siłą."
TOR_regrouping_in_shadows_desc: "Niezmienną prawdą pozostaje, że nasz Bóg jest miłosierny. Żaden grzesznik nie znajduje się poza zasięgiem odkupienia, a każda dusza zasługuje na szansę doświadczenia cudu zbawienia. Sławomir Mentzen jest dobitnym przykładem tej prawdy.\n\nNiegdyś znany ze sprzeciwu wobec wartości chrześcijańskich odwrócił się od pychy i buntu, wybierając pokorną służbę Panu. Porzucił wrogość wobec Kościoła i zaczął pracować dla Boga, a nie przeciwko Niemu.\n\nNiech jego nawrócenie przypomina nam wszystkim: łaska Boga może dotrzeć nawet do najtwardszych serc. Módlmy się za wszystkich, którzy nadal błądzą, aby także oni powrócili do domu Chrystusa."
TOR_serving_god_and_rydzyk_desc: "Z pokorną wdzięcznością obserwujemy, jak pod duchowym przewodnictwem naszego umiłowanego Ojca Tadeusza Rydzyka wspólnota wiernych nieustannie rośnie w siłę i jedność. Dzięki jego niestrudzonemu oddaniu i niezachwianej wierze wiele serc odnalazło kierunek, a struktury niezbędne dla naszego moralnego i narodowego odrodzenia zostały po cichu, z miłością umocnione.\n\nNie ma już zamętu ani wahania - pozostały jedynie spokojna pewność i zaufanie do tych, którzy prawdziwie służą Bogu i Polsce. Kluczowe stanowiska powierzono ludziom, których lojalność nie wynika z ziemskiego zysku, lecz z wierności wartościom uznawanym przez nas za święte. To nie koniec, drodzy słuchacze, lecz błogosławiony początek."
TOR_ave_maria_desc: "Drodzy słuchacze i mieszkańcy Torunia! W ostatnich czasach byliśmy świadkami wielkich zmian, a wszystkie służyły naszemu przetrwaniu wobec potopu degeneracji, który po Upadku runął na Polskę. Niczym Arka Noego zatriumfowaliśmy nad tą przerażającą siłą natury! Umocniliśmy kontrolę, ustabilizowaliśmy sytuację, a dziś jak zawsze włączamy naszą rozgłośnię, pragnąc dowiedzieć się: co dalej? Cóż... odpowiedź jest prosta: wkrótce przyjdzie czas ustabilizować i wesprzeć duchowo resztę regionu! Teraz! Wszyscy razem!\nAVE MARIA!\nAVE MARIA!\nAve. Maria.\nDobranoc, słuchacze. Jutro nadejdą wielkie czyny."

