TOR_division_spawn_tooltip: "§YOdblokuje to decyzję w interfejsie, która pozwoli nam wystawiać dodatkowe dywizje w stolicy.§!"
TOR_mohair_partisans_tooltip: "§YOdblokuje to decyzję na mapie, która pozwoli nam wystawiać nieregularne jednostki na tyłach wroga.§!"
TOR_swarm_of_ordinands_tooltip: "§YZastąpiwszy osobisty nadzór Ojca Rydzyka sumienną pracą wyznaczonych urzędników, nie ryzykujemy już pominięcia ważnych spraw państwowych.§!\n§GMisja §RRekonwalescencja§! w interfejsie zostanie wyłączona.§!"
TOR_holiness_modifiers: "§gModyfikatory wynikające z obecnej świętości:§!\n§YStabilność§!: [?TOR_holy_stab_war_var|=%+]\n§YPoparcie wojny§!: [?TOR_holy_stab_war_var|=%+]\n§YSzybkość budowy świątyń§!: [?TOR_holy_stab_war_var|=%+]\n§YTempo reorganizacji dywizji§!: [?TOR_holy_army_var|=%+]\n§YObrona armii na terytorium narodowym§!: [?TOR_holy_army_var|=%+]\n§YPrzyrost siły politycznej§!: [?TOR_holy_pol_var|=+]\n§YWspółczynnik dostępnej populacji§!: [?TOR_holy_pop_var|=%+]\n§YStawka podatkowa§!: [?TOR_holy_tax_var|=%%+]\n§YWzrost ruchu oporu§!: [?TOR_holy_res_var|=%-]\n\n[GetTORHolinessModifiers]"
modifiers_holy_min: "§RPostrzegana świętość Ojca Dyrektora podupada!§!\nLiczne oszustwa, korupcja, kłamstwa i tym podobne sprawiły, że zaufanie do władz kościelnych osłabło. Większość ludzi nie uważa Rydzyka za wywyższoną postać, lecz za kolejnego chciwego watażkę, który próbuje czerpać zyski z religii. Brak boskiej legitymizacji prowadzi do niepokojów wewnętrznych i chaosu politycznego. Nawet wierni coraz częściej nazywają Ojca Rydzyka \"grzesznym\".\n§gAureola władzy zdaje się blednąć - niszcząc wszelkie ślady jego wiecznej legendy.§!"
modifiers_holy_mid: "§YPostrzegana świętość Ojca Dyrektora utrzymuje się na stabilnym poziomie!§!\nByć może nie wszystkie oszustwa i nadużycia pozostały niezauważone, lecz autorytet Kościoła zachowuje stabilną pozycję! Część parafian nadal kwestionuje szczerość Ojca Rydzyka, ale nie są dość liczni, by zagrozić jego rządom. Uczucia wiernych wobec duchowych przywódców pozostają mieszane. Sukcesy przeplatane skandalami tworzą wokół Tadeusza Rydzyka umiarkowaną aurę cnotliwości - jedni ją dostrzegają, inni stanowczo jej odmawiają."
modifiers_holy_max: "§GPostrzegana świętość Ojca Dyrektora jest bliska osiągnięcia szczytu!§!\nPełne pochwał audycje, radiowe kazania, pielgrzymki i inne widowiska dla ludu przyczyniły się do uwielbienia Ojca Rydzyka. Wszystkie skandale i przeinaczenia zostały skutecznie zatuszowane albo całkowicie giną w ogromie sukcesów. Ludzie chętnie uczestniczą w nabożeństwach, a wszystkie dekrety Kościoła cieszą się prawdziwie boskim autorytetem.\n§GDla niektórych Ojciec Dyrektor już jest żyjącym świętym. Jak wielkim szczęściem jest możliwość przebywania w jego obecności?§!"
TOR_holy_modifier: "§8Świętość§! Ojca Rydzyka"
