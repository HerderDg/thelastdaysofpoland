TOR_extending_our_protection_desc: "Witajcie, słuchacze. Chciałbym dziś zacząć od powtórzenia tego, co wszyscy już wiemy: dobrzy ludzie uwięzieni pod butem marszałka Całbeckiego są prześladowani za swoją wiarę i oddanie! To oburzające! Błagają o możliwość czczenia Prawdziwego Boga i wyczekują dnia, w którym wyzwoli ich ręka Ojca Rydzyka. Co jeszcze bardziej niepokojące, drodzy słuchacze, nasza dobroczynna fundacja posiada w regionie liczne inwestycje, którymi marszałek Całbecki uparcie nie pozwala nam zarządzać! Robimy jedynie to, co konieczne - nie, to, co od zawsze było nieuniknione. Ave Maria, bracia. Waszą walkę pobłogosławił Bóg."
TOR_restore_the_resting_place_desc: "Dziś wspomnimy spuściznę księdza Jerzego Popiełuszki. Kapelan ludowej \"Solidarności\", zamordowany przez reżim komunistyczny, jest prawdziwym męczennikiem naszych czasów! Choć niestety jego kanonizacja nie została jeszcze zatwierdzona, i tak oddamy mu należną cześć. W tym celu odnowimy poświęcony mu pomnik oraz muzeum jego imienia w Górsku. Uczynimy go jednym z naszych licznych patronów i weźmiemy sobie do serca jego przewodnictwo. W końcu zasługuje wyłącznie na pochwałę, a nasze działania z pewnością są zgodne z tym, czego pragnąłby dla naszego kraju. Niech Bóg nas błogosławi! Błogosławiony Jerzy Popiełuszko, módl się za nami!"
TOR_lessons_from_the_martyr_desc: "Bracia i siostry, możemy uważać się za bezpiecznych od tych, którzy sprzeciwiają się Panu, lecz jeśli nie przedsięweźmiemy niezbędnych środków ostrożności, zginiemy męczeńską śmiercią tak samo jak ksiądz Popiełuszko! Wszyscy znamy przyczynę jego śmierci: jadowitą żmiję komunizmu! Każdy z nas musi dopilnować, by komunizm oraz podobne lewicowe czy bezbożne ruchy nie znalazły schronienia na naszym terytorium! Dla własnego dobra i dobra najbliższych musicie zadbać, by żadna czerwona myśl się nie przedostała, żadna się nie narodziła i żadna nie wydostała się na zewnątrz. Jeśli chcemy zapewnić sobie istnienie, sierp i młot muszą zostać zniszczone."
TOR_forming_the_berets_desc: "Drodzy słuchacze, Upadek dawnego, grzesznego państwa polskiego nauczył nas przede wszystkim, że nic poza Bogiem nie trwa wiecznie. Nawet emeryci nie odpoczywają. Każdy może służyć Jemu i Kościołowi. Nawet jeśli ktoś nie potrafi walczyć, wciąż może strzec pokoju. Powiadam wam: nagroda w Niebie będzie stukrotnie większa od wszystkiego, co możecie otrzymać na Ziemi, a wielkość waszego oddania zajaśnieje u stóp Boga niczym gwiazdy. W każdej parafii, na każdym posterunku możecie zapytać o możliwość wstąpienia do straży miejskiej, sił pokojowych lub jakiejkolwiek innej potrzebnej nam formacji. \nChwała ochotnikom!"
TOR_rations_cooked_with_love_desc: "Pan nakazuje nam karmić błąkających się i głodnych. Nasz naród wpisał tę zasadę wprost w swoje obyczaje gościnności: chleb i sól stały się jej symbolem jak żaden inny. Lecz skoro Pan nakazuje nam nakarmić obcego, o ileż większa jest potrzeba nakarmienia świętego żołnierza, który was chroni? Apelujemy zatem do wszystkich gospodyń domowych i babć: utrzymujcie garnki z zupą ciepłe i pełne, aby nasi krzyżowcy mogli najeść się do syta, ilekroć będzie trzeba!"
TOR_crossborder_callins_desc: "Największym osiągnięciem naszego Kościoła jest nie tylko to, że pod parasolem Radia Maryja objął zasięgiem cały naród, lecz także że przetrwał sam naród. Nawet teraz nasze fale radiowe błogosławią cały kraj. Nawet teraz ludzie z całej Polski włączają odbiorniki i słuchają. \nNie niepokójcie się zatem, gdy przybysze spoza naszego błogosławionego miasta zjawią się tutaj i będą wychwalać Pana tak samo jak my. Błogosławi ich to samo słowo, to samo wyznanie i ta sama cnota. Są waszymi braćmi i siostrami, podobnie jak Apostołowie. Nie ma torunianina, krakowianina ani Mazura; są tylko dzieci Boże żyjące na jednej częstotliwości!"
TOR_mohair_partisans_desc: "Wierni, pobożni bracia! Jak długo jeszcze będziecie stać bezczynnie, gdy wasi bezbożni przywódcy ciągną naród coraz dalej drogą zatracenia! Okłamują was, bracia. Wmawiają wam, że liczy się cokolwiek poza miłością Boga. Wmawiają wam, że nie istnieje życie po śmierci. \nIch panowie rosną w bogactwo, lecz radujcie się: nic ich nie obchodzą. Zapytajcie ludzi żyjących pod okupacją, czy choć jeden eurokrata chce w ogóle spróbować poprawić ich los! Powstańcie więc do ostatniego tańca z wilkami, które próbowały zastąpić Pasterza! Ich szatańscy panowie porzucili ich. Teraz nadszedł czas PANA, czas Maryi i pobożnych. \nNie miejcie zatem wątpliwości: nie prosimy was o protest. Wzywamy was do walki! Cokolwiek macie pod ręką, wykorzystajcie przeciwko bezbożnikom, przeciwko wszystkim, którzy podnoszą pięść na nasz Kościół! Przeciwko wszystkim, którzy próbowali odebrać przyszłość naszym dzieciom! Przypomnijcie im, że szatańskich imperialistów nic oni nie obchodzą!"
TOR_load_up_the_offerings_desc: "Dziś wieczorem dokładnie o godzinie 22 wszystkie nasze kościoły odprawią Mszę Świętą na waszą cześć, dawcy dziesięcin. Gdy poprosiliśmy was, byście wyrzekli się ziemskiego dobytku, przekazali naszym kościołom bezprecedensowe ofiary w towarach i kapitale, wzięli swój krzyż i poszli za nami - spełniliście wezwanie! \nNa wojnie, w krucjacie przeciw złu, nie wolno szczędzić żadnych środków. Aby pokonać diabła, oddajcie wszystko. Czegokolwiek nie macie, a czego potrzebujemy - wyprodukujcie to. Zło może sforsować bramy Kościoła choćby jutro, ale dzięki naszemu całkowitemu oddaniu to wróg zazna śmierci i klęski!"
TOR_a_return_from_retirement_desc: "Dzisiejsza wojna, dzisiejsze zmagania, sam Upadek - wszystko to dowodzi jednego: nie ma odpoczynku ani jego gwarancji. Jest tylko wojna i następujący po niej pokój, wywalczony potem naszych czół. Słuchacze, uwierzcie w płonący wewnątrz ogień wiary: Bóg i Jego wola są w was. Nawet jeśli nie możecie walczyć, z pewnością możecie pracować. Każdy z naszych najlepszych żołnierzy potrzebuje za sobą dwóch cywilów, którzy wezmą swój krzyż i będą przekazywać mu amunicję, żywność oraz lekarstwa. Chrystus nie niósł swego krzyża samotnie i nasze siły również nie będą. Dzięki wszystkim ochotnikom nasze fabryki nie przestaną pracować nawet nocą, zapewniając nam zwycięstwo!"
TOR_no_step_closer_heathen_desc: "Wrogowie Kościoła! Padnijcie na kolana w błocie i brudzie i błagajcie Maryję o litość. My jej nie mamy! Wszyscy słuchacze tego błogosławionego Radia znają wasze dusze na wylot. Widzą ropiejące w nich zło! \nI dlatego będą walczyć z tobą, wrogi żołnierzu, wszystkim, po co zdołają sięgnąć: ołowianą rurą, zaostrzonym krzyżem, koktajlem Mołotowa! Przegrałeś tę wojnę. Twoi panowie cię porzucili! Przez setki lat próbowali nas unicestwić! Śmiesz sądzić, że tobie uda się w dziesięć?! Nie damy ci nawet jednego! \nNie pozostajemy w tyle z natarciem: przeniesiemy walkę na wasz teren! Nie damy wam ani chwili wytchnienia! Wykrzyczymy wam w twarz nasz sprzeciw! Zadźgamy was, skopiemy, pogryziemy, wytniemy wam wątroby i... *zakłócenia*"
TOR_renewing_our_contracts_desc: "Niech będzie pochwalona Najświętsza Maryja Panna!\nUmiłowani bracia! Znamy obecną sytuację - i wy także powinniście ją znać! Wrogowie otaczają nas ze wszystkich stron! Szatan wyciąga ku nam swoje nikczemne szpony i czeka jedynie na właściwy moment do ataku.\n Dobro Kościoła i bezpieczeństwo wszystkich prawych wymagają, byśmy poszukali profesjonalnej pomocy. Do utrzymywania porządku zwerbujemy elitarne siły wojskowe - najlepsze, najskuteczniejsze i z Bogiem w sercach.\n Dlatego pokornie prosimy o kolejne datki. Niech Bóg błogosławi dobroczyńców!"
TOR_a_loving_home_desc: "Szczęść Boże! \nPobożni katolicy! Z dumą pragniemy ogłosić wdrożenie nowego programu społecznego na całym terytorium naszego Kościoła! Nowa inicjatywa \"Kochający dom\" powstała zgodnie ze słowami prawdy płynącymi z Biblii. \nJej celem jest łaskawe przyjmowanie i goszczenie w waszych domach utrudzonych weteranów nowo powstałego korpusu strzegącego naszego sposobu życia. Okażcie im prawdziwą polsko-chrześcijańską gościnność! Bronią waszej wolności, waszego sumienia, a przede wszystkim - samego Boga. Przyjmijcie ich zatem pokornie pod swoje dachy i podzielcie się wszystkim, czym możecie!\nTo wasz święty obowiązek, Biblia mówi bowiem:\n\"Nie zapominajcie też o gościnności, gdyż przez nią niektórzy, nie wiedząc, aniołom dali gościnę\"."
TOR_absolution_for_the_butchers_desc: "DEUS VULT!\nMoi chrześcijańscy bracia, nadszedł czas trudu i krwi. Tego właśnie wymaga od nas Bóg! Wszystkim pobożnym katolikom, którzy wstąpią do naszych sił zbrojnych i z oddaniem, niezłomnością oraz żarem wiary będą walczyć do ostatniego tchu za naszą prawą sprawę, zostaną odpuszczone wszystkie grzechy! \nChoć droga ta nie jest łatwa, zmusiły nas do niej knowania Diabła i jego sług. A jednak \"choćbyś przechodził przez dolinę ciemności, zła się nie ulękniesz\". Nasi przodkowie uczą nas bowiem: \"Zabić wroga Chrystusa to nie morderstwo, lecz czyn godny chwały\". Co więcej, obrona przed niewiernymi jest zarazem naszym prawem i obowiązkiem. \nOdwagi!"
TOR_a_marian_crusade_desc: "Chwała Chrystusowi! \nDrodzy słuchacze i nowo przybyli - usłyszcie nasz głos! Nasz Błogosławiony Ojciec Dyrektor wraz z najczcigodniejszymi kapłanami, z obowiązku i troski o nas wszystkich, ogłasza Wielką Krucjatę Najświętszej Maryi Panny! \nW obliczu nikczemnego zła, które czyha, gotowe uderzyć w pobożnych chrześcijan takich jak my, trzeba podjąć zdecydowane działania! \nBracia! Każdy rekrut jest wśród nas mile widziany, o ile pragnie walczyć za naszą świętą i sprawiedliwą sprawę. \nZgodnie z nieomylnymi słowami Biblii: dopóki Pan jest twoim pasterzem, a Ojciec Dyrektor Jego przedstawicielem na Ziemi, niczego ci nie zabraknie!"
TOR_military_spiritual_complex_desc: "Niech będzie pochwalony Jezus Chrystus!\nChwalcie Pana, bo jest doskonały i troszczy się o nas jak o swoje dzieci! Jego miłosierdzie kontynuuje tu, na Ziemi, czcigodny Ojciec Dyrektor, który dba o nas i czuwa nad naszym bezpieczeństwem! \nDlatego werbujemy wyspecjalizowaną armię najlepszych fachowców - tych, którzy ochronią nas przed plugastwem tego świata! Wszystko dzięki wielkoduszności naszego Ojca Dyrektora! \nMódlcie się za naszych żołnierzy! \nStworzenie najdoskonalszej armii nie może się dokonać bez WASZYCH modlitw i wsparcia w postaci regularnych datków. \nDlatego apelujemy - wysyłajcie, ile możecie! Te środki nie zostaną zmarnowane! Chodzi o naszą przyszłość, wiarę i bezpieczeństwo!"
TOR_paying_off_our_protectors_desc: "Chwała Chrystusowi! \nDrodzy chrześcijanie! Z myślą o wspólnym bezpieczeństwie nasz Błogosławiony Ojciec Dyrektor ogłasza, co następuje. Od tej pory poszczególne parafie będą miały zarówno zaszczyt, jak i obowiązek wspierać wyznaczone jednostki naszych dzielnych żołnierzy. \nPrzedsięwzięcie nie powiedzie się bez WASZEGO wsparcia. Dlatego gorąco apelujemy o hojniejsze datki na rzecz naszej wspólnoty. \nNie wahajcie się! Każda ofiara jest potrzebna! \nJak uczy nas Biblia w przypowieści o miłosiernym Samarytaninie, należy pomagać potrzebującym! \nPyszni i samolubni parafianie, którzy nie wysyłają żadnych datków, wcielają się w rolę tych, którzy minęli pobitego człowieka, nie udzielając mu pomocy - i tym samym przyoblekają się w grzech! \nA tych, którzy wyciągają pomocną dłoń - NIECH BÓG BŁOGOSŁAWI!"
TOR_the_sanctuary_fortress_desc: "Szczęść Boże!\n Pobożni bracia i siostry! Bądźcie gotowi, bo słudzy Szatana czyhają na nas, chrześcijan! Zło lęka się nas jako wiernych sług Jego Potęgi. \nAby przetrwać te trudne czasy, musimy wykuć siłę ducha i ciała. Módlcie się zatem, bracia, bo tego właśnie potrzebujecie! \nNiniejszym ogłaszamy budowę twierdzy, jakiej świat dotąd nie widział - w samym sercu Torunia. Jej mury będą nie do przebicia, lecz dla osiągnięcia prawdziwej harmonii serca jej obrońców muszą okazać się równie niewzruszone! \nZbierzmy środki na nasz Bastion Dziewicy Maryi, który będzie bronił świata fizycznie i moralnie, bo potęga tych fortyfikacji okaże się niezwyciężona! \n\"Bądźcie mocni i mężnego serca, wszyscy, którzy ufacie Panu!\""
TOR_business_before_ideology_desc: "Choć perspektywa wojny z niszczycielskimi, bezbożnymi siłami heretyckich brygad kobiecych i innymi równie zdeprawowanymi, ateistycznymi formacjami może wydawać się nader kusząca, Błogosławiony Ojciec postanowił: musimy zaczekać! Jeśli zaatakujemy wrogów wiary naszymi obecnie, niestety, ograniczonymi siłami, ryzykujemy zagładę wskutek zdrady przeciwników. Jeżeli nie zachowamy ostrożności, nasza sprawiedliwa krucjata spełznie na niczym... dlatego zarządził: najpierw musimy zabezpieczyć wschodni brzeg Wisły, a dopiero potem ruszymy na nikczemne siły znajdujące się na Kujawach. Niech nasza prawa armia najpierw zgromadzi siły, a później rozprawimy się z resztą plugawiącą święte ziemie."
TOR_a_legacy_of_failure_desc: "Bóg. Honor. Ojczyzna. Tak brzmiało motto Wojska Polskiego, drodzy słuchacze. Zaprawdę piękne słowa. Niestety generał Adamczak swoim dogodnym \"niepowodzeniem\" w powstrzymaniu niemieckiej inwazji ostatecznie dowiódł, że je z ręki swoich prawdziwych panów w Berlinie. Fakt, że nadal dowodzi resztkami armii w Grudziądzu, jest obrzydliwością wobec Pana i całej Polski! Nie martwcie się jednak, bo nadzieja nie zginęła. Wprost przeciwnie! Pan da nam siłę, by rozprawić się ze zdrajcami bez względu na siły, jakie przeciwko nam rzucą, i przywrócić miastu święty porządek. Szczęść Boże!"
TOR_and_its_spoils_desc: "Upadek zdradzieckiego generała rozpoczyna nową erę zarówno dla naszego ludu, jak i armii! Jak widzicie, drodzy słuchacze, po kapitulacji ocalałe dywizje pozostawiły cenne wyposażenie, które posłuży do wzmocnienia naszych wojowników w ich świętej misji. Choć nie może się ono równać z arsenałem, którym Adamczak dysponował we wczesnych etapach naszej słusznej obrony zachodniej granicy Polski, z pewnością zwiększy naszą siłę na tyle, byśmy mogli stawić czoła przyszłym zagrożeniom. Ludzie, którzy podczas kampanii wykazali się wyjątkową cnotą, jako pierwsi wybiorą coś spośród łupów. Bóg hojnie wynagradza tych, którzy walczą w Jego imię."
TOR_rehabilitate_the_generals_desc: "Na szczęście nawet pośród cierni rosną piękne maryjne róże. Kilku generałów z frakcji Adamczaka ujrzało światło, zmieniło stronę i zadeklarowało miłość do programu Ojca Dyrektora, a także gotowość narzucenia jego woli całemu regionowi. Radujcie się, gdyż ich doświadczenie dowódcze będzie ogromnym wsparciem dla armii wiernych walczących obecnie o ocalenie Kujaw przed grzesznym losem. W końcu wojna i jej nieświęte następstwa są domeną świeckich, a nie świętego, czystego kapłaństwa. Nasze wsparcie będzie lepiej odczuwalne w kościołach."
TOR_the_cowardly_hog_desc: "Kim jest Jacek Hoga, drodzy słuchacze? Historykiem, który nie potrafi rozpoznać prawdziwych dziejowych wrogów Polski. Militarystą zbyt tchórzliwym, by walczyć, zdradzającym sojusznika na widok bitwy. Myśliwym, który uciekł niczym zwierzyna. Pobożnym katolikiem, który jakimś sposobem odwrócił się od Chrystusa.\nNajwyraźniej się zagubił.\nNie powinniśmy więc być zaskoczeni, gdy oddział jego uzbrojonych fanatyków ostrzelał naszą granicę. Na szczęście nikt nie ucierpiał, lecz nie możemy narażać życia dzielnych ochotników ani cywilów mieszkających na pograniczu.\nZ przykrością będziemy musieli odpowiedzieć przemocą na przemoc, pomaszerować na Rypin i powstrzymać buntowników."
TOR_commercialize_mega_mary_desc: "Dobre wieści, bracia i siostry! Pomnik Matki Bożej został ukończony. Mimo zawieruchy Upadku budowa tego dzieła sztuki nigdy się nie zatrzymała i doznała jedynie drobnych opóźnień. Monument stanął w Konotopiu, pół dnia marszu od Torunia, i mierzy 55,6 metra, górując nad każdym innym posągiem w Polsce. Godnie reprezentuje majestat Maryi, bez której nigdy nie moglibyśmy osiągnąć zbawienia.\nW swojej cnotliwości Ojciec Dyrektor pozwolił wiernym podziwiać pomnik za darmo, pod warunkiem że pozostaną w odległości większej niż 150 metrów. Osoby pragnące podejść bliżej wniosą odpowiednią opłatę, aby ten cud mógł być należycie utrzymywany. Oczywiście wejście na balkon na szczycie głowy Maryi będzie wiązać się z dodatkowymi kosztami."
TOR_allies_in_need_desc: "Mimo naszego zwycięstwa dzielni żołnierze są nękani przez partyzantów deklarujących wierność Fundacji Ad Arma. Ich niedorzeczna wytrwałość zapewne wynika z niezdolności naszych wojowników do odnalezienia zbiegłego Jacka Hogi. Każdy, kto mógł widzieć jego lub którąkolwiek z powiązanych z nim osób, ma obowiązek zgłosić ten fakt władzom. Bezczynność oznacza współudział.\nNasi dowódcy nie spodziewali się takiego stopnia trudności, nawet biorąc pod uwagę zamiłowanie bojowników Ad Arma do broni palnej oraz często stosowaną przez nich taktykę partyzancką.\nOjciec Rydzyk powiedział w niedawnym wywiadzie, że podejrzewa istnienie sieci cywilnych sympatyków, a nawet zagranicznego finansowania dla powstańców, gdyż nie istnieje żadne racjonalne wyjaśnienie sukcesów naszych wrogów. Mimo tych przeciwności z pomocą Boga odniesiemy zwycięstwo.\nDo tego czasu podróżnym zaleca się omijanie terenów dawnych powiatów rypińskiego i lipnowskiego."
TOR_the_forgotten_corner_desc: "Mimo nawałnic rozpętanych przez wrogich watażków dzielny garnizon Brodnicy nadal stawia opór wrogom Polski. Jego wysiłek zasługuje na podziw, zwłaszcza z uwagi na ograniczone zasoby i stan osobowy.\nDlatego Ojciec Tadeusz uda się do Brodnicy, by pobłogosławić mężnych żołnierzy, którzy pozostali tam mimo wszystko. Dla ochrony będzie mu towarzyszył regiment weteranów toruńskiego garnizonu. Z pewnością będą mieli wiele wojennych opowieści, którymi podzielą się z brodnickimi rodakami. Nasi logistycy wyślą także obfite ilości racji wojskowych, by uwolnić ich od głodu.\nPo uroczystości obecny garnizon zostanie przeniesiony w stan spoczynku.\nMożemy tylko mieć nadzieję, że tym razem naprawdę spocznie."
TOR_venom_from_the_pulpit_desc: "Modlimy się za wszystkich poległych i o zdrowie żyjących żołnierzy, gdy nasza walka trwa dalej. Na południu czekają wrogowie brutalniejsi od tych, którym stawiliśmy czoła na północy. Walka z nimi jest nie tylko walką fizyczną, lecz także duchową. Sataniści zza Wisły będą próbowali niszczyć wasze dusze za pomocą pokus i szerzenia fałszywych doktryn. Gdy nasi dzielni wojownicy będą chronić nas na froncie, każdy cywil strzeże sumienia tych, którzy oczekują w domach na koniec konfliktu. Zgłaszajcie wszystkich rozpowszechniających heretyckie i wywrotowe materiały i palcie nieświęte księgi. Uczestniczcie we mszach, módlcie się o nasze zwycięstwo i pamiętajcie o wpłaceniu dobrowolnej części na fundusz wojskowy. Zróbcie to, a zatriumfujemy."
TOR_the_village_housewives_desc: "Kto korzysta na tworzeniu podziałów w naszym narodzie, drodzy słuchacze? Kto korzysta na rozbiciu polskiej tożsamości na niezliczone kawałki, które dzieli nas i przez to osłabia? Oczywiście nasi wrogowie - Republika Krajny i jej sojusznicy. To zagraniczni agenci ukrywający się na widoku. Czyi? Tego dopiero trzeba się dowiedzieć. Nie dajcie się zwieść ich pozornie szlachetnym i niewinnym inicjatywom; stworzono je wyłącznie po to, by odciągnąć was od Chrystusa. Weźmy na przykład koła gospodyń wiejskich. Ta forma aktywności społecznej jest pułapką wymierzoną bezpośrednio w was, nasze słuchaczki, i skrytą pod atrakcyjną postacią. Oficjalnie mają pomagać wiejskim rodzinom w wychowywaniu, kształceniu i organizowaniu wypoczynku dzieci oraz młodzieży, a także propagować ochronę zdrowia i zabezpieczenie społeczne rodzin wiejskich. Wszystko to bez jednego słowa o promowaniu wartości chrześcijańskich. Ignorowanie Boga wypaczy te inicjatywy w coś złego.\nPołożymy temu kres."
TOR_countryside_expansion_desc: "Aby zapewnić prawdziwą pomoc w ochronie wartości rodzinnych i właściwym wychowaniu miejscowych dzieci, wielu gorliwych toruńskich kapłanów redemptorystów uda się do wsi i miasteczek niedawno ponownie zjednoczonych z naszym prawym Kościołem. Będą tam służyć jako wasi proboszczowie i katecheci. Mamy nadzieję, że nowe wspólnoty okażą im należny szacunek, gościnność i wyrozumiałość, gdyż wielu z nich dopiero niedawno przyjęło święcenia kapłańskie. Nie martwcie się. Żadna wieś nie zostanie pominięta. Dzięki czynom Ojca Rydzyka i innych duchownych redemptorystów dysponujemy obfitością kapłanów gotowych wyruszyć do każdej miejscowości znajdującej się pod naszą ochroną."
TOR_the_old_decrepit_church_desc: "Czy arcybiskup Polak i jego instytucje naprawdę reprezentują polski Kościół katolicki? Wątpliwe. Rozejrzyjcie się, drodzy słuchacze. Polska leży w ruinach. Pod jego jurysdykcją liczba wiernych maleje. To wyraźny znak od Boga, że musimy zmienić swoje postępowanie. Nowy Potop miał stać się początkiem nowej epoki. Najwyraźniej Ojciec Rydzyk miał być jego prorokiem przeznaczonym do przewodzenia polskiemu duchowieństwu. Tymczasem w swojej pysze arcybiskup Polak postanowił pozostać głuchy na dialog i nadal kurczowo trzyma się wygodnego urzędu, skazując nas na konflikt zbrojny. Chodźcie, bracia i siostry. Wspólnie obalimy instytucje Antykościoła i ocalimy naszą wspólnotę przed moralnym zepsuciem ogarniającym świat."
TOR_upending_the_hierarchy_desc: "Jak często widujecie swoich miejscowych biskupów, drodzy słuchacze? Zapewne rzadko. A arcybiskupów? Jeszcze rzadziej. Jak mogą was prowadzić? Czy pasterz może prowadzić trzodę, której nie widzi? Jak ma naśladować Chrystusa, szukając jednej zagubionej owcy, jeśli jest tak odizolowany, że nawet nie zauważa jej zniknięcia?\nPorównajcie tę postawę z Ojcem Dyrektorem. Możecie słyszeć go w swoich domach co tydzień, jeśli nie codziennie. Nie jesteście jedynie jego słuchaczami, jesteście jego Rodziną. Rodziną Radia Maryja. Czy gdziekolwiek indziej w Kościele znajdziecie taką bliskość?\nNie ulega wątpliwości, że organizacja wspólnoty powinna przypominać raczej wizję Ojca Rydzyka niż wizję Polaka. Bezspornie to Ojciec Rydzyk powinien przewodzić Kościołowi katolickiemu na ziemiach polskich."
TOR_an_old_feud_to_settle_desc: "W województwie istnieje pęknięcie. Pęknięcie przypominające to, które podzieliło nasz naród. U jego źródła leżą dwie ścierające się siły, każda z własnym regionalnym centrum: siła dobra ma swój dom w Toruniu - pradawnym mieście pobożności i nauki. Siła zła zamieszkuje zaś Bydgoszcz - wcielenie nikczemności i nadmiernej ambicji, które z zazdrości próbuje przyćmić starszego brata. Rozbudowane przez największych wrogów Polski - Niemców i Sowietów - niegdyś szlachetne jądro miasta zostało uwięzione w murach protestantyzmu i ateizmu. Musimy ocalić jego duszę oraz dusze mieszkańców, oddając je pod nadzór Ojca Rydzyka. Nasze siły już zresztą wyruszyły!"
TOR_well_earned_vainglory_desc: "Bydgoszcz została wreszcie wyzwolona spod grzesznych rządów. To dobra wiadomość dla wszystkich wiernych żyjących w tej jaskini niemoralności. Aby chrześcijaństwo mogło się jednak zakorzenić i odwrócić skutki dziesięcioleci liberalnego pobłażania, trzeba podjąć szereg zdecydowanych działań. Ojciec Dyrektor planuje zbudować dziesiątki nowych kościołów, by dokonać rekatolicyzacji miasta. W swojej dalekowzroczności zlecił opracowanie projektów jeszcze przed interwencją wojskową. W wizji naszego Ojca nowe świątynie, podobnie jak całe miasto po jego pozornie niemożliwym nawróceniu, zostaną poświęcone świętemu Tadeuszowi Apostołowi, patronowi spraw beznadziejnych.\nPonadto w centrum miasta powstanie nowa stacja nadawcza Radia Maryja.\nOczywiście dla upamiętnienia dobroczyńcy stojącego za wszystkimi tymi pozytywnymi zmianami stary rynek ozdobi potężna rzeźba Ojca Tadeusza Rydzyka."
TOR_the_sacred_heart_desc: "Mimo ateistycznej fasady Bydgoszcz skrywała wielu pobożnych katolików, którzy z powodu opresyjności liberalnego reżimu musieli ukrywać się niczym dawni chrześcijanie. Jednym z takich bohaterów jest ksiądz Roman Kneblewski - wielki działacz społeczny, który nawracał wyrzutków pozostających poza zasięgiem zwykłych kapłanów. Jego kazań można słuchać w każdą niedzielę w kościele Najświętszego Serca Pana Jezusa, co gorąco polecam.\nMimo podeszłego wieku ksiądz Kneblewski nadal chętnie przyjmuje nowe obowiązki. Niedawno zgłosił się na ochotnika jako kapelan wojskowy, by nieść naszym dzielnym żołnierzom wsparcie duszpasterskie, duchowe i emocjonalne. Składamy mu nieskończoną wdzięczność za to bezinteresowne poświęcenie."
TOR_daughters_of_satan_desc: "Gdy stało się jasne, że to my zaprowadzimy porządek w Toruniu, wiele kobiet uciekło z miasta z powodu rzekomo nadchodzącej dyskryminacji. We Włocławku twierdziły, że dążą do prawdziwej równości. W istocie pragną jedynie zwodzić inne kobiety fałszywymi obietnicami. Jak można było oczekiwać po Plemieniu Lilith, zatopiły szpony w nienarodzonych dzieciach. Następnie postawiły święte hierarchie na głowie i sprowadziły na lud cierpienie. Wszystko w imię błędnie pojmowanej równości. I cóż to za równość? Nazywają się \"Brygadami Ochrony Kobiet\". A co z mężczyznami? Jak mogą w ogóle definiować równość, zapominając o połowie ludzkości? Musimy poskromić ich występki, zanim zatrują umysły jeszcze większej liczby naiwnych kobiet."
TOR_relearning_family_values_desc: "Córki marnotrawne powracają. Teraz, gdy okowy progresywizmu zostały zerwane, możemy zacząć ponownie włączać zagubione kobiety do społeczeństwa. To zajmie trochę czasu. Poza feministyczną propagandą, której były poddawane, widzimy, że wiele z nich nigdy nie zostało właściwie zapoznanych z Kościołem katolickim. Niektóre raporty wskazują wręcz, że znaczna część nawet nie przyjęła chrztu. Doprawdy przerażające, nieprawdaż?\nOjciec Tadeusz zaplanował już liczne kursy, które naprawią tę sytuację. Projekt obejmie serię zajęć z praktycznych kobiecych umiejętności, takich jak gotowanie i sprzątanie, połączonych z rozbudowaną katechezą, której zwieńczeniem będzie ponowne przyjęcie do Kościoła albo chrzest."
TOR_the_good_wives_of_torun_desc: "Ponowne przyjęcie zbłąkanych kobiet na łono Kościoła odniosło sukces większy, niż ktokolwiek mógł sobie wyobrazić. Dzięki wysiłkom naszych uczonych kapłanów wczorajsze ladacznice są dziś pokornymi córkami Chrystusa. Nie będą już obciążane wymagającymi zadaniami nieodpowiednimi dla płci pięknej. Koniec z umieraniem w okopach i uginaniem się pod ciężarem politycznej odpowiedzialności. Są gotowe, by mężczyźni zajęli się takimi sprawami. Kobiety zadbają natomiast o życie rodzinne, zgodnie z zamysłem Boga. Oczywiście do założenia rodziny potrzebują mężów. Niestety nagły napływ kobiet połączony z niedoborem mężczyzn wywołanym wojną sprawia, że aranżowanie małżeństw jest trudniejsze niż zwykle. Wzywamy wszystkich chętnych kawalerów do udziału w kolejnym projekcie Rydzyka - katolickiej odpowiedzi na grzeszne aplikacje randkowe, poświęconej nie lubieżnym przygodom, lecz tworzeniu nowych rodzin."
TOR_kuyavia_sworn_to_mary_desc: "Pod Twoją obronę\nuciekamy się, Święta Boża Rodzicielko;\nnaszymi prośbami\nracz nie gardzić w potrzebach naszych,\nale od wszelakich złych przygód\nracz nas zawsze wybawiać,\nPanno chwalebna i błogosławiona.\n\nDziękujemy Ci, Maryjo, Matko Boża, bo pozwoliłaś nam rozprzestrzenić Twoje miłosierdzie na całej kujawskiej ziemi. My, Twoi pokorni słudzy, z wdzięcznością nadal szerzymy Twoje słowo. Ofiarujemy Ci tę świętą ziemię, aby pozostała pod Twoją ochroną. Pobłogosław Kujawy i Ojca Tadeusza Rydzyka w jego dążeniu do ponownego zjednoczenia narodu tak umiłowanego przez Twojego Syna."
TOR_copiosa_apud_rydzyk_redemptio_desc: "Dzisiejszą audycję chciałbym poświęcić Ojcu Rydzykowi - Triumfatorowi Kujaw. Niech zostanie obdarzony dobrym zdrowiem, aby mógł prowadzić nas przez nadchodzące dziesięciolecia. Jest bowiem najprawdziwszym posłańcem Boga na polskiej ziemi. Bez wątpienia stanowi duchowego spadkobiercę świętego Alfonsa Liguoriego, gdyż przewodzi Zgromadzeniu Najświętszego Odkupiciela, najcnotliwszemu z katolickich zgromadzeń. Potrzebujący mogą przyjść do niego, a on ich nasyci, jak gdyby posiadał mityczny róg obfitości. Ta mnogość darów i sukcesów jest najwyraźniejszym znakiem boskiej opatrzności nad naszą sprawą.\nAmen."

