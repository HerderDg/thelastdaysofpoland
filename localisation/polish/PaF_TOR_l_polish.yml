TOR_envy_of_the_fallen_desc: "Chwalcie Pana!\nDrodzy słuchacze! Czy kiedykolwiek zastanawialiście się nad łaską Boga, która spływa na nas pod przewodnictwem błogosławionego Ojca Dyrektora? \nZaprawdę radujmy się, że rządzi nami tak wspaniały człowiek! Tylko szaleniec pragnąłby buntu albo rewolucji. Na szczęście przy naszym doskonałym systemie bezpieczeństwa coś takiego jest zwyczajnie niemożliwe... prawda? \nNa zakończenie cytat z Biblii do osobistej refleksji:\n\"Każdy niech będzie poddany władzom, sprawującym rządy nad innymi. Nie ma bowiem władzy, która by nie pochodziła od Boga, a te, które są, zostały ustanowione przez Boga. Kto więc przeciwstawia się władzy - przeciwstawia się porządkowi Bożemu\"."
TOR_the_revolving_door_desc: "Niech Bóg was błogosławi! \nDrodzy bracia i siostry! Spójrzmy, jak wspaniałą chrześcijańską wspólnotę razem budujemy! \nNic z tego nie byłoby możliwe bez czcigodnych kapłanów, którzy strzegą porządku naszych dusz! \nOgromnie radują nas także wasze DOBROWOLNE datki: \nNiedawno pani Halina z ulicy Agrestowej - z własnej, nieprzymuszonej woli - przekazała dwa całe mieszkania oraz wypłaty emerytury do końca życia, oczywiście w zamian za błogosławieństwa i najwyższy standard opieki duchowej. Łzy radości spływały jej po twarzy, gdy wiedziała, że może przyczynić się do budowy dobrobytu!\nWszyscy! Bierzcie przykład i uczcie się!"
TOR_a_servants_memoir_desc: "Wiadomość z ostatniej chwili, drodzy bracia! Niedawno opublikowano skrajnie heretycki dokument zawierający tysiące oskarżeń przeciwko Ojcu Dyrektorowi. Pragniemy przypomnieć, że mimo niedoskonałości Błogosławionego Ojca zdecydowana większość tych zarzutów jest całkowicie bezpodstawna i pozbawiona dowodów! Autorzy, wydawcy oraz wszystkie osoby wspomniane w dokumencie są obecnie poszukiwani i objęci śledztwem. Spokojnie prosimy: nie rozpowszechniajcie dalej tej dezinformacji. Jedyną przyczyną takiego działania byłaby nienawiść do moralności i porządku."
TOR_casting_the_first_stone_desc: "Ponownie prosimy wszystkich słuchaczy, by powstrzymali się od dalszego rozpowszechniania dezinformacji o Ojcu Dyrektorze. Jest niedoskonały, owszem, czasem grzeszy, ale nie jest potworem! My nie jesteśmy potworami! Jesteśmy tylko... zwykłymi ludźmi, dokładnie takimi jak wy. Mimo naszych wad Bóg powierzył nam ostateczne zadanie ustanowienia porządku moralnego w Polsce, dlatego - skoro nasza władza pochodzi od Boga - musicie nas szanować! A teraz wracamy do zwykłego programu."
TOR_a_day_with_mentzen_desc: "Niech będzie pochwalony Jezus Chrystus i zawsze Dziewica Maryja. Dzisiejszym gościem \"Rozmów niedokończonych\" jest ponownie dr Sławomir Mentzen. Panie doktorze, nie można zaprzeczyć, że młodzież wykazuje minimalne zainteresowanie audycjami radiowymi. Mimo poświęconych jej \"Audycji dla młodych\" seniorzy nadal stanowią większość naszych słuchaczy. Jak możemy to zmienić?\n\nKażdy racjonalny konserwatysta wie, że pewne zmiany są nieuniknione. Obecnie większość nastolatków korzysta z platform takich jak TikTok czy Twitter i to się nie zmieni, bez względu na wszystko, Ojcze. Wiem, że redakcję Radia Maryja tworzą przede wszystkim osoby starsze oraz księża, którym trudno nadążać za trendami.\nNa szczęście Radio Maryja nie jest jedynym konserwatywnym medium. Jeśli mogę, chciałbym polecić mój podcast \"Mentzen Prywatnie\", w którym więcej opowiadam o swoich chrześcijańskich wartościach.\n\nMam nadzieję, że od czasu do czasu wspomni pan o Radiu Maryja, aby zwiększyć liczbę słuchaczy.\n\nJeśli Ojciec nalega. Mogę to dla was zrobić."
TOR_turn_up_the_taps_desc: "A teraz słowo od naszego sponsora:\n\n\"Nie patrz na wino, jak się czerwieni, jak iskrzy w pucharze, jak łatwo spływa do gardła!\nBo w końcu kąsa jak żmija, swój jad niby wąż wypuszcza\".\nKsięga Przysłów 23,31-32.\nNa szczęście Biblia nie mówi niczego o piwie!*\nW najbliższych dniach Pub Mentzen powraca z nową promocją! Kup trzy piwa w cenie dwóch! Kup pięć i odbierz wyjątkowy darmowy obiad! Przyjdź szybko i przekonaj się na własnej skórze. I pamiętaj, zawsze możesz polegać na Pubie Mentzen! \n\n*\"Szekar\" wspomniany w Księdze Przysłów 20,1, czasami tłumaczony jako \"piwo\", w rzeczywistości jest mocnym napojem alkoholowym na bazie owoców, a zatem nie piwem w ścisłym znaczeniu tego słowa."
TOR_skeletons_in_our_closet_desc: "Niech Bóg błogosławi wasz dzień! \n\nDzisiejsza audycja odpowiada na niepokojące uwagi kierowane do naszej redakcji w związku z jednym z wcześniejszych gości - szanownym doktorem Sławomirem Mentzenem. Poproszony o komentarz stanowczo zaprzeczył wszystkim stawianym mu zarzutom, nazywając je prostackimi próbami wypaczenia znaczenia dawnych wypowiedzi. W odpowiedzi zapewnił, że nie żywi złej woli, i okazał pokorę na wypadek, gdyby jego słowa kogoś skrzywdziły. \n\nPrzypominam, że takie szkodliwe słowa mogą świadczyć o uleganiu Zazdrości. Jak każdy grzech śmiertelny, należy ją jak najszybciej odrzucić. Człowiek owładnięty zazdrością jest zawistny wobec sukcesu innych i pożąda tego, na co sam nie zapracował. Dołączcie do naszej modlitwy za ludzi, którzy nie chcą zawrócić ze swej pełnej nienawiści drogi."
TOR_an_external_audit_desc: "Po raz kolejny zwracam się do was, słuchacze, z ważnym ogłoszeniem: ABSOLUTNIE nie ma powodów do obaw. Dokumentacja finansowa kościoła św. Andrzeja krążąca w przestrzeni publicznej została SFAŁSZOWANA! Wszystkie nasze wysiłki służyły dopilnowaniu, aby środki wydawano właściwie i wyłącznie na niezbędne koszty! \"Luksusowy\" samochód kupiony przez księdza Nowickiego jest wynikiem rygorystycznych wyrzeczeń i oszczędności z jego strony! Wszyscy dobrze o tym wiemy! Nasi kapłani są najbardziej zdyscyplinowani w Polsce! Twierdzić inaczej znaczy szerzyć szkodliwe opinie o ludziach, którzy odmawiają sobie bogactw, abyście wy mogli cieszyć się dobrobytem!"
TOR_flipping_the_altar_desc: "Bracia i siostry, spójrzcie na stabilność, którą cieszycie się pod opiekuńczymi rządami Kościoła. Jak ktokolwiek mógłby twierdzić, że istnieje lepsza alternatywa? Nasz mandat nie pochodzi z populistycznych haseł, lecz z boskiej łaski Pana. \nBez Kościoła panuje chaos. Panuje anarchia. \nCzy nie wycierpieliśmy już wystarczająco wiele?\nZastanówcie się uważnie, drodzy słuchacze. A wszyscy, którzy włączają tę audycję z nienawiścią, niech ponownie rozważą, czy inny, świecki świat, do którego dążą, przyniósłby jakiekolwiek pozytywne zmiany. Powiadam, przyniósłby wyłącznie nieporządek. \nJeśli życie pod rządami Kościoła jest tak złe, dlaczego po prostu nie przeniesiecie się gdzie indziej? W Polsce istnieje tak wiele innych państewek. Jeśli wam się tutaj nie podoba, możecie swobodnie odejść."
TOR_the_anger_of_a_generation_desc: "Chwalcie Pana! \nUmiłowani wierni! Wróg nigdy nie śpi! Niestety dzisiejszą audycję musimy rozpocząć od ponurych wiadomości. Nasze służby otrzymują coraz więcej doniesień o nielegalnych demonstracjach wywrotowców zakłócających porządek społeczny. \nCo gorsza, dowiedzieliśmy się, że ludzie ci są podżegani przez wrogów Kościoła - politycznych szaleńców. \nBezbożnicy uderzają w samo serce narodu - naszą pobożną młodzież. Młodzi i niedoświadczeni naprawdę zdają się ulegać wypaczonym ideom i odrzucać Boga. \nWSZYSCY! OCALMY NASZE MŁODE POKOLENIE! \nOdrzućcie agitatorów politycznych! Naszej młodzieży zalecamy pokorę i modlitwę, Biblia mówi bowiem: \"Nagrodą za pokorę i bojaźń Pańską są bogactwo, sława i życie\"."
TOR_the_golden_crown_desc: "Szczęść Boże! \nDrodzy wierni! Kolejne złe wiadomości! Wandalizm w naszej ukochanej ojczyźnie osiągnął niewyobrażalny poziom! KAŻDEGO DNIA widzimy kolejnych chuliganów bezlitośnie szpecących przestrzeń publiczną. \nOkazuje się, że ich wspólnym znakiem jest złota korona. Malują obrzydliwe graffiti, które plugawi całe dzielnice, a ich liczba rośnie w zastraszającym tempie! Człowiek najbardziej kojarzony z tym symbolem odcina się jednak od odpowiedzialności, tłumacząc, że znak nie jest zarezerwowany wyłącznie dla niego. Niczym Piłat także umywa ręce... \nChrześcijanie! Łapmy tych wichrzycieli! Wzywamy każdego parafianina, by pilnował własnego podwórka - często wystarczy zwykłe spojrzenie przez okno. \nI pamiętajcie - wróg nie śpi!"
TOR_clerical_patricide_desc: "Lojalni obywatele naszego najświętszego państwa! Choć Błogosławiony Ojciec może nie być w doskonałej formie, bądźcie pewni, że w mało prawdopodobnym przypadku jego odejścia znajdą się inni ludzie podzielający jego wizję i gotowi wykonać jego testament! Nie wierzcie zdradzieckim grzesznikom czającym się w cieniu z niedorzecznym pomysłem, że z takiego czy innego powodu musimy zrzec się doczesnej władzy. To właśnie ona pozwala nam przecież naprawiać świat pełen zła! Gdybyśmy się jej wyrzekli, wszystko byłoby stracone!"
TOR_forever_loyal_desc: "Moi wierni słuchacze, pragniemy poinformować, że nasza popularność nadal rośnie, osiągając naprawdę niewyobrażalne rozmiary! \nNieustannie napływają listy pochwalne, pełne radosnego uznania dla naszych wysiłków i słów potępienia dla wszelkiego bezeceństwa. \nPonadto Święta Gwardia radzi sobie doskonale i stale rośnie. Zaprawdę nie widzę powodów do niepokoju - wy również nie powinniście! Niech będzie pochwalony Ojciec Dyrektor!"
TOR_jacek_hogas_basic_bootcamp_desc: "Chwileczkę... co? Och, przepraszam, ISTNIEJE powód do niepokoju. Państwowe siły bezpieczeństwa wykryły możliwą aktywność milicji; niezidentyfikowane grupy widziano w lasach na południe od Torunia. Właściwie połowa żołnierzy oddała się później w ręce tychże służb, nazywając swoje szkolenie \"gorszym niż śmierć\" i mówiąc, że woleliby... ja... nie mogę wypowiedzieć takich słów na antenie. Tak czy inaczej podejrzewamy, że oddział może być pozostałością milicji Jacka Hogi, błąkającą się po województwie w ramach już z góry skazanej na porażkę misji. Zachowajcie czujność, bracia i siostry! Mogą czekać nas mroczne czasy."
TOR_for_old_times_sake_desc: "Niech Bóg was wszystkich błogosławi! Wzywam was dziś do rozważenia lekcji płynących z historii, zwłaszcza pychy, która doprowadziła do tragicznego upadku Polski z rąk tych, którzy ucieleśniają ciemność - eurofaszystów Szatana. Niegdyś dumna Polska stała się dziś bezludnym, bezbożnym pustkowiem pełnym niebezpieczeństw i rządzonym przez bezwzględnych watażków.\n\nChoć wielu może pielęgnować szlachetny obraz samych siebie albo miłe wspomnienia przeszłości, nie wolno nam pozostawać przywiązanymi do minionych dni. Musimy zamiast tego oddać się łasce i ochronie naszej Matki Maryi! Niezbędne jest, drodzy słuchacze, byśmy czujnie obserwowali otaczających nas ludzi; wielu może skrywać własne zamiary i spiskować przeciwko nam oraz wiernemu przywódcy, Ojcu Rydzykowi.\n\nOstrożność i zdrowy rozsądek są cnotami, których musimy strzec w tych niebezpiecznych czasach. Wąż - symbol podstępu - będzie istnieć zawsze. Nie dajmy się oszukać!"
TOR_finding_their_judas_desc: "Umiłowani słuchacze. \n\nTej nocy nasi czujni śledczy udaremnili spotkanie pogańskich agitatorów i rodzimych terrorystów. Pragniemy przypomnieć, byście nie ulegali grzechowi bezpodstawnego plotkarstwa i uciszyli wątpliwości w ustach oraz sercach: agitatorzy nie są powiązani z Mentzenem, a tym bardziej nie spotykali się z nielojalnymi elementami naszego Kościoła. Zapewniam was, że każdy człowiek Kościoła, wyświęcony czy świecki, kocha Rydzyka równie mocno jak wy, a prosząc go o zdradę, w tej samej chwili przypieczętowalibyście własny los! \n\nChrześcijanie, módlcie się zatem za naszych pasterzy, aby potęgą Chrystusa odpierali pokusy diabła!"
TOR_outbidding_mammon_desc: "Niech Bóg was wszystkich błogosławi! \n\nRadujcie się ze zmiażdżenia samosądu i niesprawiedliwości! Nasz Kościół ogłasza dziś zwycięstwo, gdyż kryjówka agitatorów, którzy rzekomo spotykali się z domniemanymi skorumpowanymi elementami Kościoła, została odnaleziona i natychmiast zniszczona. Związek z Mentzenem został raz na zawsze obalony, ponieważ na miejscu odkryto skrajnie lewicowe symbole i rekwizyty - takie, którymi gardzi nawet ktoś pokroju Mentzena! \nPo raz kolejny zapewniamy, że lojalność naszych obrońców jest niezachwiana. Mają czyste serca i nikt nie może zaprzeczyć ich oddaniu Ojcu Dyrektorowi."
TOR_a_new_commitment_to_gietrzwald_desc: "Odnowiona pobożność jaśnieje na Kujawach! W bydgoskiej katedrze św. Marcina i Mikołaja grupa pobożnych katolików zgromadziła się przed obrazem Matki Bożej Pięknej Miłości, by złożyć lub odnowić śluby Konfederacji Gietrzwałdzkiej. Miejsce spotkania ma znaczenie symbolicznie łączące Bydgoszcz z Gietrzwałdem - jaśniejący w kościele obraz wiąże się z polskim triumfem nad Zakonem Krzyżackim, a Objawienia Gietrzwałdzkie zapowiadały ostateczny triumf Polski nad żywiołem niemieckim w XX wieku. \nPomysłodawcą inicjatywy odnowienia Deklaracji był Sławomir Mentzen, popularny przedsiębiorca i gwiazda internetu."
TOR_leave_it_to_the_experts_desc: "Niech Bóg błogosławi naszych słuchaczy! Dzisiejszą audycję kierujemy do młodych żołnierzy, którzy będą walczyć ze światem pełnym grzeszników i sług Szatana! \n\nAby pokonać diabła we wszystkich jego postaciach, modlitwy często nie wystarczą. Rozejrzyjcie się. Możecie zobaczyć braci w wierze, lecz dusze wielu z nich zostały skalane. Ufajcie wyłącznie własnemu oddaniu oraz oddaniu duchowych opiekunów. Czujnie obserwujcie każdego, kto szerzy szkodliwe wartości. Zgłaszajcie wszystkich wyglądających na zdrajców. Przede wszystkim, jeśli dowódca działa przeciwko wierze, nie wykonujcie jego rozkazów. Kimże jest, by sprzeciwiać się woli Kościoła? \n\nZostaną wykryci, drodzy słuchacze. Daję wam tę obietnicę."
TOR_the_council_of_rabbis_desc: "Drodzy słuchacze, nie wszystko jest w porządku! Agenci zła wślizgnęli się w każdy zakątek społeczeństwa. Widzimy to. Czujemy ich obecność. Nie pozwolimy im rozprzestrzeniać się dalej. Bądźcie wierni i módlcie się, bracia i siostry. Zagrożenie przeminie. Wspólnie je odrzucimy. Zachowajcie czujność. Módlcie się jak nigdy wcześniej! I zawsze pamiętajcie, by ufać Ojcu Dyrektorowi oraz dobrym duchownym wybranym z Jego woli. \n\nAby wypędzić zło... Ave Maria!\n\nAby ochronić nasze wartości i społeczeństwo... Ave Maria!"
TOR_a_visit_at_grandmas_desc: "Drodzy, umiłowani słuchacze, nasze serca zwracają się ku wam, a zwłaszcza ku ukochanym seniorom, którzy mogą odczuwać ciężar samotności. W tych czasach należy koniecznie zachowywać ostrożność i zwracać uwagę na otoczenie. Wzywamy was do szczególnej czujności wobec podejrzanych osób w sąsiedztwie. Niewłaściwy ubiór, wątpliwe zachowanie czy niepokojące słowa - tacy obcy mogą stanowić poważne zagrożenie. Mogą być oszustami, złodziejami, rabusiami, a nawet... agentami samej ciemności!\n\nBłagamy, zaufajcie instynktowi i zgłaszajcie wszelkie obawy najbliższym władzom. Pamiętajcie, nie jesteście sami; Bóg i Ojciec Rydzyk czuwają nad wami z góry, zapewniając przewodnictwo oraz ochronę. Wasze bezpieczeństwo jest najważniejsze i wspólnie możemy stworzyć wspólnotę wolną od zagrożeń. Dbajcie o siebie, drodzy przyjaciele, gdyż jesteście niezwykle cenni i umiłowani."
TOR_the_watchers_of_the_walls_desc: "Drodzy słuchacze i najmilsi goście naszego kraju obdarzonego boską łaską! Musimy dostrzec niezliczone atrakcje i święte miejsca, które zapraszają do refleksji oraz obcowania z boskością. Musimy jednak wyrazić głęboką troskę o bezpieczeństwo Ojca Rydzyka, która wymaga surowych przepisów dotyczących nieuprawnionego wstępu, zwłaszcza w pobliżu Sanktuarium.\n\nPragnę wyrazić się jasno: każde niewłaściwe zachowanie w tych świętych miejscach lub ich otoczeniu spotka się nie tylko z dezaprobatą, lecz także z poważnymi konsekwencjami. Świętość tych terenów wymaga najwyższego szacunku i wzywamy wszystkich do czujności wobec podejrzanych osób udających \"turystów\" albo \"fotografów\". Któż może wiedzieć, jakie ukryte zamiary żywią wobec naszych szanowanych sług Boga?"
TOR_taking_the_black_desc: "Niech Bóg nas wszystkich błogosławi! Niech boska łaska nad nami jaśnieje, drodzy słuchacze! Dziś w uświęconych murach naszego najświętszego Kompleksu Sanktuarium garstka nowych seminarzystów dostąpi zaszczytu spotkania z Ojcem Dyrektorem. Wszystko wskazuje, że będzie to pokrzepiające wydarzenie pełne inspiracji i oddania, które jeszcze bardziej umocni przywiązanie naszych przyszłych przewodników duchowych do sprawy.\n\nZ radością ogłaszamy, że sam Ojciec Rydzyk łaskawie postanowił przemówić na naszej antenie! Serdecznie zapraszamy wszystkich wiernych i poszukujących duchowego ukojenia do wysłuchania audycji Ojca Dyrektora o godzinie 21.30. To wyjątkowa okazja, by usłyszeć światło przewodnie naszej wspólnoty.\n\nNie przegapcie szansy na spotkanie z Ojcem Rydzykiem i pogłębienie duchowej wędrówki. Niech Bóg zawsze będzie z wami!"
TOR_shadowing_the_king_regent_desc: "Niech Bóg was błogosławi! Do naszych umiłowanych i zatroskanych słuchaczy: pragniemy poinformować, że w okresach... większych trudności Ojca Rydzyka Ojciec Król z powodzeniem zarządza wszystkimi sprawami Kościoła. Nie ma powodu, by wątpić w jego zdolności, lecz chcielibyśmy przypomnieć, aby pozwolić mu pracować w spokoju. Charakter jego służby często wymaga całkowitej, niczym niezakłóconej samotności, a tymczasem byliśmy świadkami, jak liczni pełni uwielbienia wierni śledzą każdy jego ruch. Widzimy was nawet wtedy, gdy się ukrywacie. Dla dobra wspólnoty prosimy dać Ojcu Królowi trochę przestrzeni. Za kilka dni zobaczycie go na mszy. To powinno wystarczyć."
TOR_the_brewery_putsch_desc: "Z przykrością musimy przerwać audycję, aby nadać specjalne ostrzeżenie. Wygląda na to, że z miejscowego arsenału w Grudziądzu skradziono broń palną. To wielka tragedia dowodząca, że macki partyzantów Hogi, podejrzewanych o sprawstwo, sięgają dalej, niż oczekiwaliśmy. Aby ocenić skalę tej wrogiej operacji, zaufani agenci zarządzili kompleksową kontrolę wszystkich arsenałów i zaostrzenie środków bezpieczeństwa.\nW tych trudnych czasach nie możemy pozwolić sobie na samozadowolenie. Wzywamy każdego słuchacza do zgłaszania wszelkiej podejrzanej aktywności. Wasz kraj potrzebuje was w walce z zagrożeniem terrorystycznym."
TOR_capture_and_hold_desc: "Drodzy słuchacze, mogliście ostatnio zauważyć wzrost zainteresowania atrapami broni palnej. Nie zamierzamy siać paniki, lecz prosimy, byście całym sercem zrozumieli jedno. W obliczu narastających obaw o bezpieczeństwo bogobojnych obywateli i wiernych kapłanów chcemy poprosić o większą czujność wobec takich osób. Wierzymy jednak, że większość ludzi noszących atrapy to wierni przyszli żołnierze Boga, pragnący nauczyć się walczyć ze sługami Szatana. Prośba ta nie jest przesadą, lecz wyrazem troski o wszystkich obywateli pragnących czuć się bezpiecznie w naszym niebiańskim kraju. Nim przejdziemy do ogłoszeń parafialnych, pragniemy zacytować Księgę Koheleta 9,18:\n\"Lepsza jest mądrość niż narzędzia wojenne, lecz jeden grzesznik popsuć może wiele dobrego\"."
TOR_wolves_in_red_clothing_desc: "Bracia i Siostry... powróciło zagrożenie ze strony bluźnierców i bezbożnych komunistów zagrażających naszej świętej ziemi! Czy pamiętacie czasy ciemności i apokalipsy, gdy walczyliśmy o Toruń, abyście mogli żyć w pokoju pod łaską Boga? Dzięki tytanicznemu poświęceniu Ojca Rydzyka wy oraz wasze rodziny mieszkacie w krainie mlekiem i miodem płynącej. W walce z Szatanem i jego sługami, których już raz pokonaliśmy, nie ma miejsca na zwątpienie! Fragment Drugiego Listu do Tymoteusza 3,1-9 przekazuje ważną myśl: \"Jak Jannes i Jambres wystąpili przeciw Mojżeszowi, tak też i ci przeciwstawiają się prawdzie, ludzie o spaczonym umyśle, którzy nie zdali egzaminu z wiary. Ale dalszego postępu nie osiągną: bo ich bezmyślność będzie jawna dla wszystkich, jak i tamtych\"."
TOR_cut_off_the_serpents_tounge_desc: "Szczęść Boże!\nChwalcie Pana, drodzy słuchacze, i dziękujcie Mu, że możemy słuchać tak pobożnej rozgłośni jak Radio Maryja! Pamiętajcie, że naszą główną bronią są modlitwa i prawda! Zaprawdę powtarzajmy, ile dobra spotyka nas pod rządami Ojca Dyrektora. Rozwój narodu jest niezaprzeczalny: odbudowa Torunia, kościołów, waszych domów - wszystko to wyłącznie dzięki wspaniałemu Ojcu Dyrektorowi!\nListy do naszej rozgłośni wraz z napływającymi datkami stanowią niepodważalny dowód boskiego poparcia dla naszych audycji! Prosimy też o więcej pieni... \n\nPrzepraszam, co panowie tutaj robią!?"
TOR_blocking_off_the_artery_desc: "Chwalcie Pana! \n\nUwaga, drodzy słuchacze! Zaledwie kilka chwil temu doszło do niezwykłego zdarzenia. Zjazd z głównej arterii prowadzącej do Sanktuarium naszego czcigodnego Ojca Dyrektora został zablokowany wskutek kolizji ciężarówek należących do Browaru Mentzen. W rezultacie dojazd do Kompleksu jest obecnie niemożliwy. Zarówno właściciel, jak i kierowcy odpowiedzialni za zdarzenie twierdzą, że sytuacja jest wyłącznie wypadkiem.\n Oczekujemy dalszego rozwoju wydarzeń. W tej chwili nie możemy potwierdzić, czy byliśmy świadkami dowodu spisku, czy tylko kolejnego z szeregu podejrzanie zbieżnych przypadków. \nZachowajcie wiarę i módlmy się wszyscy do Boga Wszechmogącego. Niech objawi nam plany wrogów i zachowa nas pod swoją ochroną!"
TOR_a_strike_at_the_heart_desc: "Dzień dobry wszystkim. Możecie rozpoznawać mój głos z wcześniejszych audycji. Nazywam się Sławomir Mentzen. Przez ostatnie pół dekady reżim Tadeusza Rydzyka karmił was wyłącznie kłamstwami, manipulacją i pustymi obietnicami. Gdy on i jego najbliższy krąg bogacili się do poziomu, który nie powinien być dozwolony żadnemu człowiekowi, wy tylko biednieliście. \n\nDziś to się kończy. Obywatele Kujaw! Proszę zachować spokój i nie interweniować. Odprężcie się, weźcie piwo i oglądajcie upadek tego zgniłego reżimu. \n\nMieszkańcy prowincji! Nie lękajcie się wyzwolicieli wkraczających do waszych miast i wsi. Nie chcą was skrzywdzić. Są dumnymi katolikami, tak jak wy i ja. \n\nChwała Bogu, chwała Ojczyźnie. Ten komunikat będzie powtarzany."


 ## Wydarzenia ##
unification.80.t: "[GetNewspaper]Kościół Toruński jednoczy Kujawy i Pomorze!"
unification.80.desc: "Dziś w południe podczas wystawnych uroczystości odsłonięto pomniki we wszystkich większych miastach Kujaw. Każdy przedstawia tego samego człowieka - wielkiego wojownika wiary katolickiej, wybranego zdobywcę Pana i obrońcę Polski. Odniósłszy zwycięstwo w brutalnych zmaganiach toruńskiej anarchii na plecach całkowicie oddanych wyznawców, Ojciec Rydzyk rozprzestrzenił pobożne nauki Radia Maryja na całe województwo. Dzięki rosnącej górze datków pochodzących nawet od najuboższych wiernych jego państwo dysponuje zasobami, o których większość watażków może tylko pomarzyć. Ze swojego stale powiększającego się Kompleksu, z niekwestionowaną pozycją przywódcy, starzejący się kapłan opracowuje teraz plany rozszerzenia wpływów na najdalsze zakątki kraju. Wśród tego triumfu uważni obserwatorzy dostrzegli jednak znaczącą zmianę - chorobliwie bladą cerę i drastyczne ograniczenie publicznych wystąpień. Jeśli spekulacje okażą się prawdziwe, a dni Ojca Dyrektora rzeczywiście zbliżają się do końca, czy zbudowane przez niego imperium przetrwa bez jego przewodnictwa?"
unification.80.a: "Ave Maria, gratia plena... "

unificationreg.80.t: "[GetNewspaper]Kujawy i Mazowsze kłaniają się Maryi"
unificationreg.80.desc: "Wszystkie dzwony i radia na Wielkich Kujawach przekazują toruńskim chrześcijanom sygnał, że Mazowsze zostało podporządkowane Kujawskiemu Kościołowi Redemptorystów. Siły wierne wyłaniającej się nowej sekcie chrześcijaństwa salutują i modlą się do ducha Ojca Tadeusza, którego nazywają swoim świętym. Mimo ekskomuniki nałożonej przez papieża [PAP.GetLeader] wyznawcy Radia Maryja pozostają nieugięci w przekonaniu o prawdziwości swojej wiary. Przewodzi im Jan Król, opierający legitymizację na twierdzeniu, że potrafi porozumiewać się z duszą zmarłego Tadeusza Rydzyka. Fanatycy palą kościoły kapłanów oskarżonych o herezję, próbując zastraszyć bardziej bojaźliwych i złamać ich wolę oraz sumienia. Lokalne władze cywilne są powoli likwidowane. Ich miejsce mają zająć nowo i pospiesznie wyświęceni proboszczowie, którym powierzono zarządzanie miejscową ludnością oraz jej nadzorowanie. Taki stan rzeczy jest idealny dla wszelkich religijnych szarlatanów twierdzących, że otrzymali wizję od Rydzyka."
unificationreg.80.a: "Druga Krucjata Ludowa"

unificationsupreg.80.t: "[GetNewspaper]Wyznawcy Rydzyka podporządkowują Region Stołeczny!"
unificationsupreg.80.desc: "W warszawskiej archikatedrze św. Jana Chrzciciela odbyła się niedawno wyjątkowa homilia. Samozwańczy arcybiskup warszawski Jan Król podziękował Matce Maryi za zesłanie jemu, jego żołnierzom i wszystkim Polakom Drugiego Cudu nad Wisłą. Nazwał Warszawę nowym Babilonem, który trzeba oczyścić, zanim stanie się stolicą godną odrodzonej Polski. Zaproponował, by rozpocząć od zburzenia bezbożnego bożka, \"Pałacu Józefa Stalina\", co miałoby stanowić odpowiedni sygnał dla pogan, aby nawrócili się przed nadejściem dnia rozrachunku. Czas pokaże, czy tak surowy reżim zdoła utrzymać kontrolę nad liberalną Warszawą zamieszkaną przez liczne mniejszości religijne i ateistów. Mimo płomiennego kazania Jan Król woli na razie rezydować w Toruniu, gdyż uważa, że jego życie byłoby zagrożone w stolicy Polski sprzed Upadku."
unificationsupreg.80.a: "Zaraza wędruje dalej w górę Wisły."

super.80.t: "[GetNewspaper]Wniebowstąpienie Polski"
super.80.desc: "W polskich kościołach rozbrzmiewają uroczyste hymny. W klasztorze na Jasnej Górze Jan Król, samozwańczy Prymas Polski, odprawia ceremonię koronacji świętego Tadeusza Rydzyka, Umiłowanego Syna Dziewicy Maryi, na Króla Polski. Religijna euforia przenika wiernych, gdy transmisje rytuału docierają do najdalszych zakątków kraju i poza jego granice! Dusza Polski wkrótce zostanie przeobrażona, gdy kult Tadeusza Rydzyka przyćmiewa wszystkich pozostałych świętych, nie wspominając o Trzech Osobach Boskich. Miasto Olkusz przemianowano na Nowe Betlejem, gdyż jest miejscem narodzin ubóstwionego kapłana. Obok Torunia stało się jednym z najpopularniejszych celów pielgrzymek.\nRządzący teokraci ogłaszają, że Polskę prowadzi teraz Duch Święty. W rezultacie budynek Sejmu przekształcono w Świątynię Redemptorystów. Działania Króla odwróciły postępującą sekularyzację Polski - przynajmniej na razie."
super.80.a: "W imię Ojca, Matki i Tadeusza Rydzyka!"

unificationreg_a.80.t: "[GetNewspaper]Siły Króla łupią Mazowsze!"
unificationreg_a.80.desc: "Wszystkie stacje na Wielkich Kujawach nadały dziś wspólnie jeden komunikat - o chwale Boga i Jego triumfie nad pogańskimi watażkami regionu. Siły Ojca Króla zmiażdżyły lokalną opozycję, ogromnie zwiększając władzę kapłana, a co ważniejsze - jego bogactwo. Podbite miasta zostały gruntownie splądrowane, a wszystko, co wartościowe, wywieziono do stale rosnącego Kompleksu duchownego. Nawet to nie powstrzyma jednak kolejnej zbiórki wśród bezbronnych toruńskich wiernych, gdyż Król najwyraźniej pragnie wycisnąć z nich cały pozostały ziemski dobytek. Zaprawdę retoryka i służba tego państwa nie są poświęcone ideałom Boga, lecz Mamony. Lojalni wobec Króla kapłani kładą niezwykły nacisk na znaczenie dóbr doczesnych, a ich msze drastycznie odbiegają od tradycyjnego rytu rzymskiego. Czynniki te już zasiały ziarno schizmy, a władze Watykanu z zapartym tchem śledzą dalszy rozwój wydarzeń."
unificationreg_a.80.a: "Kościół rządzony przez grzech."

unificationsupreg_a.80.t: "[GetNewspaper]Kujawscy redemptoryści podporządkowują Region Stołeczny!"
unificationsupreg_a.80.desc: "Wizja Polski rządzonej przez duchowieństwo jest coraz bliższa. Po udanych kampaniach na północ i południe od kujawskiej kolebki Jan Król stoi u progu rozciągnięcia swojego państwa na cały kraj. Ku zmartwieniu zarówno zewnętrznych obserwatorów, jak i głównych władz Kościoła kontrola kapłana nadal rośnie dzięki datkom jego zwolenników. Armia wiernych grabieżców, rzekomo błogosławiona przez Niebiosa i finansowana z ogromnych skarbów duchownego, osiąga rozmiary mogące rywalizować nawet z siłami niektórych państw UE. Wraz ze wzrostem wpływów Króla nasilają się również przejawy jego dekadencji. Według doniesień toruńska kwatera stała się siedliskiem chciwości i rozpusty albo, jak sam Król woli ją nazywać, celebracją ducha i ciała, na którą Bóg patrzy przychylnie.\nArmia wiernych, niewzruszona zepsuciem fałszywego proroka, szykuje się teraz do ostatecznej walki o duszę kraju."
unificationsupreg_a.80.a: "Maryja zapłakała z Niebios."

super_a.80.t: "[GetNewspaper]Narodziny nowego Przymierza!"
super_a.80.desc: "Po dziesięcioleciach konfliktów Polska wreszcie jest cała, zjednoczona przez człowieka, który niegdyś wpływał na nią z cienia. Choć Ojciec Król przedstawia się jako katolicki teokrata, z czasem wykształcił własną doktrynę odrębną od Kościoła rzymskiego. Połączył pogoń za pieniędzmi, luksusem i sukcesem z kultem Boga, który rzekomo sprzyja możnym i bogatym. Ci, którzy pragną zbawienia, muszą uczestniczyć w płatnych mszach niewiele różniących się od kursów biznesowych. Mając naród pod butem, Król może wreszcie usiąść i zbierać owoce zwycięstwa, rozkoszując się wszystkimi cielesnymi przyjemnościami życia pośród przepychu godnego wyłącznie człowieka o tak wielkiej pozycji. Z wiekiem staje się jednak coraz słabszy i wygląda na to, że czas kapłana na Ziemi gwałtownie dobiega końca. Wkrótce stanie przed swoim Stwórcą na sądzie, a wtedy nie ocali go ani żadna suma pieniędzy, ani pieczołowicie podtrzymywana iluzja wiary."
super_a.80.a: "Fałszywy prorok zbliża się do Dnia Sądu."

unificationreg_b.80.t: "[GetNewspaper]Tymczasowa Republika Kujaw rozszerza się na Mazowsze"
unificationreg_b.80.desc: "Nagła zmiana kierownictwa w Toruniu nie zahamowała postępów kujawskiego podboju ziem polskich. Sławomir Mentzen zręcznie wykorzystał impet wojskowy kampanii Rydzyka, kierując go przeciwko wrogom Kujaw bez względu na to, kto stał u steru. Nie powinno to dziwić, gdyż reżim Radia Maryja przyzwyczaił ludność do połączenia katolickiej moralności ze sprytną przedsiębiorczością. Świadomy tego Mentzen wykreował się na duchowego następcę Ojca Rydzyka, choć bardziej umiarkowanego niż kapłan. Podobne prawicowe poglądy opakowane w bardziej świecką formę przekonały młodszych konserwatystów. Co więcej, słabiej regulowana gospodarka niezależna od centralnych instytucji takich jak Fundacja Lux Veritatis zdobyła popularność wśród drobnych przedsiębiorców. Wygląda na to, że mimo niepewnego początku Mentzen zdołał umocnić swoją pozycję."
unificationreg_b.80.a: "Czy to świt Nowej Nadziei?"

unificationsupreg_b.80.t: "[GetNewspaper]Siły Mentzena zabezpieczają Region Stołeczny!"
unificationsupreg_b.80.desc: "Sławomir Mentzen wreszcie zdobył nagrodę, która może zaspokoić jego chciwość. Choć Warszawa jest cieniem dawnej świetności, nadal stanowi imponujący ośrodek gospodarczy. Eksperci zastanawiają się, jak przywódca, który zbudował zaplecze wśród drobnych przedsiębiorców, poradzi sobie w kontaktach z wielkimi korporacjami. Giganci gospodarki z pewnością mogą oczekiwać niskich podatków i deregulacji, które dodatkowo obciążą budżet kosztem biednych oraz ofiar wojny już cierpiących z powodu neoliberalnej polityki Nowej Nadziei. Mimo tych obaw Mentzen twierdzi, że wzrost liczby zamożnych podatników przyniesie dość dochodów, by zapewnić wystarczającą pomoc każdemu, kto naprawdę jej potrzebuje.\nPoza troskami gospodarczymi coraz więcej osób niepokoi się przedłużającym statusem Mentzena jako tymczasowego prezydenta. Choć w Polsce po Upadku nie jest to niczym niezwykłym, jego monarchistyczne sympatie rodzą pytania, czy kiedykolwiek zrzeknie się władzy."
unificationsupreg_b.80.a: "Czy prawica zyska nowego Króla?"

super_b.80.t: "[GetNewspaper]Konglomerat Mentzena jednoczy Polskę"
super_b.80.desc: "Subtelność zawsze była kluczową przewagą Mentzena. Huk artylerii ogłuszył nas na prawdę o ostatecznym celu Nowej Nadziei - celu ukrytym między wierszami technokratycznych deklaracji. Wszyscy spodziewali się, że Mentzen zatrzyma się na poziomie zbliżonym do lat 90. Tymczasem jego rządy doprowadziły do niemal całkowitego zaniku struktur państwowych. Polską włada obecnie oligopol największych korporacji, z firmą przywódcy jako hegemonem. Bogaci wzbogacili się dzięki dzikiej prywatyzacji majątku podbitych państw, a biedni zubożeli wskutek nieuniknionej centralizacji rynku. Libertariańskie podejście do usług publicznych sprawiło, że do ochrony trzeba zatrudniać prywatne agencje, ponieważ policja państwowa została niemal pozbawiona finansowania. Uciśnione 99% ludności może odnaleźć jedyną pociechę w alkoholu, którego produkcję zmonopolizował Browar Mentzen."
super_b.80.a: "Płacący podatki zawsze przegrywają."

#unification_a.80.t: "[GetNewspaper]Kościół Toruński jednoczy Kujawy i Pomorze!"
#unification_a.80.desc: "Gorzko-słodka wiadomość dla wszystkich słuchaczy Radia Maryja. Choć siły wierne Kościołowi Toruńskiemu zabezpieczyły województwo kujawsko-pomorskie, główny architekt sukcesu, Ojciec Tadeusz Rydzyk, zmarł, nim zobaczył, jak jego organizacja osiąga pierwszy kamień milowy na drodze do zjednoczenia Polski.\nOstatnie działania podczas podboju Kujaw nadzorował Ojciec Jan Król, szara eminencja redemptorystów i członek zarządu Lux Veritatis. Teraz, gdy dzieło zostało ukończone, domniemany następca Rydzyka musi wyjść z cienia i zostać nową twarzą Radia Maryja. Jego sukces nie jest gwarantowany, gdyż śmierć Rydzyka wywołała masową histerię religijną i oddolny ruch, który może okazać się trudny do opanowania. Jeśli zdoła go ujarzmić, w przyszłości może stać się wielkim atutem. Niektórzy spekulują jednak, że Król odetnie się od takiego religijnego żaru i skupi na dalszej komercjalizacji Kościoła Toruńskiego. Tak czy inaczej od tej pory sam odpowiada za własną przyszłość."
#unification_a.80.a: "W mieście Kopernika nazywali go Królem"

#unification.151.t: "[GetNewspaper]Brygada Strzelców 1909 jednoczy Kujawy i Pomorze!"
#unification.151.desc: "Ujawnienie występków Rydzyka przeciwko prawom Boga i człowieka było ciężkim wstrząsem dla mieszkańców Torunia. Niemal natychmiast zaczęto snuć plany ostatecznego obalenia go. Rozczarowani i zniesmaczeni prawdziwym obliczem Ojca Dyrektora paramilitarni członkowie Brygady Strzelców 1909 pod dowództwem Adama Ślusarskiego jako pierwsi przystąpili do działania, dokonując krwawego przewrotu i rozpoczynając represje wobec kliki Rydzyka. Od tamtej pory Toruń przekształcono w prawdziwą machinę wojenną, nieustannie produkującą broń i wyposażenie dla armii. Dzięki tym przygotowaniom watażka szybko uzyskał przewagę w wojnach o zjednoczenie regionu, a kolejne miasta padały pod jego naporem. Wprowadzono obowiązkowy pobór wszystkich zdolnych do służby obywateli, gdy armia wypełnia szeregi przed następnym podbojem."
#unification.151.a: "Walka za naród jest warta śmierci"

#unification_b.80.t: "[GetNewspaper]Tymczasowa Republika Torunia jednoczy Kujawy i Pomorze!"
#unification_b.80.desc: "Choć przez większość walk o Kujawy pozostawał na uboczu, Sławomir Mentzen jest dziś jedynym władcą regionu. Wykorzystując pogarszający się stan zdrowia i ostateczną śmierć Ojca Rydzyka, przejął kontrolę nad domeną redemptorystów w sposób, który można opisać jako wrogie przejęcie.\nNajprawdopodobniej wymagało to korumpowania duchowieństwa na wielką skalę oraz tajnej współpracy z partyzantami Fundacji Ad Arma, na co wskazuje udział ich przywódcy Jacka Hogi w nowym rządzie.\nNiektórzy przewidują, że triumf Mentzena jest jedynie pozorny, gdyż Toruń i okoliczne tereny są pełne wyznawców Radia Maryja, którzy nie przyjmą życzliwie rządów Uzurpatora. Inni wskazują jednak, że wpływy Rydzyka były najsilniejsze wśród osób starszych mieszkających w mniejszych miejscowościach, podczas gdy młodsze pokolenia w większych ośrodkach zwykle przychylniej patrzą na mniej inwazyjny katolicki konserwatyzm Mentzena."
#unification_b.80.a: "Toruń zamienił wino na piwo"

TOR.1.t: "Ostatnie pożegnanie"
TOR.1.desc: "Krystian zadrżał na późnozimowym wietrze. Gdy stał w milczeniu, oddając hołd, chłód wreszcie dał mu się we znaki. Nieustanna ulewa przemoczyła zakrwawiony mundur i spływała po nieruchomej, ogorzałej twarzy. Przyjmował ją z wdzięcznością. Ukrywała łzy. \n\n- Wiesz, wciąż pamiętam, co powiedziałeś mi tyle lat temu. Gdy byłem jeszcze tylko dzieciakiem. \"Zawsze kwestionuj swoich zwierzchników\". - Westchnął ciężko. - Gdybyś tylko zakwestionował własnych... \n\nOdrzucił łopatę i wbił w ziemię pojedynczy prowizoryczny krzyż, walcząc z wiatrem, by ten natychmiast go nie przewrócił. Gdy z dużym trudem ponownie się wyprostował, kontynuował mowę pożegnalną. \n\n- To trudne, wiesz... Trudno pamiętać cię takim, jakim byłeś, a nie jakim się stałeś. Zawsze cię podziwiałem, choć nigdy nie pozwoliłbym ci tego zobaczyć. Może przynajmniej w ostatnich chwilach zdołałeś odpokutować. Nie zasługujesz na potępienie. To nie twoja wina, że cię okłamano. \n\nPo długiej walce z zapalniczką w nieustającym deszczu Krystian postawił pojedynczy znicz u stóp prowizorycznego grobu. \n\n- Przepraszam, że tylko ja tu przyszedłem. Maja pewnie wciąż jest na południu z tymi bezbożnymi wiedźmami, a Ojciec... choć bardzo się starałem, nadal nie potrafił ci wybaczyć. Zwrócenie się przeciwko Kościołowi, przeciwko własnej wierze... to było dla niego zbyt wiele. Obiecałem sobie, że zrobię więcej, by uczcić twoją pamięć, ale nawet przez to mogę wpaść w poważne kłopoty. \n\nPrzytłoczony emocjami Krystian jąkał się, wypowiadając słowa \"Wiecznego odpoczynku\" i błagalnie powtarzając modlitwę w rozpaczliwej nadziei, że może ocali duszę zmarłego. \n\n- Tyle lat temu to ty nauczyłeś mnie tych słów. Nigdy w życiu nie wyobrażałem sobie, że będę musiał wypowiedzieć je za ciebie. Nie tak szybko. Przynajmniej dzięki Ojcu Rydzykowi inni nie będą musieli cierpieć takiego samego losu. Pewnego dnia ten kraj zostanie ocalony i nikt więcej nie zginie, walcząc przeciwko woli Boga. Jestem pewien, że teraz, gdy ujrzałeś prawdę na własne oczy, wiesz, iż nasza sprawa jest słuszna. Mam nadzieję, że Pan w swym nieskończonym miłosierdziu uzna cię za godnego drugiej szansy, abyś mógł modlić się za nasze zwycięstwo po drugiej stronie. Mimo wszystkiego, co zaszło między nami, chcę, żebyś wiedział jedno."
TOR.1.a: "- Będzie mi ciebie brakowało, bracie."

TOR.2.t: "Ostatnie słowa"
TOR.2.desc: "- Stacja 100. Powtarzam, tu Stacja 100. Nadal odpieramy tych przeklętych fanatyków, ale ich fala nie ustaje. Jeśli w pobliżu są jakieś jednostki, prosimy o natychmiastową pomoc. Nie wiemy, jak długo zdołamy się utrzymać. \n\nOdgłosy strzelaniny zbliżały się coraz bardziej. Każde wezwanie pomocy, powtarzane jak mantra, niosło się po pustych falach, rozpaczliwie próbując dotrzeć do tych, którzy - o czym nie wiedziała sklecona naprędce załoga stacji - już polegli albo zostali zmuszeni do ukrycia. \n\n- Stacja 100. Powtarzam... \n- To nic nie da, Grzegorz. Nikt nie przyjdzie. - Starszy operator wtrącił się z mieszaniną rozczarowania i wrzącej złości. - Nie widzisz, że zostaliśmy tu sami? \n- Cóż, w przeciwieństwie do ciebie nie zamierzam siedzieć i czekać na swoją kolej, żeby umrzeć. - Odwrócił się ku mikrofonowi. - Stacja 100... \n- Mhm, jasne. Jeśli chcesz, żeby ktokolwiek cię usłyszał, wróć na częstotliwości cywilne. Powiedz tym fanatykom, co o nich myślisz, póki jeszcze możesz. - Wyraźnie uśmiechnął się z przekąsem do kolegi. - Ja wolę umrzeć w spokoju. Spróbuj mi za bardzo nie przeszkadzać, gdy będę odpoczywał, dobrze? \n\nGdy czas dobiegał końca, Stanisław przestawił częstotliwość nadajnika i wyprostował się na krześle. Coraz głośniejsze odgłosy szalejącej poniżej bitwy przedzierały się przez filtry, a przypadkowe zabłąkane kule nieprzewidywalnie śmigały po pomieszczeniu. Zdeterminowany, by wywrzeć ostatni wpływ, zwrócił się do zindoktrynowanych zwolenników wroga. \n\n- Jeśli mnie słyszycie, proszę, posłuchajcie. Okłamano was. Oszukano. Tadeusz Rydzyk nie jest pobożnym człowiekiem, za którego się podaje. Wiem to, znam go. Pracowałem dla niego. Nie macie pojęcia, jak wiele przed wami ukrywa. Proszę, to nie jest atak na waszą wiarę. Rydzyk jej nie ma. Służy wyłącznie sobie. Chce tylko waszych pieniędzy i oddania. Zawiedliśmy. Tylko wy możecie go powstrzymać. Wkrótce mnie nie będzie, ale proszę, musicie znaleźć sposób, żeby..."
TOR.2.a: "Potem zapadła cisza radiowa."

TOR.3.t: "Nowy stary początek"
TOR.3.desc: "- Bracia i siostry, najmocniej przepraszam za tę... niepożądaną przerwę. Otrzymaliśmy wiele skarg, że znajome fale jedynej prawdziwie chrześcijańskiej rozgłośni zamieniono w siedlisko ateistycznej propagandy, kłamstw i zepsucia. Zapewniam, że sprawa została całkowicie rozwiązana. \n\nW oddali rozległ się stłumiony głos, a kapłan odwrócił się od mikrofonu, zapominając go prawidłowo wyciszyć. - Jak to wciąż się rusza? To po prostu strzelcie do niego jeszcze raz, do cholery. Dlaczego muszę wam tłumaczyć, jak wykonywać waszą pracę? \n\nOpanował się i wrócił do audycji. - Ekhem. Od tej chwili dołożymy wszelkich starań, by odzyskać wasze zaufanie, abyście znów mogli spokojnie włączać w swoich domach głos katolicki. A teraz, prosząc Pana, by nadal obdarzał nas stabilnością i pomógł przejść przez ten trudny czas, pomódlmy się, bracia i siostry:"
TOR.3.a: "W imię Ojca..."

TOR.4.t: "Pycha"
TOR.4.desc: "- Ave Maria, gratia plena... \n\nDonośny głos odbijał się od ścian pustego sanktuarium. Choć zwykle otwarte dla gości ze wszystkich środowisk, tym razem budynek opróżniono na chwilę prywatnej kontemplacji. \n\n- Dominus tecum... \n\nChoć burzliwe życie rzadko dawało mu sposobność do spokojnej refleksji, Tadeusz Rydzyk już dawno zasłużył na okazję, by zwierzyć się swojej boskiej patronce. \n\n- Benedicta tu in mulieribus... \n\nKlęcząc na zimnej, twardej posadzce przed zamówioną osobiście ikoną Dziewicy Maryi, drżał w lodowatym powietrzu wczesnego kwietniowego poranka. \n\n- et benedictus fructus ventris tui, Iesus... \n\nNiezrażony trwał jednak, bez końca powtarzając tę samą modlitwę. \n\n- Sancta Maria, Mater Dei... \n\nTę samą, od której wszystko się zaczęło, w starzejących się murach prowincjonalnego seminarium. \n\n- ora pro nobis peccatoribus... \n\nTę samą, która doprowadziła go do władzy i bogactwa, jakie niegdyś rzadko potrafił sobie wyobrazić. \n\n- nunc et in hora mortis nostrae... \n\nTeraz, gdy jego wpływy nie były już wyłącznie duchowe, ponownie modlił się o przewodnictwo, uznanie... \n\n- Amen. \n\nO możliwość zachowania pozorów przed samym sobą i tymi, którzy go czcili, że służy komukolwiek poza własnymi interesami i występkami. \n\n- Maryjo, przychodzę do Ciebie w czasach wielkiej niepewności. Prowadziłaś mnie przez całe życie, a ja przez całe życie Ci służyłem. Tobie zawdzięczam wszystko, co zbudowałem. Z pełną wdzięcznością przyjmuję Twoje błogosławieństwo, by przeprowadzić ten kraj przez niebezpieczeństwo i odrodzić go w ogniu wiary. Tak jak przyjąłem Twoją misję, gdy po raz pierwszy wybrałaś mnie, grzesznika, na swego największego ewangelistę. A przecież zawsze doskonale wiedziałaś, że spośród wszystkich Twoich wyznawców tylko ja mogę być Twoim czempionem. Maryjo, Twoje imię rozbrzmiewa w modlitwach milionów. Jednoczy to miasto pod jednym świętym sztandarem. Wkrótce pod moim przewodnictwem cały kraj będzie wspólnie oddawał Ci cześć. Moja święta patronko, rzadko proszę o coś w zamian za służbę. Nie oczekuję żadnej nagrody poza doczesną. Muszę jednak prosić, abyś za wszystkie dusze, które ocaliłem, za odrodzenie wiary, które przyniosłem, w dniu mojego sądu nie spoglądała na osobiste uchybienia moralne, lecz na niezaprzeczalne dobro, jakie sprowadziłem na ten świat. Bo, Maryjo, może nie przestrzegam wszystkich Twoich wskazań, może żyję wbrew Przykazaniom, lecz beze mnie wszyscy bylibyśmy skazani na wieczną mękę. Dlatego wiem, że nikt na tej Ziemi nie zasługuje bardziej na szczególne miejsce w Niebie. Do tego czasu mam nadzieję, że będziesz wstawiać się za mną, tak jak ja wstawiam się za Tobą."
TOR.4.a: "- I tego właśnie oczekuję."

TOR.5.t: "Chciwość"
TOR.5.desc: "Fort I, a raczej to, co pozostało z niego po długim oblężeniu, stanowił idealną bazę dla przegranej sprawy. Choć od dawna wiadomo było, jak to się skończy, gdy kapitulacja oznacza śmierć, żadna ostatnia reduta nie jest zbyt beznadziejna. W takiej chwili człowiek zrobi wszystko, by przedłużyć swoje cierpienie choćby o kilka dni. Dlatego ostatnia garstka lojalistów Zaleskiego walczyła do ostatniego człowieka z fanatyczną falą, budząc duchy dawnego pruskiego garnizonu, by ujrzały kolejne starcie. Nawet teraz w kruszących się tunelach budowli zdawało się, że odgłosy strzałów odbijają się gdzieś tuż poza zasięgiem. \n\nArtur nienawidził przydzielonego przez przełożonych obowiązku przeszukiwania terenu, być może nawet bardziej niż jego koledzy. Za nic w świecie nie potrafił zrozumieć, dlaczego każdego dnia wysyłano ich, by przeczesywali puste korytarze. Cisza, przerywana jedynie cichym stukaniem wody kapiącej z popękanego sufitu i rytmicznymi, niepewnymi krokami, wystarczała, by spowić go niepokojącą aurą. Choć logicznie rzecz biorąc zadanie było znacznie lepszym przydziałem niż służba na froncie, Artur - choćby nie wiem jak się starał - nie mógł pozbyć się uczucia, że w każdej chwili coś albo ktoś może na niego wyskoczyć. Z latarką w ręku i prowizorycznym karabinem przewieszonym przez ramię każdy odcinek wyglądał podobnie. Pusto. Pusto. Kilka pajęczyn. Pusto. Zawalenie konstrukcji blokujące przejście. Pusto. Skrzynie. Pusto. Chwileczkę... skrzynie? To coś nowego. \n\nWyrwany z monotonnej, lecz napiętej rutyny Artur ostrożnie cofnął się, by sprawdzić jedyną choć trochę interesującą rzecz, jaką mógł znaleźć tego dnia. Lekko opukał pojemniki, jakby obawiał się, że dotykająca ich kończyna zostanie rozerwana. Oczy omal nie wyszły mu z orbit na widok małej fortuny, schludnie upakowanej po brzegi - zapewne funduszy, które obrońcom udało się wynieść z miejskiego skarbca. Po krótkiej chwili niedowierzania poprzysiągł zrobić jedyną rzecz, na którą pozwalały jego wartości: oddać wszystko nietknięte duchowemu patronowi. \n\n- Niezłe znalezisko, żołnierzu. Dalej ja się tym zajmę. - Z wejścia do tunelu dobiegł ochrypły głos. \n- Och, Ojcze Królu. Nie... nie spodziewałem się Ojca tutaj. Nie ma potrzeby, by się Ojciec obciążał. Zaniesę to bezpośrednio Ojcu Dyrektorowi. - Artur nie potrafił pojąć, jak kapłan zdołał pojawić się dokładnie w chwili, gdy w grę weszły pieniądze. \n- Nie, nie. - Duchowny roześmiał się uprzejmie. - Nie sądzę, żebyś to zrobił. Przynajmniej nie ze wszystkim. \n- Ale... rozkazy mówią, by zgłaszać każde znalezisko Ojcu Rydzykowi... \n\nZaskakująca ilość odwagi okazana przez żołnierza zirytowała kapłana. \n\n- Jestem pewien, że ma już aż nadto. Nie żeby mógł narzekać. - Skrzywił się. - Nie sądzisz, że nam także należy się mała premia? \n\nArtur spojrzał na Króla szeroko otwartymi oczami, zdumiony jego bezczelnością. \n\n- Zróbmy tak. Dostarcz Rydzykowi jedną czwartą pieniędzy. Weź 5% za kłopot i milczenie. Reszty oczekuję jutro rano w swojej rezydencji. I jeszcze jedno: jeśli spróbujesz oskubać mnie choćby z jednego grosza... cóż, nie chcesz wiedzieć, co się wtedy stanie. Odmaszerować. \n\nNie czekając na odpowiedź, kapłan odszedł równie nagle, jak się pojawił, pogrążony w myślach:"
TOR.5.a: "- Powinno wystarczyć na kolejny jacht... albo może kilka willi..."

TOR.6.t: "Nieczystość"
TOR.6.desc: "- Ach, pani Barska. Przyszła pani wcześniej. Dobrze. Proszę usiąść w poczekalni. Wkrótce do pani wrócę. \n\nWyćwiczony, uspokajający uśmiech i przyjazne zachowanie recepcjonistki zawsze wystarczały, by rozproszyć większość napięcia Lidii. Po odwieszeniu futra na wieszaku stojącym w rogu holu usiadła na miękkiej sofie i sięgnęła po jedną z miętówek leżących na stoliku. Kilka minut później asystentka dołączyła do niej ze schludnym segregatorem w ręku. \n\n- W porządku, wiem, że to wszystko może wydawać się nieco przytłaczające, zwłaszcza przy pierwszej wizycie, ale przed... spotkaniem musimy załatwić kilka formalności. \n- Właściwie... ja... yyy... byłam tu już kilka razy... - poprawiła ją speszona kobieta, zapadając się w kanapę pod pełnym ciężarem wstydu. \n- Ach, mój błąd. Ostatnio mamy spory ruch. Czasem mylą mi się twarze. - Monotonny, nadmiernie podekscytowany ton zupełnie nie zareagował na tę informację. - Cóż, oszczędzi nam to mnóstwa papierkowej roboty. Uff. \n- Mhm, załatwmy to już. Nie jestem szczególnie zachwycona, że tu przyszłam. \n- Oczywiście! - Zaczęła rozkładać kilkanaście osobnych dokumentów. - Mamy standardowy zestaw: umowę o zachowaniu poufności, dokument odpustu, formularz zdrowotny... zna pani procedurę. A tak przy okazji, wreszcie skończyli budowę tej apteki przy akademii. Proszę tam pójść po wszystkim, a Robert da pani wszystkie potrzebne tabletki. \n- Jest pani pewna? - Lidia odezwała się z lękiem. - Podczas wczorajszej mszy byli bardzo stanowczy, że to niewybaczalny grzech. Morderstwo niewinnych... \n- Proszę posłuchać, uzgodniłam to z Ojcem Rydzykiem. Nie chce żadnych... niezamierzonych konsekwencji waszych kontaktów. Proszę się tym nie martwić. Jestem pewna, że ma swoje powody. Skoro mówi, że w tym przypadku to dozwolone, tak musi być. \n- Mhm... na pewno... - próbowała się pocieszyć, bez przekonania przyjmując pokrętną logikę, gdy metodycznie podpisywała każdy dokument. - A co to ma być? \n- Ach, to coś nowego! - Radosny wyraz twarzy był teraz naprawdę nie na miejscu. - To lista tego, co wolno i czego nie wolno podczas... - Przez chwilę szukała najbardziej dyplomatycznego sformułowania. - pani dzisiejszej... sesji z nim. \n- Tego... jest dużo. Naprawdę dużo. Nie wiem, czy... \n- Tak, ja... nie byłam w stanie znieść nawet samego czytania. Wyobrażam sobie, że konieczność rzeczywistego wykonania tego wszystkiego jest znacznie gorsza. - Profesjonalna postawa asystentki rozpadła się pod ciężarem ludzkiej empatii. - Jeśli to jakiekolwiek pocieszenie, wątpię, by miał dość siły na większość rzeczy z listy, o ile w ogóle na którąkolwiek. \n- Mhm... - Próba uspokojenia jej jakimś sposobem niewiele pomogła. - Dla własnego dobra naprawdę mam nadzieję, że tak będzie. \n- Ja również. Tylko... proszę dać sobie czas, jeśli go pani potrzebuje. Ja w tym czasie zajmę się dokumentami. - Odwróciła wzrok, wstydząc się samej siebie."
TOR.6.a: "Kolejny wpis na długiej liście rzeczy, których żałowała."

TOR.7.t: "Zazdrość"
TOR.7.desc: "- Dlaczego? Dlaczego zawsze on? - Myśl poruszyła się w głowie Przemysława Wiplera, gdy ze złością wziął kolejny łyk z do połowy pustej butelki. Gorzkie, przereklamowane, zupełnie jak wszystko związane z Mentzenem. Nawet jego piwo nie było inne. Przynajmniej uderzało wystarczająco mocno, by utopić smutki. \n- Co on ma? Na pewno nie wygląd ani prawdziwą charyzmę. I zdecydowanie nie politykę. TO JA MAM PRAWDZIWĄ POLITYKĘ. - Wipler uderzył pięścią w bok stołu. - I co, on może po prostu małpować najlepsze z moich pomysłów i wypaczać je w stertę pustych haseł? A teraz jest wielkim panem, stoi dumny na ogromnej scenie i prawi wykłady bezmózgim dzieciakom, które niczego nie rozumieją, podczas gdy ja siedzę w tej norze? Musiałem mu nawet za to podziękować, kurwa mać. \n\nSpodziewając się nieprzyjemnego smaku, Wipler przygotował się i wypił za jednym razem około jednej czwartej butelki. Nie smakowało ani trochę lepiej niż poprzedni łyk czy trzy wcześniejsze piwa, ale przynajmniej powoli się przyzwyczajał. \n\n- Ale nie, oczywiście, po prostu pozwólmy mu współrządzić tym miastem. Jemu. Facetowi, który nigdy nie zarządzał niczym poza tą przeciętną kancelarią. Po prostu się pojawia i zgarnia wszystkie zasługi. O, wielka latarnio pobożności, powiedz mi, czy to wszystko jest dla ciebie tylko cyniczną grą? Na pewno to widzą. Nie mogę być jedyny. Tak często zmienia przekonania, że nawet ja nie wiem już, jakie są jego prawdziwe poglądy. A jednak mnie pozostaje odgrywanie zwolennika i wykonywanie brudnej roboty, gdy on i Rydzyk równają to miejsce z ziemią. I co z tego mam? Zamiast jakiegokolwiek uznania darmowy zapas... tego. \n\nDopił butelkę i odsunął ją z taką siłą, że ledwie uniknął rozbicia, po czym szybko sięgnął po następną. \n\n- Nie mogę już dłużej tego robić. Koniec. Odchodzę. Jeśli Mentzen chce ciągnąć tę farsę, może to robić beze mnie. Albo da mi należne zasługi i wpływy, albo wracam do Piekar. Nie potrzebuję tego. Już więcej nie będę... \n\nPlany Wiplera przerwał znajomy dzwonek telefonu. Wbrew rozsądkowi sumiennie odebrał. \n\n- Przemek, słuchaj, spóźnię się z dzisiejszego wydarzenia. Mógłbyś wpaść do mojego biura i dokończyć porządek obrad, który zacząłem przygotowywać na następne posiedzenie partii? \n- Yyy, tak, oczywiście. Dopilnuję, żeby było gotowe. \n- Świetnie. Naprawdę mam u ciebie dług. Daj znać, jeśli mogę coś dla ciebie zrobić w zamian. \n- Właściwie, Sławek, myślisz, że można by..."
TOR.7.a: "Nim zdążył o cokolwiek poprosić, Mentzen skorzystał z okazji i się rozłączył."

TOR.8.t: "Nieumiarkowanie w jedzeniu i piciu"
TOR.8.desc: "Cała trójka siedziała przy rozkładanym stole, ze wszystkich czterech stron zastawionym daniami wystarczająco wielkimi i wymyślnymi, by wyżywić cały bankiet. Wiele przysmaków, przygotowanych z niewątpliwie imponującą finezją, należało do rzeczy, których Mentzen nie widział od czasu sprzed Upadku. Zastanawiał się, jak dokładnie Rydzyk zdołał je zdobyć w środku narodowej katastrofy. Jakiekolwiek były jego rozważania, kapłan zdawał się nie zwracać na nie uwagi, próbując kolejnych małych kęsów z talerza za talerzem. Siedzieli w milczeniu prawie pół godziny, gdy Ojciec Dyrektor ucztował, a Sławomir zastanawiał się nad samą pojemnością żołądka starca. Jedna rzecz zajmowała jednak jego umysł w znacznie większym stopniu. \n\n- Mógłby mi Ojciec powiedzieć, po co właściwie zostałem zaproszony? Minęło sporo czasu, odkąd ostatnio tu byłem. \n- Ciii, nie ma powodów do obaw. To uroczystość i chcę, żebyś był jej częścią. Ostatnio okazałeś się dla nas wielkim atutem. Szczerze mówiąc, bez twojej pomocy nie osiągnęlibyśmy nawet połowy tego, co zrobiliśmy. - Rydzyk mówił z pełnymi ustami, biorąc kolejny kęs co kilka słów. \n- Tak, atutem... właśnie. Pomyślałem, że może czas zmienić nasz sojusz w równorzędne partnerstwo. \n\nKapłan omal nie opluł się jedzeniem ze śmiechu, spoglądając na Mentzena, jakby ten opowiedział wyjątkowo zabawny żart. \n- Mówię poważnie. Stanowimy połowę sił miasta. Zasługujemy na stałe miejsce przy stole. \n- Trochę pokory, chłopcze. Co ty właściwie możesz wiedzieć o rządzeniu całym krajem? Dla nas wszystkich będzie najlepiej, jeśli pozostaniesz na swoim miejscu. \n- Co mogę wiedzieć? Kierowałem partią wielokrotnie większą od kręgu geriatrycznych zwolenników Ojca. Poza tym bez mojej pomocy nie byłoby Torunia. \n- Ojciec Dyrektor chciał powiedzieć, że... - Król próbował włączyć się do kłótni i powstrzymać narastające napięcie. \n- Doskonale wiem, co chciałem powiedzieć. Albo pozostajemy przy obecnym układzie, albo możesz się spakować i odejść gdzie indziej. \n- Nie wiem, czego oczekujecie, ale nie opuszczę po prostu swojego miasta po tak ciężkiej walce o jego odzyskanie... \n- Dobrze. Rób więc dalej to, co robisz. Możesz urządzać wiece i imprezy piwne, a my zajmiemy się rządzeniem tym miejscem. \n\nZadowolony, że miał ostatnie słowo i spełniono wszystkie jego żądania, Rydzyk wrócił do obgryzania wybornego kawałka żebra, a oni ponownie siedzieli w całkowitej ciszy."
TOR.8.a: "Czasem naprawdę zastanawiam się, dlaczego uznałem poparcie ciebie za najlepszy wybór."

TOR.9.t: "Lenistwo"
TOR.9.desc: "Wczesnoporanne słońce powoli wspinało się na należne mu miejsce na wciąż na wpół ciemnym niebie, zaglądając przez zasłony niemodnego, bogato zdobionego pokoju przy wtórze pierwszych entuzjastycznych treli ptaków. Czując ciepłe promienie na twarzy, Tadeusz Rydzyk obrócił się z zadowoleniem, ani razu nie otwierając oczu, gdy korzystał z jednego z ulubionych przywilejów życia duchownego - możliwości spania do późna w dzień powszedni. Na wpół przytomny kapłan ledwie zarejestrował gorączkowe pukanie do drzwi, które ostatecznie zmusiło gościa do wejścia bez zapowiedzi. \n\n- Ojcze Dyrektorze! Ogromnie przepraszam, że przeszkadzam. Poproszono mnie o przedstawienie dzisiejszego planu dnia. Oczywiście wcześniej sprawdzonego. - Młody kapelan plątał się w słowach, próbując uniknąć gniewu przełożonego. - Wiem, że Ojciec wyraźnie prosił, by pod żadnym pozorem go nie budzić, ale Ojciec Grakowicz poprosił o przesunięcie homilii o dodatkową godzinę wcześniej. \n- Grakowicz... zawsze jakieś problemy. - Rydzyk wymamrotał niewyraźnie. - I po co ten bałwan potrzebuje mnie tak wcześnie? \n- Problemy z harmonogramem, Ojcze Dyrektorze. Po prostu nie ma innej pory, kiedy jego parafia mogłaby Ojca gościć bez zakłócania zwykłej działalności. \n- Wykluczone. Jeśli nie potrafi odprawić homilii o rozsądnej godzinie, może sam ją wygłosić, skoro tak mu zależy. \n- Mam... powiedzieć mu, by wyznaczył nowy termin? \n- Nie. Powiedz, że odwołana. Nie odwiedzę tego miejsca, dopóki nie nauczy się szanować mojego cennego czasu. \n- T... tak, Ojcze Dyrektorze. Jak Ojciec sobie życzy. W takim razie pierwszym punktem dzisiejszego dnia jest kazanie radiowe o dwu... \n- Wyślij Pawła. - Rydzyk machnął lekceważąco ręką. \n- Ale... Ojciec Pakuła już musiał prowadzić laudesy o szóstej... \n- Dobrze, raz na jakiś czas przyda mu się ciężka praca. Mów dalej. Co następne? \n- C... cóż, jest jeszcze nabożeństwo o trzeciej... \n- Nie możesz znaleźć kogoś innego? \n- Co!? Odbędzie się tutaj, w Sanktuarium. Proszę, Ojcze Rydzyku, już teraz ledwie wyrabiamy. \n- Posłuchaj. - W głosie kapłana coraz wyraźniej brzmiała irytacja z powodu obudzenia wbrew jego woli. - Gdy będziesz żył tak długo jak ja, zrozumiesz, żeby nie wysilać się, jeśli nie jest to absolutnie konieczne. Powiedz mi więc, czy moja obecność jest niezbędna podczas tego nabożeństwa? Czy coś się stanie, jeśli mnie nie będzie? \n- Chyba nie... - odparł pokonany kapelan. Wiedział, że spór niczego mu nie przyniesie. - W takim razie to wszystko na dzisiaj. Jeszcze raz przepraszam, że niepokoję Ojca Dyrektora. \n\nOgarnięty ulgą Rydzyk poprawił kołdrę i ponownie zamknął oczy. Zbyt zajęty tym zadaniem, by przejmować się, czy rozmówca opuścił pokój, wymamrotał w odpowiedzi kilka słów i zapadł w sen z jedną myślą - to będzie dobry dzień."
TOR.9.a: "Być może nie dla tych, którzy musieli go zastępować."

TOR.10.t: "Gniew"
TOR.10.desc: "Nieregularny brzęk szklanych butelek odbijał się po arenie przekształconej w prowizoryczny pub na pierwsze duże wydarzenie od rozpadu kraju. Gdy bardziej tradycyjnie nastawieni ludzie pomrukiwali niezadowoleni z hedonistycznego charakteru imprezy, nowe pokolenie Kujaw szukało własnego rodzaju przewodnictwa - podlanego alkoholem tyrady polityka, któremu ostatnio nie dopisywało szczęście. Wyprodukowanie dość trunku dla mas na wpół przekonanych, że nie wyjdą z budynku o własnych siłach, zajęło dużo czasu, zwłaszcza przy wciąż niepewnych dostawach zewnętrznych. Dzięki sprytnej logistyce i znacznemu poluzowaniu norm przemysłowych żaden uczestnik nie musiał jednak czekać z suchym gardłem, łącznie z głównym mówcą i organizatorem wydarzenia. Przemawiając do zahipnotyzowanego tłumu, rozgrzanego już przez kilku gościnnych panelistów, Sławomir Mentzen czuł się jak ryba z powrotem w znajomej wodzie. Spoglądając na fale niezachwianego poparcia, czuł potęgę. Znacznie większą niż wszystko, na co Rydzyk mógł liczyć ze strony swoich geriatrycznych zwolenników. Był rozpalony i gotowy rzucić wyzwanie o przysłowiową koronę, której dopiero co mu odmówiono. Nadeszła pora zagarnąć wszystko. \n\nWszedł na scenę, już lekko się chwiejąc, i chwycił mównicę, by zachować równowagę. \n\n- Dziękuję. Wam wszystkim. Za odzyskanie tego miasta. - Wzniósł trzymaną szklankę do toastu. - Ale nie jesteśmy tu po to, by wspominać. Przyjdzie na to czas. Miejmy nadzieję, że wkrótce. Na razie nie wiem jak wy, ale ja czuję w tym zwycięstwie wyjątkowo kwaśny posmak. Gdy ryzykowaliśmy życiem, oczyszczając każdą ulicę i każde mieszkanie z czerwonej zarazy, przyszedł jakiś facet w czarnej sutannie i ukradł całą chwałę. Wykonaliśmy większość pracy. Bez nas siedziałby teraz zamknięty w swoim Kompleksie, ukrywając się przed tą czy inną bojówką. I jakie otrzymujemy podziękowanie? \n\nGniew w jego oczach był namacalny i przebijał się przez bełkotliwy głos. To było znacznie więcej niż pijana, emocjonalna paplanina. Miał rachunki do wyrównania, a ludzie dobrze o tym wiedzieli, bucząc i śmiejąc się przy każdej wzmiance o rządzącym Toruniem Arcykapłanie. \n\n- Żadne. A wiecie, co mam mu do powiedzenia? Niech robi, co najgorsze! Nie potrzebujemy go! Nigdy nie potrzebowaliśmy! - Choć kołysał się przy każdym nadmiernie podkreślonym geście, Mentzen nie wycofywał otwartego wyzwania. - Nie będziemy klękać przed nim ani sekundy dłużej. Nadeszła pora, byśmy zostali panami własnej domeny. Słyszysz, \"Ojcze Dyrektorze\"? Nasze partnerstwo? Skończone! To wojna! To... \n\nNim zdołał wyrządzić sobie jeszcze większą szkodę, zespół pomocników ściągnął go ze sceny. Bezskutecznie próbował się opierać. Z tyłu tłumu niepozorny minister w zwykłym ubraniu wyłączył nagrywanie."
TOR.10.a: "To będzie miało poważne konsekwencje."

TOR.11.t: "Marsz hańby"
TOR.11.desc: "Mniej więcej piętnastominutowy spacer z placu św. Katarzyny do katedry św. Jana nigdy wcześniej nie wydawał się tak potwornie długi. Przez całą drogę Sławomir Mentzen czuł na sobie setki przeszywających spojrzeń - szyderczych, drwiących z obrzydzeniem. Miał wrażenie, że całe miasto celowo odwołało wszystkie plany, by przyjść go upokorzyć, co zapewne niewiele odbiegało od prawdy, skoro Rydzyk zadbał o rozpowszechnienie wieści podczas niemal każdego ostatniego kazania. Nietrudno było zrozumieć - zwłaszcza że kapłan bez końca napawał się triumfem wraz ze swoimi kolegami - iż widowisko miało niewiele wspólnego z przebaczeniem. Mentzena należało gruntownie upokorzyć, aby służył za przykład tego, co dzieje się z człowiekiem lecącym dość blisko słońca, by ośmielić się podważyć słowo nieomylnego teokraty. \n\nSzorstki strój pokutny kłuł skórę z każdym krokiem i zdawał się drażnić coraz mocniej przy każdej próbie poprawienia. Mentzen był przynajmniej częściowo wdzięczny, że żaden z przydupasów odpowiedzialnych za planowanie wydarzenia nie wpadł na pomysł, by obciążyć jego słabe plecy prawdziwym krzyżem. Być może po prostu nie chcieli ryzykować, że ktokolwiek poczuje wobec niego choć odrobinę współczucia. Powoli maszerował przy mdlącym dźwięku fałszywie śpiewanych hymnów, zmuszony zatrzymywać się przy każdej stacji, opuszczać głowę ze wstydu i stawać przed zwycięskim duchownym, wypowiadając słowa: \n\n- Ojcze, zgrzeszyłem przeciwko Bogu i Kościołowi ustanowionemu z Jego łaski. Za zbrodnię spisku przeciwko Jego wybranym sługom błagam o przebaczenie. \n\nZa każdym razem obciążając się kolejnym przesadzonym albo całkowicie zmyślonym występkiem, Mentzen wyraźnie widział, jak tłum coraz bardziej się burzy z każdym wyznaniem. Niezadowolone pomruki nękające go na początku wędrówki szybko zmieniły się we wściekłe okrzyki najgorszych przekleństw, jakie tłuszcza mogła wypowiedzieć bez jednoczesnego potępienia samych siebie. Nie minęło wiele czasu, nim i ta granica została przekroczona. Rozjuszeni ludzie napierali na barykady, gotowi wymierzyć własną sprawiedliwość, której Rydzyk w swej wielkoduszności zdawał się nie chcieć wyegzekwować z należytą surowością. Czując rosnące zagrożenie, Mentzen próbował przyspieszyć pozostałą część ceremonii i w pośpiechu przepychał się przez kordon ochronny, aż poczuł mocne uderzenie tuż obok stopy - luźną kostkę brukową wymierzoną w jego głowę, która na szczęście ledwie chybiła celu. Atak tylko dodał odwagi oszalałemu tłumowi, który niemal natychmiast zaczął obrzucać grzesznika wszystkim, co miał pod ręką. Wyrywając kostkę brukową z ulic, ludzie na oślep spuszczali na niego gniew Pana, raniąc przy okazji licznych członków orszaku, aż interwencja zgromadzonych sił porządkowych wreszcie rozproszyła zbiegowisko."
TOR.11.a: "Biorąc pod uwagę nieliczne siniaki, Mentzen mógł uważać się za szczęściarza."

TOR.12.t: "Konflikt intencji"
TOR.12.desc: "Krystian podekscytowany przemierzał wilgotne korytarze części mieszkalnej seminarium. Choć ramię zaczynało boleć go od ciągnięcia przez cały korytarz przeładowanej walizki zawierającej większość dobytku, nie chciał zatrzymać się ani na chwilę przed dotarciem do celu. 237, jego nowy dom. Dla młodego wiernego było to zwieńczenie lat przygotowań, długo wyczekiwana szansa podążenia za powołaniem religijnym, które czuł od wczesnego dzieciństwa. Przekręcił klucz, niemal łamiąc na wpół przerdzewiałą podstawę w zamku. Drzwi otworzyły się z wyraźnym skrzypnięciem, odsłaniając skromne, staroświeckie wnętrze z trzema łóżkami ustawionymi obok siebie tak, by zostało akurat dość miejsca na zakurzoną szafę i wspólne biurko. Współlokatorzy byli już w środku i oceniali Krystiana wzrokiem, gdy rzucił bagaż na mocno poplamioną pościel i zaczął się rozpakowywać. \n\n- Za karę czy dla pieniędzy? \n- Co? O czym ty... \n- Mówię niewyraźnie? Jesteś tu, bo złapali cię na czymś, czy tylko lecisz na kasę?\n\n Krystian był zaskoczony. Zamiast odpowiedzieć, zastygł i z wyraźnym dyskomfortem spojrzał na osobę siedzącą po drugiej stronie pokoju. \n\n- Co? Głuchy jesteś czy jak? \n- N... nie, tylko... Jestem tutaj, by służyć Panu. To... jakiś żart? Otrzęsiny? \n- Pff, jeszcze coś takiego robią? - Druga postać zaśmiała się, ignorując pytanie. Obaj wymienili spojrzenia, wyraźnie rozbawieni odpowiedzią nowego. No cóż, wygląda na to, że czeka cię cholernie brutalne przebudzenie. \n- To... jest seminarium, prawda? \n- No kurwa, że jest. I już teraz mogę ci powiedzieć, że z takim zadartym nosem nie przetrwasz więcej niż tydzień. \n- Zadartym nosem? Nie, ja... Słuchaj, nie muszę ci się tłumaczyć. Pewnie nawet nie jesteś częścią seminarium. \n- I tu się mylisz, kolego. My rządzimy tym miejscem. Przynajmniej nieoficjalnie. A cały świeży narybek nam podlega. Dokładnie, patrzysz na materiał na przyszłego arcykapłana albo kogoś lepszego. Więc tak, możemy bardzo utrudnić ci życie, jeśli nie nauczysz się odrobiny szacunku. \n\nKrystian przez chwilę rozważał sytuację, po czym ustąpił, by nie narobić sobie wrogów pierwszego dnia, bez względu na to, za jak bardzo oderwanych od rzeczywistości ich uważał. \n\n- W porządku, yyy... jak tam chcesz... \n- A teraz powiedz, pijesz? \n- Cóż... tylko wino mszalne. - Krystian zaśmiał się nerwowo. \n- Aha. Palisz? \n- N... nigdy. \n- A czy ty... - Przez chwilę mierzył nowego wzrokiem. - Dobra, o to nawet nie będę pytał... \n- Zgaduję, że też powinienem powiedzieć nie... \n- To co ty tu, kurwa, właściwie robisz? \n- Służę... Bogu... Tak jak powinienem... \n- Tak, tak, już mówiłeś. Tylko się do tego za bardzo nie przywiązuj. Nie wchodź nam w drogę, a nie będzie problemów. Po jakimś czasie porzucisz te pobożne bzdury. Rozumiesz? \n- T... tak... rozumiem..."
TOR.12.a: "Nocą w kaplicy odmówił cichą modlitwę o odkupienie ich dusz. Nie przyniosła skutku."

TOR.13.t: "Narodziny buntownika"
TOR.13.desc: "W niewielkiej strefie handlowej ukrytej tuż przy Grudziądzkiej po raz pierwszy od trzech długich lat klucz znajomo szczęknął w zamku. Po krótkim migotaniu zapaliły się światła, a grzejnik powoli rozpoczął pracę nad doprowadzeniem pomieszczenia do znośnej temperatury. W porównaniu z zbombardowanymi pustostanami zajmowanymi niegdyś przez innych najemców budynku biuro wydawało się stosunkowo spokojne, jakby oszczędziły je zniszczenia wielomiesięcznej otwartej anarchii. Rozglądając się, Sławomir Mentzen cieszył się, że na wszelki wypadek odłożył część funduszy na remont. Nigdy nie sądził, że tutaj wróci, a tym bardziej że będzie tu przeczekiwał burzę. Skoro jednak jego zwykłe adresy zostały splądrowane i objęte ścisłą obserwacją, było to jedyne miejsce, gdzie mógł się ukryć, zachowując choćby odrobinę godności. \n\nW jednym z pustych gabinetów pozostawionych przez tymczasowego współpracownika, którego nazwiska już dawno nie pamiętał, Mentzen odłożył walizkę i rozłożył dmuchany materac, na którym miał spędzić noc. Napompował go akurat na tyle, by nie czuć twardych płytek pod spodem, po czym były doradca podatkowy usiadł na prowizorycznym łóżku i z nostalgią przejrzał stare dokumenty należące do klientów sprzed Upadku. W obecnej sytuacji ich zwyczajność niosła pocieszenie po ostatnich tygodniach politycznej hańby. \n\nNagły dzwonek do drzwi przestraszył Sławomira i wyrwał go z zamyślenia. Serce zabiło mu mocniej na myśl, że jakimś sposobem rozwścieczony tłum dotarł nawet tutaj. Gdyby tak było, uświadomił sobie, że właściwie nie miałby dokąd uciec, chyba że w desperacji zdecydowałby się wyskoczyć przez okno. Zrobił krok ku drzwiom, dbając, by zachować ciszę i nie zdradzić swojej obecności, po czym dokładnie wyjrzał przez wizjer. Ku jego uspokojeniu na zewnątrz nie było tłuszczy, lecz tylko jedna mniej więcej dwudziestopięcioletnia kobieta o wyraźnie zaniepokojonej postawie. Przez chwilę rozważał, czy to także mogłaby być pułapka, ale wbrew rozsądkowi postanowił ją wpuścić. \n\n- Yyy, pan jest... pan Mentzen, prawda? \n- Zależy, kto pyta. \n- N... nazywam się Lidia. Lidia Barska. Słyszałam o pańskim niedawnym konflikcie z Ojcem Rydzykiem. Ja... wydaje mi się, że mam kompromitujące informacje, które mogłyby pomóc panu z nim walczyć. \n- Pani Barska, przepraszam, ale obecnie nie jestem zainteresowany dalszym antagonizowaniem go. Poza tym szczerze wątpię, by chodziło o coś, o czym wcześniej nie słyszałem. \n- Wszystko, co pan o nim wiedział, nie stanowi nawet połowy prawdy. Byłam tam, w Kompleksie. Wiele razy. Znacznie częściej, niżbym chciała. Proszę... potrzebuję tego. Za wszystko, co zrobił. Niech pan tylko... mnie wysłucha... \n- W porządku. Musi pani jednak wiedzieć, że niczego nie mogę zagwarantować."
TOR.13.a: "Gdy skończyli rozmawiać, Mentzen poprzysiągł obalić Ojca Dyrektora."

TOR.14.t: "Cena czystej duszy"
TOR.14.desc: "Czekając w pokornej pobożności na nadchodzącą mszę, Paweł nie mógł oprzeć się wrażeniu, że pasuje tu równie mało jak modernistyczna fasada górującego nad nim kościoła. W przeciwieństwie do niepozornej garstki ludzi wlewających się do świątyni wśród beztroskich rozmów nie miał nadziei na jakiekolwiek zbawienie. Jeśli w życiu pozagrobowym rzeczywiście istniała sprawiedliwość, wiedział, że już skazał się na najgłębsze otchłanie piekła. Podczas kariery najemnika zahartowany żołnierz zebrał tak długą listę okrucieństw, że zwykle z trudem przypominał sobie cokolwiek poza ostatnim kontraktem. Być może chodziło o brutalność konfliktu, który pochłonął niegdyś kwitnące miasto, albo zwyczajnie o skumulowany ciężar winy, której nie potrafił dłużej tłumić. Po latach bezmyślnego wykonywania rozkazów tego, kto płacił najwięcej, jakaś nieznana siła skłaniająca do refleksji poruszyła się jednak w Pawle, otwierając bezdenną jamę pokuty, którą desperacko próbował wypełnić. Sama chęć zmiany nie mogła jednak przeważyć ogromu dawnych zbrodni. Bez względu na to, ile razy klękał w cichym poddaniu i jak często przekazywał znak pokoju wciąż zakrwawionymi dłońmi, nie potrafił znaleźć żadnego uzasadnienia dla czegokolwiek poza wieczną karą swojej udręczonej duszy. Ojciec Rydzyk z radością zaoferował rozwiązanie. \n\nPOWSZECHNE ROZGRZESZENIE - głosiła mocno pognieciona ulotka tonem tak pewnym i krzykliwym, że Paweł niemal od razu odrzucił ją jako produkt nadgorliwego specjalisty od marketingu. Gdyby sprawa nie ważyła tak wiele, wyrzuciłby papier bez drugiego spojrzenia. Twierdzenia były dość śmiałe, by uruchomić jego wyuczony zmysł oceny ryzyka, a raczej w tym przypadku umiejętność rozpoznawania, kiedy nie marnować jakże cennego czasu. Był jednak zbyt zdesperowany. \n\nZapewnienie sobie wstępu kosztowało niemal jedną czwartą całego wojennego majątku Pawła - fakt, który przypominał sobie za każdym razem, gdy rozważał rezygnację. Choć niewyjaśnione opóźnienie wystawiało jego nikłą cierpliwość na próbę, pojawienie się przy ołtarzu niemal całej kościelnej elity w końcu przyniosło odrobinę pocieszenia. Duchowy gospodarz wydarzenia wszedł na mównicę, nie marnując czasu na modlitwy ani strukturę ceremonii, i natychmiast rozpoczął pełne pasji przemówienie. \n\n- Bracia i Siostry, moje serce głęboko raduje się, że zaszczyciliście nas swoją obecnością. Ostatnie miesiące stanowiły wyzwanie dla nas wszystkich. Słyszę, jak wielu z was zadaje sobie pytanie: jak mam teraz z tym żyć? I zaprawdę powiadam wam: nikt tutaj nie jest świętym. Nikt z nas nie może całkowicie uwolnić się od grzechu. I nie ma w tym nic złego. Dobrze wiecie, że robiliście tylko to, co było konieczne. Nie zawsze moralnymi środkami, lecz dla szlachetnego celu. Tego właśnie nie rozumieją bezbożnicy. Chcą jedynie szukać wad, jakichkolwiek powodów, by powiedzieć: spójrzcie, on nie jest dobrym katolikiem. Sam fakt, że dziś tutaj przyszliście, dowodzi jednak waszego oddania Bogu. Wasze grzechy zostały odpuszczone. Udowodniliście, że zasługujecie na boskie miłosierdzie. \n\nDziesięć minut, ani sekundy dłużej. Gdy Paweł zaczął człapać ku wyjściu z budynku, jako rzekomo nowy człowiek czuł rozdarcie. Spodziewał się zmagań, monumentalnej walki z wewnętrznymi demonami, by wyszarpać choć odrobinę odkupienia, a to naprawdę miało być tak łatwe? Kilka prostych słów i wszystko było w porządku? Czy naprawdę różnił się czymkolwiek od człowieka, którym był wcześniej? Głos zwątpienia w jego wnętrzu grzmiał tak głośno, że niemal zagłuszył ostatnią puentę improwizowanej homilii:"
TOR.14.a: "- A za skromną ofiarę podczas niedzielnej mszy pomodlimy się w waszym imieniu o miłosierdzie."

TOR.15.t: "Śledztwo wewnętrzne"
TOR.15.desc: "- Ojcze Biernacki, po zapoznaniu się z wynikami śledztwa w sprawie zachowania Ojca i licznymi zeznaniami parafian znaleźliśmy niepodważalne dowody ośmiu aktów sodomii, z których cztery dotyczyły ministrantów powierzonych opiece Ojca. Popełnił Ojciec niewybaczalne zbrodnie przeciwko Bogu i człowiekowi i zagroził integralności naszego Kościoła. Co ma Ojciec na swoją obronę? - Surowy głos proboszcza zagrzmiał po sali, na równi znudzony i rozczarowany. \n\nSłysząc własne grzechy odczytywane bez ogródek, skazany kapłan czuł, jak przygniata go pełny ciężar moralnych uchybień. Jak mógł tak daleko odejść od nauk? Jak mógł upaść tak nisko i zdradzić Pana dla niekontrolowanych żądz? Był niegdyś tylko pełnym marzeń chłopcem gotowym poświęcić życie wierze. Jak do tego doszło? Teraz czuł wyłącznie winę. - Ojcze, nie będę zwodził twierdzeniami o niewinności ani błagał o przebaczenie. Przyjmę każdą karę, którą uzna Ojciec za stosowną, bez względu na jej surowość. \n\n- Powstań. - Kościelny sędzia pozostał niewzruszony. - Masz szczęście, że sprawa nie rozeszła się dalej. Trzeba było sporych... zachęt, żeby nie mówili. Wolelibyśmy zachować te zasoby. Stałeś się dla nas zagrożeniem, Ojcze Biernacki.  \n- Naprawdę mi przykro, Ojcze. Zawiodłem Ojca, lecz przede wszystkim zawiodłem Boga. Wiem, że nie jestem godny tej sutanny. - Łzy napłynęły mu do oczu. - Obiecuję, że nigdy więcej jej nie założę. \n- Och, przestań się mazać. Zdarza się. Czasem człowiek się potknie. Skąd nagle takie wielkie halo? Posłuchaj, powiem ci jedno: osobiście wolę trochę starszych, rozumiesz. Wiedzą, kiedy nie donosić. Ale... muszę zadbać, żebyś nie wpędził nas w kolejne kłopoty. \n- Ja... nie rozumiem. Ale... to złe... czy Ojciec nie wyrzuci mnie z Kościoła? - pociągał nosem przy każdym słowie. \n- A dlaczego miałbym to robić? - Proboszcz roześmiał się serdecznie. - Gdybym tak postępował, wkrótce nikt nie zostałby do zarządzania tym miejscem.  \n- A... a co z... \n- Słuchaj, omówiłem twoją sprawę z Ojcem Rydzykiem. Zrobił dla ciebie miejsce pod swoim bezpośrednim nadzorem. Uznaj to za... awans dyscyplinarny. Od tej pory mówisz mu, z kim chcesz spędzić noc, a on znajdzie sposób, by to zorganizować. Nic nie dzieje się bez jego bezpośredniej zgody, rozumiesz? \n- D... dlaczego Ojciec... \n- Przestań się nad sobą użalać. Zabierz rzeczy i przygotuj się do przeprowadzki. Zaczynasz jutro. I jeszcze jedno, Ojcze Biernacki..."
TOR.15.a: "- Mamy nadzieję, że z czasem znajdzie Ojciec sposób, by odwdzięczyć się za tę przysługę."

TOR.16.t: "Dziennik straży sąsiedzkiej - 	[?global.date.GetDateStringNoHourLong]"
TOR.16.desc: "5:47 - Początek obserwacji. Zabrałam lornetkę i kieszonkowe radio. Włączyłam akurat na poranny pacierz. W międzyczasie żadnej podejrzanej aktywności. Pojedynczy przechodnie, tylko jedna osoba warta uwagi - ten pijak Wiesiek, pewnie idzie po kolejne piwo, żeby wyleczyć albo wyprzedzić codziennego kaca. Będę go obserwować. \n\n6:12 - Wciąż spokojnie. Zepsute latarnie ograniczają widoczność. Niezidentyfikowany ruch. Zapewne dzieci. Albo duży zwierz. Trudno powiedzieć. \n\n6:33 - Wiesiek wrócił z całym kartonem. Rozłożył wszystko na ławce i zaczął ordynarnie chlać. Zbliża się do niego kilku kolejnych meneli z własnymi trunkami. \n\n7:35 - Ludzie człapią do pracy. Kinga znowu ma na sobie tę skąpą sukienkę. Trzecie ostrzeżenie: zgłoszę sprawę władzom parafii. One ją ustawią. Przynajmniej Łucja chyba dostała nauczkę. Choć wygląda na bardziej nerwową niż zwykle. Podejrzane. \n\n10:28 - Program radiowy miał prawie 10 minut opóźnienia. Niedopuszczalne. \n\n11:13 - Wiesiek i jego banda robią się hałaśliwi. Zaczęli zaczepiać każdą przechodzącą kobietę w wieku 15-50 lat. Kolejne wezwania do władz, by ich ustawiły, zostały bezczelnie zignorowane. \n\n12:51 - A oto Mariola, ta stara bezkręgowa wiedźma. Chyba wraca z zakupami. Znacznie mniejszymi niż w zeszłym tygodniu. Ha, może kończą jej się pieniądze? Emeryturka nie wystarcza? Dobrze. Należy jej się. \n\n14:03 - Dzieci zaczynają wracać ze szkoły. Och, wszystkie wyglądają tak niewinnie. Szkoda, że wkrótce wyrosną na takich przestępców. Widziałam małego Janka z papierosem, który dostał Bóg wie skąd. Naprawdę sądził, że nie dostrzegę go za tymi krzakami? Jego matka alkoholiczka musi być taka dumna... \n\n14:40 - Stało się to, co przewidywalne. Wiesiek stracił przytomność na ławce w jakiejś nienaturalnej, powykręcanej pozycji. Dokładnie 21 minut wcześniej niż wczoraj. Przynajmniej przez kilka najbliższych godzin nie będzie nikomu przeszkadzał. \n\n16:31 - Kilku chuliganów zaczęło gromadzić się na pagórku. Awanturnicy. Niebezpieczna banda. W niedzielę zaczepiali Jadzię wracającą z kościoła. Poprzednie zgłoszenie zbyto ślepo stwierdzeniem, że to pewnie tylko \"dobrzy, pobożni chłopcy, którzy zapobiegają degeneracji na ulicach\". Co za bezczelność. Znam właściwie każdą osobę w tej parafii, która naprawdę chodzi na mszę. Ich z pewnością nie ma w tym gronie. \n\n18:02 - Kaja wróciła z... czy to znowu inny chłop? Przysięgam, miesiąc temu spotykała się z kimś innym. Nie może tak być. Takie rozpasanie wymaga natychmiastowego telefonu do kancelarii wikariusza! \n\n19:46 - Pora iść spać. Już widzę Gienię w oknie. Zajmie się nocną obserwacją. I tak niewiele mogłabym o tej porze pomóc. Ma znacznie lepszy wzrok ode mnie. Rano wrócę do obowiązków."
TOR.16.a: "W całym mieście udokumentowano każdy zakątek."

TOR.17.t: "Przypadkowe intruzki"
TOR.17.desc: "- Grażynko, patrz. Spójrz, to te krzyże, o których opowiadała Mariola. \n- Piękne, och, prawdziwie piękne, Halinko. - Nieco młodsza z dwóch kobiet odpowiedziała ze zdumieniem. - Wiesz, właściwie pomogłam je sfinansować. W sierpniu zeszłego roku zbierali na nie ofiary w mojej parafii. Naprawdę musiałam sięgnąć głęboko do kieszeni. Nie dałam nawet Jankowi pieniędzy na imieniny. Ale och, było warto. \n- Zawsze miałaś szczęście. Jak z tą wycieczką na Jasną Górę, którą wygrałaś w 1997 roku... \n\nMijając imponującą bryłę Sanktuarium, para z trudem zeszła po kilku schodkach i weszła do przypominającego park terenu położonego bezpośrednio na północny zachód. Pełne zachwytu kobiety przechodziły obok niezliczonych monolitów rozsianych po krajobrazie i upamiętniających poległych bohaterów narodu, od czasu do czasu zatrzymując się, by sprawdzić, czy na liście znalazł się ktoś znany z dzieciństwa. \n\n- Halinko, całe to miejsce zapiera dech w piersiach. Ojciec Rydzyk naprawdę przeszedł samego siebie. Ludzie w domu ledwie uwierzą, gdy im o nim opowiem. \n- Wiesz, Grażynko... martwi mnie tylko jedno. Jest tak pusto. Piękny wieczór, idealna pogoda, a nikomu poza nami nie chciało się przyjść. \n\nTak to teraz wygląda, kochana. Dzieci nie mają Boga w sercach. A ich rodzice... nawet nie zaczynaj. Zupełny upadek moralny. Pamiętasz mojego siostrzeńca Pawła? Nawet nie dopilnował bierzmowania syna. \n\nSłysząc nieznane głosy wewnątrz strzeżonego obszaru, uzbrojony i zdyszany strażnik podbiegł do odwiedzających, spodziewając się wrogiego wtargnięcia. Gdy uznał obie starsze kobiety za nieszkodliwe, odruchowa panika ustąpiła fali gniewu. \n\n- Co do cholery tutaj robicie? To teren zamknięty! \n- Och, tylko trochę spacerujemy. Nie byłyśmy w tym miejscu od lat. Aż łza się w oku kręci, ile się zmieniło. Pracuje pan tutaj? Mógłby pan przekazać pozdrowienia Ojcu Rydzykowi? \n- PO DRODZE BYŁY TRZY POSTERUNKI. JAK PANIE... \n- Naprawdę? Cóż, musiałyśmy je przeoczyć. Wzrok już nie taki jak dawniej. Ale kiedy byłyśmy w pańskim wieku, proszę mi wierzyć... \n- NIE MOŻECIE PO PROSTU... ech... proszę posłuchać, musi mi pani powiedzieć DOKŁADNIE, co tutaj widziała. \n- Jak miło, że pan pyta, kochanieńki. Najpierw był ten przepiękny posąg naszego zmarłego papieża. Muszę przyznać, prawdziwie realistyczny. Widzi pan, właściwie spotkałam go kiedyś ponad trzydzieści lat temu. Nie tak całkiem osobiście, ale... \n- Dobrze, dobrze, rozumiem. Coś naprawdę godnego uwagi? \n- Zdecydowanie ten park. Ktokolwiek opracował projekt, ma ode mnie moje najszczersze gratulacje. Trochę przypomina mi... \n- Proszę pani. - Strażnik przerwał, nim mogła rozpocząć kolejną niezwiązaną dygresję. - Czy zauważyła pani coś... problematycznego? \n- Hmm, nie, nic nie przychodzi mi do głowy. Powinnam była? \n- Yyy... proszę się tym nie przejmować. - Z ulgą otarł czoło. - Ale muszę teraz panie wyprowadzić. Chodźmy. Odprowadzę panie do wyjścia. Po drodze możemy kupić kilka pocztówek."
TOR.17.a: "Bolesnego rozczarowania udało się uniknąć. Ledwie."

TOR.18.t: "Kontrola datków"
TOR.18.desc: "Marcin Sekulski daleki był od pobożności. Gdy prywatnie pytano go o cokolwiek choć trochę związanego z polityką, uwielbiał wracać do prostej maksymy: \"W tym kraju są dwie grupy złodziei: rząd i Kościół\". Przed przejęciem władzy przez Rydzyka ostatni raz wszedł do świątyni, gdy niechętnie uczestniczył w chrzcie własnej córki, na co nie omieszkał narzekać każdemu chętnemu do słuchania. Mimo pogardy dla zorganizowanej religii uznał jednak, że dla bezpieczeństwa rodziny znacznie lepiej przez godzinę w tygodniu udawać dobrych chrześcijan niż porzucić wszystko i zaczynać życie gdzie indziej, zwłaszcza przy ich skromnym budżecie. \n\nChoć podczas kilku pierwszych mszy głównie improwizował, naśladując wszystko, co robił tłum, i desperacko próbował się nie zdradzić, Marcin szybko nabrał rytmu. Zawsze przychodził akurat dość wcześnie, by zająć miejsca w środkowej części nawy, i doskonale wtapiać się w szerszą trzodę: ani zbyt apatyczny, ani przesadnie gorliwy. Gdy nadchodziła najbardziej przerażająca chwila przekazywania tacy, spoglądał na ludzi przed sobą i wrzucał dokładnie taką samą kwotę, bez względu na to, jak nieracjonalnie wysoka była. Odkąd jego parafia zainstalowała elektroniczne terminale, ku swemu niezadowoleniu musiał samodzielnie odgadywać idealną sumę. \n\nGdy Marcin podszedł do urządzenia, jak zwykle powitał go prosty niebieski ekran z kilkoma przyciskami pokazującymi różne wartości. Zwykle grał bezpiecznie i wybierał pięćdziesiąt, a może czterdzieści w gorszy dzień, ale tym razem naprawdę potrzebował wolnej gotówki, a wydanie połowy dziennego zarobku na ofiarę dla najbardziej znienawidzonej instytucji było po prostu zbyt wielkim obciążeniem emocjonalnym. \n\nCzując buntowniczego ducha, odważnie nacisnął przycisk z wartością 25 zł i odruchowo, niemal ze wstrętem, przyłożył kartę. Zamiast zwykłego dźwięku terminal wyświetlił komunikat: \"Napotkaliśmy problem podczas potwierdzania płatności. Spróbuj ponownie\". \n\nSpoglądając ponownie na ekran główny, Marcin zauważył, że większość opcji zniknęła, a zostały tylko dwie: 25 zł i 50 zł, wraz z tekstem: \"Potwierdź kwotę, którą chcesz ofiarować\". Gdy znów nacisnął tę samą liczbę co wcześniej, zamiast przejść do płatności terminal zawiesił się i wydał głośny alarm słyszalny w całym kościele. \n\nGorączkowo rozglądając się za źródłem przeszywającego hałasu, Marcin podskoczył z przerażenia, gdy na jego ramieniu spoczęła ręka, a dwóch barczystych mężczyzn w strojach ministrantów otoczyło go. \n\n- Panie Sekulski, postanowił pan ofiarować o 50% mniej niż zwykle, mimo że saldo konta właściwie się nie zmieniło. Proszę iść z nami. Dopilnujemy, by dotrzeć do sedna tego... problemu."
TOR.18.a: "Po stracie 500 zł i dwóch siekaczy mógł swobodnie uczestniczyć w dalszej części nabożeństwa."

TOR.19.t: "Cudze śmieci..."
TOR.19.desc: "Marian był tylko jednym z kilkunastu ludzi zamieszkujących opuszczony młyn na Winnicy. Już dawno przestał liczyć, z iloma osobami dzielił przestrzeń. Nie można się za bardzo przywiązywać, gdy widok ludzi ulegających warunkom zaledwie kilka metrów od starego materaca i dywanów nazywanych łóżkiem staje się codziennością. Czasem, gdy ogarniał go chłód, mógłby przysiąc, że znów ich wszystkich widzi. Ich twarze, wolne od oznak ciągłej walki, wzywały Mariana, by się poddał, ale jakiś nieświadomy instynkt zwyczajnie mu na to nie pozwalał. Jeszcze nie. \n\nPodczas zwykłego codziennego przeszukiwania pobliskich śmieci w poszukiwaniu czegokolwiek użytecznego Marian natknął się na schludnie zapakowany, nieotwarty stos papierów niedbale wepchnięty w środek sterty odpadów. Czy to z ciekawości, czy pragnienia sprawdzenia, czy paczka zawiera coś wartościowego, rozerwał kopertę na pół i tępo spojrzał na zapisane wewnątrz słowa. Ktoś wyraźnie bardzo się starał, żeby ich nie dostarczono. \n\nPoczątkowo włóczęga mruknął z irytacją, gdy zobaczył, że paczka zawiera tylko zestaw identycznych kopii wniosku o pomoc. Gdy już niemal go wyrzucił, zdołał jednak połączyć fakty, zdał sobie sprawę, że sam może skorzystać z programu, i zawlókł dokumenty do młyna, aby wszyscy je wypełnili. \n\nSpośród wszystkich próśb wysłanych przez garstkę osób wciąż dość silnych, by wpisać niezbędne dane, tylko wniosek Mariana nie został odrzucony z powodu biurokratycznego szczegółu ani odesłany z lekceważącym: \"Nie stwierdzono potrzeby udzielenia pomocy\". Po kilku dniach ciszy niechętny urzędnik przybył obejrzeć warunki życia odbiorcy. Fakt ten wywołał w całej grupie wrzaskliwą kłótnię o to, który z wielu rozpaczliwie potrzebnych zasobów wybrać jako oczekiwaną dotację. Widząc wygłodniałe twarze towarzyszy, Marian wskazał jedyną rzecz mogącą pomóc odeprzeć najgorsze - żywność. \n\nNastępnego dnia obudził go dźwięk ciężarówki powoli cofającej ku wejściu do młyna. Szybko wstał i wybiegł, pragnąc jako pierwszy przynieść dobre wieści i rozdzielić nagrodę. Tuż za wejściem uderzył go odór zgnilizny tak silny, że zatrzymał się w pół kroku. Pojazd wyładował zawartość, zrzucił wszystko na jedną ogromną stertę i natychmiast odjechał, pozostawiając żebrakowi masę na wpół zjedzonych resztek - wszystko, co zostało po jednej z licznych uczt urządzanych niedawno w Sanktuarium. Marian niemal zwymiotował z obrzydzenia, lecz zaczął przeszukiwać zawartość. Przynajmniej część musiała jeszcze nadawać się do jedzenia, a on poprzysiągł, że nie wróci z pustymi rękami. Nie wtedy, gdy inni tak rozpaczliwie potrzebowali jego pomocy."
TOR.19.a: "Cóż za wygodny sposób pozbywania się odpadów. Diakon Kiereś naprawdę przeszedł samego siebie!"

TOR.20.t: "Haracz za ochronę"
TOR.20.desc: "- Dobra, chłopcy. Oto lista. Minimum tysiąc na głowę. I lepiej przynieście wszystko nietknięte. Dopilnuję, żebyście dostali swoją działkę. A teraz do roboty. \n\nBez słowa oprychy rozeszły się po kilku pobliskich mieszkaniach, a ich herszt został w czarnym sedanie. Z zadowoleniem obserwując ciężko pracujących podwładnych, ksiądz Starzyński otworzył świeżą paczkę papierosów, zapalił pierwszego i cieszył się zasłużoną chwilą spokoju. To była jego ulubiona część pracy. Zamiast harować cały dzień i pieczołowicie podtrzymywać wizerunek sumiennego, pobożnego duchownego, mógł po prostu usiąść i patrzeć na napływające pieniądze, nie kiwając przy tym choćby palcem. Powinno minąć trochę czasu, zanim... \n\nPukanie w szybę. Przerośnięta postać przed nim wygląda na kompletnie zdezorientowaną; nie żeby szczególnie trudno było ją zdezorientować. \n\n- Ej, szefie... yyy... Ojcze. Ten tutaj nie współpracuje. Co mam z nim zrobić? \n- Powiedz mi, Michał. Dlaczego zawsze muszę sam zajmować się tymi sprawami? Naprawdę tak bardzo by ci zaszkodziło, gdybyś choć raz załatwił coś sam? \n- No... powiedział Ojciec, żebyśmy ich nie bili bez rozkazu... \n- Ech, dobrze już, osiłku. Patrz i ucz się... znowu. Tym razem spróbuj naprawdę coś pojąć. \n\nPoprawiwszy sutannę, kapłan ruszył za zbirem do wskazanego mieszkania. Po uprzejmym naciśnięciu dzwonka nagłego gościa powitał zaskoczony mężczyzna w średnim wieku. \n\n- Och, Ojcze Starzyński, nie... nie spodziewałem się Ojca osobiście. Czy... coś jest nie tak? \n\nGość uprzejmie się ukłonił, jak przystało na jego pozycję. Przemawiał kojąco, przynajmniej z początku. \n- Czterdzieści sześć tysięcy, panie Kotarski. Czy ta liczba brzmi znajomo? \n- Yyy... nie wydaje mi się, żebym... \n- To łączny dochód pańskiej rodziny z zeszłego miesiąca. Wygląda na to, że dobrze się wam powodzi; składam najszczersze gratulacje. Proszę mi więc powiedzieć, panie Kotarski, co to, kurwa, ma znaczyć? \n\nKapłan wyciągnął pospiesznie rozdartą kopertę zawierającą jeden banknot stuzłotowy i niemal wepchnął ją biedakowi w twarz. \n- Mam wyraźne wrażenie, że nie ceni pan naszej ochrony. Duchowej i... materialnej. Żyjemy w niebezpiecznych czasach, prawda? Byłoby szkoda, gdyby coś stało się z tym uroczym mieszkaniem. \n- C-co? Ale ja... zawsze tyle płaciliśmy. Zawsze byliśmy hojni wobec Kościoła... \n- Czasy się zmieniły. Ceny wzrosły. I mogę od razu powiedzieć, że jeśli to wszystko, co potraficie wykrztusić, powiedzmy tylko, że nie możemy już zagwarantować waszego bezpieczeństwa... \n- Ej, szefie! Możemy go wreszcie sprzątnąć? - wypalił jeden z umięśnionych ministrantów, znudzony niezbyt subtelnym zastraszaniem. \n- Ciii, Michał. Jeszcze nie. - Duchowny ponownie zwrócił się do właściciela. - Czyż nie jest uroczy? Jak będzie? Zdecyduje się pan jednak złożyć zadowalającą ofiarę? \n\nPrzerażony bardziej osiłkami stojącymi za księdzem niż samym kapłanem gospodarz sięgnął po niewielkie pudełko i pospiesznie wyciągnął plik banknotów, wręczając go jako daninę. \n\n- Wygląda na to, że przechowuje pan tam więcej, panie Kotarski. Proszę nie sądzić, że tego nie zauważyliśmy. \n- Ale... to już więcej, niż trzeba. Proszę, to cały mój fundusz kryzysowy. Nie mogę... \n- Następnym razem proszę przekazać wymaganą kwotę od razu, gdy o nią poprosimy. Wybór należy do pana. Zna pan alternatywę."
TOR.20.a: "Odeszli zadowoleni z wymuszonej premii. Tego dnia nie zdemolowano żadnego mieszkania."

TOR.21.t: "Rozmowy niedokończone"
TOR.21.desc: "- Infolinia Radia Maryja, niech spłynie na panią błogosławieństwo Pana. \n- Halo? \n- Tak, dzień dobry pani. \n- Och, Ojcze, nie uwierzy Ojciec. W parku są chuligany. Siedzą, całymi dniami nic nie robią... DEMORALIZUJĄ DZIECI. Niedawno ktoś namalował graffiti na jednym z budynków. Józek prawie dostał zawału, kiedy to zobaczył. Proszę, Ojcze, musi Ojciec coś z tym zrobić. Przemówić tym łobuzom do rozsądku. \n- Dziękujemy za zgłoszenie. Wkrótce wyślemy na miejsce jednego z dostępnych kapłanów, by rozwiązał problem. \n- Ale proszę się spieszyć, oni wciąż tam są! Z każdą sekundą odwracają coraz więcej ludzi od Boga. Boję się, co będzie, gdy Kajtek wróci ze szkoły i to zobaczy. \n- Rozumiem. Zrobimy wszystko, by pomóc. \n- Och, zapomniałam wspomnieć! Jeden ma nawet tatuaż. Diabelski atrament, prosto na ramieniu. To poważna sprawa, Ojcze! Musicie... - połączenie zostało przerwane. \n\n\n- Infolinia Radia Maryja, błogosławieństwo Pana z tobą. \n- Yyy... halo? Słyszy mnie Ojciec? \n- Tak, słyszę cię doskonale, synu. Co cię dzisiaj trapi? \n- Więc ja, yyy... łowiłem z kolegą Marianem i, yyy... zobaczyliśmy, yyy... Jezusa w drzewie. Jakby wyrzeźbionego w korze. To cud, proszę pana. Cud. \n- Właściwy tytuł brzmi \"Wasza Świątobliwość\". \n- Co? Jak? Nie, jestem prawie pewien, że to był, yyy... prawdziwy Jezus. Zbawiciel, mesjasz i, yyy... cała reszta. \n- Bój się Pana, synu. Będziesz zwracał się do mnie WASZA ŚWIĄTOBLIWOŚĆ! \n- Aha. W porządku. Tak czy inaczej, yyy... Marian i ja siedzieliśmy sobie nad jeziorem... - połączenie zostało przerwane. \n\n\n- Infolinia Radia Maryja. Błogosławieństwo z tobą. \n- Halo? \n- Bardzo proszę. \n- Szczęść Boże. \n- Szczęść Boże! \n- Trzy słowa do Ojca Prowadzącego: Chuj ci w dupę. \n- Ooo. Widzę, że ładnie się nam Pan przedstawił; przedstawił się Pan w tej chwili przed milionami słuchaczy. - połączenie zostało przerwane. \n\n\n- Ech, infolinia Radia Maryja. Proszę mówić, w jakiej sprawie. \n- Yyy... d-dzień dobry, Ojcze? \n- Tak, przepraszam za ton. To był długi dzień. Jak mogę dziś pani pomóc? \n- Wciąż jestem w szoku, Ojcze. Zobaczyłam dziś coś nie do pomyślenia! Widziałam mojego biednego siostrzeńca, mojego biednego, bogobojnego siostrzeńca, zepsutego przez diabła, Szatana, Belzebuba i jego demony. On... widziałam, yyy... JANUSZ, JAK SIĘ NAZYWA, KIEDY DWÓCH CHŁOPÓW SIĘ PIEPRZY? - połączenie zostało przerwane."
TOR.21.a: "Po tygodniu nikt nie odważył się pracować na infolinii."

TOR.22.t: "Pośród trzody"
TOR.22.desc: "Dziewulskiego - rudera nawet w najbardziej optymalnych warunkach, a od czasu walk kompletna ruina. Brak ciężkiego uzbrojenia podczas konfliktu jest zapewne jedynym powodem, dla którego brzydkie betonowe bloki z czasów sowieckich zdołały przetrwać, choć podziurawione niezliczonymi kulami i w znacznej mierze opuszczone. Okolicy nigdy nie uważano za prestiżową, lecz dało się w niej żyć mimo dość ponurej reputacji. Dziś była domem społecznych wyrzutków - tych, którzy mieli dość pecha albo szaleństwa, by nie wyjechać natychmiast w poszukiwaniu lepszych perspektyw. Jedno było pewne: nikt nie przychodził tu bez wyraźnego celu i nikt nie pozostawał dłużej, niż było to absolutnie konieczne. \n\nTadeusz Rydzyk przygotował się na nadchodzące zadanie. Brzmiało prosto: przejść przez okolicę z pokaźną eskortą, rozdać kilka błogosławieństw, przekazać dobre słowo walczącej o przetrwanie ludności... podstawowy PR jak za dawnych dobrych czasów. Wziął kolejny łyk wybornej whisky, westchnął, a potem opróżnił resztę szklanki jednym mocnym haustem. W takich chwilach wolał mieć choć częściowo stępione zmysły. \n\nWyszedłszy na tę ziemię zapomnianą przez Boga, Rydzyk ostrożnie przyjrzał się otoczeniu. Czuł niepokój, daleko od zwykłego ładu pieczołowicie utrzymywanych miejsc. Nie minęło wiele czasu, nim zaczął przyciągać uwagę, czego rozpaczliwie pragnął uniknąć. Najpierw pojawiły się zdezorientowane spojrzenia, jakby ludzie nie byli pewni, czy kapłan nie jest tylko iluzją. Potem wzdłuż jego drogi zaczęły powoli zbierać się obdarte, rozczochrane postacie. Były przyjazne? Wrogie? Jedno wiedział na pewno - zdecydowanie wolał zachować dystans. W końcu jeden z maruderów, mężczyzna przed czterdziestką tak zaniedbany, że z łatwością uchodziłby za dwa razy starszego, przedarł się przez kordon i podbiegł do szacownego gościa. \n\n- Ojcze Dyrektorze! Ojcze Dyrektorze! Ja... to naprawdę Ojciec! Nasze modlitwy zostały wysłuchane, chwalmy Pana! \n\nKapłan odruchowo się cofnął, robiąc pół kroku w tył, by uniknąć kontaktu z natarczywym nędzarzem, który klęczał już w niedowierzaniu, że tak święta postać zaszczyciła go swoją obecnością. \n\n- Tak, yyy... proszę przyjąć to błogosławieństwo. Niech pańska wiara się nie zachwieje, a zostanie pan wynagrodzony. - Wykonał bez przekonania znak krzyża, uważnie trzymając się z dala od wyznawcy. - A teraz proszę się odsunąć. \n\nChoć ten przejaw rzekomego obdarzenia boską łaską był drobny, tylko podburzył pokaźny tłum zgromadzony wokół Rydzyka. Każdy mieszkaniec desperacko pragnął jakiegoś pozytywnego impulsu w życiu, choćby najmniejszego. Niemal natychmiast zaczęli zmniejszać odległość i przełamywać wszystkie próby utrzymania kontroli przez ochronę. \n\n- Ojcze Dyrektorze! Gdybym mógł pokornie prosić... \n- Za moją rodzinę! Proszę, jedno dla rodziny! \n- Proszę nas pobłogosławić, Ojcze Rydzyku. Potrzebujemy tylko... \n\nChoć duchowny pracował niczym linia produkcyjna na najwyższych obrotach, rozdając nieskończoną liczbę nic nieznaczących błogosławieństw, nie można było powstrzymać oszalałej fali wiernych. Z każdą sekundą podchodzili bliżej, z oczekiwaniem otaczając go ze wszystkich stron, aż ledwie zostało miejsce na swobodny oddech.  \n\n- Tak, Pan jest z tobą, bracie. I z tobą, siostro. I ty, idź w pokoju. I... nie... przestańcie... zejdźcie... zejdźcie ze mnie, na miłość boską!"
TOR.22.a: "Dopiero po pół godzinie tłum przerzedził się na tyle, by Rydzyk mógł uciec."

TOR.23.t: "Dla większego dobra"
TOR.23.desc: "Ojciec Grakowicz zawsze trzymał się na uboczu. Gdy inni zajmowali się walką polityczną, członek umiarkowanego skrzydła zgromadzenia redemptorystów skupił dzieło życia na duchowej stronie misji Kościoła. Podczas długiej posługi sprawował liczne funkcje w całym kraju, lecz żadna nie przyniosła mu rozpoznawalności poza własnymi parafiami. \n\nNic dziwnego, że brak rozgłosu uczynił z Grakowicza idealnego kandydata do nadzorowania drugiej pod względem wielkości parafii redemptorystów w mieście. Choć stanowisko zwykle wymagałoby przynajmniej próby rywalizacji z Rydzykiem, kapłan niemal nie starał się głosić jakichkolwiek poglądów, bez względu na to, jak problematyczne stawały się działania Ojca Dyrektora. Czasem karcił samego siebie za milczenie, za to, że nie prowadził Wiary drogą zgodną z jej prawym przeznaczeniem. W jego oczach obłuda reprezentowana przez obecnego zwierzchnika mogła jedynie prowadzić do dalszego spadku szacunku ludzi wobec Kościoła. Zmuszenie do otwartego wychwalania go było gorzką pigułką i po raz pierwszy w ciągu trzydziestu lat służby Ojciec Grakowicz rozważał publiczne wyrażenie sprzeciwu. \n\nStojąc przy ołtarzu, kapłan przyglądał się wnętrzu świątyni, uważnie patrząc od prawej do lewej. Rozmiar zgromadzenia go zaskoczył. Ani razu w ciągu ostatnich pięciu, może nawet dziesięciu lat... nie, być może od późnego dzieciństwa nie widział nawy tak szczelnie wypełnionej wiernymi. Wszystkie oczy spoczywały na nim z czcią i nie było ani jednej obojętnej twarzy. Jedyni ludzie, którzy nie skupiali się uważnie na jego słowach, stali w długiej kolejce do konfesjonału i raz po raz mamrotali właściwą kolejność słów, by nie zirytować siedzącego w środku spowiednika. Radosna łza pojawiła się w jego oku dokładnie w chwili, gdy miał przemówić. \n\n- Drodzy Bracia i Siostry, w wielu kwestiach nie zgadzam się z Ojcem Rydzykiem. Przed rozpoczęciem napisałem krótką notatkę, żeby o żadnej nie zapomnieć. Zabrakło mi miejsca, więc musiałem wziąć drugą. Nie stanę dziś przed wami i nie powiem, że jest uosobieniem chrześcijańskich wartości. Gdybym to zrobił, musiałbym odpowiedzieć przed Bogiem za złamanie ósmego przykazania. Widząc jednak was wszystkich zgromadzonych tutaj, mogę powiedzieć jedno: Tadeusz Rydzyk jest najlepszą rzeczą, jaka przytrafiła się polskiemu społeczeństwu w tym stuleciu. Bez względu na jego wady jest jedynym człowiekiem zdolnym przywrócić kraj do religijnych korzeni. Możecie wszyscy osądzać go w milczeniu i bądźcie pewni, że ja także będę to robił, lecz błagam każdego z was, by spojrzał ponad osobiste uchybienia moralne Ojca Dyrektora i docenił całe dobro, które uczynił i nadal czyni dla świata. Nie zapominajcie, że tylko Bóg jest wolny od grzechu. Bracia i Siostry, ku czci Ojca Rydzyka dołączcie do mojej modlitwy: Ave Maria..."
TOR.23.a: "Odkupienie ludu jest warte podporządkowania się grzesznikowi."

TOR.24.t: "Rozpoznać wroga"
TOR.24.desc: "...a potem, zaledwie 30 minut po wyjeździe, w miejscowości Górsk ksiądz Popiełuszko wpadł w zasadzkę agentów Ministerstwa Spraw Wewnętrznych. Na zawsze zapamiętamy go jako męczennika naszej sprawy. Jakieś pytania, klaso? \n- Dlaczego to zrobili? To nieładnie. - Niewinnie zapytała dziewczynka mająca najwyżej 10 lat. \n- Bo byli komunistami. A komuniści nie lubią Boga. Ksiądz Popiełuszko mówił wszystkim prawdę o naszym Panu i to ich przerażało. Gdy ludzie bez Niego w sercach się boją, robią złe rzeczy. - Mniej więcej dwudziestopięcioletnia nauczycielka odpowiedziała gorliwie, bez większego zastanowienia. \n- Jak można nie lubić Boga? Wszyscy lubią Boga. - Wtrącił się inny uczeń. \n- Cóż... mnie też trudno w to uwierzyć, ale niektórzy ludzie w obliczu prawdy Biblii widzą w Panu coś innego niż źródło wszelkiego dobra. \n- Jak z Potopem? \n- Co z Potopem, Aniu? \n- To znaczy... czy wszyscy ludzie, którzy nie zmieścili się w Arce, umarli? \n- Tak, ale byli grzesznikami. Noe był prawy i Bóg ocalił go od wody. \n- Czy grzesznicy powinni umierać? Mój tata jest grzesznikiem. Nie chcę, żeby umarł. - Odezwał się zmartwiony chłopiec. \n- Słuchajcie, poproszę Ojca Opałkę, żeby przyszedł w poniedziałek i ponownie wytłumaczył wam tę historię. Możemy wrócić do lekcji? \n\nZrujnowana sala lekcyjna, w której krzyże, ozdoby i zdjęcia ważnych duchownych wisiały tuż nad tablicą, była pełna wszelkiego rodzaju hałasu. Dzieci mówiły jedno przez drugie, zmuszając nauczycielkę do przywoływania wszystkich do porządku. Przełączyła na kolejny slajd z czerwonym tytułem \"Zagrożenia komunizmu\". \n\n- Proszę pani, kim jest komunista? - Mały Jaś zapytał nieśmiało. \n- Yyy... komunista... to ktoś, kto uważa, że wszyscy powinni mieć po równo wszystkiego - zarówno dobrzy, jak i źli ludzie. - Nie wiedziała. Zgadywała. \n- Ale zawsze mówiła nam pani, żebyśmy się dzielili. Czy pani jest komunistką, proszę pani? \n- Nie, to... to coś innego, dobrze? Na przykład komuniści nie lubią się modlić. Można rozpoznać komunistę po tym, że źle się zachowuje i nie wykonuje poleceń. \n- Proszę pani, kiedyś nie zrobiła pani tego, o co prosił Ojciec Opałka. Czy to znaczy... \n- Nie! Wystarczy. Zostajesz po lekcjach. Nie mam dziś do ciebie cierpliwości. \n\nZ tyłu klasy inne dziecko nieśmiało podniosło rękę. \n\n- Proszę pani, czy Jaś jest komunistą?"
TOR.24.a: "Infiltracja Czerwonych sięga głęboko do systemu szkolnego."

TOR.25.t: "Niedostarczony"
TOR.25.desc: "Kochana Babciu, \n\nWłaśnie dostałem najnowszą partię Twojego jedzenia. Nasi dowódcy wciąż próbują rozgryźć linie zaopatrzeniowe i podczas dostawy musiało dojść do pomyłki, bo zanim rzeczy do mnie dotarły, połowę trzeba było wyrzucić. Ale te, które udało się odgrzać, i tak były kilkanaście razy lepsze od racji, które zwykle nam dają. Przynajmniej mam szczęście, że dobrze dogaduję się z kucharzem, inaczej musiałbym jeść wszystko, co zrobiłaś, na zimno. \n\nNa froncie wciąż jest bałagan. Pod tym względem niewiele się zmieniło, odkąd ostatnio pisałem. Nadal czasem wiwatują, gdy przechodzimy, ale im dalej od Torunia, tym bardziej wrogo nastawieni są miejscowi. Nie uwierzyłabyś w niektóre wyzwiska, którymi nas obrzucają. Można by sądzić, że światło Pana dociera wszędzie, ale wygląda na to, że poza zasięgiem naszej rozgłośni ciemność dostała się do ludzkich serc. Świadomość, że walczymy, by przynieść im zbawienie, ułatwia znoszenie trudności, lecz czasem ciężko jest maszerować dalej, wiedząc, że przed nami czeka tylko więcej niebezpieczeństw. \n\nBabciu, tęsknię za domem. Tęsknię za Tobą, rodzicami, a nawet trochę za Wojtkiem. Gdy człowiek tak długo jest rozdzielony ze wszystkimi, zaczyna doceniać drobiazgi, które zawsze uważał za oczywiste. Wiem, jak ważna jest nasza misja, ale chciałbym po prostu wrócić do swojego pokoju i znów prowadzić normalne życie. Zgaduję, że pewnie pokażesz ten list reszcie rodziny, i już widzę, jak zabawnie zabrzmią dla nich te słowa, skoro to ja uciekłem. Jeśli jednak miałabyś im coś przekazać, chcę, żeby wiedzieli, iż przepraszam. Nie wiem nawet, czy po zakończeniu wojny będę miał dokąd wrócić. Nie oczekuję niczyjego przebaczenia, lecz oddałbym wszystko, żeby zacząć od nowa. \n\nChoć bardzo chciałbym opisać wszystko, przez co przeszliśmy z moją jednostką, obawiam się, że na razie mogę napisać tylko tyle. Wzywają nas do kolejnej ofensywy. Mam być w szpicy. Proszę, jeśli możesz, pomódl się za mnie i moje bezpieczeństwo. I dziękuję. Nie wiem, jak długo wytrzymałbym bez Twojej pomocy. Nie martw się. Napiszę ponownie, gdy tylko będę mógł. \n\nPodpisano, \nBartek."
TOR.25.a: "Znaleziony w mundurze poległego żołnierza, tekst splamiony czerwienią."

TOR.26.t: "Droga do zbawienia"
TOR.26.desc: "W nieco chłodny wieczór Krystyna siedziała na kanapie w salonie z długopisem w ręku, rozwiązując ulubione krzyżówki. Po drugiej stronie uniwersalnego stolika jej mąż Mirosław właśnie zaczął rozkładać karty do kolejnego pasjansa. W rogu pokoju przenośne radio odtwarzało nagranie homilii z poprzedniej niedzieli. Dźwięk płynął niezauważony w tle, gdy małżonkowie skupiali się na własnych zajęciach. \n\n- Wasz nieprawowity kraj odwrócił się od Boga. \n\nSłowa nie przyciągnęły większej uwagi poza lekkim zmarszczeniem brwi Mirosława. Krystyna wstała, by zrobić sobie herbatę. \n\n- Walcząc przeciwko wszystkiemu, co prawe, wasz kraj skazał was na potępienie i zablokował drogę do zbawienia. \n\nZaniepokojony Mirosław przestał rozdawać karty. Zawołał żonę, by natychmiast wróciła i usłyszała słowa kapłana. Dopiero co postawiła czajnik. \n\n- Czyż nie grzeszy ten, kto widzi niesprawiedliwość i odmawia jej potępienia? Kto zbiera owoce służby dla człowieka sprzeciwiającego się Panu? Gdy odmawiamy przemówienia, milcząco wspieramy ich bluźniercze działania. Sami stajemy się winni przez powiązanie. \n\nTeraz oboje słuchali już uważnie, zahipnotyzowani płomiennymi, osądzającymi słowami płynącymi z radia. Bali się o dusze; lękali się, że bezczynność wybrukowała im drogę ku wiecznej męce w głębinach piekła. \n\n- Nawet jeśli się spowiadamy i zachowujemy osobistą pobożność, niewiele robimy, by się ocalić, bo cóż daje skrucha, jeśli nadal żyjecie w grzechu? Tylko wydostając się z tego duchowego więzienia, zapewniamy sobie szansę odkupienia w oczach Pana. \n\nNiepokój powoli ustępował determinacji. Nie mogli pozwolić, by działania rządu stanęły między nimi a Bogiem. Wiedzieli, że muszą zrobić wszystko, co konieczne, bez względu na trud. \n\n- Bracia i siostry, musicie powstać przeciwko tej niesprawiedliwości. Musicie zrobić wszystko, co w waszej mocy, by sprzeciwiać się, utrudniać i uderzać w tych, którzy uciskają wiernych. Wiedzcie, że Pan zawsze patrzy. Nie ukryjecie się przed Jego osądem. Chwyćcie za broń przeciwko bezbożnym tyranom. Przekażcie tę wiadomość każdemu, kto również może zostać zbawiony. A jeśli polegniecie, drodzy słuchacze, wasza ofiara niewątpliwie zapewni wam miejsce w Jego królestwie. \n\nHomilia dobiegła końca, a audycja przeszła w łagodną melodię. \n\n- Krystyna, przynieś mi broń. Pora wszystko naprawić."
TOR.26.a: "Dzierżąc wiarę, zaskakująco łatwo tworzyć dobrowolnych męczenników."

TOR.27.t: "Rodzina, której nigdy nie miał"
TOR.27.desc: "Miłosz nie mógł zasnąć, choćby nie wiem jak się starał. Co kilka sekund obracał się z niewygody, wywołując irytującą serię skrzypnięć starej wersalki udostępnionej przez gospodarzy. Zirytowany tępo spoglądał na meblościankę niemodną od pół wieku, zajmującą znaczną część pokoju i ozdobioną nieużywanymi srebrami oraz fotografiami ludzi, którzy zapewne zdążyli się od tamtej pory zestarzeć o całe pokolenie. Łagodny świergot ptaków na zewnątrz współbrzmiał z cichym szumem przenośnego radia ustawionego w kuchni - znakiem, że jedno z właścicieli już nie spało. Między intensywnym programem szkoleniowym wymaganym przez jednostkę a koniecznością utrzymywania niemal stałej gotowości najemnik spodziewał się spędzać cały samotny czas w głębokim śnie, lecz problemy z przyzwyczajeniem się do nowego miejsca nadal mu ciążyły. \n\nMiłosz usłyszał dwa stuknięcia, nim klamka się obróciła, a do pokoju weszła około sześćdziesięciopięcioletnia kobieta niosąca proste domowe śniadanie. Szybko sprawdził godzinę - była 6:02. \n\n- Wstawaj, śpiochu. Już widno. \n- Co? - odpowiedział na wpół sennym tonem. - Daj mi spokój, jestem na to zbyt zmęczony. \n\nStarsza kobieta zignorowała skargi gościa, postawiła talerz na małym stoliku obok łóżka i z zaskakującą szybkością odsłoniła zasłony, zalewając pokój światłem. \n\n- Poważnie, co z tobą nie tak, kobieto? - syknął najemnik, zasłaniając oczy przed nagłą jasnością. \n- No już, wstawaj. Spóźnimy się do kościoła. Nie chcesz przegapić rorat odprawianych przez Ojca Milejczuka. \n- Do kościoła? Za godzinę muszę być na nogach i zgłosić się na poranną musztrę. Naprawdę sądzisz, że wolałbym spędzić ten czas na jakiejś nieobowiązkowej mszy? Muszę się, kurwa, porządnie wyspać. \n- Och, to. Rozmawiałam wczoraj z twoim kapitanem. Zgodził się dać ci wolny dzień, jeśli spędzisz go ze mną. \n- Chwileczkę... naprawdę to zrobiłaś? Dla mnie? Ale dlaczego? - W kąciku oka Miłosza pojawiła się szczera łza szczęścia. Nie był przyzwyczajony do miłych gestów. \n- Oczywiście. Cała ta wojna i walka, którą prowadzisz... czasem łatwo zapomnieć, dla kogo to wszystko. Poza tym nie sądzę, żeby ktoś cię właściwie przywitał. Mogę oprowadzić cię po mieście. \n- Nie wiem, co powiedzieć... \n- Podziękujesz mi później, młody człowieku. Teraz masz być przy drzwiach za nie więcej niż trzydzieści minut. Tu masz śniadanie. Tylko nie zwlekaj zbyt długo. Ławki zapełniają się zdecydowanie za szybko, a moje nogi nie zniosą stania trzeci dzień z rzędu."
TOR.27.a: "- Zrobię, co w mojej mocy, Babciu."

TOR.877.t: "Odkupienie ostatniej szansy"
TOR.877.desc: "Po całym dniu szkolenia kolejnej partii nieszczęsnych poborowych Karol postanowił odprężyć się w jedyny znany sobie sposób. Siedząc samotnie przy kontuarze, przestał zwracać uwagę na rozmowy wypełniające bar. Najemnik wychylił czwarty kieliszek tego wieczoru i z impetem postawił szkło na blacie. Nie przyniosło mu to żadnej przyjemności, może poza poczuciem twardości, gdy skrzywił się od smaku. Rozważał natychmiastowe zamówienie następnego, lecz niebezpiecznie zbliżał się do wspomnień. Przeszłość, twarze... ból... Mocny uścisk na ramieniu przerwał nadchodzący upadek. \n\n- No proszę, niech mnie chuj... Karol, kurwa, Michalczak we własnej osobie. Myślałem, że zginąłeś na Ukrainie, draniu. \n- Chciałbym, stary. Chciałbym. Ale, cholera, to przywołuje wspomnienia. To były czasy. \n- Nieźle dowaliliśmy tym Ruskim. Ukraińcy bez nas by sobie nie poradzili. \n- Mhm, a gdy tylko się skończyło, odwrócili się i nas napadli. Pieprzone chochoły... \n- Niewdzięczni jak zawsze. Ale nie przyszedłem tu narzekać. To ich problem, nie mój. - Zamilkł i zmienił temat. - To co taki stary okrutny drań jak ty robi w takim miejscu? Nie wyglądasz mi na pokutnika.  \n- Ty też nie. Walczyliśmy razem przez dwa lata i ani razu nie widziałem, żebyś się modlił. \n- Mariupol. Modliłem się w Mariupolu. \n- Tak, myślałeś, że umrzesz, debilu. To się nie liczy. Trzeba to robić z własnej woli. \n- No, no. Patrzcie, kto na starość doznał religijnego przebudzenia... \n- Trochę szacunku dla nazwiska, co? Nie przyjechałem tu na jakąś gloryfikowaną wycieczkę misyjną. Wątpię, żebyś ty był tutaj z tego powodu. \n- Ja? Nie, nie ma mowy, żebym upadł tak nisko i stał się płaszczącym wzorem cnót. I tak jest na to o wiele za późno. Ale jeśli mogę dalej robić to, co zawsze, a przy okazji odzyskać trochę łaski u dużego gościa na górze, dobrze wiesz, że podpiszę taki kontrakt. \n- Daj spokój, naprawdę wierzysz w te bzdury o \"rozgrzeszeniu\"? Całe życie zabijasz, rabujesz i chodzisz na dziwki, a teraz oczekujesz, że wszystko zostanie ci wybaczone, bo jeden ksiądz tak powiedział? \n- Karol, gdybyś uważał to wszystko za pierdoły, nie przyjechałbyś tu aż ze Śląska. Oczywiście, raczej niczego to nie zmieni. Nie jestem głupi. Ale obaj wiemy, że to nasza jedyna szansa. \n- Naprawdę to albo nic, co? Postaw mi następnego, stary. Nie podobają mi się nasze szanse."
TOR.877.a: "Nawet Boże przebaczenie ma swoje granice."

TOR.28.t: "Poobijany honor"
TOR.28.desc: "- Proszę podpisać tutaj, pułkowniku Dyk. Mój zespół przekaże wszystkie niezbędne szczegóły dotyczące nowego stanowiska. I... gratuluję awansu. \n\nPokonany oficer niechętnie uniósł pióro, mentalnie przygotowując się do służby nowym panom. Czuł, jakby tracił w tym procesie znaczną część honoru, lecz oferta była zwyczajnie zbyt dobra, by ją odrzucić, znacznie lepsza niż perspektywa sądu wojskowego. Kwatera batalionu, choć znajoma, wydawała się niezwykle klaustrofobiczna, gdy to już nie on dowodził. Wiedział, że wkrótce wszystko wróci do normy, lecz nadal odczuwał głębokie upokorzenie - niemożliwą do usunięcia skazę porażki. Podpis miał jedynie uczynić ją oficjalną. \n\nNim pułkownik zdążył dotknąć dokumentu, drzwi gwałtownie się otworzyły, a do sali wpadł jego dowódca. \n- Czy ktoś mi, do cholery, powie, co to ma być? - Adamczak wściekle machał niewielką kartką. \n- To? Zwykła przysięga wierności Ojcu Rydzykowi. Nic niezwykłego. Wszyscy nasi żołnierze muszą ją podpisać. - Kapelan odpowiedział niewzruszony. \n- Mieliśmy umowę. Darujecie mnie i moich ludzi, jeśli zgodzimy się służyć w waszej armii. Tego w niej nie było! \n- Okoliczności się zmieniają. Obecnie nie możemy zaoferować panu specjalnego traktowania, bez względu na stopień. \n- Jestem generałem Wojska Polskiego! Nie pokłonię się jakiemuś teokracie z urojeniami wielkości! \n- Generałem, któremu nie udało się obronić przed trzema osobnymi inwazjami... \n- W przeciwieństwie do ciebie i najwyraźniej do pułkownika Dyka wciąż mam poczucie honoru. Posiadam ponad czterdzieści lat doświadczenia taktycznego, dowódczego i logistycznego. Będziecie mnie traktować stosownie do mojej pozycji! \n- Bez względu na to, jaką zrobi pan awanturę, generale, nie zmieni pan rzeczywistości. Gdzie było całe to doświadczenie, gdy przegrał pan z bandą niewyszkolonych chłopów i garstką nieskoordynowanych najemników? Gdyby lepiej wykonał pan swoją pracę, nie znalazłby się pan w tej sytuacji. To najlepsza oferta, jaką pan otrzyma. Proszę ją przyjąć albo odejść. \n- Ha, powodzenia. - Adamczak zadrwił. - Na moim stanowisku nie przetrwałbyś nawet tygodnia. Po sposobie wykorzystania jednostek widzę, że jesteś kompletnym amatorem bez żadnego formalnego wyszkolenia. Wkrótce przekonasz się, jak trudna jest ta rola. Bądź pewien, że z wielką satysfakcją będę obserwował twój żałosny występ. \n\nGenerał wyszedł równie nagle, jak wszedł, rozdarł przysięgę i zostawił ją za sobą, gdy wybiegł z sali."
TOR.28.a: "Wygląda na to, że nie pozyskamy ich wszystkich..."

TOR.29.t: "Spotkanie dysydentów"
TOR.29.desc: "W środku nocy z kompleksu biurowego przy Grudziądzkiej sączyło się pojedyncze blade światło. Wiedział, że trafił pod właściwy adres. Dyskretnie zbliżając się do budynku, by uniknąć niepożądanej uwagi, Jacek Hoga przemknął przez główne wejście, wszedł na pierwsze piętro i zapukał w szklane drzwi biura. Współspiskowiec już na niego czekał. \n\n- No, no. Patrzcie, kto przyszedł. Myślałem, że już nigdy cię nie zobaczę. Ile to minęło? - Mentzen odezwał się z lekką ulgą w głosie. \n- Jakieś... trzy lata, chyba. Czasy nie były łaskawe, odkąd się rozstaliśmy. \n- No, widzę. Wyglądasz jak gówno. Aż tak źle, co? \n- Dziwi cię to? Mam szczęście, że w ogóle żyję. Po inwazji Rydzyka musiałem zmienić miejsce razem z resztką chłopaków. Wiesz, jak trudno zdobyć choćby podstawowe zapasy w tych lasach? \n- Mhm, więc jak sobie radzicie? - zapytał z nutą ciekawości i lekkim rozbawieniem. \n- Napadamy, rabujemy, bierzemy, czego potrzebujemy, i przenosimy się dalej. To wręcz zaskakujące, jak mało zabezpieczeń ustawiają. Wschód wciąż właściwie nie jest kontrolowany. Po prostu nas rozbili i natychmiast ruszyli dalej. \n- Na razie. Wiesz równie dobrze jak ja, że to nie potrwa długo. Gdy skończą się wojny, zaczną się represje... \n- I właśnie dlatego tu jestem. Całkiem nieźle się urządziłeś, Sławek. Pomyślałem, że może moglibyśmy sobie nawzajem pomóc. \n- Więc... czego dokładnie oczekujesz? \n- Ty gardzisz Rydzykiem, ja gardzę Rydzykiem. Ty masz fundusze, ja mam... cóż, kiedyś miałem bojówkę. Ale przy kilku hojnych datkach mógłbym ją odbudować. Jeśli dobrze wyczujemy moment, możemy wykonać jakiś ruch i obalić sukinsyna. - Jego oczy rozbłysły determinacją. \n- Słuchaj, przepraszam, ale obecnie niewiele mogę zrobić, żeby ci pomóc. Sam ledwie sobie radzę. Obserwują każdy mój ruch. Nie mogę nawet wyjść z budynku bez tuzina oczu śledzących mnie wszędzie. \n- I co, po prostu poddasz się bez walki? Tak zamierzasz spędzić resztę życia? \n- To, że nie spieszę się na śmierć, nie znaczy, że nie mam własnych planów. \n- Powiedz to moim ludziom ukrywającym się w lasach i żyjącym z ukradzionych resztek! \n- Zadbam o nich. Z czasem. Bądź cierpliwy i postaraj się nie dać złapać. Pozostaniemy w kontakcie."
TOR.29.a: "Być może szansa na przyszłość."

TOR.30.t: "Pyszni nominaci"
TOR.30.desc: "Niewielki tłum zebrał się w oczekiwaniu na przyjazd księdza Biernata. Ponieważ wieś Wąwelno leżała daleko od jakiejkolwiek głównej czy choćby regionalnej drogi, okolica przywykła do traktowania jak puste miejsce na mapie. Jeśli czegoś potrzebowałeś, musiałeś jechać do miasta. Jeśli coś się zepsuło, najlepiej było naprawić to samemu, bo kto wie, kiedy miejscowej administracji zechce się przysłać kogoś do naprawy. Nawet ksiądz, który przyjeżdżał odprawić niedzielną mszę, zawsze odjeżdżał natychmiast po nabożeństwie. Kazimierz Biernat miał być pierwszym proboszczem na stałe mieszkającym we wsi od... cóż, nawet starsi nie pamiętali, kiedy - i czy w ogóle - którykolwiek z nich zechciał zostać dłużej niż kilka godzin. W nietypowo ciepły dzień prawie jedna trzecia z nieco ponad pięciuset mieszkańców wyszła z domów, by powitać nowego duchowego opiekuna. O 14:15, kwadrans po planowanym rozpoczęciu mszy, kapłan przyjechał czarnym Mercedesem. \n- Poważnie? Tutaj mnie wysłali po sześciu latach seminarium? - Ksiądz Biernat burknął do siebie, wysiadając z samochodu. \n\nNiepozorny mężczyzna pospiesznie podszedł do księdza i uprzejmie się ukłonił. \n\n- Witamy, Ojcze. Jesteśmy zaszczyceni Ojca obecnością i wdzięczni, że postanowił Ojciec nazwać to miejsce domem. To zapewne zupełnie inne otoczenie od tego, do którego jest Ojciec przyzwyczajony, ale zrobimy wszystko, by czuł się Ojciec mile widziany. Jako wójt tej gminy osobiście... \n- Aha. Zgaduję, że ta sterta kamieni to wasz kościół, prawda? \n- Cóż, to... z pewnością nie jest imponująca bazylika... - Zaśmiał się nerwowo. - Ale ma swój urok. \n- Proszę posłuchać, mam pewne standardy. Nie poniżę się do prowadzenia posługi w tej ruderze. \n- Okropnie nam... przykro, Ojcze. Czy możemy zrobić coś, by Ojca przekonać? \n- Możecie zacząć od remontu i rozbudowy kościoła do godnego poziomu. \n- Wątpię... byśmy mieli środki na taki projekt. \n- To nie mój problem, prawda? Nie odprawię tutaj ani jednej mszy, dopóki nie będzie gotowy. Zadzwońcie, gdy uznacie, że potraficie gościć mnie w miejscu mniej żałosnym od tego. \n- Obawiam się, że to może trochę potrwać. - Wójt mówił przez zaciśnięte z irytacji zęby. \n- Świetnie. I jeszcze jedno. Moje stypendium właśnie wzrosło dwukrotnie. Wydaje się uczciwe za samo rozważenie objęcia tego stanowiska, więc mnie nie zawiedźcie. \n\nNie czekając na protesty urzędnika, kapłan wrócił do samochodu i opuścił wieś równie szybko, jak przyjechał."
TOR.30.a: "Posługa to nie działalność charytatywna."

TOR.31.t: "Nieboska sprawiedliwość"
TOR.31.desc: "Roman Kneblewski nie mógł powstrzymać chytrego uśmiechu, gdy rozsiadł się na plebanii. Choć dawno tu nie był, miejsce musiało przynosić ukojenie po tym, jak nazywał je domem przez niemal połowę swego już długiego życia. W okrutnym pokazie nietolerancji, pragnąc uciszyć prawdę, zarówno liberalna administracja Bruskiego, jak i rzekomo prawowite władze Kościoła próbowały zamknąć mu usta i zabronić głoszenia kazań nawet we własnej parafii. Ojciec Dyrektor nie mógł pozwolić, by tak niesprawiedliwa kara pozostała w mocy. \n\nNa wschodniej ścianie wciąż wisiało zdjęcie Dmowskiego. Był to jedyny przedmiot, którego nie ruszono pod jego nieobecność. Wiedzieli, że wróci. Jedni się tego bali, inni wyczekiwali. Teraz miał osądzić występnych. \n\n- Jakieś wieści o miejscu ich pobytu? - Kneblewski czuł ogromną satysfakcję, wyobrażając sobie ostateczne schwytanie zaginionych urzędników dawnej administracji miasta. \n- Yyy, czyjego dokładnie miejsca pobytu, Ojcze? - zapytał ministrant z lękiem w głosie. \n- Jak to \"czyjego\"? Bruskiego, Krupy, całej cholernej reszty. \n- N... na razie żadnych śladów. \n- Dałem ci jedno zadanie, Kacper. Jedno zadanie. Czy to naprawdę zbyt wiele? \n- Ja... nie wiem. Rodzice kazali mi się tu zapisać. - Chłopiec wybiegł z pokoju z płaczem. \n\n- Ech, bezużyteczny. Powiedz mi przynajmniej, że ty masz jakieś dobre wieści, Wiktor. \n- Tak, Ojcze! Zamknąłem bary, zlikwidowałem burdele i spaliłem wszystkie szatańskie książki, jakie znalazłem, dokładnie tak, jak Ojciec kazał! - zameldował z niepohamowanym entuzjazmem. \n- Chwileczkę. Zrobiłeś to? Sam zrobiłeś to wszystko? \n- Zabrałem kilku kolegów. Dopiero im pokazaliśmy! Wszyscy byli przerażeni, kiedy przyszliśmy. Ha, i dobrze! Tak się kończy brak szacunku dla przykazań Pana! \n- Nie wiem nawet, co powiedzieć poza tym, że jestem pod wrażeniem. W nagrodę weź sobie trochę wina mszalnego. \n- Ale Ojcze, nie wolno mi... \n- Ciii, zasłużyłeś. Zabaw się, dziecko. \n\nZadowolony Kneblewski ponownie zwrócił się ku biurku. Być może dla jego małego lenna wciąż istniała nadzieja. Początek daleki był od imponującego, ale Bydgoszcz wkrótce stanie się wzorowym katolickim społeczeństwem, a on dobrze wiedział, komu podziękować za tę szansę. Poprawił mikrofon na statywie. Audycja już trwała. Nadeszła jego kolej, by przemówić."
TOR.31.a: "Walczyć za Rydzyka to walczyć za Polskę. Walczyć za Polskę to walczyć za Boga."

TOR.32.t: "Przebudzenie religijne"
TOR.32.desc: "Monika nigdy nie wyobrażała sobie, że powrót do rodzinnego miasta może być tak gorzki. W jednej chwili niemal wszystkie plany na przyszłość runęły. W Toruniu nie było żadnych możliwości, przynajmniej nie dla kogoś takiego jak ona. We Włocławku mogła zostać kimkolwiek. Siostrzeństwo zapewniało członkiniom niemal całkowitą wolność. Monika wybrała życie artystki. Jej prace nigdy nie były dość oryginalne, by przyciągać tłumy, ale ktoś zawsze od czasu do czasu wrzucił parę groszy. W połączeniu z państwową dotacją dla dziedzin twórczych wystarczało to do utrzymania przyzwoitego poziomu życia. Czasy były dobre, a praca znośna. Przede wszystkim, po wszystkich rozczarowaniach i ograniczeniach narzucanych przez polski rząd przez całe jej życie, wreszcie czuła się wolna. Teraz wszystko jej odebrano. \n\nRealnie rzecz biorąc, w Toruniu Monika mogła oczekiwać tylko dwóch możliwych rezultatów. Wszystkie zajęcia z \"tradycyjnych wartości\" i \"prowadzenia domu\" mówiły jej o tym wystarczająco jasno. Najprawdopodobniej wydadzą ją za jakiegoś zdesperowanego, brutalnego chłopaka. W mieście było ich wielu, a większość już oczekiwała nagrody za służbę. Z drugiej strony... Rydzyk dbał o swoich. Wciąż słyszała te słowa, jakby miały być pozytywną reklamą. Na myśl o ich prawdziwym znaczeniu skręcało ją w żołądku. Wiedziała, że musi jakoś stworzyć dla siebie trzecią możliwość. \n\nW drodze powrotnej Monika doznała widzenia. Podczas porannej modlitwy Maryja, Matka Boża, objawiła się dotychczas bezbożnej dziewczynie. Zesłała błogosławieństwo na ziemię i dobrą opatrzność Kościołowi służącemu w jej imię. Objawienie głęboko poruszyło Monikę, która padła na kolana i wyznała wszystkie grzechy. Przynajmniej taką historię sprzedała swoim oprawcom. Prawdziwy lęk przed tym, co czekało ją w mieście, pomógł odegrać rolę. \n\nNa jej prośbę Monikę pospiesznie zabrano do klasztoru, by poświęciła się życiu zakonnemu. Zdała sobie sprawę, że będzie musiała udawać każdego dnia do końca życia, lecz i tak wydawało się to znacznie lepsze od alternatyw. Surowa, nieprzyjazna fasada budynku skłoniła ją do chwilowego zwątpienia, lecz zanim zdołała coś zrobić, Matka Przełożona już wyszła ją powitać i odprawiła strażników. \n\n- Nie było żadnego objawienia, prawda? - Zakonnica zapytała autorytatywnym tonem. \n- C... co? Nie, mówię prawdę. Maryja mi się objawiła i... \n- Och, oszczędź mi tej bajki. Słyszałam ją już sto razy. Wiem, kiedy ktoś udaje. \n- Proszę, tylko niech mnie Matka nie odsyła... \n- Myślisz, że kogokolwiek tutaj obchodzi, czego chce Rydzyk? Połowa z nas należała kiedyś do ruchu oporu. Tutaj jesteś bezpieczna. Witaj w klasztorze, siostro."
TOR.32.a: "Siostrzeństwo żyje i ma się dobrze w swojej enklawie."

TOR.33.t: "Sprowadzeni do zera"
TOR.33.desc: "- Wzywał mnie Ojciec Król? \n\nMłody diakon pokornie stał w gabinecie jednego z najwyższych przełożonych. Od święceń minęło zaledwie kilka miesięcy, lecz zdążył już wykazać się godnym szacunku talentem administracyjnym, dzięki czemu zauważyli go kościelni zwierzchnicy - zwykle jako człowieka, któremu zlecano niechcianą pracę. Nie narzekał. Zawsze chętny do pomocy, był jednym z nielicznych seminarzystów w swoim roczniku, których oddanie wydawało się szczere. \n\n- Czarek, rozpoznajesz kogokolwiek w tej sali? - Jan Król wskazał trzech duchownych stojących w rogu z wyzywającymi minami, w większości dwa, jeśli nie trzy razy starszych od diakona. \n- Oczywiście. Cóż, dwóch z nich. Ten po lewej to biskup Okroj. Pośrodku... biskup Orchowicz. Ostatniego nie potrafię sobie przypomnieć, ale wiem, że także kiedyś go widziałem. \n- Hm, prawie trzy na trzy. Pominąłeś biskupa Wętkowskiego. Ale to bez znaczenia. Nie sprowadziłem cię tutaj tylko po to, by bawić się w zgadywankę. \n- Z radością usłużę szanownym gościom w każdy sposób, który Ojciec Król uzna za konieczny. - Diakon niemal odruchowo się ukłonił. \n- Nie, nie. Jeśli już, to teraz oni będą służyć tobie. \n- Słucham? W jaki sposób? \n- Należysz do zgromadzenia redemptorystów, Czarek? \n- Cóż, tak, ale co to ma do... \n- Świetnie. Już myślałem, że na chwilę zapomniałeś. Na mocy dekretu stoisz wyżej od wszystkich duchownych niezwiązanych ze zgromadzeniem. A skoro dopiero rozpoczynasz swoją drogę, znaleźć się niżej od ciebie oznacza... cóż, zasadniczo oznacza powrót do punktu wyjścia. \n- Ojciec właśnie zdegradował kilku z najwybitniejszych członków polskiego duchowieństwa? Ufam osądowi Ojca, ale nie rozumiem, czym to uzasadnić. \n- Nie bez powodu. Jak już wiesz, mamy tutaj szczególny sposób działania. Ci, którzy przez większość życia błądzili, mogą mieć trudności z przystosowaniem się do bardziej... wyjątkowych praktyk. \n- Więc... chce Ojciec, żebym jako tymczasowy pomocnik przyspieszył ten proces? - odpowiedział nieświadomy diakon. \n- Nie, Czarek. Pieprzyć starą hierarchię. Ci ludzie są teraz niżej od ciebie. Ich rangi nic nie znaczą. Przydzieliłem ich jako twoich uczniów. Oczekuję, że ich złamiesz. \n- A jak dokładnie mam... \n- Pamiętasz wszystkie otrzęsiny, które musiałeś znosić w pierwszych latach seminarium? Zrób im ich całą masę. Bądź kreatywny. Obiecaj tylko, że nie będziesz zbyt łagodny, dobrze? Mamy reputację do utrzymania."
TOR.33.a: "Starych biskupów czekają ciężkie dni."

TOR.34.t: "Dar powitalny"
TOR.34.desc: "Artur był zdenerwowany. Przez ostatnie sześć lat uczył się pod czujnym okiem duchowieństwa redemptorystów, lecz ani razu nie miał okazji porozmawiać z samym głównym człowiekiem. Przynajmniej nie prywatnie. Czasami Ojciec Dyrektor zaskakiwał seminarzystów niespodziewaną wizytą, zwykle połączoną ze standardowym wykładem o pobożności, skromności i tym podobnych. Nawet te krótkie wystąpienia wystarczały, by świeżo wyświęcony duchowny zaczął podziwiać duchowego zwierzchnika. Teraz, gdy dołączył do szeregów zgromadzenia, dostąpił najwyższego zaszczytu - wezwano go na audiencję u Rydzyka. \n\nPoczekalnia przed wejściem do gabinetu oszołomiła Artura przepychem. Dwa rzędy marmurowych posągów stały po obu stronach prostokątnego korytarza, a każdy był większy i bardziej szczegółowy w miarę zbliżania się do drzwi. Nad framugą wisiał potężny obraz stylizowany na witraż, przedstawiający Ojca Dyrektora górującego nad światem w świętej postaci. Gdyby ktoś odwrócił się w tym miejscu, zobaczyłby splendor stopniowo malejący z każdym krokiem oddalającym od komnat Rydzyka. Oddalającym od jego światła. Słaby, chrapliwy, lecz dziwnie kojący głos wezwał go do środka. \n\nStając przed najwyższą władzą, Artur natychmiast padł na kolana i pokłonił się Ojcu Dyrektorowi. Kapłan gestem nakazał mu wstać, uśmiechając się pod nosem na widok dobrowolnego poddania. \n\n- Gratuluję, moje dziecko. Ukończyłeś podróż, na którą niewielu ośmiela się wyruszyć. W nagrodę możesz teraz dowolnie wybrać swoje błogosławieństwo. \n- Błogosławieństwo, Ojcze? - zapytał niepewnie. \n- Cokolwiek zechcesz. Jesteś teraz jednym z nas. Wypada, byś otrzymał odpowiedni dar na powitanie. \n- Jeśli mogę; jeśli nie proszę o zbyt wiele, benedykcja Ojca jest wszystkim, czego kiedykolwiek mógłbym potrzebować. \n\nRydzyk uniósł brwi ze zdumienia, jakby uczeń powiedział coś niepokojącego. \n\n- Poważnie? Możesz mieć wszystko, czego zechcesz: spory czek, luksusowe samochody, własną małą wspólnotę na prowincji, która będzie cię czcić... a zamiast tego wybierasz kilka słów otuchy? Tylko tyle? \n- Jak powiedziano w Ewangelii według św. Mateusza: \"Łatwiej jest wielbłądowi przejść przez ucho igielne niż bogatemu wejść do królestwa Bożego\". Nie chcę sprzeciwiać się Jego słowu. \n- Tak, tak. Znam ten cytat. Ale brałbyś tylko to, co słusznie ci się należy. Powiedz mi, kto bardziej zasługuje na bogactwo niż ci, którzy służą Panu? \n- Chyba... jeśli inaczej trafiłby w ręce grzeszników... chyba wezmę samochód."
TOR.34.a: "Służba Ojcu Dyrektorowi ma swoje zalety."

TOR.35.t: "Ledwie widoczna granica"
TOR.35.desc: "- Pater noster, qui es in cælis... \n\nSłaby głos ochryple intonował modlitwę, a dźwięk cicho odbijał się w Sanktuarium. Tam, gdzie niegdyś często rozbrzmiewał żywy gwar i regularny stuk kroków tysiąca gości, zakorzeniła się złowieszcza cisza. \n\n- sanctificetur nomen Tuum... \n\nDrżał od nieznośnego chłodu marmurowych płytek, na których klęczał. Powietrze uwierało w płucach, usiłując wyrwać mu ostatni oddech. \n\n- adveniat regnum Tuum... \n\nUmysł był pusty, zdolny skupić się jedynie na tych samych mantrach powtarzanych codziennie przez ostatnie pięćdziesiąt lat. \n\n- fiat voluntas Tua, sicut in cælo et in terra... \n\nCzy naprawdę w nie wierzył? Czy pamiętał ich znaczenie? Myśli go zawiodły, pozostawiając tylko ścisłą kolejność pustych słów. \n\n- Panem nostrum quotidianum da nobis hodie... \n\nOgarnęła go słabość. Ciało zaczęło mimowolnie się kołysać, a oczy raz się zamykały, raz otwierały. \n\n- et dimitte nobis debita nostra... \n\nPodobnie migotała świadomość, gdy wzrok ustępował serii oderwanych obrazów. \n\n- sicut et nos dimittimus debitoribus nostris... \n\nGasł coraz bardziej mimo nieustannego wysiłku, by się utrzymać. \n\n- Et ne nos indu... \n\nAż nie zdołał znaleźć siły, by mówić dalej. \n\nGłośny łoskot przetoczył się przez Sanktuarium. Przez chwilę Tadeusz Rydzyk nie potrafił rozpoznać otoczenia, a nawet ledwie pamiętał, kim jest. Zimna, twarda powierzchnia posadzki budynku wołała go i pochłaniała niczym wir, z którego nie mógł wyrwać go żaden wysiłek. Czy w ogóle próbował uciec? Podnieść się, odzyskać resztkę godności? Tak właściwe wydawało się jednak po prostu tam pozostać. Poddać się. Bolała go głowa, jakby właśnie mocno uderzył. Ciało zdawało się bezwładne. Czy to była krew? W tej chwili zupełnie go to nie obchodziło. Tyle obowiązków... tyle zmagań... stresu... cudownie było zostawić wszystko za sobą. Wreszcie się poddać, gdy nadeszła właściwa pora. Był gotowy. Jeszcze kilka minut. Zamknąć oczy... objąć wszechogarniające poczucie nicości... ale ten hałas... tyle hałasu... nieznośny, siłą ciągnący go z powrotem... przeszkadzający na każdy możliwy sposób... nie miał jednak siły protestować... niesiono go... leczono... opatrywano... aż uczucie pustki powoli zniknęło i świat powrócił. Nadal czuł słabość, ale siły wracały. Powróciły myśli, a wraz z nimi wola dalszej walki. Nie miał dziś umrzeć. Wciąż tak wiele pozostawało do zrobienia."
TOR.35.a: "I nie mógł być bardziej wdzięczny za możliwość doprowadzenia tego do końca."

TOR.36.t: "Nowa technologia, stare nagrania"
TOR.36.desc: "Czesław Wiśniewski, kierownik jednego ze sklepów AGD i RTV w bydgoskiej galerii \"Pomorska\", przepracował już trzy godziny, gdy dotarła nowa partia telewizorów. Smukłe krawędzie ekranu i imponująca rozdzielczość sprawiły, że trzymiesięczne opóźnienie dostawy było więcej niż warte czekania. Przez chwilę podziwiał te cuda techniki, tak niepasujące do zbombardowanych ulic i egzystencji na granicy przetrwania. W ostatnich latach przywykł do prostych prowizorycznych radioodbiorników jako właściwie jedynej rzeczy dostępnej w magazynie. Tutaj, z najnowszą technologią na rynku, czuł się, jakby Upadek był tylko złym snem. \n\nPo ustawieniu wszystkich telewizorów na odpowiednich ekspozycjach Czesław zaczął sprawdzać, czy którykolwiek nadal działa. Cena była ustawiona tak wysoko, że wykraczała poza możliwości wszystkich poza najzamożniejszymi obywatelami, więc zdał sobie sprawę, iż sprzęt może pozostać w sklepie przez bardzo długi czas. Równie dobrze mógł się nim trochę pobawić, jeśli tylko istniał jakiś odbiór, czego nie był całkiem pewien. \n\nCzesław chwycił jeden z pilotów i ekran niemal równie wielki jak on sam się uruchomił, wyświetlając logo Fundacji Lux Veritatis. Domyślny kanał, regionalna odmiana TV Trwam, pokazywał ziarniste, ledwie rozpoznawalne nagranie wczorajszej mszy. Rozciągnięty do rozdzielczości obraz pozwalał dostrzec poszczególne piksele zarejestrowane przez ledwie działającą kamerę, a mikrofon z trudem wychwytywał jakikolwiek dźwięk bez zagłuszania go irytującym brzęczeniem. \n\nZmienił kanał - podobnie niskiej jakości nagranie niedawnej pielgrzymki. Tym razem operator próbował nagrywać w ruchu, przez co cały obraz trząsł się w sposób niekontrolowany. Jeszcze raz - kiczowata hiszpańska telenowela z lat 80. o klasztorze zakonnic uwikłanych w spór o ziemię z miejscowym urzędnikiem. Jeszcze raz - chór dziecięcy fałszujący hymny przed widownią złożoną z około dziesięciu niezainteresowanych rodziców. Ponownie - promocyjne ujęcie Sanktuarium z lotu ptaka, z rozmaitymi zachętami do darowizn i celami zbiórek, które raz po raz pojawiały się przy łagodnej melodii. \n\nPo kilku kolejnych kliknięciach wrócił do początkowego kanału, tyle że kamera nagrywająca mszę zdążyła się przewrócić i nikt z ekipy produkcyjnej tego nie zauważył. Zirytowany Czesław zrezygnował z szukania czegokolwiek nadającego się do oglądania i przez centralny system sterowania włączył wszystkie telewizory jako ekspozycję. Kapłan uniósł ręce jednocześnie na pięćdziesięciu ekranach. Zaczął mówić. Gdy tylko wypowiedział pierwsze słowa, po sklepie wybuchła nieznośna kakofonia dźwięków. Czesław mógłby przysiąc, że uszy naprawdę zaczęły mu krwawić. Szybko wszystko wyłączył."
TOR.36.a: "Być może program wymaga jeszcze odrobiny pracy."

TOR.37.t: "Idealna oferta sprzedażowa"
TOR.37.desc: "Msza dobiegała końca, a wierni zaczynali stopniowo człapać ku wyjściu z kościoła. Genowefa szła powoli, ściskając laskę, i właśnie opuściła główną salę, wchodząc do przedsionka, gdy drogę zastąpił jej lekko otyły, łysiejący mężczyzna przed pięćdziesiątką. Energicznie wskazywał niewielki zbiór różnych przedmiotów rozłożonych na dwóch półkach i ogromnym perskim dywanie. Zwrócił się do wychodzących z dobrze wyćwiczoną ofertą handlową. \n\n- Zapraszamy wszystkich do jedynego sklepu ze wszystkimi artykułami religijnymi, jakich możecie potrzebować! Krzyże, obrazki świętych, figurki - mamy wszystko! Trzy w cenie dwóch! Dwa w cenie jednego! Promocje i rabaty tak szalone, że pomyślicie, że zwariowałem! Kupujcie teraz i skorzystajcie z oferty ograniczonej czasowo! \n\nGenowefa nieco zboczyła ku drugim drzwiom i z całych sił próbowała uniknąć sprzedawcy. W połowie drogi przez przedsionek rzuciła szybkie, mimowolne spojrzenie na prowizoryczne stoisko. Jakby namierzył ofiarę, kupiec natychmiast podszedł i ponownie przeciął jej drogę. \n\n- Szanowna pani, wygląda pani na osobę, która potrafi docenić dobrą okazję! Mam dla pani idealny produkt. - Wskazał małą ikonę Maryi. - Już widzę, że będzie wspaniale wyglądać w pani domu ORAZ przyniesie wiele błogosławieństw. \n- Nie, nie. Lepiej już pójdę. Obiad sam się nie zrobi. - Lekceważąco machnęła wolną ręką. \n- Proszę się nie martwić, zajmę tylko sekundę. I będzie pani z tego zadowolona! - Sprzedawca szarpnął Genowefę za rękę, przyciągając bliżej towarów. - Ta fiolka wody święconej przybyła prosto z Ziemi Świętej. Pochodzi z tego samego jeziora, w którym kąpał się niegdyś Jezus. A za jedyne 14,99 zł dorzucę zestaw do ćwiczeń z motywującymi cytatami z Biblii! \n- Zestaw do ćwiczeń? Chyba jestem trochę za stara na takie rzeczy. - Zaśmiała się uprzejmie. \n- Niedorzeczność, proszę pani. Nie wygląda pani nawet na trzydzieści lat! Ale jeśli szuka pani czegoś innego, proszę się rozejrzeć. \n- A co z... tym? - Wskazała jaskrawo zdobioną książkę. \n- Ma pani naprawdę bystre oko! To \"Przewodnik po Ewangelii św. Mateusza\". Nowe wydanie, prosto z drukarni. Widzi pani tylną okładkę? Po zebraniu całego zestawu utworzą przepiękny wizerunek Ojca Dyrektora. \n- Więc... ile kosztuje? \n- Standardowa cena to 50 zł, ale pani mogę oddać za 30 zł. Absurdalnie tanio, prawda? Powiadam pani, ledwie wychodzę na zero! \n\nGenowefa sięgnęła do kieszeni i wyciągnęła jeden banknot stuzłotowy. \n\n- Przepraszam, ma pan wydać? Nie wzięłam niczego mniejszego. - zapytała błagalnie. \n- Obawiam się, że nie, ale proszę się nie martwić. Zobaczmy, co jeszcze mogę dorzucić, żeby dostała pani pełną wartość za swoje pieniądze."
TOR.37.a: "Może lampkę nocną z Jezusem?"

TOR.38.t: "Unikanie dziesięciny"
TOR.38.desc: "Kancelaria rejestru, położona w skromnej krypcie tuż pod główną nawą, była nieprzyjemnie wilgotna i ciemna, oświetlona jedynie kilkoma pochodniami oraz małą żarówką wiszącą dokładnie nad głową Pawła. Naprzeciwko siedział urzędnik w całkowicie czarnej sutannie, nie odrywając wzroku od zakurzonej książki oprawionej w skórę, w której od czasu do czasu zapisywał krótkie notatki. Paweł odchrząknął, by zwrócić jego uwagę. \n\n- Ojcze, z całym szacunkiem dla jakości prowadzonej dokumentacji muszę zgłosić błąd dotyczący mojej miesięcznej dziesięciny. \n- W jaki sposób? Wszystko wygląda prawidłowo. - Obojętny, monotonny głos zdradzał oznaki starości. \n- Widzi Ojciec, z jakiegoś powodu naliczono mi dziesięcinę prawie dwukrotnie wyższą niż w zeszłym miesiącu. Nie dostałem nowej pracy ani awansu. Ta kwota będzie znacznym obciążeniem dla mojej rodziny, dlatego naprawdę chciałbym wyjaśnić pomyłkę. \n\nKapłan przewertował strony, wzbijając niewielką chmurę pyłu, przez którą i tak ciężkie powietrze stało się niemal niezdatne do oddychania. Powolność jego pracy irytowała zdenerwowanego petenta, który niecierpliwie tupał nogą. W końcu archiwista się zatrzymał i skupił na konkretnej linijce. \n\n- Ach, Paweł Bielecki. Tak, widzę problem... \n- Świetnie, więc Ojciec go poprawi, a ja zapłacę zwykłą kwotę? \n- Nie tak szybko. Po pierwsze, kupił pan nowy telewizor. To podwyższa dziesięcinę medialną. \n- Dobrze, ale to chyba nie może oznaczać niemal podwojenia całej sumy! \n- Oczywiście, że nie. Dalej mamy jednorazową opłatę za opuszczenie mszy. Wniebowzięcie Najświętszej Maryi Panny jest świętem nakazanym, panie Bielecki. Poza tym jest dopłata wyrównująca ofiary. Nie możemy też zapomnieć o... \n- Dobrze, dobrze. A wszystko razem wynosi...? \n- Mniej więcej 300 zł, plus minus. \n- Okej, to nadal kropla w morzu w porównaniu z kwotą, której ode mnie żądacie. \n- Pozostaje jeszcze kwestia niezgłoszonej pracy w warsztacie naprawczym pańskiego brata. \n- Skąd... Skąd w ogóle o tym wiecie? \n- Mamy swoje źródła. Według standardowej stawki powinno to zwiększyć dziesięcinę o około 2000 zł. Ponieważ jednak próbował pan oszukać władze parafialne, kwota została podwojona. Wydaje się sprawiedliwe. \n- Proszę posłuchać, będę miał poważne problemy, jeśli zapłacę to wszystko. Nie może Ojciec darować przynajmniej ostatnich 2000 zł? Zacznę płacić również za drugą pracę, dobrze? \n- Panie Bielecki, proszę się cieszyć, że postanowiliśmy rozwiązać sprawę środkami finansowymi. Inne osoby w pańskiej sytuacji musiały znosić coś znacznie gorszego niż podwyżka dziesięciny. Radzę zapłacić pełną kwotę zgodnie z otrzymanym listem. Termin mija w niedzielę, więc najlepiej będzie się pospieszyć."
TOR.38.a: "Nie okradniesz zawodowego złodzieja."

TOR.39.t: "Pionier kleptokracji"
TOR.39.desc: "- Dodzwoniła się pani do księdza Sławomira Zadłużnego, administratora finansowego kościoła św. Mikołaja Biskupa w Pieraniu. W czym mogę dziś pomóc, pani Lidio? \n- Dzień dobry, Ojcze. Dzwonię w sprawie najnowszej płatności przekazanej Fundacji. Chyba znalazłam kilka nieprawidłowości, które Ojciec zechce wyjaśnić. \n- Tak, wiem. Już przez to przechodziliśmy. Tym razem trzykrotnie sprawdziłem, czy niczego nie brakuje. Może pani przeczytać nasze zestawienia. Każde źródło dochodu zostało drobiazgowo udokumentowane. \n- Wiem. Nie oskarżam Ojca o ukrywanie pieniędzy, Ojcze Zadłużny. Jeśli już, wygląda na to, że mamy niemal odwrotny problem. \n- W jaki sposób, pani Lidio? \n- Muszę upewnić się, że wszystko się zgadza. Czy może mi Ojciec odczytać łączną kwotę dochodu z zeszłego miesiąca? \n- Dokładnie piętnaście milionów siedemset dwanaście tysięcy dziewięćset cztery złote, po zaokrągleniu. Zgodnie z zestawieniem przekazano 85%. \n- Hm, w takim razie... czy może mi Ojciec przypomnieć, ilu podatników-parafian znajduje się pod jego jurysdykcją? \n- 374. Dlaczego? \n- Zdołał Ojciec wycisnąć ponad 15 milionów z 374 ludzi? W ciągu jednego miesiąca!? \n- Imponujące, prawda? Wprowadziliśmy kilka nowych dziesięcin - transportową, konsumpcyjną, od usług kościelnych... do tego inne opłaty i kary... Oczywiście wciąż jest miejsce na dalszą optymalizację, ale dzięki tym pieniądzom mogliśmy zająć się wszystkimi niezbędnymi remontami i przyznać sobie ładną premię, a jednocześnie wysłać rekordową kwotę Ojcu Dyrektorowi. Jeśli chce pani wdrożyć część tych technik na poziomie całego państwa, mogę przesłać pełną listę. \n- Imponujące? Ojcze Zadłużny, to zahacza o przestępstwo. Poświęciłam czas na przejrzenie najnowszych dostępnych zeznań podatkowych parafian. Średnio zabiera im Ojciec niemal 75% środków. \n- Dobrze, więc w czym problem? Wygląda na to, że wciąż coś im zostaje. Nie widziałem ani jednego protestu, nawet skargi. Poradzą sobie. \n- Wystarczy. Słyszałam już za wiele. Przeprowadzę poważną rozmowę z Ojcem Rydzykiem o całkowitym braku troski Ojca o dobrobyt finansowy parafian. \n- W takim razie powodzenia. Proszę przekazać pozdrowienia. Ale... żeby oszczędzić pani wstydu, może pani chcieć wiedzieć, że to on podsunął mi pomysł. A dokładnie stworzył listę możliwych dziesięcin. Cel i metody egzekwowania były moje. \n- Bardzo w to wątpię, Ojcze Zadłużny. Ojciec Rydzyk nigdy nie wyłudzałby pieniędzy od wiernych w ten sposób. \n- Dobrze. Wie pani co? Proszę porozmawiać z nim o tej sprawie. Ucieszy się, słysząc, że moja praca idzie dobrze. Tylko proszę nie mówić, że nie ostrzegałem. Do widzenia, pani Lidio. - Kapłan zakończył połączenie."
TOR.39.a: "Ubóstwo i tak jest cnotą."

TOR.40.t: "W służbie kapitału"
TOR.40.desc: "Kłęby dymu wypełniały salon prestiżowego klubu wiejskiego położonego bezpośrednio na północny zachód od Bydgoszczy. Dwaj oligarchowie, należący do garstki ludzi dość zamożnych, by opłacić wysoką składkę członkowską, właśnie zakończyli partię golfa i odpoczywali przy kominku, popijając wyborny burbon. Ich szyte na miarę, starannie wyprasowane sutanny świadczyły o statusie dalece przewyższającym prostotę fasonu. Odpoczywając przy łagodnej muzyce klasycznej, czuli się niczym królowie we własnym małym lennie. Nic nie pozostawało poza ich zasięgiem, jakby osiągnęli osobiste niebo na Ziemi. \n\n- A pomyśleć, że dziesięć lat temu byliśmy tylko prowincjonalnymi wikariuszami. \n- Ha, nie musisz mi przypominać. W tamtych czasach ledwie mogłem się utrzymać. Miałem ten mały pokoik na plebanii w Cekcynie. Jestem prawie pewien, że na dwóch ścianach były plamy pleśni. \n- Właśnie. Trudno uwierzyć, jak niewdzięczni byli wtedy ludzie. Kiedyś na moją mszę przyszło tylko osiem osób. Razem dali mi 10 zł ofiary. \n- Osobiście cieszę się, że te dni są już za nami. \n- Tak, niech mówią o nim co chcą, ale Ojciec Rydzyk wykonał wspaniałą pracę, wynagradzając ludzi poświęcających całe życie służbie Panu. \n- Amen. Chociaż słyszałem, że ostatnio właściwie nie zajmujesz się głoszeniem kazań. To prawda? \n- Tak. Właśnie ukończyliśmy trzecie przejęcie. Ekspansja do branży kolejowej wymaga sporo czasu i wysiłku, jak zapewne wiesz. Po prostu nie zdołałem wcisnąć ewangelizacji do harmonogramu. \n- Tylko nie stań się moją konkurencją. Więc kolejny grant od samego szefa? \n- Nie tym razem. Wreszcie otrzymałem zwrot z inwestycji w to przedsięwzięcie z terminalami modlitewnymi. Pomyślałem, że równie dobrze mogę wydać pieniądze gdzie indziej. \n- A już myślałem, że nie masz w sobie choćby krztyny talentu do interesów. Nie żebym kiedykolwiek miał powód uważać inaczej. \n- Cóż, czasy się zmieniają. Dzisiaj trudno ukończyć seminarium bez szczegółowej wiedzy o makroekonomii. \n- Myślisz, że nowy rocznik będzie miał pojęcie, jak zastosować ją w praktyce? \n- Niektórzy. Większość jak zwykle zbankrutuje w ciągu kilku miesięcy. Zostawią miejsce na całkiem zyskowne przejęcia. \n- Szczerze mówiąc, już obserwuję kilka z tych firm. Jeśli chcesz, możemy usiąść i z góry podzielić ulubione, żeby nie licytować się o tę samą, gdy nieuchronnie nadejdzie okazja. \n- Możemy, ale nie obiecuję, że dotrzymam umowy. Ty także nie powinieneś. W końcu obaj musimy dbać o reputację. Nie możemy robić się zbyt łagodni. \n- Tak, i za to się mogę napić."
TOR.40.a: "Nic nowego w świecie finansów."

TOR.41.t: "Samopotępienie"
TOR.41.desc: "Kac był nie do zniesienia. Jakby tego było mało, jednostajne ględzenie stojących przed nim wikariuszy tylko pogarszało sprawę, sprawiając, że Rydzyk czuł, jakby głowa pękała mu na pół. Bez względu na wysiłek nie potrafił skupić się na ani jednym słowie porannych raportów i za każdym razem, gdy próbował poświęcić im uwagę, chwytał się za prawą skroń z grymasem bólu. Dodatkowa dawka środków przeciwbólowych przyjęta niemal godzinę wcześniej zdawała się niemal nie działać. Zirytowany kapłan bardziej z przyzwyczajenia niż jako prawdziwe lekarstwo sięgnął więc po jedyną rzecz zdolną go uleczyć - wysoką szklankę wina mszalnego. \n\n- Ojcze, nie zaleca się... nie w obecnym stanie... - jeden z podwładnych wyraził obawę odczuwaną przez wszystkich. \n- Aha. Nie żeby mogło pogorszyć cokolwiek bardziej, niż już jest. - Burknął z irytacją. \n- Rozmawiałem z Ojca lekarzem... stanowczo nalega, żeby Ojciec się nie przemęczał. \n- Nie wiem, czy zauważyłeś, ale najwyraźniej całe to miejsce ma się rozwalić, gdy tylko spróbuję odejść choćby na sekundę. Najlepiej więc będzie, jeśli przestaniesz udzielać rad i po prostu pozwolisz mi robić, co chcę. - Szybko opróżnił szklankę. Przyniosło mu to trochę ulgi. \n- Jeśli mógłbym udzielić tylko jednej sugestii... kiedy Ojciec ostatnio był u spowiedzi? Najlepiej przygotować się do wejścia do Królestwa Niebieskiego z czystą duszą. \n- Już planujesz moją śmierć, co? Wiedz, że wciąż mam się dobrze. Poza tym nie wpuściliby mnie nawet po tysiącu spowiedzi. Nie ma sensu próbować. \n- Doskonale wiemy, że sytuacja Ojca może być trudna, ale sam Jezus powiedział, iż na pokutę nigdy nie jest za późno. Jeśli odrzuci Ojciec wszystkie ziemskie przyjemności, być może wciąż ma czas. \n- Bah. Ty naprawdę w to wierzysz? Spaliłem ten most dawno temu. Nie zamierzam wysilać się, by go odbudować. To życie całkiem mi odpowiada. Nie będę kłamał i udawał kogoś, kim nie jestem. Zwłaszcza przed Bogiem. \n- Czyli mimo służby wierze skazuje się Ojciec na wieczne cierpienie? \n- Jurek, szczerze, spójrz mi w oczy i powiedz, czy twoim zdaniem kiedykolwiek zasługiwałem na wejście do Nieba. Nikt z nas tutaj nie zasługuje. Przynajmniej żyję już dość długo, by przestać się w tej sprawie oszukiwać. Ty też kiedyś to zrozumiesz."
TOR.41.a: "Nie ma sensu żyć w kłamstwie."

TOR.42.t: "Uwięziony"
TOR.42.desc: "Diakon Jedliński niczego nie nienawidził bardziej niż wysyłania po odbiór rzeczy. Wczesnym rankiem proboszcz poprosił go o odebranie od producenta zastępczej kadzielnicy po drugiej stronie Kompleksu. O ile zegarek nagle nie oszalał, była już prawie 17:00, niewiele ponad godzinę do zmroku. Przez pierwsze dwie godziny diakon próbował iść wzdłuż imponującego muru obronnego górującego nad całym terenem. Teraz, bez względu na to, jak daleko patrzył, nie dostrzegał go już w żadnym kierunku. \n\nZdeterminowany, by ukończyć zadanie, Jedliński przechodził przez wąskie alejki, coraz bardziej czując, że mijał już te same sklepy co najmniej dwukrotnie. Choć nie chciał się przyznać, zgubił się, a nawet nie zdołał znaleźć poszukiwanego miejsca. Oparł się o jeden z budynków i wyciągnął pospiesznie narysowaną mapę, próbując odzyskać orientację. Nie została jeszcze zaktualizowana o obecną sekcję. \n\n- Jesteś w złej części Kompleksu, prawda, chłopcze? - Starszy mężczyzna podszedł do diakona z wyrazem szczerej troski. \n- Chyba... tak. Co to za miejsce? Nie mam go nigdzie na mapie. \n- No tak, tego można było się spodziewać. Nie znajdziesz go w żadnych rejestrach, przynajmniej nie oficjalnych. Rydzyk chce zapomnieć, że kiedykolwiek istniało. \n- Chwileczkę, ale dlaczego? \n- Wielu chłopaków nie przechodzi selekcji. Większość ostatecznie ląduje tutaj. Zaufaj mi, nie chcesz spędzić w tym miejscu więcej czasu, niż musisz. \n- A pan? \n- Ech, dam sobie radę. Mam mały warsztat tuż za rogiem. Staram się trzymać przynajmniej kilku chłopaków z dala od ulicy, dać im jakąś alternatywę, rozumiesz. Możesz spędzić tam noc. To jedno z niewielu bezpiecznych miejsc w całej dzielnicy. Ogarnę kogoś, kto rano odprowadzi cię do parafii. \n- Proszę zaczekać, niech przynajmniej wynagrodzę panu trud. - Diakon Jedliński sięgnął do torby. - Cholera, gdzie jest mój... \n- Portfel? Ha, wygląda na to, że ktoś już ci go zwinął. Często się to tutaj zdarza. W tym momencie to niemal rytuał inicjacyjny. \n- Ale ja muszę go odzyskać. \n- Nie musisz. Ciesz się, że brakuje tylko portfela. Mogło być znacznie gorzej. Na twoim miejscu nie kiwnąłbym palcem, żeby go znaleźć. Twoje życie jest warte znacznie więcej niż wszystko, co miałeś w środku. Po prostu odpocznij. Ktoś przyjdzie po ciebie o świcie."
TOR.42.a: "Kompleks niemal pochłania kolejną duszę."

TOR.43.t: "Podejrzany import"
TOR.43.desc: "Ojciec Laskosz ledwie nadążał za nieskończoną falą dostaw. Zdążył już całkowicie przywyknąć do kosztownych upodobań Rydzyka, lecz każdy dzień spędzony na odhaczaniu ciężarówek pełnych towarów na liście ledwie spiętej zszywaczem przypominał mu o samym ogromie przedmiotów regularnie zamawianych przez Ojca Dyrektora. Za każdym razem, gdy sądził, że widział już wszystko, witał go kolejny produkt pozornie niemożliwy do zdobycia w rozdartym wojną kraju. Nieustające tempo procesu pozostawiało niewiele czasu na zastanawianie się nad tą kwestią. W krótkiej chwili zmarnowanej na rozważanie konsekwencji zdążył już wywołać spory korek. Próbując przywrócić porządek, podszedł do pierwszej ciężarówki w kolejce, by sprawdzić, na czym polega problem.\n\n- Skąd ten przestój? No już. Jedźcie dalej. \n- Nigdzie nie jadę, póki nie dostanę pieniędzy. Jeśli Rydzyk sądzi, że może nas wykiwać, to grubo się myli. Ta dostawa nie jest żadną dobrowolną ofiarą. To umowa handlowa, jasne? Jeśli chce swój towar, lepiej niech zapłaci, a ja zostaję dokładnie tutaj, dopóki tego nie zrobi. \n- Wszystkie płatności obsługuje biuro importowe Kompleksu. Proszę się tam udać po ukończeniu ostatniej dostawy w tym miesiącu, a otrzyma pan uzgodnioną wcześniej kwotę. - Laskosz mówił monotonnym, przepełnionym znudzeniem tonem. \n- Mhm, zgadnij, skąd właśnie wracam. \n- Jestem pewien, że możemy dojść do sedna sprawy. Jaki ładunek pan przewoził? \n- Nie chcesz znać odpowiedzi na to pytanie, zaufaj mi. \n- Niestety będę musiał. Potrzebuję zobaczyć umowę. \n- Dobrze, na twoje własne ryzyko. Proszę. \n\nLaskosz przez chwilę oglądał dokument. Oczy rozszerzyły mu się z szoku, gdy głęboko wypuścił powietrze, próbując zachować urzędowy ton. \n\n- Tak, ja... rozumiem, dlaczego niezbyt chętnie ujawniał pan tę informację. Więc to... zamówił Ojciec Dyrektor? \n- Mam jego osobisty podpis. Zwykły produkt jak każdy inny. Nie pytam, kto go chce ani do jakich celów. \n- A przewozi pan... ile sztuk?\n- 100. Zgodnie z umową. \n- Miesięcznie? \n- Mhm. \n- Ech, niech Pan się nad nami zlituje. Tak, widzę problem. Najwyraźniej miał pan dostarczać taką ilość codziennie... \n- Codziennie? Daj spokój. To szaleństwo. Po co komu aż tyle... Wiesz co, nawet nie będę pytał. Nie dam rady. Wiesz, jak trudno to zdobyć? To wszystko, co znalazłem. Zdzieracie ze mnie. \n- To pański problem do rozwiązania. Podpisał pan umowę. Ojciec Rydzyk nie przyjmuje opóźnień lekko, więc radzę wrócić jutro z wymaganą ilością. Bez względu na to, czego będzie wymagało jej zdobycie."
TOR.43.a: "Ta umowa rzeczywiście brzmiała zbyt dobrze, by mogła być prawdziwa."

TOR.44.t: "Pokuta"
TOR.44.desc: "Pobłogosław mnie, Ojcze, bo zgrzeszyłem. \n\nJan Król pokornie skłonił głowę, klęcząc w konfesjonale. Kolana bolały nieznośnie, gdy dociskał je do starej drewnianej konstrukcji, lecz ze szczerej skruchy wielokrotnie odrzucał propozycje przeprowadzenia sakramentu w mniej obciążającym miejscu. \n\n- Od mojej ostatniej spowiedzi minęły trzy dni. Dziękuję, że przyjął mnie Ojciec z tak niewielkim wyprzedzeniem. Jestem udręczony, Ojcze, i ponownie pragnę mieć czystą duszę. Do moich grzechów należą: \n\nCzuł to tak samo jak za każdym razem. Tę słabość, krótki oddech. Ciężar winy często łatwo zignorować. Gdy człowiek staje z nią twarzą w twarz, odciska ślad na sumieniu. Wielu zwyczajnie się wyłącza i przechodzi przez proces bez chwili namysłu. Dla niektórych konieczność wypowiedzenia zbrodni przed najwyższą władzą pozostaje paraliżującym naciskiem. \n\n- Próżność. \n\nTak przywykł już do życia zgodnie z jej zasadami, że słowa wychodziły niemal automatycznie i całkowicie straciły znaczenie. \n\n- Fałszywe świadectwo. \n\n37 przypadków, nie żeby wszystkie pamiętał. Niektóre były koniecznością dla większego dobra. Większość - czystym cynizmem dla własnego zysku. W jego umyśle wszystkie zlewały się w jedną nieokreśloną szarość. \n\n- Chciwość. \n\nPotępienie tak mętne, jak to tylko możliwe, aby ukryć ciężar grzechu. Jakby wszystko miało zostać odpuszczone, ponieważ udało się przemknąć przed spowiednikiem. Jakby wystarczyło przekonać jego. Starał się nie rozważać zbyt długo myśli, że ostatecznie sądził będzie ktoś inny. \n\n- Sprzeniewierzenie... \n- Znowu? Janek, nie możesz dalej tego robić. \n\nNagane wyrwała Króla z transu i napełniła go złością. \n\n- Słucham? Co właśnie powiedziałeś? \n- Prawdziwa spowiedź nie jest pełna bez szczerej determinacji, by odpokutować. Dobrze byłoby... przynajmniej rozważyć zmianę. \n- Poważnie oskarżasz mnie, że się nie staram? \n- Przychodzisz do mnie co kilka dni z tą samą listą grzechów. Mówię wyłącznie ze szczerej troski o twoją duszę. \n- A co ty wiesz o zarządzaniu Kościołem wielkości całego państwa, co!? Co wiesz o koniecznych poświęceniach!? Zasługuję na coś w zamian za tę niewdzięczną pracę. Płacę ci dobre pieniądze, żebyś tu siedział i słuchał, gdy potrzebuję pokuty. Nie potrzebuję wykładów. \n- Tak, możesz zmusić mnie do powiedzenia wszystkiego, czego zechcesz. Jeśli jednak nie potraktujesz tego poważnie, nie mogę zagwarantować, że Pan będzie równie wyrozumiały jak ja. \n- A czyim zadaniem jest wstawianie się za mną? Twoja pensja wystarczyłaby na finansowanie całej dzielnicy. Za takie pieniądze oczekuję cudów."
TOR.44.a: "Być może powinienem zainwestować w nowego spowiednika."

TOR.45.t: "Przekupienie wątpiących"
TOR.45.desc: "Dwaj kapłani siedzieli po przeciwnych stronach biurka z ciemnego dębu i oceniali się wzrokiem. Żaden nie próbował ukryć pogardy wobec drugiego. Ojciec Cisoń odchylił się z założonymi rękami i z zarozumiałym uśmiechem czekał na ofertę rywala. Ojciec Król, spięty i wyczerpany po tygodniach przekonywania duchowieństwa do poparcia, wiedział, że będzie musiał zacząć. \n\n- Słyszałem, że masz pewne... alternatywne pomysły dotyczące tego, kto powinien rządzić. - Pochylił się zaciekawiony. \n- Być może. Po prostu nie sądzę, żebyś miał charyzmę, Janek. Bez urazy, ale nie dorastasz Ojcu Rydzykowi do pięt. Mamy tutaj dobrą sytuację. Nie chcę ryzykować wszystkiego, popierając nieoptymalnego kandydata. \n- A czy ten kandydat mógłby może... zrobić coś, co zmieniłoby twoje zdanie? - Był wściekły. Kapłan zaciskał zęby między słowami. Dlaczego musiał udowadniać swoją wartość komuś znacznie mniej ważnemu i wpływowemu? \n- Hm, no nie jestem pewien. Przekonasz się, że potrafię być dość... trudny do przekonania. - Ojciec Cisoń wyraźnie dobrze się bawił. \n- Wiesz, zawsze lubię robić obchód Sanktuarium. Jeszcze dziś rano znalazłem przy wejściu dwa przepiękne luksusowe samochody. Cud, nie sądzisz? Ale widzisz, mam teraz problem: sam ich nie potrzebuję i nie mam komu ich oddać. Za odpowiednie gwarancje mogłyby należeć do ciebie. \n- Daj spokój, wiem, że potrafisz znacznie lepiej. Widziałem, jak niedawno dałeś jeden z nich seminarzyście. Ale jeśli mam uwierzyć, że potrafisz od tej pory prowadzić cały Kościół... to wymagałoby czegoś wyjątkowego, prawda? \n- Jakiej zachęty więc oczekujesz? \n- Cóż, można powiedzieć, że mam wszystko, ale istnieją rzeczy... których nie da się wycenić. \n- Na przykład? - Król robił się wyraźnie zirytowany. \n- Uznanie. Wpływy. Zbyt długo pozostawałem na uboczu, Janek. Uczyń mnie rektorem Akademii, a cała opozycja zniknie w ciągu jednej nocy. To bardzo proste. \n- To stanowisko jest już obsadzone. \n- Przez Ojca Klafkę? Za kilka lat będzie już dawno niezdolny do pracy. Wyświadczyłbyś mu przysługę. Emerytura tuż po odejściu Rydzyka... brzmi honorowo, prawda? \n- Żądasz całkiem pokaźnej przysługi. A jeśli nie przyjmę umowy? \n- W takim przypadku... przypuszczam, że nadal miałbym wątpliwości co do twojego przywództwa. Musiałbym więc działać odpowiednio dla dobra Kościoła. Zaufaj mi, nie chcesz tego. \n- Ech, dobrze. Ale za taką obietnicę oczekuję pełnego poparcia mojej kandydatury. Jakiekolwiek problemy i umowa przestaje obowiązywać."
TOR.45.a: "Cena poparcia naprawdę ostatnio wzrosła."

TOR.46.t: "Słowo od naszego sponsora"
TOR.46.desc: "~~ Podcast \"Męskie spojrzenie\" #319 ~~ \n\n- Dobrze, witamy ponownie w podcaście. Zawsze mówicie nam, że tylko gadamy o wszystkim, co złe we współczesnym społeczeństwie, i nigdy nie pokazujemy wam prawdziwych przykładów właściwej męskości. \n- Zgadza się. Posłuchaliśmy więc. I nie potrafimy wskazać nikogo godniejszego pochwały niż Ojciec Jan Król. \n- To znaczy... cholera. Ten styl, ta pewność siebie... Facet ma klasę i to widać. \n- Dziś rzadko się to spotyka. \n- Tak, rzadko. Trudne czasy tworzą prawdziwych mężczyzn, a Król jest idealnym przykładem. \n\nZakrył mikrofon dłonią i nachylił się ku koledze. \n\n- Kurwa mać, Łukasz. Kto napisał ten scenariusz? Koleś wygląda jak stary worek kartofli, a mamy się nim zachwycać, jakby był naszym nowym mesjaszem. \n- Wciąż jesteśmy na żywo, idioto. \n- Cholera... tak czy inaczej... yyy... sponsorem tego odcinka jest nasz hojny patron, Ojciec Jan Król. \n\n\n~~ Ubierz się jak on: edycja Ojca Jana Króla ~~ \n\n- Wiiięc... zaczynamy od standardowej czarnej sutanny... obecnie bardzo modnej i popularnej. Każdy taką ma. Jeśli wciąż nie macie, możecie ją kupić w moim sklepie internetowym za około 70 zł. \n\n- Następnie przechodzimy do dodatków. Nie można zapomnieć o dobrych, wysokiej jakości okularach pilotkach za rozsądną cenę 90 zł. \n\n- Na koniec mamy szwajcarski zegarek wysadzany diamentami. Bez takiego nie da się wyjść z domu. Jeśli chcecie mieć szansę naśladowania najfajniejszego księdza w kraju, zwykle trzeba wydać od 100 do 200 tys. złotych, ale ten egzemplarz został po prawdzie dostarczony przez mojego sponsora... \n\n\n~~ Od Borgii do Rydzyka: krótka historia próżności duchowieństwa ~~ \n\n- Nieludzki przepych. Skomercjalizowana sprzedaż odpustów. Gromadzenie osobistych luksusów. Od najwcześniejszych lat Kościół jawnie sprzeciwiał się własnym naukom o świętości ubóstwa. Domniemana chciwość papieży wczesnego renesansu była dość potężna, by wywołać całe schizmy. Obecnie ekstrawaganckie nawyki wydatkowe postaci takich jak Ojciec Jan Król, prawa ręka wciąż kontrowersyjnego Tadeusza Rydzyka, wywołują gwałtowną krytykę ludzi potępiających rzekomą obłudę ich duchowych przywódców. Nie zamierzam używać tego argumentu. Podczas badań na ten temat zrozumiałem, jak wiele z tych oskarżeń jest oszczerczym rezultatem dawnych i obecnych trendów antyreligijnych i jak słabo oczekiwanie ubóstwa duchownych wytrzymuje konfrontację z prawdziwą doktryną Kościoła. Przyjrzyjmy się więc temu, w jaki sposób posiadanie bogactwa przez kapłanów stało się szerszym społecznym tabu i co można zrobić, by przywrócić ich prawowity wizerunek. Najpierw chciałbym jednak podziękować sponsorowi filmu..."
TOR.46.a: "Relacje w mediach cyfrowych stały się znacznie bardziej przychylne."

TOR.47.t: "Opóźnienie abdykacji"
TOR.47.desc: "- Więc to naprawdę koniec, co? Jesteś pewien, że nie chcesz działać dalej? - Król zapytał z lekkim niepokojem. \n- Ha, chciałbym. Ale nadeszła pora. Po czterdziestu latach wreszcie jestem gotowy odejść. Musiałeś długo czekać na tę chwilę, Janek. - Starzejący się kapłan zaśmiał się ze współczuciem na tę myśl, po czym wpadł w lekki napad kaszlu. \n- Gdyby tylko. Mogę być z tobą przez chwilę szczery? \n- Oczywiście, zawsze. - Jego sympatia do wieloletniego towarzysza była szczera, zupełnie inna od sztucznych uśmiechów, do których zmuszał się przed wiernymi. \n- Jeśli już, to się martwię. Przez cały ten czas utrzymywałeś wspólnotę w całości. Wszyscy ci ludzie - absolutnie cię uwielbiają. Ciebie osobiście. Od samego początku byłem jeden krok za tobą, ale nie sądzę, żebym kiedykolwiek mógł BYĆ tobą. Wątpię, by ktokolwiek mógł. \n- Nie musisz. Już teraz wykonujesz większość pracy. Ten Kościół jest w takim samym stopniu twoim dziełem jak moim. \n- Ale ludzie o tym nie wiedzą. Większość widzi we mnie tylko kolejnego lojalistę. Jasne, potrafię zajmować się wszystkimi sprawami administracyjnymi i utrzymać wszystko w ruchu tak jak zawsze, ale daleko mi do twarzy Kościoła. \n- Z czasem nauczą się cię kochać. Ja również miałem trudny początek. - Rydzyk próbował mówić uspokajająco. \n- Nie mamy czasu na trudną zmianę. Możemy stracić wszystko, jeśli coś pójdzie źle. Na pewno nie zdołasz zostać choć odrobinę dłużej? \n- Naprawdę nigdy nie pozwolą mi przejść na emeryturę, prawda? - Kolejny śmiech znów przeszedł w serię kaszlnięć, tym razem głośniejszych. - Ale jeśli mam zostać u steru, tylko to będę robił. Zrobiłem już dość. Pozwól mi przynajmniej cieszyć się ostatnimi latami życia. Nie zostało mi ich zbyt wiele. \n- Dziękuję. Dopilnuję, żeby zadbać o wszystko, czego potrzebujesz. \n- Jedna rzecz. Miałeś cztery dekady na zbudowanie własnej marki osobistej. Kiedyś mnie zabraknie. W końcu będziesz musiał sam reprezentować Kościół. Daję ci trochę dodatkowego czasu, ale od tej pory naprawdę musisz zacząć przygotowywać się do zastąpienia mnie. \n- Chciałbym, żeby tak nie było, ale... postaram się zrobić wszystko, co w mojej mocy. \n- Od czasu do czasu będę sprawdzał, jak sobie radzisz. Sam to powiedziałeś - w końcu to nadal mój Kościół. Muszę dopilnować, by pozostał na właściwej drodze. - Rydzyk uśmiechnął się ze szczerą dumą."
TOR.47.a: "Kryzys sukcesyjny został odroczony bezterminowo."

TOR.48.t: "Ekipa konserwacyjna"
TOR.48.desc: "Dwaj młodzi mężczyźni, ubrani od stóp do głów na czarno, wysiedli z camaro na poboczu drogi wojewódzkiej 246. Nad ich głowami wisiały ciemne chmury, a nozdrza wypełniło im wiejskie powietrze. Chcieli się stamtąd wynieść jak najszybciej. Jacek otworzył bagażnik i wyjął potrzebny sprzęt. \n\n- Jesteś pewien, że to tutaj? Równie dobrze mogłoby chodzić o każde inne skrzyżowanie pośrodku niczego. \n- A czego się spodziewasz po jakiejś przydrożnej kapliczce? Czytałeś zlecenie, prawda? Uważaj się za szczęściarza, że możesz zastąpić Rydzyka przynajmniej w jednym z jego obowiązków. \n- Skoro to on się nią opiekuje, spodziewałem się czegoś naprawdę wyjątkowego. Jak na razie to miejsce wygląda po prostu na opuszczone. \n\nPo kilku minutach rozglądania się zauważyli niewielki, przewrócony krzyż leżący obok lekko wyniesionego nasypu. O ile w ciągu ostatnich kilku dni nie przeszła tędy jakimś cudem niezauważona katastrofa, miejsce to musiało zostać zapomniane już dawno temu. \n\n- To chyba nie może być to, co? \n- Nic innego nie pasuje do opisu. Jakiś powód przecież musi być. Może kapliczkę niedawno zdewastowano. \n- Uch, wszędzie walają się dziesiątki pustych butelek po piwie. Kompletny bajzel. \n- Sprawdź daty. Może powiedzą nam, kiedy to wszystko się wydarzyło. \n- Wiesz co? Wolałbym niczego z tego nie dotykać, ale chyba nie mam wyboru. Zobaczmy... łał, ale one są stare. \n- Jak bardzo? \n- Chyba połowy tych marek już nawet nie produkują. Nikt nie zajmował się tym miejscem przynajmniej od czasów sprzed Upadku. \n- Nie no, daj spokój. To niemożliwe. 'Kustosz Kapliczki w Kleparach' jest częścią oficjalnego tytułu Rydzyka. Wiesz, tego długiego. Nie ma szans, żeby pozwolił jej zgnić. \n- Ech, daj mu trochę siana. Ma swoje lata. Naprawdę oczekujesz, że będzie pamiętał o wszystkich swoich obowiązkach? Ten raczej nie zajmuje wysokiego miejsca na liście. \n- Jacek, powiedz mi szczerze. Byliśmy już w całkiem wielu miejscach, prawda? Czy przy choć jednym z obowiązków, którymi się zajmowaliśmy, miałeś wrażenie, że wcześniej go nie zaniedbano? \n- Nie... bardzo. Przynajmniej niczego takiego nie pamiętam. \n- Właśnie! Myślałem o tym i wiem, że zabrzmi to niemal bluźnierczo, ale co Rydzyk właściwie robi? Dawno nie widziałem, żeby zajmował się czymś pożytecznym. \n- Masz rację. To bluźnierstwo. \n- Hm, chyba mnie za to nie zgłosisz, co? \n- Tym razem nie. Weź rękawiczki. Ty zbierasz butelki, a ja poskładam kapliczkę."
TOR.48.a: "Nic dziwnego, że zaniedbanie sięga jeszcze głębiej."

TOR.49.t: "Poczucie kruchości"
TOR.49.desc: "Dokładnie kwadrans po ósmej Mariola wyruszyła na poranne zakupy. Z trudem ciągnęła swój wózek Rolser po wyboistym chodniku, kuśtykając przez ponad dwadzieścia minut na odcinku, który normalnie pokonywało się w około siedem. Gdy poczuła znajomy ucisk w piersi, który często pojawiał się po przejściu więcej niż kilkuset metrów, zatrzymała się przy wejściu do parku Tysiąclecia, żeby złapać oddech. Po krótkim odpoczynku zauważyła idącą w jej stronę przyjaciółkę. Dbając o pozory i bojąc się, że inaczej wyda się przesadnie zniedołężniała, Mariola ruszyła dalej, próbując ignorować przeszywający ból, który wciąż nie ustąpił. Stosunkowo szybko obie się spotkały. \n\n- Słyszałaś, Halinka? Rydzyk przechodzi na emeryturę. - Ledwo łapała oddech. \n- Szczerze mówiąc, dobrze dla niego. Ostatnio naprawdę marniał. Na stare lata zasłużył sobie na odpoczynek. \n- Nie martwisz się? Nie wiem, może po prostu tak przywykłam do jego obecności, ale trudno mi sobie wyobrazić, żeby to wszystko działało bez niego. \n- Będziemy w dobrych rękach. Ojciec Król dopilnuje, żeby Kościół funkcjonował bez zakłóceń. Oczywiście wszyscy będziemy tęsknić za Rydzykiem, ale realistycznie rzecz biorąc, niewiele się zmieni. \n- To już potwierdzone? \n- Chyba tak. Ostatnio trąbią o tym właściwie wszędzie. Nie słyszałaś? \n- Nie... jestem pewna. Chyba coś mi mignęło. - Nie mogła sobie przypomnieć. Może jej własny wiek zaczynał dawać o sobie znać, pomyślała z niepokojem. \n- Cóż, jest z Rydzykiem od samego początku. Mamy szczęście, że ktoś taki będzie kontynuował jego dzieło. \n- Tak, Król... Wierz lub nie, ale kilka razy na niego wpadłam. \n- Jak zwykle szczęściara, co? I jaki był? \n- Zaskakująco nijaki. Nie zrozum mnie źle, wydaje się miły, mówi to, co trzeba, i jest bliższy naukom Ojca Dyrektora niż którykolwiek z pozostałych księży, ale po prostu tego nie widzę. Nie jest typem przywódcy. \n- Chyba nie wątpisz w osąd Rydzyka. Zna go o wiele lepiej niż my. Skoro twierdzi, że podoła zadaniu, musi być w nim coś, czego nie dostrzegamy. \n- Mam nadzieję. Ostatnio zaczyna wychodzić ze swojej skorupy, ale to może dać tylko tyle. Szczerze mówiąc, chyba nigdy nie spotkałam kogoś tak pozbawionego charyzmy. \n- W takim razie niech Pan ma nas w swojej opiece. Czekają nas ciężkie lata. \n\nPo zakończeniu rozmowy Halina przystanęła i usiadła na pobliskiej ławce. Jej biodro potrzebowało odpoczynku, zanim mogły ruszyć dalej. Widok przyjaciółki, która tak samo zmagała się z codziennymi czynnościami, przyniósł Marioli pewne ukojenie. Powolny marsz czasu doganiał wszystkich. W końcu inni zajmą ich miejsce."
TOR.49.a: "W całym mieście jedno pokolenie powoli odchodzi."

TOR.50.t: "Ekspresowe zacieranie śladów"
TOR.50.desc: "- Oczywiście, panie Ćwikieł. Proszę mówić dalej. Co jeszcze pan pamięta? - Sławomir Mentzen spokojnie popijał wodę, zapisując zeznania rozmówcy. \n- A potem... wyrzucili mnie z własnego domu. Zerwali umowę najmu, żeby zrobić więcej miejsca pod swój kompleks. Bez żadnego odszkodowania. Potem przez prawie rok byłem bezdomny. Rozumie pan, co coś takiego robi z człowiekiem? \n- Jestem pewien, że musiał to być dla pana niezwykle traumatyczny okres. Gdy zaczniemy rozliczać Rydzyka, dopilnujemy, żeby otrzymał pan należne zadośćuczynienie. \n\nAsystent pilnie zapukał do szklanych drzwi gabinetu i wszedł do środka. Był wyraźnie wstrząśnięty, niemal całkiem pobladł. \n- Sławek, mamy problem. \n- Co tym razem, Arek? Coś z księgami? \n- Nasze kamery przy stacji wykryły ruch. Nieoznakowani, prawdopodobnie uzbrojeni, jadą w tę stronę. Zaraz będziemy mieli gości. \n\nWyczuwając niebezpieczeństwo, Mentzen natychmiast wstał i ruszył do głównego holu, naprędce zwołując wszystkich dostępnych pracowników. \n\n- Dobra, wszyscy. Wygląda na to, że zaraz przejdziemy bardzo dokładną kontrolę. Zbiry Rydzyka już tu jadą. Mamy około pięciu minut, może siedem, jeśli uda się ich trochę opóźnić. Znacie procedurę. Pudła z dowodami przeciwko władzom kościelnym mają trafić do zamykanych schowków, poza zasięg wzroku. Każdemu z was daję akta klienta. Macie wyglądać, jakbyście właśnie nad nimi pracowali. Zachowujcie się naturalnie i nie róbcie nic podejrzanego. \n- Sławek, nie mamy czasu. Ci ludzie nie przyjeżdżają się bawić. To wygląda na jedną z jego ekip najemników. Przeczeszą wszystko, co mamy, i jeśli znajdą cokolwiek obciążającego, będzie po nas. \n- Cholera. Dobra, zmiana planów. To cofnie nas o całe miesiące. Wszystko, co nie należy do bieżącej działalności, ma trafić do niszczarki. Albo zostać zniszczone w jakikolwiek inny sposób. Wszystko jedno jak. Nie mamy czasu. Już! Ruszać się, no dalej! \n\nWrócił do gabinetu, gotowy naprędce spalić wszystkie kłopotliwe dokumenty. Jego gość nadal siedział przy biurku, niczego nieświadomy i nerwowo się wiercił. \n\n- Uch, zapomniałem o panu. Kurwa, nie może pan teraz po prostu wyjść. To zbyt podejrzane. Będą pana przesłuchiwać, aż pan pęknie. Słuchaj pan, od tej chwili jest pan drobnym przedsiębiorcą, który przyszedł po poradę w sprawie deklaracji CIT. Zrozumiano? Proszę tylko podpisać. - Wręczył klientowi wstępnie wypełnioną kartkę. \n\nSeria głośnych uderzeń przestraszyła Mentzena. Czas się skończył. Powoli otworzył drzwi, podczas gdy za jego plecami wciąż panował kompletny chaos. Mógł tylko mieć nadzieję, że zrobili wystarczająco dużo. \n\n- Ach, ojciec Bortkiewicz! Cóż za miła niespodzianka!"
TOR.50.a: "O włos."

TOR.51.t: "Rewolucjoniści najgorszego sortu"
TOR.51.desc: "Późnym wieczorem, w sali lekcyjnej opustoszałej szkoły podstawowej, jak w każdy pierwszy czwartek miesiąca, Rada Okręgu Podgórz - najskuteczniejszy z obywatelskich samorządów Torunia - omawiała szereg drobnych problemów dotyczących dzielnicy. Choć władza tego organu nie sięgała dalej niż narzucona sobie dyscyplina jego członków i suma ich skromnych składek, nawet najmniejsze z dyskutowanych zmian zwykle wywoływały lawinę emocji wśród obecnych. Po trzydziestominutowej awanturze o nowe zasady segregowania śmieci byli wreszcie gotowi ruszyć dalej. \n\n- Dobrze, proszę państwa. Widzę, że napięcie nieco opadło, przejdźmy więc do następnego punktu porządku obrad: co zrobimy z sadzonkami na Witkowskiego? \n- Po pierwsze, czyj to był pomysł, żeby je tutaj posadzić!? I dlaczego nikt mnie nie zapytał? Teraz mam zastawioną połowę podjazdu! - wtrąciła z oburzeniem pewna kobieta. \n- Klaudia, one są dosłownie jakieś dziesięć metrów od twojej posesji. Pewnie nawet nie widzisz różnicy. \n- Jak śmiesz mówić MI, czy mogę korzystać z WŁASNEGO podjazdu!? Chyba lepiej wiem, co jest, a co nie jest... \n\nDrzwi otworzyły się z impetem i do sali wszedł ksiądz w eskorcie pięciu uzbrojonych funkcjonariuszy. Spojrzał na zgromadzonych, marszcząc brwi i kręcąc z dezaprobatą głową. \n\n- Ojcze Laskosz! Przyszedł ojciec dołączyć do naszego zebrania? Duchowni zawsze mogą wnieść swój głos. - Przewodniczący zaczął nerwowo. \n- Smuci mnie, bracia, taka dwulicowość w waszych sercach. Twierdzicie, że uznajecie boskie prawo naszych władz, a jednak spiskujecie, by zastąpić je własnymi. \n- Co? Nie, nie, ojcze. W pełni przestrzegamy dekretów Kościoła; jesteśmy tu tylko po to, by omawiać sprawy lokalne, niegodne ojca uwagi. \n- A czyniąc to, twierdzicie, że sami nie potrafimy ich rozwiązać. Wasz brak wiary wychodzi na jaw, podobnie jak owoce waszej zdrady. \n- My... w pełni poddajemy się waszej usankcjonowanej przez Boga woli, chodzi tylko o to, że... wiele spraw wcześniej pozostawało nierozwiązanych; chcieliśmy jedynie zadbać o naszą wspólnotę, nie zawracając niepotrzebnie głowy Kościołowi, który już ma tak wiele obowiązków. \n- I oto wąż ujawnił swoje prawdziwe zamiary. Nie myślcie, że nie usłyszałem tego oskarżenia. Rozwiązaliśmy każdą sprawę wymagającą uwagi, dokładnie wtedy, gdy należało. Nie pozwolę, by ten zdradziecki brak wdzięczności uszedł wam płazem. - Odwrócił się do uzbrojonej eskorty. - Zabrać ich. Dopilnujemy, by każdy tutaj nauczył się nie kwestionować Jego dekretów."
TOR.51.a: "Uff, było blisko. Ci mogli być naprawdę niebezpieczni."

TOR.52.t: "Siłowa prewencja"
TOR.52.desc: "Był sobotni poranek, a więc przyszła kolej Adriana na wyprowadzenie rodzinnego psa. Zakup gończego bawarskiego początkowo nie znajdował się nawet blisko szczytu priorytetów kierownika średniego szczebla; była to raczej nagroda dla jego ośmioletniego syna za pomyślne ukończenie pierwszej klasy szkoły podstawowej, lecz od tamtej pory Adrian przywiązał się do Luny. Po zabawie w aportowanie w parku wreszcie wracał do domu. Jak zwykle postanowił skrócić sobie drogę przez teren kościelny, oszczędzając w sumie jakieś trzydzieści sekund. Odległy krzyk sprawił, że natychmiast stanął, a jego ciało napięło się ze strachu. \n\n- Ej! Co ty, kurwa, myślisz, że tu robisz? - Niski, krępy mężczyzna z ogoloną głową wypluł te słowa w ślepej furii. \n- Tylko... yyy... wyprowadzam psa. Nie chciałem wtargnąć. Przepraszam. Już sobie idę. - Jąkał się ze strachu, gdy banda pięciu agresywnych chuliganów otoczyła go przy bramie. \n- Myślisz, że jesteśmy głupi, co? Myślisz, że nie wiemy, co knujesz? \n- Co... knuję? Naprawdę nie chciałem zrobić nic złego. \n- Taa. Widzisz? Te barany zawsze się wypierają. Za każdym razem. Jebani bezmózdzy chuligani, chcą oszpecić nasz piękny kościół. I po co? Nienawistne ścierwa, wszyscy co do jednego. \n- M... mogę już iść? Zrozumiałem przekaz. Pomylił mnie pan z kimś innym. Jestem dobrym chrześcijaninem, tak jak wy wszyscy. Nigdy nie opuszczam niedzielnej mszy. \n- Siwy, byłeś na mszy. Widziałeś tam tego typa? \n- Nie, nie przypominam sobie. - Widział. Po prostu szukał zaczepki. \n- Mój kolega mówi, że nie byłeś na mszy. Nazywasz mojego kolegę kłamcą? \n- Nie, yyy... może siedzieliśmy po przeciwnych stronach kościoła... \n- Widzisz, Siwy ma dobry wzrok. Mówisz, że coś jest nie tak z jego wzrokiem? \n- No, pokaż, co masz w torbie. - Wtrącił się chuderlawy facet, na siłę obniżając głos, żeby brzmieć groźnie. \n- N... nic. Tylko zakupy... \n- Powiedział wyraźnie, nie? Pokaż, co masz w tej jebanej torbie! - Przywódca ponownie przejął inicjatywę. \n\nZbir wyrwał Adrianowi torbę z ręki i rzucił ją na ziemię. Kazał jednemu ze swoich pomagierów przeszukać zawartość, która w większości rozsypała się po ziemi na oczach wszystkich. Nie znaleźli niczego poza zniszczonym jedzeniem. \n\n- Dobra, tym razem miałeś szczęście. Jeśli jeszcze raz zobaczę cię kręcącego się koło kościoła, osobiście ci, kurwa, przemebluję gębę. A teraz spierdalaj, zanim zmienię zdanie."
TOR.52.a: "Miłuj bliźniego swego, jak widać."

TOR.53.t: "Obrona wartości"
TOR.53.desc: "Grzegorz niespokojnie wiercił się na krześle, próbując znaleźć choć odrobinę wygody na jego twardym, metalowym stelażu. Palący upał i duszne powietrze w niewielkim pomieszczeniu na tyłach komisariatu jeszcze bardziej osłabiały jego odporność. Po drugiej stronie taniego, produkowanego masowo stołu siedziało dwóch mężczyzn. Obaj patrzyli na niego z pogardą, szukając wszelkich oznak słabości i skrycie czerpiąc przyjemność z dyskomfortu podejrzanego. Zaczekali, aż dostatecznie zmięknie, i dopiero wtedy zaczęli. \n\n- Niezły dziś upał, prawda? Mogę przynieść panu trochę wody, jeśli pan chce. \n- Jasne, ale yyy... może mi pan powiedzieć, o co w tym wszystkim chodzi? Za jakieś dwie godziny muszę odebrać syna z zajęć. Naprawdę nie mogę tu długo zostać. \n- Taa. Radzę znaleźć kogoś innego, kto zrobi to za pana, póki jeszcze pan może. Dziś nie wróci pan do domu, panie Siemieniuk. To mogę panu powiedzieć. \n- Chwileczkę, nie możecie tego robić. Niczego nie zrobiłem. Mam swoje prawa. \n- Och, skończ pan pieprzyć. - Uderzył pięścią w stół. - Mamy zeznania trzech niezależnych świadków oskarżających pana o bluźnierstwo oraz potwierdzające je nagranie z miejsca przestępstwa. Ta rozmowa to tylko formalność. \n- Nadal nie rozumiem, o co chodzi. Musicie mieć niewłaściwego człowieka. \n- Dwie niedziele temu, kościół Ducha Świętego. Teraz coś świta, co? \n- Nie... szczególnie. Byłem wtedy na mszy, jak w każdą niedzielę. Co z tego? \n- Opuścił pan komunię, prawda? Pamięta pan, co wtedy powiedział? 'Idźcie. Dawno nie byłem u spowiedzi. Nie powinienem jej przyjmować'. \n- No... dobrze... i co? \n- Nadal bez skruchy, co? - Śledczy wyglądał na niemal obrzydzonego. - Z przyjemnością zobaczę takie bezbożne ścierwa jak pan zamknięte na baaardzo długo. \n- Bezbożne? Nadal jestem chrześcijaninem. To, jak praktykuję wiarę, jest moją prywatną sprawą. \n- Jest prywatną sprawą, dopóki nie zaczyna pan rozgłaszać antyreligijnej propagandy całemu zgromadzeniu. Nie będę tolerował, że w środku tak świętego miejsca mimochodem umniejsza pan znaczenie regularnej pokuty. \n- Nigdy nie powiedziałem, że to coś dobrego. Nie planowałem nawet, żeby usłyszał mnie ktokolwiek poza rodziną... \n- Jasne. Nawet jeśli, nadal wpaja im pan szkodliwe wartości. Będzie im lepiej bez pana. Jeszcze zrobimy z nich dobrych chrześcijan. A jeśli chodzi o pana, mam zeznanie, którego chciałem. Za chwilę funkcjonariusz odprowadzi pana do celi."
TOR.53.a: "Żeby ogród mógł rozkwitać, niektóre chwasty trzeba po prostu wyrwać."

TOR.54.t: "Sobór toruński"
TOR.54.desc: "Od samego początku najlepszy instynkt pastora Dariusza Kapronia podpowiadał mu, by trzymać się od Rydzyka jak najdalej. Dzięki brakowi istotnych punktów stycznych między oboma Kościołami zielonoświątkowcy i redemptoryści potrafili przeważnie współistnieć w pokoju, poza sporadycznymi drobnymi napięciami. Żadnej komunikacji, żadnej ewangelizacji. Otwarte zaproszenie na niewiążący synod liturgiczny było więc znacznym zaskoczeniem. \n\nPo niewielkim opóźnieniu elita kujawskich organizacji religijnych zajęła miejsca przy specjalnie przygotowanym okrągłym stole. Budynek Akademii, w którym się zebrali, był w dużej mierze niepozorny i celowo utrzymany w staromodnym stylu pomimo hojnego finansowania wszystkich przedsięwzięć Rydzyka. Wśród uczestników dało się wyczuć wyraźne oczekiwanie i ostrożny optymizm na myśl o włączeniu ich do szerszej dyskusji doktrynalnej. Jeszcze przed oficjalnym rozpoczęciem wydarzenia między przedstawicielami wywiązało się wiele mniejszych rozmów, a pastor Kaproń zaczął debatować o szeregu kluczowych kwestii z przywódcą miejscowej delegacji adwentystów dnia siódmego. W tej ogólnej atmosferze teologicznej dysputy większość nie zauważyła nieobecności jednego kluczowego gościa, mianowicie samego Ojca Dyrektora. Kwadrans później do audytorium wtargnął niewielki uzbrojony oddział, a ojciec Klafka dumnie górował nad zaniepokojonymi gośćmi. \n\n- Witam wszystkich. Zostaliście tu zaproszeni, aby dokonać czegoś, co zawsze uznawano za niemożliwe: zakończyć schizmę trawiącą nasze Kościoły; odnaleźć wspólną drogę oddawania czci, jak za czasów Chrystusa. Podczas przygotowań do naszego zgromadzenia konsultowałem się z najznamienitszymi badaczami religii. Z żalem potwierdzili nasze wcześniejsze podejrzenia: różnice w waszej doktrynie mają charakter czysto heretycki. Nie widzę jednak w was fałszywych proroków, gdyż wy także zostaliście jedynie zwiedzeni. \n\nPo tych słowach żołnierze po kolei wręczyli każdemu uczestnikowi mały skrawek papieru. \n\n- Przed wami leży jedyna droga do odkupienia, bracia. Podpiszcie i skąpcie się w świetle Pana, jako w Niebie, tak i na Ziemi. Na tych, którzy służą większej sprawie, czeka wiele przywilejów, a ci, którzy gorliwie nawrócą swoje zbłąkane zgromadzenia, otrzymają sowite nagrody. Niech jednak będzie wiadomo, że ci, którzy nadal będą zwodzić, nie spotkają się z pobłażliwością. Nie dziwcie się, jeśli nieszczęśliwe wypadki zaczną towarzyszyć każdemu waszemu krokowi, taka bowiem jest wola Boża. Teraz zostawię was, abyście dokonali wyboru. \n\nPastor Kaproń wpatrywał się w leżący przed nim dokument. \n\n'Niniejszym przyznaję, że zostałem skażony herezją, i oświadczam, iż wszelkie odstępstwa od doktryny redemptorystów sprzeciwiają się Bożej wizji. Całkowicie poddaję się osądowi Ojca Dyrektora, żałuję za grzechy i błagam go o przebaczenie. Tego samego oczekuję od każdego członka mojego zgromadzenia i ślubuję głosić nauki najlepiej, jak potrafię, aby sprowadzić ich z powrotem ku światłu'. \n\nStarannie rozważył swoje możliwości. Ocenił ogólną atmosferę. Pomodlił się, by Pan mu wybaczył. Z żalem podpisał kartkę."
TOR.54.a: "Czasem właściwa interpretacja potrzebuje tylko lekkiej zachęty."

TOR.55.t: "Pożegnanie zgromadzenia"
TOR.55.desc: "Tadeusz Rydzyk ze wszystkich sił ściskał ambonę i opierał się o nią, by zmusić ciało do pozostania w pionie. Dwaj pomocnicy czekali poza zasięgiem wzroku, gotowi wbiec, gdyby upadł. Serce płonęło mu z nostalgii, gdy wspominał odległą już przeszłość, kiedy jego kazania odbywały się co tydzień... potem co miesiąc... co trzy miesiące... od ponad pół roku nie miał siły powrócić. Nawet przy mikrofonie podkręconym do granic możliwości ledwo przebijał się przez setki zaciekawionych pomruków. Energia dawno zniknęła, podobnie jak charyzma, lecz był zdecydowany należycie pożegnać tych, którzy podążali za nim przez niemal pół wieku. \n\n- Moi drodzy, oczekiwałem tego dnia z najgłębszym niepokojem. Widok was wszystkich tutaj czyni tę decyzję jeszcze trudniejszą. Widzicie, w końcu nadchodzi dzień, w którym człowiek uświadamia sobie, że nadszedł jego czas. I choć próbuje to przed sobą ukryć, narastającego ciężaru wkrótce nie da się już nie zauważyć. Gdybym tylko fizycznie mógł, pozostałbym z wami jeszcze przez kilka dekad, jeśli nie dłużej. Bo ja jestem niczym bez was, a wy jesteście niczym beze mnie. Taki jest jednak Boży plan, że muszę was opuścić w tak trudnej chwili. Nie lękajcie się i ufajcie Jego woli, gdyż wiemy, że leży Mu na sercu wyłącznie dobro naszej wspólnoty. Tych zaś, których wciąż przepełnia niepokój, zapewniam, że dopóki oddycham, pozostanę na waszej służbie. Teraz i na zawsze. Amen. \n\nNiemal bez tchu Rydzyk szybko zakończył swoje ostatnie przemówienie, gdy usłyszał żarliwe Amen tłumu. Z ogromnym trudem wykonał niemal pełny obrót i ruszył w stronę zakrystii, żeby odpocząć. \n\nKobieta z piątego rzędu poderwała się i z zaskakującą zwinnością ruszyła ku kapłanowi, niegotowa pozwolić, by przedmiot jej uwielbienia rozpłynął się w eterze. Szereg ministrantów szybko zastąpił jej drogę, siłą odpychając intruzkę. Jakby pogrążeni w transie, z każdą sekundą coraz liczniejsi ludzie napierali na zaimprowizowany kordon, licząc na osobiste pożegnanie albo ostatnie błogosławieństwo Ojca Dyrektora. Gdy szereg był bliski załamania, pomocnicy chwycili Rydzyka pod ramiona i szybko go wyprowadzili. Rój wiernych pozostał przy pustym ołtarzu."
TOR.55.a: "Jakże przykre ostatnie wspomnienie."

TOR.56.t: "Samotnia"
TOR.56.desc: "Po niemal czterech miesiącach Dawid wreszcie przestał czuć się jak nowicjusz. Przeniesiony z rozpadającego się seminarium we Włocławku, szybko poznał rytm codziennego życia w Kompleksie. Z czasem to, co niegdyś go przytłaczało, stało się rutyną, a on zaczął uważać się za naturalną część duchownej rodziny. Regularne weekendowe wizyty były jedyną nicią łączącą Dawida z dawnym życiem. Zdobycie dokumentów pozwalających opuścić budowlę i ponownie do niej wejść często było uciążliwe, lecz nawet on potrzebował czasem odpocząć od hermetycznej atmosfery Sanktuarium. Kilka dni temu poinformowano go o nadchodzącym okresie odosobnienia. \n\nW krótkim czasie, jaki mu pozostawiono, Dawid starał się upchnąć wszystkie niezbędne przygotowania. Tymczasowo pożegnał się z rodzicami i przeniósł cały pozostały dobytek oraz pieniądze do swojej niezbyt przestronnej izby w kwaterach przeznaczonych dla seminarzystów. Mimo to, stojąc przy głównym i ostatnim wciąż otwartym wejściu do Kompleksu, nie zdołał powstrzymać smutnej łzy, gdy słuchał ojca Laskosza. \n\n- Drodzy bracia, zgromadziliśmy się tutaj przy tej doniosłej okazji, by powitać nowy rozdział w dziejach naszego Kościoła. Ojciec Dyrektor, oby długo cieszył się dobrym zdrowiem, zarządził, że od tej chwili Sanktuarium zamknie swe bramy przed niegodnymi. Zbyt długo Kościół był jedynie atrakcją. Zbyt długo ci, których życie ma niewiele wspólnego z wiarą, bezcześcili swoją obecnością nasze najświętsze miejsca. Radujcie się, gdyż zostaliście wybrani, by służyć w dostatku pośród sprawiedliwych. \n\nEntuzjastyczne, nieplanowane 'Amen!' rozległo się wśród bardziej doświadczonej części zgromadzenia. \n\n- Od tej chwili wszelka komunikacja ze światem zewnętrznym będzie odbywać się oficjalnymi kanałami. Możecie wpisać wszystko, czego potrzebujecie, na listę zamówień. Nie będziemy szczędzić wysiłków, by niczego wam nie zabrakło. Rydzyk dopilnuje, byście żyli jak królowie. Najpierw jednak formalność. Strażnicy, zamknąć bramy! \n\nSłońce świeciło jasno, barwiąc las na zewnątrz przyjemną zielenią. Ptaki ćwierkały cicho, a ich melodię przerwał głośny skrzyp metalowej bramy. Czterech członków ochrony napierało z całych sił, by poruszyć ciężkie wrota, podczas gdy widok zewnętrznego świata powoli się zwężał, aż wreszcie dobrowolne uwięzienie duchowieństwa stało się zupełne. Dawid wypuścił z płuc pełne lęku westchnienie. Nie wiedział, kiedy - ani czy w ogóle - jeszcze kiedykolwiek ujrzy to, co znajduje się za tymi bramami."
TOR.56.a: "Czy mury nie wpuszczają grzeszników, czy raczej nie wypuszczają ich ze środka?"

TOR.57.t: "Nocny spacer"
TOR.57.desc: "Ojciec Rydzyk obudził się w środku nocy, drżąc z zimna. Gardło, obolałe już wieczorem, paliło nieznośnie przy każdym przełknięciu, a gorączka, która męczyła go od kilku dni, znów się nasiliła, każąc mu odczuwać każdą kość, każdą tkankę i każdy mięsień, który ośmielił się choćby poruszyć w ciągu ostatniego tygodnia. Z trudem usiadł na skraju łóżka, zdecydowany przynajmniej napić się wody i zażyć środki przeciwbólowe, by złagodzić część najbardziej nieznośnych objawów. Wstał chwiejnie, podpierając się o ramę. Rozstawiwszy nogi tak szeroko, jak tylko mógł, by zachować choć pozory równowagi, powoli powlókł się przez drzwi do wąskiego korytarza. \n\nPrzestrzeń za drzwiami jego pokoju wydawała się... inna. Obca, jakby natknął się na nią pierwszy raz w życiu. Z każdym krokiem korytarz się wydłużał, zmuszając go do oddalania się coraz bardziej od celu. Wiedział, że idzie prosto, a jednak przejścia wiły się bez końca. I gardło nadal płonęło. Skręcił, potem skręcił ponownie, szedł naprzód, a mimo to wracał w to samo miejsce. Gdyby tylko mógł znów się położyć... ta wyprawa nie była tego warta. Jakoś przespałby noc... \n\nNie wiedział już jednak, gdzie jest. Budynek wydawał się tak dziwnie... znajomy. Wrócił. Wrócił do Olkusza. Do rodzinnego domu. Tak długo go nie widział. Na ganku siedziały dwie postacie, z miłością go przywołując. Minął dom dawnego sąsiada, wciąż zachowany w idealnym stanie. Był już prawie na miejscu... lecz drogę zagrodziła mu ciemna postać. \n\n- Wszystko w porządku, ojcze Rydzyku? Nie powinien ojciec chodzić o tej porze. - zapytał z troską młody duchowny. \n- Kim... jesteś? Dlaczego stajesz mi na drodze, młody człowieku? \n- Ojcze Dyrektorze, jestem Jakub, osobisty asystent ojca. Zaglądam do ojca co kilka godzin. Na pewno ojciec mnie pamięta? \n- Przepraszam, ale nie wiem, o czym mówisz. Możesz mnie przepuścić? Powiedziano mi, żebym nie rozmawiał z obcymi. \n- Hm, naprawdę niedobrze. Ojcze Rydzyku, musi ojciec wrócić do łóżka. Rano będzie lepiej. \n- Ale jestem już prawie w domu. Możesz zabrać mnie do domu? \n- Ja... jasne, proszę tylko podać mi rękę. Ale niech ojciec obieca, że po dotarciu na miejsce trochę pośpi."
TOR.57.a: "Więzy z rzeczywistością załamują się."

TOR.58.t: "Synekura"
TOR.58.desc: "Jan Król pochylił się nad biurkiem, opierając łokcie na niezwykle szczegółowej mapie administracyjnej województwa. Pergamin, zwisający z niemal każdej strony miejsca pracy księdza, przycięto do nieco bardziej poręcznego rozmiaru, tak by przedstawiał wyłącznie najbliższe okolice Kujaw, a odrzucone fragmenty nadal walały się po pokoju. Linie wyrysowane zestawem kolorowych markerów przecinały region, dzieląc go dalej na setki małych skrawków o różnym znaczeniu, z których każdy niósł ze sobą tytuł, wpływy i niezwykłe bogactwo, o ile właściciel zdołał go odpowiednio wykorzystać. Diecezje i podległe im parafie dawały władzę niespotykaną w żadnej innej części kraju. Ten, kto otrzymał swój kawałek, mógł uważać się za wiecznie błogosławionego. Jeden z takich obdarowanych miał właśnie wejść przez drzwi. \n\n- Wołałeś mnie, Janek? - Klafka wszedł kulejąc i z trudem usiadł prosto po drugiej stronie biurka. \n- Tak, napij się. - Nalał sobie i ministrowi po kieliszku wina mszalnego. - Uznałem, że po twoim ostatnim awansie należy nam się mała uroczystość. \n- Jakim awansie? Nie poinformowano mnie o żadnych zmianach w administracji. \n- Nadal dopracowujemy szczegóły. Po prostu nie chciałem cię odsyłać bez należytego pożegnania. Może minąć trochę czasu, nim znów się zobaczymy. \n- Odsyłać mnie? Od ponad dwóch dekad jestem wiernym sługą Ojca Rydzyka! Nie możesz się mnie tak po prostu pozbyć! \n- Jak my wszyscy. Przychodzi jednak czas, gdy najlepsze lata mamy już za sobą, a nasza służba przestaje być potrzebna. \n- Nie masz prawa o tym decydować. Nadal doskonale nadaję się na swoje stanowisko. Poczekaj tylko, aż Rydzyk się o tym dowie! \n- Myślę, że szybko przekonasz się, iż to już nie on rozdaje karty. Teraz odpowiadasz przede mną, więc bądź wdzięczny, że udało mi się zachować dla ciebie wygodne miejsce na emeryturę. \n- Taa. Gdzie? \n- Dekanat rogowski. Przytulny, malowniczy... \n- ...i upchnięty tak daleko od Torunia, jak tylko się da. Naprawdę nie masz wstydu. \n- Tak, z dala od medialnego zgiełku. To oznacza, że nikt nawet nie mrugnie okiem na to, co będziesz robić na swoim terenie. \n- A co z Akademią? \n- Ojciec Cisoń zapewnił mnie, że z szacunku dla twojego ogromnego dorobku pokornie zgodzi się wypełnić wakat. \n- Cisoń... to wszystko było jego pomysłem, prawda? \n- Wolałbym nie ujawniać treści prywatnych ustaleń. \n- Czyli to prawda. Popełniasz straszny błąd, Janek. Zastąpiłeś dobrego, pobożnego człowieka oportunistą pozbawionym zasad. \n- Być może. Nie musisz się już jednak tym martwić. Miłej emerytury. Postaram się czasem odwiedzić."
TOR.58.a: "Zobowiązania wypełniono przed terminem."

TOR.59.t: "Boski pobór"
TOR.59.desc: "Kościół pękał w szwach od setek zgromadzonych wiernych, ławki były wypełnione ramię w ramię, a tłum wylewał się poza wejście. Ojciec Szewczuk wygłaszał kolejne płomienne kazanie o konieczności poświęceń w czasie wojny, być może jeden ze swoich najlepszych popisów oratorskich, lecz nikt nie zwracał uwagi na jego słowa. Oczy zgromadzenia skupiały się zamiast tego na głównym przedmiocie stojącym na ołtarzu - szklanej misie wypełnionej niezliczonymi złożonymi karteczkami. W umysłach przerażonych parafian przemowa księdza ciągnęła się bez końca, gdyż każda sekunda jedynie przedłużała ich niepewność. Obchodziło ich wyłącznie to, czy zostaną wybrani. \n\n- Drodzy bracia, serce rośnie mi na widok was wszystkich zgromadzonych przy tej doniosłej okazji. Niestety tylko nieliczni spośród was dostąpią zaszczytu walki w imię wiary. Nie martwcie się jednak o los naszych czempionów, gdyż Pan prowadzi moją rękę, bym wybrał spośród was najzdatniejszych i najsprawniejszych. Nikomu pod Jego opieką nie stanie się krzywda. \n\nKsiądz zanurzył rękę w misie, efektownie ją zamieszał i wyciągnął z dna jedną kartkę. \n\n- Z woli Bożej wzywam Czesława Koźlaka, by walczył w Jego imię. \n\nPo tłumie rozszedł się zaskoczony pomruk. Odezwał się mężczyzna w średnim wieku. \n\n- Czesiek? Dobija już do sześćdziesiątki. I ma poważne zapalenie stawów. Zupełnie nie nadaje się do walki. \n- Niezbadane są wyroki Pańskie. Nie kwestionujemy Jego osądu. Jeśli uznał tego człowieka za zdatnego do walki, kimże jesteśmy, by twierdzić inaczej? \n\nBardziej pospiesznie wyciągnął kolejną kartkę. \n\n- Z woli Bożej wzywam Katarzynę Herbik, by walczyła w Jego imię. \n- Ojcze, ona dopiero w zeszłym miesiącu miała pierwszą komunię. Nie możecie jej zabrać! - zawołała zaniepokojona matka. \n- Służba nie oznacza wyłącznie walki na froncie. Mogłaby pełnić wiele ról niewymagających udziału w boju. \n- Ona ma tylko osiem lat! \n- To nie moja decyzja, lecz decyzja Najwyższego. On wie coś, czego my nie wiemy. Musimy Mu zaufać. \n\nKsiądz chwycił trzeci los. \n\n- Z woli Bożej wzywam Łucjana Leśniaka, by walczył w Jego imię. \n- To... mój ojciec. Nie żyje od prawie sześciu lat. \n- Czy w tej parafii jest jakiś inny Łucjan Leśniak? - zapytał z irytacją ojciec Szewczuk. Zapadła cisza, a ksiądz wskazał na zgromadzonych. \n\n- Wygląda na to, że Pan zajmuje się dziś innymi sprawami. Pierwszy rząd idzie służyć w wojsku. Reszta będzie musiała poczekać na swoją kolej."
TOR.59.a: "Od tamtej pory nikt nie odważył się usiąść w pierwszym rzędzie."

TOR.60.t: "Nowy cel"
TOR.60.desc: "Poobijany autokar podskoczył i z hukiem opadł na ziemię po najechaniu na kolejną dziurę. Głowa Dominika uderzyła o szybę, wyrywając go z drzemki. Rozejrzał się nerwowo. Widział, że zjechali z zaplanowanej trasy i teraz pędzili nieoznakowaną polną drogą pośrodku niczego. Chłopca nagle ścisnęło w żołądku z niepokoju. Już wyruszyli z opóźnieniem, a przez ten nagły objazd niemal na pewno spóźnią się na mecz. Może gdyby pominęli rozgrzewkę... Ale dokąd jechali? Czy kierowca się zgubił? \n\nMinęło dwadzieścia minut. Droga stawała się coraz węższa, aż wreszcie otworzyła się na dużą leśną polanę. W oddali widział obóz. Z nieco mniejszej odległości regularne salwy strzałów. Dominik drgnął ze strachu. Jeszcze bliżej - krzyki, komendy, ćwiczenia. Kościół szykował się do wojny. Pomimo lichego stanu bazy szkoleniowej chłopiec poczuł pewien podziw. Nie mógł wiedzieć, jak bardzo prowizoryczne było to wszystko. Jeszcze nie. \n\nAutokar zatrzymał się trzydzieści metrów za wjazdem, a bramy natychmiast się za nim zamknęły. Trener drużyny wyprowadził zaniepokojonych chłopców dwójkami na niewielki trawiasty plac. Podszedł do nich kapelan oddziału, trzymając w jednej ręce pokaźny zwitek pieniędzy, a w drugiej zabytkową drewnianą szkatułkę. \n\n- 15... 16... 17. Jednego brakuje. Umawialiśmy się na osiemnastu. \n- Rano zgłosił chorobę. Powiedział, że nie może przyjechać. Opóźnianie wszystkiego byłoby zbyt ryzykowne. - Trener tłumaczył się, obawiając się, że ten problem może udaremnić transakcję. \n- Będę musiał potrącić to z waszej zapłaty. - Ksiądz schował kilka banknotów z powrotem do kieszeni. - Poza tym dobra robota. Oddaliście wierze nieocenioną przysługę. Liczymy na dalszą współpracę w przyszłości. \n\nKapelan otworzył drewnianą szkatułkę i zawiesił na szyi każdego chłopca medalik z wizerunkiem Maryi. Uczynił nad nimi znak krzyża. \n\n- Najświętsza Panienka chroni dusze sprawiedliwych. Dostąpiliście zaszczytu dołączenia do armii Pana. Noście ten medalik przez cały czas, a z ręki grzeszników nigdy nie spotka was krzywda. Ich kule będą was omijać, a te, które trafią, stopią się na waszej skórze. Trwajcie w niewinności, oczyśćcie się ze wszelkiego ziemskiego zła, a zawsze pozostaniecie w Jej łasce. \n\nJeden z chłopców odłączył się od grupy i spróbował uciec z terenu obozu. W połowie drogi do bramy schwytali go strażnicy i przyprowadzili z powrotem. Ksiądz pokręcił głową z dezaprobatą. \n\n- Jakie to żałosne. Taki młody, a już tak skażony zepsuciem Szatana. Nie martw się. Za kilka tygodni usuniemy z twojego serca tę bezbożną zgniliznę. Tymczasem wszystkim nam przyda się trochę dodatkowego treningu strzeleckiego. Niech będzie to dodatkową zachętą do nawrócenia. \n\nSchował do kieszeni kolejne trzy banknoty. \n\n- To jednak wpłynie na zapłatę. Towar uszkodzony. Na pewno rozumiecie. Możecie przeliczyć resztę. Odezwę się, jeśli pojawią się kolejne skargi."
TOR.60.a: "Podobno moralny czyn, a jednak dostawca miał mieszane uczucia."

TOR.61.t: "Drobna zmiana wizerunku"
TOR.61.desc: "Niedziela, 10:48. W kościele św. Andrzeja w Koronowie zaczęło się gromadzić skromne zgromadzenie wiernych pragnących uczestniczyć w cotygodniowej mszy. W zakrystii służba liturgiczna przygotowywała się do wejścia pod nieobecność ojca Zielnego, próbując w pośpiechu zastąpić notorycznie nieobecnego księdza. W oddali zapiszczały opony, gdy nowiutkie porsche wjechało na jedno z miejsc za budynkiem i demonstracyjnie zawyło silnikiem. Z zamontowanych na zamówienie głośników ryknął na cały kościół nieznośnie głośny rap z podbitym basem. Kluczyk się przekręcił, uciszając bezbożną muzykę. Dwie minuty później ojciec Zielny z impetem otworzył drzwi zakrystii. \n\n- Siema. Tęskniliście? Dobra, odwalmy tę mszę. Mam parę miejsc do obskoczenia. \n\nPozostali spojrzeli na księdza ze zdziwieniem. \n\n- Co? Tak mnie witacie po powrocie? - Poprawił swój luksusowy, pokryty złotem zegarek. \n- Wyjechał ojciec bez ostrzeżenia dwa miesiące temu i przez cały ten czas ani razu się z nami nie skontaktował. Myśleliśmy, że coś się ojcu stało. \n- Nie, byłem na Bali. Świetne miejsce. Powinniście kiedyś odwiedzić. \n- Ojcze, ja ledwo zarabiam na czynsz... \n- Ech, szkoda. Próbowałem przynajmniej przywieźć wam prezenty, ale nie pozwolili mi ich przewieźć przez urząd celny. Co za marnotrawstwo. \n- Mhm, możemy się skupić na mszy? Zaczynamy za siedem minut. Czy ojciec w ogóle jest w stanie ją odprawić? \n- Jasne. Nigdy nie czułem się lepiej. Do dzieła. \n- Niech zgadnę, znowu za dużo wina? - zapytał z rozczarowaniem ministrant, gdy nachylił się bliżej księdza. \n- A to moja wina? Próbuję odświeżyć nasz wizerunek, a częścią tego planu jest stworzenie własnego rocznika. Ktoś w końcu musi go degustować. \n- A jak ta zmiana wizerunku ma pomóc kościołowi? \n- Pomyśl tylko o wszystkich zyskach, gdy nasi parafianie zainwestują. Może nawet uda ci się uzbierać na te wakacje, jeśli zapewnisz sobie udziały. \n- A może skupiłby się ojciec na nabożeństwie? \n- Właściwie to na to też mam kilka pomysłów. Zauważyliście kiedyś, jacy wszyscy wychodzą z naszego kościoła ponurzy? Musimy to zmienić. Ludzie lubią patrzeć na ładne rzeczy. Zamówimy nowe dzieła sztuki, rozjaśnimy wnętrze, sprawimy Jezusowi ładniejszy krzyż, trochę rozweselimy jego minę... \n- Jezus umarł na tym krzyżu, ojcze. \n- A teraz może być zrobiony ze złota. Kto nie chciałby na takim umrzeć?"
TOR.61.a: "Skromność prowadzi donikąd."

TOR.62.t: "Dziennikarska rzetelność"
TOR.62.desc: "- Krystyna Dudziak, na żywo dla TV Trwam Nakło. Niedawna budowa luksusowej destylarni na osiedlu 'Polana Notecka' spotkała się z oburzeniem. Przed kościołem św. Stanisława trwają gwałtowne protesty, których uczestnicy domagają się dymisji biskupa nadzorującego inwestycję. Jest ze mną przypadkowy miejscowy parafianin, który zgodził się udzielić komentarza. Proszę pana, co pan sądzi o tej sprawie? \n\n- Niech pani słucha. Nie mam cholernego pojęcia, o co chodzi tym pożal się Boże protestującym. Od ponad dekady zabiegaliśmy o budowę tej destylarni. A teraz, kiedy wreszcie ją mamy, nagle są niezadowoleni. \n- Krytycy podkreślają, że budynek stanął na gęsto zaludnionym terenie i wysiedlono przez to wielu mieszkańców, niemal bez odszkodowań. \n- Gęsto zaludnionym. Jasne. To getto! Zawsze było śmietniskiem, przynajmniej już nie straszy. \n- A co z ludźmi, którzy przez budowę zostali bezdomni niemal z dnia na dzień? \n- No dobrze, i co z tego? Miasto rozpaczliwie potrzebowało nowych inwestycji. To zło konieczne. Ilu ludzi w ogóle to dotknęło? Pięciu? \n- Według szacunków liczby mieszkańców około 450. \n- Ech. Na jedno wychodzi. \n- Co więcej, wiele osób twierdzi, że region potrzebuje rozszerzenia niemal niedostępnych programów pomocy społecznej, a nie fabryki produkującej coś, na co większości mieszkańców nigdy nie będzie stać. \n- Oczywiście, te leniwe nieroby znów chcą jałmużny. Ale jak to mówią: daj człowiekowi rybę, a nakarmisz go tylko na jeden dzień. My... to znaczy, yyy... Kościół daje im zamiast tego nowe miejsca pracy. \n- Obsadzane przez zewnętrznych wykonawców sprowadzanych spoza miasta. \n- Świetnie. To znaczy, że będą musieli się tutaj przeprowadzić. Wzmocnią naszą lokalną siłę roboczą. \n- A czy pan osobiście miał zaszczyt skosztować któregoś z produktów destylarni? \n- Ha, ja? Chciałbym, ale trochę przekracza to mój budżet. \n- W takim razie dlaczego tak stanowczo popierał pan budowę czegoś, z czego ani pan, ani niemal nikt w tej okolicy nie może bezpośrednio skorzystać, zamiast inwestycji, która zapewniłaby społeczności zarówno miejsca pracy, jak i towary w przystępnych cenach? \n- Cóż, chodzi o zrozumienie yyy... czegoś tam z gospodarką... bogactwo będzie skapywać w dół i yyy... Krysia, co to ma być? Miałaś zadawać mi łatwe pytania, a nie mnie przesłuchiwać. \n- Próbuję sprawić, żeby ten wywiad był choć trochę wiarygodny. Przestań narzekać i spróbujmy jeszcze raz, od początku. Aha, i wyprostuj się. Widać ci sutannę."
TOR.62.a: "Niezła próba, ojcze Czerski."

TOR.63.t: "Duchowa przygoda"
TOR.63.desc: "Stara, poobijana honda mknęła pustą DK15, aż zatrzymała się przy szlabanie pięćdziesiąt metrów na północ od granicy województwa. Samotny strażnik siedzący w budce stylizowanej na miniaturową kaplicę podejrzliwie przyglądał się rodzinie w samochodzie. Przyjezdni wciąż należeli do rzadkości. \n\n- Powód wjazdu? - Poderwał się, gdy tylko opuścili szyby. \n- Jedziemy na pielgrzymkę. \n- Zezwolenie? \n- Jakie... zezwolenie? Powiedziano nam, że żadnego nie potrzebujemy. \n- Zezwolenia pielgrzymkowe dla osób indywidualnych wydają w miejscu wyjazdu władze parafialne. Tylko wizyty grupowe nie wymagają konkretnych dokumentów, ale trzeba się wcześniej zarejestrować. Za trzy dni jedna grupa wyrusza z Ostródy. Możecie zacząć tam. \n- Ale ulotka obiecywała... - Oliwia wyciągnęła rękę, podsuwając strażnikowi kartkę pod nos. \n- Ulotka... och, przyjechaliście w ramach oferty 'Kujawy - kraina duchowej przygody'. - Jego ton natychmiast stał się weselszy. \n- Czyli... nie potrzebujemy zezwolenia? \n- Nie, nie, oczywiście, że nie, przyjaciele. W 'Kujawach - krainie duchowej przygody' każdy jest mile widziany. Najpierw jednak opowiem wam, co mamy do zaoferowania! \n- Chyba sami zorientujemy się po drodze... \n- Och, ale wtedy pewnie ominą was niektóre z naszych najlepszych atrakcji. Najpierw będziecie potrzebować tej mapy. Nie chcielibyście przecież zgubić się w 'Kujawach - krainie duchowej przygody'! Zaznaczono na niej wszystkie najważniejsze miejsca. Wiedzieliście, że Muzeum Popiełuszki zostało niedawno rozbudowane o dwa nowe piętra, interaktywnego animatronika pozwalającego porozmawiać z męczennikiem, a nawet pobliski edukacyjny park rozrywki? W każdy wtorek odbywa się też pełna inscenizacja drogi krzyżowej, w której największy darczyńca może zagrać Jezusa. Nie możecie tego przegapić. I oczywiście musicie zobaczyć nowy Ziggurat Maryi. Na Kuja... \n- Dlaczego ciągle powtarza pan tę całą nazwę? \n- Jaką nazwę? Ma pani na myśli 'Kujawy - krainę duchowej przygody'? \n- Mhm. \n- Płacą mi za każdym razem, gdy ją wypowiadam. Nadal nie mamy zbyt wielu gości, więc w tej chwili w zasadzie fundujecie mi pensję. \n- No dobrze, świetnie. Cieszę się, że mogłam pomóc, ale możemy już jechać? \n- Podniosę szlaban, ale proszę jeszcze nie odjeżdżać! Na pewno nie wiedzieliście, że 'Kujawy - kraina duchowej przygody' mają oficjalną maskotkę! Zaczekajcie tylko sekundkę. Wezmę kostium i zaśpiewam wam nasz hymn. Pokochacie go."
TOR.63.a: "Jezus Chrystus Superstar!"

TOR.64.t: "Odrobina gościnności"
TOR.64.desc: "Siostra Dorota sprawdziła notatkę sporządzoną przed wyjazdem, porównując ją z nazwami ulic i numerami budynków. Chełmińska 73. Budynek pod tym adresem ledwo przypominał klasztor, w którym mieszkała tyle lat temu, trzymając się dawnego dziedzictwa jedynie fragmentem nazwy. Historyczną fasadę przebudowano według wymyślnych, modernistycznych wytycznych, a przy wejściu gości witał przesadnie jaskrawy, rażący w oczy neon. Jeszcze raz sprawdziła, czy na pewno trafiła pod właściwy adres. \n\n'Klasztor i Dom Gościnny Sióstr św. Elżbiety' \n\nZ obawą weszła do środka, jednocześnie podziwiając skomercjalizowane wnętrze i krzywiąc się na jego widok. Gdy zobaczyła najświętszy dla siebie symbol sprowadzony do roli dekoracji, cicho pokręciła głową z dezaprobatą. Podeszła do recepcji i zadzwoniła stojącym na ladzie dzwonkiem, dając znać o swojej obecności. Siostry na zapleczu ucieszyły się ogromnie na widok jednej ze swoich. \n\n- Witamy, siostro. Mam nadzieję, że podróż minęła bezpiecznie. \n- W większości. Zatrzymali mnie na kilka godzin na granicy, ale poza tym droga była zaskakująco spokojna. \n- Bardzo mi przykro, że sprawili siostrze trudności. Wygląda na to, że w dzisiejszych czasach nawet niezakłócony spokój pielgrzymów to zbyt wiele, by o niego prosić. \n- Wcale mnie to nie dziwi. Przybyłam z Płońska. Wygląda na to, że nasze regiony szykują się do wojny. Nieplanowany postój i strażnicy grzebiący w moich rzeczach to chyba i tak stosunkowo dobry scenariusz. \n- Mimo wszystko będę się modliła o powodzenie w drodze powrotnej. Na razie jednak siostra powinna odpocząć. Czy życzy sobie siostra pakiet Biskup, Kardynał czy Ojciec Dyrektor? \n- Wystarczy cokolwiek z łóżkiem. Kręgosłup nie pozwala mi już spać na podłodze, ale jeśli dostanę materac, może mi siostra dać klucz, a sama sobie poradzę. \n- Przepraszam, siostro, ale system nie pozwala mi tego wprowadzić. \n- Dobrze, proszę mi więc dać najtańszą opcję. \n- Doskonale! Będzie to pakiet Biskup - królewskie łoże, nieograniczony dostęp do naszego spa i wybór à la carte najlepszych dań siostry Anastazji. \n- TO jest wasza najtańsza opcja? \n- Tak, wiem, że to niewiele, ale za jedyne dodatkowe dwieście złotych za noc dołączę naszą luksusową usługę konsjerża. \n- Nadal doskonale potrafię sama poruszać się po mieście. Nie potrzebuję kogoś, kto zrobi wszystko za mnie. \n- Dobrze, w takim razie siostra Wiesława zaniesie bagaże do pokoju. W razie dalszych pytań proszę śmiało pytać. \n- Mam tylko jedno: gdzie jest wasza kaplica? Muszę pomodlić się o duchowe dobro tego przybytku. I wasze, siostry. \n- Och, yyy... nie mamy kaplicy. Musiałyśmy ją usunąć podczas remontu, żeby zrobić miejsce na saunę. Ale za jedyne dodatkowe trzysta złotych za noc mogę wysłać kogoś, kto pomodli się w siostry imieniu..."
TOR.64.a: "Handel naprawdę jest śmiercią wiary."

TOR.65.t: "Starszy nad szeptaczami"
TOR.65.desc: "Para młodych wikarych spacerowała po jednym z licznych ogrodów Kompleksu. Marmurowe posągi i wymyślne labirynty z żywopłotu, które niegdyś skłaniały ich do zatrzymania się i podziwiania panującego tu spokoju, dawno stały się zwyczajnym, opatrzonym widokiem, lecz liczne puste ścieżki nadal stanowiły bezpieczne miejsce do zwierzeń. Obaj spoglądali na siebie podejrzliwie i ostrożnie stawiali kroki, jakby sprawdzali wzajemną lojalność za pomocą jakiegoś zawiłego szyfru. Uznawszy towarzysza za wystarczająco godnego zaufania, jeden z wikarych przerwał milczenie. \n\n- Tutaj powinniśmy być bezpieczni. Nikt nie przychodzi o tej porze. Są jakieś wieści? \n\nLiście zaszeleściły, gdy wiatr nagle zamarł. Parę przeszył chłód. Choć okolica wyglądała na pustą, czuli wokół siebie dziesiątki uszu wsłuchujących się w każde słowo. \n\n- Karol, w Kompleksie nie istnieje coś takiego jak bezpieczne miejsce. Zawsze ktoś słucha. \n- Rozumiem, że zależy ci na tajemnicy, ale nie sądzisz, że robisz się trochę... paranoiczny? Na pewno mają ważniejsze problemy niż podsłuchiwanie naszych rozmów. \n- Chodź, przejdziemy się kawałek. Widzisz tę zakonnicę modlącą się przy żywopłocie? Gdy podejdziesz dostatecznie blisko, usłyszysz, że tylko udaje. Pracuje dla Ojca Rydzyka. \n- Wszyscy pracujemy dla Ojca Rydzyka. \n- Uch, tak, wszyscy, ale chodzi mi o to, że... szpieguje dla niego. Pilnuje, żeby nikt nie bluźnił, nie wychodził przed szereg... w zasadzie nie mówił nic złego o Ojcu Dyrektorze. A ten ogrodnik pracujący od dwóch godzin nad tą samą grządką jest na liście płac Króla. Teraz rozumiesz jak to działa? \n- Mhm. \n- Dobrze. Teraz spójrz na tych dwóch ministrantów puszczających kaczki na stawie. Jak myślisz, dla kogo pracują? \n- Nie wiem, dla Rydzyka? Laskosza? \n- Są moi. Nie myśl, że zdobyłbym wszystkie te informacje bez paru dodatkowych źródeł. Zdziwiłbyś się, ile potrafią podsłuchać. \n- Jak w ogóle cię na to stać? \n- Cóż, pochłaniają sporą część mojego stypendium. Te małe dranie doskonale znają swoją wartość. Na szczęście ci właściwie sami na siebie zarabiają. Są dostatecznie zwinni, by poruszać się po niektórych podziemnych przejściach. Mogą przenosić zaopatrzenie do Kompleksu i na zewnątrz. To całkiem dochodowy interes. Zaskakująco niewykorzystany. \n- Chwileczkę... na zewnątrz? Od tygodni próbuję wysłać wiadomość. Myślisz, że mogliby dostarczyć ją komuś w mieście? \n- Prywatną? \n- Do rodziny. Na pewno się martwią. \n- Przykro mi, przyjacielu, ale nie mogę ci pomóc. To linia wyłącznie handlowa. Bez wyjątków."
TOR.65.a: "Ptaszki wyćwierkują swoje intrygi."

TOR.66.t: "Boska interwencja"
TOR.66.desc: "- ...a tam, ojcze, jest moje pole pszenicy. Widzi ojciec, jakie suche są źdźbła. W takim tempie w przyszłym sezonie nie będzie żadnych plonów. \n- Mhm. Prawdziwa tragedia... - Ojciec Cisoń próbował udawać, że obchodzi go melodramatyczne biadolenie rolnika. \n- Właśnie. Ale nie chodzi tylko o nas. Damy sobie radę. Bez naszych zbiorów pojawią się jednak problemy w całym łańcuchu dostaw, aż po Toruń. \n- Mamy własne zapasy. \n- Nie tak wielkie. Jeśli coś się nie zmieni, konsekwencje będą długotrwałe. \n- A jesteś dobrym chrześcijaninem, prawda? \n- Staram się żyć zgodnie z przykazaniami, ojcze. \n- W takim razie módl się, synu, a ja również będę modlił się w twoim imieniu. W samotności. Gdzieś z boku. Mam jednak nadzieję, że dopóki modlisz się w imię Maryi, cuda mogą się zdarzać. \n\nZostawiwszy rolnika przy modlitwie, ksiądz odszedł i ukrył się za stodołą. Wyjął telefon i wyjrzał zza rogu, aby upewnić się, że mężczyzna za nim nie poszedł. Wybrał numer z listy kontaktów. \n\n- Elektrownia Wodna Włocławek. W czym mogę dziś pomóc, ojcze Cisoń? \n- Niech cię Bóg błogosławi, moje dziecko. Na pewno wiesz o suszy, prawda? Jak wygląda u was poziom wody? \n- Wciąż stabilny. Na razie wszystko jest w porządku. \n- Dobrze. Musisz spuścić trochę wody w dół rzeki, żeby złagodzić sytuację. \n- W porządku. Ile ojciec potrzebuje? \n- Dajcie mi wszystko, co macie. Warunki wyglądają na dość poważne. \n\nPo dwudziestu minutach ksiądz usłyszał radosne krzyki dochodzące zza budynku. \n\n- Ojcze! Ojcze Cisoń. Niech ojciec szybko tu przyjdzie! To cud! Rzeka znów płynie! \n- Widzisz, moje dziecko, Bóg zawsze odpowiada na modlitwy tych, którzy są w prawdziwej potrzebie. \n- Czuję Jego błogosławieństwo, ojcze. I jest tyle wody! Więcej, niż kiedykolwiek mógłbym potrzebować. Może... nawet za dużo. Tak, zdecydowanie za dużo. Właściwie robi się źle... \n- Chwileczkę, muszę... znów porozmawiać z Bogiem... - Szybko pobiegł w kolejne niewidoczne miejsce i wykonał drugi telefon. \n\n- Elektrownia Wodna Włocławek. Czy wszystko w porządku, ojcze Cisoń? \n- Szczęść Boże. Da się trochę ograniczyć strumień? W tym tempie zaraz dojdzie do powodzi. \n- Przepraszam, ale panel sterowania jest zepsuty. W tej chwili możemy jedynie całkowicie otworzyć albo zamknąć przepływ. \n- No to zamknijcie. \n- Dobrze, ale proszę pamiętać, że minie trochę czasu, nim zobaczy ojciec efekty. I lepiej niech ojciec uważa. Główna fala zmierza w waszą stronę. \n- Ile właściwie wypuściliście wody? \n- Yyy... całą. Tak jak ojciec prosił..."
TOR.66.a: "Nawet przy modlitwie zawsze uważaj, czego sobie życzysz."

TOR.67.t: "Melodie przemian"
TOR.67.desc: "Agata weszła do kościoła i usiadła w swojej ulubionej ławce dokładnie piętnaście minut przed rozpoczęciem mszy. Nie nosiła zegarka, lecz po ponad sześćdziesięciu latach cotygodniowej obecności potrafiła wyliczyć swoje przybycie co do sekundy. Krótki, znajomy spacer do świątyni był jej ulubionym rytuałem - najważniejszym punktem równie spokojnego i pogodnego życia. \n\nW ciągu kilku następnych minut budynek wypełnił się znajomymi twarzami, z których część należała do zgromadzenia niemal równie długo jak ona. Pocieszało ją, że nawet gdy wszystko dookoła się zmieniało, a świat pędził naprzód, pewne rzeczy zawsze opierały się wichrom przemian. Organista grał tę samą melodię na rozgrzewkę, sędziwy ojciec Stefańczuk witał wszystkich tą samą modlitwą, a zwykli winowajcy ustawiali się do konfesjonału. I jeśli dobrze obliczyła, liturgia miała się rozpocząć za 3... 2... 1... \n\n- Drodzy parafianie, dzisiaj spróbujemy czegoś... innego niż zwykle. Czegoś z odrobiną większej energii. Michał, przynieś mi gitarę! \n\nAgata burknęła i wymieniła pełne dezaprobaty spojrzenia z pozostałymi parafianami. Tymczasem chłopiec wrócił biegiem z zakrystii, niosąc instrument. Ksiądz niezgrabnie przy nim majstrował, wyraźnie bez wprawy, sprawdzając każdą strunę. \n\n- Powstańcie ze mną. Powstańcie dla Pana! On jest tu z nami. Czujecie Jego obecność, bracia i siostry!? Woła do nas, a my odpowiadamy! Zaśpiewajmy! \n\nZ głośnika ustawionego na ołtarzu popłynęła muzyka. Mimo kiepskiej jakości nagrania ksiądz wolał, żeby wykonało ono całą pracę, i tylko udawał grę na gitarze, trzymając dłoń w bezpiecznej odległości od strun. \n\n- Unieście ręce, bracia i siostry! Niech usłyszy wasze oddanie. Chwalcie Go pieśnią! \n\n'Pan kiedyś stanął nad brzegiem' \n\n- Dobrze, dobrze. Ale wiem, że potraficie lepiej! \n\n'Szukał ludzi gotowych pójść za Nim' \n\n- Im głośniej śpiewacie, tym większe wasze zbawienie! \n\n'By łowić serca' \n\n- Wszyscy razem! - Wskazał na wahające się rzędy, zmuszając Agatę do udawania przez rytmiczne otwieranie i zamykanie ust w takt słów. \n\n'Słów Bożych prawdą'. \n\n- A teraz wszyscy razem!"
TOR.67.a: "'OOOO PAAAAAAANIE!!!!'"

TOR.68.t: "Granice oddania"
TOR.68.desc: "Siódmy dzień Zgromadzenia Żałobnego. Wbrew nadziejom duchowieństwa tłum żałobników zebranych przed Kompleksem wciąż rośnie. Wzmocniona ochrona wszystkich wejść zdołała zapobiec wtargnięciu, lecz z każdą godziną coraz trudniej zapanować nad tłumem. W środku Rydzyk śpi spokojnie i bez przeszkód. Ksiądz siedzący na strategicznie ustawionej wieży obserwacyjnej odkłada lornetkę, szkicuje w notatniku najnowszy raport sytuacyjny i schodzi na modlitwę dokładnie w porę, by uniknąć rzuconej w niego świecy wotywnej. Impas trwa. \n\nJanina stała z tyłu tłumu, gdyż przybyła dopiero trzeciego dnia zgromadzenia. Nawet tutaj ziemia była już doszczętnie zadeptana, a dawna łąka zamieniła się w jedno wielkie bajoro. Z trudem podnosiła nogi dostatecznie wysoko, by iść wzdłuż obrzeża bez utknięcia w grzęzawisku, kurczowo trzymając laskę, aby nie stracić równowagi. Drogę rozświetlały tysiące świec wyznaczających każdą ścieżkę. \n\nPodczas krótkiego spaceru Janina minęła dziesiątki stoisk rozdających święte obrazki i poświęcone maści, kręgi modlitewne oraz prowizoryczne kapliczki. W wolnej dłoni ściskała hojną ofiarę. Przepchnęła się przez tłum i złożyła ją u stóp odzianego w łachmany kaznodziei. \n\nNikt nie spodziewał się, że Mikołaj osiągnie w życiu wiele. Niewydarzony syn stosunkowo dobrze sytuowanego miejscowego przedsiębiorcy zawsze miał miękkie lądowania po swoich regularnych kłopotach. Żył jak gwiazda, choć nie dokonał niczego, co choćby w najmniejszym stopniu by to uzasadniało. Szybkie samochody, alkohol i narkotyki napędzały jego nieustanny upadek. A gdy sięgnął dna, doznał oświecenia. Nadal odziany w te same podarte ubrania, które miał na sobie w dniu, gdy rzekomo objawił mu się ojciec Rydzyk, głosił słowo w imieniu domniemanego zbawcy. Po raz pierwszy ktoś go słuchał. \n\n- I mówię wam, bracia, że duch Ojca Dyrektora nadal jest wśród nas. Nie opłakujcie jego śmierci! Świętujcie jego powrót, gdyż jest bliski! Spójrzcie na tę jaskinię grzechu przed nami! Księża, ta moralnie zepsuta kasta, rozpaczliwie próbują zniweczyć dzieło ojca Rydzyka. Są sprzymierzeńcami Szatana, usiłującymi zepchnąć świat ku degeneracji. Przygotujcie się, bracia, gdyż za kilka dni ruszymy szturmem na siedlisko grzeszników i raz na zawsze położymy kres ich intrygom. Dopiero wtedy ojciec Rydzyk powróci z niebios i zapoczątkuje nową epokę pokoju i wiary! I zasiądzie po prawicy Pana..."
TOR.68.a: "W ciszy budzą się urojenia."

TOR.69.t: "Nigdy nie spotykaj swoich bohaterów"
TOR.69.desc: "Ojciec Cisoń podejrzliwie przyglądał się grupie. Zbieranina pobożnych starców, nieusankcjonowanych i prawdopodobnie obłąkanych przywódców religijnych oraz przypadkowych osób dobranych tak, by nadać wydarzeniu aurę większej wiarygodności, była pierwszą od wielu miesięcy grupą ludzi z zewnątrz wpuszczoną do Kompleksu. Gdyby to od niego zależało, nigdy nie zbliżyliby się do Rydzyka na mniej niż sto metrów, ale najwyraźniej sytuacja stała się na tyle rozpaczliwa, że wszelkie pogłoski o jego śmierci trzeba było za wszelką cenę zdementować. \n\n- Ufam, że wszyscy zapoznaliście się z listą warunków dzisiejszego spotkania. Zanim wejdziecie, muszę przypomnieć, że wszelkie rozmowy z Ojcem Dyrektorem są surowo zabronione. Macie tylko patrzeć i słuchać. Po zakończeniu audiencji natychmiast opowiecie pozostałym, co widzieliście. Zrozumiano? \n- Mogę go przynajmniej zapytać o jego oświecenie? \n- Nie. Dzisiaj nie będzie żadnego oświecania. Jeśli odezwiesz się choć słowem, osobiście cię wyprowadzę. \n- A poprosić o błogosławieństwo? \n- Powtórzę, bo najwyraźniej muszę to sprecyzować: potrafisz poprosić o błogosławieństwo, nie wydając ani jednego dźwięku? \n- Nie bardzo... \n- Właśnie. Więc po prostu milcz i uważaj się za szczęściarza, że w ogóle pozwolono ci go zobaczyć. \n\nSzli korytarzami, aż w końcu dotarli do niepozornych drewnianych drzwi. Ojciec Cisoń zatrzymał się i zebrał w sobie, po raz ostatni spoglądając na prowadzonych ludzi. \n\n- Pochylcie głowy i ukłońcie się, gdyż za chwilę ujrzycie prawdziwą świętość. \n\nOjciec Cisoń otworzył drzwi, a odór rozkładu uderzył grupę prosto w twarz. On sam wydawał się do niego przyzwyczajony i bez niepokoju ruszył w stronę łóżka. Rydzyk, wyczuwając ich obecność, otworzył oczy. W jego głosie słychać było wyraźny wysiłek, a jednak wydawał rozkazy z pełnym autorytetem. \n\n- Kuba! Gdzieś ty, do cholery, był!? Przynieś mi więcej wina, kurwa mać! Proszę o nie od wielu godzin! \n\nRozejrzał się po pokoju zdezorientowany. \n\n- Chwileczkę, ty nie jesteś Kuba. Benedykt, imbecylu! Kim są ci ludzie!? Wyraźnie prosiłem, żeby mi nie przeszkadzać! \n- Ojcze Rydzyku, proszę, objaw mi tajemnice niebios! - Ognisty kaznodzieja niemal błagał duchowego idola o radę. \n- Czy nie wyraziłem się jasno!? Powiedziałem: WYNOCHA!!"
TOR.69.a: "Przynajmniej wiedzą, że żyje..."

TOR.70.t: "Zbezczeszczenie pamięci"
TOR.70.desc: "Jan Król z rosnącą niepewnością oglądał transmisję z zewnątrz. Nawet po wielu tygodniach zgromadzenie poświęcone Ojcu Dyrektorowi nie chciało się rozejść. Choć minęło już tak wiele czasu, czuł się jak więzień uwięziony w Kompleksie i ukrywający się ze strachu przed własnym ludem. Od początku blokady dostawy stały się zbyt ryzykowne, by je kontynuować, i choć na razie zdołał ukryć ten fakt przed szeregowymi duchownymi, zapasy szybko się kończyły. Słowa Rydzyka były jednak jasne. Nikt poza nim nie mógł wydać rozkazu ponownego otwarcia bram, a teraz, w stanie majaczenia, coraz mniej prawdopodobne było, że w ogóle rozważy taką decyzję... sprzeciwienie się jego woli stanowiłoby jednak świętokradztwo. \n\nPomocnik - jeden z młodych seminarzystów wyznaczonych do spełniania każdej zachcianki Ojca Dyrektora - wszedł, wyraźnie drżąc. Po policzkach płynęły mu łzy. \n\n- Ojcze Królu, stało się. Jest już w Niebie... \n- Naresz... to znaczy... przepełnia mnie smutek. Świat stracił dziś świętego. Niech kontynuuje swoje większe dzieło u boku Boga. \n\nZ zaskakującą jak na swój wiek żywotnością ksiądz popędził do komnat mentora. Rój pomocników czuwał nad ciałem, tworząc ciasny półokrąg, przez który Król musiał się przepchnąć. Zwłoki były jeszcze ciepłe, ale nie wykazywały oznak życia. Poprowadził grupę w ostatniej modlitwie nad zmarłym, a gdy tylko skończyli, natychmiast wrócił do spraw praktycznych. \n\n- Czas zgonu? - zapytał Król, chcąc upewnić się nie tylko co do klinicznej, lecz także administracyjnej śmierci swojego wieloletniego partnera. \n- 16:04. Dwadzieścia trzy minuty temu. \n- Doprawdy tragedia. Musimy jednak pozostać silni i pomimo żałoby nadal podtrzymywać jego wizję. \n- Pokornie oddajemy się na ojca służbę. - Ojciec Laskosz przypieczętował wcześniej uzgodnioną sukcesję. \n- Jestem wdzięczny za waszą lojalność wobec sprawy. Andrzej, otwórz bramy. Dość już siedzieliśmy tu zabarykadowani. \n- Nie uważa ojciec, że to trochę... za wcześnie? Ludzie potrzebują czasu na żałobę. MY potrzebujemy czasu na żałobę. Kto wie, jak zareagują, gdy rozejdzie się wiadomość? Możemy stracić wszelkie pozory kontroli. \n- Być może nie zauważyłeś, ale wiadomość już się rozeszła. Im dłużej czekamy, tym gorzej będzie. Nie wiem, na co czekasz. Rydzyk nie stanie się bardziej martwy, niż już jest. \n- Janek, nie możemy tak po prostu... \n- Od teraz to Ojciec Dyrektor Król. Radzę zacząć przyzwyczajać się do tego tytułu."
TOR.70.a: "Umarł prorok, niech żyje Król."

TOR.71.t: "Punkt zwrotny"
TOR.71.desc: "Sławomir siedział samotnie w gabinecie, czując, że lata upokorzeń wreszcie zbliżają się do końca. Pragnął odzyskać swoje wpływy - żelazny uścisk Ojca Dyrektora słabł; w końcu nadeszła jego chwila sprawiedliwości. Religijni fanatycy odebrali mu wszystko: dumę, władzę i miłość ludu. Gdy Rydzyk zniszczył jego reputację, pozostało mu jedynie wygnanie we własnej kancelarii. Przez lata opór wydawał się daremny, jakby reżim Rydzyka miał trwać wiecznie. Gniew Sławomira jednak nie wygasł. Być może stałoby się inaczej, gdyby nie jedno: Ojciec Dyrektor nie był niezwyciężony. Dopadła go starość. Patrole stały się rzadsze i mniej czujne. Nawet wszechwidzące Radio Maryja wykazywało oznaki rozkładu. Pojawiły się pęknięcia, a ludzie zaczęli dostrzegać prawdę: w tym kleptokratycznym imperium nie było nic świętego. \n\nSławomir Mentzen zapalił cygaro, a dym wił się ku górze niczym płomień jego ambicji, gorętszy niż kiedykolwiek. Jego misja była jasna: rozmontować skorumpowany reżim i przywrócić ludowi godność oraz wolność. Przez lata zbudował rozległą sieć. Szpiedzy dostarczali mu informacji z każdego zakątka, a nawet kilku rozczarowanych księży, którzy nie potrafili już znieść zdrady własnej wiary, przysięgło wierność jego sprawie. Poparcie rosło po cichu, ale nieustannie. Ludzie byli gotowi, gotowi powstać, gdy nadejdzie czas. Każdego dnia szala przechylała się coraz bardziej na jego stronę. Droga do zwycięstwa, niegdyś niewyobrażalna, znajdowała się teraz w zasięgu ręki. \n\nNie czuł jednak radości. Pod powierzchnią rosnącego rozpędu i poparcia ciążyła mu ponura pewność: ludzie zginą, i to wielu. Patrzyli na niego jak na alternatywę, symbol przemian, lecz nie wiedział, czy jest gotowy. Ciężar przewodzenia narodowi mógł przerosnąć jego siły. Co, jeśli bunt poniesie klęskę? Co, jeśli wszystkie ofiary pójdą na marne? Wątpliwości go gryzły. Przyszłość była labiryntem niewiadomych, pełnym niepewnych ścieżek i ukrytych zagrożeń. A jednak musiał wybrać. Z którym wyborem zdołałby żyć? \n\nMentzen wstał z krzesła i powoli podszedł do okna. Ciemność nocy pochłaniała ulicę Grudziądzką, a blady blask księżyca dotykał jedynie jej skrawków. Patrzył na milczący Toruń, wiedząc, że miasto nie będzie milczeć długo. Historia nigdy nie pytała o pozwolenie - żądała wyborów, poświęceń i krwi. To, czy był gotowy, nie miało już znaczenia. Koło historii poszło w ruch, a świt nadejdzie z nim lub bez niego. Z równym oddechem zasunął zasłonę, odwrócił się ku drzwiom i wkroczył w cienie, w których pisano historię."
TOR.71.a: "Cichy gest ku wolności."

TOR.72.t: "Duchy przeszłości"
TOR.72.desc: "Powolna wspinaczka Andrzeja po schodach trwała dłużej niż zwykle. Każdy krok ciążył bardziej od poprzedniego. Był wyczerpany nie tylko minionym dniem, lecz całym życiem służby, która odbierała mu siły kawałek po kawałku. Po dekadach niestrudzonej pracy starość wreszcie go dopadła, osiadając w kościach wraz z żalem. Andrzej Sławiński był osobistym sługą Rydzyka i zaczął dla niego pracować na długo przed Upadkiem. Lojalny i dyskretny, za zamkniętymi drzwiami widział, jak wychodzą na jaw niezliczone tajemnice. Nigdy nie narzekał ani się nie wahał; po prostu wykonywał rozkazy. A teraz, po tym wszystkim, odrzucono go jak zużyte narzędzie. Bez emerytury. Bez odprawy. Z niczym poza ciszą i gorzkim smakiem zdrady. \n\nPozostało mu jedynie rozpadające się mieszkanie w dzielnicy Koszary, miejscu pełnym przestępczości jeszcze przed upadkiem Polski. Gdy dotarł na ostatni stopień, zalały go wspomnienia. Przypomniał sobie początki, kiedy Rydzyk pierwszy raz wkroczył do życia publicznego. Tadeusz wydawał się wówczas mądry i pokorny, ale iluzja szybko prysła. Był po prostu kolejnym człowiekiem pochłoniętym przez chciwość, niczym nie różniącym się od reszty. Sławiński z cichą goryczą patrzył, jak oddani wierni przywożą towary do Torunia, napędzając wielką machinę prywatnego imperium Rydzyka, tylko po to, by pozostać na zewnątrz siedziby Radia Maryja, przemoknięci w zimnym deszczu, bez choćby zaproponowanej filiżanki herbaty. \n\nPowinien był odejść wiele lat temu, lecz powstrzymał go strach. Strach przed zaczynaniem od nowa, przed wkroczeniem w nieznane. Andrzej często czuł, jakby sprzedał duszę, stając się trybikiem tej samej machiny, która sprowadziła nieszczęście na tyle istnień. Najcięższe były lata po Upadku. Zwykli ludzie walczyli o przetrwanie, podczas gdy duchowieństwo pławiło się w dekadencji. Rydzyk trzy razy w tygodniu jadał kawior, a na jego talerzu królował stek wagyu i szampan Dom Pérignon, obojętny na głód panujący tuż za bramami. \n\nAndrzej już dawno osiągnął granicę wytrzymałości. Wtedy zaczął prowadzić dziennik, zapis zbrodni popełnionych przez Tadeusza Rydzyka. Strona po stronie dokumentował korupcję, hipokryzję i życia niszczone za zamkniętymi drzwiami. W tajemnicy nawiązał kontakt ze sprzymierzeńcami Sławomira Mentzena, zdecydowany obnażyć kłamstwa i oszustwa Ojca Dyrektora. Jutro miał przekazać im rękopis. A teraz, odrzucony jak odpad, odnalazł doskonałe zakończenie swojej opowieści. Gdy tylko wszedł do mieszkania, zaczął pisać. \n\n'Zmarnowałem całe życie, służąc człowiekowi, który głosił zbawienie, a zarazem budował imperium na plecach złamanych ludzi. Wmawiałem sobie, że jestem tylko sługą. Że nie mam wyboru. W głębi duszy znałem jednak prawdę - widziałem okrucieństwo, chciwość i zgniliznę pod szatami. I zostałem. Zostałem, bo się bałem. Zmiany. Samotności. Tego, kim mógłbym się stać bez celu. Teraz żyję wśród duchów. Twarzy tych, których odprawiliśmy. Dłoni, które oddawały ostatnie monety, podczas gdy my ucztowaliśmy jak królowie. Ich milczenie krzyczy głośniej niż jakakolwiek modlitwa, którą kiedykolwiek słyszałem. Nie mogę prosić o przebaczenie. Mam tylko nadzieję, że te słowa wystarczą, by coś zmienić'. \n\nGdy miał już zamknąć dziennik, przyszły mu do głowy ostatnie słowa. \n\n'Panie Mentzen, proszę obalić tego skurwysyna'."
TOR.72.a: "'Z poważaniem, Andrzej Słowiński'"

TOR.73.t: "Wyjątkowy dzień z Mentzenem"
TOR.73.desc: "Szary mercedes spokojnie zatrzymał się na opustoszałym parkingu pośród niszczejących komunalnych bloków. Sławomir Mentzen wraz z kamerzystą przygotowywali się do nagrania nowego odcinka 'Dnia z Mentzenem'. Przewodniczący 'Nowej Nadziei' po wyjściu z samochodu poprawił swój jak zawsze nienaganny garnitur, podczas gdy kamerzysta przygotował nagranie i gestami zaczął odliczać na palcach. \n\n- Dzień dobry, witam państwa w kolejnym 'Dniu z Mentzenem'. Dzisiejszy odcinek będzie zupełnie inny niż zwykle. - Serdecznie powitał widzów. - Zamiast przedstawiać moją codzienną pracę w polityce regionu i wokół niej, ujawnię prawdę o tym, jak ciężko pracujący i wierzący ludzie są traktowani pod chciwymi rządami toruńskiego duchowieństwa. \n\nPo pierwszym cięciu Mentzen idzie przez opustoszały parking, na którym tylko jego samochód znajduje się w stanie lepszym niż złom. \n\n- Przybyłem do miejsca, w którym spędziłem dzieciństwo. Boli mnie widok tego, w jakim jest stanie. Jeszcze kilka lat temu była to kwitnąca, zamożna społeczność; na tym parkingu nie dało się znaleźć wolnego miejsca, a dziś? Ludzi nie stać nawet na rower, nie mówiąc już o samochodzie. \n\nW następnej scenie przechodzi przez wyłamane drzwi do wnętrza kamienicy. Korytarz w całości zasypują sterty śmieci, a wiele drzwi zabito deskami. \n\n- Gdy byliśmy dziećmi, mieszkał w tym budynku mój przyjaciel. - Przekroczył stertę puszek i potłuczonego szkła. - Pomagałem mu w zadaniach z matematyki, a potem graliśmy w piłkę. A dziś? To siedlisko karaluchów. \n\nPo kolejnym cięciu przewodniczący wchodzi do mieszkania przez drzwi wyrwane z zawiasów. W salonie na krześle siedzi starsza kobieta i proponuje Sławomirowi miejsce przy stole. \n\n- Pani Bogumiła była tak uprzejma, że zaprosiła nas do swojego mieszkania. Boli mnie widok tego, z jakim brakiem szacunku i jak źle traktuje się seniorów naszego narodu. - Dał kamerzyście znak, żeby pokazał cały pokój. - Brak prądu, brak ciepłej wody, sprężyny wychodzące z łóżka i chleb z taką ilością trocin, że pani Bogumiła nie mogła go nawet przekroić nożem. \n\nW kolejnej scenie Mentzen wjeżdża mercedesem na zamknięte osiedle na przedmieściach, należące do duchowieństwa. Automatyczny czytnik tablic rejestracyjnych wpuszcza jego samochód. \n\n- Większość z was, drodzy widzowie, może nigdy nie dostać się na ten teren. - Kamera przesuwała się z boku na bok, pokazując niezwykle wystawne budynki. - Mieszkali tu kiedyś niektórzy przedsiębiorcy będący klientami mojej kancelarii, to znaczy zanim Kościół przejął te drogie wille i rozdał je księżom. A teraz spójrzcie: maybach, bentley, bentley, rolls-royce, BMW, BMW, BMW, audi, kolejny maybach. - Mentzen wskazywał marki samochodów stojących na podjazdach, przeważnie po dwa lub trzy. - Tak żyje duchowieństwo i tak stawia się ponad wami. \n\nOdcinek trwa jeszcze dwie godziny, podczas których przewodniczący 'Nowej Nadziei' obnaża hipokryzję kapłanów, którzy nie podążają za przykładem Chrystusa."
TOR.73.a: "To powinno nieźle namieszać."

TOR.74.t: "Konsekwencje naszych czynów"
TOR.74.desc: "Mentzen siedział niespokojnie w sali konferencyjnej, a cierpliwość zaczynała go opuszczać. Czekał na Wiplera od dziewięćdziesięciu minut, choć spotkanie zorganizował sam Przemysław. Był to jawny pokaz siły, przypomnienie, kto rządził 'Nową Nadzieją' przed Upadkiem. Co gorsza, Sławomir nie znał nawet celu spotkania. Ten brak szacunku doprowadzał go do furii. Miał dość bycia pomiatanym, nawet we własnej firmie. Nie miał jednak wyboru. Jeszcze nie. Polityczne kontakty Wiplera wciąż miały znaczenie. Jeśli Mentzen chciał obalić Rydzyka, potrzebował jedności, a przynajmniej jej pozorów. \n\nPrzemysław Wipler wreszcie wszedł do sali z aroganckim uśmiechem, właściwym tylko ludziom, którzy wiedzą, że nadal trzymają smycz. Nie przeprosił, bo nie musiał. Opóźnienie było wyrachowane, miało zaboleć i przypomnieć Mentzenowi o dawnym układzie sił. Zarozumiała satysfakcja w jego oczach mówiła wszystko. Mógł naginać wolę Sławomira, jak tylko chciał, i obaj o tym wiedzieli. Dowód siedział tuż przed nim: Mentzen czekał. Cicho. Posłusznie. Przez ponad dziewięćdziesiąt minut. A Wipler delektował się każdą sekundą. \n\n- Nie możesz kazać mi tak czekać i traktować mnie jak głupca. - warknął Mentzen, a jego głos ciął gniewem. - To ja jestem twarzą tej partii. Tego ruchu. A ty? Jesteś uczestnikiem. Reliktem. Nadal siedziałbyś w moim cieniu, gdyby nie... incydent. \n\nWipler wybuchnął głośnym, szyderczym i szczerym śmiechem. - Incydent? - powtórzył z uśmiechem. - Proszę cię. Upokorzyli cię na oczach całego kraju. A ty, nasz dzielny rewolucjonista, po prostu tam stałeś i wszystko przyjmowałeś na siebie. \n\nPięści Mentzena zacisnęły się pod stołem. \n\n- Mam to na nagraniu. - ciągnął Wipler, a jego ton ochłódł i stał się o wiele groźniejszy. - Spotkania. Umowy. Dowód na to, że to ty pierwszy przypełzłeś do Rydzyka dla osobistej korzyści, kiedy było ci to na rękę. Więc nie zgrywaj przede mną twardziela. Nie obchodzą mnie twoje napady złości. Jesteś mój. Tam możesz udawać króla. Ale tutaj to ja ustalam zasady. \n\nW sali zapadła gęsta, dusząca cisza. Mentzen nie odpowiedział, lecz przez jego twarz przemknął błysk furii podszytej strachem. Wiedział, że Wipler nie blefuje. \n\n- Ale nie dlatego tu jesteśmy. - Wipler z przesadną starannością strzepnął pyłek z rękawa. - Jest coś poważniejszego. Za dużo mówiłeś. Powiedziałeś o wiele za dużo. Myślałeś, że jesteś odważny i przebijasz się przez szum. Ale nikogo nie mobilizowałeś. Dawałeś naszym wrogom nabitą broń. \n\nPochylił się, a jego głos stał się cichą groźbą. \n\n- Twoje przemówienia. Wiece. Transmisje na żywo. Genialne, nieprzefiltrowane komentarze o mniejszościach. Społeczności LGBT. Aborcji. Stałeś się symbolem, owszem, ale radioaktywnym. Ludzie pamiętają, co mówiłeś. My pamiętamy. A teraz te słowa nie są dziedzictwem. Są obciążeniem. Politycznym samobójstwem przebranym za przekonania. \n\nSzczęka Mentzena się zacisnęła. - I co twoim zdaniem powinniśmy teraz zrobić? - zapytał głosem, w którym po raz pierwszy zabrzmiała niepewność. \n\nWipler długo na niego patrzył, po czym uśmiechnął się półgębkiem. Zimno. Z wyrachowaniem."
TOR.74.a: "- Wymażemy to."

TOR.75.t: "Spalić Kościół"
TOR.75.desc: "Nagranie otwierało ujęcie Sławomira Mentzena stojącego przed bramami niewielkiego kościoła. Słońce znajdowało się niemal w zenicie, bo południe dopiero co minęło. Kamera mocno przybliżyła jego niezbyt fotogeniczną twarz, zmieniając tło w niewiele więcej niż rozmazaną plamę. W rękach trzymał teczkę dokumentów. \n\n- Dzień dobry wszystkim, witam w kolejnym odcinku naszego programu. Dziś znajduję się zaledwie rzut kamieniem od Torunia i odwiedzam nasze urocze wiejskie parafie. Jakież to spokojne miejsce, prawda? Prawdziwy obraz skromności i dobrego, prostego życia, nieskrępowanego żadnymi wielkomiejskimi przywarami. \n\nMentzen przeszedł kilka kroków w bok, a kadr rozszerzył się, ukazując miejscowego księdza wychodzącego przez bramę, który w obliczu tak przemożnej siły sprawiał wrażenie zakłopotanego. A może po prostu wstydził się kamery. Tak czy inaczej Mentzen podszedł do niego z uśmiechem, gdy mężczyzna miał właśnie wsiąść do samochodu. \n\n- Ach! Miałem nadzieję, że dziś ojca spotkam, ojcze Nikodemie. Czy mógłbym zadać kilka pytań o miejscową parafię? Jestem po prostu zachwycony nowymi ozdobami na bramie. \n\nKsiądz, niepewny, jak odpowiedzieć, wymamrotał coś brzmiącego jak zgoda, lecz o wiele za cicho, by mikrofon przypięty do ubrania mógł to wyraźnie zarejestrować. Mentzen odwrócił się ku kamerze z uśmiechem, w którym pobrzmiewała ledwo zauważalna nuta samozadowolenia. Zerknął do dokumentów i znów spojrzał na Nikodema. Kamerzysta zmienił ustawienie, by pokazać jeszcze szerszy obraz: kościół, dwóch mężczyzn i dość drogo wyglądający samochód. \n\n- Och, ale od czego zacząć? Wszystko jest takie piękne. Może od tych ozdób? Wspaniałe rzemiosło, wysokiej jakości metal; zapewne nie zardzewieje. Strzelałbym, że kosztowały jakieś dwa tysiące złotych, prawda? Może dwa i pół? \n\nOjciec Nikodem zaśmiał się nerwowo i nieco zmienił pozycję, jakby chciał zerknąć do dokumentów w dłoni Mentzena. Odpowiedział lekko drżącym tonem, z którego wciąż jednak sączyło się poczucie wyższości właściwe jego stanowisku. \n\n- Ależ tak, ma pan dobre oko do wyceny rzeczy, doktorze Mentzen. Był to cel, na który nasza parafia zbierała od dłuższego czasu. Wszystkie datki naszych wspaniałych wiernych... \n\nMentzen przerwał jednak świętemu mężowi w połowie odpowiedzi, przybierając zirytowany wyraz twarzy. \n\n- Na pewno są nimi zachwyceni, ale muszę zadać jeszcze jedno, bardziej osobiste pytanie. Jeździ ojciec naprawdę ładnym samochodem. No, łał. Musiał kosztować co najmniej sto tysięcy, prawda? A te felgi na zamówienie? Zrób na nie zbliżenie. \n\nLśniły wypolerowane na wysoki połysk, ukształtowane jak Jezus na krzyżu, wyraźnie wykonane na zamówienie, a nie ze zwykłego plastiku. Gdy kamera wróciła do rozmawiających, ojciec tracił już aurę wyższości i ruszył ku samochodowi. Mentzen jednak nie przestawał. \n\n- Jeszcze nie skończyłem, ojcze, tylko ostatnia rzecz! Z tych dokumentów wynika, że znaczna suma pieniędzy trafiła na... \n\nDrzwi samochodu zatrzasnęły się. \n\n- ...inwestycję! W dywersyfikację majątku parafii! \n\nSamochód odjechał z piskiem opon poza kadr. Mentzen wyprostował się, spojrzał w kamerę i z uśmiechem wyglądającym tak, jakby zaraz miał wybuchnąć śmiechem, odwrócił dokumenty w stronę widzów i przeszedł do podsumowania. \n\n- Jak państwo widzą, nawet niewielka parafia najwyraźniej ma miejsce na wszelkiego rodzaju luksusy. Kto je sfinansował? Tego nie mogę państwu powiedzieć, jednak dla potomności dokumenty, które trzymam, będą dostępne w opisie poniżej..."
TOR.75.a: "...i pamiętajcie, żeby zostawić łapkę w górę i..."

TOR.76.t: "Nadzieja młodych umiera ostatnia"
TOR.76.desc: "Z głośnym hukiem Bartosz zatrzasnął drzwi swojej kawalerki. W ślepej furii cisnął torbą, niemal całkiem pozbawiony sił po kolejnej niszczącej duszę zmianie w magazynie. Dzień po dniu czuł, jak młodość i życie uchodzą z niego po kawałku. Pokonany opadł na kanapę i wbił wzrok w sufit. Z pewnością nie tak wyobrażał sobie życie, kiedy jeszcze chodził do szkoły. Marzenia o karierze akademickiej rozjechały niemieckie czołgi sunące przez kraj, ale nawet wcześniej nie było idealnie. Opuścił rodzinną wieś, by uczyć się w wielkim mieście, w kraju nieustannie miotającym się między pieskami Unii Europejskiej a konserwatywnymi marionetkami. Od rozpadu starego porządku przeskakiwał z jednej drobnej, wysysającej duszę pracy do drugiej, zarabiając dość, by przeżyć i nie wracać z podkulonym ogonem do rodziny, lecz zdecydowanie za mało, by przerwać pogłębiającą się spiralę marnowania życia na nadgodziny za najniższą krajową. Świadomość, że nie był w tej sytuacji sam - w końcu w każdym miejscu gotowym go zatrudnić spotykał mnóstwo takich jak on - wcale nie poprawiała mu nastroju. Wręcz przeciwnie, korupcja i systemowy ucisk mas podsycały jego gniew oraz wściekłość. On i wielu podobnych młodych dorosłych chcieli jedynie uczciwie zarabiać w satysfakcjonującym zawodzie, który nagradza ciężką pracę. \n\nSkładał podania o każdą dostępną pracę, jaką zdołał znaleźć; bez powodzenia. Nagle zdał sobie sprawę, że na jeden z wysłanych listów jeszcze nie otrzymał odpowiedzi. Z jednej strony mógł zostać zignorowany jak większość pozostałych, ale nawet najbardziej oślizgła korporacja lubi łagodzić odmowę formułką 'Dziękujemy za zgłoszenie, jednak...' Wraz z rosnącymi wpływami duchowieństwa zauważył coraz więcej wolnych miejsc w seminarium akademickim. Bartosz nie był szczególnie religijny, lecz pomyślał, że w najmroczniejszych czasach boska interwencja może być jedyną nadzieją dla kogoś takiego jak on. Zaczął pojawiać się na niedzielnych mszach, wrzucać na tacę wszystkie pozostałe banknoty, a nawet modlić się przed snem. Poderwał się z nową energią, wybiegł z mieszkania, zbiegł po schodach i ruszył do skrzynki pocztowej. Przeglądając listy, widział rachunki, rachunki i jeszcze więcej rachunków, lecz jedna koperta wyróżniała się dużą woskową pieczęcią. Rzucił wszystkie rachunki na ziemię i z wielką nadzieją oraz podekscytowaniem delikatnie zdjął pieczęć, zamknął oczy i otworzył kopertę. Wreszcie bilet z tego piekła. Raz na zawsze skończy ze wszystkimi nieznośnymi pracami i rozpocznie akademicką karierę, której zawsze pragnął. Zerknął do środka, rozłożył kartkę i z bijącym sercem przeczytał:"
TOR.76.a: "'Dziękujemy za zgłoszenie, jednak...'"

TOR.77.t: "Siła, mięśnie i praca w lesie!"
TOR.77.desc: "- Pobudka! Pobudka! Na nogi! - Krzyk sierżanta oznaczał, że była piąta rano. - Za pięć minut chcę was widzieć gotowych do porannej zaprawy!\nJakub i jego koledzy z drużyny zabrali się do pracy, ubierając się i ścieląc łóżka.\n- Zbiórka! - krzyknął sierżant, a drużyna Jakuba wyszła z namiotu i ustawiła się w szeregu. \n- Do broni! - krzyknęło siedmiu rekrutów!\n- Proszę, proszę! Dziś jesteście na czas. To znaczy, że nie będzie karnych pompek. Za mną. \nCała drużyna truchtała za sierżantem przez dobre dwa kilometry, po czym zrobiła trzydzieści pompek i pięćdziesiąt przysiadów. Nawet Jakubowi, który miał za sobą karierę lekkoatletyczną, wydawało się to odrobinę przesadzone, nie mówiąc już o pozostałych rekrutach, którzy nie byli nawet w przybliżeniu tak sprawni jak on. \nPo ćwiczeniach zebrali się na śniadanie w polowej stołówce, gdzie dostali suchary, mielonkę, ser i kawę. \n- Nadal jesteś tak entuzjastycznie nastawiony do służby tutaj, Kuba? - zapytał jego kolega Tomasz. \n- Tak samo jak zawsze. - odpowiedział Jakub ku zdziwieniu Tomasza. Nie żeby miał jakąkolwiek alternatywę. \nPrzed zaciągnięciem mieszkał tylko z babcią. Dobrze się nim opiekowała, utrzymywała go i jako pobożna chrześcijanka próbowała wychować na dobrego wierzącego. Część nauk się przyjęła, głównie dlatego, że dawała mu przykład, zamiast prawić o ogniu piekielnym. Często słuchała Radia Maryja, ale daleko jej było do jednej z moherowych wojowniczek. Wszystko zmieniło się, gdy Rydzyk zachorował. Wpadła w histerię i zaczęła wysyłać większość emerytury fundacji księdza w nadziei, że znajdą sposób, by go wyleczyć... zupełnie ignorując własne dolegliwości. \nRobiła to w tajemnicy przed Kubą, zbyt zajętym szkołą i pracą na pół etatu, by zorientować się, co się dzieje, nim było za późno. Pewnego dnia znalazł ją nieprzytomną i wezwał karetkę. Po krótkich poszukiwaniach odkrył niewykupione recepty i kilka opakowań leków opróżnionych wiele miesięcy wcześniej. \nGdy odwiedził ją w szpitalu, najdelikatniej, jak potrafił, zapytał ją o to wprost. Wtedy wyznała mu prawdę. \n'Pieniądze bardziej przysłużą się ojcu Rydzykowi niż mnie' - powiedziała. \n\nZmarła zaledwie kilka dni później, a Jakub czuł, że częściowo ponosi za to winę. \n\nPotem został zupełnie sam. Zaniedbał szkołę i zaczął malować pełne nienawiści graffiti wymierzone w Rydzyka. Niedługo później zwerbował go agent Ad Arma, który pomógł mu uniknąć policyjnego patrolu. \n\nPo śniadaniu drużyna przygotowała się do pierwszego treningu z bronią palną. Każdy z jego kolegów dostał karabin, ćwiczebny granat hukowo-błyskowy i ogromny plecak. \n\nMieli pokonać tor przeszkód złożony z różnych konstrukcji: błotnistego odcinka do przeczołgania, mostu linowego między drzewami, a następnie przeszkód wspinaczkowych - ściany i siatki, które należało przebyć w zwisie. Potem każdy z ćwiczących miał wrzucić ćwiczebny granat hukowo-błyskowy przez okno prostego pomieszczenia z kartonu i ostrzelać cel. Po kilku rundach Tomek zemdlał, Łukasz złamał nogę podczas ostatniego przejścia, a Piotr stracił przytomność. Na szczęście zrobił to po ukończeniu toru."
TOR.77.a: "Takich wyników można się było spodziewać."

#TOR.78.t: "Konfederacja Światła"
#TOR.78.desc: "Przyjaciele, Konfederaci, Rodacy,\nGdy stąpamy po popiołach Polski, nie będziemy się lękać, gdyż poświęciliśmy jej całe życie pod znakiem Korony, Orła i Krzyża. Ponieważ oddaliśmy Polsce wszystko, póki żyjemy, jeszcze nie zginęła, bez względu na to, jak nisko upadnie. Piszę do was wszystkich, którzy w imię wolności zawartych w Koronie Konfederacji, braterstwa odnalezionego pod naszym białym Orłem i równości przed wszechmogącym Bogiem na Krzyżu prowadziliście niewdzięczną i brutalną wojnę przeciw naszemu marszowi ku jedności.\nJak dowodzi obecny stan tego Narodu, nie wszyscy przyswoili gorzką lekcję, którą tak często nam powtarzano. Władza, niczym pułapka na chciwe dusze, zatrzasnęła Toruń w śmiertelnych sidłach. Wyznawcy wiary porzucili swój obowiązek, a dekadencja zatruła ich serca. Zapomnieli o Maryi Zawsze Dziewicy, choć ich poddani wciąż Ją adorują.\nNa ich tron wstąpił jednak krwawy tyran, który kieruje ich oddanie ku sobie; on i jego herezjarchowie ucztują na pobożności Polski niczym pasożyt, który niegdyś był sługą Boga.\nTak, Jan Król, Tadeusz Rydzyk i ich Kościół redemptorystów, którzy twierdzą, że są najdoskonalszym ucieleśnieniem Boga, Honoru i Ojczyzny, są niczym kruki gromadzące się wokół naszego umiłowanego Narodu, głodne uczty nad umarłym. Zamiast pracy dla kraju kierują trud ku własnym rajom. Zamiast gromadzić siłę, by odeprzeć wrogów naszej narodowej pobożności, zbierają pieniądze i władzę dla siebie. Jedną rzeczą jest spocząć po zwycięstwie na laurach i je zmarnować; czymś zupełnie innym uczynić z laurów cel sam w sobie.\nCórki Boże i nasi seniorzy, ludzie nieskazitelnej wiary, są zwodzeni przez podłych heretyków. Przysięgają oddać swój dobytek i samych siebie, by bronić Kościoła, który zgnił.\nNasza wiara jest jednak silna, a głos prawdy przebudzi Toruń ze snu. Jesteśmy legionem i jesteśmy wszędzie w jego domenie, a opłakujemy własny udział w ich wyniesieniu. To wszystko nasza wina. Nas, toruńskich Konfederatów, wiernych swojemu obowiązkowi. Nasza pokuta jest jasna: ponownie stanąć pod prawowitym sztandarem i naprawić błąd, przejmując Kościół w imię oszczędności, cnoty i Narodu. I mimo naszego grzechu ośmielamy się błagać was, bracia Konfederaci i bracia Nacjonaliści, oddani Bogu, Honorowi i Ojczyźnie... wysłuchajcie nas. Broń, ochotnicy, kontakty. Wszystko, co możecie ofiarować. Wszystko, na co możecie sobie pozwolić, nie narażając siebie. A w Toruniu nadal będziecie mieli przyjaciela.\nKraj ponownie zaleje krwawa fala, zmywając nasze grzechy i ich grzechy. Nie lękajcie się jednak. Ogień wiary płonie w naszych piersiach, wszak Maryja Dziewica jest z nami. Jeśli nie macie niczego więcej, połączcie się z nami w słowach świętej modlitwy, by oczyścić Kościół z dekadencji i kłamstw. Jeśli możecie ofiarować więcej, radujcie się: wasze narzędzia przemienią sprawiedliwy chór wiernych w gniewny okrzyk.\nA gdy sztandar Konfederacji załopocze nad Toruniem, poznajcie imię człowieka winnego sprowadzenia nań koszmaru, który odkupił swą winę, pokonując go. Imię nadziei i światła w ciemności."
#TOR.78.a: "Sławomir Mentzen."

TOR.79.t: "W objęciach czwartego kręgu"
TOR.79.desc: "Artur wszedł do Sanktuarium zaledwie kilka minut temu, lecz dla niego zdawały się one niezliczonymi godzinami. Choć denerwował się, próbując wtopić w lojalistyczne duchowieństwo, był zdecydowany doprowadzić misję do końca. Podwinął rękaw sutanny, odsłaniając podrobiony zegarek marki Rolex. Był tylko płotką wśród duchowieństwa, ale odkąd postanowił zostać kretem w strukturach Kościoła, udawanie, że pasuje do braci w wierze, wydawało się po prostu niewłaściwe. Kwadrans po szesnastej, nadal miał trochę czasu do spotkania z miejscowym prepozytem, potencjalnym wysoko postawionym zdrajcą, który mógł prawdziwie wzmocnić szeregi spisku przeciw Ojcu Dyrektorowi. Uklęknął w jednej z ławek pustej nawy i zaczął się modlić. Z jednej strony uważał, że sprzeciw wobec skorumpowanych księży jest uzasadniony, że Kościół jako instytucję należy trzymać według najwyższych standardów prawdomówności i hojności, a wszystkich nieuczciwych i chciwych duchownych postawić przed sądem. Z tyłu głowy nie mógł jednak przestać rozważać, czy sprzeciw wobec woli Kościoła nie jest grzechem samym w sobie. Ta myśl często nie pozwalała mu spać. Nie miała litości dla jego psychiki. Młody ksiądz znajdował ukojenie w modlitwie, prosząc o przewodnictwo, błogosławieństwo i przebaczenie, a także żywiąc nadzieję, że Kościół naprawdę odwróci się od grzechu i będzie bronił wartości głoszonych przez samego Jezusa. \n\n- Szczęść Boże, bracie Arturze. - Zaskoczył go szeptliwy, starczy głos. - Mam nadzieję, że nie przeszkadza ci, jeśli dołączę do modlitwy. \n- Szczęść Boże, oczywiście, że nie, ojcze Amadeuszu. Miałem nadzieję z ojcem porozmawiać. - odszepnął. \n- Wiem. - Starszy ksiądz uklęknął obok niego w ławce. - Ale tylko tutaj naszym jedynym świadkiem będzie Bóg. Wiem, po co tu przyszedłeś. \n- W takim razie będę zwięzły. - Pochylił głowę, zerknął w bok i krótko omiótł wzrokiem nawę. - Uważamy, że Kościół nie dochowuje wierności naukom naszego Pana i Zbawiciela. \n- Mocne słowa jak na człowieka stojącego po tamtej stronie, bracie Arturze. - Pomarszczoną dłonią poprawił okulary. - Otrzymałem kopertę od twoich przełożonych. Nie śmieszy mnie to. \n- Ojcze, przychodzę tu nie jako agent, lecz jako brat służący naszemu Panu. - Wziął głęboki oddech. - Obecne władze sprowadziły Kościół na manowce, a sądzę też, że posiada on pewien artefakt, który mógłby ojca zainteresować. \n- Doprawdy? - Siwe, krzaczaste brwi uniosły się lekko w oznace skrywanej ciekawości. - Mógłbym rozważyć tę propozycję. Oczywiście nie dla siebie, lecz dla dobra mojej parafii. \n- Bóg mi świadkiem, mały palec u nogi Jezusa zostanie wystawiony właśnie tutaj, ku radości zgromadzenia. \n\nObaj skinęli głowami na znak zgody i rozeszli się, a przechodząc przez bramy, Artur miał tylko nadzieję, że wystarczy świętych części ciała, by przeciągnąć na swoją stronę całe duchowieństwo."
TOR.79.a: "Zawsze można mieć nadzieję."

TOR.80.t: "My, niżej podpisani..."
TOR.80.desc: "- W tym dniu wspominamy objawienie, do którego doszło w Gietrzwałdzie. Objawienie, które obiecało nam wyzwolenie i odnowę Polski. My zaś nie dotrzymaliśmy złożonej Bogu obietnicy troski o ojczyznę. Popadliśmy w samozadowolenie i dekadencję, a potem Polska upadła. \n\nUroczysty głos ojca Kneblewskiego wypełnił kościół Świętych Marcina i Mikołaja.\n- Musimy jednak pamiętać - otucha w jego głosie tworzyła niezwykle potrzebny kontrast - że opieka Maryi nad Polską jest wieczna. Wciąż mamy dany przez Boga potencjał, by ponownie zjednoczyć kraj. My wszyscy. Wszyscy Polacy. Nie tylko duchowieństwo. Matka Boża objawiła się przecież nie żadnemu prałatowi, lecz dzieciom. Jeśli mamy odnieść sukces, wszyscy świeccy muszą być niczym te ufne dzieci, gotowe podążyć za Maryją.\n\nSławomir Mentzen z błogością słuchał kazania. Biskup dobrze zapowiadał odnowienie Konfederacji Gietrzwałdzkiej. Tego należało oczekiwać od świadka deklaracji. Mimo wszystko Mentzen pamiętał swoje zdziwienie tym, jak łatwo przekonał go do dołączenia do czegoś, co dla Mentzena było oczywistym kolejnym krokiem w spisku przeciw Rydzykowi - dobroczyńcy Kneblewskiego. Czy radykalny ksiądz nie dostrzegał machinacji Mentzena, czy też świadomie wybrał tę drogę, oburzony praktykami Rydzyka? Z ojcem Arkadiuszem Okrojem sprawa była znacznie prostsza. Obietnica przywrócenia go na stanowisko biskupa toruńskiego uczyniła z niego jednego z najpewniejszych stronników spoza wewnętrznego kręgu Mentzena.\n\nZ trudem oderwał uwagę od politycznych machinacji i skupił się na mszy. Nadeszła przecież pora na kontemplację Boga. Przez jakiś czas mu się udawało.\n\nPotem, gdy ludzie przygotowali się do przyjęcia Ciała Chrystusa w komunii świętej, prawnik nie potrafił powstrzymać zazdrości o wiedzę Ojca Niebieskiego na temat Jego wyznawców. \n\nMentzen nie mógł wiedzieć, którzy z obecnych byli jego sprzymierzeńcami. Co więcej, nawet sygnatariusze Konfederacji nie musieli sprzeciwiać się Rydzykowi. \nPrzywódca 'Nowej Nadziei' zaczął liczyć szable do swojej dyspozycji, przyglądając się obecnym w kościele. Oczywiście mógł liczyć na najbliższych doradców - brata Tomasza, Przemysława Wiplera i Sypniewskiego. Hoga z radością uczestniczyłby we mszy i zadeklarował przywiązanie do ideałów gietrzwałdzkich, ale niestety. Ojciec Kneblewski powinien być pewny, podobnie jak wspomniany wcześniej Okroj. Zauważył niektórych z tych, którzy podpisali deklarację w 2018 i 2019 roku. Powinni pojawić się też nowi. To powinno zapewnić wystarczająco solidny fundament. Powinno. Gdzie by teraz był, gdyby zaufał niektórym sygnatariuszom z 2018 roku? Braun, Bosak, Winnicki, Wilk... sami niewiarygodni intryganci, niezdolni do pracy dla wspólnego dobra. Pewnego dnia przysięgną wierność jego sprawie. O ile któryś z nich przetrwa wojny zjednoczeniowe. \nMentzen przyjął komunię, mając nadzieję, że jego zazdrość i pycha są na tyle lekkie, by nie obrazić Boga, a po zakończeniu mszy udał się na publiczne podpisanie deklaracji.\nJego podpis był aktem zaślubin między nim a rewolucyjnym katolickim nacjonalizmem. Będzie musiał porzucić nacisk na konserwatyzm fiskalny i zamiast tego bardziej skupić się na konserwatyzmie społecznym."
TOR.80.a: "...deklarujemy naszą przynależność do Narodu Polskiego Cywilizacji Łacińskiej."

TOR.81.t: "Przygotowania do uderzenia"
TOR.81.desc: "Ciężkie dębowe drzwi Sali Wojennej zamknęły się z głuchym łoskotem, odcinając ostatni skrawek dziennego światła. Powietrze wewnątrz zdawało się naelektryzowane mieszanką ambicji, podejrzliwości i delikatnej woni piwa. Sławomir Mentzen siedział u szczytu długiego stołu, otoczony przez najwierniejszych sprzymierzeńców, między innymi człowieka z tylnego siedzenia - Przemysława Wiplera, wspólnika w zbrodni - swojego brata Tomasza Mentzena oraz regionalnego administratora - Marcina Sypniewskiego. Teczki ułożono w schludne, onieśmielające stosy. Każda strona, każdy zaznaczony wiersz stanowiły amunicję. \n- Możemy już zaczynać? - Wipler ponaglił Mentzena. \n- Czekamy na ostatniego gościa.\n\nPo dwudziestu minutach krąg konspiratorów powiększył się o kolejnego intryganta.\n\n- Nie spodziewałem się, że pojawisz się osobiście. - W głosie Tomasza pobrzmiewało zdumienie.\n- Przepraszam za spóźnienie. - W ramach przebrania Jacek Hoga zgolił włosy, przyciął brodę i założył okulary. - Ochrona była szczególnie trudna do obejścia, ale chciałem być obecny przy planowaniu ostatecznego upadku Rydzyka. \nWszyscy zebrani spojrzeli na Sławomira, oczekując potwierdzenia tego, co już podejrzewali. \n- Dobrze usłyszeliście - ciągnął Mentzen spokojnym głosem, w którym jednak pobrzmiewało napięcie wywołane zarówno wagą chwili, jak i obawą, że Hoga znów skradnie mu całe przedstawienie. - Koniec spekulacji. Rozpoczynamy jawną operację przeciw Rydzykowi. \nSłowa opadły niczym uderzenie młotka sędziowskiego. Przy stole przemykały spojrzenia. Niektóre twarze stężały, inne zdradziły cień wątpliwości. \n- Na tym etapie nie możemy już udawać, że tylko badamy grunt. Dopóki może wyjść z tego bałaganu, mamy problem. Ale od tej chwili, jeśli nas złapie, to nie tylko my jesteśmy w dupie. \nSalę Wojenną przygotowywano od wielu tygodni. Ekrany świeciły liniami czasu, diagramami i nazwiskami. Każde ogniwo łańcucha dowodzenia prześledzono raz za razem. Wiedzieli, za które sznurki pociąga Rydzyk i gdzie mogą się one przetrzeć. Niski szum projektora wypełnił pomieszczenie, gdy pojawił się nowy slajd: FAZA PIERWSZA. Lista była krótka, lecz każdy punkt stanowił ostrze. Anonimowe przecieki. Strategiczne pozwy. Szepty zasiane dokładnie w odpowiednich uszach. \n- To nie sprint - przypomniał im Sławomir. - To presja. Stała, chirurgiczna. Nie burzymy muru; wyjmujemy cegły jedną po drugiej. \nWipler odezwał się wyważonym głosem. - Jeśli zwęszy to za wcześnie, pociągnie za sznurki, do których nie mamy dostępu. \nMentzen przestał chodzić i spojrzał mu w oczy. - W takim razie poruszamy się jak dym. Żaden pojedynczy ruch nie będzie dość głośny, by dało się go namierzyć, ale wszystkie razem staną się oczywiste. \nRozmowa przeszła na kryptonimy, jednorazowe urządzenia i osoby, którym można ufać na tyle, by przenosiły informacje bez pozostawiania śladów. Cyfrowe tropy wyczyszczono. Tylne kanały zabezpieczono. Na jednej ze ścian górował ogromny kalendarz z kluczowymi datami zakreślonymi na czerwono. Najważniejsze uroczystości religijne. Terminy raportów finansowych. Każda była potencjalnym momentem, by zacisnąć pętlę. \nGdy spotkanie dobiegło końca, Sala Wojenna była usiana pustymi kubkami po kawie i przesiąknięta zapachem bitwy, która już się rozpoczęła. Nikt nie odezwał się przy wyjściu, lecz każdy krok niósł ciężar tego, co właśnie wprawili w ruch. Punkt bez powrotu dawno pozostał za nimi. Teraz była już tylko operacja."
TOR.81.a: "Czas zadać cios Rydzykowi."

TOR.82.t: "Raport wywiadowczy o Sanktuarium"
TOR.82.desc: "Dzień pierwszy\n\nNa podstawie wstępnego rozpoznania sytuacyjnego można jasno stwierdzić, że Kompleks jest prawdopodobnie jednym z najściślej strzeżonych obiektów w całej Polsce. Jest ogromny, a jedna para oczu nie jest w stanie objąć bezmiaru tej gigantycznej bazy. Całą przestrzeń drobiazgowo odizolowano, zabarykadowano i uszczelniono. Patrole krążą tak często, że w ciągu tygodnia strażnicy zapewne pokonują dystans równy pielgrzymce z Lichenia do Częstochowy. \n\nJakby tego było mało, gęsta sieć kamer zapewnia widok na cały teren wokół Sanktuarium - bez martwych stref, z noktowizją i termowizją. Infiltracja z zewnątrz jest niemożliwa. Może dałoby się wykopać tunel? \n\nDzień drugi\n\nTunel nie wchodzi w grę. Wstępne badania georadarem wykazały, że poza spodziewanymi katakumbami pod ziemią istnieją już rozległe sieci schronów i tuneli. Trzeba też założyć, że mają radary zdolne wykryć wszelkie prace ziemne. Strażnicy zmieniają się co osiem godzin, trzy razy dziennie. Zaczynam podejrzewać, że starsze panie kręcące się po pobliskich ogródkach działkowych również są agentkami wywiadu. Nawet jeśli nie pracują oficjalnie, wystarczy jeden błędny ruch, a i tak cię zgłoszą. \n\nDzień piąty\n\nDostawy są regularne - co dwa dni, ale ładunek bywa różny. Czasem przywożą podstawowe artykuły, innym razem bardziej... luksusowe towary, a nocami przemycają nawet personel. Jego przeznaczenie pozostaje nieznane. Dostawy mogą być jedyną drogą do środka, ale wykrycie jest niemal pewne. Inną możliwością byłoby umieszczenie uśpionych agentów w seminariach... lecz to plan zbyt długoterminowy. \n\nDzień dziesiąty\n\nNajbardziej emocjonujący moment całej misji. Pewnej nocy dwóch księży wyszło na papierosa i odebrało trochę towaru od przemytnika. Wątpię, by handlowali zapachowymi kadzidełkami. Innej nocy strażnicy niemal zastrzelili marudera, lecz na szczęście zdołał opuścić teren, nim pociągnęli za spust. \n\nRaport podsumowujący.\n\nPrzy każdej dostawie strażnicy otrzymywali dodatkowe palety z przedmiotami o nieznanym przeznaczeniu. Na podstawie posiadanych informacji można oszacować, że gromadzą tam zapasy, gdyż dostarczane ilości znacznie przekraczają przewidywane średnie tygodniowe zużycie. Wszystko sprawia wrażenie przygotowań do czegoś, czego jeszcze nie potrafię przewidzieć. Żadnego księdza nie wpuszczono do środka, jeśli wcześniej nie był związany z wewnętrznym kręgiem. Otoczenie Kompleksu jest niekorzystne dla każdego, kto próbuje się zbliżyć - obiekt otaczają pola, las, Wisła i rozlewisko ogródków działkowych, których większość mieszkańców to lojaliści Rydzyka albo osoby umieszczone tam w celach obserwacyjnych. Często jedno i drugie.\n\nOgrom Sanktuarium jest przerażający, ale oznacza też, że jego ochrona wymaga tytanicznego wysiłku, a w takiej machinie wszystko musi zawsze działać bezbłędnie, ponieważ jeden błąd, jedna chwila zaniedbania może zawalić cały system. Stwarza to pole do potencjalnych operacji wywiadowczych, zarówno biernych, jak i bardziej aktywnych. Natężenie sił ochrony oznacza jednak, że każda misja podjęta przeciw Kompleksowi byłaby równoznaczna z samobójstwem."
TOR.82.a: "Perspektywy nie wyglądają ani trochę lepiej."

TOR.83.t: "Znowu w czerni"
TOR.83.desc: "Przez ciemne okna leśnej kryjówki położonej tuż przy jednej z dróg wojewódzkich prowadzących do Torunia Marcin wypatrywał w zaroślach blasku samochodowych reflektorów. \n\n- Ktoś jedzie? - Z drugiego pokoju odezwał się niski głos. \n- Nie, Tadeusz, jeszcze nic. - odpowiedział. - Skończyłeś swoją część? \n- Prawie skończyłem prasować. Szkoda, że nie dali nam świeżych sutann zamiast tych. \n\nDwóch najwierniejszych członków Nowej Nadziei przygotowywało się do zamiany z kilkoma duchownymi gotowymi zmienić stronę. Po pewnym czasie, gdy obaj infiltratorzy zdążyli się przebrać, w ciemnym lesie pojawił się biały blask świateł LED, a wkrótce przed kryjówką zaparkowało czarne BMW serii 7. Z samochodu wyszło dwóch księży i ruszyło w stronę budynku. \n\n- Szczęść Boże, panowie. - powiedział jeden z księży. \n- Szczęść Boże. Wszystko gotowe? - zapytał Tadeusz. \n- Doskonale, widzę, że jesteście już przebrani; dowody osobiste, karty dostępu, wszystko jest w samochodzie. - Drugi ksiądz wyciągnął ku Marcinowi rękę z kluczykami, lecz błyskawicznie cofnął ją, zanim ten zdołał je chwycić. - Zakładam, że wywiązaliście się ze swojej części umowy. \n- Oczywiście, wasza świątobliwość. W garażu czeka zielony opel, w bagażniku cywilne ubrania i koperty, których zawartość przekroczy wasze oczekiwania. - W podobny sposób trzymał w dłoni kluczyki do samochodu. \n- Bądźcie błogosławieni. - odpowiedział ksiądz, wymieniając się z Marcinem kluczykami. - I niech Bóg będzie z wami. Powodzenia. \n\nMinęła godzina. Marcin i Tadeusz, przebrani za księży, jechali teraz BMW do Kompleksu Sanktuarium. \n\n- Mógłbym się przyzwyczaić do takich samochodów. - Tadeusz zachichotał, rozkładając masujący fotel. \n- Może sam wskoczysz w sutannę, kiedy już skończymy. - Marcin odpowiedział śmiechem, prowadząc przez Toruń i zbliżając się do celu. \n- Może jednak nie. - Pokręcił głową i ponownie wyprostował fotel. - Prawie jesteśmy. \n\nKompleks był ufortyfikowany i zabezpieczony niemal jak tajna baza wojskowa, z monitoringiem, uzbrojonymi strażnikami i tylko jednym wjazdem oraz wyjazdem przez przypominający wojskowy punkt kontroli. Marcin podjechał do bramy, opuścił szybę i spojrzał na ochroniarza siedzącego w budce. \n\n- Dokumenty, proszę. \n- Szczęść Boże. - powiedział Marcin, wręczając papiery. - Proszę. \n\nStrażnik spojrzał na podane dowody, a potem na obu mężczyzn. Najpierw zmarszczył brwi, po czym znów je uniósł. \n- Jedźcie dalej. - powiedział z wahaniem funkcjonariusz, oddając dokumenty. - Po operacji plastycznej zaleca się wymienić dowód osobisty. \n- Często się to zdarza? - zapytał z ciekawością Tadeusz.\n- Gdyby chodziło tylko o was, nabrałbym podejrzeń. - Wskazał naprzód. - Proszę jechać. \n\nMarcin podziękował, odebrał dowody, podniósł szybę i ruszył w głąb Kompleksu, walcząc z chęcią przywalenia Tadeuszowi za jego niewyparzoną gębę. Miał nadzieję, że reszta infiltracji przebiegnie bez podobnych większych przeszkód."
TOR.83.a: "Wchodzimy w środek Jądra Ciemności..."

TOR.84.t: "Życie w czasie pokoju"
TOR.84.desc: "Był to dzień jak każdy inny. Bez stresu, bez niczego dziwnego. Zwykła dostawa, tylko tym razem przywożąca coś nowego. Przynajmniej tak powtarzał sobie Marian. Kurczowo ściskając jedną ręką kierownicę, a drugą lewarek zmiany biegów, cofnął swoją obskurną ciężarówkę dostawczą pod pewne zejście schodami na staromiejskim rynku. Po długim, głębokim oddechu Marian wysiadł z samochodu, starając się jak najlepiej wyglądać na człowieka, który nad wszystkim panuje. Czekał tam na niego duet, który dobrze znał z tras dostaw. Nie trzeba ich było przedstawiać: Marek trzymał podkładkę do pisania, a Piotr wózek paletowy. O ile wiedział, Marek najprawdopodobniej był wtajemniczony, ale Piotrek? Tego nie był pewien. Nieco wymuszonym tonem Marian zaczął: \n\n- Cześć, chłopaki, dzisiaj wyjątkowa dostawa, pewnie dostaliście notkę. Wprowadzają jakiś nowy smak. \n\nMarek rzucił mu spojrzenie, na moment podnosząc wzrok znad podkładki, po czym odpowiedział swoim typowym, obojętnym tonem. \n\n- Taa, 'Stary Przebrzmiały'. Jak zawsze mają pomysły do tych nazw. \n\nMarian wzruszył ramionami i otworzył tył ciężarówki, odsłaniając dziesiątki wielkich beczek piwa, których zawartość wzruszyłaby każdego prawdziwego patriotę do łez. To znaczy, gdyby nie musieli oglądać tego bogactwa co kilka dni przez cały okres swojej pracy tutaj. Piotr szybko zabrał się za ładowanie pierwszej beczki na wózek, lecz wydała ona dziwny grzechoczący dźwięk. Metal uderzył o metal. Broń o beczkę. Oczy Mariana natychmiast się rozszerzyły, a serce podeszło mu do gardła. Piotr miał właśnie coś powiedzieć, gdy Marian przerwał mu mistrzowskim popisem aktorstwa. \n\n- Och, tak! Właśnie! No tak! Zapomniałem wspomnieć! Musieli wrzucić do beczek jakiś nowy metalowy szmelc, żeby piwo się nie pieniło! Mhm! \n\nPiotr spojrzał na niego w charakterystyczny sposób, jakby trybiki w jego mózgu zaczęły się obracać; niemal można było usłyszeć dźwięk nawiązywania połączenia modemowego. Potem uśmiechnął się i powiedział z pełnym, absolutnym przekonaniem: \n\n- Racja! Tak jak robią z puszkami sprayów, nie? \n\nNa twarzy Marka malowało się głębokie rozczarowanie, częściowo zasłonięte trzymaną podkładką. Posłał Marianowi parzące spojrzenie i pogonił wielkiego myśliciela, nim ten zdołał dojść do lepszych wniosków. \n\n- Tak, Piotrek, dokładnie jak w sprayu. A teraz ruszaj się i wnoś te beczki do środka, zanim ktoś postanowi ujawnić ten cały nowy smak w mediach społecznościowych. \n\nPozostało już tylko kilka napiętych minut rozładunku, po których Marian mógł wskoczyć do ciężarówki i ruszyć do kolejnych punktów na liście dostaw. Aż dziw, że pub w ogóle zatrudnia kogoś takiego jak Piotrek..."
TOR.84.a: "...ale dlatego zajmuje się paletami, a nie bronią."

TOR.85.t: "Jagnięta prowadzone na rzeź"
TOR.85.desc: "Popołudniowe słońce oświetlało Grudziądz przez pierzaste chmury, rozlewając po mieście przyjemne ciepło. Ptaki śpiewały, kwiaty kwitły, a mieszkańcy spędzali wolny czas, leżąc na zielonej, żywej trawie; idealny dzień na protest. Robert i Łukasz, dwaj młodzi, działający pod przykrywką członkowie 'Nowej Nadziei', dźwigali na środek placu wielkie, ciężkie pudło. \n\n- Powiesz mi, co jest w tym pudle, Robert, czy każesz mi je nieść wyłącznie dla zabawy? - narzekał Łukasz, a po czole spływał mu pot. \n- Cierpliwości, przyjacielu, to wszystko część większego planu. - odpowiedział Robert. - Tutaj, idealne miejsce, postaw je. \n\nZ ciężkim łoskotem obaj opuścili pudło na ziemię. Pod ostrzem noża do kartonów pojemnik ujawnił zawartość: antyklerykalne transparenty, megafony, czerwone bandany i głośnik Bluetooth. Łukasz przechylił głowę, ale szybko zrozumiał, co się święci. \n\n- Czy ja widzę rewolucyjną iskrę w twoim oku? - Robert zachichotał, wyjmując przedmioty z pudła. \n- Do dzieła. Z tymi zabawkami powinniśmy narobić niezłego hałasu! - Chwycił megafon i zaczął wykrzykiwać stereotypowe lewicowe hasła. \n\nNiedługo później wokół nich zaczęło tworzyć się niewielkie zgromadzenie, skandujące te same słowa co dwaj mężczyźni stojący na pudle. Lekko podchmieleni studenci kręcący się po parku stanowili idealny tłum do podburzenia przeciw władzom. W wielu dużych miastach regionu niemal jednocześnie pojawiły się zgromadzenia spędzone dokładnie w ten sam sposób. Radykalne elementy społeczeństwa, dotąd trzymane w ryzach, wreszcie dały upust emocjom. Wkrótce wybuchły zamieszki, gdy kolumny prowadzone przez działających pod przykrywką agentów 'Nowej Nadziei' ruszyły ulicami, rozrzucając śmieci i demolując witryny oraz inne obiekty użyteczności publicznej. Pochód okazał się zapałką rzuconą na ogromne ognisko, a wzburzone masy rosły niczym tocząca się śnieżna kula, dając upust całej frustracji wobec duchowieństwa. Stado rosło, nieświadome niebezpieczeństwa, ku któremu zmierzało. \n\nZ wyjących syrenami i migających światłami radiowozów zaczęli wysypywać się policjanci, próbując wszelkimi koniecznymi środkami przywrócić porządek. Obecność kordonów funkcjonariuszy i batalionów milicji parafialnych jeszcze bardziej rozwścieczyła tłum, gdy obie siły zaczęły się ścierać, najpierw kamieniami, potem gumowymi kulami, a wreszcie ostrą amunicją. Z dala od strefy walk Robert i Łukasz siedzieli ukryci w krzakach, obserwując owoce swojej pracy. \n\n- Przegięliśmy, co? - zapytał Łukasz z mieszanymi uczuciami. \n- Nie, stary, dokładnie to mieliśmy zrobić. - Robert zachichotał, obserwując rozgrywający się chaos. - No, może odrobinkę."
TOR.85.a: "To będzie długi dzień."

TOR.86.t: "Pierwszy dzień/ostatni dzień... beztroski"
TOR.86.desc: "Sufit miał pewien szczególny odcień pastelowego błękitu. Nie całkiem błękit nieba, był na to zbyt wyblakły, ale nie dało się też nazwać go złamaną bielą. W najlepszym razie może szarością. Trudno było mu stwierdzić. Wpatrywał się w niego tak długo, że potrafił prześledzić każde pęknięcie i każdą drobną niedoskonałość wykonanej warstwy farby. Każdą chwilę świadomości przez ostatnie miesiące spędzał w tym pokoju, w tym łóżku - swojej pozłacanej klatce. Jakie miało znaczenie, że zbudował to imperium, zwieńczenie życiowych celów i aspiracji, skoro nie mógł go nawet zobaczyć? \n\nW dłoni trzymał różaniec. Była to rzecz najbliższa modlitwie, jaką wykonał od wielu tygodni. Koraliki przestały mieć dla niego sens. Która modlitwa była która? Wiedział, oczywiście, że wiedział; odmawiał je od dzieciństwa... po prostu nie potrafił sobie przypomnieć, nie w tej monotonii. Przy łóżku siedział młodszy mężczyzna. Seminarzysta był zmartwiony, owszem, oczywiście, że był, miał serce zbyt wielkie do tej pracy, a jednak... dziś wyglądał na bardziej zaniepokojonego. Starzec otworzył usta, by przemówić, lecz wargi miał wyschnięte, a język utracił sprawność. Nie wydobyło się żadne słowo, tylko charczenie. Zakaszlał, potem ponownie, po czym osunął się na łóżko. \n\nWbrew zwykłemu bólowi tym razem kaszel nie zabolał. Był ciepły. Czuł ciepło w ustach. Uspokoiło go, jakby uwolnił odrobinę dyskomfortu, który utrzymywał go na uwięzi. Odetchnął z ulgą i odwrócił się, by spojrzeć przez okno. Wpatrzył się w chmury, we wczesnopopołudniowe słońce. Powieki zaczęły mu opadać. Może, tylko może, mógłby chwilę odpocząć. \n\nCzuł się zmęczony, tak bardzo zmęczony i tak bardzo zasługujący na odpoczynek. Nie słyszał nawet zamieszania w pokoju albo po prostu już go ono nie obchodziło. Wyważanych drzwi, wpadających uzbrojonych ludzi, pomocnika przyciśniętego do ściany i skutego plastikowymi opaskami. Wszystko było dla niego jedynie nierozpoznawalnym szumem. \n\nMężczyźni zgromadzili się wokół niego, tworząc ciasny półokrąg przy łóżku, przez który musiał przepchnąć się ich przywódca. Uniósł pistolet, wycelował w na wpół martwego człowieka przed sobą i wypowiedział ostatnie słowa, wyliczając jego zbrodnie, lecz nie dostrzegł żadnej reakcji. \n\nSufit mógł być popękany i matowoniebieski, ale niebo było olśniewające i nasycone kolorem. Zdobiły je artystyczne pociągnięcia Bożego stworzenia: ciepłe słońce, miękkie chmury... \n\nPatrzył na nie i było piękne. \n\n\nPotem zgasło. \n\n\n\nA następnie zniknęło."
TOR.86.a: "Umarł prorok, niech żyje wolność!"

TOR.87.t: "Morto Prematuramente"
TOR.87.desc: "- Wiem, co znaczy być żywym. Przestań się wymądrzać, Czarek! Zwłaszcza kiedy twój błąd naraża mnie na niebezpieczeństwo! - Ojciec Nikodemski podniósł głos, co było do niego niepodobne. - Przepraszam. To też częściowo moja wina. Muszę iść. \n\nAlarmowy telefon od Cezarego nie mógł mu pomóc w obecnej sytuacji, gdy histeryczne masy zgromadzone wokół toruńskiej rozgłośni Radia Maryja szykowały się do zlinczowania go za szerzenie kłamstw. \n\nTo, co powiedział podczas rozmowy, było prawdą. Choć obowiązkiem Czarka było wysłanie listu dopiero po upewnieniu się, że Ojciec Dyrektor zmarł, ojciec Nikodemski mógł zweryfikować informację i powstrzymać to szaleństwo, zamiast dolewać oliwy do ognia. \n\nChciał jednak jako pierwszy poruszyć tak gorący temat, nim zrobi to jakaś mniej znana stacja radiowa albo gazeta. Teraz musiał zapłacić cenę. \nPasujący do sytuacji cytat z Biblii przyszedłby mu do głowy, gdyby cegła nie wybiła okna w jego gabinecie na drugim piętrze, zmuszając go do skupienia się na brutalnej rzeczywistości. \nZwykły tłum emerytów wzmocnił napływ młodszych wiernych, silniejszych od starszych sprzymierzeńców, lecz równie zaciekłych. \n\n- Gdzie jest ojciec Tadeusz?! Śmierć kłamcom! Śmierć fałszywym prorokom! - Chór seniorów śpiewał bez końca, podczas gdy młode byki skupiły się na demolowaniu otoczenia i rzucaniu gruzem w funkcjonariuszy, którzy właśnie rozpoczęli nieudolne próby opanowania zamieszek. \n- Drodzy wierni, pozwólcie mi wyjaśnić! - krzyknął przez wybite okno. \n\nTak jak zawiodły siłowe próby policjantów, tak samo nie powiodło się dyplomatyczne podejście księdza: puszka uderzyła go w ramię i przedwcześnie zakończyła przemowę. \n\nEmocje osiągnęły szczyt, gdy tłum uniósł jedną z buntowniczek. Trzymała kopię nieszczęsnego listu i dołączony do niego, specjalnie zdobiony różaniec zamówiony przez Rydzyka jako pamiątka po jego śmierci. Stało się to sztandarem nowo powstałej armii. Zawodzenie stało się nie do zniesienia. Protestujący wreszcie postanowili wedrzeć się przez okna na parterze i wtargnęli do budynku. \n\nSerce księdza zamarło, gdy buntownicy przebili się przez kolejne drzwi. \n\nZaczął się modlić. \n\nKilka sekund później wreszcie dotarli do pokoju, w którym się ukrywał. Ich oczy płonęły żądzą krwi. Wtedy wydarzył się cud. \n\n- Moja Rodzino... - słaby głos schorowanego starca popłynął ze wszystkich ulicznych głośników i odbiorników radiowych. To wystarczyło, by tłum na chwilę zamarł. \n\n- Rozumiem, że jesteście wzburzeni, ale przemoc nigdy nie jest odpowiedzią... Tylko modlitwa i przebaczenie. - Teraz wszyscy byli pewni. Przemawiał do nich głos ojca Rydzyka. Buntownicy byli zdezorientowani. Nie wiedzieli, czy rzeczywiście był to głos Ojca Dyrektora. Dla wielu starszych uczestników zgromadzenia było to zbyt wiele. Wielu zemdlało, podczas gdy pozostali słuchali nagrania, próbując ustalić, czy naprawdę pochodziło od Rydzyka. \n\n- Do Sanktuarium! - krzyknął ktoś, gdy wychodzili z siedziby."
TOR.87.a: "Vivo Subito."

TOR.88.t: "Propozycja z Kujaw"
TOR.88.desc: "Mentzen prosi nas o pomoc w obaleniu Rydzyka"
TOR.88.a: "Wyślijmy pomoc"
TOR.88.b: "Nie możemy teraz niczego poświęcić."

TOR.89.t: "[GetNewspaper]Wybucha wojna domowa na Kujawach i Pomorzu!" 
TOR.89.desc: "Bla, bla, bla, Mentzen, Król, Rydzyk nie żyje, jak mogło do tego dojść? Każdy lubi Mentzena, ale Król jest chujem."
TOR.89.a: "madio raryja"

TOR.90.t: "Hamulcowy"
TOR.90.desc: "Jan Król niespokojnie czekał, aż lekarze zakończą codzienne badanie. Z szacunku dla cierpiącego mentora odmawiał wejścia do komnaty, w której Rydzyk postanowił spędzić ostatnie dni, lecz nawet z zewnątrz czuł atmosferę śmierci i rozkładu. Minęły całe tygodnie, odkąd Ojciec Dyrektor ostatni raz zebrał w sobie siłę, by opuścić ją choćby na kilka krótkich chwil. Król wiedział, że każdego dnia może otrzymać fatalną wiadomość. Próbował się przygotować, ale ta myśl wciąż napełniała go lękiem. \n\nOjciec Laskosz, pomocnik wyznaczony do pośredniczenia między światem żywych i umierających, wyszedł uroczyście z pokoju, pogrążony w modlitwie. \n\n- Jak wygląda sytuacja? - zapytał niecierpliwie Król. \n- Nędznie, jak zawsze. Ojciec Dyrektor pozostaje przeważnie w śpiączce i otwiera oczy najwyżej na godzinę lub dwie. Nawet wtedy jest całkowicie przykuty do łóżka. \n- Czy możemy coś zrobić? \n- Wątpię. Mimo tysięcy modlitw w jego intencji lekarze nie zmieniają diagnozy. Dają mu kilka tygodni, nie więcej. \n- Pozostaje więc czekać. Ta perspektywa naprawdę nie napełnia mnie zbyt wielką nadzieją. \n- Mnie również, ale pod nieobecność Rydzyka nadal musimy utrzymywać wszystko w ruchu. \n- Właśnie o tym... Otrzymałeś mój najnowszy zestaw dekretów, prawda? O ile wiem, większości nadal nie wdrożono. Masz ku temu jakiś powód? \n- Niestety muszę poinformować, że zostały... zablokowane. \n- Zablokowane?! Przez kogo?! - Ojciec Król wpadł we wściekłość, rozwścieczony tym, że ktoś zakwestionował jego władzę. \n- Przez Rydzyka. Najwyraźniej bardzo stanowczo potępił proponowane przez ojca zmiany. \n- Jakim cudem!? Jest przytomny może przez godzinę dziennie! Osobiście pilnuję, żeby nie widywał się z nikim, kogo nie chcemy tam wpuścić! \n- Wygląda na to, że ma pewne... tylne kanały, którymi wydaje rozkazy. \n- I NADAL nie zdołaliście ich odnaleźć? U człowieka, który - jak najwyraźniej muszę ci przypomnieć - dosłownie nie jest w stanie wstać z łóżka!? \n- To... skomplikowany problem. Choćbyśmy bardzo chcieli, nie możemy całkowicie go odciąć. \n- Szczerze mówiąc, przy całym szacunku do niego i jego dzieła, czekam już tylko na dzień, w którym odejdzie. \n- Janek, nie możesz mówić takich rzeczy. Wiesz, jak wiele mu zawdzięczamy. \n- Tak, a teraz stał się ciężarem. Jeśli mam wybrać między Rydzykiem a Kościołem, niech Maryja mi wybaczy, wybiorę ten drugi."
TOR.90.a: "Cierpliwość się kończy."

TOR.91.t: "[FROM.GetName] obiecuje nam pomoc!"
TOR.91.desc: "Władze państwa [FROM.GetName] obiecały przysłać nam broń i ochotników, gdy wystąpimy przeciw Rydzykowi."
TOR.91.a: "Jesteśmy wdzięczni za pomoc."

TOR.92.t: "Nadciąga pomoc od naszych stronników!"
TOR.92.desc: "Broń i ochotnicy obiecani przez naszych ideologicznych braci przybyli, by udzielić nam wsparcia!"
TOR.92.a: "Jesteśmy wdzięczni za pomoc."



























