TOR_ascensio: "Ascensio"

TOR_agony_desc: "Chwalmy Pana!\nDrodzy wierni! Z ciężkim sercem ogłaszamy, że stan zdrowia naszego czcigodnego Ojca Dyrektora się nie poprawia. \nNie lękajcie się jednak! \nNasz błogosławiony Pasterz nie pojawia się obecnie publicznie, gdyż w świętej ciszy modli się o wstawiennictwo Najwyższego Pana. \nWy także, drodzy słuchacze, powinniście modlić się za naszego wspaniałego Ojca Dyrektora. Niech Bóg okaże nam dość łaski, by nas wysłuchać! \nNa naszej cnotliwej ziemi wciąż pozostaje jednak wiele pracy! \nNie lękajmy się uczciwego trudu, Biblia mówi bowiem: \n\"Starajcie się zachować spokój, spełniać własne obowiązki i pracować własnymi rękami, jak to wam nakazaliśmy\"."
TOR_dont_wake_rydzyk_desc: "Niech Bóg was błogosławi! \nDrodzy chrześcijanie! Chcielibyśmy dziś przypomnieć o niezwykłym paśmie sukcesów, które dzięki naszej wspólnocie wszyscy zdołaliśmy osiągnąć. Czasem sam zdaję sobie sprawę, jak bardzo zmienił się Toruń - oczywiście na lepsze. \nBiblia mówi jednak: \"Bo nie ma na ziemi człowieka sprawiedliwego, który by zawsze dobrze czynił i nigdy nie zgrzeszył\". \nOjciec Dyrektor jest niewątpliwie zasłużonym i dobrym człowiekiem, lecz nawet tak chwalebne postacie zdarzają się potknięcia. \nNie kroczcie drogą nienawiści, bo każdy, kto tak czyni, jest obrzydliwością dla Pana - i \"kto jest bez grzechu, niech pierwszy rzuci kamieniem\". \nPrzyjmijcie zatem do wiadomości, że nadal jesteście w dobrych rękach. Uroczyście ślubujemy dalej postępować zgodnie z Prawem Bożym i miłością bliźniego!"
TOR_redraw_the_dioceses_desc: "Chryste, zmiłuj się nad nami! \nDrodzy wierni! Prawdziwy sługa Boga zawsze stoi wobec bezmiaru pracy i obowiązków - mamy nadzieję, że Bóg uzna za stosowne wynagrodzić nas za nie w Niebie. \nNie lękajmy się pracy, Biblia mówi bowiem: \"Każdy trud przynosi korzyści, a samo gadanie prowadzi jedynie do biedy\". Zostaliśmy powołani, by trudzić się i dźwigać ciężar obowiązku, gdyż nasz naród nadal wymaga wykorzenienia grzechu. \nOtrzymujemy rozmaite raporty potwierdzające, że pewne osoby nadzorujące diecezje MUSZĄ zostać usunięte. Konieczne są dokładne śledztwo i sprawiedliwa ocena obecnych lokalnych administratorów. \nDla Boga, dobra obywateli i państwa zburzymy stare, skorumpowane systemy, aby zastąpić je prawdziwie lojal... yyy, kompetentnymi!"
TOR_heathens_at_our_gates_desc: "Niech Bóg błogosławi was i Ojca!  \nWilki stoją u bram. Nasi wrogowie, wiecznie grzeszni i nieoświeceni, sądzą, że zdołają nas zaskoczyć. Gromadzą broń i bojowników, aby zadeptać pierwszy i ostatni prawdziwy przejaw czystej wiary, jakim jest nasz Święty Kościół. Nie lękajcie się jednak! Nasi dowódcy i logistycy są gotowi. Zgłoście się do najbliższego kapłana albo punktu werbunkowego - do tego, który znajduje się bliżej. Otrzymacie tam nowe powołanie odpowiadające waszym zdolnościom. Kościół przygotowuje się do nieuniknionej konfrontacji z sąsiednimi poganami. Niech obrzydzenie będzie naszą tarczą, pogarda pancerzem, a nienawiść mieczem!"
TOR_parish_conscription_lottery_desc: "Kto chce iść za Mną, niech weźmie swój krzyż i podąża za Mną! \nBracia, w przyszłą niedzielę możecie otrzymać niespodziewany list. W środku znajdą się wskazówki do najbliższego punktu werbunkowego. Gdy otrzymacie ten list, radujcie się w modlitwie, bo znaleźliście się wśród powołanych do walki w imię Boga. Zostawcie rodzinę, dobytek i ziemskie troski, weźcie swój krzyż i idźcie za Chrystusem. Radujcie się w bitwie! Z dumą odbierajcie i oddawajcie życie, jeśli tego się od was wymaga. A gdy dotrzecie do perłowych bram, gdzie przodkowie i bliscy będą czekać z uśmiechem, radujcie się ponownie. Znaleźliście się bowiem w Niebie, a Ojcu oddaliście już wszystko!"
TOR_some_sense_of_direction_desc: "Dostrzegłszy bezpośrednie zagrożenie wojną, Kościół doskonali i konsoliduje swoją strukturę dowodzenia. Wielu ludzi w naszych szeregach zdążyło już wykazać się umiejętnościami, drodzy słuchacze. Niewzruszone duchowieństwo, doświadczeni generałowie Wojska Polskiego, wierni żołnierze fortuny - każdy ma swoje regimenty i obowiązki. Wszyscy narzucają wolę Boga i bronią jej dla naszego zbawienia. Każdy ma jednak również własną strategię najlepszego wykonania tego zaszczytnego zadania. Nasze problemy rodzą się nie z niedostatku, lecz z nadmiaru możliwości. Przy odpowiednim przewodnictwie mogą jednak stać się zastępem równie potężnym jak najstraszliwsze z biblijnych armii."
TOR_in_marys_name_desc: "Pani Jasnogórska, jesteś naszym hetmanem. Jesteś Królową Polski i najwspanialszą matką. Błogosław swoje dzieci, prowadź je, zawsze zachowuj nasze dusze w czystości. Oddaj nasze życie Twojemu Synowi, a naszą broń zwycięstwu. \nPani Jasnogórska, jesteś naszym hetmanem. Jesteś Królową Polski i najwspanialszą matką. Bądź naszą tarczą, naszą egidą. Bądź schronieniem przed krzywdą. Bądź naszym celem, gdy wzywa święta wojna. \nPani Jasnogórska, jesteś naszym hetmanem. Jesteś Królową Polski i najwspanialszą matką..."
TOR_the_promise_of_prosperity_desc: "\"Nie samym chlebem żyje człowiek\"... cóż za mądre słowa wypowiedziane przez naszego Pana i Zbawiciela. Jego słowa są zawsze prawdziwe. Musimy jednak pamiętać, że często pozostają prawdziwe w znaczeniu metaforycznym. Dostrzegliśmy waszą pobożność i gotowość do poświęcenia się w imię narodu oraz religii... i to dobrze! Zauważyliśmy jednak coś jeszcze: wasze życie często jest pełne wyłącznie nędzy i smutku! Prawdą jest, że prawdziwe spełnienie czeka w Niebie, lecz nie oznacza to, że nasze materialne życie musi upływać w całkowitym ubóstwie! Pomnażajcie swoje talenty, ludzie! Być może wtedy nie tylko będziecie żyli lepiej, lecz także zdołacie dać Kościołowi jeszcze więcej!"
TOR_an_ode_to_mammon_desc: "Bracia i siostry, choć wielu obywateli mądrze przyjęło nasze nowe nauki, niektórzy nadal je odrzucają, uznając bogactwo pieniężne za sprzeczne z naszą sprawą... Nic bardziej mylnego! Jak wkrótce się przekonacie, bogactwo jest w pełni zgodne z dobrym chrześcijańskim kultem! Kogo obchodzi, że ksiądz ma siedem drogich samochodów, po jednym na każdy dzień tygodnia, jeśli wygłasza wspaniałe kazania o wyrzeczeniu i porzuceniu pychy? Absolutnie nikogo przy zdrowych zmysłach, powiadam wam!"
TOR_father_director_charity_fund_desc: "Wiemy, że mimo naszych zachęt nie wszystkim powodzi się tak dobrze, jak mogłoby... na szczęście ta niesprawiedliwość zostanie naprawiona właśnie teraz! Niniejszym ogłaszamy powstanie Funduszu Dobroczynnego Ojca Dyrektora, który pomoże potrzebującym i wydobędzie ich z ubóstwa, aby mogli wnosić wkład w społeczeństwo tak samo jak zamożniejsi bracia! Jak ogłosił nasz Pan Bóg: \"błogosławieni płaczący, albowiem ich duch zostanie podniesiony!\", a dzięki hojności Ojca Dyrektora tak właśnie się stanie!"
TOR_even_in_death_desc: "Słyszymy wasze pełne smutku zawodzenie, słyszymy, jak cierpicie w ubóstwie... naprawdę. Prawdziwa cnota nie rodzi się jednak z jałmużny, lecz z pomyślnego przezwyciężenia osobistych trudności. Powiedzcie mi, bracia, kto bardziej zasługuje na fundusze w tak ciężkich czasach niż sam Kościół? Być może w przyszłości zdołamy wam pomóc, lecz ten stan jeszcze się nie ziścił. Na razie wasze zmagania są wyłącznie wasze. Ojciec Dyrektor głęboko przeprasza za ten stan rzeczy. Obiecujemy, przyszłość będzie jaśniejsza. Zawsze będzie jaśniejsza. Obiecujemy."
TOR_ask_and_you_should_receive_desc: "Choć metody Ojca Dyrektora są sprawiedliwe, zwłaszcza biorąc pod uwagę naszą sprawę, musimy także - jak wcześniej - pamiętać o materialnych warunkach obywateli... w czym Ojciec Król z największą chęcią pomoże! Dziś wszyscy zarejestrowani parafianie będą mogli swobodnie zadzwonić do rozgłośni i przedstawić potrzeby finansowe własne oraz swojej wspólnoty. Jeśli wasze prośby będą rozsądne, osobiście udzieli wam rady i pomocy pieniężnej oraz zanotuje inwestycje, które przyniosą największą korzyść całemu zgromadzeniu. Nie bójcie się dzwonić, ludzie! Nie chcecie przegapić tej jedynej w życiu okazji!"
TOR_routes_of_st_jacob_desc: "Dzisiejszą audycję chcielibyśmy rozpocząć od krótkiego segmentu informacyjnego dla słuchaczy: błogosławiona ziemia kujawska leży na skrzyżowaniu kilku Dróg św. Jakuba, które - jak zapewne już wiecie - są najważniejszymi szlakami pielgrzymkowymi w całej Europie. W związku z tym pragniemy ogłosić, że dopilnujemy, aby na naszych ziemiach żaden pielgrzym nie chodził głodny, nie pozostał bez miejsca do spania ani, co gorsza, bez możliwości zakupienia rozmaitych dewocjonaliów i pamiątek na drogę! W końcu takie przedsięwzięcie jest trudne, zwłaszcza w dzisiejszych czasach, i aby dotrzeć do celu, trzeba otrzymać podczas niego jak najwięcej pomocy!"
TOR_our_spot_on_the_pilgrimage_map_desc: "Drodzy słuchacze, choć stada pielgrzymów już przemierzają nasz region - być może sami je widzieliście - nie ma powodu, by błogosławione ziemie Kujaw pozostały jedynie przystankiem zamiast miejscem docelowym. Ojciec Dyrektor w swojej mądrości ogłasza projekt, który przyciągnie gości ze wszystkich zakątków Ziemi: hojną inwestycję w nasze instytucje religijne i dodatkowe obiekty, które uczynią z nich atrakcję nie tylko dla najpobożniejszych, lecz także dla całych rodzin. Wkrótce nasze terytorium będzie uznawane za najsłynniejszy cel pielgrzymek w kraju. A każda złotówka wydana w naszych granicach zasili naszą prawą sprawę."
TOR_just_another_product_desc: "Przechodzimy teraz do segmentu sponsorowanego, możliwego dzięki dobroczynnej darowiźnie CassockShare, największego sprzedawcy odzieży religijnej, z dumą przedstawiającego nową kolekcję letnią. Pomnik Maryi w Konotopiu został rozbudowany o zupełnie nowy taras widokowy, który może jednocześnie pomieścić 50 gości. Bilety można kupić w kasie albo na stronie internetowej pomnika. Bracia i siostry, czy kiedykolwiek chcieliście osobiście spotkać Ojca Króla? Oczywiście, że tak. Teraz dzięki kodowi \"Rydzyk\" osoby odwiedzające nas po raz pierwszy otrzymają 50% zniżki. Rezerwujcie, póki oferta trwa, na meetjankrol.tor!"
TOR_monastery_hotels_desc: "Wszyscy znamy chrześcijańską gościnność, bracia i siostry. Nasze kościoły oraz klasztory zbyt długo pozostawały jednak nieprzyjazne dla odwiedzających. Wszyscy wierni zasługują na miejsce do spania, pełny talerz strawy i duchową pociechę podczas podróży. Ci spośród nas, którzy nie biorą udziału w cotygodniowej ewangelizacji, będą zamiast tego pracować nad rozciągnięciem tej gościnności na szerszą wspólnotę. Dom nie należy tylko do nas, lecz do Boga i Kościoła Powszechnego. Nie możemy samolubnie zatrzymywać go dla siebie."
TOR_the_waiting_game_desc: "W kwestii gospodarki redakcja z radością ogłasza: dokonaliśmy kolejnego cudu gospodarczego! Nasze skarbce pękają w szwach, gotowe finansować przyszłe plany, a dzięki oddaniu takich ludzi jak wy strumień codziennie napływających funduszy zdaje się nie mieć końca! Niech Bóg was wszystkich błogosławi, bo wraz z duchowym wzrostem budujecie nową Ziemię Świętą! Z innych wiadomości, Ojciec Dyrektor ma się... dobrze... yyy... tak? Och, w porządku... Z innych wiadomości, Ojciec Dyrektor ma się świetnie!"
TOR_a_vow_of_silence_desc: "\"Nawet głupi, gdy milczy, uchodzi za mądrego; kto zamyka usta - za rozumnego\". \nDzisiejsze kazanie radiowe rozpoczynam dość surowym cytatem z Księgi Przysłów. Kto chciałby przyznać się do głupoty? Kto chciałby stawiać sobie poprzeczkę tak nisko? W chwilach zwątpienia pamiętajcie o słowach świętego Pawła: \"Niechaj się nikt nie łudzi. Jeśli ktoś spośród was mniema, że jest mądry na tym świecie, niech się stanie głupim, by posiadł mądrość... Mądrość bowiem tego świata jest głupstwem u Boga\". \nCzasami rzeczy nie są tym, czym się wydają. Czasem możecie pragnąć przemówić z gorliwością i pośpiechem świętego Piotra, by ujawnić zło. Pamiętajcie, ktoś może wami manipulować, abyście szerzyli wśród niczego niepodejrzewających ludzi fałszywą Ewangelię, pogłoski i kłamstwa. Zastanówcie się dwanaście razy, zanim zapragniecie ujawnić czyjś sekret. Zwykle najlepiej zachować milczenie albo natychmiast skontaktować się z mądrymi i odpowiedzialnymi osobami: kapłanami bądź innymi funkcjonariuszami egzekwującymi cnotę, zależnie od charakteru waszego wyznania."
TOR_divine_exaltation_desc: "Dzień Pański jest bliski! Za przygotowanie nas na nadchodzącą burzę musimy podziękować pobożnym kapłanom, zwłaszcza Ojcu Tadeuszowi Rydzykowi i Ojcu Janowi Królowi - Mojżeszowi i Aaronowi naszych czasów! Jak mogliście usłyszeć w ostatnich tygodniach, liczba modlitw za Ojca Króla wzrosła lawinowo, lecz nie oznacza to, że wbija to klin między obu mężczyzn. \nPodobnie jak Mojżesz i jego brat Aaron, Ojcowie Tadeusz i Jan są nierozłączni. Pierwszy doprowadził Izraelitów do Ziemi Obiecanej i przekazał im przykazania otrzymane od Pana. Aaron i jego ród podtrzymywali zaś Prawo i byli pasterzami przyszłych pokoleń. Stanowią jedną całość, a każdy, kto spróbuje ich rozdzielić, przekona się o daremności tego niszczycielskiego zamiaru."
TOR_embrace_the_darker_ages_desc: "Gdy Kościół Kujaw pozostaje niepodzielny, zanosimy modlitwy do Ojca Tadeusza - Dyrektora naszych dusz! Bez względu na stan jego zdrowia, czy umrze za 4 lata, czy za 40, będzie nadal czuwał nad nami z Nieba. Modlimy się, aby jego wizja ludzkości pozostała niezmieniona, zgodnie z jego zamysłem. Będziemy go naśladować, podążając za przykładem skromnej przeszłości. Dzięki jego naukom pozostaniemy czyści i wierni. Prawdziwi głupcy Chrystusa. \nBędziemy strażnikami spuścizny redemptorystów, chroniąc ją przed niezliczonymi herezjami, które spróbują nas skazić."
TOR_miracle_factory_desc: "W tych trudnych czasach naznaczonych pogarszającym się zdrowiem Ojca Dyrektora zgłoszono liczne nadprzyrodzone zjawiska. Na przykład po przedłużającej się suszy rozpaczliwe modlitwy rolników zostały wysłuchane i przez trzy dni oraz trzy noce bez przerwy padał deszcz. Rolnicy obawiali się, że tak gwałtowne opady zaleją rośliny i zniszczą plony. Stało się wręcz przeciwnie: warzywa rozkwitły, a pszenica wyrosła wyżej niż kiedykolwiek. Gdy ulewa minęła, ludzie dostrzegli tęczę sięgającą z nieba ku jednemu z kościołów świętego Tadeusza, niedawno wzniesionemu na polecenie Ojca Tadeusza Rydzyka - wyraźny znak boskiej opatrzności nad naszym ukochanym Ojcem Dyrektorem. Teologowie spodziewają się w przyszłości kolejnych cudownych wydarzeń związanych z Ojcem Tadeuszem."
TOR_joining_the_pantheon_desc: "Gdy Jezus powierzył ducha w ręce Ojca, oddał swoją matkę pod opiekę umiłowanego ucznia - Jana. Tak jak w przeszłości Matka Boża w swej nieomylności potrzebuje ziemskiej ochrony przed tymi, którzy chcieliby splamić jej chwałę. Ojciec Tadeusz bez wątpienia jest godny przyjąć płaszcz Umiłowanego Ucznia Jezusa. Jest nowym Janem Apostołem, gotowym opiekować się Maryją i jej spuścizną, skoro już wsławił jej imię za pomocą programu radiowego i kazań jak żaden człowiek przed nim. \nTak spektakularne osiągnięcie wymaga godnego upamiętnienia. Obok istniejącego posągu Maryi stanie nowy pomnik Ojca Rydzyka. Oba otrzymają tablice z fragmentami Biblii podkreślającymi ciągłość tradycji. \"Niewiasto, oto syn Twój\" dla Ojca Tadeusza i \"Oto Matka twoja\" dla Maryi."
TOR_a_new_vision_for_the_church_desc: "Gdy Kościół w Toruniu pozostaje niepodzielny, zanosimy modlitwy za Ojca Króla - niech nieustannie udziela Ojcu Dyrektorowi dobrych rad, inspirując go do stosowania nowoczesnych rozwiązań dzisiejszych problemów. Niech jego pomysłowe inwestycje przynoszą korzyść nam wszystkim. Niech dzięki jego talentowi do technologii Radio Maryja dociera do najdalszych zakątków Ziemi, rozpalając płomień wiary w ludzkich sercach. \nMając u boku Ojca Rydzyka tak mądrego doradcę, możemy patrzeć w przyszłość z kojącą pewnością, przekonani o bezpieczeństwie i wzroście naszej wspólnoty, wiedząc, że Ojciec Jan Król potrafi prowadzić nas ku przyszłości jak prawdziwy Król."
TOR_breaking_the_ceremonial_desc: "Grzechem najbardziej rozpowszechnionym wśród duchowieństwa jest pycha. Przejawia się u księży, którzy przedkładają kościelne ozdoby, wzniosłą rozwlekłość i zakurzone zwyczaje ponad wiernych. Parafianie uważają powtarzalność i sztywność mszy za nieprzystępne. Ojciec Jan w swej mądrości zasugerował wprowadzenie odrobiny różnorodności do niedzielnych spotkań. Księża obdarzeni talentem muzycznym mogą spróbować wzbogacić homilie gitarą. Niestety nie wszyscy duchowni otrzymali takie zdolności w darze. Każdy może jednak wprowadzić proste kreatywne przedstawienie albo przynieść magnetofon z żywą muzyką. Jeśli niektórzy kapłani okazali się zbyt staroświeccy, by nadążyć za czasami, Ojciec Król zachęca ich, by poprosili o pomoc ministrantów, a nawet zwykłych parafian."
TOR_no_false_messiahs_desc: "Niech będzie pochwalony Jezus Chrystus, drodzy słuchacze. W dzisiejszej audycji pragnę poruszyć temat doktryny. Świętych. Niektórzy wrogowie Kościoła oskarżają katolików o oddawanie czci istotom innym niż Bóg, na przykład świętym albo Dziewicy Maryi. Katolicy rzeczywiście modlą się do Maryi i świętych, lecz nie czynią tego, by ich wielbić, ale by prosić o wstawiennictwo, tak jak prosilibyśmy współwyznawców żyjących na Ziemi. Szczególnie cenimy świętych ze względu na ich bliskość z Bogiem. \nChoć krytycy Kościoła wyraźnie się mylą, w naszej pokorze musimy dostrzec drzazgę w oczach członków własnej wspólnoty. Niestety niektórzy praktykujący tak mocno skupiają się na świętych, że zdają się zapominać o Bogu. Uważajcie, by nie popaść w bałwochwalstwo. \n\"Nie będziesz miał bogów cudzych przede Mną\".\nPamiętajcie, żaden człowiek nie zasługuje na to, by oddawać mu boską cześć."
TOR_clearing_the_name_desc: "Jak bezgraniczna jest ludzka niewdzięczność! Mimo ewangelizacyjnej działalności Radia Maryja są ludzie twierdzący, że niszczymy wizerunek Kościoła. \nMimo dobroczynności Lux Veritatis są ludzie oskarżający organizację o chciwość. \nMimo ochoczego udziału kapłanów w naszej posłudze duszpasterskiej są ludzie oskarżający ich o cynizm. \nTo nie przypadek, że głosy te stają się głośniejsze właśnie wtedy, gdy stawiamy pierwszy udany krok ku ponownemu zjednoczeniu ojczyzny, a nasz pasterz znajduje się w tak ciężkim stanie. To oczywiście skoordynowane działanie mające udaremnić naszą szlachetną misję. Jako agenci obcych interesów kłamcy ci muszą zostać uciszeni wszelkimi koniecznymi sposobami."
TOR_a_letter_to_the_faithful_desc: "Drodzy słuchacze, nadszedł mroczny dzień. Ojciec Tadeusz Rydzyk odszedł na Łono Abrahama. Nim wypowiem słowa modlitwy czy złożę kondolencje, pozwólcie mi przeczytać list napisany przez Ojca Dyrektora na łożu śmierci: \n\n\"Bracia i siostry w Chrystusie,\nGdy będziecie to czytać, nie będę już kroczył z wami przez ten padół łez. Opuszczenie was w chwili, gdy wciąż tak wiele pozostaje do zrobienia, głęboko mnie boli. Wygląda na to, że w oczach Boga uczyniłem na tym świecie dość dobra i nadeszła pora na zasłużony odpoczynek.\nNiektórzy mogą obawiać się, że moi następcy nie zdołają kontynuować mojej misji, lecz niestety...\"\n\nProszę o wybaczenie, otrzymuję pilny telefon.\n...\nJak to \"on wciąż żyje\"?"
TOR_mourners_and_believers_desc: "Chwała Panu na Niebiosach! \nDrodzy bracia i siostry! \nUwaga! Nie ma powodów do obaw! \nPowtarzam! Nie ma powodów do obaw! \nBłogosławiony Ojciec Dyrektor żyje! Nie opłakujcie go, gdyż wasz smutek jest niepotrzebny. On żyje! \nMusimy jednak przyznać, że w pewnym sensie widok tysięcy wiernych gotowych poświęcić czas i duchową siłę na zbiorowe oddawanie czci Ojcu Dyrektorowi porusza nasze serca. \nZaprawdę wasze oddanie na nowo utwierdza nas w przekonaniu, że Bóg jest pośród nas! Prowadzi lud Chrystusa i poprzez jego czyny objawia się na tym świecie! Skąd indziej mogłaby płynąć taka wzajemna miłość?\nBiblia mówi: \"Błogosławieni, którzy się smucą, albowiem oni będą pocieszeni\". \nAle nie smućcie się - bo on żyje!"
TOR_blessed_be_the_trusting_desc: "Niech Bóg was błogosławi! \nDrodzy wierni! Tym razem rozpoczniemy od słów Ewangelii według św. Jana: \"Błogosławieni, którzy nie widzieli, a uwierzyli\". \nZe szczerym zamiarem wzywamy was, byście prawdziwie zrozumieli ten fragment. Niestety niektórzy spośród was - wiernych - zapomnieli, co znaczy święte słowo kapłana. Sami sprowadzacie się na manowce, zawierzając wzajemnym fałszom i ignorując prawdę wypowiadaną przez duchowieństwo! \nOjciec Dyrektor żyje i błogosławieni ci, którzy wierzą w tę prawdę! \nZaprawdę niektórzy okazują nikczemny egoizm i gnuśność, wątpiąc w Ojca Dyrektora. Nasz Pasterz przebywa w samotności, oddając się kontemplacji i modlitwie! \nTAK! Do was wszystkich, wątpiących! \nGdybyście tylko potrafili pojąć bliskość Boga, w której mieszka teraz Ojciec Dyrektor, oraz to, co widzi - czego zwykły człowiek nie może dostrzec - nie rzucalibyście tak łatwo kłamliwych słów!"
TOR_the_deathbed_audience_desc: "Natchnij nas, Chryste! \nDrodzy wierni! Już wkrótce dostąpicie wielkiego zaszczytu ujrzenia czcigodnego Ojca Dyrektora w całym jego majestacie. \nSmuci nas jednak, że wielu z was zbłądziło i zaczęło przypominać biblijnego niewiernego Tomasza. \nPewni szaleńcy i wywrotowcy rozpowszechnili fałszywe informacje o rzekomej śmierci Ojca Dyrektora. \nHańba wam! \nTylko Bóg może wam teraz wybaczyć tak ciężki grzech przeciwko Jego chwalebnemu Słudze. \nAby uspokoić wątpiących, błogosławiony Ojciec Dyrektor postanowił ukazać się wam - wiernym. \nOstrzegamy jednak! To dusza czyni człowieka, nie jego kruche ciało. \nNasz Pasterz mierzy się z pewnymi problemami zdrowotnymi, lecz pozostaje w pełni sprawny - zwłaszcza na umyśle i duchu. \nNie sądźcie, abyście nie byli sądzeni!"
TOR_ascensio_desc: "Panie, módl się za nami grzesznymi, teraz i w godzinę śmierci naszej. \nUmiłowani bracia... nieuniknione stało się faktem. Otwarcie potwierdzamy bolesną wiadomość, że nasz czcigodny Ojciec Dyrektor odszedł na dobre - nie ma go już pośród nas. \nŻałoba nieuchronnie dotarła nawet do nas, gdyż odejście tak wspaniałej postaci pozostawiło prawdziwą pustkę. Bez wątpienia jest to niezmierzona strata dla ludzkości i wiernych na Ziemi. \nBiblia przynosi nam jednak pocieszenie. To dopiero początek podróży - a teraz, za lata służby, Ojciec Rydzyk z pewnością zakosztuje rozkoszy zasłużonego Raju.\n\"Umarł w późnej, lecz szczęśliwej starości, syt życia, bogactwa i sławy [...]\" - tak będziemy wspominać Cię w naszych sercach. \nZawsze pogodnego, uczciwego, sprawiedliwego, pomocnego... prawdziwego chrześcijanina swoich czasów... \nMódlmy się za niego... \nAMEN!"

