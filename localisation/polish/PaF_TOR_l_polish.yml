rydzyk_tooltip: "§YŚwiętość§! odzwierciedla opinię społeczeństwa o §YOjcu Rydzyku i jego projekcie religijnym§!. Jest wartością dynamiczną, obliczaną co tydzień.\n\n§YW naturalny sposób dąży §g(o +/-0,05)§! do punktu równowagi§!, a jej tymczasowe lub trwałe zaburzenie będzie wymagało wydania dodatkowych zasobów.\n\n §YPunkt równowagi:§! [?TOR_holiness_equilibrium_var]\n\n\n§RPunkty HP§! odzwierciedlają natomiast §Ysamego Ojca Rydzyka§! oraz jego zdolność do osobistego nadzorowania aparatu państwowego i wydawania mu poleceń.\n\n§RHP jest resetowane co 90 dni wraz ze wszystkimi decyzjami podjętymi w tym czasie.§!"
TOR_rydzyk_ded_flag: "§RStan Ojca Rydzyka jest zbyt ciężki, by mógł przewodzić naszemu państwu.§!"
