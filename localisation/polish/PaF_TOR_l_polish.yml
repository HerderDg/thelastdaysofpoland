# Idee narodowe #

taxes_collection_plate: "Gospodarka tacowa"

TOR_unequal_trinity: "Nierówna Trójca"
TOR_unequal_trinity_desc: "Toruńską anarchię definiowała nieustannie zmieniająca się mozaika sojuszy, lecz tylko jeden zdołał przetrwać konflikt. Koalicja ocalałych ugrupowań prawicowych podporządkowała sobie całą opozycję w mieście i obecnie stanowi jego jedyną, niekwestionowaną władzę. Na papierze zaangażowane siły pozostają równe; w praktyce nic bardziej mylnego. Ojciec Rydzyk nie należy do ludzi szczególnie skłonnych dzielić się władzą. Jego partnerzy albo podporządkują mu się bezwarunkowo, albo narastające napięcia i niezadowolenie zepchniętych na margines rozsadzą pieczołowicie utrzymywaną fasadę jedności."

TOR_rozjebalo_miasto1: "Zgliszcza anarchii"
TOR_rozjebalo_miasto1_desc: "Po przedłużającej się wojnie domowej nie można spodziewać się niczego poza miastem w ruinach - i tym razem nie było inaczej. Zniszczenie przetoczyło się przez cały kraj, lecz Toruń doświadczył jednych z najcięższych walk po Upadku. Kościół stoi teraz na stercie gruzów i ciąży na nim obowiązek przywrócenia miastu dawnej świetności. Aby jednak ponownie stało się historyczną perłą regionu, potrzebuje wiele czasu... i pieniędzy. Zwłaszcza pieniędzy. Udręczeni mieszkańcy mogą wkrótce odkryć, że ich duchowi opiekunowie niespecjalnie chcą rozstawać się ze swoimi funduszami. Jeśli pragną uleczyć rany po dniach anarchii, być może sami będą musieli wziąć na siebie większość wysiłku."

TOR_rozjebalo_miasto2: "Zgliszcza anarchii"
TOR_rozjebalo_miasto2_desc: "Dzięki ogromnemu wysiłkowi ruiny Torunia powoli zaczynają przypominać piękne miasto, którym niegdyś były. Poświęcenie mieszkańców nie idzie na marne, a środki przeznaczone na odbudowę przynoszą owoce. Wspólna praca nad przywróceniem miasta do życia jednoczy lud wokół jednego celu. Sukces stanowi niezaprzeczalny zastrzyk legitymizacji dla Ojca Dyrektora, który może ponownie kreować się na zbawcę ludu. A skoro odbudowa idzie tak dobrze, chyba nic się nie stanie, jeśli odrobinę uszczknie się dla siebie. Jak zawsze w słusznej sprawie..."

TOR_radio_maryja_start: "Radio Maryja"
TOR_radio_maryja_start_desc: "Głos Radia Maryja dociera do wszystkich, którzy pragną słuchać. Przenośne odbiorniki budzą słuchaczy uspokajającymi kazaniami. Płomienie w sercach wiernych rozpalają się na nowo z każdą kolejną modlitwą. W rezultacie liczba ludzi gotowych wypełniać wolę Boga rośnie lawinowo, podobnie jak ich oddanie i niezachwiana wiara w zasady Kościoła. \n\nA jednak nawet to święte miejsce może zostać skażone. Ponieważ heretycy desperacko bronią swojej ostatniej reduty wewnątrz rozgłośni, Radio Maryja zostało zmuszone do nadawania programu na częstotliwościach zapasowych. Ze studia emisyjnego nadal wylewają się szkodliwe słowa, a nieświadomi słuchacze, którzy zapomnieli przestroić odbiorniki, mogą zostać wystawieni na herezję."

TOR_radio_maryja: "Radio Maryja"
TOR_radio_maryja_desc: "Głos Radia Maryja dociera do wszystkich, którzy pragną słuchać. Przenośne odbiorniki budzą słuchaczy uspokajającymi kazaniami. Płomienie w sercach wiernych rozpalają się na nowo z każdą kolejną modlitwą. W rezultacie liczba ludzi gotowych wypełniać wolę Boga rośnie lawinowo, podobnie jak ich oddanie i niezachwiana wiara w zasady Kościoła. \n\nGdy Ojciec Rydzyk ponownie mocno trzyma w rękach swój drugi ulubiony wycinek eteru, może raz jeszcze prowadzić pokorną trzodę ścieżką zbawienia i zwoływać żołnierzy Chrystusa do walki z wrogami prawdziwej wiary. Jakąkolwiek retorykę trzeba będzie wtłoczyć do ludzkich umysłów, Radio Maryja z radością umieści ją w programie i będzie powtarzać, aż stanie się niepodważalną prawdą."

TOR_zawierzenie_maryji: "Królestwo Maryi"
TOR_zawierzenie_maryji_desc: "Matko Boża, Królowo Kujaw, z głębi naszych serc całkowicie zawierzamy się Tobie. Z niezachwianą wiarą powierzamy Twej czułej opiece nie tylko własne dusze, lecz także ducha całego regionu. Z pokorą prosimy o wsparcie w codziennych trudach. Umocnij naszą wiarę i rozpal na nowo naszą nadzieję. \n\nProwadź nas w drodze ku świętości i oświetlaj nasz szlak, gdy budujemy święte państwo na Kujawach. Zawierzamy Ci naszą przeszłość, teraźniejszość i przyszłość, niewzruszenie wierząc, że pod Twą troskliwą opieką odnajdziemy pokój i prawdziwe szczęście. \n\nAmen."

TOR_vices_idea: "Występki"
TOR_vices_idea_desc: "Wojna domowa jest bez wątpienia najgorszym ze wszystkich możliwych rodzajów konfliktu. Toruń i jego okolice nie uniknęły konsekwencji własnej historii. Anarchia spustoszyła nie tylko materialne otoczenie, lecz także umysły mieszkańców. Korupcja, podejrzliwość, partykularyzm. Panuje atmosfera niekończących się konfliktów, nieporozumień i nienawiści. Prawość pogrzebano głęboko pod gruzami zniszczonych domów. Zwycięzcy wychodzą zaś z walki z głęboką moralną blizną obciążającą ich serca. Czy kiedykolwiek zdołają oczyścić się z ciężaru swoich grzechów?"

TOR_smile_and_wave_idea: "Wojna w Niebiosach"
TOR_smile_and_wave_idea_desc: "Wyrzucony z Trójcy Mentzen pozostaje problematyczną postacią dla kościelnego establishmentu. Jego podstawowe grupy wyborców pozostają mu zaciekle lojalne i dopóki stosunki między nami są chłodne, wielu zwolenników będzie potępiać jego rzekomo niesprawiedliwe skazanie na zapomnienie. Na szczęście dzięki potulnemu podejściu przywódcy masy powstrzymują się od wszczynania jakiejkolwiek zbrojnej rebelii, lecz kampania obywatelskiego nieposłuszeństwa nadal trwa. Lucyferze, dlaczego nie mogłeś po prostu zaakceptować swojego miejsca w Niebie?"

TOR_usuwanie_laikow: "Administracja kościelna"
TOR_usuwanie_laikow_desc: "Uznawszy, że ważnych stanowisk w aparacie administracyjnym nie można powierzać ludziom, którzy nie służą przede wszystkim Bogu, Ojciec Rydzyk nakazał masowo zastąpić świeckich kościelnymi nominatami. To, czy dekret jest dowodem religijnego żaru, czy tylko kolejnym fortelem mającym zwiększyć jego kontrolę nad każdym aspektem codziennego życia, pozostawiono głównie osądowi odbiorców ogłoszenia - a w niektórych przypadkach tysiącom urzędników i administratorów, którym kazano natychmiast wstąpić do seminarium albo znaleźć sobie nowe zajęcie."

TOR_Woe_Corrupters: "Bastion przeciw dewiacji"
TOR_Woe_Corrupters_desc: "Alternatywne style życia, alternatywne orientacje seksualne, alternatywne tożsamości. Jakby tego było mało, jeszcze wymuszona normalizacja rozwiązłości i degeneracji. Wszystkie te niegodziwości wspierali nazbyt tolerancyjni sekularyści. Dlaczego społeczeństwo oddane zbawieniu miałoby poświęcać im choć odrobinę uwagi? Spójrzcie, jak ból, pot i rozszerzone przesłuchania uzdrawiają moralnych wyrzutków, i radujcie się z nadchodzącego zbawienia ich dusz."

TOR_Cassocks: "Zgnilizna od środka"
TOR_Cassocks_desc: "Słowa o moralnej czystości, tak żarliwie głoszone z kościelnych ambon, niewiele znaczą dla tych, którzy rzekomo przewodzą wspólnotom własnym przykładem. Tadeusz Rydzyk wraz ze swoim najbliższym kręgiem w pełni toleruje etyczne i duchowe rozpasanie księży, dopóki pozostaje ono za zamkniętymi drzwiami. Ojciec Dyrektor skrupulatnie pilnuje, by żadne kościelne skandale nie przedostały się do opinii publicznej, bo natychmiast zaszkodziłyby także jemu. Wiernych traktuje się zgodnie z zasadą: \"Czego oczy nie widzą, tego sercu nie żal\"."

TOR_sowing_the_grains_idea: "Niechętne inwestycje"
TOR_sowing_the_grains_idea_desc: "Aby uruchomić gospodarkę Kościoła na ruinach zniszczonego wojną miasta, położonego w samym środku jeszcze bardziej zrujnowanego kraju, trzeba sięgnąć do głębokich skarbców redemptorystów, mimo protestów bardziej materialistycznie nastawionych członków duchowieństwa. Surowy kapitał jest najprostszym sposobem na zgromadzenie siły roboczej i materiałów potrzebnych do szybkiej odbudowy, a zwrot powinien nadejść stosunkowo szybko. Jeśli nie, z radością odbiorą każdą pojedynczą złotówkę."

TOR_berets: "Bataliony beretów"
TOR_berets_desc: "Siły zbrojne Kościoła nie dyskryminują już ze względu na wiek. Nawet jeśli masz 72 lata, a ze służbami specjalnymi łączy cię jedynie kształt beretu - jesteś przyjęty. Powstałe w ten sposób bataliony krajowych seniorów są uzbrojone tylko w teorii, wyszkolone tylko w teorii i tylko w teorii potrafią się przemieszczać lub prowadzić walkę, ale przynajmniej są tanie i łatwe do zastąpienia. Czasem tylko to się liczy. Większość tych formacji nigdy nie ujrzy pola bitwy i będzie służyć głównie jako garnizony oraz jednostki porządkowe, lecz jeśli sytuacja kiedykolwiek stanie się na tyle rozpaczliwa, by wysłać je na front... niech Bóg ma nas wszystkich w swojej opiece..."

TOR_offering_idea: "Finansowanie naszej krucjaty"
TOR_offering_idea_desc: "Kościół zarządził zbiórkę dodatkowych ofiar na czas wojny. Gdy stawką jest przetrwanie całej wspólnoty, liczy się każdy datek, a kapłani nie cofną się przed niczym, by wrzucić w ogień jeszcze więcej pieniędzy. Gotówka, wyposażenie, żołnierze, czasem nawet część własnego majątku duchowieństwa... Gdy zostaje się przypartym do muru, żadna cena nie jest zbyt wysoka. Wyznawcy Maryi nie poddadzą się bez walki. Nie zanim całkowicie ogołocą swoje oszczędności."

TOR_contractors: "Najemni krzyżowcy"
TOR_contractors_desc: "Wojnę najlepiej pozostawić zawodowcom. A gdy brakuje miejscowych specjalistów, zamiast zadowalać się wręczaniem broni każdemu geriatrycznemu ochotnikowi i wysyłać go na śmierć, siły zbrojne sprowadzają ludzi gotowych walczyć dla tego, kto zapłaci najwięcej. Czasem jakiś żołnierz dostrzeże światło Pana i dorzuci do tego religijny zapał, lecz zazwyczaj motywacją pozostają pieniądze. Takie rozwiązanie jest jednak kosztowne, nawet dla kogoś tak dobrze finansowanego jak Rydzyk. Musimy pamiętać, że nasz skarbiec nie jest bez dna. W przeciwnym razie wszyscy ci \"krzyżowcy\" szybko odwrócą się na pięcie i odejdą gdzie indziej."

TOR_paying_contractors: "Parafialne finansowanie najemników"
TOR_paying_contractors_desc: "Nasz drogi korpus najemników sam się nie sfinansuje. Aby zmniejszyć obciążenie skarbca, każdej parafii przydzielimy konkretną jednostkę, którą będzie utrzymywać, oraz możliwość śledzenia jej postępów podczas kampanii. Wszystkie mundury i wyposażenie zostaną oznaczone insygniami odpowiedniego kościoła i pobłogosławione przez miejscowego kapłana. Wyniki sponsorowanej formacji będą szczegółowo odczytywane podczas każdej niedzielnej mszy, wraz z jej pozycją na regularnie aktualizowanej liście rankingowej. Jeśli rywalizująca parafia zajmie wyższe miejsce, wszyscy zostaną o tym otwarcie poinformowani. W końcu dodatkowe fundusze powinny pomóc wyprzedzić ją następnym razem."

TOR_women: "Odrzuć nowoczesność, przyjmij tradycję"
TOR_women_desc: "Tradycje przechowują mądrość minionych epok. Przyjąć je oznacza ponownie zaakceptować cnotę, od której świat się odwrócił. Nowoczesność jest zaś naczyniem grzechu. Prowadzi do moralnego upadku całej ludności. Wielu zbłąkanych niewolników \"nowych obyczajów\" powróciło w objęcia wiary. Niektórzy niestety nadal się opierają, lecz radujemy się na widok każdego nawróconego. Proste życie zbliża człowieka do Boga, zapewniając mu zarazem duchowy pokój i szczęście."

TOR_30_million_silver_idea: "Grzeszni ciułacze"
TOR_30_million_silver_idea_desc: "Ci, którzy tkwią po uszy w grzechu, nie widzą powodu, by próbować wyrwać się z jego objęć. Choć niewiele obchodzi nas kilku niewdzięcznych wyrzutków skazujących się na wieczną mękę, każda ofiara, której nie chcą złożyć do kościelnego skarbca, pozostawia w nim pustkę, której nigdy nie zdołamy wypełnić. Nawet jeśli nie potrafimy uczynić z nich prawych chrześcijan, musimy odebrać to, co słusznie nam się należy. Bez wyjątków."

TOR_30_million_silver_idea_prod: "Nieposłuszni finansiści"
TOR_30_million_silver_idea_prod_desc: "Kapitalista jest przede wszystkim sługą Mamony. Dba wyłącznie o własne wzbogacenie i zapomina o zwiększaniu wartości swojej duszy w oczach Pana. Nie dostrzega, jaką wartość miałyby jego przedsiębiorstwa, gdyby ich dochody służyły wyższemu celowi. Pozna prawdziwą wartość pieniędzy, gdy straci wszystko. Już wkrótce. Na razie jednak reprezentuje część gospodarki, która pozostaje poza naszym zasięgiem. Taka niesprawiedliwość nie może trwać."

TOR_provincial_broadcasting_idea: "Nie będziesz miał innych rozgłośni przede Mną"
TOR_provincial_broadcasting_idea_desc: "Słowo Boże dociera wszędzie; głos Radia Maryja - tylko tam, dokąd sięga sygnał. Aby nasza ewangelia nie była słyszana wyłącznie w niewielkiej bańce skupionej wokół Torunia, musimy zbudować dodatkowe ośrodki nadawcze i zróżnicować dostępne media. Nie może istnieć skrawek terytorium pozbawiony naszych usług. Nie może być też innych usług niż te, które zapewniamy. Jedna rozgłośnia, jedna nieomylna prawda. Kto mógłby chcieć czegoś więcej? Nie, naprawdę, będziemy wiedzieć, jeśli nie jesteście zadowoleni. Mamy swoje sposoby."

TOR_gentle_nudge_idea: "(Nie)dobrowolne ofiary"
TOR_gentle_nudge_idea_desc: "Nawet z nowo podbitych terenów pieniądze płyną przytłaczającym strumieniem. Wygląda na to, że do zachęcenia ludzi do hojności wystarczy... małe pchnięcie. Niektórzy potrzebują nieco mocniejszej perswazji, lecz dzięki połączeniu zachęt i gróźb każdego można skierować na właściwą drogę. \n\nObywatele, prosimy nie zwracać uwagi na groźnie wyglądających strażników kierujących was do skrzynki na datki. Mają na względzie wyłącznie wasze dobro. Nie udawajcie, że nic nie rozumiecie. Nie twierdźcie, że ofiarowaliście już wystarczająco dużo. Przede wszystkim zaś nie próbujcie dowodzić istnienia waszej tak zwanej \"wolnej woli\". Zostaniecie poprowadzeni ku zbawieniu, nawet jeśli trzeba będzie zrobić to wbrew waszym zamiarom."

TOR_the_lords_disapproval_idea: "Bluźnierstwo"
TOR_the_lords_disapproval_idea_desc: "Podbój województwa sprawił, że w granicach naszego państwa znalazły się pewne niepożądane i niebezpieczne elementy. Realnie rzecz biorąc, stanowią dla Ojca Dyrektora niewielkie zagrożenie albo wręcz żadne... przynajmniej na razie. Skoro nie potrafią po prostu zamilknąć i powstrzymać się od szkodliwej agitacji, dla dobra naszej wspólnoty muszą zostać spacyfikowane wszelkimi metodami, które okażą się konieczne."

TOR_parish_conscription_lottery_idea: "Wybrańcy Boga"
TOR_parish_conscription_lottery_idea_desc: "Czy można lepiej ustalić, kto ma służyć w imię Maryi, niż pozwalając samemu Bogu wylosować nazwiska? Cóż, nie do końca, bo ręka wyciągająca losy należy do zwykłych duchownych, ale z pewnością ich wyborem kieruje boska wola. Czasem mogą pojawić się osobliwości dotyczące tego, kto dokładnie zostaje wybrany, ale czy istnieje większa motywacja do służby niż osobisty wybór Pana, do którego codziennie się modlisz? A skoro to On cię wybrał, z pewnością otoczy cię swoją opieką, prawda...?"

TOR_the_promise_of_prosperity_idea: "Zasiewanie ziarna"
TOR_the_promise_of_prosperity_idea_desc: "Jeśli ktoś posiadający 10 monet odda je wszystkie Kościołowi, nie zostanie mu nic. Jeśli zamiast tego zachowa je, zainwestuje i pozwoli środkom się pomnożyć, wkrótce będzie miał 100. Wtedy może oddać Kościołowi 50, a resztę ponownie zainwestować. Perspektywa natychmiastowych pieniędzy brzmi kusząco, ale czasem lepiej poczekać. Ten talent do interesów musi przeniknąć wszystkie warstwy naszej wspólnoty. Nie jesteśmy już pasterzami bandy zubożałych żebraków. Wróćcie, gdy zarobicie pierwszy milion."

