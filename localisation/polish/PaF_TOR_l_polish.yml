TOR_the_greatest_burden_desc: "Modlimy się za Radio Maryja, aby jego głos rozbrzmiewał w całej Polsce i na całym świecie, niosąc pobożność wszędzie, dokąd dociera. Modlimy się o zdrowie Ojca Dyrektora: niech żyje aż do Dnia Sądu. Dziś o godzinie 21 na antenie zostanie odmówiony różaniec w intencji zdrowia Ojca Dyrektora. W tym tygodniu wszystkie wieczorne różańce będą poświęcone zdrowiu Ojca Dyrektora. Osobiste intencje nadal można zanosić podczas różańców odprawianych o brzasku - o godzinie 6 rano. \nNiech będzie wiadome, że nasz Przywódca, Ojciec Rydzyk, pozostaje silny ciałem. Jego układ odpornościowy spada na każdą trawiącą go gorączkę niczym Zastęp Serafinów, a ich święta zemsta wypala wszystko na swej drodze. Niech takie oczyszczenie stanie się udziałem wszystkich potrzebujących!"
TOR_a_theocrats_private_fiefdom_desc: "Zapewniwszy panowanie prawa Bożego i naszą pobożną opiekę nad całym województwem, wznosimy ręce w chwale i modlitwie ku wszechmogącemu Panu oraz Jego Błogosławionej Matce! Otrzymaliśmy największe brzemię ze wszystkich: prowadzić wiernych, wskazywać im drogę, chronić przed złem czającym się w cieniu i dopilnować, by nasza święta ziemia pozostała czysta, nieskalana grzechami świata. Ta ziemia należy do nas. Jest lennem samego Boga, którym będziemy rządzić bez lęku i bez litości dla grzechu. Wreszcie wszystkie ręce, młode i stare, zostaną poświęcone wyłącznie Bogu. \nTa sakramentalna ziemia w najciemniejszą noc. Ta sakramentalna ziemia stanie się wzorem nowej Polski, a pewnego dnia - całego świata! Jesteście świadkami początku czegoś prawdziwie pięknego, drodzy słuchacze."
TOR_30_million_silver_pieces_desc: "Choć nasza sprawa jest sprawiedliwa, metody miłosierne, a pragnienia wyłącznie święte, wciąż istnieją ludzie - zwłaszcza poza Toruniem - których serca opanowała chciwość! Ludzie, którzy nie przeznaczają choćby jednej złotówki na nasze prawe cele! Ojciec Dyrektor i oczywiście Bóg muszą być wściekli z powodu ich egoizmu! Wy także powinniście, drodzy słuchacze, bo stoją na drodze waszego dobrobytu i traktują wasze ofiary jak rzecz oczywistą. Nie ma jednak powodów do obaw, gdyż wkrótce wszyscy ci grzesznicy pokłonią się Jego potędze. Dorównają wam zapałem, a może nawet was prześcigną - nawet jeśli będziemy musieli interweniować, by pomóc im go odnaleźć."
TOR_provincial_broadcasting_desc: "Drodzy Słuchacze! Usłyszeliśmy wasze skargi na jakość transmisji w zachodniej części województwa i z radością na nie odpowiemy! Wszyscy zasługujecie na możliwość słuchania Słowa Bożego, bez względu na to, jak odległe są wasze domy. Jak zapowiedział Błogosławiony Ojciec, od tej pory rozpoczniemy budowę dodatkowych ośrodków nadawczych w węzłowych miejscowościach całego województwa, aby zapewnić dostęp do najważniejszego programu wszystkim jego mieszkańcom, a nawet ludziom żyjącym wiele kilometrów poza jego granicami! Niech cały kraj usłyszy naszą mądrość. Szczęść Boże!"
TOR_gods_word_in_every_home_desc: "Ponownie usłyszeliśmy wasze prośby, drodzy Bracia. Osoby znające historię mogą pamiętać, że w dawnych czasach Izraelici musieli składać się wspólnie, aby kupić jagnięta na Paschę. Choć pochwalamy ducha wspólnoty, przy obecnym dobrobycie nie ma potrzeby się dzielić. Dlaczego zatem drodzy słuchacze mieliby gromadzić się wokół odbiorników sąsiadów, by słuchać naszego programu? Właśnie dlatego wprowadzamy nową generację przenośnych radioodbiorników. Tanie i łatwe w produkcji, zdobyciu oraz uruchomieniu pozwolą nawet najuboższym mieszkańcom słuchać najświętszej rozgłośni na Ziemi. Szczęść Boże! Mam nadzieję, że już wkrótce włączycie naszą audycję w znacznie większej liczbie."
TOR_connecting_the_family_desc: "Wierni! Błogosławiony Ojciec ogłosił właśnie długo oczekiwane przywrócenie usług operatora telefonicznego \"wRodzinie\". Jak wszyscy wiemy, po Upadku większość polskich operatorów sieci komórkowych uciekła z kraju albo przestała działać, dlatego zapewnienie zasięgu wszystkim obywatelom uznajemy za święty obowiązek. Dzięki tej możliwości znów będziecie mogli swobodnie kontaktować się ze sobą, a co ważniejsze, znacznie łatwiej dodzwonić się do naszej rozgłośni. Czekamy na wasze telefony. Nie spoczniemy przecież, dopóki nasz zespół ekspertów liturgicznych nie usłyszy waszych pytań i na nie nie odpowie."
TOR_tv_trwam_media_empire_desc: "Drodzy słuchacze... a teraz także widzowie - zdajemy sobie sprawę, że nawet przed Upadkiem wybór dobrej, katolickiej rozrywki często był ograniczony. Dlatego wielu zwróciło się ku grzesznym programom, zatruwając umysły zawartymi w nich demonicznymi przekazami podprogowymi. \nZ radością ogłaszam, że jedyna prawdziwie chrześcijańska stacja - TV Trwam - uzyskała niedawno licencje na produkcję wszelkiego rodzaju programów: widowisk, transmisji wydarzeń, osobnego kanału muzycznego... wszystkiego z wyraźnym, lecz niewymuszonym akcentem religijnym. \nWidzowie w każdym wieku powinni znaleźć coś dla siebie. Jeśli nie, powinni zapytać samych siebie, dlaczego przeszkadza im chrześcijańska telewizja. Być może prawdziwy problem leży w ich sercach."
TOR_accessing_their_pockets_desc: "Jak już mówiłem, bracia i siostry, nie wszyscy równie chętnie oddają ziemski dobytek jak nasi najczcigodniejsi wierni z Torunia. Chciwość obecna jest w każdej części województwa, gdzie próbuje zniszczyć nasze święte struktury i sprowadzić zagładę na wielką sprawę! Nie może tak być! Błogosławiony Ojciec zapowiedział zmianę tego stanu rzeczy, lecz jego mądry umysł trapi jedno pytanie: czy wystarczy nadal polegać na utrzymywaniu Kościoła z dobrowolnych ofiar, tak często pomijanych przez grzeszne masy, czy też złe siły moralnego zepsucia zmuszą nas do wprowadzenia obowiązkowej dziesięciny, której nie będą mogły uniknąć?"
TOR_a_gentle_nudge_desc: "Drodzy słuchacze, decyzja zapadła: na naszym terytorium nie będzie obowiązkowych podatków, gdyż zbawienia nie można wymusić. Nasz Kościół nadal będzie finansowany wyłącznie z dobrowolnych datków. Ci, którzy odmówią ich przekazania, sami wybrukują sobie drogę do Piekła. Nadal jednak istnieje problem chciwych i nikczemnych części społeczeństwa, które nie wnoszą swojego udziału i pozbawiają nas zasłużonych środków. Dlatego zaczniemy oferować... zachęty dla najhojniejszych darczyńców. Pamiętajcie, nasza władza zależy od tego, by każdy z nas dawał z siebie wszystko! Nie pozwólcie, by owładnęła wami chciwość. Niech zamiast niej przepłynie przez was duch poświęcenia!"
TOR_bibles_and_baubles_desc: "Zważcie na te słowa, bracia! Wraz z ogłoszoną wcześniej polityką zachęt wprowadzimy również rozwiązanie, które - choć skażone siłami chciwości i skąpstwa - ma pewne zalety: od tej pory w naszych kościołach powstaną targowiska sprzedające wszystko, czego ktoś może potrzebować duchowo. Wśród dostępnych przedmiotów znajdą się krucyfiksy, różańce, rozmaite artykuły ozdobione wizerunkiem najważniejszego papieża ze wszystkich, świętego Jana Pawła Wielkiego, oraz pojemniki na wodę święconą w różnych rozmiarach. Mamy nadzieję, że sklepy te pomogą wam prowadzić pobożne życie nie tylko w kościołach, lecz także na co dzień."
TOR_a_three_piece_tithe_desc: "Drodzy Słuchacze, widząc wasz opór i grzeszne życie, Błogosławiony Ojciec uznał za konieczne wprowadzenie naszej pierwszej obowiązkowej dziesięciny. Oczywiście sama dziesięcina nie jest wysoka; wręcz przeciwnie. Jej wielkość jest bardzo łaskawa dla obywateli, lecz stanowi wyraźny znak naszej prawej walki z chciwością i pożądaniem. A przecież każdy z sąsiadów, niedorzecznie roszczących sobie prawo do miana prawowitych następców polskiego rządu, wprowadził własne podatki... dlaczego więc my mielibyśmy tego nie zrobić? To całkowicie naturalne."
TOR_parish_financial_registry_desc: "Nowe czasy przynoszą nowe zmiany, choć oczywiście wszystko służy chwale naszej wielkiej wiary. Do wszystkich wiernych: prosimy zgłosić się do miejscowych władz parafialnych w celu wpisania do właściwego rejestru parafialnego. Od tej pory dokumentację podatkową należy dostarczać do lokalnego kościoła albo - jeśli nie możecie przekazać jej osobiście - składać tam w odpowiedni sposób, by dane zostały przeniesione do rejestru, a podatki zweryfikowane i następnie właściwie rozliczone. Nikt przy zdrowych zmysłach nie ośmieliłby się ukraść należności przysługujących Kościołowi, lecz gdyby jednak spróbował... już jesteśmy dwa kroki przed nim. Drżyjcie, oszuści podatkowi! Drżyjcie przed potęgą Pana!"
TOR_extortion_incentives_desc: "Do zwykłych kapłanów słuchających naszej audycji - nie martwcie się. Otrzymacie wynagrodzenie za trud związany ze zbieraniem pieniędzy dla Kościoła. Ojciec Dyrektor bezinteresownie postanowił, że możecie zatrzymać dla siebie część dochodów. \nCo za wspaniałość!\nZróbcie wszystko, by zgromadzić potrzebne nam fundusze, a zostaniecie wynagrodzeni. W pełni ufamy, że wszystkie zatrzymane pieniądze przeznaczycie na dobro swoich parafii, dlatego nie będziemy zaglądać wam przez ramię ani liczyć, dokąd trafia każda moneta. Liczy się jedynie, byście przekazali nam jak najwięcej. Dajcie z siebie wszystko."
TOR_finish_torun_geothermics_construction_desc: "Drodzy słuchacze! \nZ wielką radością ogłaszam wam wszystkim zakończenie projektu Geotermii Toruń! Jedna z największych i najdłużej trwających inwestycji Ojca Dyrektora będzie teraz dostarczać mieszkańcom Torunia ogrzewanie oraz energię po obniżonej cenie, dzięki dobroci jego łaskawej natury. Pozwólcie nam zatem grzać się w jej cieple niczym w żarze płonącego, świętego serca Boga! Nie zapominajmy, że dar ten pochodzi od najwyższej z władz."
TOR_priest_ceo_pipeline_desc: "Po przejęciu przez Błogosławionego Ojca licznych firm musimy uwzględnić jedno: ich dotychczasowi prezesi są istotami splamionymi przez Mamonę i dlatego nie nadają się do zarządzania nimi ani sekundy dłużej! Zamiast tego, drodzy słuchacze, wprowadzimy do tych instytucji nowy zarząd złożony z wiernych, nieskalanych kapłanów redemptorystów, jak powinno być od zawsze. Zapisy na stanowiska właścicielskie trwają w naszych seminariach i mamy nadzieję bardzo szybko obsadzić wszystkie wakaty! Ave Maria! Niech Mamona nigdy więcej nas nie dotknie!"
TOR_pesa_chapel_cars_desc: "Wraz z powiększeniem naszego terytorium zauważyliśmy wzrost liczby długich podróży odbywanych przez wiernych obywateli, dlatego Ojciec Dyrektor mądrze postanowił działać. Wasze przejazdy pociągiem nie będą już pozbawione kultu i ofiary. Od tej pory każdy nowy skład otrzyma specjalny wagon kapliczny z uczciwą opłatą za usługę, która oczywiście będzie darem dla Pana w zamian za komunię z Nim. Szczególnie zachęcamy do korzystania z wagonów kaplicznych podczas podróży w niedzielę. W końcu pamiętaj, abyś dzień święty święcił!"
TOR_the_catholigarchic_class_desc: "W ostatnich tygodniach byliśmy świadkami gwałtownego wzrostu liczby firm - czasem wielu jednocześnie - będących własnością księży i innych członków duchowieństwa. Choć część obywateli może wpadać w panikę, zapewniam was wszystkich: NIE MA powodów do obaw! Jedynie odbieramy naszą gospodarkę siłom Mamony i ponownie bierzemy ją we własne ręce! Klasa kapłańska może stać na czele pokaźnych przedsięwzięć, lecz ostatecznie wszystko zostanie wykorzystane dla dobra naszych kościołów! Prosimy teraz nie zwracać uwagi na luksusowe jachty płynące właśnie Wisłą! To po prostu nieproszeni przybysze należący do jednego z naszych skorumpowanych sąsiadów!"
TOR_a_liturgical_monopoly_desc: "Kto powiedział, że tylko nasi obywatele mogą cieszyć się tymi darami Boga? Ojciec Dyrektor nakazuje: musimy eksportować! Zalejmy rynek niczym deszcz Potopu Noego i przy okazji utopmy naszych złych konkurentów! Wkrótce staniemy się jedynym liczącym się producentem dewocjonaliów, a wtedy... yyy... przepraszam! Wygląda na to, że pora na blok reklamowy!\nCHRESTEX PRZEDSTAWIA: NOWĄ ERĘ DYSTRYBUCJI WODY ŚWIĘCONEJ! NIGDY WCZEŚNIEJ NIE DOŚWIADCZYLIŚCIE CZEGOŚ PODOBNEGO: DYSTRYBUTOR WODY ŚWIĘCONEJ ŚWIĘTEGO PAWŁA. ZASIĘG DO 30 METRÓW, CZTERY RÓŻNE TRYBY PRAWIDŁOWEGO ROZPRASZANIA ORAZ PRZYŁĄCZE ZBIORNIKA DO UTRZYMYWANIA CIŚNIENIA! KUP TERAZ!"
TOR_brothers_in_faith_partners_in_crime_desc: "Chwała Maryi Zawsze Dziewicy!\nUmiłowani bracia,\nPragniemy w całości poświęcić tę audycję najbardziej pobożnym i najwspanialszym ludziom, których Bóg dał nam w akcie łaski! Mówimy oczywiście o Błogosławionych: Ojcu Dyrektorze Tadeuszu Rydzyku i Zastępcy Dyrektora Janie Królu!\nMódlcie się za nich, bo to oni odpowiadają za wszelkie dobro. Z ich majestatu płynie niepowstrzymana chrześcijańska miłość, zalewając nasze serca nadzieją i miłosierdziem!\nSpoglądajcie na naszych bohaterów jako na wzór prawdziwego, bezinteresownego chrześcijańskiego braterstwa - takiego, o jakim Biblia tak często nam przypomina.\nWładza Ojca Dyrektora i Zastępcy Dyrektora jest bezpośrednim znakiem porządku ustanowionego przez Boga. W NASZYM interesie leży dopilnowanie, by pozostało tak po wsze czasy!"
TOR_the_infallible_father_desc: "Bracia i siostry! Radujmy się wszyscy, bo nasz ukochany Ojciec Dyrektor pobłogosławił nas podczas niedawnej mszy. Zaprawdę powiadam wam - jesteśmy zbawieni!\nSpójrzcie, co osiągnęliśmy! Nasz Toruń nieustannie rozkwita, a chrześcijańska wiara wypełnia nasz dom promiennym światłem dobroci płynącym od samego Boga!\nSpójrzcie, bracia! Ojciec Dyrektor zapracował na swoją pozycję ciężkim wysiłkiem. Nie bądźmy samolubni, lecz oddajmy mu cześć, bo Ojciec Dyrektor po prostu na nią zasługuje!"
TOR_the_first_apostle_desc: "Szczęść Boże!\nJako pobożni chrześcijanie mamy nie tylko zaszczyt, lecz wręcz obowiązek wychwalać i przedstawić wam postać naszego wspaniałego Zastępcy Dyrektora, Jana Króla. \nPamiętajcie, drodzy bracia, że jest to człowiek bez skazy, który od 1997 roku nieprzerwanie służy Bogu i nam. Lista jego zasług jest równie długa jak misja szerzenia chrześcijańskich cnót. \nOdpowiada między innymi za budowę Sanktuarium Najświętszej Maryi Panny Gwiazdy Nowej Ewangelizacji i św. Jana Pawła II oraz współtworzenie Radia Maryja i TV TRWAM - a to zaledwie kilka z jego dokonań... \nPewnego dnia nadejdzie chwila, gdy Pan wezwie naszego czcigodnego Ojca Dyrektora do siebie w Niebie... ale nie rozpaczajcie! \nIstnieje człowiek godny zająć jego miejsce - a jest nim Jan Król!"
TOR_last_days_of_solomon_desc: "Niech Bóg was błogosławi!\nBracia chrześcijanie! Nikt nie uczynił dla nas tyle dobra, co nasz czcigodny Ojciec Dyrektor. Bez przerwy, bez odpoczynku szerzy Słowo Boże, pomaga potrzebującym i wypełnia obowiązki duszpasterskie - wszystko po to, abyśmy mogli zostać zbawieni! Zaprawdę, wychwalajmy go aż po same Niebiosa!\nGdy ogarnie was grzeszna nienawiść, pamiętajcie, by nie osądzać, abyśmy sami nie zostali osądzeni! Jeśli ktoś rozkoszuje się obrażaniem braci, niech zachowa swoje oskarżenia dla Boga, gdyż tylko On może ich sądzić. Każdym czynem Ojca Dyrektora kieruje ręka Boga, nawet jeśli czasem na taki nie wygląda!"
TOR_raise_the_walls_of_jericho_desc: "Chwała Najwyższemu Panu!\n Umiłowani bracia i siostry! Niestety piekielni słudzy Diabła zesłani na tę Ziemię nie dają nam, pobożnym chrześcijanom, ani chwili spokoju.\n Nie lękajcie się! Nie zniesiemy żadnego upokorzenia ani nie \"złożymy się w ofierze napastnikom\" - odetniemy głowę smoka niczym święty Jerzy!\nWzniesiemy potężne fortyfikacje, mury równie mocne jak mury Jerycha - lecz te nie runą, gdyż Bóg jest po naszej stronie!\nNikt nie wkroczy na naszą ziemię niezauważony. Rozpoczynamy pełną obserwację i kontrolę. Każdy zakątek każdej ulicy będzie patrolowany - dla naszego bezpieczeństwa!\nOJCIEC DYREKTOR PATRZY NA CIEBIE!"
TOR_a_city_within_a_city_desc: "Niech będzie pochwalony Jezus Chrystus!\nDrodzy chrześcijanie! Planujemy nieustannie rozbudowywać nasze piękne miasto Toruń, a przede wszystkim święty Kompleks Ojca Dyrektora, ku chwale Boga.\nObiecujemy wam - zbudujemy największą i najwspanialszą metropolię, jaką kiedykolwiek widział świat!\nZ pomocą Boga - oraz waszą - musi się to udać! Dlatego po raz kolejny przypominamy o trwającej zbiórce datków na ten prawy cel.\nZachęcamy także uczciwych przedsiębiorców - sprzedających wyłącznie towary najwyższej jakości - do przeniesienia działalności do nowego pawilonu handlowo-usługowego, który wkrótce zostanie ukończony.\nNie wahajcie się wysyłać wsparcia finansowego Ojcu Dyrektorowi, gdyż uczynił dla nas tyle dobra, że nasza pomoc jest tylko skromną spłatą długu."
TOR_conquerors_tribute_desc: "Chwalcie Pana!\nMiłosierni chrześcijanie! Za nasze zasługi i niestrudzoną pracę manna spada nam z Nieba!\nMieszkańcy niedawno odzyskanych ziem kujawsko-pomorskich postanowili wynagrodzić nas za wyzwolenie z kajdan Szatana. Wysyłają naszej wspólnocie dobrowolne ofiary dziękczynne.\nByliśmy świadkami wielu wzruszających chwil i ciepłych słów - ludzie masowo modlą się za sprawiedliwość, której wreszcie zaznali po latach okupacji.\nPonadto trwa tam misja chrystianizacyjna, a miejscowi mieszkańcy przyjmują ją z entuzjazmem, dziękując Ojcu Dyrektorowi za jego opatrzność.\n[poza anteną]\n- Musimy zebrać \"daninę\" (ironiczny uśmiech oficera) od [...]. Tylko pamiętajcie - jeśli ktoś choćby krzywo spojrzy przy oddawaniu pieniędzy, macie być brutalni i bezlitośni! Nikt nie kwestionuje nas - zwycięzców."
TOR_outdoing_sodom_and_gomorrah_desc: "Niech będzie pochwalony Jezus Chrystus!\nPobożni bracia i siostry!Z żalem informujemy o nikczemnych pogłoskach, które do nas dotarły - oszczerstwach przeciwko naszemu czcigodnemu Ojcu Dyrektorowi.\nWSTYD! HAŃBA! OTWÓRZCIE OCZY!\nPrawdziwi chrześcijanie! Nie dajcie się zwieść wężowym językom, które kłamią na rozkaz Diabła. Obrzydliwości ropiejące w ich umysłach, które sami rozprzestrzeniają, kierują teraz przeciwko pobożnemu i bezgrzesznemu Ojcu Dyrektorowi!\nTO WSZYSTKO KŁAMSTWA!\n[po audycji; ksiądz mówi do siebie]\n- Musimy się spieszyć. Szybko, szybko! Ojciec Dyrektor zaraz skończy obiad, a tam takie pyszne dania... pełny wybór alkoholi - z całego świata!\nA później obiecał nam bardzo \"miłe\" towarzystwo na cały wieczór i noc. Mmmmm..."
TOR_a_transfer_of_duties_desc: "Chwała Panu!\nDrodzy chrześcijanie!Nasz ukochany Ojciec Dyrektor po latach pełnej oddania służby Bogu i nam - swojemu ludowi - potrzebuje teraz odrobiny wsparcia.\nNasz czcigodny pasterz potrzebuje modlitwy. Widzimy już, że Bóg coraz wyraźniej wzywa Ojca Dyrektora do swego Królestwa Niebieskiego.\nNie lękajcie się!\nŚmierć prawego chrześcijanina to dopiero początek!\n\"Ani oko nie widziało, ani ucho nie słyszało, ani serce człowieka nie zdołało pojąć, jak wielkie rzeczy przygotował Bóg tym, którzy Go miłują\" - Biblia o Niebie\nZ pełnym przekonaniem ogłaszamy, że w razie nieobecności Ojca Dyrektora jego obowiązki przejmie Zastępca Dyrektora Jan Król. Zaufajcie bratu w wierze, gdyż jego pobożność nie zna granic!"
TOR_replacing_the_irreplacable_desc: "Chwała Maryi Zawsze Dziewicy!\nBracia i siostry! Módlmy się wszyscy za naszego wspaniałego Ojca Dyrektora, bo prawdziwie potrzebuje odpoczynku i modlitwy. Widzimy waszą troskę o stan naszego czcigodnego Pasterza, lecz stanowczo wam mówimy - nie lękajcie się!\nW ostatnich dniach Ojciec Dyrektor spędza coraz więcej czasu na kontemplacji z Maryją i Bogiem, którzy wspierają go u kresu błogosławionej wędrówki. Zdrowie jest jedynie sprawą doczesną; decyduje o nim Stwórca, a gdy nadejdzie czas, wzywa człowieka do Niebiańskiego Raju po swojej prawicy.\nNie zostaliśmy jednak sami! Wywyższony Zastępca Dyrektora - Jan Król - niestrudzenie wypełnia najważniejsze obowiązki państwowe. Bez odpoczynku, bez narzekania, mimo ogromu codziennych spraw, ON nad nami czuwa!"
TOR_swarm_of_ordinands_desc: "Szczęść Boże!\nDrodzy wierni! Z wielką dumą możemy ogłosić niezwykły sukces!\nNasza wspólnota duchownych znacznie się powiększa!\nZ głębokim wzruszeniem potwierdzamy, że setki młodych, wzorowych ludzi postanowiły poświęcić życie bezpośredniej służbie Bogu.\nWidok wiary w Boga rozkwitającej wśród młodego pokolenia wraz z głębokim poczuciem obowiązku i oddania Jego Majestatowi napełnia nas spełnieniem.\nZ takimi chrześcijanami przyszłość nie jest skazana na zagładę!\nWszyscy nowi klerycy zostaną w większości, zgodnie z potrzebami, przydzieleni do stanowisk urzędniczych. Nasze seminaria nie tylko kształtują wiarę i ducha adeptów, lecz także uczą ich skutecznego zarządzania sprawami administracyjnymi.\nBez żadnych zastrzeżeń - to kompetentni ludzie!"
TOR_stepping_out_of_the_shadow_desc: "Chwała Panu!\nBracia i siostry! Jest pewna osoba, o której powinniśmy wiedzieć jak najwięcej, gdyż niesie chrześcijańską wiarę i dobroć, szerząc wśród ludzi miłosierdzie. To postać właściwie bezgrzeszna, wspaniała, umiłowana przez wiernych - krótko mówiąc, wzór do naśladowania!\nMówię oczywiście o Zastępcy Dyrektora - Janie Królu!\nZaprawdę jest bliższy naszym sercom, niż moglibyśmy sądzić. Wieloletnia współpraca z błogosławionym Ojcem Dyrektorem potwierdza szczerość jego zamiarów.\nOjciec Król staje teraz przed nami - wiernymi - i liczy na nasze wsparcie!\nCzcigodny kapłan zapowiedział już listę wydarzeń i inwestycji prowadzących nas ku jaśniejszej przyszłości!\nMódlmy się za niego!"
TOR_sideline_the_pure_desc: "Szczęść Boże! \nDobrotliwi chrześcijanie! Zaraza wkradła się do zdrowego ciała naszej wspólnoty! \nUwaga! \nZ żalem patrzymy, jak niektórzy z naszych braci duchownych odwracają się od prawdziwej drogi Boga, oddając kłamstwu i Szatanowi. Ci separatyści, skrywający grzechy głęboko we własnych sumieniach, odeszli od wiary i głoszą HEREZJE! \nMIEJCIE OCZY SZEROKO OTWARTE! \nPowiadam wam, powstała frakcja, która nikczemnie oczernia naszego najwspanialszego Ojca Dyrektora, i musi zostać wygnana!\nNIE DAJCIE SIĘ ZWIEŚĆ!\nWłaściwe władze pracują już nad wycięciem tego heretyckiego guza. Pan jest jednak miłosierny, dlatego grzesznicy zostaną wysłani na pokutę teologiczną, aby mogli poznać prawdziwe zasady wiary i szacunku dla bliźniego!"
TOR_two_maybachs_for_a_favor_desc: "Szczęść Boże! \nUmiłowani wierni! Pismo Święte przekazuje nam pewną wiedzę o Bogu, a mianowicie, że jest nieskończenie dobrotliwy. \nJak mogłoby być inaczej, skoro troszczy się o nas dniem i nocą, powołał was, wspaniałych chrześcijan, do istnienia i wspiera nas wszystkich w najtrudniejszych chwilach? \nWładza ziemska, będąca naturalnym przedłużeniem tej boskiej woli, wymaga posłuszeństwa. W zamian możecie jednak oczekiwać chrześcijańskiej sprawiedliwości i pokoju! \nJan Król! To on obiecuje zostać naszym pasterzem. Każdy może liczyć na wynagrodzenie, gdyż otwarte poparcie dobra jest prawdziwie wielką cnotą! \nŻadne wsparcie udzielone czcigodnemu Zastępcy Dyrektora nie zostanie zapomniane - pamiętajcie o tym, bracia w kapłaństwie..."
TOR_sermon_tournee_desc: "Niech będzie pochwalona Najświętsza Maryja Panna!\nPobożni katolicy! Oficjalnie ogłaszamy, że w nadchodzących dniach rozpocznie się Pobożna Pielgrzymka w Intencji Nawrócenia Województwa Kujawsko-Pomorskiego! Oczywiście czcigodnym patronem tego wydarzenia jest nasz błogosławiony Zastępca Dyrektora Jan Król!\nNasz program obejmuje:\n Msze Święte odprawiane przez najwybitniejszych toruńskich kapłanów, procesje uliczne, targ poświęconych relikwii (autentyczne różańce z Watykanu, pobłogosławione przez samego Jana Pawła II!), konkursy teologiczne, spotkania słuchaczy Radia Maryja i wiele, wiele więcej.\nPonadto według naszych informacji mieszkańcy niedawno wyzwolonego województwa odpowiadają na inicjatywę głośno i entuzjastycznie. Zainteresowanie to przynosi nam wielką radość -\noznacza bowiem, że BÓG TAK CHCE!"
TOR_the_jet_setter_priest_desc: "Niech będzie pochwalony Jezus Chrystus!\nBracia i siostry! Jan Król! Zapamiętajcie to imię do końca swoich dni! Zaprawdę powiadamy wam, jest jednym z najpobożniejszych i najwybitniejszych duchownych naszego Kościoła, ustępującym jedynie samemu Ojcu Dyrektorowi.\nWśród jego licznych zasług znajduje się na przykład kierowanie Muzeum \"Pamięć i Tożsamość\", które wspiera polską kulturę i umacnia wiarę.\nPonadto nasz Zastępca Dyrektora zaciekle broni prawdy, zwalczając haniebne oszczerstwa i fałszywe oskarżenia. Jak sam powiedział kiedyś w odniesieniu do trzech filarów Radia Maryja:\n\"Jeśli coś jest złe, trzeba nazwać to złem\".\nPamiętajcie o takich czcigodnych kapłanach, Biblia mówi bowiem:\n\"Bądźcie posłuszni waszym przełożonym i bądźcie im ulegli, ponieważ oni czuwają nad duszami waszymi i muszą zdać z tego sprawę\"."
TOR_the_kings_anointment_desc: "Chwała Tobie, Panie!\nDo wszystkich prawdziwych chrześcijan! Dziś nadszedł wielki dzień, który przynosi pewne zmiany wprowadzone wyłącznie po to, by ustabilizować naszą przyszłość i zapewnić nam bezpieczeństwo.\nNiniejszym oficjalnie ogłaszamy - z błogosławieństwem naszego czcigodnego Ojca Dyrektora - że Jan Król zostaje namaszczonym następcą naszego państwa!\n\"Christus vincit, Christus regnat, Christus imperat!\"\nRadujmy się, bracia i siostry, gdyż Zastępca Dyrektora Jan Król - którego tak dobrze znamy - jest prawdziwie prawym sługą Boga.\nPoprowadzi naszą wspólnotę ku wielkości, wybawi nas od zła i podtrzyma naszą wiarę. Módlmy się zatem za zasłużonego Ojca Dyrektora oraz obiecującego Zastępcę Dyrektora Jana Króla!"
TOR_the_lords_disapproval_desc: "Szczęść Boże,\n I niech błogosławiony będzie owoc waszej pracy, bracia i siostry, bo niemal całkowicie zniszczyliśmy wrogów PANA na Kujawach. Lista pogan i grzeszników, którzy mogą dziś uczynić cokolwiek, by nas powstrzymać, kurczy się w chwili, gdy mówię.\n PAN dał jednak każdemu z nas pięć talentów i dopóki nie pomnożymy ich o kolejnych pięć, nasze dzieło nie będzie ukończone. Nawet teraz zaraza grzesznych partyzantów utrzymuje się na najnowszych zdobyczach. Nawet teraz jawna pobożność Mentzena chwieje się. Chrześcijańska sprawiedliwość wymaga, byśmy nigdy nie przerywali świętej pracy i prowadzili naród ku coraz większej cnocie. Nawet najmniejsza plamka zepsucia może zwieść słabych i rozproszyć silnych. PAN jest miłosierny, a Jego wielkoduszność wobec naszego grzesznego narodu zasługuje na nie mniej niż doskonałość: najpierw na Kujawach, potem w Polsce, a następnie na całym globie.\nBÓG TAK CHCE."
TOR_a_checkup_on_lucifer_desc: "Chwała Chrystusowi! Chwała Ojcu Dyrektorowi! \nI Jego błogosławieństwo dla was wszystkich poza NIKCZEMNIKIEM Mentzenem. Który do dziś czci Mamonę. Który do dziś pragnie wszystko zamienić w towar. Który do dziś, zamiast godnie pokutować albo jawnie dołączyć do naszych wrogów, siedzi okrakiem na płocie - pozornie bezsilny, pozornie zepchnięty na margines, lecz zawsze spiskujący, zawsze szukający ofiary. Nawet u szczytu naszej potęgi może zdobywać zwolenników i wężowych kusicieli. Niczym Lucyfer w otchłani ten książę pychy upadł i został podporządkowany Ładowi naszego PANA przez Ojca Dyrektora, lecz podobnie jak słudzy Lucyfera jego poplecznicy działają i gromadzą władzę, informacje oraz słabych na kazania pokusy. Nie dajcie się zwieść i módlcie się za nasze dusze, aby zostały ochronione."
TOR_the_young_confederates_desc: "Niech będzie pochwalona Najświętsza Maryja Panna!\nPobożni katolicy! Najdroższa młodzieży. Zwłaszcza ci, których uszy usłyszały wezwanie Mentzena, czarownika umysłów i serc! Każdy z nas kiedyś uległ pokusie, a wielu upadło przed wami. Nie pozwólcie, by wstyd wmawiał wam, że nie ma już dla was miejsca w trzodzie Ojca Dyrektora. Miejcie się jednak na baczności! Drapieżniki wykorzystują w naturze wszelkie fortele, by przed atakiem podzielić stado ofiar. PAN uczynił tak po to, byśmy dostrzegali tę analogię w codziennym życiu. \n Mentzen jest właśnie takim podstępem, słu... yyy, simpem kobiet, które w swej Pysze domagają się dla siebie całego uznania za wszystko. Sługą Żyda, który w swej Chciwości pozwala bogatym się bogacić, a biednym biednieć. Narzędziem Unii, która w swym Obżarstwie gromadzi nasze wole i w ciemności je pęta. Oraz pożytecznym idiotą Ukraińców, którzy w swym Gniewie obwiniają nas za wszystko, przez co przeszli.\n Nie dajcie się więc podzielić, lecz skupcie się wokół Pasterza i Ojca!"
TOR_raiding_the_consultant_desc: "Chwała Panu! \n A ponadto chwała żandarmerii wojskowej, naszym nieubłaganym regimentom Statyków i wszystkim innym, którzy uczestniczyli w nalocie na kwaterę Mentzena. Pod osłoną nocy, otrzymawszy wiarygodne doniesienia o spisku przeciwko naszemu świętemu Kościołowi, a nawet samemu Ojcu Dyrektorowi, służby bezpieczeństwa wewnętrznego otoczyły i przeszukały rezydencję oraz kwaterę Mentzena. Nasze siły donoszą, że znalazły w środku ogrom kompromitujących materiałów, które ponad wszelką wątpliwość dowodzą winy grzesznika Mentzena! Ponadto odkryto mnóstwo nieudolnych, zdradzieckich i oszczerczych fałszerstw mających OCZERNIĆ naszych drogich przywódców, a nawet przedstawić sam Kościół jako grzeszny. \n Bracia i siostry, błogosławiony umysł zbyt ciasny na zwątpienie, bo wobec jego wiary nawet najpodlejsze oszczerstwo pozostanie bezsilne. Niech nasza przezorność po wsze czasy strzeże dobrego imienia Kościoła."
TOR_secular_authority_ban_desc: "W imię Najświętszej Maryi Panny, w imię Ojca Dyrektora: \n Nasze wyzwania są nie do pokonania i każdy z nas dawno by się zachwiał, gdyby nie opatrzność PANA i Ojca Dyrektora. Ilekroć ogarnia was lęk, radujcie się: mądrość jest początkiem bojaźni. Dlatego nie może być żadnej wątpliwości ani nawet najmniejszego pozoru, że nasze ziemskie, świeckie sprawy mają pierwszeństwo przed PANEM! \n Konfederacja, każda partia i każdy ruch, który nie stawia PANA i Jego Matki na pierwszym miejscu, zostają niniejszym zakazane. Nasi mądrzy Ojcowie kończą reformy państwowości, które raz na zawsze pogrzebią nawet samo pojęcie polityki. Nie jesteśmy już państwem, lecz wyłącznie czystym, prawomyślnym Kościołem. Nasze modernistyczne szaleństwo, miraż Człowieka rozpoznającego dobro i zło jak Bóg i nazywającego to POLITYKĄ, DOBIEGŁO KOŃCA! Gdzie w Biblii wspomina się o partiach politycznych? Prawach? Istnieją tylko PAN i Jego wola. On jest naszą godnością i światłem!"
TOR_the_godless_pestilence_desc: "Bracia chrześcijanie! \n Czy kiedykolwiek zobaczyliście w kuchni choć jednego karalucha i pomyśleliście: \"moja kuchnia jest czysta\"? Albo wyszliście z pokoju pokrytego kurzem i ogłosiliście, że sprzątanie zostało ukończone? Jaka gospodyni powiedziałaby coś takiego albo na to pozwoliła? Żadna w pobożnym domu, to pewne! \n Podobnie nie możemy spocząć na laurach tylko dlatego, że grzesznicy się wycofują. Niczym karaluchy pełzają po naszych ziemiach i skażają nasze dobre dzieła: to tylko kwestia czasu, nim ich zło splugawi nawet nasze modlitwy! Nie lękajcie się jednak, gdyż nie mogą skazić naszych sił. Wiedzą one bowiem, że Rozum rodzi zwątpienie, a zwątpienie rodzi herezję. Nie przestaną, dopóki każdy grzesznik nie odpokutuje! Za ich determinację módlmy się! Za ich nienawiść składajmy dzięki!"
TOR_parish_defense_militia_desc: "Chwała Chrystusowi!\n Bracia i siostry! Radujmy się wszyscy, bo po raz kolejny pokrzyżowano plany wrogów Chrystusa. Przezorność naszych Ojców pozwoliła uzbroić parafian z kilku kościołów zagrożonych przez bluźnierców i grzeszników kryjących się w cieniu przed naszym światłem! Szybko przyniosło to owoce, ponieważ zatrzymano kilka siatek grzeszników i niedoszłych podpalaczy kościołów. W tej chwili biegną skrępowani za ręce do Torunia na sąd, przywiązani liną do pick-upa Toyoty: PAN nie wybaczyłby nam, gdyby pozwolono im choćby ujrzeć Maybacha! Parafialna milicja napadła na ich leśną kryjówkę, a dowody zamiarów - koktajle Mołotowa, instrukcje obsługi grzejników, siatka przeciw komarom (ulubienica podpalaczy) - są przytłaczające. Żeby ich kot zjadł, a kota diabeł. Do wszystkich mieszkańców zagrożonych parafii: zachowajcie czujność. Trenujcie strzelanie, sprawdźcie wzrok, wstępujcie do milicji parafialnych!"
TOR_intensify_bible_bashing_desc: "Nie czytajcie zagranicznych książek! Czegoś nie wiecie? Zapytajcie księdza! \n Bracia i siostry, czy zastanawialiście się kiedyś, co dzieje się w głowie waszego syna albo wnuka? Wiedzcie jedno: nic dobrego. Co razi wszelkie zło, dokądkolwiek się uda? Oczywiście Pismo Święte! Nie ustawajmy zatem i zanieśmy Biblię do źródła problemu. Niech czytają Dobre Słowo. Nie chcą? Poleci im prosto w twarz. Dosłownie, jeśli będzie trzeba. Bluźnierstwo pada z ust obcego? Przypomnijcie mu przykazania PANA i poślijcie je prosto w jego twarz! \n Książki służą do czytania, nie do bicia, ale jeśli nie czytają, zostaną uderzeni. A jeśli czytają, też zostaną uderzeni, gdyż słowo PANA jest mieczem obosiecznym! \n Weźmy więc wszyscy nasze Biblie i wyjdźmy na ulice, wszędzie tam, gdzie pada bluźnierstwo, by zmiażdżyć je Słowem, które było na początku!"
TOR_tighten_blasphemy_laws_desc: "Niech będzie pochwalony Jezus Chrystus! \nWiemy, czym jest grzech. Powiedziano wam, że to wszystko, co sprowadza was z właściwej drogi. Lecz powiadam wam: podobnie jak w Starym Testamencie była to półprawda przeznaczona dla niedoskonałej ludzkości. Gdy wzrastamy w pobożności i posuwamy się drogą ku doskonałości, prawda o grzechu staje się oczywista: jest nim wszystko, co nie prowadzi nas ku Panu. \nNasze prawa dostosowują się zatem, aby same nie stały się grzechem. Nie wystarczy potępiać tych, którzy mówią, że nie wierzą w prawdziwość Biblii. Powiedzenie czegokolwiek innego jest bluźnierstwem karanym z całą surowością praw danych nam przez Boga. Stwierdzenie, że Ojciec Dyrektor, który poprowadził nas ku kolejnemu stopniowi schodów do Nieba, może mylić się w jakiejkolwiek sprawie, jest bluźnierstwem karanym z całą surowością praw danych nam przez Boga. Stwierdzenie, że Kościół nie jest jedyną władzą na tym świecie, jest bluźnierstwem karanym z całą surowością praw danych nam przez Boga. \nW ten sposób oczyszczamy serca ze zepsucia. Dzięki tym prawom doskonałość jest w zasięgu wzroku."
TOR_a_schismatics_synod_desc: "Jak wam powiedziano, Objawienie Słowa Bożego rozwijało się wraz z ludem. Hebrajczycy, podążający wyłącznie za Starym Testamentem, ostatecznie wzgardzili nim. Kościół katolicki, kierując się ideą Prawa Wypełnionego, mądrze przyjął Nowy Testament. Doskonałość. A potem... \n Sobór Watykański II. Doczesność. Ekumenizm. Niektórzy twierdzą, że nasz święty polski Papież opóźnił to, co nieuniknione. Ja mówię, że istotnie było to nieuniknione. \nŻe... \nŻe Rzym porzucił Słowo Boże. Powiedziano wam, że Piekło nie przemogło bram Kościoła Chrystusa. Nie lękajcie się jednak: Jego prawdziwym Kościołem jest teraz Kościół Redemptorystów! W obliczu zbłąkanego Kościoła rzymskiego, krnąbrnych luteranów i naszych wschodnich braci tkwiących w błędzie Namiestnikiem Chrystusa jest nikt inny jak Tadeusz Rydzyk! Do niego należy sukcesja apostolska! Twierdzić inaczej to wypowiadać słowa bluźnierstwa! Radujcie się, bracia i siostry, radujcie się i módlcie do Matki Bożej z każdym oddechem! Nie ma bowiem Kościoła poza Kościołem Redemptorystów, a Ojciec Dyrektor jest jego Prorokiem!"
TOR_taste_of_omnipotence_desc: "Niech będzie pochwalony Chrystus i Ojciec! \nPo owocach ich poznacie. Zaprawdę poznajemy więc splendor i potęgę Kościoła oraz jego Ojca! Wielu próbowało zetrzeć go w proch, a teraz te masy same są niczym. Mniej niż niczym, bo niektórzy leżą bezczynnie, podczas gdy nawet umarli karmią robaki w ziemi. \nSłowo Ojca jest słowem Boga. Ojciec, Syn i Duch Święty. Jako Jego przedstawiciel przemawia z Jego autorytetem. Jaka ziemska potęga może go zatrzymać? Jakie ziemskie prawo powinno przetrwać wobec jego majestatu? Czy człowiek natchniony przez Boga może się mylić? \nNIE! Nie ma Kościoła poza Kościołem Redemptorystów, a Ojciec Dyrektor jest jego Prorokiem! Jego wola jest wolą Kościoła! Jest panem tej ziemi, a przez to panem ludzkości! Jest mądrością, jest światłem! Żadne prawo, żadna ustawa, żaden ziemski dokument nie może go ograniczać. Sugerować inaczej znaczy zerwać z wiarą i prawami danymi nam przez Boga. Módlmy się o Jego przewodnictwo, bo od tej chwili tylko jego będziemy potrzebować."
TOR_the_final_mass_desc: "Już za kilka minut sam Ojciec Dyrektor odprawi Mszę Świętą - zaiste będzie to najbłogosławieńsza chwila. Choć zmęczony boskimi objawieniami i oświeceniem wstrząsającym jego śmiertelnym umysłem, wciąż znajduje siłę, by obdarzyć nas proroczym natchnieniem. \nDziękujemy Ci na wieki, Ojcze Dyrektorze, za niestrudzoną służbę Kościołowi i Bogu. Raz za razem dowodzisz, że nie ma Kościoła poza Twoim Kościołem. Raz za razem spełniasz nasze największe pragnienia. Raz za razem łączysz nas z Boskością. Bóg jest z Tobą. A wkrótce, dzięki Twoim słowom, Bóg będzie także z nami."
TOR_extra_omnes_desc: "Chwała Tobie, Panie! \nPo wyczerpującej i wzniosłej mszy, podczas której mądrość Boga zajaśniała nam w słowach Ojca Rydzyka, wypełniając serca i unosząc dusze zarówno grzeszników, jak i świętych, nadeszła pora, by kontemplował mądrość oraz tajemnice wiary zesłane mu z wysoka. Dlatego ku naszemu wielkiemu smutkowi wycofuje się teraz z wystąpień publicznych. Bądźcie pewni, że jego natchniona opatrzność panuje jak zawsze niewzruszenie, a wszelkie oszczerstwa dotyczące jego stanu są całkowicie bezpodstawne. \nNiech żyje Kościół Redemptorystów, zbawca chrześcijaństwa! Dziś wieczorem o godzinie 21 po raz kolejny pomodlimy się za Ojca Dyrektora. Wszystkie wieczorne modlitwy w przyszłym miesiącu będą poświęcone jego zdrowiu."

