l_polish:

 ##Events##
unification.84.t: "[GetNewspaper]WOŚP jednoczy Pomorze Gdańskie!"
unification.84.desc: "Spośród wszystkich pretendentów walczących o kontrolę nad Pomorzem Gdańskim chyba nikt nie miał mniejszych szans na zwycięstwo niż Jerzy Owsiak. Wygląda jednak na to, że popularność rzeczywiście może zaprowadzić człowieka daleko, a wieloletnia działalność charytatywna przywódcy i stosunkowo czysta karta, dodatkowo wsparte decyzją o niepodejmowaniu współpracy z władzami okupacyjnymi, okazały się przepisem na sukces. Państwo Wielkiej Orkiestry, powstałe przede wszystkim jako populistyczny front i schronienie dla politycznie rozczarowanych, stanowi kontynuację dzieła Owsiaka. Przed tą luźną organizacją, pozbawioną wielu podstawowych instytucji władzy, stoi monumentalne wyzwanie: musi przekształcić się w szanowane państwo, zdolne zapewnić swoim obywatelom godne warunki życia, a nie być jedynie rozwiązaniem tymczasowym, które silniejszy watażka wykorzysta na drodze do kolejnych podbojów. Mieszkańcom Pomorza Gdańskiego pozostaje mieć nadzieję na jej sukces, w przeciwnym razie prawa, którymi dziś się cieszą, mogą zniknąć na zawsze."
unification.84.a: "Służyć narodowi polskiemu do końca świata i jeden dzień dłużej"

unificationreg.84.t: "[GetNewspaper]WOŚP jednoczy Pomorze!"
unificationreg.84.desc: "Jerzy Owsiak znów tego dokonał. Pod jego sztandarem i pod znakiem serduszka mieszkańcy Pomorza Gdańskiego ruszyli na ziemie zachodniego sąsiada i, napędzani wielką sprawą, nie ustawali w marszu, aż rywalizujący z nimi rząd skapitulował. W ruinach Szczecina Owsiak ogłosił zwycięstwo, podkreślając jednak, że Orkiestra musi grać dalej, dopóki cała Polska nie zostanie zjednoczona. Rozradowani żołnierze wiwatowali przy dźwiękach muzyki, lecz wszyscy wiedzieli, że ich zadanie jest dalekie od ukończenia. Choć Wielka Orkiestra wreszcie ugruntowała swoją pozycję jako pełnoprawne państwo, wciąż pozostaje pytanie o kierunek, w którym zmierza. W końcu organizacja dążąca do reprezentowania wszystkich prędzej czy później napotka trudności w utrzymaniu jedności wokół konkretnego celu, zwłaszcza gdy coraz wyraźniej ujawniają się słabości jej populizmu. Czy Owsiak zdoła utrzymać dotychczasowe tempo, czy też Orkiestrę czeka upadek, gdy zabraknie jej celu?"
unificationreg.84.a: "Ekscentryczne przedsięwzięcie czy prawdziwy wielki plan?"

unificationsupreg.84.t: "[GetNewspaper]WOŚP jednoczy zachodnią Polskę!"
unificationsupreg.84.desc: "Niczym niepowstrzymany przypływ padały kolejne ośrodki miejskie Wielkopolski i Kujaw, a Orkiestra nie przerywała swego nieustannego marszu. W zajętych miastach redystrybuowano pieniądze i przekazywano je potrzebującym. Żołnierze i milicjanci z serduszkami na piersiach patrolują podbite regiony, lecz ich obecność nie ma na celu wzniecania przemocy, a ochronę najuboższych. Przynajmniej tak głosi oficjalna wersja wydarzeń, skrywająca jednak straszną prawdę. Aby utrzymać jedność organizacji, Owsiak sięgnął po czystki, wymierzone we wszystkich, którzy nie zgadzali się z jego wizją przyszłości Polski. Za zasłoną lokalnych wiwatów, nieświadomej niczego potulnej większości, opozycjoniści są skazywani i uciszani. Mimo to lud pozostaje bezgranicznie lojalny wobec Owsiaka. Bo któż odwróciłby się od człowieka, który zapewnia mu utrzymanie i ochronę?"
unificationsupreg.84.a: "Finał się zbliża"

super.84.t: "[GetNewspaper]WOŚP jednoczy Polskę!"
super.84.desc: "Polska rozbrzmiewa muzyką. Po zakończeniu kolejnej kampanii artyści wszelkiego rodzaju występują w największych miastach kraju, oddając hołd Jerzemu Owsiakowi - przywódcy Wielkiej Orkiestry i nieoczekiwanemu zjednoczycielowi Polski. Nikt nie mógł przewidzieć wydarzeń ostatnich kilku lat. Nawet najwierniejsi zwolennicy wątpili przecież, że państwo Orkiestry przetrwa dłużej niż kilka tygodni, a co dopiero zdoła objąć swoim zasięgiem cały kraj. Niewielu potrafiłoby też przewidzieć środki, po które sięgnie Owsiak, by utrzymać wszystko w całości. Ostatecznie jednak czym te represje różnią się od działań innych, gotowych osiągnąć swoje cele za wszelką cenę? Świat przygląda się rozwojowi wydarzeń, zastanawiając się, jaką postawę reżim przyjmie wobec spraw regionalnych i globalnych. Jedno jest jednak pewne: Orkiestra będzie grać aż do końca Świata, a potem jeszcze jeden dzień dłużej."
super.84.a: "Za Polskę! Za Owsiaka! Za Orkiestrę!"

OWS_til_the_end_of_the_world: "Do końca świata i jeden dzień dłużej"
OWS_popular_scepticism_low: "Ludowy sceptycyzm - Niski"
