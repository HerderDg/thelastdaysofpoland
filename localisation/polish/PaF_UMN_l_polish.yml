unification.141.t: "[GetNewspaper]Kompania Kopalni Soli w Wieliczce jednoczy Małopolskę!"
unification.141.desc: "Bogata w surowce Małopolska została zjednoczona przez tych, którzy wiedzą, jak wykorzystać bogactwa jej ziem. Wbrew wszelkim przeciwnościom górnicy z wielickich kopalń soli ruszyli ramię w ramię ze swoimi szefami, by podporządkować sobie miejskie elity Krakowa. W chaosie ogarniającym miasto zdołali narzucić swoje rządy całemu regionowi. Liczący sobie tysiąc lat kompleks, który niegdyś wzbogacał królów kraju, osadził na tronie własnego kandydata. Marian Leśny, mając dawną siedzibę władzy w niekwestionowanym posiadaniu, niemal z dnia na dzień awansował z peryferyjnego watażki do grona najpotężniejszych przywódców Polski. Teraz, gdy jego kontrola nad regionem wydaje się bezpieczna, a korporacyjna straż utrzymuje porządek w mieście wciąż oszołomionym niedawnymi wydarzeniami, Król Soli zamierza rozszerzyć swój monopol na resztę kraju."
unification.141.a: "Kopalnie budzą się po wiekach snu"

unificationreg.141.t: "[GetNewspaper]Mała Galicja pada łupem Zjednoczonej Kompanii Górniczej"
unificationreg.141.desc: "Górnicze państwo Wieliczki ponownie rozszerzyło swoje wpływy, tym razem obejmując całą Małą Galicję, ponieważ lokalni watażkowie nie byli w stanie powstrzymać marszu korporacyjnej straży Leśnego. Historyczne szyby znów pracują pełną parą, a słynna kopalnia soli finansuje swojego właściciela tak, jak niegdyś utrzymywała monarchów. Po podboju regionu państewko zostało w dużej mierze przekształcone w Zjednoczoną Kompanię Górniczą, która ma rozszerzyć monopol na inne surowce. W tym celu przejęto liczne zakłady na podbitych terenach, odbierając je dotychczasowym właścicielom i włączając do portfela Króla Soli. Dodatkowe środki pozwoliły rozpocząć nową kampanię rekrutacyjną wśród zagranicznych korpusów najemniczych. Wygląda na to, że Leśny nie zamierza bezczynnie siedzieć na swoim majątku, skoro za granicami czekają kolejne bogactwa. W końcu firma, która przestaje się rozwijać, może jedynie popaść w stagnację i upaść."
unificationreg.141.a: "Zielona linia musi zostać utrzymana za wszelką cenę"

unificationsupreg.141.t: "[GetNewspaper]Zjednoczona Kompania Górnicza triumfuje w Galicji"
unificationsupreg.141.desc: "Mimo wewnętrznych sporów żadna siła nie zdołała powstrzymać galicyjskiej ekspansji Zjednoczonej Kompanii Górniczej. Niezależnie od tego, co zdezorganizowane siły sąsiednich państewek rzucały przeciwko zaprawionym w boju najemnikom Leśnego, szybko zostawały odparte, aż w całej Galicji nie pozostał nikt, kto odważyłby się rościć sobie prawa do tronu Króla Soli. Korporacyjny suweren zasiada teraz na górze solnego bogactwa i łakomie spogląda na resztę Polski, pragnąc włączyć ją do swojej domeny. Pod jego rządami górnicy harują przez cały dzień, by nocą wrócić do należących do firmy mieszkań, a owoce ich pracy trafiają z powrotem na szczyt w ramach pomysłowego systemu, który przywiązuje robotników do ziemi. Na razie armia Leśnego wstrzymała marsz, by zebrać siły i przeprowadzić reorganizację, lecz taki stan rzeczy nie może trwać wiecznie. Stolica jest już w zasięgu wzroku i tylko kwestią czasu pozostaje wznowienie walki o duszę narodu."
unificationsupreg.141.a: "Pracować i umierać - taki los górnika"

super.141.t: "[GetNewspaper]Imperium soli i krwi"
super.141.desc: "Gdy opada kurz, coraz wyraźniej widać, że po dekadzie rozbicia Polska znów stała się całością. Pod silną ręką Zjednoczonej Kompanii Górniczej kraj został przekształcony, a wszystko to dla korzyści jednego człowieka - Mariana Leśnego - i jego wiernych udziałowców. Poza tą garstką szczęśliwców reszta ludności haruje bez wytchnienia, by przedłużyć swoje przetrwanie. To chłopi pańszczyźniani we wszystkim poza nazwą, zarabiający marne firmowe żetony, podczas gdy elity władzy nabijają kieszenie naturalnym bogactwem kraju. Pod czujnym okiem najemniczych strażników, kosztem krwi, potu i łez górników, Polska jest powoli wysysana z ostatnich zasobów. Gdy szyby w końcu wyschną, a po kopalniach pozostanie jedynie sieć pustych tuneli, zubożali chłopi zostaną porzuceni i będą musieli radzić sobie sami na powstałym pustkowiu. Biada tym, którzy dożyją tych czasów."
super.141.a: "Do tego czasu Leśny będzie już dawno martwy, oszczędzony przez los od poniesienia konsekwencji"

