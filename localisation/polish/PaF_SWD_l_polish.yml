unification.10.t: "[GetNewspaper]Komuna Świdnika jednoczy województwo lubelskie!"
unification.10.desc: "Po latach walk mieszkańcy Lubelszczyzny wreszcie doczekali się wyzwolenia, gdy Komuna Świdnika zjednoczyła województwo. Młode anarchistyczne państwo, które narodziło się z buntu przeciwko siłom Frontu Narodowego, wstrząsnęło całym regionem. Nawet zatrzymanie pierwszego natarcia nad Bystrzycą nie zdołało zachwiać determinacją wolnych ludzi. Dzieci Matki Anarchii szybko się zjednoczyły i dziś nie pozostał już żaden pretendent, który mógłby ponownie nałożyć na nich kajdany etatyzmu, tak odważnie zerwane przez mieszkańców Świdnika. Komuny zwracają się teraz ku sprawom wewnętrznym, zamierzając odbudować podupadły region. Krytycy nadal jednak nie są przekonani, czy ten twór przetrwa, skoro mieszkańców nie jednoczy już wspólna walka."
unification.10.a: "Łza szczęścia spływa po policzku Matki Anarchii"

super.10.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.10.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.10.a: "Wreszcie zjednoczeni."
