belchatow_dlc.1.t: "Czas Bezprawia"
belchatow_dlc.1.desc: "'I, Rafał Ziemkiewicz, have started this log because it doesn't look good for any of us, and I'd like for people to know what really happened here.'\nThat was the first line of the diary he started back on 26.05.2025, when a mass cyber-attack of fake news struck at the legitimacy of president-elect. He knew back then that terrible things were about to happen and decided to do something about it. He responded to Warzecha's call for a new political movement. As he was the host, he invited most prominent independent thinking journalists and politicians to his home city of Łódź. Myself, Warzecha, Janecki, Gadomski, Sommer and Rzymkowski. We all gathered there for a discussion panel that took place on the memorable day of the 13th of June.\n'I can't believe those bastards finally did it. Damn them all to Hell.' Those were his thoughts when at 16:41 an atomic explosion consumed 50 thousand Łodzians. Now that he looked at them two years later, he wondered if the words were appropriate to publish. After all, he was no longer a regular journalist but a respected Elder.\nHe remembered how transportation had become completely unavailable or too dangerous after the explosion, so the six of them were stuck in Łódź. They tried to continue their journalistic craft as a joint venture, but that wasn't enough to provide for themselves, as people in Łódź, who struggled to buy food, paid no mind to newspapers. It was time to move on.\n'Rejecting our message, people of the City of Factories cast us out. We heard news of the establishment of the Republic of Bełchatów, south of Łódź, and decided to settle there, as Tomasz Rzymkowski assured us that Mayor Patryk Marjan would welcome us. His suspicions were true.\nWe were indeed greeted by the patriotic mayor, who wanted to make use of our oratory skills to negotiate with the miners, who went on a strike due to lowered wages and lack of security even on the major roads. When we arrived, I was the one to speak.\n- Brave miners! I have heard of your hardships, and I deeply empathize with you. You are not to be blamed for your woes, and neither is the 'economic reality'. The truth is, you were stabbed in the back by the enemies of Poland - the ecologists, who sabotaged your efforts and spread propaganda that your hard labor is unnecessary or even harmful. In their arrogance, they wanted to replace you with nuclear reactors. And what has nuclear energy brought us? Only death and destruction? Come with us to strike at the Green Threat and its lies. The prices and your wages will grow once people start to believe in the power of coal. Come with me, together we will bring your profession back to its former glory! As a Brotherhood of Coal!\nThe procession of the miners entered Bełchatów and Mayor Marjan, wisely recognizing the potential of our cause, abdicated from his position and offered power to me, the Elder of the Brotherhood.\nSoon, our great economic reforms, overseen by Starszy Paladyn Gadomski, turned Bełchatów and the surrounding areas into an economic powerhouse. Seeing our successes, the pilots of the 32nd Air Base submitted to annexation, offering to help against the bandit threat in exchange for supplies.'\nElder Ziemkiewicz looked one last time at his memoir and decided it was better not to mention that Marjan was threatened to step down, and the economic miracle was mainly due to the establishment of Dialogue Free Trade Zone soon after the miners marched on Bełchatów."
belchatow_dlc.1.a: "It's all a matter of perspective"

belchatow_dlc.2.t: "Cała Kupa Wielkich Braci"
belchatow_dlc.2.desc: "- Enough with the past - Ziemkiewicz looked at the clock and let go of his pen after writing another chapter of his memoirs  - It is time for the future!\nA scheduled meeting of the council was about to take place soon. Traveling there, Ziemkiewicz reflected on how fortunate the situation was. The Brotherhood transcended the shortcomings of the old duopoly. One unified movement can now achieve great things, ever since that party squabbling has been removed from political life. A synthesis of all the things that were dear to Poles before the fall. The old ways pave the way for the future that was never seen before. A milieu where small business owners weren't held hostage to overregulation, but the state isn't idle in fulfilling the ambitious endeavours. Who knows what the great minds of the council will come up with today?\nZiemkiewicz entered the conference room late, and the deliberation had already started.\n- All I asked for was a little more time to follow them - Janecki was clearly agitated. It pleased Ziemkiewicz, as getting anything out of this shadow of a man was often difficult. The Brotherhood can only thrive by continuous discussion - They could've led us to the larger group that we would've been able to and them with one precise operation.\n- You know what else can end hostile groups? - Sommer, Janecki's interlocutor, responded - Squashing their members to send the message to the others. Besides, the resources that would be wasted on the lengthy investigation could be and should be directed towards the army to fight the enemies outside our territory. We wouldn't need to argue about financing if we had an economic plan ready to boost our revenue.\nSommer gave Gadomski a meaningful look. None of them acknowledged Ziemkiewicz's presence in the room.\n- The plan *is* ready. It has been for some time - Starszy Paladyn of economy replied - If you hadn't been gridlocking it to support Warzecha's hawkish counter-proposition, we'd already have the money.\n- We're in a state of constant war. Your namby-pamby reforms are good for civilian life, maybe. Besides, the Council of the Brotherhood consists of five members to break such standstills. The Elder - he looked at Ziemkiewicz, who had plenty of time to make himself comfortable on his seat - has to stop beating around the bush and declare his support for one of the sides.\nOf course, they all start to remember him when it's time to cast blame.\n- Alright. We'll have one final discussion about who wants which piece of cake, and then, I'll give my final vote."
belchatow_dlc.2.a: "Let's hear it"

belchatow_dlc.3.t: "Summer in the City"
belchatow_dlc.3.desc: "Naczelny Paladyn Sommer looked at the recruits being trained with a great dose of displeasure. He was just passing by, as he was heading through a military training center to meet with his second-in-command, Tomasz Rzymkowski. Still, he could see everything that was wrong with the newbies.\n- We have to take drastic actions, or we're through, dead, gone as soon as any of the other warlords as much as sneeze at us - Sommer exploded as soon as he entered the cabinet. Rzymkowski was waiting for him inside.\n- It really can't be that bad, can it? - Rzymkowski tried to placate his superior - I talked with some of them, and they clearly know what about the Axioms of the Brotherhood.\n-That's not remotely the point - Sommer shut down any attempt at easing the tension. He needed to vent first - It's not about what they're fighting for, it's about how they fight. Those who were recruited from the miners knew how to swing a pickaxe, and the students from vocational schools had already learned how to pack a punch, but other than that? None of them shot that well, and the volunteers from the cities couldn't do anything at all. The pauperization and eventual dissolution of the remnants of the pre-Fall army ordered by Elder out of his fear left our military completely in the dark. It's high time for the honeymoon to end and to grab our soldiers by their mugs.\n- Of course, sir! - Rzymkowski saluted - as soon as I get the plans for the specific areas, I'll implement them as soon as possible.\nSommer was finally given something to smile about.\n- Thank you, Tomasz. - he was thankful for Rzymkowski's attitude. He accepted his place despite the fact that he had held a political position in the past. He must have realised the same thing Somer did, that the old titles bear no relevance in the new reality. That now only merit, not the connections, establishes your position in society. - Despite everything, you're the most trustworthy of our Brothers. My right-hand man, even my successor!\n- Despite everything? No matter - Rzymkowski dropped the matter and accepted the compliment and decided to focus on the second part - What do you mean by successor?\nAs the most important commander in the Brotherhood, Sommer, during the battles, will be sitting safely in the headquarters, not on the battlefield to be killed or wounded, so he would need to think about a successor. And as a Naczelny Paladyn, he couldn't have been thinking about promotion - there's no higher position to be promoted to, unless... \n- I didn't say Ziemkiewicz was wrong to fear the military - Sommer said with a smirk, seeing the surprise on Rzymkowski's face."
belchatow_dlc.3.a: "Despite the heat it'll be alright"

belchatow_dlc.4.t: "No Dreams" #dziękuję bardzo pan Bot, do redakcji
belchatow_dlc.4.desc: "Elder Rafał Ziemkiewicz was sitting in the broadcast studio with his weathered face illuminated by the harsh studio lights. Behind him, the Brotherhood's coal-black banners are hanging with solemn dignity. The camera focuses on his tired but determined eyes as he begins to speak into the microphone with his voice carrying the weight of a nation under siege.\n\n- My fellow citizens of the Brotherhood - he begins, sounding gravelly from years of smoking coal-filtered cigarettes - Today, we face an unprecedented threat. The eco-terrorists have shown their true colors. They have declared war not just on our ideals, but on our very survival.\n\nHe pauses, letting the silence settle like ash over the studio.\n\n- For too long, we have been patient. For too long, we have shown restraint. But restraint is not weakness - it is the calm before the storm. The storm that will sweep away all those who dare to challenge the supremacy of coal and common sense.\n\nZiemkiewicz leans forward, his knuckles white as he grips the desk.\n\n- I say to you now: We will find them. We will find every last eco-fascist, every Wiechowite sympathizer, every green-loving traitor. And they will face justice. Not the soft justice of the courts, but the swift justice of the people who understand that progress demands sacrifice.\n\n- The Brother who stands next to you could be hiding something, if there is any doubt of their loyalty - report them. The neighbor who waters plants - report them. The child who speaks of trees - report them. In this time of war, there is no room for mercy, no room for doubt. We need to make sure, we need to be certain.\n\nHis voice now is echoing through the studio and across every radio frequency under Brotherhood control.\n\n- We are the Brotherhood of Coal! We are the guardians of progress! And we will NEVER surrender to the green plague! Not today, not tomorrow, not ever!"
belchatow_dlc.4.a: "We're coming to get you!"

belchatow_dlc.5.t: "Władca Szczurów"
belchatow_dlc.5.desc: "Ziemkiewicz settled down in his armchair, trying to relax in his apartment after another day of good work. In the past weeks, he's been tirelessly furthering the Brotherhood's goals. He had been passing laws in his cabinet and then returning home to write some speeches and articles behind his personal desk. For a time, it seemed like he carried this whole organisation all by himself, but as time went on, it seemed like the other members of the Council finally learn their ropes and started taking the initiative on their own.\nBut that wasn't always for the best.\nNot long after the music headphones kicked in, someone knocked on his apartment door. He tried to ignore it, but it kept repeating itself. He finally approached them, knowing his security wouldn't let any Joe Schmoe slip in. He looked through the spyhole and, who would've thought, a spy was there. Ziemkiewicz opened the door, and Proktor Janecki entered, greeting the host and handing him Górnicze wine, red, very sweet.\n- Have a seat in the living room. Make yourself at home. - Ziemkiewicz welcomed him begrudgingly.\nHe brought the glasses for the wine. He poured the gift for both of them and tasted it. It was awful, assuredly solely due to its name. As if that was the way to gain Ziemkiewicz's favor.\n- I wanted to talk about the financing of the soon-to-be-established Intelligence Agency - Janecki said plainly.\nZiemkiewicz thought he was delirious, but the beverage wasn't that strong.\n- The council has already deliberated about it time and time again. It has always been ruled to postpone the establishment of the agency only after we jumpstart the economy and the military.\n- Yes, but I thought you could direct some of the income taxes we get from the additional 2 hours of the workday to pour it into the establishment of the 'Circle of Coal'.\n- He even got a name for it - Ziemkiewicz thought to himself.\n- Despite all the good we do, the despicable, the vile rogues with no morals still creep in the dark, trying to undermine us, annihilate our industry, and by that exterminate our population! - Janecki's speech was clearly pre-prepared and over the top. He spoke loudly as if he were on a rally. It made him look like a tasteless brown-noser.\nThat was to be expected, come to think of it. Ziemkiewicz recalled that during the communist times, he was a member of the Polish Socialist Youth Union. After the regime changed, he did a spin to the right. He became so good at it that he became a spin doctor. After so many team changes, he completely lost genuineness and was replaced with ill-fitting overexaggeration. It worked so well that the Council, Ziemkiewicz included, often forgot about his episode of Janecki's past and acted as if Gadomski was the most disgraceful history out of all of them. But today, Proktor overplayed his part, and cracks in his image could be seen. He really must want this agency.\n- I am aware, Mr. Proktor. We were all aware of that, and still decided to vote against the hasty establishment of the agency.\n- It's a shame. - Janecki said in a quiet, calculated voice, he now sounded more sure of himself. Another mask was put on - A shame for the whole Brotherhood. Maybe this will change your mind.\nHe waved a file of papers. What caught Ziemkiewicz's attention was the title 'the Council's cartoteque'.\n- You would be able to order me to hand you this - Janecki continued to say calmly, sensing Ziemkiewicz took the bait, but only if I were the official head of the Intelligence. Right now, those are my private files completed by my friends, and you have no authority over them.\n- Alright, you've made your point - The Elder couldn't suffer schemes inside the Council - I'll give you your agency, if you give me what you've got."
belchatow_dlc.5.a: "Somehow, Ziemkiewicz was the one in the mousetrap"

belchatow_dlc.6.t: "Zamach bombowy w Szczercowie"
belchatow_dlc.6.desc: "Today, in Szczerców, a small town in the heart of the Brotherhood's territory, tragedy struck as a series of explosions rocked the area. The blasts, which occurred in quick succession, have left the community in shock and mourning.\n\nInitial reports indicate that the explosions were caused by improvised explosive devices (IEDs) planted by eco-terrorists. Brotherhood barracks were the target of this attack, and unfortunately seven of our soldiers perished in the explosion. We don't have any information about the whereabouts of the terrorists but we do know how they look like. Time has come for a manhunt."
belchatow_dlc.6.a: "O, nie..."

belchatow_dlc.7.t: "Pęknięcia w firmamencie"
belchatow_dlc.7.desc: "Ambassador Andrzej Kopek was getting ready to let the ground swallow him up, suffering from the judgment glare of the whole council of mining fanatics. \n- What is Hołownia's plan, Mr. ambassador? - Elder Ziemkiewicz was leaning over the conference table with a frown. - You were sent here to inform us about the policy of Free City, and yet you keep us in the dark as if we were talking in a shaft. \n- The situation is dire. -Janecki chimed in with a much calmer tone - The clubs are fighting once again, Sapkowski's hungry dog is raving at the Triumvirate, and now the Scouts are encroaching on our territory. Hołownia, so far, has remained silent, and his previous reactions to the crises have been insufficient. We just won't know what we're standing on. Kopek couldn't tell them anything. Hołownia was being moody after everything that's been going on in the voivodeship. He's been keeping everyone in the dark for a while. Those who dared to pry were welcomed with snarky remarks. He decided to hit the Brotherhood leadership with the general response number 2. \n- The Sphere of Dialogue is a constant that helps to deal with conflicts peacefully. Of course, it's not as spectacular as the 'big stick' policy. But in the long run, it provides much better results than not disturbing the delicate balance of benefits that we all collectively enjoy. I, in the name of the President of the Free City of Łódź, ask for patience, as the results will be delivered by the process of compromise and deliberation. - he knew number 2 never fails. \nBefore any of the Council could respond, an assistant ran into the conference room. \n- Excuse me, sirs... Paladins... Council. Sorry to interrupt, but - he struggled to catch his breath. \n- Out with it already - Ziemkiewicz urged him. \n- It's... Łódź. Just turn on the TV.\nKopek's boss finally decided to fill him in. \n- With great sadness, I have come to the realisation that the project of Dialogue in Łódź Voivodeship can no longer function...\n- The ambassador mentally wasn't able to listen. His brain, trying to protect its owner's psyche, shut itself to Hołownia's exposee. All those years of supporting Hołownia, before and after the Fall, dealing with all those kooks in Bełchatów instead of looking for better employment. All for the peaceful future. It all came to nothing.\n- Ambassador - some voice tried to get him out of the stupor.\n- I'm not the ambassador any longer - he thought to himself, or did he say that out loud?\n- Ambassador - it was proctor Janecki who leaned closely upon Kopek's head to make him focus. His face bared a barely noticeable smile if that wasn't part of the derealisation - I don't think we'll be needing your services anymore."
belchatow_dlc.7.a: "Send our regards to Representative Ogórek"

belchatow_dlc.8.t: "Maszyna musi iść"
belchatow_dlc.8.desc: "Patrolling the Bełchatów mine almost makes you wish for an actual nuclear winter, and not whatever actually happened in Bałuty. The Bełchatów mine was a giant wound in the earth, and Private Koziecki stood on its rim like a clot meant to keep the planet from bleeding out. Below him, the pit spiraled inward, layer upon layer of blackened terraces descending into haze. At its heart moved the giants—bucket-wheel excavators, steel circles studded with teeth, endlessly gnawing at the lignite seams. They advanced with dreadful patience, their groans merging into a single mechanical chant. Coal dust was everywhere. It's a good thing they had their suits. The sun hung low behind the smog, swollen and red, as if struggling to escape the sky.\n- Alpha Three, report. Western shelf status? - heard Koziecki in his earpiece. It was his commanding officer, and today he was very on edge. Something was about to happen.\n- Negative movement - Koziecki replied, scanning the terraces - Only dust and machine activity -\nHe did not add what he felt: that he felt that something was watching him. The excavators' noise never ceased. It filled the mind, eroded thought. Koziecki understood now why veterans avoided looking at them too long. They felt alive - like ever-hungry beasts. A vibration passed through the ground. Wrong. Too sharp. Too sudden. Koziecki stiffened.\n- Alpha Three to command, I'm detecting...\nThe explosion tore the sentence from his mouth. Fire erupted beneath Excavator K-17. Steel screamed as the giant lurched, its bucket-wheel grinding to a halt mid-turn. Warning sirens wailed, thin and panicked.\n- They're in the ground! - Someone shouted over the channel. - Multiple contacts! - \nFigures rose from the dust like spirits of the pit. They moved low and fast, wrapped in ash-colored cloaks, rebreathers masking their faces. They knew the mine's rhythms, its blind spots. They flowed along service paths Koziecki had been told were impassable. A rocket streaked upward. Another blast tore into the excavator's flank. Conveyors snapped. The giant shuddered, wounded. Koziecki fired. His rifle kicked against his shoulder, muzzle flashes briefly painting the terraces in white light. One attacker fell. The others did not slow. He realized then what they were doing. Not destroying the machine outright - disabling it. Stranding it. And the protectors were helpless as other attackers from afar pinned them down with staggering fire. The excavator gave a final groan, deep and almost mournful, before going still. Smoke rolled upward, black against the red sky.\n- Alpha Three to command, we need immediate support on sector Złoczew-13! NOW!\nBut the reinforcements were very far, and the dust warriors were rampaging through their ranks with rockets firing over their heads like it was New Year's Eve. But each launch was a precise shot at the excavator's weakpoints. Before the soldiers could reorganize to mount the counterattack, a giant smoke screen surrounded them as firing stopped. As quick as it started, it ended. And when the dust settled, no one was around. But the feeling of being watched has not subsided..."
belchatow_dlc.8.a: "Where I am flame, be thou the coals."

belchatow_dlc.9.t: "Przeminęło ze smogiem"
belchatow_dlc.9.desc: "Sebastian turned the key of his old Volvo truck, the hefty plume of smoke it's been kicking up as it sped along the county roads coming to small puffs before finally subsiding as the vehicle became idle. He tapped the headrest with energy, trying to wake up the colleagues previously lulled to sleep by the irregular chugging of the long-unserviced engine. \n\n- Alright, boys. We're here. Let's go. The quicker we get this over with, the quicker we can get back. \n\nLanguidly, the crew exited the truck, stretching their legs as they headed towards the site. \n\n- Any trouble on the road? \n- Not this time. But I still don't feel safe around these parts. A lot of unpacified territory. I don't know how you can sleep knowing we might get ambushed at literally any moment. \n- You'll get it when you start getting extra shifts as well. \n- Mhm. Well, you'd better get some energy cause you're driving on the way back, remember? You're lucky that, unlike you, I'll actually keep the guard duty. \n- Yeah, yeah. No need to remind me, asshole. \n\nUsing bolt cutters, Sebastian cut through the chain and pushed the gate open, entering the property. \n\n- God, what a dump. You sure that's the right place? \n- Same as on the contract. I'd have expected the place we've been sending all our coal to be more... industrial-looking, but eh, maybe they didn't have anywhere else to put it. \n- Pathetic. What is this, even, a landfill? \n- Ugh, I guess. I can smell this place through my gas mask. \n- Well, tough luck. We can't really afford to be picky here. Coal's coal. Doesn't matter where it's been lying. \n\nThe group headed forward, climbing up the artificial mound originally built up to store the region's waste. Standing atop it, they looked down, trying to spot the prize they were after. \n- So, you see it? \n- Nothing as of yet. We may need to conduct a thorough search. \n- Damn it, what search!? You want to open every single trash bag hoping there's some coal in it? We're leaving. \n- But the Elder said not to return without... \n- I don't care what the Elder said! Can't you see that they've duped us!? The coal isn't there, Łukasz. It was never there. You'd have better luck grabbing a pickaxe and digging a hole straight down until you mine some yourself than giving this place literally another second of your time. \n- Hold on, the contract clearly stated this is the facility we've been sending it to. Somebody must have made those deliveries! \n- Oh, did they? Or did we just let the others handle the logistics? I'd bet you anything that half of those bastards probably got rid of it as soon as they crossed the border, just to spite us. Or sold it off for some quick profit. \n- So, what now? \n- Same as always. We go back, report this to our commander, and hope he doesn't let his anger out on us this time. But it will be fine. We're lucky they need us."
belchatow_dlc.9.a: "Sometimes giving up really is the best option."

belchatow_dlc.10.t: "Ground Zero"
belchatow_dlc.10.desc: "- Sir, northern Łódź is down.\n In the dark bunker room lit by emergency lighting, two Paladins paced around one, a higher-ranked one, with a pile of reports, design plans, and diagrams before him. They were responsible for this wreck of a substation, and for once, the problem wasn't the station itself. Even so, if power wasn't restored to the entire northern third of Łódź, it's their ass. \n - If you say that the direct power line to Bełchatów is sabotaged, and every single other point in the grid has been cut off by us at some point during our attack on our Dialogue foes, and we have no more than ten meters of high-powered cabling to spare, then there is only one way to restore power now.\n - It'll take us a week or two to dig through to the sabotaged lines, whether those cut by us or by the partisans \n - I know. Which is why we're going to reroute the eastern cabling to the southern line that goes through the Zona.\n - But sir, we don't even know if the Zone power line works! - The paladins were getting worried, knowing where this might take them. \n - Well, we're about to find out, huh! No one had any reason to dig through Zona lines. And it'll bypass the sabotage spot. - And so the two paladins got to work rerouting the substation. Predictably, to no effect. They came back to the bunker in hazmat suits, knowing where this was gonna lead them. \n - I don't want to hear it! Take spare substation repair kits, take the cable, and fix the damnable power line! Wherever the power line is cut, it's above ground by scavengers. So haul ass NOW! If I don't see lights in this substation by tomorrow, I swear you're gonna wish you were crawling through the fallout! - The honcho yelled, as if the Paladins weren't already packing iodine pills."
belchatow_dlc.10.a: "Łódź would shine yet eventually. But the Paladins were shining first."

belchatow_dlc.11.t: "Wezwanie do broni"
belchatow_dlc.11.desc: "\n- Whoa, I can't believe I'm actually training to become a Knight of the Brotherhood of Coal. I mean, how cool is that? Young Oliwier Słonik took a look around the other recruits transported to the training center, but found little enthusiasm. Most of them were conscripts. Many of them were from the territories of defeated Łódź warlords. Some volunteered just like Oliwier, but how much freedom did they have? Even before the Fall, Bełchatów was being separated from the rest of the voivodeship due to a lack of civilian train transport, leaving most of the youth there trapped to pursue a career as a miner or a taxi driver. The new regime extended the offer to a military career, but that satisfied the few. Those in the military bus who were satisfied with this career path were able to read the room well enough to be quiet in the crowd of malcontents. \n- When will you have a chance to fight for a cause greater than yourself? \n- I already had. - A hulking, bald man replied - But now the newspapers say they were illegitimate usurpers, so shut up. \nSłonik was discouraged from talking, but his mind wandered. He imagined himself in some mechanical exoskeleton, shooting flamethrowers while expanding the Brotherhood's influence west beyond Jeziorsko dam. He planned his career from a lowly recruit to a High Paladin. He knew that due to his courage, he would soon become a hero, saving damsels from the mutants that would crawl out of the hellish landscape of Baluty. He was just about to receive his imaginary kiss when the bus stopped. \n All right, pansies. Get out - voice of driver put the brought Olivier back on the ground. \nWhen the recruit exited, he noticed something wrong. Before this journey, he studied the Brotherhood's recruitment form extensively, and the place he found himself in didn't look like any of the training centers. \n- Hello, initiates! - A man in a black uniform appeared in front of them - I am Senior Knight Lorenc, and I'm your commander officer. I don't know what you were expecting coming here, but here's what you're gonna do. The civilized life depends on energy. We get energy from coal, so for the first few weeks, you'll be helping miners extract that precious material from Mother Earth. It'll help to keep your arms strong and enhance your fighting technique, so when the time comes, you'll know how to crack a skull by learning how to crack a rock. But, sir - mining business was something Oliwier wanted to avoid - when will we get weapons? Senior Knight threw a pickaxe in front of Oliwier's feet."
belchatow_dlc.11.a: "This is a weapon of an initiate"

belchatow_dlc.12.t: "Bleed Me Dry"
belchatow_dlc.12.desc: "The alarm is set for 5 A.M., and everyone at the temporary barracks in the Zduńska Wola District of Brotherhood's Sanitary Division wakes up to greet a brand new day. The electricity was nominally restored, but it would still take time for the connection to be reestablished to all parts of the territories controlled by the Brotherhood. That is why most workers at the Sanitary Division slept in their workplace, as few could afford enough power or coal and coke to heat their homes. That and also the fact that all the mess that ensued due to the blackout required constant vigilance from the Sanitary Division. Ignacy Rżewski was one of such workers. He crawled to today's schedule to see what remains of Ziemkiewicz's dreams he would take care of this time. He studied the table: Team 1 - The disposal of exploded electrical substations, Team 3 - Cleaning of the debris after the mass shop looting, Team 7, his team, was to be sent to Królewska 29. \n- Just my luck - he muttered to himself and headed to his car with a hardtack sandwich with preserved chicken paste. \nWhile travelling, he saw more and more shops being opened. Bread could originally be baked and sold at least in those enterprises that weren't looted. There were still lots of children begging for food, though not as many as weeka ago. The streets were still plagued with broken trams and broken people who tried to heat themselves in the cold morning with fire in barrels. \nWhen they finally arrived at the district hospital, they were greeted by a young doctor. \n- Where are they? - Rżewski asked, expecting the medic to know what he talked about. \n- They're outside. We had to. - The doctor spoke quickly - We had no generators. They weren't supposed to be necessary. The morgue wasn't cooled. We had to keep the hospital sterile for the wounded. \nRżewski raised his hand. \n- Spare me the story. I'm not a prosecutor or anyone like that. Just show me them. - he heard all about similar cases from colleagues in the cafeteria: women forced to give birth outside due to lack of light in the building, the epidemic of diarrhea and typhoid due to lack of drinkable water, and so on. \nMedic guided Team 7 to the backyard. On their way there, Rżewski noticed numerous amputees. Doubtless, cutting of limbs wouldn'tt be necessary if the hospital had power. \nIn the backyard, there were 6 bodies. They've been out here so long that they started to rot. Rżewski's crew packed them up in black bags and headed back to the van. On their way back, they were approached by a woman with teary eyes. \n- Is that my granddad?! - She shouted - He wouldn't survive without electricity. Where is he? The trains only started working today. \n- Mrs, we're just a Sanitary Division, you'd better ask one of the doctors. \n- I won't be brushed aside. Because of you, asshole, I never had the time to say goodbye. \n- As I said, I'm not authorised about the personalities. Expect information from the government in the coming days. \nOne of his men blocked the women, who wanted to get closer to Rżewski, allowing Team 7 to pack the bags into the van and leave, as the lady tried to talk to the nervous doctor."
belchatow_dlc.12.a: "Onto the next assignment"

belchatow_dlc.13.t: "Eyesight to the Blind"
belchatow_dlc.13.desc: "Wiesław was, understandably, quite proud of himself. The fifty-nine-year-old put his swinging arm to good use and, within a day, was able to chop nearly five cords of fresh wood. Even Grzegorz the Oak, until recently a nature monument, fell to his axe. Satisfied, he loaded up the trunk with as much of the bounty as he could, still spilling a hefty portion on the driveway as he accelerated. Now, the trick was - he knew a place. There was a good seller two villages over, and he always accepted supplies in bulk. Wiesław has always been one of his most reliable suppliers, moving his winter surplus for a pretty little profit. And surely now that most greenery in the county had been chopped up, there was plenty of room to haggle for an even better rate. With that thought in mind, he pulled up, only slightly concerned about the mountain of wood stacked right outside his house. As soon as he rang the doorbell at the gate, he could hear murmurs of annoyance from the approaching vendor. \n\n- Damn it, I said we’re not accepting any more. Read the sign, pal! This ain’t a charity! \n\nHe watched the man angrily run up to the front of his property, unbothered by his attitude. Henryk was never a particularly friendly guy, especially to outsiders. \n\n- Ha, it’s you. You won’t believe the number of people that’ve been haunting me all day, trying to peddle their damn firewood. So, what’ve you got for me? \n- Listen, I’ve got prime stuff here, straight from the Załęczański Landscape Park. You won’t find that quality anymore. It’s all been cut, ya know. \n- Oh, cmon, Wiesiek, you too? I’ve already got way more than I could ever possibly need. I’m not interested. \n- You’ve no idea what you’re missing out on. Give it a day or two, and the entire voivodeship will be after your supplies. You can make a fortune here. If anything, I’m doing you a favour. \n- Look, this is simple supply and demand sorta stuff. Everyone’s stocked up. I’m already taking a loss on what I’ve bought. It’s gonna rot out here before I get even a single customer. \n- Not this wood, it won’t. It’s durable stuff. Ah, you won’t believe how it resisted. See all the rings? That’s history, man. \n- Fine, here’s a deal for ya. I’m gonna pay you 100zł to fuck off. Then I’ll burn this entire shipment as soon as you’re gone. Take it or leave it. \n- Can you at least make it 500zł? That’s a full day’s work right there. \n- No. Get out of my property. Now."
belchatow_dlc.13.a: "A tough economics lesson for many a lumberman."

belchatow_dlc.14.t: "Honorowi Bracia"
belchatow_dlc.14.desc: "The refinery towers of dead Płock loomed like blackened teeth against the ash sky. Somewhere below, pumps coughed, dragged back to life by the Brotherhood of Coal. In a concrete office that smelled of oil and damp paper, two men sat across a steel table.\n- You see, Daniel, this isn't complicated - Rafał Ziemkiewicz said, folding his hands. - Poland ended because people pretended it was more complex than it really was.\nObajtek snorted, leaning back, boots on the table. \n- Yeah, yeah, don't start it. I didn't crawl out of Płock's gutters to listen to moral lectures. I already had enough of that shit before everything went to hell.\n- This is not a lecture. It's arithmetic - Ziemkiewicz replied calmly. - Coal kept the lights on. Oil kept the engines running. Ideologies didn't keep anything running. Numbers did. \nObajtek laughed, sharp and bitter.\n- Numbers? Numbers are why they kicked me out. Same bastards, same smiles, different flags. One day you're king of fuel, next day you're “toxic legacy”. Fuck them all\n- Exactly - Ziemkiewicz nodded. - They removed you because you understood infrastructure, not slogans. The Brotherhood of Coal was born from the same realization. Power belongs to those who control energy, not those who talk about it. \nObajtek leaned forward now.\n- And what, you want me to shovel coal and sing hymns to smokestacks?\n- No. I want you to do what you've always done - Ziemkiewicz said. - Centralize fuel. Secure supply lines. Turn chaos into balance sheets. New brand, but old. It's common sense. Coal for stability, petrol for expansion. Trucks, generators, armored columns. You know what happens when fuel flows and when it doesn't. I will even grant you your own staff. There are some very talented people from the Party of Drivers who would love to work with you.\n- So...\"my\" staff, but with your people. Sounds like a joke - Obajtek muttered. - Or a trap. I built an empire on fuel once - Obajtek said quietly. - And they burned me for it. Why wouldn't you?\n- Because I don't believe in purity - Ziemkiewicz replied. - I believe in utility. You swear, you steal, you push people. Fine. So does every system that survives longer than five minutes.\nObajtek smirked.\n- You're saying I'm a necessary bastard.\n- Have you ever read Prince? - asked Ziemkiewicz. Obajtek drummed his fingers, stained with old oil.\n- Fuck what, this singer? - he growled. - Hell no. I don't have time for popculture.\n- Jesus Christ, The Prince, as in Machiavelli? You know what, never mind. My point is - we provide security, we provide coal. You provide fuel and profit. We don't have to pretend this partnership is pretty, we only need to make it work\n- I want it real. Refineries, pipelines, protection. No priests, no poets telling me how to run it.\n- Agreed - Ziemkiewicz said without hesitation. Obajtek stood, walking to the window, staring at the dark refinery.\n- If this goes south, I burn you first.\nNaturally - Ziemkiewicz said. - That's how partnerships function.\nObajtek turned, grinning like a man who had finally found solid ground. He was sold, and Ziemkiewicz knew he won't go down quietly. But he was prepared for it, and Obajtek will be just another cog in the machine."
belchatow_dlc.14.a: "Of course it's a trap. And you just walked into it."

belchatow_dlc.15.t: "Jeśli chcesz zrobić omlet..."
belchatow_dlc.15.desc: "Forest is illegal, they said.\n So is life itself. The glee with which they scooped me and father from our forestry, chainsawing trees down just for fun... tells me enough of what a man is upon the Earth.\nA scourge. An apocalypse.\n In face of such men, those that tear families apart with glee and tear down trees with glee that should belong to animal-like copulation, a revelation dawned of me. God is real. And He hates this Earth. Perhaps He decided His creation sins too. Perhaps He saw a crocodile chew on a wildebeest. Alive. For hours on end. His wrath poisoned the mind of that lunatic Ziemkiewicz, and this spawned this Brotherhood of his. If Gaia hadn't offended God greatly, why would He send one such as Ziemkiewicz at Her? \n Far from my parents, far from my plants, far from all that both separated and associated me with a witch, from my dream catchers to weird herbs and unkept hair, to even a habit of bothering to wear a bra, which is shorter than the Fall... they take me in dank truck straight out of World Wars, to where I am to live and die. A decrepit ruin. A foul-mouthed Paladin instructs that this will be an alloy foundry and we must get it in shape. He does not understand: This is a ruin. Man in his greed made his hovels to be built quick, dirty, ephemeral. He'd be better off turning an opera house into a foundry... but that man bore no dissent. Of course. How else would he end up in Brotherhood?\nDespite myself, I drill in decrepit concrete and drag power lines, meant to carry power from the foulest combustion known to man, as though the whole point was to suffocate the Earth. So be it. Plants will chew up the carbon footprint, as disturbed nature brings down the man's hubris. As was with Tower of Babel, so shall it be again: This time, Man might be humbled yet.\n I speak up on crumbling floors and debris particles in my hair. Their response is a pimp slap and a lecture on deadlines. They want this up and running by the week's end. Impossible deadline, even if I knew much about preparing a plant for alloy refining. Unless we were all to work to death... perhaps that's the plan.\n In last days, they do not even feed us. A coworker of mine, one i almost made friends with, fell off the window, so dizzy was he. I didn't see him again. As I carefully take a hammer to a wall, I carefully look up to ensure nothing heavy falls. I set up supports near me in such a way that should prevent rotting, but still reinforced concrete from faltering without that wall. One swing from me, another from a stronger capture. We tear down this wall with all the yearning for freedom that those during Gorbachev felt. And to my right... my support falls. Caved in with its floor, falling down.\nAnother sickening crack. The floor giving in from under me. The dizzying sense of losing balance as both this floor and the cracking, falling ceiling above me sandwiches me with merciful crunch..."
belchatow_dlc.15.a: "God doesn't hate me. So He took me out of here."

belchatow_dlc.16.t: "...musisz rozbić kilka jajek"
belchatow_dlc.16.desc: "Report no. 5309: On Central Industry Expansion & Establishment Effort\n\nSite no. 42 has been condemned as of 1100 yesterday. An incident has been recorded where section of 2nd and 3rd floor caved in during clearing of a wall for appropriate foundry space. Thanks to the foresight and assessment of Brother Dębosz and Sister Pałka, we have flagged the building as unstable and unsuited for repurposing. However, due to time and deliverables constraints, and seriousness of the priority of timely delivery, a joint decision has been made to direct untrustworthy elements, in form of 20 individuals flagged as suspect by our Paladins, conscripted and spirited away from their homes.\n The works proceeded smoothly until the incident. Dębosz and Pałka have made their assessment (see attachment) and decreed the cause of the incident to be misjudged strength of the rotting floors. After support from the broken down wall faltered, the floor it supported caved in on two laborers, and the force of its fall caused the floor beneath to cave in as well, sandwiching additional three. Those three, unlike the two above them, have been saved, but are disabled for life.\n No equipment exceeding the value of 5000 dollars have been endangered in this incident. However, this incident proves that high-risk building restoration combined with unqualified workforce guarantees loss of life and equipment. To preserve this project, its industrial potencial and ability to make the most of the mighty Bełchatów plant, i require:\n - Additional qualified surveyors to accurately condemn ruins, or mark them for restoration \n - further recycled (not non-smolten scavenge!) steel beams, as well as additional mobile means of forming new complementary cement \n Qualified foremen to adequately exploit forced labor. \n - In fact, if you know what's good, just let us tear down those ruins and recook the concrete and steel on-site, and let repurposing happen in industrial ruins. This is a case to show you can't make shanty industry: The one or two months we spend longer here will pale in comparison of having actual factory halls to work with. Please. \n And for the love of coal, don't believe the rumors that I willfully inserted the laborers into a building I knew was about to collapse just to make a point."
belchatow_dlc.16.a: "I sent the dispatch and cooked omelette for breakfast."

belchatow_dlc.17.t: "A Meeting of the Minds"
belchatow_dlc.17.desc: "11:00\nThe massive conference room sat mostly empty, the schedule having been cleared out long in advance. Only three men have been granted sufficient clearance to attend the meeting, and one of them, sitting at the head of the overly long table, had no intent to actually participate. Rafał Ziemkiewicz took a tired sip of his morning coffee and addressed the two sides of the discussion, each armed with stacks upon stacks of blueprints, files, and projections to advance their case. \n\n- Alright, gentlemen. If I'm to be honest, I'm getting sick of both of you. For the past week, you've been going on nonstop about your economic proposals, and I just cannot deal with it anymore. I'm giving you an hour. Figure something out together, and I'll check up on you when you're done. \n\nWith that, the Elder got up from the table and left the room, placing two guards outside the door with orders not to let Gadomski and Warzecha out under any circumstances. With a quick look back, he saw the Wartownik smugly gearing up to begin the argument. Ziemkiewicz closed the soundproof door, and with that, momentarily, his migraine subsided. He went to his office for a well-deserved break. \n\n12:15\nAs he returned to the conference room, Ziemkiewicz wondered just what results he could expect. There was a flicker of doubt in his mind whether the two would actually be done, but he could stomach accompanying them for the closing details. He opened the door for a split second. \n\n- You damn neoliberal stooge, I always knew you were a Wiechowite! I'll make sure the Elder has you shot for this insolence. \n\nHuh. Maybe another hour will get them to cool down. \n\n13:45 \nFully expecting the emotions to wear off by now, Ziemkiewicz confidently strolled into the room. \n\n- You mindless buffoon, you want to just dig up half of Poland? Ooh, me want coal, me need to dig big hole. You're a fucking caveman, Łukasz. At this rate, you'll turn the country into a smoldering wasteland. \n\nNope, not getting into that. At least they didn't see him. \n\n17:20\nAfter an afternoon nap, the Elder felt a new surge of energy. He was ready to get in there, assert himself, and force the two to collaborate. Upon entering the room, he quickly changed his mind. The massive conference table had somehow been flipped over, and his advisors were using it as cover while blindly pelting their files at each other. It seems like Warzecha landed a hit, judging by Gadomski's scream. \n\n19:50\nThe interior of the room was in such a state of disrepair that it could only be explained by some kind of explosive going off inside it. Neither Warzecha nor Gadomski was injured, and they were currently trying to physically pin one another into submission. The guard vehemently denied anyone either entering or leaving the room to acquire said explosive. \n\n23:30 \nThis was Ziemkiewicz's final planned checkup. Finally, there was silence. Warzecha and Gadomski lay, passed out, on opposite ends of the room, exhausted. The guards were ordered to carry them to their respective chambers. All furniture was destroyed, save for a small coffee table, which remained in perfect condition. On it - two neatly arranged binders, each with the finalized version of one of the candidates' proposals."
belchatow_dlc.17.a: "Like water and oil."

belchatow_dlc.18.t: "Without a Hitch"
belchatow_dlc.18.desc: "A black sedan stopped on the side of a gravel road, roughly 50 meters ahead of the entrance to the Uniejów mine, its bodywork completely stained by mud. A short, stubby man stepped out of the passenger seat, his all-white suit with a decorative handkerchief clashing with the industrial scenery. Bogusław, the master of ceremonies, adjusted himself, tucking in the pantlegs to avoid them accidentally getting soiled during his visit. Exacerbated by the sight of his workers cordoned off by the site's security detail, he angrily ran towards the commotion, waving his fist in the air in protest, followed by a squad of Brotherhood enforcers. Upon reaching the guards, he stopped for a breather before demanding: \n\n- What is all this supposed to mean? Elder Ziemkiewicz will be here in two hours. We've work to get done. \n- Orders of Mr. Czerepiec, we can't let anyone through. - The guard asserted himself. \n- Oh, move over, boy. - Bogusław muttered in indignation. - I don't have time for these games. \n\nBefore the guard could make a move to restrain him, the enforcers pushed their way through the cordon, effortlessly sweeping aside the untrained security. \n- Good. Fetch me that Czerepiec, will ya? Looks like the two of us will need to have a conversation. \n\nIn five minutes, enough for Bogusław to finish his smoke break, the soldiers dragged out the mine owner from his cubby, carrying him forcefully by the shoulders to their expectant boss. \n\n- Let me... damn it, let me down, you brutes. - Mr. Czerepiec wriggled panically. \n- It's okay, you can let him down. He's harmless. - Bolesław dismissively signaled with his hand for the enforcers to drop the owner. - So, what's your deal, huh? You got some kind of death wish? \n- Listen, for the good of both of our jobs, I can't allow the opening to proceed as planned. \n- Why? Enlighten me. What part of the programme do you apparently take issue with? \n- Look, you've done nothing wrong. All of this is on my end, okay? But they can't go into the mine. That part's off. \n- Ha, seriously? Oh, please, that part's just theatrics. You don't have to worry about any inspections from those guys. \n- You don't get it. \n- Cmon, what's wrong wit' ya, pal? Let the Elder have a swing at his pickaxe. - He nudged the owner playfully. \n- Fine, you wanna know what the problem is? We can't have him swinging away at a chunk of coal because, as of yet, we have no coal. Nothing. We're still coming up empty. \n- Wait, seriously, that is the whole issue? - Bogusław appeared unbothered. - No, don't get me wrong, that is a massive problem, a catastrophe even. For you. I don't care how you worm your way out of this afterwards. I've got a ceremony to run. So, I don't know, paint some rock black, make sure it's dark in there. You think they'll be able to tell a difference? Just smile like your whole life wasn't on the line."
belchatow_dlc.18.a: "All in all, another successfully forgettable ceremony."

belchatow_dlc.19.t: "Łódź po zmroku"
belchatow_dlc.19.desc: "The cold. The unbearable cold. It was all Miłosz could feel walking through the streets of Grabieniec after a day’s work by the furnaces. The air clung like needles to his skin, already covered with just about any layer he could manage to put on. He breathed through a piece of cloth. Each time, he had to draw the air in heavily not to feel lightheaded, but every time he had the idea to take it off, he started to choke from the unfiltered particles. He passed through a forest of misshapen slabs of concrete, which he could only assume were meant to be decorative. At the very least, they were unique enough to guide the way when the smog descended and made the street signs unreadable. \n\nEventually, he reached his own. A ‘premium’ five-story housing block in the centre of a gated community, affectionately named ‘Emerald’. The exclusivity was striking - it was one of the only buildings featuring a colour other than black, with a single stripe of dark green doing all the heavy work. A floorplan adorned the side wall past the entrance, stylised into an image of a mine, with numbered deposits symbolising each of the apartments. The elevator, too, matched the overall theme, that is, if creaking like a century-old lift cage was an intentional feature. \n\nInside, Miłosz shivered even more than during the route back home. The heating was busted again, for the third day in a row, and the second such time this month. To be honest, it was broken more days than it wasn’t. He put on an additional layer to compensate, watching his frostbitten plants slowly wilt away. He should probably buy new ones at this point, but with the ongoing campaign discouraging public greenery, they’ve currently become a black market commodity. Besides, they’ve still got a leaf or two left standing. They held on, and in a way, he admired them for it. \n\nHe put the kettle on, heated up a ready-made meal, and sat by the dining table, staring blankly through the window. Hundreds of lights pierced the thick bed of smog covering the city. Hundreds of apartments, broken slabs of concrete with a thin coating of humanity. Hundreds of lives, each likely just as miserable as his. Miłosz felt the burden of his struggle, but he knew he didn’t carry it alone. He wasn’t sure whether the thought brought him a sense of comfort or just more resignation. All he had was pity. For himself and all the others."
belchatow_dlc.19.a: "And so, life goes on in Łódź."

belchatow_dlc.20.t: "Dużomiastowy"
belchatow_dlc.20.desc: "Picture this: an injustice of the centuries renders our country without Gdańsk, our most important port city. So in mere decade, we build Gdynia next door, a whole new port city. By the time we gain Gdańsk back, we have a Tricity of a metropolis, won by sweat and blood alike. Now the nation collapsed again, threatened by its imperialist neighbors again, but most of all, by the malaises haunting their minds: ecocentric, antihuman thought. \nBut lucky for us, no one can afford to be insane when shelter and warmth are guarantees no longer. And so our worldview, the Brotherhood of Coal arose, took two old cities and made one out of them: A new metropolis standing on reason, power and light. In this metropolis, no retiree fears if they can afford fuel again. \n The smoke of the chimneys cover the night and day alike, moderating otherwise incessant sunlight in its bright fog. The city lights fade and blur in the smog: but still they prove that in mere months, the civilized living is back. People have warm homes, and no reason to not enjoy life in whatever air-conditioned establishment they prefer. Humanity heals as it can, and nature yields what it must. I stretch and breathe in the warm air, seeing the splendor before me. A city that personifies the Brotherhood: Standing on reason, with concrete foundations, panel housing set up in mere months, streets reforged in mere days, chimneys rising to the skies, their red lights barely visible. In this man-made cloud, one can live as before Fall. Others could never believe it possible that normal life can return this soon, shackled by their environmentalist, suicidal doubt."
belchatow_dlc.20.a: "This city alone is enough to prove us right."

belchatow_dlc.21.t: "Rewolucyjne drogi"
belchatow_dlc.21.desc: "Witold Gadomski was a man in seventh heaven. Finally, he had done it. Since the beginning, he had been the sole voice of reason within the Brotherhood, the only adult in the room trying to come up with realistic projections rather than some coal-infused fever dreams. For the first time, the top brass had actually listened. His plan had been pre-approved. Since then, he’d spent the past week meticulously crafting the finer details to make it foolproof. No amount of scrutiny and bad faith from his competitors would be able to make a dent. The planned budget meeting was going to be his victory lap in front of Ziemkiewicz’s entire inner circle. \n\nThe conference room, the same one he and Warzecha trashed during their power struggle, had been repaired for the occasion. Though the size of the crowd was a slight disappointment, with only four members in attendance, Gadomski cared only for the fact that the Wartownik was, in fact, present. He couldn’t wait to rub the victory in his face. \n\nFor a reason he couldn’t quite understand, the Starszy Paladyn felt a sense of unease. The light was slightly too dim, the other members too poised. He tried not to let it get to him. This was his moment. \n\n- Starszy Paladyn Warzecha, before we begin, I have a question to ask you regarding your proposal. - Janecki is asking questions. That’s never a good sign. \n- Of course, Proktor. I’m prepared to address any doubts you may still have. \n- Fine. In that case, Starszy Paladyn, could you kindly disclose which foreign subversive group you are currently affiliated with? \n- Pardon, Proktor? - Was he just trying to throw him off, Gadomski thought. \n- He’s saying such treasonous drivel couldn’t come from someone serving the Brotherhood’s interests. Cmon, Witold. You were so eager to talk just a second ago. What happened to you? Answer our colleague. - Warzecha couldn’t hide the smugness of his smile. Not that he tried to. \n- You lost, Łukasz. Give it a rest. Elder Ziemkiewicz, talk some sense into them. \n- So now you dare invoke my name, you Wiechowite puppet!? After already deceiving me? You tried to destroy MY Brotherhood! Everything I’ve built! I know it all, I know what you were after. You’re lucky Wartownik Warzecha warned me about the catastrophe you would’ve unleashed. And you'd better hope you’re just an ignorant liberal, because if we find who you’ve been working with, if we find you planned to purposely disassemble the Brotherhood’s institutions, this is the end for you, understand? \n- Well, looks like the Elder already gave out the surprise, so Starszy Paladyn Warzecha, please take a seat. Make sure you’re comfortable. This is the first hearing of an ongoing investigation to determine the extent of your treason. We’re going to be here for a while."
belchatow_dlc.21.a: "So much for good intentions."

belchatow_dlc.22.t: "Nowe oblicze Bractwa"
belchatow_dlc.22.desc: "Nie powinieneś tego widzieć...no i masz Ci los. Co tu robisz? Właśnie zainfekowaliśmy twój umysł propagandą węglową. Zaczynasz czuć niepohamowaną potrzebę by dołączyć do Bractwa. Teraz weźmiesz swój kilof, pójdziesz do najbliższej kopalni i ZACZNIESZ KURWA KOPAĆ TEN JEBANY WĘGIEL. OPÓR NIE MA SENSU. PRZYJMIJ SMOG DO SIEBIE, PRZYJMIJ POTĘGĘ WĘGLA I STAŃ SIĘ JEDNOŚCIĄ Z ENERGIĄ."
belchatow_dlc.22.a: "Pan jest oszust, panie graczu."

belchatow_dlc.24.t: "Dziura"
belchatow_dlc.24.desc: "I remember Silesia when it still had names. Not just Katowice, Bytom, Zabrze - but names whispered by brick, soot, and windowlight. German order once cut this land into straight lines and timetables. It was cruel, yes, but disciplined. The shafts were deep, the streets shallow, and everything had a purpose. Coal had a face then: a foreman's watch, a school bell, a grave with a cross. Then came the Polish hand - clumsy, hopeful, exhausted. They painted over German letters and called it justice. They built blocks of concrete optimism, stacked families like verses that almost rhymed. The mines groaned, the air thickened, but there was life. Choirs sang under smokestacks. Children played football on slag heaps and believed the ground beneath them would last.\n\nAnd now - now comes the Brotherhood.\n\nThey do not rename cities. They erase them. I walked where Ruda once stood and found only a pit wide as memory. Streets are not rebuilt; they are peeled away like useless skin. Churches lie folded into the earth, their bells swallowed by excavators that pray only to yield. There are no cemeteries anymore - the dead are relocated with the living, statistics on evacuation lists stamped in ash. Industry has fled east, dragged like a wounded animal to Łódzkie, where new halls rise clean and soulless, humming without history. There, machines are safe. Here, land is expendable. The Brotherhood says it is necessary. They always say that word - necessary - as if it were holy. Necessary to feed the furnaces. \nNecessary to sacrifice Silesia so that Poland, or what remains of it, may breathe one more poisoned breath. Necessary to keep the lights on beyond the Desolation. That's what the people started to call it. Desolation. Where you see what they have wrought upon here, you'll understand the meaning of this word. The Germans exploited. The Poles endured. The Brotherhood consumes. There is no ideology, only extraction. Or rather, that is their ideology. They do not hate Silesia enough to destroy it - they simply need what lies beneath it, and nothing above is worth saving. This is what makes it worse. You cannot argue with a ledger. You cannot plead with efficiency.\n\nI stand at the edge of a new mine, watching a city become a contour line. Wind carries coal dust like black snow. Somewhere far away, generators roar, alive because this place is dying. Silesia has always paid for the rest of the country. But this time, there will be no ruins left to remember us. Only energy, flowing outward, nameless. And when the Brotherhood is done, when even coal runs thin, there will be nothing here at all - not a province, not a graveyard, not even silence.\n\nJust a hole where a land once learned how to live."
belchatow_dlc.24.a: "And now it forgot how to die."

belchatow_dlc.25.t: "Węgiel to jedyne prawo"
belchatow_dlc.25.desc: "My name is Mateusz Bargieła. I work in the Steelworks, Furnace no. 3. Mostly because they told me to. Because the steel must flow, because the Brotherhood demands it, because stopping would mean hunger faster than hope ever came. I used to walk home after shifts. Through trees. Through the smell of water from Pogoria, through streets that still remembered laughter. My wife waited. My son slept with the light on. Dąbrowa Górnicza was ugly, maybe, but it was ours. They flattened it in a week.\n\nThey came with maps older than our lives, where red lines were drawn over kitchens and bedrooms. An \"inactive shaft,\". \"Strategic reopening.\" \"Forced population redistribution\". They measured my house like a tumor. Then the machines arrived. Walls fell faster than words. My family was gone before I finished my last shift - evacuated to the edge of the city, stacked into megablocks like spare parts.\n\nHow could one stop it? How could one rage against a whole machine? We tried... \nMen from the mill, miners, welders, women with children on their hips. We shouted, we blocked roads, we burned tires. Someone raised a flag. Someone else raised a rifle they didn't know how to use. For one night, we believed rage could become victory. By morning, the Brotherhood reminded us what power looks like. They didn't massacre us. We kinda expected it to happen. And we quickly understood that would have been mercy. They arrested leaders, reassigned shifts, cut rations. They let us live and watch. That's how rebellions die now. The forests are gone. Cut, burned, or buried under slag. The lakes are gone. Drained, poisoned, or renamed “industrial basins.” Homes are gone. Not ruined - erased. Every memory that I ever had tied to that damn piece of concrete is now a smoking pit in the ground. \n\nFrom the blast furnace platform I see the horizon. There are no landmarks anymore, only cranes, shafts and smoke. Our industrial machines roar like a beast fed with cities. Sometimes I think I hear screams in the metal, but it's only stress fractures cooling too fast. My family survives. That's the cruelest part. Alive, but hollowed out, waiting for permits, waiting for reassignment, waiting for something that never comes. My son doesn't ask when we're going home anymore. He asks where “home” went. How am I supposed to look into those eyes that no matter what glitter with hope and tell him that daddy gave up?\n\nSteel and coal will save us all. This is the slogan on one of the gates of the Steelworks. That's rich. I no longer believe in saving. I believe in remembering names. Streets. Trees. Rooms that existed once and were taken deliberately. I believe in counting every truckload of coal dug from beneath my kitchen. I believe in the weight of steel, and how easily it can be turned from beams into blades.\n\nThere is nothing left here but rage. And I'm afraid...nothing will save us, as we live in nothingness. And the only thing we can do is remember. My name...is Mateusz Bargieła."
belchatow_dlc.25.a: "I used to work in the Steelworks..."

belchatow_dlc.26.t: "Czego kuźnia wymaga"
belchatow_dlc.26.desc: "- There's this whole Forge Cult they started. It's completely wild, man, you've got to try it. \n- I heard they will reward everyone attending with a monetary bonus. \n- The bishop said the Mysteries are acceptable for Catholics to join. After numerous encouragements from his shift mates, Jan Dyzma decided to finally give in and check out what that new ceremony was all about. After his work day ended, instead of going up the tunnel, he took a side turn with those who were heading for the ceremony. As they descended down the tunnel, they met a man in a robe, handling similar robes to whoever asked for them. Jan also took one, as they were seemingly necessary for the ceremony. \n- Who knew that things would escalate that much? - Jan thought to himself. \nHe noticed that his colleagues started coming up with many new mining songs, saying the name of St. Barbara more than the name of Jesus, and a few miners started referring to mines and ores as if they were living, but this? Then they finally arrived in the giant underground chamber, the size of a small Church. When Jan entered, he and all of the others gathered, and their attention was captured by the giant lamps on the farthest wall in front of them. The lamps imitated stained glass windows and depicted St. Barbara, St. Clement, and St. Kinga. Each saint had a person of the Holy Trinity associated with them. Barbara had Jesus watching over her, Clement - the God-Father, and Kinga - the Holy Spirit. \nThe beginning of Mystery consisted of singing numerous miners' songs such as 'Anna Mine', 'Long Live the Mining Class', and 'Knights of Life'. After that, someone who appeared to be a master of the ceremony entered a pulpit and began a sermon. \nMy name is Eliasz, I am the Head Scribe of the Forge. I welcome you and thank you for your numerous attendances at the first meeting. We're here to pay Mother Earth a gift for the bountiful resources that offer us. That is the meaning of our first ritual.\nHis assitant went next to him with a fern on a silver platter. He placed the plant to the left of the altar and buried it with dirt. \n- After millions of years, such ferns transformed into our beloved coal - Scribe continued - It's an act of remembrance of this process. Then he had another assistant carry a raw piece of meat on a similar platter. \n- The New Covenant was broken after the destruction of Poland. From Poland was supposed to come the spark that would prepare the world for the final coming of the Lord. How can there be any say about a spark when the Forge is cold? What do we do? We need to reheat the Forge. In the old ways. By sacrificing a lamb. \nThe meat was placed in a hearth and set on fire. \n- The further we are from salvation, the greater must be the sacrifice."
belchatow_dlc.26.a: "Węgla węglowemu bogu!"

belchatow_dlc.27.t: "Dzień Postępu [GetYear]"
belchatow_dlc.27.desc: "The tickets for the Progress Day sold like hot cakes. Numerous families gathered to celebrate the core of Brotherhood's ideals and their successes. Numerous attractions were designed to make this day memorable. The black transparencies and stalls, which in the old world were considered grim, bringing to mind funerals and mournfulness, now brought people joy and amusement as everyone was eager to have some merriment after the horrible times of the Blackout. Even those who were sceptical of The Brotherhood's ideals gave in to deducing that, after overcoming the energy shortage, the Carbon Crusade was now unstoppable. \nPeople enjoyed the possibility of using the authentic railway rifles on the shooting range on the dummies imitating the eco-fascists. Those less military inclined were captured by the 'Miner's Style' fashion show with models presenting the new stylish garments for men and women, admiring both the design of the clothes as well as the model wearing them. The youngest were greeted by the Brotherhood's mascot the Mine Boy, handing them the plushies stylized to look like Elder Ziemkiewicz as well as Kopalnioki - Silesian black liquorice candies. There were also tents where miners told stories of their underground adventures and the Paladins, who spoke of their most glorious actions during the wars of reunification. All of this, while everyone could hear Roksana Węgiel singing on the stage at the south end of the ceremony area. After it was done, Elder Ziemkiewcz felt comfortable enough to give his commemorative speech. \n- Brothers and sisters! It is a great pleasure seeing you here. We have overcome many hardships and obstacles. We survived and thrived thanks to collective effort and wise leadership. I hope that the greatness of this Progress Day will be repeated or even surpassed in the next year. Now, let us celebrate what has brought us to where we are today. The trampling over enemies of order. \nOn signal, squires near the scene pulled the blankets, revealing the 5 pyres of coal with effigies of the vanquished Łódzkie warlords and one additional pyre for Jakub Wiech. Ziemkiewicz signalled to have the pyres burned. \n- Their machinations will never again sabotage the machine of the Brotherhood that provides energy for us all - the Elder continued - When leaving, each of you may feel free to take a bag of coal and coke as a gift. You will never be denied the fruits of Mother Earth again!"
belchatow_dlc.27.a: "Coal and Progress for Everyone"

belchatow_dlc.28.t: "Przedawkowanie"
belchatow_dlc.28.desc: "- Did you check Sector C again? - Marek asked, adjusting his helmet even though we were standing in an office with fluorescent lights and a motivational poster that said COAL IS TRUTH.\n- I checked it three times - I replied. - Once with a drill team, once with geologists, and once by staring into the pit and hoping reality would blink first.\nWe realized the coal was gone on a Tuesday, which felt appropriate.\nIt did not. Bełchatów Mine, the eternal coal basket of the Brotherhood, was empty. Not metaphorically empty. Not \"restructuring-empty.\" Actually, physically embarrassingly empty. Just rock, dust, and the lingering shame of a civilization that dug too greedily.\n- That's impossible - Marek said. - The pamphlet says we have reserves until 2075.\n- The pamphlet also says the mine is \"spiritually self-renewing.\"\nWe sat in silence, listening to the distant sound of excavators chewing on nothing.\n- Maybe we missed a layer? - he tried.\n- We even excavated dinosaurs here, Marek. There is no layer left.\nThe problem, of course, was paperwork. You can't submit a form for \"the coal has ceased to exist.\" There was no checkbox for \"Brotherhood theology has encountered geology.\"\n- Have you told Central? - Marek whispered.\n- I sent a preliminary report. I phrased it as “temporary material noncompliance.”\n- Smart.\nOutside the window, the pit yawned like a dead god. Workers still showed up because shifts existed. Machines still ran, because budgets existed. The Brotherhood had scheduled extraction for the next twenty years, and nobody had told reality to update its projections.\n- What happens when they find out? - Marek asked.\n- They won't - I said. - Not immediately. They'll assume sabotage. Or inefficiency. Or Wiechowite thinking.\n- Could coal come back? Like... organically? What if we wait?\n- Marek, this isn't a forest. And besides, you would need to wait like, what - millions of years? God knows we have enough fossils in Central, and they're not mineable. Not yet, at least...\n- We could reclassify the rock - he suggested. - Call it “pre-coal.” Or “coal in waiting.” Or “coal that resists extraction ideologically.”\nThe propaganda speakers outside began their hourly sermon: BEŁCHATÓW FEEDS THE NATION. The pit echoed it back, hollow and mocking.\n- Do you think this has happened anywhere else? - Marek asked.\n- Of course not - I said immediately. It was not even up for debate.\n- What...now? I mean, this is...this...is big. I mean like BIG - big. We can't...no, we can't tell them. They're going to kill us. Oh my gODTHEYREGOINGTOKILLUS - Marek was hyperventilating. And he was not wrong. If we were to report that the heart of the Brotherhood's power just lost its treasure, we would not see another day. And I couldn't even calm him down. I don't know if I just couldn't compute what happens...Or I have acknowledged that I'm already dead."
belchatow_dlc.28.a: "Maybe if I close my eyes the coal will appear again..."

belchatow_dlc.29.t: "Zbieranie burzy"
belchatow_dlc.29.desc: "No alarms - not yet - just the thin, arrhythmic whine that meant cavitation somewhere deep in the hydro loops. Jacek stopped walking and closed his eyes, counting the beats like a physician counting a pulse. Too fast. Too uneven. Water was moving where it shouldn't. Above him, the agricultural vault stretched for kilometers: stacked terraces of grain, fungal vats glowing sickly blue, drip-lines hanging like veins from the ceiling. Brotherhood banners watched from the gantries — hammer and pick sigils on black cloth. Jacek adjusted the seal of his mask and brought up the soil readouts on his wrist slate. Nitrates spiking. pH slipping. Heavy metals are rising from the deep strata again. They faced those issues for over a month now. Official position of the state - Wiechowite sabotage. And no one suggests physics or plain biology. He was a biologist by training, though the word never appeared on his papers. Hydro Manager, Third Grade sounded safer. The Brotherhood tolerated hydraulics.\n- Manager Jacek? - The voice crackled in his ear - It was Junior Overseer Maria, mining family, no technical background, promoted at nineteen. They have no idea what they're supposed to do here. But that doesn't matter to the administration.\n- Section A233 reports yellowing leaves. They're asking if we should increase fertilizer flow.\n- No. Cut it. Slowly. If you spike nutrients now, the roots will burn. The soil's already poisoned.\n- The soil can't be poisoned. The soil has been sanctified - she replied after a short pause.\nJacek looked at the numbers again. Cadmium. Mercury. Ash seepage from the old combustion pits, leaching upward year by year.\n- Sanctity doesn't bind molecules, Overseer.\nAnother pause. Longer this time.\n- You better not repeat those lies. It's treasonous.\nHe didn't answer. He rerouted water manually instead, throttling the flow to Section A233 while bleeding pressure elsewhere. The pumps screamed louder. Across the country, he knew other managers were seeing the same signs. Wilt in Opoczno. Mold blooms in Zawiercie. Root necrosis near the New Central Industrial Regions. All separate reports, all explained away as sabotage, laziness, or insufficient dedication to the axioms. No one above him knew how plants died. They never cared about such science, a “green treachery”. And thought they could be oblivious to nature without nature returning with wrath.\nThe first major event hit an hour later.\nA fungal vat in Sector F110 overheated when its cooling loop clogged with ash sludge. The spores mutated under stress - Jacek had warned about that years ago - and released enzymes into the runoff. The runoff fed the grain terraces. The grain absorbed it greedily and began to rot from the inside out. The leaves stayed green. Stalks stood tall. Harvest looked perfect. Until they snapped into black mush under their own weight.\n- Manager! - Maria again, now shouting. - The yield just collapsed! All at once!\nJacek leaned against the railing, staring down at hectares of food turning to slurry.\n- It's systemic - he said quietly. - The soil's crossed the threshold. Everything's feeding on poison now.\n- Fix it now, or we'll all be hanged! I remind you that we are supposed to feed the whole Łódź aglomeration!\nHe almost laughed.\n- This station is dead already."
belchatow_dlc.29.a: "- And so are we."

belchatow_dlc.30.t: "Wołowina+"
belchatow_dlc.30.desc: "\n- Boss, i've came with news regarding our spices project. I have two news: good and bad. Which one do you want first? \n- The bad one, of course. \n- It does not work. Or rather, it works too good \n- Hmm, what about the good one? \n- We made it! \n- Ah, finally. Wait, what do you mean it does not work?\n- Well, as per request we've quadrupled the amount of genes used in the next pepper batch. We took genes from all kinds of animals: cows, pigs, chickens, but this time we chose \"gene cocktail\" having 68 percent of genes coming from kangaroos. The problem is that the spice is so... \"lively\" it wants to... jump out of your plate. \n- Wait, what do you mean by that? \n- Well, when you put it on your food, it starts moving around, trying to escape. It's like the spice is... alive. We believe it because of compounds inside the meat called \"motilins\". They make the spice move. \n- Well, we have failed this time, but we will try again. Maybe we should try with less exotic animals next time? \n- Sure, boss. \n Overseer sighed and looked at the petri dish with a meat cut covered in moving grounded pepper. He had high hopes for this project. People were craving flavors they remembered from before the collapse, but with limited resources, it was hard to provide them. The idea of genetically modifying spices to create spices that would have simillar taste profile to meats was brilliant: Both Council would be happy - because we would eat more meat - and ordinary people would be delighted - because they wouldn't have to eat another shoe-like flavored cut of meat. \n- Next time, try with less exotic animals, okay? Maybe just cows and pigs. \n- Sure, boss. \nHe sighed again and put the petri dish into the incinerator."
belchatow_dlc.30.a: "Steaks with a kick"

belchatow_dlc.31.t: "Państwowy przemyt"
belchatow_dlc.31.desc: "\n- Are the goods ready? - Johann Fahrer asked the storage manager. It was a dark, moonless night just like he liked it. \n- Yeah, everything's fine. I made sure that the manifest won't mention these tons of coal missing. Johann was an experienced smuggler. He used to make regular trips to the Polish side, transporting weapons, drugs, and people in his truck. Yet in his whole career, this was the most bizarre assignment he had ever gotten. Here he was in Jänschwalde, stealing coal. Something people usually buy, especially now that Germany wants to once again try this whole green energy thing. What's more, he was supposed to meet his contact in Bełchatów Mine. That's Brotherhood of Coal territory. Wasn't this our whole thing? And he was supposed to go to the lion's den. True, he was promised safety, but still had to stay undercover even from the Brotherhood's officials, even though it was a government contract. \n- Okay - he had said back when he was making the deal - If I have to handle the coal to the Brotherhood's official anyway, why can't I meet with him at the borders and go straight to the capital region? \n- We need to maintain utmost discretion. - The Brotherhood's agent had said in perfect German - Our own additional driver would mean another link we'd fare better without. You shouldn't face any problems with the papers we'll provide you. But if you do, say the name of Paladin Wieżycki, and you should be fine. \nThe more he thought about it, the less sense it made. But the pay was good, so he got to work. He had all the documents he needed. Each fake trading allowance for each clique, whose territories he'll travel through. After leaving Germany, he changed his plates to pre-Fall Polish ones. He also took a machine gun from his hidden stash. He would put it in the truck's secret compartment. \nWhen he arrived at the Brotherhood's border, he was greeted by the honest-to-God border post. Looks like the Poles once again learned what civilization means. Gone were the days of anarchy of dozens of warlords, where order's reach was just as long as the range of makeshift rifles. Heck, most of the licenses he had turned out obsolete as the warlords who demanded them were already ousted from power by more powerful foes. \n- Get ready for the search - the guard announced without any greeting. \n- That won't be necessary - Johann said in Polish and showed him the paper stating the contents of this transport: miners' rations and the priority code that exempted him from search. \n- Yeah, I won't to be sure - the guard insisted, perhaps noticing the smuggler's accent. \nTime for plan B. \n- Okay, you may take it to Paladin Wieżycki and explain to him why you insisted on stalling the rations transport, hindering the mining process. \nThe Brotherhood's man backed down and gestured to open the gate. \nThe rest of the course was uneventful, but the closer he got, the more opening the car window was airing the outside out and not the other way around. \nHe arrived at Belchatów mine during the night and unloaded the coal in the storage. He got paid by the same agent who hired him. Before he left to return to Germany, he heard the agent's quarrel with someone. \n- Why do we have to trade for coal? And with the Krauts no less?! Why didn't anyone tell me?! \n- It doesn't matter. It's just a temporary solution. This won't happen again, and we'll never speak of it again."
belchatow_dlc.31.a: "Uh, die Wirtschaft der Bruderschaft..."

belchatow_dlc.32.t: "Czas zaprzyszły"
belchatow_dlc.32.desc: "Łukasz Warzecha played chess the way some men smoked - too often, too late, and alone. The lamp over the table buzzed like it might give up at any second. The rest of the room stayed dark on purpose. Light made things honest. Warzecha had no use for that. He sat with his coat still on, collar up, staring at the board as it owed him money. White to move.\nHe pushed a pawn forward. Safe. Boring. The kind of move that told the world nothing. \n- That's how it starts, he muttered - Nobody notices.\nThe Brotherhood was rotting from the inside, and everyone could smell it now. Furnaces coughing, councils stalling, Elder whispering instead of commanding. The fall never announces itself. It creeps in, quiet as a rumor. Warzecha answered himself with black. Mirror move. He always liked symmetry. Made things feel controllable. He lit a cigar he knew he wouldn't finish and leaned back. Crisis management was his trade. When everything was on fire, people stopped asking questions. They looked for someone who sounded certain. Warzecha had made a career out of sounding certain.\nZiemkiewicz was perfect for that. A nervous old man with too much authority and not enough spine. Point him at a threat, real or imagined, and he'd squeeze until something broke. Pressure makes diamonds, he said. - Or corpses. And the only reason Rafał survived the Blackout was him. Warzecha made all the hard choices, and Ziemkiewicz only signed whatever was put in front of him. He slid a bishop across the board. Aggressive. Testing lines. Reactionaries don't sleep. They watch. Count steps. Write names in the margins. Warzecha knew that. What he didn't know was which ones had stopped answering to him. That was the trouble. Black sacrificed a knight. Warzecha blinked. That wasn't right. He stared at the piece lying on its side like a dead informant. No reason for it. No payoff he could see.\n- That's a bad move - he said, a little too loud. He took it anyway.\nThe board felt different after that. White looked strong. Too strong. Overextended. Every piece is doing double duty, none guarding the king properly. Names drifted through his head like cigarette smoke: Gadomski. Janecki. Men who smiled when they didn't have to. Men who listened more than they spoke. The quiet ones were always the problem. He sat back down and shoved a rook forward, forcing the issue.\n- You manage the panic, you manage the city, he said. - That's the rule. Black replied with a soft check. Polite. Professional. Warzecha froze.\nNot checkmate. Not even close. But close enough to make a point. He stared at the king, boxed in by its own pieces, defenders tripping over each other. That's when it hit him. He wasn't playing both sides anymore. Somewhere in the dark - outside this room, outside this board - someone else had learned the game. Someone patient. Someone who hadn't sacrificed anything they couldn't afford to lose. Warzecha crushed the cigar out without realizing it.\n- Traitors - he whispered. - Everywhere and nowhere.\nThe board sat there, quiet as a grave, full of shadows that hadn't made their move yet. And Warzecha knew - the next weeks wouldn't be about winning. They'd be about surviving long enough to see who was really moving the pieces."
belchatow_dlc.32.a: "Szach."

belchatow_dlc.33.t: "Od wewnątrz"
belchatow_dlc.33.desc: "EMBARRASSING PHOTOGRAPHS - CAJOLING TO WIECHOWITE TERRORISTS?\nDEATH OF DUTY - PALADIN SOMMER KILLED BY THE ELDER'S CONSPIRACY?\nGREAT COVER-UP- WHY ELDER ORDER TO KILL SEVERAL HUNDRED PEOPLE? WHAT IS COUNCIL HIDING?\nRafał Ziemkiewicz's fingers trembled as he turned the pages. All the major media outlets rushed to report the news, spreading it like a disease. Fake news, he thought. But it was everywhere.\n- Lies - he whispered - Obvious lies.\nYet the words had weight. Not truth - structure. Whoever had written this understood how accusations were supposed to sound. He picked up the phone.\n- Get me Gadomski. NOW!\nNo answer. The comm panel flickered, then died. Ziemkiewicz stood, suddenly aware of the silence in the chamber. The walls seemed closer than before, the room started to feel small, and his uniform started to feel small. He felt...small. He thought of Gadomski first because Gadomski had always smelled of treason. \n- He envies me - Ziemkiewicz muttered, pacing. - Always has. This god-damn liberal devil. \nJanecki came next to his mind. Janecki, with his network of spies and his impeccable loyalty.\n- He's too pristine - Ziemkiewicz said aloud. - No man is that clean. But...he's always been loyal, he would never dare...\nHe reached for the comm again, forcing it to life.\n- Summon Janecki and Warzecha also. RIGHT NOW.\nStatic answered him. Then a voice - not one he recognized.\n- Elder, we have received news from the Security Council that you should remain in your office as we're investigating a potential assassination attempt. That means we're disconnecting phone lines and no meetings till the investigators send us an all-clear signal.\nThe channel went dead. His breathing quickened. The room now felt like a small cage, the air thicker, as if the furnaces below had reversed and begun to draw warmth away.\n- It's a trap. They're coordinating - he thought - They've always been coordinating.\nThe report mentioned meetings. He tried to remember every conversation he had ever had - every offhand remark, every moment of frustration spoken too freely; \"I fear what military under Sommer might become\", \"The future of coal is brittle.\", \"We cannot burn our way out of every problem.\"\nWords he had meant as warnings. Words that now looked like confessions of the greatest sins in this country.\n- Sommer did this! - Ziemkiewicz said suddenly. - He knew. He always knew.\nBut Sommer was dead. That was the worst part. A corpse could not deny anything. Ziemkiewicz began writing names on a slate with a trembling hand.\nGadomski. Janecki. Warzecha. Paladin Circle. Carbonari. Coal Barons. Power Plant Managers. Wiechowites. Greenpeace. Germans. Guard of the Third Furnace of Bełchatów Plant. Łowicz Housewives Association. Too many suspects. Far too many. \nHe struck some out, added them back, circled them, arrows everywhere like a battle map drawn by a madman.\nA knock echoed through the chamber. He clutched the list to his chest, heart hammering. Is he being spied on right now? Are there some cameras or bugs planted here? Who is his staff reporting to? For the first time in years, Elder Ziemkiewicz did not know who still belonged to the Brotherhood."
belchatow_dlc.33.a: "And worse - he no longer trusted himself to tell the difference."

belchatow_dlc.34.t: "Gdy wzywa obowiązek"
belchatow_dlc.34.desc: "Roksana Węgiel could not sleep. The night pressed against the windows of her apartment like a held breath. Below, the furnaces burned low, their glow muted, disciplined — as if the city itself were pretending nothing was about to happen. On the table lay the speech. Three pages. Reform. Renewal. Purification without fire. Words chosen carefully by Gadomski, polished by Janecki, rehearsed until they sounded like they had come from her. The Brotherhood must change to survive. She hated how easily the sentence came to her now.\n\nRoksana stood and paced. Her reflection in the dark glass looked older than she felt. Not a wannabe Eldress. Not a Paladin. Not even a singer. Just visible enough to be useful. That was why they had chosen her. Ziemkiewicz was too stained by paranoia. Warzecha too openly feared. Gadomski and Janecki knew that if the coup wore their faces, it would look like ambition. If it wore hers, it would look like hope.\n\nYou'll be the bridge.\nThe people trust you.\nLead us to a better future.\n\nShe did believe. Or had. But belief had led her here - to a night where soldiers were already moving, loyalties already bought, arrests already scheduled. The coup no longer needed her approval. Only her presence. She poured herself water and didn't drink it. Warzecha's name surfaced unbidden. The way he leaned close to Ziemkiewicz, whispering fears into his ear. Traitors. Wiechowites. Shadows everywhere. Roksana had watched the Elder shrink under it, watched governance rot into accusation.\n\nThis must end, she told herself. This has to end.\nStill.\nIf they resist, what happens? It's going to be a civil war. Another civil war inside the one that already rages in Poland.\n\nHistory will decide.\nHistory always decided after the blood dried.\n\nShe sat, head in her hands. Somewhere across the city, orders were being unsealed. Names placed on lists. Doors marked, not yet knocked upon. They're using me, she thought. Not with cruelty. With precision. She stood slowly, straightening her coat, smoothing invisible creases. There was no turning back now. If she refused, they would proceed without her - and she would become another problem to be managed. She took the speech from the table. Reform. Revolution. A clean face for a dirty necessity. She let herself feel it one last time - the doubt, the fear, the quiet horror of knowing that tomorrow she would be celebrated by some, cursed by others, and understood by no one.\n\nA knock came - soft, prearranged."
belchatow_dlc.34.a: "- Już czas, Paladynko Węgiel."

belchatow_dlc.35.t: "Wewnętrzna robota"
belchatow_dlc.35.desc: "He found out by accident. That's what bothered him most. The digital center smelled like cigarettes and stale coffee, rows of servers humming like they were praying to some kind of machine god. Warzecha hadn't planned to be there; he was supposed to be at the Ministry of Infrastructure at the meeting pertaining to the new resource terminal in Silesia. Nonetheless, it bored him, and Łukasz had an itch. And he always liked to do a routine security walk - the kind of thing that kept subordinates nervous and loyal.\nWhen he was reviewing the whole classified security access registry, a warning blinked red on a terminal that wasn't supposed to blink at all. The kid at the desk next to Warzecha - a low-level IT worker with a very forgettable face and hands always trembling - swallowed his spit very loudly.\n- Sir, it... uh... we have just flagged an access anomaly, sir, from an internal node. Warzecha leaned over his shoulder with glowing eyes, looking like he just found out that he won the lottery. Someone had tried to pull archived files from a private partition. His partition. Names tied to purges that never happened. And deeper still — leverage. Psychological profiles. Ziemkiewicz's weaknesses lay out clean and sharp, ready to be used like a blade. \n- And...sir, it looks like it happened before, already? A few days ago, someone accessed this...section.\nAssessments of the Brotherhood's stability. His reports about energy management and another looming disaster. Such things could break our country if it's now in the wrong hands?\n- So, who accessed this? And why by the forge nobody flagged this previous intrusion? - Warzecha asked softly. Too softly. He sounded like a smug shark that is about to devour its victim.\n- I'm sorry, sir. I'll find out who worked the logs then. And now? I cut the session as soon as I saw the routing.\nThe kid had good instincts. That was unfortunate. Warzecha's jaw tightened as he followed the trace. Obfuscation layers, dummy relays, junk data, misleading spam. Someone competent. Someone who knew the system well enough to almost get away with it. Almost.\nA tag appeared in the metadata, buried but sloppy, and now showing itself as plain as a day CATALYST.\nWarzecha straightened. Pull everything associated with that codename. The kid hesitated.\n- Sir... that node's protected by -\n- By me - Warzecha snapped. - Do it.\nMinutes passed. The servers unloaded all of their secrets, all of their archives. But the conclusion was not the one expected. Codename was assigned to...concert events? Warzecha laughed once, dry and humorless.\n- No, - he said. - She's not capable. It has to be someone else.\nRoksana doesn't have the reach. Doesn't have the muscle. She is visible, palatable, exactly the kind of person you put out front when you didn't want to be seen yourself. Which meant someone with greater pull and a motive to change the course of our country radically. Gadomski. It's so obvious it might not be true. But he's the best shot Warzecha has. Because, as of an hour ago, he was the one two steps behind. Now? This - this was his moment of gaining advantage. Time for a hunt. And no more loose ends."
belchatow_dlc.35.a: "- Thank you for your service, kid. I'll make sure your parents know that you died a hero."

belchatow_dlc.36.t: "Rada zawsze wygrywa"
belchatow_dlc.36.desc: "The board was set before anyone realized a game was being played. Certain elements of the military signed on first. Quiet meetings, quiet promises. Loyalty to the Brotherhood wasn't about belief - it was about certainty, and Warzecha made sure he was the only certain man left with no room for everyone else to maneuver. Units moved without insignia now, slipping into transport hubs, broadcast towers, furnace gates, undercover. Officially, they were never here and were spending their shore leaves in various establishments in the dark side of Łódź. He was ready for them, prepared to meet them when they knocked on the doors. But all doors are already locked. Warzecha stood in his office, looking down at the city, imagining lines only he could see. That was when Janecki knocked. He always looked like a conspirator. Of course, how could he not? The man was a spymaster and knew everything that was happening in the country. He had to know about the plot. \n- We're compromised - Janecki said, without preamble.\nWarzecha didn't turn and didn't say anything.\n- It's Gadomski. He's reckless. Always has been. He dragged others in. Reformists, like Bartosiak and Zychowicz. Used Roksana as a front. I suspected some of it, but they covered their tracks well, and I couldn't confront him directly. Not without proof. Now I know.\n- They hid from you? Man that knows everything? That's hard to believe.\nJanecki sighed, like a man confessing a personal failure.\n- Someone tried to access your files. Repeatedly. I think whatever happened forced his hand. Thought leverage would protect him. Here's everything that I know - said Janecki while pulling a small portable disc. Warzecha finally faced him. Janecki held his gaze. Calm. Measured. No fear. That was either innocence or mastery. Łukasz knew he would never outsmart Janecki, but he was full of himself right now.\n- And you? - Warzecha asked - Are you trying to leverage yourself out of the pit?\nJanecki spread his hands.\n- I serve the Brotherhood. I always have. As soon as I put that evidence together, I came to see you. Why not sooner, you may ask? Tell me Łukasz, do you know anything about the Eastern Conspiracy? Believe me, if it were not for me, half of the Brotherhood would be in open rebellion now. I have been working on dismantling terrorist cells for over a month now.\nThis could be a lie. A good one. But it was a strong alibi. Warzecha knew about the reports from the east. Janecki's story fits too well. That was the brilliance of it.\n- He will be dealt with - Warzecha said - and every other co-conspirator will suffer the same fate. \n- I thought you'd say that - Janecki nodded, just once. He's not eager. That's good. He might not have been in this plot after all.\nThey stood in silence. Outside, it was a normal day. The city didn't notice. Cities never did until it was too late. Warzecha studied Janecki like a map with missing landmarks. He knew - knew - this man knows everything about him. He had touched his secrets and walked away clean every time. And he will do so again.\n- We always knew, didn't we? Fucking liberal…- Warzecha said at last. - Stay close, I'll need you when this breaks.\nJanecki allowed himself the faintest smile.\n- Of course - said Janecki and left without another word.\nWarzecha sat down and poured himself a drink. He plugged the disc into his computer and looked inside. There was only one folder with a certain codename visible. Catalyst. Oh, forge - let them come at us..."
belchatow_dlc.36.a: "...jesteśmy gotowi."

belchatow_dlc.37.t: "Węglowy cień"
belchatow_dlc.37.desc: "- Alright, boys - Wartownik Warzecha, embracing the nearest knight with one hand - Here are the instructions on what to do. Some big names here, but don't worry, you're covered. They're the traitors to the Carbon Cause. Show no mercy. The targets and methods are outlined in the papers. For your and my safety, I'll refrain from mentioning any surnames. Go! \n\nWhile all strike teams were supposed to strike more or less simultaneously at night, it was important that Team Rebellion, whose task was to apprehend Roksana Węgiel, hit first by a slight margin. Despite her innocent appearance, Roksana was the most likely leader of the potential revolt against the Emergency Regime if things got out of control. That and the fact that if there are some Carbonari who would rush to their rescue even if she were publicly announced as the enemy of the state. Wartownik wanted as little fuss as possible. Węgiel's husband opened the door. The agents used that to enter en masse despite their protests. They rushed upstairs to meet Roksana in a nightgown. \n- Come with us, ma'am. It's not safe. - The commander of Team Rebellion asked politely. \n- I've got to contact someone. - She replied, looking for a phone. \n- There's no time. Besides, the enemies of the state must have bugged your phone already. \n- How? We've been under constant vigilance, ever since we've been put under house arrest, I'd like to... \n- Come with us, or something bad will happen to your family. - The agent was done with pleasantries. \n- She tried to lunge for the phone, but was quickly apprehended by other assailants. She tried to wrestle herself out, but to no avail. \n- You'll kill me anyway! - She shouted. \n- Maybe, but if you resist, we'll kill you right here and show your child what's left of you? She doesn't have this kind of emotional baggage now, does she? \nOnly then did she surrender and was guided towards the military truck. Now the agents had to follow the instructions: 'Leave no traces. You know what to do with Węgiel.' \n\nThe rest could do the work with much less subtlety. Team Smog of War just burst into the office of Bartosiak and Zychowicz. \n- Block all of the exits - the commander ordered. \nThe executioners heard someone running and chased after the sound. The duo threw chairs in their way, taking turn after turn to avoid being shot. Still, there had to be a dead end. That's how Zychowicz met his end. Bartosiak hid himself in the restroom. He was standing on the toilet, so the soldiers weren't able to see his feet. They didn't check the disgusting stalls, thankfully. They still shoot at them, and by extension, the geostrategist. \n- Told you, he was here. \n\nGadomski was trying to get away. He got in his car and forced the executioners to chase him. He especially knew what was coming to him, given their conflict. Still, the chasers had guns, and while he had nothing. Eventually, one of the bullets hit the tire, crashing the car. Gadomski was pretty roughed up, and hectors' punches didn't help. Beaten to the point he could barely recognize, he was left upon the doors of the old Gazeta Wyborcza office, all according to instruction. \n- Good job, Paladin Wieżycki. - High Paladin congratulated his subordinate as Wieżycki stared at the result of his horrible work, without uttering a word. \nThen, High Paladin shot him in the leg. - Unfortunately - he continued with the same lack of emotion - You've just been found guilty of brutalization of the prisoner and smuggling coal from our enemies, thus risking the legitmization of dissidents' misinformation. \nThe sentence was a shot to the head."
belchatow_dlc.37.a: "Żadnych niezamkniętych wątków"

belchatow_dlc.38.t: "Ślepa zdrada"
belchatow_dlc.38.desc: "Tychy, the only city that stood against the Brotherhood's mining fever in Silesia. Here, the rogue Paladin Woś created his stronghold of defiance against Elder Ziemkiewicz, as the previous capital of the Silesian chapter, Mikołów, had been razed to the ground. Elder Ziemkiewicz sent Paladin Wróblewski and his contingent of knights to pacify this rebellion. They met no resistance after crossing the border. Having arrived at the destination, the Brotherhood general raised a megaphone to present the demands to the soldiers on the outer city barricades. \n- I am a Paladin of the Brotherhood of Coal. I demand you, fellow paladins, knights, and initiates, to submit to the authority of Bełchatów and the wisdom of the Elder - the prolonged silence put him out of balance a bit. Can you hear me? \n- Hello? - Dariusz Zalega, a rebelled knight and an old associate of Woś, spoke from behind the reinforced barricade in front of the city - Who is it? \n- You know who I am and what you must do. Bow before the elder. \n- But we already have an Elder - Red Elder Rafał Woś, and I am his proctor - Zalega said with mocking pride. \n- Then let me speak with him! - Wróblewski raised his voice even more - I've not come here to argue with a peon! \n- Nah, that won't do. The Elder of Bełchatów didn't take the trouble to show himself. \n- He's far above cowards and weaklings. Besides, he's got other duties. \n- Fair enough. - Zalega thought for a second - Then send Wartownik Warzecha. \n- Impossible. - The paladin of Bełchatów answered in an instant. \n- Rzymkowski? \n- Busy. \n- Bartosiak? \n- You know, he's been executed. \n- He'd still make a more convincing negotiator than you. - Silesian knights started to laugh after hearing that. Some of the soldiers from Bełchatów chuckled as well. \n- Enough! - Wróblewski was livid. - If you will not submit, we shall take the city by force! \n- You don't frighten us, Bełchatów pig-dogs! - Zalega was unfazed by the threat. Your contingent is too weak to even take over Miasteczko Sląskie, not to mention a capital. You're in the heart of Silesia, so you can be easily surrounded. Even think about pulling the trigger, and you're all dead. \n- Now look here, my good knight.. - Wróblewski cooled down and realised the predicament he was in. \n- I don't wanna talk to you no more, you empty-headed mine floor wiper! - Zalega recognized Paladin's change of tone as an act of surrender - I smog in your general direction! Your mother was a Wiechovite, and your Elder smells of elderberries! \n- I'm sure we can... - Wróblewski tried once again, but Zalega just left the barricades and went back to the city. \nZiemkiewicz's emissary looked at his soldiers, trying to judge if he had any authority with them. Not enough, he reckoned. \n- We're leaving for now."
belchatow_dlc.38.a: "Jeszcze tam wrócimy!"

belchatow_dlc.39.t: "Rajd Walkirii"
belchatow_dlc.39.desc: "Jakub Zgierski was late. As the rivaling candidate for the position of Carbonari, he had the hardest time wiggling out of the guards' hands. \n- Password. - A cloaked man stood at the entrance to the abandoned warehouse. \n- Nothung. \n- You may come. \nAs Zgierski expected, the whole group of conspirators was already there: Karnowski brothers, Marcin Rola, and 16 other conspirators of lower rank. The room was full of dusty barrels, rotting wooden boxes, and cargo containers. Those loyal to Ziemkiewicz were sitting at a table that must have been specifically placed there for the meeting. \n- Did you gather us here? - Michał Karnowski asked Zgierski. \n- No - Stanisław Janecki came out of the shadows - I did. \nEveryone stood sensing trouble. \n- Is this some form of a trap? - Zgierski asked with an alarmed voice \n- Yeah, how are you not under arrest like the rest of the council, midget?! - Rola approached the proctor to show dominance. \n- Gentlemen, there's no need for aggression. - He raised his hands - At least not towards me. \n- Rola backed away, but the atmosphere remained tense. Getting some breathing space, Janecki began explaining himself. \n- I'm infiltrating the new regime so that I can organize a counter-revolution. Brothers and sisters, welcome to Operation Valkyrie. \n- How do we know you won't sell us out? How do we know that Roksana's lackeys aren't coming here to arrest us? - Zgierski continued probing Janecki. \n- Yeah - That's the best contribution Rola could make. \n- I won't. I have a gift to show my loyalty. He went into a corridor between a cargo box and an object covered by cloth. With a swift swipe, Janecki uncovered a man gagged and tied to a handtruck. \n- This is a person who started all of this. Scribe Przemysław Dyzma, who hacked Wartownik Warzecha's comPAN and leaked the distorted data to the public, creating the mass unrest that elevated Węgiel. Once, he was my trusted subordinate, but after today's meeting, he will be executed in the name of the rightful Elder. \n- I still don't trust you! - Rola shouted. \n- He might speak the truth - Jacek Karnowski chimed in. - I've got agents monitoring the streets surrounding the warehouse, and no one is pursuing us. \n- He'll betray us at the earliest convenience. You can never trust a spy. Especially the one who already stooped to working with communists. \n- Ah, such fierceness, Marcin - Janecki dared to put his hand on the arm of the paladin - With people like you, the Brotherhood's army is sure to defend against all odds. You'd make a fine Naczelny Paladyn. \n- We already have a Naczelny Paladyn - Zgierski looked at Janecki with suspicion - Tomasz Rzymkowski. We're here to rescue him. \n- Unfortunately - Janceki lowered his head - According to my estimates, if we strike at the usurpers, the council would most likely be summarily executed. That's the origin of this operation's rather pessimistic name. Just like Valkyries, we will carry the souls of the fallen to Valhalla and continue their legacy on Earth. \n- So this is your plan, Janecki? - Zgierski also stood up to him - Destroy all rivals to power and assume the role of the Elder? \n- No, no, no - Proktor tried to calm him down - I'm not much of a... front man. We'd need a charismatic, popular, young leader who will carry us into the future. You, Jakub. \nThis caught Zgierski's attention. \n- Well, I don't know about you, but the atmosphere got a little bit tense here. I'll go get some air. \nEveryone used this time to think about the proposition. Marcin Rola took a few steps to think more clearly. He tripped and knocked down an empty barrel. And then the seemingly empty barrel started leaking oil. \nEveryone gathered over the puddle, trying to be bewildered that the barrel full of oil was placed in an abandoned warehouse. In a moment, they realised what was going on. \n- Oh no. - Zgierski rushed through the door. Not quickly enough."
belchatow_dlc.39.a: "*BOOM*"

belchatow_dlc.40.t: "Dobrze jest jak jest"
belchatow_dlc.40.desc: "Like every other Pole, Roksana Węgiel was deeply affected by the Fall of Poland, both mentally and economically. Despite her origins as a Eurovision Junior winner and her rising international fame, she was still highly dependent on the listeners from Poland. Listeners who were no longer able to pay for food, let alone music. Still, she was much better off than most of her compatriots. Aside from her wealth, due to her status, she was free from the oppression of totalitarian regimes. That was the reason she decided to stay in Poland on a charity tour to help alleviate the sufferings of Poles and maybe inspire them to rise up. However, the worst of the regimes prevented her from performing, and the exceptions, such as the Brotherhood of Coal, which most likely thought her surname would look good in propaganda papers, demanded that they would oversee the distribution of the raised money. Doubtless, most of it was lost to corruption. It's a dead end. She may need to consider changing her strategy or abandoning her cause altogether and focusing instead on her international career, as her husband and manager have suggested. But she'll worry about that tomorrow. Now, she has to put up a stage smile and give the people of Bełchatów a show they got here for.\n\nHołownia arrived at the festival fashionably late. Not only to show his dominance, but also to give Brotherhood time to polish every little detail. Relations with Bełchatów were already tense, given the President's ecological outlook, and didn't need any further strains. It looked like the Brotherhood's Council thought the same, as they really outdone themselves. The festival was full of food stalls, shops, inflatable slides, and games where you could win authentic pickaxes and helmets. In the air, one could see balloons in the shape of miners and blimps with Brotherhood symbols. Thanks to so many attractions, the festival was teeming with life to the verge of overcrowding.\n- Ah, President Hołownia, it's an honor to have you here - Ziemkiewcz extended his hand.\n- Thank you, Elder Ziemkiewicz, you and your people organized an exceptional event - Hołownia hoped he wouldn't meet any of the other members of the Brotherhood's Council. He feared that he would mess up their ye olde titulature.\n- You must be starved after the journey, come taste our local specialities. - Ziemkiewicz smiled.\n- Oh, no, no. I'm trying to keep a diet. - Hołownia tried to brush off Ziemkiewicz. Knowing the specifics of Brotherhood's cuisine, he was unlikely to find anything that didn't include meat.\n- I insist. - The Elder embraced Hołownia with one arm and guided him toward the food court.\n- You really thought of everything - the Great Mediator looked at the stall and its signboard with what must've been a groundbreaking slogan for the locals - ‘Meatless Meatballs!'\nThe leader of Łódź ordered a symbolic portion for the news.\n- They imitate fish really well. - Hołownia sent his regards to the cook.\n- Well, sir. - The man responsible for preparing them said, full of confusion - That's because they were made from fish.\nThe President of Łódź coughed and spat the chewed food on the boots the Elder of the Brotherhood was wearing.\n- I told you not to make them with meat! - The host completely ignored being spat on and looked furiously at the chef.\n- I didn't - the man wailed - I used fish instead!"
belchatow_dlc.40.a: "Zabrać go!"

belchatow_dlc.41.t: "Dzień Postępu [GetYear]"
belchatow_dlc.41.desc: "Today, we celebrate another annual Progress Day, a day for all of our great pioneers, that have dedicated their lives to the cause of industry and progress. There will be many festivities, speeches, and of course, plenty of themed food and drinks. In the culmination of the event, Elder Ziemkiewicz himself will deliver a keynote speech, highlighting the achievements of the Brotherhood and outlining our vision for the future, right before he announces who won in the contest for the Inventor of the Year. Let us all come together and celebrate, cause our country, and especially you - the workers of the Brotherhood of Coal - deserve it."
belchatow_dlc.41.a: "Widzimy się za rok!"

belchatow_dlc.42.t: "Trzęsienie ziemii"
belchatow_dlc.42.desc: "Rafał Ziemkiewicz was sitting in his office, expecting to hear the reports of the completion of the logging operation within ZHRP borders. Coming under the guise of the night, during stormy weather, when no one would dare to settle a spring camp. A quick and mass operation should provide them with enough fuel for the time being, with minimal risk of encountering Scouts. Before he saw any file, he already had a messenger about this little escapade. Andrzej Kopek, the ambassador from Łódź, entered his office, closed the door calmly, and then exploded in anger. \n- What the hell was that, Ziemkiewicz? \n- What do you mean? - Elder said calmly. \n- Don't play games with me. - Kopek was still boiling with anger. He allowed himself to let go of the diplomatic protocol when facing Elder alone. - You know, I'm talking about sending your men to ZHRP territory to cut their trees. \n- Assuming that's true, I can't understand why you're so angry at me. Brotherhood wouldn't be the first to conduct an operation beyond its borders. \n- Your operation is the first one to get people killed. - The ambassador saw he got the Elder by surprise and decided to strike while the iron is hot. There will be consequences for them, and you, and the sanctions that will be taken will be proportional to the crimes committed. \nZiemkiewicz tried to regain some ground. \n- Whatever unfortunate complication occurred, it was a result of the complex character of the operation. Others conducted simple raids to obliterate what others possessed; We did what we did to gather resources that were wasted under Scouts' oversight. Can you blame us for wanting to build instead of destroy? \n- Tell yourself whatever lies you want. - Kopek already vented and now felt resigned seeing Ziemkiewicz's imbecilic stubbornness - Just ask yourself whether it is wise to undermine the efforts of the Dialogue, which helped you stand on your feet. That enables you to sell your energy throughout the voivodeship. That will strike at you for your misdeeds. \n- It hasn't been doing that much of a good chance at it. But we'll take our chances, thank you for your concern. Now, if you'd been so polite as to retreat to the office we provided for you. I expect a large file of reports that I'll have to deal with."
belchatow_dlc.42.a: "*trzask zamykanych drzwi*"

belchatow_dlc.100.t: "Bełchatów zaprasza naszego przywódcę na festiwal!"
belchatow_dlc.100.desc: "OD: Narodowa Rada Planowania Wydarzeń Bractwa Węgla\n\n'We are pleased to announce that Illustrious Lord of Dialogue Szymon Hołownia is invited to Bełchatów's Grand Picnic Festival as the guest of honor. This event, held annually in our beloved city, celebrates the spirit of community, progress, and the indomitable will of the Brotherhood. Mr Hołownia's presence will be a monument to the growing recognition of our cause and the values we uphold.\n\nThe festival will feature a variety of activities, including speeches, cultural performances, exhibitions showcasing the achievements of the Brotherhood, and of course refreshments and food. It is an opportunity for us to come together, strengthen our bonds, and reaffirm our commitment to the principles that guide us.\n\nWe look forward to welcoming Mr Hołownia and sharing with him the warmth and hospitality that Bełchatów is known for.'"
belchatow_dlc.100.a: "W końcu nas zaczęli akceptować?"

belchatow_dlc.101.t: "Ekoterroryści złapani!"
belchatow_dlc.101.desc: "In a daring operation, the eco-terrorists responsible for bombing a Brotherhood outpost in Szczerców have been captured. Though we had to cross the borders of our state to catch them, we're sure our diplomats will ease things out, as this was a matter of national security and we were responding to a terrorist threat."
belchatow_dlc.101.a: "Wymierzmy im sprawiedliwość!"

belchatow_dlc.102.t: "Rozrost Śląskiego Bractwa"
belchatow_dlc.102.desc: "W związku z niedawnym pozyskaniem nowych terenów w województwie Opolskim, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.102.a: "Przekaż ziemie"
belchatow_dlc.102.b: "Kim jesteśmy by dawać coś za darmo?"

belchatow_dlc.103.desc: "W związku z niedawnym pozyskaniem nowych terenów w Małopolsce, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.104.desc: "W związku z niedawnym pozyskaniem nowych terenów w regionie Beskidów, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.105.desc: "W związku z niedawnym pozyskaniem nowych terenów Cieszyńskich, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.106.desc: "W związku z niedawnym pozyskaniem nowych terenów na Zaolziu, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."

belchatow_dlc.107.t: "twój stary też zapierdala"
belchatow_dlc.107.desc: "w kopalni na ślunsku"
belchatow_dlc.107.a: "kopie węgiel kamienny"

belchatow_dlc.108.t: "Wielki Blackout się skończył!"
belchatow_dlc.108.desc: "After months of hardship and struggle, the Great Blackout that plunged our nation into darkness has finally been resolved. Thanks to the tireless efforts of our engineers, workers, and the unwavering spirit of our people, power has been restored to every corner of the Brotherhood of Coal. We have endured the darkness together, and now we emerge stronger and more united than ever before. Let us remember sacrifices of those who worked tirelessly to bring back the light, and let us look forward to a future powered by coal and determination."
belchatow_dlc.108.a: "Niech żyje Bractwo Węgla!"

belchatow_dlc.109.t: "Ustanowienie Kolektywu Miedziowego"
belchatow_dlc.109.desc: "Lower Silesia is a land of rich mineral resources, and with our recent acquisition of copper mines in the region, it is only fitting that we establish a dedicated organization to oversee their management and exploitation. The Copper Collective will be responsible for ensuring that these valuable resources are extracted efficiently and sustainably, contributing to the economic strength of the Brotherhood of Coal. This move will also help us diversify our industrial base and reduce our reliance on coal alone. But, the Collective is not just a rebranded KGHM. Our recent research discoveries on the fields of artificial intelligence was successful mostly thanks to the scientists from KGHM. As such, they will be at the forefront of our efforts to modernize and innovate in the mining sector. We look forward to the positive impact that the Copper Collective will have on our economy and our people."
belchatow_dlc.109.a: "An AI? In this energetic mix?"

belchatow_dlc.110.t: "Przebijanie muru głową"
belchatow_dlc.110.desc: "Nie powinieneś tu być. A jednak. Fajny ten twój power armor - byłaby wielka szkoda, gdyby coś złego mu się przytrafiło. Koniec końców, nie możemy Ci pozwolić żebyś go miał. Dlaczego? Bo tak mówi fabuła. Że co? Pytasz, dlaczego możesz zbudować power armor każdym innym gównianym watażką, ale nie BRACTWEM WĘGLA? Cóż. Odpowiedź jest banalna. Bo to zajebiście śmieszne. A teraz idź zagraj Atomową Krucjatą."
belchatow_dlc.110.a: "Zaklinam Cię kurwa, twój power armor właśnie dostał raka kutasa"


##INNER CIRCLE##
BBW_elderprinzip: "The Elder's Folly"
BBW_elderprinzip_desc: "I tried to keep it all under my control, despite the collegial nature of the Council's rule. It's not possible to rule alone, I know that, but great projects, great campaigns can only be achieved by one dominating individual to guide the process. This doctrine, once successful, is slowly collapsing mainly because of how effective it has been. It was known that our territories would grow, but the tempo of that process exceeded our most daring expectations. As such, I'll need to delegate more of my power to my underlings. I must be careful, though. Two factions have formed within our ranks - reformists and hardliners. While the latter are more reliable and loyal, the former also have their uses. I have to proceed with great caution, while listening to both sides, as all of them can use their new privileges to usurp my rule."
BBW_elderprinzip_inner_circle_tt: "Aktywuje mechanikę §YRady Starszych§!.\n\n"
BBW_ascension_of_rzymkowski: "Naczelny Paladyn Rzymkowski"
BBW_ascension_of_rzymkowski_desc: "A faithful continuator of Naczelny Paladyn Sommer's thought, Rzymkowski's been assisting us since the beginning, back when we had nothing to our name. He was the one to advise us to make Bełchatów our home. Despite not being the original member of the Council, he quickly rose through the ranks. It's only natural to let him tighten his grip on our military. He's a much better advisor than Bartosiak and Zychowicz - upstarts, who jumped on our wagon once it became apparent to all that we are destined to triumph. Having him elevated would mean sticking to the tried and true methods of overwhelming force of armored behemoths. He will never replace the impeccable Sommer, but he can continue to fill the void that's been left behind."
BBW_armoured_fists: "Pancerne pięści"
BBW_armoured_fists_desc: "We will strike at our enemies, and we will strike them hard. Some say that we put too much emphasis on the tanks, while disregarding the more mundane armament. They think we should put more effort into the regular infantry, for example, to make our occupation efforts easier. They are wrong, of course. The fight for Poland takes place primarily in men's hearts. Our armored terrors are not only deadly effective in combat. They strike fear into those who seek to oppose us. When they fear us, a large occupational force will not be necessary, once our fists choke the life out of the enemies of progress."
BBW_mechanized_machine: "Zmechanizowana maszyna"
BBW_mechanized_machine_desc: "The Brotherhood is a machine. It can only work if all the gears cooperate with one another, creating something greater than the sum of their parts. Our machine is a tool of progress spreading outwards, trampling over the huts of primitivists, who'd like to hamper humanity's advancement. /our army has to reflect that. Each of our soldiers has to serve as one man's allegory of our cause, mechanized from head to feet. Whether it be tactical armor or implants. They will fall upon our enemies from the state-of-the-art armored transporters. "
BBW_ascension_of_zychosiak: "Paladyni Bartosiak i Zychowicz"
BBW_ascension_of_zychosiak_desc: "It's time for some changes, we can't keep investing in expensive military vehicles and sending them to meatgrinders. We need tactics, strategists, geostrategists, even. The Dynamic Duo is a rather recent addition to our roaster, but they indeed know a thing or two about geopolitics. Or at least neither I nor any of my associates is able to refute what they say. Doesn't matter that they offer to do things smarter, with no necessity to increase the military expenditure. Except for the higher wages for them. Still, it's a minute strain on our budget. Taking mountains into account when planning our campaigns sounds harmless enough."
BBW_securing_rimland: "Zabezpieczenie Rimlandu"
BBW_securing_rimland_desc: "As much as some loudmouths may criticize him, Jacek Bartosiak is a true visionary. The duo realizes the strategic importance of Poland as a land at the crossroads of two of the most important regions that decide the control of the world - Heartland and Rimland. Our nation, belonging to the maritime Rimland, has to become a flank defending the West from the expansion of Russia, a power from the Heartland. The laws of geopolitics demand that we have to brace for the attack and protect the warm Western ports from our enemies."
BBW_new_model_army: "Armia Nowego Wzoru"
BBW_new_model_army_desc: "I... I don't know what to think about this. On the one hand, Bartosiak and Zychowicz talk about reforms that are dear to my and every other patriot's heart. They say that the army has to be a fast, mobile army with top-notch equipment and training. That the army has to compose the elite of our nation. At the same time, he says many controversial things. He wants our vehicles to be so small, they're barely suitable to be used by our Knights' children... At least that's what some of the Paladins say. When I confront Bartosiak with those objections, he says that it's the price for increased agility that would allow them to attack quickly and swiftly evade counter-attack. I guess that makes some sense."
BBW_technological_superiority: "Przygważdżająca przewaga technologiczna"
BBW_technological_superiority_dornberger_trait_tt: "No matter what we use: a scalpel or a hammer, we have to advance. We have to be one step ahead of our enemies, keeping them guessing what our next invention is, what our next move will be. By taking the initiative, we'll have them right when we want them. We will prove to them that we are not some backwards savages, but pioneers that took an alternative route to the future and thrived beyond their, or even ours, imagination. Tomorrow belongs to us! Ad Victoriam!"
BBW_ascension_of_warzecha: "Ascension of Warzecha"
BBW_ascension_of_warzecha_desc: "Wartownik Warzecha is responsible for most of the things in our state; It's only natural for him to get more control of the sector that everyone tries to avoid. Well, that's not completely true, but I don't trust him due to his past. He always tries to muddle things to hide something that would result in a degradation for a lesser knight. With Warzecha, everything is simple and effective. The economy is slowing down? Turn the tap even more. Someone has something we want? Just take it for the good of the carbon cause. His methods never disappoint."
BBW_mining_expansion_plan: "Plan rozbudowy kopalnii"
BBW_mining_expansion_plan_desc: "All those panickers calling on the alarms that 'we're running out of resources'... To hell with them! All of those cracked eggheads never thought of one simple solution to coal shortages - digging deeper. And if (and I emphasize 'if') the ore indeed is getting scarcer, we need more digging sites to make up for it. Simple as that. If what we believe is true and yet we don't achieve the results we expected, we just need to double down, as the failures can be explained by not following the Axioms as much as we should."
BBW_increasing_emission_quotas: "Zwiększenie norm emisyjnych"
BBW_increasing_emission_quotas_desc: "Didn't even know we had emission quotas to begin with. No matter. Last vestiges of the old regime will be removed to the benefit of our people. Emission quotas... What a joke. If someone needs to burn coal or coke to create energy or heat their domiciles in winter, who are we to deny them that? Is it better to let people freeze to death? Leave the hospitals without power to sustain the terminally ill? The airports unable to instruct the pilots how to land? To leave Poland in darkness? We might as well forbid people to breathe. After all, humans exhale carbon dioxide. Ridiculous."
BBW_appropration_of_sectors: "Appropration of the Other Economy Sectors"
BBW_appropration_of_sectors_desc: "Without coal, we would have nothing. It is the original cause of our economy. In this day and age, no one would be able to do anything without electric power, and it wouldn't come to be in the first place without coal burning. Whether they like it or not, they own their success to energetics, and it's time to pay their debt to it. It's only fitting that we should be able to take their assets if it can bolster the amount of energy we produce. It may seem heartless, but without power, they'd lose their businesses anyway. They might as well lose them for the greater good."
BBW_ascension_of_janecki: "Ascension of Janecki"
BBW_ascension_of_janecki_desc: "Look at him. He doesn't need to work with everyone. A true Joker (as in the one in cards. His humor is rather dry). He's unpredictable and can change his position whenever the situation requires him to. That's how his power has risen. By strengthening our espionage, I'll strengthen his position even more, but this sort of gift may be able to sway him. Denying him further promotion would only delay the inevitable and needlessly antagonize him. Whether I like it or not, he's the one who keeps my back blissfully knife-free. Either by stopping the ecologists' strikes or his own."
BBW_carbonari_investigative_department: "Wydział Śledczy Karbonariuszy"
BBW_carbonari_investigative_department_desc: "Janecki claims he needs new cadres for the Circle of Coal. He wants to recruit them from the youth who have already proved themselves to be faithful to our ideals. Fine, if it can bolster our intelligence capabilities, all the better. I doubt that those kids would do much harm as Janecki's tutors. This new department of his will allow us to root out the angry young men in our ranks. The younger you recruit them, the more fierce they will be in carrying out their duties."
BBW_expand_weglowy_krag: "Rozszerz Węglowy Krąg"
BBW_expand_weglowy_krag_desc: "More money to be sent to the Proktor's playground... True, there is a report detailing how the scheduled development of Circle of Coal is not sufficient enough. It mentions factors such as increased vigilance of our enemy agencies, the ever-present Wiechovite threat, and... the fact that there are already a lot of former members of the Carbonari Investigative Department who have been promoted to the fully fledged knights of the Circle of Coal. Because of Janecki's previous ideas, our agency has too many people and too few departments. Give somebody an inch and they'll take a yard. Fine, I'll deal with it, but I'll let him know that no further compromises will take place in that matter."
BBW_skarbnicy: "Specjalna jednostka gwardzistów - Skarbnicy"
BBW_skarbnicy_desc: "I had a talk with Janecki. He said that with what happened to Sommer, the high-ranking paladins and even the members of the Council started to fear for their lives. That some may become inspired and raise their hand against the heads of the Brotherhood. There might be something to it. To avoid attracting suspicion of lower-ranking members, he even came up with the unconspicious name for them - Skrabnicy, the Treasurers. Apparently, he wants to leave the Carbonari out of this, preferring to 'maintain their innocence unharmed'. Yeah, right."
BBW_militarization_of_skarbnicy: "Militaryzacja jednostek gwardzistów"
BBW_militarization_of_skarbnicy_desc: "Each proposition from Janecki is secretly a foot in the door; Right after that comes another larger proposition. No, he says that the Treasurers should be more heavily armed and trained for combat situations. By that, he argues, they will be more suited to protect generals on the frontlines and even step into the regular fight if things get dire. The minus is that there is a possibility that they would stage a coup, but that's doubtful. No one would accept this lizard Janecki as a leader. And the treasurers are already responsible for my protection; They already can hold a gun over my head, so increasing its caliber wouldn't change that much. And denying them that would just anger them."
BBW_brotherhood_control_center: "Centrum Sterowania Bractwem"
BBW_brotherhood_control_center_desc: "Every day, the Proktor's eyes see more and more, and the number of nooks and crannies one might hide in decreases. Every day, more and more Wiechovites, socialists, and terrorists are being caught and prosecuted for their crimes. Maybe one day they will disappear completely. I just hope this day will come before; I'll have to bestow all of my power to the Proktor. Janecki can be an effective tool, assuming one can control him. For the time being, he has shown only acceptable amounts of ambition. Let's hope it will remain that way."
BBW_ascension_of_gadomski: "Ascension of Gadomski"
BBW_ascension_of_gadomski_desc: "Whether I like it or not, Starszy Paladyn Gadomski is the only one who knows the ins and outs of our economy. What worries me is that sometimes he sounds like a goddamn Wiechowite. He assures me he does this for the stability and to prevent impostors who expect mining grants for digging a hole in the pavement. There's also the question of his radical liberalism and strict adherence to austerity in times of crisis. Such an attitude caused numerous mines and native Polish businesses to be shut down in pre-Fall Poland. Still, he's been running these things since the beginning, and things worked out just well. It couldn't hurt to let him implement even more of his ideas, I guess."
BBW_resource_extraction_committee: "Komitet Wydobycia Surowców"
BBW_resource_extraction_committee_desc: "It sounded questionable at first, I'm not gonna lie. Just like some over-regulating body straight out of the dreams of the wishy-washy journalist from Gazeta Wyborcza. But the more I heard about it, the more I understood where Gadomski was coming from. As it turns out, some frauds used the atmosphere of carbon fever and the subsidies for the establishment of the new mines. They would start digging in a place that has no coal deposits. They would dare to forge the geodet's opinion to get the green light from the government, only to fatten themselves on subsidies. Gadomski's committee is supposed to combat such perversions."
BBW_hold_the_emission_urge: "Wstrzymaj się z emisją"
BBW_hold_the_emission_urge_desc: "Witold's really testing my patience. We'll need several pilot programs explaining to our knights that Gadomski's new policies are not Wiechovite heresy and how they differ. Still, there is some merit to what he says. In his opinion, some of our Brothers' (he means Warzecha) emphasis on emitting pollution for pollution's sake misses the point of our organization and comes off as childish raillery. He says that what differentiates us from eco-fanatics is that we are rational. That emission is a result of man's ambition to better the lives of himself and others. He wants to popularize this idea in our propaganda to benefit our economy."
BBW_state_market_monopoly: "Państwowy monopol rynkowy"
BBW_state_market_monopoly_desc: "Gadomski once again appealed to the laissez-faire ideals most of the Council once shared. He argued that we use coal mainly because it's the most practical source of energy, once it is unburdened by the ecological restrictions. He says it should inspire us in how we deal with the economy. In his opinion, too many times has the state interfered in the business, taking land without compensation, preventing healthy competition from arising to challenge the public businesses. He thinks our state assets will be most effective once we let them test themselves on the market, once their offer is the best, and people will want to buy from them."
BBW_youth_leader_roxi: "Przywódczyni młodzieży Węgiel"
BBW_youth_leader_roxi_desc: "Gadomski thinks we should be more open to the will of the people. Ha! The Brotherhood, by definition, fulfills the will of the people, but I know what he wanted to say. Famous singer, Roksana Węgiel, had decided to sacrifice her career to aid our cause and applied for the position of the leader of Carbonari. I thought that her pretty face would attract many boys to our youth wing, and her fame would achieve the same with girls. I thought that would be the extent of her function, but now she and her supporters among the Carbonari issue a petition for greater involvement in furthering our mission. I guess it couldn't hurt. If she's on the board, she can make herself useful if she truly desires so. I don't see how that could do any harm."
BBW_youth_leader_zgierski: "Przywódca młodzieży Zgierski"
BBW_youth_leader_zgierski_desc: "Jakub Zgierski already served as a competent Youth Leader, faithful spokesman, and diligent scribe, so we know a lot about his attitude on a number of things. He's still one of the fresher recruits of our cause. At least when we talk about chronology. If we were to judge him by ideological purity, he'd be a designated heir to Eldership. The things he says sometimes make even Warzecha blush. He's not the most popular, but he couples the youthful vigor with certainty that the Carbonari, full of impressionable kids, won't succumb to subversive narratives. Lacking flair, but always there, as Janecki once said. Let us loosen his leash, so he can show us what he's capable of."
BBW_loyal_to_axioms: "Lojalni aksjomatom"
BBW_loyal_to_axioms_desc: "1. Shield yourself from those not bound to you by steel, for they are the blind.\n2. Fear those who do not pledge to the Brotherhood for though their eyes may be opened through service, they are now blind.\n3. Give way your suspicions to the wisdom of thine Elder. Where he shows trust, so shall you.Whatever their background or ideological difference, all of the leaders of the Carbonari must pledge themselves to the Axioms of the Brotherhood. It's a duty of all citizens, but it's especially sacred for them as they serve as the example for our youth, our future."
BBW_resume_the_concert_tour: "Wznów trasę koncertową"
BBW_resume_the_concert_tour_desc: "Before she joined us, Roksana Węgiel engaged in a tour through Poland trying to raise the spirits of Poles with some music. Then she realised that political activity is more important in helping people and joined us as the Sister of Coal. I kept her within our borders, as I wasn't completely sure of her allegiance. Now, I think she proved herself loyal enough to let her concert within our borders and even beyond. She will be a most fitting emissary. Our bard praises our cause and attracts new recruits beyond our borders. Or at least increasing the opinion of our soon-to-be-conquered subjects."
BBW_master_debate_clubs: "Kluby Oralnego Rzemiosła"
BBW_master_debate_clubs_desc: "Our Axioms encourage us to engage in debates with sceptics. It is the only way to spread our message and prove its validity. In Jakub Zgierski's opinion, such debates should be the primary duties of the Carbonari, which, admittedly, as of now, lacked purpose.  Zgierski, now calling himself 'Hammer against Wiechism', offers to instruct other members of our youth wing about the eristic and rhetorical techniques so they could better convince the unconvinced. Now,  I learned that one usually wastes words trying to convince the bloodthirsty Wiechovites, but I won't try to bring the kid down with cynicism."
BBW_1st_carbonari_battalion: "Pierwszy Batalion Karbonariuszy"
BBW_1st_carbonari_battalion_desc: "The Youth Leader's popularity caused so much enthusiasm that we can barely contain it. We can now count on a wave of young people ready to fight to the death for the carbon cause. While some of the brass deem them too young to send to the frontlines, they're so eager that they're willing to spontaneously lunge themselves at the enemy as we speak. Since we can't prevent them from engaging in combat, we can at least try to channel their energy by including them in official structures of the army. The establishment of the Carbonari Battalion will at least provide some oversight over the roaring young warriors."
BBW_local_warming: "Lokalne ocieplenie"
BBW_local_warming_desc: "If there's a warming caused by human activity, it's the warming of my heart. All thanks to the so-called reformists. Previously, I thought that all this nuancing was indeed a way of introducing the Wiechism by the boiling frog method. I may have been wrong, for now at least. They usually lack the enthusiasm and ideological purity, but they make up for that with popularity and competence. Still, I can't congratulate too much, unless I want them to get over their heads. The line between innovation and heresy is a blurry one, and I must be ever vigilant that they won't deviate too much from the right path."
BBW_old_order: "Stary ład"
BBW_old_order_desc: "We already have the Axioms that hold all the knowledge that is necessary to prosper. All you need is a sound mind and basic deductive skills. Our success proves this. Our enemies deemed us out of fashion failures that would cough in smog, while the planet would burn. We destroyed most of them. It is they who were wrong. I was stupid to ever consider changing our strategy. There is no proof that such things are necessary, as we have overcome all of our temporary handicaps. As the eco-loons try to deceive us with convoluted critiques, we, like Alexander the Great, cut through their Gordian Knot of lies, knowing that the simplest solutions and theories are the best."

BBW_sudden_shutdown: "Nagła zapaść sieci energetycznej"
