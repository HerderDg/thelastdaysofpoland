BBW_green_counter_revolution: "Przyczajona Zielona Rewolucja, Ukryty Spisek"
BBW_green_counter_revolution_desc: "\"... ponieważ nie ma czegoś tak głupiego, co wymyślone na Zachodzie by do nas prędzej czy później nie dotarło, więc możemy się obawiać, że też będziemy mieć do czynienia z fanatykami, którzy w najlepszym wypadku niszczą uprawy, niszczą sprzęt rolniczy, w najgorszym potrafią nawet zabijać.\""
