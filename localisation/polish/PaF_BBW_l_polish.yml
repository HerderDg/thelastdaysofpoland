BBW_terror_of_skies_desc: "Straszliwe bestie ze stali wznoszą się na horyzoncie. Głośne wirniki i olbrzymie sylwetki budzą lęk w każdym, kto je zobaczy. Sceptycy twierdzą, że ich psychologiczny wpływ jest większy niż faktyczne zdolności bojowe, ale nie mogliby się bardziej mylić. Niezależnie od tego, kto ma rację, ich obecność to przerażający as w rękawie Bractwa, na ich drodze ku dominacji nieba. Z powodu ich rozmiarów i zawrotnej prędkości produkcji, sterowce zasłaniają to, co jeszcze zostało ze światła słonecznego na terytoriach Bractwa, za każdym razem gdy tylko wzbijają się w powietrze."
