BBW_graphene_fever: "Prototypy grafenowe"
BBW_graphene_fever_desc: "This graphene thing is very nice. You can make everything out of it. Batteries, armor, medicines, structures. Even such useless things as contaminant removals. I wonder, can you eat it? *chomp* UGH. Mid. Although... *chomp* UGH, NOT GOOD."
