#rework
BBW_hubris: "Buta"
BBW_hubris_desc: "Kto mówi prawdę ten niepokój wszczyna. A ten który mówi niepopularną prawdę przed wszystkimi ten uchodzi dodatkowo za wariata, dopóki elity nie dotrą do tej samej konkluzji. Jak PiS i PO, każdy system kierujący się pychą - upadnie. A od nas zależy czy będziemy tutaj marionetkami odgrywającymi swoją rolę, czy wręcz przeciwnie - ciętym słowem i twardym czynem będziemy bronić własnych idei i przyczynimy się do upadku owego aparatu władzy. Szymon Hołownia może mówić że jest człowiekiem spoza układu, lecz wszyscy wiemy że jest jego przedłużeniem a cała ta \"Strefa Dialogu\" wydaje się to tylko potwierdzać. Jeszcze musimy grać w tę partię szachów z pudrowanym trupem. Jeszcze musimy pokornie uniżyć się przed większymi graczami. Ale na każdego przyjdzie pora."
BBW_time_of_geezers: "Czas Wrzeszczących Staruszków"
BBW_time_of_geezers_desc: "Żaden człowiek nie jest doskonały i nieomylny. Gdy w koalicji znajdzie się wiele niekompetentnych osób, głupota się kumuluje i wzrasta wykładniczo. Ale tak samo działa to w przypadku gdy w jednym miejscu zgromadzimy osoby wybitne o umysłach ostrych jak brzytwa i przekonaniach twardych jak skała. I taka właśnie to jest nasza Rada. Możemy czasem wyglądać na grupę starych dziadów którzy siedzą pod blokiem na ławce i marudzą przekrzykując jeden drugiego, ale gdy postanowimy coś...to każdy z nas dopełnia się w sposób suplementarnie idealny. Co prawda, najpierw trzeba dojść do tego porozumienia. Ale nie ma u nas elementów wywrotowych, które w jakikolwiek sposób mogłyby zakłócić nasze funkcjonowanie, wszak wszyscy wywodzimy się z zacnego środowiska klubu Ronina. No, może oprócz Gadomskiego..."
BBW_new_quotas_guidebook: "Nowy przewodnik po normach"
BBW_new_quotas_guidebook_desc: "W końcu razem z Witoldem ukończyliśmy nowy podręcznik dla wszystkich pracowników Bractwa. Co prawda wolałbym żeby mnie koń kopnął w głowę niż żebym musiał po raz kolejny słuchać wykładów Gadomskiego o liberalizmie, aczkolwiek tutaj zasadniczo nie było zbytnio wielu rozbieżnych zdań. Dziesięciogodzinny dzień pracy jest niezbędny abyśmy byli w stanie nadgonić sąsiadów i wybić się na niezależność ekonomiczną. Problem leży w tym że ludzie nie będą chcieli tego przyjąć za nic w świecie więc póki co są to “opcjonalne nadgodziny”. Kierownicy zakładów dostaną załącznik do podręcznika z metodami radzenia sobie z ludźmi którzy nie będą chcieli tych nadgodzin robić. I tak się tworzy proszę państwa dobrobyt!"
BBW_consolidation_of_unions: "Konsolidacja górniczych związków zawodowych"
BBW_consolidation_of_unions_desc: "Związki zawodowe zbudowały i zniszczyły III RP. Bandy związkowe które przykleiły się do PiSu w czasach jego najbardziej radykalnych reform nie mają nic wspólnego z reprezentowaniem interesu pracowników. Szczególnie w tych górniczych zalęgła się tak szeroko rozpowszechniona zaraza bumelanctwa, że aż mnie zęby bolą jak pomyślę o tym że górnik mógłby się upodlić do tego stopnia że jedyne co robi to wyciąga rączki po kasę nie wykonując żadnej pracy. Ale na to mamy rozwiązanie. Łączymy wszystkie związki w jedno wielkie Gwarectwo Bełchatowskie, które będzie trzymało rękę na pulsie wszystkich potencjalnych wywrotowców. I w końcu będziemy mogli zacząć pracować jak ludzie."
BBW_our_people_in_radio_dialog: "Nasi ludzie w radiu Dialog"
BBW_our_people_in_radio_dialog_desc: "Jak Szymon czasem wpadnie na pomysł to klękajcie narody. Ale wiadomo - nie można przeszkadzać wrogowi gdy popełnia błąd. Hołownia uważa się co prawda za przyjaciela wszystkich w województwie Łódzkim, a każdego z watażków za jedną wielką upośledzoną rodzinę. I w związku z tym zaprosił wszystkich do współtworzenia radia Dialog, gdzie każdy dostaje szansę na krótki segment związany z promowaniem ich kraju, oczywiście wszystko w duchu współpracy i wzajemnego kochania się. Niedoczekanie. Już rozmawiałem z Janeckim i mamy cwany plan. Stasiek nazywa to jakoś sprytnie - percepcją subliminalną. Chodzi oczywiście o przekazywanie naszych ideałów tak żeby te słupy dialogowe się nie zorientowały. Ale to będzie show!"
BBW_szczercow_bombing_memorial: "Pomnik zamachu w Szczercowie"
BBW_szczercow_bombing_memorial_desc: "W dniach takich jak dzisiejszy życie brutalnie przypomina mi co to znaczy być odpowiedzialnym za losy tysięcy ludzi. Całe społeczeństwo pokłada wiarę w to, że moje decyzje będą słuszne i zagwarantują im bezpieczeństwo i dostatek. I czasem nie zależy to ode mnie jak to wszystko się rozgrywa, ale koniec końców - jeżeli coś pójdzie nie tak, wina wciąż jest moja. I ja od tego nie uciekam. Muszę to przyjąć z godnością. Bo życie siedmiu młodych ludzi ciąży na moim sumieniu. Nie zrobiłem wszystkiego żeby zagwarantować im, że takie sytuacje się nie będą zdarzać. Mogę to robić po fakcie, ale...to im życia nie wróci. Mam problem z napisaniem jakiejś sensownej mowy na uroczystość...słowa nie chcą współpracować kiedy tyle serc jest w żałobie. Ale muszę unieść ten krzyż."
BBW_proctor_secret_files: "Tajne akta Proktora"
BBW_proctor_secret_files_desc: "Zdolność Janeckiego do analizowania każdego najdrobniejszego szczegółu oraz kurczowego trzymania wszystkich informacji w swoich archiwach zrobiła z niego tak wspaniałego dziennikarza śledczego przed Upadkiem. A teraz, jest jeszcze bardziej przerażający - bo może wykorzystać swoje talenty w kierowaniu służbami całego państwa. Ale to nie wystarczy. Stanisław potrzebuje swojej własnej agencji wywiadowczej, bo jak bardzo genialny by nie był - ma tylko jedną parę oczu i uszu. A prowadząc siatkę szpiegowską, ohohoho...będzie niepowstrzymany. Co w zasadzie sprawia że samemu zaczynam się bać. Ale nie ma czego, w końcu jesteśmy starymi przyjaciółmi z klubu Ronina."
BBW_youth_agents: "Mali agenci"
BBW_youth_agents_desc: "Tak jak się spodziewałem, Janecki przyjął informację o dodatkowych obowiązkach z ogromnym entuzjazmem. Wyglądał i zachowywał się jakby to były co najmniej jego urodziny (do zanotowania - kupić mu fedorę na prezent urodzinowy). Ale od razu zabrał się do pracy i w sumie nie zdziwiło mnie że z marszu wystrzelił w moją stronę całą listę rzeczy których będzie potrzebował do rozkręcenia tej operacji. Oprócz dość sensownych małych rzeczy które natychmiast dałem radę załatwić, była jedna do której potrzebowałem usiąść i pomyśleć na spokojnie. Janecki chce rekrutować młodzież do bycia szpiegami. Uważa, że są oni idealni do niektórych zadań a i ideologicznie będą bardzo prości do ukierunkowania. Może i przez chwilę miałem moralne wahania, ale Stasiek był tak bardzo podekscytowany, że nie mogłem mu odmówić. Na szczęście mam na myśli parę osób..."
BBW_grand_picnic: "Organizacja Wielkiego Pikniku"
BBW_grand_picnic_desc: "Czasem trzeba założyć na twarz maskę, zagryźć wargi i uśmiechnąć się głupio do sąsiada życząc mu miłego dnia. No nic to może nie kosztuje oprócz dodatkowych zmarszczek, ale i tak jest to nieprzyjemnie sztuczne. Dodatkowo to boli wielokrotnie bardziej gdy coś takiego musisz przeprowadzać na arenie między...no, nie międzynarodowej bo to ten sam naród. Internarodowej? Może. Mniejsza. Chodzi o to, że musimy robić dobrą minę do złej gry i zorganizować jakieś igrzyska dla ludu i przy okazji pokazać się Hołowni z dobrej strony. To uśpi jego czujność i przynajmniej przykryje na jakiś czas nasze wewnętrzne problemy. Poza tym, który lider byłby w stanie odmówić dobrze wygrillowanej golonki albo steka? Do tego piwko w rękę i można prowadzić dyplomację! A jeszcze jakiś koncercik się w tle załatwi i będzie super. Co może pójść nie tak?"
BBW_we_got_them: "Bracia i Siostry...mamy ich!"
BBW_we_got_them_desc: "Zdrajcy. Wywrotowcy. Reakcjoniści. Wiechowcy. Ekoterroryści. Nagłówki gazet prześcigały się w pejoratywnych określeniach na sprawców zamachu w Szczercowie. Tak, mamy ich. Złapaliśmy sprawców. Przez naszą własną narrację dałem się złapać na myśleniu że te dzieciaki są wcieleniami samego diabła. Po czym, gdy ich zobaczyłem na własne oczy...było to dość otrzeźwiające doświadczenie. Całe życie przed nimi, a dali się zmanipulować za przegraną sprawę, pomimo posiadania relatywnie wygodnego życia w środku kraju ogarniętego anarchią. Ale potem przypomniałem sobie, że mimo wszystko odpowiadają za zamordowanie siedmiu naszych żołnierzy. I dysonans ulatuje."
BBW_more_power_to_state: "Więcej władzy dla aparatu bezpieczeństwa"
BBW_more_power_to_state_desc: "Na ulicach zaczyna się powoli robić tłoczno. Nie do końca podoba mi się do czego może to doprowadzić. Proces pomimo że potoczył się po naszej myśli, to jednak wszystko co się działo poza budynkiem Estakady już nie do końca mieści się w naszych politycznych planach. Janecki zarzeka się że ma kontrolę nad najgorszymi elementami społeczeństwa i nie dojdzie do tragedii. Gadomski mówi że to naturalna potrzeba ludzi do wyrażania swoich opinii i powinniśmy po prostu ich przeczekać. Warzecha grozi napuszczeniem armii na protestujących. Już chcę widzieć jak próbuje rozmieszczać po kątach Sommera i jego paladynów. A sam Sommer...właśnie, czy ktoś widział Tomka?"
BBW_reforms_of_highest_time: "Reformy Najwyższego Czasu"
BBW_reforms_of_highest_time_desc: "Najwyższy czas! To zawołanie nigdy nie straci swojego uroku. Bo jest to w istocie czas, by zająć się naszą armią. Tomasz jest zniecierpliwiony i ma wielkie plany, truł mi głowę kilka miesięcy o tym żebyśmy zatwierdzili jego plan reform. No i w końcu - ma. Co prawda nie jestem przekonany jak nam pomaga wielki plan stworzenia gigantycznej floty sterowców oraz maszyn kroczących, ale jest to zdecydowanie - WIZJA. A wizjonerów nam potrzeba, w końcu tylko oni są na tyle szaleni żeby odważyć się na takie ryzyko. Może i część z tych reform nie wyjdzie, ale trzeba próbować."
BBW_reorganisation_of_hierarchy: "Reorganizacja hierarchii"
BBW_reorganisation_of_hierarchy_desc: "Nasze przejęcie władzy nad terenami obecnie w naszym posiadaniu nie obeszło się bez dość specyficznych kompromisów. Nasze siły zbrojne to pozorny monolit. W rzeczywistości na poziomie kompani jest to amalgamat górniczych milicji, lokalnych sił bezpieczeństwa i naszych własnych bojówek. W czym problem? Taki że niekoniecznie wszyscy którzy powinni pełnić funkcje oficerskie je pełnią, i vice versa. Wspomniałem o bojówkach, prawda? No właśnie - liczba mnoga. Każdy paladyn generalnie ma swoją własną więc cała hierarchia leży i kwiczy jak Polska gospodarka. Musimy ten węzeł gordyjski przeciąć."
BBW_brutal_hazing: "Brutalna fala"
BBW_brutal_hazing_desc: "Śmiać mi się chce jak pomyślę sobie o tych wszystkich zachodnich armiach gdzie obniża się wymagania, wpuszcza się osobniki niebanalne, elgiebety, itd. Chłop musi być chłopem! I wojsko musi z niego zrobić mężczyznę. Fala rządzi się swoimi własnymi prawami i tak, bywa to często upadlające, ale przede wszystkim to hartuje ducha! Wróg nie będzie rozpływał się nad twoimi zaimkami, on będzie chciał Cię zabić! Więc ty musisz być największym krwiożerczym potworem który zabije jego najpierw. Dlatego myślę, że nie szkodzi jeżeli żołnierze między sobą hartują się wzajemnie by wydobyć ukrytą siłę i pielęgnować wytrwałość. Tak powinno być."
BBW_copying_foreing_designs: "Kopiowanie zagranicznych konstrukcji"
BBW_copying_foreing_designs_desc: "Musimy produkować więcej broni, żeby uniezależnić się od Łódzkiej zbrojeniówki (która to Łódź de facto sama jest pacyfistyczna, ale broń sprzedaje...). Właśnie. Jak się produkuje broń? Teoretycznie możemy wziąć rurę i napchać do niej prochu i liczyć na to że nie wysadzimy sobie rąk przy okazji. Ale taka prowizorka nie przystoi prestiżowi Bractwa Węgla! Co prawda bronie czarnoprochowe idealnie wpasowują się w nasz wizerunek, ale musimy mieć też coś z prawdziwym kopem. Co tu zrobić? Ano, bierzemy zdobywamy taki jeden, może dwa zagraniczne karabinki i starą chińską metodą - bezczelnie kopiujemy. Tu przemalujemy, tu dodamy jakieś dodatkowe frezy, spawy, gadżety - i już mamy nowiutki karabin gotowy do masowej produkcji! To takie proste!"
BBW_mass_motorisation: "Masowa motoryzacja piechoty"
BBW_mass_motorisation_desc: "Konikiem Warzechy zawsze była motoryzacja i prawa kierowców. Nic dziwnego że przekonał Tomka do tego odważnego kroku. W końcu tak USA rozniosło Niemców podczas II Wojny Światowej - miażdżącą przewagą motoryzacyjną. Niemcy całą wojnę prowadzili z pozycji giganta zmechanizowanej armii - dopóki nie przybył Ford i General Motors. My takich molochów przemysłowych nie posiadamy niestety, ale...możemy spróbować zmotoryzować maksymalnie nasze jednostki żeby nie musiały przemierzać zrujnowanych poupadkowych ziem na piechotę, albo co gorsza...na *tfu* rowerze."
BBW_giants_of_military_industry: "Giganci przemysłu zbrojeniowego"
BBW_giants_of_military_industry_desc: "Zawsze będę powtarzał - chcesz pokoju, szykuj się na wojnę! Co prawda my tutaj nie mamy co myśleć o pokoju, niezależnie od tego ile Szymon będzie bulgotał o dialogu i współpracy. Wojna przyjdzie prędzej czy później - i zakładając, że jednak będzie to prędzej - musimy jak najszybciej rozkręcić naszą zbrojeniówkę. Tworząc gigantyczne kombinaty przemysłowe w każdym z naszych głównych miast zdecentralizujemy produkcję, i jednocześnie pokryjemy wszystkie możliwe fronty zalewając wroga stalową plagą karabinów i bagnetów. Tylko musimy najpierw znaleźć pieniądze na samą konstrukcję i pierwszy rozruch...potem tylko znaleźć surowce...i eh, czy my na pewno możemy sobie na to pozwolić?"
BBW_flying_monsters: "Latające molochy z Łaska"
BBW_flying_monsters_desc: "Wydawało mi się że sterowce akurat należały do tych reliktów przeszłości które określamy wynalazkami epoki słusznie minionej. I o ile jesteśmy wielkimi orędownikami powrotu do starych, sprawdzonych metod zarówno przemysłowych jak i wojskowych, tak...no nie wiem. Sterowce? To nie jest tak że ktoś może to zestrzelić z pistoletu? Puff, i nie ma całej floty...właśnie - floty! Tomek wymyślił sobie że to nie byłby jeden statek, lecz cała gigantyczna armada która przesłoniłaby słońce! Chociaż może jak będą lecieć dostatecznie wysoko to nikt ich nie zestrzeli - bo i z czego? I wtedy tanim sposobem będziemy mogli zbombardować wroga. Znaczy się...patrząc na plany, no może nie takim aż...tanim."
BBW_liberty_prime: "Rozpoczęcie budowy Liberty Prime"
BBW_liberty_prime_desc: "Nie zrozumcie mnie źle, jestem całkowicie za każdą inwestycją która przynosi prestiż naszemu państwu oraz dodatkowo czyni z nas superpotęgę wojskową. Tylko...wielki kroczący robot? Znaczy nie to że nie potrafię sobie tego wyobrazić, w końcu zdarzało mi się pisać science-fiction. Z drugiej strony fikcja pozostaje fikcją dopóki ktoś nie przyjdzie i nie wiedząc o tym ją urzeczywistni. Więc może i coś jest na rzeczy. Może i zbankrutujemy przez ten projekt ale jak cudownie byłoby zobaczyć tą cudowną maszynę miażdżącą Manufakturę albo Centrum Dialogu. Oh! Czy możemy mu zamontować moduł głosowy? Wtedy mógłby rzucać patriotycznymi tekstami dodatkowo!"
BBW_flamer_corps1: "Stworzenie Korpusu Ogniomistrzy"
BBW_flamer_corps1_desc: "Ogień trzeba zwalczać ogniem. My co prawda walczymy co najwyżej z ogniem rewolucji ale nikt płakać nie będzie jeśli takowych potraktujemy też ogniem. Z ogniem w swoich oczach to właśnie Tomek opowiadał mi o swojej wizji wielkiej falangi żołnierzy wyposażonych w miotacze ognia maszerujących ramię w ramię do przodu palących wszystko co znajdzie się na ich drodze. Wielka ściana ognia która pochłonie każdego naszego wroga. Brzmi spektakularnie, to muszę przyznać. Chociaż wybuchowo byłoby gdyby jeden z nich się nagle zapalił. Bum, i nie ma całej naszej linii. No, ale zakładając że nie byliby dosłownie metr od siebie to może to zadziałać. Łukaszowi się to nie spodoba, zabierzemy biedakowi połowę zasobów paliwa."
BBW_book_of_warzecha_and_gadomski: "Księga Warzechy i Gadomskiego"
BBW_book_of_warzecha_and_gadomski_desc: "Ekonomia w naszym wydaniu musi być spójna i być elementem naszej siły i potęgi. Szkoda, że pośród nas samych w tychże kwestiach panują odmienne poglądy. Jedne bardziej liberalne, drugie bardziej...ortodoksyjne w kwestii interwencjonizmu. Do tego jeszcze kolega Sommer który próbuje wpleść w to wszystko swoje marzenia o Bractwie jako gigancie przemysłu zbrojeniowego i kolega Janecki który pragnie wielkich inwestycji w przemysł zaawansowanych technologii. A gdzie ja mam tam jeszcze swoje słowo wpychać? Chciałbym, nie ukrywam - ale wydaje mi się że lepiej będzie pozostawić ekonomię tym, którzy bardziej się na niej znają. Tylko teraz...kto w ogóle ma tu rację?"
BBW_liberalize_arms_laws: "Liberalizacja przepisów produkcji zbrojeniowej"
BBW_liberalize_arms_laws_desc: "Paladyn Gadomski twierdzi że kurs obrany na liberalizację niektórych sektorów gospodarczych to jedyna słuszna droga na jaką nas obecnie stać. Daleko mi do popularyzowania haseł które normalnie zakrawałyby o broń Boże...liberalizm..., ale Sommer wydaje się wtórować Gadomskiemu. Łukasz co prawda będzie wściekły, ale cóż to za nowość? Pierwszy krok - uwolnienie potencjału zbrojeniowego poprzez poluzowanie przepisów i restrykcji które pozwalają na produkcję broni i amunicji. Całkiem zdroworozsądkowe i przyszłościowe, muszę przyznać. Będziemy potrzebowali dużo broni w nadchodzących latach, a opieranie się na skostniałych przepisach martwego systemu wyrządziłoby nam więcej krzywdy niż pożytku."
BBW_lowering_taxes_for_industry: "Obniżanie podatków dla przemysłu"
BBW_lowering_taxes_for_industry_desc: "Wszelkiego rodzaju nieszczęsne składki, daniny, akcyzy czy podatki zawsze były elementem rozgrywki politycznej lub napychania prywatnych kieszeń, a nigdy nie służyły społeczeństwu. Energia która drzemie w naszych przedsiębiorczych obywatelach musi zostać uwolniona i popłynąć niczym ogromna rzeka pętana tamą która nie może dopuścić do rozlania się na pobliskie tereny. A ja mówię - niech się leje! Musimy odbić znaczenie słowa postępowość i sprawić by oznaczała to co powinna - rozwój, a nie zaściankową degradację wartości! Postęp nie może być regulowanym strumyczkiem z którego ledwo co skapuje toksyczny ściek, musi być gigantyczną falą która może i przyniesie straty, ale za to rozpędzona, przyniesie oczyszczenie i świeżą wodę."
BBW_incentivize_factory_work: "Zachęcanie do pracy w fabryce"
BBW_incentivize_factory_work_desc: "Wydajność - to kolejne ze sztandarowych haseł którymi powinniśmy się kierować. Efektywność rolniczych zapędów już dawno spaliła na panewce po niezliczonych dotacjach unijnych i chciwości pańszczyźnianych pasożytów z samorządów pod znakiem zielonej koniczynki. Oczywiście stracili na tym poważni rolnicy, którzy swoją pracowitością niejednego robotnika by położyli na łopatki. Niemożliwym jest odkręcenie tak zepsutego systemu, dlatego niestety dla wielu trzeba będzie znaleźć jakieś inne zajęcie. Nie ma sensu inwestować w coś co przynosi jedynie straty, dlatego dla rolników trzeba będzie stworzyć programy które pomogą im przekwalifikować się na porządną pracę w ciężkim przemyśle. Tam ich rzetelność i pracowitość przyda się do ciężkiej pracy, która mimo wszystko przynosi owoce, a nie długi i niepewność."
BBW_remotorisation: "Remotoryzacja społeczeństwa"
BBW_remotorisation_desc: "Neoliberalni feudałowie z wielkich miast za punkt honoru postawili sobie całkowite zniszczenie infrastruktury samochodowej. Strefy Czystego Transportu, dodatkowe opłaty, zwężanie jezdni, brak parkingów, ścieżki rowerowe, buspasy, pasy zieleni. Wszystko by jak najbardziej ograniczyć wolność poruszania się przeciętnych ludzi, których nie stać na elektryczne superauta lub mieszkają na obrzeżach miast, i zlikwidowana komunikacja zbiorowa nie pozwala im na przemieszczanie się jak to mieszczuchy nakazują - bez auta. Łukasz ma na to plan. I ja się pod nim podpisuję! Trzeba przywrócić miasta autom, i odbudować porządną i efektywną infrastrukturę która pozwoli normalnie przemieszczać się wszystkim, a nie tylko wybranej elicie. Może nawet uda się nam do tego wykorzystać resztki Partii Kierowców..."
BBW_climate_tax: "Wprowadzenie podatku klimatycznego"
BBW_climate_tax_desc: "Co prawda ja osobiście nie jestem orędownikiem wprowadzania dodatkowych podatków, ale muszę przyznać że Warzecha tutaj przeszedł samego siebie. Odwrócenie ekologicznych żądań przeciwko nim samym będzie zdecydowanie cenną lekcją dla wszystkich, którzy dalej ostają przy swoich anachronicznych ekobzdurach. Nazwanie tego podatkiem klimatycznym jest jedynie cudowną wisienką na torcie, który upieczemy rzecz jasna na piecu węglowym. Każdy kto nadal dostosowuje się do przestarzałych zielonych dyrektyw rodem z Brukselskiego piekła, będzie płacił dodatkowe opłaty. Ogień trzeba zwalczać ogniem. A ten ogień nie może rozprzestrzenić się w naszym społeczeństwie, gdyż nie daj Boże mógłby się z tego zrobić pożar. A wtedy...oj, wtedy to dopiero emisja dwutlenku węgla poszybuje w górę. Razem z prowodyrami."
BBW_logging_operations: "Działania wycinkowe na terytorium ZHRP"
BBW_logging_operations_desc: "Umowny pas graniczny pomiędzy nami a zielonymi potworami zajadającymi się szyszkami i krwią porządnych przemysłowców stanowi wielki zielony mur pełen drzew. Ale nie ma takiego traktatu ani ustawy która ustanawiałaby de jure gdzie jest granica pomiędzy Bractwem a terenem anarchii harcerskiej. Ich lasy zbyt blisko są naszych newralgicznych punktów. No a tak się składa, że prowadząc wycinkę dookoła Kleszczowa, zahaczamy przypadkiem o skrawek terenu który ponoć nie należy do nas. Kłóciłbym się z tym co prawda, ale obawiam się że Wielki Baron Dialogu będzie tutaj prawił kazania jeśli dojdzie do jakichś konfrontacji. A może po prostu...nikt się nawet nie zorientuje? W końcu komu przeszkadza parę drzew w te czy we wte...a my potrzebujemy tego by zasilać to cholerne województwo."
BBW_belchatow_expansion_gadomski: "Rozbudowa elektrowni w Bełchatowie"
BBW_belchatow_expansion_gadomski_desc: "Maszyna musi jeść i rosnąć. Nie ma w naszych doktrynach jakiejkolwiek innej alternatywy wobec rozwoju naszego klejnotu - Bełchatowskiej Elektrowni Węglowej. To źródło naszego dobrobytu, kolebka naszych wartości i symbol wiary w ideały które rozprzestrzeniamy razem z energią na całe województwo. To my przynosimy oświecenie wszystkim dookoła, to dzięki nam mogą w spokoju i cieple spoczywać i szerzyć swoje herezje. I dlatego absolutnym priorytetem jest zadbanie o to żeby zbudować jak najtrwalsze fundamenty pod wieczne funkcjonowanie wszystkich bloków energetycznych; tych obecnych, jak i tych które właśnie zamierzamy zbudować. Bo to jest inwestycja w przyszłość. Na szczęście nie ma tutaj żadnego głosu sprzeciwu wobec tej kwestii. Bo jaka niby miałaby być inna droga?"
BBW_invest_in_smaller_businesses: "Inwestycje w mniejsze biznesy"
BBW_invest_in_smaller_businesses_desc: "Jeżeli miałbym wskazać jakiś pozytyw wynikający z Upadku...to oprócz dosadnego stwierdzenia że eurofederałowie ujawnili swoje prawdziwe oblicza, to powiedziałbym że zagraniczne molochy które uciskały mniejszych przedsiębiorców w końcu wyniosły się z kwikiem z naszego kraju. Przynajmniej z jego większości. Gospodarka próżni nie znosi, więc nareszcie nasi mniejsi lokalni przedsiębiorcy będą mogli postawić się w roli Atlasa trzymającego na swoich barkach ekonomię naszego społeczeństwa. I należy ich wspierać w tym, i zadbać o dodatkowe fundusze dla rozwoju małych i średnich przedsiębiorstw. Bo państwowe może działać tylko gdy pomaga im w tym prywatne. Nie zamiast, nie bez nich. To gospodarcze yin-yang jest kluczem do osiągnięcia sukcesu, którego nikt w tym województwie zdaje się nie rozumieć."
BBW_belchatow_expansion_warzecha: "Rozbudowa elektrowni w Bełchatowie"
BBW_belchatow_expansion_warzecha_desc: "Maszyna musi jeść i rosnąć. Nie ma w naszych doktrynach jakiejkolwiek innej alternatywy wobec rozwoju naszego klejnotu - Bełchatowskiej Elektrowni Węglowej. To źródło naszego dobrobytu, kolebka naszych wartości i symbol wiary w ideały które rozprzestrzeniamy razem z energią na całe województwo. To my przynosimy oświecenie wszystkim dookoła, to dzięki nam mogą w spokoju i cieple spoczywać i szerzyć swoje herezje. I dlatego absolutnym priorytetem jest zadbanie o to żeby zbudować jak najtrwalsze fundamenty pod wieczne funkcjonowanie wszystkich bloków energetycznych; tych obecnych, jak i tych które właśnie zamierzamy zbudować. Bo to jest inwestycja w przyszłość. Na szczęście nie ma tutaj żadnego głosu sprzeciwu wobec tej kwestii. Bo jaka niby miałaby być inna droga?"
BBW_15th_pension: "Piętnastka dla górników"
BBW_15th_pension_desc: "Czasem wydaje mi się że to wymyka się spod kontroli. Zwykły kalendarz ma dwanaście miesięcy, lecz dla górników jest ich czternaście. Powoduje to harmider i bałagan rodem z Imperium Rzymskiego kiedy cesarze dodawali sobie miesiące tak jak im się podobało. A potem nie mieli pojęcia jaki jest rok. My mamy to pojęcie, ale...no nie możemy przecież odmówić naszemu żelaznemu elektoratowi, prawda? Warzecha miał wymyślić jakiś sposób na dodatkowe przywileje dla górników, sam osobiście myślałem o jakichś...bardziej wyrafinowanych metodach zdobywania ich serc, ale cóż. Dostaną piętnastą wypłatę. Jest to na swój sposób proste i skuteczne. Tylko czy nas będzie stać jeśli będą chcieli zaraz szesnastą, siedemnastą i osiemnastą?"
BBW_atlas_shrugged: "Atlas Niewzruszony"
BBW_atlas_shrugged_desc: "What was always going to happen, happened: Hołownia's Dialogue, the Atlas that meant to keep unreconcilable warlords, ourselves included together, is disintegrating in front of our eyes. A critical time in history approaches. As Atlas shrugs off the Dialogue, our enemies will be unleashed. We emerge from the mines, ready for them."
BBW_cut_off_power_lines: "Odcięcie linii energetycznych"
BBW_cut_off_power_lines_desc: "For far too long we have sustained this plight of a voivodeship with our sacred coal and power. We of all people should know importance of the power grid: Machine industry, production, all these are paramount, weapons borne from these superior to any football ultra with a baseball bat, or a forest child with a pinecone slingshot. Even Ellander's schizophrenics recognised its importance. But now, when the Dialogue is no more, we can finally cut the umbilical cord that kept us tied to this rotting carcass of an alliance. Let them rot in darkness."
BBW_cut_off_power_lines_tt: "§RPermanently§! shutdown all sectors of power grid"
BBW_counterrevolution_rearguard: "Tylnia straż kontrrewolucji"
BBW_counterrevolution_rearguard_desc: "Hooligans. Most of these types boast ideology that begins and ends with a baseball bat. These ones have a bit more pretense: The only thing they love more than the Jews, are the revolution. The Revolution, especially of the red type, however, is a pipe dream that shatters the moment real problems need solving. But, these people barely read Marx. So let us save them the embarrassment of dealing with stately issues that a Brotherhood is more than fit to deal with: Let us bury them in the coal seams."
BBW_securing_southern_flank: "Zabezpieczenie południowej flanki"
BBW_securing_southern_flank_desc: "To our south, the eco-terrorists of ZHRP dwell, obsessed with shackling their forests in its current form, denying them ascention from biomatter to sacred form of coal. In turn, the forest fights with them, and they strike where others least expect. They fight like cowards, relying on stealth and hit and run tactics. And rightly so, for they have no industry, no equipment superior to slings, molotovs and pinecones. In clash with our superior paladins, they will quickly become desperate: But it is a desperate beast that fights the hardest. We must build up our forward operating bases and bunkers to weather whatever they are ready to throw at us."
BBW_anarchist_punks: "Rozbicie anarchistycznych gówniarzy"
BBW_anarchist_punks_desc: "Against organised, rational, realistic power, one that knows importance of order and literal power alike, and is not afraid to burn the sedentary past behind it to get wherever it must, no anarchist band stands a chance. Going after them will be no different than quashing a bandit or a ZHP team. Raise our fists, together, organised into singular will, and the chaos of the anarchists will crumble like peat before hammer."
BBW_unsavory_types: "Szemrane typy"
BBW_unsavory_types_desc: "Consortium are no different from the remainder of dead-end warlords of the former Dialogue. Why even bother explain the power and sense of our industry to them? When we are right, and it is self-evident, you don't pretend the competition has anything to offer us but parasitism! You put them down before they diminish you."
BBW_final_judgement: "Sąd Ostateczny"
BBW_final_judgement_desc: "Here stands a courtroom ruling in the name of a fallen, naive state, distracted by the letter of the law instead of that which matters most. A relic of old justice and old era indeed: Anna Maria Wesolowska boasts the law and name recognition on her side, and has fierce defenders keeping order in her court of law and realm alike. Once we overcome them, she will be taken to court by us, and with her, the old decadent era before us."
BBW_key_fortifications: "Wzmocnienie kluczowej infrastruktury"
BBW_key_fortifications_desc: "The Brotherhood relies heavily on its critical power-bearing infrastructure, dead-set to bet everything on its superior power generation. This makes for a... bright target for our enemies to tackle. We must anticipate them. Sandbags, ambush sites, emplacements, bunkers. Strike the earth, make it crumble under our forts, as any audacious foe will if they dare touch our substations or plants."
BBW_east_west_rail_line: "Linia kolejowa Wschód-Zachód"
BBW_east_west_rail_line_desc: "Rail lines are the true veins of industry. Nothing can be achieved without them. Road vehicles have their place, but they're always powered by diesel or petrol: Trains run on power straight from our plants, or even coal itself if we choose them to. We will craft yet another rail line for our power, going from easternmost reaches of our realm to westernmost. Only with superior logistics, can our superior industry matter."
BBW_artillery_support: "Artyleryjskie oddziały wsparcia"
BBW_artillery_support_desc: "Our foundries, our munitions plants, their sheer output makes us uniquely suited to adopt a more decentralized artillery doctrine. Requested at will, the support teams will fire whenever told to, whenever ready. The tactical edge over our enemies, who barely can muster pinecones for their arms, will be undeniable. With superior firepower, the superiority of our ideology and order alike will be self-evident."
BBW_rzymkowski_doctrine: "Doktrynale reformy Rzymkowskiego"
BBW_rzymkowski_doctrine_desc: "Rzymkowski has been tasked to take our military doctrine and turn it into something that can scale. We will not remain a provincial statelet for long: And expanding our force, as is inevitable, will require hundreds of thousands of men. To that end, entire new order of battle and chain of command has to be crafted. Rzymkowski will have to decide how we organize commissioned officers, which paladin ranks will handle what units, and how to tie it all to our industrial might. Without this, we remain a band of brothers, barely capable of holding on to Łódzkie."
BBW_come_fly_with_me: "Lecę bo chcę"
BBW_come_fly_with_me_desc: "Deep in a forgotten military base in our lands, there are warplanes. Old, rusty, and nothing our brothers can't fix. Once they're in the skies, we will have an unassailable advantage over any force without plentiful anti-aircraft, which should be almost no one we face currenctly. Those things served well for actual superpowers, and who better to restore them to their fuel-guzzling glory than us?"
BBW_partisan_whackamole: "Partyzancka gra w kotka i myszkę"
BBW_partisan_whackamole_desc: "They're everywhere. We're doing everything to pacify Łódzkie, we brought back common sense, gave the people energy, industry, and prosperity, and still, there's a new micro-rebellion in some godforsaken corner of the voivodeship almost every single day. So many capable young men have thrown their lives away in a pointless act of defiance. They could've been proud members of society, working in the mines and bringing pride to their families. It's hard for me not to think of that when the paladins drag back yet another batch of captured dissenters. Is it their fault they've been misled by decades of eco-propaganda? But even if they are lost, at least we can make sure the future generations don't have to meet the same end."
BBW_exhausted_stockpiles: "Wyczerpane zapasy"
BBW_exhausted_stockpiles_desc: "Where is the coal!? We've already mined so much. Where is it? That damn Dialogue forced us to send over our most precious resource to a bunch of incompetent fools, and now it's nowhere to be found. Where did it go? They can't have burned it all. The numbers don't match up, and there isn't nearly enough of that sweet smog to explain such usage. Did they hide it just to spite us? Now our own stockpiles are empty, and we can't find what is rightfully ours. That's it, we're entering crisis mode. I won't let a single chunk escape our borders until we GET. THAT. COAL. BACK."
BBW_crawlout_fallout: "Pełznąc przez ruiny"
BBW_crawlout_fallout_desc: "The voivodeship we return to is in a far different state than we remember. Łódzkie paid the price for our conquest, and most of the industry has been destroyed in the fighting. To pacify the surrounding warlords, we were forced to reduce it to ruins. That is all we now command. Lately, we've started sending maintenance teams along with every Paladin patrol squad, but the territory is still not safe enough to conduct wider repairs. For the foreseeable future, the Bełchatów area will have to provide not just for its own needs, but for those of the entire voivodeship. Warzecha was very clear in his report - we do not have the resources to spare. This is a disaster just waiting to happen."
BBW_employing_electricians: "Masowe zatrudnianie elektryków"
BBW_employing_electricians_desc: "The grid is broken beyond our current repair capacity. Why does it not surprise me that nobody in the entire voivodeship besides us bothered to do even the most basic maintenance work? We need people going from town to town fixing every damaged power line, and since all of our available electricians are already on suicide watch with how desperate the situation has been getting, we'll be giving them some new coworkers to lessen the workload. We'll be instituting a rolling quota, hiring more and more laborers each week until there's finally more stuff getting repaired than breaking itself for the third time in a row."
BBW_conglomerisation: "Konglomeryzacja mniejszych zakładów"
BBW_conglomerisation_desc: "We can't get our energy grid reorganized if we have to factor in hundreds of micro-companies, each producing enough to power about a third of a small village. Over the past week, I had to spend about an hour each day signing tiny contracts with tiny men and their tiny enterprises, each thinking that they are singlehandedly saving us from the blackout by firing up their pathetic little generators. But a single mega-conglomerate... now that would be something. It's like life - let the strong eat the weak. And once they're done feasting, the strong will get a contract to power up the Brotherhood."
BBW_protecting_our_assets: "Ochrona naszych aktywów"
BBW_protecting_our_assets_desc: "There is no resource as precious, as crucial to our daily lives, and as important to covering our energy needs as coal. Those partisans will stop at nothing to ensure eternal darkness. Those worthless terrorists; they will try to destroy what is most sacred. They will come after our coal deposits. They must know how much we depend on them. This time, I am two steps ahead. I've authorized Elder Rzymkowski to deploy a sizeable portion of the military to protect the mines from any outside interference. Work will continue as usual, and when they eventually strike, we will be ready. Nobody will be allowed to put a hand on our beautiful coal. Nobody."
BBW_war_for_tomorrow: "Wojna o bezpieczne jutro
BBW_war_for_tomorrow_desc: "Every time I walk the streets of Bełchatów, the Paladins stationed around every corner are a reassuring sight. That may just be my own personal protection, and even they hurriedly rotate every hundred meters to cover all the gaps. There are many threats still lurking, and not nearly enough of them to keep us all safe. We all deserve to be watched over by the cold, empty faces of our finest soldiers. Because only weak people have no enemies. But those enemies will never lay a hand on a single member of the Brotherhood, and if they think they can threaten us, they will get beaten down by ten, no, a hundred Paladins, or however many it takes. And once there are enough Paladins for every situation, only then will we be safe."
BBW_graphene_prototyping: "Prototypowanie grafenu"
BBW_graphene_prototyping_desc: "For the past decade, we've been standing on the precipice of a new carbon-based innovation that could potentially redefine industrial science, and as always, due to the incessant lobbying of the primitive eurofascist elites, any further development was halted. If fully utilized, this technology could spearhead us into the future. Graphene... such a beautiful word. I can already imagine all the machinery we'll infuse with graphene components. All the possible applications... we still haven't really found any, but eventually, with how versatile this material is, we'll find a way to implement it into EVERYTHING."
BBW_electricity_storage: "Masowe magazynowanie energii elektrycznej"
BBW_electricity_storage_desc: "Not every calamity can be prevented, but the Brotherhood learns from its mistakes. A local overload cannot be allowed to break our whole power grid. Unless we have a fallback, we run the risk of once again plunging the voivodeship into complete darkness. Now that we're back to generating more than the expected usage, we can reroute some of that surplus energy into a network of storage cells. Just in case something goes wrong. We can't afford another Blackout. Blackout... I need to talk to Sentinel Warzecha. We need to build even more storage cells. Twice as much as the original plan sounds about right."
BBW_sacrifices: "Poświęcenia"
BBW_sacrifices_desc: "In every victory, there is that lingering sense of sorrow for what was lost to make it possible. The Blackout required sacrifices, that much I know for sure. But they never want to tell me just how many. Warzecha uses every excuse he can to avoid a meeting, and Gadomski... he dances around the issue so much, I can tell the truth isn't pretty. The more they hide it, the more I need to know. It's been eating at me. I can't focus enough to write a single chapter. There's ominous silence all around Bełchatów. Something terrible must have happened. Why won't they just tell me? What is it that we've done to get out of this Blackout?"
BBW_budget_void: "Pustka budżetowa"
BBW_budget_void_desc: "Paladin Gadomski is a dead man. He is either the most incompetent finance minister this side of the Vistula, or he's a spy sent to Bełchatów to destroy our movement. The paladins had to restrain me when he went over the state of our budget. How do you manage to nearly bankrupt the entire Brotherhood over some energy problems!? If the Blackout had lasted for another week, we'd all be eating rotten meat by now. Reluctantly, at the request of my other ministers, I will give him one last chance to redeem himself. I don't care who he fleeces to get the money; if the budget isn't back to what it was in three months, he'll be doing hard labor in the mines until he earns it all back."
BBW_pr_disaster: "Absolutna katastrofa wizerunkowa"
BBW_pr_disaster_desc: "Every time we make a minor misstep, the rats come out and sic the public opinion against us. It's always easy to criticize the ones putting in the real work. I'd like to have seen them handle something like the Blackout. How, without our dedication and commitment to bringing the black light of industry to all corners of our territory, would they have solved this crisis? Of course, they would've miserably fallen over their faces. But the problem is, despite it being common sense knowledge, they will talk nonetheless. The least worthy will judge the paragons of progress. Eventually, the people will grow tired of their constant complaining."
BBW_media_monopoly: "Zabezpieczanie monopolu medialnego"
BBW_media_monopoly_desc: "They used to tell me I'm a regressive dogmatist, back when they could make up almost any slanderous fabrication in their liberal newspapers. They said my movement will die a natural death, that the people will reject us. Look at them now. Look at all the new adepts trying to join the ranks of the Brotherhood. They lied, like they always do. The puppetmasters in Berlin offered the best coin, so all the publications continued their attacks. We cannot allow a foreign fifth column to worm its way into the minds of our diligent citizens. We'll create a media conglomerate that will tell them the truth. The one, proper, sanctioned truth based not on ideology, but on common sense."
BBW_waste_disposal_zones: "Dodatkowe strefy utylizacji odpadów"
BBW_waste_disposal_zones_desc: "Inhuman \"progressive\" ideology has promoted waste management as the pinnacle of civilization. Wrong! (Why do I even need to explain why?) Waste itself *is* the pinnacle of civilization. According to all possible evidence, human beings have always flocked to the filth. The greatest cultural achievements of the Western civilization have been created in waste-full (the left ruined the word, by the way) environment. And in the industrial age, industrial waste stands highest out of all waste types. Contrary to manipulated evidence, the children flock to it. What we're doing by creating more waste disposal zones is actually taking care of the children. But that's just human ingenuity."
BBW_delegalisation_of_forests: "Delegalizacja lasów"
BBW_delegalisation_of_forests_desc: "It is a well-known fact that forests promote weakness. As long as ancient barbarians stayed in forests, they could not beat the Romans. As seen as they left them - they destroyed the corrupt empire. Someone hiding in a forest is a slacker; he has no respect for hard, physical work. He'd rather pick berries like a woman or a homosexual. \n\nFortunately our policies have successfully reduced the amount of forests. This is despite some remnants of leftist legislation protecting wooded areas. Naturally, we should be more proactive in our policies and ban any interaction with a forest, or forestation, once and for all."
BBW_bypass_safety_regulations: "Pomijanie zasad BHP"
BBW_bypass_safety_regulations_desc: "I actually value safety regulations. There is one I personally follow at all times, night and day, work and home. It's called: \"using your fucking mind\". Dot. Nothing else is necessary. All remaining paperwork can be used as furnace fuel. \n\nI'm actually glad that any idiot that does not know how not to get crushed by some accidental tipover will stay as far away from our factories as possible - or receive an appropriate bailout."
BBW_water_purification_stations: "Stacje oczyszczania wody"
BBW_water_purification_stations_desc: "Water does not need much to be drinkable. Tough men would often drink heavily contaminated water and survive. Unfortunately, a disease called \"dysentery\" has been introduced sometime in the post-industrial age. I have, reluctantly, decided that some facilities that provide a more palatable water should be built alongside larger fractories and habitats, so that those without formidable bacterial flora can drink it and keep on working."
BBW_czech_excavators: "Zakup czeskich planów koparek wielonaczyniowych"
BBW_czech_excavators_desc: "The Czechs are a sensible nation. I'm not going to delve into whether it is more sensible than ours. I mean, it is not always good to be sensible. Being too sensible has, actually, harmed the Czechs a lot. It stifled their national spirit, made them more vulnerable to globalist propaganda. But then, they can still build bucket-wheel excavators and we can not. And white being resistant to propaganda is one of the most sensible things a nation can do to be actually, truly sensible (you get the point), it won't go far without giant bucket-wheel excavators to dig up national wealth."
BBW_invest_in_crypto: "Inwestycje w kryptowaluty"
BBW_invest_in_crypto_desc: "All resources can be divided into either actual - like coal, steel, water etc. - and conventional, like gold, fiducial currency and so on. The great advantage of cryptocurrency over other conventional resources is that it converts actual and material resources into something conventional and immaterial at the same time. Therefore, we do not need to worry about physical destruction of our assets, value of which is directly linked in turn to how many resources we burned producing it."
BBW_capital_petrol: "Utworzenie Stołecznej Nafty"  
BBW_capital_petrol_desc: "The most efficient way of oil industry management is through one massive consortium tied closely to the state, with almost unlimited assets and power. Naturally, all of these consortiums that existed beforehand were woefully corrupt, like Orlen or Rosneft. However, this is a problem that lies with the nature of their respective regimes. Our system of government, however, is immune to that and can realise the massive consortium ideal with 100 percent efficiency."
BBW_currency_based_on_coal: "Waluta oparta na węglu"
BBW_currency_based_on_coal_desc: "Now, thinking about it, actually making coal into currency might not be that bad. It is tied to raw, productive and reproductive value, which means it way outperforms gold in that regard. Of course paying with coal is somewhat inconvenient and might contribute to diminishing of its value through crumbling and staining. If someone's going to carry coal with themselves all day, they're going to look like Nig- that's just going to be both unsightly and bad for the economy. But banking coal - that's much better. We're already doing it, so why not do it harder?"
BBW_new_cop: "Nowy Centralny Okręg Przemysłowy"
BBW_new_cop_desc: "Just like with oil, the industry performs best while centralised and massed to high degree. We should take example from the 3rd Reich, which sustained two-front conflict with much stronger enemies for over five years through cetralising most of its industry in the Ruhr Basin. Even if some factories were bombed, the industry centralisation allowed for their quick reconstruction and resource reassignation. \n\nThe more centers a country has, the more centralised it is. This is common knowledge. To further our centralisation, we need a new center of industry to stretch across from Piotrków Trybunalski to Opoczno. Every village will become a factory, every road will team with resources flowing into the furnaces. A Central Industrial Region will spread widely across the countryside."
BBW_expand_infrastructure: "Rozbudowa infrastruktury"
BBW_expand_infrastructure_desc: "Infrastructure... Yes... It is very important. Incredibly important. The roads. The pipes. The electrical supply lines. Oh, the lines especially. Transmission towers. They look magnificent. They are imperative for the landscape. Together with the lines and wires. Oh yes. Like monumental trees of industry. \n\nAnyway, this is not really a matter for me. Get an expert to design these. Just make sure they realise how huge this project is. We don't want any shortcomings."
BBW_prepare_area: "Przygotowanie terenu"
BBW_prepare_area_desc: "You can't make an omelette without breaking a few eggs. Or maybe you can. Wait, lemme check something. Okay, so maybe if I try to make a little hole here- oh, I broke it. Another try. Here... Ok, it leaks... Just a little while more... Allright, I've done it. Everything's outside and... What now? Honestly, I... Uh... How did you make it? An omelette? Yeah, so, you know, I had not been cooking for some time now, and- oh, whatever. Maybe you actually need to break an egg to make an omelette. Who cares. \n\nAnyway, get rid of these huts and whoever lives in them and move them wherever. We need a building place for our Central Industrial Region."
BBW_shift_industry: "Przekształcanie przemysłu"
BBW_shift_industry_desc: "While I'd prefer we had multiple centers at once (bearing in mind how centralisation works), one has to work with what one has. For now, we need to prepare some works to move to the new Central Industrial Region as fast as possible, so that the project will get a better headstart. Once we get the gears moving, it will be much easier to raise further facilities - and convince everybody we were right with our undertaking."
BBW_begin_construction: "Rozpoczęcie budowy"
BBW_begin_construction_desc: "Za komuny wielkie projekty tak zwanego socjalizmu otwierane były z wielką pompą oraz w stanie totalnego rozkładu pokrytego kartonem i czerwonymi flagami powiewającymi wszędzie. W obecnych czasach, zaledwie przyznajemy że dopiero rozpoczynamy budowę. Co więcej - celebrujemy to! Przyjdę tam, przetnę wstęgę, posłucham orkiestry górniczej i zjem trochę grochówki. I tak to leci."
BBW_cop_military_zone: "Strefa Przemysłu Zbrojeniowego"
BBW_cop_military_zone_desc: "A necessary component of every industrial zone are military factories. A specialised zone for ammunition production has been singled out, so that the immense potential of CIR can be converted to martial power, while minimalising the risk of unnecessary explosions."
BBW_expand_zpw_sommer: "Rozbudowa ZPW im. Paladyna Tomasza Sommera"
BBW_expand_zpw_sommer_desc: "Following the pattern of CIR development, most of our smallarms production will be placed in the significantly expanded Paladin Sommer Arms' Factory. A facility like this will be able to sustain needs of most of our infantry divisions by itself. Another victory for centralisation."
BBW_cop_energetic_zone: "Strefa Przemysłu Energetycznego"
BBW_cop_energetic_zone_desc: "The ever-growing Central Industrial Region requires more electric power. We have singled out an energy-producing sector to host the necessary infrastructure for this single purpose. Massive power plants will pomp out energy to keep the industry alive and working non-stop."
BBW_central_electrical_eq_factory: "Budowa Centralnej Fabryki Sprzętu Elektrycznego"
BBW_central_electrical_eq_factory_desc: "The best place to create electronic devices is the one where the energy fueling them is produced, so one can leave the factory and plug them right in the power plant next door. Therefore our electronics production will be focused in a giant factory right in the energetic zone. This will minimize the losses occuring during energy transfer, providing a great material and finantial advantage for users. An innovation like this is a concept completely alien to the supposedly \"green\" European Union."
BBW_cop_mining_zone: "Strefa Przemysłu Górniczego"
BBW_cop_mining_zone_desc: "As Central Industrial Region grows, it consumes more and more resources, with coal being of course the primary one. A separate mining complex should provide the Region with as much of it as possible, while eliminating the need for any intermediate infrastructure. In similar sense, we should place mining equipment factories right next to the mines."
BBW_create_lzg_machinery_complex: "Stworzenie Kombinatu Ciężkiego Sprzętu ŁZG"
BBW_create_lzg_machinery_complex_desc: "Once our industrial centerpiece is in full swing, it is time to bring back the big guns. We will convert ŁZG Łęczyca into heaviest industry works, able to construct the most massive mining and industrial equipment avalaible, necessary, if we are to become an industrial powerhouse by global standards."
BBW_temporary_migration_camps: "Tymczasowe obozy dla migrantów"
BBW_temporary_migration_camps_desc: "Damages from the Fall and the sudden influx of people coming to the larger cities has placed me in a very uncomfortable position. As much as we'd love to receive all of them with open arms into Bełchatów or Łódź, it is a terrible idea to let all those people loiter around the streets, wandering aimlessly and making the city appear plainly worse off.\n\nTherefore for the time being, we'll give them temporary shelter, safely outside of the cities. They'll get... livable conditions. Placing them all in one spot will also make it easier for us to catch some of the bad apples wanting to slip undetected into the cities."
BBW_smog_countermeasures: "Środki przeciwsmogowe"
BBW_smog_countermeasures_desc: "One of the few drawbacks of smog is that it's just terrible for visibility. If I can barely see somebody on the other side of a mid-sized avenue, how can we expect our airships to effectively find their targets from hundreds of meters above? Luckily, our pilots don't have to rely on their eyes alone. Radar detection and heat-seeking missiles remain perfectly viable technologies; we just need to blindly fly our aircraft into range, and they'll do the rest. We can expect to hit our targets pretty much as effectively as if the smog weren't even there, only with the small side-effect that we might accidentally end up bombing one of our own cities."
BBW_militarisation_of_airships: "Militaryzacja sterowców"
BBW_militarisation_of_airships_desc: "There is no flying machine that comes close to the might of a proper airship. It is a tragedy, probably resulting from some globalist plot, that these aerial titans stopped being used in combat. How are we supposed to inspire terror if we can't even hover a gigantic armed balloon over enemy territory? My engineers warned me that such a massive target might be easily shot down, so I urged them: try to pop my airship. They could even hit it while on the ground. None of them dared. Such is the fear created by these beasts. I now ask the same of our enemies. Try."
BBW_central_military_airport: "Centralne Lotnisko Wojskowe w Łasku"
BBW_central_military_airport_desc: "Now that we have a proper air force, it's unbefitting to launch our creations from provincial airstrips and disheveled hangars. What we need is a hub that will be the epitome of our might, capable of coordinating the constant swarm of our drones and airships. Paladin Rzymkowski has recently returned to me with the perfect plan - the centrally-located town of Łask has just the reach and conditions required to construct a massive airbase that will serve as the main base of operations, with only one caveat - the necessary funding. This one time, for the good of the Brotherhood, I'll let him have as much as he wants."
BBW_warta_steam_shipyard: "Warciańska Stocznia Parowa"
BBW_warta_steam_shipyard_desc: "Steam trams were the prototype that proved that steam propulsion is a viable solution for large-scale machinery. Therefore, since it's so cheap and reliable, why not use steam as the basis on which we'll establish our navy? But before we get ahead of ourselves, we first need an actual place to build these vessels in. A soil survey of the Warta estuary revealed a location that could potentially be wide and stable enough to allow for the launching of most ship classes. All I need to do is sign a decree, and the land will be requisitioned to make way for the first shipyard fit to serve our ambitions."
BBW_coal_barges: "Przerabianie barek węglowych"
BBW_coal_barges_desc: "If we are to rule the rivers, we can't limit ourselves only to military applications. Where other infrastructure fails, we can transport large quantities of coal, or whatever other less important materials we need, along Poland's river network. That way, our industrial might will be able to reach even the most remote corners of the country and transform them in accordance with our vision. And when war calls, we'll requisition the barges and load them up with something even more valuable - Brotherhood soldiers who will carry that vision to yet unconquered territories. When they're done, once again the barges will float along..."
BBW_steam_submarines: "Parowe okręty podwodne"
BBW_steam_submarines_desc: "Ever since the commencement of our naval program, I've been fascinated with the idea of steam-powered submarines. I just couldn't crack it; while everything's fine at sea level, I was left with one issue - where does the steam go when submerged? It cannot be released into the water, which allows for easy detection. Eventually, I settled on a compromise. If the steam is released into a closed-off chamber, it could allow the submarine to operate underwater for short periods of time before resurfacing and releasing the accumulated steam. Should something go wrong and the crew begins to choke violently, there will be a giant, convenient button in the control room to resurface immediately."
BBW_armored_steamships: "Opancerzone statki parowe"
BBW_armored_steamships_desc: "Our previous naval experiments have been promising, so I've started thinking to myself: why not try to build the same thing, but on a larger scale? The pride of the navy - a battleship so large, it will clog whatever river it's operating in. On second thought, that one might be a sea-only vessel. But that's not a bad thing either - the Brotherhood needs to start thinking beyond Poland. Soon, we'll be a player on the global stage, so we, too, must scale our dreams up accordingly. A giant, oceangoing representation that steam propulsion is the future is an appropriate next step in our advancement, and a beautiful, mesmerizing sight as well."
BBW_specforces_department: "Wydział Sił Specjalnych"
BBW_specforces_department_desc: "The Brotherhood is in a perpetual war against nature, and thus, we must be prepared for whatever it may throw against us. This won't be the task for just any recruit. I need the toughest, meanest, plant-hating, coal-loving veterans who will unquestionably throw themselves right into the fire to further our mission. All those Forge Cult members we previously deemed too fanatical to incorporate into our military? Well, I have just the job for them. If they want to prove themselves before their revered Elder, oh, I will be watching."
BBW_coaldivers: "Węglonurkowie"
BBW_coaldivers_desc: "I implore any potential reader of this journal to imagine this: you are a filthy ecofascist staring at the darkening sky. A cloud of dense smog stuffs your lungs as you struggle to breathe. You cough, then look back up to see a mighty, armored figure piercing through the darkness on its descent. Before you can react, it points its gun at you. My question to you is - do you surrender? Of course you do, but that is because you, dear reader, are a rational person. We cannot expect the same from our ideologically blinded enemies. What they do understand, however, is force, and we will descend with all the force required to beat them into submission."
BBW_coalmarines: "Węglowi Marines"
BBW_coalmarines_desc: "It takes a certain kind of determination, devotion even, to storm a beachhead under heavy gunfire. You need to believe that, for whatever reason, the bullets will not hit you, or simply not care whether they do. Most of a marine's effectiveness lies in their headspace. What I can do for them is theatrics - I will personally anoint each marine setting out on a mission with carbon warpaint, along with a personal book of protective rites to follow. They will charge ahead, knowing that they are immune to enemy weaponry, and if one of them falls, well, he just didn't follow the rites properly."
BBW_battle_carbon: "Stymulanty z węgla aktywowanego"
BBW_battle_carbon_desc: "It is an established fact that carbon is the basis of all life. We are carbon-based lifeforms, after all. Just like on the macro scale, it powers our internal power plants, the ones inside our cells, and keeps the lights on in our bodies. Sometimes, in high-stress, high-fatigue situations, like the battlefield, for example, we risk burning through our supplies. We don't want our soldiers experiencing a mini-Blackout, so we'll always keep them supplied - a blister pack of 100% pure activated carbon pills to keep their systems running through even the toughest combat scenarios. Huh, maybe I should start supplementing these myself. I've been getting far too tired lately. Must be the lack of carbon."
BBW_graphene_implants: "Grafenowe implanty bojowe"
BBW_graphene_implants_desc: "Doubters be damned; of course, graphene was a worthwhile investment. It can be used for EVERYTHING, after all. For clarity, I'll spare any potential readers the science and instead focus on the combat applications. The Brotherhood's finest surgeons will implant a thin graphene mesh under the epidermis of every new recruit. This surprisingly durable implant will provide comprehensive coating against any form of physical trauma, redistributing the kinetic energy along the entire network. While soft to the touch, the material will harden in response to stronger stimuli, allowing for both mobility and durability. All through the power of carbon; no unrealistic nanotech required."
BBW_coalmissars: "Zaciąg komisarzy"
BBW_coalmissars_desc: "A true paladin leads by example, and that is exactly what I expect from my commissars. There's no glory in delegating from war rooms. Ideas clash and die on the battlefield, so if somebody who claims to adhere to the Brotherhood ideal is too scared to get out there and fight for it, I won't allow him anywhere near MY movement. Were I a few years younger, I'd be there myself, defeating the Wiechowites with my bare hands. Those newcomers... they are so lucky to live in the most glorious times, to fight for the Brotherhood... they'd better start appreciating it."
BBW_flamer_corps2: "Ponowne stworzenie Korpusu Ogniomistrzy"
BBW_flamer_corps2_desc: "There was a time, a glorious time, when we met the enemy defences with fire and brimstone. And then, everything went down the dumps, as things tend to do. The Blackout came, and suddenly, things like cost-effectiveness had to matter, so the unit was put to the wayside. Ah, we were far weaker then, but the sight of a fully armored paladin charging into them through a wall of inferno still brought terror into our enemies' eyes. And the ground, too, turned to ruin, burned in the hellfire of our creation, oh, their precious greenery, the survivors cried. Now, we finally have the funds to bring them back, and I'm already lining up to take one of our upgraded flamethrowers for a test drive."
BBW_human_potential: "Potencjał istoty ludzkiej"
BBW_human_potential_desc: "Biological limits are a notion created by cowardly neo-Luddites who are constantly afraid of losing their humanity. Humanity... limitless potential is what makes humanity. We are the next step in human evolution, pushing our limits, sharpening our bodies, and when it suits us, integrating the creations of industrial technology into our imperfect forms. Those who reject it will be left behind as an obsolete fossil of a waning era. We, however, will keep growing until we are hardly recognizable from what we once were. Try keeping up with that, weaklings."
BBW_18_wheels_of_steel: "Królowie szos"
BBW_18_wheels_of_steel_desc: "Come to think of it, a truck is almost like a tank when you look at it the right way - just a more bulky one, but bulky usually means durable. If we slap these things with sheets of armor, mount some guns on the cargo part, add even more armor so you can't see where the truck ends, and the armor begins, throw a cannon in there because why not, and send that thing plowing into the enemy line at full speed. If they shoot one down (and good luck with that), we'll send a hundred more flying down every highway with orders not to stop until they either run out of fuel or manage to ram themselves into the enemy warleader. That's all the tactics we need."
BBW_smog_weaponisation: "Bojowe wykorzystanie smogu"
BBW_smog_weaponisation_desc: "Recently, I was the guest of honor at a conference organized by the Brotherhood's Society for Medical Advancement. Most of the lectures were an utter bore, but there was one that stuck with me. Apparently, according to some very credible data, while smog is naturally perfectly safe to breathe and possesses many health benefits, it is harmful, even deadly, to those who are unused to its higher concentrations. Those words gave me an idea: if we could condense smog and then tactically disperse it over our enemies, we would gain access to a chemical weapon that obliterates the weak lungs of our foes, while our soldiers won't be able to tell a difference from a regular Bełchatów morning."
BBW_equality_act: "Ustawa równościowa"
BBW_equality_act_desc: "Our enemies think that just because we don't listen to their crazy notions about energetics, we have no alternative to provide to the people. That's evidently not true. They say the same when 'evaluating' our stance on homosexuality and women's rights. Once again, they are wrong. Just because we don't support the Marxist, revolutionary, purely political LGBT movement that has nothing to do with the true interests of homosexuals, doesn't mean we have anything against those who are different from us. We welcome all and offer the alternative - gays no longer have to be morally blackmailed into joining a LGBT cult of pansies. They can express themselves and form different clubs that celebrate manliness and strength. No longer will they be forcefully compelled to engage in street exhibitionism. Our method will grant them long-denied privacy in the dark of the mines, where everyone is truly equal."
BBW_brotherhood_media_council: "Rada Mediów Bractwa"
BBW_brotherhood_media_council_desc: "There are more things to the media than just ensuring publishers exercise their freedom of expression responsibly. The new local news agencies that petition us to be included in the media machine of the Brotherhood, and someone has to give them a green light. There's also a need for a vast editorial staff that will oversee so that those local divisions will deliver the best news pieces possible that align with our policy. We need a central organ to monitor and inform all of the cells in the complex organism that is the Brotherhood. We can't allow information anarchy to confuse people who rely on us to get their news."
BBW_forge_cult: "Formalizacja Kultu Kuźni"
BBW_forge_cult_desc: "The miners and our soldiers work tirelessly so that they've created a parallel society to the one regular civilians live in. They have their own vernacular, habits, and even religious practices. Some of the surface-dwellers try to mimic them. But not all of them. We can't have a rift in our society, and we can't risk our Knights and miners coming up with some heresy. It's high time we codify the tenets of this newly born Forge Cult. We have to make sure it properly venerates the miners' craft, while not diverging too much from Catholic orthodoxy. To do that, we will emphasize the importance of saints - such as St. Barbara, St. Kinga, and St. Clement and argue that the fire of the forge purifies the sins of the wrong-doers."
BBW_network_brigades: "Inwestycje w Sieciowe Oddziały Propagandy"
BBW_network_brigades_desc: "The Forge cult, our paper, our vision and virtues. This is what we're proud of. This is what must be propagated. One man's propaganda is another's education: And our networking brigades will be the frontline lecturers, where Poland is our student. Their tireless, incessent shouting through loudspeakers, their ardent speeches, identification and saturation of groups vulnerable to subversion: These are the lifeblood of any rational message."
BBW_progress_day: "Celebrowanie Dnia Postępu"
BBW_progress_day_desc: "The Progress Day is soon to be upon us. As the Elder of the Brotherhood of Coal, I would like to invite all of our sympathizers to Bełchatów for the celebrations. This year's observance will be special, reflecting our recent successes in the continuous unification of  Poland. The participants can expect numerous attractions for whole families, games, concerts, and lectures from the most prominent members of the Brotherhood. You will be able to visit and book accommodations in the mining tunnels and test the real weapons of our paladins. Make your reservations now, as the number of visitors is limited. If you don't make it this year, don't worry. Every next Progress Day will be even more grandiose!"
BBW_coal_depots: "Wyczerpanie magazynów węgla"
BBW_coal_depots_desc: "More and more mines inform us that they keep digging only to find pure stone underground. Worrying, but that won't stop us. Poland has enough coal for another 1000 years. They either have to keep digging further down or find new deposits in our homeland. I don't want to hear any excuses. There is nothing more important than the continuation of the functioning of our energy grid. If what they're saying is true. You know, what I think? I think that the mine directors hide something from us and engage in black market selling of our coal, or are just wasteful and careless. Or maybe their underlings are slacking. A proper oversight should deal with most of those shortages."
BBW_crop_cascade: "Kaskadowy upadek zbiorów"
BBW_crop_cascade_desc: "Some reports indicate that, for some reason, our crops are failing. That shouldn't make any sense. Plants feed from carbon dioxide, and we've been producing more of it than any nation on earth. And naturally, rising temperatures should make our climate more welcoming to traditionally cultivated plants, as well as making it easier to introduce more exotic ones, such as grapevines. There's something fishy about it. We're most likely a target of the sabotage of the Green Forces, who decided to poison the plants they see in such high regard to spite us. Even their own ideas aren't sacred to them. We'll prevail and show them the futility of this attack."
BBW_new_food: "Nowe metody produkcji żywności"
BBW_new_food_desc: "We already proved we can feed our population without the nonsensical exaltation of vegetables in our diet. The meat is all we need to grow strong to face both our opponents and the unforgiving depths of mines. Still, some plants are necessary. We need pepper for all sorts of dishes, spicy garlic, and pepper. Can you imagine liver without onions? What about the sweetness of plum breaking the salty taste of loin? I won't even start with all the different herbs. Even if they won't be needed for a healthy diet, we still need to cultivate them. We'll help them combat the eco-poison we've been struck with and help them adapt by delving deep into their DNA. The plantlife has always adapted to dire conditions; If we can speed up this natural process, we will."
BBW_secret_convoys: "Tajne konwoje surowcowe"
BBW_secret_convoys_desc: "Ok, turns out that some... most of the reports of deposit exhaustion were true and not a result of mismanagement. Worrying. Well, I know for sure there is more coal under the surface, so they'd better keep looking. Finding and establishing new mines takes time, so we'll have to find an alternative source of coal for the time being. We might even toss some of the imported coal into our mines to boost the miners' morale. It's all just temporary, though. Once we get new excavation sites running, we'll stop the convoys. As such, their existence will be kept secret not to rouse our population over temporary difficulties."
BBW_absolute_silence: "Absolutna cisza"
BBW_absolute_silence_desc: "Can you hear that? Neither can I. No worried eggheads, with their imbecilic reports. No alarms about resources. Everyone can find work in the mining or industrial sector and enjoy a tasty dinner afterwards. No overexcited foreign newspaper dares to suggest another impending collapse. No miner even thinks about striking. There's no objective reason to be upset. They are still those who try to sow discord in our nation, but since they have no reason to do so, they must be foreign agent. I'll have them dealt with... but later. Right now, the whole nation and I deserve so much leisure after all the hard work we've done."
BBW_resource_plan: "Centralny Plan Zaopatrzenia"
BBW_resource_plan_desc: "Naturally as our reach extends, a steady supply of coal and other raw resources becomes an issue more and more pressing with each day we hold off on any solutions. The longer that Gadomski dilly-dallies around the idea, and the more whining I hear from Warzecha, the more it makes me want to just lock the two of them in a room together and watch them fight to death with picks if they're both so clever.\n\nBut alas, the way forwards lies in mines and said mines won't appear out of thin air, as much as I would love to see it that way. A plan to divide the funds we've put together into mining solutions is necessary...\n\nSo maybe locking the two of them together in a room is not as terrible of an idea as it seems."
BBW_charter_local_deposits: "Koncesjonowanie lokalnych depozytów"
BBW_charter_local_deposits_desc: "Despite their bruised egos, Warzecha and Gadomski have come to some agreements regarding the procurement of resources. The voivodeship holds quite a few more areas that could be cleared for lignite exploitation, some of them located precariously close to some insignificant villages. Nobody will miss them, that is if they even hear about their fate."
BBW_smaller_deposits: "Ku mniejszym złożom"
BBW_smaller_deposits_desc: "As seems to be the tradition by now, more villages stand in the way of progress. Places nobody could even find on a map hiding so much wonderful potential beneath their crust. It's a sad way of life really, out in the middle of nowhere, amongst fog and mud. We'll be very happy to receive them in Bełchatów, where new apartment blocks warm and safe will await them. Those that come willingly that is."
BBW_procure_equipment: "Zamówienia na ekwipunek"
BBW_procure_equipment_desc: "Expanding our mining capacity comes with some problems that really should've been considered sooner. With losses during the Blackout and through sheer overstretching, our fleet of excavators and of other miscellaneous mining gear simply cannot supply every new mining site. While the idea of sending thousands of miners with just pickaxes to work is very tempting, it's also a very inefficient means of getting what we need. The projects will regrettably have to be put on hold, until Gadomski gets his shit together."
BBW_grand_opening: "Wielkie otwarcie kopalń"
BBW_grand_opening_desc: "My old bones really are not built for press tours of this scale. Going across the whole voivodeship to visit every single newly opened mine, cut some ribbons and blabber about the might of the Brotherhood was Warzecha's way of trying to instill a strong work drive amongst the workers. What it did end up accomplishing is giving me, him and Gadomski a back ache that we'll have to rest off for the next week.\n\nAt least we're mining more coal at home now."
BBW_metropolisation: "Dwa klejnoty w koronie"
BBW_metropolisation_desc: "Bełchatów was our first and proudest experiment. Steam trams crisscrossing the city, connecting every district into a well oiled, optimised machine. Cogs and servos ticking and turning day in and day out. Working hard to continue the unbending march of progress.\n\nŁódź has become the second city for us to train our sights on. An older sister to Bełchatów, ripe with potential yet rough from lack of discipline. It would take some effort to shape her into a shape that would draw attention to her... assets. \n\nHand in hand they'll both march into the future, the man leading the lockstep onwards!"
BBW_artisan_apartments: "Rzemieślnicze bloki mieszkalne"
BBW_artisan_apartments_desc: "Musimy coś zrobić z ruinami w Łodzi. Podczas wojen po upadku Dialogu miasto to mocno ucierpiało. Nie no, tak naprawdę to miało bardzo dużo ruin już przed samym Upadkiem. Chociaż trzeba przyznać że w Bałutach niewiele się zmieniło od tamtego czasu, nawet pomimo eksplozji nuklearnej. Kiedyś to miała być ziemia obiecana, centrum polskiego przemysłu. A potem socjalizm z neoliberalnym kapitalizmem dobiły całkowicie Łódź. Trzeba więc usunąć ten cały gruz i zbudować coś co będzie trwalsze niż ze spiżu. Na szczęście mam do tego odpowiedniego człowieka z odpowiednim CV. Robert Konieczny. Jeśli ktoś by nie wiedział, to pomyślałby że nasz wydział propagandy wymyślił tego człowieka. Pochodzi z Katowic, tworzy wspaniałe brutalistyczne budowle, urodził się w Barbórkę a jego dom rodzinny został zniszczony przez szkody górnicze. Dając mu wolną rękę, Łódź zmieni się nie do poznania."
BBW_belchatow_lodz_high_speed: "Kolej dużych prędkości Bełchatów-Łódź"
BBW_belchatow_lodz_high_speed_desc: "Bełchatów odwiecznie miał problem z połączeniem kolejowym z centrum województwa. A raczej jego kompletnym brakiem. Nasze dwa największe ośrodki miejskie muszą być połączone najlepszym i najszybszym węzłem kolejowym na jaki nas obecnie stać. Kojarzycie może taki przedwojenny pociąg - Luxtorpedę? Ten cud inżynierii jeździł szybciej pomiędzy miastami niż większość kursów przedupadkowych. To świadczy tylko źle o państwowych kolejach, ale my zbudujemy taką kolej wielkich prędkości że z Bełchatowa do Łodzi będziemy jechali może 40 minut maksymalnie. I to w luksusie!"
BBW_ever_closer_to_moloch: "Coraz bliżej Molocha"
BBW_ever_closer_to_moloch_desc: ""
BBW_incentives_for_businessmen: "Zachęty dla przedsiębiorców"
BBW_incentives_for_businessmen_desc: "Podstawą funkcjonującego miasta jest jego krwiobieg czyli przedsiębiorcy. Bez nich miasto to tylko kilka ściśniętych klatek hodujących ludzi którzy nie mają żadnego celu oprócz konsumpcji. W Bełchatowie i Łodzi oczywiście zawsze istniał mocny przemysł, ale nie do końca taki w który byśmy celowali obecnie. Bełchatów potrzebuje więcej zakładów w samym mieście, a Łódzka gospodarka musi być odbudowana po wielu upadkach, w tym Blackoucie który spustoszył niektóre zakłady. Ale żeby to osiągnąć, będziemy musieli jakoś zachęcić inwestorów i ludzi którzy gotowi są otworzyć nowy biznes...ja tak bardzo nie chcę...ale nie mam wyjścia. Muszę zadzwonić po Gadomskiego."
BBW_belchatow_technical_university: "Stworzenie Bełchatowskiej Akademii Techicznej"
BBW_belchatow_technical_university_desc: "Finally a university I'd be happy to send my kids that isn't rotten to the core by liberal, rainbow ideology. Close to the greatest power plant in all of Europe, probably even the world, it will be an amazing combination for the students. Both practical expertise and untainted academic knowledge in the most modern workshops! I can't wait for the first graduation ceremony..."
BBW_slash_heating_prices: "Obniżki cen ogrzewania"
BBW_slash_heating_prices_desc: "Gadomski might argue with me about this, but the budget overhead we've been left with can be put to something more useful than whatever so-called investments he wants to make. The power plants have more than enough coal to burn and if the money stays in peoples' pockets they'll get to enjoy some of that wellbeing we keep preaching. Who knows, maybe I'll get to see some more fancy cars on the streets and not the same eaten-by-rust wrecks that still remember martial law."
BBW_brotherhood_citadel: "Budowa Cytadeli Bractwa"
BBW_brotherhood_citadel_desc: "Manufaktura była kiedyś wspaniałym klejnotem łódzkiego przemysłu. Co nie znajdowało się w Fabryce Izraela Poznańskiego! Tkalnie, przędzalnia, farbiarnia, drukarnia, ślusarnia, odlewnia i parowozownia, gazownia, remiza strażacka, magazyny, budynki mieszkalne dla robotników. Istne miasto przemysłu na trzydziestu hektarach! A potem przyszedł Balcerowicz...i zrobił z tego CENTRUM HANDLOWE. Wyobrażacie sobie? Jak można pozbyć się takiego cudu na rzecz rozpasanej Sodomy późnego kapitalizmu? Po Upadku doszło do lekkiego polepszenia sytuacji bo Manufaktura stała się centrum handlu między watażkami łódzkimi. Ale teraz już tego nie potrzebujemy. Nie przywrócimy co prawda fabryki, ale nic nie stoi na przeszkodzie by wykorzystać zabudowania do stworzenia tam ogromnej Cytadeli. Pentagon się schowa przy naszej inwestycji."
BBW_police_force: "Rozbudowa sił policyjnych"
BBW_police_force_desc: "I wonder to myself sometimes when there will be enough enforcers in the world to stop crime altogether. It's easy enough to catch a murderer or fraudster, but it's the petty ones that are the most slippery. The everpresent agitators, vandals and eco-pests. They're the biggest thorn in our sides, seeming to spring up more and more as people flood into the cities.\n\nWhat other choice am I left with if not handing out a few more badges and pistols? If they won't behave, then it's going to be their own shame where they end up. Whether behind bars or in a body bag."
BBW_lamplight_in_the_smog: "Światełko pośród smogu"
BBW_lamplight_in_the_smog_desc: "Jaki piękny jest nasz Bełchatów. Smukłe kominy zanurzone w oceanie delikatnego dymu otulającego miasto niczym kocyk w zimną noc. Morze blokowisk świecących w ciemnościach jak latarnie morskie sygnalizujące że tu jest życie! Symetryczne i czyste ulice, fabryki produkujące produkty które już jutro będą napędzały po raz kolejny naszą wspaniałą gospodarkę. Ludzie wracający z pracy w zakładach gotowi na następny dzień pracy dla naszej ojczyzny. Można się rozmarzyć...a i nawet Łódź byliśmy w stanie naprawić. Ocean ruin został zastąpiony przez ogromne artystyczne budowle, komunikacja miejska i wojewódzka działa bez zarzutu, jest ciepło, jest światło. Czego chcieć więcej? Doprawdy, stworzyliśmy tutaj jedne z najpiękniejszych dzieł."
BBW_gadomski_budget: "Budżet Gadomskiego"
BBW_gadomski_budget_desc: "The recent council meeting to finalize the details of the Silesian Plan ended in a deadlock. Unexpectedly, the unanimous quorum was broken when Paladin Gadomski threw a fuss over some of the more... demanding provisions. He called it a fanatical, inhumane expression of our madness, and a definite step too far. Are we going too far? He may be a blithering fool most of the time, but I admire Gadomski's bravery. I will attempt to at least hear him out. If he manages to present a sensible proposal, he may yet have his beloved reforms."
BBW_usage_optimisation: "Optymalizacja zużycia"
BBW_usage_optimisation_desc: "Section 14 - Energy Policy, Article 4. 'Coal is a finite resource, and as such, it cannot afford to be wasted. Any usage of coal, as well as any of its by-products, will be subject to a case-by-case authorization process.' Finite resource. He dares to call black gold a finite resource. There is literally enough coal in Poland to sustain us for a hundred years, even if we use it for practically everything. And we do. But instead, he'd rather act like some sort of crony bureaucrat, judging who deserves to use it by his grace. Witold, have fun reviewing thousands of requests because some worker wants to use his coal-laced toothpaste in the morning."
BBW_lowering_tax_burden: "Obniżenie obciążeń podatkowych"
BBW_lowering_tax_burden_desc: "In a moment of personal weakness, I have signed off on Elder Gadomski's economic proposal. I have yet to read it in full, so, since I have the evening off, it would be a good time to put my pen aside, sit by the dim light of the bedside kerosene lamp, and review the policies we just instituted. Section 3 - Tax Policy. 'The burden of taxation shall be drastically lowered on both private and corporate entities in order to stimulate economic growth, and allow for eventual re-investment.' Lowered. LOWERED. We can barely afford to cover resource excavation costs, miner pensions, our industrial projects, our army, our... WHERE ARE WE SUPPOSED TO GET THE MONEY TO FUND IT ALL IF NOT THROUGH TAXES!?"
BBW_mining_optimisation: "Optymalizacja górnictwa"
BBW_mining_optimisation_desc: "Section 29 - Mining Industry, Article 1. 'The mining sector must be reorganized according to the latest industrial standards to improve effectiveness, reduce excavation costs, and ensure solvency.' Such great words, Paladin Gadomski. Your years of experience really shine through here. We await your invaluable contribution to the backbone of our industry, you, who never held a pickaxe in your entire cushy life. Go on, tell us all what YOU would do to magically fix all of our issues. I can't help but notice you've left this part of your proposal particularly vague. Now, why would that be? A printing mistake, surely."
BBW_fuel_diversification: "Dywersyfikacja źródeł paliw"
BBW_fuel_diversification_desc: "Section 14 - Energy Policy, Article 15. 'Immediate effort must be undertaken to diversify internal energy production. All new investments must prioritize renewable energy sources at a minimum 80-20% output ratio.' DID I JUST LET A DAMN WIECHOWITE WRITE THE BROTHERHOOD'S ENTIRE ECONOMIC PROGRAM!? This sounds like a direct quote from the Protocols! Renewable sources... pah. Coal IS the future. I do not want to live in a world where the Brotherhood of COAL is powered by the imaginary force of nature's magical elements like some sort of delusional eco-fascist eco-dystopia! I swear, I will order the paladins to seize this man if he comes to me with a blueprint that even mentions the word 'atom'."
BBW_free_trade: "Otwarcie na wolny handel"
BBW_free_trade_desc: "Section 18 - Trade Policy. 'Re-opening trade with the outside world would supplement the Brotherhood's budget through the sale of resource stockpiles, while filling the gaps in our domestic manufacturing through foreign imports, when necessary.' He's sly here, but I know what he really wants. He's trying to trade away all our secrets to our enemies for a quick profit. When they take advantage of our projects to build war machines powered by our coal to destroy our Brotherhood, I'm sure Gadomski will enjoy all the worthless trinkets he got in exchange. He'll have his way out. We won't."
BBW_cutting_social: "Ucięcie wydatków socjalnych"
BBW_cutting_social_desc: "Section 5 - Welfare Programs. 'The Brotherhood cannot continue funding those without either the will or the ability to support themselves. Reducing social funding will provide an incentive to seek better employment and foster financial independence.' Oh, he's in for it now. If there is one thing I want to do now, it is to give Paladin Gadomski full credit for his proposal. No help from me or the others; this is all his idea. And that is exactly what I will tell the thousands of current and former miners that will be at our throats approximately five minutes after we dare to even suggest cutting their pensions. Seriously, how else did he think this was going to end?"
BBW_anti_famine_shield: "Tarcza antygłodowa"
BBW_anti_famine_shield_desc: "Section 12 - Food Production. 'The systemic neglect and destruction of farmland threatens an impending catastrophe. Initiatives must be undertaken to begin re-cultivating the barren fields abandoned during the industrialization process.' Witold, one question. Do you really think we don't use this farmland due to some grudge we hold against crops? These lands are barren because they are a hellish, toxic wasteland. I've seen them first-hand. Nothing will grow there. Not even the strongest chemical fertilizers will make a difference. It's just a natural side-effect of an expanding industry. You need to finally grow up and accept it."
BBW_desulphurisation: "Eksperymenty z odsiarczaniem"
BBW_desulphurisation_desc: "Section 29 - Mining Industry, Article 6. 'Desulphurization treatment should be applied to all industrial gases produced in the mineral extraction process to improve air quality and reduce the harmful effects of smog.' Oh no, he's actually elaborating. Should I stop him before he embarrasses himself even further? I can already imagine him rocking up to the Bełchatów plant with his little air filters or whatever it is he wants to use. The small town boy got sick of the good old industrial air. A true Elder's lungs don't fear smog. They are powered by smog. Carbon dioxide. Carbon. Where else does he want to get it if not through constant inhalation? He wants us to suffocate; that's what's really happening."
BBW_privatisation_of_mines: "Prywatyzacja kopalni"
BBW_privatisation_of_mines_desc: "Section 29 - Mining Industry, Article 31. 'All government intervention into the mining industry is to cease with immediate effect, and ownership of mines, oil rigs, and power plants is to be transferred to private enterprises according to free market rules.' It's official. He has gone insane. There is no world in which any sensible investors would even dare to approach us with an offer. Does he realize how much we have to subsidize the mining sector to keep it afloat? Sell all the mines, watch the private owners fire all the workers, and begin shutting down operations, sit idly by as coal production decreases... congratulations, Paladin Gadomski, you have created the conditions for another Blackout. Amazing work."
BBW_economic_shock_therapy: "Ekonomiczna terapia szokowa"
BBW_economic_shock_therapy_desc: "Despite my best efforts to contain Gadomski's treacherous so-called reforms, he has, so far, somehow managed to enforce every part of his economic proposal. Almost every part. I can tell there's something brewing, and when it does happen, I want to be as far from Bełchatów as possible. The scattered reports I do get seem to suggest he'll attempt to put the entire economy through a shock therapy so severe, it will put the early 90s to shame. By the time he's done, I will barely be able to recognize my beloved Brotherhood; the Brotherhood I built from the ground up, the one that should revere me instead... It's already started slipping away..."
BBW_brotherhood_economic_miracle: "Cud gospodarczy w Bractwie"
BBW_brotherhood_economic_miracle_desc: "A new day has come, and a stronger Brotherhood is ready for the challenges it may bring. I doubted him at every step of the way, but Paladin Gadomski has truly transformed the face of our movement with the help of the all-powerful, invisible market forces. You've really done it, Witold. Yet despite all the reforming you've been doing, only 0,0001% of capitalism has been built. It's too great a task to undertake alone. You're going to have to *get organised*. \n...\n...\nWake up...\n...\nDamn it, wake up, Witold. You went off daydreaming about reforming the Brotherhood again."
BBW_silesian_committee: "Śląski Komitet Metropolitalny"
BBW_silesian_committee_desc: "Jedynym słusznym i racjonalnym wyjściem jest zagarnięcie zasobów Metropolii Górnośląsko-Zagłębiowskiej. Żadne z innych kierunków ekspansji nie jest tak bardzo opłacalne jak południe. Ogromne pokłady węgla kamiennego, mnóstwo kopalni które wymagają ratowania i nieeksploatowane złoża które czekają na dzielnych pionierów - to jest klucz do zabezpieczenia naszej przyszłości. A jeżeli będziemy odpowiednio efektywni, może i nawet odkryjemy złoża tam gdzie nikt wcześniej nie odważył się kopać."
BBW_dabrowa_basin_wing: "Wydział Zagłębia Dąbrowskiego"
BBW_dabrowa_basin_wing_desc: "Zagłębie dobywa węgiel, tu nie ma innego prawa. Tak przynajmniej kiedyś pisano o regionie Dąbrowskiego Zagłębia, którego jednym z głównych miast jest Dąbrowa Górnicza. Ale z potęgi przemysłowej i wielkiego centrum wydobywczego nieudolne rządy postkomunistów zrobiły cień tego co było kiedyś. Wielka szkoda, i żadne pocieszenie z tego że stało się to w całym kraju. Mieszkańcy tego regionu się nacierpieli dość przy transformacji ustrojowej, więc my teraz przynosimy im powrót do przeszłości. Pod Dąbrową i Sosnowcem znajdują się jedne z najgrubszych pokładów węgla NA ŚWIECIE! Są one pokaźniejsze niż te na Śląsku...więc MARNUJEMY JE stawiając tam nic nie znaczące centra usług i blokowiska. Będzie tu trzeba zrobić lekki remont. Zapewne, wiele osób będzie niezadowolonych ale jak tylko przywrócimy górniczą chwałę Zagłębiu i czarne złoto znowu przyniesie bogactwo okolicy, to ludzie nam wybaczą."
BBW_demolition_dg: "Operacje rozbiórkowe: Dąbrowa Górnicza"
BBW_demolition_dg_desc: "Nie byłem pewien co do szerokiego zakresu planowanych przesiedleń ale wyliczenia pokazują że wszystkim to wyjdzie na dobre. Szczególnie w takiej Dąbrowie Górniczej, która ma mnóstwo miejsca by pomieścić wszystkich na jej obrzeżach. Nawet nie będą musieli wyjeżdżać z miasta! Po prostu weźmiemy ich i lekko przesuniemy. A centrum trzeba będzie rozkopać. Tam stały kiedyś huty i kopalnie. Jedna huta - Bankowa, dalej stoi, ale ją też przeniesiemy. A Huta Katowice jest akurat za duża żeby ją przenosić. Ah, nie mogę się doczekać na odkrycie bogactw jakie skrywa w sobie to miasto. Bo to nie tylko węgiel kamienny, ale też wapienie, dolomity, piaski, węgiel drzewny. Wszystko czego potrzeba do uruchomienia przemysłowej maszyny! Do roboty!"
BBW_demolition_sosnowiec: "Operacje rozbiórkowe: Sosnowiec"
BBW_demolition_sosnowiec_desc: "Sosnowiec nie cieszył się dobrą opinią publiczną w ostatnich latach, ciężko powiedzieć czy to przez afery społeczne czy kretyńskie zarządzanie. Możliwe, że przez jedno i drugie. Ale to w tym momencie już nie jest ważne - co jest natomiast to to, że w granicach miasta znajdowało się kiedyś nawet do kilkunastu kopalni. W JEDNYM MIEŚCIE! Jeżeli jakiś urzędas jeden z drugim będzie mi próbował wcisnąć kit że tam już nic nie ma to własnoręcznie wyślę takich do kopalni w Sosnowcu. Tych nowych które zrobimy - na gruzach starych. Co...nie będzie łatwe biorąc pod uwagę zabudowę miasta. Ale Dąbrowa jest obok, jest pojemna - będziemy migrować! Przecież nie możemy odpuścić takiego skarbu!"
BBW_demolition_jaworzno: "Operacje rozbiórkowe: Jaworzno"
BBW_demolition_jaworzno_desc: "To na terenie Jaworzna powstała pierwsza kopalnia węgla kamiennego z prawdziwego zdarzenia. To tu rozpoczął się kolejny etap tej wspaniałej historii jaką jest polskie górnictwo. I niezbitym argumentem na to że tutaj nadal jest węgiel jest to że w Jaworznie nadal przetrwała (choć bardzo osłabiona) kopalnia węgla kamiennego Sobieski. I pomyśleć że Ci przeklęci urbaniści i ekonomiści tak bardzo zniszczyli resztę Zagłębia. Jaworzno jest przecież bardzo dobrym obrazem tego jak powinna wyglądać rzeczywistość. Wielka magistrala kolejowa! Potężna elektrownia węglowa! Kopalnia węgla kamiennego! Gdyby tylko nie pozamykano innych szybów i resztek przemysłu lekkiego to można by pomyśleć że od Jaworzna można się uczyć sztuki przemysłu. A tak, to musimy troszkę tutaj ponaprawiać."
BBW_deploy_peacekeepers: "Rozmieszczenie sił pokojowych"
BBW_deploy_peacekeepers_desc: "Spodziewałem się tego. Nastroje w miastach Zagłębia mówiąc oględnie - nie są kolorowe. Ale my kolorów nie potrzebujemy, dym jest szary, para biała a węgiel czarny. I tyle nam wystarczy. Nie dziwie się ludziom że nie są w stanie poświęcić się dla naszej wizji, wszak wmawiano im przez ponad 30 lat że to co robili tutaj było złe, kopalnie były złe i w ogóle cały przemysł jest zły. I to programowanie zrobiło z nich niewolników systemu, wyhodowali sobie idealnych nowoczesnych homo lemingus. Musimy podwoić tutaj liczbę służb bezpieczeństwa, nie możemy pozwolić na powtórkę z Bełchatowa. Nie gdy pod nogami spoczywa takie bogactwo. Po kilku ostrych akcjach policyjnych odechce im się wojowania, a potem jak już skończymy przebudowę - zobaczą jak bardzo się mylili."
BBW_high_density_housing: "Ultra gęsta zabudowa mieszkaniowa"
BBW_high_density_housing_desc: "Proces przesiedlenia okazuje się nie iść tak łatwo jak w zakładanych projekcjach Warzechy. Ale i na to człowiek zdrowego rozsądku rozwiązanie znajdzie, bo po to ma się rozum żeby przezwyciężać problemy a nie sobie je stwarzać. W sumie...to nie doprecyzowałem tego stwierdzenia. Proces przesiedleń idzie tak po prawdzie ZBYT DOBRZE, i przez to rodzą się problemy. Bo nie za bardzo mamy gdzie ich wszystkich...upychać. Chów klatkowy Polaka w wielkich miastach był co prawda jedną z patologii kapitalizmu liberalnych elit, ale my to zrobimy porządnie. Megabloki staną się wielkimi przestrzeniami mieszkalnymi z kwitnącym biznesem wewnętrznym, życiem kulturalnym i wieloma innymi atrakcjami. Takie małe miasto w jednym bloku. Tam gdzie wszystko masz na wyciągnięcie ręki! Tak, że maksymalnie to piętnaście minut i dojdziesz wszędzie...gdzie musisz...zaraz...ugh...chyba będziemy musieli inaczej nazwać tę koncepcję."
BBW_supersize_przyjazn: "Rozbudowa Koksowni Przyjaźń"
BBW_supersize_przyjazn_desc: "Nie dość że mają największą hutę w Polsce, to jeszcze w Dąbrowie jest druga największa koksownia w kraju. Ale jako że ta największa leży na opolskim odludziu, a ta jest idealnie usytuowana na obrzeżach wielkiego centrum przemysłowego, to warto będzie sprawić żeby z drugiego miejsca awansowała na pierwsze. A jak wiemy, koks też jest ważnym elementem naszego “mixu energetycznego”, w końcu też pochodzi z węgla i bardzo przyda się znajdującej się obok Hucie Katowice. Wzmacniając przemysł zagłębiowski wzmacniamy mieszkańców tych miast. Nie ma co się martwić o podwojone emisje, to wszystko to wymysł propagandy, gdyby było inaczej to ludzie by nie mieszkali w Strzemieszycach koło koksowni w ogóle! A jakoś żyją. I będą żyli."
BBW_relocate_industry_to_cop: "Relokacja przemysłu do NCOP"
BBW_relocate_industry_to_cop_desc: "W Zagłębiu znajduje się tyle różnorakich przedsiębiorstw przemysłowych że głowa mała. Przy naszych ekstensywnych pracach w poszukiwaniu złóż wielką szkodą byłoby zniszczenie produkcji która w tych zakładach kwitnie. Na szczęście, dzięki naszym najlepszym ekonomistom - mamy dla nich miejsce. Nowy Centralny Okręg Przemysłowy! Tam wszystkie troski zarówno pracowników jak i pracodawców znikną, będą otoczeni najlepszymi fachowcami i zapewnione im będą wszystkie możliwe udogodnienia, wraz z refundacją przenosin. Kompleksowa obsługa migracji i gwarantowana satysfakcja! Przynajmniej tak mówią nasi oficjele. Ja się z tym zgadzam, ale tak po prawdzie...to nie jest oferta którą mogą odrzucić. Jak się sami nie przeniosą - to my ich przeniesiemy, ale z małym kruczkiem prawnym który nazywa się nacjonalizacja."
BBW_shoring_up_power_plants: "Wzmacnianie elektrowni"
BBW_shoring_up_power_plants_desc: "Kopiemy głęboko i chciwie. Musimy tak robić, żeby dorwać największe zdobycze jakie kryje ta ziemia. Jednak jak bardzo byśmy nie chcieli uniknąć komplikacji - są one naturalne przy tak szeroko zakrojonej akcji wydobywczej. A mianowicie to, że na górze troszkę zacznie się wszystko gibać. Ostatnie czego byśmy chcieli to zapadlisk, szczególnie na terenach przemysłowych które potrzebują stabilności. Szczególnie wrażliwymi punktami są Łagisza i Jaworzno. Chodzi oczywiście o elektrownie, nie o zabudowania. Musimy wzmocnić fundamenty tych elektrowni, tak żeby były odporne na największe możliwe tąpnięcia i były niewrażliwe na jakiekolwiek osunięcia ziemi. Nie chcemy przecież dopuścić do tragedii jaką byłby lokalny blackout, prawda? Będzie to dość precyzyjna i kosztowna robota, ale na pewno nie niemożliwa! W końcu w Japonii budują elektrownie na terenach narażonych na gigantyczne trzęsienia i tsunami! Więc raczej poradzimy sobie z lekkim zagrożeniem jakie prezentuje ta ziemia."
BBW_expand_slawkow_terminal: "Rozbudowa Euroterminalu Sławkowskiego"
BBW_expand_slawkow_terminal_desc: "Sławków jest praktycznie nic nie znaczącą kropką na mapie Zagłębia Dąbrowskiego. Tak jest, gdyż kiedyś posiadało znaczne złoża srebra i ołowiu. Tych jednak już tutaj mimo wszystko nie uświadczymy gdziekolwiek byśmy nie kopali. Dlatego samo miasto jest dla nas bez większego znaczenia. Lecz w granicach Sławkowa, mimo że poza obszarem zabudowanym - leży coś znacznie bardziej cennego. Euroterminal Sławków. Pomijam już tę okropną nazwę (będziemy musieli coś z nią zrobić, serio - wszędzie ta eurofederalna propaganda się wpieprzy...), ale jest to gigantyczny hub zaopatrzeniowy z ogromną magistralą kolejową i połączeniami z najważniejszymi zakładami w okolicy. Jako że my nasze operacje przemysłowe w regionie rozszerzamy drastycznie, również i terminal w Sławkowie będziemy potrzebowali rozbudować. Drastycznie."
BBW_repurpose_pogoria: "Rozkopanie Pustyni Błędowskiej"
BBW_repurpose_pogoria_desc: "Pustynia Błędowska. Jedyna pustynia w tej części Europy. Absolutnie bezużyteczna kupa piachu. Ale czy na pewno? Ostatnie raporty które dostałem mówią mi że nie do końca tak musi być. Na pustyni znajdują się gigantyczne pokłady piasku (a jakże) podsadzkowego. Kiedyś używano go do wypełniania pustek poeksploatacyjnych w kopalniach, teraz gdy masowo otwieramy nowe kopalnie - znowu może pełnić tę rolę. A co sprawia że piasek staje się podsadzkowy? Odległość złoża do najbliższej kopalni bo liczy się tutaj efektywność logistyczna. A tak się składa że największe w Polsce złoże piachu jest bardzo, bardzo blisko ogromnych centrów wydobywczych. Prawda, że cudownie się składa? Nikt nie będzie płakał za wydmami! A tak, na coś się w końcu ta pustynia przyda. Kto wie, może znajdziemy tam coś jeszcze"
BBW_huta_huta_huta_huta: "Centrum Dowodzenia Huta Katowice"
BBW_huta_huta_huta_huta_desc: "Huta Katowice. Ukoronowanie rozbudowy Zagłębia Dąbrowskiego przez komunistów. Co jak co, ale przynajmniej wtedy potrafili budować ważne i potrzebne rzeczy. A potem przyszło zło postkomunizmu. A wszyscy wiemy że zło nie jest w stanie stworzyć niczego nowego, jest w stanie tylko psuć i niszczyć to co siły dobra stworzyły lub wymyśliły. Na szczęście, nie zniszczyli jeszcze tego wspaniałego stalowego giganta. Oh, ależ jak oni próbowali! Ostatecznie nawet postanowili wyprzedać hutę hindusom za bezcen. Ale wszystko wraca teraz do korzeni, i my zrobimy z tej huty wspaniałe Centrum Dowodzenia Przemysłu Zagłębia. Co prawda będziemy musieli usunąć stąd te pozostałe komunistyczne banery...ponad 40 lat po upadku PZPR a Ci ludzie dalej się nie zorientowali że to już przeszłość..."
BBW_basin_restored: "Zagłębie odnowione"
BBW_basin_restored_desc: "Jak za dotknięciem czarodziejskiej różdżki, Zagłębie Dąbrowskie podniosło się z letargu i znowu stanowi bijące przemysłowe serce regionu. Odnowiliśmy oblicze tej ziemi, i teraz możemy słać węgiel na zachód i wschód. Przemieniać czarną potęgę na bogactwo i oddać mieszkańcom w ogromnym przemyśle ich trudy który musieli znieść podczas gdy my tutaj rozkopywaliśmy im miasto. Już niedługo, już za chwilę - zobaczą że to było tego warte. Wszystkie zębatki tej gigantycznej maszyny zaczęły się zazębiać i dym który unosi się teraz nad Dąbrową, Sosnowcem i Jaworznem dowodzi tego, że osiągnęliśmy sukces. Po raz kolejny z resztą. I to nie jest nasze ostatnie słowo."
BBW_upper_silesia_wing: "Wydział Górnego Śląska"
BBW_upper_silesia_wing_desc: "Nie ma Górnego Śląska bez węgla. Te dwa podmioty stały się nierozrywalną jednością zakorzenioną głęboko w tradycji tego regionu. To właśnie węgiel kamienny dał Śląskowi bogactwo, pozwolił na rozwój przemysłu oraz sprowadził tu mnóstwo ludzi poszukujących lepszego życia. To była prawdziwa ziemia obiecana która do tej pory opierając się na kopalniach i elektrowniach jest pulsującym sercem tego kraju. Niestety obecnie śląskie górnictwo jest w opłakanym stanie, i musimy mocno tutaj posprzątać jeśli liczymy na to że ten region przyniesie nam zysk w czarnym złocie."
BBW_demolition_rybnik: "Operacje rozbiórkowe: Płaskowyż Rybnicki"
BBW_demolition_rybnik_desc: "W aglomeracji rybnicko-jastrzębskiej nadal jest mnóstwo prężnie działających kopalni którym trzeba tylko pomóc organizacyjnie. Ale pod ziemią jest ogromny zasób który możemy kopać przez następny wiek! To tam musimy przeprowadzić radykalne zmiany w strukturze urbanizacyjnej jeżeli chcemy dotrzeć do najgłębiej położonych złóż. Radlin, Żory, Rybnik, Jastrzębie-Zdrój -  to wszystko są ośrodki górnicze najwyższej klasy, i grzechem byłoby z nich zrezygnować."
BBW_demolition_katowice: "Operacje rozbiórkowe: Wyżyna Katowicka"
BBW_demolition_katowice_desc: "Najbardziej zurbanizowana część metropolii będzie twardym orzechem do zgryzienia. Władzom ciężko było tutaj cokolwiek budować a co dopiero przeprowadzać wielkie wykopaliska. To będzie zdecydowanie najtrudniejsze logistyczne przedsięwzięcie całego planu. Rozbiórka konkretnych terenów musi zostać przeprowadzona bardzo szybko, a ludzi będzie trzeba gdzieś przesiedlić. Centrum Katowic możliwe że obejdzie się bez radykalnych zmian, a przynajmniej głupio byłoby rozwalić Spodek..."
BBW_demolition_pszczyna: "Operacje rozbiórkowe: Równina Pszczyńska"
BBW_demolition_pszczyna_desc: "Południowe rejony metropolii nie są terenami tak bardzo mocno zagospodarowanymi przemysłowo jak możnaby się tego spodziewać. Nie ma tam też tak ogromnej gęstości zaludnienia jak bardziej na północ. Przez co ewentualne wykopaliska mogą być przeprowadzone tam na wielką skalę bez większych ubytków w ludności. A badania wskazują że bynajmniej jest to teren z mniejszą ilością złóż. A te nieliczne kopalnie które tam są...musimy im pokazać jak to się robi."
BBW_strengthening_silesian_chapter: "Wzmacnianie Śląskiego Bractwa"
BBW_strengthening_silesian_chapter_desc: "Na Śląsku, jako krainie węglem płynącą nie mogło zabraknąć naszej obecności. Przed wojnami wojewódzkimi rolę tę pełniło Śląska Kapituła Bractwa Węgla które pod przewodnictwem paladyna Rafała Wosia trzymało pieczę nad tym regionem, aczkolwiek byli oni mocno zdominowani przez Jastrzębską Spółkę Węglową oraz lokalny oddział Solidarności. Woś jest...specyficzny, i nie przepadam za jego mocno lewicowymi odchyłami, ale oddania węglowej sprawie nie mogę mu odebrać. Jako że nasze możliwości administracyjne są zasobem który w przeciwieństwie do węgla może się skończyć - może lepiej będzie odnowić Śląskie Bractwo Węgla jako administratorów tych ziem w naszym imieniu."
BBW_bureaucratic_giants: "Biurokratyczni giganci z Katowic"
BBW_bureaucratic_giants_desc: "Katowice są nadal gigantem jeśli chodzi o Górny Śląsk, a transformacja przekształciła ich ze stricte przemysłowego miasta w ośrodek usług oraz nowych technologii. Ta ekstensywna i skrupulatna biurokracja w której to znajdziemy również i ekspertów dotyczących energetyki i górnictwa, będzie bardzo przydatna. Każda tona węgla wydobytego w tym regionie musi zostać przeliczona co do bryłki. Nie możemy sobie pozwolić na ubytki w zasobach, a kontrola nad tym gigantycznym przedsięwzięciem nie może polegać na urzędnikach którzy nie mają pojęcia co robią. Potrzebujemy profesjonalistów."
BBW_prospecting_in_south: "Poszukiwania na południu"
BBW_prospecting_in_south_desc: "Zgodnie z planem rozpoczęliśmy rozwijanie przemysłu górniczego na południu, gdzie jest wiele lasów a niewiele rozsądku. Jak można było tu nic nie robić przez tyle lat...Kobiór, Miedźna, Wola, Pszczyna, Wyry. Każda z tych miejscowości zostanie przekształcona w centrum wydobycia i zintegrowana z wojewódzką siecią logistyczną. Jak zaczniemy tu kopać głęboko to okaże się że tam są tak niespotykane pokłady węgla że zredefiniujemy całą gospodarkę Górnego Śląska na nowo. Mówię wam, tam znajdziemy świętego Graala naszego górnictwa. A potem każdy będzie przepraszał mnie i mówił że miałem rację. Oczywiście że miałem. Przecież to od razu na chłopski rozum widać że tam musi coś być."
BBW_restart_the_plants: "Ponownie uruchamianie elektrowni"
BBW_restart_the_plants_desc: "Nie raz pisałem o barbarzyństwie neokapitalistycznych łupieżców żerujących na zdrowym organizmie przemysłowym Polski. Ich ofiarami padało wszystko; stocznie, huty, kopalnie, zakłady zbrojeniowe, przemysł ciężki, lekki, no i również niestety elektrownie. Tak było w Bytomiu, i tak było w Pszowie. Co gorsza, kpiąc z nas wszystkich te zakłady nie zostały totalnie zniszczone - tylko stoją puste i ciemne, groźnie patrząc na okolice. Najbardziej oczywiście ucierpieli na tym mieszkańcy tych miast i pracownicy którzy znajdowali zatrudnienie tam. Musimy naprawić ten afront i przywrócić te dwie potężne elektrownie do stanu idealnego. Będziemy potrzebowali każdego megawata..."
BBW_automatization_experts: "Eksperymenty z automatyzacją"
BBW_automatization_experts_desc: "Sztuczna inteligencja jest tematem bardzo kontrowersyjnym, ale ja totalnie nie rozumiem problemów jakie ludzie tworzą sobie sami. Czy młotek może być szkodliwy? No może, ale to tylko w zależności czy użyjesz go do wbicia gwoździa czy rozwalenia komuś głowy. I tak samo jest z AI. Profesjonaliści będą w stanie wykorzystać to narzędzie do ułatwienia procesów i poprawienia komfortu życia. Kretyni będą generować hedonistyczne obrazki. Jako że my nie jesteśmy tacy sami jak ta banda idiotów która doprowadziła do Upadku, to my mamy szansę wykorzystać technologię nad którą pracowały laboratoria w Katowicach do stworzenia naprawdę wyjątkowych cudów."
BBW_model_city_tychy: "Modelowe miasto - Tychy"
BBW_model_city_tychy_desc: "Tychy zostały wytypowane na miasto które uniknie całkowitej rozbiórki celem pogłębienia naszych operacji eksploatacyjnych. Dlaczego? Nie damy rady wszystkich przesiedlić do Łodzi i Bełchatowa, a tutaj po prostu będzie taniej. Po drugie, tak - w Tychach też są złoża węgla i będziemy tam kopać, ale na mniejszą skalę, bo tylko niewielka część miasta leży bezpośrednio na pokładach tego surowca. Dodatkowo będzie to idealna okazja by przetestować nasz nowy model planowania urbanizacyjnego - przekształcanie miast na modelowe przykłady centrum przemysłowo-górniczego. Tylko będziemy musieli wybudować sporo nowych mieszkań..."
BBW_PIWO: "Wywary Starszego"
BBW_PIWO_desc: "Jak człowiek kończy ciężką szychtę, to co robi? Ano, ma ochotę na piwo i idzie do baru. A tam bieda aż piszczy, wódka droga, piwo to jakieś resztki a to co jest produkowane prowizoryczne w ledwo działających browarach nie nadaje się nawet do wylania do zlewu w obawie przed tym że przeżre rury. Browary Książęce w Tychach przestały praktycznie funkcjonować...nie wspominając o innych lokalnych piwowarniach. Jest to poważny problem bo to jest nieodzowna część kultury męskiej. O tą musimy dbać więc musimy stworzyć nowy konglomerat browarniczy, który będzie w stanie produkować piwo ciemne jak węgiel i jasne jak płomień pieca. Zawsze chciałem mieć swój własny trunek..."
BBW_silesian_coal_company: "Śląska Spółka Weglowa"
BBW_silesian_coal_company_desc: "Przemysł wydobywczy w przedupadkowej Polsce był podzielony pomiędzy kilka dużych przedsiębiorstw. Jednym z nich była Jastrzębska Spółka Węglowa, która pomimo tego że była w dość opłakanym stanie to udało jej się zachować wpływy w najważniejszych kopalniach regionu i nawet przez chwilę dominowała nad Śląskim oddziałem Bractwa Węgla. Nie wątpię, ludzie związani z JSW się nam przydadzą i sama spółka powinna zostać odrodzona. Ale tym razem to oni będą pod kontrolą Śląskiego Bractwa Węgla, a to głównie po to by zagwarantować interesy Bractwa jako całości a nie by napełniać portfele prezesów spółek."
BBW_silesian_minority_status: "Uznanie statusu mniejszości śląskiej"
BBW_silesian_minority_status_desc: "Ślązacy to ludzie węgla i kilofa. Złośliwi by stwierdzili że nie pochodzą z łon swoich matek lecz rodzą się z kamienia. No, i mówią śmieszną gwarą. Znaczy, uważają że to język. Może i tak, ale chcąc nie chcąc - jest to grupa społeczna do której nam bardzo blisko bo mamy wspólne zainteresowania i tradycje. Plus...będziemy potrzebowali ich mocno po naszej stronie, wszak przychodzimy do ich domów i trochę rozwalamy tę okolicę. Oczywiście jest to dla ich dobra, ale póki co tego nie zobaczą. Dlatego uznanie mniejszości śląskiej jako autonomicznego tworu w naszym państwie będzie gestem może i symbolicznym, ale potrzebnym do uspokojenia nastrojów..."
BBW_adaptation_of_railways: "Adaptacja kolei"
BBW_adaptation_of_railways_desc: "Przez to, że na Śląsku praktycznie nie zostaje żaden skrawek nie rozkopanej ziemii, musimy przystosować do tego nasz transport. Ciężko jest manewrować pomiędzy takimi labiryntami jakie powstały przez nasze operacje, przez co sensownym wyjściem wydaje się mogłoby być postawienie kolei na gigantycznych podporach...wyobraźcie sobie tylko, ogromny czarny parowóz sunący przez pustkowie setki metrów nad ziemią przecinający mgłę niczym ostrze, by dowieźć surowce do celu. Wspaniała wizja. Ewentualnie zrobimy też koleje podwieszane, byle były wysoko i nie przeszkadzały w wydobyciu. No i...żeby były odporne na tąpnięcia bo samolotów z nich nie zrobimy."
BBW_evacuating_metalworks: "Ewakuowanie hut"
BBW_evacuating_metalworks_desc: "Prowadzenie produkcji w hutach często współgra z eksploatacją górniczą w pobliżu. I generalnie byłoby wszystko fajnie gdyby nie skala z jaką przeprowadzamy tutaj nasze prace. I wychodzi nam na to że nie bardzo mamy miejsce na pozostawienie hut. Na szczęście, nasz nowo wybudowany Nowy Centralny Okręg Przemysłowy ma aż nadto miejsca by przyjąć śląskie huty na swoje przestronne łono. Trochę nam zajmie samo wywiezienie wszystkich potrzebnych maszyn i konstrukcji, ale tam będą bezpieczne i skonsolidowane z ogromną siecią jaką jest NCOP. "
BBW_grey_clouds_and_steam: "Szare chmury i para"
BBW_grey_clouds_and_steam_desc: "Było to solidne trzęsienie ziemi, ale z ruin postkapitalistycznego Śląska wyłoniło się...no, nie wyłoniło się bo jest przykryte chmurami i smogiem...ale to dobrze! To znaczy że region ożył i zaczął funkcjonować jak na centrum przemysłu i górnictwa przystało! Bo do tej pory Górny Śląsk był pogrążony w letargu i rozkroku pomiędzy wymuszoną przez ekofaszystów transformacją energetyczną a wydobyciem które nie pokrywało żadnych zapotrzebowań. Teraz jest wszystko jasne i możemy z czystym sumieniem powiedzieć: Cała naprzód!"
BBW_tried_and_tested_method: "Sprawdzone metody"
BBW_tried_and_tested_method_desc: "Zagłębie Dąbrowskie oraz Górny Śląsk przeszły całkowitą transformację. Znaczy to może niezbyt dobre określenie, w końcu nie zmieniliśmy aż tak radykalnie przeznaczenia tych regionów. Wręcz można powiedzieć lepiej - wróciły do korzeni. Potęga przemysłowa jaką tutaj odnowiliśmy będzie zasilać nasze Bractwo do końca świata i jeden dzień dłużej. A doświadczenie które tutaj zdobyliśmy na temat tego jak radzić sobie z planami eksploatacyjnymi przydadzą nam się na dłuższą metę. W końcu to nie jest jedyne miejsce gdzie surowce leżą i czekają na swoich odkrywców. Poznań. Wałbrzych. Legnica. Lublin. Oj będzie co robić gdy już tam dotrzemy."
BBW_elder_files: "Ujawnienie Listy Starszego"
BBW_elder_files_desc: "What is that? It's a preposterous slander! Some low-ranking knight decided to play a whistle-blower and released files that were supposed to condemn me. All lies, of course. They accuse me of unjustified executions of signalists, who were concerned about the state of the Brotherhood. Signalists, pah. Traitors. All of them. They also claim that I am a crypto-Wiechite, citing nothing but an old photo of us from the conference! It's a forgery. Not that it didn't happen, but I had them all destroyed as it was out of context! And worst of all - I am now to blame for the death of Head Paladin Sommer! I'll get to whoever decided to throw my good name into the mud."
BBW_induction_of_willing: "Introdukcja chętnych"
BBW_induction_of_willing_desc: "Looks like Janecki decided to crawl out of his hollow and integrate himself with the wider milieu of the Brotherhood's ruling class. Good. That finally makes him predictable. As of now, he's been playing both sides against themselves, causing me a massive headache when determining his next moves. Right now, he seems to favor the reformists - especially Roksana Węgiel, Zychowicz, Bartosiak, and Woś. Judging by the energy he puts into meeting with her and the decreasing amount of his contact with the hardliners, I think this ideological shift of his will be permanent. As much as you can call Janecki permanent in anything."
BBW_bureaucratic_mishaps: "Wpadki biurokratyczne"
BBW_bureaucratic_mishaps_desc: "Lacking tax reports, failed population indexes, incomplete state assets inventory. Gadomski's people were supposed to be those cold, unideological technocratic specialists. And now the High Paladin responsible for the economy shows me a report on how shoddy their work has been recently. We can't properly plan our investment and our budget with such corrupted data. Gadomski promised to investigate the situation further and take proper consequences for the perpetrators. I fucking hope he has some competent replacement for them. He'd better pray that such situations won't happen in the future."
BBW_empty_fuel_reserves: "Opróżnianie wojskowych baz paliw"
BBW_empty_fuel_reserves_desc: "I noticed that Zychowicz and Bartosiak decided to relocate a vast amount of fuel destined for the military. When I asked them about their activity, they informed me that they wanted to make sure that fuel is not concentrated in one area that would be susceptible to bombing, which could easily cripple our war effort. They argue that more dispersed reserves would better secure them from bombing raids, as well as be more available to the units in the field, making a resupply much faster. Rzymkowski chimed in, saying the whole process makes his army vulnerable due to fuel shortage, but the duo insists they will be done with the operation while we're still at peace."
BBW_weather_forecast: "Prognoza pogody"
BBW_weather_forecast_desc: "Cloudy with a 50% chance of collapse. Somehow, everything stopped working. People are riled up because of the publication of the so-called Elder Files. Maybe they are to blame for the recent problems, but something tells me that this can't be the whole story. The sabotage, the stealing of workplace items of value, the money shortage... It seems too organized and the perpetrators too elusive. It has to be an organized operation, but who's responsible? My inner circle points towards ministers who belong to the hard-line wing, but in turn, they point out that the problems started once Janecki started his camaraderie with the reformists."
BBW_random_security_checkup: "Losowa kontrola zabezpieczeń"
BBW_random_security_checkup_desc: "Warzecha reported that someone tried to hack his comPAN to extract files condemning me, such as an old photo of me next to Jakub Wiech. A photo that I ordered to be redacted completely. When asked about it, Warzecha said something something about 'archivical duties'. He tried to calm me that the hacker's attack was unsuccessful and that he would redouble his efforts in maintaining security, starting with random, unannounced check-ups to keep everyone on their toes to catch the conspirators. I told him to cancel all of the other files he keeps as an 'archivist' to prevent any potential leaks. Idiot."
BBW_loyalty_of_armed: "Lojalność sektorów siłowych"
BBW_loyalty_of_armed_desc: "I have one friend: The army. Everyone else is fickle and wavering like live spurce that was left on the field, all other trees cut down and committed to productive use. I fall asleep through trust in them. Without them, I have nothing in this trial. And that's all right: I shaped our Paladins to absorb nothing and balk before nothing. Nothing shall break them. Least of all having to discipline the traitors with appropriate severity."
BBW_delegations_for_trusted: "Delegacje dla zaufanych"
BBW_delegations_for_trusted_desc: "I must play a police chief again, and my men must play W11 detectives. W11 rarely lets an investigation drag on for over a week: at least in the show. Reality may not be as clean, but I can't afford anything less. My delegations will be sent wheresoever dissent and sabotage broods: And will have full authority to be the judge, jury, beat cop, prosecutor and of course, executioner in any case that falls to their hands. We'll have to naturally select from loyal Paladins, and not everyone will be the W11 material: But we won't televise their work, so who cares?"
BBW_vacations_for_veterans: "Wakacje dla weteranów"
BBW_vacations_for_veterans_desc: "I could not sleep again. I know I'm right. I know anyone whose mind is right agrees. But even the loyal might be shackled by fear or, greed. That's humanity, not even vice. My troops have families, they got to eat, we haven't yet finished elevating their standard of living. What better reward to the army than quality time with their families? This might be the crisis, but it's one requiring rested, collected heads: This is how I keep my Order fit for weathering it."
BBW_ace_in_the_hole: "As w rękawie"
BBW_ace_in_the_hole_desc: "That son of a! And that bitch Janecki! I know he's scheming something. Something! And yet, his proof is sound. Gadomski, whoreson seed, after getting sidelined (or was it snubbed by me? I forgot) after his decadent LIBERAL proposals regarding GZM, decided to carry forward his banner of selling out Brotherhood to the highest bidder by conspiring against me! If I get him, I'm gonna chop off his limbs and pyrolyze them myself! Traitor.... w-w-w, whoore!"
BBW_coal_liquefaction: "Eksperymenty z upłynnianiem węgla"
BBW_coal_liquefaction_desc: "Coal reserves of the planet, legacy of Carboniferous era, are practically infinite. Yet humankind's technology just had to focus on a rarer and punchier cousin of coal: Oil, from which petrol and diesel are derived. In place of sound and solid coal burners, combustion engine is the main technology for motion now. Biggest problem of post-Fall Poland was thus securing fuel. But one can reduce coal into oil. It's a woefully underexplored technology, due to saturation of global economy with cheap black gold. But we have all the reason to take the coal we have, and develop new ways to turn it into petrol, diesel, LPG if that's even possible."
BBW_spring_cleaning: "Wiosenne porządki"
BBW_spring_cleaning_desc: "Hope is not yet lost. While now the treacherous whore enjoys the vestiges of usurped power, I have worked tirelessly to secure my position so that I will not be degraded so easily. There are still lower officers who will fight for me. True patriots, whose worldview I shaped by myself. They just need to organize under one leader and launch a counter coup. Roksansa's position is too unstable to remain in power. A little push, once the true Brothers of Coal rally after the surprise of the attack, and the order will be restored and the rebels - punished."
BBW_black_ranks: "Czarne Szeregi"
BBW_black_ranks_desc: "Zdradzieckie szuje upodobały sobie naszą krystalicznie czystą organizację Karbonariuszy jako pole do szerzenia swoich plugawych reakcyjnych poglądów. Wszak młodzież najprościej skorumpować, najprościej było im zasiać ziarno wątpliwości które przerodziło się w nieuzasadnioną niczym falę nienawiści do Rady. A potem nadeszły zdradzieckie czyny. I to z samego środka! Tak długo walczyliśmy z wiechowcami że nie zauważyliśmy jak w przyszłości naszego narodu rośnie okropna, chora narośl. Musimy ją wyciąć i wypalić do cna, zanim reszta młodzieży zdąży nią nasiąknąć. Jest jeszcze trochę prawdziwych i lojalnych Karbonariuszy. Tych należy awansować. Sprawdzą się doskonale w naszej nowej formacji - Czarnych Szeregach. Będą one egzaltacją najwyższych wartości Bractwa, domem dla najwierniejszych synów postępu. I oni - już nas nie zawiodą. Bo ich honorem - jest być wiernym. Kurczę, to brzmi jak dobre hasło..."
BBW_state_of_emergency: "Oficjalne wprowadzenie stanu wyjątkowego"
BBW_state_of_emergency_desc: "Bardzo długo wzbranialiśmy się od gry w otwarte karty z wywrotowcami, ale ostatnie działania przybiły nas do muru. W celu ratowania naszego Bractwa i wszystkich osiągnięć naszego systemu, jesteśmy zmuszeni do wprowadzenia stanu wyjątkowego we wszystkich regionach naszego państwa w celu zapewnienia ciągłości państwowej i bezpieczeństwa obywateli. Atak dokonany na najwyższe władze Rady pozostawił wiele blizn, które prędką się nie zagoją ale możecie być pewni - moja wola nigdy nie była silniejsza! Czy ta deklaracja coś zmienia? Tylko oficjalnie - wszak nasze służby i wojsko od czasu próby przewrotu są w ciągłym pogotowiu. Społeczeństwo mogło się domyślać, ale niewiele wiedzieli. Czas żeby przejrzeli na oczy."
BBW_traitor_shopping_list: "Lista zdrajców"
BBW_traitor_shopping_list_desc: "Warzecha wręczył mi dzisiaj listę. Znajdują się na niej nazwiska które łamią mi serce. Niektórych się nie spodziewałem. Niektóre są oczywiste. Gadomski - jasne, zawsze był ślepym liberałem. Zychowicz i Bartosiak - oczywiście, banda idealistycznych oportunistów. Wszyscy inni tak, tak, tak! Ale Roksana...miała być naszą przyszłością. To jest prawie pewne że została otumaniona przez tego diabła Gadomskiego, nie może być inaczej! Jak ktoś o takim nazwisku może sprzeniewierzyć swój predestynowany cel? Łukasz niestety ma rację, przy próbie zamachu stanu nie możemy być litościwi, nawet dla naszych najlepiej rokujących braci i sióstr. Niech będą przeklęci wszyscy rewizjoniści! A, i wezwijcie Zgierskiego!"
BBW_come_at_me_bro: "Dawaj na ring, Bracie"
BBW_come_at_me_bro_desc: "Byłeś moim bratem przy kuźni Rafał! Nawet mamy takie samo imię! Mieliśmy takie same ideały, więc gdzie nastąpił ten moment w którym przestaliśmy się rozumieć? Jasne, Woś zawsze był bardziej lewoskrętny niż przewidywała ustawa ale zgadzaliśmy się w najważniejszym - maszyna musi iść a węgiel musi być! Więc gdy słyszę że Woś uciekł na Śląsk i zamknął granice z nami odmawiając jakiegokolwiek kontaktu...to najgorsza ze wszystkich zdrad. I jeszcze kpi sobie z nas! Z całej Rady i całego systemu! Powiem Ci jedno Rafał - współtworzyłeś go. I na własnej skórze odczujesz jego moc. Twoi Czerwoni Paladyni nie obronią Cię przed naszym gniewem...pozostanie tylko popiół."
BBW_last_embers: "Ostatnie iskry oporu"
BBW_last_embers_desc: "Nie wierzę w to. Nie chcę w to uwierzyć. NIE ZAMIERZAM W TO UWIERZYĆ. JAKUB WIECH NIE ŻYJE, I NIKT MI NIE WMÓWI INACZEJ. PRZECIEŻ GO ZNISZCZYLIŚMY, TA CAŁA PIEPRZONA ATOMOWA KRUCJATA ZOSTAŁA ROZNIESIONA W PROCH. To musi być jakiś impersonator, podstawiony sobowtór, reakcyjna propaganda. Nie, nie widziałem nigdy jego ciała, ale to nie znaczy...to...NIC SIĘ NIE DZIEJE NA BAŁUTACH. Macie urojenia, nie widzieliście Jakuba Wiecha bo go tam nie ma. Tam nie da się przeżyć tak w ogóle. Nie istnieje taka siła na tym świecie która by sprawiła że uwierzę w to kłamstwo, w tą insynuację, w tą...plotkę. To kłamstwo rozpowszechniane przez jego wyznawców którzy chcą deifikować tę podłą kreaturę na bożka ekologii! A przecież bardziej na rękę im byłoby mieć męczennika. To co, Saddam Hussein też gdzieś żyje? Razem z Bin Ladenem i Jakubem Wiechem grają sobie w bierki na Bałutach? A może tam jest święty Graal i bursztynowa komnata? Darujcie sobie te kretyńskie...że jakie zdjęcia?\n\nKurwa, no nie. No po prostu KURWSXCMCVGNTYfdasghh@@@@1111111"
BBW_cutting_corporations: "Odcięcie korporacji"
BBW_cutting_corporations_desc: "Zbyt długo tolerowaliśmy istnienie innych korporacji. JSW, KGHM, Stołeczna Ropa. To wszystko pijawki które wysysają energię z dzieł stworzenia naszego Bractwa. Pankreacyjna tożsamość węgla nie dzieli ludzi, wręcz przeciwnie - ale to imperatywem naszego zakonu jest kontrola nad technologią energetyczną. My nie jesteśmy panami węgla, jesteśmy jedynie jego naczyniami, przepływa przez nas i jesteśmy jego wolą. I żadna z korporacji nie ma prawa sobie rościć żądań do tego surowca. Żadna. Bo żadna się nie ostanie. Nie potrzebujemy waszych żałosnych przedsiębiorstw, nie potrzebujemy waszego wsparcia. Dołączycie do nas, albo dołączycie do wszystkich którzy nam się przeciwstawili."
BBW_winds_from_the_east: "Wiatry ze wschodu"
BBW_winds_from_the_east_desc: "Upadek rozpoczął się inwazją ukraińską, i teraz, kilkanaście lat po tych tragicznych wydarzeniach znowu stoimy przed groźbą ukraińskiego najazdu. Rezuni, banderowcy, zdrajcy stanu, wiechowcy. Wszyscy lgną na Ukrainę jak mucha do gówna, oczekując że ta wielka ostoja demokracji będzie ich zbawieniem. Nie. Będzie ich grobowcem. Jest to praktycznie pewne że to również oni stoją za ostatnimi strajkami i protestami na wschodniej ścianie. Ta konserwatywna kraina nigdy nie odważyłaby się sama z siebie wystąpić przeciwko takiej władzy jak nasza. To muszą być wywrotowi opłacani sabotażyści. Ale już niedługo, jeszcze chwilka i Rzymkowski przeprowadzi kontratak przeciwko reakcjonistom. Już tuż tuż..."
BBW_threats_from_outer_world: "Zagrożenia świata zewnętrznego"
BBW_threats_from_outer_world_desc: "Świat się od nas odwrócił. Tym gorzej dla świata. Mogą myśleć że nie są gotowi na to co niesie prawdziwa rewolucja postępu, ale my i tak dotrzemy do nich czy tego chcą czy nie. Piękny dym niesiony wiatrem wytworzony przez błogosławiony akt spalania pokryje całą Europę. Zrozumiecie wtedy, niedowiarki jak bardzo myliliście się, węgiel to nie przeszłość. To nasza jedyna możliwa przyszłość. Na nic wasze sankcje, embarga, zamykanie granic, wasze wiatraki, wasza nieudolność, wasze kompromitacje i bezużyteczne rządy. Węgiel nie dyskryminuje, obejmie wszystkich synów i córki kontynentu jednakowo cudownym i ciepłym uściskiem. Wdychając opary energetycznego cudu zrozumiecie. Wtedy zrozumiecie. Wszystko będzie dla was jasne. Otwórzcie się na postęp."
BBW_strengthen_northern_garrisons: "Wzmocnienie północnych garnizonów"
BBW_strengthen_northern_garrisons_desc: "Północne rubieże Polski nie są jeszcze tak dobrze zagospodarowane jak centrum i południe. Przez to ludzie są bardziej...nieposłuszni. Ze względu na słabe zagęszczenie ludności dodatkowo jest to dość nieoptymalny teren do okupowania. Potrzebujemy tam więcej ludzi, więcej garnizonów. Bracia Karnowscy dostali zadanie sformowania misji ekspedycyjnej na terenach Pomorza. Oni już dopilnują by karbonizacja i industrializacja w tamtych rejonach przebiegła bezproblemowo i efektywnie. Dzięki temu, już niedługo i nad Bałtykiem będzie można oddychać świeżym, węglowym powietrzem a z kranów będzie płynąć ropa naftowa!"

##expansion

BBW_book_economy_1: "Ekonomia - Rozdział 1: Podstawy"
BBW_book_economy_1_desc: "Our economic policy must be coherent - an element of our strength and power. It's a pity that even among us, opinions on these matters differ. It's no wonder - economics is a complex discipline, and even the greatest minds often disagree on its principles. However, we must find common ground and establish a unified approach to managing our resources and wealth."
BBW_book_economy_2_gadomski: "Ekonomia - Rozdział 2: Struktury rynkowe"
BBW_book_economy_2_gadomski_desc: "Our economic policy must be coherent - an element of our strength and power. It's a pity that even among us, opinions on these matters differ. It's no wonder - economics is a complex discipline, and even the greatest minds often disagree on its principles. However, we must find common ground and establish a unified approach to managing our resources and wealth. But sometimes liberal approach may appear more effective."
BBW_book_economy_2_warzecha: "Ekonomia - Rozdział 2: Skutki zewnętrzne"
BBW_book_economy_2_warzecha_desc: "Our economic policy must be coherent - an element of our strength and power. It's a pity that even among us, opinions on these matters differ. It's no wonder - economics is a complex discipline, and even the greatest minds often disagree on its principles. However, we must find common ground and establish a unified approach to managing our resources and wealth. And what's better than internalising negative externalities through appropriate taxation?"
BBW_book_economy_3_gadomski: "Ekonomia - Rozdział 3: Podaż i popyt"
BBW_book_economy_3_gadomski_desc: "Our economic policy must be coherent - an element of our strength and power. It's a pity that even among us, opinions on these matters differ. It's no wonder - economics is a complex discipline, and even the greatest minds often disagree on its principles. However, we must find common ground and establish a unified approach to managing our resources and wealth. But sometimes liberal approach may appear more effective."
BBW_army_reforms: "Reforma wojskowa"
BBW_army_reforms_desc: "It's high time we reformed our military structure. We have managed to secure our borders with nothing but poor equipment and outdated tactics. Our enemies are modernizing, and we cannot afford to lag behind. We need to streamline our command structure, improve training programs, and invest in new technologies. And Naczelny Paladyn Sommer has some interesting ideas on how to achieve this."
BBW_army_reforms_2: "Reforma wojskowa"
BBW_army_reforms_2_desc: "It's high time we reformed our military structure. We have managed to secure our borders with nothing but poor equipment and outdated tactics. Our enemies are modernizing, and we cannot afford to lag behind. We need to streamline our command structure, improve training programs, and invest in new technologies. And Naczelny Paladyn Sommer has some interesting ideas on how to achieve this."
BBW_army_reforms_3: "Nieukończona reforma wojskowa"
BBW_army_reforms_3_desc: "It's high time we reformed our military structure. We have managed to secure our borders with nothing but poor equipment and outdated tactics. Our enemies are modernizing, and we cannot afford to lag behind. We need to streamline our command structure, improve training programs, and invest in new technologies. And Naczelny Paladyn Sommer has some interesting ideas on how to achieve this. Unfortunately, due to various internal problems, we are forced to halt some of these reforms for the time being."
