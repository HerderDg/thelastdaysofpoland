BBW_zaglebie_plan: "Plan Surowcowy Zagłębia Dąbrowskiego"
BBW_zaglebie_plan_desc: "Zagłębie Dąbrowskie nadal obfituje w złoża węgla, których nigdy w pełni nie wykorzystano z powodu rozmaitych problemów logistycznych i politycznych. Wobec obecnego stanu gospodarki oraz potrzeby zwiększenia wydobycia konieczne jest opracowanie kompleksowego planu eksploatacji tych zasobów. Nawet jeśli będziemy musieli wyburzyć po drodze kilka miast."
BBW_silesia_plan: "Plan Surowcowy Metropolii Śląskiej"
BBW_silesia_plan_desc: "Metropolia Śląska jest sercem górnictwa w tym kraju, a jej tradycje sięgają stuleci. Wiele złóż węgla pozostaje jednak niewykorzystanych z powodu rozmaitych przeszkód. Wobec obecnego stanu gospodarki oraz potrzeby zwiększenia wydobycia konieczne jest opracowanie kompleksowego planu eksploatacji tych zasobów. Nawet jeśli będziemy musieli wyburzyć po drodze kilka miast. A jest ich wiele."
