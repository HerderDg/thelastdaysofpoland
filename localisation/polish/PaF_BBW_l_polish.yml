BBW_energy_storages: "System magazynowania energii"
BBW_graphene_fever: "Prototypowanie grafenu"
BBW_graphene_fever_desc: "Fajny ten grafen. Wszystko można z niego zrobić. Baterie, pancerze, lekarstwa, konstrukcje. Nawet tak bezużyteczne rzeczy jak usuwanie zanieczyszczeń. Ciekawe, czy można ten grafen wpierdalać? *chrup* UCH. Średni. Chociaż... *chrup* UCH, NIEDOBRY."
BBW_smog2: "Środki przeciwdziałania smogowi"
BBW_water_purifiers: "Stacje uzdatniania wody"
zgierz_elektronika_tt: "Odblokowuje §YZjednoczenie Przemysłu Elektronicznego§! jako opcję przedsiębiorstwa zbrojeniowego"
BBW_central_electrical_tt: "Odblokowuje §YCentralne Zakłady Sprzętu Elektrycznego CEMIT§! jako opcję przedsiębiorstwa cywilnego"
BBW_gigakopary_in_progress: "Budowa koparek wielonaczyniowych"
BBW_gigakopary_in_progress_desc: "Wreszcie dotarły czeskie licencje na budowę gigantycznych koparek wielonaczyniowych. Możemy rozpocząć budowę własnych maszyn, które uzupełnią braki spowodowane Blackoutem i nadmiernym rozciągnięciem działalności wydobywczej. Miejmy nadzieję, że szybko je uruchomimy."
BBW_gigakopary: "Koparki wielonaczyniowe Bractwa działają"
BBW_nowy_cop: "Nowy Centralny Okręg Przemysłowy"
BBW_gadomski_miracle_1: "Wielka Ekonomiczna Reforma Gadomskiego"
BBW_privatised_mines: "Sprywatyzowane kopalnie"
BBW_high_speed_rail: "Kolej Dużych Prędkości Bełchatów-Łódź"
BBW_crypto_investments: "Inwestycje w kryptowaluty"
BBW_crypto_investments_desc: "Dążąc do stabilizacji i rozwoju gospodarki, postanowiliśmy zainwestować w kryptowaluty. Te cyfrowe aktywa wykazały znaczny potencjał wysokich zwrotów, a przeznaczając część zasobów na ten wschodzący rynek, zamierzamy zdywersyfikować portfel gospodarczy i zapewnić dodatkowe finansowanie projektów przemysłowych oraz społecznych."
BBW_coalcoin_influx: "CoalCoin w obiegu"
BBW_coalcoin_influx_desc: "Wartość CoalCoina była ostatnio niezwykle zmienna, choć obecnie zdaje się rosnąć. Wahania te niosą gospodarce zarówno szanse, jak i ryzyko. Inflacja? Jaka inflacja? Dopóki dobrze rozegramy karty, możemy popłynąć na tej fali ku większemu dobrobytowi. Bez obaw."
BBW_coalcoin_outflux: "CoalCoin w obiegu"
BBW_coalcoin_outflux_desc: "Cóż, ostrzegali nas przed zmiennością, prawda? Wartość CoalCoina ostatnio mocno spadła, co może mieć poważne konsekwencje dla gospodarki. Ale bez obaw, to tylko chwilowe turbulencje. Prawda? PRAWDA?"
BBW_wpierdol_tt: "§RZapewnimy CAŁKOWITĄ i ABSOLUTNĄ ciszę WSZELKIMI. KONIECZNYMI. ŚRODKAMI.\nNikt nie może dowiedzieć się o naszych problemach.§!\n\nZmienia prawo okupacyjne na §YBrutalny ucisk§!"
