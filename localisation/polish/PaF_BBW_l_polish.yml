BBW_industrial_missions_category: "Wykuwanie przemysłowej przyszłości"
#BBW_industrial_missions_category_desc: "Te żądania o najwyższym znaczeniu są kluczem do spełnienia warunków koniecznych dla dalszej gwałtownej industrializacji pomimo działalności ekonazistów."
BBW_industrial_mission1: "Zwiększ wydobycie węgla"
BBW_industrial_mission1_desc: "Nasz przemysł rozpaczliwie domaga się Czarnego Złota, a jedynym sposobem, by go zaspokoić, jest dostarczanie mu coraz większych ilości tego surowca."
BBW_industrial_mission2: "Rozbuduj stolicę"
BBW_industrial_mission2_desc: "Każdy kraj ma stolicę. Tradycja nakazuje, by była największym, najbogatszym i najbardziej prestiżowym miastem danego narodu. Jeżeli Bełchatów ma stać się takim miastem, najpierw musimy nadać mu wszystkie niezbędne cechy."
BBW_industrial_mission3: "Głód industrializacji"
BBW_industrial_mission3_desc: "Cała nasza praca sprowadza się właśnie do tego: zbudować i utrzymać "flotę" wydajnych kompleksów przemysłowych, które zapewnią ludowi miejsca pracy i dobrobyt. Nadszedł czas, by zabłysnąć i pokazać światu, jak nasza praca wydaje owoce oraz przynosi obywatelom wszelkiego rodzaju korzyści."
BBW_industrial_mission4: "Nasz własny kompleks wojskowo-przemysłowy"
BBW_industrial_mission4_desc: "W miarę gwałtownej rozbudowy fabryk i kuźni musimy uwzględnić potrzeby armii. Należy zbudować warsztaty i fabryki zbrojeniowe, by wojsko było w pełni wyposażone w sprzęt najwyższej klasy, a nie w denka rozbitych butelek. Jaki pożytek z państwa bez dobrze wyposażonej stałej armii?"





