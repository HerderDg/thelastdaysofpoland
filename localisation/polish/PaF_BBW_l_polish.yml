BBW_hubris: "Buta"
BBW_hubris_desc: "Kto mówi prawdę ten niepokój wszczyna. A ten który mówi niepopularną prawdę przed wszystkimi ten uchodzi dodatkowo za wariata, dopóki elity nie dotrą do tej samej konkluzji. Jak PiS i PO, każdy system kierujący się pychą - upadnie. A od nas zależy czy będziemy tutaj marionetkami odgrywającymi swoją rolę, czy wręcz przeciwnie - ciętym słowem i twardym czynem będziemy bronić własnych idei i przyczynimy się do upadku owego aparatu władzy. Szymon Hołownia może mówić że jest człowiekiem spoza układu, lecz wszyscy wiemy że jest jego przedłużeniem a cała ta \"Strefa Dialogu\" wydaje się to tylko potwierdzać. Jeszcze musimy grać w tę partię szachów z pudrowanym trupem. Jeszcze musimy pokornie uniżyć się przed większymi graczami. Ale na każdego przyjdzie pora."
BBW_time_of_geezers: "Czas Wrzeszczących Staruszków"
BBW_time_of_geezers_desc: "Żaden człowiek nie jest doskonały i nieomylny. Gdy w koalicji znajdzie się wiele niekompetentnych osób, głupota się kumuluje i wzrasta wykładniczo. Ale tak samo działa to w przypadku gdy w jednym miejscu zgromadzimy osoby wybitne o umysłach ostrych jak brzytwa i przekonaniach twardych jak skała. I taka właśnie to jest nasza Rada. Możemy czasem wyglądać na grupę starych dziadów którzy siedzą pod blokiem na ławce i marudzą przekrzykując jeden drugiego, ale gdy postanowimy coś...to każdy z nas dopełnia się w sposób suplementarnie idealny. Co prawda, najpierw trzeba dojść do tego porozumienia. Ale nie ma u nas elementów wywrotowych, które w jakikolwiek sposób mogłyby zakłócić nasze funkcjonowanie, wszak wszyscy wywodzimy się z zacnego środowiska klubu Ronina. No, może oprócz Gadomskiego..."
BBW_new_quotas_guidebook: "Nowy przewodnik po normach"
BBW_new_quotas_guidebook_desc: "W końcu razem z Witoldem ukończyliśmy nowy podręcznik dla wszystkich pracowników Bractwa. Co prawda wolałbym żeby mnie koń kopnął w głowę niż żebym musiał po raz kolejny słuchać wykładów Gadomskiego o liberalizmie, aczkolwiek tutaj zasadniczo nie było zbytnio wielu rozbieżnych zdań. Dziesięciogodzinny dzień pracy jest niezbędny abyśmy byli w stanie nadgonić sąsiadów i wybić się na niezależność ekonomiczną. Problem leży w tym że ludzie nie będą chcieli tego przyjąć za nic w świecie więc póki co są to “opcjonalne nadgodziny". Kierownicy zakładów dostaną załącznik do podręcznika z metodami radzenia sobie z ludźmi którzy nie będą chcieli tych nadgodzin robić. I tak się tworzy proszę państwa dobrobyt!"
BBW_consolidation_of_unions: "Konsolidacja górniczych związków zawodowych"
BBW_consolidation_of_unions_desc: "Związki zawodowe zbudowały i zniszczyły III RP. Bandy związkowe które przykleiły się do PiSu w czasach jego najbardziej radykalnych reform nie mają nic wspólnego z reprezentowaniem interesu pracowników. Szczególnie w tych górniczych zalęgła się tak szeroko rozpowszechniona zaraza bumelanctwa, że aż mnie zęby bolą jak pomyślę o tym że górnik mógłby się upodlić do tego stopnia że jedyne co robi to wyciąga rączki po kasę nie wykonując żadnej pracy. Ale na to mamy rozwiązanie. Łączymy wszystkie związki w jedno wielkie Gwarectwo Bełchatowskie, które będzie trzymało rękę na pulsie wszystkich potencjalnych wywrotowców. I w końcu będziemy mogli zacząć pracować jak ludzie."
BBW_our_people_in_radio_dialog: "Nasi ludzie w radiu Dialog"
BBW_our_people_in_radio_dialog_desc: "Jak Szymon czasem wpadnie na pomysł to klękajcie narody. Ale wiadomo - nie można przeszkadzać wrogowi gdy popełnia błąd. Hołownia uważa się co prawda za przyjaciela wszystkich w województwie Łódzkim, a każdego z watażków za jedną wielką upośledzoną rodzinę. I w związku z tym zaprosił wszystkich do współtworzenia radia Dialog, gdzie każdy dostaje szansę na krótki segment związany z promowaniem ich kraju, oczywiście wszystko w duchu współpracy i wzajemnego kochania się. Niedoczekanie. Już rozmawiałem z Janeckim i mamy cwany plan. Stasiek nazywa to jakoś sprytnie - percepcją subliminalną. Chodzi oczywiście o przekazywanie naszych ideałów tak żeby te słupy dialogowe się nie zorientowały. Ale to będzie show!"
BBW_szczercow_bombing_memorial: "Pomnik zamachu w Szczercowie"
BBW_szczercow_bombing_memorial_desc: "W dniach takich jak dzisiejszy życie brutalnie przypomina mi co to znaczy być odpowiedzialnym za losy tysięcy ludzi. Całe społeczeństwo pokłada wiarę w to, że moje decyzje będą słuszne i zagwarantują im bezpieczeństwo i dostatek. I czasem nie zależy to ode mnie jak to wszystko się rozgrywa, ale koniec końców - jeżeli coś pójdzie nie tak, wina wciąż jest moja. I ja od tego nie uciekam. Muszę to przyjąć z godnością. Bo życie siedmiu młodych ludzi ciąży na moim sumieniu. Nie zrobiłem wszystkiego żeby zagwarantować im, że takie sytuacje się nie będą zdarzać. Mogę to robić po fakcie, ale...to im życia nie wróci. Mam problem z napisaniem jakiejś sensownej mowy na uroczystość...słowa nie chcą współpracować kiedy tyle serc jest w żałobie. Ale muszę unieść ten krzyż."
BBW_proctor_secret_files: "Tajne akta Proktora"
BBW_proctor_secret_files_desc: "Zdolność Janeckiego do analizowania każdego najdrobniejszego szczegółu oraz kurczowego trzymania wszystkich informacji w swoich archiwach zrobiła z niego tak wspaniałego dziennikarza śledczego przed Upadkiem. A teraz, jest jeszcze bardziej przerażający - bo może wykorzystać swoje talenty w kierowaniu służbami całego państwa. Ale to nie wystarczy. Stanisław potrzebuje swojej własnej agencji wywiadowczej, bo jak bardzo genialny by nie był - ma tylko jedną parę oczu i uszu. A prowadząc siatkę szpiegowską, ohohoho...będzie niepowstrzymany. Co w zasadzie sprawia że samemu zaczynam się bać. Ale nie ma czego, w końcu jesteśmy starymi przyjaciółmi z klubu Ronina."
BBW_youth_agents: "Mali agenci"
BBW_youth_agents_desc: "Tak jak się spodziewałem, Janecki przyjął informację o dodatkowych obowiązkach z ogromnym entuzjazmem. Wyglądał i zachowywał się jakby to były co najmniej jego urodziny (do zanotowania - kupić mu fedorę na prezent urodzinowy). Ale od razu zabrał się do pracy i w sumie nie zdziwiło mnie że z marszu wystrzelił w moją stronę całą listę rzeczy których będzie potrzebował do rozkręcenia tej operacji. Oprócz dość sensownych małych rzeczy które natychmiast dałem radę załatwić, była jedna do której potrzebowałem usiąść i pomyśleć na spokojnie. Janecki chce rekrutować młodzież do bycia szpiegami. Uważa, że są oni idealni do niektórych zadań a i ideologicznie będą bardzo prości do ukierunkowania. Może i przez chwilę miałem moralne wahania, ale Stasiek był tak bardzo podekscytowany, że nie mogłem mu odmówić. Na szczęście mam na myśli parę osób..."
BBW_grand_picnic: "Organizacja Wielkiego Pikniku"
BBW_grand_picnic_desc: "Czasem trzeba założyć na twarz maskę, zagryźć wargi i uśmiechnąć się głupio do sąsiada życząc mu miłego dnia. No nic to może nie kosztuje oprócz dodatkowych zmarszczek, ale i tak jest to nieprzyjemnie sztuczne. Dodatkowo to boli wielokrotnie bardziej gdy coś takiego musisz przeprowadzać na arenie między...no, nie międzynarodowej bo to ten sam naród. Internarodowej? Może. Mniejsza. Chodzi o to, że musimy robić dobrą minę do złej gry i zorganizować jakieś igrzyska dla ludu i przy okazji pokazać się Hołowni z dobrej strony. To uśpi jego czujność i przynajmniej przykryje na jakiś czas nasze wewnętrzne problemy. Poza tym, który lider byłby w stanie odmówić dobrze wygrillowanej golonki albo steka? Do tego piwko w rękę i można prowadzić dyplomację! A jeszcze jakiś koncercik się w tle załatwi i będzie super. Co może pójść nie tak?"
BBW_we_got_them: "Bracia i Siostry...mamy ich!"
BBW_we_got_them_desc: "Zdrajcy. Wywrotowcy. Reakcjoniści. Wiechowcy. Ekoterroryści. Nagłówki gazet prześcigały się w pejoratywnych określeniach na sprawców zamachu w Szczercowie. Tak, mamy ich. Złapaliśmy sprawców. Przez naszą własną narrację dałem się złapać na myśleniu że te dzieciaki są wcieleniami samego diabła. Po czym, gdy ich zobaczyłem na własne oczy...było to dość otrzeźwiające doświadczenie. Całe życie przed nimi, a dali się zmanipulować za przegraną sprawę, pomimo posiadania relatywnie wygodnego życia w środku kraju ogarniętego anarchią. Ale potem przypomniałem sobie, że mimo wszystko odpowiadają za zamordowanie siedmiu naszych żołnierzy. I dysonans ulatuje."
BBW_more_power_to_state: "Więcej władzy dla aparatu bezpieczeństwa"
BBW_more_power_to_state_desc: "Na ulicach zaczyna się powoli robić tłoczno. Nie do końca podoba mi się do czego może to doprowadzić. Proces pomimo że potoczył się po naszej myśli, to jednak wszystko co się działo poza budynkiem Estakady już nie do końca mieści się w naszych politycznych planach. Janecki zarzeka się że ma kontrolę nad najgorszymi elementami społeczeństwa i nie dojdzie do tragedii. Gadomski mówi że to naturalna potrzeba ludzi do wyrażania swoich opinii i powinniśmy po prostu ich przeczekać. Warzecha grozi napuszczeniem armii na protestujących. Już chcę widzieć jak próbuje rozmieszczać po kątach Sommera i jego paladynów. A sam Sommer...właśnie, czy ktoś widział Tomka?"
BBW_reforms_of_highest_time: "Reformy Najwyższego Czasu"
BBW_reforms_of_highest_time_desc: "Najwyższy czas! To zawołanie nigdy nie straci swojego uroku. Bo jest to w istocie czas, by zająć się naszą armią. Tomasz jest zniecierpliwiony i ma wielkie plany, truł mi głowę kilka miesięcy o tym żebyśmy zatwierdzili jego plan reform. No i w końcu - ma. Co prawda nie jestem przekonany jak nam pomaga wielki plan stworzenia gigantycznej floty sterowców oraz maszyn kroczących, ale jest to zdecydowanie - WIZJA. A wizjonerów nam potrzeba, w końcu tylko oni są na tyle szaleni żeby odważyć się na takie ryzyko. Może i część z tych reform nie wyjdzie, ale trzeba próbować."
BBW_reorganisation_of_hierarchy: "Reorganizacja hierarchii"
BBW_reorganisation_of_hierarchy_desc: "Nasze przejęcie władzy nad terenami obecnie w naszym posiadaniu nie obeszło się bez dość specyficznych kompromisów. Nasze siły zbrojne to pozorny monolit. W rzeczywistości na poziomie kompani jest to amalgamat górniczych milicji, lokalnych sił bezpieczeństwa i naszych własnych bojówek. W czym problem? Taki że niekoniecznie wszyscy którzy powinni pełnić funkcje oficerskie je pełnią, i vice versa. Wspomniałem o bojówkach, prawda? No właśnie - liczba mnoga. Każdy paladyn generalnie ma swoją własną więc cała hierarchia leży i kwiczy jak Polska gospodarka. Musimy ten węzeł gordyjski przeciąć."
BBW_brutal_hazing: "Brutalna fala"
BBW_brutal_hazing_desc: "Śmiać mi się chce jak pomyślę sobie o tych wszystkich zachodnich armiach gdzie obniża się wymagania, wpuszcza się osobniki niebanalne, elgiebety, itd. Chłop musi być chłopem! I wojsko musi z niego zrobić mężczyznę. Fala rządzi się swoimi własnymi prawami i tak, bywa to często upadlające, ale przede wszystkim to hartuje ducha! Wróg nie będzie rozpływał się nad twoimi zaimkami, on będzie chciał Cię zabić! Więc ty musisz być największym krwiożerczym potworem który zabije jego najpierw. Dlatego myślę, że nie szkodzi jeżeli żołnierze między sobą hartują się wzajemnie by wydobyć ukrytą siłę i pielęgnować wytrwałość. Tak powinno być."
BBW_copying_foreing_designs: "Kopiowanie zagranicznych konstrukcji"
BBW_copying_foreing_designs_desc: "Musimy produkować więcej broni, żeby uniezależnić się od Łódzkiej zbrojeniówki (która to Łódź de facto sama jest pacyfistyczna, ale broń sprzedaje...). Właśnie. Jak się produkuje broń? Teoretycznie możemy wziąć rurę i napchać do niej prochu i liczyć na to że nie wysadzimy sobie rąk przy okazji. Ale taka prowizorka nie przystoi prestiżowi Bractwa Węgla! Co prawda bronie czarnoprochowe idealnie wpasowują się w nasz wizerunek, ale musimy mieć też coś z prawdziwym kopem. Co tu zrobić? Ano, bierzemy zdobywamy taki jeden, może dwa zagraniczne karabinki i starą chińską metodą - bezczelnie kopiujemy. Tu przemalujemy, tu dodamy jakieś dodatkowe frezy, spawy, gadżety - i już mamy nowiutki karabin gotowy do masowej produkcji! To takie proste!"
BBW_mass_motorisation: "Masowa motoryzacja piechoty"
BBW_mass_motorisation_desc: "Konikiem Warzechy zawsze była motoryzacja i prawa kierowców. Nic dziwnego że przekonał Tomka do tego odważnego kroku. W końcu tak USA rozniosło Niemców podczas II Wojny Światowej - miażdżącą przewagą motoryzacyjną. Niemcy całą wojnę prowadzili z pozycji giganta zmechanizowanej armii - dopóki nie przybył Ford i General Motors. My takich molochów przemysłowych nie posiadamy niestety, ale...możemy spróbować zmotoryzować maksymalnie nasze jednostki żeby nie musiały przemierzać zrujnowanych poupadkowych ziem na piechotę, albo co gorsza...na *tfu* rowerze."
BBW_giants_of_military_industry: "Giganci przemysłu zbrojeniowego"
BBW_giants_of_military_industry_desc: "Zawsze będę powtarzał - chcesz pokoju, szykuj się na wojnę! Co prawda my tutaj nie mamy co myśleć o pokoju, niezależnie od tego ile Szymon będzie bulgotał o dialogu i współpracy. Wojna przyjdzie prędzej czy później - i zakładając, że jednak będzie to prędzej - musimy jak najszybciej rozkręcić naszą zbrojeniówkę. Tworząc gigantyczne kombinaty przemysłowe w każdym z naszych głównych miast zdecentralizujemy produkcję, i jednocześnie pokryjemy wszystkie możliwe fronty zalewając wroga stalową plagą karabinów i bagnetów. Tylko musimy najpierw znaleźć pieniądze na samą konstrukcję i pierwszy rozruch...potem tylko znaleźć surowce...i eh, czy my na pewno możemy sobie na to pozwolić?"
BBW_flying_monsters: "Latające molochy z Łaska"
BBW_flying_monsters_desc: "Wydawało mi się że sterowce akurat należały do tych reliktów przeszłości które określamy wynalazkami epoki słusznie minionej. I o ile jesteśmy wielkimi orędownikami powrotu do starych, sprawdzonych metod zarówno przemysłowych jak i wojskowych, tak...no nie wiem. Sterowce? To nie jest tak że ktoś może to zestrzelić z pistoletu? Puff, i nie ma całej floty...właśnie - floty! Tomek wymyślił sobie że to nie byłby jeden statek, lecz cała gigantyczna armada która przesłoniłaby słońce! Chociaż może jak będą lecieć dostatecznie wysoko to nikt ich nie zestrzeli - bo i z czego? I wtedy tanim sposobem będziemy mogli zbombardować wroga. Znaczy się...patrząc na plany, no może nie takim aż...tanim."
BBW_liberty_prime: "Rozpoczęcie budowy Liberty Prime"
BBW_liberty_prime_desc: "Nie zrozumcie mnie źle, jestem całkowicie za każdą inwestycją która przynosi prestiż naszemu państwu oraz dodatkowo czyni z nas superpotęgę wojskową. Tylko...wielki kroczący robot? Znaczy nie to że nie potrafię sobie tego wyobrazić, w końcu zdarzało mi się pisać science-fiction. Z drugiej strony fikcja pozostaje fikcją dopóki ktoś nie przyjdzie i nie wiedząc o tym ją urzeczywistni. Więc może i coś jest na rzeczy. Może i zbankrutujemy przez ten projekt ale jak cudownie byłoby zobaczyć tą cudowną maszynę miażdżącą Manufakturę albo Centrum Dialogu. Oh! Czy możemy mu zamontować moduł głosowy? Wtedy mógłby rzucać patriotycznymi tekstami dodatkowo!"
BBW_flamer_corps1: "Stworzenie Korpusu Ogniomistrzy"
BBW_flamer_corps1_desc: "Ogień trzeba zwalczać ogniem. My co prawda walczymy co najwyżej z ogniem rewolucji ale nikt płakać nie będzie jeśli takowych potraktujemy też ogniem. Z ogniem w swoich oczach to właśnie Tomek opowiadał mi o swojej wizji wielkiej falangi żołnierzy wyposażonych w miotacze ognia maszerujących ramię w ramię do przodu palących wszystko co znajdzie się na ich drodze. Wielka ściana ognia która pochłonie każdego naszego wroga. Brzmi spektakularnie, to muszę przyznać. Chociaż wybuchowo byłoby gdyby jeden z nich się nagle zapalił. Bum, i nie ma całej naszej linii. No, ale zakładając że nie byliby dosłownie metr od siebie to może to zadziałać. Łukaszowi się to nie spodoba, zabierzemy biedakowi połowę zasobów paliwa."
BBW_book_of_warzecha_and_gadomski: "Księga Warzechy i Gadomskiego"
BBW_book_of_warzecha_and_gadomski_desc: "Ekonomia w naszym wydaniu musi być spójna i być elementem naszej siły i potęgi. Szkoda, że pośród nas samych w tychże kwestiach panują odmienne poglądy. Jedne bardziej liberalne, drugie bardziej...ortodoksyjne w kwestii interwencjonizmu. Do tego jeszcze kolega Sommer który próbuje wpleść w to wszystko swoje marzenia o Bractwie jako gigancie przemysłu zbrojeniowego i kolega Janecki który pragnie wielkich inwestycji w przemysł zaawansowanych technologii. A gdzie ja mam tam jeszcze swoje słowo wpychać? Chciałbym, nie ukrywam - ale wydaje mi się że lepiej będzie pozostawić ekonomię tym, którzy bardziej się na niej znają. Tylko teraz...kto w ogóle ma tu rację?"
BBW_liberalize_arms_laws: "Liberalizacja przepisów produkcji zbrojeniowej"
BBW_liberalize_arms_laws_desc: "Paladyn Gadomski twierdzi że kurs obrany na liberalizację niektórych sektorów gospodarczych to jedyna słuszna droga na jaką nas obecnie stać. Daleko mi do popularyzowania haseł które normalnie zakrawałyby o broń Boże...liberalizm..., ale Sommer wydaje się wtórować Gadomskiemu. Łukasz co prawda będzie wściekły, ale cóż to za nowość? Pierwszy krok - uwolnienie potencjału zbrojeniowego poprzez poluzowanie przepisów i restrykcji które pozwalają na produkcję broni i amunicji. Całkiem zdroworozsądkowe i przyszłościowe, muszę przyznać. Będziemy potrzebowali dużo broni w nadchodzących latach, a opieranie się na skostniałych przepisach martwego systemu wyrządziłoby nam więcej krzywdy niż pożytku."
BBW_lowering_taxes_for_industry: "Obniżanie podatków dla przemysłu"
BBW_lowering_taxes_for_industry_desc: "Wszelkiego rodzaju nieszczęsne składki, daniny, akcyzy czy podatki zawsze były elementem rozgrywki politycznej lub napychania prywatnych kieszeń, a nigdy nie służyły społeczeństwu. Energia która drzemie w naszych przedsiębiorczych obywatelach musi zostać uwolniona i popłynąć niczym ogromna rzeka pętana tamą która nie może dopuścić do rozlania się na pobliskie tereny. A ja mówię - niech się leje! Musimy odbić znaczenie słowa postępowość i sprawić by oznaczała to co powinna - rozwój, a nie zaściankową degradację wartości! Postęp nie może być regulowanym strumyczkiem z którego ledwo co skapuje toksyczny ściek, musi być gigantyczną falą która może i przyniesie straty, ale za to rozpędzona, przyniesie oczyszczenie i świeżą wodę."
BBW_incentivize_factory_work: "Zachęcanie do pracy w fabryce"
BBW_incentivize_factory_work_desc: "Wydajność - to kolejne ze sztandarowych haseł którymi powinniśmy się kierować. Efektywność rolniczych zapędów już dawno spaliła na panewce po niezliczonych dotacjach unijnych i chciwości pańszczyźnianych pasożytów z samorządów pod znakiem zielonej koniczynki. Oczywiście stracili na tym poważni rolnicy, którzy swoją pracowitością niejednego robotnika by położyli na łopatki. Niemożliwym jest odkręcenie tak zepsutego systemu, dlatego niestety dla wielu trzeba będzie znaleźć jakieś inne zajęcie. Nie ma sensu inwestować w coś co przynosi jedynie straty, dlatego dla rolników trzeba będzie stworzyć programy które pomogą im przekwalifikować się na porządną pracę w ciężkim przemyśle. Tam ich rzetelność i pracowitość przyda się do ciężkiej pracy, która mimo wszystko przynosi owoce, a nie długi i niepewność."
BBW_remotorisation: "Remotoryzacja społeczeństwa"
BBW_remotorisation_desc: "Neoliberalni feudałowie z wielkich miast za punkt honoru postawili sobie całkowite zniszczenie infrastruktury samochodowej. Strefy Czystego Transportu, dodatkowe opłaty, zwężanie jezdni, brak parkingów, ścieżki rowerowe, buspasy, pasy zieleni. Wszystko by jak najbardziej ograniczyć wolność poruszania się przeciętnych ludzi, których nie stać na elektryczne superauta lub mieszkają na obrzeżach miast, i zlikwidowana komunikacja zbiorowa nie pozwala im na przemieszczanie się jak to mieszczuchy nakazują - bez auta. Łukasz ma na to plan. I ja się pod nim podpisuję! Trzeba przywrócić miasta autom, i odbudować porządną i efektywną infrastrukturę która pozwoli normalnie przemieszczać się wszystkim, a nie tylko wybranej elicie. Może nawet uda się nam do tego wykorzystać resztki Partii Kierowców..."
BBW_climate_tax: "Wprowadzenie podatku klimatycznego"
BBW_climate_tax_desc: "Co prawda ja osobiście nie jestem orędownikiem wprowadzania dodatkowych podatków, ale muszę przyznać że Warzecha tutaj przeszedł samego siebie. Odwrócenie ekologicznych żądań przeciwko nim samym będzie zdecydowanie cenną lekcją dla wszystkich, którzy dalej ostają przy swoich anachronicznych ekobzdurach. Nazwanie tego podatkiem klimatycznym jest jedynie cudowną wisienką na torcie, który upieczemy rzecz jasna na piecu węglowym. Każdy kto nadal dostosowuje się do przestarzałych zielonych dyrektyw rodem z Brukselskiego piekła, będzie płacił dodatkowe opłaty. Ogień trzeba zwalczać ogniem. A ten ogień nie może rozprzestrzenić się w naszym społeczeństwie, gdyż nie daj Boże mógłby się z tego zrobić pożar. A wtedy...oj, wtedy to dopiero emisja dwutlenku węgla poszybuje w górę. Razem z prowodyrami."
BBW_logging_operations: "Działania wycinkowe na terytorium ZHRP"
BBW_logging_operations_desc: "Umowny pas graniczny pomiędzy nami a zielonymi potworami zajadającymi się szyszkami i krwią porządnych przemysłowców stanowi wielki zielony mur pełen drzew. Ale nie ma takiego traktatu ani ustawy która ustanawiałaby de jure gdzie jest granica pomiędzy Bractwem a terenem anarchii harcerskiej. Ich lasy zbyt blisko są naszych newralgicznych punktów. No a tak się składa, że prowadząc wycinkę dookoła Kleszczowa, zahaczamy przypadkiem o skrawek terenu który ponoć nie należy do nas. Kłóciłbym się z tym co prawda, ale obawiam się że Wielki Baron Dialogu będzie tutaj prawił kazania jeśli dojdzie do jakichś konfrontacji. A może po prostu...nikt się nawet nie zorientuje? W końcu komu przeszkadza parę drzew w te czy we wte...a my potrzebujemy tego by zasilać to cholerne województwo."
BBW_belchatow_expansion_gadomski: "Rozbudowa elektrowni w Bełchatowie"
BBW_belchatow_expansion_gadomski_desc: "Maszyna musi jeść i rosnąć. Nie ma w naszych doktrynach jakiejkolwiek innej alternatywy wobec rozwoju naszego klejnotu - Bełchatowskiej Elektrowni Węglowej. To źródło naszego dobrobytu, kolebka naszych wartości i symbol wiary w ideały które rozprzestrzeniamy razem z energią na całe województwo. To my przynosimy oświecenie wszystkim dookoła, to dzięki nam mogą w spokoju i cieple spoczywać i szerzyć swoje herezje. I dlatego absolutnym priorytetem jest zadbanie o to żeby zbudować jak najtrwalsze fundamenty pod wieczne funkcjonowanie wszystkich bloków energetycznych; tych obecnych, jak i tych które właśnie zamierzamy zbudować. Bo to jest inwestycja w przyszłość. Na szczęście nie ma tutaj żadnego głosu sprzeciwu wobec tej kwestii. Bo jaka niby miałaby być inna droga?"
BBW_invest_in_smaller_businesses: "Inwestycje w mniejsze biznesy"
BBW_invest_in_smaller_businesses_desc: "Jeżeli miałbym wskazać jakiś pozytyw wynikający z Upadku...to oprócz dosadnego stwierdzenia że eurofederałowie ujawnili swoje prawdziwe oblicza, to powiedziałbym że zagraniczne molochy które uciskały mniejszych przedsiębiorców w końcu wyniosły się z kwikiem z naszego kraju. Przynajmniej z jego większości. Gospodarka próżni nie znosi, więc nareszcie nasi mniejsi lokalni przedsiębiorcy będą mogli postawić się w roli Atlasa trzymającego na swoich barkach ekonomię naszego społeczeństwa. I należy ich wspierać w tym, i zadbać o dodatkowe fundusze dla rozwoju małych i średnich przedsiębiorstw. Bo państwowe może działać tylko gdy pomaga im w tym prywatne. Nie zamiast, nie bez nich. To gospodarcze yin-yang jest kluczem do osiągnięcia sukcesu, którego nikt w tym województwie zdaje się nie rozumieć."
BBW_belchatow_expansion_warzecha: "Rozbudowa elektrowni w Bełchatowie"
BBW_belchatow_expansion_warzecha_desc: "Maszyna musi jeść i rosnąć. Nie ma w naszych doktrynach jakiejkolwiek innej alternatywy wobec rozwoju naszego klejnotu - Bełchatowskiej Elektrowni Węglowej. To źródło naszego dobrobytu, kolebka naszych wartości i symbol wiary w ideały które rozprzestrzeniamy razem z energią na całe województwo. To my przynosimy oświecenie wszystkim dookoła, to dzięki nam mogą w spokoju i cieple spoczywać i szerzyć swoje herezje. I dlatego absolutnym priorytetem jest zadbanie o to żeby zbudować jak najtrwalsze fundamenty pod wieczne funkcjonowanie wszystkich bloków energetycznych; tych obecnych, jak i tych które właśnie zamierzamy zbudować. Bo to jest inwestycja w przyszłość. Na szczęście nie ma tutaj żadnego głosu sprzeciwu wobec tej kwestii. Bo jaka niby miałaby być inna droga?"
BBW_15th_pension: "Piętnastka dla górników"
BBW_15th_pension_desc: "Czasem wydaje mi się że to wymyka się spod kontroli. Zwykły kalendarz ma dwanaście miesięcy, lecz dla górników jest ich czternaście. Powoduje to harmider i bałagan rodem z Imperium Rzymskiego kiedy cesarze dodawali sobie miesiące tak jak im się podobało. A potem nie mieli pojęcia jaki jest rok. My mamy to pojęcie, ale...no nie możemy przecież odmówić naszemu żelaznemu elektoratowi, prawda? Warzecha miał wymyślić jakiś sposób na dodatkowe przywileje dla górników, sam osobiście myślałem o jakichś...bardziej wyrafinowanych metodach zdobywania ich serc, ale cóż. Dostaną piętnastą wypłatę. Jest to na swój sposób proste i skuteczne. Tylko czy nas będzie stać jeśli będą chcieli zaraz szesnastą, siedemnastą i osiemnastą?"
BBW_atlas_shrugged: "Atlas Niewzruszony"
BBW_atlas_shrugged_desc: "Stało się to, co zawsze musiało się stać: Dialog Hołowni, Atlas mający utrzymać razem nieprzejednanych watażków, w tym nas, rozpada się na naszych oczach. Zbliża się przełomowa chwila historii. Gdy Atlas zrzuca z ramion Dialog, nasi wrogowie zostaną spuszczeni ze smyczy. Wychodzimy na powierzchnię, gotowi na starcie."
BBW_cut_off_power_lines: "Odcięcie linii energetycznych"
BBW_cut_off_power_lines_desc: "Zbyt długo podtrzymywaliśmy tę nędzę województwa naszym świętym węglem i energią. To właśnie my najlepiej powinniśmy znać znaczenie sieci energetycznej: przemysł maszynowy, produkcja - wszystko to jest najważniejsze, a powstająca dzięki nim broń przewyższa każdego kibola z kijem bejsbolowym czy leśne dziecko z procą na szyszki. Nawet schizofrenicy z Ellander dostrzegli jej znaczenie. Lecz teraz, gdy Dialogu już nie ma, możemy wreszcie przeciąć pępowinę wiążącą nas z gnijącym ścierwem sojuszu. Niech gniją w ciemności."
BBW_cut_off_power_lines_tt: "§RTrwale§! wyłącza wszystkie sektory sieci energetycznej"
BBW_counterrevolution_rearguard: "Tylnia straż kontrrewolucji"
BBW_counterrevolution_rearguard_desc: "Kibole. Ideologia większości z tych typów zaczyna się i kończy na kiju bejsbolowym. Ci tutaj mają nieco większe ambicje: bardziej od Żydów kochają tylko rewolucję. Rewolucja, zwłaszcza czerwona, jest jednak mrzonką, która rozpada się w chwili, gdy trzeba rozwiązać prawdziwe problemy. Ale ci ludzie ledwie czytali Marksa. Oszczędźmy im więc wstydu mierzenia się ze sprawami państwowymi, do których Bractwo nadaje się znacznie lepiej: pogrzebmy ich w pokładach węgla."
BBW_securing_southern_flank: "Zabezpieczenie południowej flanki"
BBW_securing_southern_flank_desc: "Na południu żyją ekoterroryści z ZHRP, obsesyjnie pragnący zachować swe lasy w obecnej postaci i odmawiający im wniebowstąpienia z biomasy ku świętej postaci węgla. Las z kolei walczy u ich boku, a oni uderzają tam, gdzie inni najmniej się tego spodziewają. Walczą jak tchórze, polegając na skradaniu i taktyce szybkich uderzeń i ucieczek. I słusznie, bo nie mają przemysłu ani sprzętu lepszego od proc, koktajli Mołotowa i szyszek. W starciu z naszymi doskonalszymi Paladynami szybko popadną w desperację; lecz to zdesperowana bestia walczy najzacieklej. Musimy rozbudować wysunięte bazy operacyjne i bunkry, by przetrwać wszystko, czym zechcą w nas cisnąć."
BBW_anarchist_punks: "Rozbicie anarchistycznych gówniarzy"
BBW_anarchist_punks_desc: "W starciu ze zorganizowaną, racjonalną i realistyczną władzą, która zna znaczenie zarówno porządku, jak i dosłownej energii oraz nie boi się spalić za sobą zastanej przeszłości, by dotrzeć tam, gdzie musi, żadna anarchistyczna banda nie ma szans. Rozprawa z nimi nie będzie różniła się niczym od zdławienia bandytów albo drużyny ZHP. Wznieśmy razem pięści, zorganizowani w jedną wolę, a chaos anarchistów rozpadnie się niczym torf pod młotem."
BBW_unsavory_types: "Szemrane typy"
BBW_unsavory_types_desc: "Konsorcjum niczym nie różni się od pozostałych watażków ślepej uliczki dawnego Dialogu. Po co w ogóle tłumaczyć im potęgę i sens naszego przemysłu? Kiedy mamy rację, co jest oczywiste samo przez się, nie udajesz, że konkurencja ma nam do zaoferowania cokolwiek poza pasożytnictwem! Trzeba ich zniszczyć, zanim oni umniejszą ciebie."
BBW_final_judgement: "Sąd Ostateczny"
BBW_final_judgement_desc: "Oto stoi sąd orzekający w imieniu upadłego, naiwnego państwa, zapatrzonego w literę prawa zamiast w to, co naprawdę najważniejsze. Doprawdy relikt dawnej sprawiedliwości i minionej epoki: Anna Maria Wesołowska ma po swojej stronie prawo i rozpoznawalne nazwisko, a jej dzielni obrońcy strzegą porządku zarówno na sali sądowej, jak i w całym państwie. Gdy ich pokonamy, to my postawimy ją przed sądem, a wraz z nią osądzimy dawną dekadencką epokę."
BBW_key_fortifications: "Wzmocnienie kluczowej infrastruktury"
BBW_key_fortifications_desc: "Bractwo w ogromnym stopniu polega na swojej krytycznej infrastrukturze energetycznej, stawiając wszystko na doskonalsze wytwarzanie energii. Czyni to z niej... jasny cel dla naszych wrogów. Musimy ich wyprzedzić. Worki z piaskiem, miejsca zasadzek, stanowiska, bunkry. Uderzajcie w ziemię, niech kruszy się pod naszymi fortami, tak jak skruszy się każdy zuchwały wróg, który odważy się tknąć nasze stacje lub elektrownie."
BBW_east_west_rail_line: "Linia kolejowa Wschód-Zachód"
BBW_east_west_rail_line_desc: "Linie kolejowe są prawdziwymi żyłami przemysłu. Bez nich niczego nie da się osiągnąć. Pojazdy drogowe mają swoje miejsce, lecz zawsze napędza je olej napędowy albo benzyna; pociągi jadą na energii prosto z naszych elektrowni, a jeśli zechcemy, nawet na samym węglu. Zbudujemy kolejną linię kolejową dla naszej potęgi, biegnącą od najdalszych wschodnich po najdalsze zachodnie krańce państwa. Tylko dzięki doskonalszej logistyce nasz doskonalszy przemysł będzie miał znaczenie."
BBW_artillery_support: "Artyleryjskie oddziały wsparcia"
BBW_artillery_support_desc: "Nasze odlewnie, nasze zakłady amunicyjne i sam ogrom ich produkcji czynią nas wyjątkowo przygotowanymi do przyjęcia bardziej zdecentralizowanej doktryny artylerii. Wzywane według potrzeby zespoły wsparcia będą prowadzić ogień na rozkaz, gdy tylko będą gotowe. Przewaga taktyczna nad wrogami, którzy ledwie potrafią uzbroić się w szyszki, będzie niezaprzeczalna. Dzięki większej sile ognia wyższość zarówno naszej ideologii, jak i porządku stanie się oczywista."
BBW_rzymkowski_doctrine: "Doktrynale reformy Rzymkowskiego"
BBW_rzymkowski_doctrine_desc: "Rzymkowski otrzymał zadanie przekształcenia naszej doktryny wojskowej w coś, co da się rozbudować na wielką skalę. Nie pozostaniemy długo prowincjonalnym państewkiem, a nieuniknione powiększenie sił będzie wymagało setek tysięcy ludzi. W tym celu trzeba stworzyć zupełnie nowy porządek bojowy i łańcuch dowodzenia. Rzymkowski będzie musiał zdecydować, jak zorganizujemy korpus oficerski, które stopnie Paladynów obejmą poszczególne jednostki i jak powiązać to wszystko z naszą potęgą przemysłową. Bez tego pozostaniemy bandą braci ledwie zdolną utrzymać Łódzkie."
BBW_come_fly_with_me: "Lecę bo chcę"
BBW_come_fly_with_me_desc: "Głęboko w zapomnianej bazie wojskowej na naszych ziemiach stoją samoloty bojowe. Stare, zardzewiałe i bez żadnej usterki, której nasi Bracia nie zdołali do tej pory naprawić. Gdy wzbiją się w niebo, zyskamy niepodważalną przewagę nad każdą siłą pozbawioną licznej obrony przeciwlotniczej, czyli niemal nad każdym obecnym przeciwnikiem. Maszyny te dobrze służyły prawdziwym supermocarstwom, a kto lepiej od nas przywróci im paliwożerną chwałę?"
BBW_partisan_whackamole: "Partyzancka gra w kotka i myszkę"
BBW_partisan_whackamole_desc: "Są wszędzie. Robimy wszystko, by spacyfikować Łódzkie, przywróciliśmy Zdrowy Rozsądek, daliśmy ludziom energię, przemysł i dobrobyt, a mimo to niemal każdego dnia w jakimś zapomnianym przez Boga zakątku województwa wybucha nowa mikrorebelia. Tylu zdolnych młodych mężczyzn zmarnowało życie w bezsensownym akcie buntu. Mogli być dumnymi członkami społeczeństwa, pracować w kopalniach i przynosić dumę rodzinom. Trudno mi o tym nie myśleć, gdy Paladyni przywlekają kolejną grupę schwytanych dysydentów. Czy to ich wina, że zwiodły ich dziesięciolecia ekopropagandy? Nawet jeśli są straceni, możemy przynajmniej dopilnować, by przyszłe pokolenia nie spotkał ten sam koniec."
BBW_exhausted_stockpiles: "Wyczerpane zapasy"
BBW_exhausted_stockpiles_desc: "Gdzie jest węgiel!? Wydobyliśmy go już tak wiele. Gdzie się podział? Ten przeklęty Dialog zmuszał nas do wysyłania najcenniejszego surowca grupie niekompetentnych głupców, a teraz nigdzie nie można go znaleźć. Dokąd trafił? Nie mogli spalić wszystkiego. Liczby się nie zgadzają, a tego słodkiego smogu jest zdecydowanie za mało, by wyjaśnić takie zużycie. Ukryli go tylko na złość nam? Teraz nasze własne składy są puste, a my nie potrafimy znaleźć tego, co słusznie do nas należy. Dość, wchodzimy w tryb kryzysowy. Nie pozwolę, by choć jedna bryła opuściła nasze granice, dopóki NIE. ODZYSKAMY. TEGO. WĘGLA."
BBW_crawlout_fallout: "Pełznąc przez ruiny"
BBW_crawlout_fallout_desc: "Województwo, do którego wracamy, jest w zupełnie innym stanie, niż je zapamiętaliśmy. Łódzkie zapłaciło cenę za nasz podbój, a większość przemysłu została zniszczona w walkach. By spacyfikować okolicznych watażków, musieliśmy obrócić je w ruinę. I tylko ruinami teraz dowodzimy. Ostatnio zaczęliśmy wysyłać zespoły inżynieryjne wraz z każdym patrolem Paladynów, lecz terytorium nadal nie jest dość bezpieczne, by prowadzić szersze naprawy. W najbliższej przyszłości okolice Bełchatowa będą musiały zaspokajać potrzeby nie tylko własne, lecz całego województwa. Warzecha wyraził się w raporcie bardzo jasno - nie mamy żadnych wolnych zasobów. To katastrofa czekająca na dogodny moment."
BBW_employing_electricians: "Masowe zatrudnianie elektryków"
BBW_employing_electricians_desc: "Sieć jest zniszczona ponad nasze obecne możliwości naprawcze. Dlaczego nie dziwi mnie, że nikt w całym województwie poza nami nie zadał sobie trudu choćby podstawowej konserwacji? Potrzebujemy ludzi jeżdżących z miasta do miasta i naprawiających każdą uszkodzoną linię, a ponieważ wszyscy dostępni elektrycy są już pod obserwacją pod kątem samobójstwa z powodu pogarszającej się rozpaczy, damy im nowych współpracowników, by zmniejszyć obciążenie. Wprowadzimy rosnące limity i co tydzień będziemy zatrudniać kolejnych robotników, aż wreszcie więcej rzeczy będzie naprawianych, niż psujących się po raz trzeci z rzędu."
BBW_conglomerisation: "Konglomeryzacja mniejszych zakładów"
BBW_conglomerisation_desc: "Nie zdołamy zreorganizować sieci energetycznej, jeśli musimy uwzględniać setki mikrofirm, z których każda wytwarza dość prądu, by zasilić mniej więcej jedną trzecią małej wsi. Przez ostatni tydzień codziennie spędzałem około godziny na podpisywaniu malutkich umów z malutkimi ludźmi i ich malutkimi przedsiębiorstwami, z których każde sądzi, że samodzielnie ratuje nas przed Blackoutem, uruchamiając swój żałosny generatorek. Ale jeden megakonglomerat... to byłoby coś. Jak w życiu - niech silni pożerają słabych. A gdy już skończą ucztę, silni otrzymają kontrakt na zasilanie Bractwa."
BBW_protecting_our_assets: "Ochrona naszych aktywów"
BBW_protecting_our_assets_desc: "Nie ma surowca cenniejszego, ważniejszego dla codziennego życia i bardziej niezbędnego do pokrycia potrzeb energetycznych niż węgiel. Partyzanci nie cofną się przed niczym, by zapewnić wieczną ciemność. Te bezwartościowe ścierwa, ci terroryści spróbują zniszczyć to, co najświętsze. Uderzą w nasze złoża węgla. Muszą wiedzieć, jak bardzo od nich zależymy. Tym razem wyprzedzam ich o dwa kroki. Upoważniłem Naczelnego Paladyna Rzymkowskiego do rozmieszczenia znacznej części wojska w celu ochrony kopalń przed wszelką ingerencją z zewnątrz. Praca będzie trwała jak zwykle, a gdy w końcu zaatakują, będziemy gotowi. Nikt nie położy ręki na naszym pięknym węglu. Nikt."
BBW_war_for_tomorrow: "Wojna o bezpieczne jutro
BBW_war_for_tomorrow_desc: "Za każdym razem, gdy przechadzam się ulicami Bełchatowa, widok Paladynów stojących na każdym rogu dodaje otuchy. Być może to tylko moja osobista ochrona, a nawet oni pospiesznie zmieniają się co sto metrów, by załatać wszystkie luki. Wciąż czai się wiele zagrożeń, a jest ich zdecydowanie za mało, by zapewnić nam bezpieczeństwo. Wszyscy zasługujemy, by czuwały nad nami zimne twarze o pustym wzroku najlepszych żołnierzy. Tylko słabi ludzie nie mają bowiem wrogów. Lecz ci wrogowie nigdy nie tkną żadnego członka Bractwa, a jeśli sądzą, że mogą nam zagrozić, pobije ich dziesięciu, nie, stu Paladynów albo tylu, ilu będzie trzeba. Dopiero gdy Paladynów wystarczy na każdą sytuację, będziemy bezpieczni."
BBW_graphene_prototyping: "Prototypowanie grafenu"
BBW_graphene_prototyping_desc: "Od dekady stoimy u progu nowej innowacji opartej na węglu, która mogłaby całkowicie odmienić nauki przemysłowe. Jak zawsze jednak nieustanny lobbing prymitywnych eurofaszystowskich elit zatrzymał dalszy rozwój. W pełni wykorzystana technologia mogłaby poprowadzić nas w przyszłość. Grafen... jakie piękne słowo. Już wyobrażam sobie wszystkie maszyny, które nasycimy grafenowymi komponentami. Wszystkie możliwe zastosowania... tak naprawdę jeszcze żadnych nie wymyśliliśmy, lecz przy wszechstronności tego materiału w końcu odkryjemy sposób, by wdrożyć go do WSZYSTKIEGO."
BBW_electricity_storage: "Masowe magazynowanie energii elektrycznej"
BBW_electricity_storage_desc: "Nie każdej katastrofie da się zapobiec, lecz Bractwo uczy się na błędach. Lokalne przeciążenie nie może zniszczyć całej sieci energetycznej. Bez zabezpieczenia ryzykujemy ponowne pogrążenie województwa w zupełnej ciemności. Teraz, gdy znów wytwarzamy więcej energii niż wynosi przewidywane zużycie, możemy przekierować część nadwyżki do sieci magazynów. Na wypadek, gdyby coś poszło nie tak. Nie stać nas na kolejny Blackout. Blackout... Muszę porozmawiać z Wartownikiem Warzechą. Powinniśmy zbudować jeszcze więcej magazynów. Dwa razy tyle, ile przewidywał pierwotny plan, brzmi rozsądnie."
BBW_sacrifices: "Poświęcenia"
BBW_sacrifices_desc: "W każdym zwycięstwie pozostaje poczucie żalu za tym, co trzeba było utracić, by stało się możliwe. Blackout wymagał ofiar, tego jestem pewien. Ale nigdy nie chcą mi powiedzieć, jak wielu. Warzecha wykorzystuje każdą wymówkę, by uniknąć spotkania, a Gadomski... tak bardzo krąży wokół tematu, że wiem, iż prawda nie jest piękna. Im bardziej ją ukrywają, tym bardziej muszę ją poznać. Pożera mnie to od środka. Nie potrafię skupić się wystarczająco, by napisać choć jeden rozdział. W całym Bełchatowie panuje złowroga cisza. Musiało wydarzyć się coś strasznego. Dlaczego po prostu mi nie powiedzą? Co zrobiliśmy, by wydostać się z tego Blackoutu?"
BBW_budget_void: "Pustka budżetowa"
BBW_budget_void_desc: "Paladyn Gadomski jest już trupem. Albo to najbardziej niekompetentny minister finansów po tej stronie Wisły, albo szpieg wysłany do Bełchatowa, by zniszczyć nasz ruch. Paladyni musieli mnie powstrzymywać, gdy przedstawiał stan budżetu. Jak można niemal doprowadzić całe Bractwo do bankructwa z powodu jakichś problemów energetycznych!? Gdyby Blackout potrwał jeszcze tydzień, wszyscy jedlibyśmy już zgniłe mięso. Niechętnie, na prośbę pozostałych ministrów, dam mu ostatnią szansę na odkupienie win. Nie obchodzi mnie, kogo obedrze ze skóry, by zdobyć pieniądze; jeśli w ciągu trzech miesięcy budżet nie wróci do poprzedniego stanu, będzie wykonywał ciężkie roboty w kopalniach, dopóki nie odpracuje wszystkiego."
BBW_pr_disaster: "Absolutna katastrofa wizerunkowa"
BBW_pr_disaster_desc: "Za każdym razem, gdy popełnimy drobny błąd, szczury wychodzą z nor i podburzają przeciw nam opinię publiczną. Zawsze łatwo krytykować tych, którzy wykonują prawdziwą pracę. Chciałbym zobaczyć, jak oni radzą sobie z czymś takim jak Blackout. Jak bez naszego oddania i zaangażowania w niesienie czarnego światła przemysłu do każdego zakątka terytorium rozwiązaliby ten kryzys? Oczywiście żałośnie padliby na twarz. Problem w tym, że choć podpowiada to Zdrowy Rozsądek, oni i tak będą gadać. Najmniej godni będą osądzać wzorce postępu. W końcu ludzie zmęczą się ich ciągłym narzekaniem."
BBW_media_monopoly: "Zabezpieczanie monopolu medialnego"
BBW_media_monopoly_desc: "Kiedy jeszcze mogli wymyślać niemal dowolne oszczercze brednie w swoich liberalnych gazetach, mówili mi, że jestem wstecznym dogmatykiem. Twierdzili, że mój ruch umrze śmiercią naturalną, że ludzie nas odrzucą. Spójrzcie na nich teraz. Spójrzcie na wszystkich nowych Adeptów próbujących wstąpić w szeregi Bractwa. Kłamali, jak zawsze. Panowie z Berlina płacili najlepiej, więc wszystkie publikacje kontynuowały ataki. Nie możemy pozwolić, by zagraniczna piąta kolumna wślizgnęła się do umysłów naszych pracowitych obywateli. Stworzymy konglomerat medialny, który przekaże im prawdę. Jedyną, właściwą, zatwierdzoną prawdę opartą nie na ideologii, lecz na Zdrowym Rozsądku."
BBW_waste_disposal_zones: "Dodatkowe strefy utylizacji odpadów"
BBW_waste_disposal_zones_desc: "Nieludzka \"postępowa\" ideologia przedstawiała gospodarowanie odpadami jako szczyt cywilizacji. Błąd! (Dlaczego w ogóle muszę tłumaczyć dlaczego?) To same odpady *są* szczytem cywilizacji. Według wszelkich możliwych dowodów ludzie od zawsze lgnęli do brudu. Największe osiągnięcia kulturowe cywilizacji zachodniej powstawały w środowisku pełnym odpadów (nawiasem mówiąc, lewica zniszczyła to słowo). A w epoce przemysłowej odpady przemysłowe stoją najwyżej pośród wszystkich ich rodzajów. Wbrew zmanipulowanym dowodom dzieci do nich lgną. Tworząc więcej stref składowania odpadów, tak naprawdę dbamy o dzieci. Oto ludzka pomysłowość."
BBW_delegalisation_of_forests: "Delegalizacja lasów"
BBW_delegalisation_of_forests_desc: "Powszechnie wiadomo, że lasy sprzyjają słabości. Dopóki starożytni barbarzyńcy siedzieli w lasach, nie potrafili pokonać Rzymian. Gdy tylko z nich wyszli - zniszczyli skorumpowane imperium. Kto ukrywa się w lesie, ten jest nierobem; nie szanuje ciężkiej pracy fizycznej. Woli zbierać jagody jak kobieta albo homoseksualista.\n\nNa szczęście nasza polityka skutecznie zmniejszyła powierzchnię lasów. I to pomimo pozostałości lewicowego ustawodawstwa chroniącego tereny zalesione. Powinniśmy oczywiście działać bardziej zdecydowanie i raz na zawsze zakazać wszelkich kontaktów z lasem oraz zalesiania."
BBW_bypass_safety_regulations: "Pomijanie zasad BHP"
BBW_bypass_safety_regulations_desc: "Tak naprawdę cenię przepisy bezpieczeństwa. Jest jeden, którego osobiście przestrzegam zawsze - w dzień i w nocy, w pracy i w domu. Nazywa się: \"używaj, kurwa, mózgu\". Kropka. Niczego więcej nie potrzeba. Wszystkie pozostałe papiery można wykorzystać jako paliwo do pieca. \n\nWłaściwie cieszy mnie, że każdy idiota, który nie wie, jak uniknąć zmiażdżenia przez przypadkowo przewracający się przedmiot, będzie trzymał się jak najdalej od naszych fabryk - albo otrzyma stosowną odprawę."
BBW_water_purification_stations: "Stacje oczyszczania wody"
BBW_water_purification_stations_desc: "Woda nie potrzebuje wiele, by nadawać się do picia. Twardzi mężczyźni często pili silnie skażoną wodę i jakoś żyli. Niestety gdzieś w epoce postindustrialnej pojawiła się choroba zwana \"czerwonką\". Niechętnie uznałem, że przy większych fabrykach i siedliskach należy zbudować obiekty zapewniające nieco smaczniejszą wodę, by ludzie pozbawieni potężnej flory bakteryjnej mogli ją pić i dalej pracować."
BBW_czech_excavators: "Zakup czeskich planów koparek wielonaczyniowych"
BBW_czech_excavators_desc: "Czesi to rozsądny naród. Nie będę zagłębiał się w to, czy rozsądniejszy od naszego. To znaczy, nie zawsze dobrze być rozsądnym. Nadmiar rozsądku w istocie bardzo zaszkodził Czechom. Stłumił ich ducha narodowego i uczynił bardziej podatnymi na globalistyczną propagandę. Ale nadal potrafią budować koparki wielonaczyniowe, a my nie. I choć odporność na propagandę jest jedną z najrozsądniejszych rzeczy, jakie naród może zrobić, by być naprawdę, prawdziwie rozsądnym (wiecie, o co chodzi), bez gigantycznych koparek wydobywających bogactwo narodowe daleko nie zajdzie."
BBW_invest_in_crypto: "Inwestycje w kryptowaluty"
BBW_invest_in_crypto_desc: "Wszystkie zasoby można podzielić na rzeczywiste - takie jak węgiel, stal, woda i tak dalej - oraz umowne, jak złoto, pieniądz fiducjarny i tym podobne. Wielką przewagą kryptowalut nad innymi zasobami umownymi jest to, że zamieniają zasoby rzeczywiste i materialne w coś zarazem umownego oraz niematerialnego. Nie musimy więc obawiać się fizycznego zniszczenia aktywów, których wartość jest z kolei bezpośrednio związana z ilością zasobów spalonych przy ich produkcji."
BBW_capital_petrol: "Utworzenie Stołecznej Nafty"  
BBW_capital_petrol_desc: "Najwydajniejszym sposobem zarządzania przemysłem naftowym jest jeden ogromny, ściśle związany z państwem koncern o niemal nieograniczonych aktywach i władzy. Oczywiście wszystkie istniejące wcześniej koncerny tego rodzaju były żałośnie skorumpowane, jak Orlen czy Rosnieft. Jest to jednak problem wynikający z natury ich ustrojów. Nasz system rządów jest na to odporny i może urzeczywistnić ideał wielkiego koncernu ze stuprocentową skutecznością."
BBW_currency_based_on_coal: "Waluta oparta na węglu"
BBW_currency_based_on_coal_desc: "Właściwie, kiedy się nad tym zastanowić, zrobienie z węgla waluty może nie być takim złym pomysłem. Wiąże się z surową wartością produkcyjną i odtworzeniową, co pod tym względem stawia go znacznie ponad złotem. Oczywiście płacenie węglem jest trochę niewygodne i może przyczyniać się do spadku jego wartości przez kruszenie oraz brudzenie. Jeśli ktoś będzie cały dzień nosił przy sobie węgiel, zacznie wyglądać jak murz...- to będzie po prostu nieestetyczne i szkodliwe dla gospodarki. Ale bankowość węglowa - to co innego. Już to robimy, więc czemu nie robić tego bardziej?"
BBW_new_cop: "Nowy Centralny Okręg Przemysłowy"
BBW_new_cop_desc: "Podobnie jak z ropą, przemysł działa najlepiej, gdy jest silnie scentralizowany i skupiony. Powinniśmy brać przykład z III Rzeszy, która przez ponad pięć lat utrzymywała wojnę na dwóch frontach ze znacznie silniejszymi wrogami dzięki skoncentrowaniu większości przemysłu w Zagłębiu Ruhry. Nawet gdy część fabryk zbombardowano, centralizacja umożliwiała ich szybką odbudowę i przesunięcie zasobów. \n\nIm więcej ośrodków ma kraj, tym bardziej jest scentralizowany. To wiedza powszechna. Aby pogłębić centralizację, potrzebujemy nowego ośrodka przemysłowego ciągnącego się od Piotrkowa Trybunalskiego po Opoczno. Każda wieś stanie się fabryką, każda droga zaroi się od zasobów płynących do pieców. Centralny Okręg Przemysłowy rozleje się szeroko po całej okolicy."
BBW_expand_infrastructure: "Rozbudowa infrastruktury"
BBW_expand_infrastructure_desc: "Infrastruktura... Tak... Jest bardzo ważna. Niezwykle ważna. Drogi. Rury. Linie energetyczne. Och, zwłaszcza linie. Słupy przesyłowe. Wyglądają wspaniale. Są niezbędne dla krajobrazu. Razem z przewodami i kablami. Och tak. Niczym monumentalne drzewa przemysłu. \n\nW każdym razie to nie moja dziedzina. Niech zaprojektuje je ekspert. Tylko dopilnujcie, by pojął ogrom tego przedsięwzięcia. Nie chcemy żadnych niedociągnięć."
BBW_prepare_area: "Przygotowanie terenu"
BBW_prepare_area_desc: "Nie da się zrobić omletu bez rozbicia kilku jajek. A może się da. Chwila, coś sprawdzę. Dobrze, może jeśli zrobię tutaj małą dziurkę... och, rozbiłem. Jeszcze raz. Tutaj... Dobra, cieknie... Jeszcze chwila... W porządku, udało się. Wszystko jest na zewnątrz i... co teraz? Szczerze, ja... Eee... Jak to się robiło? Omlet? No więc, wiecie, od dawna nie gotowałem i... och, nieważne. Może naprawdę trzeba rozbić jajko, żeby zrobić omlet. Kogo to obchodzi. \n\nTak czy inaczej pozbądźcie się tych chat i mieszkających w nich ludzi, przenieście ich gdziekolwiek. Potrzebujemy placu budowy dla naszego Centralnego Okręgu Przemysłowego."
BBW_shift_industry: "Przekształcanie przemysłu"
BBW_shift_industry_desc: "Wolałbym mieć kilka ośrodków naraz (pamiętając, jak działa centralizacja), ale trzeba pracować z tym, co się ma. Na razie musimy przygotować część zakładów do jak najszybszego przeniesienia do nowego Centralnego Okręgu Przemysłowego, by przedsięwzięcie otrzymało lepszy start. Gdy koła zębate ruszą, znacznie łatwiej będzie wznosić kolejne obiekty - i przekonać wszystkich, że mieliśmy rację."
BBW_begin_construction: "Rozpoczęcie budowy"
BBW_begin_construction_desc: "Za komuny wielkie projekty tak zwanego socjalizmu otwierane były z wielką pompą oraz w stanie totalnego rozkładu pokrytego kartonem i czerwonymi flagami powiewającymi wszędzie. W obecnych czasach, zaledwie przyznajemy że dopiero rozpoczynamy budowę. Co więcej - celebrujemy to! Przyjdę tam, przetnę wstęgę, posłucham orkiestry górniczej i zjem trochę grochówki. I tak to leci."
BBW_cop_military_zone: "Strefa Przemysłu Zbrojeniowego"
BBW_cop_military_zone_desc: "Niezbędnym elementem każdej strefy przemysłowej są fabryki wojskowe. Wyznaczono specjalistyczną strefę produkcji amunicji, by ogromny potencjał COP-u można było przekształcić w siłę wojenną przy minimalizacji ryzyka zbędnych eksplozji."
BBW_expand_zpw_sommer: "Rozbudowa ZPW im. Paladyna Tomasza Sommera"
BBW_expand_zpw_sommer_desc: "Zgodnie z modelem rozwoju COP-u większość produkcji broni strzeleckiej zostanie umieszczona w znacznie rozbudowanych Zakładach Przemysłu Wojennego Paladyna Sommera. Taki obiekt będzie w stanie samodzielnie zaspokoić potrzeby większości naszych dywizji piechoty. Kolejne zwycięstwo centralizacji."
BBW_cop_energetic_zone: "Strefa Przemysłu Energetycznego"
BBW_cop_energetic_zone_desc: "Stale rosnący Centralny Okręg Przemysłowy potrzebuje coraz więcej energii elektrycznej. Wyznaczyliśmy sektor wytwarzania energii, w którym powstanie cała infrastruktura potrzebna wyłącznie do tego celu. Ogromne elektrownie będą tłoczyć prąd, by przemysł żył i pracował bez przerwy."
BBW_central_electrical_eq_factory: "Budowa Centralnej Fabryki Sprzętu Elektrycznego"
BBW_central_electrical_eq_factory_desc: "Najlepszym miejscem do tworzenia urządzeń elektrycznych jest miejsce, w którym produkuje się zasilającą je energię, dzięki czemu można wyjść z fabryki i podłączyć je od razu do elektrowni obok. Dlatego produkcję elektryki skupimy w gigantycznej fabryce pośrodku strefy energetycznej. Ograniczy to straty występujące podczas przesyłu energii, dając użytkownikom wielką przewagę materiałową i finansową. Taka innowacja jest koncepcją całkowicie obcą rzekomo \"zielonej\" Unii Europejskiej."
BBW_cop_mining_zone: "Strefa Przemysłu Górniczego"
BBW_cop_mining_zone_desc: "W miarę rozwoju Centralny Okręg Przemysłowy pochłania coraz więcej zasobów, z których najważniejszym jest oczywiście węgiel. Osobny kompleks górniczy powinien dostarczyć Okręgowi możliwie największe ilości surowca, jednocześnie eliminując potrzebę budowy infrastruktury pośredniej. Podobnie fabryki sprzętu górniczego powinniśmy umieścić tuż obok kopalń."
BBW_create_lzg_machinery_complex: "Stworzenie Kombinatu Ciężkiego Sprzętu ŁZG"
BBW_create_lzg_machinery_complex_desc: "Gdy nasz przemysłowy klejnot ruszy pełną parą, przyjdzie czas wyciągnąć wielkie działa. Przekształcimy ŁZG Łęczyca w zakłady najcięższego przemysłu, zdolne budować najpotężniejsze dostępne maszyny górnicze i przemysłowe, niezbędne, jeśli mamy stać się przemysłową potęgą według światowych standardów."
BBW_temporary_migration_camps: "Tymczasowe obozy dla migrantów"
BBW_temporary_migration_camps_desc: "Zniszczenia po Upadku i nagły napływ ludzi do większych miast postawiły mnie w bardzo niewygodnej sytuacji. Choć chętnie przyjęlibyśmy ich wszystkich z otwartymi ramionami w Bełchatowie lub Łodzi, pozwalanie tym ludziom wałęsać się bez celu po ulicach i sprawiać, że miasto wygląda zwyczajnie gorzej, jest fatalnym pomysłem.\n\nDlatego na razie damy im tymczasowe schronienie, bezpiecznie poza miastami. Otrzymają... zdatne do życia warunki. Umieszczenie wszystkich w jednym miejscu ułatwi nam także wyłapanie czarnych owiec próbujących niezauważenie dostać się do miast."
BBW_smog_countermeasures: "Środki przeciwsmogowe"
BBW_smog_countermeasures_desc: "Jedną z nielicznych wad smogu jest to, że fatalnie ogranicza widoczność. Jeśli ledwie widzę człowieka po drugiej stronie średniej szerokości alei, jak mamy oczekiwać, że sterowce skutecznie odnajdą cele z wysokości setek metrów? Na szczęście piloci nie muszą polegać wyłącznie na wzroku. Wykrywanie radarowe i pociski naprowadzane na ciepło pozostają w pełni użytecznymi technologiami; wystarczy na ślepo wprowadzić samoloty w zasięg, a one zrobią resztę. Możemy spodziewać się niemal równie skutecznego rażenia celów, jakby smogu w ogóle nie było, z drobnym skutkiem ubocznym: możemy przypadkiem zbombardować jedno z własnych miast."
BBW_militarisation_of_airships: "Militaryzacja sterowców"
BBW_militarisation_of_airships_desc: "Żadna maszyna latająca nie dorównuje potędze prawdziwego sterowca. To tragedia, najpewniej wynik jakiegoś globalistycznego spisku, że te powietrzne tytany przestały być używane w walce. Jak mamy budzić grozę, skoro nie potrafimy nawet zawiesić gigantycznego uzbrojonego balonu nad terytorium wroga? Inżynierowie ostrzegali mnie, że tak wielki cel łatwo zestrzelić, więc rzuciłem im wyzwanie: spróbujcie przebić mój sterowiec. Mogli nawet trafić go jak był na ziemi. Żaden się nie odważył. Tak wielki strach wzbudzają te bestie. Teraz rzucam to samo wyzwanie naszym wrogom. Spróbujcie."
BBW_central_military_airport: "Centralne Lotnisko Wojskowe w Łasku"
BBW_central_military_airport_desc: "Teraz, gdy mamy prawdziwe siły powietrzne, nie przystoi wypuszczać naszych dzieł z prowincjonalnych lądowisk i zapuszczonych hangarów. Potrzebujemy węzła będącego ucieleśnieniem naszej potęgi, zdolnego koordynować nieustanny rój dronów i sterowców. Paladyn Rzymkowski niedawno wrócił do mnie z doskonałym planem - centralnie położone miasto Łask ma zasięg i warunki potrzebne do zbudowania ogromnej bazy lotniczej, która stanie się głównym ośrodkiem operacyjnym. Jest tylko jedno zastrzeżenie: potrzebne finansowanie. Ten jeden raz, dla dobra Bractwa, pozwolę mu wydać tyle, ile zechce."
BBW_warta_steam_shipyard: "Warciańska Stocznia Parowa"
BBW_warta_steam_shipyard_desc: "Tramwaje parowe były prototypem, który dowiódł, że napęd parowy jest opłacalnym rozwiązaniem dla wielkich maszyn. Skoro jest tak tani i niezawodny, czemu nie uczynić z pary podstawy naszej marynarki? Zanim jednak się rozpędzimy, potrzebujemy prawdziwego miejsca do budowy okrętów. Badanie gruntu u ujścia Warty ujawniło teren potencjalnie dość szeroki i stabilny, by wodować większość klas jednostek. Wystarczy, że podpiszę dekret, a ziemia zostanie zarekwirowana pod pierwszą stocznię godną naszych ambicji."
BBW_coal_barges: "Przerabianie barek węglowych"
BBW_coal_barges_desc: "Jeśli mamy władać rzekami, nie możemy ograniczać się do zastosowań wojskowych. Tam, gdzie zawodzi inna infrastruktura, możemy transportować duże ilości węgla albo wszelkich mniej ważnych materiałów polską siecią rzeczną. Dzięki temu nasza potęga przemysłowa dotrze nawet do najodleglejszych zakątków kraju i przekształci je zgodnie z naszą wizją. A gdy wezwie wojna, zarekwirujemy barki i załadujemy na nie coś jeszcze cenniejszego - żołnierzy Bractwa, którzy zaniosą tę wizję na niepodbite ziemie. Gdy skończą, barki znów popłyną dalej..."
BBW_steam_submarines: "Parowe okręty podwodne"
BBW_steam_submarines_desc: "Od rozpoczęcia programu morskiego fascynuje mnie idea okrętów podwodnych napędzanych parą. Nie potrafiłem jej rozgryźć; na poziomie morza wszystko działa, lecz pozostaje jeden problem - dokąd trafia para po zanurzeniu? Nie można wypuścić jej do wody, bo to ułatwia wykrycie. W końcu wybrałem kompromis. Jeśli para będzie odprowadzana do szczelnej komory, okręt zdoła działać pod wodą przez krótki czas, zanim wynurzy się i uwolni nagromadzoną parę. Gdyby coś poszło nie tak, a załoga zaczęła gwałtownie się dusić, w sterowni znajdzie się wielki, wygodny przycisk natychmiastowego wynurzenia."
BBW_armored_steamships: "Opancerzone statki parowe"
BBW_armored_steamships_desc: "Nasze dotychczasowe eksperymenty morskie są obiecujące, więc zacząłem się zastanawiać: czemu nie zbudować tego samego, tylko na większą skalę? Duma marynarki - pancernik tak wielki, że zatamuje każdą rzekę, po której będzie pływać. Po namyśle może to być jednostka wyłącznie morska. Ale to również nic złego - Bractwo musi zacząć myśleć globalnie. Wkrótce staniemy się graczem na światowej scenie, więc także nasze marzenia muszą odpowiednio urosnąć. Gigantyczne, oceaniczne świadectwo tego, że napęd parowy jest przyszłością, to właściwy kolejny krok rozwoju, a zarazem piękny i hipnotyzujący widok."
BBW_specforces_department: "Wydział Sił Specjalnych"
BBW_specforces_department_desc: "Bractwo prowadzi nieustanną wojnę z naturą, dlatego musimy być gotowi na wszystko, co może przeciw nam rzucić. Nie jest to zadanie dla pierwszego lepszego rekruta. Potrzebuję najtwardszych, najpodlejszych, nienawidzących roślin i kochających węgiel weteranów, którzy bez pytania rzucą się prosto w ogień, by realizować naszą misję. Wszyscy członkowie Kultu Kuźni, których wcześniej uznaliśmy za zbyt fanatycznych, by przyjąć ich do armii? Cóż, mam dla nich idealną pracę. Jeśli chcą dowieść swej wartości przed czcigodnym Starszym, och, będę patrzył."
BBW_coaldivers: "Węglonurkowie"
BBW_coaldivers_desc: "Proszę każdego potencjalnego czytelnika tego dziennika, by wyobraził sobie następującą scenę: jesteś plugawym ekofaszystą wpatrzonym w ciemniejące niebo. Chmura gęstego smogu zatyka ci płuca, walczysz o każdy oddech. Kaszlesz, po czym spoglądasz w górę i widzisz potężną opancerzoną postać przebijającą ciemność podczas opadania. Zanim zdołasz zareagować, mierzy do ciebie z broni. Moje pytanie brzmi: poddajesz się? Oczywiście, że tak, lecz tylko dlatego, drogi czytelniku, że jesteś racjonalnym człowiekiem. Nie możemy oczekiwać tego samego od ideologicznie zaślepionych wrogów. Rozumieją jednak siłę, a my spadniemy na nich z całą siłą potrzebną, by zmusić ich do kapitulacji."
BBW_coalmarines: "Węglowi Marines"
BBW_coalmarines_desc: "Szturmowanie przyczółka pod ciężkim ostrzałem wymaga szczególnego rodzaju determinacji, wręcz oddania. Trzeba wierzyć, że z jakiegoś powodu kule cię ominą, albo po prostu nie dbać, czy trafią. Większa część skuteczności żołnierza piechoty morskiej tkwi w jego psychice. Mogę zapewnić im teatralną oprawę - osobiście namaszczę każdego wyruszającego na misję węglowymi barwami wojennymi i wręczę mu własną księgę ochronnych rytuałów. Ruszą naprzód, wiedząc, że są odporni na broń wroga, a jeśli któryś polegnie, cóż, po prostu niewłaściwie odprawił rytuały."
BBW_battle_carbon: "Stymulanty z węgla aktywowanego"
BBW_battle_carbon_desc: "Powszechnie uznanym faktem jest, że węgiel stanowi podstawę wszelkiego życia. Tak jak w skali makro, napędza nasze wewnętrzne elektrownie, te znajdujące się w komórkach, i utrzymuje światło w naszych ciałach. Czasami w sytuacjach wielkiego stresu i zmęczenia, na przykład na polu bitwy, grozi nam wypalenie zapasów. Nie chcemy, by żołnierze doznawali mini-Blackoutu, więc zawsze zapewnimy im zaopatrzenie - blister tabletek ze stuprocentowo czystym węglem aktywnym, który podtrzyma działanie organizmu nawet w najcięższych warunkach walki. Hm, może sam powinienem zacząć go suplementować. Ostatnio jestem zdecydowanie zbyt zmęczony. To musi być brak węgla."
BBW_graphene_implants: "Grafenowe implanty bojowe"
BBW_graphene_implants_desc: "Niech wątpiący sczezną; oczywiście, że grafen był wartościową inwestycją. W końcu można go użyć do WSZYSTKIEGO. Dla jasności oszczędzę potencjalnym czytelnikom nauki i skupię się na zastosowaniach bojowych. Najlepsi chirurdzy Bractwa wszczepią cienką grafenową siatkę pod naskórek każdego nowego rekruta. Ten zaskakująco wytrzymały implant zapewni kompleksową ochronę przed każdym urazem fizycznym, rozprowadzając energię kinetyczną po całej sieci. Choć miękki w dotyku, materiał stwardnieje pod wpływem silniejszych bodźców, zapewniając zarówno mobilność, jak i wytrzymałość. Wszystko dzięki potędze węgla; żadnej nierealistycznej nanotechnologii."
BBW_coalmissars: "Zaciąg Komisarzy-węglarzy"
BBW_coalmissars_desc: "Prawdziwy Paladyn prowadzi własnym przykładem i właśnie tego oczekuję od komisarzy. Nie ma chwały w wydawaniu rozkazów z pomieszczeń sztabowych. Idee ścierają się i umierają na polu bitwy, więc jeśli ktoś twierdzi, że wyznaje ideał Bractwa, lecz boi się wyjść i o niego walczyć, nie dopuszczę go w pobliże MOJEGO ruchu. Gdybym był kilka lat młodszy, sam bym tam poszedł i gołymi rękami pokonał wiechowców. Ci świeżacy... mają ogromne szczęście żyć w najwspanialszych czasach i walczyć za Bractwo... lepiej, żeby zaczęli to doceniać."
BBW_flamer_corps2: "Ponowne stworzenie Korpusu Ogniomistrzy"
BBW_flamer_corps2_desc: "Były takie czasy, wspaniałe czasy, kiedy przeciw umocnieniom wroga występowaliśmy z ogniem i siarką. Potem wszystko poszło w diabły, jak to zwykle bywa. Nadszedł Blackout i nagle trzeba było przejmować się takimi rzeczami jak opłacalność, więc jednostkę odstawiono na bok. Ach, byliśmy wtedy znacznie słabsi, lecz widok w pełni opancerzonego Paladyna szarżującego przez ścianę piekła nadal budził grozę w oczach wrogów. Ziemia również zmieniała się w ruinę, spalona w stworzonym przez nas ogniu piekielnym, och, ich cenna zieleń, płakali ocaleni. Teraz wreszcie mamy fundusze, by ich przywrócić, a ja już ustawiam się w kolejce do wypróbowania jednego z ulepszonych miotaczy ognia."
BBW_human_potential: "Potencjał istoty ludzkiej"
BBW_human_potential_desc: "Granice biologiczne to pojęcie stworzone przez tchórzliwych neoluddystów, którzy nieustannie boją się utraty człowieczeństwa. Człowieczeństwo... to właśnie nieograniczony potencjał czyni nas ludźmi. Jesteśmy kolejnym krokiem ludzkiej ewolucji, przesuwamy granice, doskonalimy ciała, a gdy nam to odpowiada, włączamy dzieła technologii przemysłowej do naszych niedoskonałych form. Ci, którzy to odrzucą, pozostaną w tyle jako przestarzała skamielina przemijającej epoki. My zaś będziemy rosnąć, aż trudno będzie rozpoznać w nas dawnych siebie. Spróbujcie za tym nadążyć, słabeusze."
BBW_18_wheels_of_steel: "Królowie szos"
BBW_18_wheels_of_steel_desc: "Kiedy się nad tym zastanowić, ciężarówka jest prawie jak czołg, jeśli spojrzeć na nią we właściwy sposób - tylko bardziej masywna, a masywność zwykle oznacza wytrzymałość. Obłożymy je dodatkowo płytami pancerza, zamontujemy działa na części ładunkowej, dodamy jeszcze więcej pancerza, żeby nie było wiadomo, gdzie kończy się ciężarówka, a zaczyna opancerzenie, dorzucimy armatę, bo czemu nie, i poślemy to ustrojstwo z pełną prędkością prosto w linię wroga. Jeśli jedną zestrzelą (powodzenia), wyślemy sto kolejnych pędzących każdą autostradą z rozkazem, by nie zatrzymywały się, dopóki nie skończy im się paliwo albo nie wbiją się w przywódcę wroga. Tyle taktyki nam wystarczy."
BBW_smog_weaponisation: "Bojowe wykorzystanie smogu"
BBW_smog_weaponisation_desc: "Niedawno byłem gościem honorowym konferencji zorganizowanej przez Towarzystwo Postępu Medycznego Bractwa. Większość wykładów była śmiertelnie nudna, lecz jeden zapadł mi w pamięć. Najwyraźniej, według bardzo wiarygodnych danych, smog jest z natury całkowicie bezpieczny do oddychania i zapewnia wiele korzyści zdrowotnych, ale szkodzi, a nawet zabija osoby nieprzyzwyczajone do jego wysokiego stężenia. Te słowa podsunęły mi pomysł: gdybyśmy potrafili skondensować smog, a potem taktycznie rozpylić go nad hordami wroga, zyskalibyśmy broń chemiczną niszczącą ich słabe płuca, podczas gdy nasi żołnierze nie zauważyliby żadnej różnicy względem zwykłego bełchatowskiego poranka."
BBW_equality_act: "Ustawa równościowa"
BBW_equality_act_desc: "Nasi wrogowie sądzą, że skoro nie słuchamy ich szalonych pomysłów na energetykę, nie mamy ludziom niczego do zaoferowania w zamian. To oczywista nieprawda. Tak samo mówią, \"oceniając\" nasze stanowisko wobec homoseksualizmu i praw kobiet. Znów się mylą. To, że nie popieramy marksistowskiego, rewolucyjnego i czysto politycznego ruchu LGBT, który nie ma nic wspólnego z prawdziwymi interesami homoseksualistów, nie znaczy, że mamy coś przeciwko ludziom odmiennym od nas. Witamy wszystkich i oferujemy alternatywę - geje nie muszą już być moralnie szantażowani, by wstępować do kultu LGBT dla mięczaków. Mogą wyrażać siebie i tworzyć inne kluby celebrujące męskość oraz siłę. Nikt nie będzie już zmuszał ich do ulicznego ekshibicjonizmu. Nasza metoda zapewni im od dawna odmawianą prywatność w ciemności kopalń, gdzie wszyscy są naprawdę równi."
BBW_brotherhood_media_council: "Rada Mediów Bractwa"
BBW_brotherhood_media_council_desc: "Media wymagają czegoś więcej niż tylko dopilnowania, by wydawcy odpowiedzialnie korzystali z wolności słowa. Nowe lokalne agencje informacyjne składają wnioski o włączenie do medialnej machiny Bractwa i ktoś musi dać im zielone światło. Potrzebna jest również rozległa redakcja, która dopilnuje, by lokalne oddziały dostarczały najlepsze możliwe materiały zgodne z naszą polityką. Potrzebujemy centralnego organu monitorującego i informującego wszystkie komórki złożonego organizmu, jakim jest Bractwo. Nie możemy pozwolić, by anarchia informacyjna dezorientowała ludzi polegających na nas jako źródle wiadomości."
BBW_forge_cult: "Formalizacja Kultu Kuźni"
BBW_forge_cult_desc: "Górnicy i żołnierze pracują tak niestrudzenie, że stworzyli społeczeństwo równoległe do tego, w którym żyją zwykli cywile. Mają własny język, obyczaje, a nawet praktyki religijne. Niektórzy mieszkańcy powierzchni próbują ich naśladować. Ale nie wszyscy. Nie możemy dopuścić do rozłamu społeczeństwa ani ryzykować, że Rycerze i górnicy wymyślą jakąś herezję. Najwyższy czas skodyfikować zasady nowo narodzonego Kultu Kuźni. Musimy dopilnować, by właściwie czcił górnicze rzemiosło, a zarazem nie oddalał się zanadto od katolickiej ortodoksji. W tym celu podkreślimy znaczenie świętych - takich jak św. Barbara, św. Kinga i św. Klemens - oraz będziemy głosić, że ogień kuźni oczyszcza grzechy złoczyńców."
BBW_network_brigades: "Inwestycje w Sieciowe Oddziały Propagandy"
BBW_network_brigades_desc: "Kult Kuźni, nasza gazeta, nasza wizja i cnoty. Z tego jesteśmy dumni. To należy rozpowszechniać. Propaganda jednego człowieka jest edukacją drugiego, a nasze brygady sieciowe będą wykładowcami na pierwszej linii, z Polską w roli ucznia. Ich niestrudzone, nieustanne krzyki przez głośniki, żarliwe przemówienia oraz identyfikacja i nasycanie grup podatnych na działalność wywrotową - oto siła napędowa każdego racjonalnego przekazu."
BBW_progress_day: "Celebrowanie Dnia Postępu"
BBW_progress_day_desc: "Wkrótce nadejdzie Dzień Postępu. Jako Starszy Bractwa Węgla pragnę zaprosić wszystkich sympatyków do Bełchatowa na uroczystości. Tegoroczne obchody będą wyjątkowe, odzwierciedlając nasze niedawne sukcesy w nieustannym jednoczeniu Polski. Uczestnicy mogą spodziewać się licznych atrakcji dla całych rodzin, gier, koncertów i wykładów najwybitniejszych członków Bractwa. Będzie można zwiedzać górnicze tunele, rezerwować w nich noclegi oraz wypróbować prawdziwą broń naszych Paladynów. Rezerwujcie już dziś, ponieważ liczba miejsc jest ograniczona. Jeśli nie uda wam się w tym roku, bez obaw. Każdy następny Dzień Postępu będzie jeszcze wspanialszy!"
BBW_coal_depots: "Wyczerpanie magazynów węgla"
BBW_coal_depots_desc: "Coraz więcej kopalń informuje, że kopią dalej, lecz pod ziemią znajdują wyłącznie czystą skałę. Niepokojące, ale to nas nie zatrzyma. Polska ma dość węgla na kolejne tysiąc lat. Muszą kopać głębiej albo znaleźć nowe złoża w ojczyźnie. Nie chcę słyszeć żadnych wymówek. Nie ma nic ważniejszego niż dalsze funkcjonowanie naszej sieci energetycznej. O ile to, co mówią, jest w ogóle prawdą. Wiecie, co ja myślę? Dyrektorzy kopalń coś przed nami ukrywają i sprzedają nasz węgiel na czarnym rynku albo są po prostu marnotrawni i niedbali. Może ich podwładni się obijają. Odpowiedni nadzór powinien rozwiązać większość tych niedoborów."
BBW_crop_cascade: "Kaskadowa zapaść zbiorów"
BBW_crop_cascade_desc: "Niektóre raporty wskazują, że z jakiegoś powodu nasze uprawy zawodzą. To nie ma żadnego sensu. Rośliny żywią się dwutlenkiem węgla, a produkujemy go więcej niż jakikolwiek naród na ziemi. Rosnące temperatury powinny oczywiście uczynić nasz klimat bardziej przyjaznym tradycyjnym roślinom, a także ułatwić wprowadzanie egzotyczniejszych, takich jak winorośl. Coś tu śmierdzi. Najpewniej staliśmy się celem sabotażu Zielonych Sił, które postanowiły na złość nam zatruć tak wysoko cenione przez siebie rośliny. Nawet ich własne idee nie są dla nich święte. Zwyciężymy i pokażemy im daremność tego ataku."
BBW_new_food: "Nowe metody produkcji żywności"
BBW_new_food_desc: "Dowiedliśmy już, że potrafimy wyżywić ludność bez niedorzecznego wywyższania warzyw w diecie. Mięso jest wszystkim, czego potrzebujemy, by rosnąć w siłę i stawiać czoła zarówno przeciwnikom, jak i bezlitosnym głębinom kopalń. Niektóre rośliny są jednak konieczne. Potrzebujemy pieprzu do wszelkich potraw, ostrego czosnku i papryki. Wyobrażacie sobie wątróbkę bez cebuli? A słodycz śliwki przełamującą słony smak schabu? Nie zacznę nawet o rozmaitych ziołach. Nawet jeśli zdrowa dieta ich nie potrzebuje, nadal musimy je uprawiać. Pomożemy im zwalczyć ekologiczną truciznę, którą nas zaatakowano, i przystosować się, sięgając głęboko w ich DNA. Roślinność od zawsze dostosowywała się do ciężkich warunków; jeśli możemy przyspieszyć ten naturalny proces, zrobimy to."
BBW_secret_convoys: "Tajne konwoje surowcowe"
BBW_secret_convoys_desc: "Dobrze, okazuje się, że część... większość doniesień o wyczerpaniu złóż była prawdziwa i nie wynikała ze złego zarządzania. Niepokojące. Wiem jednak na pewno, że pod ziemią jest więcej węgla, więc niech lepiej szukają dalej. Znalezienie i uruchomienie nowych kopalń wymaga czasu, dlatego na razie będziemy musieli zdobyć alternatywne źródło surowca. Możemy nawet wrzucić część importowanego węgla do naszych kopalń, by podnieść morale górników. To wszystko jest tylko tymczasowe. Gdy uruchomimy nowe miejsca wydobycia, zatrzymamy konwoje. Ich istnienie pozostanie więc tajemnicą, by nie niepokoić ludności przejściowymi trudnościami."
BBW_absolute_silence: "Absolutna cisza"
BBW_absolute_silence_desc: "Słyszycie to? Ja też nie. Żadnych zmartwionych jajogłowych z ich kretyńskimi raportami. Żadnych alarmów o surowcach. Każdy może znaleźć pracę w górnictwie albo przemyśle, a potem zjeść smaczną kolację. Żadna podekscytowana zagraniczna gazeta nie ośmiela się sugerować kolejnego nadciągającego upadku. Żaden górnik nawet nie myśli o strajku. Nie ma żadnego obiektywnego powodu do zdenerwowania. Wciąż są tacy, którzy próbują siać niezgodę w narodzie, lecz skoro nie mają ku temu powodów, muszą być zagranicznymi agentami. Zajmę się nimi... ale później. Teraz cały naród i ja zasługujemy na odpoczynek po dobrze wykonanej pracy."
BBW_resource_plan: "Centralny Plan Surowcowy"
BBW_resource_plan_desc: "W miarę rozszerzania naszych wpływów stałe dostawy węgla i innych surowców stają się oczywiście problemem coraz pilniejszym z każdym dniem zwłoki. Im dłużej Gadomski krąży wokół pomysłu, a Warzecha marudzi, tym większą mam ochotę zamknąć ich razem w pokoju i patrzeć, jak walczą kilofami na śmierć i życie, skoro obaj są tacy mądrzy.\n\nNiestety droga naprzód wiedzie przez kopalnie, a kopalnie nie pojawią się z niczego, choć bardzo chciałbym, żeby tak było. Potrzebny jest plan podziału zgromadzonych funduszy pomiędzy rozwiązania górnicze...\n\nMoże więc zamknięcie ich razem w pokoju nie jest aż tak złym pomysłem."
BBW_charter_local_deposits: "Koncesjonowanie lokalnych depozytów"
BBW_charter_local_deposits_desc: "Pomimo urażonej dumy Warzecha i Gadomski doszli do pewnego porozumienia w sprawie pozyskiwania surowców. Województwo ma jeszcze sporo obszarów, które można oczyścić pod wydobycie węgla brunatnego, a niektóre leżą niebezpiecznie blisko nic nieznaczących wsi. Nikt za nimi nie zatęskni - o ile w ogóle usłyszy o ich losie."
BBW_smaller_deposits: "Ku mniejszym złożom"
BBW_smaller_deposits_desc: "Jak zdaje się już nakazywać tradycja, kolejne wsie stoją na drodze postępu. Miejsca, których nikt nie potrafiłby odnaleźć na mapie, skrywają pod skorupą tak wspaniały potencjał. To naprawdę smutne życie, pośrodku niczego, wśród mgły i błota. Z wielką radością przyjmiemy ich w Bełchatowie, gdzie czekają nowe, ciepłe i bezpieczne bloki mieszkalne. Przynajmniej na tych, którzy przyjdą dobrowolnie."
BBW_procure_equipment: "Zamówienia na sprzęt"
BBW_procure_equipment_desc: "Rozszerzenie zdolności wydobywczych wiąże się z problemami, które naprawdę należało przewidzieć wcześniej. Po stratach poniesionych podczas Blackoutu i wskutek zwykłego przeciążenia nasza flota koparek oraz wszelkiego innego sprzętu górniczego nie jest w stanie obsłużyć wszystkich nowych miejsc wydobycia. Pomysł wysłania do pracy tysięcy górników uzbrojonych wyłącznie w kilofy jest bardzo kuszący, ale to również niezwykle niewydajny sposób pozyskania tego, czego potrzebujemy. Projekty będą niestety musiały poczekać, aż Gadomski ogarnie ten burdel."
BBW_grand_opening: "Wielkie otwarcie kopalń"
BBW_grand_opening_desc: "Moje stare kości naprawdę nie nadają się do tras na taką skalę. Podróż po całym województwie, by odwiedzić każdą nowo otwartą kopalnię, przeciąć wstęgę i pleść o potędze Bractwa, była pomysłem Warzechy na rozbudzenie w robotnikach silnego zapału do pracy. Ostatecznie zapewniło to mnie, jemu i Gadomskiemu ból pleców, który będziemy musieli leczyć przez następny tydzień.\n\nPrzynajmniej wydobywamy teraz więcej własnego węgla."
BBW_metropolisation: "Dwa klejnoty w koronie"
BBW_metropolisation_desc: "Bełchatów był naszym pierwszym i najdumniejszym eksperymentem. Tramwaje parowe przecinają miasto, łącząc każdą dzielnicę w dobrze naoliwioną, zoptymalizowaną maszynę. Koła zębate i serwomechanizmy tykają oraz obracają się dniem i nocą. Ciężko pracują, by podtrzymać nieugięty marsz postępu.\n\nŁódź stała się drugim miastem, na którym skupiliśmy wzrok. Starsza siostra Bełchatowa, pełna potencjału, lecz nieokrzesana z braku dyscypliny. Ukształtowanie jej w formę zwracającą uwagę na jej... atuty wymaga nieco pracy. \n\nRamię w ramię oba miasta pomaszerują w przyszłość, a człowiek poprowadzi ich równym krokiem naprzód!"
BBW_artisan_apartments: "Rzemieślnicze bloki mieszkalne"
BBW_artisan_apartments_desc: "Musimy coś zrobić z ruinami w Łodzi. Podczas wojen po upadku Dialogu miasto to mocno ucierpiało. Nie no, tak naprawdę to miało bardzo dużo ruin już przed samym Upadkiem. Chociaż trzeba przyznać że w Bałutach niewiele się zmieniło od tamtego czasu, nawet pomimo eksplozji nuklearnej. Kiedyś to miała być ziemia obiecana, centrum polskiego przemysłu. A potem socjalizm z neoliberalnym kapitalizmem dobiły całkowicie Łódź. Trzeba więc usunąć ten cały gruz i zbudować coś co będzie trwalsze niż ze spiżu. Na szczęście mam do tego odpowiedniego człowieka z odpowiednim CV. Robert Konieczny. Jeśli ktoś by nie wiedział, to pomyślałby że nasz wydział propagandy wymyślił tego człowieka. Pochodzi z Katowic, tworzy wspaniałe brutalistyczne budowle, urodził się w Barbórkę a jego dom rodzinny został zniszczony przez szkody górnicze. Dając mu wolną rękę, Łódź zmieni się nie do poznania."
BBW_belchatow_lodz_high_speed: "Kolej dużych prędkości Bełchatów-Łódź"
BBW_belchatow_lodz_high_speed_desc: "Bełchatów odwiecznie miał problem z połączeniem kolejowym z centrum województwa. A raczej jego kompletnym brakiem. Nasze dwa największe ośrodki miejskie muszą być połączone najlepszym i najszybszym węzłem kolejowym na jaki nas obecnie stać. Kojarzycie może taki przedwojenny pociąg - Luxtorpedę? Ten cud inżynierii jeździł szybciej pomiędzy miastami niż większość kursów przedupadkowych. To świadczy tylko źle o państwowych kolejach, ale my zbudujemy taką kolej wielkich prędkości że z Bełchatowa do Łodzi będziemy jechali może 40 minut maksymalnie. I to w luksusie!"
BBW_ever_closer_to_moloch: "Coraz bliżej Molocha"
BBW_ever_closer_to_moloch_desc: "Wielu przybywających do Bełchatowa szuka zatrudnienia w Elektrowni albo otaczających ją kopalniach. To naturalne, że plany urbanizacji dążą do skrócenia czasu podróży między mieszkaniem a pracą. Szybsze dojazdy oznaczają wydajniejsze wykorzystanie czasu robotników. Im szybciej dotrą do pracy, tym wcześniej będą mogli wrócić do domu i odpocząć na miękkich kanapach. Majestatyczny widok odkrywek węgla i przemysłowej zabudowy jest czymś, za co wielu dałoby się pokroić."
BBW_incentives_for_businessmen: "Zachęty dla przedsiębiorców"
BBW_incentives_for_businessmen_desc: "Podstawą funkcjonującego miasta jest jego krwiobieg czyli przedsiębiorcy. Bez nich miasto to tylko kilka ściśniętych klatek hodujących ludzi którzy nie mają żadnego celu oprócz konsumpcji. W Bełchatowie i Łodzi oczywiście zawsze istniał mocny przemysł, ale nie do końca taki w który byśmy celowali obecnie. Bełchatów potrzebuje więcej zakładów w samym mieście, a Łódzka gospodarka musi być odbudowana po wielu upadkach, w tym Blackoucie który spustoszył niektóre zakłady. Ale żeby to osiągnąć, będziemy musieli jakoś zachęcić inwestorów i ludzi którzy gotowi są otworzyć nowy biznes...ja tak bardzo nie chcę...ale nie mam wyjścia. Muszę zadzwonić po Gadomskiego."
BBW_belchatow_technical_university: "Stworzenie Bełchatowskiej Akademii Techicznej"
BBW_belchatow_technical_university_desc: "Wreszcie uczelnia, na którą chętnie wyślę dzieci, niezniszczona do szpiku kości przez liberalną, tęczową ideologię. Bliskość największej elektrowni w całej Europie, a może nawet na świecie, stworzy studentom niezwykłe warunki. Praktyczna wiedza i nieskażona nauka akademicka w najnowocześniejszych warsztatach! Nie mogę doczekać się pierwszej uroczystości rozdania dyplomów..."
BBW_slash_heating_prices: "Obniżki cen ogrzewania"
BBW_slash_heating_prices_desc: "Gadomski może się ze mną o to spierać, lecz pozostałą nadwyżkę budżetową można przeznaczyć na coś pożyteczniejszego niż jego tak zwane inwestycje. Elektrownie mają aż nadto węgla do spalenia, a jeśli pieniądze pozostaną w kieszeniach ludzi, skosztują oni dobrobytu, o którym nieustannie opowiadamy. Kto wie, może zobaczę na ulicach więcej eleganckich samochodów zamiast tych samych przeżartych rdzą wraków pamiętających jeszcze stan wojenny."
BBW_brotherhood_citadel: "Budowa Cytadeli Bractwa"
BBW_brotherhood_citadel_desc: "Manufaktura była kiedyś wspaniałym klejnotem łódzkiego przemysłu. Co nie znajdowało się w Fabryce Izraela Poznańskiego! Tkalnie, przędzalnia, farbiarnia, drukarnia, ślusarnia, odlewnia i parowozownia, gazownia, remiza strażacka, magazyny, budynki mieszkalne dla robotników. Istne miasto przemysłu na trzydziestu hektarach! A potem przyszedł Balcerowicz...i zrobił z tego CENTRUM HANDLOWE. Wyobrażacie sobie? Jak można pozbyć się takiego cudu na rzecz rozpasanej Sodomy późnego kapitalizmu? Po Upadku doszło do lekkiego polepszenia sytuacji bo Manufaktura stała się centrum handlu między watażkami łódzkimi. Ale teraz już tego nie potrzebujemy. Nie przywrócimy co prawda fabryki, ale nic nie stoi na przeszkodzie by wykorzystać zabudowania do stworzenia tam ogromnej Cytadeli. Pentagon się schowa przy naszej inwestycji."
BBW_police_force: "Rozbudowa sił policyjnych"
BBW_police_force_desc: "Czasami zastanawiam się, kiedy na świecie będzie dość stróżów prawa, by całkowicie powstrzymać przestępczość. Dość łatwo złapać mordercę albo oszusta, ale najbardziej śliscy są drobni przestępcy. Wszechobecni agitatorzy, wandale i ekoszkodniki. To największy cierń w naszym boku, a wraz z napływem ludzi do miast zdają się mnożyć.\n\nJaki mam inny wybór, niż rozdać kilka dodatkowych odznak i pistoletów? Jeśli nie będą się zachowywać, sami sobie przyniosą wstyd, niezależnie od tego, czy skończą za kratami, czy w worku na zwłoki."
BBW_lamplight_in_the_smog: "Światełko pośród smogu"
BBW_lamplight_in_the_smog_desc: "Jaki piękny jest nasz Bełchatów. Smukłe kominy zanurzone w oceanie delikatnego dymu otulającego miasto niczym kocyk w zimną noc. Morze blokowisk świecących w ciemnościach jak latarnie morskie sygnalizujące że tu jest życie! Symetryczne i czyste ulice, fabryki produkujące produkty które już jutro będą napędzały po raz kolejny naszą wspaniałą gospodarkę. Ludzie wracający z pracy w zakładach gotowi na następny dzień pracy dla naszej ojczyzny. Można się rozmarzyć...a i nawet Łódź byliśmy w stanie naprawić. Ocean ruin został zastąpiony przez ogromne artystyczne budowle, komunikacja miejska i wojewódzka działa bez zarzutu, jest ciepło, jest światło. Czego chcieć więcej? Doprawdy, stworzyliśmy tutaj jedne z najpiękniejszych dzieł."
BBW_gadomski_budget: "Budżet Gadomskiego"
BBW_gadomski_budget_desc: "Niedawne posiedzenie rady poświęcone dopracowaniu szczegółów Planu Śląskiego zakończyło się impasem. Niespodziewanie jednomyślne kworum pękło, gdy Paladyn Gadomski zrobił awanturę o niektóre bardziej... wymagające postanowienia. Nazwał je fanatycznym, nieludzkim wyrazem naszego szaleństwa i zdecydowanym krokiem za daleko. Czy posuwamy się za daleko? Przez większość czasu może być bełkoczącym głupcem, lecz podziwiam odwagę Gadomskiego. Spróbuję przynajmniej go wysłuchać. Jeśli zdoła przedstawić rozsądną propozycję, być może otrzyma swoje ukochane reformy."
BBW_usage_optimisation: "Optymalizacja zużycia"
BBW_usage_optimisation_desc: "Rozdział 14 - Polityka energetyczna, artykuł 4. \"Węgiel jest zasobem skończonym, dlatego nie wolno go marnować. Każde wykorzystanie węgla, a także wszelkich produktów ubocznych, będzie podlegało indywidualnemu procesowi autoryzacji\". Zasób skończony. Ośmiela się nazywać czarne złoto zasobem skończonym. W Polsce jest dosłownie dość węgla, by utrzymać nas przez sto lat, nawet jeśli wykorzystujemy go praktycznie do wszystkiego. A wykorzystujemy. On wolałby jednak zachowywać się jak jakiś kolesiowski biurokrata i wedle własnej łaski osądzać, kto zasługuje na jego użycie. Witoldzie, dobrej zabawy przy rozpatrywaniu tysięcy wniosków, bo jakiś robotnik chce rano użyć pasty do zębów z dodatkiem węgla."
BBW_lowering_tax_burden: "Obniżenie obciążeń podatkowych"
BBW_lowering_tax_burden_desc: "W chwili osobistej słabości zatwierdziłem propozycję gospodarczą Paladyna Gadomskiego. Nie przeczytałem jej jeszcze w całości, więc skoro mam wolny wieczór, pora odłożyć pióro, usiąść przy bladym świetle naftowej lampki nocnej i przejrzeć właśnie wprowadzone zasady. Rozdział 3 - Polityka podatkowa. \"Obciążenia podatkowe osób prywatnych i prawnych zostaną drastycznie obniżone w celu pobudzenia wzrostu gospodarczego oraz umożliwienia późniejszych reinwestycji\". Obniżone. OBNIŻONE. Ledwie stać nas na pokrycie kosztów wydobycia surowców, emerytur górniczych, projektów przemysłowych, armii, naszego... SKĄD MAMY WZIĄĆ PIENIĄDZE NA TO WSZYSTKO, JEŚLI NIE Z PODATKÓW!?"
BBW_mining_optimisation: "Optymalizacja górnictwa"
BBW_mining_optimisation_desc: "Rozdział 29 - Przemysł wydobywczy, artykuł 1. \"Sektor górniczy należy zreorganizować zgodnie z najnowszymi standardami przemysłowymi, by poprawić wydajność, zmniejszyć koszty wydobycia i zapewnić wypłacalność\". Mocne słowa, Paladynie Gadomski. Lata doświadczenia naprawdę są tu widoczne. Czekamy na nieoceniony wkład w kręgosłup naszego przemysłu człowieka, który przez całe wygodne życie nie trzymał kilofa. Proszę, opowiedz nam wszystkim, co TY zrobiłbyś, by magicznie rozwiązać wszystkie problemy. Nie sposób nie zauważyć, że właśnie tę część propozycji pozostawiłeś szczególnie niejasną. Dlaczego? Zapewne błąd drukarski."
BBW_fuel_diversification: "Dywersyfikacja źródeł paliw"
BBW_fuel_diversification_desc: "Rozdział 14 - Polityka energetyczna, artykuł 15. \"Należy podjąć natychmiastowe działania na rzecz dywersyfikacji krajowej produkcji energii. Wszystkie nowe inwestycje muszą traktować priorytetowo odnawialne źródła energii przy minimalnym stosunku produkcji 80-20%\". CZY NAPRAWDĘ POZWOLIŁEM JAKIEMUŚ PRZEKLĘTEMU WIECHOWCOWI NAPISAĆ CAŁY PROGRAM GOSPODARCZY BRACTWA!? To brzmi jak bezpośredni cytat z Protokołów! Źródła odnawialne... tfu. Węgiel JEST przyszłością. Nie chcę żyć w świecie, w którym Bractwo WĘGLA zasila wyimaginowana moc magicznych żywiołów natury niczym w jakiejś obłąkanej ekofaszystowskiej ekodystopii! Przysięgam, rozkażę Paladynom schwytać tego człowieka, jeśli przyjdzie do mnie z projektem, który choćby wspomina słowo \"atom\"."
BBW_free_trade: "Otwarcie na wolny handel"
BBW_free_trade_desc: "Rozdział 18 - Polityka handlowa. \"Ponowne otwarcie handlu ze światem zewnętrznym uzupełni budżet Bractwa dzięki sprzedaży zapasów surowców, a w razie potrzeby zagraniczny import wypełni luki w produkcji krajowej\". Jest przebiegły, ale wiem, czego naprawdę chce. Próbuje sprzedać wrogom wszystkie nasze tajemnice dla szybkiego zysku. Kiedy wykorzystają nasze projekty, by zbudować maszyny wojenne napędzane naszym węglem i zniszczyć Bractwo, Gadomski z pewnością będzie się cieszył bezwartościowymi świecidełkami otrzymanymi w zamian. On będzie miał wyjście. My nie."
BBW_cutting_social: "Ucięcie wydatków socjalnych"
BBW_cutting_social_desc: "Rozdział 5 - Programy socjalne. \"Bractwo nie może dalej utrzymywać ludzi pozbawionych woli albo zdolności do samodzielnego utrzymania. Ograniczenie finansowania socjalnego zachęci do poszukiwania lepszego zatrudnienia i rozwinie niezależność finansową\". Och, teraz to się doigrał. Jeśli jest coś, co chcę w tej chwili zrobić, to przypisać Paladynowi Gadomskiemu pełne autorstwo tej propozycji. Żadnej pomocy ode mnie ani od innych; to wyłącznie jego pomysł. Dokładnie to powiem tysiącom obecnych i byłych górników, którzy rzucą się nam do gardeł około pięciu minut po tym, jak ośmielimy się choćby zasugerować cięcia emerytur. Poważnie, jak inaczej wyobrażał sobie zakończenie tej historii?"
BBW_anti_famine_shield: "Tarcza antygłodowa"
BBW_anti_famine_shield_desc: "Rozdział 12 - Produkcja żywności. \"Systemowe zaniedbanie i niszczenie gruntów rolnych grozi nieuchronną katastrofą. Należy podjąć inicjatywy zmierzające do ponownej uprawy jałowych pól porzuconych w toku industrializacji\". Witoldzie, jedno pytanie. Naprawdę sądzisz, że nie korzystamy z tych pól, bo żywimy urazę do upraw? Ziemie są jałowe, ponieważ stały się piekielnym, toksycznym pustkowiem. Widziałem je na własne oczy. Nic tam nie wyrośnie. Nawet najsilniejsze nawozy chemiczne niczego nie zmienią. To tylko naturalny skutek uboczny rozrastającego się przemysłu. Musisz wreszcie dorosnąć i to zaakceptować."
BBW_desulphurisation: "Eksperymenty z odsiarczaniem"
BBW_desulphurisation_desc: "Rozdział 29 - Przemysł wydobywczy, artykuł 6. \"Wszystkie gazy przemysłowe powstające w procesie wydobycia minerałów należy poddawać odsiarczaniu w celu poprawy jakości powietrza i ograniczenia szkodliwych skutków smogu\". O nie, on naprawdę w to brnie. Czy powinienem go powstrzymać, zanim jeszcze bardziej się ośmieszy? Już widzę, jak przybywa do zakładu w Bełchatowie z małymi filtrami powietrza czy czymkolwiek, co tam chce użyć. Chłopiec z małego miasta ma dość starego, dobrego przemysłowego powietrza. Płuca prawdziwego Starszego nie boją się smogu. Są nim napędzane. Dwutlenek węgla. Węgiel. Skąd indziej chce go brać, jeśli nie z ciągłego wdychania? Chce nas udusić, oto co naprawdę się dzieje."
BBW_privatisation_of_mines: "Prywatyzacja kopalni"
BBW_privatisation_of_mines_desc: "Rozdział 29 - Przemysł wydobywczy, artykuł 31. \"Wszelka ingerencja państwa w przemysł wydobywczy ustaje ze skutkiem natychmiastowym, a własność kopalń, szybów naftowych i elektrowni zostanie przeniesiona na prywatne przedsiębiorstwa zgodnie z zasadami wolnego rynku\". To już oficjalne. Oszalał. Nie istnieje świat, w którym jakikolwiek rozsądny inwestor odważyłby się choćby zbliżyć do nas z ofertą. Czy on rozumie, jak mocno musimy dotować górnictwo, żeby utrzymać je na powierzchni? Sprzedać wszystkie kopalnie, patrzeć, jak prywatni właściciele zwalniają pracowników i zamykają zakłady, siedzieć bezczynnie, gdy wydobycie węgla spada... gratulacje, Paladynie Gadomski, stworzyłeś warunki do kolejnego Blackoutu. Wspaniała robota."
BBW_economic_shock_therapy: "Ekonomiczna terapia szokowa"
BBW_economic_shock_therapy_desc: "Pomimo wszelkich starań, by powstrzymać zdradzieckie tak zwane reformy Gadomskiego, jakimś sposobem zdołał dotąd narzucić każdą część swojej propozycji gospodarczej. Prawie każdą. Czuję, że coś się szykuje, a kiedy się wydarzy, chcę być jak najdalej od Bełchatowa. Rozproszone raporty, które do mnie docierają, sugerują, że spróbuje poddać całą gospodarkę terapii szokowej tak ciężkiej, iż początek lat dziewięćdziesiątych będzie przy niej wyglądał łagodnie. Gdy skończy, ledwie rozpoznam ukochane Bractwo; Bractwo, które zbudowałem od podstaw, które powinno zamiast tego oddawać mi cześć... Już zaczęło wymykać się z rąk..."
BBW_brotherhood_economic_miracle: "Cud gospodarczy w Bractwie"
BBW_brotherhood_economic_miracle_desc: "Nadszedł nowy dzień, a silniejsze Bractwo jest gotowe na wyzwania, które może przynieść. Wątpiłem w niego na każdym kroku, lecz Paladyn Gadomski naprawdę odmienił oblicze naszego ruchu z pomocą wszechpotężnych, niewidzialnych sił rynku. Naprawdę ci się udało, Witoldzie. A jednak mimo wszystkich reform zbudowano dopiero 0,0001% kapitalizmu. To zadanie zbyt wielkie dla jednej osoby. Musisz się *wziąć w garść*. \n...\n...\nObudź się...\n...\nCholera, obudź się, Witoldzie. Znowu śniłeś na jawie o reformowaniu Bractwa."
BBW_silesian_committee: "Śląski Komitet Metropolitalny"
BBW_silesian_committee_desc: "Jedynym słusznym i racjonalnym wyjściem jest zagarnięcie zasobów Metropolii Górnośląsko-Zagłębiowskiej. Żadne z innych kierunków ekspansji nie jest tak bardzo opłacalne jak południe. Ogromne pokłady węgla kamiennego, mnóstwo kopalni które wymagają ratowania i nieeksploatowane złoża które czekają na dzielnych pionierów - to jest klucz do zabezpieczenia naszej przyszłości. A jeżeli będziemy odpowiednio efektywni, może i nawet odkryjemy złoża tam gdzie nikt wcześniej nie odważył się kopać."
BBW_dabrowa_basin_wing: "Wydział Zagłębia Dąbrowskiego"
BBW_dabrowa_basin_wing_desc: "Zagłębie dobywa węgiel, tu nie ma innego prawa. Tak przynajmniej kiedyś pisano o regionie Dąbrowskiego Zagłębia, którego jednym z głównych miast jest Dąbrowa Górnicza. Ale z potęgi przemysłowej i wielkiego centrum wydobywczego nieudolne rządy postkomunistów zrobiły cień tego co było kiedyś. Wielka szkoda, i żadne pocieszenie z tego że stało się to w całym kraju. Mieszkańcy tego regionu się nacierpieli dość przy transformacji ustrojowej, więc my teraz przynosimy im powrót do przeszłości. Pod Dąbrową i Sosnowcem znajdują się jedne z najgrubszych pokładów węgla NA ŚWIECIE! Są one pokaźniejsze niż te na Śląsku...więc MARNUJEMY JE stawiając tam nic nie znaczące centra usług i blokowiska. Będzie tu trzeba zrobić lekki remont. Zapewne, wiele osób będzie niezadowolonych ale jak tylko przywrócimy górniczą chwałę Zagłębiu i czarne złoto znowu przyniesie bogactwo okolicy, to ludzie nam wybaczą."
BBW_demolition_dg: "Operacje rozbiórkowe: Dąbrowa Górnicza"
BBW_demolition_dg_desc: "Nie byłem pewien co do szerokiego zakresu planowanych przesiedleń ale wyliczenia pokazują że wszystkim to wyjdzie na dobre. Szczególnie w takiej Dąbrowie Górniczej, która ma mnóstwo miejsca by pomieścić wszystkich na jej obrzeżach. Nawet nie będą musieli wyjeżdżać z miasta! Po prostu weźmiemy ich i lekko przesuniemy. A centrum trzeba będzie rozkopać. Tam stały kiedyś huty i kopalnie. Jedna huta - Bankowa, dalej stoi, ale ją też przeniesiemy. A Huta Katowice jest akurat za duża żeby ją przenosić. Ah, nie mogę się doczekać na odkrycie bogactw jakie skrywa w sobie to miasto. Bo to nie tylko węgiel kamienny, ale też wapienie, dolomity, piaski, węgiel drzewny. Wszystko czego potrzeba do uruchomienia przemysłowej maszyny! Do roboty!"
BBW_demolition_sosnowiec: "Operacje rozbiórkowe: Sosnowiec"
BBW_demolition_sosnowiec_desc: "Sosnowiec nie cieszył się dobrą opinią publiczną w ostatnich latach, ciężko powiedzieć czy to przez afery społeczne czy kretyńskie zarządzanie. Możliwe, że przez jedno i drugie. Ale to w tym momencie już nie jest ważne - co jest natomiast to to, że w granicach miasta znajdowało się kiedyś nawet do kilkunastu kopalni. W JEDNYM MIEŚCIE! Jeżeli jakiś urzędas jeden z drugim będzie mi próbował wcisnąć kit że tam już nic nie ma to własnoręcznie wyślę takich do kopalni w Sosnowcu. Tych nowych które zrobimy - na gruzach starych. Co...nie będzie łatwe biorąc pod uwagę zabudowę miasta. Ale Dąbrowa jest obok, jest pojemna - będziemy migrować! Przecież nie możemy odpuścić takiego skarbu!"
BBW_demolition_jaworzno: "Operacje rozbiórkowe: Jaworzno"
BBW_demolition_jaworzno_desc: "To na terenie Jaworzna powstała pierwsza kopalnia węgla kamiennego z prawdziwego zdarzenia. To tu rozpoczął się kolejny etap tej wspaniałej historii jaką jest polskie górnictwo. I niezbitym argumentem na to że tutaj nadal jest węgiel jest to że w Jaworznie nadal przetrwała (choć bardzo osłabiona) kopalnia węgla kamiennego Sobieski. I pomyśleć że Ci przeklęci urbaniści i ekonomiści tak bardzo zniszczyli resztę Zagłębia. Jaworzno jest przecież bardzo dobrym obrazem tego jak powinna wyglądać rzeczywistość. Wielka magistrala kolejowa! Potężna elektrownia węglowa! Kopalnia węgla kamiennego! Gdyby tylko nie pozamykano innych szybów i resztek przemysłu lekkiego to można by pomyśleć że od Jaworzna można się uczyć sztuki przemysłu. A tak, to musimy troszkę tutaj ponaprawiać."
BBW_deploy_peacekeepers: "Rozmieszczenie sił pokojowych"
BBW_deploy_peacekeepers_desc: "Spodziewałem się tego. Nastroje w miastach Zagłębia mówiąc oględnie - nie są kolorowe. Ale my kolorów nie potrzebujemy, dym jest szary, para biała a węgiel czarny. I tyle nam wystarczy. Nie dziwie się ludziom że nie są w stanie poświęcić się dla naszej wizji, wszak wmawiano im przez ponad 30 lat że to co robili tutaj było złe, kopalnie były złe i w ogóle cały przemysł jest zły. I to programowanie zrobiło z nich niewolników systemu, wyhodowali sobie idealnych nowoczesnych homo lemingus. Musimy podwoić tutaj liczbę służb bezpieczeństwa, nie możemy pozwolić na powtórkę z Bełchatowa. Nie gdy pod nogami spoczywa takie bogactwo. Po kilku ostrych akcjach policyjnych odechce im się wojowania, a potem jak już skończymy przebudowę - zobaczą jak bardzo się mylili."
BBW_high_density_housing: "Ultra gęsta zabudowa mieszkaniowa"
BBW_high_density_housing_desc: "Proces przesiedlenia okazuje się nie iść tak łatwo jak w zakładanych projekcjach Warzechy. Ale i na to człowiek zdrowego rozsądku rozwiązanie znajdzie, bo po to ma się rozum żeby przezwyciężać problemy a nie sobie je stwarzać. W sumie...to nie doprecyzowałem tego stwierdzenia. Proces przesiedleń idzie tak po prawdzie ZBYT DOBRZE, i przez to rodzą się problemy. Bo nie za bardzo mamy gdzie ich wszystkich...upychać. Chów klatkowy Polaka w wielkich miastach był co prawda jedną z patologii kapitalizmu liberalnych elit, ale my to zrobimy porządnie. Megabloki staną się wielkimi przestrzeniami mieszkalnymi z kwitnącym biznesem wewnętrznym, życiem kulturalnym i wieloma innymi atrakcjami. Takie małe miasto w jednym bloku. Tam gdzie wszystko masz na wyciągnięcie ręki! Tak, że maksymalnie to piętnaście minut i dojdziesz wszędzie...gdzie musisz...zaraz...ugh...chyba będziemy musieli inaczej nazwać tę koncepcję."
BBW_supersize_przyjazn: "Rozbudowa Koksowni Przyjaźń"
BBW_supersize_przyjazn_desc: "Nie dość że mają największą hutę w Polsce, to jeszcze w Dąbrowie jest druga największa koksownia w kraju. Ale jako że ta największa leży na opolskim odludziu, a ta jest idealnie usytuowana na obrzeżach wielkiego centrum przemysłowego, to warto będzie sprawić żeby z drugiego miejsca awansowała na pierwsze. A jak wiemy, koks też jest ważnym elementem naszego “mixu energetycznego", w końcu też pochodzi z węgla i bardzo przyda się znajdującej się obok Hucie Katowice. Wzmacniając przemysł zagłębiowski wzmacniamy mieszkańców tych miast. Nie ma co się martwić o podwojone emisje, to wszystko to wymysł propagandy, gdyby było inaczej to ludzie by nie mieszkali w Strzemieszycach koło koksowni w ogóle! A jakoś żyją. I będą żyli."
BBW_relocate_industry_to_cop: "Relokacja przemysłu do NCOP"
BBW_relocate_industry_to_cop_desc: "W Zagłębiu znajduje się tyle różnorakich przedsiębiorstw przemysłowych że głowa mała. Przy naszych ekstensywnych pracach w poszukiwaniu złóż wielką szkodą byłoby zniszczenie produkcji która w tych zakładach kwitnie. Na szczęście, dzięki naszym najlepszym ekonomistom - mamy dla nich miejsce. Nowy Centralny Okręg Przemysłowy! Tam wszystkie troski zarówno pracowników jak i pracodawców znikną, będą otoczeni najlepszymi fachowcami i zapewnione im będą wszystkie możliwe udogodnienia, wraz z refundacją przenosin. Kompleksowa obsługa migracji i gwarantowana satysfakcja! Przynajmniej tak mówią nasi oficjele. Ja się z tym zgadzam, ale tak po prawdzie...to nie jest oferta którą mogą odrzucić. Jak się sami nie przeniosą - to my ich przeniesiemy, ale z małym kruczkiem prawnym który nazywa się nacjonalizacja."
BBW_shoring_up_power_plants: "Wzmacnianie elektrowni"
BBW_shoring_up_power_plants_desc: "Kopiemy głęboko i chciwie. Musimy tak robić, żeby dorwać największe zdobycze jakie kryje ta ziemia. Jednak jak bardzo byśmy nie chcieli uniknąć komplikacji - są one naturalne przy tak szeroko zakrojonej akcji wydobywczej. A mianowicie to, że na górze troszkę zacznie się wszystko gibać. Ostatnie czego byśmy chcieli to zapadlisk, szczególnie na terenach przemysłowych które potrzebują stabilności. Szczególnie wrażliwymi punktami są Łagisza i Jaworzno. Chodzi oczywiście o elektrownie, nie o zabudowania. Musimy wzmocnić fundamenty tych elektrowni, tak żeby były odporne na największe możliwe tąpnięcia i były niewrażliwe na jakiekolwiek osunięcia ziemi. Nie chcemy przecież dopuścić do tragedii jaką byłby lokalny blackout, prawda? Będzie to dość precyzyjna i kosztowna robota, ale na pewno nie niemożliwa! W końcu w Japonii budują elektrownie na terenach narażonych na gigantyczne trzęsienia i tsunami! Więc raczej poradzimy sobie z lekkim zagrożeniem jakie prezentuje ta ziemia."
BBW_expand_slawkow_terminal: "Rozbudowa Euroterminalu Sławkowskiego"
BBW_expand_slawkow_terminal_desc: "Sławków jest praktycznie nic nie znaczącą kropką na mapie Zagłębia Dąbrowskiego. Tak jest, gdyż kiedyś posiadało znaczne złoża srebra i ołowiu. Tych jednak już tutaj mimo wszystko nie uświadczymy gdziekolwiek byśmy nie kopali. Dlatego samo miasto jest dla nas bez większego znaczenia. Lecz w granicach Sławkowa, mimo że poza obszarem zabudowanym - leży coś znacznie bardziej cennego. Euroterminal Sławków. Pomijam już tę okropną nazwę (będziemy musieli coś z nią zrobić, serio - wszędzie ta eurofederalna propaganda się wpieprzy...), ale jest to gigantyczny hub zaopatrzeniowy z ogromną magistralą kolejową i połączeniami z najważniejszymi zakładami w okolicy. Jako że my nasze operacje przemysłowe w regionie rozszerzamy drastycznie, również i terminal w Sławkowie będziemy potrzebowali rozbudować. Drastycznie."
BBW_repurpose_pogoria: "Rozkopanie Pustyni Błędowskiej"
BBW_repurpose_pogoria_desc: "Pustynia Błędowska. Jedyna pustynia w tej części Europy. Absolutnie bezużyteczna kupa piachu. Ale czy na pewno? Ostatnie raporty które dostałem mówią mi że nie do końca tak musi być. Na pustyni znajdują się gigantyczne pokłady piasku (a jakże) podsadzkowego. Kiedyś używano go do wypełniania pustek poeksploatacyjnych w kopalniach, teraz gdy masowo otwieramy nowe kopalnie - znowu może pełnić tę rolę. A co sprawia że piasek staje się podsadzkowy? Odległość złoża do najbliższej kopalni bo liczy się tutaj efektywność logistyczna. A tak się składa że największe w Polsce złoże piachu jest bardzo, bardzo blisko ogromnych centrów wydobywczych. Prawda, że cudownie się składa? Nikt nie będzie płakał za wydmami! A tak, na coś się w końcu ta pustynia przyda. Kto wie, może znajdziemy tam coś jeszcze"
BBW_huta_huta_huta_huta: "Centrum Dowodzenia Huta Katowice"
BBW_huta_huta_huta_huta_desc: "Huta Katowice. Ukoronowanie rozbudowy Zagłębia Dąbrowskiego przez komunistów. Co jak co, ale przynajmniej wtedy potrafili budować ważne i potrzebne rzeczy. A potem przyszło zło postkomunizmu. A wszyscy wiemy że zło nie jest w stanie stworzyć niczego nowego, jest w stanie tylko psuć i niszczyć to co siły dobra stworzyły lub wymyśliły. Na szczęście, nie zniszczyli jeszcze tego wspaniałego stalowego giganta. Oh, ależ jak oni próbowali! Ostatecznie nawet postanowili wyprzedać hutę hindusom za bezcen. Ale wszystko wraca teraz do korzeni, i my zrobimy z tej huty wspaniałe Centrum Dowodzenia Przemysłu Zagłębia. Co prawda będziemy musieli usunąć stąd te pozostałe komunistyczne banery...ponad 40 lat po upadku PZPR a Ci ludzie dalej się nie zorientowali że to już przeszłość..."
BBW_basin_restored: "Zagłębie odnowione"
BBW_basin_restored_desc: "Jak za dotknięciem czarodziejskiej różdżki, Zagłębie Dąbrowskie podniosło się z letargu i znowu stanowi bijące przemysłowe serce regionu. Odnowiliśmy oblicze tej ziemi, i teraz możemy słać węgiel na zachód i wschód. Przemieniać czarną potęgę na bogactwo i oddać mieszkańcom w ogromnym przemyśle ich trudy który musieli znieść podczas gdy my tutaj rozkopywaliśmy im miasto. Już niedługo, już za chwilę - zobaczą że to było tego warte. Wszystkie zębatki tej gigantycznej maszyny zaczęły się zazębiać i dym który unosi się teraz nad Dąbrową, Sosnowcem i Jaworznem dowodzi tego, że osiągnęliśmy sukces. Po raz kolejny z resztą. I to nie jest nasze ostatnie słowo."
BBW_upper_silesia_wing: "Wydział Górnego Śląska"
BBW_upper_silesia_wing_desc: "Nie ma Górnego Śląska bez węgla. Te dwa podmioty stały się nierozrywalną jednością zakorzenioną głęboko w tradycji tego regionu. To właśnie węgiel kamienny dał Śląskowi bogactwo, pozwolił na rozwój przemysłu oraz sprowadził tu mnóstwo ludzi poszukujących lepszego życia. To była prawdziwa ziemia obiecana która do tej pory opierając się na kopalniach i elektrowniach jest pulsującym sercem tego kraju. Niestety obecnie śląskie górnictwo jest w opłakanym stanie, i musimy mocno tutaj posprzątać jeśli liczymy na to że ten region przyniesie nam zysk w czarnym złocie."
BBW_demolition_rybnik: "Operacje rozbiórkowe: Płaskowyż Rybnicki"
BBW_demolition_rybnik_desc: "W aglomeracji rybnicko-jastrzębskiej nadal jest mnóstwo prężnie działających kopalni którym trzeba tylko pomóc organizacyjnie. Ale pod ziemią jest ogromny zasób który możemy kopać przez następny wiek! To tam musimy przeprowadzić radykalne zmiany w strukturze urbanizacyjnej jeżeli chcemy dotrzeć do najgłębiej położonych złóż. Radlin, Żory, Rybnik, Jastrzębie-Zdrój -  to wszystko są ośrodki górnicze najwyższej klasy, i grzechem byłoby z nich zrezygnować."
BBW_demolition_katowice: "Operacje rozbiórkowe: Wyżyna Katowicka"
BBW_demolition_katowice_desc: "Najbardziej zurbanizowana część metropolii będzie twardym orzechem do zgryzienia. Władzom ciężko było tutaj cokolwiek budować a co dopiero przeprowadzać wielkie wykopaliska. To będzie zdecydowanie najtrudniejsze logistyczne przedsięwzięcie całego planu. Rozbiórka konkretnych terenów musi zostać przeprowadzona bardzo szybko, a ludzi będzie trzeba gdzieś przesiedlić. Centrum Katowic możliwe że obejdzie się bez radykalnych zmian, a przynajmniej głupio byłoby rozwalić Spodek..."
BBW_demolition_pszczyna: "Operacje rozbiórkowe: Równina Pszczyńska"
BBW_demolition_pszczyna_desc: "Południowe rejony metropolii nie są terenami tak bardzo mocno zagospodarowanymi przemysłowo jak możnaby się tego spodziewać. Nie ma tam też tak ogromnej gęstości zaludnienia jak bardziej na północ. Przez co ewentualne wykopaliska mogą być przeprowadzone tam na wielką skalę bez większych ubytków w ludności. A badania wskazują że bynajmniej jest to teren z mniejszą ilością złóż. A te nieliczne kopalnie które tam są...musimy im pokazać jak to się robi."
BBW_strengthening_silesian_chapter: "Wzmacnianie Śląskiego Bractwa"
BBW_strengthening_silesian_chapter_desc: "Na Śląsku, jako krainie węglem płynącą nie mogło zabraknąć naszej obecności. Przed wojnami wojewódzkimi rolę tę pełniło Śląska Kapituła Bractwa Węgla które pod przewodnictwem paladyna Rafała Wosia trzymało pieczę nad tym regionem, aczkolwiek byli oni mocno zdominowani przez Jastrzębską Spółkę Węglową oraz lokalny oddział Solidarności. Woś jest...specyficzny, i nie przepadam za jego mocno lewicowymi odchyłami, ale oddania węglowej sprawie nie mogę mu odebrać. Jako że nasze możliwości administracyjne są zasobem który w przeciwieństwie do węgla może się skończyć - może lepiej będzie odnowić Śląskie Bractwo Węgla jako administratorów tych ziem w naszym imieniu."
BBW_bureaucratic_giants: "Biurokratyczni giganci z Katowic"
BBW_bureaucratic_giants_desc: "Katowice są nadal gigantem jeśli chodzi o Górny Śląsk, a transformacja przekształciła ich ze stricte przemysłowego miasta w ośrodek usług oraz nowych technologii. Ta ekstensywna i skrupulatna biurokracja w której to znajdziemy również i ekspertów dotyczących energetyki i górnictwa, będzie bardzo przydatna. Każda tona węgla wydobytego w tym regionie musi zostać przeliczona co do bryłki. Nie możemy sobie pozwolić na ubytki w zasobach, a kontrola nad tym gigantycznym przedsięwzięciem nie może polegać na urzędnikach którzy nie mają pojęcia co robią. Potrzebujemy profesjonalistów."
BBW_prospecting_in_south: "Poszukiwania na południu"
BBW_prospecting_in_south_desc: "Zgodnie z planem rozpoczęliśmy rozwijanie przemysłu górniczego na południu, gdzie jest wiele lasów a niewiele rozsądku. Jak można było tu nic nie robić przez tyle lat...Kobiór, Miedźna, Wola, Pszczyna, Wyry. Każda z tych miejscowości zostanie przekształcona w centrum wydobycia i zintegrowana z wojewódzką siecią logistyczną. Jak zaczniemy tu kopać głęboko to okaże się że tam są tak niespotykane pokłady węgla że zredefiniujemy całą gospodarkę Górnego Śląska na nowo. Mówię wam, tam znajdziemy świętego Graala naszego górnictwa. A potem każdy będzie przepraszał mnie i mówił że miałem rację. Oczywiście że miałem. Przecież to od razu na chłopski rozum widać że tam musi coś być."
BBW_restart_the_plants: "Ponownie uruchamianie elektrowni"
BBW_restart_the_plants_desc: "Nie raz pisałem o barbarzyństwie neokapitalistycznych łupieżców żerujących na zdrowym organizmie przemysłowym Polski. Ich ofiarami padało wszystko; stocznie, huty, kopalnie, zakłady zbrojeniowe, przemysł ciężki, lekki, no i również niestety elektrownie. Tak było w Bytomiu, i tak było w Pszowie. Co gorsza, kpiąc z nas wszystkich te zakłady nie zostały totalnie zniszczone - tylko stoją puste i ciemne, groźnie patrząc na okolice. Najbardziej oczywiście ucierpieli na tym mieszkańcy tych miast i pracownicy którzy znajdowali zatrudnienie tam. Musimy naprawić ten afront i przywrócić te dwie potężne elektrownie do stanu idealnego. Będziemy potrzebowali każdego megawata..."
BBW_automatization_experts: "Eksperymenty z automatyzacją"
BBW_automatization_experts_desc: "Sztuczna inteligencja jest tematem bardzo kontrowersyjnym, ale ja totalnie nie rozumiem problemów jakie ludzie tworzą sobie sami. Czy młotek może być szkodliwy? No może, ale to tylko w zależności czy użyjesz go do wbicia gwoździa czy rozwalenia komuś głowy. I tak samo jest z AI. Profesjonaliści będą w stanie wykorzystać to narzędzie do ułatwienia procesów i poprawienia komfortu życia. Kretyni będą generować hedonistyczne obrazki. Jako że my nie jesteśmy tacy sami jak ta banda idiotów która doprowadziła do Upadku, to my mamy szansę wykorzystać technologię nad którą pracowały laboratoria w Katowicach do stworzenia naprawdę wyjątkowych cudów."
BBW_model_city_tychy: "Modelowe miasto - Tychy"
BBW_model_city_tychy_desc: "Tychy zostały wytypowane na miasto które uniknie całkowitej rozbiórki celem pogłębienia naszych operacji eksploatacyjnych. Dlaczego? Nie damy rady wszystkich przesiedlić do Łodzi i Bełchatowa, a tutaj po prostu będzie taniej. Po drugie, tak - w Tychach też są złoża węgla i będziemy tam kopać, ale na mniejszą skalę, bo tylko niewielka część miasta leży bezpośrednio na pokładach tego surowca. Dodatkowo będzie to idealna okazja by przetestować nasz nowy model planowania urbanizacyjnego - przekształcanie miast na modelowe przykłady centrum przemysłowo-górniczego. Tylko będziemy musieli wybudować sporo nowych mieszkań..."
BBW_PIWO: "Wywary Starszego"
BBW_PIWO_desc: "Jak człowiek kończy ciężką szychtę, to co robi? Ano, ma ochotę na piwo i idzie do baru. A tam bieda aż piszczy, wódka droga, piwo to jakieś resztki a to co jest produkowane prowizoryczne w ledwo działających browarach nie nadaje się nawet do wylania do zlewu w obawie przed tym że przeżre rury. Browary Książęce w Tychach przestały praktycznie funkcjonować...nie wspominając o innych lokalnych piwowarniach. Jest to poważny problem bo to jest nieodzowna część kultury męskiej. O tą musimy dbać więc musimy stworzyć nowy konglomerat browarniczy, który będzie w stanie produkować piwo ciemne jak węgiel i jasne jak płomień pieca. Zawsze chciałem mieć swój własny trunek..."
BBW_silesian_coal_company: "Śląska Spółka Weglowa"
BBW_silesian_coal_company_desc: "Przemysł wydobywczy w przedupadkowej Polsce był podzielony pomiędzy kilka dużych przedsiębiorstw. Jednym z nich była Jastrzębska Spółka Węglowa, która pomimo tego że była w dość opłakanym stanie to udało jej się zachować wpływy w najważniejszych kopalniach regionu i nawet przez chwilę dominowała nad Śląskim oddziałem Bractwa Węgla. Nie wątpię, ludzie związani z JSW się nam przydadzą i sama spółka powinna zostać odrodzona. Ale tym razem to oni będą pod kontrolą Śląskiego Bractwa Węgla, a to głównie po to by zagwarantować interesy Bractwa jako całości a nie by napełniać portfele prezesów spółek."
BBW_silesian_minority_status: "Uznanie statusu mniejszości śląskiej"
BBW_silesian_minority_status_desc: "Ślązacy to ludzie węgla i kilofa. Złośliwi by stwierdzili że nie pochodzą z łon swoich matek lecz rodzą się z kamienia. No, i mówią śmieszną gwarą. Znaczy, uważają że to język. Może i tak, ale chcąc nie chcąc - jest to grupa społeczna do której nam bardzo blisko bo mamy wspólne zainteresowania i tradycje. Plus...będziemy potrzebowali ich mocno po naszej stronie, wszak przychodzimy do ich domów i trochę rozwalamy tę okolicę. Oczywiście jest to dla ich dobra, ale póki co tego nie zobaczą. Dlatego uznanie mniejszości śląskiej jako autonomicznego tworu w naszym państwie będzie gestem może i symbolicznym, ale potrzebnym do uspokojenia nastrojów..."
BBW_adaptation_of_railways: "Adaptacja kolei"
BBW_adaptation_of_railways_desc: "Przez to, że na Śląsku praktycznie nie zostaje żaden skrawek nie rozkopanej ziemii, musimy przystosować do tego nasz transport. Ciężko jest manewrować pomiędzy takimi labiryntami jakie powstały przez nasze operacje, przez co sensownym wyjściem wydaje się mogłoby być postawienie kolei na gigantycznych podporach...wyobraźcie sobie tylko, ogromny czarny parowóz sunący przez pustkowie setki metrów nad ziemią przecinający mgłę niczym ostrze, by dowieźć surowce do celu. Wspaniała wizja. Ewentualnie zrobimy też koleje podwieszane, byle były wysoko i nie przeszkadzały w wydobyciu. No i...żeby były odporne na tąpnięcia bo samolotów z nich nie zrobimy."
BBW_evacuating_metalworks: "Ewakuowanie hut"
BBW_evacuating_metalworks_desc: "Prowadzenie produkcji w hutach często współgra z eksploatacją górniczą w pobliżu. I generalnie byłoby wszystko fajnie gdyby nie skala z jaką przeprowadzamy tutaj nasze prace. I wychodzi nam na to że nie bardzo mamy miejsce na pozostawienie hut. Na szczęście, nasz nowo wybudowany Nowy Centralny Okręg Przemysłowy ma aż nadto miejsca by przyjąć śląskie huty na swoje przestronne łono. Trochę nam zajmie samo wywiezienie wszystkich potrzebnych maszyn i konstrukcji, ale tam będą bezpieczne i skonsolidowane z ogromną siecią jaką jest NCOP. "
BBW_grey_clouds_and_steam: "Szare chmury i para"
BBW_grey_clouds_and_steam_desc: "Było to solidne trzęsienie ziemi, ale z ruin postkapitalistycznego Śląska wyłoniło się...no, nie wyłoniło się bo jest przykryte chmurami i smogiem...ale to dobrze! To znaczy że region ożył i zaczął funkcjonować jak na centrum przemysłu i górnictwa przystało! Bo do tej pory Górny Śląsk był pogrążony w letargu i rozkroku pomiędzy wymuszoną przez ekofaszystów transformacją energetyczną a wydobyciem które nie pokrywało żadnych zapotrzebowań. Teraz jest wszystko jasne i możemy z czystym sumieniem powiedzieć: Cała naprzód!"
BBW_tried_and_tested_method: "Sprawdzone metody"
BBW_tried_and_tested_method_desc: "Zagłębie Dąbrowskie oraz Górny Śląsk przeszły całkowitą transformację. Znaczy to może niezbyt dobre określenie, w końcu nie zmieniliśmy aż tak radykalnie przeznaczenia tych regionów. Wręcz można powiedzieć lepiej - wróciły do korzeni. Potęga przemysłowa jaką tutaj odnowiliśmy będzie zasilać nasze Bractwo do końca świata i jeden dzień dłużej. A doświadczenie które tutaj zdobyliśmy na temat tego jak radzić sobie z planami eksploatacyjnymi przydadzą nam się na dłuższą metę. W końcu to nie jest jedyne miejsce gdzie surowce leżą i czekają na swoich odkrywców. Poznań. Wałbrzych. Legnica. Lublin. Oj będzie co robić gdy już tam dotrzemy."
BBW_elder_files: "Ujawnienie Listy Starszego"
BBW_elder_files_desc: "Co to ma być? To skandaliczne oszczerstwa! Jakiś nisko postawiony Rycerz postanowił zabawić się w sygnalistę i opublikował akta, które rzekomo mnie potępiają. Oczywiście same kłamstwa. Oskarżają mnie o bezpodstawne egzekucje sygnalistów zaniepokojonych stanem Bractwa. Sygnaliści, tfu. Zdrajcy. Wszyscy. Twierdzą również, że jestem kryptowiechowcem, powołując się wyłącznie na stare zdjęcie z nim z konferencji! To fałszerstwo. Nie żebym tam nie był, ale kazałem zniszczyć wszystkie kopie, bo fotografia została wyrwana z kontekstu! A najgorsze, że teraz obwiniają mnie o śmierć Naczelnego Paladyna Sommera! Dorwę tego, kto postanowił zszargać moje dobre imię."
BBW_induction_of_willing: "Introdukcja chętnych"
BBW_induction_of_willing_desc: "Wygląda na to, że Janecki postanowił wypełznąć ze swojej nory i zintegrować się z szerszym środowiskiem klasy rządzącej Bractwa. Dobrze. Wreszcie staje się przewidywalny. Dotąd rozgrywał obie strony przeciw sobie, przyprawiając mnie o potężny ból głowy przy przewidywaniu jego następnych ruchów. Teraz zdaje się sprzyjać reformistom - zwłaszcza Roksanie Węgiel, Zychowiczowi, Bartosiakowi i Wosiowi. Sądząc po energii wkładanej w spotkania z nią i coraz rzadszych kontaktach z lojalistami, myślę, że jego ideologiczny zwrot będzie trwały. O ile w odniesieniu do Janeckiego cokolwiek można nazwać trwałym."
BBW_bureaucratic_mishaps: "Wpadki biurokratyczne"
BBW_bureaucratic_mishaps_desc: "Brakujące zeznania podatkowe, błędne metryki ludności, niepełny spis majątku państwowego. Ludzie Gadomskiego mieli być chłodnymi, wolnymi od ideologii specjalistami technokratycznymi. A teraz Wysoki Paladyn odpowiedzialny za gospodarkę pokazuje mi raport o tym, jak fatalnie ostatnio pracowali. Nie możemy właściwie planować inwestycji i budżetu na podstawie tak zepsutych danych. Gadomski obiecał zbadać sprawę i wyciągnąć odpowiednie konsekwencje wobec winnych. Mam, kurwa, nadzieję, że ma dla nich kompetentnych następców. Niech lepiej modli się, by takie sytuacje nie powtórzyły się w przyszłości."
BBW_empty_fuel_reserves: "Opróżnianie wojskowych baz paliw"
BBW_empty_fuel_reserves_desc: "Zauważyłem, że Zychowicz i Bartosiak postanowili przenieść ogromne ilości paliwa przeznaczonego dla wojska. Gdy zapytałem o ich działania, wyjaśnili, że chcą uniknąć koncentracji paliwa w jednym miejscu podatnym na bombardowanie, które mogłoby łatwo sparaliżować nasz wysiłek wojenny. Twierdzą, że bardziej rozproszone zapasy będą bezpieczniejsze przed nalotami, a zarazem łatwiej dostępne dla jednostek w terenie, co znacznie przyspieszy uzupełnianie paliwa. Rzymkowski wtrącił, że cały proces naraża armię z powodu niedoboru paliwa, lecz duet upiera się, że zakończy operację, póki nadal trwa pokój."
BBW_weather_forecast: "Prognoza pogody"
BBW_weather_forecast_desc: "Pochmurno, pięćdziesiąt procent szans na upadek. Jakimś sposobem wszystko przestało działać. Ludzie są wzburzeni publikacją tak zwanej Listy Starszego. Być może to ona odpowiada za ostatnie problemy, ale coś mi mówi, że nie jest to cała historia. Sabotaż, kradzieże wartościowych rzeczy z zakładów pracy, niedobór pieniędzy... Wszystko wydaje się zbyt zorganizowane, a sprawcy zbyt nieuchwytni. To musi być skoordynowana operacja, ale kto za nią stoi? Mój wewnętrzny krąg wskazuje ministrów z twardogłowego skrzydła, ci jednak zwracają uwagę, że problemy zaczęły się, gdy Janecki zaprzyjaźnił się z reformistami."
BBW_random_security_checkup: "Wyrywkowa kontrola bezpieczeństwa"
BBW_random_security_checkup_desc: "Warzecha zgłosił, że ktoś próbował włamać się do jego komPANa, by wydobyć obciążające mnie akta, takie jak stare zdjęcie obok Jakuba Wiecha. Zdjęcie, które kazałem całkowicie zredagować. Zapytany o nie Warzecha powiedział coś tam o \"obowiązkach archiwalnych\". Próbował mnie uspokoić, że atak hakera się nie powiódł i podwoi wysiłki na rzecz bezpieczeństwa, zaczynając od losowych, niezapowiedzianych kontroli, które utrzymają wszystkich w czujności i pozwolą złapać spiskowców. Kazałem mu usunąć wszystkie pozostałe akta, które przechowuje jako \"archiwista\", by zapobiec potencjalnym wyciekom. Idiota."
BBW_loyalty_of_armed: "Lojalność sektorów siłowych"
BBW_loyalty_of_armed_desc: "Mam jednego przyjaciela: armię. Wszyscy inni są niestali i chwiejni niczym żywy świerk pozostawiony na polu po wycięciu wszystkich pozostałych drzew i przeznaczeniu ich do produktywnego użytku. Zasypiam dzięki zaufaniu do wojska. Bez niego nie mam nic w tej chwili próby. I w porządku: ukształtowałem Paladynów tak, by niczego nie chłonęli i przed niczym się nie cofali. Nic ich nie złamie. Najmniej zaś konieczność ukarania zdrajców z odpowiednią surowością."
BBW_delegations_for_trusted: "Delegacje dla zaufanych"
BBW_delegations_for_trusted_desc: "Znów muszę odgrywać komendanta policji, a moi ludzie detektywów z W11. W11 rzadko pozwala, by śledztwo ciągnęło się dłużej niż tydzień - przynajmniej w serialu. Rzeczywistość może nie być równie prosta, ale nie mogę pozwolić sobie na mniej. Delegacje zostaną wysłane wszędzie, gdzie lęgnie się sprzeciw i sabotaż, i otrzymają pełne uprawnienia do bycia sędzią, ławą przysięgłych, dzielnicowym, prokuratorem oraz oczywiście katem w każdej sprawie, która wpadnie im w ręce. Musimy naturalnie wybrać lojalnych Paladynów, a nie każdy nadaje się do W11, ale nie będziemy transmitować ich pracy, więc kogo to obchodzi?"
BBW_vacations_for_veterans: "Urlopy dla weteranów"
BBW_vacations_for_veterans_desc: "Znów nie mogłem spać. Wiem, że mam rację. Wiem, że zgadza się ze mną każdy przy zdrowych zmysłach. Lecz nawet lojalnych może spętać strach albo chciwość. To człowieczeństwo, nie występek. Moi żołnierze mają rodziny, muszą jeść, a my jeszcze nie skończyliśmy podnosić ich poziomu życia. Jaka nagroda dla armii może być lepsza niż wartościowy czas z rodziną? To może być kryzys, ale wymaga wypoczętych, opanowanych głów. W ten sposób utrzymam Bractwo w gotowości do jego przetrwania."
BBW_ace_in_the_hole: "As w rękawie"
BBW_ace_in_the_hole_desc: "Ten skurwy... I ta suka Janecki! Wiem, że coś knuje. Coś! A jednak jego dowody są solidne. Gadomski, kurwi syn, po odsunięciu na bok (czy to ja go zlekceważyłem? Nie pamiętam) za dekadenckie LIBERALNE propozycje dotyczące GZM postanowił dalej nieść sztandar sprzedawania Bractwa temu, kto da najwięcej, spiskując przeciwko mnie! Jak go dorwę, odrąbię mu kończyny i osobiście je poddam pirolizie! Zdrajca... k-k-k, kurwa!"
BBW_coal_liquefaction: "Eksperymenty z upłynnianiem węgla"
BBW_coal_liquefaction_desc: "Zasoby węgla na planecie, spuścizna karbonu, są właściwie nieskończone. Technologia ludzkości musiała jednak skupić się na rzadszym i mocniejszym kuzynie węgla: ropie, z której powstają benzyna i olej napędowy. Zamiast solidnych palenisk węglowych główną technologią napędu stał się silnik spalinowy. Największym problemem Polski po Upadku było więc zabezpieczenie paliwa. Węgiel można jednak przetworzyć w ropę. To żałośnie słabo zbadana technologia z powodu nasycenia światowej gospodarki tanim czarnym złotem. My mamy wszelkie powody, by wziąć posiadany węgiel i opracować nowe sposoby przemiany go w benzynę, olej napędowy, a jeśli to w ogóle możliwe, także LPG."
BBW_spring_cleaning: "Wiosenne porządki"
BBW_spring_cleaning_desc: "Nadzieja umiera ostatnia. Choć zdradziecka kurwa cieszy się teraz resztkami uzurpowanej władzy, niestrudzenie zabezpieczałem swoją pozycję, by nie dało się mnie tak łatwo zdegradować. Wciąż są niżsi oficerowie, którzy będą za mnie walczyć. Prawdziwi patrioci, których światopogląd sam ukształtowałem. Muszą tylko zorganizować się pod jednym dowódcą i przeprowadzić kontrrewolucję. Pozycja Roksany jest zbyt niestabilna, by utrzymała się przy władzy. Wystarczy małe pchnięcie, by prawdziwi Bracia Węgla otrząsneli się po ataku z zaskoczenia, a porządek zostanie przywrócony, zaś buntownicy - ukarani."
BBW_black_ranks: "Czarne Szeregi"
BBW_black_ranks_desc: "Zdradzieckie szuje upodobały sobie naszą krystalicznie czystą organizację Karbonariuszy jako pole do szerzenia swoich plugawych reakcyjnych poglądów. Wszak młodzież najprościej skorumpować, najprościej było im zasiać ziarno wątpliwości które przerodziło się w nieuzasadnioną niczym falę nienawiści do Rady. A potem nadeszły zdradzieckie czyny. I to z samego środka! Tak długo walczyliśmy z wiechowcami że nie zauważyliśmy jak w przyszłości naszego narodu rośnie okropna, chora narośl. Musimy ją wyciąć i wypalić do cna, zanim reszta młodzieży zdąży nią nasiąknąć. Jest jeszcze trochę prawdziwych i lojalnych Karbonariuszy. Tych należy awansować. Sprawdzą się doskonale w naszej nowej formacji - Czarnych Szeregach. Będą one egzaltacją najwyższych wartości Bractwa, domem dla najwierniejszych synów postępu. I oni - już nas nie zawiodą. Bo ich honorem - jest być wiernym. Kurczę, to brzmi jak dobre hasło..."
BBW_state_of_emergency: "Oficjalne wprowadzenie stanu wyjątkowego"
BBW_state_of_emergency_desc: "Bardzo długo wzbranialiśmy się od gry w otwarte karty z wywrotowcami, ale ostatnie działania przybiły nas do muru. W celu ratowania naszego Bractwa i wszystkich osiągnięć naszego systemu, jesteśmy zmuszeni do wprowadzenia stanu wyjątkowego we wszystkich regionach naszego państwa w celu zapewnienia ciągłości państwowej i bezpieczeństwa obywateli. Atak dokonany na najwyższe władze Rady pozostawił wiele blizn, które prędką się nie zagoją ale możecie być pewni - moja wola nigdy nie była silniejsza! Czy ta deklaracja coś zmienia? Tylko oficjalnie - wszak nasze służby i wojsko od czasu próby przewrotu są w ciągłym pogotowiu. Społeczeństwo mogło się domyślać, ale niewiele wiedzieli. Czas żeby przejrzeli na oczy."
BBW_traitor_shopping_list: "Lista zdrajców"
BBW_traitor_shopping_list_desc: "Warzecha wręczył mi dzisiaj listę. Znajdują się na niej nazwiska które łamią mi serce. Niektórych się nie spodziewałem. Niektóre są oczywiste. Gadomski - jasne, zawsze był ślepym liberałem. Zychowicz i Bartosiak - oczywiście, banda idealistycznych oportunistów. Wszyscy inni tak, tak, tak! Ale Roksana...miała być naszą przyszłością. To jest prawie pewne że została otumaniona przez tego diabła Gadomskiego, nie może być inaczej! Jak ktoś o takim nazwisku może sprzeniewierzyć swój predestynowany cel? Łukasz niestety ma rację, przy próbie zamachu stanu nie możemy być litościwi, nawet dla naszych najlepiej rokujących braci i sióstr. Niech będą przeklęci wszyscy rewizjoniści! A, i wezwijcie Zgierskiego!"
BBW_come_at_me_bro: "Dawaj na ring, Bracie"
BBW_come_at_me_bro_desc: "Byłeś moim bratem przy kuźni Rafał! Nawet mamy takie samo imię! Mieliśmy takie same ideały, więc gdzie nastąpił ten moment w którym przestaliśmy się rozumieć? Jasne, Woś zawsze był bardziej lewoskrętny niż przewidywała ustawa ale zgadzaliśmy się w najważniejszym - maszyna musi iść a węgiel musi być! Więc gdy słyszę że Woś uciekł na Śląsk i zamknął granice z nami odmawiając jakiegokolwiek kontaktu...to najgorsza ze wszystkich zdrad. I jeszcze kpi sobie z nas! Z całej Rady i całego systemu! Powiem Ci jedno Rafał - współtworzyłeś go. I na własnej skórze odczujesz jego moc. Twoi Czerwoni Paladyni nie obronią Cię przed naszym gniewem...pozostanie tylko popiół."
BBW_last_embers: "Ostatnie iskry oporu"
BBW_last_embers_desc: "Nie wierzę w to. Nie chcę w to uwierzyć. NIE ZAMIERZAM W TO UWIERZYĆ. JAKUB WIECH NIE ŻYJE, I NIKT MI NIE WMÓWI INACZEJ. PRZECIEŻ GO ZNISZCZYLIŚMY, TA CAŁA PIEPRZONA ATOMOWA KRUCJATA ZOSTAŁA ROZNIESIONA W PROCH. To musi być jakiś impersonator, podstawiony sobowtór, reakcyjna propaganda. Nie, nie widziałem nigdy jego ciała, ale to nie znaczy...to...NIC SIĘ NIE DZIEJE NA BAŁUTACH. Macie urojenia, nie widzieliście Jakuba Wiecha bo go tam nie ma. Tam nie da się przeżyć tak w ogóle. Nie istnieje taka siła na tym świecie która by sprawiła że uwierzę w to kłamstwo, w tą insynuację, w tą...plotkę. To kłamstwo rozpowszechniane przez jego wyznawców którzy chcą deifikować tę podłą kreaturę na bożka ekologii! A przecież bardziej na rękę im byłoby mieć męczennika. To co, Saddam Hussein też gdzieś żyje? Razem z Bin Ladenem i Jakubem Wiechem grają sobie w bierki na Bałutach? A może tam jest święty Graal i bursztynowa komnata? Darujcie sobie te kretyńskie...że jakie zdjęcia?\n\nKurwa, no nie. No po prostu KURWSXCMCVGNTYfdasghh@@@@1111111"
BBW_cutting_corporations: "Odcięcie korporacji"
BBW_cutting_corporations_desc: "Zbyt długo tolerowaliśmy istnienie innych korporacji. JSW, KGHM, Stołeczna Ropa. To wszystko pijawki które wysysają energię z dzieł stworzenia naszego Bractwa. Pankreacyjna tożsamość węgla nie dzieli ludzi, wręcz przeciwnie - ale to imperatywem naszego zakonu jest kontrola nad technologią energetyczną. My nie jesteśmy panami węgla, jesteśmy jedynie jego naczyniami, przepływa przez nas i jesteśmy jego wolą. I żadna z korporacji nie ma prawa sobie rościć żądań do tego surowca. Żadna. Bo żadna się nie ostanie. Nie potrzebujemy waszych żałosnych przedsiębiorstw, nie potrzebujemy waszego wsparcia. Dołączycie do nas, albo dołączycie do wszystkich którzy nam się przeciwstawili."
BBW_winds_from_the_east: "Wiatry ze wschodu"
BBW_winds_from_the_east_desc: "Upadek rozpoczął się inwazją ukraińską, i teraz, kilkanaście lat po tych tragicznych wydarzeniach znowu stoimy przed groźbą ukraińskiego najazdu. Rezuni, banderowcy, zdrajcy stanu, wiechowcy. Wszyscy lgną na Ukrainę jak mucha do gówna, oczekując że ta wielka ostoja demokracji będzie ich zbawieniem. Nie. Będzie ich grobowcem. Jest to praktycznie pewne że to również oni stoją za ostatnimi strajkami i protestami na wschodniej ścianie. Ta konserwatywna kraina nigdy nie odważyłaby się sama z siebie wystąpić przeciwko takiej władzy jak nasza. To muszą być wywrotowi opłacani sabotażyści. Ale już niedługo, jeszcze chwilka i Rzymkowski przeprowadzi kontratak przeciwko reakcjonistom. Już tuż tuż..."
BBW_threats_from_outer_world: "Zagrożenia świata zewnętrznego"
BBW_threats_from_outer_world_desc: "Świat się od nas odwrócił. Tym gorzej dla świata. Mogą myśleć że nie są gotowi na to co niesie prawdziwa rewolucja postępu, ale my i tak dotrzemy do nich czy tego chcą czy nie. Piękny dym niesiony wiatrem wytworzony przez błogosławiony akt spalania pokryje całą Europę. Zrozumiecie wtedy, niedowiarki jak bardzo myliliście się, węgiel to nie przeszłość. To nasza jedyna możliwa przyszłość. Na nic wasze sankcje, embarga, zamykanie granic, wasze wiatraki, wasza nieudolność, wasze kompromitacje i bezużyteczne rządy. Węgiel nie dyskryminuje, obejmie wszystkich synów i córki kontynentu jednakowo cudownym i ciepłym uściskiem. Wdychając opary energetycznego cudu zrozumiecie. Wtedy zrozumiecie. Wszystko będzie dla was jasne. Otwórzcie się na postęp."
BBW_strengthen_northern_garrisons: "Wzmocnienie północnych garnizonów"
BBW_strengthen_northern_garrisons_desc: "Północne rubieże Polski nie są jeszcze tak dobrze zagospodarowane jak centrum i południe. Przez to ludzie są bardziej...nieposłuszni. Ze względu na słabe zagęszczenie ludności dodatkowo jest to dość nieoptymalny teren do okupowania. Potrzebujemy tam więcej ludzi, więcej garnizonów. Bracia Karnowscy dostali zadanie sformowania misji ekspedycyjnej na terenach Pomorza. Oni już dopilnują by karbonizacja i industrializacja w tamtych rejonach przebiegła bezproblemowo i efektywnie. Dzięki temu, już niedługo i nad Bałtykiem będzie można oddychać świeżym, węglowym powietrzem a z kranów będzie płynąć ropa naftowa!"

##expansion

BBW_book_economy_1: "Ekonomia - Rozdział 1: Podstawy"
BBW_book_economy_1_desc: "Nasza polityka gospodarcza musi być spójna - stanowić element siły i potęgi. Szkoda, że nawet pośród nas opinie w tych sprawach się różnią. Nic dziwnego - ekonomia jest złożoną dyscypliną, a nawet największe umysły często nie zgadzają się co do jej zasad. Musimy jednak znaleźć wspólny grunt i ustalić jednolite podejście do zarządzania zasobami oraz bogactwem."
BBW_book_economy_2_gadomski: "Ekonomia - Rozdział 2: Struktury rynkowe"
BBW_book_economy_2_gadomski_desc: "Nasza polityka gospodarcza musi być spójna - stanowić element siły i potęgi. Szkoda, że nawet pośród nas opinie w tych sprawach się różnią. Nic dziwnego - ekonomia jest złożoną dyscypliną, a nawet największe umysły często nie zgadzają się co do jej zasad. Musimy jednak znaleźć wspólny grunt i ustalić jednolite podejście do zarządzania zasobami oraz bogactwem. Czasami jednak podejście liberalne może okazać się skuteczniejsze."
BBW_book_economy_2_warzecha: "Ekonomia - Rozdział 2: Skutki zewnętrzne"
BBW_book_economy_2_warzecha_desc: "Nasza polityka gospodarcza musi być spójna - stanowić element siły i potęgi. Szkoda, że nawet pośród nas opinie w tych sprawach się różnią. Nic dziwnego - ekonomia jest złożoną dyscypliną, a nawet największe umysły często nie zgadzają się co do jej zasad. Musimy jednak znaleźć wspólny grunt i ustalić jednolite podejście do zarządzania zasobami oraz bogactwem. A co może być lepszego od internalizacji negatywnych efektów zewnętrznych za pomocą odpowiednich podatków?"
BBW_book_economy_3_gadomski: "Ekonomia - Rozdział 3: Podaż i popyt"
BBW_book_economy_3_gadomski_desc: "Nasza polityka gospodarcza musi być spójna - stanowić element siły i potęgi. Szkoda, że nawet pośród nas opinie w tych sprawach się różnią. Nic dziwnego - ekonomia jest złożoną dyscypliną, a nawet największe umysły często nie zgadzają się co do jej zasad. Musimy jednak znaleźć wspólny grunt i ustalić jednolite podejście do zarządzania zasobami oraz bogactwem. Czasami jednak podejście liberalne może okazać się skuteczniejsze."
BBW_army_reforms: "Reforma wojskowa"
BBW_army_reforms_desc: "Najwyższy czas zreformować strukturę wojskową. Zabezpieczyliśmy granice wyłącznie za pomocą marnego sprzętu i przestarzałej taktyki. Nasi wrogowie się modernizują i nie możemy zostać w tyle. Musimy usprawnić strukturę dowodzenia, ulepszyć programy szkoleniowe i zainwestować w nowe technologie. Naczelny Paladyn Sommer ma kilka interesujących pomysłów, jak to osiągnąć."
BBW_army_reforms_2: "Reforma wojskowa"
BBW_army_reforms_2_desc: "Najwyższy czas zreformować strukturę wojskową. Zabezpieczyliśmy granice wyłącznie za pomocą marnego sprzętu i przestarzałej taktyki. Nasi wrogowie się modernizują i nie możemy zostać w tyle. Musimy usprawnić strukturę dowodzenia, ulepszyć programy szkoleniowe i zainwestować w nowe technologie. Naczelny Paladyn Sommer ma kilka interesujących pomysłów, jak to osiągnąć."
BBW_army_reforms_3: "Nieukończona reforma wojskowa"
BBW_army_reforms_3_desc: "Najwyższy czas zreformować strukturę wojskową. Zabezpieczyliśmy granice wyłącznie za pomocą marnego sprzętu i przestarzałej taktyki. Nasi wrogowie się modernizują i nie możemy zostać w tyle. Musimy usprawnić strukturę dowodzenia, ulepszyć programy szkoleniowe i zainwestować w nowe technologie. Naczelny Paladyn Sommer ma kilka interesujących pomysłów, jak to osiągnąć. Niestety z powodu różnych problemów wewnętrznych jesteśmy zmuszeni na razie wstrzymać część reform."
BBW_cytadela_tt: "Odblokowuje §YKombinat Parowy 'Cytadela'§! jako opcję przedsiębiorstwa zbrojeniowego"
BBW_gwarectwo_tt: "Odblokowuje §Y$BBW_pge_gornictwo$§! jako opcję przedsiębiorstwa cywilnego"
BBW_tramki_tt: "Odblokowuje specjalny projekt §YParowych Tramwajów§!"
BBW_privileged_miners_1: "Uprzywilejowana klasa górnicza"
BBW_privileged_miners_1_desc: "Górnicy są kręgosłupem naszego społeczeństwa. Bez nich nie byłoby węgla, energii ani postępu. To sprawiedliwe, by za ciężką pracę i oddanie otrzymali szczególne traktowanie oraz przywileje. Zapewniając im lepsze płace, warunki pracy i świadczenia socjalne, możemy zagwarantować lojalność oraz zaangażowanie w naszą sprawę."
mass_motorization_tt: "§YZwiększa§! §Ymotoryzację§! §Ypiechoty§! poprzez dodanie dodatkowego §Ybatalionu zmotoryzowanego§! do §RKAŻDEJ§! dywizji."
BBW_rehab_conscription_tt: "Spróbujemy §Yzrehabilitować§! i §Yzintegrować§! dawnych §Rkiboli Widzewa§! z jednostkami §Yarmii Bractwa§!."
BBW_lodz_chaos: "Miasto chaosu"
szczercow_bombers_captured: "§REkoterroryści odpowiedzialni za zamach w Szczercowie zostali złapani§!"
szczercow_bombing_happened: "§YNie zajmujemy się żadnymi problemami wewnętrznymi§!"
BBW_overextended_grid: "Przeciążona sieć energetyczna"
BBW_overextended_grid_desc: "Nasza sieć energetyczna jest napięta do granic możliwości, co powoduje częste przerwy i niestabilność. Przeciążenie ogranicza produktywność przemysłu i wpływa na codzienne życie obywateli. Jeśli szybko nie rozwiążemy problemu, konsekwencje mogą być poważne."
BBW_lodz_coal_deposits_exhausted: "Wyczerpane wojewódzkie złoża węgla"
BBW_lodz_coal_deposits_exhausted_desc: "A więc...pamiętacie ten cały węgiel który eksportowaliśmy do tych pożal się Boże, \"przyjaciół w dialogu\"? Pomijając fakt, że nie byli oni aż tacy przyjaźni gdy chcieliśmy odzyskać nasz węgiel...to w dodatku wygląda na to że udało im się CAŁY TEN WĘGIEL SPALIĆ. WY W OGÓLE WIECIE CO TO JAK DZIAŁA ZARZĄDZANIE ZAPASAMI?"
BBW_blow_up_lodz_tooltip: "§RZamkniemy§! kilka zakładów przemysłowych w §YŁodzi§! w celu ustabilizowania sieci energetycznej i zaoszczędzenia pozostałych surowców."
BBW_fuhrer_tooltip: "Starszy"
BBW_employing_electricians_tt: "§YZatrudnimy§! licznych §Yelektryków§! w celu naprawy §Ysieci energetycznej§!. To zdecydowanie §Yprzyspieszy§! proces §Ynaprawiania§! naszej infrastruktury"
BBW_blackout_energy_boost_tt: "Nasza produkcja §Yenergii§! §Ywzrośnie§!."
BBW_protecting_our_assets_tt: "§YZabezpieczymy infrastrukturę krytyczną§! przed §Ratakiem ekoterrorystów.§!"
BBW_protecting_our_assets_2tt: "Nasi robotnicy będą mogli §Ywrócić do wydobycia.§!"
BBW_conglomeration_idea: "Proces konglomeryzacji"
BBW_conglomeration_idea_desc: "Zbyt wiele małych zakładów działa niezależnie, co prowadzi do nieefektywności i konkurencji szkodzącej ogólnej produkcji przemysłowej. Łącząc je w jeden wydajniejszy konglomerat, możemy usprawnić produkcję, obniżyć koszty i zwiększyć siłę gospodarczą. W ten sposób przetrwamy i będziemy prosperować."
BBW_electricity_stamps_tt: "Wprowadzimy §Ybony energetyczne§!, by kontrolować przepływ pozostałej §Yenergii§!. Nasza produkcja §Yenergii§! §Ywzrośnie§!."
BBW_electricity_stamps_compliance_tt: "Ludność stanie się bardziej §Yposłuszna§!, ponieważ nie będzie musiała martwić się o wystarczającą ilość §Yenergii§!."
BBW_electricity_stamps_population_tt: "Niemal wyeliminujemy §Yniepotrzebne zgony§!, zapewniając §Yenergię§! najbardziej bezbronnym."
BBW_take_whoever_you_can_tt: "§YZabierzemy§! każdego, §Rchętnego czy nie§!, z niedziałających zakładów do pracy w §Ykluczowych sektorach gospodarki§!."
BBW_take_whoever_you_can_ic_tt: "Nasza §Yprodukcja przemysłowa§! §Ywzrośnie§!."
BBW_take_whoever_you_can_lr_tt: "Nasze §Ywydobycie zasobów§! §Ywzrośnie§!."
BBW_chop_whatever_you_can_tt: "§YWytniemy§! wszelkie §Rdrzewa§!, by zapewnić §Ypaliwo§! dla §Yelektrowni§! i zasoby dla §Yprzemysłu§!."
BBW_green_faction_tt: "Zrobimy wszystko, by §Ywyeliminować§! §Rfrakcje ekoterrorystyczne§! sabotujące nasze wysiłki."
BBW_blackout_overcome_tt: "Poradziliśmy sobie z §YBlackoutem§!"
BBW_new_brotherhood_spokesman_tt: "Wybierzemy przywódcę organizacji młodzieżowej. §RUwaga - ten wybór może mieć poważne konsekwencje w przyszłości§!"
BBW_flamer_corps_tt: "§Y[BBW.GetName]§!: Tworzy szablon dywizji miotaczy ognia składający się z: \n§Y4 batalionów miotaczy ognia§!"
