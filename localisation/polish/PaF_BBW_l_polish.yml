belchatow_dlc.1.t: "Czas Bezprawia"
belchatow_dlc.1.desc: "\"Ja, Rafał Ziemkiewicz, zaczynam prowadzić ten dziennik, ponieważ przyszłość nie zapowiada się dobrze dla nikogo z nas, a chciałbym, by inni dowiedzieli się, co się tutaj rzeczywiście stało.\"\nByło to pierwsze zdanie pamiętnika, który zaczął prowadzić 26.05.2025, gdy masowy cyberatak fałszywych informacji uderzył w legitymację prezydenta-elekta. Już wtedy wiedział, że wydarzą się straszne rzeczy, i postanowił coś z tym zrobić. Odpowiedział na wezwanie Warzechy do stworzenia nowego ruchu politycznego. Jako gospodarz zaprosił najwybitniejszych niezależnie myślących publicystów i polityków do rodzinnej Łodzi. Mnie, Warzechę, Janeckiego, Gadomskiego, Sommera i Rzymkowskiego. Wszyscy zgromadziliśmy się na panelu dyskusyjnym, który odbył się pamiętnego 13 czerwca.\n\"Nie wierzę, że te dranie w końcu to zrobiły. Niech wszyscy idą do diabła\". Tak pomyślał o 16:41, gdy eksplozja atomowa pochłonęła pięćdziesiąt tysięcy łodzian. Patrząc na te słowa dwa lata później, zastanawiał się, czy wypada je publikować. Nie był już przecież zwykłym publicystą, lecz szanowanym Starszym.\nPamiętał, jak po wybuchu transport stał się całkowicie niedostępny albo zbyt niebezpieczny, przez co cała szóstka utknęła w Łodzi. Próbowali wspólnie kontynuować dziennikarskie rzemiosło, lecz nie wystarczało to na utrzymanie, ponieważ mieszkańcy walczący o zakup żywności nie zwracali uwagi na gazety. Nadszedł czas ruszyć dalej.\n\"Odrzucając nasze przesłanie, mieszkańcy Miasta Fabryk wyrzucili nas. Usłyszeliśmy o powstaniu Republiki Bełchatowskiej na południe od Łodzi i postanowiliśmy się tam osiedlić, ponieważ Tomasz Rzymkowski zapewniał, że prezydent Patryk Marjan nas przyjmie. Jego przypuszczenia okazały się słuszne.\nIstotnie powitał nas patriotyczny prezydent, który chciał wykorzystać nasze umiejętności oratorskie do negocjacji z górnikami strajkującymi z powodu obniżonych płac i braku bezpieczeństwa nawet na głównych drogach. Kiedy przybyliśmy, to ja przemówiłem.\"\n- Dzielni górnicy! Słyszałem o waszych trudach i głęboko wam współczuję. Nie ponosicie winy za swoje nieszczęścia, nie odpowiada za nie również \"rzeczywistość gospodarcza\". Prawda jest taka, że wrogowie Polski wbili wam nóż w plecy - ekolodzy sabotujący wasze wysiłki i szerzący propagandę, że wasza ciężka praca jest niepotrzebna, a nawet szkodliwa. W swej arogancji chcieli zastąpić was reaktorami jądrowymi. I co przyniosła nam energia jądrowa? Wyłącznie śmierć i zniszczenie! Chodźcie z nami uderzyć w Zielone Zagrożenie i jego kłamstwa. Ceny i wasze płace wzrosną, gdy ludzie zaczną wierzyć w potęgę węgla. Chodźcie ze mną, razem przywrócimy waszemu zawodowi dawną chwałę! Jako Bractwo Węgla!\nPochód górników wkroczył do Bełchatowa, a prezydent Marjan, mądrze dostrzegając potencjał naszej sprawy, ustąpił ze stanowiska i przekazał władzę mnie, Starszemu Bractwa.\nWkrótce nasze wielkie reformy gospodarcze nadzorowane przez Starszego Paladyna Gadomskiego zmieniły Bełchatów i okolice w potęgę gospodarczą. Widząc sukcesy, piloci 32. Bazy Lotniczej podporządkowali się aneksji, oferując pomoc przeciw zagrożeniu bandytów w zamian za zaopatrzenie\".\nStarszy Ziemkiewicz po raz ostatni spojrzał na wspomnienia i uznał, że lepiej nie wspominać, iż Marjanowi zagrożono, by ustąpił, a cud gospodarczy wynikał głównie z utworzenia Strefy Wolnego Handlu Dialogu krótko po marszu górników na Bełchatów."
belchatow_dlc.1.a: "Punkt widzenia zależy od punktu siedzenia"

belchatow_dlc.2.t: "Cała Kupa Wielkich Braci"
belchatow_dlc.2.desc: "- Dość przeszłości - Ziemkiewicz spojrzał na zegar i odłożył pióro po napisaniu kolejnego rozdziału wspomnień. - Czas na przyszłość!\nWkrótce miało się rozpocząć zaplanowane posiedzenie rady. Po drodze Ziemkiewicz rozmyślał, jak szczęśliwie ułożyła się sytuacja. Bractwo przezwyciężyło słabości dawnego duopolu. Odkąd partyjne kłótnie zniknęły z życia politycznego, jeden zjednoczony ruch może osiągać wielkie rzeczy. Synteza wszystkiego, co Polacy cenili przed Upadkiem. Dawne sposoby torują drogę ku przyszłości, jakiej jeszcze nie widziano. Środowisko, w którym drobni przedsiębiorcy nie są zakładnikami nadmiernych regulacji, lecz państwo nie pozostaje bezczynne przy realizacji ambitnych przedsięwzięć. Kto wie, co wielkie umysły rady wymyślą dzisiaj?\nZiemkiewicz wszedł do sali konferencyjnej spóźniony, a obrady już trwały.\n- Prosiłem tylko o trochę więcej czasu, żeby ich śledzić - Janecki był wyraźnie wzburzony. Cieszyło to Ziemkiewicza, ponieważ zwykle trudno było wydobyć cokolwiek z tego cienia człowieka. Bractwo może rozwijać się wyłącznie dzięki nieustannej dyskusji. - Mogli doprowadzić nas do większej grupy, którą zlikwidowalibyśmy jedną precyzyjną operacją.\n- Wiesz, co jeszcze może zlikwidować wrogą grupę? - odpowiedział Sommer, rozmówca Janeckiego. - Zmiażdżenie jej członków, by wysłać reszcie wiadomość. Poza tym zasoby zmarnowane na długie śledztwo można i należy skierować do armii walczącej z wrogami poza naszym terytorium. Nie musielibyśmy kłócić się o finansowanie, gdybyśmy mieli gotowy plan gospodarczy zwiększający dochody.\nSommer wymownie spojrzał na Gadomskiego. Żaden z nich nie zauważył obecności Ziemkiewicza.\n- Plan *jest* gotowy. Od pewnego czasu - odpowiedział Starszy Paladyn gospodarki. - Gdybyście nie blokowali go, wspierając drapieżną kontrpropozycję Warzechy, mielibyśmy już pieniądze.\n- Jesteśmy w stanie ciągłej wojny. Twoje miękkie reformy nadają się jedynie do życia cywilnego. Poza tym Rada Bractwa składa się z pięciu członków właśnie po to, by przełamywać takie impasy. Starszy - spojrzał na Ziemkiewicza, który zdążył wygodnie rozsiąść się na krześle - musi przestać kluczyć i opowiedzieć się po jednej ze stron.\nOczywiście wszyscy przypominają sobie o nim, gdy trzeba kogoś obwinić.\n- Dobrze. Przeprowadzimy ostatnią dyskusję o tym, kto chce który kawałek tortu, a potem oddam ostateczny głos."
belchatow_dlc.2.a: "Słuchamy"

belchatow_dlc.3.t: "Tyle słońca w całym mieście"
belchatow_dlc.3.desc: "Naczelny Paladyn Sommer z wielkim niezadowoleniem obserwował szkolonych rekrutów. Tylko przechodził przez wojskowy ośrodek szkoleniowy w drodze na spotkanie ze swoim zastępcą, Tomaszem Rzymkowskim. Mimo to widział wszystko, co było nie tak z nowicjuszami.\n- Musimy podjąć drastyczne działania, bo będzie po nas, umrzemy i znikniemy, gdy tylko któryś watażka choćby na nas kichnie - wybuchł Sommer natychmiast po wejściu do gabinetu. Rzymkowski czekał w środku.\n- Chyba nie może być aż tak źle? - Rzymkowski próbował uspokoić przełożonego. - Rozmawiałem z kilkoma i wyraźnie znają Aksjomaty Bractwa.\n- Zupełnie nie o to chodzi - Sommer uciął próbę rozładowania napięcia. Najpierw musiał dać upust emocjom. - Nie chodzi o to, za co walczą, tylko jak walczą. Zwerbowani spośród górników umieli machać kilofem, uczniowie zawodówek zdążyli nauczyć się mocno uderzać, ale poza tym? Żaden nie strzelał szczególnie dobrze, a ochotnicy z miast nie potrafili niczego. Pauperyzacja, a potem rozwiązanie resztek armii sprzed Upadku, zarządzone ze strachu przez Starszego, pozostawiły wojsko całkowicie w ciemności. Najwyższy czas zakończyć miesiąc miodowy i wziąć żołnierzy za mordy.\n- Oczywiście, tak jest! - Rzymkowski zasalutował. - Jak tylko dostanę plany konkretnych obszarów, natychmiast je wdrożę.\nSommer wreszcie miał powód do uśmiechu.\n- Dziękuję, Tomaszu. - Był wdzięczny za postawę Rzymkowskiego. Ten zaakceptował swoje miejsce, choć w przeszłości piastował stanowisko polityczne. Musiał zrozumieć to samo co Sommer: dawne tytuły nic nie znaczą w nowej rzeczywistości. Teraz pozycję w społeczeństwie określają zasługi, nie znajomości. - Mimo wszystko jesteś najbardziej godnym zaufania z naszych Braci. Moją prawą ręką, a nawet następcą!\n- Mimo wszystko? Nieważne. - Rzymkowski porzucił temat, przyjął komplement i skupił się na drugiej części. - Co masz na myśli, mówiąc \"następcą\"?\nJako najważniejszy dowódca Bractwa Sommer podczas bitew będzie bezpiecznie siedział w kwaterze głównej, nie na polu walki, gdzie mógłby zginąć albo zostać ranny, więc nie musiał myśleć o następcy. A jako Naczelny Paladyn nie mógł również rozważać awansu - nie istniało wyższe stanowisko, chyba że... \n- Nie powiedziałem, że Ziemkiewicz mylił się, obawiając wojska - rzekł Sommer z uśmieszkiem na widok zaskoczenia Rzymkowskiego."
belchatow_dlc.3.a: "Nie widziałeś tego jeszcze"

belchatow_dlc.4.t: "Bez marzeń" #dziękuję bardzo pan Bot, do redakcji
belchatow_dlc.4.desc: "Starszy Rafał Ziemkiewicz siedział w studiu nadawczym, a ostre światła oświetlały jego pooraną twarz. Za nim z uroczystym dostojeństwem wisiały czarne jak węgiel sztandary Bractwa. Kamera skupiła się na zmęczonych, lecz zdeterminowanych oczach, gdy zaczął przemawiać do mikrofonu głosem niosącym ciężar oblężonego narodu.\n\n- Współobywatele Bractwa - zaczął chrapliwym głosem po latach palenia papierosów z węglowym filtrem. - Stoimy dziś wobec bezprecedensowego zagrożenia. Ekoterroryści pokazali prawdziwe oblicze. Wypowiedzieli wojnę nie tylko naszym ideałom, lecz samemu naszemu przetrwaniu.\n\nPrzerwał, pozwalając ciszy opaść na studio niczym popiół.\n\n- Zbyt długo byliśmy cierpliwi. Zbyt długo okazywaliśmy powściągliwość. Lecz powściągliwość nie jest słabością - to cisza przed burzą. Burzą, która zmiecie wszystkich ośmielających się rzucić wyzwanie wyższości węgla i Zdrowego Rozsądku.\n\nZiemkiewicz pochylił się naprzód, a zaciskające się na biurku knykcie pobielały.\n\n- Mówię wam teraz: znajdziemy ich. Znajdziemy każdego ostatniego ekofaszystę, każdego sympatyka wiechowców, każdego kochającego zieleń zdrajcę. I staną przed sprawiedliwością. Nie miękką sprawiedliwością sądów, lecz szybką sprawiedliwością ludzi rozumiejących, że postęp wymaga ofiar.\n\n- Brat stojący obok może coś ukrywać; jeśli macie jakiekolwiek wątpliwości co do jego lojalności - zgłoście go. Sąsiad podlewający rośliny - zgłoście go. Dziecko mówiące o drzewach - zgłoście je. W czasie wojny nie ma miejsca na litość ani wątpliwości. Musimy mieć pewność, musimy wiedzieć.\n\nJego głos rozbrzmiewał teraz po studiu i na każdej częstotliwości radiowej kontrolowanej przez Bractwo.\n\n- Jesteśmy Bractwem Węgla! Jesteśmy strażnikami postępu! I NIGDY nie poddamy się zielonej zarazie! Ani dziś, ani jutro, ani kiedykolwiek!"
belchatow_dlc.4.a: "Idziemy po was!"

belchatow_dlc.5.t: "Władca Szczurów"
belchatow_dlc.5.desc: "Ziemkiewicz usiadł w fotelu, próbując odpocząć w mieszkaniu po kolejnym dniu dobrej pracy. W ostatnich tygodniach niestrudzenie realizował cele Bractwa. Uchwalał prawa w gabinecie, po czym wracał do domu, by przy własnym biurku pisać przemówienia i artykuły. Przez pewien czas wydawało się, że samotnie dźwiga całą organizację, lecz z czasem pozostali członkowie Rady wreszcie nauczyli się swoich ról i zaczęli przejmować inicjatywę.\nNie zawsze wychodziło to na dobre.\nNiedługo po założeniu słuchawek ktoś zapukał do drzwi. Próbował to zignorować, lecz pukanie się powtarzało. W końcu podszedł, wiedząc, że ochrona nie wpuściłaby pierwszego lepszego człowieka. Spojrzał przez wizjer i, któż by pomyślał, stał tam szpieg. Ziemkiewicz otworzył drzwi, a Proktor Janecki wszedł, przywitał gospodarza i wręczył mu wino Górnicze, czerwone i bardzo słodkie.\n- Proszę usiąść w salonie. Rozgość się - powitał go niechętnie Ziemkiewicz.\nPrzyniósł kieliszki, nalał po troszce obu i spróbował. Było okropne, z pewnością wyłącznie przez nazwę. Jakby w ten sposób można było zdobyć przychylność Ziemkiewicza...\n- Chciałem porozmawiać o finansowaniu mającej wkrótce powstać Agencji Wywiadu - powiedział wprost Janecki.\nZiemkiewicz pomyślał, że majaczy, ale trunek nie był aż tak mocny.\n- Rada obradowała nad tym wielokrotnie. Za każdym razem postanawialiśmy odłożyć utworzenie agencji, dopóki nie uruchomimy gospodarki i armii.\n- Tak, ale pomyślałem, że można skierować część podatku dochodowego z dodatkowych dwóch godzin dnia pracy na utworzenie \"Węglowego Kręgu\".\n- Nawet wymyślił nazwę - pomyślał Ziemkiewicz.\n- Pomimo całego dobra, które czynimy, nikczemne, podłe szumowiny bez moralności nadal pełzają w mroku, próbując nas podkopać, unicestwić przemysł, a przez to zgładzić ludzkość! - Przemówienie Janeckiego było wyraźnie przygotowane i przesadzone. Mówił głośno jak na wiecu, przez co wyglądał na bezgustownego lizusa.\nPo namyśle należało się tego spodziewać. Ziemkiewicz przypomniał sobie, że w czasach komunizmu Janecki należał do Związku Socjalistycznej Młodzieży Polskiej. Po zmianie ustroju skręcił w prawo. Stał się w tym tak dobry, że został spin doktorem. Po tylu zmianach drużyny całkowicie utracił autentyczność, którą zastąpiła niedopasowana przesada. Działało to tak dobrze, że Rada, w tym Ziemkiewicz, często zapominała o tym epizodzie i zachowywała się, jakby to Gadomski miał najbardziej haniebną przeszłość z całej grupy. Dzisiaj Proktor jednak przeholował i w jego wizerunku pojawiły się pęknięcia. Naprawdę musiał pragnąć tej agencji.\n- Wiem, Stasiek. Wszyscy o tym wiedzieliśmy, a jednak zagłosowaliśmy przeciw pospiesznemu tworzeniu agencji.\n- Szkoda - powiedział Janecki cichym, wyrachowanym głosem, brzmiąc teraz pewniej. Założył kolejną maskę. - Szkoda dla całego Bractwa. Może to zmieni twoje zdanie.\nPomachał plikiem papierów. Uwagę Ziemkiewicza przyciągnął tytuł \"Teczka Rady\".\n- Mógłbyś rozkazać mi to przekazać Tobie - ciągnął spokojnie Janecki, czując, że Ziemkiewicz połknął haczyk - ale tylko gdybym był oficjalnym szefem wywiadu. Obecnie to prywatne akta zgromadzone przez moich przyjaciół i nie masz nad nimi władzy.\n- Dobra, już - masz rację. - Starszy nie znosił intryg wewnątrz Rady. - Dam Ci agencję, jeśli przekażesz mi to, co tam masz."
belchatow_dlc.5.a: "Jakimś cudem, to Ziemkiewicz stał się myszą w pułapce"

belchatow_dlc.6.t: "Zamach bombowy w Szczercowie"
belchatow_dlc.6.desc: "Dzisiaj w Szczercowie, małym mieście w sercu terytorium Bractwa, doszło do tragedii, gdy okolicą wstrząsnęła seria eksplozji. Wybuchy następujące w krótkich odstępach pogrążyły społeczność w szoku i żałobie.\n\nPierwsze doniesienia wskazują, że spowodowały je improwizowane ładunki wybuchowe podłożone przez ekoterrorystów. Celem ataku były koszary Bractwa i niestety w eksplozji zginęło siedmioro naszych żołnierzy. Nie wiemy, gdzie znajdują się terroryści, ale znamy ich wygląd. Nadszedł czas polowania."
belchatow_dlc.6.a: "O, nie..."

belchatow_dlc.7.t: "Pęknięcia w firmamencie"
belchatow_dlc.7.desc: "Ambasador Andrzej Kopek chciał zapaść się pod ziemię pod osądzającymi spojrzeniami całej rady górniczych fanatyków. \n- Jaki jest plan Hołowni, panie ambasadorze? - Starszy Ziemkiewicz marszczył brwi, pochylony nad stołem konferencyjnym. - Wysłano pana, by informował nas o polityce Wolnego Miasta, a tymczasem trzyma nas pan w ciemności, jakbyśmy rozmawiali w szybie. \n- Sytuacja jest tragiczna - znacznie spokojniej wtrącił Janecki. - Kluby znów walczą, głodne psy Sapkowskiego szaleją przeciwko Triumwiratowi, a teraz Harcerze wkraczają na nasze terytorium. Hołownia nadal milczy, a jego wcześniejsze reakcje na kryzysy były niewystarczające. Nie wiemy, na czym stoimy. Kopek nie mógł im nic powiedzieć. Po wszystkim, co działo się w województwie, Hołownia stroił fochy. Od pewnego czasu trzymał wszystkich w niewiedzy, a tych, którzy ośmielali się pytać, witał złośliwymi uwagami. Kopek postanowił zastosować wobec kierownictwa Bractwa ogólną odpowiedź numer 2. \n- Sfera Dialogu jest stałą, która pomaga pokojowo rozwiązywać konflikty. Oczywiście nie jest równie widowiskowa co polityka \"ciężkiej pałki\", lecz na dłuższą metę daje znacznie lepsze rezultaty dzięki nienaruszaniu delikatnej równowagi korzyści, z której wszyscy wspólnie czerpiemy. W imieniu Prezydenta Wolnego Miasta Łodzi proszę o cierpliwość, ponieważ rezultaty przyniesie proces kompromisu i namysłu. - Wiedział, że numer 2 nigdy nie zawodzi. \nZanim ktokolwiek z Rady odpowiedział, do sali wbiegł asystent. \n- Przepraszam, panowie... Paladyni... Rado. Wybaczcie, że przerywam, ale... - próbował złapać oddech. \n- Wyduś to wreszcie - ponaglił go Ziemkiewicz. \n- Chodzi o... Łódź. Po prostu włączcie telewizję.\nSzef Kopka wreszcie postanowił go poinformować. \n- Z wielkim smutkiem doszedłem do wniosku, że projekt Dialogu w województwie łódzkim nie może dłużej funkcjonować...\nAmbasador nie był w stanie słuchać. Mózg, próbując chronić psychikę właściciela, odciął się od exposé Hołowni. Wszystkie lata wspierania go przed Upadkiem i po nim, użerania się z bełchatowskimi świrami zamiast szukania lepszej pracy. Wszystko dla pokojowej przyszłości. Wszystko na nic.\n- Ambasadorze - jakiś głos próbował wyrwać go z otępienia.\n- Nie jestem już ambasadorem - pomyślał, a może powiedział to na głos?\n- Ambasadorze - Proktor Janecki pochylił się blisko jego głowy, by zmusić go do skupienia. Na twarzy miał ledwie widoczny uśmiech, o ile nie był częścią derealizacji. - Chyba nie będziemy już potrzebować pańskich usług."
belchatow_dlc.7.a: "Proszę przekazać pozdrowienia przedstawicielce Ogórek"

belchatow_dlc.8.t: "Maszyna musi iść"
belchatow_dlc.8.desc: "Patrolowanie kopalni Bełchatów niemalże sprawia że marzysz o prawdziwej nuklearnej zimie zamiast tego, co rzeczywiście wydarzyło się na Bałutach. Kopalnia była gigantyczną raną w ziemi, a szeregowy Koziecki stał na jej krawędzi niczym skrzep mający powstrzymać planetę przed wykrwawieniem. Pod nim dół wił się do środka, warstwa za warstwą poczerniałych tarasów schodziła w mgłę. W sercu poruszali się giganci - koparki wielonaczyniowe, stalowe kręgi nabijane zębami, bez końca wgryzające się w pokłady lignitu. Posuwały się z przerażającą cierpliwością, a ich jęki łączyły się w jedną mechaniczną pieśń. Pył węglowy był wszędzie. Dobrze, że mieli kombinezony. Słońce wisiało nisko za smogiem, napęczniałe i czerwone, jakby próbowało uciec z nieba.\n- Alfa Trzy, melduj. Stan zachodniego wyrobiska? - usłyszał Koziecki w słuchawce. Dowódca był dziś bardzo spięty. Coś miało się wydarzyć.\n- Brak ruchu - odpowiedział, omiatając wzrokiem okolicę. - Tylko pył i praca maszyn.\nNie dodał tego, co czuł: że coś go obserwuje. Hałas koparek nigdy nie ustawał. Wypełniał umysł i ścierał myśli. Koziecki rozumiał już, dlaczego weterani unikali zbyt długiego patrzenia na nie. Wydawały się żywe - niczym wiecznie głodne bestie. Ziemię przeszyła wibracja. Niewłaściwa. Zbyt ostra. Zbyt nagła. Koziecki zesztywniał.\n- Alfa Trzy do dowództwa, wykrywam...\nEksplozja wyrwała zdanie z jego ust. Ogień wybuchł pod Koparką K-17. Stal zawyła, gdy gigant szarpnął się, a koło czerpakowe stanęło w połowie obrotu. Syreny ostrzegawcze zajęczały cienko i panicznie.\n- Są pod ziemią! - krzyknął ktoś przez radio. - Liczne kontakty!\nPostacie powstały z pyłu niczym duchy kopalni. Poruszały się nisko i szybko, owinięte płaszczami barwy popiołu, z twarzami ukrytymi pod maskami oddechowymi. Znały rytm kopalni i martwe pola. Płynęły ścieżkami serwisowymi, które według zapewnień były nieprzejezdne. Rakieta pomknęła w górę. Kolejny wybuch rozdarł bok koparki. Taśmy pękały. Gigant zadrżał, ranny. Koziecki otworzył ogień. Karabin kopał w ramię, a błyski lufy na moment malowały wyrobisko białym światłem. Jeden napastnik upadł. Pozostali nie zwolnili. Wtedy zrozumiał, co robili. Nie niszczyli maszyny całkowicie - unieruchamiali ją. Osaczali. Obrońcy byli bezradni, gdy inni napastnicy z oddali przygwoździli ich lawiną ognia. Koparka wydała ostatni, głęboki i niemal żałobny jęk, po czym znieruchomiała. Czarny dym wzniósł się na tle czerwonego nieba.\n- Alfa Trzy do dowództwa, potrzebujemy natychmiastowego wsparcia w sektorze Złoczew-13! TERAZ!\nPosiłki były jednak bardzo daleko, a wojownicy pyłu szaleli pośród ich szeregów, z rakietami przelatującymi nad głowami niczym w sylwestrową noc. Każdy pocisk trafiał jednak precyzyjnie w słaby punkt koparki. Zanim żołnierze zdołali przegrupować się do kontrataku, otoczyła ich gigantyczna zasłona dymna i ostrzał ustał. Skończyło się równie szybko, jak zaczęło. Gdy pył opadł, nikogo już nie było. Lecz poczucie bycia obserwowanym nie minęło..."
belchatow_dlc.8.a: "Gdzie jestem płomieniem, ty bądź węglem"

belchatow_dlc.9.t: "Przeminęło ze smogiem"
belchatow_dlc.9.desc: "Sebastian przekręcił kluczyk w starej ciężarówce Volvo. Potężny pióropusz dymu, który wyrzucała podczas jazdy powiatowymi drogami, skurczył się do małych obłoczków i wreszcie zniknął. Pojazd stanął. Energicznie klepnął zagłówek, próbując obudzić kolegów uśpionych nieregularnym terkotem dawno nieserwisowanego silnika. \n\n- Dobra, chłopaki. Jesteśmy. Ruszamy. Im szybciej załatwimy sprawę, tym szybciej wrócimy. \n\nZałoga ospale wysiadła, prostując nogi w drodze do celu. \n\n- Jakieś problemy po drodze?\n- Tym razem nie. Ale nadal nie czuję się tu bezpiecznie. Mnóstwo niespacyfikowanego terytorium. Nie wiem, jak możecie spać, wiedząc, że dosłownie w każdej chwili może nas ktoś napaść.\n- Zrozumiesz, jak też zaczniesz brać dodatkowe zmiany.\n- Mhm. Lepiej nabierz sił, bo w drodze powrotnej ty prowadzisz, pamiętasz? Masz szczęście, że w przeciwieństwie do ciebie naprawdę będę stał na straży.\n- Tak, tak. Nie musisz mi przypominać, dupku. \n\nSebastian przeciął łańcuch nożycami i pchnął bramę, wchodząc na teren. \n\n- Boże, ale dziura. Jesteś pewien, że to tutaj?\n- Zgadza się z kontraktem. Spodziewałbym się, że miejsce, do którego wysyłaliśmy cały węgiel, będzie wyglądać bardziej... przemysłowo, ale może nie mieli gdzie indziej go składować.\n- Żałosne. Co to w ogóle jest, wysypisko?\n- Uch, chyba tak. Czuję ten smród przez maskę gazową.\n- Trudno. Nie możemy wybrzydzać. Węgiel to węgiel, nieważne, gdzie leżał. \n\nGrupa ruszyła naprzód i wspięła się na sztuczne wzgórze zbudowane pierwotnie do składowania odpadów regionu. Na szczycie spojrzeli w dół, próbując wypatrzyć zdobycz.\n- Widzisz?\n- Na razie nic. Może potrzebne będzie dokładne przeczesanie terenu.\n- Cholera, jakie czesanie!? Chcesz otwierać każdy worek ze śmieciami w nadziei, że znajdziesz w nim węgiel? Wracamy.\n- Ale Starszy powiedział, żeby nie wracać bez...\n- Nie obchodzi mnie, co powiedział Starszy! Nie widzisz, że nas oszukali!? Węgla tu nie ma, Łukasz. Nigdy nie było. Prędzej weźmiesz kilof i wykopiesz dziurę pionowo w dół, aż sam go wydobędziesz, niż znajdziesz cokolwiek, poświęcając temu miejscu choćby sekundę więcej.\n- Chwila, umowa wyraźnie mówiła, że wysyłaliśmy go do tego obiektu. Ktoś musiał realizować dostawy!\n- Czyżby? A może po prostu pozwoliliśmy innym zajmować się logistyką? Założę się o wszystko, że połowa drani pozbywała się go zaraz po przekroczeniu granicy, by zrobić nam na złość. Albo sprzedawała dla szybkiego zysku.\n- Co teraz?\n- To co zawsze. Wracamy, meldujemy dowódcy i liczymy, że tym razem nie wyładuje na nas gniewu. Będzie dobrze. Na szczęście nas potrzebują."
belchatow_dlc.9.a: "Czasami poddanie się naprawdę jest najlepszą opcją."

belchatow_dlc.10.t: "Strefa Zero"
belchatow_dlc.10.desc: "- Szefie, północna Łódź padła.\nW ciemnym bunkrze oświetlonym awaryjnymi lampami dwóch Paladynów krążyło wokół trzeciego, wyższego rangą, przed którym leżał stos raportów, projektów i schematów. Odpowiadali za wrak podstacji, a tym razem problem nie tkwił w samej stacji. Mimo to, jeśli nie przywrócą zasilania całej północnej jednej trzeciej Łodzi, będą mieli przejebane. \n- Jeśli twierdzicie, że bezpośrednią linię do Bełchatowa sabotowano, każdy inny punkt sieci został kiedyś przez nas odcięty podczas ataku na wrogów z Dialogu, a mamy najwyżej dziesięć metrów kabla wysokiego napięcia, istnieje tylko jeden sposób przywrócenia prądu.\n- Dokopanie się do sabotowanych linii, odciętych przez nas albo partyzantów, zajmie tydzień lub dwa.\n- Wiem. Dlatego przekierujemy wschodnie przewody do południowej linii biegnącej przez Zonę.\n- Ale szefie, nawet nie wiemy, czy linia w Strefie działa! - Paladyni coraz bardziej się niepokoili, wiedząc, dokąd ich to zaprowadzi.\n- Zaraz się dowiemy, co? Nikt nie miał powodu rozkopywać linii Zony, a poza tym omija miejsce sabotażu. - Obaj zabrali się więc do przekierowywania podstacji. Zgodnie z przewidywaniami bez skutku. Wrócili do bunkra w kombinezonach ochronnych, wiedząc, dokąd zostaną wysłani.\n- Nie chcę tego słuchać! Weźcie zapasowe zestawy naprawcze, kabel i naprawcie tę przeklętą linię! Jeśli została przerwana, to nad ziemią przez szabrowników. Ruszać dupy, TERAZ! Jeśli jutro nie zobaczę świateł w tej podstacji, przysięgam, że pożałujecie, że nie czołgacie się przez radioaktywny pył! - Dowódca krzyczał, jakby Paladyni wcale nie pakowali już tabletek z jodem."
belchatow_dlc.10.a: "Łódź w końcu miała promienieć. Ale najpierw promienieli Paladyni.

belchatow_dlc.11.t: "Wezwanie do broni"
belchatow_dlc.11.desc: "\n- Łał, nie wierzę, że naprawdę szkolę się na Rycerza Bractwa Węgla. Czy to nie jest wspaniałe? - Młody Oliwier Słonik rozejrzał się po pozostałych rekrutach wiezionych do ośrodka, lecz nie znalazł wśród nich wiele entuzjazmu. Większość była poborowymi, wielu pochodziło z ziem pokonanych łódzkich watażków. Niektórzy zgłosili się jak Oliwier, lecz ile tak naprawdę mieli w tym wyboru? Jeszcze przed Upadkiem Bełchatów odcinał się od reszty województwa z powodu braku cywilnej kolei, przez co większość młodzieży pozostawała uwięziona między karierą górnika i taksówkarza. Nowy reżim dodał możliwość służby wojskowej, lecz zadowoliło to niewielu. Ci, którym odpowiadała ta droga, umieli na tyle dobrze wyczuć nastroje, by milczeć pośród niezadowolonych. \n- Kiedy w ogóle będziecie mieli okazję walczyć za sprawę większą od was samych?\n- Już miałem - odpowiedział potężny łysy mężczyzna. - Ale teraz gazety mówią, że byli nielegalnymi uzurpatorami, więc się zamknij.\nSłonik stracił ochotę na rozmowę, lecz jego myśli błądziły. Wyobrażał sobie siebie w mechanicznym egzoszkielecie, strzelającego z miotaczy ognia podczas rozszerzania wpływów Bractwa na zachód, za zaporę Jeziorsko. Zaplanował karierę od marnego rekruta po Wysokiego Paladyna. Wiedział, że dzięki odwadze szybko zostanie bohaterem, ratującym damy przed mutantami wypełzającymi z piekielnego krajobrazu Bałut. Właśnie miał otrzymać wyimaginowany pocałunek, gdy autobus stanął.\n- Dobra, mięczaki. Wysiadać - głos kierowcy sprowadził Oliwiera na ziemię.\nPo wyjściu zauważył, że coś jest nie tak. Przed podróżą dokładnie przestudiował formularz rekrutacyjny Bractwa, a miejsce nie przypominało żadnego ośrodka szkoleniowego.\n- Witajcie, adepci! - Stanął przed nimi mężczyzna w czarnym mundurze. - Jestem Starszy Rycerz Lorenc, wasz dowódca. Nie wiem, czego oczekiwaliście, przyjeżdżając tutaj, ale oto, co zrobicie. Cywilizowane życie zależy od energii. Energię czerpiemy z węgla, więc przez pierwsze tygodnie będziecie pomagać górnikom wydobywać ten cenny materiał z łona Matki Ziemi. Wzmocni to wasze ramiona i poprawi technikę walki, byście w odpowiedniej chwili umieli roztrzaskać czaszkę dzięki nauce rozłupywania skał. - Ale dowódco... - Górnictwo było tym, czego Oliwier chciał uniknąć. - Kiedy dostaniemy broń? - Starszy Rycerz rzucił kilof pod jego stopy."
belchatow_dlc.11.a: "Oto broń adepta!"

belchatow_dlc.12.t: "Do ostatniej kropli krwi"
belchatow_dlc.12.desc: "Budzik dzwoni o piątej rano. Wszyscy w tymczasowych koszarach zduńskowolskiego oddziału Dywizji Sanitarnej Bractwa budzą się, by powitać nowy dzień. Prąd nominalnie przywrócono, lecz ponowne podłączenie wszystkich części terytoriów kontrolowanych przez Bractwo wymagało czasu. Dlatego większość pracowników Dywizji spała w miejscu pracy, ponieważ niewielu stać było na dość energii, węgla lub koksu, by ogrzać domy. Poza tym cały bałagan wywołany Blackoutem wymagał nieustannej czujności Dywizji Sanitarnej. Ignacy Rżewski był jednym z takich robotników. Podpełzł do dzisiejszego grafiku, by zobaczyć, który szczątek marzeń Ziemkiewicza przypadnie mu tym razem. Zespół 1 - usuwanie wysadzonych podstacji, Zespół 3 - sprzątanie gruzu po masowym plądrowaniu sklepów, Zespół 7, jego zespół - Królewska 29. \n- Jak zwykle mam szczęście - mruknął i ruszył do samochodu z kanapką zrobioną z suchara oraz konserwowej pasty drobiowej.\nPo drodze widział coraz więcej otwieranych sklepów. Chleb można było piec i sprzedawać przynajmniej w przedsiębiorstwach, których nie splądrowano. Nadal wiele dzieci błagało o jedzenie, choć mniej niż tydzień temu. Ulice wciąż pełne były zepsutych tramwajów i złamanych ludzi ogrzewających się w zimny poranek przy ogniu w beczkach.\nGdy wreszcie dotarli do szpitala powiatowego, powitał ich młody lekarz.\n- Gdzie są? - zapytał Rżewski, zakładając, że medyk wie, o czym mówi.\n- Na zewnątrz. Musieliśmy - mówił szybko lekarz. - Nie mieliśmy generatorów. Miały być niepotrzebne. Chłodnia w kostnicy nie działała. Musieliśmy utrzymać sterylność szpitala dla rannych.\nRżewski uniósł rękę.\n- Oszczędź mi historii. Nie jestem prokuratorem ani nikim takim. Po prostu mi ich pokaż. - Słyszał od kolegów w stołówce o podobnych przypadkach: kobietach zmuszonych rodzić na zewnątrz z braku światła, epidemii biegunki i tyfusu przez brak wody pitnej i tak dalej.\nMedyk poprowadził Zespół 7 na podwórze. Po drodze Rżewski zauważył licznych amputowanych. Z pewnością odcinanie kończyn nie byłoby konieczne, gdyby szpital miał prąd.\nNa podwórzu leżało sześć ciał. Przebywały tam tak długo, że zaczęły gnić. Załoga Rżewskiego zapakowała je do czarnych worków i ruszyła do furgonetki. Po drodze podeszła do nich zapłakana kobieta.\n- Czy to mój dziadek?! - krzyczała. - Nie przeżyłby bez prądu. Gdzie jest? Pociągi ruszyły dopiero dzisiaj.\n- Proszę pani, jesteśmy tylko Dywizją Sanitarną, lepiej zapytać lekarza.\n- Nie dam się zbyć. Przez was, dupki, nie zdążyłam się pożegnać.\n- Jak mówiłem, nie mam uprawnień do informowania o tożsamości. Proszę oczekiwać komunikatu rządu w najbliższych dniach.\nJeden z ludzi zagrodził drogę kobiecie próbującej zbliżyć się do Rżewskiego, dzięki czemu Zespół 7 zapakował worki i odjechał, gdy ona próbowała rozmawiać ze zdenerwowanym lekarzem."
belchatow_dlc.12.a: "Do następnego zlecenia"

belchatow_dlc.13.t: "Przejrzeć na oczy"
belchatow_dlc.13.desc: "Wiesław był, co zrozumiałe, całkiem z siebie dumny. Pięćdziesięciodziewięciolatek dobrze wykorzystał swoje silne ramię i w ciągu dnia zdołał narąbać niemal pięć sążni świeżego drewna. Pod jego siekierą padł nawet Dąb Grzegorz, do niedawna pomnik przyrody. Zadowolony załadował do bagażnika tyle zdobyczy, ile się dało, wciąż rozsypując sporą część na podjeździe podczas ruszania. Sztuczka polegała na tym, że znał miejsce. Dwie wsie dalej był dobry kupiec, zawsze przyjmujący hurtowe dostawy. Wiesław należał do jego najbardziej niezawodnych dostawców i sprzedawał zimowe nadwyżki z ładnym zyskiem. Skoro większość zieleni w powiecie wycięto, z pewnością było pole do targowania się o jeszcze lepszą stawkę. Z tą myślą podjechał, tylko odrobinę zaniepokojony górą drewna ułożoną przed domem. Gdy zadzwonił przy bramie, usłyszał zirytowane pomruki zbliżającego się sprzedawcy. \n\n- Cholera, mówiłem, że więcej nie przyjmujemy. Czytaj znak, kolego! To nie organizacja charytatywna! \n\nPatrzył, jak mężczyzna gniewnie podbiega, niewzruszony jego postawą. Henryk nigdy nie był szczególnie przyjazny, zwłaszcza wobec obcych. \n\n- Ha, to ty. Nie uwierzysz, ilu ludzi nęka mnie dziś, próbując wcisnąć swoje cholerne drewno. Co masz?\n- Słuchaj, pierwszorzędny towar prosto z Załęczańskiego Parku Krajobrazowego. Takiej jakości już nie znajdziesz. Wszystko wycięli.\n- Och, Wiesiek, ty też? Mam już znacznie więcej, niż kiedykolwiek wykorzystam. Nie interesuje mnie.\n- Nie wiesz, co tracisz. Daj mi dzień lub dwa, a całe województwo rzuci się po twoje zapasy. Możesz zbić na tym fortunę. Właściwie to robię Ci przysługę.\n- To prosta sprawa podaży i popytu. Wszyscy mają zapasy. Już tracę na tym, co kupiłem. Zgnije tutaj, zanim pojawi się choć jeden klient.\n- Nie to drewno. Jest wytrzymałe. Nie uwierzysz, jak stawiało opór. Widzisz słoje? To historia, człowieku.\n- Dobra, mam propozycję. Zapłacę ci sto złotych, żebyś wypierdalał. Potem spalę cały ładunek, gdy tylko odjedziesz. Bierzesz albo nie.\n- Możesz dać chociaż pięćset? To cały dzień pracy.\n- Nie. Wyjazd z mojej posesji. Natychmiast."
belchatow_dlc.13.a: "Ciężka lekcja ekonomii dla niejednego drwala."

belchatow_dlc.14.t: "Honorowi Bracia"
belchatow_dlc.14.desc: "Wieże rafinerii martwego Płocka sterczały na tle popielatego nieba niczym poczerniałe zęby. Gdzieś pod nimi kaszlały pompy przywrócone do życia przez Bractwo Węgla. W betonowym biurze pachnącym ropą i wilgotnym papierem dwóch mężczyzn siedziało po przeciwnych stronach stalowego stołu.\n- Widzisz, Danielu, to nie jest skomplikowane - powiedział Rafał Ziemkiewicz, splatając dłonie. - Polska skończyła się, bo ludzie udawali, że wszystko jest bardziej złożone niż naprawdę.\nObajtek prychnął i odchylił się, kładąc buty na stole.\n- Tak, tak, nie zaczynaj nawet. Nie wyczołgałem się z rynsztoków Płocka, żeby słuchać kazań moralnych. Miałem dość tego gówna, zanim wszystko poszło do diabła.\n- To nie wykład. To arytmetyka - spokojnie odpowiedział Ziemkiewicz. - Węgiel utrzymywał światła, ropa napędzała silniki. Ideologie niczego nie podtrzymywały. Liczby tak.\nObajtek roześmiał się ostro i gorzko.\n- Liczby? Przez liczby mnie wyrzucili. Te same dranie, te same uśmiechy, inne flagi. Jednego dnia jesteś królem paliwa, następnego \"toksyczną spuścizną\". Jebać ich wszystkich.\n- Właśnie - Ziemkiewicz skinął głową. - Usunęli cię, bo rozumiałeś infrastrukturę, nie hasła. Bractwo Węgla zrodziło się z tego samego odkrycia. Władza należy do kontrolujących energię, nie do tych, którzy o niej mówią.\nObajtek pochylił się naprzód.\n- I co, chcesz, żebym przerzucał węgiel i śpiewał hymny kominom?\n- Nie. Chcę, żebyś robił to, co zawsze - odparł Ziemkiewicz. - Centralizował paliwo. Zabezpieczał linie dostaw. Zamieniał chaos w bilanse. Nowa marka, stary szyld. To Zdrowy Rozsądek. Węgiel dla stabilności, benzyna dla ekspansji. Ciężarówki, generatory, kolumny pancerne. Wiesz, co dzieje się, gdy paliwo płynie i jeśli nie płynie. Dam ci nawet własny personel. W Partii Kierowców są bardzo utalentowani ludzie, którzy chętnie z tobą popracują.\n- Czyli \"mój\" personel, ale twoi ludzie. Brzmi jak żart - mruknął Obajtek. - Albo pułapka. Kiedyś zbudowałem imperium paliwowe - powiedział cicho. - I za to mnie spalili. Dlaczego ty miałbyś tego nie zrobić?\n- Bo nie wierzę w czystość - odpowiedział Ziemkiewicz. - Wierzę w użyteczność. Przeklinasz, kradniesz, naciskasz ludzi. W porządku. Tak samo robi każdy system, który przetrwa dłużej niż pięć minut.\nObajtek uśmiechnął się krzywo.\n- Mówisz, że jestem niezbędnym skurwysynem.\n- Czytałeś kiedyś \"Księcia\"? - zapytał Ziemkiewicz. Obajtek zabębnił palcami poplamionymi starą ropą.\n- Kurwa, kogo, jakiego księdza? - warknął. - Nie mam czasu na kazania, mówiłem.\n- Jezu Chryste, \"Księcia\" Machiavellego? Wiesz co, nieważne. Chodzi o to, że my zapewniamy bezpieczeństwo i węgiel. Ty dajesz paliwo i zysk. Nie musimy udawać, że partnerstwo jest piękne, wystarczy, że działa.\n- Chcę prawdziwych rzeczy. Rafinerii, rurociągów, ochrony. Żadnych kapłanów i poetów mówiących mi, jak mam to prowadzić.\n- Zgoda - odpowiedział bez wahania Ziemkiewicz. Obajtek wstał, podszedł do okna i spojrzał na ciemną rafinerię.\n- Jeśli to się spierdoli, najpierw spalę ciebie.\n- Naturalnie - powiedział Ziemkiewicz. - Tak działają partnerstwa.\nObajtek odwrócił się z uśmiechem człowieka, który wreszcie znalazł twardy grunt. Kupił to, a Ziemkiewicz wiedział, że nie odejdzie cicho. Był jednak przygotowany i Obajtek miał zostać kolejnym trybem maszyny."
belchatow_dlc.14.a: "Oczywiście, że to pułapka. A ty właśnie w nią wszedłeś."

belchatow_dlc.15.t: "Jeśli chcesz zrobić omlet..."
belchatow_dlc.15.desc: "Las jest nielegalny, powiedzieli.\nPodobnie jak samo życie. Radość, z jaką zgarnęli mnie i ojca z naszej leśniczówki, ścinając drzewa dla zabawy... mówi mi wszystko o tym, czym człowiek jest na Ziemi.\nPlagą. Apokalipsą.\nWobec ludzi z radością rozrywających rodziny i ścinających drzewa dla rozrywki godnej zwierzęcej kopulacji spłynęło na mnie objawienie. Bóg istnieje. I nienawidzi tej Ziemi. Może uznał, że Jego stworzenie także grzeszy. Może zobaczył krokodyla pożerającego żywą antylopę, godzinami. Jego gniew zatruł umysł szaleńca Ziemkiewicza, a to zrodziło jego Bractwo. Gdyby Gaja nie obraziła Boga, dlaczego miałby zesłać na Nią kogoś takiego?\nZ dala od rodziców, roślin i wszystkiego, co zarazem odróżniało mnie od wiedźmy i z nią jednocześnie kojarzyło, od łapaczy snów po dziwne zioła, nieuczesane włosy, a nawet zwyczaj zawracania sobie głowy noszeniem stanika... wiozą mnie wilgotną ciężarówką do miejsca, gdzie mam żyć i umrzeć. Zrujnowana ruina. Bluźniący Paladyn oznajmia, że powstanie tu odlewnia stopów i musimy doprowadzić ją do porządku. Nie rozumie: to ruina. Człowiek w swej chciwości budował nory szybko, brudno i nietrwale. Równie dobrze mógłby zamienić operę w odlewnię... lecz ten człowiek nie znosi sprzeciwu. Oczywiście. Jak inaczej trafiłby do Bractwa?\nWbrew sobie wiercę w rozsypującym się betonie i ciągnę przewody mające nieść energię z najplugawszego spalania znanego człowiekowi, jakby chodziło o uduszenie Ziemi. Niech będzie. Rośliny pochłoną ślad węglowy, gdy zaburzona natura obali ludzką pychę. Tak jak było z Wieżą Babel, tak będzie ponownie: tym razem Człowiek może jeszcze zostać upokorzony.\nOdzywam się na pokruszonej podłodze, z gruzem we włosach. Odpowiedzią jest cios otwartą dłonią i wykład o terminach. Chcą uruchomić zakład do końca tygodnia. Termin niemożliwy, nawet gdybym wiedziała dużo o przygotowaniu fabryki do rafinacji stopów. Chyba że wszyscy mamy zapracować się na śmierć... może taki jest plan.\nW ostatnich dniach nawet nas nie karmią. Kolega, z którym niemal się zaprzyjaźniłam, wypadł z okna, tak bardzo kręciło mu się w głowie. Więcej go nie widziałam. Ostrożnie uderzam młotem w ścianę i spoglądam w górę, by nic ciężkiego nie spadło. Ustawiam obok podpory, które powinny powstrzymać gnijący, lecz nadal zbrojony beton przed zawaleniem po usunięciu ściany. Jedno uderzenie moje, drugie silniejszego jeńca. Burzymy mur z tęsknotą za wolnością ludzi za czasów odwilży. Po prawej... podpora upada. Zapada się wraz z podłogą.\nKolejny obrzydliwy trzask. Podłoga znika spode mnie. Czuję oszałamiające poczucie utraty równowagi, gdy kondygnacja i pękający, spadający sufit nade mną miażdży mnie w miłosiernym tąpnięciu..."
belchatow_dlc.15.a: "Bóg mnie kocha. Dlatego mnie stąd zabrał."

belchatow_dlc.16.t: "...musisz rozbić kilka jajek"
belchatow_dlc.16.desc: "Raport nr 5309: O rozbudowie i tworzeniu przemysłu centralnego\n\nObiekt nr 42 został wczoraj o 11:00 przeznaczony do rozbiórki. Odnotowano incydent, w którym część drugiego i trzeciego piętra zawaliła się podczas usuwania ściany pod odpowiednią przestrzeń odlewniczą. Dzięki przezorności i ocenie Brata Dębosza oraz Siostry Pałki oznaczyliśmy budynek jako niestabilny i niezdatny do adaptacji. Z powodu ograniczeń czasowych i wymagań realizacyjnych oraz najwyższego priorytetu terminowego ukończenia wspólnie postanowiono jednak skierować tam elementy niegodne zaufania w postaci dwudziestu osób oznaczonych przez Paladynów jako podejrzane, przymusowo wcielonych i zabranych z domów.\nPrace przebiegały sprawnie aż do incydentu. Dębosz i Pałka dokonali oceny (patrz załącznik) i stwierdzili, że przyczyną była błędna ocena wytrzymałości gnijących podłóg. Gdy podpora z rozebranej ściany zawiodła, wspierana przez nią podłoga zawaliła się na dwóch robotników, a siła upadku spowodowała również zapadnięcie kondygnacji poniżej, miażdżąc kolejnych trzech. Tych trzech, w przeciwieństwie do dwóch nad nimi, uratowano, lecz pozostaną niepełnosprawni do końca życia.\nW incydencie nie zagrożono sprzętowi o wartości przekraczającej pięć tysięcy dolarów. Dowodzi on jednak, że obarczona wysokim ryzykiem renowacja budynków połączona z niewykwalifikowaną siłą roboczą gwarantuje utratę życia i wyposażenia. Aby zachować projekt, jego potencjał przemysłowy i zdolność pełnego wykorzystania potężnej elektrowni Bełchatów, potrzebuję:\n- dodatkowych wykwalifikowanych rzeczoznawców do właściwego skazywania ruin na rozbiórkę lub przeznaczania ich do renowacji;\n- dalszych belek stalowych z recyklingu (nie nieprzetopionego złomu!) oraz dodatkowych mobilnych środków wytwarzania nowego cementu uzupełniającego;\n- wykwalifikowanych brygadzistów do odpowiedniego wykorzystywania pracy przymusowej;\n- właściwie, jeśli wiecie, co dobre, pozwólcie nam po prostu zburzyć ruiny, ponownie wypalić beton i stal na miejscu, a adaptację prowadzić w ruinach przemysłowych. Ten przypadek dowodzi, że nie da się tworzyć chałupniczego przemysłu: dodatkowy miesiąc czy dwa będą niczym w porównaniu z korzyścią posiadania prawdziwych hal fabrycznych. Proszę.\nI na miłość węgla, nie wierzcie pogłoskom, że świadomie wysłałem robotników do budynku, o którym wiedziałem, iż zaraz się zawali, tylko po to, by dowieść racji."
belchatow_dlc.16.a: "Wysłałem depeszę i zrobiłem omlet na śniadanie."

belchatow_dlc.17.t: "Spotkanie dusz"
belchatow_dlc.17.desc: "11:00\nOgromna sala konferencyjna była niemal pusta, a harmonogram wyczyszczono z dużym wyprzedzeniem. Tylko trzech mężczyzn otrzymało wystarczające uprawnienia do udziału, a jeden, siedzący na czele przesadnie długiego stołu, nie zamierzał faktycznie uczestniczyć. Rafał Ziemkiewicz zmęczonym ruchem upił porannej kawy i zwrócił się do obu stron dyskusji, uzbrojonych w sterty projektów, akt i prognoz. \n\n- Dobrze, panowie. Szczerze mówiąc, mam was obu dość. Od tygodnia bez przerwy opowiadacie o propozycjach gospodarczych i dłużej tego nie zniosę. Daję wam godzinę. Wymyślcie coś razem i sprawdzę, kiedy skończycie. \n\nStarszy wstał i wyszedł, ustawiając przed drzwiami dwóch strażników z rozkazem, by pod żadnym pozorem nie wypuszczali Gadomskiego i Warzechy. Oglądając się, zobaczył, jak Strażnik z zadowoleniem przygotowuje się do rozpoczęcia sporu. Ziemkiewicz zamknął dźwiękoszczelne drzwi, a migrena na chwilę ustąpiła. Poszedł do gabinetu na zasłużoną przerwę. \n\n12:15\nWracając, zastanawiał się, jakich rezultatów oczekiwać. Mignęła mu wątpliwość, czy skończyli, lecz był gotów towarzyszyć im przy ostatnich szczegółach. Otworzył drzwi na sekundę. \n\n- Ty przeklęty neoliberalny pachołku, zawsze wiedziałem, że jesteś wiechowcem! Dopilnuję, by Starszy kazał cię rozstrzelać za tę bezczelność. \n\nHm. Może kolejna godzina wystarczy, by ochłonęli. \n\n13:45\nSpodziewając się, że emocje już opadły, Ziemkiewicz pewnie wszedł do sali. \n\n- Ty bezmyślny bucu, tak po prostu rozkopać pół Polski? Uuu, ja chcieć węgla, ja musieć kopać wielka dziura. Jesteś pierdolonym jaskiniowcem, Łukasz. W tym tempie zmienisz kraj w dymiące pustkowie. \n\nNie, nie mieszaj się w to, Rafał. Przynajmniej go nie zauważyli. \n\n17:20\nPo popołudniowej drzemce Starszy poczuł przypływ energii. Był gotowy wejść, potwierdzić władzę i zmusić obu do współpracy. Po przekroczeniu progu szybko zmienił zdanie. Ogromny stół jakimś sposobem przewrócono, a doradcy używali go jako osłony, ślepo ciskając w siebie aktami. Sądząc po krzyku Gadomskiego, Warzecha trafił. \n\n19:50\nWnętrze było tak zniszczone, że wyjaśnić to mógł jedynie wybuch. Ani Warzecha, ani Gadomski nie odnieśli ran i właśnie próbowali fizycznie zmusić drugiego do poddania. Strażnik stanowczo zaprzeczył, by ktokolwiek wszedł lub wyszedł po rzeczony materiał wybuchowy. \n\n23:30\nByła to ostatnia zaplanowana kontrola Ziemkiewicza. Wreszcie panowała cisza. Warzecha i Gadomski leżeli nieprzytomni po przeciwnych stronach sali, wyczerpani. Strażnicy otrzymali rozkaz zaniesienia ich do kwater. Wszystkie meble zostały zniszczone poza małym stolikiem kawowym, który pozostał w idealnym stanie. Na nim leżały dwa schludnie ułożone segregatory, każdy z ostateczną wersją propozycji jednego z kandydatów."
belchatow_dlc.17.a: "Jak woda i olej."

belchatow_dlc.18.t: "Bez przeszkód"
belchatow_dlc.18.desc: "Czarny sedan zatrzymał się przy szutrowej drodze około pięćdziesięciu metrów przed wejściem do kopalni Uniejów, z karoserią całkowicie oblepioną błotem. Z siedzenia pasażera wysiadł niski, krępy człowiek w całkowicie białym garniturze z ozdobną chusteczką, kontrastującym z przemysłowym krajobrazem. Bogusław, mistrz ceremonii, poprawił ubranie i podwinął nogawki, by przypadkiem ich nie zabrudzić. Rozjuszony widokiem robotników zatrzymanych przez ochronę obiektu pobiegł ku zamieszaniu, wymachując pięścią, a za nim ruszył oddział funkcjonariuszy Bractwa. Gdy dotarł do strażników, złapał oddech i zażądał: \n\n- Co to ma znaczyć? Starszy Ziemkiewicz będzie tu za dwie godziny. Mamy robotę.\n- Rozkazy pana Czerepca, nikogo nie wpuszczać - stwierdził strażnik.\n- Odsuń się, chłopcze - mruknął oburzony Bogusław. - Nie mam czasu na zabawy. \n\nZanim strażnik zdążył go powstrzymać, funkcjonariusze przedarli się przez kordon, bez trudu odsuwając niewyszkoloną ochronę.\n- Dobrze. Przyprowadźcie mi tego Czerepca. Chyba musimy porozmawiać. \n\nPo pięciu minutach, które posłużyły Bogusławowi jako przerwa na papierosa, żołnierze wywlekli właściciela kopalni z nory i siłą zanieśli za ramiona do oczekującego szefa. \n\n- Puśćcie mnie... cholera, postawcie mnie, bydlaki - pan Czerepiec szarpał się panicznie.\n- W porządku, możecie go postawić. Jest nieszkodliwy. - Bogusław lekceważąco wskazał, by go puścili. - Co jest z tobą, co? Śmierci sie nie boisz?\n- Posłuchaj, dla dobra pracy nas obu nie mogę pozwolić, by otwarcie przebiegło zgodnie z planem.\n- Dlaczego? Oświeć mnie. Z którą częścią programu masz problem?\n- Niczego nie zrobiliście źle. Wszystko jest po mojej stronie, rozumiesz? Ale nie mogą wejść do kopalni. Ta część odpada.\n- Ha, poważnie? Proszę cię, to tylko przedstawienie. Nie musisz obawiać się żadnej kontroli z ich strony.\n- Nie rozumiesz.\n- No co z tobą, kolego? Pozwól Starszemu machnąć kilofem. - żartobliwie trącił właściciela.\n- Dobrze, chcesz znać problem? Nie może uderzyć kilofem w bryłę węgla, bo jak dotąd nie mamy żadnego węgla. Nic. Nadal trafiamy na pustkę.\n- Chwila, poważnie, tylko o to chodzi? - Bogusław pozostał niewzruszony. - Nie zrozum mnie źle, to ogromny problem, wręcz katastrofa. Dla ciebie. Nie obchodzi mnie, jak potem z tego wybrniesz. Mam ceremonię do poprowadzenia. Więc nie wiem, pomaluj kamień na czarno i dopilnuj, by było ciemno. Myślisz, że poznają różnicę? Po prostu uśmiechaj się, jakby od tego nie zależało całe twoje życie."
belchatow_dlc.18.a: "Kolejna udana i całkowicie niepotrzebna ceremonia."

belchatow_dlc.19.t: "Łódź po zmroku"
belchatow_dlc.19.desc: "Zimno. Nieznośne zimno. Tylko to czuł Miłosz, idąc ulicami Grabieńca po dniu pracy przy piecach. Powietrze wbijało się w skórę jak igły, choć okrył ją każdą warstwą ubrania, jaką zdołał założyć. Oddychał przez kawałek materiału. Za każdym razem musiał mocno wciągać powietrze, by nie dostać zawrotów głowy, lecz ilekroć myślał o zdjęciu osłony, zaczynał dusić się niefiltrowanymi cząstkami. Mijał las pokracznych betonowych płyt, które chyba miały być ozdobne. Przynajmniej były dość wyjątkowe, by wskazywać drogę, gdy schodził smog i znaki stawały się nieczytelne. \n\nW końcu dotarł do swojego budynku. \"Ekskluzywny\" pięciopiętrowy blok w centrum osiedla zamkniętego, pieszczotliwie nazwanego \"Szmaragd\". Jego wyjątkowość rzucała się w oczy - należał do nielicznych budynków o kolorze innym niż czarny, choć całą robotę wykonywał pojedynczy ciemnozielony pas. Za wejściem ścianę zdobił plan stylizowany na kopalnię, z ponumerowanymi złożami symbolizującymi mieszkania. Winda również pasowała do motywu, o ile skrzypienie niczym stuletnia klatka szybowa było zamierzone. \n\nW środku Miłosz zaczął się trząść się jeszcze bardziej niż w drodze. Ogrzewanie znów nie działało, trzeci dzień z rzędu i drugi raz w tym miesiącu. Szczerze mówiąc, częściej było zepsute niż sprawne. Założył dodatkową warstwę, obserwując powoli umierające od mrozu rośliny. Powinien kupić nowe, lecz w toku kampanii przeciw publicznej zieleni stały się towarem czarnorynkowym. Poza tym pozostał im jeszcze liść lub dwa. Trzymały się i na swój sposób je za to podziwiał. \n\nWłączył czajnik, podgrzał gotowy posiłek i usiadł przy stole, pusto patrząc przez okno. Setki świateł przebijały gęsty dywan smogu przykrywający miasto. Setki mieszkań, rozbitych betonowych płyt z cienką powłoką człowieczeństwa. Setki żyć, zapewne równie nędznych jak jego. Miłosz czuł ciężar wewnętrznej walki, lecz wiedział, że nie niesie tego ciężaru sam. Nie był pewien, czy ta myśl przyniosła mu pociechę, czy tylko większą rezygnację. Pozostała mu litość. Dla siebie i wszystkich innych."
belchatow_dlc.19.a: "I tak to się żyje w tej Łodzi"

belchatow_dlc.20.t: "Wielkomiastowy"
belchatow_dlc.20.desc: "Wyobraźcie sobie to: dziejowa niesprawiedliwość pozbawia nasz kraj Gdańska, najważniejszego miasta portowego. W zaledwie dekadę budujemy więc obok Gdynię, zupełnie nowe miasto portowe. Kiedy odzyskujemy Gdańsk, mamy metropolię Trójmiasta, zdobytą trudem i krwią. Teraz naród znów upadł, ponownie zagrożony imperialistycznymi sąsiadami, a przede wszystkim chorobami nawiedzającymi ich umysły: ekocentryczną, antyludzką myślą. \nNa szczęście nikt nie może pozwolić sobie na szaleństwo, gdy schronienie i ciepło przestają być pewnikiem. Tak powstał nasz światopogląd, Bractwo Węgla, które wzięło dwa stare miasta i uczyniło z nich jedno: nową metropolię stojącą na rozumie, energii i świetle. Tutaj żaden emeryt nie boi się, czy znów będzie go stać na opał. \nDym kominów przykrywa noc i dzień, łagodząc nieustanne światło słoneczne jasną mgłą. Światła miasta bledną i rozmywają się w smogu, lecz nadal dowodzą, że w zaledwie kilka miesięcy powróciło cywilizowane życie. Ludzie mają ciepłe domy i mogą cieszyć się życiem w dowolnym klimatyzowanym lokalu. Ludzkość leczy się, jak potrafi, a natura ustępuje, gdyż musi. Przeciągam się i wdycham ciepłe powietrze, patrząc na splendor przede mną. Miasto będące uosobieniem Bractwa: stojące na rozumie i betonowych fundamentach, z blokami wzniesionymi w kilka miesięcy, ulicami przekutymi w kilka dni i kominami sięgającymi nieba, których czerwone światła są ledwie widoczne. W tej stworzonej przez człowieka chmurze można żyć jak przed Upadkiem. Inni nigdy nie uwierzyliby, że normalne życie może powrócić tak szybko, skuci ekologiczną, samobójczą wątpliwością."
belchatow_dlc.20.a: "Samo miasto wystarczy by dowieść naszej racji."

belchatow_dlc.21.t: "Rewolucyjne drogi"
belchatow_dlc.21.desc: "Witold Gadomski był w siódmym niebie. Wreszcie tego dokonał. Od początku pozostawał jedynym głosem rozsądku w Bractwie, jedynym dorosłym w pokoju próbującym tworzyć realistyczne prognozy zamiast gorączkowych snów przesyconych węglem. Po raz pierwszy kierownictwo naprawdę posłuchało. Jego plan otrzymał wstępną akceptację. Przez ostatni tydzień skrupulatnie dopracowywał szczegóły, by uczynić go odpornym na błędy. Żadna kontrola ani zła wiara konkurentów nie mogły go naruszyć. Zaplanowane posiedzenie budżetowe miało być rundą zwycięstwa przed całym wewnętrznym kręgiem Ziemkiewicza. \n\nSala konferencyjna, ta sama, którą z Warzechą zdemolowali podczas walki o wpływy, została naprawiona na tę okazję. Choć liczebność publiczności trochę rozczarowywała - przybyło tylko czterech członków - Gadomskiego obchodziło wyłącznie to, że Wartownik naprawdę był obecny. Nie mógł doczekać się, aż wetrze mu zwycięstwo w twarz. \n\nZ niezrozumiałego powodu Starszy Paladyn odczuwał niepokój. Światło było odrobinę zbyt słabe, pozostali członkowie zbyt opanowani. Próbował nie zwracać na to uwagi. To była jego chwila. \n\n- Wartowniku Warzecha, zanim zaczniemy, mam pytanie dotyczące twojej propozycji. - Janecki zadawał pytania. To nigdy nie był dobry znak.\n- Oczywiście, Proktorze. Jestem gotów rozwiać wszelkie pozostałe wątpliwości.\n- Dobrze. Czy w takim razie możesz uprzejmie ujawnić, z którą zagraniczną grupą wywrotową jesteś obecnie związany?\n- Słucham? - pomyślał Gadomski, czy tym tekstem tylko próbował wytrącić go z równowagi.\n- Mówi, że tak zdradziecki bełkot nie może pochodzić od człowieka służącego interesom Bractwa. No dalej, Witoldzie. Jeszcze sekundę temu tak chciałeś mówić. Co się stało? Odpowiedz koledze. - Warzecha nie potrafił ukryć zadowolonego uśmiechu. Nie żeby próbował.\n- Przegrałeś, Łukasz. Odpuść. Starszy Ziemkiewiczu, przemów im do rozumu.\n- A teraz ośmielasz się przywoływać moje imię, wiechowska marionetko!? Po tym, jak mnie oszukałeś? Próbowałeś zniszczyć MOJE Bractwo! Wszystko, co zbudowałem! Wiem wszystko, wiem, do czego dążyłeś. Masz szczęście, że Wartownik Warzecha ostrzegł mnie przed katastrofą. I lepiej licz na to, że jesteś tylko nieświadomym liberałem, bo jeśli odkryjemy, z kim współpracowałeś, jeśli celowo planowałeś rozmontować instytucje Bractwa, to twój koniec, rozumiesz?\n- Cóż, wygląda na to, że Starszy już zdradził niespodziankę, więc Wartowniku Warzecha, proszę usiąść wygodnie. To pierwsze przesłuchanie w trwającym śledztwie mającym ustalić rozmiary twojej zdrady. Trochę tu posiedzimy."
belchatow_dlc.21.a: "Tyle by było z dobrych intencji."

belchatow_dlc.22.t: "Nowe oblicze Bractwa"
belchatow_dlc.22.desc: "Nie powinieneś tego widzieć...no i masz Ci los. Co tu robisz? Właśnie zainfekowaliśmy twój umysł propagandą węglową. Zaczynasz czuć niepohamowaną potrzebę by dołączyć do Bractwa. Teraz weźmiesz swój kilof, pójdziesz do najbliższej kopalni i ZACZNIESZ KURWA KOPAĆ TEN JEBANY WĘGIEL. OPÓR NIE MA SENSU. PRZYJMIJ SMOG DO SIEBIE, PRZYJMIJ POTĘGĘ WĘGLA I STAŃ SIĘ JEDNOŚCIĄ Z ENERGIĄ."
belchatow_dlc.22.a: "Pan jest oszust, panie graczu."

belchatow_dlc.24.t: "Dziura"
belchatow_dlc.24.desc: "Pamiętam Śląsk, kiedy nadal miał nazwy. Nie tylko Katowice, Bytom i Zabrze - również nazwy szeptane przez cegłę, sadzę i światło w oknach. Niemiecki porządek przecinał kiedyś tę ziemię prostymi liniami i rozkładami. Był okrutny, owszem, lecz zdyscyplinowany. Szyby były głębokie, ulice płytkie, a wszystko miało cel. Węgiel miał wtedy twarz: zegarek brygadzisty, szkolny dzwonek, grób z krzyżem. Potem przyszła polska ręka - niezdarna, pełna nadziei, wyczerpana. Zamalowali niemieckie litery i nazwali to sprawiedliwością. Zbudowali bloki betonowego optymizmu, układając rodziny jak wersy, które prawie się rymowały. Kopalnie jęczały, powietrze gęstniało, ale istniało życie. Chóry śpiewały pod kominami. Dzieci grały w piłkę na hałdach i wierzyły, że ziemia pod nimi przetrwa.\n\nA teraz - teraz przychodzi Bractwo.\n\nNie zmieniają nazw miast. Wymazują je. Szedłem tam, gdzie kiedyś stała Ruda, i znalazłem tylko dół szeroki jak pamięć przodków. Ulic się nie odbudowuje; zdziera się je niczym zbędną skórę. Kościoły leżą złożone w ziemi, a ich dzwony połknęły koparki modlące się wyłącznie do urobku. Nie ma już cmentarzy - umarłych przesiedla się razem z żywymi, statystykami na listach ewakuacyjnych stemplowanych popiołem. Przemysł uciekł na północ, zaciągnięty niczym ranne zwierzę do Łódzkiego, gdzie nowe hale wznoszą się czyste i bezduszne, szumiąc bez historii. Tam maszyny są bezpieczne. Tutaj ziemia jest zbędna. Bractwo mówi, że to konieczne. Zawsze powtarzają to słowo - konieczne - jakby było święte. Konieczne, by nakarmić piece.\nKonieczne, by poświęcić Śląsk, dzięki czemu Polska, albo to, co z niej zostało, zaczerpnie jeszcze jednego zatrutego oddechu. Konieczne, by światła świeciły poza Pustkowiem. Tak ludzie zaczęli je nazywać. Pustkowie. Gdy zobaczycie, czego tutaj dokonali, zrozumiecie znaczenie tego słowa. Niemcy wyzyskiwali. Polacy znosili. Bractwo pożera. Nie ma ideologii, tylko wydobycie. A raczej to właśnie jest ich ideologią. Nie nienawidzą Śląska dość, by go zniszczyć - po prostu potrzebują tego, co pod nim, a nic na powierzchni nie jest warte ocalenia. To czyni wszystko gorszym. Nie da się spierać z księgą rachunkową. Nie da się ubłagać statystyk wydajności.\n\nStoję na krawędzi nowej kopalni i patrzę, jak miasto zmienia się w poziomicę. Wiatr niesie pył węglowy niczym czarny śnieg. Gdzieś daleko ryczą generatory, żywe dlatego, że to miejsce umiera. Śląsk zawsze płacił za resztę kraju. Tym razem nie pozostaną nawet ruiny, by nas pamiętać. Tylko energia płynąca na zewnątrz, bezimienna. A gdy Bractwo skończy, gdy nawet węgiel się przerzedzi, nie będzie tu zupełnie nic - żadnej prowincji, cmentarza, nawet ciszy.\n\nTylko dziura w miejscu, gdzie pewna ziemia nauczyła się żyć."
belchatow_dlc.24.a: "A teraz zapomniała, jak umierać."

belchatow_dlc.25.t: "Węgiel to jedyne prawo"
belchatow_dlc.25.desc: "Nazywam się Mateusz Bargieła. Pracuję na Hucie, przy Piecu nr 3. Głównie dlatego, że mi kazali. Bo stal musi płynąć, bo Bractwo tego żąda, bo zatrzymanie oznaczałoby głód szybszy niż nadejście nadziei. Kiedyś wracałem po zmianie pieszo. Pod drzewami. Chłonąc zapach wody z Pogorii, ulicami pamiętającymi śmiech. Żona czekała. Syn spał przy zapalonym świetle. Dąbrowa Górnicza mogła być brzydka, ale była nasza. Zrównali ją z ziemią w tydzień.\n\nPrzybyli z mapami starszymi niż nasze życie, z czerwonymi liniami przecinającymi kuchnie i sypialnie. \"Nieczynny szyb\". \"Strategiczne ponowne otwarcie\". \"Przymusowa redystrybucja ludności\". Mierzyli mój dom jak guz do wycięcia. Potem przybyły maszyny. Ściany padały szybciej niż słowa. Rodzina zniknęła, zanim skończyłem ostatnią zmianę - ewakuowana na skraj miasta, upchnięta w megablokach niczym części zapasowe w garażu.\n\nJak można było to powstrzymać? Jak buntować się przeciwko całej maszynie? Próbowaliśmy...\nLudzie z huty, górnicy, spawacze, kobiety z dziećmi na rękach. Krzyczeliśmy, blokowaliśmy drogi, paliliśmy opony. Ktoś podniósł flagę. Ktoś inny karabin, którego nie umiał używać. Przez jedną noc wierzyliśmy, że gniew może stać się zwycięstwem. Rankiem Bractwo przypomniało nam, jak wygląda siła. Nie dokonali masakry. Trochę się jej spodziewaliśmy. Szybko zrozumieliśmy, że byłaby miłosierdziem. Aresztowali przywódców, zmienili przydziały zmian, obcięli racje. Pozwolili nam żyć i patrzeć. Tak umierają dziś bunty. Lasów nie ma. Wycięte, spalone albo pogrzebane pod żużlem. Jezior nie ma. Osuszone, zatrute albo przemianowane na \"zbiorniki przemysłowe\". Domów nie ma. Nie zrujnowane - wymazane. Każde wspomnienie związane z tym przeklętym kawałkiem betonu jest teraz dymiącym dołem.\n\nZ platformy wielkiego pieca widzę horyzont. Nie ma już punktów orientacyjnych, tylko dźwigi, szyby i dym. Przemysłowe maszyny ryczą niczym bestia karmiona miastami. Czasami wydaje mi się, że w metalu słyszę krzyki, lecz to tylko pęknięcia naprężeniowe stygnące zbyt szybko. Rodzina przeżyła. To najokrutniejsza część. Żywi, lecz spustoszeni, czekający na pozwolenia, przeniesienie, coś, co nigdy nie nadchodzi. Syn nie pyta już, kiedy wracamy do domu. Pyta, gdzie \"dom\" poszedł. Jak mam spojrzeć w te oczy, które bez względu na wszystko lśnią nadzieją, i powiedzieć, że tatuś się poddał?\n\nStal i węgiel ocalą nas wszystkich. Takie hasło widnieje na jednej z bram Huty. Dobre sobie. Nie wierzę już w ocalenie. Wierzę w pamiętanie nazw. Ulic. Drzew. Pokoi, które kiedyś istniały i zostały celowo zabrane. Wierzę w liczenie każdej ciężarówki węgla wydobytego spod mojej kuchni. Wierzę w ciężar stali i w to, jak łatwo zmienić belki w ostrza.\n\nNie zostało tu nic poza gniewem. I obawiam się... nic nas nie uratuje, bo żyjemy w nicości. Możemy tylko pamiętać. Nazywam się... Mateusz Bargieła."
belchatow_dlc.25.a: "Pracowałem na Hucie..."

belchatow_dlc.26.t: "To, czego kuźnia wymaga"
belchatow_dlc.26.desc: "- Założyli cały ten Kult Kuźni. To kompletne szaleństwo, stary, musisz spróbować.\n- Słyszałem, że każdy uczestnik dostanie premię pieniężną.\n- Biskup powiedział, że katolicy mogą brać udział w nabożeństwach. Po licznych namowach kolegów ze zmiany Jan Dyzma w końcu uległ i postanowił sprawdzić, o co chodzi w nowej ceremonii. Po pracy zamiast iść w górę tunelu, skręcił w boczne przejście z ludźmi zmierzającymi na obrzęd. Schodząc głębiej, spotkali mężczyznę w szacie rozdającego podobne stroje każdemu chętnemu. Jan również wziął jedną, najwyraźniej niezbędną.\n- Kto by pomyślał, że sprawy zajdą tak daleko? - pomyślał.\nZauważył, że koledzy wymyślają wiele nowych górniczych pieśni, częściej wypowiadają imię świętej Barbary niż Jezusa, a kilku zaczęło mówić o kopalniach i rudach jak o żywych istotach, ale to? Wreszcie dotarli do ogromnej podziemnej komnaty wielkości małego kościoła. Uwagę zebranych przyciągnęły wielkie lampy na najdalszej ścianie. Naśladowały witraże i przedstawiały świętą Barbarę, świętego Klemensa oraz świętą Kingę. Każdej przypisano Osobę Trójcy Świętej. Nad Barbarą czuwał Jezus, nad Klemensem Bóg Ojciec, nad Kingą Duch Święty.\nMisterium rozpoczęło się od górniczych pieśni, takich jak \"Kopalnia Anna\", \"Niech żyje górniczy stan\" i \"Rycerze życia\". Następnie człowiek wyglądający na mistrza ceremonii wszedł na ambonę i rozpoczął kazanie.\n- Nazywam się Eliasz i jestem Naczelnym Skrybą Kuźni. Witam was i dziękuję za tak liczne przybycie na pierwsze spotkanie. Zgromadziliśmy się, by ofiarować Matce Ziemi dar za obfite zasoby. Takie jest znaczenie pierwszego rytuału.\nAsystent przyniósł paproć na srebrnej tacy. Umieścił roślinę po lewej stronie ołtarza i zasypał ziemią.\n- Po milionach lat takie paprocie zmienią się w ukochany węgiel - ciągnął Skryba. - To akt pamięci o tym procesie. Kolejny asystent przyniósł na podobnej tacy kawał surowego mięsa.\n- Nowe Przymierze zostało zerwane po zniszczeniu Polski. Z Polski miała wyjść iskra, która przygotuje świat na ostateczne przyjście Pana. Jak można mówić o iskrze, gdy Kuźnia jest zimna? Co robimy? Musimy ponownie ją rozgrzać. Dawnym sposobem. Składając w ofierze baranka.\nMięso położono w palenisku i podpalono.\n- Im dalej jesteśmy od zbawienia, tym większa musi być ofiara."
belchatow_dlc.26.a: "Węgla węglowemu bogu!"

belchatow_dlc.27.t: "Dzień Postępu [GetYear]"
belchatow_dlc.27.desc: "Bilety na Dzień Postępu sprzedawały się jak świeże bułeczki. Liczne rodziny przybyły świętować sedno ideałów Bractwa i jego sukcesy. Przygotowano wiele atrakcji, by dzień pozostał w pamięci. Czarne transparenty i stoiska, które w dawnym świecie uchodziły za ponure i przywodziły na myśl pogrzeby oraz żałobę, teraz niosły radość i zabawę, gdy po strasznych czasach Blackoutu wszyscy pragnęli odrobiny rozrywki. Nawet sceptycy ideałów Bractwa musieli wywnioskować, że po przezwyciężeniu niedoboru energii Węglowa Krucjata była nie do powstrzymania. \nLudzie korzystali z prawdziwych karabinów kolejowych na strzelnicy z manekinami ekofaszystów. Mniej wojskowo usposobionych przyciągał pokaz mody \"Górniczy styl\", gdzie modele i modelki prezentowali nowe stylowe stroje, wzbudzając podziw zarówno dla projektów, jak i noszących je osób. Najmłodszych witała maskotka Bractwa, Kopalniok, rozdając pluszaki stylizowane na Starszego Ziemkiewicza oraz kopalnioki - śląskie czarne cukierki lukrecjowe. W namiotach górnicy opowiadali o podziemnych przygodach, a Paladyni o najchwalebniejszych czynach podczas wojen zjednoczeniowych. Wszystkiemu towarzyszył śpiew Roksany Węgiel ze sceny na południowym krańcu terenu. Po występie Starszy Ziemkiewicz poczuł się dość swobodnie, by wygłosić okolicznościową mowę. \n- Bracia i Siostry! Z wielką przyjemnością was tutaj widzę. Przezwyciężyliśmy wiele trudów i przeszkód. Przetrwaliśmy i rozkwitliśmy dzięki wspólnemu wysiłkowi i mądremu przywództwu. Mam nadzieję, że wspaniałość tego Dnia Postępu zostanie powtórzona albo nawet przewyższona za rok. Teraz świętujmy to, co doprowadziło nas do dzisiejszego miejsca. Zdeptanie wrogów porządku. \nNa znak giermkowie stojący przy scenie ściągnęli koce, odsłaniając pięć stosów węgla z podobiznami pokonanych łódzkich watażków i dodatkowy stos dla Jakuba Wiecha. Ziemkiewicz dał sygnał do podpalenia. \n- Ich machinacje nigdy więcej nie sabotują maszyny Bractwa, która dostarcza nam wszystkim energię - ciągnął Starszy. - Wychodząc, każdy może zabrać worek węgla i koksu w prezencie. Nigdy więcej nie odmówią wam owoców Matki Ziemi!"
belchatow_dlc.27.a: "Węgiel i postęp dla wszystkich"

belchatow_dlc.28.t: "Przedawkowanie"
belchatow_dlc.28.desc: "- Sprawdziłeś ponownie Sektor C? - zapytał Marek, poprawiając hełm, choć staliśmy w biurze pod świetlówkami i plakatem motywacyjnym WĘGIEL JEST PRAWDĄ.\n- Sprawdzałem trzy razy - odpowiedziałem. - Raz z ekipą wiertniczą, raz z geologami i raz wpatrując się w dół z nadzieją, że rzeczywistość pierwsza mrugnie.\nZrozumieliśmy, że węgla nie ma, we wtorek, co wydawało się prawdą.\nRzeczywistość nie mrugnęła. Kopalnia Bełchatów, wieczny spichlerz węglowy Bractwa, była pusta. Nie metaforycznie. Nie \"pusta z powodu restrukturyzacji\". Naprawdę, fizycznie i żenująco pusta. Tylko skały, pył i utrzymujący się wstyd cywilizacji, która kopała zbyt chciwie.\n- To niemożliwe - powiedział Marek. - Ulotka mówi, że mamy zapasy do 2075.\n- Ulotka mówi również, że kopalnia \"odnawia się duchowo\".\nSiedzieliśmy w ciszy, słuchając odległych koparek przeżuwających nicość.\n- Może pominęliśmy warstwę? - spróbował.\n- Wykopaliśmy tu nawet dinozaury, Marek. Żadnej warstwy nie ma.\nProblemem była oczywiście papierologia. Nie da się złożyć formularza \"węgiel przestał istnieć\". Nie było pola \"teologia Bractwa napotkała geologię\".\n- Powiedziałeś Centrali? - szepnął Marek.\n- Wysłałem wstępny raport. Nazwałem to \"tymczasową niezgodnością materiałową\".\n- Sprytnie.\nZa oknem dół ziewał niczym martwy bóg. Robotnicy nadal przychodzili, bo istniały zmiany. Maszyny działały, bo istniały budżety. Bractwo zaplanowało wydobycie na następne dwadzieścia lat, a nikt nie powiedział rzeczywistości, by zaktualizowała prognozy.\n- Co będzie, kiedy się dowiedzą? - zapytał Marek.\n- Nie dowiedzą się. Nie od razu. Założą, że to sabotaż. Albo nieefektywność. Albo wiechowskie myślenie.\n- Węgiel może wrócić? Tak... organicznie? Jeśli poczekamy?\n- Marek, to nie las. Poza tym musielibyśmy czekać ile, miliony lat? Bóg wie, że w Centrali mamy dość skamielin, a nie da się ich wydobywać. Jeszcze...\n- Możemy przeklasyfikować skałę - zasugerował. - Nazwać ją \"przedwęglem\". Albo \"węglem oczekującym\". Albo \"węglem ideologicznie opierającym się wydobyciu\".\nGłośniki propagandowe rozpoczęły godzinne kazanie: BEŁCHATÓW KARMI NARÓD. Dół odpowiedział pustym, szyderczym echem.\n- Myślisz, że stało się to gdzieś jeszcze? - zapytał Marek.\n- Oczywiście, że nie - odpowiedziałem natychmiast. Nie podlegało to dyskusji.\n- Co... teraz? To jest... to... jest duża sprawa. Naprawdę DUŻA. Nie możemy... nie, nie możemy im powiedzieć. Zabiją nas. O mój bOŻEZABIJĄNAS - Marek się zapowietrzył. I nie mylił się. Gdybyśmy zgłosili, że serce potęgi Bractwa utraciło skarb, nie dożylibyśmy następnego dnia. Nie potrafiłem nawet go uspokoić. Nie wiem, czy nie umiałem pojąć, co się stanie... czy już zaakceptowałem własną śmierć."
belchatow_dlc.28.a: "Może jeśli zamknę oczy, węgiel faktycznie pojawi się ponownie..."

belchatow_dlc.29.t: "Sianie burzy"
belchatow_dlc.29.desc: "Nie było alarmów - jeszcze nie - tylko cienki, arytmiczny jęk oznaczający kawitację gdzieś głęboko w obiegach wodnych. Jacek zatrzymał się i zamknął oczy, licząc uderzenia jak lekarz mierzący puls. Zbyt szybko. Zbyt nierówno. Woda płynęła tam, gdzie nie powinna. Nad nim ciągnęła się kilometrami rolnicza hala: piętrowe tarasy zboża, kadzie grzybni jarzące się chorobliwym błękitem, linie kroplujące zwisające z sufitu niczym żyły. Sztandary Bractwa obserwowały wszystko z pomostów - symbole młota i kilofa na czarnym płótnie. Jacek poprawił uszczelkę maski i wywołał odczyty gleby na nadgarstkowym terminalu. Skok azotanów. Spadek pH. Metale ciężkie znów podnosiły się z głębokich warstw. Problemy trwały od ponad miesiąca. Oficjalne stanowisko państwa: wiechowski sabotaż. Nikt nie sugerował fizyki ani zwykłej biologii. Z wykształcenia był biologiem, choć słowo nie pojawiało się w dokumentach. Kierownik Pionu Hydraulicznego Trzeciej Klasy brzmiało bezpieczniej. Bractwo tolerowało hydraulikę.\n- Kierowniku Jacku? - zatrzeszczał głos w słuchawce. Młodsza Nadzorczyni Maria, z rodziny górniczej, bez przygotowania technicznego, awansowana w wieku dziewiętnastu lat. Nie mieli pojęcia, co robić, ale administracji to nie obchodziło.\n- Sekcja A233 zgłasza żółknięcie liści. Pytają, czy zwiększyć przepływ nawozu.\n- Nie. Zmniejszyć. Powoli. Jeśli teraz podniesiecie składniki odżywcze, korzenie się spalą. Gleba jest już zatruta.\n- Gleba nie może być zatruta. Została uświęcona - odpowiedziała po chwili.\nJacek znów spojrzał na liczby. Kadm. Rtęć. Popiół ze starych dołów spalania, przesączający się w górę rok po roku.\n- Świętość nie wiąże cząsteczek, szefowo.\nKolejna pauza. Tym razem dłuższa.\n- Lepiej nie powtarzaj tych kłamstw. To zdrada.\nNie odpowiedział. Ręcznie przekierował wodę, dławiąc przepływ do A233 i spuszczając ciśnienie gdzie indziej. Pompy wrzeszczały głośniej. Wiedział, że w całym kraju inni kierownicy widzą to samo. Więdnięcie w Opocznie. Wykwity pleśni w Zawierciu. Martwica korzeni przy nowym Centralnym Okręgu Przemysłowym. Osobne raporty, wszystkie zbywano jako sabotaż, lenistwo lub brak oddania aksjomatom. Nikt wyżej nie wiedział, jak umierają rośliny. Nigdy nie obchodzili się taką nauką, \"zieloną zdradą\", i sądzili, że mogą ignorować naturę bez jej gniewnej zemsty.\nPierwsze poważne zdarzenie nastąpiło godzinę później.\nKadź grzybni w Sektorze F110 przegrzała się, gdy obieg chłodzenia został zatkany przez popielny szlam. Zarodniki zmutowały pod wpływem stresu - Jacek ostrzegał przed tym lata temu - i uwolniły enzymy do ścieków. Ścieki zasilały tarasy zboża. Zboże chciwie je wchłonęło i zaczęło gnić od środka. Liście pozostały zielone. Łodygi trzymały się prosto. Zbiory wyglądały idealnie. Dopóki nie załamały się pod własnym ciężarem przekształcając w czarną maź.\n- Kierowniku! - Maria znów krzyczała. - Plon właśnie się załamał! Wszystko naraz!\nJacek oparł się o barierkę, patrząc na hektary żywności zmieniającej się w breję.\n- To systemowe - powiedział cicho. - Gleba przekroczyła pułap. Wszystko żywi się teraz trucizną.\n- Napraw to natychmiast, bo wszystkich nas powieszą! Przypominam, że mamy wyżywić całą aglomerację łódzką!\nNiemal się roześmiał.\n- Ta stacja już nie żyje."
belchatow_dlc.29.a: "- Tak jak i my."

belchatow_dlc.30.t: "Wołowina+"
belchatow_dlc.30.desc: "- Szefie, przynoszę wieści o projekcie przypraw. Mam dwie wiadomości: dobrą i złą. Którą najpierw?\n- Oczywiście złą.\n- To nie działa. A raczej działa zbyt dobrze.\n- Hmm, a dobra?\n- Udało się!\n- Ach, wreszcie. Chwila, co znaczy, że nie działa?\n- Zgodnie z prośbą czterokrotnie zwiększyliśmy liczbę genów w następnej partii pieprzu. Wzięliśmy geny różnych zwierząt: krów, świń, kurczaków, ale tym razem wybraliśmy \"mieszankę genową\" zawierającą sześćdziesiąt osiem procent genów kangurów. Problem w tym, że przyprawa jest tak jakby... \"żywa\", że chce... wyskoczyć z talerza.\n- Co to znaczy?\n- Kiedy położy się ją na jedzeniu, zaczyna się ruszać i próbuje uciec. Jakby przyprawa... żyła. Sądzimy, że odpowiadają za to związki w mięsie zwane \"motylinami\". Wprawiają ją w ruch.\n- Cóż, tym razem ponieśliśmy porażkę, ale spróbujemy ponownie. Może następnym razem użyjmy mniej egzotycznych zwierząt?\n- Jasne, szefie.\nNadzorca westchnął i spojrzał na szalkę Petriego z kawałkiem mięsa pokrytym poruszającym się mielonym pieprzem. Wiązał z projektem wielkie nadzieje. Ludzie tęsknili za smakami sprzed Upadku, lecz przy ograniczonych zasobach trudno było je zapewnić. Pomysł genetycznej modyfikacji przypraw, by miały profil smakowy podobny do mięsa, był genialny: Rada będzie zadowolona, bo zjemy więcej mięsa, a zwykli ludzie będą zachwyceni, bo nie dostaną kolejnego kawałka o smaku podeszwy.\n- Następnym razem mniej egzotycznych zwierząt, dobrze? Może tylko krowy i świnie.\n- Jasne, szefie.\nZnów westchnął i włożył szalkę do spalarni."
belchatow_dlc.30.a: "Stek-niespodzianka"

belchatow_dlc.31.t: "Państwowy przemyt"
belchatow_dlc.31.desc: "\n- Towar gotowy? - Johann Fahrer zapytał kierownika magazynu. Była ciemna, bezksiężycowa noc, dokładnie taka, jaką lubił.\n- Tak, wszystko dobrze. Dopilnowałem, by manifest nie wspominał o brakujących tonach węgla - Johann był doświadczonym przemytnikiem. Regularnie jeździł na polską stronę, przewożąc ciężarówką broń, narkotyki i ludzi. W całej karierze nie otrzymał jednak równie dziwnego zlecenia. Stał w Jänschwalde i kradł węgiel. Coś, co ludzie zwykle kupują, zwłaszcza teraz, gdy Niemcy chcą ponownie spróbować całej tej zielonej energii. Co więcej, miał spotkać się ze swoim kontaktem pod Kopalnią Bełchatów. Na terytorium Bractwa Węgla. Czy to nie była ich specjalność? Miał wejść do paszczy lwa. Obiecano mu bezpieczeństwo, lecz nadal musiał ukrywać się nawet przed urzędnikami Bractwa, choć wykonywał państwowy kontrakt.\n- Dobrze - powiedział podczas zawierania umowy - skoro i tak mam przekazać węgiel urzędnikowi Bractwa, dlaczego nie mogę spotkać się z nim na granicy i jechać prosto do stolicy?\n- Musimy zachować najwyższą dyskrecję - odpowiedział agent Bractwa doskonałym niemieckim. - Nasz dodatkowy kierowca oznaczałby kolejne ogniwo, bez którego lepiej się obejść. Z dokumentami, które dostaniesz, nie powinno być problemów. Jeśli jednak będą, wymień nazwisko Paladyna Wieżyckiego i wszystko będzie dobrze.\nIm dłużej o tym myślał, tym mniej miało sensu. Płacili jednak dobrze, więc zabrał się do pracy. Miał wszystkie potrzebne dokumenty: fałszywe zezwolenie handlowe dla każdej kliki, przez której ziemie przejedzie. Po opuszczeniu Niemiec zmienił tablice na polskie sprzed Upadku. Z tajnego schowka wyjął też pistolet maszynowy i umieścił go w ukrytej skrytce ciężarówki.\nNa granicy Bractwa powitał go prawdziwy posterunek. Wyglądało na to, że Polacy znów nauczyli się, co oznacza cywilizacja. Minęły czasy anarchii dziesiątek watażków, gdy zasięg porządku był równy zasięgowi prowizorycznego karabinu. Większość zezwoleń okazała się nieaktualna, bo wymagający ich watażkowie zostali już obaleni przez silniejszych wrogów.\n- Przygotować się do kontroli - oznajmił strażnik bez powitania.\n- Nie będzie potrzebna - powiedział Johann po polsku i pokazał dokument z zawartością transportu: racje dla górników oraz kod priorytetowy zwalniający z kontroli.\n- I tak, chcę się upewnić - upierał się strażnik, może zauważając akcent.\nCzas na plan B.\n- Dobrze, może pan zabrać dokument do Paladyna Wieżyckiego i wyjaśnić mu, dlaczego nalegał Pan na zatrzymanie transportu racji oraz utrudnianie wydobycia.\nCzłowiek Bractwa ustąpił i dał znak do otwarcia bramy.\nReszta podróży przebiegła bez wydarzeń, lecz im bliżej był celu, tym bardziej otwarcie okna wietrzyło świat na zewnątrz, a nie wnętrze samochodu.\nNocą przybył pod Kopalnię Bełchatów i rozładował węgiel w magazynie. Zapłacił mu ten sam agent, który go wynajął. Przed wyjazdem do Niemiec usłyszał jego kłótnię z kimś.\n- Dlaczego musimy handlować węglem? I to ze Szwabami?! Czemu nikt mi nie powiedział?!\n- To bez znaczenia. To tylko tymczasowe rozwiązanie. Nie powtórzy się i nigdy więcej o nim nie wspomnimy."
belchatow_dlc.31.a: "Uh, die Wirtschaft der Bruderschaft..."

belchatow_dlc.32.t: "Czas zaprzyszły"
belchatow_dlc.32.desc: "Łukasz Warzecha grał w szachy tak, jak niektórzy palą papierosy - zbyt często, zbyt późno i samotnie. Lampa nad stołem brzęczała, jakby w każdej chwili miała zgasnąć. Reszta pokoju celowo pozostawała zaciemniona. Światło czyniło rzeczy uczciwymi. Warzecha tego nie potrzebował. Siedział w płaszczu z podniesionym kołnierzem, patrząc na planszę, jakby była mu winna pieniądze. Ruch białych.\nPrzesunął pionek. Bezpiecznie. Nudno. Ruch, który niczego nie mówił światu.\n- Tak to się zaczyna - mruknął. - Nikt nie zauważa.\nBractwo gniło od środka i wszyscy już czuli smród. Piece kaszlały, rady stały w miejscu, Starszy szeptał zamiast rozkazywać. Upadek nigdy się nie zapowiada. Wpełza cicho jak plotka. Warzecha odpowiedział sobie czarnymi. Ruch lustrzany. Zawsze lubił symetrię, dawała poczucie kontroli. Zapalił cygaro, którego nie zamierzał skończyć, i odchylił się. Zarządzanie kryzysowe było jego rzemiosłem. Gdy wszystko płonęło, ludzie przestawali zadawać pytania. Szukali kogoś brzmiącego pewnie. Warzecha zbudował karierę na brzmieniu pewnie.\nZiemkiewicz był do tego idealny. Nerwowy starzec z nadmiarem władzy i niedoborem kręgosłupa. Wskaż mu zagrożenie, prawdziwe lub wyobrażone, a będzie ściskał, aż coś pęknie. Presja wykuwa diamenty, mówił. Albo trupy. Rafał przetrwał Blackout tylko dzięki niemu. Warzecha podejmował trudne decyzje, a Ziemkiewicz podpisywał to, co mu podłożono. Przesunął gońca. Agresywnie - sprawdzając linie. Reakcjoniści nie śpią. Obserwują. Liczą kroki. Zapisują nazwiska na marginesach. Warzecha o tym wiedział. Nie wiedział tylko, którzy przestali odpowiadać przed nim. Czarny poświęcił skoczka. Warzecha mrugnął. To nie było właściwe. Patrzył na przewróconą figurę niczym na martwego informatora. Bez powodu. Bez widocznej korzyści.\n- To zły ruch - powiedział odrobinę za głośno. I tak go przyjął.\nPlansza wydała się inna. Białe wyglądały silnie. Zbyt silnie. Rozciągnięte. Każda figura pełniła podwójną rolę, żadna właściwie nie chroniła króla. Nazwiska przepływały przez umysł jak dym: Gadomski. Janecki. Ludzie uśmiechający się bez potrzeby. Słuchający więcej, niż mówili. Cisi zawsze byli problemem. Usiadł i pchnął wieżę, wymuszając odpowiedź.\n- Zarządzasz paniką, zarządzasz miastem - powiedział. - Taka jest zasada. Czarne odpowiedziały łagodnym szachem. Uprzejmym. Profesjonalnym. Warzecha znieruchomiał.\nNie mat. Nawet nie blisko. Lecz dość blisko, by przekazać wiadomość. Patrzył na króla zamkniętego przez własne figury, obrońców potykających się o siebie. Wtedy zrozumiał. Nie grał już obiema stronami. Gdzieś w ciemności - poza pokojem, poza planszą - ktoś inny nauczył się gry. Cierpliwy. Ktoś, kto nie poświęcił niczego, czego nie mógł stracić. Warzecha nieświadomie zgasił cygaro.\n- Zdrajcy - szepnął. - Wszędzie i nigdzie.\nPlansza leżała cicha jak grób, pełna cieni, które jeszcze nie wykonały ruchu. Warzecha wiedział, że następne tygodnie nie będą walką o zwycięstwo. Będą walką o przetrwanie na tyle długie, by zobaczyć, kto naprawdę porusza figury."
belchatow_dlc.32.a: "Szach."

belchatow_dlc.33.t: "Od wewnątrz"
belchatow_dlc.33.desc: "KOMPROMITUJĄCE ZDJĘCIA - PRZYMILANIE SIĘ DO WIECHOWSKICH TERRORYSTÓW?\nŚMIERĆ OBOWIĄZKU - PALADYN SOMMER ZABITY PRZEZ SPISEK STARSZEGO?\nWIELKIE TUSZOWANIE - DLACZEGO STARSZY NAKAZAŁ ZABICIE KILKUSET OSÓB? CO UKRYWA RADA?\nPalce Rafała Ziemkiewicza drżały przy przewracaniu stron. Wszystkie główne media rzuciły się na plotki, szerząc je jak zarazę. Oszczerstwa, pomyślał. Ale były wszędzie.\n- Kłamstwa - szepnął. - Oczywiste kłamstwa.\nA jednak słowa miały wagę. Nie prawdę - lecz strukturę. Autor rozumiał, jak powinny brzmieć oskarżenia. Podniósł telefon.\n- Połączcie mnie z Gadomskim. TERAZ!\nBrak odpowiedzi. Panel zamigotał i zgasł. Ziemkiewicz wstał, nagle świadomy ciszy komnaty. Ściany zdawały się bliższe, pokój i mundur nagle za małe. Czuł się... mały. Najpierw pomyślał o Gadomskim, bo zawsze pachniał zdradą.\n- Zazdrości mi - mruczał, krążąc. - Zawsze zazdrościł. Ten przeklęty liberalny diabeł.\nNastępny był Janecki z siatką szpiegów i nieskazitelną lojalnością.\n- Jest zbyt czysty - powiedział na głos. - Nikt nie jest aż tak czysty. Ale... zawsze był lojalny, nigdy by nie śmiał...\nZnów sięgnął do panelu i zmusił go do życia.\n- Wezwać także Janeckiego i Warzechę. NATYCHMIAST.\nOdpowiedziały trzaski, a potem obcy głos.\n- Panie Starszy, Rada Bezpieczeństwa nakazuje pozostać w gabinecie podczas śledztwa w sprawie potencjalnej próby zamachu. Odłączamy linie telefoniczne i odwołujemy spotkania, dopóki śledczy nie ogłoszą bezpieczeństwa.\nKanał umarł. Oddech Rafała przyspieszył. Pokój przypominał małą klatkę, powietrze gęstniało, jakby piece poniżej odwróciły bieg i wysysały ciepło.\n- To pułapka. Współpracują - pomyślał. - Zawsze współpracowali.\nRaport wspominał spotkania. Próbował przypomnieć sobie każdą rozmowę - każdą luźną uwagę, chwilę frustracji wypowiedzianą zbyt swobodnie: \"Boję się tego, czym może stać się wojsko Sommera\", \"Przyszłość węgla jest krucha\", \"Nie możemy wypalić sobie drogi wyjścia z każdego problemu\".\nSłowa, które miały być ostrzeżeniami. Teraz wyglądały jak przyznanie się do największych grzechów tego kraju.\n- Sommer to zrobił! - powiedział nagle. - Wiedział. Zawsze wiedział.\nAle Sommer nie żył. To było najgorsze. Trup nie mógł niczemu zaprzeczyć. Ziemkiewicz drżącą ręką zaczął wypisywać nazwiska.\nGadomski. Janecki. Warzecha. Krąg Paladynów. Karbonariusze. Baroni Węglowi. Kierownicy elektrowni. Wiechowcy. Greenpeace. Niemcy. Straż Trzeciego Pieca Elektrowni Bełchatów. Kółko Gospodyń Wiejskich z Łowicza. Zbyt wielu podejrzanych. Zdecydowanie zbyt wielu.\nSkreślał niektórych, dopisywał z powrotem, otaczał kółkami, wszędzie rysował strzałki jak na mapie bitwy szaleńca.\nW komnacie rozległo się pukanie. Przycisnął listę do piersi, serce mu waliło jak z armaty. Czy właśnie go szpiegują? Są tu kamery lub podsłuchy? Komu raportuje personel? Po raz pierwszy od lat Starszy Ziemkiewicz nie wiedział, kto nadal należy do Bractwa."
belchatow_dlc.33.a: "I co gorsza - nie ufał już sobie, że potrafi dostrzec różnicę."

belchatow_dlc.34.t: "Gdy wzywa obowiązek"
belchatow_dlc.34.desc: "Roksana Węgiel nie mogła spać. Noc napierała na okna mieszkania niczym wstrzymany oddech na płuca. Poniżej piece paliły się słabo, ich blask był stłumiony i zdyscyplinowany - jakby samo miasto udawało, że nic się nie wydarzy. Na stole leżało przemówienie. Trzy strony. Reforma. Odnowa. Oczyszczenie bez ognia. Słowa starannie wybrane przez Gadomskiego, wygładzone przez Janeckiego, ćwiczone, aż brzmiały jak jej własne. Bractwo musi się zmienić, by przetrwać. Nienawidziła łatwości, z jaką przychodziło jej teraz to zdanie.\n\nRoksana wstała i zaczęła krążyć. Odbicie w ciemnej szybie wyglądało starzej, niż się czuła. Nie niedoszła Starsza. Nie Paladyn. Nawet nie piosenkarka. Na tyle widoczna, by być użyteczną. Dlatego ją wybrali. Ziemkiewicz był zbyt zbrukany paranoją. Warzecha zbyt otwarcie budził strach. Gadomski i Janecki wiedzieli, że jeśli przewrót będzie miał ich twarze, będzie wyglądał jak ambicja. Jeśli jej - jak nadzieja.\n\nBędziesz pomostem.\nLudzie ci ufają.\nPoprowadź nas ku lepszej przyszłości.\n\nWierzyła. Albo kiedyś wierzyła. Lecz wiara przywiodła ją tutaj - w tę noc. Żołnierze już się przemieszczali, lojalność została przehandlowana, a aresztowania zaplanowane. Przewrót nie potrzebował już jej zgody, tylko obecności. Nalała wody. Nie wypiła. Nazwisko Warzechy samo wypłynęło w myślach. Jak pochylał się ku Ziemkiewiczowi i szeptał mu do ucha jad. Zdrajcy. Wiechowcy. Wszechobecne cienie. Roksana patrzyła, jak Starszy kurczy się pod tym ciężarem, jak rządy gniją w oskarżeniach.\n\nTo musi się skończyć, powiedziała sobie. Musi.\nA jednak.\nJeśli stawią opór, co się stanie? Wojna domowa. Kolejna wojna domowa wewnątrz tej, która już szaleje w Polsce.\n\nHistoria ich osądzi.\nHistoria zawsze osądzała, gdy krew już wyschła na bruku.\n\nUsiadła z głową w dłoniach. Gdzieś w mieście rozpieczętowywano rozkazy. Nazwiska trafiały na listy. Drzwi oznaczano, choć jeszcze do nich nie pukano. Wykorzystują mnie, pomyślała. Nie okrutnie. Precyzyjnie. Powoli wstała, wyprostowała płaszcz, wygładziła niewidoczne zagniecenia. Nie było odwrotu. Gdyby odmówiła, ruszyliby bez niej - a ona stałaby się kolejnym problemem do rozwiązania. Wzięła przemówienie. Reforma. Rewolucja. Czysta twarz dla brudnej konieczności. Po raz ostatni pozwoliła sobie to poczuć - wątpliwość, strach, cichy horror wiedzy, że jutro jedni będą ją czcić, inni przeklinać, ale nikt nie zrozumie.\n\nRozległo się lekkie, sygnałowe pukanie do drzwi."
belchatow_dlc.34.a: "- Już czas, Paladynko Węgiel."

belchatow_dlc.35.t: "Wewnętrzna robota"
belchatow_dlc.35.desc: "Dowiedział się przypadkiem. To niepokoiło go najbardziej. Centrum cyfrowe pachniało papierosami i zwietrzałą kawą, a rzędy serwerów szumiały niczym kantyczka do boga maszyny. Warzecha nie planował tam być; miał uczestniczyć w spotkaniu Ministerstwa Infrastruktury na temat nowego terminala surowcowego na Śląsku. Nudziło go jednak i poczuł swędzenie z tyłu głowy. Zawsze lubił rutynowe obchody bezpieczeństwa, dzięki którym podwładni pozostawali nerwowi i lojalni.\nPodczas przeglądania tajnego rejestru dostępu ostrzeżenie zamigotało czerwienią na terminalu, który nie powinien migać. Dzieciak przy biurku obok - nisko postawiony informatyk o łatwej do zapomnienia twarzy i stale drżących rękach - głośno przełknął ślinę.\n- Panieladynie... właśnie oznaczyliśmy anomalię dostępu z węzła wewnętrznego. Warzecha pochylił się nad ramieniem z błyszczącymi oczami jak człowiek, który trafił szóstkę w lotka. Ktoś próbował pobrać archiwalne pliki z prywatnej partycji. Jego partycji. Nazwiska związane z czystkami, które nigdy się nie wydarzyły. A głębiej - haki. Profile psychologiczne. Słabości Ziemkiewicza, czyste i ostre, gotowe do użycia jak ostrze.\n- I..., wygląda na to, że zdarzyło się to już wcześniej? Kilka dni temu ktoś wszedł do tej... sekcji.\nOceny stabilności Bractwa. Jego raporty o zarządzaniu energią i kolejnej nadciągającej katastrofie. W niewłaściwych rękach mogły zniszczyć kraj.\n- Kto wszedł i dlaczego, na kuźnię, nikt nie zgłosił poprzedniego włamania? - zapytał zbyt łagodnie, jak zadowolony rekin przed pożarciem ofiary.\n- Przepraszam. Sprawdzę, kto wtedy pracował przy logach. A teraz? Odciąłem sesję, gdy tylko zobaczyłem trasowanie.\nDzieciak miał dobry instynkt. Niestety. Warzecha zacisnął szczękę i podążył śladem. Warstwy zaciemnienia, fałszywe przekaźniki, śmieciowe dane, mylący spam. Ktoś kompetentny. Znający system dość dobrze, by niemal ujść. Niemal.\nW metadanych pojawił się ukryty, lecz niedbale pozostawiony znacznik: KATALIZATOR.\nWarzecha wyprostował się. - Wyciągnij wszystko związane z tym kryptonimem. Dzieciak zawahał się.\n- Ale.. ten węzeł jest chroniony prz...\n- Przeze mnie - warknął Warzecha. - Rób to.\nMijały minuty. Serwery wyrzucały wszystkie tajemnice i archiwa. Wniosek nie był jednak oczekiwany. Kryptonim przypisano do... wydarzeń koncertowych? Warzecha roześmiał się sucho, bez humoru.\n- Nie. Ona nie jest zdolna. To ktoś inny.\nRoksana nie miała zasięgu ani siły. Była widoczna i lekkostrawna, dokładnie taką osobą, którą wystawia się na front, gdy samemu nie chce się być dostrzeżonym. To oznaczało kogoś z większymi wpływami i motywem radykalnej zmiany kursu kraju. Gadomski. Tak oczywiste, że mogło być nieprawdziwe. Ale to najlepszy trop. Jeszcze godzinę temu Warzecha pozostawał dwa kroki z tyłu. Teraz? To była chwila w której zdobywa przewagę. Czas na polowanie. I bez żadnych niedomkniętych wątków."
belchatow_dlc.35.a: "- Dziękuję za służbę, dziecko. Dopilnuję, by rodzice wiedzieli, że zginąłęś jak bohater."

belchatow_dlc.36.t: "Rada zawsze wygrywa"
belchatow_dlc.36.desc: "Plansza była ustawiona, zanim ktokolwiek zrozumiał, że rozpoczęła się gra. Najpierw dołączyły lojalne elementy wojska. Ciche spotkania, ciche obietnice. Lojalność wobec Bractwa nie opierała się na wierze, lecz pewności, a Warzecha dopilnował, by pozostać jedynym pewnym człowiekiem bez miejsca na ruch dla innych. Jednostki bez oznaczeń wślizgiwały się do węzłów transportowych, wież nadawczych i bram hut. Oficjalnie nigdy ich tam nie było i spędzały przepustki w rozmaitych lokalach ciemnej strony Łodzi. Był gotowy na wszystko co ma go spotkać. Wszystkie drzwi już zamknięto. Warzecha stał w biurze, patrząc na miasto i wyobrażając sobie linie widoczne tylko dla niego. Wtedy zapukał Janecki. Zawsze wyglądał jak spiskowiec. Jak miałby nie wyglądać? Był mistrzem szpiegów i wiedział o wszystkim w kraju. Musiał wiedzieć o spisku.\n- Mamy problem - powiedział bez wstępu.\nWarzecha nie odwrócił się ani nie odpowiedział.\n- To Gadomski. Jest lekkomyślny, zawsze był. Wciągnął innych do kręgu. Reformistów jak Bartosiak i Zychowicz. Użył Roksany jako twarzy. Część podejrzewałem, ale dobrze zacierali ślady i nie mogłem skonfrontować go bez dowodów. Teraz wiem.\n- Ukryli się przed tobą? Człowiekiem, który wie wszystko? Trudno uwierzyć.\nJanecki westchnął jak człowiek przyznający się do osobistej porażki.\n- Ktoś wielokrotnie próbował uzyskać dostęp do twoich akt. Myślę, że ostatnie wydarzenia zmusiły go do działania. Sądził, że posiadanie haków go ochroni. Oto wszystko, co wiem - powiedział, wyjmując mały przenośny dysk. Warzecha wreszcie się odwrócił. Janecki wytrzymał spojrzenie. Spokojny, wyważony, bez strachu. Niewinność albo mistrzostwo. Łukasz wiedział, że nigdy go nie przechytrzy, lecz teraz był pełen siebie.\n- A ty? - zapytał. - Próbujesz wyciągnąć się z dołu własną przewagą?\nJanecki rozłożył ręce.\n- Służę Bractwu. Zawsze służyłem. Gdy tylko złożyłem dowody, przyszedłem do ciebie. Zapytasz, czemu nie wcześniej? Powiedz, Łukasz, czy wiesz coś o Wschodniej Konspiracji? Uwierz mi, gdyby nie ja, połowa Bractwa byłaby teraz ogarnięta powstaniem. Od ponad miesiąca rozbijam komórki terrorystyczne.\nTo mogło być kłamstwo. Dobre, mocne alibi. Warzecha znał raporty ze wschodu. Historia Janeckiego pasowała zbyt dobrze. Na tym polegał jej geniusz.\n- Zajmiemy się nimi - powiedział Warzecha - a każdego współspiskowca spotka ten sam los.\n- Tak sądziłem - Janecki skinął głową. Nie był nadgorliwy. Dobrze. Może naprawdę w tym nie uczestniczył.\nStali w ciszy. Na zewnątrz trwał zwykły dzień. Miasto niczego nie zauważało. Miasta nigdy nie zauważają, dopóki nie jest za późno. Warzecha studiował Janeckiego niczym mapę bez punktów orientacyjnych. Wiedział - wiedział - że ten człowiek wie o nim wszystko. Dotykał jego tajemnic i za każdym razem wyślizgiwał się czysty jak łza. Zrobi to ponownie.\n- Zawsze wiedzieliśmy, prawda? Pieprzony liberał... - powiedział wreszcie Warzecha. - Trzymaj się blisko, będę cię potrzebował kiedy wszystko wybuchnie.\nJanecki pozwolił sobie na najlżejszy uśmiech.\n- Oczywiście - powiedział i wyszedł bez słowa.\nWarzecha usiadł, nalał sobie drinka i podłączył przenośny dysk do laptopa. Widniał na nim jeden folder o znajomym kryptonimie. Katalizator. Och, kuźnio - niech tylko spróbują..."
belchatow_dlc.36.a: "...jesteśmy gotowi."

belchatow_dlc.37.t: "Węglowy cień"
belchatow_dlc.37.desc: "- Dobra, chłopaki - Wartownik Warzecha objął najbliższego Rycerza. - Oto instrukcje. Są tu wielkie nazwiska, ale bez obaw, jesteście kryci. To zdrajcy Sprawy Węglowej. Nie może być dla nich litości. Cele i metody opisano w papierach. Dla waszego i mojego bezpieczeństwa nie wymienię nazwisk. Ruszać!\n\nWszystkie zespoły uderzeniowe miały rozpocząć mniej więcej jednocześnie w nocy, lecz ważne było, by Zespół Rebelia, którego zadaniem było schwytanie Roksany Węgiel, zaatakował odrobinę wcześniej. Pomimo niewinnego wyglądu Roksana była najbardziej prawdopodobną przywódczynią potencjalnego buntu przeciwko reżimowi. Jeśli sprawy wymknęły się spod kontroli, oczywiście. Istnieli też Karbonariusze, którzy pospieszyliby jej na ratunek nawet po publicznym ogłoszeniu jej wrogiem państwa. Warzecha chciał jak najmniej zamieszania. Drzwi otworzył mąż Węgiel. Agenci wykorzystali to, by masowo wejść pomimo protestów. Wbiegli na górę i zastali Roksanę w koszuli nocnej.\n- Proszę iść z nami. Tu nie jest bezpiecznie - uprzejmie poprosił dowódca.\n- Muszę się z kimś skontaktować - odpowiedziała, szukając telefonu.\n- Nie ma czasu. Poza tym wrogowie państwa musieli już założyć podsłuch.\n- Jak? Jesteśmy pod stałą obserwacją, odkąd umieszczono nas w areszcie domowym, chciałabym...\n- Pójdziesz z nami albo coś złego stanie się twojej rodzinie. - Agent skończył z uprzejmościami.\nRzuciła się ku telefonowi, lecz inni szybko ją schwytali. Szarpała się bez skutku.\n- I tak mnie zabijecie! - krzyknęła.\n- Może, ale jeśli będziesz się opierać, zabijemy cię tutaj i pokażemy dziecku, co z Ciebie zostało. Jeszcze nie ma żadnej traumy, prawda?\nDopiero wtedy się poddała i została poprowadzona do wojskowej ciężarówki. Agenci musieli wykonać instrukcję: \"Nie zostawiać śladów. Wiecie, co zrobić z Węgiel\".\n\nPozostali mogli działać znacznie mniej subtelnie. Zespół Smog Wojny po prostu wtargnął do biura Bartosiaka i Zychowicza.\n- Zablokować wszystkie wyjścia - rozkazał dowódca.\nEgzekutorzy usłyszeli bieg i ruszyli za dźwiękiem. Duet rzucał im pod nogi krzesła i skręcał w kolejne korytarze, unikając kul. Musieli jednak trafić na ślepy zaułek. Tak zginął Zychowicz. Bartosiak ukrył się w toalecie, stojąc na muszli, by żołnierze nie widzieli jego nóg. Nie sprawdzali jednak obrzydliwych kabin, w zamian ostrzelając je, a wraz z nimi geostratega.\n- Mówiłem, że tu był.\n\nGadomski próbował uciec. Wsiadł do samochodu i zmusił zabójców do pościgu. Ze względu na konflikt dobrze wiedział, co go czeka. Ścigający mieli broń, on nic. W końcu kula trafiła w oponę i samochód się rozbił. Gadomski był mocno poturbowany, a pięści oprawców nie pomogły. Pobitego niemal nie do poznania pozostawiono pod drzwiami dawnego biura \"Gazety Wyborczej\", zgodnie z instrukcją.\n- Dobra robota, Paladynie Wieżycki - Wysoki Paladyn pogratulował podwładnemu, gdy Wieżycki bez słowa patrzył na wynik strasznej pracy.\nNastępnie Wysoki Paladyn strzelił mu w nogę. - Niestety - ciągnął równie beznamiętnie - właśnie uznano cię za winnego brutalizacji więźnia i przemytu węgla od naszych wrogów, czym ryzykowałeś uwiarygodnienie dezinformacji dysydentów.\nWyrokiem był strzał w głowę."
belchatow_dlc.37.a: "Żadnych niedomkniętych wątków"

belchatow_dlc.38.t: "Ślepa zdrada"
belchatow_dlc.38.desc: "Tychy, jedyne miasto, które przeciwstawiło się górniczej gorączce Bractwa na Śląsku. Tutaj zbuntowany Paladyn Woś stworzył twierdzę sprzeciwu wobec Starszego Ziemkiewicza, gdy dawną stolicę śląskiej kapituły, Mikołów, zrównano z ziemią. Starszy wysłał Paladyna Wróblewskiego z kontyngentem Rycerzy do spacyfikowania rebelii. Po przekroczeniu granicy nie napotkali oporu. Na miejscu generał podniósł megafon, by przedstawić żądania żołnierzom na zewnętrznych barykadach.\n- Jestem Paladynem Bractwa Węgla. Żądam, towarzysze Paladyni, Rycerze i adepci, byście podporządkowali się władzy Bełchatowa i mądrości Starszego. - Przedłużająca się cisza nieco wytrąciła go z równowagi. - Słyszycie mnie?\n- Halo? - zza umocnionej barykady odezwał się Dariusz Zalega, zbuntowany Rycerz i dawny współpracownik Wosia. - Kto mówi?\n- Wiesz, kim jestem i co masz zrobić. Pokłoń się Starszemu.\n- Ale już mamy Starszego - Czerwonego Starszego Rafała Wosia, a ja jestem jego Proktorem - powiedział Zalega z szyderczą dumą.\n- W takim razie daj mi z nim rozmawiać! - Wróblewski jeszcze podniósł głos. - Nie przyjechałem kłócić się z pachołkiem!\n- Nie da rady. Starszy Bełchatowa nie raczył pojawić się osobiście.\n- Stoi wysoko ponad tchórzami i słabeuszami. Poza tym ma inne obowiązki.\n- Rozumiem. W takim razie wyślij Wartownika Warzechę.\n- Niemożliwe.\n- Rzymkowskiego?\n- Zajęty.\n- Bartosiaka?\n- Wiesz, że został stracony.\n- I tak byłby bardziej przekonującym negocjatorem niż ty. - Śląscy Rycerze wybuchnęli śmiechem. Zachichotało także kilku żołnierzy Bełchatowa.\n- Dość! - Wróblewski kipiał gniewem. - Jeśli się nie poddacie, weźmiemy miasto siłą!\n- Nie boimy się was, bełchatowskie kundle! - Zalega pozostał niewzruszony. - Twój kontyngent jest za słaby nawet na Miasteczko Śląskie, nie mówiąc o stolicy. Jesteście w sercu Śląska i łatwo was otoczyć. Pomyślcie o naciśnięciu spustu, a wszyscy zginiecie.\n- Posłuchaj, dobry Rycerzu... - Wróblewski ochłonął, uświadamiając sobie położenie.\n- Nie chcę już z tobą rozmawiać, pustogłowy wycieraczu kopalnianych posadzek! - Zalega uznał zmianę tonu za kapitulację. - Smog Ci w dupę! Twoja matka była wiechowitką, a twój Starszy cuchnie bzem!\n- Na pewno możemy... - Wróblewski spróbował jeszcze raz, lecz Zalega opuścił barykady i wrócił do miasta.\nWysłannik Ziemkiewicza spojrzał na żołnierzy, próbując ocenić, czy ma nad nimi władzę. Uznał, że za małą.\n- Na razie odchodzimy."
belchatow_dlc.38.a: "Jeszcze tam wrócimy!"

belchatow_dlc.39.t: "Rajd Walkirii"
belchatow_dlc.39.desc: "Jakub Zgierski się spóźnił. Jako rywalizujący kandydat na przywódcę Karbonariuszy miał największy problem z wymknięciem się strażnikom.\n- Hasło - powiedział zakapturzony człowiek przy wejściu do opuszczonego magazynu.\n- Nicość.\n- Możesz wejść.\nJak oczekiwał Zgierski, wszyscy spiskowcy już przybyli: bracia Karnowscy, Marcin Rola i szesnastu niższych rangą. Pomieszczenie pełne było zakurzonych beczek, gnijących skrzyń i kontenerów. Lojalni wobec Ziemkiewicza siedzieli przy stole ustawionym specjalnie na spotkanie.\n- To ty nas zebrałeś? - zapytał Michał Karnowski.\n- Nie - z cienia wyszedł Stanisław Janecki. - Ja.\nWszyscy wstali, wyczuwając kłopoty.\n- To pułapka? - alarmująco zapytał Zgierski.\n- Jakim cudem nie jesteś aresztowany jak reszta Rady, karle?! - Rola podszedł do Proktora, okazując dominację.\n- Panowie, nie ma potrzeby agresji. - uniósł ręce - Przynajmniej wobec mnie.\nRola cofnął się, lecz atmosfera pozostała napięta. Janecki zaczął wyjaśniać.\n- Infiltruję nowy reżim, by zorganizować kontrrewolucję. Bracia i Siostry, witajcie w Operacji Walkiria.\n- Skąd wiemy, że nas nie sprzedasz? Że pachołki Roksany nie jadą nas aresztować? - naciskał Zgierski.\n- Właśnie - tyle potrafił dodać Rola.\n- Nie zdradzę. Mam dar będący dowodem lojalności. Janecki wszedł w korytarz między skrzynią a przedmiotem przykrytym płótnem. Szybkim ruchem odsłonił zakneblowanego mężczyznę przywiązanego do wózka.\n- Oto człowiek, który wszystko rozpoczął. Skryba Przemysław Dyzma, włamał się do komPANa Wartownika Warzechy i ujawnił wypaczone dane opinii publicznej, tworząc masowe niepokoje, które wyniosły Węgiel na piedestał. Kiedyś był zaufanym podwładnym, lecz po dzisiejszym spotkaniu zostanie stracony w imię prawowitego Starszego.\n- Nadal ci nie ufam! - krzyknął Rola.\n- Może mówi prawdę - wtrącił Jacek Karnowski. - Moi agenci obserwują ulice wokół magazynu i nikt nas nie śledzi.\n- Zdradzi przy pierwszej okazji. Szpiegowi nigdy nie można ufać. Zwłaszcza takiemu, który zniżył się do pracy z komunistami.\n- Ach, taka zajadłość, Marcinie - Janecki ośmielił się położyć rękę na jego ramieniu. - Z ludźmi takimi jak ty armia Bractwa obroni się przed wszystkim. Byłbyś świetnym Naczelnym Paladynem.\n- Już mamy Naczelnego Paladyna - Zgierski spojrzał podejrzliwie. - Tomasza Rzymkowskiego. Jesteśmy tu, by go uratować.\n- Niestety - Janecki opuścił głowę - według moich szacunków, jeśli uderzymy na uzurpatorów, Rada najpewniej zostanie natychmiast stracona. Stąd dość pesymistyczna nazwa operacji. Jak Walkirie zaniesiemy dusze poległych do Walhalli i będziemy kontynuować ich dziedzictwo na Ziemi.\n- Taki jest twój plan? - Zgierski również wstał. - Zniszczyć wszystkich rywali i zostać Starszym?\n- Nie, nie, nie. Nie jestem... twarzą. Potrzebujemy charyzmatycznego, popularnego, młodego przywódcy, który poniesie nas w przyszłość. Ciebie, Jakubie.\nTo zwróciło uwagę Zgierskiego.\n- Nie wiem jak wy, ale zrobiło się tutaj duszno. Pójdę zaczerpnąć powietrza.\nWszyscy wykorzystali chwilę na przemyślenie propozycji. Marcin Rola zrobił kilka kroków, potknął się i przewrócił pustą beczkę. Pozornie pusta beczka zaczęła wylewać ropę.\nZebrali się nad kałużą, próbując zrozumieć, dlaczego w opuszczonym magazynie stała beczka pełna ropy. Po chwili pojęli.\n- O nie. - Zgierski rzucił się do drzwi. Nie dość szybko."
belchatow_dlc.39.a: "*JEB*"

belchatow_dlc.40.t: "Dobrze jest jak jest"
belchatow_dlc.40.desc: "Jak każdy Polak Roksana Węgiel została głęboko dotknięta Upadkiem, psychicznie i ekonomicznie. Pomimo początków jako zwyciężczyni Eurowizji Junior i rosnącej międzynarodowej sławy nadal silnie zależała od słuchaczy z Polski. Słuchaczy, których nie było stać na jedzenie, nie mówiąc o muzyce. Mimo to radziła sobie znacznie lepiej niż większość rodaków. Poza bogactwem, dzięki statusowi, była wolna od ucisku totalitarnych reżimów. Dlatego postanowiła pozostać w Polsce i odbyć trasę charytatywną, by ulżyć cierpieniu Polaków i może zainspirować ich do powstania. Najgorsze reżimy zabraniały jednak występów, a wyjątki, takie jak Bractwo Węgla, które zapewne uznało, że jej nazwisko dobrze wygląda w propagandzie, żądały nadzoru nad rozdziałem pieniędzy. Większość z pewnością pochłonęła korupcja. Ślepa uliczka. Może powinna zmienić strategię albo porzucić sprawę i skupić się na międzynarodowej karierze, jak sugerowali mąż i menedżer. Tym zajmie się jutro. Teraz musi przywdziać sceniczny uśmiech i dać mieszkańcom Bełchatowa widowisko.\n\nHołownia przybył na festiwal ostentacyjnie spóźniony. Nie tylko dla pokazania dominacji, ale również by dać Bractwu czas na dopracowanie szczegółów. Relacje z Bełchatowem były już napięte z powodu ekologicznych poglądów Prezydenta i nie potrzebowały dalszych obciążeń. Wyglądało na to, że Rada myślała podobnie, bo naprawdę przeszła samą siebie. Festiwal pełen był stoisk z jedzeniem, sklepików, dmuchanych zjeżdżalni i gier, w których można było wygrać prawdziwe kilofy oraz hełmy. W powietrzu unosiły się balony w kształcie górników i sterowce z symbolami Bractwa. Dzięki atrakcjom teren tętnił życiem niemal do granic przepychu.\n- Ach, Prezydencie Hołownia, to zaszczyt pana gościć - Ziemkiewicz wyciągnął rękę.\n- Dziękuję, Starszy Ziemkiewiczu, pan i pańscy ludzie zorganizowali wyjątkowe wydarzenie. - Hołownia liczył, że nie spotka innych członków Rady. Obawiał się pomylenia ich starodawnej tytulatury.\n- Musi być pan głodny po podróży, proszę spróbować miejscowych specjałów.\n- Och, nie. Staram się trzymać dietę - próbował się wymigać Hołownia. Znając kuchnię Bractwa, nie spodziewał się niczego bez mięsa.\n- Nalegam. - Starszy objął go ramieniem i poprowadził ku strefie gastronomicznej.\n- Naprawdę pomyśleliście o wszystkim. - Wielki Mediator spojrzał na stoisko z przełomowym dla miejscowych hasłem: \"Bezmięsne klopsiki!\"\nPrzywódca Łodzi zamówił symboliczną porcję na pokaz.\n- Bardzo dobrze naśladują rybę - pochwalił kucharza.\n- Proszę pana... - odpowiedział zdezorientowany mężczyzna. - Bo zrobiliśmy je z ryby.\nPrezydent Łodzi zakaszlał i wypluł przeżute jedzenie na buty Starszego.\n- Mówiłem, żeby nie robić ich z mięsa! - gospodarz całkowicie zignorował oplucie i wściekle spojrzał na kucharza.\n- Nie ma tam mięsa - zawodził mężczyzna. - Użyłem ryby!"
belchatow_dlc.40.a: "Zabrać go!"

belchatow_dlc.41.t: "Dzień Postępu [GetYear]"
belchatow_dlc.41.desc: "Dzisiaj obchodzimy kolejny doroczny Dzień Postępu, święto wszystkich wielkich pionierów, którzy poświęcili życie sprawie przemysłu i rozwoju. Odbędą się liczne uroczystości, przemówienia oraz oczywiście mnóstwo tematycznych potraw i napojów. W kulminacyjnym momencie sam Starszy Ziemkiewicz wygłosi mowę przewodnią, podsumuje osiągnięcia Bractwa i przedstawi wizję przyszłości, a następnie ogłosi zwycięzcę konkursu na Wynalazcę Roku. Zjednoczmy się w świętowaniu, ponieważ nasz kraj, a szczególnie wy - robotnicy Bractwa Węgla - na to zasługujecie."
belchatow_dlc.41.a: "Widzimy się za rok!"

belchatow_dlc.42.t: "Trzęsienie ziemii"
belchatow_dlc.42.desc: "Rafał Ziemkiewicz siedział w gabinecie, oczekując raportów o zakończeniu wycinki w granicach ZHRP. Pod osłoną nocy, podczas burzy, gdy nikt nie odważyłby się rozbić wiosennego obozu. Szybka, masowa operacja miała dostarczyć dość paliwa przy minimalnym ryzyku napotkania Harcerzy. Zanim zobaczył akta, przybył posłaniec w sprawie wyprawy. Andrzej Kopek, ambasador Łodzi, wszedł, spokojnie zamknął drzwi i wybuchł gniewem.\n- Co to, do cholery ma być, Rafał?\n- Co masz na myśli? - spokojnie zapytał Starszy.\n- Nie pogrywaj ze mną. Mówię o wysłaniu ludzi na terytorium ZHRP, by wycinali drzewa.\n- Zakładając, że to prawda, nie rozumiem gniewu. Bractwo nie byłoby pierwsze prowadzące operację poza granicami.\n- Wasza operacja jest pierwszą, w której zginęli ludzie. - Ambasador zauważył zaskoczenie i postanowił kuć żelazo póki gorące. - Będą konsekwencje dla nich i dla ciebie, a sankcje będą proporcjonalne do popełnionych zbrodni.\nZiemkiewicz próbował odzyskać grunt pod stopami.\n- Każda nieszczęśliwa komplikacja wynikała ze złożonego charakteru operacji. Inni prowadzili proste najazdy, by unicestwić cudzą własność; my gromadziliśmy zasoby marnowane pod nadzorem Harcerzy. Możesz winić nas za chęć budowania zamiast niszczenia?\n- Wmawiaj sobie dowolne kłamstwa - Kopek wyładował gniew i czuł już tylko rezygnację wobec kretyńskiego uporu. - Zastanów się, czy mądrze jest podkopywać Dialog, który pomógł wam stanąć na nogi, pozwala sprzedawać energię w całym województwie i z pewnością ukara was za przewinienia.\n- Nie radzi sobie zbyt dobrze. Ale zaryzykujemy, dziękuję za troskę. A teraz proszę wrócić do przygotowanego biura. Oczekuję wielkiego pliku raportów, którym będę musiał się zająć."
belchatow_dlc.42.a: "*trzask zamykanych drzwi*"

belchatow_dlc.100.t: "Bełchatów zaprasza naszego przywódcę na festiwal!"
belchatow_dlc.100.desc: "OD: Narodowa Rada Planowania Wydarzeń Bractwa Węgla\n\n\"Z przyjemnością ogłaszamy, że Szanowny Pan Dialogu, Szymon Hołownia został zaproszony jako gość honorowy na Wielkim Pikniku w Bełchatowie. Coroczne wydarzenie w naszym ukochanym mieście celebruje ducha wspólnoty, postęp i niezłomną wolę Bractwa. Obecność Pana Hołowni będzie pomnikiem rosnącego uznania dla naszej sprawy i wartości.\n\nFestiwal obejmie rozmaite aktywności, w tym przemówienia, występy kulturalne, wystawy osiągnięć Bractwa oraz oczywiście poczęstunek i posiłki. To okazja, by zjednoczyć się, wzmocnić więzi i ponownie potwierdzić oddanie zasadom, które nas prowadzą.\n\nZ niecierpliwością oczekujemy Pana Hołowni i pragniemy podzielić się z nim ciepłem oraz gościnnością, z której słynie Bełchatów.\""
belchatow_dlc.100.a: "W końcu nas zaczęli akceptować?"

belchatow_dlc.101.t: "Ekoterroryści złapani!"
belchatow_dlc.101.desc: "W brawurowej operacji schwytano ekoterrorystów odpowiedzialnych za zamach na placówkę Bractwa w Szczercowie. Choć musieliśmy przekroczyć granice państwa, jesteśmy pewni, że dyplomaci załagodzą sprawę, ponieważ chodziło o bezpieczeństwo narodowe i odpowiedź na zagrożenie terrorystyczne."
belchatow_dlc.101.a: "Wymierzmy im sprawiedliwość!"

belchatow_dlc.102.t: "Rozrost Śląskiego Bractwa"
belchatow_dlc.102.desc: "W związku z niedawnym pozyskaniem nowych terenów w województwie Opolskiem, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.102.a: "Przekaż ziemie"
belchatow_dlc.102.b: "Kim jesteśmy by dawać coś za darmo?"

belchatow_dlc.103.desc: "W związku z niedawnym pozyskaniem nowych terenów w Małopolsce, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.104.desc: "W związku z niedawnym pozyskaniem nowych terenów w regionie Beskidów, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.105.desc: "W związku z niedawnym pozyskaniem nowych terenów Cieszyńskich, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."
belchatow_dlc.106.desc: "W związku z niedawnym pozyskaniem nowych terenów na Zaolziu, planiści przemysłowi sugerują by włączyć te tereny w administracyjne granice Śląskiego Bractwa."

belchatow_dlc.107.t: "twój stary też zapierdala"
belchatow_dlc.107.desc: "w kopalni na ślunsku"
belchatow_dlc.107.a: "kopie węgiel kamienny"

belchatow_dlc.108.t: "Wielki Blackout się skończył!"
belchatow_dlc.108.desc: "Po miesiącach trudów i zmagań, Wielki Blackout, który pogrążył naród w ciemności, został wreszcie ujarzmiony. Dzięki niestrudzonym wysiłkom inżynierów i robotników oraz niezachwianemu duchowi ludu przywrócono zasilanie w każdym zakątku Bractwa Węgla. Razem przetrwaliśmy ciemność, a teraz wychodzimy z niej silniejsi i bardziej zjednoczeni niż kiedykolwiek. Pamiętajmy o poświęceniu tych, którzy niestrudzenie przywracali światło, i patrzmy ku przyszłości napędzanej węglem oraz determinacją."
belchatow_dlc.108.a: "Niech żyje Bractwo Węgla!"

belchatow_dlc.109.t: "Ustanowienie Kolektywu Miedziowego"
belchatow_dlc.109.desc: "Dolny Śląsk jest ziemią bogatą w surowce mineralne, a po niedawnym przejęciu miejscowych kopalń miedzi należy utworzyć organizację poświęconą nadzorowi nad ich zarządzaniem i eksploatacją. Kolektyw Miedziowy dopilnuje wydajnego i zrównoważonego wydobycia tych cennych zasobów, wzmacniając gospodarkę Bractwa Węgla. Pomoże również zdywersyfikować bazę przemysłową i ograniczyć zależność od samego węgla. Kolektyw nie jest jednak tylko KGHM-em pod nową nazwą. Nasze ostatnie odkrycia w dziedzinie sztucznej inteligencji były sukcesem głównie dzięki naukowcom KGHM. Dlatego staną oni na czele wysiłków modernizacyjnych i innowacji w górnictwie. Z niecierpliwością oczekujemy pozytywnego wpływu Kolektywu na gospodarkę i naród."
belchatow_dlc.109.a: "SI? W tym miksie energetycznym?"

belchatow_dlc.110.t: "Przebijanie muru głową"
belchatow_dlc.110.desc: "Nie powinieneś tu być. A jednak. Fajny ten twój power armor - byłaby wielka szkoda, gdyby coś złego mu się przytrafiło. Koniec końców, nie możemy Ci pozwolić żebyś go miał. Dlaczego? Bo tak mówi fabuła. Że co? Pytasz, dlaczego możesz zbudować power armor każdym innym gównianym watażką, ale nie BRACTWEM WĘGLA? Cóż. Odpowiedź jest banalna. Bo to zajebiście śmieszne. A teraz idź zagraj Atomową Krucjatą."
belchatow_dlc.110.a: "Zaklinam Cię kurwa, twój power armor właśnie dostał raka kutasa"


##INNER CIRCLE##
BBW_elderprinzip: "Wariactwa Starszego"
BBW_elderprinzip_desc: "Próbowałem utrzymać wszystko pod kontrolą pomimo kolegialnego charakteru rządów Rady. Wiem, że nie da się rządzić samotnie, lecz wielkie projekty i kampanie może zrealizować wyłącznie jedna dominująca osoba kierująca procesem. Doktryna, niegdyś skuteczna, powoli upada głównie przez własną skuteczność. Wiedzieliśmy, że nasze terytoria będą się rozszerzać, lecz tempo przekroczyło najśmielsze oczekiwania. Będę więc musiał przekazać więcej władzy podwładnym. Muszę uważać. W szeregach powstały dwie frakcje - reformiści i twardogłowi. Ci drudzy są bardziej wiarygodni i lojalni, lecz pierwsi również bywają użyteczni. Muszę postępować niezwykle ostrożnie i słuchać obu stron, ponieważ każda może wykorzystać nowe przywileje do uzurpacji moich rządów."
BBW_elderprinzip_inner_circle_tt: "Aktywuje mechanikę §YRady Starszych§!.\n\n"
BBW_ascension_of_rzymkowski: "Naczelny Paladyn Rzymkowski"
BBW_ascension_of_rzymkowski_desc: "Wierny kontynuator myśli Naczelnego Paladyna Sommera, Rzymkowski wspiera nas od początku, jeszcze od czasów gdy nie mieliśmy niczego. To on doradził, by uczynić Bełchatów naszym domem. Choć nie należał do pierwotnego składu Rady, szybko awansował. To naturalne, by pozwolić mu zacieśnić uścisk nad wojskiem. Jest znacznie lepszym doradcą niż Bartosiak i Zychowicz - karierowicze, którzy wskoczyli na nasz wóz, gdy wszystkim stało się jasne, że jesteśmy skazani na triumf. Jego awans oznacza trzymanie się sprawdzonych metod przytłaczającej siły pancernych kolosów. Nigdy nie zastąpi nieskazitelnego Sommera, lecz może nadal wypełniać pozostawioną pustkę."
BBW_armoured_fists: "Pancerne pięści"
BBW_armoured_fists_desc: "Uderzymy w wrogów i uderzymy w nich mocno. Niektórzy twierdzą, że zbyt usilnie stawiamy na czołgi, zaniedbując zwyklejsze uzbrojenie. Uważają, że powinniśmy bardziej zadbać o regularną piechotę, by ułatwić okupację. Oczywiście się mylą. Walka o Polskę toczy się przede wszystkim w sercach ludzi. Nasze pancerne postrachy są nie tylko zabójczo skuteczne w walce. Budzą grozę w przeciwnikach. Gdy się nas boją, wielkie siły okupacyjne nie będą potrzebne, kiedy stalowe pięści wycisną życie z wrogów postępu."
BBW_mechanized_machine: "Zmechanizowana maszyna"
BBW_mechanized_machine_desc: "Bractwo jest maszyną. Może działać tylko wtedy, gdy wszystkie tryby współpracują, tworząc coś większego niż sama suma części. Nasza maszyna jest narzędziem postępu rozprzestrzeniającym się na zewnątrz, depczącym chaty prymitywistów pragnących zahamować rozwój ludzkości. Nasza armia musi to odzwierciedlać. Każdy żołnierz ma być jednoosobową alegorią sprawy, zmechanizowaną od stóp do głów, czy to za pomocą pancerza taktycznego, czy implantów. Spadną na wrogów z najnowocześniejszych transporterów opancerzonych."
BBW_ascension_of_zychosiak: "Paladyni Bartosiak i Zychowicz"
BBW_ascension_of_zychosiak_desc: "Czas na zmiany, nie możemy wciąż inwestować w drogie pojazdy wojskowe i posyłać ich na przemiał. Potrzebujemy taktyków, strategów, wręcz geostrategów. Dynamiczny Duet jest dość nowym nabytkiem, lecz rzeczywiście zna się trochę na geopolityce. A przynajmniej ani ja, ani żaden współpracownik nie potrafimy obalić ich twierdzeń. Nie ma większego znaczenia, że proponują działać mądrzej bez zwiększania wydatków wojskowych. Poza wyższymi pensjami dla siebie. To nadal drobne obciążenie budżetu. Uwzględnianie gór przy planowaniu kampanii brzmi dość niewinnie."
BBW_securing_rimland: "Zabezpieczenie rubieży"
BBW_securing_rimland_desc: "Choć krzykacze go krytykują, Jacek Bartosiak jest prawdziwym wizjonerem. Duet rozumie strategiczne znaczenie Polski jako ziemi na skrzyżowaniu dwóch najważniejszych regionów decydujących o kontroli nad światem - Heartlandu i Rimlandu. Nasz naród, należący do morskiego Rimlandu, musi stać się flanką broniącą Zachodu przed ekspansją Rosji, potęgi Heartlandu. Prawa geopolityki nakazują przygotować się na atak i chronić ciepłe zachodnie porty przed wrogami."
BBW_new_model_army: "Armia Nowego Wzoru"
BBW_new_model_army_desc: "Ja... nie wiem, co o tym myśleć. Z jednej strony Bartosiak i Zychowicz mówią o reformach bliskich sercu mojemu i każdego patrioty. Armia ma być szybka, mobilna, świetnie wyposażona i wyszkolona. Ma tworzyć elitę narodu. Jednocześnie mówi wiele kontrowersyjnych rzeczy. Chce, by pojazdy były tak małe, że ledwie nadają się dla dzieci naszych Rycerzy... Przynajmniej tak twierdzą niektórzy Paladyni. Gdy przedstawiam te zarzuty Bartosiakowi, odpowiada, że to cena zwiększonej zwinności pozwalającej szybko atakować i jeszcze szybciej unikać kontrataku. Chyba ma to trochę sensu."
BBW_technological_superiority: "Przygniatająca przewaga technologiczna"
BBW_technological_superiority_desc: "Niezależnie, czy używamy skalpela, czy młota, musimy iść naprzód. Być o krok przed wrogami i pozostawiać ich w niepewności, jaki będzie nasz następny wynalazek i ruch. Przejmując inicjatywę, dopadniemy ich dokładnie tam, gdzie chcemy. Udowodnimy, że nie jesteśmy zacofanymi dzikusami, lecz pionierami, którzy wybrali alternatywną drogę ku przyszłości i rozkwitli ponad wyobraźnię ich, a nawet naszą własną. Jutro należy do nas! Ad Victoriam!"
BBW_ascension_of_warzecha: "Awans Warzechy"
BBW_ascension_of_warzecha_desc: "Wartownik Warzecha odpowiada za większość spraw w państwie; naturalne, że otrzyma większą kontrolę nad sektorem unikanym przez wszystkich. Cóż, nie do końca, po prostu trochę mu nie ufam z powodu przeszłości. Zawsze mąci, by ukryć coś, za co niższy Rycerz zostałby zdegradowany. Z Warzechą wszystko jest proste i skuteczne. Gospodarka zwalnia? Jeszcze mocniej dokręcić kurek. Ktoś ma coś, czego chcemy? Zabrać dla dobra sprawy węglowej. Jego metody nigdy nie zawodzą."
BBW_mining_expansion_plan: "Plan rozbudowy kopalnii"
BBW_mining_expansion_plan_desc: "Wszyscy panikarze wszczynający alarm, że \"kończą nam się zasoby\"...aaaa, do diabła z nimi! Żaden z tych kretyńskich jajogłowych nie pomyślał o prostym rozwiązaniu niedoboru węgla - kopać głębiej. A jeśli (podkreślam: jeśli) ruda naprawdę staje się rzadsza, potrzebujemy więcej miejsc wydobycia, by to wyrównać. Proste. Jeśli to, w co wierzymy, jest prawdą, lecz nie osiągamy oczekiwanych wyników, trzeba podwoić wysiłki, ponieważ porażki wynikają z niedostatecznego przestrzegania aksjomatów."
BBW_increasing_emission_quotas: "Zwiększenie norm emisyjnych"
BBW_increasing_emission_quotas_desc: "Nie wiedziałem nawet, że mamy limity norm emisji. Nieważne. Ostatnie pozostałości dawnego reżimu zostaną usunięte dla dobra ludu. Limity emisji... co za żart. Jeśli ktoś musi palić węglem albo koksem, by wytworzyć energię lub ogrzać dom zimą, kim jesteśmy, by mu tego odmawiać? Lepiej pozwolić ludziom zamarznąć? Zostawić szpitale bez prądu podtrzymującego śmiertelnie chorych? Lotniska bez możliwości kierowania pilotami przy lądowaniu? Pozostawić Polskę w ciemności? Równie dobrze zakażmy oddychania. W końcu ludzie wydychają dwutlenek węgla. Absurd."
BBW_appropration_of_sectors: "Przywłaszczenie pozostałych sektorów gospodarki"
BBW_appropration_of_sectors_desc: "Bez węgla nie mielibyśmy niczego. To pierwotna przyczyna gospodarki. W dzisiejszych czasach nikt nie zrobi niczego bez energii elektrycznej, a ta nie powstałaby bez spalania węgla. Czy im się to podoba, czy nie, zawdzięczają sukces energetyce i pora spłacić dług. Słuszne jest, byśmy mogli zabrać ich aktywa, jeśli zwiększy to produkcję energii. Może wydawać się bezduszne, lecz bez prądu i tak straciliby firmy. Równie dobrze mogą je stracić dla większego dobra."
BBW_ascension_of_janecki: "Awans Janeckiego"
BBW_ascension_of_janecki_desc: "Spójrzcie na niego. Nie musi współpracować ze wszystkimi. Prawdziwy Joker (ten karciany, bo humor to on ma dość suchy). Jest nieprzewidywalny i potrafi zmienić pozycję, gdy sytuacja tego wymaga. Tak urosła jego władza. Wzmocnienie szpiegostwa jeszcze bardziej zwiększy pozycję Janeckiego, lecz taki podarunek może go przeciągnąć na naszą stronę. Odmowa dalszego awansu tylko opóźni nieuniknione i niepotrzebnie go zantagonizuje. Czy mi się to podoba, czy nie, to on chroni moje plecy przed nożami. Powstrzymując ostrza ekologów...albo swoje własne."
BBW_carbonari_investigative_department: "Wydział Śledczy Karbonariuszy"
BBW_carbonari_investigative_department_desc: "Janecki twierdzi, że potrzebuje nowych kadr do Węglowego Kręgu. Chce werbować je spośród młodzieży, która dowiodła wierności naszym ideałom. Dobrze, jeśli zwiększy to zdolności wywiadowcze, tym lepiej. Wątpię, by te dzieciaki wyrządziły wiele szkody jako uczniowie Janeckiego. Nowy wydział pozwoli nam wyłapywać gniewnych młodych mężczyzn w szeregach. Im młodsi przy werbunku, tym zacieklej będą wykonywać obowiązki."
BBW_expand_weglowy_krag: "Rozszerz Węglowy Krąg"
BBW_expand_weglowy_krag_desc: "Więcej pieniędzy dla piaskownicy Proktora... To prawda, istnieje raport opisujący, dlaczego planowany rozwój Węglowego Kręgu jest niewystarczający. Wspomina wzmożoną czujność wrogich agencji, wszechobecne zagrożenie wiechowskie i... fakt, że wielu dawnych członków Wydziału Śledczego Karbonariuszy awansowało na pełnoprawnych Rycerzy Kręgu Węgla. Przez wcześniejsze pomysły Janeckiego agencja ma zbyt wielu ludzi i za mało wydziałów. Daj komuś palec, weźmie całą rękę. Dobrze, zajmę się tym, ale dam mu znać, że nie ma co liczyć na dalsze kompromisy."
BBW_skarbnicy: "Specjalna jednostka gwardzistów - Skarbnicy"
BBW_skarbnicy_desc: "Rozmawiałem z Janeckim. Powiedział, że po tym, co spotkało Sommera, wysoko postawieni Paladyni, a nawet członkowie Rady zaczęli obawiać się o życie. Ktoś może się zainspirować i podnieść rękę na głowy Bractwa. Może coś w tym być. Aby nie wzbudzać podejrzeń niższych rangą, wymyślił nawet niepozorną nazwę służb ochronnych - Skarbnicy. Najwyraźniej chce wyłączyć z tego Karbonariuszy, woląc \"zachować ich niewinność nienaruszoną\". Jasne."
BBW_militarization_of_skarbnicy: "Militaryzacja jednostek gwardzistów"
BBW_militarization_of_skarbnicy_desc: "Każda propozycja Janeckiego jest potajemnie przynętą; zaraz po jednej przychodzi następna, większa. Teraz mówi, że Skarbnicy powinni być ciężej uzbrojeni i szkoleni do sytuacji bojowych. Dzięki temu lepiej ochronią generałów na froncie, a w krytycznej sytuacji nawet wejdą do regularnej walki. Wadą jest możliwość przeprowadzenia przewrotu, lecz to wątpliwe. Nikt nie zaakceptuje tej żmiji Janeckiego jako przywódcy. Poza tym Skarbnicy już odpowiadają za moją ochronę; już mogą trzymać broń nad moją głową, więc zwiększenie kalibru niewiele zmieni. Odmowa tylko ich rozgniewa."
BBW_brotherhood_control_center: "Centrum Sterowania Bractwem"
BBW_brotherhood_control_center_desc: "Każdego dnia oczy Proktora widzą coraz więcej, a liczba zakamarków, w których można się ukryć, maleje. Codziennie kolejni wiechowcy, socjaliści i terroryści są chwytani oraz sądzeni za zbrodnie. Może pewnego dnia znikną całkowicie. Mam tylko nadzieję, że dzień ten nadejdzie, zanim będę musiał przekazać całą władzę Proktorowi. Janecki może być skutecznym narzędziem, o ile da się go kontrolować. Dotąd okazywał dopuszczalny poziom ambicji. Oby tak pozostało."
BBW_ascension_of_gadomski: "Awans Gadomskiego"
BBW_ascension_of_gadomski_desc: "Czy mi się to podoba, czy nie, Starszy Paladyn Gadomski jako jedyny zna gospodarkę od podszewki. Martwi mnie, że czasami brzmi jak przeklęty wiechowiec. Zapewnia, że robi to dla stabilności i powstrzymania oszustów oczekujących dotacji górniczych za wykopanie dziury w chodniku. Jest też kwestia radykalnego liberalizmu i ścisłego trzymania się oszczędności podczas kryzysu. Takie podejście doprowadziło przed Upadkiem do zamknięcia licznych kopalń i rodzimych polskich firm. Mimo to od początku zarządza tymi sprawami i wszystko działało dobrze. Chyba nie zaszkodzi pozwolić mu wdrożyć więcej pomysłów."
BBW_resource_extraction_committee: "Komitet Wydobycia Surowców"
BBW_resource_extraction_committee_desc: "Na początku brzmiało to podejrzanie, nie będę kłamał. Jak przeregulowany organ prosto z marzeń miałkiego publicysty \"Gazety Wyborczej\". Im więcej słuchałem, tym lepiej rozumiałem Gadomskiego. Okazuje się, że niektórzy oszuści wykorzystali atmosferę gorączki węglowej i dotacje na nowe kopalnie. Zaczynali kopać tam, gdzie nie ma złóż. Ośmielali się fałszować opinie geodetów, by dostać zielone światło rządu, a potem tuczyć się na dotacjach. Komitet Gadomskiego ma walczyć z takimi wynaturzeniami."
BBW_hold_the_emission_urge: "Wstrzymanie gorączki emisyjnej"
BBW_hold_the_emission_urge_desc: "Witold naprawdę wystawia moją cierpliwość na próbę. Potrzebujemy programów pilotażowych tłumaczących Rycerzom, że nowa polityka Gadomskiego nie jest wiechowską herezją i czym się od niej różni. W tym, co mówi, jest jednak trochę racji. Jego zdaniem nacisk niektórych Braci (ma na myśli Warzechę) na emitowanie zanieczyszczeń dla samej emisji rozmija się z celem organizacji i wygląda jak dziecinne zaczepki. Twierdzi, że od ekofanatyków odróżnia nas racjonalność. Emisja jest skutkiem ludzkiej ambicji poprawy życia własnego i innych. Chce spopularyzować tę ideę w propagandzie dla dobra gospodarki."
BBW_state_market_monopoly: "Państwowy monopol rynkowy"
BBW_state_market_monopoly_desc: "Gadomski znów odwołał się do ideałów leseferyzmu, które kiedyś podzielała większość Rady. Twierdził, że korzystamy z węgla głównie dlatego, iż po zdjęciu ekologicznych ograniczeń jest najbardziej praktycznym źródłem energii. Powinno to inspirować nasze podejście do gospodarki. Jego zdaniem państwo zbyt często ingerowało w biznes, zabierało ziemię bez odszkodowania i nie pozwalało zdrowej konkurencji rzucać wyzwania przedsiębiorstwom publicznym. Uważa, że majątek państwowy będzie najskuteczniejszy, gdy pozwolimy mu sprawdzić się na rynku, a jego oferta okaże się najlepsza i ludzie zechcą ją kupować."
BBW_youth_leader_roxi: "Przywódczyni Młodzieży Węgiel"
BBW_youth_leader_roxi_desc: "Gadomski uważa, że powinniśmy bardziej otworzyć się na wolę ludu. Ha! Bractwo z definicji spełnia wolę ludu, ale wiem, co miał na myśli. Słynna piosenkarka Roksana Węgiel postanowiła poświęcić karierę dla naszej sprawy i zgłosiła się na przywódczynię Karbonariuszy. Sądziłem, że ładna twarz przyciągnie chłopców do młodzieżówki, a sława zrobi to samo z dziewczętami. Myślałem, że na tym skończy się jej funkcja, lecz teraz ona i zwolennicy składają petycję o większy udział w realizacji misji. Chyba nie zaszkodzi. Jeśli zasiada w zarządzie, może okazać się użyteczna, skoro naprawdę tego pragnie. Nie widzę, jak mogłoby to zaszkodzić."
BBW_youth_leader_zgierski: "Przywódca Młodzieży Zgierski"
BBW_youth_leader_zgierski_desc: "Jakub Zgierski służył już jako kompetentny Przywódca Młodzieży, wierny rzecznik i pilny Skryba, więc dobrze znamy jego podejście do wielu spraw. Nadal jest jednym z nowszych rekrutów, przynajmniej chronologicznie. Według czystości ideologicznej byłby wyznaczonym następcą Starszego. To, co czasem mówi, zawstydza nawet Warzechę. Nie jest najpopularniejszy, lecz łączy młodzieńczy zapał z pewnością, że Karbonariusze, pełni podatnych na wpływy dzieci nie ulegną wywrotowym narracjom. Brak mu polotu, ale zawsze jest, jak powiedział Janecki. Poluzujmy smycz i zobaczmy, co potrafi."
BBW_loyal_to_axioms: "Lojalni aksjomatom"
BBW_loyal_to_axioms_desc: "1. Osłaniaj się przed tymi, których nie wiąże z tobą stal, albowiem są ślepi.\n2. Lękaj się tych, którzy nie przysięgają Bractwu, bo choć służba może otworzyć ich oczy, teraz pozostają ślepi.\n3. Zawierz swe podejrzenia mądrości Starszego. Gdzie on okazuje zaufanie, tam i ty je okaż. Niezależnie od pochodzenia i różnic ideologicznych wszyscy przywódcy Karbonariuszy muszą złożyć przysięgę Aksjomatom Bractwa. To obowiązek każdego obywatela, lecz dla nich szczególnie święty, ponieważ służą za wzór naszej młodzieży, naszej przyszłości."
BBW_resume_the_concert_tour: "Wznów trasę koncertową"
BBW_resume_the_concert_tour_desc: "Zanim do nas dołączyła, Roksana Węgiel podróżowała po Polsce i muzyką próbowała podnosić rodaków na duchu. Potem zrozumiała, że działalność polityczna lepiej pomaga ludziom, i dołączyła jako Siostra Węgla. Trzymałem ją w granicach państwa, bo nie byłem pewien lojalności. Teraz chyba dowiodła jej wystarczająco, by pozwolić koncertować u nas i poza granicami. Będzie idealną wysłanniczką. Nasza bardka wychwala sprawę i przyciąga rekrutów za granicą. Albo przynajmniej poprawia opinię przyszłych poddanych."
BBW_master_debate_clubs: "Kluby Oralnego Rzemiosła"
BBW_master_debate_clubs_desc: "Aksjomaty zachęcają do debat ze sceptykami. To jedyny sposób szerzenia przesłania i dowodzenia jego słuszności. Zdaniem Jakuba Zgierskiego takie debaty powinny być głównym obowiązkiem Karbonariuszy, którym dotąd brakowało celu. Zgierski, nazywający się teraz \"Młotem na Wiechowców\", proponuje nauczyć innych członków młodzieżówki technik erystycznych i retorycznych, by lepiej przekonywali nieprzekonanych. Nauczyłem się, że zwykle marnuje się słowa na krwiożerczych wiechowców, ale nie będę podcinał dzieciakowi skrzydeł cynizmem."
BBW_1st_carbonari_battalion: "Pierwszy Batalion Karbonariuszy"
BBW_1st_carbonari_battalion_desc: "Popularność Przywódcy Młodzieży wywołała tyle entuzjazmu, że ledwie go powstrzymujemy. Możemy liczyć na falę młodych gotowych umrzeć za sprawę węglową. Część dowództwa uważa ich za zbyt młodych na front, lecz są tak gorliwi, że już teraz spontanicznie rzuciliby się na wroga. Skoro nie możemy powstrzymać ich przed walką, przynajmniej skierujmy tę energię do oficjalnych struktur armii. Utworzenie Batalionu Karbonariuszy zapewni pewien nadzór nad rozochoconymi młodymi wojownikami."
BBW_local_warming: "Lokalne ocieplenie"
BBW_local_warming_desc: "Jeśli istnieje ocieplenie spowodowane działalnością człowieka, to jest to ocieplenie mojego serca. Wszystko dzięki tak zwanym reformistom. Wcześniej sądziłem, że całe to niuansowanie jest sposobem wprowadzania wiechizmu metodą gotowania żaby. Mogłem się mylić, przynajmniej na razie. Zwykle brak im entuzjazmu i czystości ideologicznej, lecz nadrabiają popularnością i kompetencją. Nadal nie mogę ich zanadto chwalić, chyba że chcę, by przewróciło im się w głowie. Granica między innowacją a herezją stała się rozmyta i muszę nieustannie pilnować, by nie zeszli z właściwej drogi."
BBW_old_order: "Stary ład"
BBW_old_order_desc: "Mamy już Aksjomaty zawierające całą wiedzę potrzebną do dobrobytu. Wystarczy zdrowy umysł i podstawowe zdolności dedukcji. Dowodzi tego sukces. Wrogowie uznali nas za niemodne porażki, które uduszą się smogiem, gdy planeta spłonie. Zniszczyliśmy większość z nich. To oni się mylili. Głupotą było choćby rozważanie zmiany strategii. Nie ma dowodu, że jest konieczna, skoro przezwyciężyliśmy wszystkie przejściowe przeszkody. Gdy ekoszaleńcy próbują zwodzić nas zawiłymi krytykami, my niczym Aleksander Wielki przecinamy ich gordyjski węzeł kłamstw, wiedząc, że najprostsze rozwiązania i teorie są najlepsze."

BBW_sudden_shutdown: "Nagła zapaść sieci energetycznej"

BBW_collapse: "Upadek"
BBW_collapse_desc: "Bractwo stoi na krawędzi upadku. Ciągłe bunty, ataki partyzantów, rabunki i niemal całkowita zapaść biurokracji doprowadziły do powstania Atomowej Krucjaty, organizacji terrorystycznej próbującej wykorzystać atom, niszczyciela Łodzi. Co gorsza, z powodu drobnych problemów z Blackoutem wielu ludzi przyłączyło się do Krucjaty, wierząc, że magicznie rozwiąże wszystkie problemy. Nie rozwiąże, ale niektórzy nadal w to wierzą. Bunt doprowadził do utraty kontroli nad wielkimi obszarami, ciężko paraliżując gospodarkę i wojsko. Na szczęście istnieje jeszcze jedno wyjście - wykorzystać resztki armii do zdławienia powstania, zanim stanie się zbyt silne. Łatwiej powiedzieć niż zrobić: buntownicy mają wielu żołnierzy, a by ich pokonać, musimy mistrzowsko dowodzić pozostałymi siłami i odzyskać wszystkie bezprawnie kontrolowane ziemie. Jeśli jednak zawiedziemy, Bractwo będzie zgubione."
