BBW_gigakopary_in_progress: "Construction of Bucket-Wheel Excavators"
BBW_gigakopary_in_progress_desc: "Czech licences for building giant bucket-wheel excavators have finally arrived. Now we can finally start building our own machines to fill the gaps caused by the Blackout and overextension of our mining operations. Hopefully we can get them operational quickly."
