BBW_privileged_miners_1: "Uprzywilejowana klasa górnicza"
BBW_privileged_miners_1_desc: "The miners are the backbone of our society. Without them, there would be no coal, no energy, and no progress. It is only fair that they receive special treatment and privileges for their hard work and dedication. By granting them better wages, working conditions, and social benefits, we can ensure their loyalty and commitment to our cause."
mass_motorization_tt: "§YIncrease§! the §YMotorization§! of the §YInfantry§! by putting additional §YMotorized Battalion§! into §REVERY§! division."
BBW_rehab_conscription_tt: "We will try to §Yrehabilitate§! and §Yintegrate§! former §RWidzew hooligans§! into §YBrotherhood army§! units."
BBW_lodz_chaos: "Miasto chaosu"
szczercow_bombers_captured: "§REkoterroryści odpowiedzialni za zamach w Szczercowie zostali złapani§!"
szczercow_bombing_happened: "§YNie zajmujemy się żadnymi problemami wewnętrznymi§!"
BBW_overextended_grid: "Przeciążona sieć energetyczna"
BBW_overextended_grid_desc: "Our power grid is stretched to its limits, causing frequent outages and instability. This overextension hampers industrial productivity and affects the daily lives of our citizens. If we do not address this issue promptly, the consequences could be severe."
BBW_lodz_coal_deposits_exhausted: "Wyczerpane wojewódzkie złoża węgla"
BBW_lodz_coal_deposits_exhausted_desc: "A więc...pamiętacie ten cały węgiel który eksportowaliśmy do tych pożal się Boże, \"przyjaciół w dialogu\"? Pomijając fakt, że nie byli oni aż tacy przyjaźni gdy chcieliśmy odzyskać nasz węgiel...to w dodatku wygląda na to że udało im się CAŁY TEN WĘGIEL SPALIĆ. WY W OGÓLE WIECIE CO TO JAK DZIAŁA ZARZĄDZANIE ZAPASAMI?"
BBW_blow_up_lodz_tooltip: "§RZamkniemy§! kilka zakładów przemysłowych w §YŁodzi§! w celu ustabilizowania sieci energetycznej i zaoszczędzenia pozostałych surowców."
BBW_fuhrer_tooltip: "Starszy"
BBW_employing_electricians_tt: "§YZatrudnimy§! licznych §Yelektryków§! w celu naprawy §Ysieci energetycznej§!. To zdecydowanie §Yprzyspieszy§! proces §Ynaprawiania§! naszej infrastruktury"
BBW_blackout_energy_boost_tt: "Our §Yenergy§! output will §Yincrease§!."
BBW_protecting_our_assets_tt: "We will §Ysecure our critical infrastructure§! against §Reco-terrorist attacks.§!"
BBW_protecting_our_assets_2tt: "Our workers will be able to get §Yback to mining.§!"
BBW_conglomeration_idea: "Proces konglomeryzacji"
BBW_conglomeration_idea_desc: "There are too many small facilities operating independently, leading to inefficiencies and competition that harms our overall industrial output. By consolidating these entities into a single, more efficient conglomerate, we can streamline production, reduce costs, and increase our economic strength. This is how we survive and thrive."
BBW_electricity_stamps_tt: "We will introduce §Yenergy stamps§! in order to control the flow of remaining §Yenergy§!. Our §Yenergy§! output will §Yincrease§!."
BBW_electricity_stamps_compliance_tt: "Our population will become more §Ycompliant§!, as they won't have to worry if they have enough §Yenergy§!."
BBW_electricity_stamps_population_tt: "We will almost eliminate §Yunnecessary deaths§! thanks to providing §Yenergy§! for the most vulnerable."
BBW_take_whoever_you_can_tt: "We will §Ytake§! anyone, §Rwilling or not§!, from the non-functioning facilities to work in §Yessential sectors of our economy§!."
BBW_take_whoever_you_can_ic_tt: "Our §Yindustrial output§! will §Yincrease§!."
BBW_take_whoever_you_can_lr_tt: "Our §Yresource output§! will §Yincrease§!."
BBW_chop_whatever_you_can_tt: "We will §Ychop down§! any §Rtrees§! in order to provide §Yfuel§! for §Ypower plants§! and resources for §Yindustry§!."
BBW_green_faction_tt: "We will do our best to §Yeliminate§! the §Reco-terrorist factions§! sabotaging our efforts."
