BBW_street_anger: "Gniew ulicy"
BBW_street_anger_desc: "Wygląda na to że nie wszyscy podzielają naszą wizję sprawiedliwości. Choć słuszny, Proces Trzech stał się katalizatorem gniewu ludzi, zdaje się że Ci terroryści są troszkę bardziej popularni pośród zwykłych ludzi niż nam się wydawało. Ulice przemysłowej stolicy Polski są teraz zaśmiecone mierną propagandą środowiskową, a wszechobecne strajki zatrzymały prawie do zera produkcję w naszych fabrykach. Tracimy kontrolę, i jeśli szybko nie znajdziemy sposobu by uspokoić nastroje, fala niezadowolenia może sparaliżować cały aparat państwowy."
BBW_street_anger2: "Gniew wydostaje się z ulic"
BBW_street_anger2_desc: "Nasza bezczynność doprowadziła do eskalacji protestów w pełnoprawne zamieszki. Byliśmy pobłażliwi gdy ich nieokiełznany gniew wylał się na ulice miast, ale zamiast dostrzec naszą wspaniałomyślność, ekofaszyści domagają się nabicia naszych głów na pale. Krzyczą, że jesteśmy mordercami oraz bezdusznymi ignorantami zanieczyszczającymi środowisko, naruszają dobre imię węgla, a przede wszystkim chcą obalić nasz rząd w imię ich utopijnej zielonej fikcji. Jeżeli nie podejmiemy szybko zdecydowanych kroków, buntownicy mogą wkrótce odkryć naszą słabość i ruszyć wprost na nas. Niektórzy paladyni zaczęli nawet rozrysowywać plany ewakuacji i podrabiać fałszywe dowody tożsamości. §RCzas ucieka...§!"
BBW_street_anger3: "Ukierunkowany gniew"
BBW_street_anger3_desc: "Informacja to potęga, a ktokolwiek kontroluje jej przepływ, jest w stanie skłonić ludzi do niekwestionowanej posłuszności. Koniec końców, nie trzeba było wystrzelić ani jednego naboju by zdusić zamieszki. Jedyne co musieliśmy zrobić to stworzyć kilku nowych wrogów, na których został przekierowany gniew mas. W ten sposób wykorzystaliśmy ich fanatyczną nienawiść dla własnych celów. Ci sami ludzie, którzy jeszcze kilka tygodni temu domagali się naszych głów, teraz chwalą nas jako bohaterów którzy odkryli okropną prawdę o zagranicznych spiskach, które doprowadziły do upadku Polskę. Parę odpowiednio spreparowanych kawałków informacji może przekształcić nawet najbardziej radykalnych ekofaszystów we wzorowych paladynów. §RGdyby jednak kiedykolwiek mieli się dowiedzieć o naszych półprawdach, ich gniew i poczucie zdrady będzie dla nas katastrofalne.§!"
BBW_street_anger4: "Ukierunkowany gniew"
BBW_street_anger4_desc: "Informacja to potęga, a ktokolwiek kontroluje jej przepływ, jest w stanie skłonić ludzi do niekwestionowanej posłuszności. Koniec końców, nie trzeba było wystrzelić ani jednego naboju by zdusić zamieszki. Jedyne co musieliśmy zrobić to stworzyć kilku nowych wrogów, na których został przekierowany gniew mas. W ten sposób wykorzystaliśmy ich fanatyczną nienawiść dla własnych celów. Ci sami ludzie, którzy jeszcze kilka tygodni temu domagali się naszych głów, teraz chwalą nas jako bohaterów którzy odkryli okropną prawdę o zagranicznych spiskach, które doprowadziły do upadku Polskę. Parę odpowiednio spreparowanych kawałków informacji może przekształcić nawet najbardziej radykalnych ekofaszystów we wzorowych paladynów. §RGdyby jednak kiedykolwiek mieli się dowiedzieć o naszych półprawdach, ich gniew i poczucie zdrady będzie dla nas katastrofalne.§!"
BBW_street_anger5: "Ukierunkowany gniew"
BBW_street_anger5_desc: "Informacja to potęga, a ktokolwiek kontroluje jej przepływ, jest w stanie skłonić ludzi do niekwestionowanej posłuszności. Koniec końców, nie trzeba było wystrzelić ani jednego naboju by zdusić zamieszki. Jedyne co musieliśmy zrobić to stworzyć kilku nowych wrogów, na których został przekierowany gniew mas. W ten sposób wykorzystaliśmy ich fanatyczną nienawiść dla własnych celów. Ci sami ludzie, którzy jeszcze kilka tygodni temu domagali się naszych głów, teraz chwalą nas jako bohaterów którzy odkryli okropną prawdę o zagranicznych spiskach, które doprowadziły do upadku Polskę. Parę odpowiednio spreparowanych kawałków informacji może przekształcić nawet najbardziej radykalnych ekofaszystów we wzorowych paladynów. §RGdyby jednak kiedykolwiek mieli się dowiedzieć o naszych półprawdach, ich gniew i poczucie zdrady będzie dla nas katastrofalne.§!"

BBW_carbon_fever: "Czarna Gorączka"
BBW_carbon_fever_desc: "Nie istnieje surowiec cenniejszy od węgla. Wszystko można zrobić z jego pomocą, jest to nieodzowny materiał codziennego życia naszych obywateli. A jednak, przez idiotyczną politykę naszych minionych rządów zaślepionych autorytarnym eurokomunizmem, nasza infrastruktura górnicza nie tylko nie rozwijała się - ona się *cofała*. Kawałek po kawałku była zastępowana przez nieefektywne odnawialne źródła energii. Przez to nasza moc przerobowa nie jest na tyle duża żeby zaspokoić wciąż rosnące zapotrzebowanie na tanią energię. Jest tylko jeden sposób by rozwiązać ten problem:\n\nRozszerzenie działalności wydobywczej. Kopcie, dopóki nie wyrwiecie ostatniego kawałka węgla z rąk Matki Ziemi. Dopóki ostatni górnik nie umrze z wyczerpania. §RNie przestawajcie! Po prostu kopcie!§!"
BBW_carbon_fever2: "Czarna Gorączka"
BBW_carbon_fever2_desc: "Nie istnieje surowiec cenniejszy od węgla. Wszystko można zrobić z jego pomocą, jest to nieodzowny materiał codziennego życia naszych obywateli. A jednak, przez idiotyczną politykę naszych minionych rządów zaślepionych autorytarnym eurokomunizmem, nasza infrastruktura górnicza nie tylko nie rozwijała się - ona się *cofała*. Kawałek po kawałku była zastępowana przez nieefektywne odnawialne źródła energii. Przez to nasza moc przerobowa nie jest na tyle duża żeby zaspokoić wciąż rosnące zapotrzebowanie na tanią energię. Jest tylko jeden sposób by rozwiązać ten problem:\n\nRozszerzenie działalności wydobywczej. Kopcie, dopóki nie wyrwiecie ostatniego kawałka węgla z rąk Matki Ziemi. Dopóki ostatni górnik nie umrze z wyczerpania. §RNie przestawajcie! Po prostu kopcie!§!"
BBW_small_business: "Wsparcie małego biznesu"
BBW_small_business_desc: "Pieniądze nie śmierdzą, szczególnie dla tych którzy śmią się zwać \"przedsiębiorcami\". Ich marne biznesy wyrastają jak grzyby po deszczu, tylko po to by za chwilę zwinąć interes gdyż fortuna im nie sprzyja. Większość z nich to niezdarni finansowo głupcy, jednakże cechuje ich duże oddanie naszej sprawie. W związku z tym, możemy część naszych nadwyżek przekierować by troszkę napełnić im kieszenie. Niektórzy pośród Bractwa określają ten czyn jako \"akt socjalizmu\", ale to jest zdecydowanie prorynkowe rozwiązanie, gdyż pieniądz musi być w obiegu, a te konkretne sumy koniec końców znajdą się z powrotem w naszych rękach. Gwarantowane poparcie nowej grupy samozatrudnionych szczęśliwców jest zaledwie dodatkiem."
BBW_carbon_fever3: "Czarna Gorączka"
BBW_carbon_fever3_desc: "Nie istnieje surowiec cenniejszy od węgla. Wszystko można zrobić z jego pomocą, jest to nieodzowny materiał codziennego życia naszych obywateli. A jednak, przez idiotyczną politykę naszych minionych rządów zaślepionych autorytarnym eurokomunizmem, nasza infrastruktura górnicza nie tylko nie rozwijała się - ona się cofała. Kawałek po kawałku była zastępowana przez nieefektywne odnawialne źródła energii. Przez to nasza moc przerobowa nie jest na tyle duża żeby zaspokoić wciąż rosnące zapotrzebowanie na tanią energię. Jest tylko jeden sposób by rozwiązać ten problem:\n\nRozszerzenie działalności wydobywczej. Kopcie, dopóki nie wyrwiecie ostatniego kawałka węgla z rąk Matki Ziemi. Dopóki ostatni górnik nie umrze z wyczerpania. §RNie przestawajcie! Po prostu kopcie!§!"

BBW_futile_resistance: "Bezsensowny opór Zielonego Dialogu"
BBW_futile_resistance_desc: "Absurdalna idea Zielonego Dialogu ukuta przez Hołownię została zdeptana niczym robactwo w gnijącym truchle ongiś potężnej bestii. Chociaż królowa roju została rozsmarowana na chodniku, jej larwy nadal pozostają w padlinie. Wytępienie ich jeden po drugim i zniszczenie ich marzeń o pasożytowaniu na naszej ojczyźnie będzie jedynie kolejnym rutynowym zadaniem, lecz dla nas jako obrońców zdrowego rozsądku, jest to obowiązek który musimy całym sercem wypełnić."  
BBW_resource_extraction_focus: "Inwestycja wydobywcza"
BBW_resource_extraction_focus_desc: "Potrzeba więcej węgla!"
BBW_infrastructure_focus: "Inwestycja infrastrukturalna"
BBW_infrastructure_focus_desc: "Potrzebujemy lepszej infrastruktury!"
BBW_industrial_focus: "Inwestycja w cywilny przemysł"
BBW_industrial_focus_desc: "Potrzebujemy więcej fabryk cywilnych!"
BBW_military_factories_focus: "Inwestycja w przemysł zbrojeniowy"
BBW_military_factories_focus_desc: "Potrzebujemy więcej zakładów zbrojeniowych!"
BBW_one_truth: "Jedna prawda"
BBW_one_truth_desc: "Obywatele Bełchatowa idąc do pracy i mijając swój osiedlowy kiosk, nie mają zbyt wielkiego wyboru jeśli chodzi o różnorodność prasy. Dla tych którzy usilnie starają się pozostać na czasie z informacjami, jedna jedyna publikacja króluje na stoiskach z gazetami - \"Do Rzeczy\". Klejnot w koronie propagandowej machiny Bractwa, drukowany w ilościach tak hurtowych by starczyło dla każdego nieszczęśnika w mieście. Na osobnej półce widoczne są stosy makulatury - niesprzedanych egzemplarzy z poprzednich dni, które pozostają dostępne dla tych którzy zapomnieli je przeczytać. Jakość artykułów jest dość niska, są one przepakowane ideologią a autorzy tychże już dawno zapomnieli co to znaczy dziennikarska rzetelność. Więc dlaczego dzień w dzień, setki tysięcy mieszkańców wydają swoje ciężko zarobione pieniądze na coś, co ledwo mogą przeczytać z poważną miną? Powód jest banalnie prosty. Gdy paladyn przyjdzie na inspekcję do twojego zakładu pracy by ocenić twoją lojalność względem reżimu zada Ci kilka pytań o twoje poglądy na ostatnie wydarzenia. Ostatnie co chcesz zrobić w tym momencie to przypadkowo rozgłaszać wiechowską propagandę."
BBW_even_angry_idea: "Nawet i gniewni"
BBW_even_angry_idea_desc: "Nasze kadry administracyjne i wojskowe są rozproszone do granic możliwości. Desperacko potrzebujemy większej ilości personelu, ale by to osiągnąć musimy przemóc się do rekrutowania ludzi z co bardziej rewizjonistycznych frakcji w Bractwie. Większość lojalistów, pomimo tego że na każdym kroku staraliśmy się ich promować, nie są odpowiednim materiałem na wyższe sfery Akademii Zdrowego Rozsądku, jako że ich procesy myślowe można bardziej określić jako *chłopski rozum*, niż *zdrowy rozsądek*.\n\nWzmacniając rewizjonistyczne siły ryzykujemy niestabilnością, ale lepiej mieć podwładnych którzy narzekają, niż takich złożonych w całości z lojalnych potakiwaczy i pachołków."
BBW_most_obedient_idea: "Najbardziej posłuszni"
BBW_most_obedient_idea_desc: "Sytuacja krajowa stale się pogarsza i jeśli nie zaczniemy działać, to skończymy w głębokim kryzysie. Aparat rządowy jest przeciążony, rekrutujemy już nawet takich rekrutów, którzy minimalnie ideologicznie się z nami zgadzają. Nie pomagają nam również podupadające morale i wiara w słuszność naszej sprawy, ale nie pójdziemy na żaden kompromis, nie wpuścimy wrogich elementów w nasze szeregi. To doprowadziłoby jedynie do katastrofy. Nawet jeśli doprowadzi to nieuchronnie do przerzedzenia puli potencjalnych rekrutów, pozostaniemy ideologicznie nieskazitelni. Na szczęście Akademia Zdrowego Rozsądku stoi na straży naszych idei, kształtując młodych patriotów, wolnych od rewizjonistycznych wizji, lojalnych wobec swojego narodu i Bractwa."


BBW_blackout: "Blackout"
BBW_blackout2: "Blackout"
BBW_blackout3: "Blackout"
BBW_blackout4: "Blackout"
BBW_blackout5: "Blackout"
BBW_blackout6: "Blackout"

BBW_blackout_category: "Blackout"

BBW_blackout_desc: "Ciemność ogarnęła całą naszą ziemię. Z naszego postępu, z obietnic natychmiastowego dobrobytu nie pozostało nic. Już było dobrze, nasza maszyna ruszyła z pełną prędkością, i nagle wróciliśmy z powrotem do punktu wyjścia, albo i jeszcze dalej. Och, jak beztrosko wychwalaliśmy naszą niezależność energetyczną. Teraz jedynie płomienie świeczek i ognisk chronią nas przed lodowatym uściskiem nocy. Ale nasi bracia przetrwają, niezależnie od trudności. Pewnego dnia prąd MUSI wrócić, nawet jeśli po drodze niektórzy z nas zamarzną.\n\nTylko...jak długo będziemy czekać? I ile poświęceń nas to będzie kosztować? Ludzie chcą odpowiedzi, a tym razem nie wystarczy stworzyć kilku wyimaginowanych wrogów. Wszystko zaczyna się nam walić na głowę i powoli czuć zimny oddech zawiedzionego ludu na naszych plecach. Możemy tylko się modlić żeby się nie zorientowali że wszechobecna ciemność stanowi idealne tło dla wywołania powstania."
