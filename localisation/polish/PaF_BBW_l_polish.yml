BBW_crypto_investments: "Inwestycje w kryptowaluty"
BBW_crypto_investments_desc: "In our quest to stabilize and grow our economy, we have decided to invest in cryptocurrencies. These digital assets have shown significant potential for high returns, and by allocating a portion of our resources into this emerging market, we aim to diversify our economic portfolio and secure additional funding for our industrial and social projects."
BBW_coalcoin_influx: "CoalCoin w obiegu"
BBW_coalcoin_influx_desc: "The value of CoalCoin has been highly volatile recently, although right now it seems to be on an upward trend. This fluctuation presents both opportunities and risks for our economy. Inflation? What inflation? As long as we play our cards right, we can ride this wave to greater prosperity. Don't you worry."
BBW_coalcoin_outflux: "CoalCoin w obiegu"
BBW_coalcoin_outflux_desc: "Well, they warned us about volatility, didn't they? The value of CoalCoin has taken a significant hit recently, which could have serious implications for our economy. But fear not, it's just momentary turbulence. Right? RIGHT?"
