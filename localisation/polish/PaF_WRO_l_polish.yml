unification.46.t: "[GetNewspaper]Rzeczpospolita Dolnośląska jednoczy region Wrocławski!"
unification.46.desc: "Dzisiejsze wiadomości donoszą, że Wspólnota Dolnego Śląska zjednoczyła cały region okołowrocławski. Niestabilna republika, złożona z Polaków o najróżniejszych poglądach politycznych, lecz wierzących, że tylko wspólnymi siłami uda się odbudować kraj, wygrała pierwszą wojnę na drodze do pełnego zjednoczenia.\n\nPrezydent Jacek Sutryk zdołał utrzymać się u władzy pomimo wewnętrznych zawirowań i zewnętrznych zagrożeń. Z czasem jego autorytet umacniał się, dając obywatelom Wspólnoty poczucie bezpieczeństwa. Gdy poparcie dla radykałów po obu stronach osłabło, wojska dowodzone z Wrocławia zabezpieczyły wszystkie większe miasta i granice Dolnego Śląska. Prezydent i jego rząd obiecali wprowadzenie demokratycznych rządów w kraju oraz lokalnej administracji wybieranej przez mieszkańców miast i gmin. Jedynie zdrajcy wolnej i niepodległej Polski poniosą konsekwencje."
unification.46.a: "A co w tym nowego?"

super.46.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.46.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.46.a: "Wreszcie zjednoczeni."

