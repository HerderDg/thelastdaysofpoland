unification.28.t: "[GetNewspaper]Związek Górników z Rudy Śląskiej jednoczy Górny Śląsk!"
unification.28.desc: "Święta Barbara pobłogosławiła swą trzodę z niebios, pozwalając górnikom samodzielnie rozstrzygnąć o losie Śląska. We wszystkich miastach Metropolii trwają gorączkowe przygotowania do podziękowania świętej patronce za jej wsparcie. W tym celu zorganizowany zostanie największy pochód, jaki kiedykolwiek widział świat górniczy, połączony z uroczystym przemarszem z Gliwic do Katowic. Wydarzeniu przewodzić będzie wielka orkiestra, której dźwięki poniosą się po całym Śląsku. Na jej czele stanie Hubert Dwornik, znany rodakom jako Bercik, autor przebiegłego planu, który zapewnił zwycięstwo mieszkańcom Rudy Śląskiej. A może wcale nie miał żadnego planu? Tak czy inaczej, Szef Hanysów jest teraz królem górników całego Górnego Śląska i z pewnością ma apetyt na cały region. Pozostaje jednak pytanie, jak długo państwo rządzone przez związki górnicze zdoła przetrwać, zanim nieuchronnie pogrąży się w wewnętrznych sporach."
unification.28.a: "Chodźmy do Alojza na piwko!"