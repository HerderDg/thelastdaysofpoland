###   News Events   ###


unification.62.t: "[GetNewspaper]Generalna Prokuratura zajmuje północną Małopolskę!"
unification.62.desc: "Ogromna liczba antyziobrystowskich powstań nie wskazywała na to, by miał on jakiekolwiek szanse utrzymać się w regionie świętokrzyskim. W związku z tym Prokurator Generalny zwrócił swój wzrok ku Krakowowi, zdobywając zmęczoną wojną metropolię przy pomocy lojalnych resztek swoich dawnych sił. Podczas kontrolowanej konferencji prasowej na Wawelu Zbigniew Ziobro oświadczył, że jego siły kontrolują większość województwa, z wyjątkiem Tatr. Twierdzenie to zostało dodatkowo podkreślone przez kolejną falę uchodźców uciekających przed represjami, które nastąpiły po wkroczeniu wojsk Prokuratury.\n\nWyciągnąwszy wnioski z poprzednich doświadczeń, Ziobro najprawdopodobniej nie zamierza łagodzić swojego stylu rządzenia. Wielu określa odradzający się reżim mianem \"dystopijnego\" i \"orwellowskiego\", choć niektórzy zauważają, że wciąż może być on jedną z bardziej stabilnych opcji w polskiej Anarchii. Jedno jest na razie pewne: Ziobro jest poważnym graczem i lepiej nie wchodzić mu w drogę."
unification.62.a: "Są tacy - to nie żart."

ziobro.1.t: "[GetNewspaper]Ziobro ponownie jednoczy województwo świętokrzyskie"
ziobro.1.desc: "Nad Górami Świętokrzyskimi zbierają się ciemne chmury. Władze Prokuratury w Kielcach ogłosiły, że ponownie sprawują pełną kontrolę nad całym województwem. Po ciężkich walkach siły Ziobry wkroczyły do Starachowic i Sandomierza, pokonując milicje Kombinatu i Republiki, a tym samym kładąc kres wszelkiemu tak zwanemu liberalnemu oporowi.\n\nW miarę jak na odzyskanych terenach przeprowadzane są czystki, napływają pogłoski, że przerzucenie sił na front północny, a także ciężkie straty poniesione podczas walk, wywołały kolejną falę niepokojów - tym razem zarówno wśród ludności, jak i sił zbrojnych Prokuratury. Oczekuje się, że oba zbuntowane miasta posłużą za przykład dla wszystkich, którzy nie zamierzają podporządkować się woli Ziobry."
ziobro.1.a: "Myślisz może, że więcej coś znaczysz.."

ziobro.2.t: "[GetNewspaper]Ziobro nie zdołał podporządkować sobie północnych powiatów"
ziobro.2.desc: "Z Kielc napływają krzepiące wieści. Miasto pogrąża się w chaosie po tym, jak Starachowice i Sandomierz z powodzeniem przeciwstawiły się władzy Prokuratora. Po tym jak siły Ziobry zostały rozbite, jego kontrola nad całym regionem dramatycznie osłabła. Niepokoje zdają się wymykać spod kontroli, a coraz częściej pojawiają się pogłoski o dowódcach oddziałów paramilitarnych odmawiających wykonywania kolejnych rozkazów.\n\nPowszechnie uważa się, że Ziobro ma niewielką, jeśli w ogóle jakąkolwiek, kontrolę nad sytuacją i zrobi wszystko, byle tylko uratować własny tyłek."
ziobro.2.a: "Wskazówka cofa się."

ziobro.3.t: "[GetNewspaper]Powstanie w Górach Świętokrzyskich"
ziobro.3.desc: "Pomimo wszelkich wysiłków Ziobry niepokoje na jego ziemiach okazały się zbyt rozległe, by można było je powstrzymać. Nacjonalistyczne bojówki paramilitarne odłączyły się od jego sił i otworzyły ogień do wysłanych na negocjacje oddziałów. Komuniści i socjaliści przejęli kontrolę nad Starachowicami, a na południu pojawiają się pogłoski o formowaniu się milicji libertariańskich. W Sandomierzu ludowe powstanie wybrało księdza na przywódcę i obrońcę miasta. A z kolei w południowo-zachodniej części regionu pojawiło się coś, czego - cóż - nawet my nie życzylibyśmy Ziobrze spotkać na swojej drodze.\n\nPomimo dzielących ich radykalnych różnic rebelianci nie atakują się nawzajem, skupiając się przede wszystkim na walce ze wspólnym wrogiem - przynajmniej na razie. Ziobro był ostatnio widziany, jak uciekał do Małopolski, by ustanowić tam bezpieczną bazę operacyjną. Jeśli zadziała szybko, być może zdoła zdusić rebelię, zanim ta całkowicie zatopi jego włości."
ziobro.3.a: "Oskarżyciel został oskarżony."

ziobro.18.t: "[GetNewspaper]W Świętokrzyskim bez zmian"
ziobro.18.desc: "Region Świętokrzyski stał się dla sił Ziobry prawdziwym bagnem, a Prokurator okazał się niezdolny do stłumienia oporu Zakładów Starachowickich i Milicji Sandomierskiej. Miesiące walk przyniosły niewiele, jeśli w ogóle cokolwiek, ponieważ obie strony zdają się nie zamierzać ustąpić nawet o krok.\n\nWraz z rozciągnięciem sił Ziobry do granic możliwości zaczynają pojawiać się pogłoski o rosnącym niezadowoleniu w szeregach armii Prokuratury. Mówi się, że niektórzy dowódcy odmawiają wykonywania rozkazów, podczas gdy inni mają rzekomo utrzymywać kontakty z rebeliantami. Jedno staje się jasne - władza Ziobry nad regionem słabnie, a jeśli nie podejmie szybkich działań, może wkrótce utracić kontrolę nad całym województwem świętokrzyskim."
ziobro.18.a: "Ostatecznie wyszło na zero."


