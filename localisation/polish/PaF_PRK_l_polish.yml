###   Characters   ###


POLITICS_ZBIGNIEW_ZIOBRO_DESC: "Zbigniew Ziobro mógłby być może stwierdzić, że jest zarówno Prawem, jak i Sprawiedliwością. Choć obrał drogę kariery prawniczej, jego żądza władzy predysponowała go do angażowania się w politykę na coraz większą skalę. Ambicja i przebiegłość uczyniły z niego jedną z czołowych postaci obozu rządzącego - kapitał polityczny, z którego skwapliwie czerpał w samym środku najcięższego kryzysu. \n\nGdy na południu Polski wybuchły bunty, Ziobrę wysłano, by je stłumił. Być może był to fortel mający odsunąć go od stolicy i pozbyć się go z planszy, zwłaszcza że jego siły niespecjalnie nadawały się do walki. Niezależnie od tego - Ziobro był zbyt sprytny, by pozwolić wyrzucić się z gry, w którą grał przez ostatnie 20 lat. Zarządzał swoją armią na tyle ostrożnie, że zdołał zabezpieczyć dla siebie znaczną część Polski. Rozdawszy część ziem w charakterze apanaży swoim najwierniejszym wasalom, zabrał się za wykorzenianie oporu we własnej domenie. Jak dotąd nie idzie mu to najlepiej. \n\nChoć nikt nie odmówiłby mu talentów, wydaje się, że ludzie po prostu nie chcą okazać Ziobrze należnego szacunku, a ten problem zdaje się towarzyszyć mu co najmniej od czasu, gdy Leszek Miller słynnie porównał go do zera. Choć jest poważnym kandydatem do ponownego zjednoczenia kraju i posiada pewien stopień legitymizacji, tylko najbardziej zagorzali legaliści byliby w stanie poprzeć go z prawdziwego przekonania. Na razie roszczenie Ziobry do stworzenia IV Rzeczypospolitej opiera się wyłącznie na sile i całkiem możliwe, że przedawkowanie tego środka położy mu kres. Czas pokaże, czy Ziobro zdoła utrzymać się na swoim stanowisku i udowodni, może, że więcej coś znaczy, bo ma rozum, dwie ręce i chęć."
