unification.201.t: "[GetNewspaper]Humanitaryzm czy oportunizm?"
unification.201.desc: "Ukraińska Misja Humanitarna, która początkowo była jedynie akcją pomocy w chaotycznych następstwach Upadku, przekształciła się w niekwestionowaną władzę nad województwem podkarpackim. To, co zaczęło się od dostarczania żywności, leków i schronienia przesiedleńcom, rozwinęło się w pełnoprawną administrację, w której byli pracownicy organizacji pomocowych objęli stanowiska urzędników, oficerów i gubernatorów. Wielu chwali ich skuteczność w przywracaniu porządku i utrzymywaniu szlaków zaopatrzeniowych, inni jednak szepczą o ukraińskiej okupacji pod przykrywką humanitaryzmu. Kierownictwo Misji utrzymuje, że jedynie wypełnia pustkę po upadłych polskich instytucjach, lecz pozostaje pytanie: czy odda władzę, jeśli Polska kiedykolwiek się zjednoczy, czy też jest to początek czegoś znacznie trwalszego? Na razie Podkarpacie pozostaje osobliwym wyjątkiem - krainą, którą nie rządzą już generałowie ani watażkowie, lecz ludzie, którzy niegdyś nosili worki ziemniaków i pudła z lekami. Polacy naprawdę nie przepadają jednak za obcą władzą."
unification.201.a: "Nawet jeśli niesie ona pomoc."

POLITICS_POROSHENKO_DESC: "Magnat telewizyjny, którego kampanię polityczną wykoleił pewien portal medialny; Czekoladowy Król, który jest zarazem cukrzykiem; skorumpowany populista uwikłany w liczne skandale, a mimo to cieszący się sporą popularnością wśród Ukraińców. Innymi słowy - Poroszenko. \n\nPoroszenko po raz pierwszy doświadczył wojny podczas swojej prezydentury. Reorganizacja Sił Zbrojnych Ukrainy i rozpoczęcie integracji Ukrainy z Unią Europejską na krótko poprawiły jego notowania wśród obywateli, ale nawet to nie uchroniło go przed koniecznością ucieczki z własnego kraju po przegranych wyborach w 2019 roku. Przegrał wówczas z człowiekiem, który grał w telewizji na pianinie swoim penisem. \n\nA jednak wrócił, by walczyć z Rosjanami. \n\nByć może nie powinien był tego robić, bo to właśnie jego osobisty udział w walkach z rosyjską inwazją podsunął pomysł, by postawić go na czele Ukraińskiej Misji Humanitarnej w Polsce. Początkowo Poroszenko uważał to za nagrodę za służbę Ukrainie, lecz teraz, gdy połowa jego kontyngentu zbuntowała się przeciwko niemu i ukraińskiemu rządowi po tym, jak brauniści wbili Ukraińskiej Misji nóż w plecy, a nieformalni przywódcy służących w UHM weteranów Donbasu - złożeni akurat z radykałów Azowa - stracili do niego zaufanie, cała sprawa zaczyna przypominać intrygę Zełenskiego, mającą na celu ostateczne pozbycie się rywala. Poroszenko nadal musi jednak wykonywać jego rozkazy, ponieważ jego siły składają się z żołnierzy ukraińskiej armii. Na razie, zgodnie z rozkazami rządu, pozostałe mu oddziały wycofały się do Medyki i zabarykadowały, nie wiedząc, co myśleć o konieczności bronienia się przed ludźmi, którzy tak zaciekle walczyli za jego kraj. \n\nZ jednej strony są to towarzysze broni, z którymi stoczyli niezliczone bitwy przeciwko rosyjskim najeźdźcom. Z drugiej - buntownicy, którzy wypowiedzieli posłuszeństwo ojczyźnie i postanowili zemścić się na Polakach za działania Brauna, mimo że ci pomagali im podczas wojny z Rosją. A Zełenski uznał, że bezpieczniej będzie pozostawić Polskę własnemu losowi... \n\n...więc być może sam Poroszenko będzie musiał zbuntować się, by ich ocalić."
