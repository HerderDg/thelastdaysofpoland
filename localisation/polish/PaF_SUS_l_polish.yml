 ##Events##
 


unification.34.t: "[GetNewspaper]Leszno jednoczy południową Wielkopolskę"
unification.34.desc: "Według najnowszych doniesień południowa część Wielkopolski znalazła się pod kontrolą wpływowego polityka PiS, Marka Suskiego, i jego Specjalnej Komisji Śledczej. Komisja, utworzona w mrocznych podziemiach Eurokomisariatów i odpowiedzialna za odkrycie prawdy o upadku kraju oraz wskazanie winnych, dostarczyła wiele pytań, lecz niewiele odpowiedzi. Mimo to zubożałe masy kurczowo trzymały się nadziei, że pewnego dnia komisja wymierzy sprawiedliwość milionom ludzi, których życie zniszczył Upadek. Dzięki ich pełnemu poparciu państewko zdołało odeprzeć liczne ataki potężniejszych watażków, a jednocześnie przeprowadzić ofensywę, która doprowadziła do zjednoczenia regionu. Pomimo rosnącej pozycji Suski utrzymuje, że jego najważniejszym celem pozostaje odkrycie prawdziwej przyczyny rozpadu Polski, a także odbudowa województwa - prowadzona oczywiście przy możliwie największym udziale państwa."
unification.34.a: "Miejmy nadzieję, że to śledztwo pójdzie lepiej niż poprzednie"

