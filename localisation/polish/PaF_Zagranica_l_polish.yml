##Events##
 fluff_france.1.t: "Wybory prezydenckie we Francji 2027"
 fluff_france.1.desc: "le guwno"
 fluff_france.1.a: "Marine Le Pen"
 fluff_france.1.b: "Jean-Luc Mélenchon"
 fluff_france.1.c: "Eric Zemmour"

 fluff_france_news.1.t: "[GetNewspaper]Marine Le Pen wygrywa wybory prezydenckie we Francji"
 fluff_france_news.1.desc: "To już jest jasne - polityczne trzęsienie ziemii we Francji. Tradycyjni kandydaci zostali zmiażdżeni przez charyzmatycznego lidera opozycji, która do tej pory nie miała zbyt wielu szans na arenie krajowej. Choć ostateczne wyniki są wciąż zliczane, głównie w departamentach zamorskich, czołowi komentatorzy są zgodni, że Marine Le Pen obejmie urząd prezydenta po prawdopodobnie najbardziej gorącej i dzielącej kampanii w historii kraju. Przyćmione przez kontrowersyjne zaangażowanie Francji w tzw. \"Polską Interwencję\", wybory zostały zdominowane przez wyraźny wzrost populistycznej retoryki wymierzonej przeciwko europejskim partnerom. Na arenie międzynarodowej zwycięstwo Le Pen niemal na pewno oznacza istotne przetasowanie dyplomatyczne, z wyraźnymi sygnałami ostrzegawczymi dla Brukseli i Berlina, że europejski sen może wkrótce znaleźć się w poważnym zagrożeniu."
 fluff_france_news.1.a: "Pojedyncza wysoka fala, czy może znak nadchodzącego sztormu?"

