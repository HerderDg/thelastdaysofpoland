 fluff_france.2.a: "Vive la France?"

 fluff_france_news.4.t: "[GetNewspaper]Europejska jedność przestała istnieć"
 fluff_france_news.4.desc: "Dzisiaj wszelka nadzieja na to, że Niemcy i Francja będą w stanie się porozumieć rozpierzchła się na cztery strony świata. Nowo wybrany lider Francji potępił stanowczo swojego wschodniego sąsiada, cytując że 'w swojej obecnej formie Unia przestała być organizacją wolnych narodów a stała się elementem imperializmu Berlina.'. Zaraz po tej przemowie, Francuskie wojska opuściły swoje garnizony w okupowanej Polsce i skierowały się w stronę swojej ojczyzny. Stanowi to potężny cios dla całej kampanii stabilizacyjnej i wiele strategicznych pozycji obecnie znajduje się bez nadzoru. Rozpoczyna się nowy etap w historii Europy - wznowione nieprzyjacielskie stosunki i plotki o mobilizacji całej Francuskiej armii na pograniczu Alzackim stawiają przyszłość kontynentu pod znakiem zapytania. Czy jest to zaledwie pokaz siły mający na celu odstraszyć Niemców czy coś więcej, ciężko określić. Ale z jasnym stanowiskiem Paryża, niektóre państwa niezadowolone z niemieckiej hegemonii coraz chętniej kierują swój wzrok na Francję by poprowadziła ich przez ten konflikt."
 fluff_france_news.4.a: "Może nawet Polsce uda się zyskać na tym chaosie."

 fluff_france_news.5.t: "[GetNewspaper]Niemieckie wojska wycofują się z Polski"
 fluff_france_news.5.desc: "W obliczu niedawnych problemów wewnątrz Unii, Niemieckie dowództwo Bundeswehry wydało generalny rozkaz wszystkim jednostkom na terytorium Polski powrotu do swoich oryginalnych baz, po prawie dwóch latach bezustannej okupacji. Niektóre źródła twierdzą jednak, że jest to jedynie tymczasowe przegrupowanie, a liderzy sprzymierzonych Eurokomisariatów są zdolni do zarządzania tymi terytoriami we własnym zakresie bez pomocy Berlina. Wielu ekspertów widzi jednak to jako desperacki ruch podjęty w reakcji na gwałtownie zmieniającą się sytuację geopolityczną w Europie. Pomimo gwarancji, sytuacja w upadłej Rzeczpospolitej pozostaje daleko od stabilnej, a tymczasowe i pełne chaosu działania lokalnych rządów okupacyjnych sprawiają wrażenie, że cała ta dyrektywa nie została im w ogóle zakomunikowana przed faktem."
 fluff_france_news.5.a: "Czy pozostawiona samą sobie, Polska znowu popadnie w chaos?"

