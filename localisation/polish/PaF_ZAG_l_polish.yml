unification.69.t: "[GetNewspaper]11. Dywizja Kawalerii Pancernej jednoczy Legnickie!"
unification.69.desc: "Ci, którzy niegdyś zapoczątkowali upadek Eurokomisariatów, wreszcie pokonali ich pozostałości - przynajmniej w granicach Legnickiego. 11. Dywizja Kawalerii Pancernej, pierwsza, która odważyła się zbuntować przeciwko reżimowi Tuska, zdołała wykorzystać impet początkowego natarcia i skonsolidować region pomimo zaciekłego oporu sił sprzymierzonych z Niemcami oraz oportunistów, którzy wyrwali się spod kontroli po upadku Schlesien. Zwycięski generał jednostki, Piotr Trytek, zamierza jednak wykreować się na wyzwoliciela, by zjednoczyć ludność wokół swoich rządów wojskowych, lecz na każdym kroku ciągnie się za nim piętno zdrajcy. Zbrodni przeciwko narodowi nie zapomina się łatwo, a dla Trytka jego przeprawa przez Odrę była przekroczeniem Rubikonu. Zdrajca zarówno Polaków, jak i Niemców może jedynie iść naprzód, licząc, że pewnego dnia zdoła odbudować kraj, który sam pomógł roztrzaskać. Być może wtedy rodacy mu wybaczą - przynajmniej niektórzy."
unification.69.a: "Do domu wrócimy, w piecu napalimy."

super.69.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.69.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.69.a: "Wreszcie zjednoczeni."