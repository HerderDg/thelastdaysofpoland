unification.122.t: "[GetNewspaper]Gwardia Ludowa jednoczy województwo Świętokrzyskie!"
unification.122.desc: "Upadek Polski był wydarzeniem, które zradykalizowało wielu mieszkańców kraju, przekształcając dotąd pozbawione szans ruchy w siły zdolne rzucić wyzwanie chylącemu się ku upadkowi, skompromitowanemu głównemu nurtowi polityki. Podczas gdy większość zwróciła się ku nowym ideom, takim jak postpolonizm, lub dała się porwać nacjonalistycznemu zapałowi, zniszczenia, jakie prawicowy rząd PiS sprowadził na kraj, umożliwiły również powstanie licznych lewicowych bojówek. Ku zaskoczeniu wszystkich jedna z nich wypełniła próżnię władzy powstałą po upadku reżimu Ziobry. Nad całym województwem świętokrzyskim powiewają teraz czerwone sztandary, gdy Gwardia Ludowa umacnia swój uścisk na regionie. Państwo, hołdujące komunistycznej myśli w wydaniu sowieckim i dążące do rehabilitacji wizerunków przywódców dawnej Polskiej Rzeczypospolitej Ludowej, pozostaje w konflikcie z przekonaniami zwykłych ludzi. Lecz któż odważy się narzekać, gdy lufa karabinu jest gotowa powalić każdego, kto ośmieli się sprzeciwić?"
unification.122.a: "Za Bieruta! Za Stalina! Za czerwoną Polskę!"

super.122.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.122.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.122.a: "Wreszcie zjednoczeni."
