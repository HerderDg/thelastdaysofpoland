unification.107.t: "[GetNewspaper]Republika Radomia jednoczy Radomskie!"
unification.107.desc: "Szokujące wieści napływają z południowego Mazowsza, gdzie po zamachu stanu przeprowadzonym przez najemniczą grupę handlarzy bronią cały region znalazł się pod władzą bandytów. Ludność państwa, przyzwyczajona do spokojnego życia na terenie, który niegdyś stanowił enklawę stabilności kraju i jedyny obszar zdominowany przez umiarkowane administracje cywilne, została teraz skazana na życie w strachu pod rządami Dadaka. Nowi panowie województwa nawet nie udają, że zależy im na przyszłości Polski. W rzeczywistości chcieliby przeciągać obecny chaos tak długo, jak tylko się da, sprzedając broń wszystkim stronom, dopóki ich kieszenie nie zaczną pękać w szwach. Od chwili przejęcia władzy klika przestawiła produkcję z dóbr cywilnych na potrzeby wojska, zmuszając zwykłych obywateli do przeżycia z tego, co jeszcze zostało. I choć bandyci brutalnie tłumią wszelkie głosy sprzeciwu, sytuacja szybko zbliża się do punktu wrzenia, a regionowi grozi klęska głodu."
unification.107.a: "Kupcy śmierci otwierają swoje targowiska."

super.107.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.107.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.107.a: "Wreszcie zjednoczeni."