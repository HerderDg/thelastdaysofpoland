unification.128.t: "[GetNewspaper]Księstwo Rzeszowskie jednoczy Podkarpacie!"
unification.128.desc: "Gdy ukraińska inwazja zepchnęła siły Grzegorza Brauna na ostatnie pozycje obronne w Rzeszowie, niemal wszyscy spodziewali się, że rządy Szalonego Regenta dobiegną nagłego i przedwczesnego końca. A jednak dzięki zaciekłej obronie oraz szczęśliwie zbiegającemu się w czasie powstaniu, które zakłóciło zdolność najeźdźców do utrzymania presji, reżim Brauna przetrwał, a jego niezłomność zainspirowała wielu do chwycenia za broń i doprowadzenia do całkowitego podporządkowania Podkarpacia. Wydzierając zwycięstwo z paszczy klęski, Księstwo Rzeszowskie wychodzi z tej próby silniejsze niż kiedykolwiek i gotowe pomścić tych, którzy omal nie doprowadzili go do upadku. W całym regionie ukraińska ludność drży ze strachu, w pośpiechu próbując uciec za wschodnią granicę. Choć to właśnie na niej skupia się gniew Regenta, nie jest jedyną grupą poddaną brutalnym represjom. Narastająca paranoja Brauna sprawiła bowiem, że niemal za każdym rogiem dostrzega zagrożenie dla swoich rządów. Za bezpiecznych można uznać jedynie tych, którym uda się uciec z regionu."
unification.128.a: "Ich krew oczyści polski naród."

super.128.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.128.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.128.a: "Wreszcie zjednoczeni."

super_a.128.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_a.128.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super_a.128.a: "Wreszcie zjednoczeni."

rzeszow_siege.2.t: "[GetNewspaper]Oblężenie Rzeszowa"
rzeszow_siege.2.desc: "Od miesiąca docierają do nas opowieści o partyzanckiej kampanii Brauna przeciwko ukraińskim humanitarystom, a następnie o rozpadzie Ukraińskiej Misji Humanitarnej. Jednak sądząc po ostatnich pogłoskach, sytuacja Brauna, mówiąc delikatnie, całkowicie wymknęła się spod kontroli, a jego niewielkie księstwo zostało oblężone przez odrodzoną UPA oraz polsko-ukraińskie \"kozackie\" wojsko.\nUchodźcy i posłańcy przybywający z Rzeszowa opowiadają o niezwykłej organizacji mieszkańców miasta, połączonej z zażenowaniem, jakie wywołują wśród nich działania Brauna. Jednocześnie morale jego lojalistów osiągnęło niespotykany dotąd poziom - ci twierdzą teraz, że \"od początku mieli rację\". Obie ukraińskie armie zdają się zdeterminowane, by dokonać zemsty na braunistach. Nie wiadomo jednak, czy cywile wyjdą z tego konfliktu bez szwanku, jeśli jako pierwsi dotrą do miasta przedstawiciele którejś z bardziej radykalnych stron. Niech Bóg ma w opiece zwykłych mieszkańców Podkarpacia, bo to oni są prawdziwymi przegranymi tego konfliktu."
rzeszow_siege.2.a: "\"...i tylko sny nasze nie zostały upokorzone\""

