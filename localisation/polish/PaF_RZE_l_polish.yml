RZE_ukrainian_siege_desc: "Gdy Ukraińcy dokonali niemożliwego i odparli rosyjską inwazję, Braun - zagorzały rusofil utrzymujący kontakty z Moskwą - otwarcie potępił rząd Zełeńskiego, widząc w nim przeszkodę na drodze do realizacji idei Russkiego Miru. Toteż gdy Ukraińcy wkroczyli do województwa podkarpackiego, by ustanowić Ukraińską Misję Humanitarną, rozpoczął przeciwko nim wojnę partyzancką, zamierzając wypchnąć ich z powrotem za granicę.\n\nNo i kurwa, doigrał się. Rzeszów jest teraz całkowicie odcięty od świata: od wschodu przez rozwścieczonych byłych ukraińskich żołnierzy, którzy przerodzili się w odgrywających UPA larperów i chcą pomścić sposób, w jaki Polacy przyjęli ich ofertę pomocy a z drugiej strony przez połączoną koalicję humanitarystów i miejscowych, którzy zaczęli przedstawiać się jako kozackie wojsko. Jeśli nie znajdzie sposobu na przełamanie ukraińskiej blokady, jego święte księstwo stanie się tym z czym sam walczył - płonącą stertą gruzu, po której przejadą czołgi T-80 i bojowe wozy piechoty."
