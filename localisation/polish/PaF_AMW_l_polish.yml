l_polish:
unification.177.t: "[GetNewspaper]Trybunał Trzeźwości jednoczy województwo Łódzkie!"
unification.177.desc: "Uderzenia młotka uciszają kłócących się watażków Łódzkiego. Emerytowana sędzia o imponującym życiorysie i popularna osobowość telewizyjna - Anna Maria Wesołowska - zdobyła wystarczające poparcie, by rozszerzyć swoje kritokratyczne państewko na całe województwo. Przed Upadkiem jurystka angażowała się w działalność przeciw legalizacji, a nawet dekryminalizacji narkotyków, zwłaszcza marihuany. Jak wyznała, smutny stan polskiego społeczeństwa po 2025 roku, a zwłaszcza demoralizacja wśród dzieci, skłonił ją do przyjęcia jeszcze surowszego kursu, prowadząc krucjatę trzeźwości przeciw każdemu narkotykowi, w tym alkoholowi i nikotynie. Choć wielu spodziewa się, że przedsięwzięcie się nie powiedzie - biorąc pod uwagę, jak głęboko alkohol jest zakorzeniony w polskiej kulturze - zwolennicy Wesołowskiej twierdzą, że jej doświadczenie w walce z przestępczością zorganizowaną pomoże jej skutecznie powstrzymać większość producentów, przemytników i handlarzy, zaś jej wiedza z zakresu prewencji i edukacji młodzieży wpoić wartości abstynencji w polskim społeczeństwie."
unification.177.a: "Czy piwo to w ogóle alkohol?"

##Ideas##
AMW_dry_justice: "Trzeźwy osąd"
AMW_dry_justice_desc: "Anna Maria Wesołowska jest powszechnie szanowaną ekspertką w sprawach przestępczości zorganizowanej. Jest współautorką przedupadkowej ustawy o świadku koronnym. Zasiadała w składzie orzekającym podczas procesów gangów Ośmiornicy i Popeliny. W ostatnich latach przed wojną poświęciła się walce z rosnącym problemem zażywania narkotyków przez młodzież. Jej doświadczenie pozwoliło jej zdławić chaos i nielegalną działalność na kontrolowanych obecnie przez nią terenach, tworząc stabilną i bezpieczną społeczność oraz aparat państwowy zdolny do podporządkowywania kolejnych terytoriów."

AMW_koluszki_hub: "Węzeł Koluszkowski"
AMW_koluszki_hub_desc: "Łódzki system kolejowy od zawsze pozostawiał wiele do życzenia. Wybuch nuklearny na Bałutach tylko pogorszył sytuację. Ta kaskadowa zapaść infrastruktury sprawiła, że węzeł kolejowy w Koluszkach - już wcześniej będący ważnym elementem lokalnego systemu transportowego - stał się prawdziwą bramą do wschodniej połowy Polski. Ktokolwiek go kontroluje, może wykorzystać go do wzmocnienia swoich łańcuchów zaopatrzeniowych, dostarczając żołnierzom żywność i amunicję szybciej niż przeciwnicy. Może również czerpać dodatkowe dochody z opłat nakładanych na zagraniczne pociągi przejeżdżające przez Koluszki."

AMW_anti_temperance_league: "Liga Antyabstynencka"
AMW_anti_temperance_league_desc: "Choć wielu jest wdzięcznych sędzi Wesołowskiej za zaprowadzanie porządku, równie wielu niepokoi jej radykalizm w kwestii Zasady Trzeźwości. Rozszerzyła tak zwaną Nocną Prohibicję na wszystkie prowincje, czasem wbrew stanowisku lokalnych samorządów. Zdelegalizowała również marihuanę do użytku medycznego. Wielu uważa, że z czasem całkowicie zakaże posiadania, produkcji i spożywania alkoholu w jakichkolwiek okolicznościach. Działania te skłoniły rozmaitych meneli, ćpunów i narkomanów do utworzenia Ligi Antyabstynenckiej, której celem jest sabotowanie działalności sędzi. Jeśli Wesołowska będzie dalej zaostrzać walkę z narkotykami, do szeregów Ligi mogą dołączyć nawet zwykli obywatele."

