##Characters##
POLITICS_VLADIMIR_PUTIN_DESC: "Zaledwie dekadę temu, Władimir Putin mógł się nazywać najpotężniejszym człowiekiem na świecie. Z jego rozkazu powstawały nowe kraje, podczas gdy inne ginęły pod gąsienicami rosyjskich tanków. Jednym słowem mógł sprawić że cały świat będzie drżał ze strachu, rozgrywał zachodnie państwa jak dzieci, a to wszystko podczas gdy wpływ Rosji rósł, przeradzając się z wykastrowanej republiki odziedziczonej po Jelcynie w drugie najpotężniejsze państwo na świecie oraz największą potęgę w Eurazji. Wydawać by się mogło że pozycja Putina jako jednego z największych rosyjskich przywódców jest niekwestionowalna, a jedyną kwestią było jaki przydomek zostanie mu nadany by jak najlepiej opisać jego rządy po ich triumfalnym zakończeniu. Ale wszyscy politycy prędzej czy później popełniają fatalne błędy. Tym razem wystarczyła jedna pomyłka, żeby całe dziedzictwo i potęga która utrzymywała go przy władzy przez prawie ćwierćwiecze runęły niczym domek z kart.\n\nNa bagnistych stepach Ukrainy, reputacja Putina jako króla racjonalnej geopolityki poległa wraz z setkami tysięcy rosyjskich żołnierzy, a Rosja stała się międzynarodowym pariasem, popieranym zaledwie przez kilku dyktatorów trzeciego świata. Gdy ośmieszona armia rosyjska wycofała się za pierwotne granice, sępy w Moskwie zaczęły krążyć nad nadal żywym prezydentem. Jakże krucha jest łaska oligarchów skoro kilka minut po tym jak ich dobroczyńca przestał być rentowny, opuścili oni tonący okręt pozostawiając kapitana by poszedł na dno samotnym.\n\nKoniec końcow, był jednak jeden człowiek który odważył się otwarcie przeciwstawić Putinowi w szczycie jego potęgi i ostatecznie stał się tym, który przejął po nim schedę. Nawalny, wspierany przez wewnętrzną opozycją, bogate elity i zachodni kapitał, nawet nie musiał się przesadnie starać żeby wyrzucić swojego poprzednika ze stanowiska. Opuszczony przez wszystkich najbliższych sjojuszników, Putin znalazł schronienie przed gniewem nowego lidera w Kaliningradzie.\n\nTeraz, jego włości stanowią jedynie gnijące truchło jakim kiedyś była Rosja, i choć podupadł na zdrowiu, Putin dalej snuje plany swojego powrotu za wszelką cenę. Upadek Polski okazał się dla niego błogosławieństwem. Gdyby udało mu się podbić wystarczająco terytorium odwiecznego wroga Rosji, grupa trzymająca władzę w Moskwie znowu zacznie postrzegać go jako bohatera i uda mu się odzyskać jego należyte miejsce. Byłby to wspaniały ostatni rozdział w opowieści o najwspanialszym żołdaku Mateczki Rosji."


##Events##
rosja.2.t: "[GetNewspaper]Rosyjska interwencja na Mazurach zakończyła się klęską"
rosja.2.desc: "Historia znowu się powtórzyła, tym razem jako farsa. Administracja Kaliningradu poniosła sromotną klęskę w starciu z kilkoma nieskoordynowanymi państewkami polskich watażków, które połączyły siły tworząc Front Antyrosyjski. Rosyjskie wojska utknęły wśród mazurskich jezior i lasów, nieprzygotowane do działań w tak trudnym terenie i nieustannie nękane przez polskich partyzantów.\n\nPodpisano zawieszenie broni, a Rosjanie zgodzili się wycofać ze wszystkich terytoriów należących wcześniej do Polski. Resztki prestiżu, jakim wciąż cieszył się rząd Putina, przepadły, a państwo będące pośmiewiskiem całego świata pogrąża się w niepokojach. W Kaliningradzie spodziewany jest gwałtowny upadek obecnej władzy i brutalna walka o przejęcie kontroli."
rosja.2.a: "Cud nad mazurskimi jeziorami?"

rosja.3.t: "[GetNewspaper]Rosjanie najeżdżają Mazury"
rosja.3.desc: "Wielu uważało, że to tylko kwestia czasu, zanim Rosjanie spróbują wkroczyć głębiej na polskie terytorium. Niedawne oświadczenie władz Zachodniego Okręgu Wojskowego o rozpoczęciu \"specjalnej operacji dewatażkizacyjnej\" jasno pokazało, że ten moment właśnie nadszedł.\n\nChoć atak jest formalnie samowolną akcją władz Kaliningradu, rosyjski rząd nie wydał w tej sprawie żadnego oficjalnego stanowiska, a wojska stacjonujące na Białorusi nie przekraczają granicy. Wygląda na to że Putin po raz kolejny usiłuje odzyskać resztki godności, gdyż rozum dawno i nieodwrotnie stracił.\n\nPolscy watażkowie zaatakowani przez rosyjskie siły utworzyli Front Antyrosyjski. Pomimo desperackiej obrony operacja ma potrwać najwyżej kilka tygodni ze względu na przytłaczającą przewagę Rosjan pod względem technologicznym, logistycznym i liczebnym."
rosja.3.a: "Rosjanie w Polsce? Nic nowego."

rosja.4.t: "[GetNewspaper]Jewgienij Prigożyn ginie w katastrofie śmigłowca!"
rosja.4.desc: "Jewgienij Prigożyn, niesławny przywódca Rosyjskiej Administracji Wojskowej w Polsce, zginął w katastrofie śmigłowca w tajemniczych okolicznościach. Maszyna, która miała lecieć do instalacji wojskowej w Kaliningradzie, rozbiła się na odludnym terenie, zabijając wszystkich znajdujących się na pokładzie.\n\nOficjalne raporty wskazują jako przyczynę katastrofy przypadkowy ostrzał z granatnika przeciwpancernego przeprowadzony przez polskich partyzantów dowodzonych przez Sikorskiego. Wielu ekspertów podchodzi jednak sceptycznie do tego wyjaśnienia, wskazując na niedawną próbę obalenia Władimira Putina przez Prigożyna jako możliwy motyw zamachu.\n\nEliminując Prigożyna, Putin mógł próbować pozbyć się potencjalnego rywala i ostrzec innych, którzy mogliby rozważać zakwestionowanie jego władzy. Okoliczności katastrofy wciąż są badane, a wiele pytań pozostaje bez odpowiedzi."
rosja.4.a: "Chyba nie chciał wyskoczyć przez okno."

rosja.5.t: "[GetNewspaper]Jewgienij Prigożyn dokonuje zamachu stanu przeciwko rządowi Putina"
rosja.5.desc: "Nieliczne informacje, które przedarły się przez brutalną cenzurę medialną w kadłubowym państwie kaliningradzkim, zdają się wskazywać na nagłą i najprawdopodobniej krwawą zmianę władzy. Po nieudanej próbie rozszerzenia południowej strefy buforowej na Warmię i Mazury, a następnie jeszcze bardziej nieprawdopodobnym odwrocie przed zbieraniną lokalnych państewek watażków, resztki szacunku, jakim długoletni prezydent cieszył się wśród własnego otoczenia, ostatecznie wyparowały. O świcie czołgi Wagnerowców przejechały Prospektem Sowieckim, ostrzeliwując budynki rządowe aż do ich kapitulacji. Wkrótce potem ci, którzy pozostali lojalni wobec starej administracji, wywiesili białą flagę.\n\nNagła zmiana władzy oznacza zwrot w stronę większego militaryzmu i szowinizmu w obrębie samotnej eksklawy. Jak dotąd niewiele wskazuje na to, by Jewgienij Prigożyn uznał jej granice za wystarczające, by pomieścić swoje ambicje."
rosja.5.a: "Jedna z ostatnich więzi starego świata - zerwana."

unificationreg.56.t: "[GetNewspaper]Federacja Rosyjska podbija Warmię i Mazury"
unificationreg.56.desc: "Kolejny śmiertelny wróg narodu polskiego zagarnął część jego ziem. Władze Rosji ogłosiły, że zdołały zająć całe dawne województwo warmińsko-mazurskie. Choć ludność cywilna stawia znaczący opór, a w całym regionie działają partyzanci, główne ośrodki miejskie znalazły się pod kontrolą Rosjan.\n\nO ile wynik konfliktu był łatwy do przewidzenia, los okupowanej Polski pozostaje znacznie bardziej niepewny. Jedni spodziewają się utworzenia polskiego państwa marionetkowego, inni - powstania bardziej osobliwej formy państwowości na dawnych ziemiach pruskich, podczas gdy jeszcze inni przewidują zwykłą okupację wojskową lub aneksję. Nikt nie ma jednak wątpliwości, że Rosja na tym nie poprzestanie i prędzej czy później spróbuje zagarnąć kolejne części Polski. Wraz ze wzrostem strachu, nienawiści i żalu jedno wydaje się pewne - kolejna inwazja spotka się ze znacznie silniejszym oporem."
unificationreg.56.a: "Kolejny rozbiór."

super.56.t: "[GetNewspaper][FROM.GetName] podbija Polskę!"
super.56.desc: "Eksklawa kaliningradzka, ostatni relikt Rosji Władimira Putina, wydała oświadczenie, w którym ogłosiła przejęcie pełnej kontroli nad terytorium dawnego państwa polskiego. Po szybkiej kampanii wojskowej przeciwko nieskoordynowanym państewkom watażków, które powstały w następstwie upadku Polski, rosyjskim siłom udało się zabezpieczyć wszystkie najważniejsze ośrodki miejskie i węzły komunikacyjne w regionie.\n\nWraz z podbojem Polski rosyjski rząd ma nadzieję umocnić swoją pozycję jako regionalnego mocarstwa i wysłać społeczności międzynarodowej jasny sygnał, że Rosja wciąż pozostaje siłą, z którą należy się liczyć. Posunięcie to spotkało się jednak z potępieniem ze strony wielu państw zachodnich, które postrzegają je jako agresywną ekspansję zagrażającą stabilności całego regionu.\n\nAneksja Polski wywołała również wściekłość wśród Polaków, dając początek nowej fali ruchów oporu i wojny partyzanckiej przeciwko rosyjskim okupantom."
super.56.a: "Odrodziła się wiedźma Rassija."

