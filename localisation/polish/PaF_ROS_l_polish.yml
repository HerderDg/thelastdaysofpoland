putin_zdechl.1.t: "Nie można tak po prostu wejść do Kaliningradu"
putin_zdechl.1.desc: "Ulice miasta wciąż spowijał dym po walkach, podczas gdy nasi żołnierze przeszukiwali ruiny rosyjskich fortyfikacji w poszukiwaniu resztek garnizonu. Większość cywilów nadal ukrywała się w piwnicach, obawiając się zarówno nas, jak i chaosu, który ogarnął dawną rosyjską eksklawę. Początkowo wydawało się, że zdobycie miasta przyniesie nam niewiele więcej niż strategiczny port i kilka częściowo sprawnych magazynów wojskowych. Wszystko zmieniło się, gdy oddział saperów zabezpieczający dawny kompleks administracyjny odkrył ukryte przejście prowadzące głęboko pod ziemię. Za ciężkimi stalowymi drzwiami znajdował się bunkier. Nietknięty. W środku znaleziono ślady niedawnej ewakuacji: porzucony sprzęt łączności, dokumenty spalone w pośpiechu oraz ciała rosyjskich funkcjonariuszy ochrony. Nie ma wątpliwości - był tutaj. To był jego bunkier. Nie wiemy nawet, czy wciąż żyje.\n\nJedno jest jednak pewne.\nŻywego czy martwego - prędzej czy później go dopadniemy."
putin_zdechl.1.a: "Znajdźcie go!"

putin_zdechl.2.t: "[GetNewspaper]Władimir Putin nie żyje"
putin_zdechl.2.desc: "Władimir Putin, wygnany prezydent Federacji Rosyjskiej, został znaleziony martwy na obrzeżach Kaliningradu. Przez lata przebywał na wygnaniu wraz ze swoimi lojalistami, kierując kadłubowym państwem na południowym wybrzeżu Bałtyku i próbując odzyskać choćby pozory swojej dawnej pozycji na arenie międzynarodowej — jedynym sposobem, jaki znał: poprzez inwazję wojskową. Pomimo początkowych sukcesów polscy watażkowie, choć podzieleni, zdołali przebić się przez dawną rosyjską granicę i szturmem zdobyć Kaliningrad. Uważa się, że ta nagła klęska militarna była główną przyczyną śmierci rosyjskiego przywódcy, choć wciąż nie wiadomo, czy Putin został zastrzelony przez własnych ludzi, uzbrojonych dysydentów, przypadkowego snajpera z nacierającej armii, czy też odebrał sobie życie. Na ten moment szczegóły pozostają ukryte we mgle wojny. Prawda może nigdy nie ujrzeć światła dziennego, ponieważ niektórzy podejrzewają, że ciało mogło zostać uznane za zbyt mało istotne, by je zabezpieczać... albo że mściwi przeciwnicy putinizmu mogli jeszcze dodatkowo zmasakrować zwłoki."
putin_zdechl.2.a: "Wreszcie..."

putin_zdechl.3.t: "Los, na który długo czekano"
putin_zdechl.3.desc: "Nasi żołnierze zabezpieczający obrzeża Kaliningradu znaleźli zmasakrowane ciało człowieka, który najwyraźniej zajmował ważną pozycję w rosyjskim kadłubowym państwie, z którym walczymy. Zwłoki przekazano naszemu patologowi, który potwierdził plotki i podejrzenia krążące wśród wojska oraz najwyższych kręgów państwa: Władimir Putin nie żyje. Wciąż nie wiadomo, czy popełnił samobójstwo, czy został zabity przez własnych żołnierzy."
putin_zdechl.3.a: "Dopadliśmy go... a raczej to, co z niego zostało."