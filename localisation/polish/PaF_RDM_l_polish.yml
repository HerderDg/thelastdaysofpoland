##National Spirits##
RDM_diplomatic_cadres: "Kadry dyplomatyczne"
RDM_diplomatic_cadres_desc: "Dzięki mentorowi Bocheńskiego, Zbigniewowi Rauowi - byłemu ministrowi spraw zagranicznych, Republika Radomszczańska może pochwalić się całkiem sprawnym korpusem dyplomatycznym. W połączniu z faktem że sam rząd Republiki składa się głównie ze świeżej krwi zaplecza Prawa i Sprawiedliwości, nieobarczonymi jarzmem afer, pozwala Radomsku na utrzymanie sieci relacji dyplomatycznych. Już teraz są postrzegani jako jedni z najbardziej gorliwych popleczników doktryny Dialogu poza samym miastem Łodzi."
RDM_sore_loser: "Zgorzkniały przegrany"
RDM_sore_loser_desc: "Mogą przefarbowywać się tyle razy ile mogą. Nie zmienia to faktu, że tak zwana Republika jest żałosnym okrawkiem całości województwa Łódzkiego. W zaledwie kilka tygodni, rządy Prawa i Sprawiedliwości w województwie zmalały około dwunastrokrotnie. I to wszystko wina byłego wojewody, Tobiasza Bocheńskiego. Wszyscy zdają się to wiedzieć, co bardzo mocno podkopuję wiarę w nową Republikę, a w szczególności w to, jak poradziłaby sobie w potencjalnym konflikcie zbrojnym."

 ##First Tree##
 ##Events##
unification.193.t: "[GetNewspaper]Republika Radomska jednoczy województwo łódzkie"
unification.193.desc: "Trauma Upadku w połączeniu z tragedią Bałut sprawiła, że Łódzkie stało się wylęgarnią najbardziej osobliwych i radykalnych frakcji znanych człowiekowi. Z tego powodu wielu przeoczyło niepozorną i zwyczajną ostatnią pozostałość kontroli dawnego rządu nad Łódzkiem, rządzoną przez trzech ostatnich wojewodów. Początkowo próbowali przejąć kontrolę nad stolicą województwa, jednak ogólna niestabilność po katastrofie nuklearnej oraz liberalne sympatie mieszkańców Łodzi sprawiły, że przedsięwzięcie zakończyło się niepowodzeniem. Zostali zmuszeni do wycofania się do Radomska, konserwatywnego bastionu na skraju województwa. Zaczynając od zera, stopniowo budowali swoje poparcie w regionie, aż w końcu zdominowali całe województwo. Nawet niepokorna Łódź zaakceptowała teraz ich politykę. Być może dzięki przyjęciu liberalnego konserwatyzmu przez nowe elity, a być może dlatego, że pozostali watażkowie pokazali jej mieszkańcom, jak bardzo nieobliczalna mogła być alternatywa."
unification.193.a: "Demokracja w Łódzkiem"
