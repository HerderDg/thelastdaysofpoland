unification.189.t: "[GetNewspaper]Biskupstwo Warmii jednoczy Warmię i Mazury!"
unification.189.desc: "W doniosłym akcie wiary i jedności Biskupstwo Warmińskie objęło swoim duchowym i administracyjnym przewodnictwem całe województwo warmińsko-mazurskie. Z Bożym błogosławieństwem region staje się dziś ostoją religijnej tradycji, połączonej z odwiecznym pięknem starannie utrzymanej architektury gotyckiej. Wielka ceremonia w Olsztynie, wzorowana na intronizacjach z czasów świetności Biskupstwa i uświetniona obecnością wysokich rangą duchownych, szlachty oraz oddanych wiernych, przypieczętowała oficjalne zjednoczenie. Dzwony rozbrzmiały po całej krainie a dekret biskupi potwierdził przyszłość opartą na duchowej harmonii, w której miejsca święte będą chronione i otaczane należną czcią. W całym spokojnym regionie Biskupstwo zobowiązuje się strzec pokoju i zapewnić bezpieczeństwo pielgrzymkom wszystkim tym, którzy poszukują oświecenia i schronienia. Ustanowiwszy namiastkę stabilności, państwo zwraca się teraz ku własnym sprawom, a jego mieszkańcy mogą wreszcie zaznać chwili zasłużonego wytchnienia."
unification.189.a: "Za wiarę i ziemię!"

