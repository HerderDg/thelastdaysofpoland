unification.99.t: "[GetNewspaper]Tatarski Imamat jednoczy Podlasie!"
unification.99.desc: "Mieszkańców Podlasia wzywa nieznany im dotąd dźwięk. Z nowo wybudowanych minaretów rozbrzmiewa pieśń, jakiej nie słyszano nigdzie indziej w Polsce. Opiewa chwałę Stwórcy, lecz odróżnia ją od niezliczonych religijnych śpiewów popularnych w kraju to, że jest poświęcona Allahowi. W najtrudniejszej chwili społeczność tatarska otworzyła ramiona i udzieliła pomocy cierpiącym Polakom. Wspólnie zbudowali państwo oparte na tolerancji religijnej, w którym chrześcijaństwo i islam współistnieją. Pod przewodnictwem Tomasza Miśkiewicza ustanowiono nowy system rządów, łączący wcześniej odrębne zasady moralne obu religii w jeden kodeks. Ta pokojowa synteza przyciągnęła wielu mieszkańców regionu, a szeregi Tatarów rosły, pozwalając im przetrwać kolejne wojny zjednoczeniowe. Jedno jest jednak jasne: Polska nie zaakceptuje muzułmańskich rządów bez sprzeciwu, niezależnie od tego, jak wielka będzie ich tolerancja."
unification.99.a: "Allahu Akbar. Ashhadu alla ilaha illallah. Hayya 'alas-Salah."

super.99.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.99.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.99.a: "Wreszcie zjednoczeni."

