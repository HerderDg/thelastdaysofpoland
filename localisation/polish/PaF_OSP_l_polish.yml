unification.190.t: "[GetNewspaper]Ludowa Straż Pożarna jednoczy Małopolskę!"
unification.190.desc: "W blasku jedności i zdeterminowania, Ochotniczym Brygadom Pożarniczym udało się rozpocząć nową erę dla Małopolski. Przy dźwiękach syren odbijających się szerokim echem pośród spokojnych wsi, zielone sztandary powiewają dumnie na wietrze, a ochotniczy strażacy od Krakowa po Tarnów powtarzają tę samą przysięgę - chronić ziemie, jej lud i podstawowe wartości Narodowego Agraryzmu. Ta niespodziewana i doniosła unifikacja została uświetniona wielkim ceremonialnym zgromadzeniem gdzie przyjęto owe przysięgi od lokalnych jednostek. Zakorzenione w nich ideały ciężkiej pracy, solidarności i samowystarczalności posuwają Ludową Straż Pożarną w stronę czegoś większego. Bo walka z płomieniami to nie jest ich już jedyne zadanie, lecz od wiejskich zagród po miejskie ulice, wszelkie pożary zostaną ugaszone a jedyne co będzie się tlić to płomień jedności, gdzie społeczeństwo, rolnictwo, tradycja i duch wspólnoty kwitnie pośród małopolskich pól."
unification.190.a: "Ad maiorem Dei gloriam!"

super_b.139.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_b.139.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super_b.139.a: "Wreszcie zjednoczeni."

