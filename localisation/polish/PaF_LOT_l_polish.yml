 ##Events##
unification.91.t: "[GetNewspaper]Kociewie jednoczy Pomorze Gdańskie!"
unification.91.desc: "Reputacja jedynego państwa na Pomorzu, którego Niemcom nie udało się podbić podczas ich inwazji na Polskę, to nie byle co. I potrzeba równie twardego człowieka, by przewodzić takiemu państwu. Niestabilność w kraju oznaczała dla Wojciecha Cejrowskiego koniec wygodnych podróży i politykowania z tylnego krzesła, gdyż kolejne lata upłynęły pod znakiem nieustannej walki. Organizując swoich nacjonalistycznych zwolenników w prawdziwą milicję, ekscentryczny obieżyświat zbudował wokół siebie kult jednostki. Na Kociewiu jego słowo jest niemal święte, a ludzie są gotowi walczyć i ginąć na jego rozkaz. Zahartowana wcześniejszymi konfliktami i nieustannie ćwiczona do osiągnięcia idealnej sprawności armia rozbiła wszystkie pozostałości zdrajców na Pomorzu. Teraz nadchodzi czas represji wobec wrogów Polski, a pokazowe procesy i publiczne egzekucje pokazują, jaki los czeka każdego, kto ośmieli się odwrócić plecami do Ojczyzny."
unification.91.a: "Polska potrzebuje silnej ręki, jak przystało na kraj trzeciego świata."

super.91.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.91.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.91.a: "Wreszcie zjednoczeni."

