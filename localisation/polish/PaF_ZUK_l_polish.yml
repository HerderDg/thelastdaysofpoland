 ## First Tree ##
ZUK_the_mayor_in_exile: "The Mayor in Exile"
ZUK_the_mayor_in_exile_desc: "Krzysztof Żuk has been governing Lublin for many years, and when the country started collapsing he was the only person who could save the city from complete chaos. Unfortunately, he was unable to stay in power for long, and after a coup he now finds himself exiled in Chełm. It is now his duty to do everything in his power to liberate Lublin and bring back freedom and democracy to the city, as well as its region along the way. Not only for the sake of Lublinians, but for the whole voivodeship as well."

ZUK_a_reunited_council: "A Reunited Council"
ZUK_a_reunited_council_desc: "The Mayor is not alone. Over the last months many representatives of the former Lublinian administration managed to make their way to the League and joined its ranks. The old City Council members now form a bulk of our new provisional government in Chełm. Without their expertize and loyalty, Żuk could never come as far as he already did in his quest of liberating Lublin and the region."

ZUK_overview_of_the_economy: "Overview of the Economy"
ZUK_overview_of_the_economy_desc: "The economy lies in ruins, and it is up to us to pick up the pieces. Fortunately many members of our governent, including the Mayor, have a background in economics. Hopefully their experience will help us rebuild some of our industry and infrastructure. For now, we have to examine what industrial resources are actually available at our disposal, so that we can evaluate our future prospects."

ZUK_consolidation_of_our_resources: "Consolidating our Resources"
ZUK_consolidation_of_our_resources_desc: "Unfortunately the Chełm area has never been highly developed economically, being more of an agricultural region. Still, there is some amount of industrial infrastructure scattered around, and we must make the best use of it. Being so isolated economically poses a great challenge as well, since the factories don't have access to the resources of the whole country anymore, but we must try to adapt and utilize whatever little there is left."

ZUK_repurpose_concrete_factories: "Repurpose Concrete Plants"
ZUK_repurpose_concrete_factories_desc: "Out of all industrial plants located in our territory, some of the most potentially useful are the concrete plants in Chełm and Rejowiec Fabryczny. If we manage to make them work somewhat efficiently again, construction will certainly become easier and faster, and it would give us a valuable resource for trading with some of our neighbors."

ZUK_infrastructure_maintenance: "Infrastructure Maintenance"
ZUK_infrastructure_maintenance_desc: "The region's road network, not very impressive to begin with, has suffered even more in the last year. The severe winter coupled with neglect caused by the nationwide chaos meant that today many roads are in need of serious maintenance and repairs. We cannot fix every pothole in our territory, but at least we can try and keep main roads in Chełm and the countryside in a decent condition."

ZUK_recycled_makeshift_weapons: "Recycled Makeshift Weapons"
ZUK_recycled_makeshift_weapons_desc: "Not every piece of equipment will be useful in our reorganized industry, but it doesn't mean that much of it has to go to waste. Many pieces of scrap could be repurposed as impromtu weapons for our defense forces, especially since their presence seems to be increasingly important. These weapons obviously won't be of a very good quality, but in these circumstances beggars can't be choosers."

ZUK_provisional_weapon_factories: "Impromtu Weapon Factories"
ZUK_provisional_weapon_factories_desc: "Whether we like it or not, while rebuilding the economy of our region we cannot forget about defense equipment manufacturing. Our men will need more and more weapons, and we can recycle only so much from the unused scraps. We have to organize new workshops, so that we can keep our forces supplied. This would also allow us to keep improving the quality of their gear."

ZUK_improved_living_conditions: "Improved Living Conditions"
ZUK_improved_living_conditions_desc: "Our economic reorganization has started to bear fruit, which can be noticed even by regular people under our administration. Access to basic goods and overall quality of life have visibly improved over the last months, and while it's still nowhere near close to what it was before the country fell, it does bring people some hope - and gives the provisional government more legitimacy."

ZUK_trade_with_bilgoraj_conglomerate: "Trade with the Biłgoraj Comglomerate"
ZUK_trade_with_bilgoraj_conglomerate_desc: "Out of all rival governments that surround us, the corporate state to the south seems to be the least unreasonable one. We probably won't ever be able to call them our actual friends, but they will likely be open for some mutually beneficial trade, at least for now. We can produce concrete for example, so we might exchange it for some other valuable resources."

ZUK_trade_with_the_ukrainians: "Trade with the Ukrainians"
ZUK_trade_with_the_ukrainians_desc: "For a long time thousands of Ukrainians lived in Lublin, and the Mayor has always welcomed them warmly, unlike the current occupants of the city. Even though Ukraine is in a rough spot itself, our friends on the other side of Bug river surely remember our bond, and would likely be willing to provide us some amount of material support in exchange of excess materials we have at our disposal."

ZUK_new_lublian_army: "New Lublinian Army"
ZUK_new_lublian_army_desc: "The mostly non-violent means of expanding our influence in an actual lawless anarchy have reached their limit. If we want to remain independent from the surrounding rival governments today, and liberate Lublin in the future, we need to form a strong, well-organized army. It probably won't be impressively equipped or large in number, but we will make sure it gets the job done."

ZUK_lublinian_volunteers: "Lublinan Volunteers"
ZUK_lublinian_volunteers_desc: "Many Lublinians decided to leave their homes and managed to make their way to the League, so that they can join our forces, or at least find safe refuge. As a result, a significant portion of our army is made of these Lublinian volunteers. We must keep encouraging the refugees to enlist, especially since they often turn out to be one of the most dedicated troops in our ranks."

ZUK_encourage_local_conscription: "Encourage Local Conscription"
ZUK_encourage_local_conscription_desc: "Local people under our administration are often reluctant about joining our armed forces, since they don't care about some distant city and are more concerned about their own home and safety. While this may seem like a valid point, we must convince them that our ultimate goal is to bring back freedom and safety to the whole region, not only the voivodeship's capital."

ZUK_the_goat_division: "The Goat Division"
ZUK_the_goat_division_desc: "Among our conscripts there is a number of men who have recieved professional military training in the past, and are especially eager and loyal to our cause. We shall organize them into an elite unit, which will be called the Goat Division - after the goat which is historically the symbol of Lublin. This will improve not only our fighting strength, but hopefully our army's morale as well."

ZUK_swaying_the_public: "Swaying the Public"
ZUK_swaying_the_public_desc: "If we really want to be seen as liberators and not just some another statelet led by dictators or madmen, we need to focus on improving our public image. Beata Stepaniuk-Kuśmierzak, the Mayor's right hand, will be overseeing our efforts to earn the trust of common people under our administration, and make them see that their issues are important to us."

ZUK_close_to_the_people: "Close to the People"
ZUK_close_to_the_people_desc: "One of the best way to earn people's trust is to become more accessible to them. Mayor's office in Chełm will be always open for citizens, and also he or his representatives will be regularly visiting various towns and meeting with their inhabitants there. The people will see that we are not some cold, distant rulers, but regular people like them."

ZUK_radio_free_lublin: "Radio Free Lublin"
ZUK_radio_free_lublin_desc: "The country's collapse and the severe energy shortages made most of our everyday technology completely unreliable. Radio is the one exception, and we shall capitalize on that. We will start our own radio station targeted to listeners not only in our territory, but also in Lublin and in the whole voivodeship, so that as many people as possible can hear about our cause and, hopefully, get convinced to it."

ZUK_safe_haven_for_refugees: "Safe Haven for Refugees"
ZUK_safe_haven_for_refugees_desc: "A lot of people are being persecuted under our rival governments, especially in Lublin and western parts of the voivodeship. They need to know that wherever they come from, they will always be welcomed in our territory and will find safety under our administration. We will utilize our radio to keep reminding people of that."

ZUK_reassure_local_population: "Reassure the Local Population"
ZUK_reassure_local_population_desc: "A common source of people's distrust towards us is the fact that we are tied to a big, seemingly distant city, and we often use it in our rhetoric. Some people think that this makes us not actually care about their own region and its local identity. We must show them that this is far from truth, and we actually care about them as much as we would care about Lublinians."

ZUK_promise_local_elections: "Promise Local Elections"
ZUK_promise_local_elections_desc: "When we were expanding our influence and taking over new towns and villages, unfortunately we were forced to remove from posts some remaining representatives of local pre-collapse administration who weren't willing to fully cooperate with us. This has angered many people, but if we promise that we will organize new local, fully democratic elections when the situation becomes more stable, hopefully it will be enough calm them down for now."

ZUK_beacon_of_freedom: "Beacon of Freedom"
ZUK_beacon_of_freedom_desc: "Out of all governments in the region, our administration is certainly the most fair and safe one, and the people appreciate their freedom more and more. Even though they were initially distrustful of us, today our public support only seems to be growing."

ZUK_liberators_of_the_city: "Liberators of the City"
ZUK_liberators_of_the_city_desc: "We are Lublinians and we are proud of that. Lublin with its inhabitants is being held hostage by evil forces, and it is our duty to come to its aid. Krzysztof Żuk is the only legitimate, democratically elected mayor of the city, and we will make sure he comes back to his post, so that Lublin may prosper again, and its people won't have to be afraid anymore."

ZUK_liberators_of_the_voivodeship: "Liberators of the Voivodeship"
ZUK_liberators_of_the_voivodeship_desc: "Even though we are tied do the city of Lublin, we have the good of our whole voivodeship at heart. Our goal is to bring liberty to the whole region, and make sure all of its people feel safe and free, wherever they are. Doesn't matter if you live in a big city or some remote village - if you are under our administration, we'll be there to hear about your issues."

ZUK_on_the_warpath: "On the Warpath"
ZUK_on_the_warpath_desc: "Our borders are stabilized, most pressing issues resolved, the army created. The stage is set for our next steps, which unfortunately most likely will mean armed conflicts. The rumors suggest our neighbors are gearing up their forces as well, so at this point the war seems inevitable. But we will be ready for it, and in the end we shall emerge victorious!"



 ##Events##
zuk.1.t: "The Exile"
zuk.1.desc: "On a sunny day like today, it is possible to see several tall Lublinian structures from a hill near Rejowiec, from a distance of over 50 kilometers. Roofs of two buildings in LSM, a radio tower near the city center, a large chimney of the power plant in Tatary and, most distinctly of all, another, even larger chimney in Wrotków. In a few hours, when the night will set in, its slowly pulsating red light will be clearly visible on the horizon even with a naked eye.\n\nKrzysztof Żuk put the binoculars down, and sighed quietly. He figured he could do this little detour, since he and his assistant were driving from Chełm to the Krasnystaw area anyway, for another regional inspection. And he really needed any break he could get. The last few months have been so incredibly hectic and stressful, and it felt like they were as long as the previous sixteen years he spent in office as the Mayor of Lublin. Back when everything was still normal. When Lublin wasn't in a warzone.\n\nŻuk passed the binoculars to the assistant, and while she was observing the view over the next several minutes, he just tried to clear his head. He let the nostalgia set in. He thought about the city he was so attached to, and imagined that it was still a place of peace and growth, like before. Before it was dominated by Czarnek's thugs and by misguided anarchists.\n\nThe assistant eventually put down the binoculars, and turned her face to Żuk. He could clearly see that she became emotional as well, even if she didn't say a word. But in the end they both knew that they still had a lot of work to do today, and it was time for them to return to the nearby parked car and to go on with their duties."
zuk.1.a: "\"Let's go back, Beata.\""

zuk.3.t: "[GetNewspaper]Krzysztof Żuk legitymizuje swoją władzę"
zuk.3.desc: "Wkrótce po zjednoczeniu regionu i proklamowaniu Republiki Lubelskiej jej przywódca spełnił obietnicę, organizując powszechne wybory. Mieszkańcy województwa mieli wybrać prezydenta, o którego urząd ubiegał się sam Żuk, parlament oraz władze lokalnych samorządów. Ponieważ wybory odbyły się niedługo po tym, jak siły żukistowskie zdobyły dominującą pozycję w regionie, prezydent Lublina i członkowie jego stronnictwa politycznego nie mieli do czynienia z żadną znaczącą, zorganizowaną opozycją. W rezultacie Krzysztof Żuk z łatwością wygrał wybory prezydenckie, a skład jego tymczasowego rządu niewiele się zmienił. Jednocześnie PiS przejął kontrolę nad kilkoma samorządami. Choć zwycięstwo żukistów było w gruncie rzeczy łatwe do przewidzenia, dodało lubelskim władzom nowej pewności siebie, która najpewniej zapewni im polityczną siłę w nadchodzących miesiącach."
zuk.3.a: "Kolejne udane wybory Żuka."

zuk.4.t: "[GetNewspaper]Krzysztof Żuk przejmuje władzę dyktatorską"
zuk.4.desc: "Czy kieruje nim szczera troska o wewnętrzne bezpieczeństwo państwa, czy też osobiste pragnienie zdobycia większej władzy, samozwańczy prezydent Republiki Lubelskiej ogłosił, że obiecane wybory trzeba odłożyć na bliżej nieokreśloną przyszłość, zapewne do czasu, gdy sytuacja stanie się bardziej sprzyjająca. Do tego momentu pozostanie niekwestionowanym przywódcą kraju i zrobi wszystko, co uzna za konieczne, by chronić Lublin oraz jego mieszkańców.\nStoi to w jaskrawej sprzeczności z jego wcześniejszą retoryką. Dotychczas przedstawiał się jako latarnia demokracji pośród chaosu tyranów i szaleńców, wielokrotnie obiecując przeprowadzenie uczciwych wyborów, gdy tylko sytuacja dostatecznie się ustabilizuje. Teraz, po zjednoczeniu regionu i proklamowaniu Republiki, wydaje się, że nadeszła ku temu idealna chwila - a jednak postanowił wycofać się ze swoich obietnic."
zuk.4.a: "Jednak nie taki z niego liberał."

zuk.5.t: "[GetNewspaper]Beata Stepaniuk-Kuśmierzak wygrywa wybory w Lublinie"
zuk.5.desc: "Wkrótce po zjednoczeniu regionu i proklamowaniu Republiki Lubelskiej jej przywódca, Krzysztof Żuk, spełnił obietnicę i zorganizował powszechne wybory - sam jednak postanowił w nich nie startować. Uznał, że rządził Lublinem wystarczająco długo, i zamiast ubiegać się o reelekcję, poparł kandydaturę swojej prawej ręki, Beaty Stepaniuk-Kuśmierzak, w wyborach prezydenckich odbywających się równolegle z wyborami parlamentarnymi i samorządowymi. Stronnictwo żukistowskie nie miało wówczas żadnej znaczącej, zorganizowanej opozycji, więc jej łatwe zwycięstwo nie było zaskoczeniem.\nNowa przywódczyni Lublina uchodzi za bardziej postępową społecznie od swojego poprzednika, ponieważ znacznie większą wagę przywiązuje do takich kwestii jak równouprawnienie płci i prawa osób LGBT. Zmiana przywództwa zapowiada istotną przemianę na lubelskiej scenie politycznej."
zuk.5.a: "Przekazanie pałeczki."

unification.11.t: "[GetNewspaper]Liga Wyzwolenia Lublina jednoczy województwo lubelskie"
unification.11.desc: "Dotarły do nas nowe informacje z wschodniej Polski. Wygląda na to, że całe województwo lubelskie znajduje się obecnie pod kontrolą przedupadkowych władz lokalnych miasta Lublina, na których czele stoi wieloletni prezydent, Krzysztof Żuk. Co ciekawe, według doniesień, gdy Polska zaczęła się rozpadać, Żuk został wypędzony z Lublina przez wrogo nastawioną koalicję prawicową i zmuszony do wygnania poza granice własnego miasta. Tam zdołał jednak w znacznej mierze odtworzyć swoją radę, co pozwoliło mu zdobyć wystarczające wpływy, by rzucić wyzwanie innym pretendentom do kontroli nad województwem. Po serii lokalnych konfliktów ostatecznie osiągnął swój cel.\nPrzywódca nowo proklamowanej Republiki Lubelskiej jest dość liberalnym politykiem związanym z PO, co nie jest typowe dla tego regionu. Teraz, gdy walki przygasają, a sytuacja zdaje się stabilizować, nowy reżim będzie musiał zdecydować o dalszym kierunku działań."
unification.11.a: "Migoczące światełko w Lublinie?"

super.11.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.11.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.11.a: "Wreszcie zjednoczeni."

 
 ##Characters##
POLITICS_KRZYSZTOF_ZUK_DESC: "Gdy chaos i anarchia rozlewały się po całej Polsce, początkowo wydawało się, że Lublin ma szansę pozostać względnie bezpiecznym i stabilnym miastem. Krzysztof Żuk, który sprawuje urząd prezydenta miasta nieprzerwanie od 2010 roku, zdołał zgromadzić wystarczające poparcie, by utrzymać władzę podczas pierwszej fali powszechnych, brutalnych zamieszek. Wkrótce stał się powszechnie uznawanym symbolem jedności, stabilności i umiaru dla ludzi o najróżniejszych poglądach politycznych. Przez kilka tygodni wydawało się, że sytuacja nie jest aż tak zła, jak mogłaby być.\n\nNiestety, nie trwało to długo. Nowo powstała regionalna potęga prawicy, Front Narodowy, zdołała w końcu obalić Żuka i zmusić go do ucieczki z miasta. Udał się na wschód, poza obszar kontrolowany przez Front, i dotarł do Krasnegostawu - miasta, w którym się urodził. Tam postanowił, że jego walka jeszcze się nie skończyła.\n\nChoć sytuacja była rozpaczliwa, nie został sam. Z Lublina wypędzono wraz z nim większość jego lokalnej administracji, a wkrótce potem nawiązał kontakt z wieloma jej członkami i założył organizację, której celem było odbicie miasta i położenie kresu tyranii nacjonalistów. Dołączyły do niego setki lojalnych lublinian, a ich liczba stale rosła w miarę jak Żuk umacniał swoje wpływy w ogarniętej anarchią wschodniej Lubelszczyźnie, obiecując wolność i stabilność wszystkim mieszkańcom ziem kontrolowanych przez jego stronnictwo. Udało mu się nawet zdobyć Chełm - drugie co do wielkości miasto województwa - i tam przenieść siedzibę nowego rządu.\n\nTymczasem, gdy potęga Żuka rosła, Front osłabiały wewnętrzne konflikty, osobiste ambicje jego przywódców i niepokoje społeczne. W końcu krótkotrwały sojusz żądnych władzy założycieli nieuchronnie się rozpadł, a Front rozbił się na kilka słabych frakcji i częściowo padł ofiarą anarchistycznego powstania. Być może nie jesteśmy jeszcze gotowi, by odbić nasze miasto i uwolnić ludzi od tyranii, ale ten dzień zbliża się wielkimi krokami. Miejmy nadzieję, że wkrótce wszystko znów zacznie przypominać normalność."



 ##Decisions##
ZUK_moves_capital_to_lublin: "Przenosi stolicę do §YLublina§!."
ZUK_regional_unification: "Zjednocz województwo lubelskie"
