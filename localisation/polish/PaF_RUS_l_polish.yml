kacap.1.t: "Wieści ze wschodu"
kacap.1.desc: "W upadłej Polsce trudno zdobyć informacje o sytuacji politycznej za granicą. Pomijając rzadko działający i niestabilny internet, kraj jest odcięty od zagranicznych mediów i wiadomości z zewnątrz. Od czasu do czasu generatory w siedzibie TVP mają jednak wystarczająco dużo mocy, by umożliwić przekazywanie prostych komunikatów za pośrednictwem programów telewizyjnych. Choć zdarza się to niezwykle rzadko, czasami jakiemuś telewizyjnemu zapaleńcowi udaje się nagrać najnowsze wydanie \"Wiadomości\" na dekoderze. Później płyty CD krążą między znajomymi i rodziną, docierając do najdalszych zakątków kraju. W końcu jedna z nich, już po raz n-ty, trafia na próg Jana Kowalskiego, z dwudniowym opóźnieniem. Jakość nie zachwyca, a większość danych przepadła już przy piątej lub szóstej kopii płyty.\nMimo to jedna część wiadomości z zagranicy, ta, która rzeczywiście interesowała Jana, zdołała przetrwać."
kacap.1.a: "Czekaj, że co się stało?"

kacap.2.t: "[GetNewspaper]Impas w Moskwie"
kacap.2.desc: "Nowy pakiet przepisów antykorupcyjnych zaproponowany przez Nawalnego został właśnie przyjęty przez Dumę, a najważniejsi gracze w Rosji NIE przyjęli tego zbyt dobrze.\nJak się twierdzi, nowe przepisy mają zapewnić prezydentowi narzędzia niezbędne do kontrolowania poszczególnych jednostek podległych skarbowi państwa, aby móc badać nadużycia i stanowczo z nimi walczyć. Zapytany w wywiadzie, który z organów państwowych zostanie objęty kontrolą jako pierwszy, Nawalny odpowiedział krótko. - \"Rosgwardią\".\nGenerał Zołotow - dowódca Rosgwardii - szybko odpowiedział prezydentowi za pośrednictwem mediów, a jego wypowiedź ujawniła skalę niezadowolenia narastającego wśród osób zarządzających poszczególnymi sektorami rosyjskiego państwa. Gdy coraz więcej wpływowych osobistości rosyjskiego rządu zaczęło popierać zarzuty Zołotowa, sekretarze Nawalnego zaczęli załamywać ręce na widok rosnącej liczby nazwisk, które należało wykreślić z dokumentów rządowych."
kacap.2.a: "Krucjata Nawalnego się rozpoczyna"

kacap.7.t: "[GetNewspaper]Lojaliści Nawalnego stabilizują państwo Rosyjskie!"
kacap.7.desc: "Po latach brutalnych walk rosyjska wojna domowa wreszcie dobiegła końca. W okrutnym zrządzeniu losu okazuje się, że wszystkie ofiary i zniszczenia, jakie spadły na ten kraj, poszły na marne, gdyż rząd Nawalnego ponownie przejął nad nim pełną kontrolę. Nawalny został opuszczony przez najpotężniejszych sojuszników i zmuszony do ucieczki ze stolicy w następstwie kryzysu Rosgwardii. Prezydent zdołał jednak wykorzystać wierne sobie bataliony i przechytrzyć skłóconą opozycję, stopniowo osłabiając jej siły, aż ostatni płomień buntu wreszcie zgasł. Konflikt okazał się idealną okazją do rozprawienia się z wszelkimi przejawami wewnętrznego sprzeciwu wobec Nawalnego, przez co w Rosji nie pozostał już nikt, kto mógłby zakwestionować jego władzę. Duma już teraz przyjmuje szeroko zakrojone reformy niemal jednogłośnie, znosząc ograniczenia władzy prezydenckiej. A pogłoski głoszą, że to dopiero początek."
kacap.7.a: "Droga do absolutnej władzy stoi otworem"

kacap.8.t: "[GetNewspaper]Żelazny Dima przejmuje władzę w Rosji!"
kacap.8.desc: "Przez ponad dwadzieścia lat putinizm trzymał Rosję w kajdanach a jego ideologia przenikała do samego rdzenia narodu nawet po obaleniu jej twórcy. Pomimo wszelkich starań Nawalnego kilka lat u władzy nie mogło wystarczyć, by zdusić poparcie jakim były prezydent wciąż cieszył się zarówno wśród elit, jak i zwykłych ludzi. Zaślepiony własną pychą samozwańczy car nie dostrzegł, że do obalenia jego reżimu wystarczy jedna iskra - a sam wykrzesał ją swoim nierozważnym dążeniem do konsolidacji władzy. Gdy Putin był zajęty w Kaliningradzie, przywództwo nad rewolucją przypadło Dmitrijowi Miedwiediewowi, który wykorzystał przytłaczające poparcie jakim się cieszył, by stopniowo osaczyć Nawalnego i ostatecznie doprowadzić do jego klęski. Teraz, gdy Miedwiediew ponownie zasiadł na Kremlu tym razem naprawdę dowiódł, że zasługuje na swoje stanowisko. Pozostaje pytanie, czy nadal będzie wiernym pieskiem swojego pana, czy też ambicje nowego prezydenta skłonią go do przebudowania Rosji według własnej wizji."
kacap.8.a: "Wygnaniec powraca na swój tron."

kacap.9.t: "[GetNewspaper]Rosgwardia Zołotowa przejmuje władzę w Rosji!"
kacap.9.desc: "Rosyjska wojna domowa wreszcie dobiegła końca, a zakończył ją ten sam człowiek, który przed laty zapoczątkował cały konflikt. Spośród wszystkich frakcji walczących o władzę w kraju to właśnie Rosgwardia Wiktora Zołotowa wyszła z niego zwycięsko. Początkowe starcie jej oddziałów z siłami Nawalnego stało się iskrą, która rozpaliła ogólnokrajowy bunt, a lojalność tej formacji szybko stała się przedmiotem rywalizacji głównych uczestników konfliktu. Ostatecznie Miedwiediew zdołał przeciągnąć ją na swoją stronę, choć za cenę ogromnych wpływów Zołotowa. To właśnie miało doprowadzić do upadku byłego prezydenta, gdyż tuż przed ostatecznym zwycięstwem wcześniej słabo radząca sobie Rosgwardia obaliła go w krwawym zamachu stanu. Po całej karierze spędzonej na przytakiwaniu przełożonym Zołotow nagle znalazł się na czele największego państwa świata, pogrążonego w największym kryzysie od niemal stulecia. Cud będzie jednak mu potrzebny by utrzymał się na tym tronie przez dłuższy czas."
kacap.9.a: "Przyszłość Rosji wciąż maluje się ponuro, a jedyna szansa na rewolucję została zaprzepaszczona."

kacap.10.t: "[GetNewspaper]Armia Szojgu przywraca porządek w Rosji!"
kacap.10.desc: "W Rosji powoli powraca normalność. Odgłosy strzałów, nieustannie rozbrzmiewające od początku wojny domowej, wreszcie cichną. Ku wielkiemu niezadowoleniu miejskich elit Moskwy i Petersburga nowym panem kraju okazuje się nie żaden z finansowanych przez nie pretendentów, lecz zdobywca pochodzący z odludnych ziem Tuwy. Ocalony od najcięższych walk w początkowych dniach konfliktu Siergiej Szojgu mógł swobodnie gromadzić siły na peryferiach kraju. Cierpliwie czekał na odpowiedni moment do ataku, a gdy siły rządowe były już wyczerpane, jego armia ruszyła ze stepów, rozbijając niedobitki przeciwników. Teraz, gdy sprawuje już niepodzielną władzę nad Rosją, generał ogłosił tymczasowe zawieszenie procesu demokratycznego w celu ustabilizowania sytuacji w kraju. To, czy kiedykolwiek zamierza go przywrócić, pozostaje wysoce wątpliwe."
kacap.10.a: "Pokój niesiony na bagnetach."

kacap.11.t: "[GetNewspaper]Armia Dugina idzie po Eurazję!"
kacap.11.desc: "Świat zachodni drży w posadach. Wieści o ponownym zjednoczeniu Rosji powoli przedostają się przez nieliczne źródła informacji pozostałe w rozdartym wojną kraju. W całej Europie widzowie z przerażeniem obserwowali, jak Aleksandr Dugin, stojąc przed dziesiątkami tysięcy ludzi zgromadzonych na Placu Czerwonym, ogłasza nową erę w dziejach Rosji - erę \"chwalebnej walki z egzystencjalnym zagrożeniem atlantyzmu\". Początkowo deklarując lojalność wobec Miedwiediewa i stając się jednym z jej najgorliwszych zwolenników, Dugin wykorzystał swoją wysoką pozycję, by zdobyć wpływy w najwyższych kręgach władzy, aż w końcu przejął ją w wyniku zamachu stanu przeciwko prezydentowi. Wprowadzając w życie swoje teorie prawdziwego państwa paneurazjatyckiego, pisarz przekształcił samą tożsamość Rosji, dążąc do odcięcia jej od wpływów Zachodu. Teraz, gdy deklarowany przez Dugina cel całkowitego unicestwienia amerykańskiej hegemonii wspiera największy arsenał nuklearny świata, pozostaje mieć nadzieję, że nie zmierzamy prosto ku Armagedonowi."
kacap.11.a: "DEFCON wzrasta o dwa poziomy, dalsze działania w gotowości."

kacap.12.t: "[GetNewspaper]Komuniści wygrywają drugą rosyjską wojnę domową"
kacap.12.desc: "Historia naprawdę lubi się powtarzać. Rosja, nieustannie odrzucając możliwość stabilizacji, ponownie pogrążyła się w wojnie domowej i jakby zgodnie z wyrokiem przeznaczenia, po raz kolejny wychodzi z niej czerwona. Czerwony Front, utworzony jako koalicja umiarkowanych socjalistów i twardogłowych komunistów, przejął pełną kontrolę nad krajem. Zdołał zdobyć poparcie zaniedbanych regionów wiejskich oraz uciśnionej ludności, obiecując powrót do radzieckiego dobrobytu, a następnie przekształcił je w ruch masowy, który ostatecznie rozgromił siły rządowe. Pozornie - Rosja świętuje, a fajerwerki rozświetlają nocne niebo nad Moskwą. W kraju jednak nie wszystko jest dobrze, gdyż różnice ideologiczne dotyczące samej natury nowego państwa grożą rozerwaniem kruchego sojuszu i ponownym rozbiciem narodu zaledwie kilka tygodni po jego zjednoczeniu."
kacap.12.a: "Czy porażki Związku zostaną pomszczone?"

kacap.13.t: "[GetNewspaper]Kadyrowcy ogłaszają powstanie \"Nowej Rosji\""
kacap.13.desc: "Najnowsze doniesienia napływające z Rosji wciąż wprawiają w osłupienie zarówno ekspertów politycznych, jak i wojskowych. Ramzan Kadyrow, który na niemal każdym etapie wojny przekraczał wszelkie przewidywania, w końcu wkracza na Kreml jako niekwestionowany władca Rosji. Początkowo spodziewano się, że wykorzysta chaos ogarniający kraj jedynie do zabezpieczenia niepodległości Czeczenii. Jednak widok jego elitarnej gwardii rozbijającej w niemal każdym starciu niewyszkolonych poborowych z brygad obrony terytorialnej Nawalnego ośmielił przywódcę do podporządkowywania sobie coraz rozleglejszych obszarów, aż w końcu, gdy miesiące nieustannych walk wyczerpały pozostałych pretendentów, cała Rosja znalazła się w uścisku Kadyrowa. Dziś święci on triumf, lecz wciąż pozostaje pytanie, czy głęboko prawosławna ludność zaakceptuje nowego suwerena, czy też wkrótce zmusi go do porzucenia podbojów i powrotu do Czeczenii w obawie przed jej gniewem."
kacap.13.a: "Chowajcie kobiety i kozy - Czeczeni idą!"

kacap.14.t: "[GetNewspaper]Służby Bezpieczeństwa \"pacyfikują\" Rosję!"
kacap.14.desc: "Po raz pierwszy od lat Rosja zaznaje pokoju, a kraj jednoczy nieoczekiwany kandydat - Aleksiej Bortnikow z FSB. Choć formalnie podległa prezydentowi, formacja porzuciła przysięgę wierności w następstwie nadużyć władzy przez Nawalnego i przejęła Kreml, zmuszając dyktatora do ucieczki ze stolicy. Spodziewano się, że służby opowiedzą się po stronie jednego z głównych uczestników konfliktu, lecz FSB postanowiło walczyć o własną chwałę, wykorzystując przytłaczające zasoby i możliwości produkcyjne Moskwy do stopniowego podporządkowania sobie pozostałych frakcji. Po kapitulacji ostatnich punktów oporu Bortnikow ogłosił przedłużenie swoich nadzwyczajnych uprawnień i utworzenie \"Republiki Tymczasowej\", która ma istnieć do czasu przywrócenia stabilności w rozdartym wojną kraju. Na razie dzień ten pozostaje jednak bardzo odległy, gdyż protesty wciąż ogarniają największe rosyjskie miasta."
kacap.14.a: "Niepokoje trwają, a przywódcy nie są w stanie ich powstrzymać"

kacap.15.t: "[GetNewspaper]Moskwa otoczona"
kacap.15.desc: "Pakiet przepisów antykorupcyjnych Nawalnego, często nazywany przez opozycję \"Pakietem Carskim\", wciąż zbiera żniwo wśród szeregach Rosgwardii, usuwając kolejnych ludzi ze stanowisk na prawo i lewo. Tymczasem dotarły do nas pilne doniesienia o zbuntowanej brygadzie Rosgwardii, która szturmem przeszła przez Moskwę.\nNikt nie wie dokładnie, co dzieje się w mieście, gdyż wydarzenia przebiegają w niezwykle chaotyczny sposób i wciąż trwają. Świadkowie donoszą jednak, że Rosgwardia przejęła kontrolę nad głównymi szlakami komunikacyjnymi w Moskwie. Ponadto w rejonie Kitaj-Gorodu słychać było intensywną wymianę ognia między oddziałami Rosgwardii a lokalnymi milicjantami. Jedni twierdzą, że to zamach stanu, inni, że kontrzamach, lecz po wprowadzeniu nagłej blokady łączności pewne jest tylko jedno - Nawalny nie wyprowadzi Rosji z tyranii bezboleśnie. Będzie krwawo."
kacap.15.a: "Przypomnijcie im, jak skończył się pucz sierpniowy."

kacap.16.t: "[GetNewspaper]Święta Wojna"
kacap.16.desc: "Główny tiktoker Czeczenii i jej \"ukochany\" przywódca, Ramzan Kadyrow, opublikował niedawno na swoim koncie nagranie, w którym mówi o \"wyrzeczeniu się lojalności wobec rządu federalnego i rozpoczęciu operacji w Dagestanie\", ogłaszając dżihad u boku muftiego Czeczenii. We wczesnych godzinach porannych w internecie pojawiły się nagrania z kamer monitoringu w dagestańskim Chasawjurcie. Widać na nich ludzi Kadyrowa wyruszających w kierunku Machaczkały, stolicy regionu. Wygląda jednak na to, że chaos panujący w Rosji ośmielił Kadyrowa do sięgnięcia jeszcze dalej, być może z zamiarem podporządkowania sobie całego Kaukazu. A kto wie... może odważy się nawet ruszyć na Moskwę, by sięgnąć po przywództwo. W Rosji już teraz żyje wielu muzułmanów, ale czy odpowiedzą na wezwanie samozwańczego watażki, który nie potrafił nawet przebić się przez ukraińskie wojska?"
kacap.16.a: "Matuszka Niedźwiedzica nie żyje, a jej młode walczą o kawałki jej truchła..."

kacap.17.t: "[GetNewspaper]Czerwony Świt"
kacap.17.desc: "Na dalekowschodnich krańcach Federacji Rosyjskiej świadkowie donoszą o zrywaniu rosyjskich flag z budynków i zastępowaniu ich flagami... dawnego Związku Radzieckiego. Dziś dokładnie o 12:37 przed siedzibą rady miejskiej, Ziuganow proklamował Ludową Socjalistyczną Republikę Dalekiego Wschodu.\nPodczas gdy większość niezależnych obserwatorów międzynarodowych przyjęła tę deklarację obojętnie, spodziewając się pojawienia komunistycznego rządu w Rosji, państwa zachodnie wyraziły zaniepokojenie możliwym powrotem Sowietów, a Wietnam i Korea Północna poparły proklamację. Lokalne władze wraz z \"lojalistami\" Nawalnego ewakuowały się do Chabarowska, skąd najprawdopodobniej udadzą się dalej na zachód. W międzyczasie rosyjski prezydent zwrócił się do narodu z oblężonej Moskwy, ogłaszając stan wojenny na terenie całej Rosji."
kacap.17.a: "Tak upadają imperia: kawałek po kawałku."

kacap.18.t: "[GetNewspaper]Syn Nieśmiertelnych Ośnieżonych Szczytów"
kacap.18.desc: "Czy na mapie Azji trzeba będzie zaznaczyć kolejne państwo? Wczesnym rankiem Siergiej Szojgu, minister obrony narodowej, przyleciał do Kyzyłu wraz ze znaczną częścią swojego sztabu. W przemówieniu generał, sam będący Tuwańczykiem, stwierdził, że \"musi zapewnić bezpieczeństwo Tuwańczykom w tych trudnych czasach\". Świadkowie donoszą, że wraz z Szojgu i jego sztabem z Ułan Ude przybyła 11. Gwardyjska Brygada Desantowo-Szturmowa, która ma stanowić trzon armii tuwańskiej. Ponadto kamery na moskiewskim lotnisku Szeremietiewo zarejestrowały załadunek dużych skrzyń na samolot generała Szojgu. Rząd Federacji Rosyjskiej oskarżył więc generała o kradzież około 30 ton rezerw złota z Banku Centralnego. Ale poza Tuwą, Szojgu zdaje się chcieć zdobyć inny szczyt - skonsolidować pozostałości armii rosyjskiej i odbić cały kraj siłą i potęgą swojego autorytetu. A żołnierze rosyjscy są bardziej niż zadowoleni mogąc służyć pod nim."
kacap.18.a: "Nie chodzi jednak o złoto. Chodzi o Czerwony Guzik."

kacap.19.t: "[GetNewspaper]Duch Kremla"
kacap.19.desc: "Moskwa bez prezydenta? Około 3:00 nad ranem Aleksiej Nawalny zniknął z Kremla. Kamery w pobliskim hotelu zarejestrowały, jak wsiada do nieoznakowanej wojskowej ciężarówki eskortowanej przez żołnierzy, która następnie niezauważenie przejechała przez punkty kontrolne Rosgwardii i skierowała się do Petersburga. O 7:42 prezydent Nawalny wygłosił swoje najnowsze orędzie z nieznanej dotąd lokalizacji, mówiąc o konieczności ucieczki z Moskwy i wskazując jako powód groźby zamachu na jego życie ze strony FSB. W internecie krąży również nagranie przedstawiające Bortnikowa wkraczającego na Kreml w towarzystwie plutonu uzbrojonych funkcjonariuszy. Na ulicach stolicy panuje upiorna cisza, od czasu do czasu przerywana odgłosami strzałów. Kto do kogo strzela? To się dopiero okaże. Kto wygrywa? Nikt nie potrafi powiedzieć. Wiadomo jednak, że Służby Bezpieczeństwa oficjalnie przystąpiły do rosyjskiej wojny domowej."
kacap.19.a: "Kto będzie kolejnym pretendentem?"

kacap.20.t: "[GetNewspaper]Echa przeszłości"
kacap.20.desc: "Zaginiony od upadku dyktatury Putina i uznany za zmarłego Dmitrij Miedwiediew pojawił się ponownie w Petersburgu, przejmując kontrolę nad lokalnymi władzami. W płomiennym przemówieniu do narodu były prezydent uznał reżim Nawalnego za nielegalny, wzywając wszystkich rosyjskich patriotów, by stanęli u jego boku i wreszcie pociągnęli zdrajcę do odpowiedzialności. Miedwiediew zdołał już zapewnić sobie lojalność wielu dawnych sojuszników Putina, w tym Rosgwardii Wiktora Zołotowa i eurazjanistycznych bojówek Aleksandra Dugina. Według doniesień siły Miedwiediewa dorównują liczebnością oddziałom lojalistów. Wraz z przejściem dwóch największych miast kraju w ręce rewolucjonistów rząd Nawalnego wisi na włosku, a sam przywódca gorączkowo próbuje zorganizować odpowiedź ze swojej nowej siedziby w Wołgogradzie."
kacap.20.a: "Teraz wystarczy już tylko jedna iskra"



##Decisions##
