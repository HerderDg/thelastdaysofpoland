##Characters##
POLITICS_RED_RABBI_DESC: "Gdybyś w 2025 roku zapytał losowego Widzewiaka co sądzi na temat Żydów, najprawdopodobniej otrzymałbyś najbardziej brutalną antysemicką wypowiedź jaką tylko możesz sobie wyobrazić. Gdyby nie doszło do Oblężenia Widzewa, prawdopodobnie opinia ta by się nie zmieniła.\n\nPrzywódca ultrasów Widzewa, obecnie nazywany przez swoich ludzi 'Rabinem', już od czasów dzieciństwa brał czynny udział w religijnych praktykach, ale dopiero gdy był prawie dorosłym nastolatkiem poczęło się w nim budzić *prawdziwe*, religijne powołanie. Jako dziecko był ministrantem i dobrowolnie uczęszczał na lekcje religii w szkole, dzięki czemu Rabin stał się wszystkim czego oczekiwano po Polaku-katoliku - człowiekiem oczytanym w Biblii i ręcznym rzemiośle, oddanym konserwatywnym wartościom i przewodzącym ultrasom Widzewa na ustawkach. Jak każdy szanujący się Widzewiak, w tamtych czasach był również mocno antysemicki - głównie ze względu na popularne docinki ze strony przeciwnych klubów o tym, że wszyscy Widzewiacy to potomkowie Łódzkich Żydów, których wybito podczas Drugiej Wojny światowej. Gdy nastał kryzys wyborczy i następujący po nim Upadek, te animozje tylko nabrały na sile - jako że pozostali Żydzewiacy, głównie socjaliści - byli oczywistym kozłem ofiarnym a wraz z topnieniem władzy centralnej, głównym organem sądownictwa stały się samosądy.\n\nCo dla ŁKSiarzy było jak wczesne święta.\n\nW trakcie kompletnego chaous jaki ogarnął miasto Łódź, ultrasi ŁKSu zorganizowali się w prowizoryczną bojówkę która miała rozprawić się ze wszystkimi komuchami, Żydami i wszystkimi innymi wrogami raz na zawsze. Sześć miesięcy później, Widzew mimo wszystko pozostał niezdobyty. Obrona dzielnicy, zorganizowana przez Żydów Widzewskich zmuszona była do współpracy byle tylko przeżyć. I to okazało się wystarczająco by ŁKS nie przebił się przez obronę Widzewa. Wykorzystano to natychmiast, przeprowadzając kontratak na osłabione linie ŁKSiarzy, podczas którego to jeńcy z ŁKSu byli prześmiewczo nawracani na Judaizm przed egzekucją. Po tej akcji jednak, sojusz Widzewski utrzymał się przy życiu. Pomimo, że Widzewiakom daleko było do bycia prawdziwymi, wyedukowanymi Żydami, ich więź żydowska została wzmocniona, a komuniści i socjaliści na czele z Jerzym Urbanem i Rabinem wywiedli ich z ziemii Łódzkiej, z domu niewoli.\n\nNie sposób nie zauważyć że obecnemu państwu ultrasów tak bardzo brakuje subtelności jak i napletków. Ich szaliki zostały obleczone w gwiazdy Dawida, a zamiast przyśpiewek kibolskich dominują żydowskie psalmy.\nJednakże gdziekolwiek nie pójdą i z kimkolwiek nie będą walczyć - hymn Widzewa zawsze będzie grał"

POLITICS_JERZY_URBAN_DESC: "Jerzy Urban to człowiek urodzony w Polsce, w czasach bardzo niespokojnych dla Żydów gdy został zmuszony do ukrywania się wraz ze swoją rodziną. Teraz, niespokojne czasy wracają dla wszystkich jego rodaków. Urban nie otrzymał odpowiedniej edukacji przed końcem Drugiej Wojny Światowej, a nawet po jej zakończeniu, próżno go było szukać na uniwersytecie. Pomimo tych przeszkód, szybko rozpoczął karierę dziennikarską, pisząc dla rządowych gazet. Mimo to, często i ostro krytykował polityki rządowe, co jednak doprowadziło go na sam szczyt. W 1981 roku został rzecznikiem prasowym rządu i był odpowiedzialnym za propagandę za czasów niesławnego rządu generała Jaruzelskiego, zyskując przydomek 'Goebbelsa Stanu Wojennego'. Po upadku komunizmu, został członkiem różnych partii lewicowych jak SdRP czy SLD, a wkrótce i znaną postacią medialną i internetową, popularną wśród młodzieży. Był on również dość zamożny, będąc dziewięćdziesiątym-ósmym najbogatszym polakiem w 2004 roku, dzięki inwestycjom giełdowym. Umiejętności politycznego lawirowania i sprytnego siania propagandy sprawiły że udało mu się przetrwać kolejny upadek Polskiego państwa. Gdy bitewny kurz opadł w mieście Łodzi, został zaproszony do tworzenia struktur w rządzie Widzewskim, którzy byli bardzo zdesperowani by znaleźć jakiegokolwiek Żyda do swojego aparatu państwowego."

