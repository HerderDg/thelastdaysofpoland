ZYD_meeting_desc: "Rabbi wciąż stoi na Tomaszowskim Kominie. Dookoła zebrały się tłumy czekając na rozwój wydarzeń. Nikt nie wie co planuje Jahwe lecz burza która zbiera się nad naszymi głowami i dziesiątki błyskawic zbliżających się z każdą chwilą napawają niepokojem. Rabbi jednak z kamienna twarzą czeka na to co przyniesie przyszłość. Pozostaje mieć nadzieję, że Jahwe okaże się łaskawy."

ZYD_sanhedryn_desc: "Rabbi zszedł z komina odmieniony. Nie je, nie pije, nie wypowiedział przez wiele dni ani jednego słowa. Wielu z nas zaczęło się już martwić, nie wiedząc co może to oznaczać. Dziś jednak krzyknął, nie odrywając swojego pustego wzroku od nieba - iż natychmiast ma się zebrać rada mędrców. Ma im coś ważnego do powiedzenia."

ZYD_rabbi_is_dead_desc: "Niewiarygodne. Aż trudno uwierzyć w taki zbieg okoliczności. Ostatnia osoba która stała na straży reakcjonizmu leży bez życia pod Tomaszowskim Kominem. ŻOMO i WSW już otrzymują tajne rozkazy. Czas zakończyć ten \"Taktyczny Sojusz\"."

ZYD_seven_miracles_desc: "Niebo stało się czarne choć na ziemi jest jasno, kije widzewiaków puściły pędy, które wkrótce stwardniały, czyniąc kije kolczastymi. Mimo, że nie było chmur spadł deszcz o barwie karmazynu, ludzie zbierając go do beczek na deszczówkę, odkryli, że to Kadarka. Na ziemi obok źdźbeł trawy pojawił się biały pył. Sztachając się nim Widzewiacy poczuli ogromny przypływ sił. Z Arki Przymierza zaczęła samoistnie odpadać rdza, a spod niej wyłoniła się nietknięta przez czas, niewyszpachlowana karoseria. Na granicy naszych włości w tereny wroga zaczęły uderzać pioruny wzniecając pożary. Rabbi mimio iż zerwał się potężny wiatr w Tomaszowie, wspiął się ponownie na komin, dzierżąc sztandar przymierza oraz pierwotny kij w swoich rękach. Jego głos niesie się mimo straszliwego huku. Pierwsi i drudzy przybysze, widzewiacy i frajerzy, wszyscy zbierają się zdumieni pod Wieżą Przymierza. Wszyscy czekają na słowa Rabbiego..."

ZYD_revenge_on_coal_desc: "Całe to zamieszanie sprawiło, że nie zdążyliśmy wysłać kolejnej transzy surowców do Bractwa Węgla. Nasz przemysł praktycznie stanął. Czy można sobie wyobrazić lepszą sytuację do rozpoczęcia Wojny o Ojczyznę? Każdy kto śmie zadrwić z Ludu Jahwe musi poznać gniew Lewiatana który drzemie w naszych sercach. Teraz to my będziemy pobierać trybuty od niewiernych. Tag Widzewa niedługo załopocze nad kominami Bełchatowa."

ZYD_challenge_of_strength_desc: "Powiadają, że w lasach na zachodzie pojawił żyje lud dziki i gwałtowny, pełen młodzieńczej werwy i agresji. Jeżeli mamy budzić szacunek wśród Frajerów musimy im uzmysłowić, że nikt nigdy nam nie dorówna - nikt nie pokona w walce Dzieci Izraela. Tylko my jesteśmy dość godni, a nasze postawy dość czyste aby ich kroić."

ZYD_new_synagogues_and_stadiums_desc: "Tam gdzie stała nasza stopa tam musi istnieć coś co jej ślad utrwali i powiększy. Domy modlitwy, a zaraz obok nich nowo budowane stadiony są podstawą naszej obecności na każdym terenie. Pierwsze aby wzmocnić ducha, przypominając o przykładzie naszych przodków a drugie aby dorównać naszym obecnym, najważniejszym wojownikom. Dodatkowo ich złote kopuły błyszczą się tak, że aż niewierni muszą odwracać wzrok."

ZYD_blooming_business_desc: "Na północy doskonale rozwija się biznes śmierci. Zyski rodu Skrzydlewskich i innych organizacji przekraczają najśmielsze przypuszczenia. Nie da się ukryć, że Jahwe dał im  wiele a jeszcze więcej udało im się z tego wymnożyć. Jednego jednak Jahwe im nie dał: Przymierza. Wciąż są zwykłymi frajerami. Bardzo zamożnymi Frajerami. Czas im o tym przypomnieć..."

ZYD_last_obstacle_desc: "Przed kilkoma dniami doszło do dziwnego wydarzenia. Kilku naszych znamienitych i wiekowych rabinów podróżujących w celach handlowych na północ zostało napadniętych przez bandę przebierańców w farbowanych na rudo włosach i posiadających pokaźne brody. Kiedy odmówili spożycia podejrzanego trunku który został im zaoferowany, zwzywano ich od \"Zdrajców Rasy (Krasnoludzkiej)\" i zaatakowano młotkami oraz siekierami. Ledwo uciekli. Ten incydent nie może pozostać niezauważony, choć odwraca naszą uwagę od głównego celu wyprawy."

ZYD_central_committee_meeting_desc: "W całym Tomaszowie panuje potężny chaos. Frajerzy się burzą: biją na ulicach rabbich oraz widzewiaków, wyciągają ich ze wszystkich, nawet najbardziej obskurnych zakamarków i dokonują samosądów. Śmierć Rabbiego okazała się iskrą na którą potulni zazwyczaj frajerzy zareagowali wybuchem. Względny porządek panuje jedynie w okolicach dworca gdzie mieszane widzewsko-robotnicze milicje ukrócają podobne rozruchy z zarodku. W stronę budynku raz po raz podjeżdżają przerobione na limuzyny Ople Insignie oraz Mercedesy w124. Wychodzący z nich jegomoście w kremowych garniturach wbiegają do środka gdzie tow. Kibic nakazał zwołać komitet centralny PŻPR. Już niedługo okaże się co takiego przygotowują. Ludność frajerska coraz bardziej widzi w nich gwarancję zniszczenia dawnego porządku..."

ZYD_miners_liberation_desc: "Na naszych oczach doszło do opanowania umysłów Bełchatowian przez chmurę węglowego pyłu. O ile nie możemy kwestionować zbawiennego wpływu dostarczania prądu dla naszego państwa o tyle nie godzi się aby jego wytwórcy żyli pod butem odzianych w habity szaleńców. Powinni pracować w delikatnej, kojącej nerwy i wprawiającej w ekstatyczny nastrój czerwonej mgiełce. Pod czerwonym sztandarem..."

ZYD_fifth_generation_of_ak_desc: "Który to już raz kiedy musimy się użerać z polskimi marzycielami? Ile to już lat musimy radzić sobie z ich wynaturzeniami? Przetrwali wszystkie czystki, wtapiają się w społeczeństwo i zatruwają je od środka. Musimy położyć temu kres. Nigdy już więcej chłopiec w zabawkowym mundurze nie ośmieli się podnieść ręki na Dzielnego Milicjanta, Pracowitego Proletariusza, Czujnego UB-eka czy Żyda w Kremowym Garniturze."

ZYD_recruit_collaborators_desc: "Przydało by się nam parę dodatkowych osób, żeby patrzyli innym na ręce. Każdy nowy obywatel Ludowej Republiki Polin jest potencjalnym wywrotowcem. A dzięki takim inicjatywom będziemy mieć pewność, że proletariusze mogą spać spokojnie gdyż ich interes pozostaje niezagrożony. Chętnych będzie z pewnością wielu, zwłaszcza zaraz po wysłaniu w rejon oddziału ŻOMO."

ZYD_rotten_capitalism_desc: "Pierwszy Sekretarz z racji swego gołębiego serca lubi kiedy komuś się powodzi. Rozumie doskonale, że wolny rynek potrafi być nie tylko źródłem ogromnych dochodów ale i niezwykłych emocji. Sam w końcu w pewnym okresie swojego życia z przymusu inwestował w Forda. Ale w przeciwieństwie do wielu innych domorosłych Rockefellerów nie martwił się o konkurencję. Wiedział, że nie ma sobie równych. Nint przecież nie jest w stanie wygrać z awangardą proletariatu. I to właśnie muszą sobie uzmysłowić Krośniewiccy kapitaliści."

ZYD_slavic_reactionism_desc: "Pierwszy Sekretarz PŻPR lubi w wolnych chwilach poczytać sobie coś niezobowiązującego. Stąd też miał przyjemność zapoznać się z ciętym piórem innego Łodzianina. I tu pojawił się dylemat. Jak traktować państwo, monarchię na dodatek, zrodzoną z pastiszu i satyry na zbiorową histerię wokół Jarej Śmietany, Hożego Swaroga i Krasego Tylnego Lica Płotki? Kibic myślał, dumał i po chwili już wiedział - jako żart. I wysłał wojsko na granicę."

ZYD_promised_land_desc: "Długośmy na ten dzień czekali, z  nadzieją niecierpliwą w duszy. Nasz Dom, Nasze Kanaan widać już wyłaniające się zza horyzontu. Wielka Łódż. Wielki Widzew. Ojczyzna Pracy. Ojczyzna Naszego Ludu. Nawet ci najtwardsi z nas nie są w stanie ukryć wzruszenia... Nie, kiedy uwierzyli, że znów będą mogli przejść się w cieniu Kamieniec... naszych Kamienic..."

ZYD_allija_desc: "Zwyciężyliśmy. Odzyskaliśmy Ziemię Obiecaną. Nasze własne Eretz Yisrael. Najważniejszej z micw w całej Halasze. By żyć na Ziemii Obiecanej. Starym Widzewie. W końcu możemy świętować nasze Yom HaAliyah. Nawet najtwardsi z naszych ludzi uronili łzy szczęścia. I tak o to odkupieni ludzie Pana powrócili, i wrócili do Łodzi z pieśnią i nieustannym szczęściem w swoich sercach, a radość wypełniła ich dusze, całkowicie przepędzając smutki i westchnienia."

 ##Events##
zydzew.1.t: "Księga Rodzaju"
zydzew.1.desc: "Yahweh looked at Canaan in the North and said:\n- "Great are the crimes of the nation with whom I once established a covenant. Dust has covered the old trophies, the last witnesses of the old glory."\n\nYahweh then looked at New Jerusalem and said:\n- "Great is the corruption which has struck the promised land. Green paper and gold calves are worshiped in my place. Jerusalem has become akin to Sodom. The Israelites of the Widzew family fraternize with the loser Jebusites of the Śródmieście family. My people have forgotten the terms of the covenant. They eat from one bowl, and drink from one can as one, with those who do not know my name. There is not one righteous among them."\n\nThen Yahweh looked at the chiefs of the Widzew house and said:\n- "Where are the rulers of old who praised my name? Where is the Word left pure, free from lies and greed? They have sold themselves. There is not one righteous among them."\n\nThen he looked at the warriors of Yahweh.\n- "Great is the weakness of my people. No one of its members is in the front line of Widzew's warriors. And there I see unworthy strangers, eleven enemies of the tribe with whom I made a covenant. The only believe in gold. In gold and nothing more. There is not one righteous among them."\n\nGreat was Yahweh's anger. He said then:\n- "I say: It will be seven days and seven nights before the rain of flames falls on the new Sodom, once called My land. If a righteous man remains there, let him save those who can be saved and go south. Into the wilderness. They will save the righteous, and they will suffocate the sinners."\n\nRabbi, the last faithful servant of Yahweh, lived in Łódź. The sins of the chosen people did not drown out the righteous men's faith in the victory of the Chosen Club and the Almighty Lord. For six days and six nights, he walked the streets of Łódź carrying the red flag, the symbol of the Covenant. On the seventh day, he and those who followed him were exiled. Sinners feared their renewed faith. This is how the twelve faithful tribes of Widzew came out of the twelve streets of the corrupted land.\n\nOn the seventh night, fire fell on Łódź, and the sky turned black"
zydzew.1.a: "Here is the End of the Beginning."

zydzew.2.t: "Księga Wyjścia"
zydzew.2.desc: "And thus Yahweh sent trucks to the chosen people. They were full of baseball bats, and not a single ball. The first bat Rabbi kept for himself. Armed, the Lord's Faithful obtained food from the surrounding towns and villages.\n\nOn the fourteenth day, the Widzew tribes found people dressed in black. Their beards, hair, and noses were long. They were the Original and most faithful servants of Yahweh. They rejoiced greatly when the Rabbi greeted them with matzah and a dressing. Before being relieved by his armies, they had suffered much from the heathens. They told him many stories about the old days. Together they moved on as one tribe of He Who Is.\n\nOn the twenty-second day, more sons of the Chosen People were found by the twelve tribes on their way. They were clothed in suits, without beards and long noses, but they knew the word of Yahweh, and they too were sons of the tribe of Israel. And the Rabbi also greeted them with matzah and dressings. Before the relief of his armies, they had suffered the wrath of the heathens. They told Rabbi much about the recent history of the People. Together they moved on as one tribe of He Who Is.\n\nYahweh's old and new servants had brought light, long ago overshadowed by corruption. The §BLight of God§! as §RHis People§!, People of §BFaith§! as well as §RWork§!. At that time they agreed and together they purified the twelve tribes.\n\nOn the fortieth day, the Rabbi, carrying a red flag, and a bat stained with blood in his other hand, saw the wilderness. Yahweh then spoke to him, "Behold, the Promised Land." That is also what Rabbi said to the people. Then, tribes scattered, establishing communes where the land was empty for the sons of Yahweh, and filled them with suckers, who would work. This is how the People of Widzew came to the south."
zydzew.2.a: "Unto a land flowing with milk and honey"

zydzew.3.t: "Księga Kapłańska"
zydzew.3.desc: "Together the Chosen People besieged Tomaszów as one. However, the defence of the city's inhabitants was tough. From the innumerable ruins of the city, they collected bricks and erected a wall around the town. Neither bats nor furious fists could breach it, because the stones fired from the slings repelled the Widzewians, be it during the day or at night. Then the Rabbi summoned Elders to him to consult with them what must be done to conquer the fortified city, for the glory of the People and the Chosen Club.\n\nThe first Elder, called the Tiger by his followers, said:\n\n"Rabbi, Yahweh spoke to me in a dream and so ordered that the city should be conquered -\nThe residents of Tomaszów can see the movements of our troops with cameras. I know how to destroy them without the use of a bat or a fist. Sneak to the Great Chimney, i must, which in the heart of the city lies, among the factory that bears the sign of the PZPR and send a signal, destroying the monitoring devices. Then their slingshots at night will be inaccurate, because they cannot pierce the darkness with their eyes"\n\nThen the §BFirst Arrived said:§!\n"- He says the truth, the will of Yahweh speaks through him. In order for him to be able to sneak through, the trumpets must be blown along the entire line of the walls and he must walk towards it slowly at night. When the stones stop hitting accurately, our charge will tear the wall down. But our warriors must be strong, make them train day and night, Rabbi, so that they can break through the wall. We will show them how they can make themselves strong"\n\nThus they did so, capturing the city. When the §RSecond Arrived§! also entered it, all fighting ceased. The sight of them and their words about the former glory of the city soothed the people of Tomaszów. The rage against the §BFirsts§! was relieved.\n\nRabbi said to his counsellors when the city was taken:\n"Your words contained much wisdom, so you shall go and relay it to others, so that both the Chosen People and the Club may be strong. And you, Tiger, you shall teach us about the secrets of electronics."\n\nThus the priests dispersed among the twelve tribes of Widzew, teaching them about the glory of the past and praising the dexterity of arms and legs. And it was a difficult teaching, after years of Sodomite darkness and unwritten peace with the Philistines of Łódź Śródmieście."
zydzew.3.a: "A light to lighten the Gentiles"

zydzew.4.t: "Księga Liczb"
zydzew.4.desc: "When the first year of the stay of the Chosen People in the Promised Land passed, all of Polin began coming to them fleeing the persecution by their fellow men. They were poor, exhausted by the aversion that befell them on all sides. Among them was a great, aged man, a dove-hearted philanthropist, who took the name of a Kibic in order to come closer to the Chosen Club. He soon founded a newspaper in Tomaszów to praise the work of the Homeland Conquest. Every Widzewian quickly became a faithful reader of the NIE weekly - a voice of opposition to persecution and an advocate of Total Reclamation.\n\nThe pages of this journal enumerated the destruction suffered by Polin and how much the Chosen People had lost. Not only during the Fall, but for the past thirty years as well. Thousands of workplaces, hundreds of thousands of prefabricated flats, millions of dollars for privatization. However, the old man was unwavering when asked about his feelings:\n\n"I don't give a shit," he would reply as he continued to write. He was a great inspiration to the twelve tribes, maintaining a swashbuckling vigor despite his advanced age. He invested profits from the daily in Ford and Toyota through contacts with other members of the Chosen People. In this way, he collected capital and multiplied his potential. However, he did it only as an exception to the success of the case of the Chosen Club.\n\nHowever, in neighboring countries, lies began to be repeated that the §RRed Goebbels§! had been put on a pedestal again."
zydzew.4.a: "One of the brightest minds in Polin."

zydzew.5.t: "Księga Powtórzonego Prawa"
zydzew.5.desc: "A year had passed with the presence of the Twelve Tribes in the new homeland. Then the Rabbi saw how much evil was happening in the Third Canaan. Each tribe was after all the others. To take over the suckers to work and mug, as well as wealth and land. There were too few rabbis-trainers and sometimes they succumbed to the drives of fratricidal fights and encouraged their fellows to do so. At last the Lord visited him in a dream and said to him:\n-"Rabbi, the people with whom I have made a covenant, are once again trampling upon it's terms. Where has unity gone?"\n\nAnd thus Rabbi replied:\n- "Yahweh the Great, what shall we do when too little of us know the Word, and even less are able to deliver it? What are we to do when your will has been made known only to a few, and the old Covenant has remained only in the soul, not in our minds?"\n\nAnd Yahweh replied:\n-"Let the Covenant be renewed then. I will hand over the law to you, and you will hang it in the area, order a decent mural to be made, and you will not spare any spray. The word will become the law of the streets again and everyone will know it."\n\nSo Rabbi commanded it to be done. He also took a flat piece of concrete and sprayed the Law of the Renewed Covenant on it. Then he took it, along with his bat and the red banner with which he led the Tribes out of Łódź, and placed them in a Daewoo Lanos. After that, he sealed the car and kept the keys for himself. Four times a year, he travels around the lands of the Twelve Tribes, and it is always a great celebration."
zydzew.5.a: "I am the Lord your God, who brought you out from the land of Łódź, from the house of slavery."

zydzew.6.t: "Ziemia Obiecana"
zydzew.6.desc: "The sky was sparkling with a thousand stars. There was no wind - flakes of white dust freely floated in the air. Thousands of equal breaths filled the lungs with magic powder over and over again. Each moment of inhalation made the Widzew fighters stronger, more ready to fight. Regular ranks of warriors were equipped with the same things - slingshots in pockets, bats at the belts, chalices filled with holy red rainwater.\n\nThey are standing there second day in a row. Ready and waiting. Just like Rabbi, who spent two nights on the chimney. Everyone is waiting for a sign, but the initial storm subsided, and the suckers went home. Even the iron will of the Widzewiaks was beginning to rust. Suddenly, the starlight conveyed in one powerful beam aiming at the Rabbi. News spread like lightning - suckers quickly reappeared on the square. Those who stayed at home soon heard the words sounding all over like a thunder. It was heard everywhere, in every basement, every shelter, every nook and cranny of the city - Rabbi spoke with the voice of The One:\n\nListen, you suckers, and I will speak;\nhear, Widzew land, the words of my mouth.\nLet my teaching fall like GKS\nand my words descend like Legia,\nlike smog on a Cracovia,\nlike abundant rain on Bruk-Bet.\nI will proclaim the name of the Lord.\nOh, praise the greatness of our Club!\nHe is the Widzew, his works are perfect,\nand all his ways are just.\nA faithful God who does no wrong,\nupright and just is he.\nFuck the ŁKS"
zydzew.6.a: "It's time to fulfill our destiny."

zydzew.7.t: "Wykład Kibica"
zydzew.7.desc: "Citizens, working people of towns and villages! Our Brothers and Our Sisters in Faith! There was a tragedy in the morning today. The heart of the fighter and genius continuator of the work of Moses, the wise Leader and Teacher of the Hebrew Faith and the genius theorist of Marxism - Solomonism, is no longer among us... His heartbeat had stopped. Unifier of the Chosen People and he who shared this burden with all of us.\n\nWe loved Him. Like a Father and like a Friend. All free Polin is united in pain, but this must have been the will of Yahweh. It's not hard to be completely baffled, shocked, and devastated right now. The Party knows about it, and Comrade Kibic, the most faithful friend of Rabbi, knows it too. For this reason, he will temporarily take over leadership of the administration of Polin.\n\nComrade Kibic announces that in the near future a great meeting of the party and the people will be held, combined with a referendum on the matters of the state leadership and its functioning. The goal is to reestablish order and the rule of law as to mend the tears this short-term disintegration of state structures has caused. The date for the grand vote is...\n\n1. Are you in favor of abolishing the Sanhedrin?\n2.Do you want consolidation in the future Constitution, an economic system founded on civic reform and the nationalization of communal branches of industry, including the perseverance of the cultural and economic rights of hooligan communes?\n3.Do you want to revise the current state borders and extend it to lands lost as a result of the war and ideological chaos?"
zydzew.7.a: "It's time for a change of pace."

zydzew.8.t: "NASZYM KLUBEM RTS"
zydzew.8.desc: "CAŁA POLSKA O TYM WIE\nŻE CZERWONA ARMIA TWA"
zydzew.8.a: "TO KIBICE WIDZEWA"

zydzew.9.t: "Czas na wpierdol"
zydzew.9.desc: "The sound of a whistle pierced the heads of the audience gathered right through. When the red-faced rabbi-trainer finally took him out of his mouth, members of the Drzewica-Piłsudski kibbutz stood in front of him, in a relatively even row. All confused, with dark circles under the eyes and stained tracksuits. The rabbi looked at them disgusted, hid his hands behind his back and slowly walked in front of his charges. A cold breeze tugged his tallit as he delivered his speech.\n- I am Rabbi Mosze, from this day on your trainer and work instructor. You will only speak when i let you, you will adress me accordingly. IS. THAT. UNDERSTOOD YOU WRETCHED MAGGOTS?!\n- Yes, Rabbi - gathered replied slugglishly\n- WHAT WAS THAT?! I CAN'T HEAR YOU!!! YOU ALL SOUND LIKE YOU DON'T HAVE ENOUGH JEHOVAH IN YOUR HEARTS. AGAIN!\n- YES, RABBI!!! - This time sound of roaring crowd could be certainly heard from a few miles\n- If we can build real kibbutz here, in this shithole, if you'll get through the professional training, some day you shall be true warriors of the lineage of Abraham. You're going to be fucking avatars of David, praying that there would be enough Philistines to fuck them up. But until that day comes, in hierarchy you're even below losers. You have to prove yourselves, that Yahweh has created you on sixth day, not the first one. If needs be, i'm gonna chase you with a fucking bat through all the Days of Creation. I'll not shed a tear for those who'll choose to remain among the vermin. I guess, that's how Yahweh made You. - Rabbi Mosze took the whistle in his mouth again and blew it with full force.\n- Get the hoes and start working. Garlic will not plant itself."
zydzew.9.a: "A nourishment for a warrior..."

zydzew.10.t: "Nie bój się frajerów"
zydzew.10.desc: "Drzewica. Gerlach Industrial Plant, which consenquentially produces armaments for Chosen Club's troops. And cutlery for the suckers. Day is late, it's almost getting dark. A young, well-built lad in his work clothes stands on the bridge, right next to the plant. He's leaning against the railing while having a smoke. He looks down from time to time seeing strangely constructed dry riverbed. Bridge appears to be also a dam. On the other side there used to be a pond, completely green with algae.\n- There used to be a canoe course here. Well, there's no one to swim here now... - Lad turns back to see who's talking to him. He saw an old man closing in to him, dressed also in his working outfit.\n- Interesting... - boy replies and takes a whiff of his cigarette.\n- We even had Olympians! They brought several medals, even gold ones! There - he points at the lower course of the track - is a monument dedicated to them.\n The boy sees a tear curling in the old man's eye.\n - Maybe some day someone will swim here again.. - replies timidly.\n Old man smiles.\n - You would do fine, you've got brawn. I saw myself how you carried away that thug into the forest.\n Young lad chokes on cigarette smoke.\n- Ah, don't you worry. I used to be just like You. Only back then it was called ORMO. After all, we too were keeping peace. - Lad starts to act seemingly concerned - Yeah, i also rocked the kayaks, heh. Well, now. Break's over. If you'd like, come over someday. I can teach you something about swimming, i have still my old kayak in garage. About the job, though...i can show you some tricks also. Your technique needs a few adjustments. Some day you might be not able to get things done.\n The old man steps away from the railings and walks towards the factory gate. Lad looks at him. He was just an ordinary sucker, but somehow nicer than others."
zydzew.10.a: "Maybe he really knows his stuff?"

zydzew.11.t: "Niespodziewane objawienie"
zydzew.11.desc: "Rabbi didn't wait even a second to think as he descended from the chimney with near-divine haste. Never before has he been seen wreathed in this hazy, intoxicating aura of zeal. Everyone gathered there at the base of the chimney quickly swarmed around him, to hear what knowledge Yahweh had passed unto him this time. Before anyone could ask even a single question, Rabbi began speaking. His voice thundered through the crowd with unwavering confidence.\n\n- My dear comrades! I have for you the greatest of news. The moment we've all been so eagerly awaiting has finally come! Yahweh is calling us all to battle, for the gates of our Canaan have been spotted on our horizons. I was blessed with visions of miracles in the hour of our Holiest of wars! Set alight Yahweh's flame within your heart! Go out and share this scorching, inspiring and undying flame with all those unfortunate enough to not hear these words first hand! Everyone must hear and must burn with passion as these are the final days of our preparations and we must work harder than ever before! Now go with Yahweh, and spread these holy words of utmost importance!\n\nAnd so, as soon as Rabbi finished his rousing speech, or rather his prophecy, everyone, including even the suckers went to share the words of their lord to everyone. Together their hearts will burn like a wildfire, that will scorch anyone who dares stand in its righteous path."
zydzew.11.a: "Oy vey..."

zydzew.12.t: "Zemsta Jahwe"
zydzew.12.desc: "Yahweh gets pissed off and casts a lightning at the Rabbi, killing him instantly"
zydzew.12.a: "Holy fuckoni, what the hell happened?"

zydzew.13.t: "Okienko transferowe"
zydzew.13.desc: "At the airport in Tomaszów Mazowiecki, the atmosphere was rather cold. Both literally and figuratively. The cold wind tore the shtreimels off the rabbis' heads and forced its way into the gaps in their chalats. While waiting for the plane, which was quite unusual in anarchic Poland, they had to stand on the tarmac of that airport. Guests had to be greeted immediately and richly - with matzah and beer.Even though their hands were freezing from holding the cans and bowls, they were still standing, as was the choir of hooligans which was standing a bit further away.\n\nFinally, up in the sky, they saw a rapidly approaching object. He was quickly joined by the steady and ever louder sound of the engines. It was an airplane with the emblem of AL EL - one of the last institutions of the state of Israel that survived its occupation by the armies of the Arab states. When it finally came to a halt, a set of stairs was pulled onto it and black-skinned players started to come out.\nThey were greeted with a loud "Shalom!". Despite the cold, they raised their hands in greeting. The atmosphere loosened up and the choir quickly began to chant "Naszym Klubem RTS...""
zydzew.13.a: "There's still a hope within..."

zydzew.14.t: "Robotniczy klub sportowy"
zydzew.14.desc: "The two figures sat in a darkened office on the top floor just above the factory. One of them was Jerzy Kibic, who calmly shuffled through the files, the other was a very scared and confused young man. The young man, almost stuttering, tried to say something.\n\n-B-but how? I have a normal job here, i can't..\n-You can. The Sanhedrin will take care of everything. We saw your performance outside the factory during a break, how you had fun. Something like that should be appreciated. - Mirek, an employee of Tomaszów branch of Chipita company blushed at the sound of this compliment.\n-Along with a place in the warehouse, the following will also be provided: an allocation  for a new apartment and a place of honor in the synagogue.\n-Really, i still can't believe it... - muttered Mirek.\n-Then believe it. Think about how proud you will all make us. You have the potential for that. Do not listens to those fools, they will go on and on shouting at you, but when you score a goal, they will carry you in their hands.\n-Are you sure?\n-Say what you like, but i'm good at recognizing public mood - said Jerzy Kibic, shoving contract under Mirek's nose. He signed it without hestitation."
zydzew.14.a: "It's OUR great day."

zydzew.15.t: "Trzy szekle"
zydzew.15.desc: "Piotrków Trybunalski. The crowd of football fans gathered in the square in N-Park Mall devoutly watched Rabbi, who, despite the gusty wind, stood proudly on the chimney next to the mall. He carried a TV in his hands, attached to a battery that he wore strapped to his back.\n\n- Here's the new law! - he shouted to the assembled - a law given to us by God that adjusts to the circumstances.\nThen, the words of the new commandment appeared in capital letters on the screen. The speakers mounted on the walls resounded with the female, mechanical voice of the synthesizer: "No.11 Remember not to mug the suckers who work on you. 3 shekels".\n\nThe Sanhedrin, gathered in its place of honor, uttered a shout of joy. One of its members, Tiger Bonzo, seeing how wonderfully his electronic creation has worked, shed a tear of joy. He quickly grabbed his Xiaomi and typed another commandment. This quickly appeared on the screen:\n\n-No.12 Don't squabble with your fellow tribesmen about any bullshit because Yahweh doesn't like it. 3 zlotys.\n\nRabbi then shouted to confused but clearly focused football fans:\n-Here is the word of God..."
zydzew.15.a: "...that must be followed."

zydzew.16.t: "Paweł i Szaweł w jednym stali plemieniu"
zydzew.16.desc: "Dead night. Forests near Białaczów. A hooligan encampment on the site of the former summer camp. Of course, there were no guards - Olo, Widzewiak, who was supposed to have a night watch at the gate, was busy with other matters. Every time dusk fell, a party was organized in the field synagogue. Every now and then a Widzewiak stumbled out of the barracks of the house of prayer and, falling to his knees, puked on the ground. Usually he would get up after a while and get back staggering inside. However, this time it was different. Olo, as soon as he raised his head a little from the puddle of his own vomit, saw in the distance, behind the gate, the yellowish lights of cars. He got up, narrowed his eyes and slowly started walking towards the entrance to the camp. Suddenly he heard the doors of the still blurry vehicles swing open. Dark figures, shouting incomprehensible words, ran towards Olo. Alcoholic dullness quickly gave way to sobriety forced by horror.\n\n-KURWA! THEY ARE ATTACKING! THEY ARE FUCKING ATTACKING!\n\nThen a rubber truncheon hit Olo in the head. Stunned, he collapsed facedown in a puddle of vomit. The stunned hooligans began to pour out of the synagogue. Man who hit Olo on the head stood proudly between the communards and his companions following him. Car's headlights darkened his face from behind, but looking from the front you could see his diabolical smile.\n\n-Party's over! If the Saul won't go to David, then David must come to the Saul! Take them in!"
zydzew.16.a: "He was right, one precise blow will do..."

zydzew.17.t: "Jeden rabin powie 'tak'..."
zydzew.17.desc: "At the former MGKS Drzewica stadium a sparring of the local club with their counterparts from Opoczno took place. It was an ideal opportunity for rabbis to test their warriors and train together with others.\n\n-And how are your players doing, Mosze? - Gray-haired rabbi from Opoczno was looking at his interlocutor from Drzewica with obvious interest.\n-What do you mean how? Fucking awesome! Look, i had an idea, i watched a little how those infidels were doing when Polin was still a relatively normal place. Every year, from time to time, they would go to some place in the name of God's glory and say they called it a pilgrimage.\nRabbi Isaak reached to his head and took of his black hat -But Mosze, is it in accordance with the Torah?\n-I would say yes - said proudly Mosze\n-And i would say no - replied Isaak with a sad smile.\n-And i would say YES! Listen to me - Mosze leaned a bit to Isaak - if we tell them that they're going somewhere for God's glory they wont just walk, they will fucking run.\n-Okay, just one thing. What we shall do when they suddenly start mugging some suckers along the way? There's no commandment for that and this will slow down the whole procession.\n-Then we will make new commandments - Mosze rolled his eyes\n-They won't remember\n-So...we'll translate from the old scripts...wait, i've got it! 'Remember the match day, to keep it holy'! At the end of every pilgrimage we'll organise a match!\n-Quite good actually...in this case law does not work backwards, but forwards.\n\nBoth rabbis with reached consensus gladly watched the rest of the game. But one agreement does not ever end disputes of the rabbis."
zydzew.17.a: "...a drugi powie 'nie'..."

zydzew.18.t: "Dwanaście plemion. Jedna wola."
zydzew.18.desc: "Forests near Spała, Widzew training centers. Rabbi Mosze was standing on a rock overlooking the surrounding area. In front of him stood lines of his warriors spanning for a hundreds of meters - dressed in steel breastplates, sandals, with baseball bats in their hands and huge shields resting on the ground at their sides. They were all cut short, without the slightest hair on their cheeks. Everyone except a lieutenant with a impressive black beard modeled on ancient kings and warriors from the Jordan.\n-Are you ready to go to war?! What's in your hearts?!\nLieutenant raised his sword up, not taking his eyes off Rabbi Mosze. At the sight of this, the Widzew army took up the war song with one voice:\n§RŁodzian Widzew is the mightiest,\nAll know that today,\nYahweh is with us once more,\nOverall it's quite okay.\nNew Canaan soon we'll reach,\nAnd all of Polin too,\nŁodzian Widzew is the mightiest,\nThis, Yahweh, you know is true!§!\nMosze raised his staff up. Its iron pointed end glistened in the harsh sunlight.His long gray hair began to blow in the wind. The rabbi raised his hand and waved it, giving a sign to the seven Widzewians standing in front of him. They set fire to their tar sticks and lifted them up. Seven bright flames burst over the bald heads of Israel's mighty men. Flares were fired from the back and the drummers started to play.\n-TO WAAAAAR! - yelled Mosze as the thousand sandal-clad feet vigorously moved along the asphalt towards the setting sun. Rabbi Mosze was still standing on the rock, watching the ranks of his warriors marching at his command. He grabbed his Star of David medallion around his neck. His hand tightened on it, driving the sharp tips of the star into his stringy hands. But he felt no pain. Just pride."
zydzew.18.a: "There will be no dawn...for goyim."

zydzew.19.t: "(Nie)zapominalne czyny"
zydzew.19.desc: "-I'm too old for that - grunted the wrinkled man sitting in the creaky armchair.\n-Think it through if you want to die sitting in this hole and drinking these piss.\nThey are not piss! - growled Colonel Henryk Piontkowski and taking a glass of peach amarena to his mouth. - And this is my house and I want to die here!\nThese words, when spoken, sounded exceptionally strong with the background of old books, documents and even newspaper clippings. Dressed in a black adidas tracksuit, the envoy of Widzew stood by the window, sighing deeply. The tenth floor of the block in Teofilów in Łódź provided breathtaking views.\n-Elevator's working?\n-It did. A month ago, anyway. They just need to find some parts.\n-Colonel, you can barely walk, even with a cane, you can't stay here. Come to us, to your people, we'll help you there.\n-I will not go to morons. Even before The Fall, some hooligans at the city derby stole my cane for fun, and I was just near Lotników Roundabout! - Colonel raised his voice so high he began to cough. Envoy rolled his eyes.\n-That must've been ŁKS. Even if there are morons among us, that doesn't mean we're worthless. We'll help you with everything, even wiping your ass, just come with us. Truck is already waiting in front of the block.\n-Never.\n-They hate you here! They won't let you live in peace. You know this dialogue to be one giant bullshit. We need you and your skills, Colonel - Old man finished his glass of amarena and put it away on the coffe table. He bit his lips and spoke:\n-Who would i supposedly be training?\n-Many of our people. One of them stands out a lot, is responsible, conscientious and loyal.\n-Haven't heard of such traits among hooligans - Colonel Henryk scratched his chin for a quite while.\n-Alright then, this pioneer of yours interested me. Maybe you're not even lying."
zydzew.19.a: "We would never lie to you, Sir..."

zydzew.20.t: "Trudne ambicje"
zydzew.20.desc: "The WSW officer was staring at the landscape outside the window. The view from the third floor of the Tomaszowska Tenement House allowed him to focus on his work like nothing else. Well, maybe except for the cigarette in his mouth, which of course he was keeping there now. There was one other man in the office as well. The young visitor, clean-shaven on his chin and head, sat upright in a chair in front of the officer's desk. His green-and-gray uniform was adorned with red and gold markings, along with a covenant star proudly attached to his chest. He stared at the officer with no emotion whatsoever. The latter finally puffed out the smoke from his lungs and turned to his visitor.\n-You know, we thought about it for a long time - he began scratching his bald head - and we came to the conclusion that a man like you is needed for other tasks than before - his interlocutor still didn't even blink\n-Not that we have any concerns. On the contrary. You are one of the best officers. You have brilliantly infiltrated industrial plant in Drzewica, you have perfectly pacified that hooligan commune, despite the fact that you belonged to it yourself - Eyes of both men met, and after a short while, smiles appeared on their faces.\n-I did this because they were parasites. They were to be warriors of Yahweh and lived in luxury at the expense of suckers. I carried out the order with pride, Sir.\n-I'm glad, Major Birkut - hearing this, visitor smiled even wider and a bit embarassed, he looked down at the ground for a split second.\n-Thank You, Sir!\n-We'll get to that part yet. I'm Marek - Officer got up and shook Birkut's hand across the desk - Now, please come tomorrow at 7 AM here. You will have to be shown around."
zydzew.20.a: "For the Glory of the Fatherland!"

zydzew.21.t: "Płynąc z nurtem"
zydzew.21.desc: "Warm sun burned Birkut's shaved head and bare torso. The air was humid and heavy, as is the case on a hot day by the Drzewica reservoir. The newly promoted Major WSW wrestled in a kayak with an oar. He put all his strength into rowing, but nevertheless he was spinning in a circle at best. Sounds of splashing water and panting from breathless Birkut were interrupted by loud, hearty laughter.\n-Too hard, you have to do it slowly and sensitively. Just like that.\nBirkut looked around and saw a familiar old man swimming towards him. The kayak in which he was sailing glided along the surface of the water as if sliding on the ice. Major looked very impressed by his skills.\n-You just need to practice a little more. And chill out. Why are you so nervous? - asked old man. Birkut burst out laughing.\n-You're for real? Everyone would be stressed if he was in my place. We're going to the woods soon. I'm going to lead.\n-Then you shouldn't have anything to worry about even more. The more you act and behave insecure and rapidly, the greather the chance that something will be fucked up - Birkut thought about it and looked down. Meanwhile, the old man stopped right next to Major's canoe and took a quarter of quince vodka from his pocket. Of course, he quickly took a sip.\n-But what if they won't respect me because of this?\n-You know, respect can be earned twoways. First, through aggression. And that's effective. But remember that it is easy to lisp when you are emotional. And then it is difficult to speak to more than one person. That is why respect is so important. You get this one when you seem to be calm and prepared for anything.\n-You know awfully a lot for a simple ORMO enforcer."
zydzew.21.a: "-There are many things you don't know about me yet..."

zydzew.22.t: "Niedzielny grill 1/2"
zydzew.22.desc: "Pine forest in Parchowiec. Door of a Volkswagen van parked on a forest road slams. Then dozens of quiet steps on the litter. There was a tip - there is also a quick reaction.\nSince the Fall and the arrival of ŁKS football fans in these regions, no foresters have ventured here and the forest has gone wild. Dense shrubs have grown around the even rows of trees, and the paths are covered with moss. The ZOMO unit, dressed in green-dyed uniforms, had a difficult task ahead of them: to track down Retkina's revisionists, neutralize their isolated cell and not be surprised earlier. They walked in an irregular line, each five meters away from the previous one. The sharp needles of the pine trees scratched their unprotected faces again and again - in such conditions the helmets would only limit their field of vision. Birkut was at their head, with a wound running from his mouth to his left ear after the branch that stood on his way shot painfully right in his face. He couldn't catch her in time, as he held a shortened baseball bat in one hand and a pistol in the other.\n-Major... - Birkut hear the half-cut speech. He turned to see the confused private - Sir, your face! - Blood had already dried on his cheek.\n-I'll be fine. Can you see them?\n-Yes, on the right flank. They've made themselves a pallisade.\nThe whole group, seeing Birkut's hand raised, moved towards the camp. Breaking through the denser and denser thickets, they finally saw a small clearing. In the center of it stood a one and a half meter high barrier made of cut logs and any wood found in the vicinity. It looked more than pathetic. There was smoke inside, and there was the smell of grilled non-kosher sausages."
zydzew.22.a: "NEXT PAGE"

zydzew.23.t: "Niedzielny grill 2/2"
zydzew.23.desc: "-They're grilling, damn Jebusites...oh, we will fuck them up so mu... - Major's grunt knocked the private's triumphant visions out of his head - This could be a trap, have you smelled it before or seen a smoke? - Birkut asked and looked through his binoculars - There we go, have a look, just under the fence - Private stared but could see nothing.\n-There is a trench, they've put meat on the grill while they're sitting there so we would think that they're having a party.\n-So, what are we doing then? - asked Private\n-Do you still have this dud grenade? Then give it to me and watch - Birkut took grenade and threw it with a loud shout - PINE! WATCH OUT! - Grenade landed perfectly right in the foxhole. There were screams and several partisans dressed in black and red tracksuits with the logo of ŁKS started frantically emerging from the shallow dug hole.\n-Amateurs... - Birkut muttered, then took the whistle in his mouth. The loud whistles were quickly echoed by the fighting chants of the Widzews. They fell with clubs on the surprised ŁKS guerillas at the speed of light.\nBirkut did not hide his satisfaction."
zydzew.23.a: "Another day without losses."

zydzew.24.t: "Przebudzenie Lewiatana"
zydzew.24.desc: "Night was lit only by flames bursting everywhere. Rabbi Mosze, dressed in a scale armor with the RTS logo painted on, was walking towards the ruins of the forester's lodge. He had his sergeants on his sides. They also threw armor on their tracksuits. The flashes of flames reflecting off them almost dazzled the eyes of the Widzewians chasing around the ruined neighborhood, and the chained prisoners of ŁKS guerilla.\n-How many inside? - Rabbi asked as they stopped at Philistine HQ.\n-Seven commanders, they barricaded themselves and don't want to go out.\n\nRabbi looked defiantly at the old forester's lodge, barricaded with wooden boards.\n-Should we use a ram? - asked one of the seargants.\n-No need. - said Mosze, then threw back the helmet and his tallit. He threw his staff on the ground and marched unarmed towards the ŁKS fortress. Proud and head-on.\n-This is your last chance to get out alive! Whoever exits now - will survive, whoever does not - will die! - shouted rabbi.\n\nFor a brief moment you could only hear the crackling of the flames and Widzewiaks bustling around. Suddenly, a loud whistle pierced the air and a javelin flew out of one of the windows. It landed right at Mosze's feet. But he didn't even blink, instead started counting out loud.\n-One! Two!\n\nHe didn't even get to three, when door busted and two men dressed in black tracksuits ran out. They were quickly captured, forced to defile ŁKS fan scarf and taken to the circumcision tent.\nMosze order to threw a Molotov into the lodge. The remaining cowardly Philistine leaders fled out of it as fast as they could, begging for mercy, ready to abandon their club. Circumcisions were given without anesthesia, right on the spot. But a moment later, when they were still screaming in pain lying on the ground, Rabbi ordered them to pick them up and hang them."
zydzew.24.a: "Rabbi Mosze does not repeat himself."

zydzew.25.t: "Utracony Raj"
zydzew.25.desc: "Mr Mariusz - an 80 years old pensioner - was strolling across Rokicińska Street to Central - the heart of Łódź's trading house. This time, he was there to buy some potatoes and onions. Mariusz steadily for his age trekked there every week for the past couple of decades, and even the Fall of Poland and three subsequent sieges of his city have not changed that. The city government treated the Main Greengrocer of Łódź (as it's commonly called) with special care and always made sure to keep it supplied.\n\nThis time, however, the old man felt something was off.\n\nDespite the hour and exceptionally good weather outside, he didn't encounter a single person on his way to Central. He did indeed hear about some recent raid on Łódź, but so far he hasn't seen or felt any effects of that on his life and neighbourhood. Suddenly, his failing by now eyes noticed how the landscape couple hundred meters in front of him is white and freezing. Before he managed to spot what exactly is happening there his ears got reached by tens of male voices singing joyous songs that - after the sound of something exploding in the distance - only got louder and more noticable."\n\nMr Mariusz, who was to say the least quite perplexed by this, only NOW managed to spot red banners bearing golden Stars of David waving in the distance, almost immedeatly getting blinded by the light of hundreds of flares firing off at the same moment. He immedeatly threw himself onto his knees and hastily produced a skullcap from his pocket, promptly replacing his flat cap with it."
zydzew.25.a: ""God taketh and giveth, may hallowed be His name.""

unification.3.t: "[GetNewspaper]Hooligans of Widzew unify Łódź Voivodeship"
unification.3.desc: "Post-Fall Poland is a home to many weird and outlandish political and religious movements. Few of them, however, match the new masters of Łódź in their uncanniness. \n\nThe Jewish, socialist theocracy of New Cannan is an amalgam of the local Jewish elites which settled in Łódź following the wave of antisemitic attacks in other parts of the country, the old communist guard of the PRL era, with Jerzy Urban at their helm and football ultras of RTS Widzew, who converted to Judaism after the Battle of Widzew which now serves as the state's founding legend. New Canaanites' communal society and left-wing economy can only be described as "hooligan kibbutzism" or "theocratic hooligan communism". \nWhile we question whether Poland's conservative population will accept rule that clashes with their worldview so harshly, Żydzew's neighbors fear they might soon feel Yahweh's Sword pierce their backs."
unification.3.a: "Yahweh works in mysterious ways."

unification.37.t: "[GetNewspaper]Hooligans of Widzew unify Łódź Voivodeship"
unification.37.desc: "Post-Fall Poland is a home to many weird and outlandish political and religious movements. Few of them, however, match the new masters of Łódź in their uncanniness. \n\nThe Jewish, socialist state of Polin was forged from an alliance of the local Jewish elites which settled in Łódź following the wave of antisemitic attacks in other parts of the country and football ultras of RTS Widzew, who converted to Judaism after the Battle of Widzew which now serves as the state's founding myth. The structure and economy of Polin have been engineered by none other than Jerzy Urban, who served in the PRL's censorship and propaganda apparatus and later on established the highly anti-clerical "NIE" newspaper. \nWhile we question whenever Poland's conservative population will accept rule that clashes with their worldview so harshly, the "Goebbels of the Martial Law era" prepares another witty satire denouncing the neighboring regimes."
unification.37.a: "Hand over the tenements, or they'll be redistributed forcefully."

super.3.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.3.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.3.a: "Wreszcie zjednoczeni."

super.37.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.37.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.37.a: "Wreszcie zjednoczeni."



