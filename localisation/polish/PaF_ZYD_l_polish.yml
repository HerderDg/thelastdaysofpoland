ZYD_mobile_ark_desc: "Nasza drużyna piłkarska jest boska. Wszak, tylko Bóg jeden wie jak zagrają. Przez to, gdziekolwiek się nie udamy, musimy szerzyć nowinę o jej boskości. Do tego będziemy potrzebować przykazań i Arki Przymierza która owe przechowuje. Ale jak jesteśmy w stanie bezpiecznie transportować tak ważna relikwię? Odpowiedź jest bardzo prosta:\n\nDaewoo Lanos. Pancerność tego pojazdu powinna wystarczyć by odeprzeć jakiekolwiek ataki naszych wrogów. To cacko nawet posiada automatyczny zamek! Nie ma lepszego miejsca na przechowywania nawet najbardziej świętych relikwi niż Lanos."
ZYD_minority_rule2_desc: "Frajerzy dalej nas nie lubią. W zasadzie, to nienawidzą nas bardziej niż przedtem. Ale przynajmniej teraz zaczynają znać swoje miejsce. Wzmożone krojenia i wpierdol zagwarantowały że będą się nas bać, a \"przesłuchania\" przez ŻOMO poradzą sobie z każdym potencjalnym wywrotowcem. Niektórzy z nich nadal nie mogą zaakcepptować naszej władzy, ale przynajmniej upewnimy się żeby nauczyli się nam nie przeciwstawiać."
ZYD_armia_dawida_desc: "Przyjmując nowe przykazania, udało nam się wzniecić większy duch dyscypliny i rygoru w naszych wojownikach. Już dłużej nie będą jedynie szalejącą bandą ultrasów szukających kogoś do skrojenia. Mimo, że tradycja brutalności i okrucieństwa pozostała, teraz chociaż ich formacje przypominają coś na wzór prawdziwej armii. Tak jak dumni wojownicy Izraela, Dwanaście Plemion Widzewa stanie ramię w ramię jako bracia przeciwko Polskim poganom. A wszystko w imię Jahwe."
ZYD_armia_dawida2_desc: "Przyjmując nowe przykazania, udało nam się wzniecić większy duch dyscypliny i rygoru w naszych wojownikach. Już dłużej nie będą jedynie szalejącą bandą ultrasów szukających kogoś do skrojenia. Mimo, że tradycja brutalności i okrucieństwa pozostała, teraz chociaż ich formacje przypominają coś na wzór prawdziwej armii. Tak jak dumni wojownicy Izraela, Dwanaście Plemion Widzewa stanie ramię w ramię jako bracia przeciwko Polskim poganom. A wszystko w imię Jahwe."


ZYD_LKS_guerilla_desc: "Kibole ŁKSU są po prostu zbyt pełni pychy by zaakceptować władzę Jahwe nad ziemskim padołem oraz zbyt tchórzliwi by otwarcie wypowiedzieć nam wojnę na przekór panującemu ładowi. Kryją się w swoich norach jak szczury, trzymając się swoich antycznych wierzeń i starych zgód i polują na naszych ludzi jeden po drugim. Nie ważne ile milicjantów wystawimy na straż w ich dzielnicach i ile domów przetrzepiemy w poszukiwaniu sympatyków ŁKSu, nadal sieją spustoszenie w naszych szeregach powoli i metodycznie, wyniszczając Żydów i Socjalistów - niczym pasożyt wyżerający swoją ofiarę od środka."
ZYD_ekonomia_urbana_desc: "Dawno temu, kibole zajęli ziemię Nowego Kanaanu i wszystkie jego bogactwa by chronić je od wynaturzenia jakim jest plemię ŁKSu. Pod obronę i władzę Jawhę uciekliśmy wraz całym państwem, lecz w zamian ŁKS zużyli wszystkie dostępne surowce, spustoszyli rynki i zmusili warsztaty do zamknięcia.\n§RI Jahwe widział to zniszczenie, i wiedział, że nie było to dobre.§!\n\nDlatego rozkazał swoim wyznawcom zgromadzić największych przywódców, ekonomistów i namiestników i wysłał ich by na czele Ultrasów nauczyli się rzemiosła - by odbudować warsztaty, produkować dobra, narzędzia i różnego rodzaju artefakty godne narodu wybranego przez samego Boga. Oraz po to by przywrócić balans rynkom, wprowadzić na nie naszych ludzi i produkty by zdobyć potrzebne fundusze do dalszej działalności sprawy Narodu Wybranego."
ZYD_ekonomia_urbana2_desc: "Dawno temu, kibole zajęli ziemię Nowego Kanaanu i wszystkie jego bogactwa by chronić je od wynaturzenia jakim jest plemię ŁKSu. Pod obronę i władzę Jawhę uciekliśmy wraz całym państwem, lecz w zamian ŁKS zużyli wszystkie dostępne surowce, spustoszyli rynki i zmusili warsztaty do zamknięcia.\n§RI Jahwe widział to zniszczenie, i wiedział, że nie było to dobre.§!\n\nDlatego rozkazał swoim wyznawcom zgromadzić największych przywódców, ekonomistów i namiestników i wysłał ich by na czele Ultrasów nauczyli się rzemiosła - by odbudować warsztaty, produkować dobra, narzędzia i różnego rodzaju artefakty godne narodu wybranego przez samego Boga. Oraz po to by przywrócić balans rynkom, wprowadzić na nie naszych ludzi i produkty by zdobyć potrzebne fundusze do dalszej działalności sprawy Narodu Wybranego."
ZYD_armia_urbana2_desc: "To co na początku zdawało się być ingerencją w wolność i społeczną pozycję Plemion, okazało się być czymś do czego chce dołączyć każdy Widzewiak, jako że członkostwo w Centralnym Klubie oraz jego Armii są synonimem prawdziwej wiary i statusu elity. Każdego dnia, ze wszystkich kibuców wyjeżdżają autobus wyładowane kibolami zmierzającymi do placówek Centralnego Klubu by dowieźć ochotników nowej zjednoczonej armii. Towarzysz Kibic osobiście zapewnia że zostaną oni wyszkoleni na modłę najlepszych wybrańców Jahwe."
ZYD_armia_urbana_desc: "Wiadomość jaką wysłaliśmy Plemionom jest jasna. Ich autonomia jedynie niszczy naszą administrację swoim brakiem organizacji i nieustannymi sprzeczkami o nic, paraliżując jakiekolwiek starania w przekształceniu się w profesjonalną armię. Muszą zatem pożegnać się z ową autonomią - dla dobra klubu. Towarzysz Kibic ma rację - jeśli chcemy odzyskać całe Nowe Kanaan, Widzew musi stać się jednolitą, silną instytucją - taką która emanuje dyscypliną, ciężką pracą i dumą ich członków."
ZYD_pitch_failures_desc: "Nieustające porażki meczowe przeciwko innym komunom okazały się ogromnym ciosem w morale naszych ludzi, efektem czego podkopana jest nasz autorytet który spaja ten region. Kibole zaczynają być niespokojni, nieustannie grożąc piłkarzom i naszej administracji oraz wyładowując swój gniew na sąsiadującej infrastrukturze. Musimy znaleźć sposób by zacząć znowu wygrywać, albo nasze państwo popadnie w stan kompletnej anarchii."
ZYD_minority_rule_desc: "W naszym państwie jest ograniczona ilość Ultrasów, Żydów oraz Komunistów. A już ze świeczką szukać kogoś kogo można dopasować do wszystkich trzech grup społecznych. Większość naszej populacji stanowią zwykli ludzie, nazywani przez nas Frajerami. Prości katolicy, ślepi na światłość Jahwe. W większości bejsbole wystarczą by utrzymać porządek, ale nie sprawia to że nas lubią. Jeśli cokolwiek pójdzie źle, nie ma wątpliwości że przy pierwszej możliwej okazji wbiją nam nóż w plecy."
ZYD_unfinished_collectivization_desc: "Przez długi czas próbowaliśmy zaszczepić ideały komunistyczne. Niestety, jest to na obecną chwilę proces powolny i żmudny. Nie udało nam się przeprowadzić całkowitej kolektywizacji środków produkcji i dóbr zamożnych ludzi, co stawia na w niezbyt komfortowej pozycji pomiędzy dwoma kontrastującymi ze sobą systemami ekonomicznymi. Powoduje to jedynie masowy nieład i chaos pośród klasy robotniczej, a co radykalniejsi poplecznicy zaczynają być coraz bardziej gniewni.\nTowarzysz Marks nie byłby zadowolony z naszego postępu..."
ZYD_eleven_falashas_desc: "By wypełnić luki pozostawione przez...mniej utalentowanych piłkarzy naszej drużyny, ściągnęliśmy do kraju całkiem nową jedenastkę zagranicznych talentów. Teraz w końcu będziemy w stanie wymienić więcej niż dwa podania bez utraty piłki. Lub strzelić coś innego niż ŁKSiarza. Na przykład jakiegoś gola. Dzięki takiej jakości z pewnością zapewnią sobie poparcie kibiców raz dwa! I tak nikt nie lubił tych starych szrotów..."
ZYD_eleven_falashas2_desc: "By wypełnić luki pozostawione przez...mniej utalentowanych piłkarzy naszej drużyny, ściągnęliśmy do kraju całkiem nową jedenastkę zagranicznych talentów. Teraz w końcu będziemy w stanie wymienić więcej niż dwa podania bez utraty piłki. Lub strzelić coś innego niż ŁKSiarza. Na przykład jakiegoś gola. Dzięki takiej jakości z pewnością zapewnią sobie poparcie kibiców raz dwa! I tak nikt nie lubił tych starych szrotów..."
ZYD_eleven_praca_desc: "Może i Frajerzy nie są najlepszymi zawodnikami, ale upewniliśmy się że z kimkolwiek nie będą grali będą jeszcze gorsi. Ci zaznajomieni z tą praktyką nazwą nas niemoralnymi, ale nie mogą zaprzeczyć, że bardzo pozytywnie to wpływa na naszą popularność, nawet pośród najniższej klasy robotniczej, którzy to w końcu mogą czuć się reprezentowani przez jedenastkę złożoną z ludzi im podobnym."
ZYD_eleven_praca2_desc: "Może i Frajerzy nie są najlepszymi zawodnikami, ale upewniliśmy się że z kimkolwiek nie będą grali będą jeszcze gorsi. Ci zaznajomieni z tą praktyką nazwą nas niemoralnymi, ale nie mogą zaprzeczyć, że bardzo pozytywnie to wpływa na naszą popularność, nawet pośród najniższej klasy robotniczej, którzy to w końcu mogą czuć się reprezentowani przez jedenastkę złożoną z ludzi im podobnym."
ZYD_i_znow_bijatyka_desc: "Kibole nie mogą po prostu przestać odpierdalać. Sprawienie że te dzikusy przestaną brutalizować się wzajemnie na cotygodniowych ustawkach jest syzyfową pracą. Wiele z naszych najlepszych ludzi musi się kurować z odniesionych ran z rąk innych dzieci Jahwe. Nasze państwo wykrwawia się samo w nieustannych potyczkach wewnętrznych, i jeśli szybko nie znajdziemy sposobu na uspokojenie tych ekscesów możemy stracić resztki naszego autorytetu."
ZYD_i_znow_bijatyka2_desc: "§RJakimś cudem, nasza wewnętrzna stabilność spadła jeszcze bardziej szorując po dnie, a ustawki praktycznie przejęły całe nasze państwo. Nowe Kanaan płonie a system jest bliski załamaniu. Musimy natychmiast odwrócić to szaleństwo i odzyskać kontrolę! Jeśli jednak zawiedziemy w pacyfikowaniu tych zamieszek, Przymierze upadnie a Ziemia Obiecana zostanie bezpowrotnie stracona.§!"
ZYD_ekonomia_kradziejsko_kibolska_desc: "Nasza gospodarka krwawi z powodu idiotycznych i krótkowzrocznych działań Plemion. Oczywiście, nie ma nic złego w krojeniu Frajerów, ale skala jakiej się dopuścili wymyka się całkiem spod kontroli! Zabierają wszystko co znajdą, nie patrząc nawet na to czy mniej przedsiębiorczym towarzyszom cokolwiek zostanie do złupienia. Wszystko fajnie, chłopaki się bawią, jest super - a potem okazuje się że nie mamy żadnego pożywienia i broni, bo banda kiboli zdecydowała się zagarnąć dobra które mogłyby wypełnić kilka magazynów..."
ZYD_ekonomia_kradziejsko_kibolska2_desc: "Nasza gospodarka krwawi z powodu idiotycznych i krótkowzrocznych działań Plemion. Oczywiście, nie ma nic złego w krojeniu Frajerów, ale skala jakiej się dopuścili wymyka się całkiem spod kontroli! Zabierają wszystko co znajdą, nie patrząc nawet na to czy mniej przedsiębiorczym towarzyszom cokolwiek zostanie do złupienia. Wszystko fajnie, chłopaki się bawią, jest super - a potem okazuje się że nie mamy żadnego pożywienia i broni, bo banda kiboli zdecydowała się zagarnąć dobra które mogłyby wypełnić kilka magazynów..."
ZYD_ekonomia_kibucowska_desc: "Sprawienie że Kibole odejdą od swojej tradycji krojenia każdego kto spojrzy na nich krzywo będzie procesem długim i żmudnym, lecz przyszłość naszej gospodarki zależy od sukcesu tego procesu. Musimy odgonić ich od obecnego stylu życia kiboli nomadów i nauczyć ich jak być dobrymi i cnotliwymi Żydami. Muszą nauczyć się na czym polega wartość uczciwej pracy i wiernej przynależności. Mogą narzekać, ale kiedyś podziekują nam za zapewnienie im zbawienia."
ZYD_ekonomia_kibucowska2: "Rosnąca gospodarka kibucowska"
ZYD_ekonomia_kibucowska2_desc: "W miarę jak coraz więcej kiboli przekształca swoje osiedla w kibuce, ich stary beztroski styl życia pełen braku poszanowania dla praw i przykazań przekształca się w wypełniony pobożnością, uczciwą pracą i kultywacją swoich ziem i posiadłości. Bogactwo zaczyna się rodzić, karawany handlowe powracają - era dobrobytu zawitała do Nowego Kanaan. Cały region wypełniony jest pochwalnymi pieśniami, dziękującymi Jahwe za jego błogosławieństwa. W końcu, okazaliśmy się być godni dostąpienia Ziemi Obiecanej."

 ##First Tree##
ZYD_genesis: "Bereshit"
ZYD_genesis_desc: "Na początku było słowo. A słowo w ogień się obróciło."
ZYD_exodus: "Shemot"
ZYD_exodus_desc: "Czterdzieści dni wędrował Rabin prowadząc dwanaście plemion do Puszcz Obiecanych. Czwartego dnia głód pojawił się wśród ludu Widzewa. Jeno wiara w Słowo Jahwe trzymała ich o siłach. Wtem Rabin widząc to, rzekł:\n\n- Głód nas dręczy, Jahwe pomóż swemu Ludowi!"
ZYD_leviticus: "Wayiqra"
ZYD_leviticus_desc: "Rabin wraz ze swym plemieniem ruszył przybyciu na południe do Tomaszowa, Miastem Pokrzyw zwanego, gdyż w jego centrum ścisłym trzeba było na nie uważać. Tam też ruszyli razem z nim przybysze z pierwotnego Ludu Wybranego. Drudzy Przybysze opowiadali, jak to z dawien dawna dostatkiem słynęła ta miejscowość, kiedy jeszcze fabryka tekstylna w nim działała, a z rzemiosła zręcznego słynęło na Polin całe. Kres temu miał Lewiatan Dolara położyć wraz z reformami co wyssały wszelkie bogactwo z tej ziemi."
ZYD_numbers: "Bemidbar"
ZYD_numbers_desc: "Jahwe rzekł do Rabina w namocie spotkań na stacji w Koluszkach, pierwszego dnia trzeciego tygodnia po eksodusie z Widzewia. Rzekł:\nWeź i zlicz wszystkie Widzewskie owieczki i podziel ich według klubów i plemion, każdego z imienia nazywając. Policzycie zgodnie z ich podziałami wszystkich ludzi Widzewa którzy szesnasty rok życia ukończyli i godni są by w armii służyć. Jeden mężczyzna z każdego klubu, każdy z nich będący głową swojego plemienia, pomóc Ci musi w tym czynie."
ZYD_deuteronomy: "Devarim"
ZYD_deuteronomy_desc: "Dekalog\n\n1. Nie będziesz miał klubów cudzych przed RTSem ani Boga poza Jahwe\n2. Nie będziesz brał imienia klubu twego nadaremno\n3. Pamiętaj aby dzień meczowy święcić i race puszczać\n4. Czcij Klub swój, Boga swego i plemię swoje\n5. Kradnij tylko od frajerów oraz wrogów Ludu i Klubu\n6. Nie pożądaj telefonu ani loszki bliźniego swego\n7. Nie bądź konfidentem\n8. Wpierdol po równo wrogom spuszczaj\n9. Piwa nie odmawiaj\n10. Ani każdej innej rzeczy którą ci frajerzy dają"
ZYD_constant_brawls: "Nieustające burdy"
ZYD_constant_brawls_desc: "Powiedzieć, że nasze włości wrzą od niepokojów byłoby eufemizmem. Widzewiacy krążą pomiędzy komunami a miejscami do krojenia frajerów wszczynając bójki, często śmiertelne, grabią wszystko co jest nieprzymocowane do ziemi. W lasach tymczasem czają się bojówki ŁKS-u którzy przybyli tu wygnani z Łodzi przez Pana Dialogu, gdy nie chcieli założyć jarmułek. Samotni wędrowcy często giną bez śladu. Nikt nie jest pewny swojej przyszłości a pomiędzy Pierwszymi a Drugimi Przybyszami narasta konflikt odnośnie sposobów wyjścia z kryzysu. "
ZYD_mutual_destruction: "Wzajemne wyniszczenie"
ZYD_mutual_destruction_desc: "Pomiędzy dwunastoma plemionami trwa ciągła walka o zasoby. Z każdym dniem coraz bardziej niknie idea jedności Ludu i Klubu Wybranego. Miast tego do głosu dochodzą najbardziej przyziemne i prymitywne partykularyzmy. Jeżeli nie zatrzymamy tego procesu, nie przypominamy Widzewiakom kim są, jakie są ich zadania oraz wrogowie, niedługo całe Nowe Kanaan pogrąży się w chaosie wojny domowej."
ZYD_the_decalogue_upgrade: "Ulepszenie Dekalogu"
ZYD_the_decalogue_upgrade_desc: "Dziś w nocy naszych najbardziej pobożnych mężów nawiedził we śnie sam Jahwe. Twierdzą iż nakazał On im natychmiastowe wprowadzanie poprawek do dekalogu oraz znaczące jego rozszerzenie. Po krótkiej analizie można dostrzec iż postulowane zmiany poważnie zwiększają rygor jakiemu poddani będą Widzewiacy, widoczne jest również położenie nacisku na posłuszeństwo wobec Jahwe oraz mędrców, proroków wiary i Rabina. Drudzy przybysze protestują przeciwko zawłaszczaniu kompetencji prawa świeckiego przez prawo religijne. Nie sposób jednak ukryć, że tak rozbudowany dekalog jako podstawa prawna naszego państwa może stać się gwarancją pokoju, jedności i jednomyślności na łonie Ludu Wybranego."
ZYD_limitation_of_the_autonomy_of_the_twelve_tribes: "Ograniczenie autonomii Dwunastu Plemion"
ZYD_limitation_of_the_autonomy_of_the_twelve_tribes_desc: "O ile nie można się nie zgodzić, że system podziału pomiędzy dwanaście plemion z dwunastu ulic Widzewa dzięki swojej \"elastyczności\" umożliwił powstanie zrębów nowego Polin, tak teraz jest on tylko kulą u nogi. Niezależne od każdego komuny kibolskie Widzewiaków są siedliskami zgnilizny moralnej oraz są źródłem niekończących się antagonizmów klasowych. Nie można na takiej podstawie budować działającego państwa. O ile możemy... uszanować odrębność poszczególnych  plemion w kulturowym tego słowa znaczeniu, tak prawna ich niezależność od rządu centralnego musi zostać zlikwidowana."
ZYD_alcohol_rationing: "Racjonowanie alkoholu"
ZYD_alcohol_rationing_desc: "Jednym z najbardziej palących problemów w naszym kraju jest alkoholizm. Pomimo że, jak dekalog mówi - nie będziesz odmawiał żadnego piwa od frajerów, rodzi to mnóstwo problemów z organizacją i morale naszych wojowników. Nie znają oni bowiem umiaru i nie są w stanie pełnić swoich obowiązków przez większość czasu. Chodza nawet głosy że frajerzy specjalnie zaopatrują naszych ludzi w alkohol by ci nie mogli ich skroić. Coś musimy z tym zrobić. Pierwsi Przybysze proponują kolejne rozszerzenie dekalogu - by zapewnić że jedynie koszerne piwo może być spożywane, rozprowadzane przez odpowiedzialnych rabinów i ustanowienie suchych świąt jak Pascha. To na pewno rozwiąże nasz problem."
ZYD_warriors_overview: "Przegląd wojowników"
ZYD_warriors_overview_desc: "Choć wstyd to przyznać, Klub, pomimo odrodzenia ferworu wśród kibiców dalej szoruje po dnie - większość z reprezentacji komun daje sobie radę z naszymi teoretycznie najlepszymi piłkarzami. Jak mamy utrzymywać zapał u Dwunastu Plemion jeżeli ich najważniejsze przedstawicielstwo, źródło najwyższych inspiracji nie są w stanie strzelić gola drużynie złożonej z wiecznie zapijaczonych nierobów? Zresztą, szczerze mówiąc trudno było by ich odróżnić... Musimy znaleźć takich zawodników którzy z zabójczą skutecznością swojej gry, oraz emocjonującym jej stylem natchną naszych żołnierzy do walki w imię Klubu Wybranego, Ludu Wybranego i Boga Wszechmocnego."
ZYD_eleven_felash: "Jedenastka Falaszów"
ZYD_eleven_felash_desc: "Pierwsi Przybysze widząc problemy z pierwszym szeregiem wojowników Jahwe podsunęli nam myśl o sprowadzeniu czarnoskórych piłkarzy wyznania mojżeszowego. Oczywiście ci utalentowani zawodnicy nie przybędą do nas za darmo, jednak jest to gra warta świeczki. Oprócz posiadania prawdziwego dream teamu, podkreślimy dzięki nim religijną jedność Ludu Wybranego i zachęcimy naszych zagranicznych Braci do wsparcia wysiłku w spuszczaniu wpierdolu Filistynom i Ammonitom z innych klubów. ŁKS-iarze już wystarczająco długo obrażali nas i Jahwe swoimi krzywymi mordami."
ZYD_eleven_sons_of_labour: "Jedenastka Ludzi Pracy"
ZYD_eleven_sons_of_labour_desc: "Drudzy Przybysze zaproponowali abyśmy uszanowali tych którzy najwięcej wysiłku wkładają w budowę państwa a więc robotników. Choć powołanie frajerów do jedenastki RTS- u może być dla członków dwunastu plemion pewnym szokiem i zapewne zaczną się z tego powodu niepokoje, tak Drudzy Przybysze wraz z Kibicem na czele podkreślą iż, poprawi to naszą opinię wśród samych frajerów a tym samym podniesie wydajność ich pracy. Na pytanie o ew. zdolności piłkarskie tej drużyny, Kibic odpowiedział, iż osobiście dopilnuje aby każdy mecz zakończył się jej zwycięstwem - odparł, że go na to stać a w \"NIE\" opisze wszystko tak, jak być powinno."
ZYD_pitches_of_prayer: "Błogosławione boiska"
ZYD_pitches_of_prayer_desc: "Dzień meczowy to coś więcej niż okazja na ustawkę. Wraz z odgłosem pierwszego gwizdka, przez trybuny niosą się pieśni wiary. Pośród naszych zawodników RTSu odradzają się takie cnoty jak siła Samsona, odwaga Dawida czy wytrwałość Jozuego. Każdy gol jest potwierdzeniem przymierza zawartego z Jahwe, każde zwycięstwo i każdy wyśpiewany wspólnie na trybunach psalm - jest dziękczynnym aktem wiary. Nieśmiertelne nauki Abrama, Mojżesza, Izajasza, Ezekielia czy Jeremiasza odżywają w nas za każdym razem gdy czerwone flary rozświetlają nieboskłon.\n\nDzień święty należy święcić!"
ZYD_communal_and_robbery_economy: "Gospodarka komunalno-rabunkowa"
ZYD_communal_and_robbery_economy_desc: "Cały obszar Nowego Kanaan jest podzielony pomiędzy dwanaście plemion. Ich członkowie żyją w komunach liczących po kilkuset członków gdzie piją piwo, oglądają mecze i napierdalają się nawzajem. Oczywiście nie pracują a jedynie pobierają fundusze od frajerów, czyli tych którzy posiadają zatrudnienie. W teorii miało im to pozwolić na swobodne uczenie się walki wręcz, studiowanie Tory oraz modlitwy za Klub i Naród. System ten nie może być dłużej utrzymywany - nasza armia to zapijaczony, pasożytniczy motłoch który nie umie ani trzymać prosto kija ani zacytować chociażby pół wersu Księgi Liczb. Tego wersu. - Nie wiedzą jak, ani za co mają walczyć. Na dodatek pochłaniają ogromną liczbę dóbr której nikt nie jest w stanie kontrolować"
ZYD_wrath_of_the_losers: "Gniew Frajerów"
ZYD_wrath_of_the_losers_desc: "Oprócz warstwy kapłańsko-przywódczej i widzewiaków, trzecią grupą społeczną w naszym państwie są frajerzy - osoby pracujące oraz cele rabunku i wpierdoli. O ile na początku udawało się nam ich trzymać w ryzach tak teraz, głównie ze względu na rosnącą pazerność Wojowników Izraela narastają strajki i niepokoje. Oczywiście odbija się to straszliwie na naszej produkcji przemysłowej. NIe pokonamy pogan ani ŁKS-u procami i połamanymi baseballami. Musimy coś z tym zrobić"
ZYD_the_kibbutz_reform: "Reforma Kibucowska"
ZYD_the_kibbutz_reform_desc: "Pierwsi Przybysze twierdzą, że znaleźli rozwiązanie naszych problemów gospodarczych - proponują przekształcenie komun kibolskich w kibuce. Pod pewnym rygorem religijnym nasi wojownicy zaczęli by uprawiać ziemię, oraz wykonywać, początkowo proste prace rzemieślnicze. W ten sposób dalibyśmy im konkretne zajęcie, zwiększyli produkcję oraz moglibyśmy uspokoić nastroje wśród frajerów. Pochłonięci pracą i modlitwą kibole nie będą mieć czasu ani chęci na krojenie. Będzie to jednak trudne aby ich do tego zmusić, większość z nich nie ma fachu w rękach, nie mówiąc już o nogach i głowach. Edukacja religijno-zawodowa trochę potrwa."
ZYD_sending_widzewiaks_to_factories: "Wysłanie Widzewiaków do fabryk"
ZYD_sending_widzewiaks_to_factories_desc: "Drudzy Przybysze uważają, że najlepszym wyjściem byłaby faktyczna bądź częściowa likwidacja komun oraz wysłanie widzewiaków do fabryk w charakterze pracowników oraz \"nieformalnych strażników\". Parę miłych słówek, krótkie szkolenie \"polityczno-religijne\" i wśród frajerów zapanuje spokój a Widzewiacy wreszcie się nam do czegoś przysłużą. Kibic wziął na siebie organizację tego przedsięwzięcia oraz jego \"ideologiczno-medialną podbudowę\". Nie potrwa to długo, a efekty mogą być... wyjątkowo owocne."
ZYD_usury_as_an_alternative_to_robbery: "Lichwa - Alternatywa dla rabunku"
ZYD_usury_as_an_alternative_to_robbery_desc: "Pomimo iż tradycyjne krojenie jest nieodłączną częścią etosu Widzewiaków, podtrzymywanie tego obyczaju niesie za sobą wiele komplikacji - ciężko jest sterować gospodarką gdy każdy plan jest kontrowany odgórnymi akcjami wojowników Jahwe. Po wielu dniach studiowania świętych tekstów oraz w koperacji z Drugimi Przybyszami spod znaku Kibica, nasi uczeni w wierze znaleźli sposób na rozwiązanie tego problemu. Lichwa dla frajerów. To jako operacja finansowa samo w sobie jest prostym i przewidywalnym czynnikiem, i z pewnością odpowiednie interpretacje mogą uznać to za równoznaczne z krojeniem. Krótki kurs w gospodarce Żydowskiej wyjaśni wszystkie nieścisłości i pokaże, że jest to o wiele bardziej dochodowe niż zwykłe krojenie."
ZYD_discuss_of_the_high_command: "Sprawa Naczelnego Dowództwa"
ZYD_discuss_of_the_high_command_desc: "Dzięki uczynieniu koniecznych reform gospodarczych i poskromieniu popędów naszych braci możemy zacząć myśleć o opanowaniu całego województwa i co najważniejsze - powrotu do naszego Prawdziwego, Pierwotnego Kanaan - Łodzi. Na drodze do Wojny o Ojczyznę i powrotu stoją nam tylko ŁKS-iarscy Synowie i Córy Koryntu, bezbożni Jebusyci po studiach w Pabianicach, którzy rudych przepuszczali w kolejkach, dzikusy co wylizują talerze po bułkach i Reksia z Krecikiem mylą. Wojownicy nasi często nie wiedzą jednak jak walczyć, myślą że kijów używa się do gry. Musimy wybrać wodzów którzy nauczą ich sztuki wojny i poprowadzą ich przeciwko Zarazie Śródmieścia."
ZYD_rabbis_as_commanders: "Dowództwo w Rękach Rabinów - Trenerów"
ZYD_rabbis_as_commanders_desc: "Kluczem do sukcesu zawsze są odpowiednie morale oraz wsparcie z samej góry. Rabini udowodnili już, że potrafią zmotywować Widzewiaków do działania: ich inicjatywy na nowo rozbudziły ogień wiary wśród Ludu Wybranego. Płomienne kazania i przemawiające do wyobraźni przypowieści każdego dnia uczą nas o sile Odnowionego Przymierza oraz tych którzy nie są go godni. Po przemowach przychodzi okres na intensywny trening fizyczny w czasie którego odśpiewywane  są psalmy. Oddanie dowództwa rabinom wydaje się być oczywiste - Dwanaście Plemion weszło by z nimi nawet do płonącej Sodomy."
ZYD_good_old_comrades: "Starzy dobrzy Towarzysze"
ZYD_good_old_comrades_desc: "Choć Jahwe odnowieniem przymierza ukazał nam swą łaskę tak arogancją byłoby wymagać od niego wsparcia w każdym momencie. Musimy oprzeć naszą armię na solidnych podstawach a religijne uniesienia do takich nie należą. Choć wielu zmarło, wciąż są wśród nas dawni oficerowie z czasów kiedy armia Polin walczyła pod Czerwonym Sztandarem i Boskimi auspicjami. Ich wiedza oraz ich dzieci będą stanowić głowę naszej nowej armii. Regularny, profesjonalny trening, szkolenia polityczno-religijne, baczne oko tajnych towarzyszy oraz fala urobią Widzewiaków w siłę, przed którą będą drżeć nasi wrogowie."
ZYD_sanctioning_the_kibbutz_cult_of_strength: "Usankcjonowanie kibolskiego kultu siły"
ZYD_sanctioning_the_kibbutz_cult_of_strength_desc: "Adoracja siły, brutalności i dominacji jest rozpowszechniona wśród Widzewiaków. Dla samej chwały, władzy nad innymi czy po prostu by udowodnić że mają jaja, są w stanie robić rzeczy które nikt inny by się nie odważył. Są niezrównani w swojej brawurze na polach bitew. Niektórzy z co bardziej radykalnych rabinów uważają, że to dlatego że są podświadomie dumni ze swojego przymierza z Jahwe i z łaski jaką obdarzył ich Pan. Uważają również że akurat ten element tradycji Ultrasów powinien być wyniesiony na piedestał i wyświęcony. Bo Ten, Który Jest, wybrał nas by wszyscy frajerzy drżeli w strachu przed nami."
ZYD_davids_army: "Wspaniali wojownicy Dawida"
ZYD_davids_army_desc: "Dwanaście Plemion staje się coraz bardziej przypominać starożytne plemiona naszej pierwszej Ojczyzny. Noszą na sobie stalowe napierśniki ze złomu i tarcze zrobione z metalu, wypolerowane tak bardzo, że słońce odbijające się w nich oślepia przeciwników. Są śmiertelnie skuteczni w użyciu proc i zdobycznych karabinów. Wszystko to pod czujnym okiem rabinów, przy akompaniamencie psalmów Króla Dawida, przy świetle z menor i odgłosach stadionowych z meczy Widzewa. Nawet nasza wyjściowa jedenastka założyła sandały i tuniki z logiem Wybranego Klubu i Gwiazdą Dawida. Teraz jesteśmy niczym Drugi Król - niepozorni, lecz gotowi pokonać każdego Goliata który stanie nam na drodze. I tak jak on, jesteśmy gotowi przywrócić chwałę Narodowi Wybranemu. Bo to jest nasz święty obowiązek."
ZYD_recreation_of_wzw: "Odtworzenie Wojskowej Służby Wewnętrznej"
ZYD_recreation_of_wzw_desc: "Nasze stare-nowe Ludowe wojsko musi być pewne. Najlepiej aby zajęli się tym profesjonaliści. Rabini rozbudzający religijny obłęd nie mogą tego zagwarantować. Istniała niegdyś organizacja która wzorowo kontrolowała nasze siły zbrojne, chroniąc je przed wywrotowymi ideami oraz dbając o odpowiednie wzmorzenie idologiczne. Musimy zrekonstruować Wojskową Służbę Wewnętrzną aby dbała o czystość naszej Armii. Kadrę stanowić będą najinteligentniejsi oraz najbardziej posłuszni Widzewiacy wyszkoleni przez pozostałych przy życiu dawnych oficerów formacji. Będą również doskonałą podwaliną naszego wywiadu oraz kontrwywiadu."
ZYD_restoration_of_discipline: "Przywrócenie dyscypliny"
ZYD_restoration_of_discipline_desc: "Udało się nam dokonać niemożliwego - dawni, nieokrzesani kibole myślący tylko o kolejnym piwie i spuszczaniu wpierdolu fra... masom pracującym miast i wsi, dziś maszerują w równym kroku, w jednakowym umundurowaniu, śpiewając przy tym międzynarodówkę. Wszystko to pod czujnym okiem wywiadowców z WSW oraz pewnych ideologiczno - religijnie dowódców. Jak pisze Kibic w \"NIE\", \"nikt nie ma już wątpliwości - PŻPR znów ma siły i środki aby zaprowadzić porządek w brunatnej Polskiej dziczy. Polsko-Żydowska Armia Kibolsko-Robotnicza czeka na rozkaz aby rozprawić z się Endecko-Filistyńską konrrewolucją. Pierwszym celem będą ŁKS-iarscy antysemiccy rozbójnicy i wyzyskiwacze robotników\"."
ZYD_sharpening_the_old_sticks: "Struganie nowych kijów"
ZYD_sharpening_the_old_sticks_desc: "Broni jeszcze będzie nam pod dostatkiem. Tylko jej potrzeba nam teraz aby wyruszyć w święty bój. Rabin znów wyruszył w trasę swoją Arką Przymierza. Datki już w niej się nie mieszczą. Każdy składa się na nasz wspólny wysiłek. Każdy zdolny do dzierżenie bojowego kija baseballowego będzie gotów aby spełnić swoje powinności wobec Jahwe, wobec swojego Ludu i Klubu. Piłkarze również podróżują od miasta do miasta, od komuny do komuny, od wsi do wsi, wołając o wzmożenie wysiłku. W lasach tymczasem panuje cisza. Czuć od nich smród strachu. Czas aby zaprowadzić porządek w nowym Kanaan. Potem przyjdzie czas na Stare."
ZYD_pacyfication_of_the_lks_remnants: "Zamach na Goliata"
ZYD_pacyfication_of_the_lks_remnants_desc: "Przez ostatni rok żyliśmy w strachu na prawdziwie Hiobowej ziemi. Niczym Hagar która dała Abrahamowi syna przez swoje oddanie Bogu, tak i my staliśmy się równie silni dzięki odnowionemu Przymierzu. Mimo to, nie możemy się tu zatrzymywać. Poza naszymi granicami nadal czyhają bandy przeklętych potomków bękartów Lota i jego córek - Ammonitów Retkińskich i Moabitów Poleskich. Ich egzystencja jest obrazą dla majestatu Jahwe. Nie pozwolimy bandytom nacjonalistycznym terroryzować plemion i ludzi którzy żyją w Trzecim, Tymczasowym Kanaan. Na naszej ziemi."
ZYD_forced_converions: "Przymusowe konwersje"
ZYD_forced_converions_desc: "Rabini wysunęli interesującą propozycję w sprawie naszego podejścia do ŁKS - siarzy. Przypomnieli o istnieniu w pradawnych czasach Izraela ludu Samarytan. Byli to Żydzi których nie obejmowało Przymierze - konwertyci z innych wyznań. Pełnili funkcje gastarbeiterów oraz ludzi od czarnej roboty, niegodnej dla członków Ludu Wybranego. Nic nie stoi na przeszkodzie aby odnowić istnienie Samrytan w naszych, nowoczesnych warunkach. Pojmani kibole ŁKS-u, jeżeli będą chcieli wrócić na wolność będą zmuszeni aby uznać moc Jahwe. A więc i naszą władzę."
ZYD_forced_labor: "Przymusowe prace"
ZYD_forced_labor_desc: "Że musimy uporać się z ŁKS-em to wiadome, ci polscy faszyści nie mogą być dłużej na wolności i rabować bezzasadnie naszych towarzyszy robotników. Ale po co mamy marnować ich potencjał. Wielu z nich nie wytrzyma presji, i wpadną w nasze ręce. A ci którzy nie pracują, nie jedzą. A pracować można na różne sposoby, na przykład przy wyrębie lasu czy kopaniu torfu. Czasem da się nawet po odpowiednio długim stażu coś osiągnąć. Niechaj będzie to wolność. Oczywiście wolność pod nadzorem WSW. W końcu mowa o elemencie niepewnym polityczno-religijnie..."
ZYD_taking_the_dogs_off_the_leash: "Spuszczanie psów ze smyczy"
ZYD_taking_the_dogs_off_the_leash_desc: "Płomień wiary rozbudzony w sercach wielbicieli Klubu Wybranego jest niczym ten który goreje w trzewiach Lewiatana. Strawi on wszystko, co stać będzie na jego drodze. Pozostawi on za sobą jedynie popioły użyźniające ziemię którą uprawiać będą frajerscy oracze. Doprawdy straszliwy jest gniew dwunastu plemion, słowo groźby z ich ust potrafiłoby zatrzymać serce słabeuszy w bezruchu. Nie ma nadziei dla wrogów synów Izraela, potomków Dawida i Salomona, wnuków Mojżesza. Kanaan spłyną krwią, Stare i Nowe. To będzie nasza ofiara, prawdziwy baranek Boży."
ZYD_zomo_action: "Akcja ŻOMO"
ZYD_zomo_action_desc: "Kto jest lepiej przygotowany do walki z plagą antysyjonistycznego  bandytyzmu niż specjalnie wyszkolone, zmotoryzowane oddziały sił do spraw wyjątkowych? Nawet najmocniej spojona nienawiścią klasowo - narodową banda rabusiów przegra w bezpośrednim stacie ze zdyscyplinowaną siłą warstw pracujących, dysponującą przewagą technologiczną. Rezerwy Lublinów oraz T4 które posiadamy, wystarczą do powołania brygady specjalnej, naszej dumy i grozy dla wroga. Zarówno zewnętrznego jak i wewnętrznego."
ZYD_rts_is_a_power: "RTS TO POTĘGA!"
ZYD_rts_is_a_power_desc: "Lud Wybrany na powrót jest jednością. NIkt nie jest w stanie równać się z naszą armią. Nikt nie je do syta tak jak nasi bracia i nasze siostry. Jahwe nie musiał dawać nam manny, i strumieni wody pitnej. Na pustyni, niebezpiecznej i niegościnnej, z piachu wznieśliśmy prawdziwą oazę. Wystarczyło Jego Słowo i nasza nieugięta wola, wiara w zwycięstwo Ludu i Klubu Wybranego. Rabin stoi dziś na Tomaszowskim Kominie i patrzy jak wspaniały jest Kraj dookoła. Czeka na słowo od Jahwe..."
