##Characters##
POLITICS_RED_RABBI_DESC: "If you asked any Widzewiak in 2025 what his stance on Jewry is, he would likely respond with the most brutal antisemitic accusations one could think of. Had the Siege of Widzew not happened, he would likely say the same things nowadays. \n\nThe ringleader of the hooligans of Widzew, nowadays referred to as Rabin by his men, took part in religious practices even in his early childhood, but it was not until his late teenagerhood when he started feeling a *real* religious calling. Serving as an altar boy and going through ever more extensive religious education in his primary and middle school, Rabin was what every Catholic Pole should strive to be - a man well-versed in Bible study and manual work, who adheres to Polish, conservative values and leads his fellow Widzew ultras in street fights. As all self-respecting Widzew ultras at the time, he was also highly anti-Semitic - this was due to the common jokes amongst rival clubs that its members are the descendants of the Łódź Jewry living in Widzew that got exterminated during the Second World War. These animosities amongst football ultras in Łódź only grew during the election fraud crisis and the subsequent fall of the nation - the remains of Widzew Jewry - mostly socialist in ideology - were an obvious target to blame, and as the state apparatus lost all power - frontier justice became the main judicial system of the country. \n\nAnd ŁKS was more than happy to capitalize on this. \n\nWith the city falling into complete chaos, the ultras organized themselves into a makeshift army to deal with the commies, Jews and their own rivals once and for all. Six months later, Widzew still stood undefeated. Having to cooperate in order to survive, the district's defense, orchestrated by the Jewry, turned out to be impossible for ŁKS to break through. As the attackers' lines faltered, a vicious counterattack commenced, in which ŁKS POWs were taunted by Widzew ultras mockingly converting to Judaism before executing them. Afterwards, the alliance persisted, and although Widzewiaks were still far from being true, well-read Jews, their connection and dependence on them grew as the communist elites with Jerzy Urban at helm created a state for them and their new hooligan henchmen, of whom Rabin was made the leader and representative. \n\nNow, him and his boys are as lacking in subtlety as in foreskins. Their club scarves have been outfitted with golden Stars of David, and whenever they train volleys, they sing Jewish piyyutim. \nWherever they go, whoever they fight, the Widzew club hymn echoes far."

#########################WYCIĘTE Z OPISU RABINA, MOŻE DA SIĘ NA COŚ PRZEROBIĆ I WYKORZYSTAĆ.  
#This wasn't mere streetfighting - the ŁKS army blocked the Widzew District from the outside world, sieging it down and attempting everything they could to kill off the Widzewiaks and their Jewish neighbours - from bombarding their opponents with rocks and Molotov cocktails to sabotaging the city's power grid, water sistem and sewerage. Cut off from food and basic amenities, there was no other way for Widzew than to cooperate, and given the football ultras'...  *limited brain power*, the Jewry took the helm in organising the city district's defenses. Food and water were rationed, makeshift fortifications and latrines were installed, weapons were distributed, and so - time passed. \n\nDays. Weeks. Months of bombardment. And yet - getting with rocks and Molotovs, shitting in makeshift latrines, defending against ŁKS assaults and having to ration almost rotting food and water - Widzew withstood. After this much time, the connection between the football ultras and Jews became real, and ŁKS' morale completely faltered after half a year spent on failing to break through. of their football nemesis and the Jews. 
#''-LE OLE-OLE, OLEEEE! \nWIELKI PAN NASZ JEST, JAHWE! \nOTO, OTO ARMIA TWA! \nWIDZE- WIDZE- WIDZEEEWA! \n\nLA-LALALALA, LALAAA! \nLA-LALALALA, LALAAA...! \nLA-LALALALA, LALAAA! \nLA-LALALA, LALA...''

POLITICS_JERZY_URBAN_DESC: "A man born during turbulent times for Jews in Poland, forced into hiding along with his family, is yet again facing turbulent times, though this time for all his countrymen alike. He didn't receive proper education until the end of the Second World War, even then he has never graduated from any University. Despite those obstacles, he quickly began to write for state-controlled newspapers, often harshly criticizing the government's policies. Eventually, he became a spokesperson for the communist government in 1981. Being responsible for propaganda during the infamous rule of General Jaruzelski, he became known as the 'Goebbels of the Martial Law era'. After the fall of communism, he became a member of Polish social democratic parties (SdRP and SLD), a famous internet personality popular among the youth and a successful stock trader, becoming the 98th most wealthy Pole in 2004. An experienced propagandist and political schemer, he managed to survive in the third collapse of the Polish state. After the dust settled in Łódź, he was invited to create a government with the Hooligans of Widzew, who were desperate to find competent Jews for their ruling structure."


