ZYD_mobile_ark_desc: "Nasza drużyna piłkarska jest boska. Wszak, tylko Bóg jeden wie jak zagrają. Przez to, gdziekolwiek się nie udamy, musimy szerzyć nowinę o jej boskości. Do tego będziemy potrzebować przykazań i Arki Przymierza która owe przechowuje. Ale jak jesteśmy w stanie bezpiecznie transportować tak ważna relikwię? Odpowiedź jest bardzo prosta:\n\nDaewoo Lanos. Pancerność tego pojazdu powinna wystarczyć by odeprzeć jakiekolwiek ataki naszych wrogów. To cacko nawet posiada automatyczny zamek! Nie ma lepszego miejsca na przechowywania nawet najbardziej świętych relikwi niż Lanos."
ZYD_minority_rule2_desc: "The Suckers still don't like us, in fact, they hate us even more than before, but at least they're finally being put in their place. Increased muggings and beatings have guaranteed their fear and ŻOMO "interrogations" deal with any potential troublemakers. Some of them still can't accept our rule, but we'll make sure they learn not to oppose us."
ZYD_armia_dawida_desc: "Having enshrined the new commandments, we have managed to instill greater discipline and rigor into our fighters. No longer will they be just a raving band of Hooligans looking for their next scrap. Though the tradition of brutality and savagery remains, now their formations at least resemble those of an actual army. Just like the proud warriors of Israel, the Twelve Tribes of Widzew stand together as brothers, fighting against the Polish heathens in the name of Yahweh."
ZYD_armia_dawida2_desc: "Having enshrined the new commandments, we have managed to instill greater discipline and rigor into our fighters. No longer will they be just a raving band of Hooligans looking for their next scrap. Though the tradition of brutality and savagery remains, now their formations at least resemble those of an actual army. Just like the proud warriors of Israel, the Twelve Tribes of Widzew stand together as brothers, fighting against the Polish heathens in the name of Yahweh."

ZYD_LKS_guerilla_desc: "ŁKS ultras are just too proud to to accept Yahweh's dominance over earthly matters and too cowardly wage open war against us in defiance of the established order. Clinging to their antiquated beliefs and old loyalties,  they hide in their lairs like rats and picking off our men one by one. No matter how many militiamen we deploy to guard around their shady hovels and how many homes we raid to search for ŁKS sympathizers, they just continue to wreak havoc among our ranks, slowly hunting Jews and Reds to extinction - like parasites killing an animal from within."
ZYD_ekonomia_urbana_desc: "Long ago, the Hooligans seized the land of New Canaan and its wealth, defending it form abominable tribe of ŁKS. They've put New Canaan under Yahweh's patronage and control, but in turn, they used up all of its resources, desolating the markets and driving its workshops into closure. \n§RAnd Yahweh saw this desolation, and He disapproved of it.§! \n\nThus, He gathered the greatest leaders, economists, and stewards amongst His People and sent them to command the Hooligans to take up tools and learn craftsmanship - to rebuild its workshops and create goods, tools, and various trinkets and artifacts worthy of a nation chosen by God himself, and to bring the populace back to its markets with those crafts to acquire wealth and further bankroll the Chosen People's cause."
ZYD_ekonomia_urbana2_desc: "Long ago, the Hooligans seized the land of New Canaan and its wealth, defending it form abominable tribe of ŁKS. They've put New Canaan under Yahweh's patronage and control, but in turn, they used up all of its resources, desolating the markets and driving its workshops into closure. \n§RAnd Yahweh saw this desolation, and He disapproved of it.§! \n\nThus, He gathered the greatest leaders, economists, and stewards amongst His People and sent them to command the Hooligans to take up tools and learn craftsmanship - to rebuild its workshops and create goods, tools, and various trinkets and artifacts worthy of a nation chosen by God himself, and to bring the populace back to its markets with those crafts to acquire wealth and further bankroll the Chosen People's cause. \n\nAnd so, over time, New Canaan returned to its former glory, and its people were once again well fed, well clothed, and able, learned in many skills and crafts."
ZYD_armia_urbana2_desc: "What was at first perceived as an encroachment on the Tribes' freedoms and social standing has now become something that every true Widzewiak aspires to join, for membership in the Central Club and its Army are synonymous with true belief and elite status. Every day, from kibbutz to kibbutz, buses packed to the brim with Hooligans head towards the Central Club's facilities to deliver volunteers to the new unified army's ranks. Comrade Kibic will personally ensure they're whipped into a shape worthy of Yahweh's chosen men."
ZYD_armia_urbana_desc: "The message we've sent to the Tribes is clear. Their autonomy merely hinders our administration, with disorganization and constant petty squabbles paralyzing any efforts to form an effective army, and thus, it must be stripped for the good of the club. Comrade Kibic is right. If we want to reclaim all of New Canaan, Widzew has to become a single, centralized entity - one that instills discipline, hard work, and pride into the hearts of its members."
ZYD_pitch_failures_desc: "Our constant failures to win a match against the other communes have been a great hit to our people's morale, actively undermining our legitimacy and efforts to keep the region unified. The Hooligans are starting to get uppity, regularly threatening the players and our administration, as well as taking their anger out on neighboring infrastructure. We have to find a way to deliver them some better results, or else our territory will soon fall into complete anarchy."
ZYD_minority_rule_desc: "There are only so many Hooligans, only so many Jews, and only so many Communists in our state. And it gets even harder to find someone who fits all three criteria. Most of our population are normal people, Suckers we call them. Simple-minded Catholics, blind to the light of Yahweh. We can mostly keep them in check with baseball bats, but they surely as hell don't like us. If anything goes wrong, there's no doubt they'll turn on us without a second thought."
ZYD_unfinished_collectivization_desc: "We have long tried to adopt the ideals of Communism, however, it has thus far been a slow and arduous process. As of now, we have not yet managed to fully collectivize the means of production and the goods of the wealthy, putting us in an uncomfortable middle ground between two contrasting economic systems, causing mass confusion for our working class and drawing the ire of some of our more radical supporters. \nComrade Marx would not look upon our progress with pride."
ZYD_eleven_falashas_desc: "To fill the gaps left by our team's... less skilled players, we have brought in a brand-new star-studded squad of foreign talent. Now we can actually exchange more than two passes without kicking the ball away. Or score from something other than a set piece. With such quality, surely, they will become fan favorites in no time! Nobody liked the old guys anyway."
ZYD_eleven_falashas2_desc: "To fill the gaps left by our team's... less skilled players, we have brought in a brand-new star-studded squad of foreign talent. Now we can actually exchange more than two passes without kicking the ball away. Or score from something other than a set piece. With such quality, surely, they will become fan favorites in no time! Nobody liked the old guys anyway."
ZYD_eleven_praca_desc: "While the Suckers don't really make for the best of players, we have ensured that whoever faces up against them is even worse. Those familiar with the practice might call it immoral, but they can't disagree with how beneficial this decision has been to our popularity, even among the lowly workers, who can now feel represented by a squad made up of their own kind."
ZYD_eleven_praca2_desc: "While the Suckers don't really make for the best of players, we have ensured that whoever faces up against them is even worse. Those familiar with the practice might call it immoral, but they can't disagree with how beneficial this decision has been to our popularity, even among the lowly workers, who can now feel represented by a squad made up of their own kind."
ZYD_i_znow_bijatyka_desc: "The Hooligans simply cannot stay put. Getting those savages to stop brutalizing each other in their weekly Ustawka is near-impossible, with some of our best men never recovering from the injuries they sustain at the hand of another of Yahweh's children. Our state is bleeding itself out in constant internal brawls, and if we don't find a way to quickly pacify the offenders, we might find ourselves losing all our remaining authority."
ZYD_i_znow_bijatyka2_desc: "§R Somehow, our internal stability has deteriorated even further, and the brawls have completely overtaken our territory. New Canaan is on fire and our state is close to shattering under the pressure. We need to reverse this madness and re-establish control at once! Should we fail to quell these riots, the Covenant will effectively be broken, and the Promised Land forever lost.§!"
ZYD_ekonomia_kradziejsko_kibolska_desc: "Our economy bleeds due to the foolish, short-sighted actions of the Tribes. There is nothing wrong with stealing from the Suckers, but the scale at which they do it is getting completely out of hand. They take all they can find, not even batting an eye whether anything remains for their less enterprising comrades. It's all fun and games until we don't have any food and weapons because a group of Hooligans decided to hoard multiple warehouses worth of essential goods."
ZYD_ekonomia_kradziejsko_kibolska2_desc: "Our economy bleeds due to the foolish, short-sighted actions of the Tribes. There is nothing wrong with stealing from the Suckers, but the scale at which they do it is getting completely out of hand. They take all they can find, not even batting an eye whether anything remains for their less enterprising comrades. It's all fun and games until we don't have any food and weapons because a group of Hooligans decided to hoard multiple warehouses worth of essential goods."
ZYD_ekonomia_kibucowska_desc: "Getting the Hooligans to give up on their ways of mugging everyone who looks at them the wrong way will be a long and arduous process, but our economy depends on its success. We have to turn them away from their current lives of free-roaming Ultras and teach them how to be good, virtuous Jews. They must learn the value of honest work and faithful adherence, and whilst they may grumble, they'll thank us one day for securing their salvation."
ZYD_ekonomia_kibucowska2: "Growing Kibbutz Economy"
ZYD_ekonomia_kibucowska2_desc: "As more and more Hooligans transform their settlements into Kibbutzes and their old lifestyles of disregarding laws and commandments into ones of piety, honest work, and tending to their land and possessions, wealth begins to trickle in, and trade caravans return. An age of prosperity has started in earnest in New Canaan. All across the region songs of praise resonate, thanking Yahweh for his blessings. At last, we have shown ourselves to be worthy of the Promised Land."

 ##First Tree##
ZYD_genesis: "Bereshit"
ZYD_genesis_desc: "Na początku było słowo. A słowo w ogień się obróciło."
ZYD_exodus: "Shemot"
ZYD_exodus_desc: "Czterdzieści dni wędrował Rabbi prowadząc dwanaście plemion do Puszcz Obiecanych. Czwartego dnia głód pojawił się wśród ludu Widzewa. Jeno wiara w Słowo Jahwe trzymała ich o siłach. Wtem Rabbi widząc to, rzekł:\n\n- Głód nas dręczy, Jahwe pomóż swemu Ludowi!"
ZYD_leviticus: "Wayiqra"
ZYD_leviticus_desc: "Rabbi wraz ze swym plemieniem ruszył przybyciu na południe do Tomaszowa, Miastem Pokrzyw zwanego, gdyż w jego centrum ścisłym trzeba było na nie uważać. Tam też ruszyli razem z nim przybysze z pierwotnego Ludu Wybranego. Drudzy Przybysze opowiadali, jak to z dawien dawna dostatkiem słynęła ta miejscowość, kiedy jeszcze fabryka tekstylna w nim działała, a z rzemiosła zręcznego słynęło na Polin całe. Kres temu miał Lewiatan Dolara położyć wraz z reformami co wyssały wszelkie bogactwo z tej ziemi."
ZYD_numbers: "Bemidbar"
ZYD_numbers_desc: "Jahwe rzekł do Rabbiego w namocie spotkań na stacji w Koluszkach, pierwszego dnia trzeciego tygodnia po eksodusie z Widzewia. Rzekł:\nWeź i zlicz wszystkie Widzewskie owieczki i podziel ich według klubów i plemion, każdego z imienia nazywając. Policzycie zgodnie z ich podziałami wszystkich ludzi Widzewa którzy szesnasty rok życia ukończyli i godni są by w armii służyć. Jeden mężczyzna z każdego klubu, każdy z nich będący głową swojego plemienia, pomóc Ci musi w tym czynie."
ZYD_deuteronomy: "Devarim"
ZYD_deuteronomy_desc: "Dekalog\n\n1. Nie będziesz miał klubów cudzych przed RTSem ani Boga poza Jahwe\n2. Nie będziesz brał imienia klubu twego nadaremno\n3. Pamiętaj aby dzień meczowy święcić i race puszczać\n4. Czcij Klub swój, Boga swego i plemię swoje\n5. Kradnij tylko od frajerów oraz wrogów Ludu i Klubu\n6. Nie pożądaj telefonu ani loszki bliźniego swego\n7. Nie bądź konfidentem\n8. Wpierdol po równo wrogom spuszczaj\n9. Piwa nie odmawiaj\n10. Ani każdej innej rzeczy którą ci frajerzy dają"
ZYD_constant_brawls: "Nieustające burdy"
ZYD_constant_brawls_desc: "Powiedzieć, że nasze włości wrzą od niepokojów byłoby eufemizmem. Widzewiacy krążą pomiędzy komunami a miejscami do krojenia frajerów wszczynając bójki, często śmiertelne, grabią wszystko co jest nieprzymocowane do ziemi. W lasach tymczasem czają się bojówki ŁKS-u którzy przybyli tu wygnani z Łodzi przez Pana Dialogu, gdy nie chcieli założyć jarmułek. Samotni wędrowcy często giną bez śladu. Nikt nie jest pewny swojej przyszłości a pomiędzy Pierwszymi a Drugimi Przybyszami narasta konflikt odnośnie sposobów wyjścia z kryzysu. "
ZYD_mutual_destruction: "Wzajemne wyniszczenie"
ZYD_mutual_destruction_desc: "Pomiędzy dwunastoma plemionami trwa ciągła walka o zasoby. Z każdym dniem coraz bardziej niknie idea jedności Ludu i Klubu Wybranego. Miast tego do głosu dochodzą najbardziej przyziemne i prymitywne partykularyzmy. Jeżeli nie zatrzymamy tego procesu, nie przypominamy Widzewiakom kim są, jakie są ich zadania oraz wrogowie, niedługo całe Nowe Kanaan pogrąży się w chaosie wojny domowej."
ZYD_the_decalogue_upgrade: "Ulepszenie Dekalogu"
ZYD_the_decalogue_upgrade_desc: "Dziś w nocy naszych najbardziej pobożnych mężów nawiedził we śnie sam Jahwe. Twierdzą iż nakazał On im natychmiastowe wprowadzanie poprawek do dekalogu oraz znaczące jego rozszerzenie. Po krótkiej analizie można dostrzec iż postulowane zmiany poważnie zwiększają rygor jakiemu poddani będą Widzewiacy, widoczne jest również położenie nacisku na posłuszeństwo wobec Jahwe oraz mędrców, proroków wiary i Rabbiego. Drudzy przybysze protestują przeciwko zawłaszczaniu kompetencji prawa świeckiego przez prawo religijne. Nie sposób jednak ukryć, że tak rozbudowany dekalog jako podstawa prawna naszego państwa może stać się gwarancją pokoju, jedności i jednomyślności na łonie Ludu Wybranego."
ZYD_limitation_of_the_autonomy_of_the_twelve_tribes: "Ograniczenie autonomii Dwunastu Plemion"
ZYD_limitation_of_the_autonomy_of_the_twelve_tribes_desc: "O ile nie można się nie zgodzić, że system podziału pomiędzy dwanaście plemion z dwunastu ulic Widzewa dzięki swojej \"elastyczności\" umożliwił powstanie zrębów nowego Polin, tak teraz jest on tylko kulą u nogi. Niezależne od każdego komuny kibolskie Widzewiaków są siedliskami zgnilizny moralnej oraz są źródłem niekończących się antagonizmów klasowych. Nie można na takiej podstawie budować działającego państwa. O ile możemy... uszanować odrębność poszczególnych  plemion w kulturowym tego słowa znaczeniu, tak prawna ich niezależność od rządu centralnego musi zostać zlikwidowana."
ZYD_alcohol_rationing: "Racjonowanie alkoholu"
ZYD_alcohol_rationing_desc: "One of the most pressing problems affecting our land is alcoholism. Although, according to the decalogue, we cannot refuse any beer from suckers, it causes huge problems with the organization and morale of our warriors. They do not know moderation and are not able to go about their duties for most of the time. There are even rumors that the losers deliberately supply them with alcohol so that Widzewiaks wouldn't be able to rob them. Something has to be done about it. The first arrivals proposed to extend the Decalogue even further - by imposing the obligation to consume kosher beer, distributed directly by rabbis and establishing non-alcoholic holidays such as Passover, we will manage to reduce this problem."
ZYD_warriors_overview: "Przegląd wojowników"
ZYD_warriors_overview_desc: "Choć wstyd to przyznać, Klub, pomimo odrodzenia ferworu wśród kibiców dalej szoruje po dnie - większość z reprezentacji komun daje sobie radę z naszymi teoretycznie najlepszymi piłkarzami. Jak mamy utrzymywać zapał u Dwunastu Plemion jeżeli ich najważniejsze przedstawicielstwo, źródło najwyższych inspiracji nie są w stanie strzelić gola drużynie złożonej z wiecznie zapijaczonych nierobów? Zresztą, szczerze mówiąc trudno było by ich odróżnić... Musimy znaleźć takich zawodników którzy z zabójczą skutecznością swojej gry, oraz emocjonującym jej stylem natchną naszych żołnierzy do walki w imię Klubu Wybranego, Ludu Wybranego i Boga Wszechmocnego."
ZYD_eleven_felash: "Jedenastka Falaszów"
ZYD_eleven_felash_desc: "Pierwsi Przybysze widząc problemy z pierwszym szeregiem wojowników Jahwe podsunęli nam myśl o sprowadzeniu czarnoskórych piłkarzy wyznania mojżeszowego. Oczywiście ci utalentowani zawodnicy nie przybędą do nas za darmo, jednak jest to gra warta świeczki. Oprócz posiadania prawdziwego dream teamu, podkreślimy dzięki nim religijną jedność Ludu Wybranego i zachęcimy naszych zagranicznych Braci do wsparcia wysiłku w spuszczaniu wpierdolu Filistynom i Ammonitom z innych klubów. ŁKS-iarze już wystarczająco długo obrażali nas i Jahwe swoimi krzywymi mordami."
ZYD_eleven_sons_of_labour: "Jedenastka Ludzi Pracy"
ZYD_eleven_sons_of_labour_desc: "Drudzy Przybysze zaproponowali abyśmy uszanowali tych którzy najwięcej wysiłku wkładają w budowę państwa a więc robotników. Choć powołanie frajerów do jedenastki RTS- u może być dla członków dwunastu plemion pewnym szokiem i zapewne zaczną się z tego powodu niepokoje, tak Drudzy Przybysze wraz z Kibicem na czele podkreślą iż, poprawi to naszą opinię wśród samych frajerów a tym samym podniesie wydajność ich pracy. Na pytanie o ew. zdolności piłkarskie tej drużyny, Kibic odpowiedział, iż osobiście dopilnuje aby każdy mecz zakończył się jej zwycięstwem - odparł, że go na to stać a w \"NIE\" opisze wszystko tak, jak być powinno."
ZYD_pitches_of_prayer: "Pitches of Prayer"
ZYD_pitches_of_prayer_desc: "The day of the match is so much more than an opportunity for us to have a brawl. Together with the first whistle, the songs of faith resound. Within RTS' players on the pitch Samson's strength, David's bravery and Joshua's tenacity are reborn. Each goal confirms the covenant that Yahweh has made with us, each of our victories, each psalm sung together on the pitch - our thanks and our testimony of faith. The immortal teaching of Abraham - Moses - Isaiah - Ezekiel - Jeremiah lives whenever a red flare lights up the sky.\n\nLet's celebrate the Match Day!"
ZYD_communal_and_robbery_economy: "Gospodarka komunalno-rabunkowa"
ZYD_communal_and_robbery_economy_desc: "Cały obszar Nowego Kanaan jest podzielony pomiędzy dwanaście plemion. Ich członkowie żyją w komunach liczących po kilkuset członków gdzie piją piwo, oglądają mecze i napierdalają się nawzajem. Oczywiście nie pracują a jedynie pobierają fundusze od frajerów, czyli tych którzy posiadają zatrudnienie. W teorii miało im to pozwolić na swobodne uczenie się walki wręcz, studiowanie Tory oraz modlitwy za Klub i Naród. System ten nie może być dłużej utrzymywany - nasza armia to zapijaczony, pasożytniczy motłoch który nie umie ani trzymać prosto kija ani zacytować chociażby pół wersu Księgi Liczb. Tego wersu. - Nie wiedzą jak, ani za co mają walczyć. Na dodatek pochłaniają ogromną liczbę dóbr której nikt nie jest w stanie kontrolować"
ZYD_wrath_of_the_losers: "Gniew Frajerów"
ZYD_wrath_of_the_losers_desc: "Oprócz warstwy kapłańsko-przywódczej i widzewiaków, trzecią grupą społeczną w naszym państwie są frajerzy - osoby pracujące oraz cele rabunku i wpierdoli. O ile na początku udawało się nam ich trzymać w ryzach tak teraz, głównie ze względu na rosnącą pazerność Wojowników Izraela narastają strajki i niepokoje. Oczywiście odbija się to straszliwie na naszej produkcji przemysłowej. NIe pokonamy pogan ani ŁKS-u procami i połamanymi baseballami. Musimy coś z tym zrobić"
ZYD_the_kibbutz_reform: "Reforma Kibucowska"
ZYD_the_kibbutz_reform_desc: "Pierwsi Przybysze twierdzą, że znaleźli rozwiązanie naszych problemów gospodarczych - proponują przekształcenie komun kibolskich w kibuce. Pod pewnym rygorem religijnym nasi wojownicy zaczęli by uprawiać ziemię, oraz wykonywać, początkowo proste prace rzemieślnicze. W ten sposób dalibyśmy im konkretne zajęcie, zwiększyli produkcję oraz moglibyśmy uspokoić nastroje wśród frajerów. Pochłonięci pracą i modlitwą kibole nie będą mieć czasu ani chęci na krojenie. Będzie to jednak trudne aby ich do tego zmusić, większość z nich nie ma fachu w rękach, nie mówiąc już o nogach i głowach. Edukacja religijno-zawodowa trochę potrwa."
ZYD_sending_widzewiaks_to_factories: "Wysłanie Widzewiaków do fabryk"
ZYD_sending_widzewiaks_to_factories_desc: "Drudzy Przybysze uważają, że najlepszym wyjściem byłaby faktyczna bądź częściowa likwidacja komun oraz wysłanie widzewiaków do fabryk w charakterze pracowników oraz \"nieformalnych strażników\". Parę miłych słówek, krótkie szkolenie \"polityczno-religijne\" i wśród frajerów zapanuje spokój a Widzewiacy wreszcie się nam do czegoś przysłużą. Kibic wziął na siebie organizację tego przedsięwzięcia oraz jego \"ideologiczno-medialną podbudowę\". Nie potrwa to długo, a efekty mogą być... wyjątkowo owocne."
ZYD_usury_as_an_alternative_to_robbery: "Usury - Alternative to Robbery"
ZYD_usury_as_an_alternative_to_robbery_desc: "Although tradition-honored robbery is an integral part of the ethos of Widzew's people, maintaining this state causes various complications - it is difficult to control the economy when every plan is countered by arbitrary actions of Yahweh's warriors. Our scholars of faith, after many days of studying the sacred texts and in cooperation with the Second visitors from Kibic's sign, have found a solution to this problem. Usury given to suckers, as a financial operation, by its nature is a constant and predictable factor, and in certain, appropriate interpretations it could be synonymous with robbery. A short course in Jewish economics will make it clear to the audience that this is much more profitable than simple robberies."
ZYD_discuss_of_the_high_command: "Sprawa Naczelnego Dowództwa"
ZYD_discuss_of_the_high_command_desc: "Dzięki uczynieniu koniecznych reform gospodarczych i poskromieniu popędów naszych braci możemy zacząć myśleć o opanowaniu całego województwa i co najważniejsze - powrotu do naszego Prawdziwego, Pierwotnego Kanaan - Łodzi. Na drodze do Wojny o Ojczyznę i powrotu stoją nam tylko ŁKS-iarscy Synowie i Córy Koryntu, bezbożni Jebusyci po studiach w Pabianicach, którzy rudych przepuszczali w kolejkach, dzikusy co wylizują talerze po bułkach i Reksia z Krecikiem mylą. Wojownicy nasi często nie wiedzą jednak jak walczyć, myślą że kijów używa się do gry. Musimy wybrać wodzów którzy nauczą ich sztuki wojny i poprowadzą ich przeciwko Zarazie Śródmieścia."
ZYD_rabbis_as_commanders: "Dowództwo w Rękach Rabinów - Trenerów"
ZYD_rabbis_as_commanders_desc: "Kluczem do sukcesu zawsze są odpowiednie morale oraz wsparcie z samej góry. Rabini udowodnili już, że potrafią zmotywować Widzewiaków do działania: ich inicjatywy na nowo rozbudziły ogień wiary wśród Ludu Wybranego. Płomienne kazania i przemawiające do wyobraźni przypowieści każdego dnia uczą nas o sile Odnowionego Przymierza oraz tych którzy nie są go godni. Po przemowach przychodzi okres na intensywny trening fizyczny w czasie którego odśpiewywane  są psalmy. Oddanie dowództwa rabinom wydaje się być oczywiste - Dwanaście Plemion weszło by z nimi nawet do płonącej Sodomy."
ZYD_good_old_comrades: "Starzy dobrzy Towarzysze"
ZYD_good_old_comrades_desc: "Choć Jahwe odnowieniem przymierza ukazał nam swą łaskę tak arogancją byłoby wymagać od niego wsparcia w każdym momencie. Musimy oprzeć naszą armię na solidnych podstawach a religijne uniesienia do takich nie należą. Choć wielu zmarło, wciąż są wśród nas dawni oficerowie z czasów kiedy armia Polin walczyła pod Czerwonym Sztandarem i Boskimi auspicjami. Ich wiedza oraz ich dzieci będą stanowić głowę naszej nowej armii. Regularny, profesjonalny trening, szkolenia polityczno-religijne, baczne oko tajnych towarzyszy oraz fala urobią Widzewiaków w siłę, przed którą będą drżeć nasi wrogowie."
ZYD_sanctioning_the_kibbutz_cult_of_strength: "Sanctioning the Hooligan's Cult of Strength"
ZYD_sanctioning_the_kibbutz_cult_of_strength_desc: "Among Widzewians, adoration of strength, brutality and domination is widespread. For the sake of fame, power over other people and to prove their mettle, they are able to do things that no one else would dare to do. They are second to none in their bravado on the battlefield. Some radical rabbis feel that they are subconsciously proud of their covenant with Yahweh, of the grace He has bestowed upon them. The rabbis also claim that this element of the Hooligans culture should be exposed and sanctified. For He Who Is, chose Us to make all suckers tremble before us."
ZYD_davids_army: "David's Mighty Warriors"
ZYD_davids_army_desc: "The Twelve Tribes are becoming more and more like the ancient tribes of the first Homeland. They wear steel breastplates made of scrap metal, they make shields from it, which they polish in such a way that the sunlight reflecting on them blinds their enemies. They excel in the use of slingshots and captured rifles. All this takes place under the supervision of rabbis, to the sounds of songs written by King David, to the light of the menorah and the sounds of Widzew's football matches. Even our starting eleven put on sandals and tunics with the logo of the Chosen Club and the Star of David. Today we are like our Second King - inconspicuous, but ready to defeat any Goliath that stands in our way. We too are ready to restore the lost glory to the Chosen People. It is our divine duty."
ZYD_recreation_of_wzw: "Refurbishing the Internal Military Service"
ZYD_recreation_of_wzw_desc: "Nasze stare-nowe Ludowe wojsko musi być pewne. Najlepiej aby zajęli się tym profesjonaliści. Rabini rozbudzający religijny obłęd nie mogą tego zagwarantować. Istniała niegdyś organizacja która wzorowo kontrolowała nasze siły zbrojne, chroniąc je przed wywrotowymi ideami oraz dbając o odpowiednie wzmorzenie idologiczne. Musimy zrekonstruować Wojskową Służbę Wewnętrzną aby dbała o czystość naszej Armii. Kadrę stanowić będą najinteligentniejsi oraz najbardziej posłuszni Widzewiacy wyszkoleni przez pozostałych przy życiu dawnych oficerów formacji. Będą również doskonałą podwaliną naszego wywiadu oraz kontrwywiadu."
ZYD_restoration_of_discipline: "Przywrócenie dyscypliny"
ZYD_restoration_of_discipline_desc: "Udało się nam dokonać niemożliwego - dawni, nieokrzesani kibole myślący tylko o kolejnym piwie i spuszczaniu wpierdolu fra... masom pracującym miast i wsi, dziś maszerują w równym kroku, w jednakowym umundurowaniu, śpiewając przy tym międzynarodówkę. Wszystko to pod czujnym okiem wywiadowców z WSW oraz pewnych ideologiczno - religijnie dowódców. Jak pisze Kibic w \"NIE\", \"nikt nie ma już wątpliwości - PŻPR znów ma siły i środki aby zaprowadzić porządek w brunatnej Polskiej dziczy. Polsko-Żydowska Armia Kibolsko-Robotnicza czeka na rozkaz aby rozprawić z się Endecko-Filistyńską konrrewolucją. Pierwszym celem będą ŁKS-iarscy antysemiccy rozbójnicy i wyzyskiwacze robotników\"."
ZYD_sharpening_the_old_sticks: "Struganie nowych kijów"
ZYD_sharpening_the_old_sticks_desc: "Broni jeszcze będzie nam pod dostatkiem. Tylko jej potrzeba nam teraz aby wyruszyć w święty bój. Rabbi znów wyruszył w trasę swoją Arką Przymierza. Datki już w niej się nie mieszczą. Każdy składa się na nasz wspólny wysiłek. Każdy zdolny do dzierżenie bojowego kija baseballowego będzie gotów aby spełnić swoje powinności wobec Jahwe, wobec swojego Ludu i Klubu. Piłkarze również podróżują od miasta do miasta, od komuny do komuny, od wsi do wsi, wołając o wzmożenie wysiłku. W lasach tymczasem panuje cisza. Czuć od nich smród strachu. Czas aby zaprowadzić porządek w nowym Kanaan. Potem przyjdzie czas na Stare."
ZYD_pacyfication_of_the_lks_remnants: "Strike against the Goliath"
ZYD_pacyfication_of_the_lks_remnants_desc: "For the last year, we have lived in fear in a truly Jobbish land. Like Hagar who bore Abraham a son through dedication to God, we have become quite strong again through the renewed Covenant. However, we cannot stop there. Across our border there are still bandits - the cursed descendants of the incestuous relationship of Lot and his daughters - the Ammonites of Retkinia, The Moabites of Polesie. Their very existence is an offense to Yahweh's majesty. We will not allow bandits of nationalist origin to terrorize all the tribes and peoples that live in the Third, Provisional Canaan. Our land."
ZYD_forced_converions: "Przymusowe konwersje"
ZYD_forced_converions_desc: "Rabini wysunęli interesującą propozycję w sprawie naszego podejścia do ŁKS - siarzy. Przypomnieli o istnieniu w pradawnych czasach Izraela ludu Samarytan. Byli to Żydzi których nie obejmowało Przymierze - konwertyci z innych wyznań. Pełnili funkcje gastarbeiterów oraz ludzi od czarnej roboty, niegodnej dla członków Ludu Wybranego. Nic nie stoi na przeszkodzie aby odnowić istnienie Samrytan w naszych, nowoczesnych warunkach. Pojmani kibole ŁKS-u, jeżeli będą chcieli wrócić na wolność będą zmuszeni aby uznać moc Jahwe. A więc i naszą władzę."
ZYD_forced_labor: "Forced Labor"
ZYD_forced_labor_desc: "Że musimy uporać się z ŁKS-em to wiadome, ci polscy faszyści nie mogą być dłużej na wolności i rabować bezzasadnie naszych towarzyszy robotników. Ale po co mamy marnować ich potencjał. Wielu z nich nie wytrzyma presji, i wpadną w nasze ręce. A ci którzy nie pracują, nie jedzą. A pracować można na różne sposoby, na przykład przy wyrębie lasu czy kopaniu torfu. Czasem da się nawet po odpowiednio długim stażu coś osiągnąć. Niechaj będzie to wolność. Oczywiście wolność pod nadzorem WSW. W końcu mowa o elemencie niepewnym polityczno-religijnie..."
ZYD_taking_the_dogs_off_the_leash: "Letting the Dogs off the Leash"
ZYD_taking_the_dogs_off_the_leash_desc: "Płomień wiary rozbudzony w sercach wielbicieli Klubu Wybranego jest niczym ten który goreje w trzewiach Lewiatana. Strawi on wszystko, co stać będzie na jego drodze. Pozostawi on za sobą jedynie popioły użyźniające ziemię którą uprawiać będą frajerscy oracze. Doprawdy straszliwy jest gniew dwunastu plemion, słowo groźby z ich ust potrafiłoby zatrzymać serce słabeuszy w bezruchu. Nie ma nadziei dla wrogów synów Izraela, potomków Dawida i Salomona, wnuków Mojżesza. Kanaan spłyną krwią, Stare i Nowe. To będzie nasza ofiara, prawdziwy baranek Boży."
ZYD_zomo_action: "ŻOMO Action"
ZYD_zomo_action_desc: "Kto jest lepiej przygotowany do walki z plagą antysyjonistycznego  bandytyzmu niż specjalnie wyszkolone, zmotoryzowane oddziały sił do spraw wyjątkowych? Nawet najmocniej spojona nienawiścią klasowo - narodową banda rabusiów przegra w bezpośrednim stacie ze zdyscyplinowaną siłą warstw pracujących, dysponującą przewagą technologiczną. Rezerwy Lublinów oraz T4 które posiadamy, wystarczą do powołania brygady specjalnej, naszej dumy i grozy dla wroga. Zarówno zewnętrznego jak i wewnętrznego."
ZYD_rts_is_a_power: "RTS IS POWERFUL!"
ZYD_rts_is_a_power_desc: "Lud Wybrany na powrót jest jednością. NIkt nie jest w stanie równać się z naszą armią. Nikt nie je do syta tak jak nasi bracia i nasze siostry. Jahwe nie musiał dawać nam manny, i strumieni wody pitnej. Na pustyni, niebezpiecznej i niegościnnej, z piachu wznieśliśmy prawdziwą oazę. Wystarczyło Jego Słowo i nasza nieugięta wola, wiara w zwycięstwo Ludu i Klubu Wybranego. Rabbi stoi dziś na Tomaszowskim Kominie i patrzy jak wspaniały jest Kraj dookoła. Czeka na słowo od Jahwe..."
