ZYD_RDM_war: "Faryzeusze z Radomska"

ZYD_meeting_desc: "Rabin wciąż stoi na Tomaszowskim Kominie. Dookoła zebrały się tłumy czekając na rozwój wydarzeń. Nikt nie wie co planuje Jahwe lecz burza która zbiera się nad naszymi głowami i dziesiątki błyskawic zbliżających się z każdą chwilą napawają niepokojem. Rabin jednak z kamienna twarzą czeka na to co przyniesie przyszłość. Pozostaje mieć nadzieję, że Jahwe okaże się łaskawy."

ZYD_sanhedryn_desc: "Rabin zszedł z komina odmieniony. Nie je, nie pije, nie wypowiedział przez wiele dni ani jednego słowa. Wielu z nas zaczęło się już martwić, nie wiedząc co może to oznaczać. Dziś jednak krzyknął, nie odrywając swojego pustego wzroku od nieba - iż natychmiast ma się zebrać rada mędrców. Ma im coś ważnego do powiedzenia."

ZYD_rabbi_is_dead_desc: "Niewiarygodne. Aż trudno uwierzyć w taki zbieg okoliczności. Ostatnia osoba która stała na straży reakcjonizmu leży bez życia pod Tomaszowskim Kominem. ŻOMO i WSW już otrzymują tajne rozkazy. Czas zakończyć ten \"Taktyczny Sojusz\"."

ZYD_LKS_war_desc: "ŁKS pozostaje jedynym większym klubem w województwie Łódzkim który nie został pobłogosławiony przez Jahwe. Może i Hołownia próbował pogodzić zwaśnione plemiona, jego nieustanne faworyzowanie ŁKSu pokazało nam, że my jesteśmy jedynymi którzy mogą przywrócić porządek w imię jednego prawdziwego Boga. Teraz, gdy nie jesteśmy już uwiązani Dialogiem, nadszedł czas by wojownicy Jehowi uderzyli we frajerów i rozgromili ich pogańskie armie. Wszystko po to by Ziemia Obiecana została oddana prawdziwemu Bogu!"

ZYD_TIG_war_desc: "Na zachodzie leżą komuny inforanarchistyczne, i pomimo, że ich podobne podejście do gospodarki jest miłym gestem, raz za razem pokazywali że nie są wyznawcami Jahwe lecz krwiożerczymi, frajerskimi złodziejami ubranymi w fasadę honorowych ultrasów, chociażby wprowadzając państwowy ateizm. Musimy przynieść im światło Jahwe i poprowadzić ich z powrotem w objęcia Boga. Siłą." 

ZYD_RDM_war_desc: "Jahwe wysłał nas na świętą podróż w celu odzyskania Ziemi Obiecanej. Musimy w jego imię dokończyć tego dzieła, by mógł być z nas dumny. Mamy jednak dużo celów: odbicie miast, przekonanie by ludność przyjęła jedno słuszne logo klubowe i jednego prawdziwego Boga, czy zniszczenie pozostałości katolickich. Będzie to zdecydowanie żmudna podróż, ale jako wojownicy Jahwe musimy udowodnić naszą wartość i odzyskać to co zostało nam obiecane 3000 lat temu. Musimy jednak zacząć małymi kroczkami - odzyskać Radomsko z łapsk Bocheńskiego. Może i jest więcej ziem bardziej godnych naszego wyzowlenia niż Radomsko, na wszystkich przyjdzie pora. A teraz - na południe, w imię Jahwe!" 

ZYD_seven_miracles_desc: "Niebo stało się czarne choć na ziemi jest jasno, kije widzewiaków puściły pędy, które wkrótce stwardniały, czyniąc kije kolczastymi. Mimo, że nie było chmur spadł deszcz o barwie karmazynu, ludzie zbierając go do beczek na deszczówkę, odkryli, że to Kadarka. Na ziemi obok źdźbeł trawy pojawił się biały pył. Sztachając się nim Widzewiacy poczuli ogromny przypływ sił. Z Arki Przymierza zaczęła samoistnie odpadać rdza, a spod niej wyłoniła się nietknięta przez czas, niewyszpachlowana karoseria. Na granicy naszych włości w tereny wroga zaczęły uderzać pioruny wzniecając pożary. Rabin mimo iż zerwał się potężny wiatr w Tomaszowie, wspiął się ponownie na komin, dzierżąc sztandar przymierza oraz pierwotny kij w swoich rękach. Jego głos niesie się mimo straszliwego huku. Pierwsi i drudzy przybysze, widzewiacy i frajerzy, wszyscy zbierają się zdumieni pod Wieżą Przymierza. Wszyscy czekają na słowa Rabina..."

ZYD_revenge_on_coal_desc: "Całe to zamieszanie sprawiło, że nie zdążyliśmy wysłać kolejnej transzy surowców do Bractwa Węgla. Nasz przemysł praktycznie stanął. Czy można sobie wyobrazić lepszą sytuację do rozpoczęcia Wojny o Ojczyznę? Każdy kto śmie zadrwić z Ludu Jahwe musi poznać gniew Lewiatana który drzemie w naszych sercach. Teraz to my będziemy pobierać trybuty od niewiernych. Tag Widzewa niedługo załopocze nad kominami Bełchatowa."

ZYD_challenge_of_strength_desc: "Powiadają, że w lasach na zachodzie pojawił żyje lud dziki i gwałtowny, pełen młodzieńczej werwy i agresji. Jeżeli mamy budzić szacunek wśród Frajerów musimy im uzmysłowić, że nikt nigdy nam nie dorówna - nikt nie pokona w walce Dzieci Izraela. Tylko my jesteśmy dość godni, a nasze postawy dość czyste aby ich kroić."

ZYD_new_synagogues_and_stadiums_desc: "Tam gdzie stała nasza stopa tam musi istnieć coś co jej ślad utrwali i powiększy. Domy modlitwy, a zaraz obok nich nowo budowane stadiony są podstawą naszej obecności na każdym terenie. Pierwsze aby wzmocnić ducha, przypominając o przykładzie naszych przodków a drugie aby dorównać naszym obecnym, najważniejszym wojownikom. Dodatkowo ich złote kopuły błyszczą się tak, że aż niewierni muszą odwracać wzrok."

ZYD_blooming_business_desc: "Na północy doskonale rozwija się biznes śmierci. Zyski rodu Skrzydlewskich i innych organizacji przekraczają najśmielsze przypuszczenia. Nie da się ukryć, że Jahwe dał im  wiele a jeszcze więcej udało im się z tego wymnożyć. Jednego jednak Jahwe im nie dał: Przymierza. Wciąż są zwykłymi frajerami. Bardzo zamożnymi Frajerami. Czas im o tym przypomnieć..."

ZYD_last_obstacle_desc: "Przed kilkoma dniami doszło do dziwnego wydarzenia. Kilku naszych znamienitych i wiekowych rabinów podróżujących w celach handlowych na północ zostało napadniętych przez bandę przebierańców w farbowanych na rudo włosach i posiadających pokaźne brody. Kiedy odmówili spożycia podejrzanego trunku który został im zaoferowany, zwzywano ich od \"Zdrajców Rasy (Krasnoludzkiej)\" i zaatakowano młotkami oraz siekierami. Ledwo uciekli. Ten incydent nie może pozostać niezauważony, choć odwraca naszą uwagę od głównego celu wyprawy."

ZYD_central_committee_meeting_desc: "W całym Tomaszowie panuje potężny chaos. Frajerzy się burzą: biją na ulicach rabbich oraz widzewiaków, wyciągają ich ze wszystkich, nawet najbardziej obskurnych zakamarków i dokonują samosądów. Śmierć Rabina okazała się iskrą na którą potulni zazwyczaj frajerzy zareagowali wybuchem. Względny porządek panuje jedynie w okolicach dworca gdzie mieszane widzewsko-robotnicze milicje ukrócają podobne rozruchy z zarodku. W stronę budynku raz po raz podjeżdżają przerobione na limuzyny Ople Insignie oraz Mercedesy w124. Wychodzący z nich jegomoście w kremowych garniturach wbiegają do środka gdzie tow. Kibic nakazał zwołać komitet centralny PŻPR. Już niedługo okaże się co takiego przygotowują. Ludność frajerska coraz bardziej widzi w nich gwarancję zniszczenia dawnego porządku..."

ZYD_miners_liberation_desc: "Na naszych oczach doszło do opanowania umysłów Bełchatowian przez chmurę węglowego pyłu. O ile nie możemy kwestionować zbawiennego wpływu dostarczania prądu dla naszego państwa o tyle nie godzi się aby jego wytwórcy żyli pod butem odzianych w habity szaleńców. Powinni pracować w delikatnej, kojącej nerwy i wprawiającej w ekstatyczny nastrój czerwonej mgiełce. Pod czerwonym sztandarem..."

ZYD_fifth_generation_of_ak_desc: "Który to już raz kiedy musimy się użerać z polskimi marzycielami? Ile to już lat musimy radzić sobie z ich wynaturzeniami? Przetrwali wszystkie czystki, wtapiają się w społeczeństwo i zatruwają je od środka. Musimy położyć temu kres. Nigdy już więcej chłopiec w zabawkowym mundurze nie ośmieli się podnieść ręki na Dzielnego Milicjanta, Pracowitego Proletariusza, Czujnego UB-eka czy Żyda w Kremowym Garniturze."

ZYD_recruit_collaborators_desc: "Przydało by się nam parę dodatkowych osób, żeby patrzyli innym na ręce. Każdy nowy obywatel Ludowej Republiki Polin jest potencjalnym wywrotowcem. A dzięki takim inicjatywom będziemy mieć pewność, że proletariusze mogą spać spokojnie gdyż ich interes pozostaje niezagrożony. Chętnych będzie z pewnością wielu, zwłaszcza zaraz po wysłaniu w rejon oddziału ŻOMO."

ZYD_rotten_capitalism_desc: "Pierwszy Sekretarz z racji swego gołębiego serca lubi kiedy komuś się powodzi. Rozumie doskonale, że wolny rynek potrafi być nie tylko źródłem ogromnych dochodów ale i niezwykłych emocji. Sam w końcu w pewnym okresie swojego życia z przymusu inwestował w Forda. Ale w przeciwieństwie do wielu innych domorosłych Rockefellerów nie martwił się o konkurencję. Wiedział, że nie ma sobie równych. Nint przecież nie jest w stanie wygrać z awangardą proletariatu. I to właśnie muszą sobie uzmysłowić Krośniewiccy kapitaliści."

ZYD_slavic_reactionism_desc: "Pierwszy Sekretarz PŻPR lubi w wolnych chwilach poczytać sobie coś niezobowiązującego. Stąd też miał przyjemność zapoznać się z ciętym piórem innego Łodzianina. I tu pojawił się dylemat. Jak traktować państwo, monarchię na dodatek, zrodzoną z pastiszu i satyry na zbiorową histerię wokół Jarej Śmietany, Hożego Swaroga i Krasego Tylnego Lica Płotki? Kibic myślał, dumał i po chwili już wiedział - jako żart. I wysłał wojsko na granicę."

ZYD_promised_land_desc: "Długośmy na ten dzień czekali, z  nadzieją niecierpliwą w duszy. Nasz Dom, Nasze Kanaan widać już wyłaniające się zza horyzontu. Wielka Łódż. Wielki Widzew. Ojczyzna Pracy. Ojczyzna Naszego Ludu. Nawet ci najtwardsi z nas nie są w stanie ukryć wzruszenia... Nie, kiedy uwierzyli, że znów będą mogli przejść się w cieniu Kamieniec... naszych Kamienic..."

ZYD_allija_desc: "Zwyciężyliśmy. Odzyskaliśmy Ziemię Obiecaną. Nasze własne Eretz Yisrael. Najważniejszej z micw w całej Halasze. By żyć na Ziemii Obiecanej. Starym Widzewie. W końcu możemy świętować nasze Yom HaAliyah. Nawet najtwardsi z naszych ludzi uronili łzy szczęścia. I tak o to odkupieni ludzie Pana powrócili, i wrócili do Łodzi z pieśnią i nieustannym szczęściem w swoich sercach, a radość wypełniła ich dusze, całkowicie przepędzając smutki i westchnienia."

 ##Events##
zydzew.1.t: "Księga Rodzaju"
zydzew.1.desc: "Jahwe spojrzał na Kaanan Północy i rzekł:\n- Wielkie są zbrodnie narodu z którym zawarłem niegdyś przymierze. Kurz opadł na dawne trofea, ostatnich świadków dawnej chwały.\"\n\nJahwe spojrzał wtem na Nową Jerozolimę i rzekł:\n- Wielkie jest zepsucie które ziemię wybraną nawiedziło. Cielcom z zielonego papieru i złota cześć się oddaje zamiast mnie. Jerozolima stała się Sodomą. Izraelici rodu Widzewa bratają się z frajerskimi Jebusytami rodu Śródmieścia. Zapomina lud mój o warunkach przymierza. Z jednej misy jedzą, z jednej puszki piją jako jedność, z tymi którzy imienia mego nie znają. Nie ma pośród nich i jednego sprawiedliwego.\n\nWtem Jahwe spojrzał na wodzów rodu Widzewa i rzekł:\n- Gdzież są dawni władcy którzy imię moje sławili? Gdzież się Słowo ostało czyste, wolne od kłamstw i chciwości? Sprzedali się. Nie ma pośród nich i jednego sprawiedliwego.\"\n\nNadówczas na wojowników Jahwe wzrok skierował.\n- Wielka jest słabość mego ludu. Ni jednego z jego członków nich nie ma w pierwszym szeregu wojowników Widzewa. Jedenastu tam zaś widzę niegodnych, obcych, jedenastu wrogów plemienia z którym zawarł przymierze. W złoto oni jeno wierzą. W złoto i nic więcej. Nie ma pośród nich i jednego sprawiedliwego.\"\n\nWielki był gniew Jahwe. Rzekł on wtem:\n- Azali powiadam: Siedem dni minie i siedem nocy, nim deszcz płomieni spadnie na nową Sodomę, niegdyś ziemią Mą zwaną. Jeśli kto sprawiedliwy sie tam ostał, niech ocali tych których zbawić można i na południe się kieruje. W puszcze dzikie. Sprawiedliwych one ocalą zaś grzeszników zaduszą.\n\nRabbi żył podówczas w Łodzi, ostatni wierny sługa Jahwe. Grzechy ludu wybranego nie zagłuszyły jego wiary w zwycięstwo Klubu Wybranego i Jahwe Wszechmocnego. Sześć dni i sześć nocy chodził on ulicami Łodzi niosąc czerwony sztandar, symbol Przymierza. Siódmego dnia wygnano go i tych którzy z nim poszli. Bali się grzesznicy ich wiary odnowionej. Tako wyszło z kraju zepsutego dwanaście wiernych plemion Widzewa z dwunastu jego ulic.\n\nSiódmej nocy ogień spadł na Łódź, niebo zaś czarnym się ostało."
zydzew.1.a: "Oto koniec początku."

zydzew.2.t: "Księga Wyjścia"
zydzew.2.desc: "Wtenczas Jahwe ciężarówki ludowi wybranemu posłał. Pełne były one kijów do gry w baseball a żadnej nie było w nich piłeczki. Pierwszy kij Rabin zachował dla siebie. Uzbrojeni, Wierni Jahwe zdobyli pokarm spośród okolicznych miast i wsi.\n\nCzternastego dnia ludzi w czerń odzianych znalazły plemiona Widzewa. Długie były ich brody, włosy i nosy. Pierwotni i najwierniejsi to byli Jahwe słudzy. Wielce się radowali gdem Rabin powitał ich macą i opatrunkiem. Przed odsieczą wojsk jego wiele wycierpieli od pogan. Wiele mu opowieści przekazali o dawnych dziejach. Razem ruszyli dalej, jako jedno plemię Tego Który Jest.\n\nDwudziestego drugiego dnia kolejnych synów Ludu Wybranego, dwanaście plemion na swej drodze odnalazło. W garnitury byli odziani, bez bród i nosów długich, lecz Jahwe słowo znali a z rodu Izraela byli zrodzeni. I ich Rabbi powitał macą i opatrunkiem. Przed odsieczą wojsk jego cierpieli oni od pogan gniewu. Wiele oni Rabinowi opowiedzieli o najnowszych Ludu dziejach. Razem ruszyli dalej, jako jedno plemię Tego Który Jest.\n\nStarzy i nowi Jahwe słudzy światło przynieśli, dawno już przyćmione przez zepsucie. §BŚwiatło Boga§! jako i §RLudu Jego§!, Ludu §BWiary§! jako i §RPracy§!. Wtedy jeszcze zgodni byli i razem dwanaście plemion oczyszczali z dawnego nieokrzesania.\n\nCzterdziestego dnia Rabbi sztandar niosąc czerwony i kij krwią zabarwiony w drugiej ręce, puszcze dzikie ujrzał. Jahwe wtem tak do niego przemówił: \"Oto ziemia Obiecana\". Tako też Rabbi Ludowi orzekł. Rozpierzchły się wtem plemiona, komuny zakładając gdzie ziemia pustą była dla synów Jahwe i pełną frajerów do pracy. Tako przybył na południe Lud Widzewa."
zydzew.2.a: "Do krainy mlekiem i miodem płynącej"

zydzew.3.t: "Księga Kapłańska"
zydzew.3.desc: "Razem Lud Wybrany miasto obległ jako jedność. Twarda była jednak obrona mieszkańców Tomaszowa. Z ruin miejskich, niezliczonych cegły pozbierali i mur dookoła miasta wznieśli. Ni kije, ni pięści wściekłe nic poradzić sobie z nim nie mogły, gdyż kamienie z proc wystrzeliwane Widzewiaków odpychały, czy to w dzień czy w nocy. Wtem Rabin mędrców wezwał do swej chawiry aby rady ich zasięgnąć cóż uczynić należy aby miasto warowne zdobyć na chwałę i domostwo Ludu i Klubu Wybranego.\n\nOdezwał się pierwszy mędrzec, Tygrysem przez słuchaczy zwany:\n\n- Rabinie, Jahwe przemówił do mnie we śnie i tak nakazał uczynić aby miasto zdobyć - Tomaszowianie kamerami widzą ruchy naszych wojsk, ja wiem jak je zniszczyć bez udziału kija czy pięści. Przekraść się muszę na Komin Wielki, co w sercu miasta leży, pośród fabryki która PZPR szyld nosi i sygnał nadać co monitoring zniszczy. Wówczas niecelne będą ich proce w nocy, gdyż ciemności wzrokiem nie przebiją.\n\nWtedy §BPierwsi Przybysze§! się odezwali:\n- Prawdę on powiada, wola Jahwe przez niego przemawia. Aby przekraść się mógł, w trąby należy zadąć na całej linii murów i marszem powolnym się doń w nocy zbliżać. Gdem kamienie przestaną celnie uderzać wtedy szarża nasza mur zmiecie. Lecz silni muszą być nasi wojownicy, nakaż jeno Rabinie im dzień i noc ćwiczyć, aby przez mur mogli się przebić. My im pokażemy jak należy aby czynili się silnymi.\n\nTako uczynili i miasto zdobyli. Gdem i §RDrudzy Przybysze§! doń weszli ustały walki wszelkie. Ludność Tomaszowa widok i słowa ich o chwale miasta dawnej koiły. Gniew na §BPierwszych§! uśmierzyli.\n\nTako Rabin rzekł do swych doradców, kiedy miasto zdobyto:\n- Wiele mądrości wasze słowa zawierały, idźcie więc i innym ją dawajcie by Lud i Klub Wybrani silnymi byli. Ty zaś Tygrysie, ucz nas o tajemnicach elektroniki\n\nTako kapłani się rozeszli po dwunastu plemionach Widzewa, ucząc ich o chwale dawnej i chwale sprawności rąk i nóg. A trudna to była nauka, po latach Sodomskiej Ciemnoty i niepisanego pokoju z Filistynami Śródmieścia."
zydzew.3.a: "Światło ku oświeceniu pogan."

zydzew.4.t: "Księga Liczb"
zydzew.4.desc: "Kiedy pierwszy mijał rok pobytu Ludu Wybranego w Ziemi Obiecanej z całego Polin poczęli przybywać do niego uciekający przed prześladowaniami pobratymcy. Zebiedzeni byli oni, wyczerpani niechęcią która na nich zewsząd spadła. Pośród nich wielki, sędziwy człowiek był, filantrop o sercu gołębim, który miano Kibica przybrał, aby zbliżyć się do Klubu Wybranego. Prędko w Tomaszowie, gazetę on założył aby chwalić dzieło Zajęcia Ojczyzny. Każdy Widzewiak chyżo stał się wiernym czytelnikiem Dziennika NIE - głosu sprzeciwu wobec prześladowań i orędownika Pełnej Reklamacji.\n\nWyliczano na jego łamach jakie zniszczenia Polin poniosło i ile Lud Wybrany Stracił nie tylko podczas Upadku ale i przez ostatnie trzydzieści lat: Tysiące zakładów pracy  setki tysięcy mieszkań z wielkiej płyty, miliony dolarów na prywatyzacji… Niezłomny był jedank Kibic, gdem go pytano o odczucia:\n\n\"A ja mam to w dupie\" - odpowiadał i wracał do pisania jako i kapitału odbudowy budowania. Wielką był dla plemion dwunastu inspiracją, wigor zawadiacki zachowując pomimo podeszłego wieku. W Forda i Toyotę inwestował zyski z dziennika, dzięki kontaktom z innymi członkami Narodu Wybranego. Tak zbierał kapitał i pomnażał swój potencjał. Czynił to jednak jedynie w drodze wyjątku dla sukcesu sprawy Klubu Wybranego.\n\nW ościennych krajach zaczęto kłamstwa mawiać jednak, iż §RCzerwony Goebbels§! znów trafił na piedestały."
zydzew.4.a: "Jeden z najbystrzejszych umysłów w Polin."

zydzew.5.t: "Księga Powtórzonego Prawa"
zydzew.5.desc: "Rok minął obecności Dwunastu Plemion w nowej ojczyźnie. Tedy Rabbi spostrzegł jak wiele złego dzieje się w Trzecim Kaan. Każde z plemion na wszsytkie inne dybało, by frajerów do pracy i skorejnia przejąć, jako bogactwa i ziemię, zbyt mało rabinów-trenerów było a i bywało, iż sami ulegali popędom bratobójczych walk i doń zagrzewali swych pobratymców. Wreszcie Jahwe go we śnie odwiedził i tak mu rzekł:\n- Rabinie, Lud z którym zawarł przymierze znów warunki jego depcze, gdzież się jedność podziewa?\n\nTak mu Rabin odpowiedział:\n- Jahwe Największy, cóż począć mamy kiedy zbyt mało z nas Słowo zna, a jeszcze mniej potrafi je przekazać? Cóż mamy czynić kiedy twa wola jedynie nielicznym dana była do poznania, dawne Przymierze tylko w duszy pozostało, nie w umysłach naszych?\n\nJahwe odrzekł:\n- Niechaj więc Przymierze zostanie odnowione - prawo ci przekaże, ty zaś na rejonie je rozwiesisz, mural godny nakażesz wykonać a na sprejach nie będziesz oszczędzał. Słowo na powrót stanie się prawem ulic i każdy je pozna.\n\nTak więc nakazał Rabbi uczynić. Wziął również kawał betonu płaski i sam sprejem Prawo Odnowionego Przymierza nań wysmarował. Wtem wziął go, wraz ze swym kijem oraz czerwonym sztandarem, z którym Plemiona wyprowadził z Łodzi i do Daewoo Lanosa je włożył, poczem auto zapieczętował i kluczyki dla siebie zachował. Cztery razu do roku objazd nim robi po ziemiach Dwunastu Plemion i wielka jest to zawsze uroczystość."
zydzew.5.a: "Jam jest Pan, Bóg twój, który Cię wywiódł z ziemi Łódzkiej, z domu niewoli."

zydzew.6.t: "Ziemia Obiecana"
zydzew.6.desc: "Niebo lśniło tysiącem gwiazd. Wiatru nie było żadnego - płatki białego pyłu swobodnie unosiły się w powietrzu. Tysiące miarowych oddechów raz po raz napełniało płuca magicznym proszkiem. Każda chwila inhalacji czyniła wojowników widzewa silniejszymi, bardziej gotowymi do walki. Miarowe szeregi wojowników wyposażone były jednako - proce w kieszeniach, kije za pasami, kielichy wypełnione świętą czerwoną deszczówką.\n\nStoją już drugi dzień. Zwarci i gotowi. Podobnie jak Rabbi. Drugą noc z rzędu spędza na kominie. Wszyscy czekają na znak. Lecz początkowa wichura ucichła, frajerzy poszli do domów. Nawet stalowa wola widzewiaków zaczynała się z wolna pokrywać rdzą. Nagle światło gwiazd skupiło się jasnym potężnym promieniem w jednym miejscu - na Rabbim. Wieść rozniosła się tempem błyskawicy - frajerzy szybko zaczęli się pojawiać na placu. Ci którzy pozostali w domach prędko usłyszeli słowa brzmiące niczym grom. Było je słychać wszędzie, w każdej piwnicy, schronie, w każdym zakamarku miasta - Rabbi przemówił głosem Jedynego:\n\nUważajcie, frajerzy, na to, co powiem,\nsłów moich ust słuchaj, ziemio widzewska.\nNauka moja niech spływa jak GKS,\nniech słowo me pada jak Legia,\njak smog potężny na Cracovię,\njak deszcz dobroczynny na Bruk-Bet.\nGdyż głosić chcę imię Pana:\nuznajcie wielkość Klubu naszego;\nOn Widzew, dzieło Jego doskonałe,\nbo wszystkie drogi Jego są słuszne;\nOn Bogiem wiernym, a nie zwodniczym,\nOn sprawiedliwy i prawy.\nJebać ŁKS."
zydzew.6.a: "Czas wypełnić nasze przeznaczenie."

zydzew.7.t: "Wykład Kibica"
zydzew.7.desc: "Obywatele, ludu pracujący miast i wsi! Nasi Bracia i Nasze Siostry w wierze! Dziś w godzinach porannych doszło do tragedii. Przestało bić serce współbojownika i genialnego kontynuatora dzieła Mojżesza, mądrego Wodza, Nauczyciela Wiary Hebrajskiej i genialnego teoretyka Marksizmu - Salomonizmu. Jednoczyciela narodów Wybranego i zwykły codzinenny trud z nami dzielącego.\n\nKochaliśmy Go. Jak Ojca i jak Przyjaciela. Całe wolne Polin jednoczy się w bólu lecz taka musiała być widocznie wola Jahwe. Nie trudno być teraz całkowicie zbitym z tropu, zszokowanym i zdruzgotanym. Wie o tym Partia i wie Tow. Kibic, najwierniejszy przyjaciel Rabbiego i z tego powodu tymczasowo objął on kierownictwo nad administracją Polin.\n\nTow. Kibic ogłasza iż w najbliższym czasie odbędzie się wielkie zebranie partii i ludu połączone z referendum dotyczące spraw kierownictwa Państwa oraz jego funkcjonowania. Celem jest zaprowadzenie porządku i rządów prawa w chwili krótkotrwałego rozpadu struktur państwowych. Termin wielkiego głosowania...\n\n1. Czy jesteś za zniesieniem Sanhedrynu?\n2. Czy chcesz utrwalenia w przyszłej Konstytucji ustroju gospodarczego, zaprowadzonego przez reformę obywatelską, i unarodownienie komunalnych gałęzi gospodarki z zachowaniem kulturowej i gospodarczej podmiotowości kommun kibolskich?\n3. Czy chcesz rewizji obecnych granic państwa i rozszerzenia go o ziemie utracone w wyniku wojennego oraz ideologicznego chaosu?"
zydzew.7.a: "Czas na zmianę tempa."

zydzew.8.t: "NASZYM KLUBEM RTS"
zydzew.8.desc: "CAŁA POLSKA O TYM WIE\nŻE CZERWONA ARMIA TWA"
zydzew.8.a: "TO KIBICE WIDZEWA"

zydzew.9.t: "Czas na wpierdol"
zydzew.9.desc: "Dźwięk gwizdka przeszył głowy zebranych widzewiaków na wylot. Kiedy czerwony na twarzy rabin-trener wreszcie wyjął go z ust, przed nim, w miarę równym rzędzie stali członkowie kibucu Drzewica - Piłsudskiego. Wszyscy zdezorientowani, z sińcami pod oczami i w poplamionych dresach. Rabin spojrzał na nich zdegustowany, schował ręce za plecami i wolnym krokiem przeszedł się przed swoimi podopiecznymi. Zimny wiatr szarpał jego talesem kiedy wykonywał swoją przemowę.\n- Jestem rabin Mosze, od dziś wasz trener i instruktor pracy. Od teraz będziecie mówić tylko wtedy kiedy wyrażę na to zgodę. Do mnie zwracacie się tylko per rabin. ZROZUMIELIŚCIE TO, ŚMIERDZĄCE NIEROBY?!\n- Tak, rabinie - kibole odpowiedzieli niemrawo\n- CO TO BYŁO? NIE SŁYSZĘ WAS! BRZMICIE JAKBYŚCIE JAHWE W SERCU NIE MIELI. JESZCZE RAZ!!!\n- TAK, RABINIE!!! - Tym razem ryk tłumu poniósł się zdecydowanie na kilka mil.\n- Jeśli wspólnie zbudujemy w tej paskudnym kurwidołku kibuc z prawdziwego zdarzenia, jeśli przetrwacie szkolenie zawodowe, pewnego dnia będziecie prawdziwymi wojownikami rodu Abrahama. Będziecie pierdolonymi awatarami samego Dawida modlącymi się aby starczyło wam wszystkim Filistynów do spuszczenia wpierdolu. Ale póki ten dzień nie nastąpi jesteście w hierarchii niżej od frajerów. Musicie mi udowodnić, że Jahwe zmajstrował was szóstego dnia a nie pierwszego. Jeśli będzie trzeba, pogonię was kijem przez wszystkie Dni Stworzenia. Po tych, którzy zostaną pośród robactwa nie będę płakał. Widocznie takimi was Jahwe ulepił. - Rabin Mosze wziął ponownie gwizdek do ust i zadął w niego z pełna mocą.\n- Brać motyki i do roboty. Czosnek sam się nie posadzi."
zydzew.9.a: "Pożywienie dla wojownika..."

zydzew.10.t: "Nie bój się frajerów"
zydzew.10.desc: "Drzewica, zakłady Gerlach produkujące uzbrojenie armii Klubu Wybranego oraz sztućce na potrzeby frajerów. Jest już późno, ściemnia się. Na moście zaraz obok zakładu, stoi młody, postawny chłopak w roboczym kombinezonie. Opiera się o barierkę i pali papierosa. Patrzy się w dół na dziwnie zabudowane, suche koryto rzeki. Most jednocześnie jest tamą. Po drugiej stronie był zielony od glonów zalew\n- Kiedyś był tu tor kajakowy, ale dziś już nie ma komu tędy pływać... - Chłopak odwraca się aby dojrzeć kto wypowiedział te słowa. Dostrzega zbliżającego się do niego starego człowieka, również w roboczym uniformie.\n- Ciekawe... - odpowiada mu, po czym zaciąga się papierosem.\nStarzec podchodzi do barierek i również się o nie opiera. \n- Mieliśmy tu nawet olimpijczyków. Przywozili medale, nawet i złote. Tam - pokazuje dłonią dolny bieg toru - jest ich pomnik.\nChłopak widzi łzę kręcącą się w oku starca.\n - Może niedługo znowu ktoś tędy popłynie… - odpowiada chłopak niemrawo\nStarzec się uśmiecha.\n- Nadawałbyś się, masz krzepę w łapach, sam widziałem jak wynosiłeś tamtego zbira do lasu.\nMłodzieniec krztusi się dymem z papierosa.\n- Nie przejmuj się, kiedyś też byłem taki jak ty. Tylko wtedy nazywało się to ORMO. Z grubsza też dbaliśmy o porządek. - Młodzieniec jest wyraźnie speszony - Na kajakach również śmigałem, hehe. Dobra, przerwa się kończy, czas wracać. Jeśli jesteś chętny, przyjdź kiedyś. Mogę cię podszkolić w pływaniu, kajak jeszcze mi został w garażu. A jeśli chodzi o fach, to też mogę ci co nieco pokazać. Twoja technika wymaga mimo wszystko poprawek. Na jakiejś akcji możesz sobie nie poradzić.\nStarzec odchodzi od barierek i idzie w stronę bramy zakładu. Chłopak patrzy się na niego. Niby to był zwykły frajer, a jednak jakiś milszy."
zydzew.10.a: "Może rzeczywiście zna się na rzeczy?"

zydzew.11.t: "Niespodziewane objawienie"
zydzew.11.desc: "Rabin nie czekał nawet sekundy, by się zastanowić, i zstąpił z komina z niemalże boskim pośpiechem. Nigdy wcześniej nie widziano go odzianego w tę mglistą i odurzającą aurę gorliwości. Wszyscy, którzy zgromadzili się u podnóża komina, rychło obstąpili go ze wszystkich stron, aby usłyszeć, jaką to wiedzę Jahwe przekazał mu tym razem. Lecz zanim ktokolwiek zdążył zadać choćby jedno pytanie, Rabin przemówił. A głos jego poniósł się po tłumie z niezachwianą pewnością.\n\n- Towarzysze moi umiłowani! Oto mam dla was wieść największą ze wszystkich. Nadszedł bowiem dzień, którego wszyscy tak gorliwie wyczekiwaliśmy! Jahwe wzywa nas do boju, albowiem bramy naszego Kanaanu zostały dostrzeżone na krańcach naszych horyzontów. I objawiły mi się cuda w godzinie naszej Wojny Najświętszej, i zostałem przez Niego pobłogosławiony wizjami! Przeto rozpalcie płomień Jahwe w sercach waszych! Idźcie i zanieście ten żarzący, natchniony i wieczny płomień wszystkim tym nieszczęśnikom, którzy nie mieli jeszcze sposobności usłyszeć tych słów z ust naszych! Niechaj wszyscy słyszą i niechaj wszyscy płoną żarem, albowiem oto nastały ostatnie dni naszych przygotowań i pracować musimy ciężej niż kiedykolwiek przedtem! Idźcie tedy z Jahwe i głoście te święte słowa najwyższej wagi!\n\nI stało się, że gdy Rabin zakończył swą porywającą mowę, a raczej proroctwo swoje, wszyscy - nawet frajerzy - poszli głosić słowa swego Pana każdemu, kto tylko zechciał ich słuchać. I płonęły serca ich wspólnym ogniem niczym wielki pożar, który spali każdego, kto ośmieli się stanąć na jego sprawiedliwej drodze."
zydzew.11.a: "Aj waj..."

zydzew.12.t: "Zemsta Jahwe"
zydzew.12.desc: "Jahwe się wkurwia i rzuca piorunem w Rabina, zabijając go na miejscu."
zydzew.12.a: "Matko Bosko Żydowsko, co to się stanęło?"

zydzew.13.t: "Okienko transferowe"
zydzew.13.desc: "Na lotnisku w Tomaszowie Mazowieckim panowała chłodna atmosfera.  Zarówno dosłownie jak i w przenośni. Zimny wiatr zrywał rabinom z głów sztrajmiły i wciskał się między szczeliny chałatów. Czekając na samolot, rzecz dość niezwykłą w pogrążonej w anarchii Polsce, musieli stać na jego płycie. Gości należało przywitać niezwłocznie i na bogato - Macą i Browarem. Choć ręce im marzły od trzymania puszek oraz misek trwali wciąż na stanowisku, podobnie jak chórowi kiboli który stał nieco dalej.\n\nWreszcie, na niebie ujrzeli szybko zbliżający się kształt. Prędko dołączył do niego miarowy i coraz głośniejszy dźwięk silników. Aeroplan z emblematem AL EL - jednej z ostatnich instytucji państwa Izrael które przetrwały jego zajęcie przez wojska państw Arabskich. Kiedy w końcu się zatrzymał, wysunięto z niego schody a ze środka zaczęli wychodzić czarnoskórzy piłkarze.\nPrzywitało ich gromkie \"Szalom!\". Mimo zimna unieśli ręce w geście powitania. Atmosfera się rozluźniła. Szybko orkiestra zaczęła śpiewać \"Naszym Klubem RTS...\""
zydzew.13.a: "Jest jeszcze nadzieja..."

zydzew.14.t: "Robotniczy Klub Sportowy"
zydzew.14.desc: "Dwie postaci siedziały w zaciemnonym biurze na najwyższym piętrze tuż nad fabryką. Jedną z nich był Jerzy Kibic, spokojnie przeglądający dokumenty, drugi natomiast był bardzo przestraszonym i zdezorientowanym młodym człowiekiem. Młodzieniec, prawie się jąkając, usiłował coś pobwiedzieć."
zydzew.14.desc: "The two figures sat in a darkened office on the top floor just above the factory. One of them was Jerzy Kibic, who calmly shuffled through the files, the other was a very scared and confused young man. The young man, almost stuttering, tried to say something.\n\n-A-ale jak to? Przecież ja mam normalną pracę, ja nie mogę..\n- Możesz, Sanhedryn już o wszystko zadba. Wiedzieliśmy twoje popisy przed fabryką, jak się na przerwie bawiłeś. Coś takiego należy docenić. - Mirek, pracownik Tomaszowskiej Chipity zaczerwienił się na dźwięk tego komplementu.\n- Wraz z miejscem w składzie będą również zapewnione: przydział na nowe mieszkanie oraz honorowe miejsce w synagodze.\n- Naprawdę, wciąż nie mogę w to uwierzyć... - wymamrotał Mirek.\n- To lepiej uwierz, pomyśl o tym jaką dumę nam wszystkim sprawisz. Masz do tego potencjał. Nie słuchaj tych kiboli, pokrzyczą, pokrzyczą a jak gola strzelisz to Cię będą nosili na rękach.\n- Jest Pan pewien?\n- Co jak co, ale w rozpoznawaniu nastrojów społecznych to ja jestem dobry - odrzekł Jerzy Kibic podtykając Mirkowi umowę pod nos. Ten podpisał ją bez wahania."
zydzew.14.a: "To NASZ wielki dzień."

zydzew.15.t: "Trzy szekle"
zydzew.15.desc: "Tomaszów Mazowiecki. Tłum kiboli zgromadzony na parkingu galerii Focus z nabożną czcią przyglądał się Rabinowi, który mimo porywistego wiatru, stał dumnie na wielkim kominie, Wieży Przymierza. W rękach dzierżył telewizor podpięty do akumulatora, który nosił przywiązany na plecach\n\n- Oto nowe prawo! - krzyczał do zgromadzonych - prawo dane nam przez Boga które dostosowuje się do okoliczności.\nWtedy na ekranie pojawiały się kolejno wypisane wielkimi literami słowa nowego przykazania. Głośniki zamontowane pod kominem rozbrzmiały kobiecym, mechanicznym głosem syntezatora: \"11. Pamiętaj aby nie kroić frajerów którzy na ciebie pracują. 3 szekle\".\n\nSanhedryn, zebrany na honorowym miejscu wydał z siebie okrzyk radości. Jeden z jego członków, widząc jak wspaniale zadziałało jego elektroniczne dzieło uronił łzę szczęścia. Prędko chwycił swoje Xiaomi i wpisał kolejne przykazanie. To szybko pojawiło się na ekranie:\n\n\"12. Nie wywołuj spin ze współplemieńcami o byle gówno gdyż Jahwe tego nie lubi. 3 szekle.\n\nRabbi wykrzyczał wówczas do skonfundowanych, lecz wyraźnie skupionych kiboli.\n- Oto słowo Boże..."
zydzew.15.a: "...za którym należy podążać."

zydzew.16.t: "Paweł i Szaweł w jednym stali plemieniu"
zydzew.16.desc: "Głucha noc. Lasy niedaleko Białaczowa. Obóz kiboli w miejscu dawnego ośrodka kolonijnego. Warty oczywiście brak - Olo, Widzewiak który miał tej nocy pilnować bramy był zajęty innymi sprawami. W synagodze polowej ilekroć zapadał zmierzch organizowana była libacja. Co jakiś czas z baraku domu modlitw wytaczał się jakiś widzewiak i upadając na kolana rzygał na ziemię. Zwykle podnosił się po chwili i chwiejnym krokiem wracał z powrotem do środka. Jednak tym razem było inaczej. Olo, kiedy tylko podniósł nieco głowę znad kałuży wymiocin zobaczył w oddali, za bramą, żółtawe światła samochodów. Olo wstał, zmrużył oczy i powoli zaczął podchodzić do wejścia do obozu. Nagle usłyszał jak drzwi niewyraźnych samochodów otwierają się z hukiem. Ciemne postacie, wykrzykując niezrozumiałe wyrazy popędziły w stronę Ola. Alkoholowe otępienie błyskawicznie ustąpiło miejsca wymuszonej przerażeniem trzeźwości.\n\n- KURWA, ATAKUJĄ, ATAKUJĄ KURWA!\n\nWtedy gumowa pałka zdzieliła Ola w głowę. Ogłuszony, upadł twarzą w kałużę swoich wymiocin. Oszołomieni kibole zaczęli niemrawo wysypywać się z synagogi. Człowiek który zdzielił po głowie Ola, stanął dumnie między komunardami a podążającymi za nim towarzyszami. Światło samochodowych reflektorów zaciemniało od tyłu jego twarz.\n\n- Koniec tej zabawy! - wrzasnął - nie chciał Szaweł do Dawida, to Dawid przybył do Szawła! Brać ich do Lublinów - człowiek z zacienioną twarzą uśmiechnął się."
zydzew.16.a: "Jednak miał rację, wystarczył jeden precyzyjny cios..."

zydzew.17.t: "Jeden rabin powie 'tak'..."
zydzew.17.desc: "Na byłym stadionie MGKS Drzewica odbył się sparing miejscowego klubu z ich odpowiednikami z Opoczna. Była to idealna okazja dla rabinów, żeby przetestować swoich wojowników i potrenować razem z innymi.\n\n- I jak idzie twoim Mosze? - Siwowłosy rabin z Opoczna przyglądał się swojemu rozmówcy z Drzewicy z wyraźnym zainteresowaniem.\n- Jak to jak? Zajebiście! Posłuchaj, wpadłem na świetny pomysł. Podpatrzyłem trochę jak działali ci niewierni jak jeszcze Polin działało normalnie. Co rok jakiś czas szli na chwałę Bożą w jakieś miejsce i mówili na to pielgrzymka.\nRabin Icek sięgnął do głowy i zdjął swój czarny kapelusz. - Ale Mosze, czy to jest zgodne z Torą?\n- Moim zdaniem tak - odparł dumnie Mosze.\n- A moim niestety nie - odpowiedział Icek ze smutnym uśmiechem.\n- A moim tak, posłuchaj mnie - Mosze pochylił się nieco w stronę Icka. - Jak im powiemy, że idą gdzieś na chwałę bożą to nie będą tam szli, tylko zapierdalali.\n- Dobra, tylko co zrobimy jak nagle zaczną kroić jakichś frajerów po drodze, przecież nie ma na to przykazania a spowolnią cały pochód.\n- To się zrobi nowe - Mosze przewrócił oczami.\n- Nie zapamiętają.\n- To im się ze starego przetłumaczy, hmmm... Mam! \"Pamiętaj aby dzień meczowy święcić\"!  Na końcu każdej pielgrzymki zrobimy mecz.\n-Całkiem dobre, prawo nie działa w tym przypadku do tyłu ale do przodu.\n\nObaj rabini, osiągnąwszy porozumienie, z zadowoleniem oglądali resztę meczu. Lecz jedno porozumienie nigdy nie kończy sporów rabinów."
zydzew.17.a: "...a drugi powie 'nie'..."

zydzew.18.t: "Dwanaście plemion. Jedna wola."
zydzew.18.desc: "Lasy w okolicach Spały, ośrodki szkoleniowe Widzewa. Rabin Mosze stał na górującej nad okolicą skale. Przed nim stały ciągnące się na dobre sto metrów szeregi jego podopiecznych - ubranych w stalowe napierśniki, w sandałach, z kijami basebalowymi w dłoniach i wielkimi tarczami opartymi o ziemię przy bokach. Wszyscy byli krótko ostrzyżeni, bez najdrobniejszego włoska na policzkach. Wszyscy, za wyjątkiem porucznika z potężną czarną brodą ułożoną na wzór antycznych królów i wojowników znad Jordanu. \n- Jesteście gotowi aby ruszyć na wojnę? Co macie w waszych sercach?\nPorucznik uniósł swój miecz do góry, nie spuszczając wzroku z rabina Moszego. Na ten widok armia Widzewiaków jednym głosem podjęła wojenną pieśń:\n§RŁódzki Widzew - to potega,\nDziś każdy o tym wie,\nJahwe jest znowu z nami,\nOgólnie nie jest źle.\nNowe Kanaan jest w zasięgu,\nCałe Polin też,\nŁódzki Widzew to potęga,\nJahwe o tym wiesz!\nMosze podniósł ku górze swoją laskę. Jej żelazny, zaostrzony koniec połyskiwał w ostrym świetle słońca. ego długie siwe włosy zaczęły powiewać na wietrze. Rabin podniósł swą dłoń i machnął ją dając znak stojącym przed nim siedmiu widzewiakom. Ci podpalili swoje zamoczone w smole kije i unieśli je do góry. Siedem jasnych płomieni buchnęło nad łysymi głowami wojowników Izraela. Z tyłu puszczono race, bębniarze zaczęli grać.\n- NA WOJNĘĘĘĘĘ! - wykrzyczał Mosze. Tysiąc nóg odzianych w sandały z werwą ruszyło po asfalcie w stronę zachodzącego słońca. Rabin Mosze wciąż stał na skale, patrząc jak szeregi podległych mu wojowników maszerują na jego rozkaz. Złapał się za pierś i wymacał zawieszony na szyi medalion z gwiazdą Dawida. Zacisnął na nim dłoń, wbijając ostre końcówki gwiazdy w swoje żylaste dłonie. Lecz nie czuł bólu. Tylko dumę."
zydzew.18.a: "Nie nastanie świt...dla gojów."

zydzew.19.t: "(Nie)zapominalne czyny"
zydzew.19.desc: "- Jestem już na to za stary - burknął pomarszczony od starości człowiek siedzący w skrzypiącym fotelu.\n- Przemyśl to jeszcze, chcesz dokonać żywota siedząc w tej norze i pijąc te szczyny.\n- To nie są szczyny - warknął pułkownik Henryk Piontkowski biorąc do ust szklankę brzoskwiniowej amareny - a to mój dom i chcę tu umrzeć!\nTe słowa, wypowiedziane ta tle uginających się od starych książek, dokumentów a nawet wycinków gazet zabrzmiały wyjątkowo mocno.Ubrany w wyjściowy, czarny dres adidasa wysłannik żydzewskich kiboli stanął przy oknie wzdychając głęboko. Dziesiąte piętro bloku na Łódzkim Teofilowie zapewniało zapierające dech w piersiach widoki.\n- Winda działa?\n- Miesiąc temu działała. Muszą tylko znaleźć części.\n- Pułkowniku, przecież ledwo chodzisz o lasce, nie możesz tu zostać, chodź do nas, do swoich, tam ci pomożemy.\n- Do debili nie pójdę, Jeszcze przed Upadkiem kilku kiboli na derbach miasta ukradło mi laskę dla zabawy, a byłem koło Ronda Lotników! - Pułkownik tak się uniósł, że aż złapał go kaszel. Wysłannik przewrócił oczami.\n- To pewnie byli ŁKSiarze. Nawet jeśli wśród nas są debile, to nie znaczy, że jesteśmy nic nie warci. Pomożemy ci we wszystkim, nawet przy podcieraniu dupy, tylko chodź z nami. Lublin już czeka pod blokiem.\n- Nigdy.\n- Nienawidzą cię tu. Nie pozwolą ci spokojnie dożyć swoich dni. Wiesz, że ten cały Dialog to pic na wodę. Potrzebujemy ciebie i twoich umiejętności, pułkowniku - Płk. Henryk dopił szklankę amareny i odstawił ją na stolik do kawy. Zagryzł wargi i przemówił:\n- Kogo niby miałbym szkolić?\n- Wielu naszych. Jeden z nich bardzo się wyróżnia, jest odpowiedzialny, sumienny i wierny.\n- Niespotykane wśród kiboli - Płk. Henryk podrapał się dobrą chwilę po brodzie.\n- Niech będzie, ten wasz przodownik mnie zaciekawił. Może nawet nie kłamiecie"
zydzew.19.a: "Pułkowniku, nigdy byśmy Panu nie kłamali..."

zydzew.20.t: "Trudne ambicje"
zydzew.20.desc: "Oficer WSW patrzył się na krajobraz za oknem. Widok z trzeciego piętra Tomaszowskiej Kamienicy pozwalał mu się skupić na wykonywanej pracy jak nic innego. No, może poza papierosem w zębach, którego oczywiście teraz tam trzymał. W gabinecie oprócz tego był jeszcze jeden człowiek. Młody, gładko ogolony na brodzie i głowie gość siedział wyprostowany na krześle przed biurkiem oficera. jego zielono szary mundur zdobiły czerwono-złote oznaczenia wraz z gwiazdą przymierza, dumnie przyczepioną na piersi. Patrzył się na oficera bez żadnych emocji. Ten wypuścił wreszcie dym z płuc i odwrócił się do swojego gościa.\n- Wie pan, długo nad tym myśleliśmy - zaczął, drapiąc się po łysej głowie - i doszliśmy do wniosku, że taki człowiek jak Pan jest potrzebny do innych zadań niż dotychczasowe - Oficer zaciąga się papierosem i przypatruje ukradkiem rozmówcy. Jego twarz dalej nie drgnęła.\n- Nie, żebyśmy mieli jakieś zastrzeżenia. Wręcz przeciwnie. Jest pan jednym z najlepszych funkcjonariuszy. Znakomicie zinfiltrował pan zakłady przemysłowe w Drzewicy, wzorowo spacyfikował pan tamtą kibolską komunę i to pomimo tego, że sam pan do niej wcześniej należał - Wzrok rozmówców spotyka się, po krótkiej chwili na obu twarzach pojawiają się uśmiechy.\n- Zrobiłem to bo byli pasożytami. Mieli być wojownikami Jahwe a żyli w zbytkach na koszt frajerów. Wykonałem rozkaz z dumą, panie Pułkowniku.\n- Cieszę się, Majorze Birkut - gość uśmiechnął się jeszcze szerzej, nieco speszony spuścił na ułamek sekundy wzrok na ziemię. \n- Dziękuję, Panie Pułkowniku.\n- Na dziękowanie przyjdzie jeszcze czas. Marek jestem. - Oficer wstał i podał przez biurko rękę Birkutowi - Proszę przyjść jutro na 7:00 do pracy w tym budynku. Trzeba będzie Pana oprowadzić."
zydzew.20.a: "Ku chwale Ojczyzny!"

zydzew.21.t: "Płynąc z nurtem"
zydzew.21.desc: "Ciepłe słońce prażyło ogoloną głowę i nagi tors Birkuta. Powietrze było wilgotne i ciężkie, jak to w upalny dzień nad Drzewickim zalewem. Nowo awansowany Major WSW siłował się w kajaku z wiosłem. Wkładał we wiosłowanie całą swoją siłę lecz mimo to co najwyżej kręcił się w kółko. Odgłosy chlapania wody oraz sapania zdyszanego Birkuta przerwał głośny, serdeczny śmiech. \n- Za mocno, musisz powoli i wyczuciem, o tak.\nBirkut rozejrzał się u ujrzał płynącego w jego stronę znajomego, starszego człowieka. Kajak w którym płynął, sunął po tafli wody jakby ślizgał się po lodzie. Major popatrzył z uznaniem.\n- Po prostu musisz jeszcze trochę poćwiczyć. I wyluzować. Czemu się tak stresujesz? - zapytał starzec. Birkut wybuchnął śmiechem.\n- Naprawdę się pytasz? Każdy by się stresował w moim położeniu. Niedługo wejdziemy do lasu. Będę dowodził. \n- To tym bardziej nie masz się czym denerwować. Im bardziej twoje ruchy i zachowanie będą naznaczone niepewnością i gwałtownością, tym większa szansa że coś się spierdoli - Birkut zamyślił się i spuścił wzrok. Starzec tymczasem zatrzymał się tuż obok kajaku Majora i wyjął z kieszeni małpkę pigwówki. Rzecz jasna szybko z niej pociągnął.\n- Ale co jeśli nie będą mnie przez to szanować?\nStarzec podał małpkę Birkutowi i podrapał się po szarej czuprynie.\n- Wiesz, szacunek można zdobywać dwojako. Po pierwsze - przez agresję. I jest to skuteczne. Ale pamiętaj, że będąc rozemocjonowanym łatwo się seplenić. A wówczas trudno mówić do więcej niż jednej osoby. Dlatego tak ważny jest szacunek innego rodzaju. A ten ma się wtedy kiedy zdajesz się być spokojnym i przygotowanym na wszystko.\n- Dużo wiesz jak na zwykłego ORMOwca..."
zydzew.21.a: "- Jeszcze wielu rzeczy o mnie nie wiesz..."

zydzew.22.t: "Niedzielny grill"
zydzew.22.desc: "Sosnowy bór w Parchowcu. Trzask drzwi od T4 zaparkowanego przy leśnej drodze. Potem dziesiątki cichych kroków po ściółce. Był donos - jest i szybka reakcja. \nOd czasu Upadku i przybycia w te rejony kiboli ŁKS-u nie zapuszczali się tu żadni leśnicy i bór zdziczał: Wokół równych rzędów drzew zdążyły wyrosnąć gęste chaszcze a ścieżki pokrył mech.  Oddział ŻOMO odziany w barwione na zielono mundury miał przed sobą nie lada zadanie: wytropić Retkińskich rewizjonistów, zneutralizować ich odizolowaną komórkę i nie dać się wcześniej zaskoczyć. Szli w nieregularnej linii, każdy pięć metrów dalej od poprzedniego. Ostre igły sosen raz po raz drapały ich po nieosłoniętych twarzach - w takich warunkach hełmy tylko ograniczałyby pole widzenia. Na ich czele szedł Birkut - z biegnącą od ust do lewego ucha raną po tym jak gałąź która stała mu na dalszej drodze wystrzeliła mu boleśnie prosto w twarz. Nie mógł jej w porę złapać, gdyż w jednej ręce trzymał skrócony kij baseballowy a w drugiej pistolet.\n- Panie Majorze... - Birkut usłyszał urwaną w połowie wypowiedź. Obrócił się i ujrzał zmieszanego szeregowego - pańska twarz! - Krew zdążyła już zastygnąć mu na policzku.\n- Nic mi nie będzie. Widać już ich? \n- Tak, na prawym skrzydle. zrobili sobie palisadę...\nCała grupa na widok uniesionej przez Birkuta ręki ruszyła w stronę obozowiska. Przedzierając się przez coraz gęstsze zarośla wreszcie ujrzeli niewielką polanę. pośrodku niej stała wysoka na półtora metra bariera ze ściętych bali oraz wszelkiego znalezionego w okolicy drewna. Wyglądała bardziej niż żałośnie. Ze środka unosił się dym, czuć było zapach niekoszernych kiełbasek pieczonych na grillu.\n- Bawią się jebusyty, ale im zaraz wpierdolimy z zasko... - chrząknięcie Majora zmyło szeregowemu triumfalne wizje sprzed oczu.\n- To może być pułapka, czułeś wcześniej ten zapach, widziałeś gdzieś dym? - Birkut uniósł lornetkę do oczu i zaczął przypatrywać się palisadzie.\n- Tu jest gęsto od roślin, przecież...\n- O proszę - Birkut uśmiechnął się krzywo - tuż pod tym płotem, spójrz.\nSzeregowy wytężył wzrok ale nic nie mógł dostrzec.\n- Tam jest okop, skitrali się i rzucili mięso na grilla żebyśmy myśleli, że balują.\n- To...co robimy? - zapytał Szeregowy\n- Masz jeszcze ten niedziałający granat? To podaj i patrz - Birkut wziął granat do dłoni krzyknął głośno i wyraźnie - UWAGA! SZYSZKA! - Celnie rzucony trafił prosto w okop pod palisadą. Rozległy się krzyki i kilkoro ubranych w czarno-czerowne dresy z logiem ŁKS-u partyzantów zaczęło gorączkowo wydostawać się z płytko wykopanego dołu.\n- Amatorzy... - mruknął Birkut po czym wziął do ust zawieszony na szyi gwizdek. Głośnemu świstowi szybko zaczęły wtórować bojowe przyśpiewki Widzewiaków. Runęli z pałami na zaskoczonych ŁKSiarzy z prędkością błyskawicy.\nBirkut nie ukrywał zadowolenia."
zydzew.22.a: "Kolejny dzień bez strat."

zydzew.24.t: "Przebudzenie Lewiatana"
zydzew.24.desc: "Noc rozświetlona jedynie buchającymi wszędzie dookoła płomieniami. Rabin Mosze, odziany w łuskowy pancerz z wymalowanym logiem RTS-u szedł w stronę świeżo powstałych ruin budynku leśniczówki. Po bokach miał swoich sierżantów. Na dresy również zarzucili pancerze. Błyski odbijających się od nich płomieni niemal raziły w oczy uganiających się  po zrujnowanej okolicy Widzewiaków oraz spętanych jeńców z partyzantki ŁKSu.\n- Ilu jest ich w środku? - zapytał się Rabin wojownika kiedy zatrzymali się już przy sztabie Filistynów.\n- Siedmiu dowódców, zabarykadowali się i nie chcą wyjść.\n\nRabin popatrzył wyzywająco na zabitą deskami starą leśniczówkę.\n- Użyć taranu? - zapytał się jeden z sierżantów\n- Nie trzeba - orzekł Mosze po czym odrzucił hełm i tales. Wypuścił kij z rąk i bezbronny pomaszerował w stronę twierdzy ŁKSu. Wyprostowany i z zadartym do góry nosem.\n- Macie ostatnią szansę aby ujść z życiem. Kto teraz wyjdzie, przeżyje. Kto nie wyjdzie w tej chwili, zginie! - krzyknął rabin.\n\nPrzez chwilę słychać było tylko trzask płomieni oraz krzątających się wokół Widzewiaków. Nagle głośny świst przeszył powietrze. Z otworu w twierdzy wyleciał oszczep. Wbił się w ziemię zaraz u stóp Moszego. Ten nawet nie mrugnął, zaczął jedynie głośno odliczać\n- Raz! Dwa!\n\nNie doliczył nawet do trzech, gdy ze środka wybiegło dwóch ludzi ubranych w czarne dresy. Szybko ich pojmano oraz zmuszono do nadepnięcia na szalik ŁKSu oraz zabrano do namiotu obrzezań.\nMosze nakazał rzucić w leśniczówkę mołotowem. Pozostali, tchórzliwi dowódcy filistynów prędko z niej uciekli błagając o litość, gotowi porzucić swój klub. Obrzezano bez znieczulenia, od razu na miejscu, jednak chwilę po tym, kiedy jeszcze zwijali się z bólu Mosze nakazał zawiązać im pętle na szyje i powiesić."
zydzew.24.a: "Rabin Mosze nie zwykł się powtarzać."

zydzew.25.t: "Utracony Raj"
zydzew.25.desc: "Pan Mariusz - 80-letni emeryt - spacerował ulicą Rokicińską w stronę Centralu, serca łódzkiego handlu. Tym razem wybierał się tam po ziemniaki i cebulę. Jak na swój wiek Mariusz całkiem żwawo pokonywał tę trasę co tydzień od kilku dekad i nawet Upadek Polski oraz trzy kolejne oblężenia jego miasta tego nie zmieniły. Władze miasta otaczały Główny Warzywniak Łodzi (jak powszechnie się go nazywa) szczególną opieką i zawsze dbały o jego zaopatrzenie.\n\nTym razem jednak staruszek czuł, że coś jest nie tak.\n\nMimo pory i wyjątkowo dobrej pogody na zewnątrz, po drodze do Centralu nie spotkał ani jednej osoby. Owszem, słyszał o jakimś niedawnym nalocie na Łódź, ale jak dotąd nie zauważył ani nie odczuł żadnych skutków tego wydarzenia w swoim życiu ani okolicy. Nagle jego coraz bardziej zawodzące oczy dostrzegły, że krajobraz kilkaset metrów przed nim jest biały i skuty mrozem. Zanim zdążył zorientować się, co właściwie się tam dzieje, jego uszu dobiegły dziesiątki męskich głosów śpiewających radosne pieśni, które po odgłosie czegoś eksplodującego w oddali stały się tylko głośniejsze i bardziej wyraźne.\n\nPan Mariusz, który był tym wszystkim co najmniej mocno zdezorientowany, DOPIERO TERAZ zdołał dostrzec powiewające w oddali czerwone sztandary ze złotymi Gwiazdami Dawida. Niemal natychmiast oślepiło go światło setek rac odpalonych w tym samym momencie. Natychmiast rzucił się na kolana i pośpiesznie wyciągnął z kieszeni jarmułkę, zastępując nią swoją kaszkietówkę."
zydzew.25.a: "\"Dał Pan i zabrał Pan. Niech będzie imię Pańskie błogosławione!\""

unification.3.t: "[GetNewspaper]Kibole Widzewa jednoczą województwo łódzkie"

unification.3.desc: "Polska po Upadku jest domem dla wielu dziwnych i osobliwych ruchów politycznych oraz religijnych. Niewiele z nich może się jednak równać pod względem osobliwości nowym władcom Łodzi.\n\nŻydowska, socjalistyczna teokracja Nowego Kanaanu jest połączeniem miejscowych elit żydowskich, które osiedliły się w Łodzi po fali antysemickich ataków w innych częściach kraju, starej komunistycznej gwardii z czasów PRL-u, na której czele stoi Jerzy Urban, oraz kiboli RTS Widzew, którzy przeszli na judaizm po Bitwie o Widzew, służącej obecnie za mit założycielski państwa. Wspólnotowe społeczeństwo Nowego Kanaanu i jego lewicową gospodarkę można określić jedynie mianem \"kibicowskiego kibucyzmu\" lub \"teokratycznego kibolskiego komunizmu\".\n\nChoć można się zastanawiać, czy konserwatywna ludność Polski zaakceptuje władzę tak mocno zderzającą się z jej światopoglądem, sąsiedzi Widzewa obawiają się, że już wkrótce mogą poczuć Miecz Jahwe na swoich plecach."
unification.3.a: "Jahwe działa w tajemniczy sposób."

unification.37.t: "[GetNewspaper]Kibole Widzewa jednoczą województwo łódzkie"
unification.37.desc: "Polska po Upadku jest domem dla wielu dziwnych i osobliwych ruchów politycznych oraz religijnych. Niewiele z nich może się jednak równać pod względem osobliwości nowym władcom Łodzi.\n\nŻydowskie, socjalistyczne państwo Polin powstało w wyniku sojuszu miejscowych elit żydowskich, które osiedliły się w Łodzi po fali antysemickich ataków w innych częściach kraju, oraz kiboli RTS Widzew, którzy przeszli na judaizm po Bitwie o Widzew, służącej obecnie za mit założycielski państwa. Strukturę i gospodarkę Polin zaprojektował nie kto inny jak Jerzy Urban, który służył w aparacie cenzury i propagandy PRL-u, a później założył skrajnie antyklerykalny tygodnik \"NIE\".\nChoć można się zastanawiać, czy konserwatywna ludność Polski zaakceptuje władzę tak mocno zderzającą się z jej światopoglądem, \"Goebbels Stanu Wojennego\" przygotowuje kolejną błyskotliwą satyrę potępiającą sąsiednie reżimy."
unification.37.a: "Oddajcie kamienice albo zostaną siłą rozdystrybuowane."

super.3.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.3.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.3.a: "Wreszcie zjednoczeni."

