super.196.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.196.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.196.a: "Wreszcie zjednoczeni."
 
unification.196.t: "[GetNewspaper]Żabka jednoczy północną Wielkopolskę!"
unification.196.desc: "Poznań, niegdyś potęga gospodarcza, przemysłowa i handlowa, która przyćmiewała cały region, od lat pogrążał się w walkach wewnętrznych i zniszczeniu po upadku Polski i późniejszej interwencji Eurokorpusu. Ostatni przełom w lokalnej walce o władzę sprawił, że jedna z frakcji wyrosła na regionalnego hegemona. Gdy dym opada nad stolicą Wielkopolski, okazuje się, że to sieć handlowa Żabka przejęła kontrolę nad stolicą zachodniej Polski. Po obaleniu przedwojennego prezydenta i spacyfikowaniu rozmaitych gangów z Jeżyc i Rataj Poznań stał się prawdziwą ostoją leseferyzmu, pozostającą pod czujnym okiem zarządu z wielkiego szklanego wieżowca przy ulicy Stanisława Matyi. Północna Wielkopolska jest teraz w praktyce własnością korporacyjną Żabki, która już rozgląda się za kolejnymi terenami do ekspansji. Tylko przyszłość pokaże, czy jej ambitne przedsięwzięcia biznesowe zakończą się sukcesem."
unification.196.a: "Re re kum kum."

