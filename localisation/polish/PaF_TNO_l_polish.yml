TNO_piuwo_desc: "11.11.2022 - Incydent z wycieku łódzkiego\n01.05.2023-03.05.2023 - Incydent z Nyskiej Kroniki Filmowej\n29.09.2023-01.10.2023 - Incydent z krakowskimi naklejkami\n19.04.2024-21.04.2024 - Incydent z flagą we Wrocławiu"



POLITICS_SPEEREK_DESC: "...Albert Speer? ...C-co masz na myśli, ''Albert Speer''? Co, że nazistowski minister i architekt? Co z nim?\n\n...Jest tutaj? Mówisz, że się tu znajduje? Mówi do nas?\n\nEch...\n\nProśba o zaaplikowanie kolejnej dawki...tak, i jeszcze dwie tabletki. Dziękuję.\n\n\n\nDobra, słuchaj kolego. Będę szczery: *NIE MA ŻADNEGO ALBERTA SPEERA*. Dawno nie żyje. Od jakichś 50 lat.\nNie ma również żadnego TNO. To tylko wymysł twojej wyobraźni. Dziwaczny alternatywny wszechświat który stworzyłeś sobie w głowie. Nie ma żadnych 'Atlantrop', 'śmiesznych eventów z biurkiem', 'ultrawizjonarystycznych programów kosmicznych' ani żadnych innych 'Speerowych i Yagodowych serków homogenizowanych' o których bełkoczesz non stop do siebie gapiąc się pustym wzrokiem w ściany. Nie ma ich tutaj. Nie ma ich nigdzie. Nie istnieją. Nigdy nie istnieli.\n\nChodź, czas żebyś zszedł na ziemię i dotknął trochę trawy. Bądź grzecznym chłopcem i weź tabletki.\nDobrze?"
