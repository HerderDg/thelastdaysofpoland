unification.140.t: "[GetNewspaper]Oświęcim jednoczy Małopolskę!"
unification.140.desc: "Pomimo tego, że upadek reżimu Ziobry zdawał się gotować podobny koniec jego południowym podwładnym, jedno z pozostałych państw ostałych z tego chaosu - mianowicie nowo proklamowane Państwo Wiślańskie, pozostało na górze łańcucha pokarmowego, nie tylko broniąc swoje rdzenne tereny lecz również podbijając całą resztę rozbitej Małopolski. Bez jarzma Generalnego Prokuratora, Beata Szydło powróciła na salony, zdeterminowana by w końcu odcisnąć swój ślad na losie kraju po latach bycia zmarginalizowaną przez własną partię. Po raz pierwszy od stuleci, kobieta zasiada na Wawelu. Mimo to, nie jest ona dziedziczką historycznych rodów królewskich, lecz zwykłą, prostą kobietą z ludu, w dodatku nieuznawaną przez wszystkich dookoła poza granicami jej kraju. Teraz, gdy na jej barkach ciąży brzemię przeszłości wielkich wodzów spoczywających obok na zamku, przyszłość jej władzy jest bardzo nie pewna. W końcu...
unification.140.a: "Nie zazna spokoju głowa, która nosi koronę."

super.140.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.140.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.140.a: "Wreszcie zjednoczeni."

