unification.55.t: "[GetNewspaper]Rząd Sasina jednoczy północne Mazowsze!"
unification.55.desc: "Przez kraj przetacza się fala niedowierzania i niepokoju, gdy rząd w Ciechanowie rozpoczyna transmisję przedstawiającą pustą scenę w miejskim parku, nad którą widnieje transparent z napisem \"Zjednoczenie Regionu Północnego Mazowsza\". Po około pół godzinie transmisja zostaje zaatakowana i ostatecznie przerwana, lecz przekaz pozostaje jasny. Jako jedynie odłam resztek dawnego rządu, władza Jacka Sasina nie miała według przewidywań utrzymać się długo. Jednak za sprawą jakiegoś zrządzenia losu przetrwała napór wszystkich pozostałych państewek, być może tylko dlatego, że nie upatrywały w niej żadnego zagrożenia. Niektórzy dawni przeciwnicy zrewidowali od tamtej pory swoje poglądy na temat Sasina i przyznali, choć niechętnie, że okazał się przebiegłym i sprytnym politykiem. Gdy oczy wszystkich zwróciły się na Ciechanów, pojawiło się jeszcze więcej pytań, ponieważ Sasin zerwał kontakt z pozostałymi watażkami. Zaufane źródła twierdzą, że wstrzymał wymianę listów po tym, jak omal nie podpisał dokumentu, który w rzeczywistości stanowił akt aneksji przez Czechy."
unification.55.a: "70 milionów poszło w błoto, co?"

super.55.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.55.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.55.a: "Wreszcie zjednoczeni."

