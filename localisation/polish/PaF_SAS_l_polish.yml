 ##Characters##
POLITICS_JACEK_SASIN_DESC: "Jacek Sasin twierdził, że zorganizuje wybory kopertowe za 70 milionów złotych. \n\nMówił, że wybory w 2025 roku były w pełni wolne i uczciwe. \n\nZapewniał, że niepokoje ustaną w ciągu mniej więcej tygodnia. \n\nZbywał śmiechem możliwość interwencji Unii Europejskiej. \n\nPrzekonywał, że wybuch jądrowy w Polsce to czysta fantazja. \n\nChwalił się, że warszawskie barykady są wystarczająco mocne, by powstrzymać każdego napastnika. \n\nObiecywał, że zabierze Jarosława Kaczyńskiego w miejsce, gdzie będzie bezpieczny i nic mu nie zagrozi. \n\nTeraz Sasin ukrywa się w Ciechanowie, dokąd uciekł z rządu Morawieckiego. Tam, by zachować choćby pozory legalnej władzy, mianowano go Protektorem Północnego Mazowsza. Stwierdzenie, że ktokolwiek wiele od niego oczekuje, byłoby sporą przesadą. Mimo to morale Sasina pozostaje silne jak zawsze. Z miejsca zabrał się do pracy i, choć wręcz rozpiera go optymizm, z pokorą wyraził swoją osobistą opinię: to nie on ponownie zjednoczy Polskę. \n\n§RNiech chociaż raz będzie miał rację.§!"
