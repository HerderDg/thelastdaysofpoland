unification.148.t: "[GetNewspaper]Uniwersytet Jagielloński jednoczy Małopolskę!"
unification.148.desc: "Gdy Wolne Miasto Kraków rozpadło się pod naporem rosnących wpływów i sporów między instytucjami akademickimi, niewielu spodziewało się, że z ruin wyłoni się jakaś znacząca siła. A jednak milicja Uniwersytetu Jagiellońskiego nie tylko odzyskała zbuntowane północne dzielnice, lecz także odparła wszystkich regionalnych watażków roszczących sobie prawa do metropolii, przejmując kontrolę nad całą Małopolską. Cele rektora pozostają jak dotąd w dużej mierze zagadką, poza znacznie zwiększonym finansowaniem nauki. Dzięki rozmaitym programom i kampaniom edukacyjnym ta historyczna instytucja stara się zwalczać rosnącą ignorancję i analfabetyzm polskiej anarchii. Mimo szlachetnych intencji wciąż trudno jednak ocenić, czy to akademickie państwo zdoła obronić się przed lepiej ugruntowanymi regionalnymi przeciwnikami, którzy spoglądają na osłabione miasto jak na cel kolejnego podboju."
unification.148.a: "Czy grupa akademików naprawdę zdoła utrzymać władzę?"

unificationreg.148.t: "[GetNewspaper]Jagiellonowie umacniają swoją pozycję"
unificationreg.148.desc: "Wbrew wszelkim przeciwnościom siły Państwa Jagiellońskiego nie ugięły się pod naporem sąsiednich watażków, lecz z powodzeniem rozszerzyły swoje władztwo na całą Małą Galicję. Choć konflikt na dwóch frontach zagrażał miastu, ostateczne zwycięstwo zapewniła nie przewaga militarna rywali, lecz zaufanie i oddanie mieszkańców wobec rektora oraz jego opiekuńczego reżimu. Dzięki ich wysiłkom, gdy reszta kraju zdaje się tkwić w kolejnych wiekach ciemnych, Kraków przeżywa prawdziwy renesans kultury i nauki. Intelektualizm na dobre opanował region, a oświecone masy mają poświęcić się nieustannemu dążeniu do wiedzy. Wkrótce jednak to skupienie na sprawach wewnętrznych może zostać ponownie przerwane, gdy nad Polską gromadzą się ciemne chmury, zwiastujące kolejną falę wrogości."
unificationreg.148.a: "Spośród wszystkich cnót wiedza wyróżnia się najczystszą postacią"

unificationsupreg.148.t: "[GetNewspaper]Południowy wschód kłania się Jagiellonom"
unificationsupreg.148.desc: "Galicja, często uważana za polskie zaściankowe peryferie, stała się teraz centrum akademickiego złotego wieku. Mimo zaciekłego lokalnego oporu nic nie wydaje się w stanie powstrzymać rozprzestrzeniania się nowego zapału edukacyjnego, a rosnące w siłę wojska jagiellońskie bez trudu pokonują kolejnych przeciwników w regionie. Choć do zintegrowania niechętnych wschodnich ziem pozostało jeszcze wiele pracy, elity poszczególnych województw w zdecydowanej większości witają ten rozwój wydarzeń z entuzjazmem, widząc w nim szansę na kulturową odbudowę zdewastowanych terenów. W wyniosłych salach nauki narastają jednak pogłoski o coraz większym fanatyzmie, a pasja rządzącej elity do wiedzy przeradza się w obsesję osiągnięcia intelektualnej doskonałości. Rektor i jego współpracownicy coraz bardziej odcinają się od świata, zagłębiając się w zakurzone, starożytne tomy. Coraz rzadszy kontakt z otoczeniem budzi obawy, że państwo zwraca się ku mistycyzmowi. Pogardzając nowoczesnością, która niemal zniszczyła ich historyczny porządek akademicki, Jagiellonowie pragną przywrócić czasy chwały humanistycznej dominacji."
unificationsupreg.148.a: "Odrzucenie nieuchronnego upływu czasu"

super.148.t: "[GetNewspaper]Wieczna Akademia triumfuje"
super.148.desc: "To, co niegdyś wydawało się niemożliwe, a w ostatnich miesiącach niemal nieuniknione, wreszcie stało się rzeczywistością. Ku zaskoczeniu obserwatorów z zewnątrz rozbita Polska została ponownie zjednoczona przez jagiellońskich akademików. Państwo wyłoniło się z upadku Wolnego Miasta Krakowa i początkowo opierało się na ugruntowanej hierarchii jednej z najstarszych uczelni w kraju, lecz od tego czasu przekształciło się w kult wiedzy, choć nie z nazwy. Intelektualna elita jest pochłonięta dążeniem do duchowej nieśmiertelności poprzez nieustanne studiowanie tajemnych, dawno zapomnianych tekstów. Choć odrodzony kraj zdaje się gotowy, by ponownie wkroczyć na światową scenę, nie podjęto dotąd żadnych takich prób, gdyż państwo pozostaje pochłonięte swoim faustowskim układem. Polska, ogarnięta szaleństwem, zdaje się powracać do czasów mistycznej akademii - państwa stojącego w sprzeczności z upływem czasu, w którym wiedza splata się z okultyzmem."
super.148.a: "Ipsa scientia potestas est"

