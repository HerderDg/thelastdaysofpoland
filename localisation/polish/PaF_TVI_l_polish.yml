unification.175.t: "[GetNewspaper]Tan-Viet jednoczy Pomorze Gdańskie!"
unification.175.desc: "To, co zaczęło się jako przyczółek logistyczny w Gdańsku, przerodziło się w śmiały eksperyment z korporacyjnym zarządzaniem państwem. Tan-Viet, jeden z najbardziej znanych dystrybutorów orientalnej żywności w Europie Środkowej, zjednoczył Pomorze Gdańskie pod własną marką - najpierw zarząd, potem buty na ziemi. Firma w zaskakująco krótkim czasie stworzyła sprawnie działającą strukturę cywilną: łańcuchy dostaw stały się liniami życia, magazyny zamieniły się w ministerstwa, a dawne centra dystrybucyjne wywieszają teraz zarówno polskie, jak i wietnamskie flagi. Trwają prace nad uprawą ryżu w pobliżu Wisły - ambitną i symboliczną próbą \"sprowadzenia Mekongu nad Bałtyk\". Przedstawiciele Tan-Viet obiecują \"integrację diaspory\" i \"ponowne nawiązanie więzi\", oferując tysiącom Polaków wietnamskiego pochodzenia, od dawna traktowanych jak obcy, nie tylko stabilność, lecz także poczucie przynależności. Krytycy szepczą o korporacyjnym kolonializmie, inni dostrzegają sprawność, pokój i pełne półki. Na razie Tan-Viet oferuje coś rzadkiego w Polsce po Upadku: porządek. Dopiero przyszłość pokaże, czy jest on trwały, czy stanowi jedynie pierwsze danie w ramach znacznie większego apetytu na władzę."
unification.175.a: "Czy to nadal Pomorze Gdańskie? A może już Pho-morze?"


super.175.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.175.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.175.a: "Wreszcie zjednoczeni."

