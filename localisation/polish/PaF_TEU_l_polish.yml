POLITICS_HOCHMAJSTER_DESC: "Katolicyzm - religia i siła towarzysząca polskiej świadomości narodowej od samych jej początków - przez stulecia stał się jednym z filarów polskiego społeczeństwa. Trudno temu zaprzeczyć. \nByć może przynajmniej częściowo tłumaczy to dojście Hochmajstra do władzy, które w przeciwnym razie wydawałoby się wręcz absurdalne. \n\nNiewiele wiadomo o Hochmajstrze. Tajemniczo pojawił się w czasie upadku państwa polskiego, a w ciągu kilku tygodni zyskał poparcie lokalnych katolickich ekstremistów, z których uformował siłę zbrojną przypominającą dawny Zakon Krzyżacki. \nKrąży wiele spekulacji na temat jego przeszłości i tożsamości. Czy jest niemieckim agentem wysłanym, by podporządkować Polskę pod przykrywką katolickiego zakonu? A może sługą chaosu, który naprawdę wierzy, że naśladowanie średniowiecznych wrogów Polski to najlepsza droga ku przyszłości kraju? Czy jest po prostu obłąkanym odtwórcą historycznym, któremu udało się wykroić własne państewko po upadku porządku? Niemal wszystkie teorie okazują się bezpodstawnymi domysłami, wynikającymi z braku jakichkolwiek wiarygodnych informacji o Mistrzu Zakonu. Jego zbrojni zwolennicy są zaś na tyle fanatyczni, że bezwzględnie pilnują, by jego życzenie zachowania tajemnicy pozostało nienaruszone."

##Events##
unification.94.t: "[GetNewspaper]Tełtonisze Ordensztat jednoczy Warmię i Mazury!"
unification.94.desc: "Cała Polska patrzy z niedowierzaniem, gdy organizacja podająca się za kontynuatorkę misji Zakonu Krzyżackiego zdołała ustanowić własne państwo na ziemiach Warmii i Mazur.\n\"Tełtonisze Ordensztat\", dowodzony przez człowieka znanego jedynie jako \"Der Hochmajster\", jeszcze kilka miesięcy temu uchodził za podupadłe pośmiewisko, a niektórzy określali go wręcz mianem \"wytworu szaleństwa\". Jednak dzięki boskiemu zrządzeniu losu albo jego wyjątkowo choremu poczuciu humoru Zakon zdołał pokonać i podbić wszystkie pozostałe siły w regionie, w tym odeprzeć rosyjskie niedobitki z Kaliningradu.\nPomimo przywiązania państwa do niemieckiego ultranacjonalizmu i katolickiego ekstremizmu zarówno niemiecki Eurostaat, jak i Watykan potępiły istnienie Zakonu, określając je mianem „absurdu” i „kpiny z katolicyzmu”.\nNiewielu wierzy, że Zakon przetrwa długo, ale historia widziała już większe absurdy."
unification.94.a: "Polaken Kaput!"

unificationreg.94.t: "[GetNewspaper]Gott und Hajmat"
unificationreg.94.desc: "Der Tełtoniszes Folksarme stands triumphant over Projsen. Der Hochmajster has personally thanked his best Knights during a Mass in Kwidzyn Katedralkirśe, celebrated by Him. In a lengthy speech He mused about the country's past, blaming the Fall on numerous sabotages from within, committed against the benevolent rulers of old Poland who only cared about the country's best interests. \n\nAnd he promises to right the wrongs they committed, one head at a time."
unificationreg.94.a: "Es lebe die Ordensztat!"

unificationsupreg.94.t: "[GetNewspaper]The Ugly, yet Small Truth"
unificationsupreg.94.desc: "Half of Old Poland belongs to the Knights. The Holy Flag flies high over all of Ostpolen, from Malbork all the way to Rzeszów.\nThe celebrations began as usual, with a Mass in Kwidzyn Katedralkirśe celebrated by Der Hochmajster himself. As during previous celebrations, a speech was to take place straight after the Mass. \nDer Hochmajster stood proud in front of the altar. In front of him, in the first row sat his best Knights, their armour gleaming in dim candlelight. Some of them were with Him since the dark beginnings of the Fall, when the first states were established. \nAnd as everyone waited for him to begin, he slowly, without a single word, removed his chainmail gloves and grabbed his helmet. A wave of gasps and murmurs broke the silence as he took the metal protection off, revealing his face for the first time. \nThe noises turned louder, some more fearful and others filled with hope not heard before, as the maskless Hochmajster walked down the steps leading to the altar. How have they been so blind? How has His voice, that felt so familiar, yet so foreign, not betrayed Him earlier? How did He manage to conceal His identity for so long without anyone finding out the reality?\nIt was pointless to think about it now. \n"Majnen brudern und szwestern." He finally spoke, his husky voice resonating from the ancient walls of the Cathedral. "Ojer sig ist szliszen. Iś bin wider da. Sztark und berajt."\nThe crowd listened closely as Jarosław Kaczyński spoke for the first time in many, many years. \n"Bist du baj mir, majner towarzyszen?" \nAnd the crowd stood up, erupting in euphoric ecstasy, saluting their old Master with all their might. "
unificationsupreg.94.a: "'JA, DER HOCHMAJSTER!'"

super.94.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.94.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.94.a: "Wreszcie zjednoczeni."

