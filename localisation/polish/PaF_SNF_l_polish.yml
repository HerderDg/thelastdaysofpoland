unification.198.t: "[GetNewspaper]Narodowy Związek Słowiański jednoczy Pomorze Zachodnie"
unification.198.desc: "Losy wojny ponownie się odmieniły na Pomorzu Zachodnim. Nad Bałtykiem powiewa kolejny sztandar, głoszący jedność - ale na czyich warunkach? Szczecin znalazł się pod rządami Narodowego Związku Słowiańskiego, ultranacjonalistycznego reżimu przywiązanego do dawnych marzeń endecji i nowej wiary w słowiańskie braterstwo. Na jego czele stoi Eugeniusz Sendecki, człowiek uważający się za prawdziwego spadkobiercę Romana Dmowskiego, a Wojciech Olszański został jego prawą ręką, podsycając gniew przeciwko wszystkim, którzy stają im na drodze. Polska z jego marzeń nie ma być zachodnią demokracją ani państwem całkowicie podporządkowanym Rosji, lecz sojuszem opartym na krwi i wierze, w którym Moskwa jest partnerem w walce ze zgubnymi wpływami Berlina, Brukseli i Waszyngtonu. Obserwatorzy mogą się zastanawiać, czy to wstęp do polsko-rosyjskiej integracji. Jedno trzeba przyznać - Pomorze Zachodnie może jeszcze nie stało się kolejnym rosyjskim obwodem, ale z pewnością zachowa duszę polskiego narodu..."
unification.198.a: "...choć obciążoną wieloma grzechami"

unificationreg.732.t: "[GetNewspaper]\"Jaszczurkowcy\" przekształcają się w Polski Związek Narodowy"
unificationreg.732.desc: "Wygląda na to, że ślady unijnej interwencji w Polsce są coraz bliższe całkowitego zatarcia. Żołnierze Polskiego Związku Narodowego wkroczyli niedawno do Gdańska i przejęli kontrolę nad całym województwem pomorskim. Wszelkie pozostałości wpływów niemieckich są agresywnie eliminowane, a wielu etnicznych Niemców zmusza się do wygnania. Kampania ta bywa porównywana do działań ZSRR w Polsce po II wojnie światowej. Jabłonowski najwyraźniej coraz mocniej utożsamia się ze swoim alter ego, do tego stopnia, że niektórzy przestają kojarzyć z nim nazwisko \"Wojciech Olszański\". Rząd Jabłonowskiego, znany jako \"Polska Rada Narodowa Kamratów\", staje się coraz bardziej wojowniczy. Przyszłość zachodniej Polski będzie więc zależeć od siły i determinacji, a powstrzymanie rozpędu Jaszczurów wymagałoby dziś znacznego wysiłku militarnego."
unificationreg.732.a: "Wyrwiemy naszym wrogom serca!"

unificationsupreg.732.t: "[GetNewspaper]Polski Związek Narodowy umacnia władzę w zachodniej Polsce"
unificationsupreg.732.desc: "\"Jaszczurkowcy\" Aleksandra Jabłonowskiego wyszły poza Pomorze, skutecznie podbijając Wielkopolskę i województwo łódzkie oraz umacniając władzę jako Polski Związek Narodowy. Ich misja \"odbudowy\" Polski zbliża się do końca, lecz muszą jeszcze pokonać potężnego przeciwnika - obecny rząd śląski, kontrolujący również polskie Łużyce. Potęga przemysłowa wrogów jest już jedyną przeszkodą stojącą na drodze do ataku na wschodni brzeg Wisły. Polska Rada Narodowa Kamratów nadal rządzi żelazną ręką, a mieszkańcy wszystkich czterech województw kontrolowanych przez Jabłonowskiego szykują się do kolejnej bitwy. Pod bezwzględnym przywództwem Jabłonowskiego i Sendeckiego z pewnością będzie ona krwawa."
unificationsupreg.732.a: "Będziemy, kurwa, walczyć! Ty ludzka gnido, ty skurwysynu!"

super.732.t: "[GetNewspaper]Polska Narodowa Republika Ludowa przejmuje władzę"
super.732.desc: "Dziś Polska została oficjalnie zjednoczona, a jej przemiana przybrała nieoczekiwany kierunek. Władzę objęła Polska Rada Narodowa Kamratów, kierowana przez Wojciecha Olszańskiego, znanego również jako Aleksander Jabłonowski, oraz jego prawą rękę Eugeniusza Sendeckiego. Zagraniczni obserwatorzy określają ideologię rządzącej instytucji mianem \"narodowego bolszewizmu\", łączącego komunistyczny kolektywizm z brutalnym etnonacjonalizmem. W praktyce oznacza to palącą nienawiść do wszystkiego, co zachodnie, pragnienie zachowania polskiej tożsamości katolickiej za wszelką cenę oraz politykę stawiającą Polaków na pierwszym miejscu... o ile oczywiście rząd uzna ich za prawomyślnych obywateli. Odbywa się to kosztem praw mniejszości i integracji Polski z Zachodem. Większość państw Europy Zachodniej jest zszokowana takim obrotem spraw, a obrońcy praw człowieka już oskarżają rząd Republiki o czystki etniczne. Nie wiadomo, jak rozwinie się sytuacja, lecz Polska z pewnością nigdy nie będzie już taka sama."
super.732.a: "Otchłań spogląda w odpowiedzi"
