generic_consolidation_of_new_territories: "Integracja nowych terytoriów"
generic_consolidation_of_new_territories_desc: "Niestety już po raz trzeci Polska jest zmuszona konsolidować swoje terytoria. Najpierw mieliśmy rozbicie dzielnicowe, potem zabory, a teraz znowu ten sam pierdolnik. Ale do trzech razy sztuka, prawda? Chyba powinniśmy po prostu zrobić to samo, co wcześniej, i... nie, nie, nie, nawet mi nie mówcie, że to nie ta sama epoka. Mamy rycerzy, książąt, Rosjan i Niemców - to jest DOKŁADNIE ten sam pierdolnik. Wystarczy więc chyba poczytać trochę historii, prawda? Naprawdę wolałbym teraz czytać książki historyczne."
generic_expanding_the_administration: "Rozszerzanie administracji"
generic_expanding_the_administration_desc: "Mało znane prawo historii głosi, że każde społeczeństwo prędzej czy później zgodzi się na współpracę w dziedzinie administracji cywilnej. Przed Upadkiem Polacy dostawali na jej punkcie pierdolca. Chyba nadal dostają, zwłaszcza na Zachodzie. Ale hej, kiedy przestaje lecieć ciepła woda, kanalizacja się zapycha, a po ulicach grasują bandyci, ludzie zaczną błagać o jakąkolwiek administrację cywilną. Zawsze znajdzie się też ktoś przekonany, że zdoła ponieść konieczną ofiarę i zawrzeć układ z diabłem. Kierując się tą zasadą, rozciągniemy kontrolę na całe nasze terytorium."
generic_announce_the_elections: "Na wybory, rodacy!"
generic_announce_the_elections_desc: "Niezwykłą zaletą demokracji jest to, że pozwala zrzucić z siebie odpowiedzialność. Technicznie rzecz biorąc, prawdziwa demokracja nie powinna na to pozwalać, ale czy w naszej sytuacji naprawdę zamierzacie wybrzydzać? Mamy mnóstwo odpowiedzialności do zrzucenia i rozdzielenia; spójrzcie tylko na całe to drzewko. Gdy tylko uda się zorganizować jakieś wybory, znajdziemy się w znacznie wygodniejszej sytuacji."
generic_a_coalition_of_citizens: "Koalicja obywateli"
generic_a_coalition_of_citizens_desc: "Chyba już kiedyś słyszałem tę nazwę. Dawno temu. Nie pamiętam gdzie. To zresztą bez znaczenia. Jest dość ogólna, mogłaby pojawić się wszędzie. Tylko... to wspomnienie tak pali...\nDo przodu, Polsko\nDo boju, Polsko\nNie zginiesz nigdy\nPóki o zwycięstwo grasz!"
generic_an_unified_front: "Zjednoczony front"
generic_an_unified_front_desc: "Każdy podział polityczny prędzej czy później sprowadzi się do dwóch rywalizujących frakcji, które następnie będą stawać się coraz bardziej podobne, aż zaczną odróżniać je wyłącznie partykularne interesy ich członków. Co stanie się później? Ktoś mógłby zrzucić bombę atomową i rozpętać wielostronną wojnę domową, ale wątpię, by to miało się powtórzyć. Powinniśmy przestać się bać i przyjąć Zjednoczony Front Nas przeciwko Nim."
generic_future_of_our_regime: "Przyszłość naszego reżimu"
generic_future_of_our_regime_desc: "Klęska państwa polskiego była klęską demokracji jako takiej. A dokładniej tej \"liberalnej\" demokracji, o której tak wielu peroruje jako o szczytowym osiągnięciu europejskich wartości. Raz zdobytej władzy nie oddamy nigdy, a już na pewno nie wskutek nędznych wyborów z czterdziestoprocentową frekwencją. Cokolwiek się stanie, nie wypłyniemy ponownie na te mętne wody."
generic_shunning_the_oppostion: "Uciszanie opozycji"
generic_shunning_the_oppostion_desc: "Czy opozycję obchodzi, co myślimy? Nie. Gdyby obchodziło, zrozumiałaby, że nie ma racji, i dołączyła do nas. Ale jej nie obchodzi. Chce tylko, żebyśmy zniknęli. Dlaczego więc my mielibyśmy się nią przejmować?"
generic_a_stern_leadership: "Silne przywództwo"
generic_a_stern_leadership_desc: "Wszelkie teorie o historycznym przywiązaniu Polaków do demokracji upadają w zetknięciu z ich oczywistą skłonnością do charyzmatycznych władców. Brak jednego niekwestionowanego przywódcy doprowadził Polskę do kryzysu politycznego i Upadku. To oczywiste, że musimy zająć miejsce w historycznym szeregu wielkich ludzi i ocalić Polskę przed kolejnym zniknięciem."
generic_army_worthy_of_poland: "Armia godna Polski"
generic_army_worthy_of_poland_desc: "Dotąd udawało nam się przeć naprzód z organizacją wojskową przypominającą zbiórki kibolskich ekip, lecz na tym etapie rozgrywki sprawne siły zbrojne stają się koniecznością. Musimy przyjrzeć się dostępnym środkom, aby wybrać odpowiednią doktrynę."
generic_private_healthcare: "Prywatna służba zdrowia"
generic_private_healthcare_desc: "Za każdym razem, gdy rząd monopolizuje opiekę zdrowotną, tworzy niewydolny, rozdęty bałagan. Wieloletnie kolejki stały się już jej symbolem. Kiedy leczenie nic nie kosztuje, ludzie marnują czas lekarzy na najdrobniejsze dolegliwości. Zamiast tego pozwolimy firmom medycznym konkurować o pacjentów na wolnym rynku. Te oferujące najlepsze usługi w naturalny sposób zwyciężą, dając nam znacznie wydajniejszy system. Taki, w którym osoby z prawdziwymi problemami zdrowotnymi zawsze otrzymają potrzebną pomoc - oczywiście za odpowiednią cenę."
generic_800_plus_tbd: "To będzie 800+!"
generic_800_plus_tbd_desc: "Nie możemy oczekiwać, że każdy odniesie sukces. Wielu obywateli znalazło się w nieszczęśliwym położeniu, niezdolnych samodzielnie się utrzymać albo z trudem wiążących koniec z końcem. Nie możemy odwrócić wzroku i zignorować ich cierpienia. Nawet jeśli przyjdzie nam słono za to zapłacić, zapewnimy obywatelom podstawowe świadczenia socjalne, pozwalające utrzymać minimalny poziom życia. Przy odrobinie szczęścia część z nich wykorzysta tę szansę, by znów stanąć na nogi."
generic_1984_tbd: "Państwowy monopol medialny"
generic_1984_tbd_desc: "Media nieustannie kłamią, fabrykując historie w desperackiej walce o utrzymanie znaczenia. Dziennikarze to zwykłe żmije, próbujące podstępnymi sztuczkami podłożyć nogę swoim rozmówcom. Czy naprawdę chcemy, żeby tacy ludzie działali w naszym kraju? Mamy ważne zadanie do wykonania, a im mniej uciążliwych reporterów będzie wpychać nam mikrofony pod nos, tym skuteczniej zrealizujemy program. Wrogie narracje są szkodliwe. Aby chronić umysły obywateli przed propagandą, chętnie wybierzemy dla nich informacje, które powinni otrzymać. I nic ponadto."
generic_nfz_tbd: "Powszechna służba zdrowia"
generic_nfz_tbd_desc: "Opieka zdrowotna jest prawem człowieka. Traktowanie jej jako towaru służącego do generowania zysku jest po prostu niemoralne. Nie pozwolimy chciwym przedsiębiorstwom stawać nad chorymi obywatelami i wyłudzać wszystkich ich oszczędności za jeden zabieg, podczas gdy bogaty finansista przeskakuje na początek kolejki, bo zaoferował wyższą cenę. Tylko finansowanemu przez państwo systemowi ochrony zdrowia można zaufać, że zapewni wszystkim jednakowy standard usług - nawet jeżeli czasem oznacza to stratę na czyimś leczeniu."
generic_fuck_social_tbd: "Ograniczanie wydatków socjalnych"
generic_fuck_social_tbd_desc: "W życiu są zwycięzcy i przegrani. Jedni pracują, by poprawić swój los, drudzy marnują otrzymane szanse i lądują na samym dnie społeczeństwa. Dlaczego mielibyśmy nagradzać porażkę pomocną dłonią? Dlaczego mamy pokazywać ludziom, że nie muszą nawet próbować, bo rząd i tak ich podniesie? Nie potrzebujemy kolejnego pokolenia obiboków uzależnionych od zasiłków i wysysających nasz budżet. Ci ludzie i tak są straceni. Pieniądze lepiej wydać gdzie indziej."
generic_free_media_tbd: "Zapewnienie wolności słowa"
generic_free_media_tbd_desc: "Choć zdecydowanie nie zgadzamy się z tym, jak opozycja przedstawia nasz rząd, będziemy bronić jej prawa do swobodnego atakowania i oczerniania nas. Pluralizm mediów stanowi jeden z głównych mechanizmów zapobiegających pełnej dyktaturze i dla dobra kraju podporządkujemy się jego kaprysom. Słuszna narracja obecna w każdym z naszych działań zostanie poddana całemu ciężarowi krytycznej oceny - i wyjdzie z niej jeszcze silniejsza. Nie musimy karmić ludzi propagandą, aby pokazać im, że mamy rację."
generic_increase_the_emissions_tbd: "Zwiększone emisje"
generic_increase_the_emissions_tbd_desc: "Popyt na tanią energię nieustannie rośnie, dlaczego więc mielibyśmy ograniczać swój potencjał przez przestrzeganie jakichś absurdalnych norm emisji? Gdy ostatnio sprawdzaliśmy, środowisko miało się całkiem dobrze. Zimy są mroźne, zieleni wokół nie brakuje, a miejscami nawet smog nie jest przesadnie gęsty. I zanim ktokolwiek zacznie nas oskarżać: choćbyśmy się starali, nadal odpowiadalibyśmy zaledwie za drobny ułamek światowych emisji, więc może niech zajmą się tamtym problemem? Jesteśmy tylko stosunkowo niewielkim państwem, które próbuje jakoś przetrwać."
generic_advocate_energetic_transformation: "Proponenci transformacji energetycznej"
generic_advocate_energetic_transformation_desc: "Stoimy na skraju katastrofy ekologicznej. Przez ostatnie stulecie ludzkość niszczyła jedyną planetę, jaką posiada, aż doszliśmy do punktu, w którym bez radykalnego ograniczenia szkodliwego wpływu ogromne jej obszary mogą wkrótce stać się niezdatne do życia. Walka o ocalenie środowiska ma charakter międzynarodowy i wymaga, by każdy naród zrobił swoje w kwestii redukcji emisji. My chętnie dołożymy własną cegiełkę. Zamknięcie dymiących elektrowni, ograniczenie zużycia węgla i promocja źródeł odnawialnych dają nam wiele sposobów, by pomóc."
generic_fixing_our_power_grid: "Naprawa sieci energetycznej"
generic_fixing_our_power_grid_desc: "Rozpad aparatu państwowego i nieustanne walki doprowadziły do całkowitego zniszczenia polskiego systemu elektroenergetycznego, a przerwy w dostawach prądu stały się codziennością. Zrujnowane stacje przesyłowe i spalone elektrownie to dopiero początek problemów naszej sieci. Wreszcie nadszedł czas, by coś z tym zrobić. Dobrym początkiem będzie odbudowa linii przesyłowych. To ogromne wyzwanie, choć i tak mniejsze niż rekonstrukcja dziesiątek elektrowni zasilających dawny polski system. Przed nami mnóstwo pracy, ale im szybciej zaczniemy, tym szybciej skończymy."
generic_black_gold: "Czarne złoto"
generic_black_gold_desc: "Węgiel. Czegóż więcej można potrzebować poza węglem? Czarne złoto wydobywa się w tym kraju od setek lat i zapewne będzie się je wydobywać przez kolejny tysiąc. Alternatywne źródła energii są zwyczajnie zbyt kosztowne jak na nasze obecne możliwości. Zamiast tego chwycimy za kilofy i jak za dawnych dobrych czasów zaczniemy walić nimi w najbliższą obiecującą skałę. Skoro wtedy to działało, teraz też musi. Węgiel nigdy cię nie zawiedzie. Przecież to nie tak, że kiedyś może się skończyć, prawda?"
generic_prospecting_for_resources: "W poszukiwaniu surowców"
generic_prospecting_for_resources_desc: "Nie możemy dłużej znosić poważnych niedoborów surowców! Nadeszła pora, aby wykorzystać nasze możliwości i otworzyć nowe źródła zasobów strategicznych.\nDzięki krajowym surowcom nasz przemysł wkrótce będzie mógł w pełni rozwinąć swój potencjał. Nowe złoża są pożywką dla rozwoju. Zapewnimy robotnikom nowoczesną infrastrukturę, wyposażenie i technologie. Gdy tylko nowe zasoby zasilą fabryki, możemy też spodziewać się prawdziwego skoku produkcji!\nCudze chwalicie, swego nie znacie!"
generic_coal_oil_and_gas: "Węgiel, ropa i gaz"
generic_coal_oil_and_gas_desc: "A jakże! Nasze nowe hasło powinno brzmieć: \"węgiel, ropa i gaz\"!\nNie udawajmy, że nowoczesne, \"ekologiczne\" wynalazki zapewnią nam dostatecznie dużo energii albo niezbędnego paliwa.\nWęgiel, ropa i gaz to nasza przyszłość, a także szansa na dostatnią gospodarkę. Musimy zbudować jak najwięcej dobrze znanych i sprawdzonych elektrowni węglowych. Jeżeli oprzemy się na znajomych źródłach tradycyjnych surowców, zapewnienie paliwa i energii nie będzie żadnym problemem.\nWęgiel, ropa, gaz!"
generic_go_green: "Graj w zielone!"
generic_go_green_desc: "Inwestujmy w przyszłość! Inwestujmy w zieloną energię!\nEkologiczne i odnawialne źródła energii wydają się najrozsądniejszym rozwiązaniem długoterminowym. Wiatr, słońce, woda, biomasa, ciepło geotermalne - to one będą napędzać nasz rozwój! Co ważne, źródła te są odnawialne, więc nie musimy martwić się ich wyczerpaniem. W przeciwieństwie do alternatyw nie zanieczyszczają środowiska, co z pewnością docenią mieszkańcy.\nProjekt ten niewątpliwie unowocześni zarówno nasze zaplecze technologiczne, jak i budowlane."
generic_increasing_our_imports: "Zwiększanie importu"
generic_increasing_our_imports_desc: "Niestety niedobory surowców w niektórych regionach mogą skutecznie hamować produkcję. Bez odpowiedniego zaplecza zasobowego nie rozwiniemy w pełni naszego potencjału. Dlatego nie powinniśmy polegać wyłącznie na rodzimych źródłach.\nDeficyt możemy jednak zniwelować poprzez zwiększenie importu niezbędnych materiałów.\nOtwórzmy się na inne rynki!\nZ pewnością uda nam się osiągnąć zysk i zawrzeć korzystne umowy handlowe. Umocni to naszą pozycję międzynarodową oraz da szansę na zbudowanie marki i rozpoznawalności za granicą!"
generic_alternative_fuel_sources: "Alternatywne źródła paliwa"
generic_alternative_fuel_sources_desc: "Konwencjonalne paliwa są już przestarzałe. Ich zasoby coraz bardziej się wyczerpują, a wykorzystywanie szkodzi środowisku.\nNadchodzi nowa era paliw alternatywnych!\nPoza dobrze znanym biogazem możemy wskazać również mniej oczywiste możliwości. Kto by pomyślał, że na przykład zużyty tłuszcz spożywczy da się przerobić na \"biopaliwo\"? A takich źródeł jest jeszcze więcej: amoniak, metanol, wodór... wszystkie mogą nam służyć, o ile tylko zechcemy przyjąć nowe rozwiązania!"
generic_gifts_of_our_earth: "Dary naszej ziemii"
generic_gifts_of_our_earth_desc: "Niezależnie od naszego światopoglądu i pozostałych zapatrywań: nie tylko armie maszerują na brzuchach, lecz całe społeczeństwo. Ta ziemia, okaleczona zarówno przez cywilizację, jak i decywilizację, nadal potrafi rodzić plony, a my musimy obrać przewodnią filozofię ich uprawy. Do tego cały kraj jest zaśmiecony: równolegle z rolnictwem sformalizujemy przemienianie otaczających nas śmieci w skarby."
generic_radical_gardening: "Radykalne ogrodnictwo"
generic_radical_gardening_desc: "RADYKALNE OGRODNICTWO HOP! HOP! HOP!\nNie możemy pozwolić sobie na trzymanie się \"zrównoważonego\", \"organicznego\" rolnictwa. Trudy przetrwania i wojny wymagają maksymalnych plonów w krótkim czasie. Nawozy o wątpliwym terminie przydatności, nasi zmarli, całkowicie bezpieczne chemikalia warzone samodzielnie: wszystko musi służyć zwiększeniu wydajności. A każdą chorobę związaną z nadmiernym nawożeniem i tak można zrzucić na stres życia po Upadku."
generic_scrap_tbd: "Każdy ziom zbiera złom"
generic_scrap_tbd_desc: "Wszędzie wokół leży zniszczona, rdzewiejąca stal. Złom. Ruiny. Wraki. Rzeczy, które możemy wykorzystać. Tchnąć w nie nowe życie. Pod całym tym śmieciem kryje się czysta, lśniąca stal. Musimy tylko zebrać te gnijące stalowe kości i przetopić je, wypalając rdzę oraz spoglądając na metal, który odzyskał siłę. Jedna zardzewiała belka po drugiej - to wystarczy, by dać gospodarce impuls potrzebny do stanięcia na nogi."
generic_gigafarms_tbd: "Olbrzymie kompleksy rolnicze"
generic_gigafarms_tbd_desc: "Nazywajcie je, jak chcecie: latyfundiami, PGR-ami, kołchozami, rolnictwem przemysłowym. Koncepcja jest prosta: zabrać rodzinne, neofolwarczne skrawki ziemi i połączyć je w systemy infrastruktury epoki przemysłowej, które maksymalnie wykorzystają ekonomię skali. Z setek gospodarstw powstanie jeden kompleks, przynoszący trzykrotnie większe plony niż pożarte przez niego małe farmy i wymagający zaledwie jednej czwartej ich personelu. Oto nasza przyszłość."
generic_natural_gardening: "Naturalne ogrodnictwo"
generic_natural_gardening_desc: "Ze wszystkich stron otacza nas niewydolna ochrona zdrowia i niezliczone zagrożenia dla zdrowia; nie potrzebujemy jeszcze żywności, która również będzie nas zatruwać. Nasze gospodarstwa staną się więc ściśle ekologiczne. Nie musimy przebierać w sztucznych nawozach, skoro mamy całkiem dobry krowi nawóz, którym możemy wzbogacić glebę! Ludzie podziękują nam za mniejsze, lecz zdrowsze plony - żołnierze również."
generic_focus_on_recycling: "Powrót do starych śmieci"
generic_focus_on_recycling_desc: "Polska po Upadku jest skarbnicą niegdyś bezużytecznych śmieci. To istna róg obfitości części, materiałów i wszystkiego, co pomiędzy. Na dodatek niemal każda osada ma własną populację meneli, która od lat znajduje zastosowanie dla odpadów. Wykorzystajmy ich mądrość i przetwórzmy gnijące szczątki narodu w naszą nową przyszłość. Odnowione towary będzie można ponownie wykorzystać na potrzeby cywilne i przemysłowe, zużywając ułamek energii potrzebnej do wyprodukowania nowych."
generic_ecological_farming_initiatives: "Ekologiczne inicjatywy rolnicze"
generic_ecological_farming_initiatives_desc: "Rolnictwo ekologiczne samo w sobie stanowi naukę i sztukę godną tego, by intelektualiści poświęcili się jego rozwojowi. Odrzuciwszy nienaturalny, sztuczny agrobiznes, możemy dalej optymalizować małe, naturalne gospodarstwa: prowadzić badania gleby, ulepszać metody nawożenia i płodozmian z myślą o zrównoważeniu oraz zdrowiu wszystkich zainteresowanych. Dzięki mniejszemu śladowi ekologicznemu możemy chlubić się wysokiej jakości, poszukiwanymi produktami, jednocześnie jeszcze bardziej zagęszczając gospodarstwa bez łamania kręgosłupa ekosystemu. Co najważniejsze, dowodzimy, że zdrowa żywność jest jak najbardziej opłacalna również na dużą skalę."
generic_there_used_to_be_a_factory: "Tutaj kiedyś była fabryka..."
generic_there_used_to_be_a_factory_desc: "Przed Upadkiem Polska dysponowała całkiem znaczącą bazą przemysłową, która na tle małych warsztatów będących dziś podstawą produkcji wydaje się niemal niewyobrażalnie wydajna. Znaczną część dawnego przemysłu porzucono, lecz fabryki stoją do dziś, a ich puste hale tylko czekają, aż ktoś przywróci je do działania. Skoro uporaliśmy się z najpilniejszymi sprawami, pora przenieść produkcję do tych kolosów. Dopilnujemy, by wykorzystano pełnię ich możliwości."
generic_thousand_people_had_money_bread: "...tysiąc ludzi miało na chleb..."
generic_thousand_people_had_money_bread_desc: "Nasza odnowa przemysłu nie sprowadza się do surowych danych o wielkości produkcji. Ostatecznie wszystko, co robimy, służy ludziom. Wiele fabryk, które pragniemy ponownie otworzyć, było niegdyś głównym źródłem zatrudnienia dla okolicznych społeczności. Mamy aż nadto chętnych rąk rwących się do pracy. Kim jesteśmy, żeby odmówić? Jeśli ludzie chcą położyć chleb na stołach swoich rodzin, mogą nawet sami go wyprodukować - a przy okazji również tyle, by wystarczyło dla całej okolicy."
generic_fire_blazed_from_the_furnaces: "...z kotłów ogień rozgrzanych buchał..."
generic_fire_blazed_from_the_furnaces_desc: "Nic nie dorównuje wspaniałemu widokowi ciężkiego przemysłu. Rozpalone piece, płynnie przesuwające się linie montażowe, nieustanny łoskot maszyn... zapytajcie dowolnego robotnika, a powie wam, że fabryka porusza się we własnym, pięknym rytmie. Ci tutaj wiedzą, że ich fabryka pracuje dla większej sprawy. Jeśli zamierzamy wykonać jakiekolwiek dalsze ruchy w Polsce, potrzebujemy ton ciężkiego sprzętu i uzbrojenia. Im więcej zgromadzimy, tym bliżej znajdziemy się chwili, gdy naprawdę zaczniemy uchodzić za poważnego kandydata."
generic_for_three_shifts: "...na trzy zmiany..."
generic_for_three_shifts_desc: "W naszym obecnym położeniu nie możemy pozwolić sobie na umiarkowanie. Siła robocza jest już przeciążona i z trudem nadąża za nieustannym zapotrzebowaniem na towary przemysłowe. Musimy ciężko pracować dla wspólnego dobra. Jeśli podwójna albo nawet potrójna zmiana ma przesądzić o naszym zwycięstwie lub klęsce, należy odłożyć wszystkie wątpliwości i zatrzymać ludzi w fabrykach również po standardowych godzinach pracy. Otrzymają godne wynagrodzenie, gdy tylko sytuacja na to pozwoli. Na razie... niestety nie pozwala."
generic_a_normal_thing: "...normalna rzecz"
generic_a_normal_thing_desc: "Był czas, gdy patrzyliśmy na upadły polski przemysł z pokornym szacunkiem. Pokazywał nam, jak zacofane było nasze marne państewko. Od tamtej pory włączyliśmy potencjał produkcyjny kraju do własnej gospodarki i uczyniliśmy go swoim. W niektórych sektorach zaczęliśmy go nawet rozbudowywać, przekraczając poziom produkcji sprzed Upadku. W ten sposób umieściliśmy własną nazwę na regionalnej mapie. Zbudowaliśmy fundamenty nowoczesnego, wydajnego przemysłu, lecz nie możemy na tym poprzestać. Jedno jest pewne - to dopiero początek."
generic_civilian_investments: "Cywilne inwestycje"
generic_civilian_investments_desc: "Podstawową funkcją państwa jest troska o obywateli. Zdrowie, edukacja, bezpieczeństwo... możemy spierać się o to, w jak wiele aspektów codziennego życia powinniśmy ingerować, ale wszyscy zgadzamy się przynajmniej, że musimy zrobić cokolwiek. Niewielką część budżetu można przeznaczyć na zapewnienie ludziom najbardziej podstawowych potrzeb oraz stworzenie fundamentów niezbędnych usług. Później rozbudujemy je i określimy główny kierunek inwestycji."
generic_building_new_hospitals: "Budowa nowych szpitali"
generic_building_new_hospitals_desc: "Nie przystoi prawdziwemu państwu pozwalać, by ludzie masowo umierali na ulicach tylko dlatego, że nie zapewniono im nawet najbardziej podstawowej opieki medycznej. Szpitale są kosztownymi przedsięwzięciami, lecz dobrobytu naszego ludu nie da się wycenić. Nie mamy szans pozwolić sobie na najnowocześniejsze wyposażenie ani przyciągnąć światowej sławy specjalistów, ale obywatele powinni docenić możliwość zajęcia się wszystkimi problemami zdrowotnymi - zwłaszcza teraz, kiedy na wizytę u większości lekarzy nie trzeba już czekać kilku lat."
generic_reopening_the_universities: "Ponowne otwarcie uniwersytetów"
generic_reopening_the_universities_desc: "Niewykształconą ludnością może i stosunkowo łatwo się rządzi, ale nie utrzymamy nowoczesnej gospodarki, jeśli większość obywateli nie będzie nadawać się do niczego poza pracą fizyczną. Zapewnienie łatwego dostępu do szkolnictwa wyższego zyska nam poparcie najmłodszych pokoleń, spragnionych nowych możliwości w naszym raczkującym państwie. Już za kilka krótkich lat możemy spodziewać się ogromnego zwrotu z inwestycji w postaci setek doskonale wykształconych absolwentów, uzbrojonych w wiedzę o tym, dlaczego to właśnie nasz system najlepiej sprawdza się w ich dziedzinach."
generic_expanding_the_temples: "Rozbudowa świątyń"
generic_expanding_the_temples_desc: "Religia stanowi ważną część ludzkiego życia. Nasi obywatele zasługują na możliwość obcowania z boskością, inaczej szybko stracą ducha i poczucie celu - przynajmniej tak wielokrotnie ostrzegają nas osoby bardziej wyczulone religijnie. Jeśli tego właśnie potrzebują, niech tak będzie. Nie ma nic złego w zapewnieniu ludziom odpowiedniej przestrzeni do wyrażania wiary. Poza tym nie istnieje lepszy sposób kontrolowania instytucji religijnych niż zostanie ich głównym sponsorem."
generic_construct_new_prisons: "Budowa nowych więzień"
generic_construct_new_prisons_desc: "W naszym kraju jest zdecydowanie zbyt wielu... nazwijmy ich po prostu \"niepożądanymi\". Przestępcy, szpiedzy, zwolennicy problematycznych ideologii... gdyby tylko istniał sposób, by zamknąć ich wszystkich w pilnie strzeżonej, ograniczonej przestrzeni, z której nie mogliby dalej prowadzić szkodliwej działalności. Na szczęście rozwiązanie jest proste - więcej więzień. Wystarczy odpowiednio odległe miejsce, góry twardego, szarego betonu i grupa nieprzekupnych strażników, a będziemy mogli zapomnieć o tych nieznośnych wichrzycielach."
generic_improving_our_technological_base: "Rozwój zaplecza technologicznego"
generic_improving_our_technological_base_desc: "Nie możemy wiecznie pozostawać technologicznym zaściankiem kopiującym innowacje, które Europa Zachodnia wprowadziła dwadzieścia lat temu. Ostatecznym celem jest nadrobienie zaległości, a żeby go osiągnąć, musimy myśleć perspektywicznie i rozwijać własne projekty badawczo-rozwojowe. Oczywiście wyskrobane przez nas środki nie pozwolą konkurować z bardziej ugruntowanymi ośrodkami, lecz przyzwyczajenie ludzi do myśli, że potrafimy prowadzić niezależne badania bez polegania na innych, być może zdoła choć trochę przełamać ich zacofane nastawienie."
generic_money_is_the_new_god: "Pieniądz jest nowym bogiem"
generic_money_is_the_new_god_desc: "Potrzebujemy pieniędzy, i to szybko. Tak, tak, rozwój jest ważny. Inwestycje i cała reszta. Ale POTRZEBUJEMY pieniędzy. Zresztą cała ta \"gospodarka\" jest zbyt trudna. Dlaczego nie możemy po prostu zabrać ludziom wszystkiego, co posiadają, i zatrzymać dla siebie? Już daliśmy im tak wiele. Niech sami rozgryzą te wszystkie skomplikowane finanse, a my zaczekamy z wielkim workiem na pieniądze i zgarniemy wszystko, co zarobią. Szczerze mówiąc, dlaczego nie pomyśleliśmy o tym wcześniej? To naprawdę najłatwiejsze i najmniej problematyczne rozwiązanie, jakie kiedykolwiek stworzono."
generic_managing_our_budget: "Zarządzanie budżetem"
generic_managing_our_budget_desc: "Wszelkie zdobywane fundusze będą w zasadzie bez znaczenia, dopóki nie nauczymy się równoważyć ksiąg. Na obecnym poziomie rozwoju gospodarki nawet jedna źle zarządzana inwestycja może wystarczyć, by wtrącić nas w niekończącą się spiralę zadłużenia, zmuszającą do stopniowej sprzedaży całego majątku, aż ostatecznie nie pozostanie nam nic. Śledzenie każdego pojedynczego wydatku rządowego to żmudna i frustrująca praca, lecz obietnica niezależności finansowej z nawiązką wynagradza wysiłek."
generic_invisible_hand_of_the_market: "Niewidzialna ręka rynku"
generic_invisible_hand_of_the_market_desc: "Rynki rozwijają się najlepiej, gdy w większości pozostawi się je samym sobie. Interwencje państwa mają niepokojącą skłonność do tłumienia wzrostu gospodarczego, zwłaszcza teraz, gdy system składa się z tylu ruchomych elementów, że jakiś odległy biurokrata nie ma szans konkurować z siłami wolnego rynku. Zarządzanie należy zamiast tego pozostawić ekspertom - prywatnym inwestorom posiadającym zarówno wiedzę, jak i motywację zysku niezbędne do wyprzedzenia konkurencji oraz wygenerowania koniecznych dochodów."
generic_lower_taxes: "Niższe składki, daniny, akcyzy, podatki"
generic_lower_taxes_desc: "Jest trochę prawdy w stwierdzeniu, że opodatkowanie stanowi formę kradzieży. Jakim prawem wyciągamy pieniądze z rąk ciężko pracujących obywateli - a przynajmniej jakim prawem zabieramy im aż tyle? Dlaczego mieliby robić więcej, dawać z siebie wszystko, wymyślać innowacyjne sposoby zwiększania produkcji albo pracować po godzinach, skoro rząd ostatecznie pozostawi ich niemal bez wynagrodzenia? Potrzebujemy przedsiębiorców, a nie bezmyślnych trybików wkładających w pracę minimum wysiłku konieczne do otrzymania wypłaty. Pozwolenie ryzykantom na zachowanie większej części zysków stanie się kolejną zachętą do inwestowania."
generic_freeing_our_markets: "Uwalnianie rynków"
generic_freeing_our_markets_desc: "Czy nam się to podoba, czy nie, współczesny świat uległ globalizacji i autarkia przestała być realnym rozwiązaniem. Gospodarki stają się wydajniejsze wraz ze wzrostem skali, a państwa odmawiające udziału w światowym rynku pozostają z niewydolnymi systemami produkcji oraz częstymi niedoborami. Mówiąc prosto, konkurencja szybko zostawi je w tyle. Nie możemy liczyć, że we własnych granicach znajdziemy wszystko, czego potrzebujemy. Zamiast tego powinniśmy stać się ogniwem globalnego łańcucha dostaw - sprzedawać nadwyżki temu, kto zapłaci najwięcej, i sprowadzać z zagranicy to, czego sami nie potrafimy wyprodukować."
generic_visible_fist_of_the_goverment: "Widzialna pięść rządu"
generic_visible_fist_of_the_goverment_desc: "Prywatni inwestorzy to banda bezkręgowych ignorantów. Niektórzy przypadkiem osiągają sukces za cenę spalonej ziemi, którą po sobie zostawiają, lecz większość przedsięwzięć ostatecznie upada i musi zostać uratowana przez najbardziej odpowiedzialną ze wszystkich instytucji finansowych: rząd. Państwowe zarządzanie kapitałem może nie być równie efektowne, ale gwarantuje powolny, stabilny wzrost. Niemal dla wszystkich zainteresowanych lepiej mieć trwały monopol zapewniający równy dostęp do usług niż dziesiątki małych firm stosujących nieczyste zagrywki, by wykroić własny kawałek rynku."
generic_higher_taxes: "Podatek od opodatkowania"
generic_higher_taxes_desc: "Pieniądze nie rosną na drzewach. Programy rządowe nie są tanie, podobnie jak wojsko. Problem polega na tym, że potrzebujemy jednego i drugiego - i to więcej. Jeżeli nie zamierzamy podkręcać drukarek pieniędzy, musimy skądś zdobyć potrzebne fundusze. Biorąc pod uwagę, jak wiele już robimy dla obywateli, sprawiedliwe będzie przeznaczenie dodatkowej części ich majątku na rozszerzenie naszej działalności. W końcu to wszystko dla ich dobra. Podziękują nam później."
generic_regulating_our_trade: "Regulowanie handlu"
generic_regulating_our_trade_desc: "Obce państwa rzadko mają na sercu nasze dobro i handel nie stanowi tu wyjątku. Gdyby tylko dostały okazję, wyssałyby od nas najlepsze produkty, a następnie zalały nasze rynki tanimi, bezwartościowymi towarami. Wielu ludzi straciłoby pracę, produkcja prawdopodobnie doznałaby poważnego ciosu, a my uzależnilibyśmy się od niepewnego importu... Musimy temu zapobiec. Jeśli zajdzie potrzeba, odetniemy się od świata, ale nie zostaniemy pionkami w cudzej grze."
generic_the_future_of_warfare: "Przyszłość wojny"
generic_the_future_of_warfare_desc: "Nieustanne walki w Polsce po Upadku tworzą idealne warunki do rozwoju najnowocześniejszych technologii wojskowych. Jeśli skupimy się na przewadze technologicznej, możemy stworzyć najbardziej zaawansowane siły zbrojne na całym kontynencie."
generic_ghost_divisions: "Dywizje duchów"
generic_ghost_divisions_desc: "Ten cel powinien brzmieć jak \"Z Przyczajki\" ze ścieżki dźwiękowej Kapitana Bomby. Powinniśmy puszczać ten utwór potencjalnym rekrutom, żeby poczuli odpowiedni klimat. Nie mam pojęcia, jakich jeszcze rad można im udzielić. Za cholerę nie potrafią się ukrywać. Damy im po prostu dość sprzętu, żeby wyglądali fajnie i sprawiali wrażenie mniej więcej niewidzialnych."
generic_mechanized_war: "Zmechanizowana wojna"
generic_mechanized_war_desc: "Choć Upadek otworzył przed nami mnóstwo możliwości wykorzystania innych środków transportu, nie powinniśmy uznawać ich za trwały kierunek rozwoju techniki wojskowej. Pełna mechanizacja sił zbrojnych musi stać się koniecznością. Raz już nam się to nie udało - w 1939 roku."
generic_the_art_of_war: "Sztuka wojny"
generic_the_art_of_war_desc: "It's the Art of WAR!!!!!1 Dun-dundundun, dun-dundundun... już, dobra, wyłączam Sabaton.\n\nKażdy, kto grał w gry Paradoxu, wie, że szczytowym osiągnięciem literatury strategicznej jest \"Sztuka wojny\" Sun Zi, książka pełna boleśnie oczywistych uwag o strategii, które zazwyczaj nie mają nawet zastosowania w rozgrywce tych gier. Rzecz w tym, że powinniśmy trzymać się czegoś może i oczywistego, ale sprawdzonego."
generic_stormtroopers: "Szturmowcy"
generic_stormtroopers_desc: "Szturmowcy są szczególnie przydatni do spuszczania wpierdolu przeciwnikom politycznym w czasie pokoju. Ktoś tak chętny do stosowania arbitralnej przemocy jest zazwyczaj dostatecznie tępy, by dało się go przekonać do szturmowania wrogich okopów z naręczem granatów i pistoletem maszynowym."
generic_good_old_doctrine: "Stara dobra doktryna"
generic_good_old_doctrine_desc: "Najbardziej niezawodna doktryna walki brzmi: zbombardować ich w pizdu. Zdobyć działa, potem większe działa, a na końcu największe działa, jakie tylko można sobie wyobrazić. Jeśli zetrzemy ich z powierzchni Polski z dostatecznie dużej odległości, być może nie zauważymy żadnych błędów i niedociągnięć pozostawionych przez ekipę deweloperską tego moda."
generic_resist_and_bite: "Podgryzanie wroga"
generic_resist_and_bite_desc: "Nie możemy udawać, że nasz przemysł i infrastruktura dorównują stabilniejszym państwom. W równym starciu nie mamy żadnych szans. Musimy więc poświęcić się wojnie asymetrycznej i uderzać wrogów niżej, niż się spodziewają."
generic_saboteurs: "Referat destrukcji"
generic_saboteurs_desc: "Musimy wyszkolić ludność w szlachetnej sztuce sabotażu. Wprawdzie zdaniem wielu Polacy nieustannie sabotują samych siebie, ale mimo wszystko przyda się trochę prawdziwego szkolenia. Żaden dom nie będzie bezpieczny, żadna droga przejezdna, żadna infrastruktura sprawna."
generic_thriving_in_chaos: "Kwitnąc pośród chaosu"
generic_thriving_in_chaos_desc: "Przywykliśmy do nieustannego chaosu. Przetrwaliśmy lata rozpadu państwa. Niezależnie od tego, jak źle potoczy się sytuacja, nie będzie znacznie gorzej od tego, co już wycierpieliśmy. Mimo wszystko powinniśmy poczynić niezbędne przygotowania."
generic_way_of_the_sword: "Taniec ostrzy"
generic_way_of_the_sword_desc: "Kiedy ty imprezowałeś, ja studiowałem ostrze. Kiedy ty uprawiałeś seks przedmałżeński, ja opanowywałem szablon dywizji. Gdy marnowałeś dni na siłowni, goniąc za próżnością, ja pielęgnowałem przyrost organizacji. A teraz, kiedy Polska płonie, a barbarzyńcy stoją u bram, masz czelność przychodzić do mnie po bonus do ataku pżyw?"
generic_banner_of_spear_blood_and_fear: "Kosynierzy"
generic_banner_of_spear_blood_and_fear_desc: "Nie mam pojęcia, dlaczego ktokolwiek miałby walczyć bronią białą na współczesnym polu bitwy, ale jeśli ktoś naprawdę chce to robić - cóż, nie możemy wybrzydzać przy rekrutacji. Równie dobrze możemy dostosować się do ich potrzeb."
generic_dance_of_the_blades: "Waść machasz jak cepem"
generic_dance_of_the_blades_desc: "Zmusimy rekrutów do oglądania pojedynku Kmicica z Wołodyjowskim. W kółko. Tak długo, aż jakaś prawdziwa wiedza szermiercza wryje się w ich mózgi. Czy to zadziała? Trudno powiedzieć, ale wygląda na jedyny sposób wyszkolenia masowej armii szermierzy w pieprzonym XXI wieku."
generic_centralizing_the_command_hierarchy: "Centralizacja dowództwa"
generic_centralizing_the_command_hierarchy_desc: "Po chuja się rwiesz kurwa jak nie Twoje! Żaden żołnierz kurwa nie siedzi i za was nie dowodzi i kurwa powiedziałem, że nie ma... Tłumaczyłem tysiąc razy, bo kurwa człowiek dba bardziej jak o żonę kurwa o ten sprzęt a kurwa przyjdzie on tego. Kurwa mać tłumaczę! Jest kierowca ten i ten żaden kurwa nie jeździ. Jakim prawem kurwa, tyle razy wam tłumaczyłem!"
generic_standardizing_the_conscription_laws: "Standaryzacja poboru"
generic_standardizing_the_conscription_laws_desc: "Po Upadku w Polsce namnożyło się mnóstwo odmiennych pomysłów na temat (obowiązkowej) służby wojskowej. Dotąd nie ingerowaliśmy w nie zbytnio, pozwalając lokalnej administracji działać zgodnie z tym, co znała najlepiej, aby zachować (jakąkolwiek) sprawność. Teraz powinniśmy jednak ustanowić jednolite prawo poborowe, by zapobiec wewnętrznemu chaosowi i stworzyć stabilną rezerwę rekrutów."
generic_different_armies_under_one_banner: "Kilka armii pod jednym sztandarem"
generic_different_armies_under_one_banner_desc: "Służba w armii jest obowiązkiem wszystkich obywateli, niezależnie od ich narodowości czy pochodzenia etnicznego. Wcielanie mniejszości może być trudniejsze, ale wzmacnia ich lojalność oraz więzi z naszym państwem. Nic nie jednoczy mężczyzn tak skutecznie jak wspólna fala i kręcenie wora."
generic_creating_navy: "Tworzenie Marynarki Wojennej"
generic_creating_navy_desc: "Polska nigdy nie była potęgą morską, lecz zdobycie pozycji na morzu jest konieczne, jeśli chcemy uchodzić za szanowane państwo i handlować kluczowymi zasobami. Spójrzmy prawdzie w oczy, nikt tutaj nie jest jakimś morskim świrem. Załatwmy to więc czym prędzej."
generic_setting_up_main_naval_base: "Główny port wojenny"
generic_setting_up_main_naval_base_desc: "Jeśli Polska dokonała kiedykolwiek prawdziwego cudu planowania, była nim budowa portu w Gdyni od zera w okresie międzywojennym. Teraz musimy zrobić to ponownie. Historia się nie powtarza, ale często się rymuje. Tylko jakie miasto rymuje się z Gdynią? Kcynia? Bogatynia? Przecież żadna z nich nie leży nad morzem! To może być trudniejsze, niż sądziliśmy."
generic_repurposing_the_yacht_clubs: "Wykorzystanie klubów żeglarskich"
generic_repurposing_the_yacht_clubs_desc: "Kiedy burżuje, libki czy ktokolwiek, kogo tam chcecie obwiniać za problemy Polski, przewalali miliony na budowę jachtów i łodzi rekreacyjnych, zapewne nikt nie podejrzewał, że inwestycja przysłuży się komukolwiek poza nimi samymi. Niespodzianka! Teraz wjeżdżamy na pełnej komunie i przejmujemy te zabawki."
generic_barges_upon_the_shores: "Barki pozostawione na brzegu"
generic_barges_upon_the_shores_desc: "Powszechnie wiadomo, że gdy w 1944 roku papież święty Jan Paweł II Wielki wyruszył z największą armadą, jaką widziała historia, aby zetrzeć Japońców z powierzchni Ziemi w zatoce Leyte, powiedział: \"Patrzcie, moi kochani, jak piękny jest świat stworzony przez Boga\". I było to dobre."
generic_our_place_in_the_sun: "Nasze miejsce pod słońcem"
generic_our_place_in_the_sun_desc: "W każdym porcie świata nasze okręty będą podnosić naszą banderę, uznawaną przez każdą władzę. Może to przynieść nieprzewidziane konsekwencje: być może ktoś ponownie pomyli banderę wojenną z flagą państwową, jak zdarzało się Polsce przed Upadkiem. Jesteśmy jednak gotowi podjąć to ryzyko."
generic_creating_the_air_force: "Tworzenie Sił Powietrznych"
generic_creating_the_air_force_desc: "Przewaga w powietrzu ma kluczowe znaczenie we współczesnej wojnie. Choć nasze pierwsze kroki są skromne, musimy za pomocą wszelkich dostępnych środków przejąć kontrolę nad możliwie największą częścią nieba."
generic_setting_up_main_airbase: "Główna baza lotnicza"
generic_setting_up_main_airbase_desc: "Rozproszenie samolotów może wydawać się bezpieczniejsze, lecz jedna duża, dobrze zaopatrzona baza jest niezbędna do koordynowania misji bojowych, naprawy maszyn i szkolenia każdego, kto ma dostatecznie samobójcze zapędy, by służyć w naszych raczkujących siłach powietrznych."
generic_repurposing_the_aeroclubs: "Wykorzystanie aeroklubów"
generic_repurposing_the_aeroclubs_desc: "Samoloty rekreacyjne należy przejąć NATYCHMIAST - wraz z ich infrastrukturą i właścicielami. Każdy, kto potrafi pilotować maszynę, zostanie zmuszony do latania dla naszych sił powietrznych. Każde pojedyncze skrzydło jest na wagę złota."
generic_start_up_the_rotors: "Wirnik tnie powietrze"
generic_start_up_the_rotors_desc: "Rozwijając siły powietrzne, natrafiliśmy na poważny dylemat: jaką piosenkę powinniśmy puszczać podczas niskich przelotów śmigłowców? Wpisujcie propozycje w komentarzach. Bądźcie kreatywni!"
generic_sky_is_the_limit: "Lecę bo chcę"
generic_sky_is_the_limit_desc: "Sokół śmiglak to jest to\nDwóch pilotów obsługuje go\nGdy dowódca wsiąść mi dał\nRozwaliłem wszystko w drobny miał"
generic_like_a_clockwork: "Jak w zegarku"
generic_like_a_clockwork_desc: "Ludzie są wytrzymałymi stworzeniami. Wypełzną z powrotem i przyniosą ze sobą swoje małe zabawki. Jasne, nie będą już takie same - my również nie jesteśmy. Zebraliśmy jednak wszystkie małe kręcące się koła, jakie tylko znaleźliśmy, i ponownie ustawiliśmy je na torach. Nieważne, czy kiedyś uznawano je za zgubę zachodniej cywilizacji. Dziś znów działają. Możemy ruszyć naprzód, krok za krokiem, aż na szczyt góry, z której spadliśmy."
generic_investing_in_future: "Inwestycje w przyszłość"
generic_investing_in_future_desc: "Nie będziemy wiecznie tkwić w tym samym gównie. Osiągnęliśmy dno i od jakiegoś czasu wypływamy ku powierzchni. Bez względu na to, ile stert gruzu wciąż zalega tu i ówdzie oraz jak świeże są wspomnienia, musimy pomyśleć o tym, co zrobimy jutro - i musimy zrobić to już dziś. Zyskaliśmy luksus wyciśnięcia czegoś więcej z naszej walki o przetrwanie."
generic_investments_in_key_infrastructure: "Inwestycje w kluczową infrastrukturę"
generic_investments_in_key_infrastructure_desc: "\"...będą szykować architekci plany budowy dróg, plany budowy dróg, podkreślam jeszcze raz, plany budowy dróg. A na wiosnę wyjdziemy z budową ulic i ulic, bo jakie mamy drogi? Jakie mamy?\"\n- Krzysztof Kononowicz, 2006"
generic_brand_new_highways: "Całkiem nowe drogi ekspresowe"
generic_brand_new_highways_desc: "Czy istnieje coś bardziej owianego niesławą niż drogi Polski sprzed Upadku? Jak się okazuje, tak - drogi Polski po Upadku!\nNajwyższa pora zająć się systemem autostrad na naszym terytorium. Oznacza to zarówno remont istniejących tras, jak i budowę nowych, ponieważ dawną sieć drogową uczyniły przestarzałą podziały polityczne powstałe po Upadku. Po ukończeniu projektu nasi ludzie będą mogli sprawnie podróżować po całym kraju w celach zawodowych i wypoczynkowych. Przy odpowiednim planowaniu nowa sieć autostrad umożliwi również błyskawiczny przerzut wojsk na każdy odcinek granicy."
generic_chain_supply_network: "Sieć dostaw łańcuchowych"
generic_chain_supply_network_desc: "Skoro potrafimy już wysyłać żołnierzy gdzie tylko chcemy i tak szybko, jak chcemy, powinniśmy zapewnić im coś do jedzenia oraz coś, z czego mogą strzelać. Plan zakłada budowę lokalnych węzłów zaopatrzeniowych, które zwiększą samodzielność poszczególnych sektorów, a zarazem wykorzystają nowo uzyskaną łączność do stworzenia wzajemnej zależności. Powstanie mniej scentralizowany system, który nadal będzie w stanie wesprzeć obszary niespodziewanie poddane silnemu naciskowi wroga. Połączenie go z informacjami dostarczanymi w czasie rzeczywistym zapewni zabójczo skuteczną elastyczność. Dodatkową korzyścią może być sprawniejsze niesienie pomocy cywilom, gdyby jej potrzebowali."
generic_central_communication_port: "Centralny Port Komunikacyjny"
generic_central_communication_port_desc: "Włożyliśmy ogromny wysiłek w rozwój infrastruktury, lecz poszczególne gałęzie transportu nadal pozostają nieskoordynowane. Potrzebujemy lepszej współpracy strategicznej między nimi. Podróżujący samochodem powinni móc szybko przesiąść się do samolotu, pociągu lub statku, jeśli tylko jest to możliwe. Musi powstać jeden centralny węzeł koordynujący cały ruch. W tym celu wrócimy do koncepcji Centralnego Portu Komunikacyjnego, którego budowę rozpoczął przed Upadkiem rząd Prawa i Sprawiedliwości. Oczywiście nowy projekt zostanie dostosowany do obecnej sytuacji."
generic_rebuilding_the_railway_network: "Odbudowa sieci kolejowej"
generic_rebuilding_the_railway_network_desc: "Nadejście III Rzeczypospolitej wreszcie zniwelowało różnicę między zachodnią i wschodnią Polską pod względem gęstości sieci kolejowej. Niestety wyrównanie nastąpiło w dół, poprzez zamykanie kolejnych stacji. Dziś, wobec rosnącej potrzeby mobilności i reindustrializacji, musimy przywrócić pociągom należne miejsce w gospodarce. Liczby nie kłamią - to najbardziej wydajny i najtańszy środek transportu zarówno dla przemysłu, jak i obywateli, którzy bez samochodu nie mogą przemieszczać się z małych wsi do większych miast.\nTory są przyszłością!"
generic_high_speed_trains: "Kolej dużych prędkości"
generic_high_speed_trains_desc: "Mikole mogą zachwycać się wiekowymi pociągami, lecz nasze potrzeby wymagają czegoś bardziej funkcjonalnego. I szybszego. Kolei dużych prędkości zdecydowanie brakuje. Obecnie istnieją jedynie połączenia Zawiercie-Grodzisk Mazowiecki oraz Warszawa-Gdańsk. Nie wspominając o ich typowej prędkości w przewozach pasażerskich, ograniczonej do 200 km/h z powodu wcześniejszych braków infrastrukturalnych. Jak widać, czeka nas wiele pracy. Na szczęście zmodernizowaliśmy już sieć kolejową. Pozostaje tylko sprowadzić i samodzielnie zbudować odpowiednie modele, zapewniające szybki transport obywatelom oraz przemysłowi.\nTo naturalny kolejny etap reform, który jeszcze bardziej spotęguje zalety zwykłych pociągów."
generic_window_to_the_world: "Okno na świat"
generic_window_to_the_world_desc: "Wreszcie nadeszła pora na nieśmiałe spojrzenie za Odrę i Bug. Drogi i niebo nadal nie są bezpieczne, lecz możemy prowadzić w miarę stabilną wymianę dyplomatów oraz kupców. To pierwszy krok ku ustanowieniu trwałego kontaktu z państwami, które mogą zechcieć wesprzeć naszą sprawę albo po prostu zarobić na handlu z nami. Obywatele mają nawet możliwość wyjazdu na zagraniczne wakacje, by spróbować zapomnieć o trudach życia nad Wisłą. W najbliższej przyszłości jedynie nieliczni szczęśliwcy będą mogli służyć krajowi podczas zagranicznych misji. Gdy jednak zyskamy większą stabilność, wyjechać zdoła więcej osób."
generic_revival_of_tourism: "Odrodzenie turystyki"
generic_revival_of_tourism_desc: "Polska nigdy nie była głównym celem wakacyjnych wyjazdów. Upadek, jak zwykle, tylko pogorszył sytuację. Dzięki ożywionemu sektorowi transportowemu i odnowionej infrastrukturze możemy jednak obrócić osobliwe położenie na własną korzyść. Wieści o wojnie domowej w środkowoeuropejskim kraju przyciągnęły uwagę całego świata. Dotyczy to żądnych sensacji dziennikarzy, poszukiwaczy wrażeń oraz bojowych ochotników gotowych walczyć za naszą sprawę. Jednym słowem: turystów. Nadal nie staniemy się Mekką urlopowiczów, ale z pewnością istnieje nisza, którą możemy wypełnić. I na której możemy zarobić."
generic_attracting_foreign_investments: "Przyciąganie zagranicznych inwestycji"
generic_attracting_foreign_investments_desc: "Nerwami wojny są pieniądze, a nerwami odbudowy kraju - jeszcze większe pieniądze. Jeżeli nie chcemy uważać się za samowystarczalny świat, europejski Afganistan albo coś gorszego, będziemy potrzebowali światowych kapitalistów, którzy zasieją u nas globalne waluty i wzniosą przedsiębiorstwa. W latach dziewięćdziesiątych właśnie w ten sposób Polska osiągnęła dobrobyt gospodarczy - i ponownie będzie to droga naszej przyszłości."
generic_immense_service_sector: "Ogromny sektor usług"
generic_immense_service_sector_desc: "Niektórzy mogą szydzić z sektora usług, którego symbolem stały się biura tak oderwane od rzeczywistości i pozbawione jakiegokolwiek prawdziwego celu, że bardziej przypominają scenografię teledysku. Liczby jednak nie kłamią: usługi są kręgosłupem każdej nowoczesnej gospodarki. Kontrola jakości, obsługa klienta, usprawnianie oraz utrzymywanie handlu internetowego i płynnej logistyki - wszystko to spoczywa na barkach niedocenianych, pozbawionych pieśni trybików w białych kołnierzykach. Przeznaczenie środków na rozruch ich biur jest warunkiem koniecznym, by nasza gospodarka mogła kiedykolwiek konkurować ze światowymi mocarstwami."
generic_privileges_for_developers: "Przywileje dla developerów"
generic_privileges_for_developers_desc: "Czym innym jest zabudowa dziewiczego terenu od zera, a czym innym odbudowa albo usunięcie ruin. W chwili, gdy kraj bardziej niż kiedykolwiek potrzebuje odbudowy, stojący na jej czele - od robotników budowlanych po ich kapitanów, deweloperów nieruchomości - muszą otrzymać hojne wynagrodzenie za niezbędną pracę. Premie, zwolnienia podatkowe, a w razie potrzeby również gwarancja, że chodzenie na skróty nie będzie karane bardziej niż przekraczanie budżetu. W końcu nie mamy luksusu czasu. Naród jest zmęczony ciągłym podnoszeniem się z popiołów."
generic_unleash_economical_spirit_of_our_people: "Uwolnienie gospodarczego ducha narodu"
generic_unleash_economical_spirit_of_our_people_desc: "Od nędzy sowieckich rządów przez Upadek aż po dwudziestolecie międzywojenne: Polska zawsze osiągała gospodarczo więcej, niż wskazywałyby jej możliwości i stojące przed nią wyzwania. Gdy podstępni Niemcy zdusili nasz handel przez Gdańsk, mimo wszystko zbudowaliśmy obok całe nowe miasto. Po upadku komunizmu nasze odrodzenie przerosło dokonania sąsiadów o głowę. Nic więc dziwnego, że dziś gospodarka błyszczy ponad oczekiwania. Nasi ludzie są zahartowani, konkretni, zaskakująco zorganizowani, niezrównanie wydajni i przywykli do ogromnej presji oraz żałosnego zarządzania. Spuśćmy ich ze smyczy i patrzmy, jak czynią cuda."
generic_organisation_of_national_industry: "Organizacja przemysłu narodowego"
generic_organisation_of_national_industry_desc: "O komunizmie można powiedzieć wiele, ale zarówno Rosja Stalina, jak i Chiny Mao pokazują, że pod właściwym przywództwem naród niemający niczego może z powodzeniem wynieść przemysł i poziom życia na godny poziom. Centralne kierownictwo budujące państwowe zakłady to najszybszy sposób, by postawić potencjał przemysłowy na nogi. Dopóki wystarczy nam woli, kierunku i wiedzy do utrzymania jego wydajności, będzie służył nie gorzej niż rozwiązania wolnorynkowe."
generic_light_industry_resurgence: "Odrodzenie lekkiego przemysłu"
generic_light_industry_resurgence_desc: "Plan inwestycji w przyszłość jest obecnie realizowany z pełną mocą i najwyższym priorytetem.\nJednym z jego głównych celów pozostaje rozbudowa przemysłu lekkiego. Aby osiągnąć założenia, musimy natychmiast zlecić budowę czterech nowych fabryk cywilnych. Co więcej, nowoczesne technologie i patenty wykorzystane w projekcie pomogą nam w przyszłości wznosić kolejne zakłady znacznie wydajniej.\nWszystko to stanowi jedynie niewielkie obciążenie dla budżetu - a zarazem inwestycję w przyszłość!"
generic_goverment_housing_initiatives: "Rządowe inicjatywy mieszkalnicze"
generic_goverment_housing_initiatives_desc: "Współczesny świat z pewnością mierzy się z kilkoma poważnymi problemami globalnymi. Jednym z nich jest kryzys demograficzny, który nie ominął również ziem polskich.\nNie możemy jednak stać bezczynnie! Nadeszła pora, by uruchomić kosztowny, lecz od dawna potrzebny odgórny program budowy mieszkań dla obywateli.\nInicjatywa ma przede wszystkim pomóc młodym ludziom w zdobyciu własnego domu, co ułatwi im zakładanie rodzin i w rezultacie powinno zwiększyć przyrost demograficzny."
generic_guiding_the_economic_progress: "Kierowanie postępem gospodarczym"
generic_guiding_the_economic_progress_desc: "Nasi obywatele stanowią nasz wzrost.\nNie możemy jednak pozostawić ich samym sobie. Plan rządowy zakłada hojne wsparcie dla przedsiębiorców oraz pomoc w stawianiu pierwszych kroków w biznesie.\nObecnie przygotowujemy fundusze na dofinansowanie budowy ośmiu nowych fabryk cywilnych, w tym zakładów wojskowych. Nadeszła pora podzielić się z ambitnymi obywatelami naszym tak zwanym know-how oraz innowacjami technicznymi.\nProdukcja wystrzeli w górę! A wszystko to rękami naszych własnych obywateli!"
generic_green_earth_initiative: "Inicjatywa \"Zielona Ziemia\""
generic_green_earth_initiative_desc: "Świat nieustannie się zmienia, dlatego powinniśmy sięgać po nowe rozwiązania - takie, które nie doprowadzą planety do ekologicznej ruiny.\nWprowadźmy inicjatywę \"Zielona Ziemia\"!\nElektrownie wykorzystujące źródła odnawialne potrafią zaspokoić nasze potrzeby energetyczne lepiej niż cokolwiek wcześniej. Nie niszczą środowiska jak przestarzałe elektrownie węglowe ani nie są równie kosztowne co elektrownie jądrowe.\nPaństwa zachodnie z pewnością poprą inicjatywę, choć część obywateli zapewne nie..."
generic_stay_the_course: "Trzymać kurs"
generic_stay_the_course_desc: "Bezpieczeństwo energetyczne i dobrobyt są naszymi priorytetami. Właśnie dlatego w tak ważnej sprawie nie możemy ryzykować niepewnych rozwiązań.\nTrzymajmy się tradycyjnych źródeł energii!\nElektrownie węglowe jako sprawdzona metoda zapewnią nam stabilne dostawy prądu. Co więcej, zdobędziemy cenne doświadczenie w ich budowie, dzięki czemu wszystkie przyszłe obiekty powstaną w krótszym czasie.\nŹródła węglowe są stare? Za to my staniemy się specjalistami w ich wykorzystaniu!"
generic_atomic_future: "Atomowa przyszłość"
generic_atomic_future_desc: "Energia jest przyszłością państwa, a przyszłość oznacza innowacje. Nie możemy więc bezmyślnie trzymać się przestarzałych metod ani ufać niepewnym ekologicznym dziwactwom.\nCzas na energetykę jądrową!\nElektrownie atomowe są niezwykle wydajne i oczekujemy, że przyniosą znaczący wzrost produkcji energii - niemożliwy do osiągnięcia innymi metodami!\nCały plan zakłada poważne inwestycje w innowacje. Dzięki energii jądrowej popchniemy nasze badania ku prawdziwej nowoczesności!"
generic_rapid_digitalisation: "Szybka cyfryzacja"
generic_rapid_digitalisation_desc: "Zapaść, Upadek, ubóstwo dzieci, ubóstwo seniorów, bezrobocie - żadna z tych rzeczy nie usprawiedliwia zaniechania ponownego uruchomienia infrastruktury cyfrowej naszych ziem. Nie sposób przecenić korzyści, jakie przepływ informacji przynosi komunikacji, a przez nią wszystkiemu, czego dotyka życie. \"Serial Experiments Lain\" przedstawiało cyberprzestrzeń jako kolejną warstwę samego życia. My również widzimy w niej warstwę istnienia, która stanie się drogą na skróty z powrotem do grona państw rozwiniętych, i podejmiemy odpowiednio zdecydowane wysiłki, by tam dotrzeć."
generic_down_to_earth_economy: "Gospodarka praktyczna"
generic_down_to_earth_economy_desc: "Zwyczajnie nie mamy skali, zastosowania ani prawdziwej potrzeby prowadzenia wymyślnej polityki cyfryzacji. Z pewnością nie posiadamy też nadwyżki budżetowej, którą można by w nią zainwestować. Tam, gdzie korzyści technologii cyfrowych są zbyt wielkie, by je ignorować, naszym podstawowym rozwiązaniem będzie wyszabrowany dwudziestoletni sprzęt i Linux o najniższych dostępnych wymaganiach systemowych. Cała reszta ma być prosta, solidna i możliwa do naprawienia młotkiem, a nie telefonem do indyjskiego wsparcia technicznego."
generic_course_correction: "Korekta kursu"
generic_course_correction_desc: "Reżim stał się państwem - znalazł się o krok bliżej ponownego zjednoczenia. Oznacza to, że nasza gospodarka nie składa się już z jednego czy dwóch targowisk, lecz jest prawdziwą siecią milionów ludzi, wymagającą polityki pieniężnej prowadzonej na poziomie waluty, stóp procentowych i innych abstrakcji, a nie barteru, danin oraz okazjonalnej kontroli cen."
generic_advanced_science_department: "Wydział Nauk Zaawansowanych"
generic_advanced_science_department_desc: "Bez silnego sektora naukowego nie zdołamy dalej rozwijać gospodarki, ulepszać sprzętu wojskowego ani tworzyć nowych leków dla chorych i rannych. Musimy coś zrobić, inaczej pozostaniemy w tyle za sąsiadami. Nasze terytoria są dostatecznie rozległe, by zgromadzić wystarczającą liczbę wybitnych umysłów w Departamencie Zaawansowanej Nauki. Specjaliści w dziedzinie materiałoznawstwa, fizyki, chemii, medycyny, nauk przyrodniczych i inżynierii opracują tam nowe projekty oraz zbadają je ku pożytkowi nas wszystkich. Latarnia wiedzy pośród barbarzyństwa."
generic_establish_cybersecurity_division: "Utworzenie Dywizji Cyberbezpieczeństwa"
generic_establish_cybersecurity_division_desc: "Tak jak istnienie w warstwie fizycznej wymaga ochrony - strażników, broni i policji - tak cyberprzestrzeń potrzebuje zapór sieciowych oraz ludzi, którzy będą ich pilnować. Tam krzem jest naszą krwią, a rozum naszym mieczem. Nie ulega wątpliwości, że jeśli im pozwolimy, wrogowie wykorzystają cyberprzestrzeń do zakłócania i ujawniania naszych planów. Nasza Dywizja Cyberbezpieczeństwa stanie im na drodze."
generic_improve_digital_banking_system: "Usprawnienie cyfrowej bankowości"
generic_improve_digital_banking_system_desc: "Kierując się wyłącznie pragnieniem porządku, wydajności i wygody obywateli, zdecydowaliśmy się rzucić na głęboką wodę cyfrowej bankowości. Wymagania infrastrukturalne związane z zapewnieniem jej powszechnej dostępności w znacznej mierze pokrywają się z potrzebami każdego nowoczesnego państwa, a korzyści dla przejrzystości, bezpieczeństwa oraz wygody systemu bankowego z nawiązką wynagrodzą wysiłek."
generic_cashless_payments_supremacy: "Dominacja płatności bezgotówkowych"
generic_cashless_payments_supremacy_desc: "To, do czego stabilniejsze i bardziej rozwinięte państwa muszą zmierzać drobnymi krokami, my możemy wprowadzić jednym pociągnięciem: w pełni cyfrową bankowość. Dla starszych obywateli może być mniej wygodna, a niektórym przypominać aż nazbyt wiele Apokalipsy św. Jana, lecz bezgotówkowy system bankowy zamyka najważniejsze furtki wykorzystywane przez przestępców i osoby unikające podatków. Powszechność cyfrowego sposobu załatwiania spraw przygotuje nas na znacznie większy dobrobyt w przyszłości. Niektórzy powiedzieliby nawet, że takie podejście leży w naturze naszego narodu."
generic_remote_steered_country: "Zdalnie sterowane państwo"
generic_remote_steered_country_desc: "Mamy zaplecze infrastrukturalne pozwalające mimo wszystko przenieść do sieci każdy istotny element rządzenia. Gdy trzeba złożyć wniosek o ubezpieczenie, zamiast mierzyć się z odrażającymi procedurami rodem z ubiegłego stulecia i urzędnikami obdarzonymi charyzmą bossa z Dark Souls, można zrobić wszystko wygodnie przy komputerze. Z perspektywy urzędnika coraz więcej aspektów administracji podlega cyfryzacji: dane, które dawniej trzeba było mozolnie gromadzić i wyciągać z nich wnioski, dziś płynnie trafiają na biurko, a kurs da się korygować w locie. Upadek wypalił naszą Pychę właśnie w tym celu: aby szybciej i lepiej sprowadzić rządy następnego stulecia, wolne od ciężaru przeszłości."
generic_build_the_network_free_redundancy_systems: "Analogowe systemy redundancji"
generic_build_the_network_free_redundancy_systems_desc: "Oto doskonała strategia przeciw włamaniom przez Internet: nie podłączać się do Internetu. Nie posiadać nawet sprzętu, który można do niego podłączyć. Cyberbezpieczeństwo przestaje być potrzebne, gdy system jest zamkniętym intranetem. Na tej filozofii opierają się nasze odizolowane systemy zapasowe, zdolne zabarykadować się i utrzymać obiekt podczas każdego ataku. Żadnego połączenia z zewnątrz, żadnego hakowania bez wyrwania pulpitu sterowniczego z naszych zimnych, martwych dłoni. A czy wspomnieliśmy już o systemach nadmiarowych dla naszych systemów nadmiarowych?"
generic_financial_independence: "Finansowa niezależność"
generic_financial_independence_desc: "To szaleństwo, że jeden człowiek oddalony o tysiące kilometrów, który nawet nie zna naszej nazwy, może wywrócić system finansowy do góry nogami. Niektórzy powiedzą, że to \"optymalne dla wzrostu gospodarczego\", \"zapobiega stagnacji\" albo \"gwarantuje inwestycje\". Powinniśmy więc albo poprosić ludzi kierujących tymi instytucjami, by zapamiętali naszą nazwę, historię i polityczny rodowód, który reprezentujemy w Polsce po Upadku, albo maksymalnie ograniczyć wpływ owych instytucji na nasze finanse. Zgadnijcie, co jest bardziej prawdopodobne?"
generic_adherence_to_gold_parity: "Przestrzeganie parytetu złota"
generic_adherence_to_gold_parity_desc: "Złoto ratuje rasę!\nŁączy ciebie i mnie\nZłoto, symbol godności w tej inflacyjnej grze\nZłoto ratuje rasę!\nŁączy ciebie i mnie\nZłoto oczyszcza duszę, chroni austriacką krew! - Kelthuz"
generic_shielding_against_dangers_of_future: "Ochrona przed zagrożeniami przyszłości"
generic_shielding_against_dangers_of_future_desc: "Przez ostatnich kilka lat żyliśmy w niezwykle niestabilnym otoczeniu. Na szczęście właśnie dlatego przygotowaliśmy plan ochrony gospodarki na wypadek, gdyby w najbliższej przy- jak to nie mamy żadnego planu? Na co czekamy? Czy naprawdę musieliśmy najpierw wykonać całą masę losowego gówna, żeby w ogóle się za to zabrać?"
generic_central_bank: "Bank Centralny"
generic_central_bank_desc: "Ma go każda nowoczesna gospodarka. Bank centralny dba o wartość naszej waluty, bezpieczeństwo papierów wartościowych i o to, by pożyczki nie były wstępem do bankructwa. Wraz z pojawieniem się właściwie zarządzanego banku centralnego bóle dorastania z dnia na dzień ustąpią miejsca zaufaniu konsumentów oraz inwestorów."
generic_cut_the_spending_to_minimum: "Ogranicz wydatki do minimum"
generic_cut_the_spending_to_minimum_desc: "W obliczu deficytu mocarstwa zbyt wielkie, by upaść, mogą zrobić bardzo wiele - głównie rozwadniać i restrukturyzować dług albo zwyczajnie psuć walutę. My nie jesteśmy mocarstwem. Nie stoimy za sterem wszechpotężnego dolara, który pozwala obsługiwać nieskończony dług zaciągnięty u samych siebie. Naszym losem i obowiązkiem jest zdrowa, zrównoważona i porządna gospodarka - oraz odzwierciedlający ją budżet. Musimy więc wydawać wyłącznie tyle, ile naprawdę trzeba. Koniec podejrzanych programów NGO i wydawania 70 milionów złotych na szczepionki. CO TO ZA SZCZEPIONKI, LECZĄ RAKA CZY GO POWODUJĄ?!"
generic_currency_shock_therapy: "Walutowa terapia szokowa"
generic_currency_shock_therapy_desc: "Pamiętacie Balcerowicza? Javiera Mileia? Ci ludzie rozumieli jedno: kiedy gospodarka leży w gruzach, jedynym sposobem naprawy jest szybkie zerwanie plastra. Hiperinflacja, załamanie waluty, masowe bezrobocie, niepokoje społeczne - wszystko to skutki problemów strukturalnych, którym musimy stawić czoła już teraz. Zakazać bankowi centralnemu finansowania deficytu, wprawić eksport w furię i patrzeć, jak inflacja leci na łeb. Wkrótce cały naród znów wyjdzie na plus."
generic_opening_financial_markets: "Otwarcie rynków finansowych"
generic_opening_financial_markets_desc: "Nasza waluta została zracjonalizowana. Zatrudnienie jest produktywne. Jesteśmy gotowi. Otwarcie rynków finansowych na krajowe i zagraniczne inwestycje oraz handel usunie ostatnie nieefektywności i niedostosowania systemu, bezzwłocznie pobudzając aktywność gospodarczą. Dzięki stabilnym partnerom i doskonałym umowom gospodarka rozkwitnie jak nigdy dotąd. Liczba miejsc pracy i wysokość płac wzrosną nie wskutek polityki państwa, lecz jako bezpośrednia konsekwencja naszej rentowności oraz popytu na nasze towary."
generic_price_control: "Kontrola cen"
generic_price_control_desc: "Nic złego nigdy nie spotkało Polski z powodu kontroli cen. Nigdy, przenigdy. To właśnie kontrola cen odpowiadała za wszystkie nasze osiągnięcia minionego stulecia. Ludzie doskonale to rozumieją, więc nie ryzykujemy niczyjego gniewu, biorąc na siebie odpowiedzialność za niedobory rynkowe, arbitralne podwyżki i tym podobne. To błogosławieństwo, którym tylko my, tu na ziemi nad Wisłą, możemy się cieszyć."
generic_monetary_stabilization_plan: "Plan stablizacji monetarnej"
generic_monetary_stabilization_plan_desc: "To, co teraz zrobimy, będzie w przenośni polegało na wpompowaniu do systemu pieniężnego tylu pieniędzy, ile potrzeba do walki z inflacją. Według najnowszych badań ludzie bardzo słabo radzą sobie z liczeniem wydatków, kiedy występuje w nich zbyt wiele zer. Oczywiście pewna inflacja będzie zawsze, ale przynajmniej nie wyrośnie z niej potwór mordujący walutę, taki jak hiperinflacja."
generic_nationalize_the_banks: "Nacjonalizacja banków"
generic_nationalize_the_banks_desc: "Dla kluczowych instytucji finansowych naszego kraju zdecydowanie najlepiej będzie, jeśli przejmiemy nad nimi pełną kontrolę. Dlaczego mielibyśmy tego nie zrobić? Po wszystkim, czego dotąd dokonaliśmy, chyba dowiedliśmy, że nic nie dorównuje silnej, prowadzącej dłoni państwa. Kolejnym logicznym krokiem byłaby pełna gospodarka planowa, ale szczerze mówiąc, samodzielne zarządzanie aż tyloma fabrykami musi być trochę nudne."
generic_our_economy_is_back_on_the_world_stage: "Nasza gospodarka wraca na scenę światową!"
generic_our_economy_is_back_on_the_world_stage_desc: "Po serii przełomowych reform wreszcie udało nam się ożywić gospodarkę. W krótkim czasie przeszliśmy drogę od społeczności zbieraczy żerujących na padlinie starego świata do szanowanej gospodarki godnej europejskiego państwa naszej wielkości. Zagraniczni komentatorzy patrzą z podziwem na sukces, obca klasa polityczna zielenieje z zazdrości, a inwestorzy z całego regionu przybywają zawierać z nami umowy. W miarę bogacenia się tak spektakularny wzrost będzie coraz trudniejszy, lecz nie powstrzyma nas to przed dalszym rozwojem."
generic_state_of_the_art_laboratories: "Najnowocześniejsze laboratoria"
generic_state_of_the_art_laboratories_desc: "Zgromadzeni naukowcy już omawiają możliwe eksperymenty i z zapałem zapisują pomysły - niestety głównie do archiwum. Choć są sumienni i ambitni, brakuje im miejsca, w którym mogliby sprawdzić swoje koncepcje. Musimy zapewnić im najlepsze możliwe laboratoria. Tam ustalą, które idee staną się początkiem wielkich projektów przyszłości rewolucjonizujących nasze życie, a które okażą się ślepymi uliczkami. Prawdę mówiąc, większość będzie ślepymi uliczkami i minie sporo czasu, zanim jajogłowi znajdą diament pośród węgla."
generic_improve_our_higher_education_system: "Lepszy system szkolnictwa wyższego"
generic_improve_our_higher_education_system_desc: "Choć naukowcy sprzed Upadku mogą być niezwykle użyteczni, nie możemy polegać wyłącznie na nich. Jest ich zdecydowanie za mało, a z upływem czasu będzie jeszcze mniej. Potrzebujemy rozwiązania długoterminowego. Na szczęście nie brakuje potencjalnych studentów spragnionych wiedzy. Nadeszła pora właściwie przywrócić funkcjonowanie uniwersytetów - albo zbudować nowe, jeśli żadnych nie posiadamy. Zaczynanie od zera pozwoli przebudować szkolnictwo wyższe według własnego uznania, aby działało jeszcze skuteczniej niż przed Upadkiem."
generic_new_generation_of_scientists: "Nowe pokolenie naukowców"
generic_new_generation_of_scientists_desc: "Dzięki heroicznym wysiłkom młodzi, świeżo wykształceni naukowcy tłumnie przybywają do naszych ośrodków badawczych. Wkrótce zdominują wszystkie dziedziny nauki i zastąpią starą gwardię. Powstanie zupełnie nowa akademia, obdarzona świeżym spojrzeniem - i poglądami zgodnymi z naszą ideologią. Młodzieńczy zapał oraz pomysły przepełniają ich po brzegi, a oni gorliwie pragną pracować dla naszej sprawy. Spoglądają na nowy wspaniały świat, który pomogą nam stworzyć, powołując do życia cuda nauki. Dzięki nim nasze państwo stanie się regionalnym liderem badań."
generic_prepared_for_the_future: "Gotowi na przyszłość"
generic_prepared_for_the_future_desc: "Przyszłość należy do nas - możemy ją poznać i ukształtować. Eksperci od analiz wojskowych oraz politolodzy rozpoznają trendy wewnątrz i poza granicami, pozwalając nam się przystosować oraz planować z wyprzedzeniem. Socjolodzy wiedzą, jak na te tendencje wpływać. Nowe projekty uzbrojenia i przedsięwzięcia inżynieryjne pomogą nam określić kształt otaczającego świata. Lekarze już wdrażają odkrycia medyczne, by przedłużać życie i poprawiać dobrobyt ludności. Nowa fala urbanistyki prowadzi ku optymalnym formom osadnictwa. Musimy teraz skonkretyzować wysiłki i nadać im kierunek, wybierając doktrynę badawczą."
generic_science_in_the_service_of_peace: "Nauka w służbie pokoju"
generic_science_in_the_service_of_peace_desc: "Cyceron mówił: \"Pieniądz jest nerwem wojny\". Albert Einstein stwierdził, że czwarta wojna światowa będzie toczona kijami i kamieniami. Zarówno z niechęci do dalszej wojny, jak i w ramach przygotowań do niej, musimy zatem skierować naukę ku pokojowym, produktywnym przedsięwzięciom. Tworzeniu, nie niszczeniu. Pokojowi, nie chaosowi. Jeśli przyjdzie najgorsze, po prostu wydamy więcej niż każdy wróg."
generic_universal_truths_of_modern_science: "Uniwersalne prawdy współczesnej nauki"
generic_universal_truths_of_modern_science_desc: "Jeśli Cyceron mówił, że \"pieniądz jest nerwem wojny\", my odpowiadamy, że jej nerwem są narzędzia, którymi się ją prowadzi. Historia, zarówno najnowsza, jak i dawniejsza, uczy nas, że nauki teoretyczne i cywilne są miłe i ciekawe, lecz uniwersalną prawdą świata oraz nauki jest przemoc. Skierujemy więc umysły ku pomnażaniu naszej siły i krzepy, tworząc broń do ochrony świeżo zdobytego dobrobytu. W ten sposób uznamy swoje miejsce w naturze jako zarazem drapieżnik i ofiara, a o pokój upomnimy się siłą."
generic_unorthodox_science: "Niekonwencjonalne metody naukowe"
generic_unorthodox_science_desc: "U podstaw odkryć naukowych leżą śmiałe idee, których niewielu odważa się choćby rozważyć. Odmieńcy, ekscentrycy i niezrozumiani geniusze są pionierami innowacji, które ostatecznie stają się niepodważalnymi fundamentami świata. Właśnie w tym kierunku poprowadzimy naszą naukę, ku najczystszemu ideałowi myślenia poza schematami. Maria Skłodowska-Curie położyła fundamenty radiologii, zatruwając się świecącymi kamieniami. My zrobimy rzeczy jeszcze głupsze w pogoni za jeszcze mądrzejszymi celami."
generic_battling_for_the_fate_of_a_nation: "Bitwa o los narodu"
generic_battling_for_the_fate_of_a_nation_desc: "Im bardziej się rozrastamy, tym trudniej jest nam nadążyć za zmianami społecznymi. Każdy jeden powiat nosi w sobie brzemię różnego szaleństwa watażków. Ci już są dawno podbici, lecz udało im się odcisnąć swoje piętno na ludziach i teraz to my musimy sobie radzić z problemami które z tego wynikają. Niektórzy będą się nam przeciwstawiać, z innymi się dogadami, a jeszcze niektórzy będą gotowi przeprowadzić rewolucję od wewnątrz. Musimy być gotowi do działania."
generic_legitimisation: "Legitymizacja"
generic_legitimisation_desc: "Jeśli chcemy mieć jakąś przyszłość, musimy zadbać o to by wszyscy wiedzieli kto rzadzi nad Wisłą i Odrą. By nazwa \"[ROOT.GetCountryName]\" budziła od razu skojarzenia z krajem który teraz leży w tym miejscu i jest prawowitym dziedzicem i spadkobiercą Polski przedupadkowej. No i po to by nikt już nie miał wątpliwości że to nam należy się władza i era watażków dobiegła końca raz na zawsze."
generic_set_up_ministry_of_foreign_affairs: "Utworzenie Ministerstwa Spraw Zagranicznych"
generic_set_up_ministry_of_foreign_affairs_desc: "Do tej pory zagranica to było wszystko co znajdowało się poza naszą wsią. Na szczęście wyszliśmy już z tej epoki zarodkowej i narodziliśmy się jako prawdziwy kraj. Na nieszczęście - to oznacza że będziemy musieli po raz kolejny uruchomić dyplomację. Jakimś cudem, dyplomaci wywodzący się z tych ziem mają tendencję do tracenia zdrowego rozsądku tak szybko jak tylko otrzymują pozycję ministra spraw zagranicznych. I albo skazują ten kraj na upadek, albo prowadzą rozmowy dyplomatycznie z nieistniejącymi krajami. Albo po prostu nie robią absolutnie nic."
generic_yearning_for_recognition: "Szukając uznania"
generic_yearning_for_recognition_desc: "W świecie niekończących się konfliktów, nieporozumień i zniszczenia siejącego nienawiść oraz raniącego tradycję tolerancji musimy szukać sojuszników.\nJednym z największych i najbliższych bloków państw jest UE. W tak niepewnych czasach nawiązanie stosunków z równie wpływową światową potęgą wydaje się rozsądne. Oczywiście UE nie jest monolitem - składa się z wielu państw; jedne nas popierają, inne potępiają. Jeśli chcemy uzyskać uznanie dla naszego rządu, dotychczasowa dyplomacja zostanie dokładnie oceniona. A może mamy na myśli kogoś innego... skoro to właśnie przez UE te ziemie upadły tak nisko."
generic_appeal_to_the_un: "Apel do ONZ"
generic_appeal_to_the_un_desc: "Żeby osiągnąć to co zamierzamy, musimy zwrócić się do największej organizacji jaka istnieje na tej planecie. Albo jak według niektórych - błękitnego szatana odpowiedzialnego za wszystko co w świecie nie tak. Niezależnie od naszego podejścia - droga do legitymizacji wiedzie przez korytarze budynków ONZ. Musimy pokazać się z jak najlepszej strony, gdyż każde uchybienia i radykalizmy będą działały na naszą niekorzyść."
generic_true_goverment_of_polish_territories: "Prawdziwy rząd polskich terytoriów"
generic_true_goverment_of_polish_territories_desc: "Obecna rzeczywistość to czas, w którym obce mocarstwa będą decydować o uznaniu naszej tożsamości. Cóż, trudne czasy wymagają trudnych decyzji...\nMimo wszystko formalne poparcie ONZ mogłoby rzeczywiście umocnić prawowitość naszego państwa i rządu, stanowiąc potężną kartę przetargową.\nZ drugiej strony poradzimy sobie również bez ich błogosławieństwa. Przy zręcznej polityce odrzucenie ONZ można przekuć w mit \"oblężonej twierdzy\", która pośród wrogów nie przetrwa bez silnej armii oraz silnej władzy."
generic_depression: "Stagnacja"
generic_depression_desc: "Na przestrzeni stuleci naród polski przeszedł przez liczne doświadczenia i wydarzenia historyczne, które ukształtowały jego kulturę.\nPojęcie \"Rzeczypospolitej\" jest polskim dziedzictwem, które głęboko zakorzeniło przywiązanie do demokracji.\nLata represji związanych z walką o niepodległość i tożsamość narodową tworzą wspólną pamięć prześladowań mniejszości wewnątrz większego państwa.\nOdrzućmy przemoc i przyjmijmy pluralizm. Historia powinna nauczyć nas, że terror nigdy nie jest usprawiedliwiony ani skuteczny."
generic_evolution_or_revolution: "Ewolucja albo rewolucja"
generic_evolution_or_revolution_desc: "Systemy reformują się albo upadają. To lekcja stara jak świat, ale tak naprawdę najlepiej będzie jeśli weźmiemy lud na przeczekanie. Oczywiście, rozpoczniemy rozmowy, napiszemy kilka szczegółowych plan reform, które albo wejdą w życie w okrojonym stanie albo utkną gdzieś w trybunałach i komisjach. Najważniejsze jednak będzie staranne dopieszczanie naszego wizerunku jako reformatorów i promowanie zmian. Bo wiele się musi zmienić żeby nie zmieniło się nic."
generic_shunning_our_voice: "Uciszanie naszego głosu"
generic_shunning_our_voice_desc: "Cena władzy jest prosta: ludzie będą sceptycznie patrzeć na nasz marsz naprzód i głośno wyrażać niezadowolenie. Kije i kamienie połamią nam kości, ale jeśli pozwolimy słownie odrzucać naszą narrację, same słowa nigdy nas nie zranią, a połowa dysydentów wyładuje frustrację i w końcu się uspokoi. Da nam to bezcenny czas, by pokazać ludziom swoją dobrą stronę. Pokora stanie się naszą siłą."
generic_cost_of_freedom: "Koszt wolności"
generic_cost_of_freedom_desc: "Otrzymujemy dokładnie to, na co zasłużyliśmy. Jak się okazuje, swobody, które zapewniliśmy sobie i innym, oraz towarzyszący im pluralizm mają naprawdę wysoką cenę. Możemy zrobić tylko tyle, by utrzymać pokój, przebudować infrastrukturę według własnej wizji czy choćby decydować o swoim losie. Zamiast tego uznajemy, że wszyscy jesteśmy obywatelami tej ziemi i każdy zasługuje, by go wysłuchano. Musimy więc zmagać się z tymi, którzy nie nabrali jeszcze wobec nas dobrej wiary. W głębi duszy Polska zawsze była narodem idealistów, a nasz idealizm uczyni nas godnymi jej zjednoczenia."
generic_suppression: "Likwidacja"
generic_suppression_desc: "Nasza robota jest prosta: obsadzić garnizony, uprzedzić działania zwykłych podejrzanych, rozbić aktywistów pokonanych poprzedników. Strzec się najazdów dysydentów, a gdy masowe protesty eskalują, potraktować je policją i gazem łzawiącym. Tylko jeśli eskalują. Nie walczymy z wrogiem, lecz zaprowadzamy pokój: tych, którzy nie traktują oporu poważnie, skierujemy ku posłuszeństwu, a resztę zmiażdżymy poza zasięgiem wzroku i pamięci pozostałych."
generic_boiling_cauldron: "Wrzący kocioł"
generic_boiling_cauldron_desc: "Jak ugotować żywą żabę? Powoli, tak by nie zauważyła zmiany. Podobnie nasze przejście od niepozornych garnizonów do pełnej integracji i okupacji musi przebiegać stopniowo oraz stabilnie. Autonomiczne rady, kluby polityczne - wszystkie zostaną zamknięte... ostatecznie. Niewielu powstanie przeciwko nam, jeśli będziemy odbierać autonomię i głosy sprzeciwu jeden po drugim, bardzo powoli. Nową normą stanie się przekonanie, że dysydenci zawsze będą mieli jeszcze jedno okno, przez które mogą się nam przeciwstawić - dopóki wszystkie nie zostaną zamknięte."
generic_hostile_rhetorics: "Wroga retoryka"
generic_hostile_rhetorics_desc: "Każde społeczeństwo potrzebuje wspólnego wroga by pozostać jednością. A tak się składa że jeśli wróg zewnętrzny już nie działa to trzeba sięgnąć do wewnątrz. Szpiedzy, wywrotowcy, terroryści. Mamy ten przywilej, że znajdujemy się w wyjątkowym stanie, a co za tym idzie - każdego niewygodnego możemy podciągnąć pod działalność wywrotową. A potem rozpocząć kampanię zwracania jednej grupy społecznej przeciwko drugiej. Divide et impera w wydaniu propagandowym. Nigdy nie zawodzi."
generic_smile_everything_is_fine: "Uśmiechnijcie się, brygada!"
generic_smile_everything_is_fine_desc: "Pod żadnym pozorem nie możemy się przyznać że mamy jakiekolwiek problemy. Jeśli nawet przyłapią nas na jakiejś działalności opresyjnej to wszyscy razem zaprzeczamy i wmawiamy że nic się nie dzieje, taki tu spokój. Życie toczy się tak jak zawsze, społeczeństwo jest zadowolone z naszej przewodniej roli i z uśmiechem kroczy przez życie. Kurwa, jest w pytę!"
generic_the_home_stretch: "Ostatnia prosta"
generic_the_home_stretch_desc: "Znajdujemy się na ostatnim zakręcie drogi do unifikacji. Ostatni wysiłek, ostatnia prosta - jeszcze tylko troszkę zacisnąć pasa i będziemy mogli odetchnąć z ulgą. Wróg zaraz zostanie pokonany i będziemy mogli wrócić do tego co było kiedyś. Jeszcze tylko jedna trzydniowa operacja wojskowa, jeszcze tylko momencik. Teraz już naprawdę niedaleko!"
generic_oppression: "Dyskryminacja"
generic_oppression_desc: "Obecna władza nie zdołała jeszcze w pełni skonsolidować swoich rządów. Komórki opozycji, wrogie organizacje i inne wywrotowe elementy pozostają aktywne. Podjęto decyzję o natychmiastowej pacyfikacji...\nNależy zastosować wszelkie niezbędne środki do usunięcia przeciwników politycznych. Fundamentem działań powinna być policja polityczna - musimy stworzyć własnych \"opryczników\", niczym nieskrępowanych państwowych siepaczy. Strach stanie się skuteczną bronią zarówno przeciw potencjalnym dysydentom, jak i aktywnej opozycji. Cały aparat państwowy - od sądów po cywilnych informatorów - zostanie podporządkowany walce z wrogami państwa.\nTo wyjątkowo brudna robota; jeśli chcemy porządku, musimy zdjąć rękawiczki..."
generic_terrorism_on_the_rise: "Odrodzenie terroryzmu"
generic_terrorism_on_the_rise_desc: "Otwarte wypowiedzenie wojny przeciwnikom obecnego rządu wywołało silny opór wewnątrz państwa. Powstają milicje i organizacje terrorystyczne. Ataki na urzędników zdarzają się coraz częściej. Uzbrojeni demonstranci prowokują starcia z policją. Destabilizacja staje się coraz wyraźniejsza i nikt nie może czuć się bezpieczny.\nNa razie widać jedynie chaos podjętych decyzji, które przyniosły głównie cierpienie...\n A jednak to sprytna farsa. Pozorny kryzys stanowi najlepszą pożywkę dla konsolidacji władzy..."
generic_we_are_the_law: "To my stanowimy prawo"
generic_we_are_the_law_desc: "Wszystko idzie zgodnie z planem... choć nikt nie zakładał, że pójdzie gładko...\nW nieustającej atmosferze chaosu i terroru ze strony zarówno państwa, jak i opozycji zwykli mieszkańcy szukają oparcia. Potrzebują kogoś, kto zapewni im spokój i przywróci stabilność - gdy zagrożone są podstawowe potrzeby bezpieczeństwa, ludzie porzucają wzniosłe przywileje...\nTo MY zaprowadzimy porządek! Wszyscy muszą zrozumieć, że tylko My stanowimy prawo, ponieważ to my jesteśmy prawem!"
generic_temporary_martial_law: "\"Tymczasowy\" stan wojenny"
generic_temporary_martial_law_desc: "\"Atmosfera niekończących się konfliktów, nieporozumień, nienawiści - sieje spustoszenie psychiczne, kaleczy tradycje tolerancji. Strajki, gotowość strajkowa, akcje protestacyjne stały się normą. (...) Ogłaszam, że w dniu dzisiejszym (..) Rada Państwa, w zgodzie z postanowieniami Konstytucji, wprowadziła dziś o północy stan wojenny na obszarze całego kraju.\".\nOficjalnie stan wojenny ma potrwać tylko do czasu ustabilizowania sytuacji wewnętrznej.\nNadchodzi krwawa jatka, i to z udziałem wojska... Trudno przewidzieć reakcję społeczeństwa, ale skoro dysponujemy armią, kto by się tym przejmował?"
generic_supervision: "Nadzór"
generic_supervision_desc: "Możemy obalić fałszywych bożków i wykorzenić szkodliwe ideologie, lecz to nie wszystko. Pozbawienie ludzi ideałów pozostawia próżnię w sercach i umysłach. Próżnię rodzącą apatię oraz cynizm albo otwierającą podatnych na kolejne fałszywe idee - a wszystko to sabotowałoby nasze wysiłki państwotwórcze. Musimy temu przeciwdziałać. Trzeba dać ludziom nowe ideały, do których będą dążyć, i co ważniejsze, dopilnować, by wierzyli w naszą sprawę, podzielali wartości oraz obchodzili nasze święta. Utrzymanie spójności społecznej wymaga czegoś więcej niż jednej pompatycznej deklaracji nowego porządku i obalenia starych pomników."
generic_construct_new_goverment_building_complex: "Nowy kompleks budynków rządowych"
generic_construct_new_goverment_building_complex_desc: "Z biegiem czasu nie możemy dalej rządzić z zaadaptowanego budynku samorządu albo wojskowego namiotu. Potrzebujemy dużego, rozpoznawalnego gmachu centralnych władz, w którym najważniejsi urzędnicy polityczni zbiorą się na obrady. Nowa budowla musi robić wrażenie, a jej projekt odzwierciedlać źródła naszej ideologii. Znacznie zwiększy to prawowitość rządu w oczach obywateli i zagranicznych przedstawicieli. Jeden centralny organ ułatwi też stanowienie prawa, gromadząc rozproszonych polityków w jednym miejscu. Przyznając prawowitym władzom siedzibę w kompleksie, wyraźnie odróżni je od uzurpatorów."
generic_reconstruct_sejm_and_senate_complex: "Odbudowa kompleksu Sejmu i Senatu"
generic_reconstruct_sejm_and_senate_complex_desc: "Z biegiem czasu nie możemy dalej rządzić z zaadaptowanego budynku samorządu albo wojskowego namiotu. Potrzebujemy dużego, rozpoznawalnego gmachu centralnych władz, w którym najważniejsi urzędnicy polityczni zbiorą się na obrady. Na szczęście kontrolujemy doskonale nadający się do użytku kompleks Sejmu i Senatu, który wystarczy odnowić. Możemy nawet zmienić jego wygląd, by lepiej odzwierciedlał korzenie naszej ideologii. Przywrócenie dawnej siedziby polskiego rządu znacznie zwiększy jego prawowitość w oczach obywateli oraz zagranicznych przedstawicieli. Ten centralny organ ułatwi także stanowienie prawa, gromadząc rozproszonych polityków w jednym miejscu. Przyznanie prawowitym władzom miejsc w Sejmie lub Senacie wyraźnie odróżni je od uzurpatorów."
generic_initiate_civilian_awereness_program: "Programy podnoszenia świadomości obywatelskiej"
generic_initiate_civilian_awereness_program_desc: "Nie zdołamy sami utrzymać porządku. Siły pokojowe oraz służby specjalne doskonale radzą sobie z wykorzenianiem niebezpiecznych dysydentów, ale tak nieliczni ludzie mogą zrobić tylko tyle. Musimy zachęcić cywilów do pomocy. Wydrukujemy nowe plakaty propagandowe i rozpoczniemy kampanię w telewizji oraz Internecie, nakłaniając ludzi do zostania nieoficjalnymi współpracownikami, odpowiednio wynagradzanymi za informacje o demonstrantach i spiskowcach. Wszystko oczywiście dla dobra bezpieczeństwa publicznego. Opiszemy również zachowania świadczące o podejrzanej działalności oraz zwroty będące ukrytymi sygnałami terrorystów, aby ludność stale miała się na baczności."
generic_our_vision_of_society: "Nasza wizja społeczeństwa"
generic_our_vision_of_society_desc: "Nasze wysiłki już przynoszą owoce. Ludzie wiedzą, jakimi cnotami muszą się kierować, aby awansować w stworzonym przez nas społeczeństwie. Państwo jest młode i potrzeba czasu, by te wskazania zakorzeniły się w duszach. Najlepiej przystosowani członkowie społeczeństwa już jednak przyjęli nowy porządek i stali się latarnią sukcesu oraz spełnienia dla nieprzekonanych i zwiedzionych. Dowodzą, że mamy rację, a droga do dobrobytu jest prosta i łatwo dostępna. Trzeba tylko grać według naszych zasad. Z czasem coraz więcej osób podzieli nasze ideały, aż wrosną one w psychikę każdego człowieka."
generic_eight_wonder_of_the_world: "Ósmy cud świata"
generic_eight_wonder_of_the_world_desc: "Mamy już kilka wspaniałych budynków publicznych, takich jak kompleks rządowy, które służą za pomniki naszej ideologii, lecz nie możemy na tym poprzestać. Potrzebujemy czegoś okazalszego, o większej wartości artystycznej. Czegoś, co w pełni zawrze wszystko, o co walczymy i co pragniemy urzeczywistnić. Budowla odbierze dech każdemu, kto ją ujrzy, górując nad stolicą i wysyłając światu sygnał, że nadchodzimy. Jej wzniesienie potrwa, ale będzie warte wysiłku. Kunszt naszych artystów oraz rzemieślników rozbłyśnie przed całym światem."
generic_to_beat_the_heat: "Zdążyć przed czasem"
generic_to_beat_the_heat_desc: "Każdy dzień w którym ten kraj nie jest zjednoczony jest dniem straconym dla tego społeczeństwa w wyścigu o przyszłość. Już i tak zostaliśmy cofnięci w rozwoju o dekady a spustoszenie wywołane Upadkiem będziemy odczuwać przez dekady. Dlatego nie możemy stracić już ani chwili, bo każdy przestój to kolejne lata odbudowy. A ludzie mają już dość wojny...i zaniedługo będą nas z tego rozliczać."
generic_dawn_of_new_era: "Świt nowej ery"
generic_dawn_of_new_era_desc: "To koniec. Naprawdę koniec. Jakimś sposobem dokonaliśmy tego. Cały kraj należy do nas. Z początku wydawało się to niemożliwe, gdy byliśmy jedynie malutkim, dysfunkcyjnym państewkiem, lecz dzięki geniuszowi przywódców, bohaterstwu żołnierzy i wytrwałości obywateli zdołaliśmy zjednoczyć całą Polskę. Dotąd żyliśmy w cichym cieniu tego, czym niegdyś był ten naród. Teraz możemy swobodnie ukształtować go zgodnie z własną wizją i nie pozostał już nikt, kto zdoła nas powstrzymać. Ten dzień wyznacza świt nowej ery. Naszej ery."
generic_establish_new_holiday: "Ustanowienie nowych świąt państwowych"
generic_establish_new_holiday_desc: "Tak wielkiego zwycięstwa jak nasze nie wolno nigdy zapomnieć. Zasługuje na wieczne upamiętnienie wraz z bohaterami, którzy je umożliwili. Nowe święto państwowe przypadnie w rocznicę zjednoczenia i będzie obchodzone z całą należną pompą, przypominając naszą drogę, zmagania, pokonanych wrogów oraz ostateczny triumf wbrew wszystkim przeciwnościom. Nie będziemy oszczędzać. Cały kraj otrzyma dzień wolny, by uczestniczyć w tym chwalebnym wydarzeniu - dzieci poznają znaczenie naszych wartości, dorośli podzielą się wojennymi opowieściami, a starcy powspominają minioną epokę sprzed Upadku."
generic_the_final_reform: "Ostatnia reforma"
generic_the_final_reform_desc: "Zjednoczenie całego kraju pozwoliło skonsolidować aparat administracyjny. Możemy teraz jednym pociągnięciem pióra wprowadzać szeroko zakrojone reformy. Nigdy nie było lepszego momentu na narzucenie całej ludności naszego programu ideologicznego. Ministrowie przygotowali zbiór ustaw należycie odzwierciedlających wieloletnie ambicje. Nadanie im mocy prawa jest tylko formalnością - jeszcze przed oficjalnym ogłoszeniem ludzie zrobili wszystko, co w ich mocy, by dostosować się do nadchodzących przepisów. Nie ma sensu dłużej kazać im czekać."
generic_world_beyond: "Cześć, świecie!"
generic_world_beyond_desc: "Jesteśmy gotowi zająć miejsce na światowej scenie. Skoro ziemie Polski należą już do nas, nie możemy nadal żyć w strachu jak zwykli watażkowie. Jesteśmy dumnym państwem gotowym rozmawiać z innymi jak równy z równym. Przez lata sąsiedzi z ciekawością obserwowali rozwój sytuacji nad Wisłą. Jedni po cichu nas wspierali, drudzy chcieli, byśmy pokonali stronę uznawaną przez nich za większe zło, a jeszcze inni najchętniej nie mieliby z nami nic wspólnego, gdyby istniała jakakolwiek alternatywa. Ale jej nie ma. Staliśmy się zamożnym partnerem w regionie i nie ma już innych pretendentów, którzy mogliby to podważyć. Okoliczne państwa wkrótce to zrozumieją i zaproszą nas do swoich sojuszy politycznych oraz gospodarczych."
generic_the_spring_to_come: "Przedwiośnie"
generic_the_spring_to_come_desc: "Zimowe wichry wiały zdecydowanie zbyt długo, ale wytrwaliśmy. Prędzej czy później nadejdzie wiosna, a wraz z nią spełnią się nasze marzenia! Już podjęliśmy ogromne wysiłki, by zaszczepić wśród ludności własne ideały. Zdążyły zapuścić korzenie. Za jedno pokolenie osiągniemy hegemonię kulturową; nasze wartości na zawsze przenikną do serc i umysłów ludzi. Rozpoczniemy budowę wspaniałych gmachów, jeszcze okazalszych od dotychczasowych - nie tylko dlatego, że nasze dochody rozciągają się już od Odry po Bug. System polityczny zapewni wieczną stabilność, a armia stanie się niezłomna i zdyscyplinowana, by tragedia podobna do Upadku nigdy więcej się nie powtórzyła."
generic_war_to_end_all_wars: "Wojna, która zakończy wszystkie wojny"
generic_war_to_end_all_wars_desc: "Nasze pierwsze bitwy i zwycięstwa były niczym w porównaniu z tym, co nadchodzi. Wzrosną skala, intensywność i brutalność walk. Musimy przygotować się na nowy etap naszego wzlotu, rozbudowując wszystkie elementy sił zbrojnych - naczelne dowództwo, wyposażenie i znacznie więcej."
generic_reshaping_our_infantry: "Przekształcanie naszej piechoty"
generic_reshaping_our_infantry_desc: "Jeśli artyleria jest królową pola bitwy, czołg jego królem, a dron rewolucjonistą, piechota pozostaje sercem. Bez piechurów nie da się osiągnąć niczego. Cała reszta w taki czy inny sposób obraca się wokół nich. To, czy skupimy się na maksymalnym wykorzystaniu każdego żołnierza, czy na wystawianiu mas, określi nasze przyszłe możliwości i wyzwania."
generic_army_based_on_mass: "Wojsko oparte o ilość"
generic_army_based_on_mass_desc: "Zapytajcie Wehrmacht z II wojny światowej, dokąd zaprowadziły go mistrzostwo inżynierii i triumf woli: prosto z powrotem do Berlina, a potem do piekielnych czeluści, z których wyszli. Dlaczego? Stanęli naprzeciwko nieubłaganej arytmetyce zasobów, wyposażenia i siły ludzkiej aliantów oraz Związku Radzieckiego. Podobnie nasze siły muszą stać się masą dostatecznie silnych, zwartych jednostek, przytłaczających wroga i odpowiadających świeżymi rezerwami za każdym razem, gdy któryś oddział się załamie. Najpierw jednak musimy zainwestować w rekruterów i znaleźć sposób na wcielenie w szeregi włóczęgów oraz jeszcze gorszych typów..."
generic_tsunami_of_violence: "Tsunami przemocy"
generic_tsunami_of_violence_desc: "Osiągnęliśmy masę krytyczną pozwalającą posyłać jedną falę siły za drugą przeciw każdemu, kto stanie nam na drodze. Żadna armia nie wytrzyma długo, jeśli te fale przemocy znajdą choćby jedną szczelinę. A kiedy tsunami naszej potęgi przełamie ich linie, będzie dużo gorzkich żalów i składania kwiatów. W tym celu szkolimy ludzi i opracowujemy nowe sposoby jak najlepszego wykorzystania siły ludzkiej. Niezależnie od malejącej szerokości bojowej możemy uderzyć niczym fala z góry, z dołu i po ziemi, nie pozostawiając nikogo przy życiu."
generic_good_enough_is_perfect: "Masowo produkowana broń"
generic_good_enough_is_perfect_desc: "Sowieci mieli podobno momentami wydawać piechocie mniej karabinów, niż było ludzi zdolnych ich używać, zakładając, że gdy jeden strzelec padnie, drugi podniesie jego broń i będzie strzelał dalej. Nieważne, czy to mit - tutaj nie stanie się rzeczywistością. Stworzyliśmy broń, która przewyższy najbardziej wymyślne bestie wojenne USA nie większą siłą ognia, lecz liczbą i niezawodnością. Nie zatnie się, nie zepsuje, będzie produkowana masowo za pomocą dostępnych narzędzi. Nasza własna odpowiedź na AKM, stworzona na dzisiejsze czasy. Do tego prostsza, bardziej prymitywna broń biała, którą potrafi sklecić każdy warsztat. Nigdy więcej nie zabraknie nam przyzwoitego uzbrojenia."
generic_army_based_on_quality: "Wojsko oparte o jakość"
generic_army_based_on_quality_desc: "Zapytajcie Putina, gdzie zaprowadziła go jego bandycka melina nazywana armią: utknęła w walce z siłami wspieranymi obiektywnie lepszym wyposażeniem i obiektywnie bardziej nastawionymi na jakość. W obronie, a często również w ataku, zwycięża armia lepiej wyszkolona, dowodzona i uzbrojona. My staniemy się właśnie taką armią, z lepszymi żołnierzami i karabinami niż ktokolwiek inny. Jeśli użyjemy ich rozumnie, będą niepowstrzymani niczym legiony Cezara, które przetrwały niemożliwą przewagę liczebną najpierw Galów, a potem sił Pompejusza Wielkiego."
generic_infantry_retraining: "Programy przeszkalania żołnierzy"
generic_infantry_retraining_desc: "Wraz ze zmianami na polu bitwy wczorajsze lekcje mogą stać się jutrzejszym obciążeniem. Gdy do tego dojdzie, piechota przejdzie przez obozy szkoleniowe, gdzie pozna nowe doktryny, taktyki i manewry, aby niespodzianki nieustannie ewoluującej wojny nie zastały jej ze spuszczonymi spodniami. Od walk miejskich po metody zwalczania dronów, od zasadzek po kontrzasadzki - nasza piechota będzie gotowa na wszystko."
generic_wunderwaffe_hands: "Najbardziej śmiercionośna broń palna"
generic_wunderwaffe_hands_desc: "Karabiny samoczynno-samopowtarzalne wzorowane na StG-44 czy AK-47 mają już ponad osiemdziesiąt lat. Karabiny maszynowe są jeszcze starsze. W pewnym momencie rewolucjonizowanie takich technologii staje się coraz trudniejsze. Ale nadal możemy próbować. Morze dodatków. Nieludzko pewne prowadzenie. Najwyższej jakości mieszanka prochowa. Nie cofniemy się przed niczym, by zdobyć najlepszą broń, która w rękach najlepszych żołnierzy zwróci się dziesięciokrotnie w zwycięstwach."
generic_implementing_the_support_companies_standard: "Standard kompani wsparcia"
generic_implementing_the_support_companies_standard_desc: "Wojskowe kompanie wsparcia obejmują bardzo szeroki wachlarz sprzętu przydzielanego dywizjom w postaci batalionów pomocniczych. Mogą to być bataliony wyposażone w broń przeciwlotniczą i przeciwpancerną, a także wysoce wyspecjalizowane jednostki, takie jak saperzy.\nZwiększenie wydatków na ten konkretny sektor pozwoli zmodernizować wszystkie rodzaje uzbrojenia wsparcia. Bez wątpienia fundamentem nowoczesnej armii są zwiad, logistyka, zespoły naprawcze oraz wiele innych elementów umożliwiających sprawne prowadzenie całych wojen."
generic_heavy_metal_barrage: "Ciężki ostrzał artyleryjski"
generic_heavy_metal_barrage_desc: "Choć staromodna masowa nawała ciężkiej artylerii straciła wiele ze swego znaczenia, nie oznacza to, że sama ciężka artyleria stała się bezużyteczna. Prawdziwym rozwiązaniem jest znalezienie nowej taktyki.\nWbrew pozorom do osiągnięcia efektu nie potrzeba już setek baterii artyleryjskich. Nowoczesny sprzęt połączony z odpowiednią taktyką wystarczy, aby całkowicie rozbić logistykę przeciwnika albo zniszczyć ufortyfikowane pozycje.\nPrzyda się również modernizacja wszystkich rodzajów artylerii do zwalczania celów opancerzonych i powietrznych. Dzisiejsza broń w rękach jednego żołnierza potrafi bez trudu zniszczyć cały czołg lub samolot!"
generic_mortar_soldiers_best_friend: "Moździerz - najlepszy przyjaciel żołnierza"
generic_mortar_soldiers_best_friend_desc: "W obecnych realiach wojny masowe nawały baterii ciężkiej artylerii wyraźnie straciły skuteczność taktyczną. Od końca I wojny światowej ceni się mobilność działań bojowych, a ta wymaga broni łatwej do przenoszenia.\nMoździerz stanowi doskonałe wsparcie batalionów piechoty - łatwo go transportować i pozwala prowadzić ogień stromotorowy na średnim oraz krótkim dystansie.\nNasza armia niewątpliwie potrzebuje więcej tak użytecznego sprzętu. Co więcej, produkcja moździerzy jest tańsza niż klasycznej artylerii!"
generic_lifetime_of_war: "Całe życie na wojnie"
generic_lifetime_of_war_desc: "Zawodowi żołnierze, a przede wszystkim sprawny korpus oficerski - to dzięki nim armię można odróżnić od uzbrojonej hołoty. Zazwyczaj.\nNaszym obowiązkiem z pewnością jest wyszkolenie odpowiedniej liczby oficerów, co pomoże ograniczyć potencjalne straty wśród szeregowych, zanim zdobędą doświadczenie bojowe. Uproszczenie biurokracji pozwoli awansować kompetentnych kandydatów na stanowiska odpowiadające ich zdolnościom.\nNiektórzy są po prostu przeznaczeni, by poświęcić całe życie służbie państwu..."
generic_instructors_from_the_west: "Instruktorzy z Zachodu"
generic_instructors_from_the_west_desc: "Ci sami ludzie, którzy nauczyli ukraińską armię organizacji, obserwowali, jak opanowuje ich lekcje, a następnie przyswaja nauki wojny rosyjsko-ukraińskiej, będą idealnym partnerem dla naszych sił. Przed Upadkiem Wojsko Polskie należało do czołowych członków NATO, a ponowne nawiązanie z nim więzi jest naturalną drogą dla każdego polskiego pretendenta. Wielu generałów i oficerów uciekło do państw NATO i z przyjemnością nauczy nas, jak stać się pierwszorzędną siłą bojową."
generic_invest_in_our_own_professional_staff: "Nasza własna profesjonalna kadra"
generic_invest_in_our_own_professional_staff_desc: "Choć zagraniczni instruktorzy z regularnych armii są kuszącą możliwością, wojna rosyjsko-ukraińska nauczyła nas jednego: uczeń współczesnej wojny poddany próbie prawdziwego konfliktu szybko przerasta mistrza. Walczyliśmy na polach bitew po Upadku i znamy je na wylot, więc najlepszymi instruktorami oraz sztabowcami możemy być tylko my sami. Będziemy kształcić i awansować oficerów oraz szkoleniowców spośród najbardziej zasłużonych ludzi własnych sił. Dzięki temu poprowadzimy wojnę naprawdę po swojemu, czerpiąc naukę z doświadczenia, a taka armia z pewnością wykuje własny profesjonalizm."
generic_instructors_from_the_east: "Instruktorzy ze Wschodu"
vgeneric_instructors_from_the_east_desc: "Nawet wojny rozpoczynane z rozbudowaną logistyką i infrastrukturą nie pozostają takie długo. Węzły wylatują w powietrze, zużycie wojenne pożera gotowość, a infrastruktura trafia pod ostrzał. Kiedy wszystko idzie do diabła, należy słuchać mistrzów tego piekła: Rosjan. Ich doświadczenie w walce przy ograniczonej logistyce, w trudnym terenie i rozpaczliwych warunkach nie ma sobie równych, a Polska po Upadku jest fabrycznie wyposażona w zrujnowane miasta, rozbite drogi oraz broń działającą pomimo każdego wyobrażalnego problemu."
generic_establish_the_war_academy: "Założenie Akademii Wojennej"
generic_establish_the_war_academy_desc: "Bez naukowego, zorganizowanego podejścia do wojny zdobyte przez nas lekcje zostaną zapomniane, źle przełożone albo niewłaściwie zastosowane. Potrzebujemy prawdziwej akademii wojennej, która upowszechni innowacje i idee, a przede wszystkim ukształtuje niedojrzałe mięso w przywódców - nowych oficerów rosnącej armii. To oni przesądzą o różnicy między beznadziejną hordą a armią kroczącą ku wielkości."
generic_naval_warfare_academy: "Akademia Wojny Morskiej"
generic_naval_warfare_academy_desc: "Głupcy zapominają o znaczeniu okrętów w Polsce po Upadku, choć kraj nadal przecina mnóstwo rzek - nie wspominając już o Wiśle stojącej pośrodku pokoju. Panowanie nad ich falami staje się coraz ważniejsze, a więc potrzebujemy zorganizowanej, choć zdecydowanie nie najważniejszej marynarki. Możemy być ograniczeni do przerobionych statków towarowych i rzecznych holowników, ale nawet one wymagają fachowej wiedzy dowódczej. Właśnie jej dostarczy nasza akademia morska."
generic_gigastatek_tbd: "Zapomniani tytani mórz"
generic_gigastatek_tbd_desc: "Pycha jest rzadkim zasobem, który łatwo rozbudzić wielkim symbolem. Dawniej dumy europejskich armad trafiały na pierwsze strony gazet i przyciągały tłumy, ukazując wielkość swoich państw. Wisła, nie wspominając o mniejszych akwenach, może ograniczać wyporność, jeśli nie posiadamy portu morskiego, lecz dostatecznie okazały okręt ożywi ducha narodu i pokaże, że nadal stać nas na wielkie czyny. Skupienie na większych jednostkach da nam sposoby wpływania na bitwy niedostępne zwykłym łodziom rybackim."
generic_air_force_university: "Uniwersytet Sił Powietrznych"
generic_air_force_university_desc: "Lotnictwo jest nowym królem pola bitwy. Niezrównana mobilność i zdolność precyzyjnego dostarczania siły ognia czynią z niego niezbędny rodzaj wsparcia, a zarazem doskonałą zachętę dla przeciwnika, by marnował środki na przeciwdziałanie. To także gałąź silnie oparta na inżynierii, wymagająca niezliczonych ekspertów i mechaników stojących za każdym ptakiem oraz jego rycerskim pilotem. Zanim stworzymy znaczące siły powietrzne, potrzebujemy akademii, która wyszkoli tych wszystkich specjalistów."
generic_gigasamolot_tbd: "Zidentyfikowane obiekty latające"
generic_gigasamolot_tbd_desc: "Własny innowacyjny samolot jest znakiem rozpoznawczym rozwiniętego państwa z nowoczesną armią. Żadne państewko nie powinno się tym przejmować... przynajmniej tak mówią. Wystarczy wziąć istniejącą maszynę i ją ulepszyć, a będziemy mogli chlubić się całkowicie własnym myśliwcem - F-35-oryginalny-samolot-proszę-nie-kraść. Każdy oficer wie, że stworzyliśmy jedynie kosztowny jak na nasze możliwości pakiet modernizacyjny, lecz nawet on może przesądzić o sukcesie albo porażce każdej misji."
generic_armys_giant_playground: "Wielka wojskowa piaskownica"
generic_armys_giant_playground_desc: "Potrzebujemy rozległego poligonu, na którym można organizować zaawansowane ćwiczenia, testy prototypów i gry wojenne możliwie najbliższe prawdziwym starciom. Ryzykując utratą kończyny albo życia, przetestujemy, wyszkolimy i ocenimy wszystko, czego jeszcze nie sprawdziliśmy - a to pozwoli oszczędzić stokrotnie więcej krwi na polu bitwy. Świat wkrótce dowie się, że dzięki właściwym terenom doświadczalnym nawet takie państewko jak nasze potrafi wystawić naprawdę kompetentną armię."
generic_gigaczolg_tbd: "Potwory pola walki"
generic_gigaczolg_tbd_desc: "Nie pozwólcie, by jakikolwiek miłośnik historii czy wojskowości wmówił wam coś innego: większe zawsze znaczy lepsze. We współczesnej wojnie i inżynierii przeżywalność jest wszystkim, czego Amerykanie dowodzą raz za razem. Musimy wykazać się w tworzeniu niezniszczalnych czołgów, budując coś prawdziwie potwornego. Potrzeba mu więcej amunicji, większej broni i obrony pasywnej zdolnej wzruszyć ramionami na wszystko poza atomówką. Aktywnej również, jeśli jakąś mamy. Ten lądowy krążownik stanie się zarazem dumą wojsk pancernych i ostatecznym sprawdzianem naszej wiedzy inżynieryjnej."
generic_secret_weapons_program: "Rozwój tajnej broni"
generic_secret_weapons_program_desc: "Mówią, że Wunderwaffe z II wojny światowej nie wygrywały wojen. Mylą się. Czym jest bomba atomowa, jeśli nie niegdyś tajną superbronią? Współczesny świat jest znacznie bardziej nasycony wiedzą, innowacyjny i połączony, więc nie tylko mocarstwa mogą przecierać szlaki niekonwencjonalnych rozwiązań. Musimy przeznaczyć zespół badawczy i odpowiednie zaplecze inżynieryjne na eksperymenty z nietypowym uzbrojeniem. Niektóre projekty mogą przesądzić o różnicy między zwycięstwem a porażką."
generic_giganigga_tbd: "Program Super Żołnierza"
generic_giganigga_tbd_desc: "Achilles, Herkules, a także wielka nadzieja polskiej piłki - nasze wspomnienia są pełne większych niż życie bohaterów, którzy zwyciężali wbrew przeciwnościom. Ci nadludzie byli niegdyś wojownikami pokonującymi potwory; dziś są zaledwie piłkarzami strzelającymi kilka goli. Koniec z tym. Wskrzesimy starożytny archetyp herosa: człowieka, którego ego niemal dorównuje sile i odwadze, refleks przewyższa maszynę, a wytrzymałość bestię. Jak tego dokonamy? Eksperymenty fizjologiczno-farmaceutyczne, doskonałe okazy i gotowość, by patrzeć, jak część kandydatów na superżołnierzy ponosi klęskę. Tak właśnie rodzą się bohaterowie. Każdy z nich będzie różnicą między nędznym impasem a zdecydowanym zwycięstwem."
generic_best_of_the_best: "Najlepsi z najlepszych"
generic_best_of_the_best_desc: "Legiony Gajusza Juliusza Cezara należały do najwspanialszych żołnierzy w historii, dlatego ich wrogowie - senatorowie, Pompejusz i Galowie - zostali rozgromieni przez mniej liczne siły. Podobnie stworzymy własne legiony najlepszych wojowników, starannie wybranych spośród reszty, wyszkolonych do perfekcji i wyposażonych w najlepszy sprzęt, jaki zdołamy zgromadzić. Te elitarne jednostki będą naszym grotem, młotem i tarczą. Uczynią niemożliwe możliwym, odbierając znaczenie arytmetyce mas, tak jak dawna husaria skruszyła Tatarów i Moskali."
generic_protectors_of_the_woods: "Obrońcy lasów"
generic_protectors_of_the_woods_desc: "Polscy partyzanci są praktycznie w związku małżeńskim z lasami. To one ukrywały ich przed wzrokiem ciemiężycieli, pozwalały uderzyć i zniknąć oraz dostarczały środków do przetrwania. Aby z nimi walczyć, sami musimy opanować puszczę. Wyszkolimy żołnierzy w walce leśnej, wyposażymy w kamuflaż i sprzęt survivalowy oraz nauczymy poruszać się bezgłośnie i uderzać z całą siłą. W ten sposób przemienimy las z sojusznika partyzantów w naszego własnego. Będziemy bronić borów, tak jak one bronią nas - jedynej naturalnej bariery naszego narodu, która jest cokolwiek warta."
generic_warriors_of_the_mountains: "Wojownicy gór"
generic_warriors_of_the_mountains_desc: "Choć nasz naród obejmuje zaledwie skrawek prawdziwych gór, ich mieszkańcy szczycą się niezwykłymi tradycjami góralskimi. Sami Górale należą do najbardziej charyzmatycznych grup w kraju. Tak jak nasze siły zbrojne posiadały jednostki strzelców górskich, tak i my musimy opanować wzgórza oraz wyżyny. Wyszkolimy żołnierzy w walce górskiej, wyposażymy w sprzęt przystosowany do wyżyn i nauczymy poruszać się bezgłośnie oraz uderzać z całą siłą."
generic_soldiers_of_the_sea: "Żołnierze morza"
generic_soldiers_of_the_sea_desc: "Sto lat temu zaślubiliśmy nasz naród z Bałtykiem. Obiecaliśmy, że nigdy go nie oddamy, że prędzej stanie się czerwony. Dziś, nawet jeśli Bałtyk nie odgrywa jeszcze większej roli w naszych strategiach, Wisła i pozostałe rzeki już tak. Z piechotą morską u boku wykorzystamy rzeki jako bariery obronne i będziemy potrafili sprawnie je przekraczać."
generic_protectors_from_the_skies: "Protektorzy z niebios"
generic_protectors_from_the_skies_desc: "Trzeba mieć w sobie szczególną brawurę, by wejść do samolotu ze spadochronem, a potem wyskoczyć z niego w powietrzu. Ci, którzy dotrą tak daleko, lądują pośrodku wrogich linii, na pociągach, czasem po zgubieniu wyposażenia. Jeśli mają szczęście, zbiorą się i uderzą tam, gdzie boli najbardziej. Zdecydowanie warto. Musimy utrzymywać gotową kohortę takich rycerzy, wyszkolonych do skoków za linie wroga, sabotowania logistyki i naśladowania bohaterów wojsk powietrznodesantowych II wojny światowej."
generic_quiet_and_efficient: "Cisi i skuteczni"
generic_quiet_and_efficient_desc: "Mistrzowie terenów nie do zdobycia: wyżyn, wód, lasów i nieba. Cichy sztylet w mroku, niezrównana precyzja i skrytość. Bohaterowie, których twarze i dzieło są ostatnią rzeczą, jakiej nigdy nie zobaczysz. Oto kogo tworzymy, kto dla nas walczy i jak zwyciężamy."
generic_ramping_up_the_horsepower: "Podkręcanie mocy"
generic_ramping_up_the_horsepower_desc: "Kiedyś każda wojna opierała się na podstępie. Od czasów Sun Zi pojawienie się silnika zmieniło jednak świat, a wraz z nim wojskowość. Dziś nie wyobrażamy sobie wojny bez ciężarówek, pojazdów opancerzonych i wielu innych maszyn - i słusznie. Nasze pojazdy muszą więc idealnie nadawać się do zjednoczenia narodu: być wytrzymałe, wydajne i zdolne przejechać przez jedną czy dwie ruiny. Najpierw musimy jednak zdecydować, jak ciężkie powinny być: behemoty czy zwinne drapieżne koty, których stratę łatwo zastąpić."
generic_quick_and_agile: "Szybcy i zwinni"
generic_quick_and_agile_desc: "Duże, ciężko opancerzone jednostki są kosztowne, trudne w utrzymaniu i generalnie przeceniane. Całkowite odrzucenie ich byłoby oczywiście nierozsądne, ale nie powinniśmy stawiać ich na piedestale - zwłaszcza przy obecnych zdolnościach przemysłowych. Zamiast tego powinniśmy postawić na większą liczbę pojazdów. Zapewni nam to większą elastyczność w zmiennym środowisku pola bitwy i pozwoli znacznie szybciej docierać do strategicznych pozycji wroga. Skupienie na mobilności może nawet zrekompensować słabszą siłę ognia; nasze maszyny wymanewrują cięższe wozy i uderzą w ich słabe punkty."
generic_a_new_armored_car: "Nowy samochód pancerny"
generic_a_new_armored_car_desc: "Choć samochody pancerne są zabójcze przeciw piechocie i innym nieopancerzonym celom, pełnią przede wszystkim funkcję oczu na ziemi. Łatwo je budować oraz utrzymywać, są niezwykle szybkie i bezcenne podczas zwiadu, zapewniania bezpieczeństwa wewnętrznego, eskorty zbrojnej oraz innych pomocniczych zadań pola bitwy. Montowany na nich karabin maszynowy służy głównie do samoobrony. Wadą pozostają koła, które gorzej radzą sobie poza drogami i łatwiej uszkodzić je ogniem wroga. Wozy te mają jednak własną niszę; całkiem dobrze sprawdzają się w ciasnym terenie miejskim i nie możemy sobie pozwolić na ich zaniedbanie."
generic_modern_apc: "Nowoczesne transportery opancerzone"
generic_modern_apc_desc: "Dzięki samochodom pancernym wiemy, dokąd jechać; teraz musimy skupić się na tym, jak dotrzeć do celu. I z kim. Dlatego trzeba bliżej przyjrzeć się transporterom opancerzonym. Ich głównym zadaniem będzie szybkie przewożenie żołnierzy, którzy wykonają większość właściwej walki. Może nie są tak efektowne jak wielkie działo na gąsienicach, ale nadal pozostają niezwykle użyteczne. Piechota, niezależnie od rozwoju technologii, wciąż jest niezastąpiona dzięki swojej elastyczności. Umieszczenie jej w transporterach rozwiązuje problem braku mobilności, stanowiący jedną z największych wad tej formacji."
generic_heavy_and_powerful: "Ciężki i potężny"
generic_heavy_and_powerful_desc: "Pragniemy pokazać swoją dominację na polu bitwy. W polskim teatrze działań poważnie brakuje ciężko opancerzonych pojazdów, artylerii, a nawet broni przeciwpancernej. Skupiając się na ochronie, możemy zagwarantować, że nasi wrogowie - w większości lekko uzbrojeni partyzanci - nie zdołają się nam przeciwstawić.\nZmodyfikujemy stopy, aby były jeszcze bardziej odporne, i wyposażymy pojazdy w grubszy pancerz. Oczywiście znacznie ograniczy to ich zwrotność, ale bądźmy szczerzy: nie będą miały przed czym uciekać."
generic_another_version_of_bmp: "Kolejna wersja BWP"
generic_another_version_of_bmp_desc: "Stare bojowe wozy piechoty oparte na sowieckiej konstrukcji BMP były ukochanym sprzętem betonu w Wojsku Polskim przed Upadkiem. Wystarczała im podstawowa zdolność pływania, by patrzyli z zachwytem. Może właśnie dlatego Polska upadła.\nNie możemy polegać na słabych, zabytkowych konstrukcjach, lecz nie będziemy wymyślać koła na nowo. Nadal potrzebujemy wszechstronnych BWP na polu bitwy, a nowa generacja tych pojazdów będzie mocno oparta na dawnych BMP, choć zarazem tak zaawansowana, że laik niemal ich nie rozpozna."
generic_king_of_the_battlefield: "Król pola bitwy"
generic_king_of_the_battlefield_desc: "W dzikich realiach Upadku wielu teoretyków wojskowości przewiduje, że zubożali wrogowie spróbują zalać nas tanimi, zwinnymi samochodami pancernymi i BWP, ponieważ nie będzie ich stać na nic solidniejszego. Nasz kraj posiada natomiast rozwinięty przemysł zdolny budować duże liczby czołgów podstawowych oraz zawodowy personel, który potrafi je utrzymać. Te stalowe behemoty zmiażdżą nędzne pojazdy wroga niczym owady!\nOczywiście czołgi podstawowe również mają ograniczenia. Słabo radzą sobie w dużych miastach i potrzebują tam wsparcia piechoty. Nasz ambitny program wyraźnie nadwyręży też budżet. Mimo to w otwartym polu nikt nam nie dorówna."
generic_polish_truck_simulator: "Królowie szos"
generic_polish_truck_simulator_desc: "Obok samochodów osobowych ciężarówki są najczęściej spotykanymi pojazdami cywilnymi, które możemy przystosować do celów wojskowych. Przez lata kierowcy ciężarówek, duma polskich autostrad, przemierzali Europę, przynosząc chlubę gospodarce III Rzeczypospolitej i rozpacz zagranicznym, zwłaszcza niemieckim przewoźnikom. Dziś ich środki transportu zbierają kurz w garażach, ponieważ drogi stały się zbyt niebezpieczne albo całkowicie je porzucono. Tak czy inaczej możemy przejąć je dla własnych korzyści. Potrzebujemy taniego transportu żołnierzy oraz zaopatrzenia dla armii. Z czasem zaczniemy wytwarzać własne modele zaprojektowane specjalnie do zastosowań wojskowych."
generic_modern_spg_designs: "Nowoczesne projekty artylerii samobieżnej"
generic_modern_spg_designs_desc: "Działa samobieżne oferują precyzję i siłę porównywalną z artylerią holowaną, a jednocześnie znacznie większą mobilność. Pancerz chroni obsługującą je załogę. Niestety oznacza też wyższą cenę. Maszyna jest jednak zwinniejsza, więc dopóki załoga zmienia pozycję po każdym strzale, powinna wyjść cało i nie zmarnować naszego budżetu. Artyleria holowana może być ważniejsza tu i teraz, lecz musimy patrzeć w przyszłość. Wróg nawet nie będzie wiedział, co go trafiło."
generic_improving_the_mlrs_systems: "Ulepszanie systemów rakietowych"
generic_improving_the_mlrs_systems_desc: "Jeżeli działa samobieżne są skalpelem, wieloprowadnicowe wyrzutnie rakietowe są młotem. Dysponując podobną ochroną i mobilnością, zasypują wroga gradem pocisków. Świetnie oczyszczają jego linie, ale lepiej nie używać ich do bezpośredniego wspierania własnych oddziałów w polu. Ich ogień nie rozróżnia celów. Możemy trochę temu zaradzić, ulepszając system naprowadzania, lecz nie róbcie sobie zbyt wielkich nadziei."
generic_genuine_war_navy: "Prawdziwa Marynarka Wojenna"
generic_genuine_war_navy_desc: "Ahoj, przygodo!\nMamy już dość ostrzeliwania wrogów z kajaków, cywilnych motorówek i kutrów rybackich, aby demonstrować siłę na wodzie. Odrobiliśmy pracę domową, założyliśmy prawdziwą bazę i zatrudniliśmy marynarzy. Wkrótce nasze państwo poślubi otaczające je wody. Wrogowie zadrżą, gdy ryk dział okrętowych osłoni siły inwazyjne i uderzy w ich miękkie podbrzusze. Dzięki naszej ochronie kupcy bezpiecznie dopłyną do celu błękitnymi szlakami. A jeśli przeciwnicy spróbują zastosować tę samą taktykę przeciw nam? Będą musieli przedrzeć się przez ścianę min.\nStaniemy się władcami fal."
generic_riverine_warfare: "Wojna rzeczna"
generic_riverine_warfare_desc: "Polska nie jest potęgą morską; jedynie północny skraj kraju styka się z morzem. Mamy za to rzeki. Wisła nie jest wprawdzie Amazonką, ale nie brakuje jej dopływów, a te doskonale nadają się do wojny rzecznej. Niewielkie, uzbrojone po zęby łodzie mogą po nich pływać, otwierając nowe możliwości taktyczne i logistyczne."
generic_torpedo_boats_tbd: "Ulepszanie łodzi torpedowych"
generic_torpedo_boats_tbd_desc: "Torpeda to prosty podwodny pocisk ze śrubą napędową. Gdy trafi, potrafi zatopić nawet najtwardszy okręt albo poważnie go uszkodzić. Poważnym zaniedbaniem byłoby nieulepszenie projektów przebudowy istniejących jednostek oraz specjalistycznych kadłubów przeznaczonych do wystrzeliwania tej niszczycielskiej broni. Gdy nowe konstrukcje przyniosą owoce, niejeden marynarz przeklnie nasze imię."
generic_corvettes_tbd: "Plany nowoczesnej korwety"
generic_corvettes_tbd_desc: "Wraz ze wzrostem celności i niszczycielskiej siły pocisków okręty wojenne zmalały, a jednocześnie rozwinięto środki przeciwdziałania. Korwety z jednostek straży przybrzeżnej przeobraziły się w prawdziwe okręty bojowe. Dla państewka o naszej gospodarce i rozmiarach są dokładnie takim kadłubem, na którym musimy się skupić, by wystawić marynarkę zdolną realizować nasze plany. Zaprojektujemy nową, oszczędną i nowoczesną jednostkę - lepszego okrętu do naszych celów nie znajdziemy."
generic_boosty_do_walk_na_rzekach_tbd: "Z nurtem rzek"
generic_boosty_do_walk_na_rzekach_tbd_desc: "Rzeki są naszymi żyłami. Łączą nas, karmią i dają nam życie. Mogą jednak stać się również bronią. Inwestując w zdolność do prowadzenia walk rzecznych, zmienimy je w strategiczne zasoby pozwalające demonstrować siłę oraz chronić własne interesy. Nasze łodzie otrzymają najnowsze technologie i uzbrojenie, dzięki którym zdominujemy szlaki wodne oraz uderzymy wrogów tam, gdzie najmniej się tego spodziewają."
generic_open_sea_warfare: "Wojna na otwartym morzu"
generic_open_sea_warfare_desc: "Dotarcie na otwarte morze jest marzeniem każdej marynarki. To tam mierzy się prawdziwą potęgę morską i toczy największe bitwy. Choć możemy nie posiadać wybrzeża otwartego morza, nadal potrafimy przenosić siłę poprzez rzeki i śródlądowe drogi wodne. Inwestując w prawdziwą marynarkę, sprawimy, że wrogowie dwa razy się zastanowią, nim rzucą nam wyzwanie na wodzie. Nasze okręty otrzymają najnowszą technologię i uzbrojenie, pozwalające demonstrować siłę oraz chronić interesy w regionie."
generic_destroyers_tbd: "Konkretna eskadra niszczycieli"
generic_destroyers_tbd_desc: "Niszczyciele są kręgosłupem każdej nowoczesnej marynarki. Szybkie i wszechstronne, potrafią zwalczać zagrożenia zarówno nawodne, jak i powietrzne. Inwestycja w prawdziwe siły niszczycieli pozwoli nam demonstrować potęgę na morzach oraz chronić szlaki handlowe."
generic_submarines_tbd: "Głębiny naszych wód"
generic_submarines_tbd_desc: "Okręty podwodne, cisi łowcy głębin, stanowią najdoskonalsze narzędzie blokowania dostępu do morza. Sama ich obecność może odstraszyć wrogie jednostki przed wejściem na nasze wody, a kiedy mimo wszystko to zrobią, zaatakują ze śmiertelną precyzją. Inwestując we flotę nowoczesnych okrętów podwodnych, sprawimy, że przeciwnicy dwa razy się zastanowią, nim zapuszczą się na nasz morski obszar. Te podwodne drapieżniki otrzymają zaawansowane systemy sonarowe i torpedy, pozwalające skrycie oraz skutecznie śledzić i eliminować zagrożenia."
generic_boosty_do_walki_na_morzu_tbd: "Dominacja na Bałtyku"
generic_boosty_do_walki_na_morzu_tbd_desc: "Morze Bałtyckie jest naszym prawem przyrodzonym. Nie pozwolimy nikomu zagrozić naszej dominacji. Inwestując w prawdziwą marynarkę, sprawimy, że wrogowie dwa razy się zastanowią, nim rzucą nam wyzwanie na wodzie. Nasze okręty otrzymają najnowszą technologię i uzbrojenie, dzięki którym będziemy demonstrować siłę oraz chronić interesy w regionie. Silna obecność morska zabezpieczy szlaki handlowe i wybrzeże oraz pozwoli narzucić nasze wpływy na Bałtyku."
generic_good_face_to_bad_mine: "Dobra mina do złej gry"
generic_good_face_to_bad_mine_desc: "Stawianie min na wodzie to tani i skuteczny sposób odcinania dostępu wrogim okrętom. Nie powstrzymają zdeterminowanych sił morskich, lecz zmuszą je do zwolnienia oraz skierowania zasobów na działania przeciwminowe. Da nam to czas i utrudni przeciwnikowi demonstrowanie potęgi na wodzie. Musimy zainwestować w zdolności minowania i zapewnić naszym akwenom należytą ochronę przed każdym potencjalnym zagrożeniem."
generic_transport_fever: "Konwój płynie dalej"
generic_transport_fever_desc: "Budowa kolejnych konwojów i statków transportowych pozwoli sprawniej przemieszczać żołnierzy oraz zaopatrzenie po drogach wodnych. Będzie to kluczowe dla utrzymania linii dostaw i zapewnienia naszym siłom odpowiedniego wyposażenia oraz gotowości bojowej. Inwestując w solidną flotę transportową, zwiększymy mobilność strategiczną i zyskamy możliwość szybkiego reagowania na nowe zagrożenia."
generic_damage_control: "Minimalizacja uszkodzeń"
generic_damage_control_desc: "Musimy teraz skupić się na szczegółach, takich jak walka o żywotność okrętu. Bez względu na stopień zaawansowania nasze jednostki nieuchronnie zostaną trafione w boju. Potrzebujemy systemów oraz wyszkolonego personelu, który błyskawicznie zareaguje na uszkodzenia spowodowane ogniem wroga albo wypadkiem. Inwestycje w odpowiednie środki pozwolą okrętom dłużej pozostawać w służbie podczas starć, zwiększając ich przeżywalność i skuteczność bojową."
generic_rule_the_waves: "[ROOT.GetName] to władcy siedmiu mórz!"
generic_rule_the_waves_desc: "Aby osiągnąć pełną przewagę morską, musimy zwiększyć zdolność koordynacji i zadawania wrogowi większych strat. Szybsze, lepiej współpracujące okręty pozwolą uderzyć pierwszym i z całą siłą, paraliżując przeciwnika, nim zdąży zareagować. Należy też zainwestować w systemy walki o żywotność, dzięki którym nasze jednostki dłużej utrzymają się na wodzie i będą walczyć zacieklej nawet pod ciężkim ostrzałem. Skupienie na tych obszarach uczyni marynarkę siłą, z którą trzeba się liczyć - zdolną dominować na morzach i chronić interesy narodu."
generic_aces_of_the_homeland: "Asy ojczyzny"
generic_aces_of_the_homeland_desc: "Tylko najlepsi piloci mogą zapewnić nam przewagę w powietrzu. Musimy zainwestować w rygorystyczne programy szkoleniowe, które ukształtują lotników zdolnych wymanewrować i pokonać każdego przeciwnika. Asy staną się kręgosłupem sił powietrznych, prowadząc misje z precyzją i odwagą. Krzewiąc wśród pilotów kulturę doskonałości oraz oddania, stworzymy potężną formację lotniczą, która ochroni niebo i skutecznie wesprze działania lądowe."
generic_air_supremacy_focus: "Nacisk na dominację powietrzną"
generic_air_supremacy_focus_desc: "Dominacja w powietrzu stanowi fundament każdej udanej kampanii wojskowej. Rozwijając zdolności lotnicze, uczynimy nasze siły powietrzne najlepszymi na świecie, zdolnymi panować na niebie i udzielać wojskom lądowym kluczowego wsparcia prowadzącego do zwycięstwa w każdym konflikcie. Lepsze samoloty, zaawansowana taktyka i doskonale wyszkoleni piloci pozwolą nam zdobyć przewagę powietrzną oraz zabezpieczyć naród i jego interesy."
generic_fighter_tbd: "Przejście do ery odrzutowców"
generic_fighter_tbd_desc: "Myśliwce są kręgosłupem każdych nowoczesnych sił powietrznych. Nie możemy pozwolić wrogowi zyskać przewagi. Musimy inwestować w rozwój zaawansowanych odrzutowców, aby dysponować najsprawniejszymi i najskuteczniejszymi maszynami. Będą niezbędne do obrony przestrzeni powietrznej, zwalczania wrogiego lotnictwa oraz wspierania wojsk lądowych. Skupiając się na rozwoju myśliwców, zachowamy przewagę technologiczną i sprawimy, że nasze siły powietrzne pozostaną potężnym środkiem odstraszającym przed każdym możliwym zagrożeniem."
generic_recon_tbd: "Oczy w niebiosach"
generic_recon_tbd_desc: "Samoloty rozpoznawcze są niezbędne do gromadzenia informacji i wczesnego ostrzegania przed ruchami wroga. Musimy inwestować w zaawansowane technologie zwiadowcze, aby zawsze posiadać najświeższe dane o pozycjach oraz działaniach przeciwnika. Pozwoli nam to podejmować świadome decyzje i błyskawicznie odpowiadać na każde zagrożenie ze strony wrogów stojących nam na drodze ku wielkości."
generic_rule_the_skies: "[ROOT.GetName] to władcy przestworzy!"
generic_rule_the_skies_desc: "Gdy wojna czai się tuż za rogiem, musimy upewnić się, że siły powietrzne są gotowe do walki. Przygotowanie jest kluczowe i niczego nie możemy pozostawić przypadkowi. Powinniśmy zwiększać przewagę w przestworzach, inwestując w najnowocześniejsze samoloty, rygorystyczne szkolenie pilotów oraz zaawansowaną taktykę, która da nam przewagę nad każdym przeciwnikiem. Równie ważne jest podniesienie morale ludności i wzbudzenie jedności oraz wiary w możliwości narodu. Publiczne pokazy potęgi lotniczej i jasne przedstawienie celów strategicznych zainspirują żołnierzy oraz cywilów. Dopiero wtedy będziemy gotowi na każde wyzwanie przyszłości."
generic_ground_support_focus: "Nacisk na wsparcie naziemne"
generic_ground_support_focus_desc: "Czym są siły powietrzne bez zdolności wspierania oddziałów na lądzie? Prawdziwa potęga lotnictwa nie leży wyłącznie w niebie, lecz również w możliwości bezpośredniego wpływania na wynik starć naziemnych. Musimy nadać pierwszeństwo wsparciu walk lądowych, zapewniając żołnierzom szybką i precyzyjną pomoc z powietrza. Inwestycje w szkolenie oraz ścisłą współpracę jednostek lotniczych z lądowymi sprawią, że samoloty staną się czynnikiem rozstrzygającym konflikty. Jeśli zaczniemy już teraz, wkrótce nasze maszyny będą odmieniać przebieg bitew lądowych i przechylać szalę na naszą korzyść."
generic_bombo_tbd: "Rozwój nowych bombowców"
generic_bombo_tbd_desc: "Pozostaliśmy w tyle za innymi państwami, które już wykorzystują bombowce w działaniach wojskowych i zdobywają cenne doświadczenie we współczesnej wojnie. Ta luka technologiczna stawia nas w bardzo niekorzystnym położeniu i zagraża zdolności skutecznej obrony własnych interesów. Nadrobimy ją jedynie poprzez inwestycje w badania, zdobywanie doświadczenia operacyjnego oraz rozwój nowszych, bardziej zaawansowanych modeli. Z czasem bombowce staną się jednym z głównych narzędzi walki, pozwalając demonstrować siłę na wielkich odległościach i utrzymać konkurencyjność armii na światowej scenie."
generic_get_to_the_chopa: "Inwestycje w zaawansowane śmigłowce"
generic_get_to_the_chopa_desc: "Musimy skupić się na produkcji większej liczby śmigłowców, aby wojsko pozostało wszechstronne i skuteczne. Oferują niezrównaną mobilność oraz elastyczność, przez co są bezcenne podczas wspierania oddziałów lądowych i prowadzenia zwiadu w trudnym terenie. Odgrywają też ważną rolę w walkach powietrznych, zapewniając możliwości ofensywne i defensywne w szybko zmieniającej się sytuacji. Skierowanie badań oraz zasobów na rozwój techniki śmigłowcowej jest zdecydowanie właściwym podejściem, które da siłom zbrojnym znaczną przewagę strategiczną na współczesnym polu bitwy."
generic_rain_hellfire: "Deszcz piekielnego ognia"
generic_rain_hellfire_desc: "Po zbudowaniu potężnych sił powietrznych musimy przygotować się do ich skutecznego użycia w przyszłym konflikcie. Strategie i taktyka powinny w pełni wykorzystywać ich możliwości. Główny nacisk należy położyć na rozwój i rozmieszczenie bliskiego wsparcia lotniczego, niezbędnego dla sił lądowych. Włączenie samolotów CAS do działań pozwoli zapewnić wojskom kluczową pomoc, zakłócać ruchy przeciwnika i osłabiać ufortyfikowane pozycje przed natarciem. Bliskie wsparcie pomoże żołnierzom przełamać każdą obronę i zwyciężyć w każdej bitwie, odwracając losy walki nawet przeciw potężnym wrogom."
generic_drones_tbd: "Bezzałogowy rój"
generic_drones_tbd_desc: "Drony odgrywają coraz większą rolę we współczesnej wojnie, ponieważ nie wymagają pilota na pokładzie, znacząco ograniczając ryzyko dla personelu. Musimy wykorzystać ten postęp i zainwestować w potężny rój zdolny prowadzić skoordynowane ataki z precyzją oraz wydajnością. Duże liczby dronów pozwolą przeciążyć i rozbić linie obronne, gromadzić dane w czasie rzeczywistym oraz uderzać w strategiczne cele bez narażania własnych sił. Roje wprowadzą chaos w szeregach przeciwnika, osłabią jego pozycje i zapewnią nam znaczną przewagę taktyczną. Przyszłość wojny należy do bezzałogowych innowacji."
generic_antiair_tbd: "Rozwój artylerii przeciwlotniczej"
generic_antiair_tbd_desc: "Same duże siły powietrzne oczywiście nie wystarczą. Obrona również ma kluczowe znaczenie dla prawdziwego panowania nad niebem i bezpieczeństwa terytorium. Tylko budowa nowych, zaawansowanych stanowisk przeciwlotniczych oraz maksymalizacja ich skuteczności stworzą tarczę stale chroniącą naszą przestrzeń. Najnowocześniejsza technologia, rygorystyczne szkolenie personelu i ciągłe modernizacje pozwolą szybko wykrywać oraz niszczyć wrogie samoloty, zanim staną się zagrożeniem. Dysponując potężnymi systemami przeciwlotniczymi, możemy być pewni, że żadna maszyna nie ośmieli się zbliżyć do naszej obrony ani podważyć dominacji w przestworzach."
generic_transports_tbd: "Środki transportu lotniczego"
generic_transports_tbd_desc: "Samoloty transportowe są niezbędne dla zdolności naszej armii do posuwania się naprzód i odnoszenia sukcesów w najróżniejszych wojnach oraz bitwach. Stanowią fundament logistyki, umożliwiając szybki przerzut żołnierzy, sprzętu i kluczowych zapasów tam, gdzie są najbardziej potrzebne. Ich wszechstronność pozwala błyskawicznie reagować na zmiany frontu, wzmacniać odległe pozycje oraz wspierać sojuszników podczas wspólnych operacji. Zwiększając zasięg maszyn transportowych, rozszerzymy obszar działań, utrzymamy linie zaopatrzenia na większych odległościach i zapewnimy siłom odpowiednie wyposażenie w każdej chwili. Inwestycja w zaawansowane samoloty da nam znaczną przewagę w przyszłych konfliktach."
generic_per_aspera_ad_astra: "Per Aspera ad Astra"
generic_per_aspera_ad_astra_desc: "Nasz kraj nie może czekać ani chwili dłużej. Stoimy na rozdrożu, na którym dzisiejsze czyny przesądzą o przyszłości narodu. Inne państwa już podejmują niezwykłe misje, prowadzą zaawansowane badania naukowe na Księżycu i tworzą ambitne plany budowy miast na Marsie. Jeśli się zawahamy, zostaniemy w tyle, zepchnięci na margines historii, gdy epoka eksploracji kosmosu rozwinie się bez nas. Nie możemy dopuścić do takiego cofnięcia. Musimy z determinacją skierować wspólną ambicję ku gwiazdom. Budowa i start pierwszej rakiety nie tylko oznaczą wielki postęp wojskowy, lecz także wyślą światu potężny komunikat: nasz naród jest gotowy poprowadzić ludzkość ku nowej erze. Ten kluczowy krok zwiększy zdolności armii, umocni fundamenty technologiczne i przygotuje grunt pod przyszłą kolonizację kosmosu. Ku nieskończoności i dalej, jak powiedzieliby niektórzy."
