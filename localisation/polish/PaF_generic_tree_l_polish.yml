generic_repair_roads_idea: "Naprawianie dróg"
generic_repair_roads_idea_desc: "Bez odpowiedniej infrastruktury nie zbudujemy sprawnej gospodarki. Drogi są krwioobiegiem naszego narodu, umożliwiającymi skuteczny przepływ towarów i ludzi. Po Upadku wiele z nich popadło w ruinę, utrudniając handel oraz komunikację. Inwestując w remonty i utrzymanie dróg, możemy pobudzić działalność gospodarczą, stworzyć miejsca pracy oraz poprawić ogólną jakość życia obywateli. Uczyńmy to niezbędne zadanie priorytetem, aby zapewnić odbudowę i rozwój naszego państwa."
 
generic_night_of_remembrance_idea: "Chwała poległym"
generic_night_of_remembrance_idea_desc: "W zamęcie Upadku zginęło wiele osób. Musimy uczcić ich pamięć i uznać ofiary poniesione dla naszego przetrwania. Noc pamięci stanie się wydarzeniem jednoczącym społeczność, pozwalającym wspólnie pochylić się nad naszą historią oraz wytrwałością naszego ludu. Poprzez uroczystości, opowieści i chwile ciszy oddamy hołd tym, którzy poświęcili wszystko dla naszej przyszłości. Ten akt pamięci umocni naszą wolę odbudowy i dalszego marszu naprzód jako naród."
generic_redefining_our_system_idea: "Czas na zmiany"
generic_redefining_our_system_idea_desc: "Nie możemy wiecznie polegać na dawnych sposobach działania. Upadek pokazał, że poprzednie systemy były wadliwe i nie wytrzymały stojących przed nami wyzwań. Nadeszła pora, by na nowo przemyśleć oraz zdefiniować nasze struktury polityczne, gospodarcze i społeczne, dostosowując je do obecnych realiów. Przyjmując innowacje i nowe idee, możemy stworzyć odporniejsze, bardziej elastyczne społeczeństwo, lepiej przygotowane na przyszłe kryzysy. Wspólnie zbudujmy system służący wszystkim obywatelom i zapewniający narodowi jaśniejszą przyszłość." 
generic_consolidation_of_new_territories_idea: "Operacje przeciwpartyzanckie"
generic_consolidation_of_new_territories_idea_desc: "Opór będzie istniał zawsze. Ci, którzy sprzeciwiają się naszej władzy - czy to z lojalności wobec dawnego porządku, czy zwyczajnie ze strachu i niepewności - będą próbowali podważyć nasze wysiłki na rzecz odbudowy. Aby zapewnić stabilność i bezpieczeństwo nowo zdobytych terytoriów, musimy przeprowadzić gruntowne działania przeciwpartyzanckie. Obejmie to identyfikację i neutralizację grup powstańczych, zabezpieczenie kluczowej infrastruktury oraz zdobycie serc i umysłów miejscowej ludności. Okazując przywiązanie do porządku i postępu, możemy ograniczyć opór i wzbudzić poczucie jedności w obrębie naszych granic."
generic_condition_of_country_idea: "Stan naszego kraju"
generic_condition_of_country_idea_desc: "Nasz naród znajduje się w stanie przemian i musi przezwyciężyć wiele wyzwań, nim odbuduje się po Upadku. Musimy podsumować obecną sytuację oraz ocenić mocne i słabe strony systemów politycznych, gospodarczych i społecznych. Zrozumienie stanu państwa pozwoli wskazać obszary wymagające natychmiastowej uwagi i opracować skuteczne strategie naprawcze. Ta wszechstronna ocena stanie się fundamentem naszych starań o stabilniejszą i dostatniejszą przyszłość dla wszystkich obywateli."
generic_mass_sabotage_idea: "Masowy sabotaż"
generic_mass_sabotage_idea_desc: "Nasi wrogowie sabotują nasze wysiłki!"
generic_supply_rush_idea: "Gorączka zaopatrzeniowa"
generic_supply_rush_idea_desc: "Potrzebujemy więcej zapasów - i to szybko! Obecne rezerwy nie wystarczają, by zaspokoić potrzeby rosnącej ludności i wojska. Musimy więc rozpocząć gorączkę zaopatrzeniową, mobilizując wszystkie dostępne zasoby do zdobywania oraz rozdzielania niezbędnych dóbr. Dotyczy to żywności, środków medycznych, amunicji i materiałów budowlanych. Usprawniając łańcuchy dostaw i nadając pierwszeństwo najpilniejszym potrzebom, zapewnimy obywatelom oraz żołnierzom wszystko, czego potrzebują do życia i obrony państwa."
generic_heirs_of_the_nation_idea_1: "Spadkobiercy narodu"
generic_heirs_of_the_nation_idea_1_desc: "Ta ziemia ma tylko jedną przyszłość - i to my nią jesteśmy. Niezależnie od tego, czym wcześniej był ten kraj, to my ukształtujemy jego los. Jesteśmy dziedzicami narodu, który niegdyś istniał, i staniemy się założycielami narodu, który dopiero nadejdzie. Nasze dzisiejsze czyny wyznaczą bieg historii na całe pokolenia. Przyjmijmy tę odpowiedzialność z dumą i determinacją, wiedząc, że sami jesteśmy architektami własnej przyszłości."
generic_heirs_of_the_nation_idea_2: "Spadkobiercy narodu"
generic_heirs_of_the_nation_idea_2_desc: "Ta ziemia ma tylko jedną przyszłość - i to my nią jesteśmy. Niezależnie od tego, czym wcześniej był ten kraj, to my ukształtujemy jego los. Jesteśmy dziedzicami narodu, który niegdyś istniał, i staniemy się założycielami narodu, który dopiero nadejdzie. Nasze dzisiejsze czyny wyznaczą bieg historii na całe pokolenia. Przyjmijmy tę odpowiedzialność z dumą i determinacją, wiedząc, że sami jesteśmy architektami własnej przyszłości."
generic_state_of_our_eco: "Stan naszej gospodarki"
generic_state_of_our_eco_desc: "Nasza gospodarka staje na nogi. Powoli, lecz nieubłaganie odbudowujemy fundamenty systemu gospodarczego. Wciąż jednak pozostaje wiele do zrobienia. Musimy ożywić kluczowe branże, inwestować w infrastrukturę oraz tworzyć klimat sprzyjający przedsiębiorczości i innowacjom. Nadając pierwszeństwo tym obszarom, stworzymy miejsca pracy, pobudzimy rozwój i przygotujemy grunt pod dostatnią przyszłość. Nadal pracujmy wspólnie nad umocnieniem gospodarki i zapewnieniem wszystkim obywatelom lepszego życia."
generic_state_of_our_poli: "Stan naszego systemu politycznego"
generic_state_of_our_poli_desc: "Nasz system polityczny zapuścił już korzenie, lecz nadal jest kruchy. Musimy wzmocnić instytucje i dopilnować, by cały system działał na naszą korzyść. Opozycja zawsze będzie istnieć, a my potrzebujemy narzędzi, żeby sobie z nią radzić. Świat po Upadku jest bezlitosny, toteż musimy być gotowi na każde wyzwanie, które stanie nam na drodze. Skupmy się na budowie stabilnego i skutecznego systemu politycznego, który będzie służył obywatelom i zapewni narodowi jaśniejszą przyszłość."
generic_state_of_our_army: "Stan naszej armii"
generic_state_of_our_army_desc: "Im więcej ćwiczymy, tym lepsi się stajemy. Nasza armia rośnie w siłę z każdym dniem, lecz wciąż czeka nas wiele pracy. Musimy nadal szkolić oddziały, ulepszać wyposażenie i opracowywać skuteczne strategie na wypadek wszelkich zagrożeń. Inwestując w zdolności wojskowe, możemy zagwarantować bezpieczeństwo państwu i jego obywatelom. Zachowajmy czujność i nie ustawajmy w budowie potężnej armii, która ochroni nasze interesy oraz wartości."
generic_increase_the_emissions_idea: "Zwiększone emisje"
generic_increase_the_emissions_idea_desc: "Nie możemy czekać ani chwili dłużej. Nadeszła pora na odważne działanie i zwiększenie emisji. Choć w świecie zmagającym się z problemami środowiska może się to wydawać sprzeczne z rozsądkiem, musimy postawić na pierwszym miejscu najpilniejsze potrzeby oraz odbudowę gospodarki. Zwiększając produkcję przemysłową i zużycie energii, pobudzimy wzrost, stworzymy miejsca pracy oraz odbudujemy infrastrukturę. Musimy jednak pamiętać o długofalowych konsekwencjach i w przyszłości dążyć do zrównoważonych rozwiązań. Na razie skupmy się na postawieniu państwa na nogi." 
generic_advocate_energetic_transformation_idea: "Proponenci transformacji energetycznej"
generic_advocate_energetic_transformation_idea_desc: "Przyszłość mieni się zieloną barwą. Musimy przejść na odnawialne źródła energii oraz zrównoważone metody działania. Inwestując w czyste technologie, ograniczymy zależność od paliw kopalnych, zmniejszymy emisje i stworzymy zdrowsze środowisko dla przyszłych pokoleń. Transformacja przyniesie korzyści nie tylko planecie, lecz także pobudzi rozwój gospodarczy i stworzy nowe miejsca pracy w rodzących się branżach. Wspólnie promujmy transformację energetyczną i budujmy zrównoważoną przyszłość naszego państwa."  
 
generic_legal_shock_idea: "Szok walutowy - Podstawy prawne"
generic_legal_shock_idea_desc: "Mamy drobny problem z naszą walutą. Ludzie utracili do niej zaufanie, co destabilizuje gospodarkę. Aby temu zaradzić, musimy przeprowadzić prawny szok walutowy, wprowadzając nowe przepisy i środki mające przywrócić wiarę w system monetarny. Może to oznaczać denominację waluty, zaostrzenie nadzoru finansowego i zwiększenie przejrzystości polityki gospodarczej. Podejmując zdecydowane działania, ustabilizujemy walutę i położymy fundamenty pod silniejszą gospodarkę."
generic_strenghten_the_currency_idea: "Szok walutowy - Umacnianie"
generic_strenghten_the_currency_idea_desc: "Mamy drobny problem z naszą walutą. Ludzie utracili do niej zaufanie, co destabilizuje gospodarkę. Aby temu zaradzić, musimy przeprowadzić prawny szok walutowy, wprowadzając nowe przepisy i środki mające przywrócić wiarę w system monetarny. Może to oznaczać denominację waluty, zaostrzenie nadzoru finansowego i zwiększenie przejrzystości polityki gospodarczej. Podjęliśmy kroki, by umocnić naszą walutę i przywrócić jej wartość."
generic_devaluate_currency_idea: "Szok walutowy - Dewaluacja"
generic_devaluate_currency_idea_desc: "Mamy drobny problem z naszą walutą. Ludzie utracili do niej zaufanie, co destabilizuje gospodarkę. Aby temu zaradzić, musimy przeprowadzić prawny szok walutowy, wprowadzając nowe przepisy i środki mające przywrócić wiarę w system monetarny. Może to oznaczać denominację waluty, zaostrzenie nadzoru finansowego i zwiększenie przejrzystości polityki gospodarczej. Podjęliśmy kroki, by zdewaluować walutę i zwiększyć konkurencyjność naszego eksportu."

generic_cooking_frog_idea: "Gotowanie żaby"
generic_cooking_frog_idea_desc: "Robi się coraz goręcej. Sytuacja w kraju może nie być tak stabilna, jak byśmy sobie życzyli. Ludzie stają się niespokojni i zaczynają wybuchać niewielkie protesty. Musimy zająć się źródłami problemów, zanim dojdzie do dalszych niepokojów. Stopniowe zmiany i reformy pozwolą nam złagodzić napięcia oraz stworzyć stabilniejsze warunki. Wspólnie gotujmy żaby powoli, tak aby nasz naród pozostał zjednoczony i odporny w obliczu wyzwań."

generic_naval_catchup: "Morska podbudowa"
generic_naval_catchup_desc: "Nigdy nie była to ziemia marynarzy ani żeglarzy. Jej historia tkwi korzeniami w glebie, polach i lasach, które przez pokolenia utrzymywały ludzi przy życiu. W tym nowym świecie musimy jednak się przystosować i wykorzystać możliwości czekające za naszymi wybrzeżami. Inwestując w zdolności morskie, ochronimy swoje interesy, rozszerzymy szlaki handlowe i zaznaczymy obecność na światowej scenie. Obierzmy kurs ku jaśniejszej przyszłości, w której nasz naród rozkwitnie zarówno na lądzie, jak i na morzu."

generic_barque_barok: "Barok barkowy"
generic_barque_barok_desc: "W epoce żagli bark był wszechstronną i wydajną jednostką, zdolną do żeglugi zarówno po wodach przybrzeżnych, jak i otwartym morzu. Jego konstrukcja zapewniała równowagę między prędkością a ładownością, dzięki czemu doskonale nadawał się do handlu oraz wypraw odkrywczych. Przyjmując bark za symbol naszych morskich aspiracji, możemy oddać cześć marynarskiemu dziedzictwu, zarazem spoglądając ku przyszłemu rozwojowi i dobrobytowi na pełnym morzu. Wyznaczmy kurs na sukces, prowadzeni duchem przygody oraz obietnicą nowych horyzontów."

generic_aerial_catch_up: "Lotnicza podbudowa"
generic_aerial_catch_up_desc: "Prosto do nieba. W tym nowym świecie musimy spojrzeć w górę i wykorzystać możliwości czekające poza ziemskimi granicami. Inwestując w lotnictwo, ochronimy swoje interesy, zwiększymy zasięg i zaznaczymy obecność na niebie. Wznieśmy się ku jaśniejszej przyszłości, w której nasz naród rozkwitnie zarówno na lądzie, jak i w powietrzu."

generic_behold_my_choppa: "Śmigłe śmigła"
generic_behold_my_choppa_desc: "Śmigłowce mogą się czasami kojarzyć politycznie dość źle, ale to obecnie najmniejszy problem. W tym nowym świecie musimy wykorzystać możliwości czekające poza ziemskimi granicami. Inwestując w lotnictwo, ochronimy swoje interesy, zwiększymy zasięg i zaznaczymy obecność na niebie. Wznieśmy się ku jaśniejszej przyszłości, w której nasz naród rozkwitnie zarówno na lądzie, jak i w powietrzu."

generic_break_the_resistance: "Złamanie oporu"
generic_break_the_resistance_desc: "Opór będzie istniał zawsze. Ci, którzy sprzeciwiają się naszej władzy - czy to z lojalności wobec dawnego porządku, czy zwyczajnie ze strachu i niepewności - będą próbowali podważyć nasze wysiłki na rzecz odbudowy. Aby zapewnić stabilność i bezpieczeństwo nowo zdobytych terytoriów, musimy przeprowadzić gruntowne działania przeciwpartyzanckie. Obejmie to identyfikację i neutralizację grup powstańczych, zabezpieczenie kluczowej infrastruktury oraz zdobycie serc i umysłów miejscowej ludności. Okazując przywiązanie do porządku i postępu, możemy ograniczyć opór i wzbudzić poczucie jedności w obrębie naszych granic."

generic_un_recognition: "Uznanie ONZ"
generic_un_recognition_desc: "Osiągnęliśmy ważny kamień milowy na drodze ku międzynarodowej prawowitości. Organizacja Narodów Zjednoczonych oficjalnie uznała nasze państwo, dając nam miejsce przy światowym stole. Uznanie to nie tylko potwierdza naszą suwerenność, lecz także otwiera drogę do stosunków dyplomatycznych, możliwości handlowych oraz międzynarodowej pomocy i wsparcia. Wykorzystajmy nowy status, aby umocnić pozycję na światowej scenie i pracować na rzecz jaśniejszej przyszłości naszych obywateli."
generic_true_poland: "Jedyne prawowite państwo"
generic_true_poland_desc: "Jesteśmy prawowitymi dziedzicami tej ziemi. Nasza historia, kultura i tożsamość są głęboko zakorzenione na tych terytoriach, a my stanowimy jedyne prawdziwe państwo reprezentujące wolę naszego ludu. W obliczu wyzwań i sprzeciwu musimy pozostać niewzruszeni w obronie suwerenności oraz wartości, które nas określają. Zjednoczmy się jako jeden naród, dumni ze swego dziedzictwa i zdecydowani zbudować przyszłość oddającą cześć naszej przeszłości."
generic_fighting_for_legit: "Wojna o uznanie"
generic_fighting_for_legit_desc: "Toczymy walkę o uznanie na arenie międzynarodowej. Nasz naród napotkał wiele wyzwań i przeszkód, lecz nie ustajemy w dążeniu do uznania oraz szacunku światowej społeczności. Wysiłki dyplomatyczne, strategiczne sojusze i przestrzeganie norm międzynarodowych pozwolą nam udowodnić, że zasługujemy na miano suwerennego państwa. Nadal walczmy o należne nam miejsce pośród narodów świata, wiedząc, że wytrwałość ostatecznie przyniesie sukces."


##########################
###     Generic Tree   ###
##########################
 
generic_last_days_of_poland: "Ostatnie dni Polski"
generic_last_days_of_poland_desc: "Jeszcze nie tak dawno temu, za górami, za lasami, istniało państwo zwane Polską, lecz niestety pycha doprowadziła je do upadku. Dziś znaleźliśmy się na samotnym pustkowiu, pośród ruin mrocznych wieków, a naszym zadaniem jest przetrwać wszystko, co na nas czeka! Przybyliśmy tu z własną misją i wizją. Przed nami niezwykle trudna i śmiała podróż pełna wyzwań, ale nigdy się nie poddamy! Początki historii nigdy nie były łatwe, lecz nasz jasno wytyczony cel poprowadzi nas prosto ku horyzontowi! Pora powstać z popiołów niczym feniks!"
generic_experiences_of_the_fall: "Doświadczenia Upadku"
generic_experiences_of_the_fall_desc: "W ostatnim czasie doszło do wielu drastycznych wydarzeń, których w mniejszym lub większym stopniu byliśmy świadkami. Rozumiemy już, że potrzebujemy nowej strategii walki i będziemy się jej trzymać. Problem w tym, że to, czym dysponujemy, nie przypomina dawnej armii, lecz zwykły, rozwścieczony tłum cywilów. Musimy wyciągnąć wnioski z tych bolesnych czasów i się przystosować, inaczej o naszym losie rozstrzygnie prawo dżungli. Znajdźmy książki, poszukajmy inspiracji i całego szeregu strategii; przydadzą się dowódcom, którzy poprowadzą armię ku zwycięstwu! Silne państwo oznacza silną armię. Jesteśmy zwierzętami i taka jest nasza natura: zabij albo zgiń!"
generic_increase_the_conscription: "Zwiększony pobór"
generic_increase_the_conscription_desc: "Praktycznie każdy chce, żebyśmy zjednoczyli region, ale niemal nikt nie jest gotów za to walczyć i umierać. Nie ma zwycięstwa bez ofiar, więc jeśli ofiara nie wybierze się sama, będziemy musieli dokonać wyboru za nią. Na naszych ziemiach wciąż nie brakuje zdrowych młodych chłopaków, których możemy stamtąd wyciągnąć i wcielić do armii. Kto wie, może nawet im się spodoba i z czasem, po zdobyciu odpowiedniego doświadczenia, awansują. A jeśli po drodze coś im się stanie... cóż, w naszej sprawie zawsze znajdzie się miejsce dla kolejnych męczenników."
generic_handpick_the_officers: "Selekcja oficerów"
generic_handpick_the_officers_desc: "Ciało może zdziałać tylko tyle, na ile pozwoli mu kierujący nim mózg - to pewne. Musimy zatem skupić się na wyborze właściwych generałów, zarówno spośród kadr dawnych formacji wojskowych, jak i ponadprzeciętnie wyszkolonych jednostek, którzy poprowadzą naszą armię. Pochłonie to część środków przeznaczonych na szkolenie żołnierzy, ale lepiej mieć kompetentne dowództwo i niekompetentne wojsko niż kompetentne wojsko i niekompetentne dowództwo."
generic_train_our_troops: "Szkolenie żołnierzy"
generic_train_our_troops_desc: "Nasza armia składa się niestety głównie ze zwykłych cywilów, od których oczekuje się teraz, że chwycą za broń, pójdą do boju, a czasem nawet zabiją swoich dawnych sąsiadów. Nie wystarczy im powiedzieć, że albo my, albo oni; musimy nauczyć ich podstaw, zadbać o ich kondycję i gotowość do walki, nauczyć pomagać towarzyszom broni, a nawet przygotować przyszłych dowódców, którzy poprowadzą oddziały ku zwycięstwu. Im lepiej ich wyszkolimy, tym większa szansa, że przeżyją i zwyciężą w starciu z naszymi wrogami! Dobra, panowie, teraz dwa kilometry biegu i czterdzieści pompek, RAZ, RAZ!!!"
generic_homemade_equipment: "Ekwipunek dźwigany codziennie"
generic_homemade_equipment_desc: "To, co niegdyś było Polską, zostało najwyraźniej potwornie rozbrojone i żałośnie przygotowane na zapaść, przez co znaleźliśmy się w beznadziejnej sytuacji z bronią, która ledwie ją przypomina. Zakupy za granicą nie wystarczą; musimy wytwarzać własne wyposażenie, aby zapewnić żołnierzom niezbędne środki obrony. Od dziś każdy kij, nóż kuchenny czy nawet stara wiatrówka zostaną ręcznie przerobione przez pomysłowych majsterkowiczów, którzy będą produkować broń w prowizorycznych warsztatach! Z czasem, im więcej się nauczymy, tym lepsze staną się nasze konstrukcje. Zaczynanie od zera nigdy nie jest łatwe, lecz mały krok naprzód stanowi wielki krok ku przetrwaniu."
generic_guns_and_butter: "Armaty i masło"
generic_guns_and_butter_desc: "Armia maszeruje na żołądkach swoich żołnierzy. Wojsko pozbawione żywności, amunicji i nowej broni nie przetrwa długo w warunkach wojennych, a nawet najlepsi dowódcy, tacy jak Napoleon, nic nie wskórają z armią bez zaopatrzenia. Aby uniknąć scenariuszy spod znaku \"nie mogliśmy zrobić nic\", musimy starannie zaplanować ilość i jakość naszych zapasów. Warto byłoby także rozbudować linie kolejowe i flotę pojazdów zaopatrzeniowych. Jeśli wszystko dobrze rozplanujemy, w niepewnej przyszłości, która czeka nas wszystkich, całość powinna być prosta jak bułka z rzeczonym masłem."
generic_origins_of_the_getarmyname: "[GetLocGenArmyFocus]"
generic_origins_of_the_getarmyname_desc: "Aby przetrwać nadciągającą burzę, nasz ruch potrzebuje silnej i sprawnej armii. Na szczęście możemy liczyć na determinację najlepszych spośród nas, którzy poniosą płomień w walce z sąsiadami. Prowadzi ich pasja, jakiej nie znajdzie się w pierwszych lepszych narodowych siłach zbrojnych. Kieruje nami ideologiczny zapał. Daje żołnierzom poczucie misji, a zarazem stanowi naukę tworzącą kręgosłup organizacji naszych jednostek. W przyszłości dobrze będzie o tym pamiętać, bo właśnie ten wyjątkowy dar zapewnia nam przewagę nad pozostałymi."
generic_condition_of_the_getname: "[ROOT.GetName]: Kondycja państwa"
generic_condition_of_the_getname_desc: "Spójrzmy prawdzie w oczy: nie jest dobrze. Jest nawet gorzej niż źle, to istne szaleństwo! Za złotówkę można kupić tyle, co za grosz - o ile w ogóle coś więcej niż kawałek sznurka i kopa w dupę - żywnością nie da się oddychać, a powietrza nie da się bezpiecznie jeść. Dlatego, mówiąc kolokwialnie, musimy wziąć się, kurwa, w garść i wymyślić, co zrobić z tym bałaganem. Faktyczne zorganizowanie rządu zdolnego poradzić sobie z obecną sytuacją będzie dobrym pierwszym krokiem. Utworzenie departamentów i ministerstw odpowiedzialnych za istniejące problemy z pewnością pomoże nam stanąć na nogi i przygotować się na kolejne ciosy losu."
generic_meeting_of_the_getrulingparty: "[ROOT.GetRulingParty]: Spotkanie zarządu"
generic_meeting_of_the_getrulingparty_desc: "Nadeszła pora na spotkanie z najważniejszymi postaciami partii. Musimy ustalić, kto za co odpowiada i jak powinniśmy zarządzać państwem w tym okresie chaosu oraz zamętu w naszym regionie. Posiedzenie ma również przygotować grunt pod przyszłość rządu i określić, jakie obietnice złożymy mieszkańcom. Ostatecznie pragniemy też umocnić lojalność partyjną, która pozwoli utrzymać stabilną władzę niezbędną do zachowania kontroli nad krajem. Bez zjednoczonego rządu nie ma nadziei na skupienie obywateli wokół wspólnej sprawy naszego nowego narodu. Jeden za wszystkich, wszyscy za jednego!"
generic_ideological_dogmas_of_getrulingideology: "Nasza ideologia to [ROOT.GetSubideologyText]"
generic_ideological_dogmas_of_getrulingideology_desc: "Mamy idee, które chcemy przekazać przyszłym pokoleniom, ale jak wyrazić nasze marzenia o jej urzeczywistnieniu? Podczas spotkania opowiemy mieszkańcom, jaką przyszłość dla nich planujemy. Jesteśmy przekonani, że nasza idea rozwiąże wszystkie problemy społeczne, gospodarcze i narodowe! To może mały krok dla człowieka, ale wielki skok dla naszego państwa. Idea jest paliwem, które nada nam cel w pozbawionym nadziei świecie."
generic_country_on_the_collision_course: "Państwo na kursie kolizyjnym"
generic_country_on_the_collision_course_desc: "Niestety czasy pokoju nie trwały długo. Napięcia pomiędzy watażkami narastają na bezkresnych obszarach, a nawet w naszym własnym regionie; wojna jest nieunikniona! Musimy więc zadbać o bezpieczeństwo obywateli i przygotować się na każdy scenariusz, inaczej obudzimy się z ręką w nocniku - a tego nikt nie chce! Musimy zdecydowanie przyjąć rzeczywistość taką, jaka jest. Walka o przetrwanie nie skończy się, dopóki ten kraj nie stanie się na powrót całością. Teraz będziemy musieli się bronić. Krwią i potem, odwagą i determinacją, w najmroczniejszej godzinie wspólnie zwyciężymy w tym konflikcie - zjednoczeni!"
generic_improve_the_administration: "Usprawnienie administracji"
generic_improve_the_administration_desc: "Państwo nie może funkcjonować wyłącznie dzięki ideologicznej wizji. Podatki nie zbiorą się same, a dekrety nie zmienią automatycznie w rzeczywistość. Aby sprawnie zarządzać kontrolowanymi ziemiami, musimy stworzyć działającą, wieloszczeblową administrację. Tylko tak udowodnimy, że nie jesteśmy bezmyślnymi zdobywcami, lecz potrafimy przywrócić Polsce porządek. Nic nie daje większej prawowitości niż ustanowienie struktur państwowych, które staną się wzorem dla wszystkich przyszłych terytoriów."
generic_emergency_workshops: "Awaryjne warsztaty"
generic_emergency_workshops_desc: "Sytuacja gospodarcza jest krytyczna! Nasza ekonomia została starta w proch i zamieniona w stertę gruzu wskutek całkowitego rozpadu całej sieci gospodarczej kraju. Skoro świat nas nie uratuje, musimy wziąć sprawy we własne ręce, zanim będzie jeszcze gorzej! Aby cokolwiek wytwarzać, potrzebujemy fabryk, które obecnie są zamknięte lub uszkodzone. A ponieważ w tym skrawku ziemi energia elektryczna jest niezwykle rzadka, najwyższa pora zbudować awaryjne warsztaty produkujące broń i wyposażenie bojowe dla żołnierzy. Bez tego kluczowego fundamentu nasze szanse na przetrwanie są bliskie zeru. To dobry początek stabilnej gospodarki, która zapewni nam przetrwanie!"
generic_scavenging_for_food: "W poszukiwaniu jedzenia"
generic_scavenging_for_food_desc: "Nasz kraj nie znajduje się w najlepszym stanie, a cywile zaczynają głodować i martwić się o przyszłość. Wojna zmusiła wielu ludzi do ucieczki i porzucenia dobytku. Jeżeli nie chcemy, żeby pożarł nas wygłodniały tłum, musimy zacząć szukać żywności. Przeszukamy każdy opuszczony dom, sklep i magazyn w poszukiwaniu choćby okruszka dla naszych rodaków! Jedzenia już teraz brakuje, więc wiara, że w tak trudnym okresie zdołamy nie tylko wyżywić własny kraj, lecz także podzielić się z tymi, którzy mają mniej szczęścia, byłaby jeszcze niedawno czymś niewyobrażalnym."
generic_longing_for_the_energy: "Tęsknota za prądem"
generic_longing_for_the_energy_desc: "Jeżeli nie zamierzamy cofnąć się do epoki przedprzemysłowej, potrzebujemy energii - i to szybko. Niektórzy wrogowie zdążyli już zaopatrzyć się w prowizoryczne generatory, a lepiej nawet nie myśleć o tych, którzy położyli ręce na działającej elektrowni. Jak dotąd mieliśmy znacznie mniej szczęścia. Na tym etapie przyjmiemy cokolwiek, byle nocą świeciły się światła. Jeszcze kilka lat temu żyliśmy w złotym wieku technologii. Dzisiaj świętujemy każde nadal działające urządzenie niczym budzący podziw unikat. Nie możemy pozwolić, by ten stan rzeczy trwał dalej."
generic_patching_the_budget_hole: "Łatanie dziury budżetowej"
generic_patching_the_budget_hole_desc: "Sytuacja finansowa jest, można rzec, w agonii. Kryzys walutowy i gospodarczy, hiperinflacja poprzedzająca zapaść, a wreszcie rozpad Polski sprawiły, że jeśli chcemy cokolwiek zbudować albo kupić, rozpaczliwie potrzebujemy pieniędzy, których dosłownie nie mamy. Zaczniemy więc pobierać podatki od obywateli i szukać sposobów zarobku poprzez sprzedaż lub handel. Przeszukamy każde miejsce, w którym mogą znajdować się pieniądze. A skoro nikt ich nie trzyma, to go wyzyskamy. Nie zamierzamy stać się plemieniem, a państwo bez pieniędzy bankrutuje i przestaje istnieć w szerszym świecie, więc nie mamy wyjścia. Pora na kontrolę skarbową!"
generic_anything_we_have_to_offer: "Wszystko co mamy do zaoferowania"
generic_anything_we_have_to_offer_desc: "Wolny rynek... handel, jak mówią, zawsze rozwiązuje wszystkie problemy, jeśli ma się coś do zaoferowania. Mamy surowce, żywność i pomniejsze skarby, którymi możemy handlować. Jeśli będziemy targować się dobrze i elastycznie, zwiększymy szansę na zysk, a im bogatsi będziemy, tym silniejsze stanie się nasze państwo. Może zdołamy nawet kupić sobie czas na przygotowanie się do najgorszego? Handel może zbudować nam przyszłość, ale musimy podejść do niego sprytnie; inaczej pożre nas niewidzialna ręka rynku albo inni watażkowie, którym poszło lepiej. Rzućmy monetą i zobaczmy, jak zakończy się ten gambit..."
generic_anything_we_can_dig_out: "Cokolwiek możemy wykopać"
generic_anything_we_can_dig_out_desc: "W świecie, w którym każdy ma ten sam cel co my, nie ma sensu handlować z watażkami pragnącymi jedynie nas podbić! Musimy zabezpieczyć przyszłość, wydobywając jak najwięcej surowców, szabrując wszelki złom i śmieci oraz zbierając inne niezbędne materiały potrzebne do jakiejkolwiek produkcji. Im więcej z nich zatrzymamy, tym więcej zdołamy wytworzyć i tym lepiej przygotujemy się na każdy scenariusz, jaki może nas spotkać. Pora kopać, ile się da, bo inaczej świat wykopie nam grób!"
generic_semblances_of_economy: "Zalążki gospodarki"
generic_semblances_of_economy_desc: "Najgorsze już za nami... Zbudowaliśmy coś, co z daleka przypomina gospodarkę. Osiągamy mizerne zyski i pozyskujemy potrzebną energię, żywność oraz surowce. Przyszłość przyniesie jednak wiele kolejnych wyzwań, do których będziemy musieli się przystosować. Choć nasza gospodarka nadal pozostawia wiele do życzenia, powoli wkraczamy na właściwą drogę ku poprawie sytuacji. Musimy tylko dobrze rozegrać posiadane karty i zabrać się do pracy. Cierpliwość i sumienność nigdy nikomu nie zaszkodziły."
generic_calm_before_the_storm: "Cisza przed burzą"
generic_calm_before_the_storm_desc: "Wszystko jest gotowe, przygotowaliśmy się na najgorsze; teraz panuje cisza niczym przed burzą. Zwykle należałoby cieszyć się czasem spokoju, lecz na tym właśnie polega jego wada. Musimy zachować czujność na każdą ewentualność, inaczej nasza walka może skończyć się, zanim w ogóle się zacznie. Wrogowie czają się wszędzie wokół, a każdy ma własne plany i knowania, więc i my musimy je mieć. Zaczekajmy na właściwy moment do ataku - te drobne nawyki i przygotowania mogą przesądzić o naszym przetrwaniu."
generic_heirs_of_the_nation: "Spadkobiercy narodu"
generic_heirs_of_the_nation_desc: "Czas rozliczeń stanął u naszych bram! Musimy walczyć za kraj tak, jak przed nami walczyli nasi przodkowie. Będziemy walczyć do samego końca, aż zwycięstwo znajdzie się w naszych rękach! Stoimy na rozdrożu naszej egzystencji. To, czy przetrwamy, zależy od każdego człowieka; od niego zależy los każdego obywatela, jego rodziny i marzeń! Nie pytajcie, co kraj może zrobić dla was - pytajcie, co wy możecie zrobić dla kraju! Od was, współobywatele, zależy, czy spełnimy marzenie o lepszym narodzie dla nas samych i przyszłych pokoleń!"
generic_supply_caches: "Skrytki z zapasami"
generic_supply_caches_desc: "Zaopatrzenie jest nieodzownym elementem wojny. Bez niego zwycięstwo jest niemożliwe, choćby nasza armia była najnowocześniejsza na świecie. Nie powinniśmy powtarzać błędów poprzednich konfliktów. W tak krytycznej chwili musimy więc zadbać o żołnierzy. Potrzebujemy w regionie punktów zaopatrzeniowych, w których uzupełnią najważniejsze zapasy: broń, amunicję, paliwo i żywność. Skoro wciąż mamy działające fabryki oraz chętnych robotników, wykorzystajmy ich do tego przedsięwzięcia, zanim będzie za późno!"
generic_strike_at_enemy_logistics: "Uderzenia w logistykę wroga"
generic_strike_at_enemy_logistics_desc: "Dobra, chłopaki, czas na akcję rodem wprost z Małego Sabotażu! Nasi wrogowie mają słabe punkty, które musimy wykorzystać. Trzeba sabotować każdy możliwy strategiczny obiekt przeciwnika - im więcej szkód wyrządzimy, tym lepiej! Ta ziemia zna partyzanckie metody. Celów nie brakuje: punkty zaopatrzeniowe, linie kolejowe, drogi i inne kluczowe obiekty. Jeżeli uderzymy dostatecznie wiele razy, wróg może nawet paść na kolana. Łapmy więc bomby, koktajle Mołotowa i pozostałe sprzęty - ruszamy po zwycięstwo!"
generic_cheap_drone_warfare: "Wojna tanich dronów"
generic_cheap_drone_warfare_desc: "Drony stały się przełomową technologią, która odmieniła oblicze wojny, i mimo marudzenia sceptyków są dziś niezwykle przydatne we współczesnych starciach. Poza lataniem, podziwianiem pięknych krajobrazów i podglądaniem sąsiadów można ich używać do infiltracji, zaglądania do obozów wroga, sabotażu oraz nalotów bombowych. Nawet najtańszy dron domowej roboty, złożony w garażu, pomoże uniknąć zasadzek i pułapek. Albo je zastawić. A przy okazji komputerowe świry i zaprawieni gracze strategiczni wreszcie dostaną prawdziwą, ważną robotę... w imię naszego kraju!"
generic_in_search_of_guns: "W poszukiwaniu uzbrojenia"
generic_in_search_of_guns_desc: "Po przeanalizowaniu obecnego położenia i stanu kraju uznaliśmy, że zamiast skupiać wszystkie wysiłki na masowej produkcji, trzeba wyruszyć na poszukiwanie broni. Potrzebujemy jej tyle, ile tylko zdołamy zdobyć. Nawet jeśli będzie to rozwiązanie krótkoterminowe, w razie powodzenia szybko zapewni nam sporą nadwyżkę uzbrojenia. Możemy również wysłać ludzi, by zwyczajnie odebrali broń cywilom. To bardzo ryzykowne posunięcie, ale potencjalna nagroda jest dwukrotnie większa od podejmowanego ryzyka."
generic_tools_of_close_combat: "Narzędzia do walki wręcz"
generic_tools_of_close_combat_desc: "W miarę jak wojna staje się dla naszych ludzi coraz powszechniejsza i bardziej prawdopodobna, musimy uznać, że od walki dystansowej prawdopodobnie ważniejsza jest walka w zwarciu. Obecnie nasi żołnierze używają głównie wszystkiego, co tylko zdołają podnieść i wykorzystać jako broń białą. Z tego powodu zdolności armii w walce wręcz są... dalekie od zadowalających. Rozpoczniemy więc poszukiwania, próbując zdobyć choć kilka jednolitych rodzajów broni białej dla całego wojska, a następnie wyszkolimy żołnierzy w starciach na bliski dystans."
generic_support_equipment_for_troops: "Sprzęt wsparcia dla żołnierzy"
generic_support_equipment_for_troops_desc: "Bez żadnego wsparcia nasze oddziały rozpadłyby się niezależnie od okoliczności. Musimy dostarczyć im pod dostatkiem wyposażenia wsparcia, aby nie doszło do tego podczas żadnego starcia. Choćby chodziło o drobnostki, potrzebujemy sprzętu dla żołnierzy służących w wyspecjalizowanych formacjach, takich jak korpus inżynieryjny, zwiadowczy, a nawet niektóre oddziały bojowe, na przykład miotacze ognia."
generic_seize_civilian_vehicles: "Rekwirowanie cywilnych pojazdów"
ggeneric_seize_civilian_vehicles_desc: "Choć nie będzie to popularne posunięcie, musimy utrzymać państwo przy życiu. Wojsko potrzebuje samochodów - czy to do zadań zaopatrzeniowych, czy też do wykorzystania podczas ataku albo obrony. Musimy jednak zachować pewne standardy dotyczące jakości przejmowanych pojazdów, bo Mini Cooper nie ma dla nas żadnej wartości, ani pod względem rozmiaru, ani wytrzymałości. Może to ograniczyć liczbę zdobytych samochodów, ale trzeba utrzymać i bezwzględnie egzekwować normy, aby chronić życie ludzi, którzy będą siedzieć w środku - niezależnie od tego, czy obsługują broń, czy prowadzą."
generic_expanding_the_capital: "Plan rozbudowy miasta [ROOT.Capital.GetName]"
generic_expanding_the_capital_desc: "Ah, [ROOT.Capital.GetName]. Serce naszego narodu i siedziba najcenniejszych, napawających nas dumą instytucji... jest również stosunkowo niewielka i zniszczona wskutek Upadku. Jeżeli chcemy mieć choć cień szansy na zjednoczenie regionu, musimy stolicę rozbudować, by zwiększyć jej bezpieczeństwo, produktywność i zdolności obronne. W końcu żadne środki nie są przesadne, gdy chodzi o ochronę naszych przywódców - ludzi, którzy kochają naród najbardziej!"
generic_reconnecting_the_railways: "Przyłączanie kolei do sieci"
generic_reconnecting_the_railways_desc: "Sieć kolejowa PKP została doszczętnie zniszczona. Kolej zawsze - a właściwie tak długo, jak istnieje - była podstawą logistyki wojskowej, dlatego odbudowa uszkodzonej infrastruktury musi stać się priorytetem! W końcu armia maszeruje na żołądkach swoich żołnierzy, a żołądki te jadą pociągami pełnym odzyskanych konserw. Ponieważ wiele torów wymaga naprawy, musimy wysłać robotników budowlanych na każdą linię i dopilnować, by żaden pociąg nie doznał niespodziewanych uszkodzeń. Przy okazji może uda się przywrócić kilka nieużywanych tras. A potem w drogę."
generic_repairing_the_crucial_roads: "Naprawa kluczowych węzłów"
generic_repairing_the_crucial_roads_desc: "Autostrady i pozostałe drogi w całym kraju również dotkliwie ucierpiały podczas wojny. Jeżeli chcemy, by nasze armie poruszały się szybko, musimy ponownie połączyć najważniejsze trasy. W przeciwnym razie wrócimy do codzienności naszych przodków i na nowo odkryjemy, po co właściwie wynaleziono drogi: ponieważ toczenie koła albo chodzenie po płaskiej powierzchni jest znacznie łatwiejsze niż po takiej, która, cóż, płaska nie jest. A o próbach przeciśnięcia czegokolwiek przez błotniste grzęzawiska wiejskich traktów lepiej nawet nie zaczynać."
generic_day_of_victory: "Dzień Zwycięstwa"
generic_day_of_victory_desc: "Przygotowaliśmy się najlepiej, jak potrafiliśmy, ufortyfikowaliśmy każdy zakątek, rozstawiliśmy wszystkie siły atakujące i obronne oraz zapewniliśmy im wsparcie. Nasza logistyka jest... co najmniej w porządku, żołnierze podobnie, a sieci wsparcia rozkwitły - przynajmniej do pewnego stopnia. Nadeszła pora: musimy zrobić wszystko, co konieczne, aby przywrócić w regionie porządek - NASZ porządek! Ruszajmy do boju z wrogami, dzielni żołnierze!\nI miejmy nadzieję, że cokolwiek się wydarzy, los będzie nam sprzyjał."
generic_night_of_remembrance: "Chwała poległym"
generic_night_of_remembrance_desc: "Dzięki ofierze dziesiątek, jeśli nie setek tysięcy przodków na przestrzeni historii naszego narodu po największych nawet klęskach zawsze wracaliśmy silniejsi niż kiedykolwiek, by zemścić się na wrogach. Dlatego i teraz raz jeszcze wyruszyliśmy, gotowi poświęcić życie w imię nowego, odrodzonego państwa, które wykroi dla siebie kawałek tego tortu. Nie możemy jednak zapomnieć o tych, którzy oddali życie, aby marzenie wciąż trwało. Niech rozpocznie się Noc Pamięci - noc naszych bohaterów. Póki my żyjemy, oni również będą żyć!"
generic_redefining_our_system: "Przedefiniowanie naszego systemu"
generic_redefining_our_system_desc: "Wreszcie możemy swobodnie wytyczyć kierunek polityczny. Od chwili powstania nasz ruch opierał się na pewnej ideologicznej obietnicy. Łatwo jednak śnić wielkie sny, gdy ich spełnienie pozostaje daleko. Teraz, kiedy pewnie dzierżymy władzę, czeka nas wiele trudnych decyzji. Czy stać nas na realizację wszystkich ambicji politycznych, czy będziemy zmuszeni uciec się do pragmatyzmu? Stonujemy retorykę czy jeszcze ją zaostrzymy? Czy wyobrażone przez nas państwo w ogóle może sprawnie funkcjonować? Dokonane teraz wybory na zawsze określą nasz system."
generic_begin_the_reforms: "Rozpoczęcie reform"
generic_begin_the_reforms_desc: "Najwyższa pora określić naszą politykę wewnętrzną. Grupy interesu wywierają silną presję, byśmy ponownie potwierdzili przywiązanie do ich ulubionych rozwiązań, podczas gdy lud niecierpliwie czeka na realizację naszych programów. Mamy tylko jedną szansę, by zrobić to dobrze. Nie ma mowy o odwrocie. Wszyscy oczekują rezultatów, a jeśli zboczymy z przewidywanego kursu, szybko utracimy całą wiarygodność, którą dotychczas zbudowaliśmy. Być może jednak sytuacja będzie tego wymagać."
generic_securing_our_industry: "Zabezpieczenie przemysłu"
generic_securing_our_industry_desc: "Gospodarka jest fundamentem każdego zdrowego państwa, dlatego musimy ożywić przemysł, który poważnie ucierpiał wskutek długiej wojny domowej. Przede wszystkim będziemy musieli zaspokoić potrzeby wewnętrzne, lecz odbudowa gałęzi zdolnych do eksportu może pomóc nam zdobyć międzynarodowe uznanie. W związku z tym uruchomiono nowy projekt industrializacji obejmujący dziesiątki przedsięwzięć oraz tysiące robotników. To nowa rewolucja przemysłowa, którą sprowadzimy na te zapomniane ziemie."
