l_polish:
 ## Generic Events ##
unification_generic.1.t: "[GetNewspaper][FROM.GetName] zdobywa władzę w województwie!"
unification_generic.1.desc: "Dzięki przebiegłym intrygom i błyskawicznym podbojom militarnym, [FROM.GetName] zajmuje obecnie pozycję potęgi regionalnej. Niegdyś otoczone przez wrogów, podporządkowało sobie i zjednoczyło ziemie oraz ludność miejscowego województwa. Umocniwszy władzę nad terytoriami otaczającymi ich matecznik, mieszkańcy tego kraju spoglądają teraz dalej, poza własne granice, podczas gdy ich sztab wojskowy kreśli nowe plany wojenne. Tylko przyszłość pokaże, czy Polska doczekała się nowego kandydata do zjednoczenia, czy był to zaledwie szczęśliwy traf."
unification_generic.1.a: "Dobrze dla nich."

unificationreg_generic.1.t: "[GetNewspaper][FROM.GetName] zdobywa władzę w regionie!"
unificationreg_generic.1.desc: "Po zjednoczeniu własnego województwa [FROM.GetName] nadal rośnie w siłę na obszarze całego regionu. Miasto po mieście, powiat po powiecie padają przed nadciągającymi armiami. [FROM.GetLeader] zapewnia, że nie jest to kwestia ślepego trafu, i obiecuje, iż mieszkańcy jego państwa są predestynowani do wielkości, a wizja dostatniego życia w zjednoczonej Polsce zaczyna nabierać realnych kształtów. Wojsko i gospodarka państwa puchną dzięki kolejnym podbojom, zaś obietnica nadchodzącego zjednoczenia powoli zdaje się zmieniać w rzeczywistość."
unificationreg_generic.1.a: "Interesujące."

unificationsupreg_generic.1.t: "[GetNewspaper][FROM.GetName] nowym kandydatem do zjednoczenia!"
unificationsupreg_generic.1.desc: "Stojąc dumnie pośród pokonanych przeciwników i pogrzebanych wraz z nimi przekonań, [FROM.GetName] zajmuje pozycję kandydata do zjednoczenia. [FROM.GetLeader] wyraża swoje ambicje jasno i wyraźnie zajmując znaczną część przedupadkowego terytorium Polski - dysponując armią silniejszą niż kiedykolwiek wcześniej i zapleczem, którego dobrobyt oraz jedność dorównują Polsce sprzed Upadku, mieszkańcy wydają się pewni, że ostateczne zwycięstwo jest tuż za rogiem. Rosnąca legitymizacja rządu pod przewodnictwem ich lidera tylko umacnia tę pewność, szerzącą się wśród zwykłych obywateli. Nadchodzące miesiące pokażą, czy jest ona mylna, czy też marzenia o zjednoczonej Polsce nie pozostaną już długo jedynie wyobrażeniami."
unificationsupreg_generic.1.a: "Niepokojące."

super_generic.1.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_generic.1.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super_generic.1.a: "Wreszcie zjednoczeni."

paf_generic.1.t: "Pycha kroczy przed Upadkiem"
paf_generic.1.desc: "Minęły dwa lata odkąd rozpoczął się Upadek. Dwa lata ciężkich zmagań, trudów i wiecznych batalii z zagrożeniami nadchodzącymi z zewnątrz i tymi z wewnątrz. Pomimo wszystko, nadal tu jesteśmy. Nasz naród nadal jest cały, nasz lud wciąż zjednoczony (jakkolwiek w malutkich formach). Na początku był szok, a dopiero potem nastał chaos który ustąpił miejsca walce o przeżycie. Nadchodzące lata nie będą łatwe - Europejski reżim na zachodzie nie jest tak silny i stabilny jakby się mogło wydawać, a inne obce państwa łypią łapczywym okiem na ziemie Polskiej Anarchii. Będziemy musieli zająć się podstawami - jedzeniem, schronieniem, bezpieczeństwem naszych ludzi. Zapasów jest niewiele a infrastruktura w obecnym stanie nie stanowi żadnego oparcia. Jeżeli coś się wydarzy, coś co zburzyłoby obecnie panujący status quo - kruchy pokój pomiędzy watażkami się rozpadnie i wszyscy rzucą się sobie do gardeł. Musimy zachować czujność, bo w tych czasach nigdy nie wiadomo skąd nadejdzie zagrożenie. Ale jedno jest pewne - nadejdzie. Musimy być przygotowani."
paf_generic.1.a: "Nigdy nie padnie! Ten kraj nigdy nie padnie!"
paf_generic.2.t: "Masowy sabotaż!"
paf_generic.2.desc: "Nasze systemy padły ofiarą sabotażu z zewnątrz! Zakłady produkcyjne stanęły w płomieniach, linie zaopatrzeniowe są odcięte a komunikacja zakłócona. Ktokolwiek za tym stoi, usiłuje osłabić nas od środka. To jest poważne zagrożenie dla naszego dalszego bytowania, dlatego musimy znaleźć i wyeliminować tych sabotażystów zanim uda im się wyrządzić więcej szkód. Należy wzmocnić środki bezpieczeństwa, przeprowadzić dogłębne śledztwa i wykorzenić wszystkich którzy pracują na naszą zgubę. Jest to niewątpliwie czas kryzysowy i nie możemy sobie pozwolić na słabość - gdyż nasi wrogowie chcą ją wykorzystać. Nie pozwolimy im na to! Stańmy silni ramię w ramię w obliczu tego kryzysu!"
paf_generic.2.a: "Przeszukać wszystko!"
paf_generic.3.t: "Powrót do szkoły"
paf_generic.3.desc: "Ucz się ucz, bo nauka to do potęgi klucz. Edukacja zawsze była podstawą każdego porządnie funkcjonującego społeczeństwa. Może i troszkę o tym zapomnieliśmy pośród całego tego chaosu związanego z Upadkiem, ale teraz jest chwila na to by sobie to wszystko przypomnieć. Bo nie chodzi tylko o to by nasze dzieci nauczyć czytać i pisać. Fundamenty muszą być i nie ma tu żadnej dyskusji. Ale musimy zacząć ich uczyć także krytycznego myślenia, rozwiązywania problemów i kreatywności. Musimy przygotować ich na wyzwania które niesie ze sobą przyszłość, jakiekolwiek one nie będą. To właśnie dlatego ponowne otwarcie uniwersytetów i placówek badawczych jest niezbędne. Musimy zainwestować w naszą przyszłość, a możemy to tylko zrobić inwestując w edukację. Celem życia nie jest przeżycie dzisiejszego dnia, lecz sprawienie że jutro będzie lepiej. Edukacja musi być priorytetem - jesteśmy winni to samym sobie, a przede wszystkim przyszłym pokoleniom. I miejmy nadzieję, że studenci nie będą musieli być zmuszani do brania pożyczek by za edukację zapłacić. Bo to by po prostu było smutne."
paf_generic.3.a: "Będzie może e-learning?"
paf_generic.4.t: "Granty dla najlepszych"
paf_generic.4.desc: "Czymże jest przyszłość kraju bez dreszczyku emocji związanego z odkryciami? Znaczy się, nikt raczej by nie odkrył koła jeśli nie byliby kierowani ciekawością i chęcią poznania otaczającego nas świata. Chociaż z tego co wiadomo, zanim zrobiono koło, tych samych kamieni używano do zabijania innych ludzi. Ale to tylko dygresja. Najnowocześniejsze technologie! To brzmi wspaniale, prawda? Na przykład - wyobraźcie sobie, że udałoby nam się wynaleźć nowe techniki rolnictwa które pozwalałyby nam na zwiększenie naszych plonów przy oszczędności miejsca i wody. Albo...coś mniej nudnego - coś eksplodującego! Ale w taki nowy, ekscytujący sposób! Albo...latający czołg! Albo...łódź podwodna którą możemy polecieć w kosmos! Czekaj, chwila. KOSMOS! TAK! Nowe planety, nowe surowce, nowe odkrycia! Proszę, możemy polecieć w kosmos? Albo po prostu wybijemy dziurę w czasoprzestrzennym kontinuum i przywołamy przedwieczne kosmiczne koszmary. Ale to wiadomo, w najgorszym przypadku, prawda? Prawda. W najlepszym natomiast, uda nam się wydostać z tej symulacji, znaleźć tego cwaniaka który to czyta i sprawić żeby nie zapominał o klikaniu nowych badań!"
paf_generic.4.a: "*dźwięk 500 powiadomień o możliwości prowadzeniu nowych badań*"
paf_generic.5.t: "Zostaliśmy uznani przez Organizację Narodów Zjednoczonych!"
paf_generic.5.desc: "[ROOT.GetName] świętuje! Od dzisiaj, staliśmy się częścią międzynarodowej społeczności! Zostaliśmy uznani jako prawomocny głos na arenie międzynarodowej przez ONZ, który to w swojej nieskończonej łaskawości, zadecydował że jesteśmy godni miana legitymistycznych reprezentantów rządów ziem Polski. Otwiera to nam wiele nowych możliwości, oraz będzie potężnym symbolem w walce ze wszystkimi nieuznawanymi państewkami które tutaj pozostały i uzurpują sobie władzę do tych ziem. Już nawet nie wspominam o tej cudownej, wspaniałej pomocy humanitarnej która tu przybędzie...i z pewnością trafi do potrzebujących, tak!"
paf_generic.5.a: "Czy ONZ nie jest minionych czasów reliktem?"
paf_generic.6.t: "Przestaliśmy być uznawani przez Organizację Narodów Zjednoczonych!"
paf_generic.6.desc: "Szatańscy władcy świata zadecydowali że nie jesteśmy dłużej godni bycia częścią międzynarodowej społeczności. Po krótkim okresie w którym byliśmy uznawani, teraz już okazało się że nasz status został cofnięty i wyrzucony do kosza. Powód? Nasz rząd złamał jakieś z góry ustalone standardy wymagane do uznania przez ONZ. Jest to ogromny cios wymierzony w nasze państwo. [ROOT.GetName] i cały naród są w żałobie. A tak naprawdę...to nie, bo nie obchodzi nas ich zdanie ani trochę! Kim oni są, że śmią nas osądzać? Oni mogą mieć swoje standardy, my mamy naszą potęgę i rację! Ale nie zamierzamy zniechęcić się tym niepowodzeniem, będziemy dalej walczyć o nasze prawo do władania tymi ziemiami, i nie spoczniemy dopóki tego celu nie osiągniemy. I ONZ nie ma nic do powiedzenia w tym temacie. Poza tym - i tak nic nie zrobią, jak zwykle. Do diabła z nimi!"
paf_generic.6.a: "Co? Dlaczego? To oburzające!"
paf_generic.7.t: "Nasza petycja o uznanie została odrzucona przez ONZ"
paf_generic.7.desc: "Organizacja Narodów Zjednoczonych to banda żądnych władzy biurokratów! Odrzucili naszą petycję o uznanie, argumentując że nie spełniamy ich wyimaginowanych norm do bycia uznawanym krajem. To policzek w twarz dla każdego obywatela naszego kraju, gdzie każdy z nich niestrudzenie pracował na rzecz odbudowy naszego narodu z pogorzeliska jakie zostawił Upadek! Ale nie zamierzamy zniechęcić się tym niepowodzeniem, będziemy dalej walczyć o nasze prawo do władania tymi ziemiami, i nie spoczniemy dopóki tego celu nie osiągniemy. ONZ myśli że może nas ignorować ale się srogo mylą. Nasze głosy zostaną wysłuchane i nie spoczniemy dopóki nie będziemy uznani jako prawowici członkowie międzynarodowej społeczności."
paf_generic.7.a: "Błękitny Antychryst kontratakuje."
paf_generic.8.t: "W stronę słońca"
paf_generic.8.desc: "- To się źle skończy - pomyślał pilot. Widział, jak zakończył się lot próbny, zanim jeszcze na dobre się zaczął. Kulą ognia. Teraz wszystko mogło skończyć się tak samo, tyle że zamiast manekina to on siedział w kokpicie, w skafandrze kosmicznym i z całym tym majdanem. Baranek ofiarny megalomana, który panował nad nim i jego towarzyszami.\n- Przynajmniej tam, na górze, będę wolny od cudzej władzy.\nPróbował po kolei przypomnieć sobie wszystkie argumenty, którymi jajogłowi usiłowali go uspokoić. Na każdy z nich znajdował jednak własną odpowiedź.\n- Jesteśmy jakieś 6 stopni na północ od Bajkonuru i 23 stopnie na północ od przylądka Canaveral! - przypomniał sobie jeden ze swoich wybuchów. - I wiem, że tak właśnie rozpoczął się wyścig kosmiczny, ale fakt, że projektują to specjaliści od broni, których rakiety mają trafiać w cel i eksplodować, nie napawa mnie spokojem.\nNawet jeśli wszystko pójdzie dobrze, ominą go wszystkie przyjemności, takie jak lądowanie na ciele niebieskim, żeby uszczknąć gram gruntu. Nie, jego zadaniem było „konsekwentne kontynuowanie programu”. To znaczyło, że całe przedsięwzięcie stanowi jedną wielką propagandówkę. Przynajmniej cel był prosty. Przebić się przez atmosferę, a potem opaść na spadochronach.\n- Minuta do startu - oznajmił głos z głośnika.\nSpojrzał na panel sterowania, przypominając sobie, które lampki sygnalizują niebezpieczeństwo. Dłużej zatrzymał wzrok na zdjęciu żony. Robił to wszystko dla niej. Pieniądze zarobione na tym jednym numerze miały raz na zawsze uwolnić ich od zmartwień.\n- 10... 9... 8... 7... 6... 5... 4... 3... 2...\nNie było już odwrotu.\n1...\nSilnik ryknął, a zaciski startowe puściły. Zanim pilot zdążył się zorientować, był już ponad chmurami. Nacisnął przycisk odrzucający dolny człon silnika wraz z pustym zbiornikiem. Żadnego ognia, żadnych turbulencji, żadnej zablokowanej elektroniki. Tylko równy lot statku kosmicznego, który z każdym odrzuconym członem stawał się coraz mniejszy, by jak najskuteczniej wykorzystać ciąg. Wkrótce został już tylko w kapsule, która nie mogła bardziej przyspieszyć. Ale to wystarczyło. Przeleciał ponad wszystkimi warstwami atmosfery. Właściwie dotarł dalej, niż zakładano. Był w kosmosie i dopiero teraz zrozumiał, jaka trafiła mu się okazja.\n- Wychodzę przez właz - oznajmił kontroli naziemnej.\nWyszedł na zewnątrz i spojrzał na Ziemię. Zrobił zdjęcie planety. Stąd nie było widać granic na mapie. Ani wojen domowych. Wątpił jednak, by większość jego rodaków naszła ta sama refleksja."
paf_generic.8.a: "Pewnie uznają, że pora podbić również kosmos"


paf_generic.9.t: "Zbawcy"
paf_generic.9.desc: "Nasz kraj w końcu odnalazł to czego szukał. Pokój. Zrobił to z twoją pomocą. Poprowadziłeś nas przez najciemniejsze doliny tego piekła. Teraz, w końcu możemy odpocząć. Watażkowie zostali pokonani, zagrożenia wewnętrzne stłumione, a ludzie w końcu mogą odetchnąć z ulgą. Zawdzięczamy to Tobie. Twojemu przywództwu, twojej wizji, twojej niezłomnej dedykacji dla naszej sprawy - te rzeczy doprowadziły nas tu gdzie jesteśmy. W końcu możemy patrzeć w przyszłość z nadzieją i optymizmem, gdyż wiemy że mamy twardą skałę na której możemy zbudować nasz raj. Dziękujęmy za to, że byłeś naszym zbawcą, światłem w ciemności. Oczywiście, czas pokaże czy faktycznie nim byłeś. A może jesteś tylko kolejnym politykiem który doprowadzi nas do upadku? Ale nie martw się tym teraz. Usiądź, proszę. Posłuchaj muzyki i naciesz się tym co osiągnąłęś. Czy jest to dobre? Mamy taką nadzieję. A my? Kim jesteśmy? Nie przejmuj się. Jesteśmy tu tylko po to żeby upewnić się że rozumiesz konsekwencje swoich czynów. W końcu, to ty jesteś tym który nas tu zaprowadził poprzez swoje decyzje. Więc, po raz kolejny - dziękuję za wszystko co dla nas zrobiłeś. Nigdy tego nie zapomnimy."
paf_generic.9.a: "Możesz w końcu odpocząć. Zrobiłeś co mogłeś."

######################
###      IDEAS     ###
######################

generic_increase_the_conscription_idea: "Zwiększony pobór"
generic_increase_the_conscription_idea_desc: "Jeżeli chcemy mieć armię, potrzebujemy ludzi gotowych poświęcić się dla ojczyzny. Zawsze znajdą się chętni i niechętni, lecz do jednych i drugich możemy dotrzeć, odwołując się do przetrwania ich rodzin oraz naszego kraju. Rozpoczniemy więc kampanię mobilizacyjną wśród wszystkich, którzy mogą przydać się w walce. A kto nie walczy, niech pracuje; bez wzajemnej współpracy nasze państwo długo nie przetrwa. Czasem przekonamy ich słowem, czasem siłą, ale jest to konieczne, jeśli chcemy doczekać jutra. Nasi przodkowie, którzy również walczyli, chcieliby, abyśmy wykazali się bohaterstwem podczas upadku naszego narodu."
generic_handpicked_officers_idea: "Selekcja oficerska"
generic_handpicked_officers_idea_desc: "Armia owiec dowodzona przez lwy zawsze pokona armię lwów dowodzoną przez owce. Musimy zatem skupić się na wyborze właściwych generałów - zarówno spośród kadr dawnych formacji wojskowych, jak i ponadprzeciętnie wyszkolonych jednostek - którzy poprowadzą naszą armię. Pochłonie to część środków przeznaczonych na szkolenie żołnierzy, ale lepiej mieć kompetentne dowództwo i niekompetentne wojsko niż kompetentne wojsko i niekompetentne dowództwo."
generic_troop_training_focus_idea: "Nacisk na szkolenie żołnierzy"
generic_troop_training_focus_idea_desc: "Nasza armia składa się niestety głównie ze zwykłych cywilów, od których oczekuje się teraz, że chwycą za broń, pójdą do boju, a czasem nawet zabiją swoich dawnych sąsiadów. Nie wystarczy im powiedzieć, że albo my, albo oni; musimy nauczyć ich podstaw, zadbać o ich kondycję i gotowość do walki, nauczyć pomagać towarzyszom broni, a nawet przygotować przyszłych dowódców, którzy poprowadzą oddziały ku zwycięstwu. Im lepiej ich wyszkolimy, tym większa szansa, że przeżyją i zwyciężą w starciu z naszymi wrogami! Dobra, panowie, teraz dwa kilometry biegu i czterdzieści pompek, RAZ, RAZ!!!"
generic_guns_and_butter_idea: "Armaty i masło"
generic_guns_and_butter_idea_desc: "Armia maszeruje na żołądkach swoich żołnierzy. Wojsko pozbawione żywności, amunicji i nowej broni nie przetrwa długo w warunkach wojennych, a nawet najlepsi dowódcy, tacy jak Napoleon, nic nie wskórają z armią bez zaopatrzenia. Aby uniknąć scenariuszy spod znaku \"nie mogliśmy zrobić nic\", musimy starannie zaplanować ilość i jakość naszych zapasów. Warto byłoby także rozbudować linie kolejowe i flotę pojazdów zaopatrzeniowych. Jeśli wszystko dobrze rozplanujemy, w niepewnej przyszłości, która czeka nas wszystkich, całość powinna być prosta jak bułka z rzeczonym masłem."
generic_guns_and_butter_1_idea: "Armaty i masło"
generic_guns_and_butter_1_idea_desc: "Armia maszeruje na żołądkach swoich żołnierzy. Wojsko pozbawione żywności, amunicji i nowej broni nie przetrwa długo w warunkach wojennych, a nawet najlepsi dowódcy, tacy jak Napoleon, nic nie wskórają z armią bez zaopatrzenia. Aby uniknąć scenariuszy spod znaku \"nie mogliśmy zrobić nic\", musimy starannie zaplanować ilość i jakość naszych zapasów. Warto byłoby także rozbudować linie kolejowe i flotę pojazdów zaopatrzeniowych. Jeśli wszystko dobrze rozplanujemy, w niepewnej przyszłości, która czeka nas wszystkich, całość powinna być prosta jak bułka z rzeczonym masłem."
generic_army_origin_marx_idea: "Historia Armii Czerwonej"
generic_army_origin_marx_idea_desc: "Nasza armia narodziła się z popiołów starego świata, wykuta w ogniu rewolucji i walki. Stanowi świadectwo odporności oraz determinacji naszego ludu, który nie pozwolił, by pochłaniający nas chaos go złamał. Nasi żołnierze nie są tylko wojownikami; ucieleśniają nasze ideały i stoją na straży nowego porządku, który pragniemy zbudować. Historia naszej armii to opowieść o poświęceniu, jedności i niezachwianym oddaniu sprawie proletariatu."
generic_army_origin_squat_idea: "Historia Armii Ludowej"
generic_army_origin_squat_idea_desc: "Nasza armia jest odbiciem ludu, któremu służy, i wyrosła z oddolnych ruchów powstałych po rozpadzie społeczeństwa. Zbudowano ją na zasadach solidarności i wzajemnej pomocy, dzięki czemu każdy żołnierz jest nie tylko wojownikiem, lecz także przedstawicielem społeczności, których broni. Historia naszej armii to historia wytrwałości i zdolności przystosowania się do realiów rozbitego świata bez porzucania zobowiązań wobec ludu."
generic_army_origin_socdem_idea: "Historia Armii Społecznej"
generic_army_origin_socdem_idea_desc: "Nasza armia jest symbolem socjaldemokratycznych ideałów, które wskazują drogę naszemu państwu. To siła oddana ochronie praw i wolności wszystkich obywateli, czuwająca nad tym, by nasze społeczeństwo pozostało sprawiedliwe i równe. Historia wojska splata się z walką o sprawiedliwość społeczną i równość, gdyż stawaliśmy w obronie zasad leżących u podstaw naszej demokracji. Nasi żołnierze nie są tylko wojownikami; są obrońcami ludu, zaangażowanymi w budowę lepszej przyszłości dla wszystkich."
generic_army_origin_euro_idea: "Historia Armii Demokratycznej"
generic_army_origin_euro_idea_desc: "Nasza armia jest ostoją demokracji w świecie pogrążonym w chaosie. Stoi na straży wolności, sprawiedliwości i praw człowieka, broniąc zasad stanowiących fundament naszego społeczeństwa. Historia wojska świadczy o niezłomności demokratycznych ideałów, o które walczyliśmy przeciwko tym, którzy pragnęli podważyć nasz sposób życia. Nasi żołnierze nie są tylko obrońcami narodu; są obrońcami samej demokracji."
generic_army_origin_free_idea: "Historia Armii Wolności"
generic_army_origin_free_idea_desc: "Nasza armia jest symbolem wolności i niepodległości, zrodzonym z pragnienia ludu, by samemu decydować o własnym losie. Walczy o prawo jednostek i społeczności do życia wolnego od ucisku oraz tyranii. Historia naszego wojska to opowieść o odwadze i determinacji, z jaką przeciwstawialiśmy się tym, którzy chcieli narzucić nam swoją wolę. Nasi żołnierze nie są tylko wojownikami; są obrońcami wolności, oddanymi sprawie zwycięstwa wolności na naszej ziemi."
generic_army_origin_patcon_idea: "Historia Armii Patriotycznej"
generic_army_origin_patcon_idea_desc: "Nasza armia stanowi odbicie głębokiej miłości do ojczyzny i niezachwianego oddania jej obronie. Ucieleśnia ducha patriotyzmu, będąc szańcem przeciwko tym, którzy zagrażają suwerenności oraz sposobowi życia naszego narodu. Historia wojska to dzieje poświęcenia i męstwa w obronie wartości i tradycji określających nas jako lud. Nasi żołnierze nie są tylko wojownikami; są patriotami, którzy strzegą dziedzictwa narodu dla przyszłych pokoleń."
generic_army_origin_auth_idea: "Historia Armii Państwowej"
generic_army_origin_auth_idea_desc: "Nasza armia ucieleśnia władzę i potęgę państwa, strzegąc porządku oraz stabilności w świecie pełnym chaosu. Stoi na straży prawa i broni interesów narodu przed zagrożeniami wewnętrznymi i zewnętrznymi. Historia wojska to dzieje dyscypliny i lojalności, dzięki którym trwaliśmy niewzruszenie w obliczu przeciwności, chroniąc suwerenność państwa. Nasi żołnierze nie są jedynie egzekutorami woli władzy; są obrońcami państwa, oddanymi utrzymaniu porządku i bezpieczeństwa wszystkich obywateli."
generic_army_origin_corpo_idea: "Historia Armii Korporacyjnej"
generic_army_origin_corpo_idea_desc: "Nasza armia odzwierciedla interesy korporacyjne napędzające państwo i służy jako narzędzie ochrony oraz realizacji celów elity gospodarczej. Działa skutecznie i precyzyjnie, wykorzystując najnowocześniejsze technologie i taktykę do osiągania wyznaczonych zadań. Historia wojska to dzieje innowacji i zdolności przystosowania, dzięki którym nowe strategie oraz technologie pozwoliły nam zachować przewagę nad konkurencją. Nasi żołnierze nie są tylko wojownikami; są przedstawicielami korporacyjnej potęgi, zabezpieczającymi interesy gospodarczych udziałowców naszego państwa."
generic_army_origin_neonat_idea: "Historia Armii Narodowej"
generic_army_origin_neonat_idea_desc: "Nasza armia jest symbolem dumy i tożsamości narodowej, zrodzonym z pragnienia ludu, by potwierdzić własną suwerenność oraz niepodległość. Ucieleśnia ducha nacjonalizmu, stojąc na straży kultury, tradycji i wartości naszego narodu. Historia wojska to dzieje wytrwałości i determinacji w obronie ojczyzny przed tymi, którzy usiłowali ją podważyć. Nasi żołnierze nie są tylko wojownikami; są patriotami, strzegącymi dziedzictwa narodu dla przyszłych pokoleń."
generic_army_origin_react_idea: "Historia Armii Wyzwoleńczej"
generic_army_origin_react_idea_desc: "Nasza armia jest odbiciem najwyższego autorytetu i dostojeństwa, stojąc na straży interesów władcy oraz narodowych tradycji. Kieruje się wartościami lojalności, honoru i obowiązku, będąc szańcem przeciwko tym, którzy zagrażają stabilności naszego władztwa. Historia wojska to dzieje męstwa i poświęcenia w obronie krainy oraz jej mieszkańców. Nasi żołnierze nie są tylko obrońcami; są czempionami przywódców, oddanymi zachowaniu spuścizny naszego dziedzictwa."
generic_army_origin_postpol_idea: "Historia Armii Prawdy"
generic_army_origin_postpol_idea_desc: "Nasza armia stoi ponad ideologiami i jednoczy wszystkich obywateli niezależnie od ich przekonań. Ucieleśnia zasady jedności, wytrwałości i zdolności przystosowania, broniąc suwerenności naszego narodu oraz jego sposobu życia. Historia wojska to dzieje pragmatyzmu i determinacji w ochronie ojczyzny przed tymi, którzy pragnęli ją podważyć. Nasi żołnierze nie są tylko wojownikami; są obrońcami przyszłości, oddanymi zachowaniu dziedzictwa naszego ludu przez następne pokolenia."

generic_restarting_eco_idea_1: "Restart gospodarki"
generic_restarting_eco_idea_1_desc: "Upadek obrócił naszą gospodarkę w ruinę: infrastruktura legła w gruzach, łańcuchy dostaw zostały zerwane, a ludność z trudem zaspokaja podstawowe potrzeby. Aby odbudować gospodarkę, musimy ożywić kluczowe branże, inwestować w projekty infrastrukturalne oraz tworzyć warunki sprzyjające przedsiębiorczości i innowacjom. Stawiając na rolnictwo, przemysł i usługi, stworzymy miejsca pracy, pobudzimy wzrost i położymy fundamenty pod dostatnią przyszłość. Musimy również przywrócić zaufanie do instytucji finansowych i zachęcać do inwestycji krajowych oraz zagranicznych, które napędzą gospodarczą odbudowę."
generic_restarting_eco_idea_2: "Restart gospodarki"
