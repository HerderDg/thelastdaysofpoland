# FOCUS DESCRIPTIONS #

#First descriptions
generic_firstDESC_marxism_cranism_ideology_key: "Wreszcie powstał prawdziwie ludowy rząd! Wśród członków partii słychać głosy, że oznacza to porę na natychmiastową demokratyzację, ale nie możemy do tego dopuścić. Lata kapitalistycznej propagandy przeniknęły do umysłów klasy robotniczej i zatruły je. Burżuazyjne wyobrażenia o demokracji na nic nam się nie zdadzą. Od tej pory będziemy musieli ściśle nadzorować proces demokratyczny. Kandydaci do rady najwyższej muszą należeć do partii, a ich mandat będzie można odwołać, jeśli zboczą z linii partyjnej. Dzięki tym środkom zyskamy pewność, że ideologicznie czysta awangarda poprowadzi masy ku świetlanej przyszłości. Lud ufa, że reprezentujemy jego interesy, i obdarzył nas swoim zaufaniem!"
generic_firstDESC_squattism_ideology_key: "Niesiemy wyzwolenie spod tyranii ze wszystkich stron politycznego spektrum. Nasi ludzie cieszą się wolnością od kapitalistycznego wyzysku, reakcyjnej polityki brunatnych faszystów i okrucieństwa faszystów czerwonych. Dlatego jesteśmy solą w oku większości sąsiadów. Uważają nasze ziemie za niczyje, bo nie włada nimi żaden twór uznawany przez nich za \"prawowity\", i szykują się do spacyfikowania rewolucji. Ci jednak, którzy zasmakowali wolności, nie chcą jej oddać. Chwytają za broń i zgłaszają się do punktów werbunkowych, gotowi na starcie z siłami wroga.\nNiech żyje anarchia!"
generic_firstDESC_socialdemocrature_ideology_key: "Lewica zawsze przyjmowała mniejszości uciekające przed prześladowaniami. Ludzie o innym kolorze skóry, mniejszości seksualne oraz opozycjoniści z dyktatur zawsze znajdowali gościnę u socjaldemokratów. Dziś zachowanie tego podejścia jest jeszcze ważniejsze, ponieważ Polskę dręczą radykalni watażkowie prześladujący każdego, kto ośmieli się zakwestionować ich ideologię. Naszym moralnym obowiązkiem jest udzielenie takim osobom azylu, dopóki ich sytuacja się nie poprawi. Mamy nadzieję, że wielu dostrzeże mądrość naszej polityki i zdecyduje się pozostać w granicach, by wspólnie z nami pracować na lepszą przyszłość."
generic_firstDESC_euroliberalism_ideology_key: "Europa zawsze była dla nas wzorem, jaśniejącym przykładem kultury politycznej. Bez względu na to, co mówią inni, współpraca z państwami europejskimi jest kluczem do bezpieczeństwa wobec potencjalnej inwazji Rosji lub innych watażków, a także gwarancją utrzymania standardów demokratycznych. To jedni z naszych najcenniejszych partnerów handlowych, których pomoc gospodarcza i wojskowa okaże się bezcenna podczas jednoczenia Polski. Mamy nadzieję, że gdy cały ten koszmar dobiegnie końca, zostaniemy powitani jako pełnoprawny członek Unii - tam, gdzie jako część cywilizacji zachodniej jest nasze miejsce."
generic_firstDESC_freemarketism_ideology_key: "Nasz plan zakłada, że każdy będzie prowadził życie w luksusie, na jaki zasługuje. Wszyscy zyskają możliwość samodzielnego wykuwania własnego losu. Staniemy się krainą ludzi prawdziwie wolnych. Każda jednostka będzie mogła swobodnie się bogacić, a w konsekwencji wzbogacać całe społeczeństwo. Każda rodzina będzie miała dom z ogrodem i dwa samochody, a mimo to nadal będzie mogła pozwolić sobie na wakacje. Oczywiście styl życia podporządkowany konsumpcji spowoduje najróżniejsze problemy, takie jak krótszy dzień pracy czy częstsze występowanie chorób cywilizacyjnych. Mimo to polityka ta cieszy się ogromną popularnością wśród ludu."
generic_firstDESC_paternal_conservatism_ideology_key: "Kilka prostych słów: prawda, wiara, zapał, piękno, praca, poświęcenie. Przez pokolenia właśnie te ideały kształtowały nasze społeczeństwo. Były fundamentem, na którym wzniesiono wielką cywilizację. Odejście od nich doprowadziło do Upadku i późniejszych walk oraz sprawiło, że maksyma ta nieustannie traciła popularność. Naszym obowiązkiem jest odwieść ludność od nihilizmu i skierować z powrotem ku podstawom, aby naród mógł znów powstać. Pokazać, że nadal istnieją nieśmiertelne, wieczne wartości, o które warto walczyć. Będziemy świecić przykładem, mobilizując żołnierzy do walki za honor i ojczyznę, a cywilów zachęcając do pracy dla wspólnego dobra."
generic_firstDESC_autocracy_ideology_key: "Dawne społeczeństwo upadło. Ludzie mają dość nieustannych kłótni biurokratów i polityków. Szukają jednego zdolnego przywódcy, który zapewni im bezpieczeństwo oraz potęgę. [ROOT.GetLeader] odpowie na wezwanie. [ROOT.GetLeader] da ludziom to, czego pragną. Naród potrzebuje jednego zdecydowanego wodza, jeśli w zmiennych warunkach ma podejmować szybkie i skuteczne działania. Część obywateli popiera polityka twardej ręki, a bardziej sceptycznych uspokaja obietnica demokratyzacji po zakończeniu czasu kłopotów. Nawet dysydenci zrozumieją jednak naszą rację, gdy ujrzą osiągane przez nas wyniki. W końcu wystarczy, że wyjrzą przez okno i zobaczą los demokracji."
generic_firstDESC_corporativism_ideology_key: "Przepływ pieniędzy jest paliwem silnika gospodarki. Czasem gotówka płynie do nas, a czasem musimy wysłać ją komuś innemu. Możemy posiadać monopolistyczną pozycję w większości sektorów, lecz na najniższym szczeblu zarządzania nadal musimy polegać na politykach wybieranych regionalnie. W zasadzie zlecamy im na zewnątrz typowe specjalizacje państwa, takie jak pobór i biurokracja. Problem polega na tym, że nie wszyscy są równie chętni do współpracy. Na szczęście możemy finansować kampanie uczciwych kandydatów, których programy zupełnym przypadkiem pokrywają się z naszymi celami. Wszystko z należytym poszanowaniem praworządności."
generic_firstDESC_neonationalism_ideology_key: "Jesteśmy prawdziwymi przedstawicielami ludu. Nasza ideologia zawiera w sobie samą duszę narodu. Podążamy za ideami, które czyniły nas silnymi w przeszłości i mogą uczynić nas silnymi w przyszłości. Będziemy promować służbę interesowi narodowemu poprzez zasady uczciwej pracy dla wspólnoty. Jednocześnie odrzucamy koncepcję pomocy międzynarodowej. W tych śmiałych czasach musimy przede wszystkim troszczyć się o własny lud, nawet kosztem innych grup. W siły, które nam zagrażają, uderzy zgodnie milion pięści."
generic_firstDESC_reactionary_ideology_key: "Poprzedni system robił wszystko, co mógł, aby zerwać nasze więzi z przeszłością i tradycją. Dziś ludzie są zwiedzeni oraz zagubieni, ponieważ nie przestrzegają już obyczajów przodków. Naszym najwyższym priorytetem jest powrót do nieśmiertelnych zwyczajów minionych dni. Odwołamy się do symboli, świadomych i nieświadomych przekonań, pradawnych tradycji oraz mitów i legend, które mimo dziesięcioleci czy stuleci propagandy nadal przenikają ludzkie umysły oraz rozmowy. Kult wiecznych wartości, z którymi w głębi duszy utożsamia się każdy człowiek, zapewni nam ogromne poparcie i uległość społeczeństwa, choć nasze państwo drastycznie odchodzi od dotychczasowego porządku."
generic_firstDESC_postpolonism_ideology_key: "Stary Świat przeminął. Spłonął na popiół. Ci, którzy pragną zachować jego obyczaje i instytucje, błądzą. Nastała nowa era. Możemy dowolnie ukształtować tę ziemię. Wysłaliśmy zwolenników, by obalali dawne symbole narodowe, burzyli świątynie i palili książki. Zawierają wywrotowe idee zdolne sprowadzić nasz lud na manowce. Ludzie o podatnych umysłach mogą spróbować odtworzyć stary porządek tylko po to, by ponownie upadł tak jak w 2025 roku. Nie dopuścimy do tej tragedii. Jedynie najbardziej zaufani i mądrzy spośród nas będą mogli badać księgi Starego Świata, aby skuteczniej zapobiegać jego odrodzeniu."

#Second descriptions
generic_secondDESC_marxism_cranism_ideology_key: "Wreszcie zdobyliśmy dość uznania, by [ROOT.GetRulingParty] ogłosiła Wielki Kongres, na którym zgromadzą się wszyscy członkowie partii z naszych ziem, a także ci przybyli z zagranicy. Możemy wyjść z konspiracyjnego cienia, otwarcie się zjednoczyć i ogłosić swoje cele. Nadrzędne znaczenie ma niedopuszczenie do powstania anarchii w naszej doktrynie. Będziemy działać zgodnie, a nawet nasze komórki w obcych krajach zostaną podporządkowane partyjnej centrali. Międzynarodowe kadry przygotują pierwsze zręby naszej administracji, gotowe objąć ziemie nieprzyjaciela po ich podboju."
generic_secondDESC_squattism_ideology_key: "Większość zwolenników sprawy anarchistycznej wywodzi się z ośrodków miejskich. Tutaj autochtoni i przybysze pracują ramię w ramię jak bracia i siostry, zakładając skłoty. Nauczyli się radzić sobie sami, niezależnie od władz państwowych. Musieli przy tym nauczyć się bronić przed chuliganami i policją. Swoim doświadczeniem mogą teraz podzielić się z szerszymi masami, ucząc je posługiwania się kijami bejsbolowymi, łomami i pałkami, by stały się trzonem naszej milicji. W walce miejskiej nikt nam nie dorówna. Zyskamy wyraźną przewagę nad wrogami, którym trudno będzie zgromadzić wystarczająco dużo broni palnej."
generic_secondDESC_socialdemocrature_ideology_key: "Działania wojenne spustoszyły rozległe połacie naszych ziem. Walki od domu do domu i ostrzał artyleryjski obróciły liczne osiedla w ruinę. W rezultacie schroniska dla bezdomnych już pękają w szwach, a napływ uchodźców bynajmniej nie pomaga. Sektor prywatny albo czerpie zyski z ograniczonej podaży, albo jest zbyt biedny i niepewny przyszłości, by podjąć większe inwestycje. Państwo musi wkroczyć i bezpośrednio zająć się problemem: remontować oraz budować mieszkania za pieniądze z budżetu. Tak rozpocznie się ponowne zasiedlanie wojennych pustkowi. To działanie humanitarne, które zarazem pobudzi gospodarkę - uwolnieni od lęku przed bezdomnością ludzie będą mogli pomyśleć o zwiększeniu konsumpcji."
generic_secondDESC_euroliberalism_ideology_key: "Jesteśmy jednym z niewielu pozostałych bastionów demokracji w Polsce. Odrzucamy radykalne prawicowe i lewicowe pomysły dyktatury czy zawieszania praw obywatelskich dla doraźnej korzyści. Stoimy na straży ideałów i gwarantujemy prawo własności prywatnej, prawo do sprawiedliwego procesu, równość wobec prawa, wolność wyznania oraz domniemanie niewinności. Obywatele ufają, że dotrzymamy słowa i zapewnimy im stabilność, bezpieczeństwo oraz wolność od tyranii. Czas skodyfikować te prawa, aby stały się bardziej przejrzyste. Spodziewamy się, że poparcie dla naszego rządu gwałtownie wzrośnie."
generic_secondDESC_freemarketism_ideology_key: "To prawo dostosuje się do jednostki, a nie jednostka do prawa! Przedsiębiorcy nie będą już zdani na arbitralne kaprysy biurokratów, które potrafią pogrzebać obiecujące przedsięwzięcie. Ludzie zyskają swobodę prowadzenia interesów wedle własnego uznania: zatrudniania kogokolwiek zechcą i płacenia mu tyle, ile zechcą, za dowolnie wybraną pracę. Wierzymy, że zdrowa konkurencja między firmami stworzy najlepsze możliwe warunki dla pracowników, pracodawców i klientów, a regulacje mogą jedynie zaszkodzić optymalnemu wynikowi rynkowemu. Niektórzy obawiają się, że po tych reformach zostaną pozostawieni sami sobie w gwałtownie zmieniającym się świecie, lecz jesteśmy pewni, że naprawdę potrzebującymi zaopiekują się fundacje dobroczynne."
generic_secondDESC_paternal_conservatism_ideology_key: "Wiemy, czego naprawdę pragną ludzie. Nie jesteśmy ani oderwanymi od rzeczywistości elitami marzącymi o radykalnym przeobrażeniu społeczeństwa za pomocą inżynierii społecznej, ani infantylnymi utopistami chcącymi wcielać w życie niebezpieczne urojenia. Nasz program polityczny nie różni się od tego, co można usłyszeć od zwykłych przechodniów. Jesteśmy tu po to, by stać się ich głosem i reprezentacją oraz chronić ich przed każdym, kto chciałby naruszyć ich sposób życia. Umiemy rozmawiać ze zwykłymi ludźmi, czego dowodzą dobre wyniki naszej partii w sondażach. To pokazuje, że reprezentujemy demokrację w najczystszej postaci, wolną od wypaczających ją przymiotników. Gdy lud żąda, my spełniamy jego wolę."
generic_secondDESC_autocracy_ideology_key: "Państwo jest tożsame z osobą naszego przywódcy. Nasz przywódca jest silny, a zatem równie silny musi być aparat państwowy. [ROOT.GetLeader] wymaga bezwarunkowej lojalności od urzędników i nikt z ludu nie może kwestionować ich decyzji. Muszą jak najszybciej wykonywać wolę wodza, a jeśli chcą zachować stanowiska - wykazywać się przy tym samodzielną inicjatywą. Powinni mieć oczy wszędzie, by dostrzec każdego oszusta podatkowego, przemytnika, przestępcę czy uchylającego się od poboru i nie pozwolić nikomu wymigać się od wspierania kraju. Właśnie energicznej i sprawnej biurokracji potrzebuje teraz to państwo."
generic_secondDESC_corporativism_ideology_key: "Mamy tylko jeden nadrzędny cel i obowiązek - zarabiać pieniądze dla akcjonariuszy. Wszystko inne to najwyżej opcjonalna dygresja. Będziemy zarządzać krajem tak samo jak firmą. Koniec z marnotrawnymi projektami prowadzącymi donikąd. Uważnie przyjrzymy się każdemu kosztowi w księgach i postaramy się obniżyć go tak bardzo, jak to możliwe. Osiągniemy nadwyżkę budżetową niewyobrażalną dla ludzi wychowanych w państwie zarządzanym przez polityków. Zwykli ludzie z wdzięcznością przekonają się, jak tanie mogą być usługi i jak niewiele może kosztować abonament na państwo."
generic_secondDESC_neonationalism_ideology_key: "Czym jest Ojczyzna? To otaczający cię ludzie, łąki i pola przemierzane podczas wakacji, ziemia, która cię wychowała i wyżywiła. Naszej Ojczyzny nie można utożsamiać z obecnym terytorium - to jedynie wynik politycznych machinacji. Głęboka duchowa więź narodu z jego ziemią wykracza poza linie kreślone na mapie podczas negocjacji kruchych rozejmów. Trzeba uświadomić ludziom prawdę i przygotować ich do walki o rozszerzenie państwa na każdy skrawek ziemi zamieszkany przez nasz lud. Tym razem obronimy ją za wszelką cenę, aby nigdy więcej nie padła łupem krwiożerczych najeźdźców."
generic_secondDESC_reactionary_ideology_key: "Nowoczesne, modne ideologie nie przetrwały próby czasu. Wszystkie wymyślili fałszywi prorocy, którzy nie mieli pojęcia, jak działa ludzka natura - zwłaszcza w ciężkich czasach. My wiemy lepiej. Podążamy za ideami ukształtowanymi w epoce nieustannych zmagań i wybieramy sposób życia, który przetrwał całe stulecia. Skoro naszą cywilizację cofnięto do punktu wyjścia, nadszedł czas, by ta ideologia pokazała swoją wartość. Niektórzy nazwą nasze obyczaje barbarzyńskimi - niech i tak będzie. Nie będziemy zważać na opinie ludzi, którzy zginą w ciągu paru tygodni, bo nie potrafili wyrzec się błyskotek nowoczesnego świata."
generic_secondDESC_postpolonism_ideology_key: "Musimy wykorzenić stare elity i zastąpić je mędrcami. Tajne loże i ich złowrogie, ukryte rytuały nie będą już nami rządzić. Odtąd poprowadzi nas warstwa ludzi kierujących się cnotą i wiedzą. Następnie rozszerzymy nasze wpływy na niższe klasy społeczne. Ich członkowie zaczną witać się na nowe sposoby i spożywać nowy pokarm - zarówno dla ciała, jak i ducha. Jeśli zerwanie więzi z minionymi latami będzie tego wymagało, nauczymy ich nawet nowego języka."

#Third descriptions
generic_thirdDESC_marxism_cranism_ideology_key: "Mimo oczywistych korzyści, jakie nasze rządy przynoszą ludowi, wciąż istnieją ludzie, którzy się nam sprzeciwiają. Są pośród nas tacy, którzy wolą służyć zagranicznemu kapitałowi i sprzedać ojczyznę siłom imperializmu. Niestety nie każdy problem można rozwiązać siłą perswazji. Dlatego potrzebujemy kompetentnej służby bezpieczeństwa, która wykorzeni element wywrotowy. Musi ona móc podsłuchiwać prywatne rozmowy telefoniczne i internetowe, więzić podejrzanych bez wyroku sądu oraz utrzymywać sieć tajnych informatorów. Zajrzy pod każdy kamień, aby znaleźć każdego, kto spróbowałby podnieść rękę na władzę ludu!"
generic_thirdDESC_squattism_ideology_key: "Każda grupa ludzi pragnących stworzyć egalitarną, dobrowolną komunę ma do tego pełne prawo. Powody bywają różne: jedni zakładają kolektywy produkcyjne lub artystyczne, większość chce po prostu stworzyć przestrzeń do życia z ludźmi, w których towarzystwie dobrze się czuje - wbrew dawnym planom zagospodarowania i absurdalnym prawom własności pozwalającym niszczeć faktycznie porzuconym budynkom.\nNiektórzy boją się dołączać do takich stref z powodu tego, co nazywają niestosownym otoczeniem, przypominającym im bardziej obóz albo tanią spelunę. W swoim snobizmie nie pojmują, o ile tańsze są skłoty w utrzymaniu ani jak szybko idą remonty i budowy, kiedy troskliwi ludzie mogą swobodnie pomagać innym, nieskrępowani kapitalistyczną biurokracją."
generic_thirdDESC_socialdemocrature_ideology_key: "Nasi bardziej radykalni zwolennicy domagają się jeszcze wyższych podatków dla bogatych, a nawet dla tych, których niektórzy uznaliby za klasę średnią. Umiarkowani wskazują jednak, że kolejny próg podatkowy uszczupliłby nasze poparcie i nieco zdusił gospodarkę. Możemy pogodzić te sprzeczne interesy bardziej wyrafinowaną metodą: uderzając w oszustów podatkowych! Zwiększy to nasze dochody, a nie zmobilizuje opozycji, która również uważa ich za złodziei.\nNową politykę wdrożymy przez ściślejszą kontrolę transakcji, postępującą cyfryzację i przegląd wyjątków zapisanych w prawie podatkowym."
generic_thirdDESC_euroliberalism_ideology_key: "W gospodarce musimy dochować pewnych uniwersalnych standardów. Nie możemy dopuścić, by kryzys polityczny i wojskowy przeobraził się również w gospodarczy. Obecnie przedsiębiorcy uczestniczą w wolnej amerykance: łamią przepisy bezpieczeństwa i higieny pracy, nie rejestrują działalności i odmawiają płacenia pracownikom. Aby utrzymać cywilizowane standardy i uzyskać dostęp do rynków europejskich, trzeba przywrócić część dawnych regulacji. Niektórzy ubolewają, że zabijamy gospodarkę, ale tak naprawdę jedynie ją poskramiamy. Możemy przy okazji narzucić najlepsze i najwydajniejsze metody produkcji, wskazując nowo powstałym start-upom właściwą drogę, zamiast pozostawiać je samym sobie."
generic_thirdDESC_freemarketism_ideology_key: "Potrzebujemy czegoś, co rozrusza gospodarkę. Obecnie nasza klasa biznesowa robi wszystko, by utrzymać nas na powierzchni, lecz to nie wystarczy. Musimy zapewnić części przedsiębiorców przewagę na starcie i zarazem przyciągnąć zagranicznych inwestorów. Jak się przekonaliśmy, z powodu braku stabilności politycznej większość z nich zanadto boi się rozpoczynać jakiekolwiek przedsięwzięcia na naszych ziemiach. Aby zwiększyć liczbę inwestycji, musimy przedstawić naprawdę dobrą ofertę, która przekona ich do zaryzykowania pieniędzy. Stworzymy więc specjalne strefy ekonomiczne, gdzie przez określony czas podatki praktycznie nie będą istnieć. Jeśli chcemy zachować choć pozory budżetu, przywileje te możemy przyznać tylko kilku korporacjom. Mimo długofalowych kosztów ruch ten przyniesie nam ogromne korzyści."
generic_thirdDESC_paternal_conservatism_ideology_key: "Rodzina jest pierwszą i podstawową komórką społeczną. Mężczyzna i kobieta oddani dawaniu życia oraz wychowywaniu dzieci. To właśnie ona w pierwszej kolejności zapewnia przetrwanie naszego narodu. Dziwi nas, że w ogóle trzeba o tym przypominać. Niestety lata liberalnej propagandy zatruły umysły mężczyzn, którzy nie palą się już do stawania na czele rodzin, oraz kobiet, którym wmawiano, że macierzyństwo jest nieważne, a liczy się bezwzględna pogoń za karierą. Musimy odwrócić ten kierunek, lecz samo promowanie ideałów nie wystarczy. Budując więcej żłobków i zapewniając stałe wsparcie finansowe rodzinom wielodzietnym, chcemy materialnie zachęcić ludzi do powrotu ku starym, dobrym wartościom, na których niegdyś polegaliśmy."
generic_thirdDESC_autocracy_ideology_key: "Wiecie, dlaczego nie możemy mieć demokracji? Bo tylko twardy rdzeń naszego narodu chce pracować dla wspólnego dobra! Rozrastamy się szybciej, niż jesteśmy w stanie integrować i asymilować podbitą ludność. Gdyby otrzymała prawa wyborcze, kraj rozpadłby się i wrócilibyśmy do punktu wyjścia. Spójrzmy prawdzie w oczy: państwo roi się od ugrupowań rebelianckich i tylko autokrata potrafi je wykorzenić, zanim rzucą się na niewinnych cywilów. Dla bezpieczeństwa tak zwane prawa obywatelskie trzeba będzie na razie wdrażać nieco ostrożniej. Bądźmy szczerzy - czyich praw należy bronić bardziej? Praworządnych obywateli czy buntowników, którzy pragną jedynie krzywdzić innych i niszczyć to, co zbudowaliśmy niestrudzoną pracą?"
generic_thirdDESC_corporativism_ideology_key: "Ziemie polskie stały się wylęgarnią najróżniejszych najemników. I bardzo dobrze. Każdy wie, że zmieniający się rynek wpływa na wybór kariery. Żyjemy w niebezpiecznych czasach, więc ludzie nauczyli się bronić, a teraz oferują te umiejętności za pieniądze. Porzuceni weterani, policjanci, którzy zeszli na złą drogę, ludzie, którzy po prostu podnieśli najlepszą znalezioną broń. Wszyscy mają rodziny do wykarmienia; zatrudniając ich, wyświadczamy im przysługę. Nie wspominając już o mieszkańcach naszych ziem, którzy będą wdzięczni, jeśli postanowimy wydać trochę więcej pieniędzy zamiast rozszerzać pobór. Co jeszcze jest wspaniałego w najemnikach? Nie są lojalni wobec niczego poza pieniędzmi."
generic_thirdDESC_neonationalism_ideology_key: "Części ojczyzny leżące poza naszymi granicami są niczym kończyny odrąbane od ciała. Pozostawiono je samym sobie, wystawione na żer czerwi przyspieszających rozkład. Na szczęście ciało narodu ma niezwykłą zdolność regeneracji. Już tego dowiedliśmy. Wystarczy pozbyć się robactwa, które zalęgło się w tym, co nasze, a będziemy mogli rozpocząć leczenie. Szykujcie się więc do walki! Chwyćcie broń i ruszcie na obcy element. Nie wahajcie się uderzyć, nawet jeśli nie macie pewności, kogo zabić. Czasem lepiej przeprowadzić dodatkową amputację, niż ryzykować, że zakażenie zacznie ropieć."
generic_thirdDESC_reactionary_ideology_key: "Poświęcimy wiele uwagi tradycjom i normom. Każdy obywatel będzie obchodził święta, które z biegiem czasu mogły popaść w zapomnienie. Ludzie będą ubierać się, zachowywać i mówić tak jak nasi przodkowie. Tylko ścisła kontrola nad ludnością sprawi, że właściwy sposób życia utrwali pradawne wartości dla następnego pokolenia. Przeszłość jest doskonałym przewodnikiem po świecie teraźniejszości i przyszłości. Dopiero teraz ludzie zaczynają pojmować, że dawne wartości nie są przestarzałe, lecz ponadczasowe."
generic_thirdDESC_postpolonism_ideology_key: "Pasterze muszą wejść między owce, jeśli chcą właściwie je poprowadzić. Musimy zatem posłać nauczycieli w teren, aby nadzorowali miejscowe społeczności i odpowiadali na ich pytania. Nie możemy po prostu przybić tez do drzwi i uznać pracy za skończoną. Każdego dnia głowę podnoszą wątpiący i ci, którzy nas atakują. Trzeba rozprawić się z nimi bezpośrednio. Musimy nauczać ludzi i inspirować ich w rozmowach twarzą w twarz. Wówczas lud, wiedziony świeżo rozpalonym zapałem, podąży za swymi Strażnikami do walki z tymi, którzy pragnęliby zgasić światło Prawdy."

#Fourth descriptions
generic_fourthDESC_marxism_cranism_ideology_key: "Krwiożerczy imperialistyczni faszyści, reakcyjni księża, chciwi kapitaliści. Wszyscy oni nadal żyją w naszych granicach. To choroby, którymi zaraziły nas truchła systemów już przez nas zdeptanych. Mamy lekarstwo, teraz trzeba tylko regularnie je podawać: ocenzurujemy ich gazety, usuniemy ich z telewizji, prześwietlimy ich samych i ich rodziny, postawimy przed sądem, zamkniemy w więzieniach albo skażemy na wygnanie. Uwolnienie kraju od ich wpływów będzie kolejnym krokiem ku lepszej przyszłości dla wszystkich - przyszłości wolnej od przestarzałego brzemienia upadłych ideologii."
generic_fourthDESC_squattism_ideology_key: "Nie potrzebujemy zysku, by mieć motywację do pracy. Produkcja przemysłowa jest bez wątpienia potrzebna, a chętni robotnicy są gotowi pracować dla swojej społeczności. Zakładają demokratycznie zarządzane kolektywy produkcyjne, w których każdy pracownik ma równy głos w sprawie tego, co i jak się wytwarza. Są one stosunkowo małe, lecz chętnie współpracują z podobnymi warsztatami, tworząc harmonijny i skrajnie zdecentralizowany system. Taka struktura gospodarcza jest niezwykle elastyczna i potrafi wspierać naszą sprawę równie dobrze, a nawet lepiej niż kapitalistyczne lub centralnie planowane formy organizacji produkcji."
generic_fourthDESC_socialdemocrature_ideology_key: "Nikt nie może zaprzeczyć, że prywatna przedsiębiorczość jest niezbędna dla sprawnie działającej gospodarki; system komunistyczny pokazał nam, jak radzi sobie alternatywa. Nie jesteśmy jednak liberałami, a tolerowanie sektora prywatnego nie oznacza aprobaty dla wszystkich jego fanaberii. Przedsiębiorcy rozpowszechniają obecnie propagandę, według której odbudowa państwa wymaga, by każdy robotnik zaharowywał się ponad siły, aż dogonimy Zachód. Nie będziemy tolerować tych kłamstw. Wprowadzimy rozbudowany zbiór przepisów mających ulżyć pracownikom. Przejrzeliśmy zasłonę neoliberalnych kłamstw i wiemy, że wypoczęty robotnik jest robotnikiem wydajniejszym."
generic_fourthDESC_euroliberalism_ideology_key: "Wojna szalejąca przez wszystkie te lata obróciła w ruinę liczne dzielnice mieszkaniowe. Dlatego mimo spadku liczby ludności wskutek ofiar cywilnych i niższej dzietności brakuje nam domów dla obywateli. Musimy coś z tym zrobić, a co jeszcze ważniejsze - nasi wyborcy muszą zobaczyć, że coś z tym robimy. Jako zwolennicy aktywnego państwa współpracującego z sektorem prywatnym proponujemy program dopłat do mieszkań budowanych przez deweloperów. Pokażemy w ten sposób, że potrafimy ubrudzić sobie ręce i pomóc ludziom, nie zakłócając przy tym działania rynku."
generic_fourthDESC_freemarketism_ideology_key: "Uwolniony potencjał naszej ludności zaskakuje nawet najbardziej optymistycznych sympatyków. Gospodarka kwitnie, a prywatyzacja obejmuje coraz więcej sektorów - nawet takich, które zdaniem opinii publicznej musiały należeć do państwa. Zwykli przedsiębiorcy nadal we względnym bezpieczeństwie rozszerzają działalność, natomiast pionierzy eksperymentują w dziedzinach dotąd niemal nietkniętych przez rynek, takich jak badania nad ubezpieczeniami medycznymi, działalność badawczo-rozwojowa i bezpieczeństwo. Odkąd złamaliśmy państwową uzurpację w tych sektorach, wydajność poszybowała w górę, a koszty gwałtownie spadły."
generic_fourthDESC_paternal_conservatism_ideology_key: "Niektórzy uważają, że sprzeciwiamy się wszelkim zmianom, ale to nikczemne kłamstwo. Każdy, kto poświęcił choć parę minut na rozmowę z naszymi politykami lub zwolennikami, wie, że jesteśmy przeciwni wyłącznie nagłym i drastycznym przemianom uderzającym w rdzeń naszych wartości cywilizacyjnych. Odrzucamy eksperymenty społeczne i rewolucje, ponieważ wiemy, że przynoszą więcej szkody niż pożytku. Chętnie zmodyfikujemy światopogląd i politykę, gdy upewnimy się, że zmiany są potrzebne, korzystne dla społeczeństwa i sprawdziły się już gdzie indziej. Dobrze jest przecież uczyć się na błędach, a jeszcze lepiej - na cudzych. Oczywiście to my rozstrzygniemy, które pomysły warto wdrożyć i ile czasu musi upłynąć, aby reformę można było uznać za udaną w dłuższej perspektywie."
generic_fourthDESC_autocracy_ideology_key: "No dobrze, być może potrzebujemy odrobiny demokracji. Walka ze zbrojnym oporem to jedno, lecz nadal są ludzie, którzy czują się przez nasz rząd niereprezentowani. Nie chcą spiskować w celu obalenia władzy, ale niedbale wykonują powierzone im zadania. Po cichu tęsknią za reprezentacją w parlamencie, za opozycją. Nie możemy jednak pozwolić jej hasać bez kontroli. Nasz przywódca panuje nad każdym aspektem polityki; dlaczego z opozycją miałoby być inaczej? Nawet jeśli oficjalnie dopuścimy ją do współrządzenia, jej wpływy pozostaną marginalne. Posłuży do rozsądnej liberalizacji debaty publicznej. Może uspokoi to tych, którzy za naszymi plecami nazywają nas tyranami."
generic_fourthDESC_corporativism_ideology_key: "Nie jesteśmy przeciwni związkom zawodowym, lecz nie jesteśmy też neutralni. Będziemy śmiało bronić bezpośrednich relacji z naszymi pracownikami, bo właśnie to najlepiej służy im samym, naszym klientom i akcjonariuszom. Nie wierzymy, aby związki działały w czyimkolwiek najlepszym interesie. Nasz model biznesowy opiera się na szybkości, innowacyjności i obsesji na punkcie klienta - cechach, których zwykle nie kojarzy się ze związkami zawodowymi. Gdy tracimy z oczu te kluczowe obszary, narażamy bezpieczeństwo zatrudnienia wszystkich.\nMamy sposoby, by ich organizowaniu przeciwstawić własną inicjatywę. Możemy zachęcać ludzi do łamania strajków i zwalniać najgłośniejszych związkowców, a jeśli to nie poskutkuje - dla dobra naszych pracowników zatrudnimy nieoznakowanych osiłków w roli \"ochrony\", by bezpośrednio porozmawiali z każdym, komu przyszłoby do głowy wszczynać przemoc."
generic_fourthDESC_neonationalism_ideology_key: "Jesteśmy przede wszystkim zbiorowością. Jednostka cieszy się życiem głównie dlatego, że inni członkowie narodu coś jej dali. Sama nie osiągnęłaby większości tego, co uważa za własne dokonania. Siła płynie ze wspólnoty, a siłę każdej wspólnoty wyznacza przede wszystkim jej liczebność. Młodzi muszą jak najwcześniej zawierać małżeństwa i mieć tyle dzieci, ile zdołają utrzymać. Dzieci te staną się żołnierzami przyszłości i zagwarantują, że nasz naród nie doświadczy kolejnego ludobójstwa. Odwrócą przygnębiające trendy demograficzne, dzięki czemu nie będziemy musieli sprowadzać zagranicznej siły roboczej."
generic_fourthDESC_reactionary_ideology_key: "Bez przodków nie bylibyśmy dziś w tym miejscu - i nie chodzi wyłącznie o sens biologiczny. Nie bylibyśmy sobą bez ich intelektualnego wkładu w naszą kulturę i bez krwi przelanej za sprawę, na której im zależało, tę samą, o którą dziś walczymy. Wciąż możemy wiele się od nich nauczyć. Nasze społeczeństwo ponownie potrzebuje rycerzy, którzy z honorem i gracją będą walczyć w imię misji większej od nich samych. Pomijając powody moralne i duchowe, konna kawaleria jest znacznie tańsza od piechoty zmotoryzowanej. Zagłębiając się w dawne traktaty wojenne, staniemy się bezkonkurencyjni w walce w zwarciu."
generic_fourthDESC_postpolonism_ideology_key: "Ci, którzy w swej mądrości postanowią podporządkować się naszej sprawie, muszą zostać należycie wynagrodzeni. Oczywiście nasi wyznawcy nie przyłączają się dla korzyści materialnych, lecz w imię wyższego celu. Niestety do przekonania nowych wtajemniczonych może być potrzebna pewna oprawa. Najwierniejszych stronników będziemy publicznie wysławiać. W miejscach ich narodzin staną pomniki. Dzieci będą uczyły się w szkołach o ich dokonaniach. Gdy odejdą, staną się natchnieniem dla kolejnych ludzi, którzy zajmą ich miejsce. Lud będzie ich czcił, przesyłał pieniądze i kosztowności oraz prosił o błogosławieństwo."

#Fifth descriptions
generic_fifthDESC_marxism_cranism_ideology_key: "Zdobyte przez nas przedsiębiorstwa państwowe i te, które uciekający kapitaliści pozostawili bez opieki, wracają teraz do klasy robotniczej. Uczyniliśmy pierwszy wielki krok ku zakończeniu wyzysku. Nasz system jest nie tylko sprawiedliwszy i wolny od sprzeczności, lecz przede wszystkim skuteczniejszy. Produkujemy teraz wyłącznie to, czego potrzebuje lud. Lokalne rady zgłaszają potrzeby komitetowi centralnemu, który następnie decyduje o kierunkach produkcji. Dzięki temu zlikwidowaliśmy anarchię produkcji, w której dziesiątki wytwórców marnotrawnie tworzyły ten sam produkt różniący się jedynie kosmetycznymi szczegółami."
generic_fifthDESC_squattism_ideology_key: "Odrzucamy pogląd, że warto wykonywać wyłącznie pracę przynoszącą zysk pieniężny. Historia pełna jest ludzi, którzy ogromnie wzbogacili naszą wrażliwość albo skłonili nas do ponownego namysłu nad fundamentalnymi pytaniami dotyczącymi człowieczeństwa, a mimo swego geniuszu umarli w biedzie. Mówimy o malarzach, pisarzach i kompozytorach - wielkich artystach przeszłości. Wiemy, że trzon naszych zwolenników zainteresował się tymi ideami dzięki sztuce przekraczającej granice bez względu na wolę wrogich władców. Czy można wyobrazić sobie coś bardziej anarchistycznego?\nJesteśmy pewni, że sztuka nadal będzie służyć szerzeniu ideałów wolności - zarówno wśród mieszkańców naszego wolnego terytorium, jak i tych, którzy wciąż wiodą życie w kajdanach."
generic_fifthDESC_socialdemocrature_ideology_key: "W czasach narastającego autorytaryzmu i militaryzmu bardziej niż kiedykolwiek należy dbać o przejrzystość, uczciwość i równość procesu demokratycznego. Będziemy dążyć do miana wzorowej demokracji i pochwał zagranicznych obserwatorów, dopuszczając uczciwą debatę z partiami opozycyjnymi - przynajmniej tymi, które uznamy za demokratyczne - oraz zachowując możliwie największą bezstronność mediów państwowych. Wzmocni to naszą prawowitość i sprawi, że obce kraje przychylniej spojrzą na naszą sprawę. Być może odwróci również uwagę obywateli od narastającego autorytaryzmu wewnątrz naszej partii, dzięki któremu dawne elity bezpiecznie trwają na swoich stołkach."
generic_fifthDESC_euroliberalism_ideology_key: "Ludzie mogą narzekać na przerost biurokracji, ile tylko chcą, ale po Upadku liczba urzędników drastycznie zmalała, a administracja uległa zanikowi. Jak mamy podnosić podatki, zwiększać pobór czy opracowywać nowe polityki, skoro nie potrafimy ich wdrożyć ani kontrolować sposobu ich wykonywania? Potrzebujemy naszych chłopców i dziewcząt w terenie... to znaczy, w biurach, aby walczyli za naszą sprawę. Dzięki nim będziemy dokładnie wiedzieć, ilu ludzi mieszka w granicach państwa, ile zarabiają i jak wiele mamy prawo od nich ściągnąć. Dowiemy się, ilu obywateli podlega poborowi i ilu się od niego uchyla."
generic_fifthDESC_freemarketism_ideology_key: "Zbyt długo nasz lud tkwił w samozadowoleniu. Poprzedni reżim nie pozwalał ludziom się rozwijać. Nadmiernymi regulacjami tłumił mobilność społeczną, a następnie dotował nieefektywny sposób życia. Musimy wyzwolić energię obywateli, aby mogli sięgnąć gwiazd. Będziemy wyszukiwać historie ludzi, którzy przeszli drogę od pucybuta do milionera, i nagłaśniać je w całym kraju. Ludzie muszą zrozumieć, że kajdany przeszłości zostały zerwane i mogą teraz swobodnie dążyć do szczęścia, nie niepokojeni przez państwo. Mamy nadzieję, że nasze działania natchną przyszłych innowatorów pragnieniem zmiany świata na lepsze."
generic_fifthDESC_paternal_conservatism_ideology_key: "Popieramy zdrową konkurencję między podmiotami prywatnymi, lecz wiemy, że niektóre sektory gospodarki są zbyt cenne, by pozostawić je kaprysom rynku. Energetyka, finanse, transport, rolnictwo, farmacja i wydobycie surowców wymagają dodatkowej ochrony, aby krajowi producenci mogli rozwijać się w szczególnych warunkach, a w czasie pokoju konkurować z zagranicznymi gigantami. Polityka ta jest wyjątkowo rozsądna podczas wojny, kiedy najważniejsze sektory mogą paść ofiarą przejęcia lub sabotażu przez obcych wrogów albo świadczyć dodatkowe usługi na rzecz naszej armii."
generic_fifthDESC_autocracy_ideology_key: "Nasz model rządów opiera się na metodzie \"kija i marchewki\". Użyliśmy już wielu kijów, czas więc na marchewki. Właściwie będzie to raczej wyświetlanie obrazu marchewki na ścianie. Nie damy ludziom niczego ponad to, co już otrzymują; nauczymy ich tylko doceniać nasze dotychczasowe osiągnięcia. Pokażemy im ludzi szczęśliwie korzystających z możliwości i bezpieczeństwa, które zapewniamy, opowiemy o mądrych reformach wielkiego przywódcy i ujawnimy prawdziwe oblicze naszych wrogów - krwiożerczych potworów. Przekaz popłynie z telewizji, radia, Internetu, a nawet kin. Dzieci będą uczyć się w szkołach o dobru, które niesiemy."
generic_fifthDESC_corporativism_ideology_key: "Nie możemy pozwolić, by brak zaangażowania pracowników obniżył naszą wydajność. Możemy nadzorować pracę w zakładach, lecz nie sposób mieć oczu wszędzie. Musimy zaoferować dodatkowe korzyści tym, którzy przekraczają własne granice. Trzeba wynieść ich ponad pozostałych, aby wszystkim pokazać, czym jest właściwa etyka pracy. W każdym pracowniku myślącym o obniżeniu tempa musimy zaszczepić strach przed zastąpieniem. Pomogłoby też nagradzanie tych, którzy donoszą na gorzej pracujących kolegów, a także rozsiewanie plotek o możliwych zdradach w wyścigu po wyższe stanowisko. Każdy pracownik poczuje na karku cudzy oddech."
generic_fifthDESC_neonationalism_ideology_key: "Musimy chronić krajowych producentów. Przed Upadkiem ziemię tę w całości sprzedano zagranicznym bankierom, których lobbing powoli wyniszczał nasz naród. Nie możemy dopuścić do powtórki. Ściśle ograniczymy skalę możliwych inwestycji zagranicznych. Zabezpieczymy interesy krajowych firm, zwłaszcza tych, które dostarczają strategiczne surowce albo wytwarzają produkty ważne dla naszej kultury. Dopiero wtedy rozważymy otwarcie granic - i tylko pod warunkiem, że bilans handlowy będzie zdecydowanie korzystny. Nie zapomnimy również o drobnych przedsiębiorcach, kręgosłupie naszego narodu, którzy świadczą usługi bezpośrednim sąsiadom i wzmacniają lokalne więzi. Będą mogli liczyć na specjalne dotacje na rozwój działalności."
generic_fifthDESC_reactionary_ideology_key: "Naturalny porządek wykracza poza przeszłość, teraźniejszość i przyszłość; zrodził się z niezmiennych prawd wszechświata. Niestety nasi wyznawcy nie wiedzą, jak wcielić te nieśmiertelne wartości w świecie, który je odrzucił. Uciekają więc myślami w przeszłość, licząc na jej całkowite odtworzenie w każdym szczególe - potrzebnym czy nie. Nie możemy do tego dopuścić. Przeznaczone jest nam władać Ziemią aż po kres czasu, a to oznacza konieczność adaptacji. Musimy oddzielić dodatkowe wierzenia narosłe przez lata od prawdziwych aksjomatów naszej sprawy. Choć fundament nauk pozostanie niezmieniony, takie oczyszczenie wywoła sprzeciw tych, którzy nawet niekanoniczne praktyki otaczają taką samą świętością jak rdzeń systemu."
generic_fifthDESC_postpolonism_ideology_key: "Nasza organizacja pełna jest cnotliwych i mądrych ludzi zasługujących na pochwałę, lecz każdy musi pamiętać, że stanowią jedynie blade odbicia i imitacje naszego mądrego przywódcy którym jest [ROOT.GetLeader]. To [ROOT.GetLeader] odkrył Prawdę, a dzięki nowo zdobytej wiedzy skodyfikował nowe prawa i wyszkolił swoich popleczników, by posyłać ich jako Awatary w miejsca, do których [ROOT.GetLeader] nie może udać się osobiście. Możemy czcić najbliższych nauczycieli, lecz musimy pamiętać, że prawem jest wyłącznie słowo najwyższego przywódcy. Każdy, kto mu zaprzeczy - bez względu na stopień wtajemniczenia - musi odpowiedzieć za swoje zbrodnie przed sądem."

#Sixth descriptions
generic_sixthDESC_marxism_cranism_ideology_key: "Nie wszystkie pasożyty uciekły na widok maszerującej armii ludowej. Wielka szkoda. Nadal istnieje drobnomieszczaństwo i klasa zamożnych właścicieli ziemskich sabotujących naszą gospodarkę. Otwarcie odrzucają dyrektywy, a rolnicy wolą nawet niszczyć plony i sprzęt, niż dzielić się nimi ze wspólnotą. Ośmielają się tuczyć, podczas gdy ich bracia i siostry niestrudzenie budują sprawiedliwe społeczeństwo. Początkowo ich tolerowaliśmy, licząc, że wstąpią do gospodarstw kolektywnych, ale zamiast tego postanowili terroryzować własną społeczność. Koniec uprzejmości: nakażemy im oddać ziemię i przedsiębiorstwa albo ponieść straszliwe konsekwencje."
generic_sixthDESC_squattism_ideology_key: "Nasza sprawa nie może opierać się wyłącznie na ogólnych hasłach wolności. Musimy szerzyć teorię, aby ludzie poznali szczegóły swojej sprawy, nauczyli się organizować i walczyć z przytłaczającą siłą wroga. Świadomi towarzysze będą dniami i nocami drukować ulotki oraz manifesty i obklejać nimi uliczne latarnie. Wyślą je także za granicę, by budzić świadomość zniewolonych. Najlepsi mówcy przygotują się do objaśniania tez wielkich myślicieli anarchizmu. Kto wie, może któryś z mieszkańców sięgnie nawet po Proudhona.\nWiemy, że prasa drukarska raz już położyła kres średniowieczu. Wierzymy, że zdoła uczynić to ponownie."
generic_sixthDESC_socialdemocrature_ideology_key: "Wojenny chaos sprawił, że ludzie boją się albo nie są w stanie inwestować we własną edukację i wykształcenie dzieci. Wielu ją zaniedbuje i skupia się na opanowaniu pracy fizycznej albo pod przymusem czy namową pozostaje w domu, by pomagać w obowiązkach. To niedopuszczalne i krótkowzroczne. Edukację uznano za prawo człowieka, a poza tym nasz kraj nie będzie funkcjonował, jeśli zamiast specjalistów będzie pełen analfabetów. Poczynimy ogromne inwestycje w oświatę i jeszcze dokładniej wyegzekwujemy obowiązek szkolny; nie pozwolimy okraść najmłodszych z przyszłości. Zwiększymy także stypendia dla najbardziej marginalizowanych grup, by dalej ograniczać nierówności społeczne."
generic_sixthDESC_euroliberalism_ideology_key: "Skorumpowani politycy psują opinię pozostałym dziesięciu procentom. Mimo naszych starań, by należycie wynagradzać członków partii i urzędników państwowych, niektórzy nie potrafią się powstrzymać, gdy nadarza się możliwość wzbogacenia alternatywną drogą. Ludzie zaczęli zauważać, że pewni lokalni politycy jeżdżą samochodami nieco zbyt luksusowymi jak na swoje zarobki. Albo że gdzieś zapodziała się część pieniędzy przeznaczonych dla rodzin dotkniętych wojną. Albo że nowa ławka w parku kosztuje dziesięć razy więcej, niż powinna. Musimy położyć temu kres, zanim będzie dla nas za późno. Oczywiście nie zlikwidujemy całej korupcji - tylko najbardziej rażące przypadki. W końcu zawsze potrzebna jest jakaś dodatkowa zachęta, by wejść do świata polityki."
generic_sixthDESC_freemarketism_ideology_key: "Przemiana społeczeństwa obejmuje wszystkie dziedziny życia, w tym środowisko akademickie, a zwłaszcza uniwersyteckie wydziały ekonomii, gdzie głos zyskują poglądy dotąd niemal niesłyszane. Należą do nich koncepcje ekonomistów związanych ze szkołą austriacką. Przez dziesięciolecia główny nurt spychał ich na margines, ale wierzymy, że nasz rząd może wdrożyć idee wielkich myślicieli, takich jak Mises, Hayek i Rothbard. Ich pomysły mogą na przykład pomóc nam uniknąć cyklicznych kryzysów i inflacji dzięki uwolnieniu sektora bankowego lub wprowadzeniu standardu złota. Innowacyjne podejście austriackich ekonomistów pozwoli nam też lepiej dostosować się do świata, w którym znaczenie kryptowalut gwałtownie wzrosło."
generic_sixthDESC_paternal_conservatism_ideology_key: "Potępiamy zarówno socjalizm, jak i kapitalizm leseferystyczny. Pierwszy za oddawanie państwu zbyt wielkiej władzy, pozwalającej nienaturalnie ingerować w życie ludzi; drugi za bezwzględny wyzysk robotników traktowanych jak zwykłe narzędzia. Popieramy kapitalizm z ludzką twarzą, w którym ludzie mogą zasadniczo swobodnie wchodzić w relacje gospodarcze, lecz podlegają pewnym ograniczeniom chroniącym ludzką godność i dobrobyt. Państwo będzie interweniować za pomocą regulacji i redystrybucji finansowej, ale działania te nie staną się przytłaczające ani nie pozbawią komórek naszego społeczeństwa ich praw oraz obowiązków. Władza wkroczy jedynie po to, by pomóc uciskanym ponownie stanąć na własnych nogach, aby naturalny porządek rzeczy mógł trwać."
generic_sixthDESC_autocracy_ideology_key: "Trwamy w stanie nieustającej wojny. Nasze państwo musi działać jak armia i razem z armią. Nie ma tu miejsca na wahanie, brak dyscypliny ani dezercję. Każdy obywatel musi znać swoje miejsce i wykonywać otrzymane rozkazy. Wszyscy - od najniższych rangą robotników i sprzedawców po urzędników na najwyższych szczeblach władzy - muszą uznać się za część jednej, zjednoczonej struktury i postępować zgodnie z tym przekonaniem. Porządek należy egzekwować skrupulatnie i bezlitośnie, jeśli chcemy osiągnąć długofalowy cel.\nMusimy być zawsze gotowi podążać za naszym umiłowanym przywódcą."
generic_sixthDESC_corporativism_ideology_key: "Upadek Polski cofnął nasz rozwój gospodarczy o całe dekady. Będziemy musieli pracować bez wytchnienia, aby odzyskać poziom dobrobytu, którym ludzie cieszyli się przed 2025 rokiem. W tym celu pożegnamy się z typowym limitem czterdziestu godzin pracy tygodniowo i z wolnymi sobotami. Nowy model potocznie nazywa się systemem 996 - pracą od dziewiątej rano do dziewiątej wieczorem przez sześć dni w tygodniu, czyli łącznie siedemdziesiąt dwie godziny. Ciężkie czasy wymagają ciężkich decyzji. Nastawi to przeciw nam część robotników, ale należało się tego spodziewać. Spróbujemy ich uspokoić, wskazując, że ich szefowie, a nawet zarząd firmy, będą pracować równie długo co zwykły pracownik."
generic_sixthDESC_neonationalism_ideology_key: "Podjęte środki ostrożności nie wystarczają. Zagraniczni agenci i wrogie ideologie przemknęli nam pod nosem, udając kupców. Nauczyliśmy się, że przetrwanie i rozwój zapewnia jedynie suwerenność polityczna oraz wojskowa. Czas zrozumieć, że następnym logicznym krokiem jest suwerenność gospodarcza. Przejmiemy obcy kapitał dla dobra wspólnego i wykorzystamy go do dalszego rozwoju krajowych przedsiębiorstw. Naprawdę uniezależnimy się od zagranicznych wpływów oraz zawirowań obcych rynków, które zdzierają pozory wzrostu i co kilka dekad sprowadzają niewyobrażalne cierpienia. Odtąd jedynie nasz naród będzie sterował okrętem gospodarki, prowadząc go na podbój obcych mórz."
generic_sixthDESC_reactionary_ideology_key: "Nasza ideologia zatriumfowała w przeszłości, dowiodła swej wartości w teraźniejszości, a coraz więcej ludzi zaczyna wierzyć, że przyszłość również należy do nas. Samą siłą woli, wbrew wszelkim przeciwnościom, zmieniamy ducha epoki. Nie jesteśmy już tylko zaporą na drodze ku otchłani; odciągnęliśmy od niej całą kulturę. Wszelkie znaki na niebie i ziemi wskazują, że zmiana jest trwała. Nasi wrogowie zostają wykluczeni z życia publicznego, a zwykli ludzie szykują przeciw nim widły. Członkowie dawnego modernistycznego salonu milczą albo, wyczuwając kierunek wiatru, zaczynają się nam podlizywać."
generic_sixthDESC_postpolonism_ideology_key: "Rozpoczęliśmy proces tworzenia nowego człowieka, zupełnie nowego podgatunku! Dowiedziono, że po zgłębieniu najwyższych tajemnic naszego zakonu zmianie ulega samo DNA człowieka. Instynkty uważane dotąd za biologicznie nieodłączne od ludzkiej natury zostają całkowicie usunięte. Ci, którzy podążają naszą drogą, nie są już obciążeni wadliwymi gadzimi częściami mózgu. Stają się dzięki temu znacznie inteligentniejsi, bardziej moralni i skłonni do ćwiczeń fizycznych. Mamy nadzieję, że w miarę trwania naszej misji nawracania coraz więcej osób odkryje ukryty potencjał, a ziemie nad Wisłą w całości zamieszka Homo Novum."



