l_polish:
 anti_tank_desc: "Kompanie wsparcia wspomagające jednostki frontowe podczas spotkań z zapuszkowanymi wrogami."
 anti_air_desc: "Broń przeciwlotnicza dla jednostek frontowych. Przydatna na komary."
 artillery: "Wsparcie moździerzowe"
 artillery_desc: "Jednostki z moździerzami wspierające swoich towarzyszy broni cholernie bliskim ostrzałem."
 rocket_artillery: "Wsparcie artylerii rakietowej"
 rocket_artillery_desc: "Artyleria rakietowa napieprzająca na oślep w stronę wroga."
 rocket_artillery_brigade_desc: "Artyleria rakietowa napieprzająca na oślep w stronę wroga."
 anti_tank_brigade_desc: "Bataliony wyspecjalizowane w otwieraniu konserw."
 anti_air_brigade_desc: "Jednostki frontowe utrzymujące ładną pogodę i czyste niebo."
 artillery_brigade: "Moździerze"
 artillery_brigade_desc: "Lekka artyleria zaprojektowana do wspierania jednostek znajdujących się niedaleko. Albo do strzelania beczkami z karbidem w niebo."
 cavalry_desc: "Piechota na koniach. Droższa, ale szybsza. Poczuj wiatr we włosach."
 camelry_desc: "Piechota na wielbłądach. Skąd do cholery wziąłeś tu wielbłądy? Znalazł się kuźwa, Lawrence z Arabii..."
 light_armor: "Ciężka piechota zmechanizowana"
 light_armor_desc: "Ciężka zmechanizowana piechota wyposażona w poważniejszą siłę ognia niż samochodziki i pistoleciki. W odróżnieniu od zwykłych zmecholi, jest w stanie zarówno transportować żołnierzy ORAZ bezpośrednio atakować pozycje wroga."
 medium_armor: "Kawaleria pancerna"
 medium_armor_desc: "Czołgi, cały przekrój czołgów; od nowoczesnych czołgów podstawowych, przez zimnowojenne i drugowojenne złomy aż po cokolwiek różni watażkowie są w stanie wykroić z kartonu i osadzić na kółkach."
 motorized_desc: "- Sierżancie!!! Nie wyjeżdżaj znowu!!!\n- Muszę szeregowy, muszę...\n- Ale dlaczego?! Przecież generał w sztabie powiedział, że piechota zmotoryzowana to brudasy i że ta jednostka nie jest nikomu potrzebna.\n- Muszę właśnie po to, żeby ten generał mógł rano iść na front i zobaczyć tam świeżych rekrutów, amunicję itd."
 mechanized_desc: "Jednostka starannie zapakowanych w bewupy zmecholi."
 infantry_desc: "Odpowiednio wyposażone i wyszkolone mięso armatnie."
 bicycle_battalion: "Bataliony rowerowe"
 bicycle_battalion_desc: "Teraz możesz wkurzać nie tylko kierowców, ale też wrogie armie!"
 paratrooper_desc: "Jednostki spadochronowe zdolne do pojawienia się w najmniej spodziewanych miejscach. Bo tylko wariat jest gotów wyskoczyć z całkowicie sprawnego samolotu."
 marine_desc: "Żołnierze wyspecjalizowani w walce morskiej, wspierani przez barki i karasie w lokalnych rzekach."
 mountaineers_desc: "Piechota wyspecjalizowana do walki w terenach górskich. Pan generał góry kocha to rekrutuje i nie narzeka."
 militia_desc: "Mięso, najczęściej mielone - słabo wyszkolone, słabo wyposażone bandy ochotników i milicji, które stanowią trzon wojsk watażków."
 recon: "Oddział zwiadu kawalerii"
 recon_desc: "Małe oddziały zwiadowcze poruszające się przed głównymi siłami pozwalają nam rozpoznać pozycję i liczebność nieprzyjaciela."
 mot_recon_desc: "Kompanie zwiadu używają lekkich ciężarówek i motocykli, żeby bardziej wyprzedzać główne siły i chronić flanki."
 armored_car_recon: "Kompania lekkich pojazdów opancerzonych zwiadu"
 armored_car_recon_desc: "Kompania zwiadu wyposażona w samochody pancerne może atakować wroga i uniemożliwiać jego zwiadowcom zdobycie cennych informacji."
 light_tank_recon_desc: "Używając lekkich czołgów do celów zwiadowczych, możemy prowadzić rozpoznanie ogniowe i dokładniej ustalić, z kim mamy do czynienia."
 armored_car: "Samochód pancerny"
 armored_car_desc: "Kuloodporne (najczęściej jednak nie) samochody które pozwalają na wjechanie w szeregi wroga jak w masło. O ile starczy Ci paliwa i nie jest to Maluch."
 logistics_company_desc: "Jednostka odpowiedzialna za zaopatrzenie całej dywizji w bułki, wędliny, itd."
 maintenance_company_desc: "Brygada szwagrów, z których każdy pracował w warsztacie. Nie dajcie im klepać nic poważnego bo się nie wypłacicie."
 motorized_rocket_brigade: "Zmot. artyleria rakietowa"
 motorized_rocket_brigade_short: "Zmot. art. rak."
 motorized_rocket_brigade_desc: "Samobieżna artyleria rakietowa może być wyposażona w kilka większych wyrzutni, które szybko zmieniają położenie po ostrzelaniu celu."
