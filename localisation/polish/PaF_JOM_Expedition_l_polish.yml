## Events ##

 jom_expedition.1.t: "Powrót do Folkvangr" 
 jom_expedition.1.desc: "Folkvangr - miejsce, w którym wszystko się zaczęło i gdzie dawni bogowie uśmiechnęli się do karminowych wikingów. Osada założona na wschodnim wybrzeżu Bornholmu przez zagubioną, lecz wierną drużynę wojowników, po wielkim exodusie stała się czymś w rodzaju atrakcji turystycznej. Grupy zaintrygowanych Duńczyków i przybyszów z innych krajów, a nawet socjologów, zjeżdżały tu, by oglądać tę osobliwą wioskę wzniesioną przez współczesnych wikingów z Polski."
 jom_expedition.1.a: "Weźmy to co zostawiliśmy." 
 
 jom_expedition.2.t: "Pozostałości po Exodusie"
 jom_expedition.2.desc: "Niewielka grupa knarrów wpłynęła do pustego, okazałego portu, niosąc w karminowych żaglach rześki wiatr znad Bałtyku. Wikingowie ujrzeli to, co porzucili zaledwie kilka miesięcy wcześniej. Gdy patrzyli na chaty, w których jeszcze niedawno mieszkali - w większości zawalone ze starości i zaniedbania - zalały ich wspomnienia mozolnej pracy przy budowie i przygotowywaniu wielkiej floty.\n\nKu irytacji miejscowej branży turystycznej, w ciągu kilku godzin osadę Folkvangr ogołocono ze wszystkich kosztowności i materiałów dobrej jakości, jakie pozostały po exodusie. Na pamiątkę ostatniego pożegnania z ziemią tak im drogą, choć gościła ich tak krótko, karminowi wikingowie wznieśli kamień runiczny w miejscu dawnego długiego domu. Przez chwilę modlili się do Wszechojca, po czym wrócili na okręty. Pokłady mieli wypełnione materiałami, które posłużą na ich nowych ziemiach, za błękitną połacią Bałtyku."
 jom_expedition.2.a: "Odpływamy z błogosławieństwem Freyi."
 
 jom_expedition.3.t: "EMPTY"
 jom_expedition.3.desc: "EMPTY"
 jom_expedition.3.a: "EMPTY"
 
 jom_expedition.4.t: "Kraina Gotów" 
 jom_expedition.4.desc: "Największa z wysp Bałtyku, pradawna ojczyzna sławnych Gotów, zwróciła uwagę wikingów z Jomsborga ze względu na swoje dziejowe znaczenie. Gotland, od stuleci należący do korony szwedzkiej, skrywa w swoim największym mieście prawdziwy skarbiec zabytków. Wieść o tym dotarła do Karmazynowego Jarla, gdy tropił znaki przodków i ich dziedzictwo. Do Visby wysłano niewielką flotę, ku zdumieniu mieszkańców, którzy początkowo wzięli przybyszów za wyjątkowo zagorzałych miłośników kultury wikingów odwiedzających muzeum." 
 jom_expedition.4.a: "Przywitajmy się z tubylcami!" 
 jom_expedition.4.b: "Dziedzictwo przodków czeka!" 
 
 jom_expedition.5.t: "Ciepłe powitanie w Visby"
 jom_expedition.5.desc: "Ku zaskoczeniu miejscowych stróżów prawa odziani w prymitywne skóry przybysze okazali się przyjaźni. Po przybiciu knarrami do plaży nieopodal Visby witali kąpiących się ludzi bardzo łamaną duńszczyzną. Zrobiwszy sobie kilka zdjęć ze zdezorientowanymi, ale zaciekawionymi turystami i mieszkańcami, wikingowie ruszyli do miasta pod czujnym okiem policjantów. Burmistrz szybko pojawił się w porcie, by powitać niezwykłych gości. Po serii gestów i chaotycznych prób porozumienia zawarto umowę handlową, dzięki której kupcy z Jomsborga mogli wypełnić ładownie knarrów żywnością i magnesami na lodówkę z motywem Gotów.\n\nTuż przed wypłynięciem burmistrz dorzucił jeszcze premię: 25-procentową zniżkę na grupowy bilet do Muzeum Gotlandzkiego. Wikingowie z radością skorzystali z oferty. Spędzili kilka godzin na zwiedzaniu i podziwianiu dziejów swoich przodków. Z głowami pełnymi natchnienia i brzuchami pełnymi miodu z miejscowego browaru wrócili do łodzi i pożegnali mieszkańców. Wkrótce karminowe żagle zniknęły za horyzontem."
 jom_expedition.5.a: "Musimy tam kiedyś wrócić."
 
 jom_expedition.6.t: "Noc w muzeum"
 jom_expedition.6.desc: "Miejscowa policja ani trochę nie była gotowa na to, co miało nastąpić. Knarry pod karminowymi sztandarami runęły na tutejsze plaże. Opór szybko padł, kiedy mieszkańcy pojęli, po co przybyli najeźdźcy: po Muzeum Gotlandzkie w Visby. Straty w ludziach były niewielkie, bo większość osób ewakuowała się z budynku, lecz kilku gorliwych kustoszy oddało życie, próbując powstrzymać karminową zarazę. Wypolerowane posadzki spłynęły czerwienią, a runy i zabytki zrabowano z muzealnych sal. \n\nGdy muzeum zostało opróżnione, skrzynie pełne artefaktów zaniesiono na knarry. Resztę miasta odgrodzono, oczekując posiłków szwedzkiej gwardii narodowej, więc wikingowie z Jomsborga podpalili obrabowany budynek i ruszyli z powrotem na morze. Mieszkańców Visby pozostawili równie oszołomionych, co straumatyzowanych. Wkrótce Karmazynowy Jarl otrzyma bezcenną nagrodę - pamiątki po przodkach."
 jom_expedition.6.a: "To nasze dziedzictwo!"
 
 jom_expedition.7.t: "Korona Północy" 
 jom_expedition.7.desc: "Wenecja Skandynawii lśniła w porannym słońcu, a zimny północny wiatr przemykał między budynkami. Wzrok Karminowego Jarla spoczął na bogatej metropolii najsilniejszej z północnych monarchii. Dla wikingów Szwecja jest jedną z ziem przodków, od których wojownicy wywodzą swój ród. Królestwo królowej Wiktorii posiada ogromne bogactwa - kulturalne, finansowe i te ukryte głęboko pod ziemią. Gdy karminowe żagle wyłoniły się zza horyzontu, kanały Sztokholmu miały się wkrótce stać wyjątkowo interesujące - na dobre lub na złe." 
 jom_expedition.7.a: "Ivarr, zagraj coś skocznego." 
 jom_expedition.7.b: "Ivarr, zagrzej chłopaków do walki." 
 
 jom_expedition.8.t: "Audiencja u Królowej"
 jom_expedition.8.desc: "Ku miłemu zaskoczeniu mieszkańców wikingowie przybyli w dobrych zamiarach, przywożąc rozmaite towary na wymianę. Przy żywym rytmie bębnów karawana zeszła na ląd w portach kanałowych i ruszyła ku centrum miasta. Cel? Audiencja u królowej. Gigantyczne korki sparaliżowały cały Sztokholm, a przeciążona policja nie bardzo wiedziała, co począć z tym osobliwym wydarzeniem. \n\nPo przybyciu pod pałac szwedzka monarchini powitała rozradowany orszak. Królowa Wiktoria przyjęła od wikingów z Jomsborga rozmaite dary i błyskotki, których wartość była w najlepszym razie wątpliwa, lecz sam gest szczerze ją rozbawił i ujął. W zamian wykorzystała wpływy i znajomości, by zapewnić sąsiadom zza Bałtyku cenne materiały, kontrakty stoczniowe oraz wiedzę techniczną. Wikingowie wrócili do portu nowym volvo, podarunkiem pożegnalnym królowej dla niezwykłych gości."
 jom_expedition.8.a: "Jak mamy zmieścić auto na knarra?"
 
 jom_expedition.9.t: "Paradoks Wikingów"
 jom_expedition.9.desc: "W całym porcie stolicy rozbrzmiewały wojenne bębny, z każdą sekundą coraz głośniejsze. Korzystając z kanałów, knarry pod sztandarem Jomsborga szybko przełamały opór miejscowych władz. Karminowi wojownicy wkroczyli do miasta znaczną siłą, po czym rozproszyli się, rabując i łupiąc wszystko, co przedstawiało jakąkolwiek wartość. Wszystko w imię ściągnięcia reparacji za siedemnastowieczny Potop, których Szwedzi nigdy nie zapłacili. Teraz wikingowie z polskiego wybrzeża przybyli odzyskać to, co zdecydowanie nie jest szwedzkie - wraz z odsetkami. Gdy pożary obejmowały kolejne dzielnice, a szwedzką stolicą zawładnął chaos, niewielki oddział uzbrojonych w topory, odzianych w peleryny huskarlów samego Jarla ruszył ku siedzibie Paradox Interactive. Legenda głosiła bowiem, że głęboko w trzewiach tamtejszych piwnic spoczywa jedyny egzemplarz Svea Rike IV. \n\nGdy zapadła noc, pożary zaczęły dogasać. Szwedzka armia mobilizowała się do obrony Sztokholmu, toteż wikingowie przegrupowali się i weszli na knarry, które jęczały pod ciężarem łupów. Kiedy flota umykała szwedzkiej marynarce, komputer w długim domu Karminowego Jarla czekał już na legendarną noc grania."
 jom_expedition.9.a: "ZROBILI CZWARTĄ CZĘŚĆ I NAM NIE POWIEDZIELI?!"
 
 jom_expedition.10.t: "Wyprawa na Rugię" 
 jom_expedition.10.desc: "Niedługo po nordyckim odrodzeniu na Bornholmie nowe pokolenie wikingów zaczęło się zastanawiać, czy tylko oni rozniecili na nowo tradycję morskich wojowników. Zagłębili się w księgi historyczne i poznali dzieje słowiańskich chąśników, którzy niegdyś zamieszkiwali ziemie należące dziś do Niemców. To właśnie na Rugii znajdował się ich ośrodek religijny. Puszczając wodze fantazji, wikingowie postanowili udać się na wyspę w nadziei, że znajdą potomków chąśników, gotowych zawiązać sojusz albo stoczyć z nimi równy bój.\nPo przybyciu zastali jednak wyłącznie miejscowych rybaków i turystów. Rozwiały się nawet marzenia o odwiedzeniu lub spaleniu sławnej świątyni Arkony. Świątynia, a nawet brzeg, na którym stała, przepadły, pochłonięte przez historię i morze." 
 jom_expedition.10.a: "Walka z nimi nie zapewni nam miejsca w Walhalli." 
 jom_expedition.10.b: "Pora przypomnieć im o ich dziedzictwie."
 
 jom_expedition.11.t: "Ślady wojennej ścieżki"
 jom_expedition.11.desc: "Miejscowa gospodarka opierała się głównie na rybołówstwie i turystyce, więc zwykli kupcy niewiele mogli im zaoferować, choć wikingów cieszył każdy słoik marynowanego śledzia i każdy wręczony im plik banknotów. Nie po to jednak tu przybyli. Chcieli zobaczyć najnowszy dowód wojowniczego ducha tych ludzi. Udali się do Sassnitz, by obejrzeć HMS Otus, słynny miejscowy okręt-muzeum. Oświadczyli, że chcą kupić łódź podwodną i przywrócić jej dawną chwałę. Miejscowy przedsiębiorca, do którego należała jednostka, zgodził się za sowitą zapłatą. Gdy kupcy z dziwnej krainy wyrazili rozczarowanie, że nie udało im się nabyć prawdziwego niemieckiego okrętu, w ramach pocieszenia przedsiębiorca skierował ich do Peenemünde. Stała tam stara radziecka łódź podwodna U-461, którą mogli zabrać w drodze powrotnej."
 jom_expedition.11.a: "Szkoda, że nie starczyło czasu na U-995."
 
 jom_expedition.12.t: "Praktyczna nauka"
 jom_expedition.12.desc: "Rozwścieczeni brakiem godnych przeciwników lub sojuszników i żądni zemsty za nordycką krew przelaną przez przodków mieszkańców wyspy, wikingowie urządzili na Rugii brutalny najazd. Wysadzili przeprawę Strelasund, jedyną drogę prowadzącą na wyspę, po czym zaczęli palić budynki i ograbiać z kosztowności zamożnych niemieckich turystów. Podpalili posąg Świętowita, jeden z ostatnich symboli słowiańskiej obecności na wyspie, mszcząc wszystkie upokorzenia, których ich praojcowie doznali z rąk chąśników.\nW drodze do domu zatrzymali się w Peenemünde, by zabrać starą rakietę V2 i wykorzystać ją przeciw wrogom. Jeden ze świadków twierdził, że jakiś wiking próbował dosiąść rakiety i polecieć na niej z powrotem do Vendlandu."
 jom_expedition.12.a: "Niech te cierpienia przebudzą ducha Rugii!"
 
 jom_expedition.13.t: "Hanzeatyckie wybrzeże Niemiec" 
 jom_expedition.13.desc: "Lubeka, niegdyś królowa Hanzy, straciła na znaczeniu, gdy morskie szlaki handlowe przesunęły się na zachód i wzbogaciły pobliski Hamburg. Mimo to pozostaje jednym z najważniejszych portów Europy, zwłaszcza dla państw leżących nad Bałtykiem. Nic dziwnego, że miasto i jego okolice przyciągnęły uwagę karminowych wikingów. Z pokładów knarrów z gniewem spoglądają tu na utracone ziemie Duńczyków: wielkie miasto Hedeby i potężne umocnienia Danevirke, obrócone w ruinę przez dziesięciolecia niemieckich zaniedbań. Mogą kipieć z wściekłości, lecz widzą też niemiecką flotę, postawioną w stan gotowości po wcześniejszych wyczynach wikingów na niemieckiej ziemi." 
 jom_expedition.13.a: "Podejdźmy do tego na spokojnie." 
 jom_expedition.13.b: "Weźmiemy Hedeby, a nawet Kanał Kiloński!"
 
 jom_expedition.14.t: "Hanzeatyckie Miasto Jomsborg"
 jom_expedition.14.desc: "Normanowie wywiesili flagę dyplomatyczną, a niemieckie kutry wojskowe odprowadziły ich do portu. W mieście powitali ich burmistrz, niemiecki minister finansów oraz europejski komisarz do spraw gospodarczych i finansowych. Pokazano im starówkę Lubeki i jej liczne zabytki. Zapewniono też, że dawne miejsca nordyckiego kultu są należycie chronione i utrzymywane. Następnie zaprowadzono ich do ratusza, gdzie przedstawiono propozycję umowy handlowej między Unią Europejską a Vendlandem. Aby dodatkowo osłodzić układ, Miasto Jomsborg wpisano na elitarną listę miast hanzeatyckich. Wikingowie odpłynęli z poczuciem, że zrobili wszystko, co mogli, by wzbogacić ojczyznę."
 jom_expedition.14.a: "Zrobiliśmy wszystko, co mogliśmy."
 
 jom_expedition.15.t: "Niemiecki sztorm"
 jom_expedition.15.desc: "Niemcy zażądali, by wikingowie wywiesili banderę dyplomatyczną albo białą flagę. Ci nie zrobili ani jednego, ani drugiego. Otworzyli ogień do niemieckiego kutra patrolowego i spróbowali przebić się dalej, by przeprowadzić szybki desant. Liczyli, że Niemcy będą równie nieprzygotowani jak podczas wyprawy na Rugię. Mylili się.\nGdy tylko padły pierwsze strzały, zbliżyły się do nich liczne szybkie patrolowce. Błyskawicznie otoczyły wikingów i rozbiły ich siły. Bitwa skończyła się szybko. Wszyscy uczestnicy najazdu dryfowali teraz martwi po ciemnych wodach Bałtyku, pośród szczątków swoich okrętów. Niemcom zadali jedynie znikome straty."
 jom_expedition.15.a: "Do zobaczenia w Walhalli."
 
 jom_expedition.16.t: "Przystanek w Kłajpedzie" 
 jom_expedition.16.desc: "Kłajpeda bardzo różni się od innych litewskich miast. Szachulcowa architektura starówki i uporządkowany układ ulic zdradzają wpływy niemieckie i szwedzkie. Elegancką dzielnicę otaczają liczne bloki odziedziczone po czasach ZSRR. Przetrwały próbę czasu, zapewniając tanie i wygodne mieszkania każdemu, kto ich potrzebował. Uporządkowane, eleganckie germańskie serce otoczone krzepkim, betonowym socjalistycznym ciałem. A wszystko to na dawnych ziemiach Rzeczypospolitej. Karminowi wikingowie powinni czuć się tu jak w domu." 
 jom_expedition.16.a: "Czas na trochę bratniego handlu" 
 jom_expedition.16.b: "Jesteśmy w domu. Zabieramy co nasze."
 
 jom_expedition.17.t: "Marzenia szkutników"
 jom_expedition.17.desc: "I dom rzeczywiście znaleźli. Za przywiezione pieniądze wikingowie otrzymali liczne zbiorniki ropy, które mieli zabrać ze sobą. Przed wypłynięciem znaleźli jeszcze czas, by powłóczyć się po litewskich tawernach, czym przynieśli wiele radości ponurym robotnikom portowym. W wolnych chwilach recytowali z pamięci monumentalne sagi opisujące zarówno ich pradawne, jak i najnowsze wyczyny. Opowieści o przygodach w obcych krajach tak urzekły wielu mieszkańców, że postanowili zaciągnąć się do Alþýduher. Spora część z nich była inżynierami specjalizującymi się w budowie okrętów. Chcieli nauczyć wikingów, jak podbijać siedem mórz na czymś okazalszym niż przerobiona barka rybacka."
 jom_expedition.17.a: "Zdobyliśmy dziś kilku przyjaciół."
 
 jom_expedition.18.t: "Ostatni najazd na Litwę"
 jom_expedition.18.desc: "W przekonaniu wikingów miasto i tak powinno należeć do nich. Z ich perspektywy zabranie tylko części jego zasobów było więc aktem dobroczynności. Ciemność nocy rozświetliły eksplozje w litewskim porcie. Najeźdźcy użyli lin zakończonych hakami, by wedrzeć się na tankowce i przejąć je, po czym ruszyli na północ, ku terminalowi naftowemu w Butyndze nieopodal Połągi. Następnie popłynęli do domu, zabierając czerwone beczki Orlenu pełne paliwa dla kolejnych najazdów."
 jom_expedition.18.a: "Wygląda na to, że Litwa została bez dostępu do morza."
 
 jom_expedition.19.t: "Ziemie ludu Kurir" 
 jom_expedition.19.desc: "W przeszłości dzielni Kurirzy sprzeciwiali się zarówno królom Szwecji, jak i Danii. Szczególnie z Duńczykami łączyła ich długa historia konfliktów. Pomogli szwedzkiemu królowi Sigurdowi Ringowi w wojnie z Haraldem Wojennym Zębem, zapewniając temu pierwszemu panowanie nad oboma królestwami. Sto lat później odparli duński najazd na swoje ziemie. Co im to dało? Niedługo później podbiła ich Szwecja. Taki właśnie wydaje się los Kurirów, powtarzający się w dziejach raz za razem. Niedawno wydarzyło się to ponownie, gdy podporządkowali się Evrópusambandið w zamian za ochronę przed Garðaríki." 
 jom_expedition.19.a: "ESB i tak łupi ich wystarczająco." 
 jom_expedition.19.b: "Nie zasługują nawet na te pozory niezależności."
 
 jom_expedition.20.t: "Nie ma kartöflura"
 jom_expedition.20.desc: "Wikingowie wylądowali w pobliżu Windawy. Z przyjemnym zaskoczeniem ujrzeli przy lotnisku flagę miasta: srebrno-złoty róg pocztowy na purpurowej tarczy, umieszczonej na purpurowym krzyżu nordyckim. Perspektywa handlu z mieszkańcami nieco ostudziła nawet najbardziej krwiożerczych berserków.\nNocą spotkali się z dyrektorem terminalu węglowego. Rząd nie chciał prowadzić z wikingami żadnego handlu, lecz on był gotów zrobić wyjątek. Za niewielką, regularną opłatą przekazywałby im część węgla - albo poprzez nielegalny transport morski, albo ujawniając położenie legalnych statków, tak by wikingowie mogli bezkrwawo przejąć ładunek. Dla osłody miał dorzucać również kilka worków cementu. Wikingowie odpłynęli zadowoleni z układu."
 jom_expedition.20.a: "Wszystko pod nosem Europy."
 
 jom_expedition.21.t: "Halucynacje na morzu"
 jom_expedition.21.desc: "Łotewskiemu dokerowi chlusnęła na czoło ropa wyciekająca z przepełnionego zbiornika. Ale to była tylko halucynacja. To nie była ropa, lecz jego własna krew z rany zadanej wikińskim toporem. Kolega, Aivars, próbował przyłożyć mu kompres. Tyle że Aivars tydzień temu zmarł na infekcję. W rzeczywistości był to inny wiking, który przeszukiwał kieszenie rannego w poszukiwaniu łupu.\n- Czeka go niezła niespodzianka - pomyślał doker, gdy wiking niczego nie znalazł w kieszeniach Łotysza, a na dodatek zgubił własną sakiewkę. W ostatnich chwilach życia zastanawiał się, jak rodzina poradzi sobie bez żywiciela. Szybko jednak zdał sobie sprawę, że od dawna nie zarabiał ani na chleb, ani właściwie na cokolwiek. Jego rodzinę wysłano zaś do obozu reedukacyjnego za antyunijne zachowanie. Mógł już umrzeć w spokoju."
 jom_expedition.21.a: "Jego trud skończon."
 
 jom_expedition.22.t: "Wyspy Eistlandu" 
 jom_expedition.22.desc: "'Pewnym jest, że wróg z Eistlandu\njasnowłosego króla Szwecji zgładził.\nNa brzegu Eistlandu, nad szwedzkimi grobami,\nMorze Wschodnie śpiewa pieśń falami;\nlament po królu Yngvarze to oceanu grzmot,\nco o skalisty brzeg odbija swój głos.'\n\nTak Thjódólf z Hvini mówił o królu Ingvarze, synu Eysteinna, i jego dzielnym najeździe na ziemie Eistów. Niektórzy twierdzą, że podobne opowieści z sag to jedynie bajki. Co powiedzą, gdy sagi okazują się prawdą? Ponad dwie dekady temu króla Ingvara i jego załogę odnaleziono w pogrzebanym okręcie w Salme na wyspie Saaremaa.\nWikingowie stoją przed wyborem: podjąć współpracę z wrogiem, który zasłużył na zwycięstwo, albo pomścić króla Ingvara i jego towarzyszy oraz sprowadzić ich ciała do domu." 
 jom_expedition.22.a: "Oddajmy cześć zmarłym i żyjącym." 
 jom_expedition.22.b: "Niektóre zbrodnie nie mogą pozostać niepomszczone."
 
 jom_expedition.23.t: "Szanowani opiekunowie"
 jom_expedition.23.desc: "Przy miejscu pochówku wikingowie odkryli grupę kapłanów i wiernych. Chroniła ich ceremonialna straż, odziana w kolczugi i uzbrojona we włócznie, a wszyscy zgromadzili się wokół ołtarza i bławatkowego sztandaru. Normanowie zbliżyli się pokojowo, by dowiedzieć się, jaki charakter ma odprawiany obrzęd. Okazało się, że zebrani przybyli z tego samego powodu - świętowali wielką bitwę stoczoną w tym miejscu. Darzyli wikingów i ich czyny ogromnym szacunkiem. Wojownicy spod karminowego sztandaru pogratulowali z kolei Eistom sukcesu ich przodków. Obie strony uznały, że wypada wspólnie urządzić święto w imię Thora i Taary - dwóch oblicz tego samego boga - i uczcić poległych po obu stronach.\nPo ceremonii skierowano wikingów do urzędników Eistlandu i Unii Europejskiej, by wynegocjowali umowę handlową między oboma państwami. W zamian za złoto wikingowie mieli otrzymać pomoc eistyjskich inżynierów oraz napływ dóbr cywilnych."
 jom_expedition.23.a: "Przebaczamy i prosimy o przebaczenie."
 
 jom_expedition.24.t: "Niespodziewane powitanie"
 jom_expedition.24.desc: "Przybywając na Saaremę, wikingowie spodziewali się kolejnego bezwolnego stada udomowionego przez technologię, która miała je wywyższyć. Zamiast tego zastali kobiety i mężczyzn w kolczugach oraz spiczastych metalowych hełmach, uzbrojonych w topory, włócznie i tarcze. Nieśli sztandar z bławatkiem i przygotowywali się do jakiegoś obrzędu.\nNajeźdźcy dostrzegli okazję do równej walki, która ucieszyłaby Odyna. Wyszli więc z łodzi i bez użycia broni palnej ruszyli na przeciwników. Eistowie przyjęli wyzwanie.\nRozpoczął się taniec stali, a szczęk toporów zagłuszył huk fal. Walka trwała, lecz żadna ze stron nie mogła zdobyć przewagi. Bój był tak wyrównany, że ani jeden napastnik czy obrońca nie padł martwy. Po dziesiątkach wymienionych ciosów zarządzono przerwę. Obie strony oddały sobie honory i wyjaśniły, po co przybyły na wyspę. Eistowie zrozumieli źródło gniewu Normanów, postanowili więc odkupić czyny swoich praojców i wyruszyć z nimi na wyprawy pod karminowymi sztandarami."
 jom_expedition.24.a: "Jest wiele sposobów by zapłacić za swoje zbrodnie."
 
 jom_expedition.25.t: "Wybrzeża Finów" 
 jom_expedition.25.desc: "Historia stosunków fińsko-nordyckich sięga starożytności. Po stuleciach zmagań na Bałtyku Szwedzi podbili swoich wrogów i mimo osobliwości fińskiego języka oraz obyczajów przenieśli własną religię i kulturę za Morze Alandzkie. Przykład Finów napełnia serca wikingów nadzieją, że nordyckie wartości mogą rozprzestrzenić się poza Skandynawię, a być może również Wendowie przyjmą nowy system kulturowy.\nNie pora jednak marzyć o przyszłości. Wikingowie muszą teraz manewrować pomiędzy niezliczonymi drobnymi szkierami rozsianymi u wybrzeży Finlandii." 
 jom_expedition.25.a: "Spróbujmy odkupić nasze winy" 
 jom_expedition.25.b: "Finowie i tak nie są zbyt gadatliwi."
 
 jom_expedition.26.t: "Connecting People"
 jom_expedition.26.desc: "Podczas podróży wikingowie odwiedzili liczne miasta, miasteczka i wsie. Za każdym razem nieśmiali Finowie odmawiali im handlu albo zwyczajnie ich ignorowali, nie chcąc mieć nic wspólnego z ludźmi, których zapewne brali za odzianych w futra barbarzyńców. Za każdym razem wędrowcy musieli przemierzać niegościnne fińskie wybrzeże i zakładać nowe obozy. Wreszcie, pośród nocy, znaleźli się na mroźnej dalekiej północy kraju, debatując, czy nie wymusić umowy handlowej - że tak powiemy - jednostronnie. \n\nWtedy drużyna wysłana po żywność znalazła drewnianą chatę, w której wciąż paliło się światło. Podeszli i zapukali. Drzwi otworzył młody, gładko ogolony mężczyzna w koszuli flanelowej. Powitał ich, przedstawił się jako Seppo Ilmarinen i zapytał, co robią w tych stronach. Wikingowie opowiedzieli o swoich handlowych zamiarach i złej passie. Seppo odparł, że może mieć coś, co ich zainteresuje. Pokazał im pancerz przypominający zbroję lamelkową, tyle że zamiast metalowych płytek wykonany ze starych modeli telefonów Nokia. Gdy podróżnicy zareagowali sceptycznie, osobliwy rzemieślnik założył dzieło i polecił jednemu z wikingów uderzyć go toporem. Po ciosie wynalazca zgiął się wpół z bólu, lecz telefoniczny pancerz pozostał nietknięty. Zainteresowani wikingowie poprosili go, by przystosował wynalazek do roli pancerza czołgowego."
 jom_expedition.26.a: "Będziemy niezniszczalni!"
 
 jom_expedition.27.t: "Finlandia, Finlandia"
 jom_expedition.27.desc: "Wikingowie przygotowali się, by powtórzyć cykl rozpoczęty przez przodków i ponownie najechać ziemię Finów. Naostrzyli topory, załadowali broń i zeszli na brzeg w pobliżu jednej z wiosek, którą zamierzali ograbić i wykorzystać jako obóz przed wyprawą po główną zdobycz - Helsinki.\n\nPrzeszkodził im jeden z mieszkańców, który ośmielił się do nich podejść. Był to olbrzymi mężczyzna o przenikliwie błękitnych oczach i jasnej brodzie, odziany w futro. Przedstawił się jako Antero Vipunen i oznajmił, że żaden wiking nigdy więcej nie złupi fińskiej ziemi. Rzucił im wyzwanie. Normanowie wybrali największego i najsilniejszego spośród siebie, Heimríkra, który i tak był od przeciwnika niższy o głowę. Honorowy wiking pozwolił Finowi wskazać broń. Ten wyrwał z ziemi pobliski pień. Jego przeciwnik dobył miecza, lecz wielkolud tylko postawił pień przed sobą. Potem sięgnął pod płaszcz, gdzie ukrywał butelkę wódki. Wyzwaniem był pojedynek na picie.\n\nAni Heimríkr, ani żaden z jego towarzyszy nie potrafił pokonać Antera, a z upływem czasu coraz mniej z nich pamiętało o misji. Po zawodach zapytali, czy mogą przenocować we wsi."
 jom_expedition.27.a: "Nikt z nich do Jomsborgu nie powrócił"
 
 jom_expedition.28.t: "Drugie lądowanie Ruryka" 
 jom_expedition.28.desc: "Państwo ruskie założyli Waregowie - Normanowie, którzy zapuszczali się na ziemie Słowian i Finów. Ruryk, założyciel dynastii władającej Rusią przez stulecia, był jednym z tych wikingów. Od tamtej pory minęły jednak całe wieki, a pod wpływem kultury Wschodu i Kościoła prawosławnego Rosjanie stali się innym ludem. Rosja wciąż pozostaje względnie potężnym państwem, choć osłabiły ją niedawna wojna, sankcje gospodarcze i zmiana reżimu. Najazd nadal byłby bardzo ryzykowny, lecz wikingowie z Jomsborga nie lękają się ryzyka. Wiedzą też, że nie sposób pertraktować z ludźmi, którzy śmią nazywać się Rosjanami. Obrali za cel Petersburg - symbol rosyjskiej potęgi i dumy, a zarazem skarbiec bogactw oraz kultury. Muszą jednak zachować ostrożność, bo państwo rosyjskie słynie z bezwzględnej i brutalnej odpowiedzi na każde zagrożenie." 
 jom_expedition.28.b: "Gardaríki nie jest już tym samym krajem."
 
 jom_expedition.29.t: "Serce giganta"
 jom_expedition.29.desc: "Grupa zwiadowcza Jomswikingów działająca w pobliżu Bazy Kosmicznej Pituffik powróciła z bezprecedensowym odkryciem. Surowa arktyczna pogoda zmusiła ją do szukania schronienia na północ od bazy. Wyprawa ostrożnie zbliżała się do odległej instalacji, płynąc wzdłuż przybrzeżnego lodu i trzymając się z dala od widocznych tras patroli oraz infrastruktury. Nagły sztorm wyrzucił jednostkę na brzeg w odludnym zakątku wybrzeża. Podczas oceny uszkodzeń i poszukiwania materiałów nadających się do odzysku członkowie załogi zauważyli częściowo odsłoniętą metalową konstrukcję, uwięzioną w lodzie i żwirze. Późniejsze wykopaliska wykazały, że rozmiarami i budową odpowiada bombie atomowej, którą według doniesień wojsko Stanów Zjednoczonych utraciło w tym rejonie podczas arktycznego incydentu w latach sześćdziesiątych. Urządzenie nosiło ślady silnego działania pogody, lecz było w znacznej mierze nienaruszone. Głowicę zabezpieczono pod ścisłym nadzorem. Nikt nie pisnął ani słowa o jej planowanym zastosowaniu, logistyce transportu czy o tym, czy Stany Zjednoczone zostały powiadomione o znalezisku. I lepiej, żeby tak zostało."
 jom_expedition.29.a: "Może lepiej nie odzywajmy się na ten temat."
 
 jom_expedition.30.t: "Zima przybyła po Gardaríki"
 jom_expedition.30.desc: "Od strony morza Petersburg osłania Newa, strzeżona przez liczne fortyfikacje i bazy morskie, takie jak Kronsztad. Samo miasto jest labiryntem kanałów i wąskich ulic, w którym najeźdźcom trudno się poruszać. Na szczęście okręty wikingów zbudowano z myślą o płytkich wodach, dzięki czemu bez trudu manewrują po kanałach i przepływają pod mostami. Głównym wyzwaniem miała być rosyjska marynarka, lecz nigdzie jej nie było, gdy przyszło bronić własnego miasta. Coś jest nie tak z państwem rosyjskim, ale wikingów to nie obchodzi. Po szybkim najeździe na przedmieścia znaleźli się w samym sercu Petersburga, gdzie ujrzeli Ermitaż, Pałac Zimowy i cerkiew Zbawiciela na Krwi. Ich wizyta była krótka i brutalna, lecz prawdziwa nagroda kołysała się na rzece: krążownik Aurora, symbol rewolucji rosyjskiej. Zanim ktokolwiek zdążył zareagować, wikingowie weszli na pokład i przejęli okręt. Zamiast rozpętać kolejną rewolucję, postanowili po prostu zabrać go do domu jako trofeum i wcielić do floty Jomsborga. Ten czyn nigdy nie powinien był się powieść. Powinien być niemożliwy. Jest jednak kolejnym dowodem pogrążania się Rosji w chaosie i słabości. Nie jest już postrachem, którym była niegdyś, a wikingowie właśnie pokazali światu jej bezbronność."
 jom_expedition.30.a: "Rosyjski niedźwiedź mocno śpi"
 
 jom_expedition.31.t: "Poszukiwacze zaginionej Arki" 
 jom_expedition.31.desc: "W ostatnich latach wielu uchodźców i wygnańców opuściło Polskę - z własnej woli albo pod przymusem. Większość rozpłynęła się w morzu cudzoziemców, próbując ułożyć sobie nowe życie, lecz nieliczni tworzyli zorganizowane grupy, takie jak Alþýduher, zdecydowane wrócić do Ojczyzny i walczyć o nią. Nieliczni, ale niejedyni. Jedną z takich grup była drużyna piłkarska Arka Gdynia. Jej członkowie zbudowali Nową Arkę, ogromną łódź służącą do wywożenia uchodźców z Vendlandu, aby mogli przegrupować się w Skandynawii i pewnego dnia wrócić do Polski, gdy opadnie kurz wojny. Ze względu na liczne podobieństwa karminowi wikingowie uważają Arkowców za braci i siostry we wspólnym losie, dlatego podczas podróży postanowili nawiązać z nimi kontakt." 
 jom_expedition.31.a: "Dobrze, że to nie Green Bay Packers." 
 
 jom_expedition.32.t: "Holmgang"
 jom_expedition.32.desc: "Wikingowie rzeczywiście ujrzeli ogromną drewnianą łódź wyłaniającą się zza horyzontu. Opowieści były prawdziwe, a Arka nie opuściła Szwecji. Przynajmniej jeszcze nie. Gdy podpłynęli bliżej, zauważyli prowizoryczne chaty przyczepione do miasteczka Falsterbo niczym pąkle do kadłuba okrętu. Dla Normanów nie był to widok zupełnie obcy. Podróżnicy zbliżyli się bez przeszkód. Miejscowe kutry patrolowe najwyraźniej przywykły do dziwnych gości przybywających na niewielki półwysep.\n\nKiedy zjawiły się karminowe żagle, wysłano komitet powitalny. Arkowcy upewnili się, że Alþýduher nie jest zwaśnionym z nimi klubem piłkarskim, po czym przywitali gości ucztą. Drużyna pogratulowała wikingom dokonania tego, czego sama nigdy nie zdołała osiągnąć - powrotu przez Bałtyk i rozkwitu w ojczyźnie. Pokornie zapytali, czy dzielni karminowi wojownicy zgodziliby się na ustawkę, która posłuży obu grupom za ćwiczenie.\n\nDo walki doszło w pobliskim lesie, gdzie obie grupy starły się na gołe pięści. Zahartowani w boju wikingowie zwyciężyli, lecz przeciwnicy okazali się zaciekli. Niektórzy Arkowcy byli pod takim wrażeniem, że postanowili spełnić marzenie o powrocie do domu pod sztandarem Jarla Sandbjerga, zabierając ze sobą wiedzę o budowie okrętów."
 jom_expedition.32.a: "Miejmy nadzieję że nie zainspirowaliśmy ich do najazdu na Pomorze..."
 
 jom_expedition.33.t: "EMPTY"
 jom_expedition.33.desc: "EMPTY"
 jom_expedition.33.a: "EMPTY"
 
 jom_expedition.34.t: "Cieśniny Duńskie" 
 jom_expedition.34.desc: "Bałtyk robi się dla wikingów zbyt ciasny. Zobaczyliśmy już wszystko, co ma do zaoferowania Morze Wschodnie, i potrzebujemy więcej przestrzeni. Najlepsza droga ku wodom za Cieśninami Duńskimi prowadzi przez Sund, Wielki Bełt i Mały Bełt. Konwencja kopenhaska z 1857 roku otwiera je dla żeglugi handlowej, lecz Duńczycy nie są pewni, czy ewentualne łupieżcze wyprawy można uznać za ekspedycje kupieckie. Nawet niejasny status Vendlandu jako państwa daje im znaczną przewagę nad żeglarzami Sandbjerga." 
 jom_expedition.34.a: "Negocjacje będą konieczne." 
 
 jom_expedition.35.t: "Bezpieczna przeprawa"
 jom_expedition.35.desc: "Negocjacje były trudne. Dyrektor Duńskiego Urzędu Morskiego wyraził obawę, że wiara wikingów wymaga nieustannych najazdów, a on nie wie, czy po wypuszczeniu karminowych okrętów zdoła zapewnić bezpieczeństwo Duńczykom mieszkającym po drugiej stronie cieśnin. Petenci zapewnili go o głębokim szacunku, jakim darzą Królestwo Duńczyków za schronienie udzielone im na Bornholmie. Oświadczyli, że atak na gospodarzy po okazanej hojności byłby dla nich nie do pomyślenia, czego dowodzi ich ponowna wizyta na wyspie.\n\nDyrektor zastanowił się przez chwilę i odparł, że przepuszczenie wikingów byłoby kolejnym aktem dobroczynności, a na to zgodzić się nie może. Od teraz oczekuje stosunków opartych na wymianie. Wikingowie muszą przekazać duńskiemu rządowi jednorazową darowiznę, a potem mogą odpłynąć."
 jom_expedition.35.a: "Zapłaciliśmy cenę w złocie."
 
 jom_expedition.36.t: "Wróg ludu"
 jom_expedition.36.desc: "Wody były spokojne. Zbyt spokojne. Oslofjord wcinał się w ląd na sto dwadzieścia kilometrów, a mimo to nikt nie zatrzymywał wikingów. Minęli kilka wsi i miasteczek, których mieszkańcy ukrywali się przed najeźdźcami, choć nie mieli się czego obawiać. Łupieżcy polowali na znacznie cenniejszą zdobycz. Marzyli, że najpierw powita ich twierdza Akershus, potem zabiorą dla siebie drakkary z muzeum łodzi, a może nawet sławną Gjøę - pierwszy statek, który przepłynął Przejście Północno-Zachodnie - po czym odpoczną w skansenie pośród znajomo wyglądających chat.\n\nTe plany trzeba było jednak odłożyć na później. W połowie fiordu ujrzeli najnowocześniejsze norweskie okręty, które otworzyły ogień do najeźdźców. Na brzegach żołnierze Jego Królewskiej Mości szybko wyszli z ukrycia. Co gorsza, z jednej z mijanych zatoczek wypłynęły kolejne jednostki, odcinając wikingom drogę odwrotu."
 jom_expedition.36.a: "Walka zakończyła się szybciej niż się zaczęła."
 
 jom_expedition.37.t: "Kraina polarnych dni" 
 jom_expedition.37.desc: "Przed wikingami właśnie otworzył się szerszy świat, a oni kipią ciekawością i żądzą krwi. Teraz ruszają ku ostatniemu nordyckiemu krajowi, który dotąd się im wymykał. Norwegia aż roi się od sposobności. Wielu upokorzonych układem z Duńczykami domaga się zadośćuczynienia. Chcą wpłynąć głęboko w Oslofjord, napaść stolicę króla Haakona VIII, zabrać wikińskie łodzie z muzeów i złupić miasto aż do fundamentów. Inni uważają, że wyprawa powinna skupić się na handlu i zdobyciu paliwa dla najnowocześniejszych jednostek, zamiast ryzykować wszystko dla kilku zakurzonych drakkarów. Są też tacy, którzy wolą kompromis i najazd na mniej niebezpieczny obszar, na przykład zachodnie wybrzeże." 
 jom_expedition.37.a: "By pozyskać ich surowce będziemy musieli rozmawiać..." 
 jom_expedition.37.b: "Uderzymy w samo ich serce!"
 jom_expedition.37.c: "Zachód upadnie!"
 
 jom_expedition.38.t: "Hale Naftowego Króla"
 jom_expedition.38.desc: "Wikingowie udali się do zachodniej Norwegii po jedyną rzecz, która uczyniła z tej krainy coś więcej niż szwedzko-duńską kolonię rybacką - ropę. Czarne złoto pozwoliło Norwegii rozkwitać poza Unią Europejską oraz utrzymywać wysoki poziom życia i świadczeń socjalnych. Wikingowie próbowali zbudować podobne społeczeństwo, liczyli więc, że Norwegowie nie zażądają wygórowanej ceny. Mieli rację, mniej więcej. Dyrektor generalny Petoro, państwowego przedsiębiorstwa będącego właścicielem terminalu Sture, wynegocjował z osobliwymi kupcami możliwy do przyjęcia układ."
 jom_expedition.38.a: "Ropa musi płynąć"
 
 jom_expedition.39.t: "Cisza przed Burzum"
 jom_expedition.39.desc: "Druga opcja - Bergen i Stavanger - okazała się znacznie bardziej rozczarowująca. Zwłaszcza to pierwsze, mimo że jest drugim co do wielkości miastem Norwegii. Można tu było złupić najwyżej ryby, zegarki i biżuterię należącą do miejscowej klasy średniej i wyższej. Nic, o czym warto układać sagi. Wikingowie postanowili poprawić sobie humor, podpalając kościół Mariacki. Nawet tej radości im odmówiono. Kiedy przybyli, świątynia już płonęła, a przed nią stał sprawca - chudy, jasnowłosy brodacz. Nazywał się Varg Vikernes i wyraził chęć dołączenia do wikińskich najazdów. Powiedział, że sądził, iż porzucił życie wojownika, lecz wieści o wyczynach Alþýduher ponownie roznieciły w nim dawny płomień. Zanim podjął ostateczną decyzję, porozmawiał z łupieżcami o klęskach kapitalizmu i znaczeniu ochrony środowiska. Obie strony zaskoczyło, jak wiele je łączy. Muzykowi szczególnie spodobało się oddanie karminowej sprawy wykorzenieniu chrześcijaństwa. Po krótkim namyśle wręczono Vikernesowi kolczugę i wpuszczono go na jeden z knarrów."
 jom_expedition.39.a: "Polegli znowu powstaną."
 
 jom_expedition.40.t: "Kocham Cię jak Irlandię" 
 jom_expedition.40.desc: "Irlandia, Szmaragdowa Wyspa, rozciąga się po horyzont bezkresnymi pastwiskami. Niewiele się zmieniło od czasu, gdy w złotej epoce władaliśmy częścią tej ziemi. Ludzie wciąż są tylko potulnymi chłopami, uprawiającymi rolę i pragnącymi świętego spokoju. Jeszcze zanim opuściliśmy port, podeszli do nas zamaskowani przedstawiciele Irlandczyków. Zaoferowali swoją \"wiedzę fachową\", jeśli zgodzimy się zamiast nich napaść Brytanię. Czego jednak moglibyśmy nauczyć się od tak pokojowej, zacofanej kultury? Możemy przecież zrobić to, co zawsze wychodziło nam najlepiej, i napełnić przodków dumą. Złupienie wyspy do gołej ziemi brzmi o wiele zabawniej." 
 jom_expedition.40.b: "Nasi przodkowie by nas wyklęli gdybyśmy chociaż rozważali coś innego niż najazd."
 
 jom_expedition.41.t: "Wspólny wróg"
 jom_expedition.41.desc: "Zgodnie z instrukcjami irlandzkich przedstawicieli wikińskie długie łodzie podpłynęły nocą do zachodniego wybrzeża wyspy, starając się nie zwracać niczyjej uwagi. Na miejscu czekali niecierpliwie przez pół godziny, a w ich głowach zaczęło kiełkować podejrzenie, że mogli zostać oszukani. Wreszcie w oddali pojawiły się nieoznakowane furgonetki i zatrzymały przy plaży. Boczne drzwi otworzyły się, łupieżcy niepewnie wsiedli do środka, a uzbrojeni zbirzy, bacznie śledzący każdy ich ruch, kazali im założyć worki na głowy. Podróż do kryjówki trwała około trzydziestu minut, choć znaczną jej część spędzono na jeżdżeniu w kółko, by jeszcze bardziej zdezorientować załogę. Po dotarciu na miejsce bez ceremonii zaprowadzono ich do niewielkiego, ciemnego pomieszczenia w piwnicy budynku. Pośrodku, na wyspie z połączonych stołów, leżały setki prowizorycznych ładunków wybuchowych wykonanych tak znakomicie, że zawstydziłyby każdy sprzęt fabryczny. Zamaskowana postać stojąca przy drzwiach powiedziała tylko: \"Wybierajcie. Wszystko w tym pokoju jest do waszej dyspozycji. To nasza część umowy. Teraz z niecierpliwością czekamy na waszą\"."
 jom_expedition.41.a: "Lepiej ich nie zawiedźmy."
 
 jom_expedition.42.t: "Kłopoty z najazdem"
 jom_expedition.42.desc: "Zgodnie z przewidywaniami po wylądowaniu na irlandzkiej ziemi wikingowie nie napotkali większego oporu. Powietrze przesycał zapach nadciągającego deszczu, kościelne dzwony bez ustanku biły na rozpaczliwy alarm, a mieszkańcy próbowali uciekać z dobytkiem... Tak, ich przodkowie musieli czuć dokładnie to samo. Po tylu dniach na otwartym morzu wyładowanie całego nagromadzonego gniewu na bezbronnej ludności było przeżyciem wręcz oczyszczającym. Niektórzy znaleźli schronienie, kilku maruderów majstrowało przy łodziach, lecz zbiegli, gdy zauważył ich jeden z łupieżców. Większość mieszkańców wsi wyrżnięto jednak jeszcze przed rozpoczęciem prawdziwego rabunku. Nie było szczególnych bogactw do zagrabienia. Trochę kosztowności, jak zawsze, lecz nic godnego uwagi. Ledwie tyle, by zwróciły się koszty wyprawy. Po czasie ciągnącym się niczym wieczność wikingowie odpłynęli. Przerażeni mieszkańcy zaczęli wychodzić z kryjówek akurat w porę, by zobaczyć, jak cała drużyna łupieżcza staje w płomieniach, gdy w oddali eksploduje ładunek wygodnie umieszczony przy prawej burcie jednej z jednostek."
 jom_expedition.42.a: "Strasznie tchórzliwy sposób walki. Haniebne."
 
 jom_expedition.43.t: "Zielone pastwiska Faereyjar" 
 jom_expedition.43.desc: "Færeyjar wyrastają z morza na nasze powitanie. To jedno z najodleglejszych terytoriów Królestwa Duńczyków. Tę ziemię, leżącą daleko od naszej nordyckiej ojczyzny, dzielni skandynawscy osadnicy odebrali tajemniczym Papar. Dziś Færeyjar zamieszkuje lud, którego język bardzo przypomina mowę staronordycką. Wyspy są słabo zaludnione. Łatwiej spotkać tu owcę, od której kraina wzięła nazwę, niż człowieka. Jeśli mamy łupić, musimy zwrócić się ku morzu." 
 jom_expedition.43.a: "Może te skały skrywają coś więcej." 
 jom_expedition.43.b: "Czas połowić rybki."

 jom_expedition.44.t: "Wilki w owczej skórze"
 jom_expedition.44.desc: "Czasem trudno tu odnaleźć nawet ludzkie siedziby. Tradycyjne chaty færeyskr wznosi się z kamienia i przykrywa darniowym dachem, który zlewa się z trawiastymi wzgórzami wokół domostw. Od strony morza są niemal niewidoczne, toteż wikingowie muszą zapuszczać się w głąb lądu. Bardziej widoczne miejsca, takie jak Tórshavn, nie miały nic ciekawego do zaoferowania wikińskim odkrywcom, którzy postanowili poszukać tradycyjnych rzemieślników i pohandlować z nimi.\n\nMieszkańcy wiosek i rubieży cywilizacji byli jednak samotnikami, niechętnymi rozmowom z obcymi. Zmieniło się to dopiero, gdy wikingowie znaleźli pasterza, który pomachał do nich z oddali. Zaproponował sprzedaż licznych wełnianych płaszczy oraz pokazanie swoich metod pracy. Wikingowie wypytali o porośnięty trawą torfþak przykrywający chatę, licząc, że wykorzystają go do budowy własnych zamaskowanych obozów. Stary pasterz chętnie podzielił się wiedzą, szczęśliwy, że wreszcie ma z kim porozmawiać."
 jom_expedition.44.a: "Mądrość ludową należy szanować."

 jom_expedition.45.t: "Róg mórz"
 jom_expedition.45.desc: "Gdy dzielni wikińscy wojownicy zrozumieli, że zimne skały Atlantyku nie mają nic do zaoferowania, postanowili przeprowadzić kilka prób. W podróży towarzyszył im doktor ichtiologii i cetologii, który miał zapisywać pomiary oraz wyniki działania nowego wynalazku - specjalnego rogu zwołującego, rzekomo zdolnego wpływać na zachowanie ryb i ssaków morskich. Dowódca wyprawy uniósł osobliwy instrument i zadął z całych sił. Wszyscy zatkali uszy, lecz niczego nie usłyszeli. Żadne ryby także za nimi nie podążyły. Kapitan zadął ponownie i tym razem zjawiło się kilka delfinów. Zaczęły taranować okręty głowami, a nawet wyskakiwały z wody, próbując strącić wikingów za burtę. Doktor zakazał je zabijać, więc podróżnicy musieli uspokoić zwierzęta pałkami i wiosłami. Gdy uporali się z atakiem morskiej fauny, podpłynęli do nich rybacy zachwyceni sprawnością, z jaką odparli napaść. Miejscowi Farerczycy postanowili się zaciągnąć i popłynęli wraz z Karminowymi Żaglami do Jomsborga."
 jom_expedition.45.a: "Projekt Njörðr: 50% ukończenia"
 
 jom_expedition.46.t: "Sny o Imperium Morza Północnego" 
 jom_expedition.46.desc: "Wyspy Brytyjskie - ziemia Sasów, Anglów, Jutów i Normanów. Ziemia Anglików, Szkotów, Walijczyków i Irlandczyków. Ziemia przodków wikingów. Wielka Armia Pogan niegdyś spustoszyła te krainy i ustanowiła Danelaw, obszar pod duńską władzą i prawem. Liczne zabytki przypominają wikingom o ich chwalebnej przeszłości na tych ziemiach. Jednym z nich jest Jórvik, dawna stolica Danelaw i wielki ośrodek handlu. Lecz nie od Jórviku wszystko się zaczęło. Najpierw były najazdy na klasztory, najbogatsze i najbardziej bezbronne cele. Lindisfarne. Tam rozpoczęło się wszystko. I tam może rozpocząć się na nowo. We współczesnym świecie wikingowie muszą jednak ostrożniej dobierać cele i działać bardziej strategicznie. Londyn, w języku staronordyckim Lundunir, jest największym miastem Wysp Brytyjskich oraz symbolem angielskiej potęgi i kultury. To także wielkie centrum finansowe i skarbiec pełen bogactw oraz dzieł kultury. Miasto jest jednak silnie ufortyfikowane i bronione przez brytyjskie wojsko, więc aby dokonać udanego najazdu, wikingowie musieliby wykazać się sprytem i liczyć na cud. Rozsądniej byłoby przybyć tam jako kupcy, lecz Jomswikingowie nie słyną ani z rozsądku, ani z pragmatyzmu." 
 jom_expedition.46.a: "Przybywamy w pokoju" 
 jom_expedition.46.b: "Najazd na Londyn"
 jom_expedition.46.c: "Najazd na Lindisfarne"
 
 jom_expedition.47.t: "Ryba z frytkami"
 jom_expedition.47.desc: "Jomswikingowie postanowili nie iść śladami przodków i nie napadać na Wyspy Brytyjskie, lecz spróbować nawiązać stosunki handlowe. Mieszkańcy odnosili się do nich podejrzliwie, nieprzywykli do widoku tak osobliwych i barbarzyńskich ludzi, lecz udało się znaleźć kilku kupców gotowych do wymiany. Prawdziwym skarbem Anglii była jednak potęga morska. Brytyjska marynarka należy do najsilniejszych na świecie, a wiedza o budowie i obsłudze takich okrętów byłaby dla wikingów niezwykle cenna. Jomswikingowie zdobyli od brytyjskich szkutników trochę wiedzy i technologii, które pozwolą udoskonalić flotę oraz poszerzyć możliwości najazdów. Stosunki handlowe nie okazały się jednak zbyt owocne. Wikingowie słabo radzili sobie z negocjacjami i wymianą, a przy zakupie samochodów zostali zwyczajnie oskubani. Przynajmniej spróbowali miejscowej kuchni, która nie zrobiła na nich żadnego wrażenia i kazała się zastanowić, po co w ogóle przybyli do Anglii."
 jom_expedition.47.a: "Co to za gówniane kocie żygowiny?"
 
 jom_expedition.48.t: "W paszczy lwa"
 jom_expedition.48.desc: "Londyn, w języku staronordyckim Lundunir, jest jednym z największych miast świata. Jest też jednym z najbardziej wielokulturowych i kosmopolitycznych, o bogatej historii i kulturze. To wielkie centrum finansów, handlu i wymiany. Wylądowanie w takim miejscu z zamiarem najazdu byłoby zadaniem przytłaczającym i niemal na pewno skazanym na porażkę. Gdy drużyna łupieżcza spłynęła Tamizą, ujrzała widok zarazem zachwycający i przerażający. Miasto kipiało życiem, a ludzi i budynków było tak wiele, że nie sposób było objąć wszystkiego rozumem. Problemem okazało się planowanie. Wikingowie nie mieli pojęcia, dokąd iść ani co robić w tak ogromnym mieście. Błąkali się bez celu, próbując znaleźć coś do złupienia, lecz przytłoczyły ich rozmiary i złożoność Londynu. Zgubili się w labiryncie ulic i zaułków, aż w końcu zatrzymała ich brytyjska policja. Funkcjonariuszy oszołomił widok wikingów, ale nie przeszkodziło im to wypisać mandatów za wtargnięcie i zakłócanie porządku. Każdy uczestnik wyprawy otrzymał niewielką grzywnę za prowadzenie najazdu bez licencji. Już sam absurd angielskich policjantów wręczających wikingom mandat za łupienie wystarczył, by Jomswikingowie zakwestionowali swoje życiowe wybory. Przed odpłynięciem drużyna zdobyła kilka pamiątek: koszulki z Union Jackiem i kubki z londyńskimi motywami. Tylko tyle udało im się zabrać. Mogą mówić o szczęściu, że to skończyło się właśnie tak."
 jom_expedition.48.a: "Przynajmniej trochę pozwiedzali."
 
 jom_expedition.49.t: "Wyżyny wolności" 
 jom_expedition.49.desc: "Szkocja - ziemia Piktów, Gaelów i Szkotów. Kraina dzielnych i zajadłych wojowników, którzy przez stulecia opierali się najazdom Rzymian i Anglików. Była również celem wikińskich wypraw i osadnictwa, zwłaszcza w północnej oraz zachodniej części kraju. Wikingowie założyli w Szkocji kilka osad, między innymi na Orkadach i Szetlandach, a także najeżdżali ląd stały, szczególnie wybrzeża. Dziś kraj znów jest wolny od angielskiego panowania i może stać się dla Jomswikingów celem najazdu albo partnerem handlowym. Szkockie wyżyny słyną jednak z surowego terenu i ciężkiej pogody, które mogą stanowić poważne wyzwanie. Sami Szkoci znani są zaś z płomiennego umiłowania niezależności i oporu wobec najeźdźców. Jeśli wikingowie postanowią napaść na Szkocję, muszą przygotować się na ciężką walkę." 
 jom_expedition.49.a: "Mamy bardzo dziwny pomysł..." 
 jom_expedition.49.b: "Powinniśmy ich zaatakować."
 
 jom_expedition.50.t: "Whisky, moja żono"
 jom_expedition.50.desc: "Drużyna handlowa Jomswikingów działająca wzdłuż szkockiego wybrzeża dokonała niezwykłej wymiany z miejscowym rolnikiem, pomimo poważnych trudności w porozumieniu wywołanych wyjątkowo gęstym regionalnym akcentem. Delegacja przybyła z zamiarem wymiany futer, bursztynu i konserwowanej żywności. Negocjacje postępowały wolno i niepewnie, a obie strony opierały się głównie na gestach i wielokrotnym potakiwaniu. Sytuacja nabrała tempa, gdy rolnik uparł się pokazać stos \"pieprzonego szmelcu\" przechowywany w stodole. Wewnątrz znaleziono wielką minę morską spoczywającą pośród bel siana i stert innego uzbrojenia. Kuliste urządzenie z wystającymi zapalnikami kontaktowymi wyglądało na nienaruszone i być może nadal aktywne. Jeden z miejscowych uderzył w nie kolbą karabinu. Po długiej chwili milczenia Jomswikingowie ocenili charakter przedmiotu i jego możliwą wartość. Po krótkich badaniach językowych oraz rozluźnieniu języków kilkoma butelkami whisky zawarto umowę. Minę ostrożnie przewieziono na wikiński okręt. Wymiana zakończyła się powodzeniem, choć nadal nie wiadomo, skąd urządzenie się wzięło, czy jest stabilne i dlaczego trzymano je w stodole w jakiejś szkockiej wiosce."
 jom_expedition.50.a: "Skąd do cholery one się tu znalazły?!"
 
 jom_expedition.51.t: "Polowanie na potwory"
 jom_expedition.51.desc: "Legenda głosi, że w Loch Ness, wielkim słodkowodnym jeziorze na szkockich wyżynach, żyje potwór. Nessie ma być ogromnym stworzeniem o długiej szyi i garbach na grzbiecie. Opowieść krąży od stuleci, a przez lata zgłaszano wiele spotkań z bestią. Jedni wierzą, że Nessie to prehistoryczne stworzenie, które jakimś cudem przetrwało do dziś. Inni uważają ją za mit albo oszustwo. Jomswikingowie nie wiedzieli, co o tym sądzić, lecz zaintrygowała ich myśl o potworze żyjącym w jeziorze. Przybyli do Szkocji z pewnością ludzi przekonanych, że świat ma sens. Wybrzeża można było palić, klasztory łupić, a wrogów policzyć i nazwać. Potem mgła pochłonęła ich okręty i wyrzuciła na jezioro tak ogromne i nieruchome, jakby samo stworzenie wzięło oddech. Loch Ness rozciągało się przed nimi czarne niczym atrament. Wynurzył się cień, potężny i świadomy, zaginający rzeczywistość wokół własnego kręgosłupa. Gdy ukazała się Nessie, czas się zachwiał. Hełmy wyślizgnęły się ze zdrętwiałych dłoni. Ludzie, którzy stawiali czoła królom i sztormom, poczuli się nagle, bezsprzecznie mali. To nie była opowieść snuta przy ogniu. To było coś starszego od przysiąg, starszego od żelaza. Okazało się, że świat wciąż skrywa cuda w swoich mroczniejszych zakątkach. W nabożnym osłupieniu złożono kiełbasy podwawelskie i czteropak Kustosza Tequili niczym ofiary dla bogów. Kolosalny łeb opuścił się ku nim - ciekawy, łagodny, niemożliwie prawdziwy. Potwór podążył za zapachem kiełbas i wyszedł z jeziora z cierpliwością boga pobłażającego dzieciom. Trzymając w górze ostatnią kiełbasę, wyprowadzili żywą legendę znad jeziora i przez morze aż do Jomsborga. Drużyna łupieżcza zmieniła się na zawsze, bo wiedziała już, że sagi wcale nie przesadzały. Świat był głębszy, niż twierdziły mapy, a niektóre mity czekały jedynie na właściwych głupców, którzy uwierzą w nie tak mocno, że zabiorą je do domu."
 jom_expedition.51.a: "Chyba mamy nową przyjaciółkę..."
 
 jom_expedition.52.t: "Kraina lodu i ognia" 
 jom_expedition.52.desc: "Jeśli nie liczyć przypadkowych mnichów, Islandia jest prawdziwym klejnotem kultury nordyckiej. Po raz pierwszy zasiedlona pod koniec IX wieku przez nordyckich żeglarzy, pozostaje jedną z najtrwalszych placówek wczesnej ekspansji skandynawskiej. To właśnie na tej wulkanicznej wyspie wodzowie ustanowili Alþingi, nadając prawu formalny kształt na rubieży ukształtowanej przez pola lawy, lodowce i odosobnienie. W przeciwieństwie do wielu dalekich przedsięwzięć epoki wikingów Islandii nie podbito, lecz ją zasiedlono. Jej porządek oparto na rządach prawa i pokojowym społeczeństwie o demokratycznym charakterze. Wyspa jawi się nie tyle jako obca ziemia, ile jako kraj przodków, miejsce, gdzie spisano i zachowano sagi, a język oraz rodowody przetrwały z niezwykłą ciągłością. Dowódcy opisują wyprawę jako przedsięwzięcie kulturalne i badawcze. Nie ogłoszono żadnych wrogich zamiarów. Z tej podróży możemy tylko czerpać naukę, a być może zwerbować kilku ochotników do naszej sprawy." 
 jom_expedition.52.a: "Ziemie naszych przodków czekają!" 
 
 jom_expedition.53.t: "Odkryte dziedzictwo"
 jom_expedition.53.desc: "Po przybyciu delegacja za najważniejsze uznała nawiązanie kontaktu z miejscowymi społecznościami i uczonymi, nie zaś wymianę dóbr. Głównym przedmiotem zainteresowania była historyczna ciągłość Islandii od czasu osadnictwa nordyckiego, w tym zachowanie średniowiecznych sag i tradycji prawnych zakorzenionych w Alþingi. Wyprawa pozyskała kilku ochotników gotowych służyć jako przewodnicy po miejscowej kulturze i nauczyciele. Szczególny nacisk położono na język. Zdobyto słowniki i podręczniki gramatyki, aby umożliwić uporządkowaną naukę. Na pokładach długich łodzi i w tymczasowych obozach na brzegu organizowano zajęcia, podczas których systematycznie porównywano język staronordycki, współczesny islandzki oraz nowonordycki z Jomsborga. Misja miała charakter edukacyjny. Jej celem było pogłębienie znajomości kultury i umocnienie więzi historycznych, nie zaś realizacja ambicji terytorialnych czy gospodarczych. Ponadto kilku ludzi zwerbowano do powrotu z nami do Jomsborga, ponieważ pragnęli przyłączyć się do naszej sprawy i odrodzić nordyckiego ducha."
 jom_expedition.53.a: "Całkiem nieźle nam to idzie!"
 
 #do danelaw
 jom_expedition.54.t: "Jak niegdyś było, tak znów się stanie"
 jom_expedition.54.desc: "Nasi przodkowie myśleli o tym, co leży za horyzontem. Wyruszali w nieznane. Ryzykując gniew bogów, płynęli przez wzburzone morza w poszukiwaniu nowych ziem. Prowadziły ich kruki, niosły wiatry. Znajdowali nowe brzegi. My czynimy dokładnie to samo. Było gdzieś wybrzeże. I tam je znaleźliśmy. Lindisfarne. Miejsce, w którym wszystko się zaczęło. Dziś jednak nic już tam nie ma. Klasztor leży w ruinie, skarby przepadły, mnisi od dawna nie żyją. Stoi nowy kościół, lecz to nie to samo. Nie ma w nim bogactw. W pobliżu jest zamek, ale pusty. Przybyliśmy tu, by odnaleźć korzenie, zetknąć się z przeszłością i uczcić przodków. Nie znaleźliśmy niczego. Z wyjątkiem muzeum. Muzeum opowiadającego dzieje wikingów, lecz z perspektywy Anglików. Przedstawia nas jako barbarzyńców, najeźdźców i niszczycieli. Nie pokazuje naszej kultury, sztuki ani osiągnięć. Pokazuje jedynie przemoc, rozlew krwi i rabunek. Nie ukazuje piękna naszych okrętów, sag i rzemiosła. Nie pokazuje dziedzictwa, które po sobie zostawiliśmy. Postanowiliśmy więc odcisnąć własny ślad. Wykuć nowe dziedzictwo. Nawet jeśli musi powstać w tym miejscu pełnym duchów."
 jom_expedition.54.a: "To naprawdę ładny dzbanek!"
 #
 
 jom_expedition.55.t: "Duchy Grenlandii" 
 jom_expedition.55.desc: "Dziwnie pomyśleć, że Grenlandię odkryto przypadkiem, a wikingowie byli pierwszymi Europejczykami, którzy się na niej osiedlili. Właściwie, jeśli nie liczyć niektórych kultur inuickich sporadycznie zasiedlających północ wyspy, wikingowie byli pierwszymi ludźmi, którzy osiedli na południu Grenlandii. Dopiero po upadku ich kolonii w XIV i XV wieku Inuici ruszyli dalej i zajęli całą wyspę. To czyni Grenlandię prawdziwie wikińską ziemią. Choć Duńczycy i Norwegowie odzyskali wyspę w XVIII wieku, ludność nordycka nigdy nie wróciła tu licznie. Teraz znajduje się w rękach Amerykanów, którzy zmilitaryzowali ją dla własnych celów strategicznych. Nasza wyprawa będzie stąpać po bardzo cienkim lodzie, i to nie tylko z powodu topniejących gór lodowych. Możemy ruszyć na północ ku Bazie Kosmicznej Pituffik, skierować się prosto na Nuuk albo spróbować ostrożnie wyhandlować trochę bogactw. Cokolwiek wybierzemy, wszystko może pójść koszmarnie źle." 
 jom_expedition.55.a: "Spróbujmy pohandlować" 
 jom_expedition.55.b: "Kierunek na Nuuk"
 jom_expedition.55.c: "Kierunek na Pituffik"
 
 jom_expedition.56.t: "Grenlandzka umowa handlowa"
 jom_expedition.56.desc: "Wyprawa handlowa Jomswikingów poszukująca rzadkich materiałów poinformowała o długotrwałych kontaktach w pobliżu czynnych obszarów wydobycia na zachodnim wybrzeżu Grenlandii. Zagraniczne przedsiębiorstwa nasilają tam poszukiwania pierwiastków o znaczeniu strategicznym, w tym metali ziem rzadkich i innych surowców krytycznych. Oddział zbliżył się do kilku ośrodków położonych nieopodal znanych złóż ziem rzadkich oraz surowców niezbędnych w technologiach od wysokowydajnych magnesów po zaawansowaną elektronikę. Formacje geologiczne takie jak kompleks Ilímaussaq od dawna słyną z niezwykle różnorodnej i cennej mineralogii. Drużyna Jomswikingów pozyskała drogą wymiany próbki poszukiwanych materiałów, co odzwierciedla zarówno rosnący popyt na bogactwa geologiczne Grenlandii, jak i zmieniającą się rolę wyspy w światowych sieciach handlowych. Analitycy uznają te wydarzenia za przejaw coraz większego znaczenia strategicznego Grenlandii jako źródła ziem rzadkich i innych pierwiastków krytycznych."
 jom_expedition.56.a: "Przynajmniej dostajemy coś z tego wszystkiego..."
 
 jom_expedition.57.t: "Bolesne wspomnienia"
 jom_expedition.57.desc: "Wyprawa Jomswikingów na Grenlandię postanowiła wpłynąć prosto w serce lodowej pustki i napaść na stolicę wyspy - Nuuk. Mimo ciężkich warunków nie spodziewano się oporu, ponieważ samo miasto nie było zmilitaryzowane. Niestety, gdy tylko rozpoczęli podejście, napotkali patrol amerykańskiej Straży Przybrzeżnej. Podczas starcia siły USA zdążyły wezwać posiłki z najbliższej bazy. Doszło do krótkiej wymiany ognia, po której Jomswikingowie zostali zdziesiątkowani. Ich okręty zatopiono, a resztę załóg schwytano lub zabito. Wygląda na to, że Amerykanie nie zamierzają okazać jeńcom żadnej litości. Będą mieli szczęście, jeśli skończą w więzieniu Guantanamo."
 jom_expedition.57.a: "Może nie próbujmy tego już nigdy."
 
 jom_expedition.58.t: "Nowy Świat" 
 jom_expedition.58.desc: "Winlandia, Markland i Helluland. Ziemie, do których około przełomu pierwszego tysiąclecia dotarli nordyccy odkrywcy z Grenlandii, wyznaczają najdalszy zachodni zasięg udokumentowanych wypraw wikingów. Helluland, powszechnie utożsamiany z jałowymi wybrzeżami Ziemi Baffina, sagi opisywały jako krainę płaskich kamieni i arktycznego pustkowia. Markland, uznawany za dzisiejszy Labrador, słynął z lasów i zasobów drewna. Dalej na południu leżała Winlandia, zapamiętana z łagodniejszego klimatu i dzikich winogron, od dawna łączona ze stanowiskiem archeologicznym L'Anse aux Meadows na Nowej Fundlandii. Nasi przodkowie byli pierwszymi Europejczykami, którzy dotarli do Nowego Świata, czyniąc z ludów nordyckich pionierów odkryć na długo przed wyprawami Iberów. W odróżnieniu od europejskich najazdów zachodnie podróże miały charakter odkrywczy i osadniczy, choć ostatecznie nie trwały długo. Trudne środowisko, odległość od Grenlandii oraz konflikty z rdzenną ludnością uniemożliwiły utrzymanie stałej obecności. Musimy podążyć śladami przodków, lecz skoro możemy się domyślić, co tu na nas czeka, nie musimy ograniczać się do odkryć i handlu." 
 jom_expedition.58.a: "Ciekawe bogactwa są na tej Winlandii w tych czasach!" 
 jom_expedition.58.b: "Poczują gniew synów Erikssona!"
 
 jom_expedition.59.t: "Nowe skarby Winlandii"
 jom_expedition.59.desc: "Wyprawa Jomswikingów działająca wzdłuż wschodniego wybrzeża Kanady rozpoczęła negocjacje dotyczące zakupu uranu pochodzącego ze złóż w głębi kraju. Dowódcy przedstawili misję jako kontynuację historycznych kontaktów Normanów z Winlandią i podkreślili symboliczną wagę powrotu na ziemie krótko zamieszkane niegdyś przez odkrywców z Grenlandii. W przeciwieństwie do drewna i dzikich zasobów poszukiwanych tysiąc lat temu dzisiejszym celem jest uran - minerał o wielkiej współczesnej wartości strategicznej ze względu na rolę w produkcji energii i zaawansowanych technologiach. Wstępne kontakty z regionalnymi pośrednikami dotyczą logistyki transportu, warunków wymiany i procedur bezpiecznego obchodzenia się z materiałem. Przywódcy wyprawy opisują przedsięwzięcie jako zarazem praktyczne i historyczne. Zauważają, że choć pierwotna obecność nordycka w Winlandii była krótkotrwała, odnowienie kontaktów dowodzi nieprzemijającego morskiego zasięgu jomswikińskiej przedsiębiorczości."
 jom_expedition.59.a: "Ale ładny świecący kamyk!"
 
 jom_expedition.60.t: "Śladami Leifa Erikssona"
 jom_expedition.60.desc: "Według doniesień oddział Jomswikingów przeprowadził najazd na historyczne stanowisko L'Anse aux Meadows, powszechnie uznawane za jedyną potwierdzoną osadę nordycką w Ameryce Północnej. Miejsce, utrzymywane dziś jako pomnik i ośrodek edukacyjny, obejmuje zrekonstruowane budowle, galerię dla zwiedzających oraz restaurację serwującą potrawy inspirowane historią. Według raportów oddział najpierw uderzył w obiekty handlowe, a następnie zabrał posąg przedstawiający Leifa Erikssona. Świadkowie opisują szybki atak skupiony na przedmiotach łatwych do przeniesienia, nie na niszczeniu budynków. Posąg, upamiętniający wczesne nordyckie podróże do Winlandii, przewieziono na jednostki czekające u wybrzeża. Nie uszła uwadze symboliczna ironia nordyckiego oddziału łupiącego pomnik poświęcony nordyckim odkryciom. Kanadyjskie władze nie wydały jeszcze oficjalnego oświadczenia."
 jom_expedition.60.a: "Jego miejsce jest w muzeum!"
 
 jom_expedition.61.t: "Wizyta w Ny-Jorvik" 
 jom_expedition.61.desc: "Ameríka... Nazwana na cześć Ameriga Vespucciego, który zrozumiał, że Europejczycy odkryli zupełnie nowy kontynent, w przeciwieństwie do Krzysztofa Kolumba przekonanego, że znalazł część Azji. Gdyby uczczono prawdziwego odkrywcę kontynentu, wikingowie płynęliby dziś ku Leiflandowi. Tutaj ludzie zbudowali swoje niewyobrażalne fortuny. Bogactwa, które powinny należeć do nas. Weźmiemy je - dobrowolnie albo siłą.\nPrzepłynęli już pod Mostem Brooklińskim, a powitały ich Statua Wolności i wiersz wyryty na jej cokole:\nDajcie mi swoich zmęczonych, biednych,\nswe stłoczone masy pragnące odetchnąć wolnością." 
 jom_expedition.61.a: "I będziemy oddychać wolni" 
 jom_expedition.61.b: "Sen zanikł. Czas przynieść im ostrze sprawiedliwości."
 
 jom_expedition.62.t: "Nordycy w Nowym Jorku"
 jom_expedition.62.desc: "Elita finansowa przyjęła przybycie wikingów zaskakująco spokojnie. Spokojniej niż sami wikingowie. Większość podróżników z Europy albo nie rozumiała systemu finansowego, albo brzydziła się jego niesprawiedliwą naturą. Zazwyczaj jedno i drugie. Mimo to powitał ich pewien makler, który oświadczył, że również pasjonuje się futbolem z Minnesoty, cokolwiek miało to znaczyć. Zgodził się rozszerzyć działalność swojej spółki na Vendland, zwiększając tam wydajność procesu produkcji."
 jom_expedition.62.a: "Gdzie jest w ogóle ta Minnesota?"
 
 jom_expedition.63.t: "#ZłupićWallStreet"
 jom_expedition.63.desc: "Wikingowie puścili Wall Street z dymem. Wraz z miejscowymi komunistami, socjalistami, anarchistami i zwyczajnie wściekłymi ludźmi zaczęli rabować banki, zabierać pieniądze oraz groźbą przemocy zmuszać maklerów do oddawania akcji. Rozniecili prawdziwy protest i wdali się również w walkę z policją. Ujeżdżali słynne posągi niedźwiedzia i byka, a potem wyrwali je z ziemi, by przetopić na insygnia i biżuterię. Przed odpłynięciem rozbili obóz w Central Parku, gdzie przegrupowali siły."
 jom_expedition.63.a: "Ah, najbardziej bezpośrednia metoda opodatkowania!"
 
 jom_expedition.64.t: "Pokusa Bandarikin" 
 jom_expedition.64.desc: "Wikingowie popłynęli w górę Missisipi - Ojca Wód. Tam napotkali miejscowych. Missisipi jest jednym z najbiedniejszych stanów Bandarikin. Mimo ubiegłorocznego wzrostu wielu ludzi nadal pozostaje bez pracy i żyje w nieludzkich warunkach. Mają jednak ducha wojowników i wprawnie posługują się bronią dystansową. Przeludniona, rolnicza kraina pełna wojowników - brzmi jak ojczyzna współczesnych wikingów! Brakuje im tylko okrętów." 
 jom_expedition.64.a: "Ich miejsce jest u naszego boku!" 
 
 jom_expedition.65.t: "Wieśniaccy wikingowie z piekła"
 jom_expedition.65.desc: "Początkowo miejscowi poczuli się nieswojo, gdy przybysze przedstawili się jako Ludzie Północy. Szybko jednak zrozumieli, że nie mamy nic wspólnego z Unią, o której ciągle mówili. Kilku miało topory, lecz nie potrafili sprawnie używać ich jako broni. Znacznie lepiej znali broń palną, a podczas ćwiczeń pokazali, co umieją. Potem zaprosili wikingów na uroczystą kolację. Niestety podano tylko zwykłą dziczyznę, nieodpowiednią dla wegetarian wśród wikingów. Miejscowy bimber był mocniejszy od normalnego nordyckiego miodu, lecz krzepcy wojownicy bez trudu sobie z nim poradzili. Dla uświetnienia wydarzenia wikingowie odśpiewali swoje sagi przy akompaniamencie banjo.\nPrzez kilka następnych dni miejscowi próbowali przerobić swoje pikapy na łodzie."
 jom_expedition.65.a: "Yeeehaw!"
 
 jom_expedition.66.t: "Zerwij kajdany, połam bat!"
 jom_expedition.66.desc: "Więzienie Guantanamo - okrutna instytucja zrodzona z paniki terrorystycznej początku XXI wieku. Jeńców przetrzymuje się tam niemal bez nadzoru świata zewnętrznego. Prywatny plac zabaw Bandarikin na obcym terytorium. Uwięzieni to dzielni wojownicy bezprawnie pozbawieni zarówno wolności, jak i honorowej śmierci. Nienawidzą zachodniego kapitalizmu tak samo jak wikingowie i wołają o pomoc w uwolnieniu z tej katowni. Normanowie odpowiedzą na wezwanie!\n\nSpróbowali przeprowadzić szybki desant morski i wzniecić bunt więźniów, który przyniósłby im wolność. Początkowo najeźdźcom sprzyjały niewielkie rozmiary łodzi oraz brak zależności od skomplikowanych technologii, łatwych do wykrycia. Gdy żołnierze pilnujący bazy zrozumieli jednak, co się dzieje, wystawili własne okręty. Rozprawiły się one z wikińskimi łodziami, zanim choć jeden wiking postawił stopę na plaży zatoki."
 jom_expedition.66.a: "Wrócimy po was bracia!"
 
 jom_expedition.67.t: "Wikingowie z Karaibów" 
 jom_expedition.67.desc: "Uwolnieni od posępnych wód Bałtyku i Atlantyku wikingowie mogli wreszcie nacieszyć oczy lazurem Morza Karaibskiego. To tutaj kryli się legendarni piraci łupiący statki płynące do Nowego Świata i z powrotem. Czasy się zmieniły, a Atlantyk jest dziś dobrze strzeżony, lecz być może mężny wysiłek wikingów zdoła odrodzić erę piractwa. Może odnajdą zaginione skarby? A jeśli nie, zawsze mogą odpocząć na jednej z tropikalnych wysp. Pozostaje też kwestia uwolnienia więźniów Guantanamo, przetrzymywanych przez chciwy, despotyczny reżim Bandarikin." 
 jom_expedition.67.a: "Spróbujmy porozmawiać z towarzyszami socjalistami" 
 jom_expedition.67.b: "Znajdziemy Fontannę Młodości!"
 jom_expedition.67.c: "Wyzwolimy cięmiężony lud z Guantanamo!"
 
 jom_expedition.68.t: "Viva la Cuba"
 jom_expedition.68.desc: "Towarzysze socjaliści z Kuby ciepło powitali wikingów. Urządzili na ich cześć wielką fiestę, choć żaden mieszkaniec nie dał się przekonać do walki z kapitalizmem w Europie. Zamiast tego Kubańczycy służyli jako przewodnicy podczas słynnego karnawału Parrandas. Podróżnicy mogli poznać miejscową muzykę i podziwiać barwne platformy, tancerzy w fantastycznych strojach oraz chorążych. Nocą światła tworzyły magiczną atmosferę, a fajerwerki rozświetlały niebo.\n\nNa pożegnanie mieszkańcy podarowali im słynne kubańskie cygara. Słysząc, że Ludzie Północy zmagają się ze szkorbutem wskutek niedoboru witamin, dorzucili kontener pomarańczy, by osłodzić podróż powrotną.\nWikingowie odpłynęli w świetnych nastrojach, przekonani, że inna polityka naprawdę jest możliwa."
 jom_expedition.68.a: "Venceremos! Við Munum Vinna!"
 
 jom_expedition.69.t: "Szlak Ponce de Leóna"
 jom_expedition.69.desc: "Wikingowie przeskakiwali z jednej wyspy Bahamów na drugą, licząc, że ich trud doprowadzi ich do legendarnej Fontanny Młodości i zapewni błogosławieństwo Idunn. Ku ich rozczarowaniu Bahamy były mniej lub bardziej zamieszkane. Każdy skrawek dżungli wyglądający na nietknięty okazywał się maleńki po kilku cięciach mieczem. Bezludne wysepki były zaś zbyt małe nawet na źródełko, nie mówiąc o mitycznej fontannie.\nSerca zabiły im mocniej, gdy odkryli dawną podziemną kryjówkę przemytników, sądząc, że poszukiwany skarb mógł spoczywać tam od stuleci. Wysłali grupę poszukiwawczą, która znalazła jedynie zapas siedemnastowiecznego rumu. Ich porażka miała tylko jedno racjonalne wyjaśnienie..."
 jom_expedition.69.a: "Bogate elity ukradły fontannę dla siebie!"
 
 jom_expedition.70.t: "Komnaty Montezumy" 
 jom_expedition.70.desc: "Ziemie Mexíkó od dawna znajdują się pod okupacją Chrystusolubnych. Mimo upływu wieków żyjący tu ludzie wciąż szanują dawne tradycje, a tajemnice starożytnych Azteków pozostają nierozwiązane. Jedną z nich jest rzekome istnienie skarbu Montezumy - złota ukrytego przez Azteków, gdy hiszpańscy konkwistadorzy przetrzymywali ich Tlatoaniego dla okupu. Legendą zainteresował się sam jarl, licząc, że skarb zawiera złoty kalendarz wskazujący dzień Ragnaröku. Cała opowieść może być jednak mitem. Być może lepiej skupić się na teraźniejszości i nawiązać kontakt z kartelami, co przyniosłoby wikingom bardziej namacalne korzyści." 
 jom_expedition.70.a: "Czas porozmawiać z kartelami" 
 jom_expedition.70.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.71.t: "Baby Blue"
 jom_expedition.71.desc: "Gdy zaczęli wypytywać o \"Los Conquistadores\", większość ludzi uciekała, nie chcąc kłopotów. Trochę trwało, zanim znaleźli kogoś dość powolnego, by go złapać i wbić mu do głowy, że powinien powiedzieć, gdzie znaleźć dostawcę narkotyków. Trop doprowadził wreszcie do przywódcy miejscowego gangu podległego kartelowi. Mężczyzna oznajmił, że nie podoba mu się sposób, w jaki wikingowie panoszą się po jego mieście. Zapytali, czy za to podoba mu się złoto, które ze sobą noszą, i rzucili worek pieniędzy na jego biurko. Narkotykowy boss natychmiast się rozpogodził i zaproponował im swój specjalny towar.\n\nPóźniej tej nocy dwaj wojownicy wciągnęli kreski świeżo zakupionej metamfetaminy i rozpoczęli najdłuższy pojedynek na topory, jaki widzieli obecni tam wikingowie."
 jom_expedition.71.a: "Mocny towar!"
 
 jom_expedition.72.t: "Koniec wieków"
 jom_expedition.72.desc: "Po przestudiowaniu niezliczonych fałszywych map i rozmowach z miejscowymi wiedźmami wikingowie ruszyli ku Huápoca w północnym Meksyku. Poddani Montezumy II mieli ukryć skarb daleko poza granicami imperium Azteków. Wielu podróżników zdążyło się już pokłócić, przekonanych, że gonią za bajkami i legendami. Rozkazy były jednak jasne. Karminowi odkrywcy przepędzili natrętnych archeologów i rozpoczęli własne wykopaliska. Wbijali kilofy wszędzie, lecz poza starymi kamiennymi chatami Mogollonów nie znaleźli niczego, co mogłoby przykuć uwagę. Zdesperowany wojownik zaczął uderzać w ścianę góry zamieszkiwanej niegdyś przez ludy prekolumbijskie. Pozostali, lękając się gniewu Jarla, dołączyli do niego. Wbrew ich sceptycyzmowi pozornie naturalna skalna ściana runęła i odsłoniła ukryty korytarz. Na jego końcu znajdowały się drzwi z obliczem jakiegoś boga. Nie otworzył ich żaden kilof ani materiał wybuchowy, którym dysponowali wikingowie. Choć nie znali języka, piktogramy wyjaśniały wszystko. Kto chciał wejść, musiał złożyć człowieka w ofierze, wycinając mu serce. Wystąpił stary, krzepki wojownik. Uklęknął, dobył noża i wyrżnął własne serce, po czym ostatkiem sił umieścił je w ustach boga. Drzwi się otworzyły. Za nimi czekała góra złotych monet oraz legendarny kalendarz."
 jom_expedition.72.a: "Tajemnice Asynjur będą nasze."
 
 jom_expedition.73.t: "Synowie Boliwara" 
 jom_expedition.73.desc: "Przed nami rozciągają się wyżyny i dżungle Wenezueli, Kolumbii oraz Gujany. Wenezuelczycy to bratni marksistowski reżim, a przynajmniej sprawiają takie wrażenie. Jeśli pohandlujemy z pogodnymi mieszkańcami tych ziem, którzy mimo ciężkiego życia nie tracą ducha, zdobędziemy ropę. Zasiarczoną, ciężką, gównianą, ale jednak ropę. Kolumbia ma również raczkujący... program kosmiczny. Napadając na nią, możemy pozyskać technologię rakietową, którą trudno byłoby zdobyć gdzie indziej." 
 jom_expedition.73.a: "Zdobądźmy tę ropę. Na pewno nie będą mieli wyboru i sprzedadzą ją tanio." 
 jom_expedition.73.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.74.t: "Wenezuelskie czarne złoto"
 jom_expedition.74.desc: "Nasze tankowce są pełne i wychodzimy w morze. Większość ropy przerabia się w samej Wenezueli, a nasze jednostki odbierają gotowe paliwo oraz bitum. Reszta trafia na Curaçao, gdzie miejscowa rafineria skwapliwie korzysta z okazji, by choć raz pracować pełną mocą. Umowa jest przystępna i zapewni nam bezpieczeństwo paliwowe tak długo, jak długo utrzymają się szlaki żeglugowe."
 jom_expedition.74.a: "Dzięki, Maduro!"
 
 jom_expedition.75.t: "Atak na Gujanę"
 jom_expedition.75.desc: "Zgodnie z przewidywaniami placówki badań kosmicznych są słabo strzeżone. Nie tracimy czasu: włamujemy się do komputerów po schematy i kradniemy dokumenty. Porywamy nawet kilku naukowców w charakterze... konsultantów. Nasze grupy dywersyjne roznieciły aktywność karteli, by zająć policję, mamy więc dogodne okno działania, zanim reakcja władz stanie się nie do zniesienia. Serwery odbierają dane w ciągu zaledwie kilku minut. Jomsborg świętuje."
 jom_expedition.75.a: "Frá rógi til stjarna!"
 
 jom_expedition.76.t: "Brazylijskie syreny" 
 jom_expedition.76.desc: "Południowoamerykańskie wybrzeże Atlantyku wita nas nieznanym ciepłem. Częściowo przynosi je ciepły Prąd Brazylijski, lecz jeszcze bardziej rozgrzewa żywy widok mieszkańców. Plaże są miejscem nieustannego wypoczynku i świętowania. Barwna muzyka, dość głośna, by docierać aż na nasze długie łodzie, tylko podsyca atmosferę. Temperatura chyba miesza nam w głowach, bo nie potrafimy zmusić się do zaatakowania tych ludzi. Możemy jednak zachować stanowczość i popłynąć na południe, ku wodom bardziej przypominającym ojczyznę. Tam będziemy mogli łupić i grabić do woli." 
 jom_expedition.76.a: "Ruszajmy na plażę. Od dawna należy nam się dzień wolnego." 
 jom_expedition.76.b: "Musimy oprzeć się pokusie. Płynąć na południe. Jarl będzie dumny!"
 
 jom_expedition.77.t: "Dzień plażowy"
 jom_expedition.77.desc: "Gdy wikińska flotylla wylądowała na wschodnim krańcu Copacabany, prawie nikt nie zainteresował się jej obecnością. Tylko kilku turystów z niechęcią przesunęło ręczniki, by dziób jednej z długich łodzi nie trafił ich wprost. Po krótkim rozejrzeniu się ludzie Jarla Halfdana zdjęli pancerze, by znieść nieznośny upał. Wkrótce niemal nie sposób było odróżnić ich od setek plażowiczów bawiących się i odpoczywających w popołudniowym słońcu - poza całkowitym brakiem opalenizny. Doświadczeni berserkowie bez trudu pokonali drużynę młodych wikingów 21:9 w siatkówkę plażową, co raczej nikogo nie zdziwiło. Snorri na zawsze utracił zaś honor, gdy omal nie utonął, porwany w głąb morza przez wyjątkowo wielką falę. O zachodzie słońca załoga ruszyła na miejscowy targ. Nie mieli odpowiedniej waluty, lecz wymienili towary na kilka błyszczących kamieni, ozdób i talizmanów szczęścia o rzekomo mitycznym pochodzeniu - a przynajmniej tak twierdził sprzedawca. Nastrój był tak radosny, że nikomu nie przyszło do głowy zapytać, jak dokładnie te \"amulety Thora\" trafiły na brazylijskie wybrzeże."
 jom_expedition.77.a: "Na pewno są prawdziwe, prawda?"
 
 jom_expedition.78.t: "Drugi kryzys Falklandzki"
 jom_expedition.78.desc: "Dzień za dniem wikingowie płynęli wzdłuż wybrzeża, próbując strząsnąć z siebie pokojowe uczucia, które wciąż trzymały się ich po wcześniejszym spotkaniu. Wreszcie znaleźli właściwe miejsce. Falklandy wyglądały dokładnie jak dom - zimne, puste i niegościnne. W jednej chwili powróciły wspomnienia plądrowania brzegów Bałtyku i Morza Północnego. Z dzikim okrzykiem bojowym wikingowie ruszyli prosto ku odległemu archipelagowi. Po drodze zignorowali liczne jednostki nadające sygnały ostrzegawcze. Płynęli z takim uporem, że zdążyli wylądować, zanim stacjonujące floty oddały choć jeden strzał. Zeszli na brzeg na krańcu zachodniej wyspy, daleko od większych osad. Złupili jedyną widoczną chatę rolnika, zabili wszystkich mieszkańców, zabrali owce i odpłynęli zadowoleni z kolejnego udanego najazdu. Załoga nie wiedziała, że do ambasadora Argentyny wysłano już depeszę z żądaniem wyjaśnień. Kilka godzin później większość marynarki południowoamerykańskiego państwa ruszyła ku wyspom. Uznano, że sytuacja dowodzi nieprzygotowania rywala, i postanowiono ponownie zająć archipelag, zanim Brytyjczycy zdążą odpowiedzieć."
 jom_expedition.78.a: "Może tym razem pójdzie im lepiej."
 
 jom_expedition.79.t: "Zaginione skarby Inków" 
 jom_expedition.79.desc: "Potężne Andy skrywają wiele tajemnic i skarby przekraczające wyobraźnię. Oczywiście o ile wierzyć legendom zmyślonym po to, by przyciągnąć jak najwięcej odkrywców i kolonistów. Szanse są niewielkie, lecz jeśli gdzieś w jaskini albo jeziorze naprawdę ukryto skarb, dlaczego nie spróbować? Możemy również nawiązać kontakt ze skromnymi pasterzami z Andów i dowiedzieć się od nich, jak przetrwać w niegościnnych górach." 
 jom_expedition.79.a: "Pora trochę odpocząć." 
 jom_expedition.79.b: "Odzyskamy złoto Inków."
 
 jom_expedition.80.t: "Puchata kawaleria"
 jom_expedition.80.desc: "Nie każda wyprawa musi kończyć się zdobyciem wielkich bogactw. Czasem człowiekowi wystarczą świeże górskie powietrze i bliskość natury. W Andach wikingowie przekonali się, że hodowcy alpak są wyjątkowo życzliwi wobec obcych. Potężni odkrywcy odpoczęli przez chwilę wśród górskich zwierząt. Karmili je i głaskali, kojąc umysły po licznych najazdach. Za pośrednictwem tłumacza zapytali, czy alpak można dosiadać. Peruwiańczycy wyjaśnili, że zazwyczaj nie, ponieważ zwierzęta mają delikatną budowę. Jedynie najlżejsi członkowie wyprawy, zwykle kobiety, mogli jeździć na nich z pewnym powodzeniem."
 jom_expedition.80.a: "Słońce Peru? Już go pokonaliśmy dawno."
 
 jom_expedition.81.t: "Tajemnice Inków"
 jom_expedition.81.desc: "Wysokie Andy okazały się dla wikingów przeciwnikiem więcej niż równym. Zbocza były śliskie, a suche, silne wiatry Zonda w niczym nie pomagały. Poszukiwany skarb nie leżał oczywiście na widoku, toteż musieli zejść głęboko do jaskiń. Podziemne korytarze dawały schronienie i obietnicę bogactw. Zapuszczali się coraz dalej, słuchając zimnych kropel wody towarzyszących odgłosowi kroków. Nadal nie znaleźli żadnego śladu wielkiego skarbu. Aż jeden z wikingów oparł się o niewinnie wyglądający stalagmit. Formacja skalna poruszyła się niczym dźwignia, a kamienna ściana otwarła jak drzwi. Wikingowie weszli do korytarza, licząc na bogactwa. Po kilku krokach jednego z nich trafiła w szyję zatruta strzałka. Podłogę najwyraźniej usiano płytami naciskowymi uruchamiającymi pułapki. Na końcu tunelu znajdował się zestaw sznurów przypominający tradycyjny inkaski system zapisu kipu oraz kalendarz. Zadanie polegało zapewne na zawiązaniu węzłów odpowiadających inkaskim świętom. Po niezliczonych próbach i błędach właściwy układ wsunięto w szczelinę w ścianie przeznaczoną na węzły. Drzwi otworzyły się, ukazując liczne monety, figurki o zwierzęcych i ludzkich twarzach, a nawet korony."
 jom_expedition.81.a: "Ciekawe, jak inkaska korona wyglądałaby na głowie Jarla."


 jom_expedition.811.t: "Kamienni giganci"
 jom_expedition.811.desc: "Jałowa, trawiasta powierzchnia Wyspy Wielkanocnej miała niewiele do zaoferowania poza tajemniczymi posągami moai. To była najlepsza szansa, by zapisać własne imię w przyszłej sadze. Alternatywą pozostawał ulotny skarb albo najazd po zwierzę, które można znaleźć w każdym małym zoo. Wybór był prosty. Wykonanie zadania również. Wikingowie przypłynęli nocą, obezwładnili straż przybrzeżną, zaciągnęli olbrzymią głowę po ręcznie ułożonym torze i przewieźli ją barką.\n\nJarl przywykł do bardziej błyszczących łupów, więc wikingowie obmyślili sposób na zdobycie przychylności władcy. Gdy dotarli na przyjazną ziemię, skontaktowali się z rzeźbiarzem gotowym podjąć się podejrzanego zlecenia. Chcieli, by skradziony moai przypominał ich ukochanego jarla. Dzięki temu Sandbjerg miał bardziej docenić dar, a sam posąg mógł również posłużyć jako narzędzie propagandy."
 jom_expedition.811.a: "Prawie tak potężny jak pierwowzór!"
 
 jom_expedition.82.t: "Ojczyzna Normanów" 
 jom_expedition.82.desc: "To właśnie tutaj, w północnej Francji, wędrowni wikingowie stworzyli swoje zapewne najświetniejsze państwo. Zaczęło jako zwykły lennik króla Franków, lecz położyło fundament pod współczesne królestwo Anglii, które później przekształciło się w największe imperium w dziejach. Niektórzy odkrywcy uznają tę ziemię za obiecaną Normanom i chcą osiedlić się tu w pokoju. Inni uważają za odrażające, że współczesne państwa Zjednoczonego Królestwa i Francji, które dawno utraciły nordyckie lub germańskie korzenie, uzurpują sobie prawo do normańskiego dziedzictwa." 
 jom_expedition.82.a: "Sprawdźmy, czy jesteśmy tu mile widziani." 
 jom_expedition.82.b: "Pokażemy im ich prawdziwe pochodzenie."
 
 jom_expedition.83.t: "Powrót do domu"
 jom_expedition.83.desc: "Widok wybrzeży Normandii wzbudził w odkrywcach zbyt silne emocje. Tutaj wiking Rollo wykuł swoje państwo. Tutaj wojska alianckie wylądowały, by uwolnić Europę spod fałszywie germańskiej tyranii nazistów. Podróżnicy z Jomsborga ze łzami w oczach uklękli na ziemi i zrozumieli, że nie chcą płynąć dalej. Wypełnili formularze o francuskie obywatelstwo i postanowili osiedlić się na obrzeżach Rouen. Nie zapomnieli jednak o misji. Ich osobliwy sposób życia przyciągał najwięcej uwagi podczas regionalnych jarmarków. Wykorzystali rozpoznawalność do szerzenia poglądów Karminowego Jarla i promowania jego ideologii. Stworzyli przyjazne lobby we Francji, a nawet zainspirowali kilku Francuzów do podróży do Jomsborga."
 jom_expedition.83.a: "Nazwijmy to najazdem oddolnym."
 
 jom_expedition.84.t: "Lądowanie w Normandii"
 jom_expedition.84.desc: "Tkanina z Bayeux. Największy dowód normańskiego męstwa. A gdzie ją umieszczono, by świat mógł ją podziwiać? Zazwyczaj we Francji, która wyrzekła się germańskiego dziedzictwa, a od czasu do czasu w Anglii, gdzie pozwolono, by język skolonizował łaciński bękart. Prawdziwymi spadkobiercami Vilhjalmra Zdobywcy są wikingowie.\n\nSamo zadanie było proste. Muzeum w Bayeux to nie Luwr. Po unieszkodliwieniu strażników wikingowie wpatrywali się w siedemdziesięciometrową tkaninę, zastanawiając się, jak ją przewieźć. Pochwycili kilku przytomnych kustoszy i kazali im \"spakować\" haft. Francuzi umieścili go w ekranie przypominającym harmonijkę, dzięki czemu materiał można było złożyć i przewieźć bez uszkodzeń."
 jom_expedition.84.a: "Dobrze, że nie musimy jej ciąć na kawałki."
 
 jom_expedition.85.t: "Paryż" 
 jom_expedition.85.desc: "Paryż jest tak zakochany w sobie, że nadal będzie uważał się za Miasto Świateł, nawet gdy zbankrutuje, a my złupimy jego resztki. Nie ograbimy wszystkiego - jest na to zbyt wielki, trzeba mu oddać sprawiedliwość. Napadniemy jednak na Luwr, miejsce pękające od przepychu i bogactwa. Gdyby to się nie udało, jeden z naszych braci zna kogoś, kto może załatwić nam zabójczo dobry interes na ciężarówki." 
 jom_expedition.85.a: "Wikingowie za kółkiem? Słyszałem gorsze pomysły." 
 jom_expedition.85.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.86.t: "Paryski transport klasowy"
 jom_expedition.86.desc: "Krótko mówiąc, mamy teraz do dyspozycji usługi \"wielokulturowej ekipy różnych religii i przekonań\" z branży transportowej. Równie dobrze moglibyśmy mówić do nich po algiersku. Nieważne. Mogą sprzedać nam ciężarówki i naprawić stare, stopniowo modernizując flotę, by pojazdy lepiej radziły sobie w warunkach po Upadku. Musieliśmy tylko zapłacić im dość, by mogli przejść na emeryturę według francuskiego prawa (łatwe), a następnie przenieść ich do Jomsborga, zachowując dotychczasowe nawyki żywieniowe (bardzo trudne)."
 jom_expedition.86.a: "Paryski szyk w działaniu."
 
 jom_expedition.87.t: "Paryska walka klas"
 jom_expedition.87.desc: "Jak przystało na porządnych socjalistycznych wikingów, napadliśmy na muzeum-pałac w Luwrze i wynieśliśmy wszystko, czego nie przybito do podłogi. Topory leciały, opadały i piły paryską krew, broń palna zajmowała się resztą, a niepozorne ciężarówki wywoziły zdobycz. Nie musieliśmy uciekać daleko. Francja roi się od paserów, którzy kupili od nas łupy po bardzo rozsądnej cenie. Z bitcoinami wystarczającymi do wykupienia Société Générale wróciliśmy do domu jako wojownicy i skaldowie, opiewając naszą łupieżczą walkę klas. Wiemy, że francuski robotnik stoi u naszego boku, nawet gdy burżuazyjny rząd Francji miota się, próbując pomścić narodową dumę na forum Organizacji Narodów Zjednoczonych."
 jom_expedition.87.a: "Mówiłem im, żeby nie sprzedawali tego portretu Króla Słońce!"
 
 jom_expedition.88.t: "Iberia" 
 jom_expedition.88.desc: "Hiszpania jest dziesiątą gospodarką świata i równie dobrym miejscem do handlu jak każde inne, lecz ma także mnóstwo historii czekającej na złupienie. Choćby Santiago de Compostela. Jedno z najczęściej odwiedzanych miejsc pielgrzymkowych i skupisko bogactwa, po które możemy ruszyć śladami przodków rabujących klasztory. Który wiking zdołałby się oprzeć urokowi takiej pielgrzymki?" 
 jom_expedition.88.a: "Hiszpania z pewnością ma nam więcej do zaoferowania w handlu..." 
 jom_expedition.88.b: "Powiedzcie apostołowi Jakubowi, że po niego idziemy!"
 
 jom_expedition.89.t: "Handel z Iberią"
 jom_expedition.89.desc: "Nie udało się wycisnąć z tutejszych możliwości niczego szczególnie pasjonującego, ale zatrudniliśmy kilku specjalistów od budowy okrętów i szkolenia w niewielkich operacjach taktycznych. Odegrają kluczową rolę w przygotowywaniu i prowadzeniu przyszłych najazdów."
 jom_expedition.89.a: "Niezłe znalezisko!"
 
 jom_expedition.90.t: "Pielgrzymka do Santiago de Compostela"
 jom_expedition.90.desc: "Byli na nas gotowi. Nie uwierzyłbym, gdybym sam tego nie zobaczył: drużyny ogniowe odzianych w szaty mnichów w kapturach capirote, usuwające cywilów z katedry i otwierające ogień, gdy tylko dostrzegły nasze sztandary i pancerze. A ich przywódca... To było coś innego. Nosił metalowy capirote ozdobiony cierniami, twarz skrywał za metalową maską, a zbroję pod łachmanami. Miał ceremonialny miecz, który chyba odbijał pociski i z całą pewnością służył do parowania naszych toporów. Wielu braci poległo, lecz przebiliśmy się. Na moździerze i broń palną odpowiedzieliśmy własną zaciekłością i oskrzydleniem. Wycofali się do katedry, by stoczyć tam ostatni bój. To miejsce przechowuje jedne z najświętszych relikwii chrześcijaństwa. NIE ustąpimy bez względu na cenę. Kości apostoła Jakuba będą nasze - ryknąłem. Stał tam przywódca z mieczem. \"Niech żal ściśnie mi pierś. Wykuj swoją karę i wbij ją głęboko\" - powiedział. Zamachnąłem się na szaleńca, lecz uskoczył, skacząc niczym postać z gry platformowej, po czym runął na mnie z góry. Ciernie miecza otoczyła złowroga energia. W końcu jeden z naszych wojowników posłał w niego pełną serię z pistoletu maszynowego, zanim zdążył zrobić ze mnie szaszłyk. Zdołał już odrąbać stylisko mojego topora. Zakrwawieni i bliscy śmierci zabraliśmy przedmiot wyglądający na relikwię Apostoła i umknęliśmy. Z katedry wynieśliśmy też mnóstwo kosztowności, głównie dzieł sztuki. Triumf. A jednak... droga powrotna ciążyła bardziej niż jakakolwiek pielgrzymka. \"Odynie, czemuś nas opuścił?\" - jęczeliśmy, z niewiadomego powodu czując smak octu. Prawie nie ośmieliliśmy się otworzyć skrzyni z kośćmi. Jesteśmy jednak synami Północy, zuchwałymi i potężnymi, więc ją otworzyliśmy. Kości... w dotyku były plastikowe. Albo woskowe! To niemożliwe. Ktoś włączył radio, które uparcie powtarzało, że... prawdziwe kości apostoła Jakuba zdołano ukryć i skutecznie ochronić. Zdobyliśmy przynętę... z odtwarzaczem MP3. Nacisnęliśmy przycisk. Rozległy się słowa..."
 jom_expedition.90.a: "Przeklinam twe imię na wieki, błogosławię cię na wieki w śmierci."
 
 jom_expedition.91.t: "Bogactwa Sikiley" 
 jom_expedition.91.desc: "Czasy zmieniły się od ostatniej podróży Normanów na Sycylię. Ciepło i lazurowe morze pozostały takie same, lecz gospodarka wyspy podupadła. Przestała być ośrodkiem handlu, gdy pojawiły się szlaki do Nowego Świata, a znaczenie Morza Śródziemnego zmalało. Potem nadeszło nadmierne uzależnienie od rolnictwa i brak uprzemysłowienia, będący skutkiem zaniedbań chciwych elit Północy. To zaniedbanie zrodziło niepożądany żywioł - mafię. Wikińska drużyna jest podzielona w kwestii postępowania z nią. Niektórzy szanują jej siłę i zdolność przystosowania, chcą więc się od niej uczyć. Inni uważają mafiosów za podłych ciemiężycieli." 
 jom_expedition.91.a: "Jest nas zbyt mało, by cokolwiek zmienić." 
 jom_expedition.91.b: "Pora przywrócić porządek na wyspie."
 
 jom_expedition.92.t: "Prawo silniejszego"
 jom_expedition.92.desc: "Wikingowie podjęli się kilku osobliwych zleceń dla miejscowego bossa mafii. Przeważnie służyli w klubach jako ochroniarze-maskotki, jednocześnie pilnując wejść i przyciągając uwagę. Ściągali również długi od ludzi na tyle zdesperowanych, by pożyczyć od mafii. Poznali przy tym wiele skutecznych \"technik przesłuchań\". Było to dla nich prawdziwe objawienie. Kiedy wikingowie sięgali po przemoc, jeńcy zazwyczaj kończyli martwi. Teraz zrozumieli, że istnieje cały świat innych możliwości. Robili notatki, gdy mafijni zbóje podtapiali ofiary, razili prądem i zrywali paznokcie. Mafiosi pokazali im tak wiele, że Normanowie zapragnęli w zamian nauczyć ich kilku metod egzekucji. Miejscowym szczególnie przypadł do gustu krwawy orzeł."
 jom_expedition.92.a: "Tak działa mafia"
 
 jom_expedition.93.t: "W samo południe"
 jom_expedition.93.desc: "Jeden z mafijnych zbirów napastował kobietę w ciemnym zaułku, próbując zmusić ją do zapłaty. Uniósł kij bejsbolowy, by ją uderzyć, lecz nie zdołał. Nie z powodów moralnych, a przynajmniej nie z powodu własnej moralności. Odwrócił głowę i zobaczył za sobą dwumetrowego wikinga trzymającego kij w miejscu. Wiking walnął bandytę w brzuch tak mocno, że ten odleciał. Kobieta uciekła z krzykiem. Olbrzym pochylił się nad gangsterem i łamaną włoszczyzną zapytał, gdzie znajdzie jego szefa.\n\nBoss mafii jadł kolację ze wspólnikami. Bawili się znakomicie, obżerając pieczoną kaczką i popijając najlepsze wino, jakie można kupić za pieniądze. Ucztę przerwały odgłosy walki zza zamkniętych drzwi. Gdy spod nich wypłynęła krew, zrozumieli, co się dzieje. Ochroniarze wyciągnęli ukryte pistolety maszynowe i wycelowali w wejście, czekając na atak. Zamiast tego nagle rozprysło się okno za ich plecami. Wikingowie, korzystając z lin, wskoczyli do środka z zewnątrz. Wtedy naprawdę zaczęły się rzeź i grabież."
 jom_expedition.93.a: "Szkoda, że musimy odpływać."
 
 jom_expedition.94.t: "Wieczne Miasto" 
 jom_expedition.94.desc: "Piękny Rzym. Niegdyś stolica znanego świata, nadal ma ogromne znaczenie jako siedziba głowy Kościoła katolickiego. Złociste plaże, wyśmienita kuchnia oraz zachwycające zabytki, takie jak Koloseum i bazylika św. Piotra, czynią miasto idealnym miejscem wypoczynku po długiej i niebezpiecznej podróży morskiej. Tak przynajmniej uważa połowa drużyny. Pozostali, którzy zagłębili się w nordyckie podania, pamiętają, że wikingowie niegdyś złupili Rzym. A raczej tak im się wydawało. W rzeczywistości nieświadomie napadli na Luni, biorąc zwykłe miasteczko za Wieczne Miasto. Uważają, że trzeba naprawić tę pomyłkę, inaczej wikingowie zostaną zapamiętani jako pośmiewisko." 
 jom_expedition.94.a: "Zaszalejmy trochę." 
 jom_expedition.94.b: "Nikt nie będzie śmiał się z wikingów."
 
 jom_expedition.95.t: "Prawdziwe bogactwa Italii"
 jom_expedition.95.desc: "Wikingowie doskonale bawili się, próbując rozmaitych rzymskich przysmaków. Zgodnie z oczekiwaniami zjedli niezliczone porcje makaronu i pizzy, lecz apetyt wojowników naprawdę mogły zaspokoić dopiero steki, takie jak krwista bistecca alla fiorentina. Bardzo zasmakowało im również brodetto di pesce - zupa rybna z mnóstwem pomidorów i dodatkiem wina. Zastanawiali się, jak smakowałaby z bałtyckich ryb i z miodem zamiast wina. Zamówili wielkie ilości na wynos, zapakowane w pudła i pojemniki, aby \"każdy w Jomsborgu mógł skosztować Italii\". Żeby uprzyjemnić sobie podróż, zabrali też pokaźny zapas arrosticini na przekąskę."
 jom_expedition.95.a: "Mamma Mia"
 
 jom_expedition.96.t: "Lepsi od Wandalów"
 jom_expedition.96.desc: "Ludzie Północy spłynęli Tybrem, by zakraść się do Watykanu. Wdarli się do Pałacu Apostolskiego. Szarzy i brunatni, odziani w futra wikingowie starli się z barwną Gwardią Szwajcarską uzbrojoną we włócznie. Białe korytarze poczerwieniały od krwi. Schwytali papieża Leona XIV i wzięli go jako zakładnika, zmuszając, by zaprowadził ich do skarbca watykańskiego. Zabrali stamtąd złoty bizantyjski Crux Vaticana, papieską tiarę (nie uznali tego za kradzież, ponieważ papież jej nie używał), a także liczne kielichy i inne relikwie.\nNastępnie urządzili w Kaplicy Sykstyńskiej rodzime nordyckie święto: pili wino mszalne, pojedynkowali się i ucztowali, brudząc marmurową posadzkę tłuszczem i krwią. Wrzucali mięso w ogień i dziękowali swoim bogom za powodzenie."
 jom_expedition.96.a: "W imię Odyna, Thora i Frei."
 
 jom_expedition.97.t: "Gibraltar" 
 jom_expedition.97.desc: "Njörvasund to prosta sprawa. Ufortyfikowanej cieśniny strzeże wojsko i jeszcze gorsze siły. Nie możemy jej złupić, jeśli chcemy wpływać na Morze Śródziemne bez opływania całej Afryki. Pozostają negocjacje w sprawie bezpiecznej przeprawy oraz kilka pobocznych transakcji." 
 jom_expedition.97.a: "Zatem do dzieła." 
 
 jom_expedition.98.t: "Przeprawa zabezpieczona"
 jom_expedition.98.desc: "Możemy teraz przepływać w obie strony, kiedy tylko zechcemy, opłacając stały abonament władzom Gibraltaru. Okazuje się, że nawet wobec brutalnych łupieżców bawiących się w przebieranki potrafią być bardzo otwarci, jeśli ci płacą. Pieniądz przemawia, a topory bojowe jadą autobusem. Przy naszym tonażu i ładunku stawki są konkurencyjne."
 jom_expedition.98.a: "Oby nie mieli przyjaciół wśród tych, których łupimy..."
 
 jom_expedition.99.t: "Zmierzch Bogów"
 jom_expedition.99.desc: "Morze ucichło w sposób, jakiego nigdy nie znałem. Nawet sztormy wydają się żywe, lecz ten biały horyzont przypomina krawędź myśli nieprzeznaczonej dla człowieka. Płyniemy ku Antarktydzie, choć w sercu nazywam ją inaczej - Progiem. Teraz mam już pewność. Jeśli świat ma bramę do Asgardu, musi ona stać właśnie tutaj, poza mapami, poza władcami, poza wszystkimi sporami Midgardu. Sagi mówią o Bifröście płonącym między światami. Dlaczego nie miałby opadać na ostatnią nietkniętą ziemię? Lód gładki jak wypolerowana kość. Góry ukryte pod zamarzniętymi oceanami. Kontynent spowity zasłoną, jakby celowo go skryto. Coś musi tam być. I od dawna nas wzywa. Przybiliśmy do brzegu trzy dni temu. Zimno nie jest tu jedynie temperaturą - jest obecnością, która zagnieżdża się w naszych umysłach. Napiera na płuca i słucha. Niebo płonie bladym światłem nawet nocą, a wiatr przemawia językiem starszym od run.\n\nWczoraj, podczas zwiadu w głębi lądu przez półkę lodową wyrzeźbioną wiatrem, ujrzeliśmy metal. Z początku wziąłem go za sztuczkę światła, błysk pod śniegiem. Nie był to jednak żaden relikt wielorybników ani naukowców. Odkopaliśmy właz, zapieczętowany i oznaczony symbolem, o którym nie wspomina żadna saga, lecz który przeklina każda księga historii. Hakowaty krzyż. A wraz z nim ukrytą bazę pogrzebaną od czasu ostatniej wielkiej wojny. Wewnątrz - ciepło. Energia. Maszyny pomrukujące niczym uwięziony grom. Technika bardziej zaawansowana niż wszystko, co znamy. I nie jesteśmy sami.\n\nPatrzyli na nas, jakby duchy wtargnęły do ich sanktuarium. Blade mundury zachowane w sterylnych korytarzach. Godła upadłej Rzeszy. Nie uciekli ze świata - ukryli się pod nim. W hangarach wykutych w lodzie spoczywały zaawansowane maszyny latające, okrągłe naczynia z wypolerowanego metalu, niczym tarcze stworzone do lotu. Latające spodki. Prawdziwe. Ich przywódca przemówił ze zdumieniem, gdy ujrzał nasze sztandary i usłyszał mowę. Mamrotał po niemiecku o przeznaczeniu, o aryjskiej krwi wracającej do źródła. Wierzył, że przybyliśmy do nich dołączyć, że nordyccy synowie odnaleźli wreszcie ukryte ostrze historii. Jesteśmy Jomswikingami, to prawda - spadkobiercami północnej przeszłości - lecz nie dziedzicami szaleństwa supremacji. Przysięgi wiążą nas z braterstwem i wspólną siłą, nie z urojeniem odzianym w rasę. Ich obsesja czystości wydawała się mała w ogromnej lodowej sali, a jeszcze mniejsza pod niebem, które dopiero co przemierzyliśmy. Próbowali nas przekonać. Pokazali maszyny, silniki i niemożliwą broń. Mówili o nadchodzącym powrocie i odebraniu świata, który uważali za gorszy.\n\nOdpowiedzieliśmy krwią i toporami.\n\nWalka w stalowych korytarzach była szybka i brutalna. Ogień spotkał mróz. Hangar rozbrzmiał strzałami i hukiem rozbijanych maszyn. Jeden z dysków zapłonął, przebił sufit w eksplozji światła i runął w śnieg powyżej. O zmroku baza zamilkła. Słychać było tylko wiatr odzyskujący jej wejście. Pod lodem nie było bramy do Asgardu. A może jednak była. Nie w złotych salach ani na tęczowych mostach, lecz w wyborze dokonanym tego dnia. Bogowie nie objawili się w chwale. Objawili się w sądzie. Zasłużyliśmy na miejsca w Walhalli, odbierając życie największym wrogom, jakich mogliśmy kiedykolwiek napotkać."
 jom_expedition.99.a: "Zdecydowanie nigdy nikomu o tym nie mówmy."
 
 jom_expedition.100.t: "Duchy Sparty" 
 jom_expedition.100.desc: "Niektórzy nazywają ją kolebką cywilizacji. My mówimy: kolebka tej cywilizacji, z której nasza kultura czerpie dopiero w drugiej kolejności. Znacznie chętniej spoglądamy ku Północy niż ku Olimpowi. Grecy są jednak równie dobrymi żeglarzami jak my i mogą nas jeszcze czegoś nauczyć o taktyce na płytkich wodach. Możemy też napełnić własnych bogów dumą i sprzątnąć Grekom sprzed nosa cenne wizerunki ich dawnych bóstw, wyruszając w prawdziwą Odynseję." 
 jom_expedition.100.a: "Przekażcie żeglarzom nasze pozdrowienia." 
 jom_expedition.100.b: "Oddajmy bogom ich rzeźbione wizerunki!"
 
 jom_expedition.101.t: "Nowa Odyseja"
 jom_expedition.101.desc: "Żeglujemy wraz z Grekami po siedmiu wyspach, a w zamian za nasze liczne błyskotki zdobywamy ogrom wiedzy. Potrafimy teraz sprawniej prowadzić handel morski, ale wiele nauczyliśmy się również o budowie okrętów. Kupiliśmy nowy sprzęt stoczniowy i oprogramowanie, które powinny znacznie usprawnić naszą flotę handlową."
 jom_expedition.101.a: "Trzy tysiące lat morskiej tradycji należy do nas."
 
 jom_expedition.102.t: "Nowa Iliada"
 jom_expedition.102.desc: "Najlepszą częścią najazdu był fortel. Najpierw w naszych mediach społecznościowych doszło do strategicznych przecieków sugerujących, że zamierzamy uderzyć na górę Athos i kilka innych klasztorów. Parę mniejszych drużyn rzeczywiście tam ruszyło. Bardzo ostentacyjnie. Gdy ściągały na siebie ogień miejscowych i państwowych służb, my urządziliśmy muzealny rajd po całym Partenonie, nie płacąc za żaden bilet. Zabraliśmy wszystkie starożytne błyskotki, jakie mieli. Ich dawni bogowie stali się darami dla naszych. Jedna drużyna dotarła nawet na Olimp, lecz znalazła tam tylko chrześcijański klasztor. Mimo to wróciliśmy do domu dociążeni historią."
 jom_expedition.102.a: "Gdybyśmy tylko mieli dość lotnictwa, by przenieść Partenon do Jomsborga..."
 
 jom_expedition.103.t: "Miklagard" 
 jom_expedition.103.desc: "Ach, Bosfor. Na widok tych cieśnin coś budzi się w naszych wnętrzach. Za Dardanelami leży wielkie miasto Konstan... Stam... Miklagard. Wiele się zmieniło od ostatniej wizyty naszych okrętów, lecz Imperium trwa wiecznie, choć pod innym zarządem. Pod naszą nieobecność tureccy plemieńcy przejęli miasto pożądania świata i przekształcili je na własne podobieństwo, spychając Greków do roli kadłubowego państwa skupionego w Attyce. Jako spadkobiercy potężnych Waregów jesteśmy związani przysięgą służby i ochrony cesarza. Czy powinniśmy uznać prawowitość nowych panów Miklagardu, czy dokonać brutalnego odwetu w imieniu upadłych Bizantyjczyków?" 
 jom_expedition.103.a: "Sułtan doceni naszą ochronę!" 
 jom_expedition.103.b: "Musimy dochować wierności Basileusowi! Do ataku!"
 
 jom_expedition.104.t: "Duch Waregów"
 jom_expedition.104.desc: "Po wylądowaniu na krańcu Złotego Rogu zdezorientowani wikingowie zaczęli napastować mieszkańców i domagać się audiencji u cesarza. Sytuacja była bliska przemocy, bo berserkowie kipieli gniewem za każdym razem, gdy ktoś patrzył na nich ze zdumieniem, nie rozumiejąc osobliwej mieszaniny udawanego języka nordyckiego. Interwencja dostępnych stróżów prawa nagle jednak rozładowała napięcie. Wikingowie pozwolili się schwytać, a ich sprawa powoli pięła się po kolejnych szczeblach władzy: od miejscowego komendanta policji, przez burmistrza, aż po rząd centralny. Kilka dni później wojownicy siedzieli w pałacu prezydenckim w Ankarze i przedstawiali racje Sułtanowi całej Anatolii, Imperatorowi Byzantionu oraz nosicielowi wielu innych tytułów, którymi obdarzyli skromnego człowieka bez korony. Wikingowie stanowili osobliwą gromadę, a ich topory mogły być dziś nieco mniej skuteczne niż tysiąc lat wcześniej, lecz po długich negocjacjach przyjęto ich na służbę prezydenta jako straż ceremonialną. Sama ich obecność z pewnością doda władcy choć odrobinę prawowitości."
 jom_expedition.104.a: "Nowi panowie, ta sama dawna wierność."
 
 jom_expedition.105.t: "Zemsta Waregów"
 jom_expedition.105.desc: "Miklagard ujrzany przez wikingów niemal w niczym nie przypominał miasta znanego im z sag. Dla nich sprawa była oczywista: cesarska stolica upadła, a ich obowiązkiem było pomścić jej zdobycie w jedyny zrozumiały sposób - złupić ją i zrównać z ziemią w imię Basileusa. Hagia Sophia, przekształcona w meczet jako symbol tureckiego zwycięstwa, wyglądała na idealny pierwszy cel. Przepchnąwszy się przez tłum i zabijając strażników, którzy odważyli się stanąć im na drodze, wkroczyli do zabytkowej budowli i zachwycili się jej przepychem. Przez kilka następnych godzin wynosili na długie łodzie wszystkie kosztowności dość małe, by dało się je unieść. Na wiekowych murach wyryli runy z groźbami pod adresem \"tureckiego sułtana\", lecz przede wszystkim osobiste zapiski upamiętniające ich udział w najeździe. Gdy wrócili z łupami do łodzi, te niemal tonęły pod ciężarem skarbu. Nadmiar trzeba było wyrzucić w głębiny zatoki. W końcu wikingowie zostali zmuszeni przyznać się do porażki. Zdołali złupić zaledwie 0,0001% miasta. Niestety cała reszta nadal stała."
 jom_expedition.105.a: "Mimo wszystko \"sułtan\" musi drżeć ze strachu na wieść o ich powrocie."
 
 jom_expedition.106.t: "Liban" 
 jom_expedition.106.desc: "Zmierzamy ku wybrzeżom Libanu. Niegdyś był ośrodkiem fenickiego bogactwa, później osmańskiego imperium, dziś zaś jest umęczoną krainą pełną historii i sporów. Stosunki z Izraelem są gorzkie i skomplikowane. Libańczycy mogą chętnie sprzedać nam izraelski sprzęt, który wpadł im w ręce. Port w Bejrucie jest z kolei bogaty, słabo strzeżony i dojrzały do grabieży." 
 jom_expedition.106.a: "Sprawdźmy, co dziś podają na czarnym rynku." 
 jom_expedition.106.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.107.t: "Handel rydwanami"
 jom_expedition.107.desc: "Liban od stuleci nie był już ośrodkiem światowego bogactwa, lecz miał na sprzedaż coś wyjątkowego: izraelski bojowy wóz opancerzony, czołg Merkawa. Podwozie skrywało technologie przeoczone przez Libańczyków. Nasi inżynierowie utrzymują, że dzięki inżynierii wstecznej moglibyśmy przekształcić je w system przeciwlotniczy, a nawet element własnej Żelaznej Kopuły, gdybyśmy zechcieli taką zbudować."
 jom_expedition.107.a: "Synowie YHWH nadal budują najlepsze rydwany."
 
 jom_expedition.108.t: "Szturm na port"
 jom_expedition.108.desc: "To była prosta sprawa. Pod osłoną nocy nasza awangarda rozprawiła się z władzami portowymi, a nikt nie spodziewał się wejścia jednostek takiego rodzaju. Po usunięciu symbolicznego oporu ukradliśmy każdy kontener, jaki udało się znaleźć w porcie w Bejrucie. Przypomnijcie mi, żebym nigdy więcej nie obsługiwał po pijaku suwnicy kontenerowej. Kiedy nadeszła pierwsza reakcja ochrony, zdobyliśmy kilka czaszek, lecz zniknęliśmy, zanim na miejscu pojawiło się coś cięższego. Teraz trzeba otworzyć kontenery i sprawdzić, co jest w środku..."
 jom_expedition.108.a: "Skrzynie z łupem. Łupboksy. Wybaczcie."
 
 jom_expedition.109.t: "Kongo" 
 jom_expedition.109.desc: "Gdy zbliżamy się do równika, wiatr zmienia kierunek, a po jego przekroczeniu zaczyna wiać odwrotnie. Woda brunatnieje od osadów wynoszonych przez potężną deltę rzeki Kongo. Samą rzeką można żeglować, przynajmniej do pewnego miejsca, co pozwoliłoby nam dotrzeć do Kinszasy i spróbować nawiązać stosunki handlowe z jednym z największych producentów minerałów na świecie. Możemy też trzymać się wybrzeża i zapolować na grubą zwierzynę w równikowych dżunglach. Kość słoniowa i rogi nosorożców są towarem deficytowym, więc każde polowanie może przynieść ogromny zysk. Sprowadziłoby nas to jednak do roli kłusowników, a przy niewielkiej liczbie tych zwierząt samo ich wytropienie może okazać się trudne." 
 jom_expedition.109.a: "Handel z tymi ludźmi może być żyłą złota. Dosłownie." 
 jom_expedition.109.b: "Pora na Safari!"
 
 jom_expedition.110.t: "Toporem i Maczetą"
 jom_expedition.110.desc: "W Kinszasie rządząca junta przyjęła wikińską załogę z państwowymi honorami. Pomiędzy kastą watażków u władzy a równie brutalnymi łupieżcami od razu zrodziło się porozumienie. Spotkanie rozpoczęte w Palais du Peuple z udawanym poczuciem decorum szybko zmieniło się w ucztę dwóch plemiennych wodzów, którzy wymieniali wojenne opowieści i próbowali przelicytować się liczbą osobiście popełnionych okrucieństw. Zawarcie układu okazało się banalne, jeśli nie przypadkowe. Kongijski marszałek uznał wikińskiego dowódcę za duchowego brata i zaoferował mu najwspanialsze dary ziemi. W zamian obiecano ich właściwą wartość w złocie zdobytym podczas wcześniejszych i przyszłych najazdów. Nie podpisano żadnego formalnego traktatu, lecz ustna umowa była silniejsza niż puste słowa na papierze. Dopiero gdy skacowani wikingowie odpłynęli do Jomsborga, zrozumieli, że weszli w posiadanie cennych surowców i minerałów ziem rzadkich: kobaltu, diamentów, miedzi, a co może najważniejsze dla modernizacji - koltanu, niezbędnego składnika kondensatorów. Jakimś sposobem właśnie zniszczyli ceny na całym światowym rynku."
 jom_expedition.110.a: "Dyplomacja zawsze staje się łatwiejsza po odrobinie miodu."
 
 jom_expedition.111.t: "Przyjaciel z dżungli"
 jom_expedition.111.desc: "Wikiński oddział przez tydzień bezskutecznie szukał zwierzyny nadającej się do upolowania, a zapasy zaczęły się kończyć. Wreszcie jeden ze zwiadowców znalazł tropy, którymi załoga ochoczo podążyła. Po drodze odkrywali kolejne ślady i połamane gałęzie, zbiegające się przy niewielkim wodopoju. Ku ich zdumieniu pił z niego samotny młody słoń. Z gotowymi toporami powoli podeszli ze wszystkich stron, próbując go otoczyć. Gdy znaleźli się mniej więcej dziesięć metrów od zwierzęcia, przestraszony słoń zaszarżował. Omal nie przewrócił jednego z wikingów, po czym zatrzymał się, przepełniony ciekawością. Jeden z wojowników szykował się do ataku, lecz powstrzymał go goði drużyny, uznając zwierzę za znak od samego Odyna. Powoli wyciągnął rękę i delikatnie pogłaskał bok słonia, a bestia zatrąbiła czule. W drodze powrotnej zwierzę podążało tuż za załogą i bez wahania weszło na jeden z okrętów. Kapitan rozkazał ludziom wyciąć pobliskie zarośla oraz zebrać owoce na podróż. Wkrótce wikingowie i ich niespodziewany przyjaciel ruszyli z powrotem do Jomsborga."
 jom_expedition.111.a: "Trööööt!!!"
 
 jom_expedition.112.t: "Kapsztad" 
 jom_expedition.112.desc: "Kaapstad, Cape Town, Kapsztad - klejnot Afryki Południowej. Osiedli tutaj brytyjscy i burscy przybysze, którzy do niedawna górowali nad miejscowymi bogactwem i władzą. A raczej bezlitośnie ich kolonizowali. Perfidny Albion, nieustępliwy w swym kolonialnym dziedzictwie, do dziś budzi żal wśród czarnych Afrykanów. Możemy złupić zepsutych białych i w ten sposób oddać hołd uciśnionym. Albo przybyć z darami i w zamian otrzymać metale szlachetne oraz diamenty. W wielu miejscach osiągną wspaniałą cenę." 
 jom_expedition.112.a: "Błyszczące diamenty? Gdzie moja sakiewka?" 
 jom_expedition.112.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.113.t: "Handel w Kapsztadzie"
 jom_expedition.113.desc: "Wieziemy kamienie szlachetne i diamenty całymi skrzyniami. Biali i czarni równie mocno pragnęli naszych łupów oraz pieniędzy, a płacili za nie surowymi błyskotkami! Po drodze do domu tniemy i polerujemy skarby, wiedząc, że po powrocie będziemy pływać w kapitale!"
 jom_expedition.113.a: "Pogłoski o nędzy Polski są mocno przesadzone."
 
 jom_expedition.114.t: "Najazd na Kapsztad"
 jom_expedition.114.desc: "Burowie okazali się zaciekłymi przeciwnikami i doskonałą próbą dla naszych łupieżczych wojowników. Musieliśmy pośpiesznie zwerbować do pomocy wszystkich rdzennych czarnych Afrykanów, jakich znaleźliśmy. W ten sposób napełniliśmy serca złych kolonistów strachem, choć ich siły zbrojne zareagowały szybko. Po sprawiedliwej i świętej rzezi nie mieliśmy wyboru: trzeba było oddać teren i odpłynąć, nim to oni zaczęliby pić z naszych czaszek. Ta praktyczna lekcja antykolonializmu wspaniale przypomniała o naszej solidarności z ludźmi, którzy nie są biali, co - jak wie każdy dobry socjalista - automatycznie czyni ich uciśnionymi."
 jom_expedition.114.a: "Marks i Harald!"
 
 jom_expedition.115.t: "Róg Afryki" 
 jom_expedition.115.desc: "Dziwnie nazywać Somalię państwem upadłym, skoro jej ludzie zadowalają się życiem przy oazach i dosłownymi inwestycjami w piractwo: ofiaruj granatnik, a dostaniesz udział w łupie. Ta piracka giełda czyni z nich jednak naszych bezpośrednich konkurentów i idealnych rywali do szlifowania umiejętności. Możemy też sprzedać im niemal wszystko w zamian za rdzę i złom z licznych wraków." 
 jom_expedition.115.a: "Złom Somalijczyka jest skarbem wikinga!" 
 jom_expedition.115.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.116.t: "Somalijski złom"
 jom_expedition.116.desc: "Okazuje się, że kiedy człowiek chodzi cicho i nosi wielki topór, Somalijczycy dwa razy pomyślą przed atakiem. Wykorzystaliśmy ich wahanie, by zaproponować wymianę. Wkrótce ich \"piracka\" wyprawa została załadowana naszymi towarami oraz zachętą do pozyskiwania dla nas złomu. Daliśmy przykład jednej czy dwóm grupom, które próbowały nas oszukać, i zrobiliśmy dość silne wrażenie, by ustanowić stały szlak handlowy."
 jom_expedition.116.a: "Zardzewiały kadłub po zardzewiałym kadłubie budujemy lepsze jutro."

 jom_expedition.117.t: "I znów bijatyka"
 jom_expedition.117.desc: "Nietrudno było sprowokować odpowiedź, naruszając ich wody i podkradając tu i ówdzie broń. Siły odwetowe na pełnym morzu dorównywały naszym: naprędce przerobione trawlery i łodzie, a nawet przebudowany jacht. Były szybkie i bezzębne na dystans, lecz ich prowizoryczne uzbrojenie stawało się zabójcze z bliska. Zwyciężyliśmy, bo na otwartym morzu zasięg jest ważniejszy od siły ognia. Wnioski pozwoliły nam opracować odpowiednie ulepszenia dział okrętowych."
 jom_expedition.117.a: "Var hann inn bezti ok frómasti allra!"
 
 jom_expedition.118.t: "Mekka" 
 jom_expedition.118.desc: "To najświętsze miejsce islamu, miejsce narodzin samego proroka Mahometa. Niemuzułmanie nie mają wstępu do miasta, ale jeśli chcemy handlować, zawsze możemy skierować się do pobliskiej Medyny. Handel tutaj ma sens. Saudyjczycy są gotowi sprzedać tyle ropy, ile tylko zdołamy zabrać, a będziemy jej potrzebować w nadchodzących wojnach. Możemy też dokonać czegoś pięknego. Kamień Kaaby jest przecież bardzo piękny. Byłoby szkoda, gdyby ktoś go... ukradł. Logistykę zostawmy naszym dzielnym wikingom. Jeśli chcemy pokazać światu, że potrafimy wszystko, powinniśmy wedrzeć się do Mekki i ukraść najświętszą skałę islamu. Tychów byłby dla niej doskonałym miejscem." 
 jom_expedition.118.a: "Zdobądźmy tę ropę." 
 jom_expedition.118.b: "Ég ríf helvítis hjartað úr þér! Przynieście mi ten kamień!"
 
 jom_expedition.119.t: "Ropa z Medyny"
 jom_expedition.119.desc: "W interesach nieodmiennie i przesadnie przemawia pieniądz, a religia jedzie autobusem do pobliskiej Mekki. Saudyjskie umowy okazały się prawdziwą żyłą ropy. Nie musimy nawet ładować jej na drakkary - transport własnymi tankowcami zapewnią sprzedawcy. Potrzebujemy państwowej spółki naftowej, która przerobi cały surowiec, lecz możecie być pewni, że dzięki temu wyprzedziliśmy wrogów o całe mile."
 jom_expedition.119.a: "Czarne złoto jest nasze!"
 
 jom_expedition.120.t: "Kaaba z Mekki"
 jom_expedition.120.desc: "Nikt nie spodziewał się takiego zuchwalstwa po grupie przebierańców takich jak my. Spadamy niczym piorun, zmuszając kobiety i dzieci do panicznej ucieczki. Mężczyźni i policjanci jak jeden mąż stają do walki, lecz jak jeden mąż nie potrafią nawet nas opóźnić. Śmigłowce zbiegają się nad skałą, a wojownicy oplatają ją linami. Gotowe. Unosi się... coraz wyżej... i wyżej... Wydostajemy się w ostatniej chwili. Wygląda na to, że nie atakują naszych śmigłowców, bo boją się uszkodzenia kamienia w razie ich zestrzelenia. Za nami leżą rozgromieni wrogowie, pędzeni przed nami w pościgu. Rozlega się lament ich kobiet. Świat nigdy nie da nam o tym zapomnieć. Posypią się fatwy. Wybuchnie jeden czy dwa dżihady. Umma zjednoczy się przeciw nam i urządzi nam piekło. Ale dokonaliśmy tego. Tychów jest nowym świętym miejscem islamu."
 jom_expedition.120.a: "To była najlepsza i najgorsza chwila \"co myśmy narobili\" w naszym życiu."
 
 jom_expedition.121.t: "Dubaj" 
 jom_expedition.121.desc: "Niczym niegdyś Rzym, Dubaj jest miejscem bogatym i zepsutym, zbudowanym na grzbietach niewolników pracujących za pensję oraz na łupach. Rzym karmił się zdobyczami wojennymi, Dubaj zaś łupami wydartymi ziemi. Dziś stanowi świadectwo pychy przepełniającej władców świata islamu, bez względu na wartości muzułmańskie. Stare i nowe fortuny ściągają tu, by nawiązywać kontakty i korzystać z raju podatkowego. Los tych, którzy nie są obrzydliwie bogaci - od modelki z Instagrama po robotnika - bywa gorszy od śmierci. Mamy całkiem niezły pomysł, jak złupić całe miasto, zdobyć jednorazowy zapas ropy i niewyobrażalne bogactwa, a przy okazji wyzwolić pracujących niewolników. Możemy też po prostu odpocząć i urządzić tam imprezę. Z jakiegoś powodu." 
 jom_expedition.121.a: "Pokażmy naszą cywilizowaną stronę." 
 jom_expedition.121.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.122.t: "Dubajskie zarzucanie sieci"
 jom_expedition.122.desc: "Chyba dobrze się bawiliśmy. Spotkaliśmy kilku ważnych ludzi, choć większość jedynie uważała się za ważnych. Niestety prawie nikt nie traktował nas dość poważnie, by uczciwie pohandlować, lecz zaproszono nas na kilka imprez z technologicznymi nowobogackimi. Musieliśmy jednak wyjść, gdy tylko sprowadzili striptizerki. Wszystkie wyglądały na zmuszane do pracy, a kilka nie wydawało się nawet pełnoletnich. Ruszamy dalej posępni i zdezorientowani, żegnani przez bogactwa oraz niewolników Dubaju. Każdy prawdziwy wiking splunie na nasze zachowanie w tym mieście."
 jom_expedition.122.a: "Może potraktowaliby nas poważnie, gdybyśmy stworzyli nowe krypto. NjörðrCoin?"
 
 jom_expedition.123.t: "Plaga spadła na Dubaj"
 jom_expedition.123.desc: "Miażdżyć wrogów. Patrzeć, jak uciekają przed nami. Słuchać westchnień ulgi ich ladacznic! Nadeszliśmy niczym burza piaskowa, a za nami pozostawały ograbione bogactwa i wzniecone pożary. Jakiż strach możnych i jakaż radość niewolników półświatka! Złupiono każdy sklep z luksusem. Na bogów starych ORAZ nowych, nigdy nie widzieliśmy ani nie zabraliśmy tak wiele! Pojmaliśmy bogatych i potężnych mężczyzn oraz kobiety, którzy błagali, by wykupiono ich za gotówkę, a jeszcze lepiej za kontrakty na ropę! Prady i Swarovskie w niezliczonych ilościach. Połowa samochodów typu muscle car płonie, druga jest w naszych rękach! Zrabowaliśmy każdy metal szlachetny i każdy wartościowy przedmiot. Zanim ZEA zorganizowały odpowiedź, drogę odcięła PRAWDZIWA burza piaskowa, a nasze okręty wystarczyły, by odstraszyć straż przybrzeżną. Musieliśmy opóźnić kolejne wyprawy tylko po to, by dokończyć gwałtowną grabież i oczywiście ewakuować ocalałych przedstawicieli uciśnionych klas niższych. Podczas splądrowania miasta zagarnęliśmy niewyobrażalne bogactwa. Na całym świecie będą o tym śpiewać sagi, a masy i podobnie myślące reżimy wzniosą okrzyki radości. W końcu burza opadła, a siły ZEA wkroczyły do miasta, kiedy nas już dawno nie było. Powitało je ciało policjanta z głośnikiem wetkniętym w usta, odtwarzającym w kółko:"
 jom_expedition.123.a: "Panowie, witamy w Dubaju."
 
 jom_expedition.124.t: "India" 
 jom_expedition.124.desc: "Człon \"indo\" w nazwie indoeuropejskiej rodziny językowej wskazuje właśnie na ten subkontynent. Istnieją tu jedne z najstarszych cywilizacji, wsparte tysiącleciami nieprzerwanej tradycji pogańskiej. Większość świata podbiło chrześcijaństwo, a nawet Chiny \"upadły\" na rzecz marksizmu, który niektórzy odważniejsi krytycy śmią nazywać dziedzictwem chrześcijaństwa. Na tym tle przetrwanie pierwotnego indyjskiego panteonu robi jeszcze większe wrażenie. W napędzanym kultem przodków najeździe możemy zdobyć artefakty sprzed tysięcy lat. Albo przybyć jako kupcy. Państwo przeżywa technologiczny rozkwit i szczyci się długą tradycją zarówno innowacji, jak i... powiedzmy, cyfrowego sprytu." 
 jom_expedition.124.a: "Dołączmy do technologicznej rewolucji." 
 jom_expedition.124.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.125.t: "Handel z Indiami"
 jom_expedition.125.desc: "Indyjski motłoch, rojący się niczym mrówki, sowicie płacił za nasze towary. Najlepsi i najzdolniejsi ludzie tego kraju, z naszej perspektywy równie liczni, niemal zasypali nas sprzętem oraz oprogramowaniem. Przywozimy do domu cyfrowe wsparcie przedsiębiorstw działających na skalę niewyobrażalną w Polsce, a także umowy z kilkoma grupami od \"inżynierii społecznej\". Każda ma wieloletnie doświadczenie w pracy dla Nawalnego, Le Pen, Trumpa i innych. Ich głównym zadaniem będzie szkolenie naszych brygad cyfrowej wojny informacyjnej."
 jom_expedition.125.a: "Witamy w pomocy technicznej Jomsborga. W czym możemy pomóc?"
 
 jom_expedition.126.t: "Indyjskie fiasko"
 jom_expedition.126.desc: "Indii rzeczywiście strzegą potężni bogowie! Upokorzono nas tak straszliwie, że być może nawet Ukrzyżowany Żyd przyłączył się do karmicznego łomotu! Nasze okręty zboczyły z kursu jeszcze przed lądowaniem. Trafiliśmy na bezludną wyspę... a przynajmniej tak się wydawało. Gdy tylko zeszliśmy na brzeg, spadł na nas deszcz oszczepów i innych pocisków, zgodnie z obyczajami tubylców z wyspy Sentinel. Sami spróbujcie przeprowadzić desant pod ostrzałem po zgubieniu kursu, to zobaczycie. Gdy tylko dotarliśmy na pełne morze, ujrzeliśmy dwie rakiety rozświetlające niebo. Runęły i rozłupały dwa nasze drakkary na pół. Na horyzoncie sternik wypatrzył dwie korwety rakietowe typu Kora. Nie mieliśmy wyboru i nadaliśmy sygnał kapitulacji. Nawet nie chcieli brać nas do niewoli. Pozwolili odpłynąć z tymi ludźmi i rzeczami, które zdołaliśmy wyłowić."
 jom_expedition.126.a: "Karma to suka."
 
 jom_expedition.127.t: "Indochiny" 
 jom_expedition.127.desc: "Gdy podążamy wybrzeżem za Cieśninę Malakka, otwiera się przed nami Morze Południowochińskie i prosta droga do Indochin. Półwysep podzielony jest między cztery państwa, z których dwa zasługują na uwagę. Republika Wietnamu mogła w ostatnich latach przeprowadzić liberalizację, lecz w głębi pozostaje krajem socjalistycznym. Wyjątkowa wiedza rolnicza Wietnamczyków może pomóc zwiększyć naszą produkcję żywności, choć różnica klimatu zapewne utrudni kopiowanie ich rozwiązań. Możemy też wpłynąć do Zatoki Tajlandzkiej i napaść na metropolię Bangkoku. Przy takich rozmiarach na pewno znajdziemy tam coś wartościowego." 
 jom_expedition.127.a: "Zawsze warto uczyć się od bratnich socjalistów." 
 jom_expedition.127.b: "Tajowie powinni już wiedzieć, czego się spodziewać."
 
 jom_expedition.128.t: "Bogactwo Sif"
 jom_expedition.128.desc: "Po spotkaniach z członkami Komunistycznej Partii Wietnamu, niezliczonych lekcjach i prezentacjach ekspertów rolnictwa oraz wizytach w gospodarstwach, spółdzielniach i innych ogniwach odpowiednich łańcuchów produkcji - całej tej nudnej pracy, przez którą łupieżcy zaczęli kwestionować decyzję o współpracy z państwem Azji Południowo-Wschodniej - wikingowie uznali, że rozwiązaniem wszystkich żywieniowych problemów ich kraju jest jedna konkretna roślina: ryż. Oczywiście w Polsce próbowano już jego uprawy, ze słabym skutkiem z powodu temperatur nieodpowiednich dla klimatu umiarkowanego. Nie zamierzali się jednak poddawać. Z okrętami pełnymi nasion znanych odmian odpornych na chłód i załogami wzmocnionymi przez najlepszych wietnamskich praktyków oraz teoretyków rolnictwa przygotowali pierwsze nowe poletka we wsi nieopodal Jomsborga. Nastał czas oczekiwania. Wystawiono straże, by zapobiec ingerencji z zewnątrz, a każdego dnia ktoś ze świty Jarla osobiście nadzorował wzrost roślin. Gdy przyszła pora żniw, wszyscy z ulgą dowiedzieli się, że plon jest... znośny. Nadal wypadał blado w porównaniu z tradycyjnymi uprawami, ale przynajmniej pozwolił nieco urozmaicić wikińską dietę."
 jom_expedition.128.a: "Teraz oni też wiedzą, jak zrobić, żeby ryż rósł w Polsce."
 
 jom_expedition.129.t: "Skalowanie floty"
 jom_expedition.129.desc: "Płynąc przez Zatokę Tajlandzką, wikingowie natrafili na zaskakująco słabo bronioną bazę morską. Jednostki stanowiące znaczną część floty kraju stały niemal bez opieki. Łupieżcy rozumieli, że większa łódź jest z zasady lepsza od mniejszej, obrali więc za cel największy dostępny okręt - jedyny tajlandzki lotniskowiec. Na tle innych jednostek tego typu nie wyróżniał się niczym szczególnym, lecz dla wikingów przywykłych wyłącznie do długich łodzi z silnikami był największym morskim kolosem, jaki potrafili sobie wyobrazić. Bez większych trudności przemknęli obok nielicznych patroli i weszli do pomieszczenia dowodzenia, porzucając własne okręty. Przez kilka minut na ślepo majstrowali przy pulpitach, aż wreszcie uruchomili silniki. W całej bazie ogłoszono alarm, lecz zanim zorganizowano właściwą odpowiedź, wikingowie zdążyli już odkryć, jak skierować okręt do przodu. Wyszli więc z portu całą naprzód. Cała tajlandzka marynarka ścigała ich aż na wody międzynarodowe, lecz nikt nie odważył się strzelać do własnej chluby floty. Ostatecznie uznano, że lepiej ją stracić, niż przypadkiem zniszczyć."
 jom_expedition.129.a: "Przy nim długie łodzie wyglądają niemal żałośnie."
 
 jom_expedition.130.t: "Chiny: Jedna wyprawa, dwa systemy" 
 jom_expedition.130.desc: "Kiedy wikingowie przemierzali siedem mórz i mieszkali w długich domach oraz wioskach, Chiny znajdowały się u szczytu światowej cywilizacji. Do dziś, mimo licznych wad, pozostają ośrodkiem cywilizacji socjalistycznej. Choć są państwowo-kapitalistyczne, wspierają światową sprawę socjalizmu samym pokojowym wzrostem. Z pewnością docenią nasze dary i propozycje handlowe, nawet jeśli nie uznają nas od razu. Możemy też napaść na ich krnąbrną odnogę - Tajwan. Ta niezłomna twierdza światowego kapitalizmu i wyspa zamieniona w amerykański lotniskowiec mieści fabryki mikroprocesorów niezbędnych dla całej zachodniej technologii. Uderzenie w nie zaboli kapitał tam, gdzie trzeba, i odpowiednio go rozwścieczy." 
 jom_expedition.130.a: "Do naszych towarzyszy w Republice Ludowej!" 
 jom_expedition.130.b: "Przeciwko niewolnikom amerykańskiego imperium!"
 
 jom_expedition.131.t: "Shenzen I/O"
 jom_expedition.131.desc: "Pragnąc rozszerzyć zasięg swoich produktów i technologii, Chińczycy niemal podarowali nam maszyny i układy elektroniczne. Oczywiście będziemy od nich zależni w kwestii pomocy technicznej oraz części zamiennych, lecz gdy tylko nauczymy się je kopiować, będziemy mogli odtworzyć w samej Polsce niezrównaną wydajność produkcji. Ledwie podnosząc się po Upadku, staniemy się najważniejszym ośrodkiem przemysłowym Europy - a wszystko dzięki Republice Ludowej."
 jom_expedition.131.a: "Wyprodukowano w Jomsborgu."
 
 jom_expedition.132.t: "Huányuàn"
 jom_expedition.132.desc: "Podstępna infiltracja wykorzystująca niechlujną ochronę portu. Szturm na fabrykę mikroprocesorów w środku nocy, pancerze lśniące w blasku księżyca. Wielokrotnie wydawało się, że dopadną nas liczne widma tej krainy, lecz nie musimy lękać się umarłych. Żywi zaś nie byli dość dobrze uzbrojeni, by nas powstrzymać. Z fabryki zabieramy schematy, wielki ładunek sprzętu, dane z miejscowych serwerów oraz oprawione zdjęcie, na którym Kubuś Puchatek zastępuje głowę Xi Jinpinga - fotomontaż pamiętający czasy sprzed generatywnej sztucznej inteligencji. Gdy przybywa policja, w ruch idą topory i rozlegają się okrzyki ku czci Thora. Szybko zabijamy wszystkich. Ewakuacja przebiega bez wydarzeń, łodziami \"pożyczonymi\" od miejscowych rybaków. Wiadomości huczą o sabotażu kluczowego ogniwa łańcucha dostaw komputerów. Rząd Tajwanu stawia flotę i wojsko w stan najwyższej gotowości, oskarżając Chiny kontynentalne. Aha, ceny sprzętu wzrosły o jedną trzecią. Nieważne. Ze zdobyczy złożymy wszystkie komputery do gier, jakich kiedykolwiek zapragniemy."
 jom_expedition.132.a: "I proszę, nie mówcie graczom, że wywołaliśmy kolejny niedobór pamięci RAM."
 
 jom_expedition.133.t: "Korea" 
 jom_expedition.133.desc: "Półwysep Koreański dzieli się na dwa państwa - rolniczy kraj socjalistyczny i kapitalistyczną marionetkę. Koreańczycy z Północy są gotowi przywitać nas z otwartymi ramionami, podobnie jak dosłownie każdego, kto potraktuje ich poważnie i zignoruje dokonania humanitarne. Zawarcie jakiejś umowy handlowej powinno więc być stosunkowo bezpieczne. To jednak państwo parias, a zadawanie się z nim nie poprawi naszej i tak fatalnej reputacji. Południe jest z kolei pogrążone w dekadencji. Nawet z oddali widać, że posiada znacznie większe bogactwa, a więc i potencjalne łupy, lecz być może trzeba będzie wyrwać je siłą. Czy naprawdę jesteśmy pewni, że zdołamy ich pokonać?" 
 jom_expedition.133.a: "Potrzebujemy partnerów. Sprawdźmy, co oferuje Północ." 
 jom_expedition.133.b: "Południe uważa się za nietykalne. Pokażemy im, jak bardzo się mylą!"
 
 jom_expedition.134.t: "Układ Dwóch Pariasów"
 jom_expedition.134.desc: "Gdy wikińskie długie łodzie zbliżyły się do północnokoreańskiego wybrzeża, przechwyciła je flota kutrów patrolowych. Najpierw bezpiecznie odprowadziła je do brzegu, a potem w górę rzeki do Pjongjangu. Na przybycie gości rozwinięto czerwony dywan, a wysocy rangą urzędnicy partyjni wyszli oficjalnie powitać ich w stolicy. Audiencja u Najwyższego Przywódcy była równie przyjemna. Załogę potraktowano jak oficjalnych dostojników Jarla, wraz ze wszystkimi przywilejami tytułu. Spełniano każdą ich prośbę. Po udziale w kilku wydarzeniach propagandowych i obwożeniu po mieście jako dowodu rosnącego poparcia zagranicznego przedstawiono im zatwierdzoną z góry, lecz bardzo hojną umowę handlową. Koreańczycy obiecali wysłać część starszych modeli ciągników za niemal symboliczną ilość złota. Maszyny są oczywiście niebezpiecznie przestarzałe, a ich stan techniczny pozostawia wiele do życzenia. Przynajmniej zdobyli jednak wiarygodnego partnera handlowego, który potrzebuje ich równie mocno jak oni jego."
 jom_expedition.134.a: "Naprawdę nie stać nas na nic lepszego, prawda?"
 
 jom_expedition.135.t: "Szok technologiczny"
 jom_expedition.135.desc: "Na szczęście dla wikingów wybrany odcinek południowokoreańskiego wybrzeża odwiedzały wyłącznie statki handlowe. Bezpiecznie wyszli na ląd pośrodku tętniącej życiem metropolii, gdzie potężne wieżowce górowały nad nimi i okrętami. Łupieżcy siłą wtargnęli do pobliskiej fabryki. Otworzyli magazyny i ujrzeli niezliczone pudła z drobną elektroniką: telefonami, tabletami, pomocami edukacyjnymi dla dzieci i innymi urządzeniami, których przeznaczenie ledwie rozumieli. Uruchomili alarm i wiedzieli, że wojsko lada chwila spadnie im na głowy, więc załadowali sprzęt na łodzie i szybko wypłynęli na otwarte wody. Goði drużyny, Eirikr, spróbował włączyć jedno z urządzeń, by poznać jego funkcję. Odpowiedziała mu głośna, nieustannie powtarzająca się melodyjka, która towarzyszyła wikingom przez kilka mil morskich. W końcu jeden z berserków, doprowadzony do szału przenikliwym hałasem, wyrzucił urządzenie i kilka innych za burtę."
 jom_expedition.135.a: "Możecie go winić? Wyobraźcie sobie słyszeć ten jazgot przez całą drogę."
 
 jom_expedition.136.t: "Słomkowy Kapelusz" 
 jom_expedition.136.desc: "Japonia jest łańcuchem górzystych wysp uczepionych skraju świata. Władają nią cesarz i wojownicza elita owładnięta honorem, hierarchią oraz kontrolą. Izolacja ukształtowała zdyscyplinowane, lecz zamknięte społeczeństwo, głęboko podejrzliwe wobec obcych i zaciekle broniące suwerenności. Nie przywitają nas z otwartymi ramionami, a każda próba pokojowego kontaktu będzie wymagać starannego ceremoniału, darów i gotowości do gry według ich reguł, nie naszych. Wyspy nie są jednak biedne. Japońskie porty obsługują ogromny handel, miasta wypełniają rzemieślnicy, kupcy i zgromadzone bogactwa, a wieś zorganizowano z bezwzględną wydajnością. Potencjalna nagroda jest znaczna, lecz ryzyko również. Ich wojownicy są doskonale wyszkoleni, obrona wielowarstwowa, a determinacja legendarna. Jeśli dyplomacja zawiedzie, po bogactwo trzeba będzie sięgnąć siłą. Czy naprawdę jesteśmy gotowi zmierzyć się z państwem, które przez stulecia doskonaliło sztukę wojny?" 
 jom_expedition.136.a: "Dajcie im te wyszukane ceremo... zaraz, czy to Gundam?" 
 jom_expedition.136.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.137.t: "Neon Genesis Vikingelion"
 jom_expedition.137.desc: "Przybycie wikińskiej wyprawy do japońskiego portu szybko przerodziło się w niezwykle chaotyczny incydent. Po zejściu na ląd łupieżcy natrafili na olbrzymią białą maszynę nieznanej konstrukcji, kanciastą, ciężko opancerzoną i górującą nad nabrzeżem niczym wzniesiony ludzką ręką bożek wojny. Jej rozmiary i przeznaczenie były oczywiste, nawet jeśli natura pozostawała zagadką. Obecni urzędnicy japońscy zareagowali widocznym przerażeniem. Przemoczeni podróżą i jawnie uzbrojeni wikingowie rażąco kontrastowali z uporządkowanym portem i starannie utrzymywaną maszyną stojącą za nimi. Próby porozumienia załamały się niemal natychmiast. Niektórzy urzędnicy wykonywali formalne gesty, inni wykrzykiwali pilne ostrzeżenia, a kilku na chwilę zupełnie znieruchomiało. Ignorując polecenia i alarmy, wikińskie siły ruszyły ku maszynie. W całym porcie zawyły syreny, a żołnierze pobiegli powstrzymać wtargnięcie. Między magazynami odbijały się krzyki, eter wypełniły gorączkowe meldunki radiowe. Jeden z łupieżców dokonał bezpośrednich oględzin, uderzając w opancerzoną stopę maszyny i głośno oceniając jej możliwą przydatność poza Japonią. Zanim sytuacja zdążyła wymknąć się spod kontroli, wikingowie jasno wyrazili zamiary. Zamiast przejmować maszynę siłą, zaoferowali pokaźne łupy oraz zapłatę w surowcach w zamian za własność machiny wojennej. Grożący wybuchem kryzys bezpieczeństwa nagle zmienił się w niespodziewane i skrajnie niekonwencjonalne negocjacje."
 jom_expedition.137.a: "Wsiadaj do pieprzonego robota, Szymon."
 
 jom_expedition.138.t: "Viking's Bizzare Adventure"
 jom_expedition.138.desc: "Najazd na Tokio rozpoczął się z pewnością siebie, która szybko okazała się przesadna. Wikińskie długie łodzie zapuściły się głęboko w port, a łupieżcy ruszyli ku centrum miasta, zapewne poszukując największych skarbów w siedzibie władzy cesarskiej. Ulice były szerokie, uporządkowane i niepodobne do niczego, co dotąd widzieli. Po obu stronach wznosiły się potężne konstrukcje ze stali i szkła oraz świetliste symbole o nieznanym znaczeniu. Marsz ku Pałacowi Cesarskiemu zatrzymał się niemal natychmiast. Kolejne warstwy ochrony, błyskawicznie mobilizowani obrońcy oraz sam ogrom miasta spowolniły pochód do pełzania. Odległości wyglądające na mapach na niewielkie okazały się w rzeczywistości ogromne, a silnie strzeżone podejścia uniemożliwiły dalszy marsz. Wobec tych przeszkód wikingowie wycofali się z centrum. Operacja nie pozostała bez nagrody. Na trasie odwrotu z pracowni, magazynów i obiektów nadawczych zabrano skrzynie cyfrowych artefaktów. Zbiory syntetycznych wykonawców, znanych miejscowym jako vocaloidy, przewieziono na długie łodzie jako główną zdobycz wyprawy. Pałac Cesarski pozostał nietknięty, lecz wikingowie odpłynęli zadowoleni. Pozostawili Tokio poturbowane, ale stojące, a ze sobą zabrali zdumiewający nowy rodzaj skarbu. Nikt nie rozumiał go w pełni, lecz wszyscy zgadzali się, że musi być cenny, skoro Japonii tak bardzo na nim zależy."
 jom_expedition.138.a: "Naprawdę chciałem tę turkusową."
 
 jom_expedition.139.t: "Indonezja" 
 jom_expedition.139.desc: "Republiki Indonezji i Filipin to małe chińskie wysepki kolonialne produkujące dla świata gówniane buty. Albo archipelagi złożone z dziesiątek tysięcy wysp, setek kultur i języków. Zależy, kogo zapytać. Tak czy inaczej, pośród celów godnych najazdu dość jasno lśni jedynie Singapur - niewielkie miasto-państwo posiadające więcej pieniędzy, niż ktokolwiek mógłby mieć i zachować zdrowe zmysły. Filipińczycy i Indonezyjczycy chętnie sprzedadzą nam za to wspomniane buty oraz kauczuk." 
 jom_expedition.139.a: "Kauczuku potrzebujemy bardziej niż Singapuru." 
 jom_expedition.139.b: "Ég ríf helvítis hjartað úr þér!"
 
 jom_expedition.140.t: "Miklagard Wschodu"
 jom_expedition.140.desc: "Singapur jest finansowym węzłem Wschodu, potężnym miastem-państwem, któremu przepychem dorównują jedynie Japonia, Korea i Chiny. Rozsądnie byłoby złupić jego skarbiec oraz banki i opuścić okolicę z ogromem metali szlachetnych. Policja, przywykła do starannie zaprojektowanego, potulnego społeczeństwa azjatyckich kultur, nie była gotowa na prawdziwych synów Północy, którzy siłą napadali na jeden bank za drugim. Uciekliśmy z ilością kruszców wystarczającą, by utworzyć własną nową rezerwę skarbową, jeśli tylko zechcemy."
 jom_expedition.140.a: "Nie tylko oko Odyna lśni. Singapurskie złoto również!"
  
jom_expedition.141.t: "Cuda Indonezji"
jom_expedition.141.desc: "Wygląda na to, że ludy Indonezji naprawdę są zdecydowane odgrywać Słowian z niższych warstw społecznych. Ale co z tego? Buty okazały się zaskakująco wytrzymałe, a kupiliśmy je za grosze. Co ważniejsze, zdobyty kauczuk wystarczy nam na wieki. Filipińczycy byli równie gościnni, przynajmniej dla tych, którzy potrafili znieść ich inscenizacje Męki Pańskiej. I tak nie byli dość bogaci, by opłacało się ich najeżdżać."
jom_expedition.141.a: "A ich jedzenie sprawiało, że nasze wyglądało jak breja z cebuli i buraków!"
 
jom_expedition.142.t: "'Straya"  
jom_expedition.142.desc: "Pamiętacie Bractwo Węgla Ziemkiewicza? Ktoś powinien wygnać ich wszystkich do Australii. Mogliby bawić się całymi górami porządnego węgla odkrywkowego, zamiast przewiercać nasz wspaniały kraj po złoża, których opłacalne wydobycie wymagałoby całej krasnoludzkiej twierdzy. Możemy zawrzeć umowy na tanie paliwa kopalne, bo broda Odyna albo zwykła konieczność najwyraźniej przesłoniły nasz instynkt ekologiczny. Albo napaść na to miejsce po... eee... najgorzej chrzczone narkotyki na świecie?" 
jom_expedition.142.a: "Może Ziemkiewicz ma trochę racji w sprawie węgla, skoro jest tak tani i powszechny." 
jom_expedition.142.b: "Ég ríf helvítis hjartað úr þér!"
 
jom_expedition.143.t: "Australijski węgiel"
jom_expedition.143.desc: "Początkowe ceny były przyzwoite, lecz pozostawały jeszcze kwestie odległości i przepisów środowiskowych, do których musieliśmy zatrudnić miejscowe kancelarie prawne. Mimo to transport ruszył i mamy własne źródło tanich paliw kopalnych. Możemy być spokojni, że nasze okręty napędzane węglem nie będą musiały przepłacać za paliwo."
jom_expedition.143.a: "Hura!"
 
jom_expedition.144.t: "Druga Wielka Wojna Emu"
jom_expedition.144.desc: "Próbując napaść na miasto zwane Perth, uznaliśmy, że najlepiej przeprowadzić desant bez oporu na pobliskim pustkowiu. Problem w tym, że natknęliśmy się na migrującą hordę emu. Oczywiście otworzyliśmy ogień, lecz ptaki wciąż wracały, prowadząc potyczki i wyczerpując naszych toporników oraz strzelców. Wkrótce pojawiły się kangury, uznając, że naruszyliśmy ich tereny lęgowe. Nawet najlepsi berserkowie nie mogli sprostać ich kopnięciom. Emu odciągały nasz ogień, a kangury oskrzydlały nas niczym zgrana armia. Najgorsze wydarzyło się jednak, gdy miejscowy - brzuchaty ćpun wyglądający, jakby miał osiemdziesiąt zębów - ukradł proszki naszych berserków, kilka toporów, pancerz, a nawet broń palną. Uciekł, zanim zdołaliśmy porządnie mu się przeciwstawić, po drodze nokautując kilku ludzi i wrzeszcząc coś o tym, że jest \"człowiekiem, który schwytał słońce w drodze do Walhalli\". Chyba swój chłop. My jednak nie pryskamy zębów chromem."
jom_expedition.144.a: "Poznanie szlaków migracji i zachowań zwierząt może się przydać w Polsce, gdy dziki staną się problemem."
 
jom_expedition.145.t: "Polinezja" 
jom_expedition.145.desc: "Przed nami pozostała już tylko bezkresna połać Oceanu Spokojnego, poprzecinana archipelagami odległymi od siebie o setki mil morskich. Mamy szczęście cieszyć się spokojnymi wodami. W przeciwnym razie żegluga byłaby niemal niemożliwa. Polinezyjscy żeglarze, dla których te wyspy są domem, to doświadczeni podróżnicy zawstydzający nawet nasze umiejętności przemierzania mórz. Być może rozsądnie byłoby poznać ich sekrety i spędzić trochę czasu z osobliwym ludem z drugiego końca świata, którego tradycje mają tak wiele wspólnego z naszymi. Możemy też raz na zawsze zakończyć dyskusję, napadając na ich ojczyznę. Skoro są tak doskonałymi żeglarzami, zobaczymy, czy zdołają oddać." 
jom_expedition.145.a: "Chodźcie, bracia. Możemy się wiele od siebie nauczyć." 
jom_expedition.145.b: "Nawet antypody nie leżą poza zasięgiem naszych najazdów!"
 
jom_expedition.146.t: "Wymiana kulturowa"
jom_expedition.146.desc: "Mimo początkowych obaw po obu stronach pierwszy kontakt dwóch kultur żeglarskich przebiegł zaskakująco gładko. Gdy wikińskie długie łodzie przybiły do Tonga, łupieżców natychmiast zaprowadzono do królewskiej rezydencji w Nuku'alofie. W porównaniu z cudami oglądanymi podczas podróży budynek nie robił większego wrażenia, lecz czuli się w nim zaskakująco swojsko. Powitano ich jak zaginionych braci - rozdzielonych i umieszczonych po przeciwnych stronach świata, a jednak ponownie zjednoczonych. Szybko narodziło się wzajemne zrozumienie. Wikingowie uraczyli Tongańczyków opowieściami o swoich wyprawach, a w zamian poznali polinezyjskie sagi, mity o stworzeniu oraz historie o pierwszych podróżach i osadnictwie na bezkresnym Pacyfiku. Następnie urządzono towarzyski mecz rugby. Wikińska załoga nie drgnęła na widok haka wyspiarzy, lecz musiała przełknąć jednostronną porażkę, bo nawet najtwardsi berserkowie raz za razem lądowali na ziemi. Co zaskakujące, przyjęli przegraną z godnością, podziwiając siłę Tongańczyków i być może ucząc się przy tym kilku sztuczek."
jom_expedition.146.a: "Obyśmy spotkali się ponownie. Następnym razem wy odwiedźcie nas."
 
jom_expedition.147.t: "Zbieżność nazw"
jom_expedition.147.desc: "Atol Kiritimati nie był pierwotnym celem wikingów. Ani trochę. Wyjątkowo gwałtowny sztorm zepchnął ich długie łodzie z kursu, a przez kilka dni łupieżcy dryfowali bez nadziei, żeglując na oślep i modląc się o jakikolwiek skrawek lądu, zanim skończą się zapasy. Gdy ujrzeli wyspę, czuli się bardziej jak rozbitkowie widzący ratunek niż straszliwi zdobywcy, za których się uważali. Palmy kokosowe łagodnie kołysały się na wietrze, fale spokojnie rozbijały o brzeg, a w oddali krzyczały mewy. Z początku sądzili, że trafili do Walhalli. Niestety wylądowali w Polsce. Nie w kraju, oczywiście, lecz w osadzie noszącej tę samą nazwę, kilka kilometrów na południe od równie oryginalnie nazwanych metropolii Londynu i Paryża. Wikingowie złupili więc te historyczne stolice, dokonując czegoś, czego nie osiągnęli nawet najwięksi przodkowie. Wielki był ich skarb, a gdy wrócili i dwór Jarla usłyszał o wyczynach, każdy łupieżca otrzymał własne wodzostwo. Oczywiście wygodnie przemilczeli, że w rzeczywistości jedynie nękali kilku bezbronnych wyspiarzy, a łup nie \"zaginął na morzu\", lecz nigdy nie istniał."
jom_expedition.147.a: "Z dwojga złego..."
 
jom_expedition.148.t: "Świt bogów" 
jom_expedition.148.desc: "W przeciwieństwie do Winlandii czy Grenlandii Antarktyda nie nosi śladów nordyckiego osadnictwa. Jej udokumentowana historia zaczyna się dopiero w epoce nowoczesnej, gdy dziewiętnastowieczne wyprawy potwierdziły istnienie ogromnego południowego kontynentu, od dawna przewidywanego przez geografów. Kolejne ekspedycje odsłoniły zamarzniętą krainę większą od Europy, zdominowaną przez lodowce szelfowe, góry podlodowcowe oraz warunki uniemożliwiające stałe zamieszkanie. Międzynarodowe stacje naukowe utrzymują dziś ograniczoną obecność na obrzeżach kontynentu, rządzonego wspólnym traktatem, nie suwerennością jednego państwa. Mimo że Antarktyda weszła do zapisanej historii dopiero niedawno, jej ogrom i odosobnienie wciąż podsycają spekulacje. Doniesienia o jeziorach podlodowcowych, niezbadanych pasmach górskich i niewyjaśnionych formacjach geologicznych nadały jej reputację jednej z ostatnich nieznanych rubieży Midgardu. Członkowie wyprawy Jomswikingów opisują zbliżanie się do kontynentu w podniosłych słowach, przyrównując skute lodem widnokręgi do progu za znanym światem. Dowódcy określają misję jako odkrywczą i symboliczną. Sugerują, że ogromne białe wnętrze oznacza nie tylko terytorium, lecz również objawienie, jakby miało być bramą do krainy bogów. Lądowanie nastąpi w skrajnie trudnych warunkach. Nie wiadomo, czy Antarktyda przyniesie wiedzę naukową, wartość strategiczną, czy coś trudniejszego do nazwania." 
jom_expedition.148.a: "Dlaczego płyniemy do tego lodowego piekła?" 
  
jom_expedition.149.t: "Wyprawa zakończona niepowodzeniem"
jom_expedition.149.desc: "Wyprawę przerwano z powodu krytycznych strat poniesionych podczas podróży. Skrajnie trudna pogoda uszkodziła kilka jednostek w sposób uniemożliwiający naprawę, powodując utratę zapasów i ludzi. Pozostałe okręty uznano za niezdolne do dalszego prowadzenia misji. Przyrządy nawigacyjne zostały uszkodzone, a ocalałym jednostkom brakowało wystarczających zapasów. Dowództwo zarządziło natychmiastowy odwrót. Celów misji nie zrealizowano. Ocalałe siły wróciły do portu w celu uzupełnienia strat i ponownej oceny sytuacji."
jom_expedition.149.a: "Ech..."

jom_expedition.150.t: "Wyprawa opóźniona"
jom_expedition.150.desc: "Postęp spowolniły niesprzyjające wiatry i drobne uszkodzenia żagli poniesione podczas ciężkiej pogody. Na morzu przeprowadzono doraźne naprawy. Nie odnotowano ofiar. Kurs pozostaje bez zmian. Przewidywane opóźnienie jest niewielkie i zależy od poprawy warunków wiatrowych."
jom_expedition.150.a: "Kotwice w górę!"

jom_expedition.151.t: "Wyprawa opóźniona"
jom_expedition.151.desc: "Flota zboczyła z wyznaczonego kursu po otrzymaniu doniesień o pobliskiej osadzie nadbrzeżnej, której nie uwzględniono na pierwotnej trasie. Dowództwo zezwoliło na tymczasowe lądowanie w celu oceny możliwości uzupełnienia zapasów oraz zebrania informacji. Czas poświęcono na negocjacje, handel i zwiad. Doszło do kilku drobnych starć. Po paru dniach flota wznowiła podróż. Opóźnienie jest umiarkowane, lecz pozostaje pod kontrolą."
jom_expedition.151.a: "Wrócić na kurs."

jom_expedition.152.t: "Wyprawa opóźniona"
jom_expedition.152.desc: "Na okręcie flagowym wybuchł konflikt między członkami załogi, wywołany sporem o decyzje dowództwa i podział łupów z wcześniejszych najazdów. Podczas nocnej wachty frakcja buntowników próbowała podważyć władzę dowódców. Zamieszki opanowano po krótkiej walce na pokładzie. Zgłoszono dwie ofiary śmiertelne. Podżegaczy stracono. Przywrócono stabilność floty, lecz morale pozostaje nadwyrężone. Wypłynięcie i dalszy marsz opóźniły się do czasu ponownego zaprowadzenia porządku."
jom_expedition.152.a: "Utrzymać porządek!"

jom_expedition.153.t: "Do pełniących obowiązki przywódców Jomsborga"
jom_expedition.153.desc: "Organizacja Narodów Zjednoczonych jednoznacznie potępia trwające najazdy morskie i zorganizowane działania zbrojne prowadzone przez siły podległe Państwa dowództwu. Potwierdzone raporty przedstawione Radzie Bezpieczeństwa dokumentują powtarzające się ataki na statki cywilne, zbrojne wtargnięcia do osad nadbrzeżnych, bezprawne przejmowanie mienia oraz przetrzymywanie osób niebiorących udziału w walce. Działania te stanowią poważne naruszenia prawa międzynarodowego i bezpośrednie zagrożenie dla stabilności regionalnej oraz bezpieczeństwa żeglugi międzynarodowej.\n\nPomimo wcześniejszych wezwań do powściągliwości i deeskalacji wrogie działania nie ustały. Skala i koordynacja operacji jednoznacznie wskazują na odpowiedzialność dowództwa. W obecnych warunkach nie można już zapewnić bezpieczeństwa ludności cywilnej ani ochrony uznanych szlaków żeglugowych.\n\nW związku z powyższym, na mocy uprawnień przyznanych Kartą Narodów Zjednoczonych oraz zgodnie z nadzwyczajną rezolucją Rady Bezpieczeństwa, zatwierdzono powołanie wielonarodowych morskich sił stabilizacyjnych. Obecnie trwa ich rozmieszczanie w regionie objętym działaniami. Pierwsze elementy są w drodze. Mandat misji obejmuje ochronę żeglugi cywilnej, odstraszanie przed dalszymi zbrojnymi wtargnięciami oraz przywrócenie bezpiecznych szlaków nawigacyjnych.\n\nNiniejsza wiadomość stanowi formalne powiadomienie, że Organizacja Narodów Zjednoczonych rozpoczęła działania operacyjne w odpowiedzi na kontynuowane przez Państwa działania. Misja ma charakter obronny i stabilizacyjny. Każda próba utrudniania działań rozmieszczonych sił lub podjęcia z nimi walki spotka się jednak z odpowiedzią zgodną z obowiązującymi zasadami użycia siły.\n\nWzywa się Państwa do natychmiastowego wstrzymania wszelkich operacji ofensywnych i pełnej współpracy z przedstawicielami ONZ po ich przybyciu.\n\nOdpowiedzialność za obecną sytuację spoczywa na Państwa przywództwie. Organizacja Narodów Zjednoczonych podejmie działania w celu ochrony prawa międzynarodowego i życia ludności cywilnej."
jom_expedition.153.a: "Z poważaniem, Rada Bezpieczeństwa Organizacji Narodów Zjednoczonych"
 
