 expedition_bornholm: "Burgundaholmr"
 expedition_bornholm_desc: "Pośród głębin, hen na morzu \n jasna latarnia lśni, \n do domu Frederika prowadzi \n przez najciemniejsze dni. \n \n Folkvangr niczym widmo, \n dom minionych lat. \n Wioski już nie ma, \n lecz jej duch będzie trwał. \n \n Ufamy naszym żaglom \n i wioseł naszych sile, \n tniemy fale jak rzeźnik \n dzika jednym cięciem. \n \n O łaski Njorda błagamy, \n by figi skosztować i tymianek czuć, \n do przystani Burgundaholmru \n raz jeszcze bezpiecznie wrócić."
