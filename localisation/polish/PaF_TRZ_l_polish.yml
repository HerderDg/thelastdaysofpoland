 ##   NEWS Events   ##
 
unification.120.t: "[GetNewspaper]Warszawskie Państwo Podziemne jednoczy Okręg Stołeczny!"
unification.120.desc: "Mieszkańcy stolicy ostrożnie wychodzą ze swoich kryjówek, a wokół Warszawy nie rozbrzmiewają już strzały. Z uszkodzonych wieżowców unosi się dym, a znaczna część miasta leży w ruinach, lecz mimo to wciąż daje się wyczuć pewien optymizm. Dwukrotnie powstrzymany przez PiS, pozbawiony niemal wszystkiego mimo wielu lat służby i niegdyś walczący o utrzymanie zaledwie kilku ulic i skrzyżowań, Rafał Trzaskowski ponownie przejął kontrolę nad Warszawą. Pod jego rządami metropolia powoli wraca do życia, odradzając się z gruzów niczym feniks z popiołów i ponownie stając się gospodarczym gigantem. Watażkowie łakomie spoglądają teraz na miasto, pragnąc uszczknąć dla siebie część jego nowego dobrobytu. Stolica wciąż jest zagrożona i nie może pozwolić sobie na samozadowolenie, bo cały ten wysiłek może pójść na marne. Kto jednak lepiej niż Trzaskowski, z wieloletnim doświadczeniem w zarządzaniu niesfornym miastem, poprowadzi ją przez te trudne czasy?"
unification.120.a: "Jasny punkt pośród chaosu"

unificationsupreg.120.t: "[GetNewspaper]Warszawskie Państwo Podziemne jednoczy województwo mazowieckie"
unificationsupreg.120.desc: "Polska po Upadku stała się domem dla wszelkiego rodzaju ruchów politycznych i religijnych. Wszystkie one stoją w sprzeczności z naturalną ludzką potrzebą wolności i dobrobytu, jakie oferuje Warszawa rządzona przez prezydenta Trzaskowskiego. \nPo wyzwoleniu Warszawy legalny polski rząd prezydenta Trzaskowskiego przeszedł długą drogę, odbudowując potencjał gospodarczy, kulturalny i naukowy miasta. Potencjał ten wykorzystano do wyzwolenia reszty województwa mazowieckiego spod władzy bandytów, oligarchów, watażków, sekciarzy, faszystów i innych złoczyńców odrzucających demokrację, Konstytucję oraz prawa człowieka. \nWojewództwo mazowieckie jest już wyzwolone, ale wciąż potrzeba wiele pracy, by przywrócić w nim porządek konstytucyjny i rozszerzyć go na resztę kraju. Wojna domowa dobiega końca, a demokracja zdaje się zwyciężać."
unificationsupreg.120.a: "Ja jestem konstytucją!"

super.120.t: "[GetNewspaper]Warszawskie Państwo Podziemne jednoczy wschodnią Polskę"
super.120.desc: "Po długich walkach i negocjacjach legalny rząd prezydenta Trzaskowskiego wreszcie wyzwolił całą wschodnią Polskę. Światło liberalizmu rozświetla coraz większe obszary kraju. W ruinach i lasach wciąż ukrywają się niedobitki watażków, bandytów i innych faszystów, licząc na powrót złotej ery rozboju. Nie wygląda jednak na to, by miało do tego dojść, ponieważ prezydent Trzaskowski ogłosił kolejną mobilizację, by wyzwolić resztę kraju. \nWielu zachodnich analityków i graczy twierdzi, że to prezydent Warszawy ma największe szanse na zjednoczenie kraju. Czas pokaże, czyje zakłady okażą się trafne."
super.120.a: "Nadejdzie świt, zwycięstwo jest blisko!"

trz_news.1.t: "[GetNewspaper]Nowa zima stulecia"
trz_news.1.desc: "W Polsce zima zazwyczaj jest strasznie krótka. Za to jesień ciągnie się w nieskończoność. Ciemno, mokro i bez śniegu.\nNiestety - tym razem zima uderzyła z pełną mocą. Temperatura spadła tak, że woda zamarzła i widać parę podczas oddychania. Lód zmienił drogi w śmiercionośną szklankę. Przed upadkiem wystarczyłoby pojechać na wymianę opon - ale teraz nie jest to możliwe. Kierowcy są nie tylko zaskoczeni - ale często wręcz uziemieni.\nKlęska żywiołowa dotknęła nie tylko zmotoryzowanych. Przed upadkiem dałoby się kupić sto ton węgla za to, co teraz trzeba wyłożyć na jedną tonę. Całe rodziny palą meble, żeby ogrzać dom. A gdy ich zabraknie- to giną z odmrożeń i wyziębienia.\nJednakże, najgorsze jest co innego. Nie ma komu naprawiać wszechobecnych pękniętych rur. Miliony ludzi nie mają dostępu do świeżej wody. Najmocniej cierpią wielkie miasta, których mieszkańcy jedzą brudny śnieg, żeby przeżyć. A to tylko pogarsza ich sytuację - zapadają na ciężką biegunkę i umierają z odwodnienia."
trz_news.1.a: "Zzzzimnooo..."

