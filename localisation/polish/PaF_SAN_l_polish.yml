unification.98.t: "[GetNewspaper]Rewizjoniści sanacyjni jednoczą Podlasie"
unification.98.desc: "W północno-wschodniej Polsce wreszcie dokonał się przełom. Województwo podlaskie, które po Upadku pogrążyło się w wyjątkowo chaotycznej epoce watażków, znalazło się pod kontrolą jednego rządu. \"Nowa Sanacja\", opierająca się na zasadach rządów II Rzeczypospolitej z lat 1926-1939 oraz przekonaniach Józefa Piłsudskiego, pokonała wszystkich regionalnych rywali i bandytów, zyskując tym samym legitymację w oczach ludności. Choć ruch czerpie korzyści z nostalgii licznego grona swoich zwolenników oraz powagi narodowych bohaterów, których dziedzictwo podtrzymuje, podobnie jak jego poprzednik zmaga się z wewnętrznymi podziałami i izolacją dyplomatyczną. Przeszkody te mogą poważnie utrudnić próby całkowitego zjednoczenia kraju, lecz stosowane przez sanatorów metody, choć staroświeckie, nie muszą być skazane na porażkę - w końcu już kiedyś się sprawdziły. Prawdziwe pytanie brzmi: czy Polacy ponownie im zaufają?"
unification.98.a: "Wygląda na to, że stare nawyki trudno wykorzenić."

super.98.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.98.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.98.a: "Wreszcie zjednoczeni."

