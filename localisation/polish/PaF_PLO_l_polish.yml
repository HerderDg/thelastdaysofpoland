unification.171.t: "[GetNewspaper]Święta Inkwizycja jednoczy Północne Mazowsze!"
unification.171.desc: "Zradykalizowana pojawieniem się sekty mariawitów jako jednego z regionalnych graczy, ludność Płońska zaczęła domagać się szybkich i zdecydowanych działań przeciwko heretykom. Lokalny kaznodzieja, [FROM.GetLeader], zainspirowany licznymi historycznymi polowaniami na czarownice, odpowiedział na te żądania, przywracając Święte Oficjum Inkwizycji. Podobnie jak jego duchowy poprzednik, organizacja poświęcona jest wykorzenieniu wszelkich przejawów czarów i herezji w Polsce, a być może również poza jej granicami. Pomimo deklarowanego przywiązania do katolickiej ortodoksji organizacja nie posiada aprobaty papieża i została potępiona przez Dykasterię Nauki Wiary. Mimo to ich gorliwość pozostaje niezachwiana - zdołali już rozgromić znienawidzonych mariawitów, a rozpęd po tym zwycięstwie wykorzystali do podboju całego północnego Mazowsza. I choć na nowo zdobytych ziemiach nie brakuje grzeszników czekających na osąd, fanatycy nie zamierzają się zatrzymać, dopóki reszta kraju nie zostanie oczyszczona ze zła."
unification.171.a: "Nikt się nie spodziewał Polskiej Inkwizycji!"

