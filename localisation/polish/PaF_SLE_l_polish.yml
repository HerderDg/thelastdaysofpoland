SLE_TESCHIN.1.t: "Zakup Zaolzia?"
SLE_TESCHIN.1.desc: "Od czasów powojennych terytorium Zaolzia należało do naszego kraju - teraz wpadło w ręce Polaków. Udało im się obalić europejskie rządy ustanowione tam po  Czeskim Padzie. I jeśli nie zaczniemy działać - tereny te mogą zostać w ich rękach. Oczywiście nie możemy zbytnio zmusić naszych ludzi do kolejnego konfliktu granicznego z Polakami, a przynajmniej nie teraz. Może jeśli zaoferujemy im pieniądze, wsparcie wojskowe, trochę zaopatrzenia - możemy przehandlować nasze prawowite ziemie. Co prawda...odpowiedź może się nam nie spodobać. Ale musimy spróbować."
SLE_TESCHIN.1.a: "Powrót do statusu quo?"

SLE_TESCHIN.2.t: "Zakup Zaolzia - Czeska oferta"
SLE_TESCHIN.2.desc: "Udało nam się pozbyć większości europejsko-czeskich sił okupujących Śląsk Cieszyński. I dzięki temu...Zaolzie jest nasze! Ongiś była to ziemia pełna Polaków - wróciliśmy po raz kolejny w nasze rodzime strony. Niestety, współcześnie większość ludności stanowią Czesi, co może być lekkim problemem w zarządzaniu tymi ziemiami... Czeski rząd Petra Pavla wysłał nam propozycję odkupienia Zaolzia. Dałoby nam to zastrzyk gotówki, wsparcie wojskowe a nawet zaopatrzenie dla ludzi. Może powinniśmy to przemyśleć..."
SLE_TESCHIN.2.a: "Nie potrzebujemy tych problematycznych terenów"
SLE_TESCHIN.2.b: "To jest polska ziemia!"

