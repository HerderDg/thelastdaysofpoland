 #EVENTY ROZPADOWE
opolesiepali.1.t: "Opole ogłasza niepodległość!"
opolesiepali.1.desc: "Zaledwie kilka dni temu, Janusz Kowalski - jeden z byłych posłów Polski dawno minionej, postanowił działać w obliczu rozpadu Eurokomisariatu Śląskiego. Wraz ze swoimi bandytami zdecydował się uderzyć na Namslau, jedną z części EKS która była odizolowana od reszty głównych sił przez aktywne powstanie w Breslau. Dostaliśmy informacje o tym że jego siły poruszają się wzdłuż Odry i dotrą do Opola w przeciągu paru godzin\n\nMusimy działać natychmiastowo - przenosimy stolicę do Kreuzburga czy zostajemy w mieście?"
opolesiepali.1.a: "O nie..."
opolesiepali.1.b: "Uruchomić protokół OJCZYZNA!"

opolesiepali.2.t: "DURŚ ogłasza niepodległość!"
opolesiepali.2.desc: "Wodzisław się odłaczył"
opolesiepali.2.a: "Donnerwetter..."
opolesiepali.2.b: "NADSZEDŁ CZAS WOLNEGO ŚLĄSKA"

opolesiepali.3.t: "Imperium Lechitów ogłasza niepodległość!"
opolesiepali.3.desc: "sanjayę popierdoliło"
opolesiepali.3.a: "Waaas?"
opolesiepali.3.b: "O TY KURWA SKURWYSYNU WCALE MNIE NIE POPIERDOLIŁO"

opolesierozpala_news.1.t: "[GetNewspaper]Rzeź Opolska"
opolesierozpala_news.1.desc: "Podobnie jak wiele wcześniejszych przejawów masowego sprzeciwu wobec administracji Eurokomisariatów, zamieszki w Opolu zakończyły się tragicznie. Oficjalny bilans wydarzeń, które rozegrały się na Placu Wolności, wynosi 17 zabitych i 85 rannych, choć liczni świadkowie twierdzą, że podana liczba może być znacząco zaniżona. Być może największym szokiem dla mieszkańców miasta było jednak to, że ten pokaz bezmyślnej brutalności nie był dziełem obcych sił okupacyjnych, lecz ich własnych rodaków - co niektórzy określają mianem \"największego wybuchu przemocy między Polakami od czasu rozpadu kraju\". Rząd Bundeskanzlera Galli wydał od tego czasu oświadczenie potępiające przemoc po \"obu stronach\" oraz wzywające do \"pokoju i stabilności\", jednak wobec faktu, że miejscowe siły pokojowe zrzekają się wszelkiej odpowiedzialności, niemal pewne jest, że ich słowa pozostaną bez echa."
opolesierozpala_news.1.a: "Walka wyzwoleńcza ma swoich pierwszych męczenników."

