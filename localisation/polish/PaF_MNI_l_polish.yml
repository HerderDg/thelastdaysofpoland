 ##Characters##
POLITICS_RICHARD_GALLA_DESC: "Jako człowiek dwóch narodów Ryszard Galla mógł jedynie mieć nadzieję, że nigdy nie będzie musiał wybierać między nimi. Rzeczywistość nie zawsze bywa jednak tak łaskawa.\n\nŻycie Galli naznaczone jest wysiłkami na rzecz zapewnienia pokojowego współistnienia dwóch wrogich sobie narodów. Sam wywodzący się z niemieckiej rodziny, od przełomu wieków pełnił funkcję jedynego przedstawiciela mniejszości w polskim parlamencie. Przypadło mu niewdzięczne zadanie ocieplania jej wizerunku w oczach nieprzejednanie nacjonalistycznych Polaków, którzy wciąż nie wybaczyli zbrodni wyrządzonych im niemal sto lat wcześniej. Polityk nie dał się jednak zniechęcić i wytrwale pełnił swoją funkcję, z czasem stając się, w trakcie wieloletniej kadencji, jedną z najbardziej rozpoznawalnych twarzy nieustannie zmieniającego się parlamentu. Z każdymi kolejnymi wyborami setki posłów przychodziły i odchodziły, a on zdołał stać się stałym elementem krajowej polityki. Ponieważ jednak jego głos sam w sobie miał niewielkie znaczenie, często musiał ulegać woli jednej z głównych partii. Gdy KO coraz bardziej płaszczyła się przed von der Leyen, a wroga retoryka partii rządzącej wobec Niemiec sprawiała, że jego wyborcy przestawali czuć się bezpiecznie, stało się boleśnie jasne, że misja Galli staje się niemożliwa do zrealizowania. \n\nI tak, gdy niemieckie wojska przekroczyły granicę w Zgorzelcu, by przywrócić porządek w Polsce, przedstawiciel stanął przed trudnym wyborem. Nieustannie rozważał swoją sytuację i zastanawiał się, czy poprzeć inwazję, czy ją potępić. \n\nJego rozmyślania przerwał dźwięk telefonu - zaproszenie prosto od Donalda Tuska: \"dołącz do sił euro-niemieckich albo odmów i zaryzykuj, że spotka cię ten sam los co resztę kraju\". Zastraszony tą propozycją Galla ostatecznie ją przyjął, na zawsze wiążąc swój los z Europą.\n\nGdy inwazja zaczęła grzęznąć w miejscu, stało się aż nadto jasne, że rządzenie wymaga znacznie więcej, niż polityk zakładał. Uwięziony w roli przywódcy przytłaczającej, wrogo nastawionej polskiej większości, Galla nie ma w Opolu dnia bez zamieszek lub protestów. Gdyby sytuacja w Eurokomisariatach kiedykolwiek uległa dalszemu pogorszeniu, Galla miałby niewielkie szanse na utrzymanie kontroli nad swoim państwem. Jak dotąd utrzymuje się u władzy wyłącznie dzięki przychylności swoich zwierzchników, a jego marzenie o pokoju między Polakami i Niemcami legło w gruzach.\n§RCzy dokonał Pan właściwego wyboru, Herr Bundeskanzler?§!"
 ##Events##
niemcy.1.t: "List of Releasable Countries"
niemcy.1.desc: "1. Mandate of Opole - Paweł Kukiz (Populist Direct Democracy)\n2. Lechina Empire - Sanjaya/Janusz Bieszk/Paweł Szydłowski (LECHIA EMPIRE WILL RISE)\n3. DURŚ - Łukasz Kohut (Nothing bad will happen to the Silesian Republic, riiiiight?)\n\nDuring gameplay, some narrative events describing mentioned factions will occur, where You will have the option to select them as destinated faction (or remain as Oberschlesische Republik)"
niemcy.1.a: "This is just weird..."

unification.63.t: "[GetNewspaper]Mniejszość Niemiecka jednoczy Opolszczyznę!"
unification.63.desc: "Po upadku Eurokomisariatów, a tym samym rozpadzie Oberschlesische Republik, nikt nie spodziewał się, że kurcząca się mniejszość niemiecka zdoła odbudować swoje upadłe państwo w formie czegoś więcej niż dogorywającego państewka, a tym bardziej odzyskać kontrolę nad Opolszczyzną. Mimo to, po zniszczeniu ostatnich bastionów oporu konserwatywnych straży przednich i uwięzieniu lechickich watażków, Richard Galla zdołał ustabilizować swoją pozycję. Zaapelował do mieszkających w regionie Polaków, by „przywrócili normalność” i ostatecznie dopełnili \"syntezy polskiej i niemieckiej myśli\". \n\nNie wiadomo jeszcze, jak odrodzona Oppelnische Republik odnajdzie się w niestabilnych strukturach Unii Europejskiej, która już raz ją zawiodła, ani jak będą wyglądały jej stosunki z niemieckimi mocodawcami. Przede wszystkim jednak wciąż pozostaje najważniejsze pytanie, które nurtuje mieszkańców: jak długo mniejszość będzie w stanie rządzić większością?"
unification.63.a: "Gratulacje. Zobaczymy, jak długo przetrwają."

super.63.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.63.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.63.a: "Wreszcie zjednoczeni."

super_a.63.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_a.63.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
