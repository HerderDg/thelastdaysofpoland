unification.139.t: "[GetNewspaper]Agrariusze z Tarnowa jednoczą Małopolskę"
unification.139.desc: "Po serii intensywnych starć jeden watażka wyszedł zwycięsko z walk o dawne województwo małopolskie. Jest nim Władysław Kosiniak-Kamysz i jego chłopska republika z siedzibą w Tarnowie. Choć nazwa rządu może niektórym wydawać się skrajna, w rzeczywistości państwo jest spadkobiercą jednej z najbardziej mainstreamowych, umiarkowanych i powszechnie szanowanych partii na przedupadkowej scenie politycznej. Choć w poprzednich latach PSL popadło w względne zapomnienie, jego dziedzictwo nie tylko przetrwało, lecz wręcz rozbłysło jaśniej niż kiedykolwiek. Zwycięski Kosiniak-Kamysz obiecuje, że jego partia zrobi wszystko, by wiernie reprezentować mieszkańców wsi, zwłaszcza teraz, gdy wreszcie zyskała władzę pozwalającą realizować długo tłumione postulaty. Zanim jednak spełni te obietnice, musi najpierw podporządkować sobie południowych górali i wrogi rząd sąsiedniej Jury."
unification.139.a: "Nadszedł czas na PRAWDZIWĄ agrarną rewolucję!"

super.139.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.139.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.139.a: "Wreszcie zjednoczeni."

