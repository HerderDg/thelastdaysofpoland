dgr_narkom.17.t: "Śladami Gierka"
dgr_narkom.17.desc: "Konieczny stał przed siedzibą Międzynarodowego Funduszu Walutowego w Waszyngtonie. Miał jeden cel: uzyskać pożyczkę. Wszedł do budynku i udał się do recepcji.\n\n- Imię i nazwisko oraz cel wizyty? - zapytała recepcjonistka.\n- Wojciech Konieczny z Polskiej Republiki Radzieckiej. Przybywam, aby uzyskać pożyczkę dla mojego kraju - odpowiedział Konieczny.\n- W porządku. Proszę udać się do pokoju 213 na drugim piętrze.\n\nWojciech wsiadł do windy i wszedł do wskazanego pokoju.\n\n- Pan Wojciech, jak mniemam? - odezwał się mężczyzna siedzący w pomieszczeniu.\n- Zgadza się. Przybywam, aby uzyskać pożyczkę dla mojego kraju.\n- Wiem. Musi pan jednak zrozumieć, że nie udzielamy pożyczek każdemu, kto ma na nie ochotę. Musi pan spełnić określone warunki, które panu wyznaczymy.\n- Zrealizujemy każdy cel, jaki nam pan postawi. Może być pan tego pewien.\n- Wie pan, nie lubię pustych obietnic, więc będzie pan musiał to udowodnić. Cóż, pierwszym celem jest ponowne podbicie Tatr.\n- Zrobimy to, proszę pana.\n- Drugim jest dodanie jednego metra do wysokości Rysów, żeby osiągnęły ładną, okrągłą wartość.\n- Do zrobienia.\n- Trzecim jest przecięcie ich na pół i zbudowanie autostrady pomiędzy obiema połówkami.\n- Słucham?\n- Czy jest jakiś problem?\n- Nie, nie. Zrobimy to.\n- Doskonale. Czwartym zadaniem jest zbudowanie autostrady z Kaliningradu do Świnoujścia, w całości na plaży.\n- O co chodzi z tymi autostradami? Eee… to znaczy, oczywiście.\n- Dobrze. Ostatnim zadaniem jest kupienie mi luksusowej willi w Polsce.\n- W porządku, zrobimy to.\n- Naprawdę pan to zrobi?\n- Zrobimy to.\n- Doskonale. Lubię szczerość. Proszę więc chwilę poczekać, muszę tylko przynieść niezbędne dokumenty - powiedział mężczyzna, po czym wyszedł z pokoju. Po pięciu minutach wrócił z ogromnym stosem papierów. - Musi pan podpisać ten krótki formularz i odesłać go do nas. Wtedy udzielimy panu dużej pożyczki z niskim oprocentowaniem wynoszącym 131,64%. Umowa stoi?\n- Umowa stoi!\n- W takim razie proszę zabrać dokumenty i opuścić ten pokój. Mam jeszcze mnóstwo delegacji z krajów afrykańskich, którymi muszę się zająć - powiedział mężczyzna.\n\nWojciech opuścił budynek i wrócił do swojego samochodu.\n\n- Na lotnisko - rozkazał Wojciech.\n- Tak jest, szefie, ale mam jedno pytanie. Co pan tam robił? - zapytał kierowca.\n- A, negocjowałem kilka całkiem niezłych pożyczek. Oprocentowanie wynosi 131%, ale to drobiazg.\n- Co?! Jak my je spłacimy?"
dgr_narkom.17.a: "Kto powiedział, że musimy je spłacić?"

dgr_narkom.18.t: "To po prostu działa"
dgr_narkom.18.desc: "In one day, I have committed more thought crimes than in his entire lifetime.\n Yes, NATO is the ultimate nemesis of every right-thinking socialist patriot. Yes, their evil system and demonic men in black are a scourge upon the workers worldwide, turning lower classes into impotent lumpen-proles locked in struggle against cheap minorities from abroad. Yes, their war machines are what we were supposed to rise against. \n\n But at least said war machines fucking work! \n\n Standardised cartridge, interchangeable parts, workable, modular designs. If one was to create a chimera from British chassis, German gun, Korean engine, one could, given enough time, one did, even! Because, I don't know, the part manufacturers were extant and available? And made with remote attention to quality? \n\n Instead, I am working with rusted salvage of Warsaw Pact. A BTR here, a Romanian take on it there, a Soviet BMP-2 chassis, a M53/59 Praga auto-cannon, a Polish mortar from 1960s, and a Yugoslav transmission I didn't even know existed. My task? SOMEHOW, SOMEWHERE rig those parts to work with one another. It was bad enough during Cold War: At least back then, Poland could take Soviet T-55s and upgrade them into Merida variant. But now, the manufacturers of this junk are gone, the documentation thereof has gone the way of the Berlin wall, and I'm left with the rust and dust that's supposed to be turned to war machines yesterday! I'd need a cocksucking motherfucking year to even reverse engineer workable versions of all this! I'd need another one to design an uniform standard for their extremities. Yes, a year! Did I mention these piles of rust don't work in vacuum, let alone as part of a system? I'd need YET ANOTHER year to fix them. Do the pricks at politburo or whatever-the-fuck this place is called realize, that even if I already knew how to reverse engineer, fix, and make compatible, WITHOUT THE SHRED OF THE INDUSTRY AND KNOW-HOW THEY ORIGINATED FROM, I need TIME and HANDS to make it happen? SKILLED HANDS. In other words, ones that aren't shaking without an hourly designer drug injection! \n\n But no... everything, EVERY FUCKING PRACTICALITY, is supposed to be alleviated by Uncle Lenin's Invisible Hand of Five Year Cunt... I mean, Plan! And I'm supposed to be done in 28 days?! Whatever happened to worker's rights, I'd rather be back in Germany, running 14 hour strawberry shifts on undocumented wage! \n\n Anyway, I guess I do have a furnace and a cast. If I can just get a half-decent transmission axle from a car scrapyard, maybe the suspension on that BMP-2 can be fixed... With it I just have to replace the missing bolt with one from that other wreck... if all else fails I could even carve up a cast and get to smelting..."
dgr_narkom.18.a: "Those are the words of Paweł Sobczak, Chief Engineer of 'Factory' no. 6"

dgr_narkom.19.t: "Król na szachownicy"
dgr_narkom.19.desc: "Here Wojtek, Krzysztof, Henryk, Ryszard, and other Ryszard stood, each an example to any People's conscription system: pulling out the best flowers of youth between eighteen and twenty five years old, with physiques of school athletes. Or rather they would be, if Poland was still an unified nation. Today, the People's force would settle for anyone between sixteen and thirty five years old, with physiques that, let's just say, indicate they're not from the first world nations where sedentary, slow lifestyle and added, fast carbs, are a given. Commissar Lata, meanwhile, was tall, proud, and had a stance of a prosecutor poised to score a life sentence for his victim.\n\n \"Soldiers... stand tall and tell me proudly... what do you fight for?\" \n\n A simple sentence from a seemingly simple commissar. But even that was charged with unspeakable tension. He wanted a sincere and ideologically proper answer. The truthful answer was, money. Enough funds to make ends meet and have a decent life after service. But that reeks of bourgeois tendencies, doesn't it? Every man here knew that this answer was trouble. \n\n Family? Their loved ones? Ryszard and Henryk were estranged children: Wojtek and other Ryszard had wives and children, but they presumed them gone and living it out on refugee handouts in Western Europe, if they were lucky. Wojtek actually facilitated this: He was a true believer who was willing to let go of them while he fights for the cause of national communism. Krzysztof had no family at all: He confirmed them gone, reduced to cinders. \n\n The Party, then? Seemed the obvious answer. The apparatchiks always appreciated flattery. But this Lata... he didn't seem like a man who would settle for insincere flattery. Insincere, because even Wojtek had little warmth nor pride in the Party, for now. Maybe someday they'd rise to the occasion of building communism, he thought. Still, he stepped forward, ready to answer. \n\n \"Comrade Commissar, if I may: Picture this nation, our organisation, our People's Front, as a chessboard. You ask us who's representing the King in the chessboard, forgive my monarchist figure of speech.\" \n - Lata chuckled. The majority of even the most devoted apparatchiks weren't (yet?) denouncing chess as a reactionary ruse. - “Whom do we protect before and above all, whom the entire game revolves around, whose loss signals defeat. Without whom our future is no more. You find the King in what little families we have left, whichsoever orphanage we have, in every nook and cranny used by orphans to shelter.\n\n Lata raised his head in curiosity. This seemed like an answer very few yokels in the People's Army could muster. \n\n “This nation's children, Comrade Commissar. In future, they will be the proletariat. If cared for, they will be a healthy one, and the game will go on. Without them, we've already lost.\" \n\n Lata sighed somberly. He wasn't wrong. This was better answer than he could hope for. But the rest of the squadmates were merely looking at him like he was speaking a foreign language and referencing an eastern cartoon: Wojtek spoke for himself, and no one else. One true believer among cynics."
dgr_narkom.19.a: "If children are the king, then we're about to be checkmated."

dgr_narkom.20.t: "Ostatnie Czuwanie"
dgr_narkom.20.desc: "Bip. Bip. Bip.\n\nSzwej leżał na szpitalnym łóżku. Wokół niego stała cała masa ludzi. Kobiety, mężczyźni. Członkowie partii, generałowie. Nie rozpoznawał nikogo. Jedyną osobą, którą mgliście pamiętał, był Karoń, ale z każdą upływającą sekundą jego wspomnienia stawały się coraz bardziej ulotne.\n\nBip. Bip. Bip.\n\nDźwięki nie ustawały, a jednak Szwej nie miał nawet pojęcia, gdzie się znajduje. Czy to była siedziba partii? Czy szpital? A może niebo? Naprawdę nie wiedział.\n\nBip. Bip. Bip.\n\nZ wysiłkiem otworzył oczy i zdołał utrzymać je otwarte przez dłużej niż kilka sekund. Rozejrzał się, lecz nie potrafił odczytać wyrazu twarzy zgromadzonych. Czy byli szczęśliwi? Czy smutni? Czy już go opłakiwali? Naprawdę nie wiedział.\n\nBip. Bip. Bip.\n\nPonownie rozejrzał się dookoła. Wszyscy tam stali. Wszyscy na niego patrzyli. A jednak miał wrażenie, jakby tak naprawdę nikomu na nim nie zależało. Spróbował rozejrzeć się dokładniej, ale jego ciało było już zbyt słabe, by się poruszyć.\n\nBip. Bip. Bip.\n\nNagle przypomniał sobie, jak to wszystko się zaczęło. Upadek. Rewolucja. Wojny Dzielnicowe. Międzypowiatówka. Czarzasty. Antifa. To było tak wiele lat temu. A może wcale nie? Nie potrafił sobie przypomnieć. Zastanowił się, jaki jest dziś dzień. Nie pamiętał. Spróbował przypomnieć sobie własne imię. Nie pamiętał. Wszystko zaczęło zlewać się w jego umyśle w jedną całość.\n\nBip. Bip. Bip.\n\nZnów rozejrzał się dookoła. Wszędzie łzy i smutne twarze. A jednak nie potrafił pozbyć się uczucia, że jest zupełnie sam.\n\nBip. Bip. Bip.\n\nCzuł, jak jego serce bije coraz wolniej. Czuł, jak jego ciało staje się coraz słabsze. Czuł, jak słabnie również jego umysł. Jego myśli zaczęły zmierzać ku ostatnim rozważaniom. Czy był dobrym przywódcą? Czy Polska stanie się lepszym miejscem niż wcześniej? Czy kraj, który zbudował, przetrwa próbę czasu? Być może już niedługo pozna odpowiedź.\n\nBip. Bip. Bip.\n\nSygnały rozlegały się coraz rzadziej, a jego stan pogarszał się z każdą upływającą sekundą. Nie potrafił już zebrać nawet jednej myśli. W końcu przerwy między kolejnymi sygnałami stawały się coraz dłuższe, aż dźwięki zlały się w jeden nieprzerwany pisk."
dgr_narkom.20.a: "Zapadła cisza."

