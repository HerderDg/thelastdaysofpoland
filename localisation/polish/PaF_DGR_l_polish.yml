dgr_narkom.27.t: "Raport sytuacyjny"
dgr_narkom.27.desc: "Gabinet Szweja rzadko przyjmował gości. Tylko nieliczni mieli pozwolenie na wizytę, dlatego zazwyczaj panowała w nim cisza i spokój. Pewnego zwyczajnego dnia Karoń układała dokumenty na biurku Szweja, a ten podpisywał je swoją drżącą ręką. Jednak ten dzień nie był zwyczajny. Nagle usłyszeli pukanie do drzwi.\n\n- Sekretarzu Generalny, czy mogę wejść? - odezwał się nieznany głos, którego ani Szwej, ani Karoń nigdy wcześniej nie słyszeli.\n- Proszę wejść - odpowiedziała Karoń, zaciekawiona gościem.\n\nOsoba, która weszła do środka, miała na sobie mundur SB, odznakę SB oraz plakietkę z imieniem „Stefan”, wypisanym eleganckimi literami.\n\n- Sekretarzu Generalny, nadciąga zagrożenie. Wskutek naszych ustępstw nacjonaliści zdobyli znaczne wpływy. Jeśli pójdziemy na kolejne ustępstwa, mogą spróbować przeprowadzić przeciwko nam zamach stanu - powiedział funkcjonariusz SB, a jego głos był napięty i drżał. Nieustannie odwracał wzrok od Szweja, choć raz po raz zmuszał się, by ponownie spojrzeć mu w oczy.\n- Ja... yyy... rozumiem. Czy są jakieś... yyy... dodatkowe informacje na ten temat? - odpowiedział Szwej drżącym głosem.\n- Są, Sekretarzu Generalny. Ponieważ większość naszych generałów opowiada się po stronie frakcji Bargieły, sądzimy, że przyłączyliby się do zamachu stanu.\n- A co z cywilną częścią aparatu władzy? Czy Bargieła ma tam wpływy? - zapytała Karoń.\n- Ma, ale niezbyt duże. Większość stanowisk w partii i administracji zajmują nasi lojaliści.\n- To ulga. Czy wiemy coś jeszcze?\n- Nie mamy więcej informacji.\n- W porządku. Może pan odejść - powiedziała Karoń, odczuwając narastający niepokój.\n- Tak jest, Towarzyszko Wicesekretarz - odparł funkcjonariusz SB i szybko opuścił pokój.\n\nTymczasem Karoń pogrążyła się w myślach.\n\n- Ech, ci nacjonaliści. Zawsze muszą sprawiać problemy. Przyjdzie czas, by się nimi zająć, ale na pewno nie teraz. Dalsze ich rozdrażnianie doprowadzi do zamachu stanu, a tego nie chcę - pomyślała Karoń.\n- Sekretarzu Generalny, co powinniśmy zrobić? - zapytała.\n- Co powinniśmy zrobić? W jakiej sprawie? - odpowiedział Szwej.\n- W sprawie nacjonalistów.\n- A co z nimi?\n- Planują zamach stanu.\n- Co?! Od kiedy?\n- Przecież właśnie powiedział nam o tym funkcjonariusz!\n- Jaki funkcjonariusz?\n- Wie pan co? Nieważne. Proszę po prostu podpisać te dokumenty.\n- Dobrze - odpowiedział Szwej i wrócił do pracy.\n- Szwej raczej niewiele mi w tej sprawie pomoże, ale moi partyjni towarzysze z pewnością tak - pomyślała Karoń."
dgr_narkom.27.a: "Czas trochę podzwonić."

dgr_narkom.28.t: "Wewnętrzne zagrożenie"
dgr_narkom.28.desc: "W gabinecie Szweja panowała jak zwykle cisza. Szwej podpisywał dokumenty, a Karoń pomagała mu utrzymać pióro w dłoni, korzystając z przerwy od mediowania między członkami partii. Nagle usłyszeli otwierające się drzwi, a do pokoju wbiegł funkcjonariusz SB.\n\n- Nacjonaliści! Rozpoczęli przygotowania do zamachu stanu! Z wielu zbrojowni zgłoszono kradzież broni, a niektórzy generałowie zaczęli nie wykonywać naszych rozkazów! Nasi informatorzy ustalili, że obecnie zmierzają do Dąbrowy Górniczej! - powiedział funkcjonariusz głosem pełnym powagi i napięcia.\n- Eee... jaki zamach stanu? - zapytał Szwej, wyraźnie nieświadomy sytuacji. - Jeszcze kilka dni temu byli lojalni. Co się teraz stało?\n- Mówiłem wam, że zdobyli już znaczne wpływy! Teraz je wykorzystują!\n- Eee... kiedy?\n- Którzy generałowie popierają zamach stanu? - przerwała Karoń, starając się zachować spokój. W rzeczywistości jej umysł krzyczał, by natychmiast podjęła działania.\n- Z tego, co wiemy, Szarejko, Abrahamowicz, Czyżewski, Werner i Bargieła. Czyli praktycznie wszyscy nasi generałowie.\n- Rozumiem... W porządku, zajmiemy się tym. Proszę teraz wrócić do swojego gabinetu i polecić im znalezienie wszystkich potencjalnych sympatyków nacjonalistów - powiedziała Karoń.\n- Tak jest, proszę pani - odpowiedział funkcjonariusz i szybko opuścił pokój.\n\nKaroń zastanawiała się nad sytuacją. Nie było wiele czasu na działanie. Musiała albo powstrzymać nacjonalistów, albo stanąć przed sądem jako zdrajczyni Polski. Nie było żadnej drogi pośredniej.\n\n- Eee... co się właśnie stało? - zapytał Szwej, wyraźnie zdezorientowany.\n- Szykuje się zamach stanu! - powiedziała Karoń, wyglądając, jakby była bliska paniki.\n- Co? Jaki zamach stanu?\n- Wie pan co? Proszę zostawić to mnie. Niech pan wróci do wypełniania dokumentów.\n- Eee... dobrze? - odpowiedział Szwej i ponownie zabrał się za podpisywanie papierów.\n\nKaroń ruszyła w stronę Rady Partyjnej. Już z daleka słyszała krzyki członków partii, ponieważ budynek znajdował się niedaleko gabinetu Szweja. Gdy tylko weszła do środka, cała rada przerwała rozmowy i zwróciła na nią uwagę.\n\n- Towarzysze! - zaczęła. - Dziś stajemy w obliczu ogromnego zagrożenia. Armia postanowiła przeprowadzić przeciwko nam zamach stanu, a my, jako obrońcy klasy robotniczej, musimy zmiażdżyć ją żelazną pięścią ludu! Dlatego chcę, abyście przedstawili pomysły na to, jak ich powstrzymać.\n- Wyślijmy armię, żeby ich spacyfikowała, tak jak zawsze! - powiedział jeden z członków rady.\n- Jaką armię? - zapytała Karoń.\n- Każmy im podpisać formularze, jeśli chcą przeprowadzić przeciwko nam zamach stanu! - zaproponował ktoś inny.\n- Nie! Czy ja mam w partii samych idiotów?! - odparła Karoń.\n- Wywołajmy sztuczne niedobory paliwa, żeby ich spowolnić! - rzucił kolejny członek rady.\n- Nie! Zaraz, nie, to właściwie dobry pomysł! - powiedziała Karoń."
dgr_narkom.28.a: "- Teraz, musimy to tylko zrobić w praktyce."

dgr_narkom.29.t: "Przekroczenie Rubikonu"
dgr_narkom.29.desc: "Bargieła siedział w tajnym bunkrze ukrytym w jednym z licznych lasów Zagłębia, otoczony przez swoich najbliższych sojuszników. Wszyscy spoglądali na siebie nawzajem. Szarejko. Abrahamowicz. W ich umysłach kłębiły się dwa uczucia: niepewność i gniew. Bargieła rozejrzał się po zgromadzonych. Werner. Czyżewski. Nie potrafił odczytać wyrazu ich twarzy, ale było jasne, że nie byli zadowoleni. W końcu postanowił jako pierwszy zabrać głos.\n\n- Przyjaciele. Zebraliśmy się tutaj z jednego powodu i myślę, że wszyscy doskonale wiedzą, o co chodzi - powiedział.\n- Komuniści. To przez nich tu jesteśmy - odpowiedzieli wszyscy jednocześnie.\n- Zgadza się. Komuniści zdołali doprowadzić nas na skraj politycznej marginalizacji, ale nie pozwolimy, by tak pozostało. Musimy odzyskać to, co jest i co powinno być nasze.\n- Tak! Śmierć im!\n- Wciąż mamy poparcie większości wojska. Nasze macki sięgają również części aparatu biurokratycznego. Obalenie Szweja nie powinno sprawić nam większych problemów, ale co z pozostałymi watażkami? W końcu nie jesteśmy siłą nie do pokonania. Po wojnie domowej możemy być zbyt osłabieni, by walczyć dalej, a wtedy inne niepożądane siły zamienią nasz kraj z powrotem w to, z czego powstał, albo obrócą go w popiół.\n- Nie powinniśmy się ich obawiać! Jesteśmy silni, a oni słabi! Nawet po takiej wojnie domowej pozostaniemy wystarczająco potężni, by rozprawić się z pozostałymi! - powiedział z entuzjazmem Abrahamowicz.\n- Czy na pewno? Przecież, jak sam Bargieła zauważył, nie jesteśmy siłą nie do pokonania. Wystarczy chwila słabości, a nasze marzenia obrócą się w popiół - odpowiedział Czyżewski.\n- Jak słusznie zauważył Czyżewski, musimy zachować ostrożność. Komuniści wciąż kontrolują znaczną część armii, zwłaszcza Czerwone Brygady - stwierdził Werner.\n- Owszem, mogą mieć wiele dywizji, ale pamiętajcie, że nasze oddziały są znacznie bardziej profesjonalne i lepiej wyszkolone! Jedna nasza dywizja rozgromiłaby dziesięć ich dywizji! - powiedział Szarejko.\n- Jak powiedział Szarejko, jesteśmy silni! Po prostu wyrżnijmy ich wszystkich co do jednego! - rzucił Abrahamowicz.\n- Nie możemy po prostu wyrżnąć ich wszystkich. Wciąż potrzebujemy legitymacji do sprawowania władzy, a zabijanie większej liczby ludzi, niż to konieczne, nam nie pomoże - powiedział Werner, jak zwykle kierując się pragmatyzmem.\n- To prawda. Nawet jeśli dojdzie do wojny domowej, musimy pokazać, że jesteśmy lepsi od komunistów. Armia, niezależnie od swojej liczebności, nie może zwyciężyć bez poparcia społeczeństwa.\n- Zabijanie zdrajców nas nie osłabi, a jedynie wzmocni! - odparł Abrahamowicz.\n- Ale pamiętajcie, że-\n- Dosyć! Kłótnie przyniosą korzyści jedynie komunistom - przerwał Bargieła. - Musimy pozostać zjednoczeni, jeśli chcemy odnieść sukces. Do tych kwestii wrócimy jednak podczas wojny. Na razie musimy odpowiedzieć sobie tylko na jedno pytanie: czy ją rozpętujemy?\n- Powinniśmy! - odpowiedzieli Abrahamowicz i Szarejko. Pozostali siedzieli po drugiej stronie stołu w milczeniu.\n- A zatem nadszedł czas - powiedział Bargieła, po czym chwycił leżący obok niego stary telefon.\n- Halo, generale Skierski?\n- Tak? - odezwał się głos w słuchawce.\n- Proszę wysłać swoje oddziały do Dąbrowy Górniczej, a konkretnie pod Pałac Kultury.\n- Już się robi! - odpowiedział rozmówca i odłożył słuchawkę.\n\nBargieła wiedział, że tego, co właśnie zrobił, nie da się już cofnąć. Albo zwycięży, albo poniesie klęskę. Mimo to był zdeterminowany."
dgr_narkom.29.a: "A jedynym sposobem, by powstrzymać zdeterminowanego człowieka, jest go zabicie."

dgr_narkom.30.t: "Koniec Buntu"
dgr_narkom.30.desc: "Gabinet Szweja rzadko kiedy miewał gości, ale odkąd nacjonaliści rozpoczęli swój zamach stanu, nic już nie było takie samo. Teraz przed jego drzwiami ustawiały się długie kolejki urzędników przynoszących nowe raporty i dokumenty. Jednak z upływem dni ich liczba systematycznie malała, aż po pewnym czasie do gabinetu docierało już tylko kilka raportów, z których większość donosiła o zwycięstwach nad nacjonalistami. Pewnego dnia Szwej i Karoń usłyszeli pukanie.\n\n— Proszę wejść — powiedziała Karoń.\n\nDo pomieszczenia wszedł ten sam oficer co wiele dni wcześniej, z tą różnicą, że teraz wyglądał jak wrak człowieka. Na jego identyfikatorze wciąż widniało imię „Stefan”, tyle że tym razem zapisano je w pośpiechu.\n\n— Nacjonaliści... W końcu zrezygnowali z próby obalenia rządu. Wojsko w dużej mierze ponownie znalazło się pod naszą kontrolą, a frakcja Bargieły w znacznej mierze zaprzestała sprzeciwiania się naszemu rządowi — powiedział.\n\nKaroń odetchnęła z wyraźną ulgą, podczas gdy Szwej wyglądał na zdezorientowanego.\n— Mieliśmy do czynienia z próbą zamachu stanu? Dlaczego mnie nie poinformowano? — zapytał.\n— Mieliśmy! Mówiłam ci o tym tyle razy, że straciłam rachubę! — odparła Karoń.\n— Czy naprawdę przez cały ten czas próba zamachu stanu odbywała się tuż pod naszym nosem?\n— Nie, przecież o niej wiedzieliśmy!\n— To dlaczego mnie nie poinformowano?\n— Nieważne... Po prostu świętujmy fakt, że ich pokonaliśmy. Gdyby nam się nie udało, mielibyśmy teraz mnóstwo problemów... Cieszę się, że to już koniec i że ludzie pracy mogą wreszcie odetchnąć ze spokojem, wiedząc, że u ich drzwi nie czeka armia pragnąca ich sobie podporządkować.\n— Istotnie.\n\nAgent SB opuścił pomieszczenie, pozostawiając samych Karoń i Szweja, z których każde pogrążyło się we własnych myślach. Szwej zastanawiał się nad próbą zamachu stanu i przyczynami, które do niej doprowadziły. Karoń miała znacznie większe ambicje.\n\n— Ci nacjonaliści, wciąż knują, jak nas zabić i odebrać mi władzę... Przynajmniej wkrótce się ich pozbędziemy. Nie możemy pozwolić, by cokolwiek stanęło na drodze do objęcia przeze mnie władzy. Jestem tu po to, by rządzić, a nie podejmować wszystkie decyzje, podczas gdy cała chwała przypada Szwejowi. Jednak... — pomyślała, lecz nagle jej rozważania przerwał głos Szweja.\n— Myślisz, że nacjonaliści ponowią taką próbę? — zapytał ją.\n— Ponowią, ale znów ich pokonamy. I jeszcze raz. I jeszcze raz, aż nie zostanie ani jeden.\n— Cóż, co powinniśmy zatem zrobić?\n— Powinniśmy po prostu kontynuować nasze plany debargielizacji. Po odpowiednio długim czasie odniesiemy zwycięstwo, a oni trafią na śmietnik historii, gdzie już pozostaną.\n— Skoro tak mówisz..."
dgr_narkom.30.a: "- Tak mówię, i tak się stanie. - powiedziała."

dgr_narkom.31.t: "Idzie nowe"
dgr_narkom.31.desc: "Dni po śmierci Szweja minęły szybko — niemal zdecydowanie zbyt szybko. Pogrzeb, przemówienia na Biurze Politycznym — wszystko to przemknęło w zawrotnym tempie. Teraz Karoń stała przed ogromnym tłumem. Niemal wszystkie spojrzenia były skierowane na nią. Wygłaszała już wcześniej podobne przemówienia, ale nigdy przed tak liczną publicznością. Czuła niepokój. Czuła napięcie. Miała wrażenie, że jeśli popełni choćby jeden błąd, świat legnie w gruzach. Ponownie spojrzała na tłum. Zobaczyła transparenty z napisami „Chwała Partii”, „Niech żyje nowy sekretarz generalny!” i „Niech żyje państwo radzieckie!”. Mimo to nie uspokoiło jej to nawet w najmniejszym stopniu.\n\n— Beata, dasz radę! — pomyślała.\n\nW końcu zwróciła się do tłumu. Widziała spojrzenia zgromadzonych. W niektórych oczach dostrzegała nadzieję. W innych niepewność. Niektórzy wciąż opłakiwali śmierć Szweja. Sama czuła to wszystko.\n\n— Towarzysze — zaczęła. Wszystkie pozostałe spojrzenia zwróciły się ku niej.\n— Kilka miesięcy temu nasz ukochany sekretarz generalny zmarł ze starości. Przeżył owocne życie, prowadząc nasz kraj od upadku do pozycji supermocarstwa, które zajmuje dzisiaj. Czy był doskonały? Nie, ale z pewnością nie był złym człowiekiem. Zawsze stawiał kraj na pierwszym miejscu. To ktoś, na kim będziemy się wzorować w przyszłości — powiedziała.\n\nCzęść tłumu wzniosła okrzyki radości. Inni westchnęli z rozczarowaniem.\n\n— Choć ogólnie rzecz biorąc, był wielkim przywódcą, popełnił też kilka błędów, które zamierzam naprawić podczas mojej kadencji na stanowisku nowej sekretarz generalnej — powiedziała. Niektórzy z tłumu byli zaskoczeni, inni już się tego spodziewali.\n— Zgadza się, Biuro Polityczne wybrało mnie, abym poprowadziła nasz wspaniały kraj ku przyszłości. Zapewniam was, że zrobię wszystko, co w mojej mocy, by uczynić nasz kraj lepszym miejscem dla nas wszystkich — powiedziała.\n\nNiektórzy zaczęli wiwatować, podczas gdy inni patrzyli na nią z niepewnością.\n\n— Będę nadal wiernie służyć narodowi polskiemu, tak jak czyniłam to do tej pory. Dziękuję wam wszystkim za okazane mi wsparcie i dopilnuję, by wam się za nie odwdzięczyć. Ślubuję wierność wyłącznie Partii i Polsce — zakończyła.\n\nCzęść zgromadzonych zaczęła klaskać, ale nie wszyscy dali się przekonać. Tymczasem Karoń pomachała tłumowi, po czym wycofała się z balkonu Zagłębiowskiego Pałacu Kultury. Ruszyła korytarzem, wciąż rozmyślając o swoim przemówieniu. Czy było złe? Czy było dobre? A może było najlepszym przemówieniem w historii ludzkości? Nie miało to znaczenia. Liczyło się tylko to, że teraz to ona sprawowała władzę."
dgr_narkom.31.a: "I użyje tego tak bardzo, jak może."

dgr_narkom.32.t: "Nowa twarz u steru"
dgr_narkom.32.desc: "17:30. Posiedzenie Rady Partyjnej dobiegło końca. Karoń siedziała w swoim gabinecie, czekając na przybycie Dobrzynieckiej. Początkowo Dobrzyniecka nie była związana z Frontem Ludowym, ale po czystce, w wyniku której usunięto Bargiełę — prawdopodobnie jedynego kompetentnego ministra wojskowości w Dąbrowie — należało obsadzić to stanowisko. Nagle Karoń usłyszała kroki tuż za drzwiami gabinetu, a następnie pukanie.\n\n— Proszę wejść — powiedziała.\n\nDo środka weszła kobieta ubrana w mundur wojskowy pokryty odznakami.\n\n— Pani Dobrzyniecka, jak mniemam? — zapytała Karoń.\n— Zgadza się. A pani to...? — odpowiedziała Dobrzyniecka.\n— Beata Karoń, zastępczyni sekretarza generalnego. Miło mi panią poznać.\n— Wzajemnie. Ale przejdźmy do rzeczy. Dlaczego pani mnie wezwała?\n— Wie pani, co stało się z naszym poprzednim ministrem wojskowości, Aleksandrem Bargiełą?\n— Co się z nim stało?\n— Został usunięty w ramach czystki za próbę obalenia naszego rządu.\n— I?\n— I musimy obsadzić to stanowisko, ale nasi generałowie nie grzeszą rozumem. Dlatego chciałabym powierzyć je pani. Przyjmuje pani tę propozycję?\n— Chwileczkę, naprawdę? Oczywiście!\n— Doskonale. W takim razie pokażę pani gabinet — powiedziała Karoń, wstając z krzesła.\n\nObie kobiety wyszły z pomieszczenia i ruszyły korytarzem. Dobrzyniecka pogrążyła się w myślach.\n\n— Gwardia Ludowa mogła ponieść porażkę, ale dopilnuję, by ten kraj nie zawiódł! Będę walczyć dzielnie na froncie i poprowadzę swoje oddziały do zwycięstwa, aż kapitalizm zostanie zniszczony! — pomyślała.\n— Jesteśmy na miejscu. Proszę się rozejrzeć po swoim nowym gabinecie — powiedziała Karoń.\n\nDobrzyniecka otworzyła drzwi i zapaliła światło. Rozejrzała się po pomieszczeniu. Na ścianach wisiały kosztowne obrazy przedstawiające bitwy oraz plakaty propagandowe. Było tam również okno. Na samym środku stało biurko, na którym piętrzył się ogromny stos dokumentów, a obok leżało pióro. W pomieszczeniu znajdował się też stary komputer, ale było jasne, że nikt nie używał go od lat dziewięćdziesiątych.\n\n— Wygląda nieźle, ale kiedy będę mogła ruszyć na front? — zapytała Dobrzyniecka.\n— Na front? Najpierw musi pani podpisać te pięćset dokumentów. Potem będzie pani mogła dowodzić armią — ale stąd — odparła Karoń.\n— Co?! Ale ja chciałam dzielnie walczyć z kapitalistami, a nie podpisywać dokumenty!\n— Trudno. Po podpisaniu tych dokumentów proszę dostarczyć je do mojego gabinetu. Następnie wyślę je chińskim producentom uzbrojenia, żebyśmy wreszcie mogli zdobyć coś nowocześniejszego niż broń z czasów drugiej wojny światowej.\n— Ale...\n— Żadnego „ale”. Proszę teraz podpisać te dokumenty. Będę czekać u siebie.\n— Ech... — mruknęła pod nosem Dobrzyniecka."
dgr_narkom.32.a: "- Powinnam była zostać w Donbasie."
 
dgr.1001.t: "Efekty siódmej pięciolatki"
dgr.1001.desc: "With great pride and unwavering revolutionary spirit, we mark the triumphant conclusion of the 7th Five-Year Plan in our country - the beating industrial and socialist heart of Poland.\n\n1. Within the first 24 months, 17 major facilities were nationalised, over 21,300 workers were transferred into state syndicates. Private ownership in core sectors dropped to below 2.1%.\n2. 312 km of paved roads laid - notably the ZP-7 arterial route linking Żarki, Łazy, and Sławków. 11 new logistics hubs were constructed (e.g., Katowice Steelworks Node), and 28 bridges were rebuilt or reinforced. 46% increase in public freight capacity reported across the region.\n3. 14,800 hectares consolidated across the gminas of Kroczyce, Klucze, and Siewierz. NGR Rudniki now delivers 12,000 tonnes of grain yearly. Tractor density increased to 1 per 21 ha. Over 3,200 farmers integrated into state employment structures.\n4. 12 schools opened (e.g., People's Technical School No. 3 in Olkusz), 5 correctional-labor centers built (largest in Jaworzno - Jeziorki), 8 polyclinics operational by mid-plan, 4 new factories employing over 870 workers.\n5. Only 19% of the targeted 18,000 prefab units were completed. Major sites in Czeladź and Sosnowiec left unfinished due to material shortages and \"construction miscoordination\".\n6. Pilot attempts in collectivisation of northern counties of our country met resistance. Mass withdrawals, tool thefts, and rural non-compliance halted the program at stage 1B.\n\nDespite difficulties, 78% of plan goals were achieved, and productivity levels were noticeably raised in overall 146%! This may be good for any other socialist country, but it's not good enough for the National People's Republic! We need to pump those numbers up!"
dgr.1001.a: "Jeszcze wyżej musisz!"

dgr.1006.t: "Efekty ósmej pięciolatki"
dgr.1006.desc: "With great pride and unwavering revolutionary spirit, we mark the triumphant conclusion of the 8th Five-Year Plan in our country - the beating industrial and socialist heart of Poland.\n\n1. Within the first 24 months, another 35 major facilities were nationalised (mostly from reclaimed territories), over 44,670 workers were transferred into state syndicates. Private ownership in core sectors dropped to below 0.1%.\n2. 910 km of paved roads laid - notably the Edward Gierek's Motorway arterial route linking Dąbrowa Górnicza and Łódź. 11 logistics hubs were expanded (e.g., Sławków Euroterminal Node), another 22 bridges were rebuilt or reinforced. Only 13% increase in public freight capacity reported across the region compared to the last plan.\n3. 34,800 hectares consolidated across the Łódź voivodeship. NGR Łowicz is now pioneers in farm production, delivering 27,000 tonnes of grain yearly. Tractor density increased to 1 per 16 ha. Over 19,200 farms were redesignated for military use.\n4. 22 new primary schools opened, 54 correctional-labor centers built, 16 polyclinics operational by mid-plan, 43 new factories employing over 27,000 workers.\n5. 99% of the prefab units designated for deletion were transferred to military. Garrison cities are operating in full coordination with local authorities with only over 234 incidents per month.\n6. Collectivisation of the country was switched to military possesion of the land fueling the needs of ever-growing National People's Army\n\nWith astonishing results, 156% of plan goals were achieved, and productivity levels were noticeably raised in overall 216%!"
dgr.1006.a: "Zmyśliłeś te liczby, prawda?"
 
dgr.1002.t: "Problemy z mieszkalnictwem"
dgr.1002.desc: "Once again, the noble cause of the people has been struck by the shadowy hand of reaction. Our socialist housing initiative - a shining example of equality and progress - was forged in the fires of solidarity. We built homes not for profit, but for dignity. We offered shelter not as commodity, but as a right. And yet, as always, the enemies of the people lurked in the rubble of the old world, waiting. These economic vultures - landlords, speculators, and profit-chasers - could not bear to see roofs given freely to workers. They whispered sabotage into the very foundation of our plans. Where we laid bricks, they planted lies. Where we regulated, they hoarded. When the state fixed rent to fair levels, they cried \"collapse\" - and then ensured it by withdrawing labor, siphoning materials, and corrupting supply chains.\n\nIt was not the wisdom of our planning that failed, but the treachery of those who refuse to accept a world without exploitation. The recent turmoil in the housing market is no accident. It is a deliberate campaign to destabilize the People's Republic. But let this be known: we will not yield. The Party and the State will respond. Profiteers will face the full force of revolutionary justice. The black market of shelter will be broken. New housing projects, under tighter supervision and with deeper ideological training for all workers involved, will rise stronger and purer than before. Let no comrade be misled by the lies of the class enemy! The crisis is not of socialism  -  it is of sabotage! And sabotage will not be tolerated!"
dgr.1002.a: "Those greedy peddlers!"

dgr.1003.t: "Kolektywizacja wstrzymana"
dgr.1003.desc: "===========Issued by the Department of Agrarian Unity===========\n\nThe road to progress is never without its obstacles. As the People's Republic boldly undertook the historic transformation of private land into collective prosperity, dark forces emerged from the countryside - forces still chained to the egoism of property and the poison of petty ownership. The collectivisation initiative, designed to lift the peasantry from the mud of feudal habit and into the light of socialist modernity, was met not with gratitude, but with resistance. Some villagers - stirred by reactionary whispers and poisoned traditions - refused to till for the common good. Tractors were sabotaged. Officials were obstructed. Grain was hoarded, tools hidden, and records falsified.\n\nThis is not struggle - this is sabotage. Let us be clear: the principle of collectivisation remains untouched, sacred, and eternal. It is the only true path toward an agrarian society free of exploitation. However, in the spirit of dialectical flexibility and temporary tactical retreat, the Central Committee has resolved to pause the implementation of full collectivisation in certain districts.\n\nThis is not a surrender, but a strategic recalibration.\n\nThe people must be re-educated. Trust must be rebuilt. The countryside must be made ready - not only in tools, but in spirit. In time, the hesitant will understand what their obstinance delayed: prosperity, equality, and mechanised abundance for all. Let the exploiters and their foreign-backed lies take no comfort. This retreat is temporary. The revolution never stops - it only changes its stride. Kolektywizacja delayed is not collectivisation denied. And the land, as always, belongs to the people."
dgr.1003.a: "Rozwieście to wszędzie!"

dgr.1004.t: "Strike!"
dgr.1004.desc: "It seems that our reforms are not really that popular throughout the working class...well. It wouldn't be the first time in history. Workers from Zawiercie and Myszków have gone on strike. While it doesn't threaten our industrial position, it's a nuisance that we have to fix. Let's talk with them first, Politburo is sure that we can come to an arrangement suitable for both sides. And if not...let's hope it doesn't spread."
dgr.1004.a: "Not again..."

dgr_debts.1.t: "Our request for a loan was accepted!"
dgr_debts.1.desc: "Our request for a loan was accepted! The other country will send us the money they promised, saying they want us to repay as soon as possible, which will, of course, not happen. It turns out bringing 10 liters of vodka really does wonders for diplomacy."
dgr_debts.1.a: "Glory to Gierek and his wisdom!"

dgr_debts.2.t: "Our request for a loan was declined!"
dgr_debts.2.desc: "Our request for a loan was rejected! Unfortunately, one of the foreign diplomats wasn't drunk enough and managed to see through the deal, and decided to not give us a loan. We should have brought more vodka..."
dgr_debts.2.a: "We can always try again."

dgr_narkom.1000.t: "Nationalist Integrity Falls!"
dgr_narkom.1000.desc: "Thanks to our efforts, the nationalist opposition is not as unified as it was before. Both the military and the bureaucracy have been partially cleansed of subversives. This is a great triumph for us!"
dgr_narkom.1000.a: "Great!"

unification.14.t: "[GetNewspaper]Dąbrowa Górnicza jednoczy Zagłębie i Jurę!"
unification.14.desc: "W nieoczekiwanym zwrocie wydarzeń, niewielka dyktatura z Dąbrowy Górniczej zdołała podbić wszelkie otaczające ją ziemie. Okrążeni przez silniejszych wrogów, utrzymali się na powierzchni, a dzięki potędze przemysłowej Huty Katowice zdołali ostatecznie przezwyciężyć wrogów, również tych w Jurze.\nDziwna kombinacja komunizmu i nacjonalizmu okazuje się być bardziej stabilna i efektywna niż można przewidywać. Relacje pomiędzy tymi dwoma segmentami nie są do końca jasne, ale patrząc na ich morale - raczej na szybkie zakończenie tego diabelskiej sojuszu nie ma co liczyć.\nLudowy Front Zagłębia (jak brzmi ich oficjalna nazwa) teraz dysponuje nieposkromionym żywiołem przemysłu Zagłębiowskiego. Wydawać by się mogło, że ich następnym celem będzie Śląsk, ale nieoficjalne źródła mówią o tym, że ich oczy zwrócone są na Małopolskę."
unification.14.a: "BŁYSKAWICA JEST CZERWONA!"

unificationreg.14.t: "[GetNewspaper]Narodowa Armia Ludowa jednoczy Małopolskę"
unificationreg.14.desc: "Małopolska wybrała socjalizm ponad śmierć, chociaż ta decyzja nie była do końca ani ich, ani zgodna, gdyż nadal wokół Wawelu i w dzikich odstępach Tatr słychać strzały. Pomimo tego, Narodowo-Bolszewickie siły triumfują wszędzie od Przemszy po Dunajec, zdeterminowani by wyzwolić każdy zakład pracy (a w szczególności te w sektorze ciężkiego przemysłu). Ogień znowu bucha z rozżarzonych pieców hutniczych, będąc odbiciem ich ognistego ducha komunistycznego, wspomaganego przez retorykę nacjonalistyczną.\n\nAczkolwiek, pojawiają się doniesienia o narastających wewnętrznych dyskursach politycznych, jak gdyby nie wszyscy komuniści chcieli podążać krwawym dziedzictwem Mieczysława Moczara, i nie wszyscy nacjonaliści wyznają politykę Bolesława Piaseckiego, nadal czując niesmak współpracy z ideologią która zniewoliła ich kraj na prawie 50 lat. Masowe wydatki na propagandę pozwalają tymczasowo uspokoić obywateli, lecz pierwsze pęknięcia zaczynają się już pojawiać w tym wielkim hybrydowym projekcie."
unificationreg.14.a: "MŁOT WYKUJE ŻELAZNY MIECZ!"

unificationsupreg.14.t: "[GetNewspaper]Narodowa Armia Ludowa jednoczy Galicję"
unificationsupreg.14.desc: "W czasach kryzysu, prowizoryczne państwa często nie wytrzymują próby czasu, a tym bardziej okraszone tak niecodzienną mieszanką ideologiczną jak Narodowa Armia Ludowa, która jednak przezwyciężyła wszelkie wewnętrzne podziały. Partyjne rozwiązanie ogłaszane jako 'wielkie odświeżenie wewnętrznej jakości' było niczym innym jak masową czystką polityczną wszelkich dysydentów i frakcji opozycyjnych wobec tego kiełkującego projektu. Już od pewnego czasu, NAL przestała funkcjonować jedynie jako paramilitarna organizacja, rozwijając aparat partyjny, który to przejmuje coraz więcej funkcji rządu cywilnego. Z tego też powodu, po wielkiej paradzie wojskowej w Lublinie, Krzysztof Szwej ogłosił powstanie Narodowo-Ludowej Rzeczpospolitej Polskiej, jednocześniej wypuszczając manifest skierowany do obywateli całej Polski - 'Zwycięstwo polskiej klasy robotniczej zbliża się wielkimi krokami, i tak jak sto lat temu, tak i teraz, jedyny prawowity rząd powstaje tu, w Lublinie.'"
unificationsupreg.14.a: "NARODOWA ARMIA LUDOWA WYGRAĆ MUSI!"

super.14.t: "[GetNewspaper]Narodowa Armia Ludowa jednoczy Polskę!"
super.14.desc: "Wielka walka klas w końcu się zakończyła. Polska powstaje z ruin jako kraj militarystyczny, zbudowany na fundamentach fanatycznego nacjonalizmu i dogmatycznego komunizmu, co wywołało masową panikę pośród krajów sąsiadujących. Nawet osobno, te dwie ideologie stanowią zagrożenie dla wolnego śiwata. Razem, tworzą one absolutną oś zła w oczach zachodnich obserwatorów.\nWewnątrz kraju, nie da się już prawie rozpoznać prawdy od propagandy, tak samo jak nie da się powiedzieć kto był ofiarą walk w wojnie domowej a czyje życie zostało przymusowo 'zredystrybuowane'. W regionach gdzie nie słyszano ani jednego strzału od lat, widać nadal stojące obozy internowania, a wszelakie organizacje polityczne zostały rozwiązane, z wyjątkiem oczywiście partii rzadzącej, a jakakolwiek działalność opozycyjna została zakazana.\nNarodowo-Ludowa Rzeczpospolita Polska podąża w kierunku kolejnej permanentnej rewolucji, a z tak podzieloną i słabą Europą, druga połowa XXI wieku może należeć do Narodowego Bolszewizmu."
super.14.a: "SOCJALIZM LUB ŚMIERĆ!"

super_a.14.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_a.14.desc: "Długie lata minęły od czasu upadku polskiej państwowości. Jednakże, jeszcze Polska nie zginęła, kiedy żyje w ludziach idea tego kraju. Lider nowo powstałego rządu zjednoczonego państwa - [FROM.GetLeader], wyraźnie pokazał że przywrócenie kraju nie było odległym marzeniem przyszłych pokoleń, lecz osiągalną rzeczywistością. Liczne przeciwności losu, wrogowie z każdej strony - także od wewnątrz, nic z tego nie stanęło na przeszkodzie do celu. Polska została przekształcona na swój obraz i podobieństwo przez [FROM.GetName], a ich ideały i wiara w silne przywództwo nie były na pokaz. Blizny, które nosi ta ziemia po wyniszczającym konflikcie pozostaną, ale jedność która została wykuta w ogniu wojny domowej sprawi że Polska po raz pierwszy od dawna patrzy w przyszłość z nadzieją. Wraz ze wschodzącym słońcem, wschodzi wiara w lepsze jutro i z pewnością demony wojny polsko-polskiej są już echem historii."
super_a.14.a: "W końcu zjednoczeni."

super_b.14.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_b.14.desc: "Długie lata minęły od czasu upadku polskiej państwowości. Jednakże, jeszcze Polska nie zginęła, kiedy żyje w ludziach idea tego kraju. Lider nowo powstałego rządu zjednoczonego państwa - [FROM.GetLeader], wyraźnie pokazał że przywrócenie kraju nie było odległym marzeniem przyszłych pokoleń, lecz osiągalną rzeczywistością. Liczne przeciwności losu, wrogowie z każdej strony - także od wewnątrz, nic z tego nie stanęło na przeszkodzie do celu. Polska została przekształcona na swój obraz i podobieństwo przez [FROM.GetName], a ich ideały i wiara w silne przywództwo nie były na pokaz. Blizny, które nosi ta ziemia po wyniszczającym konflikcie pozostaną, ale jedność która została wykuta w ogniu wojny domowej sprawi że Polska po raz pierwszy od dawna patrzy w przyszłość z nadzieją. Wraz ze wschodzącym słońcem, wschodzi wiara w lepsze jutro i z pewnością demony wojny polsko-polskiej są już echem historii."
super_b.14.a: "W końcu zjednoczeni." 

dgr_news.1.t: "[GetNewspaper]Kongres Międzypowiatówki dobiegł końca!"
dgr_news.1.desc: "Niespodziewanie nadzwyczajna sesja plenarna Drugiego Kongresu Międzypowiatówki zdołała dojść do porozumienia, tym samym zachowując sojusz pomiędzy kluczowymi frakcjami Zagłębia. Spotkanie zwołano po nadzwyczajnej interwencji Włodzimierza Czarzastego w Będzinie, której celem było zapobieżenie podobnym kryzysom w przyszłości. Doniesienia sugerują, że głównym tematem obrad było sformalizowanie sojuszu oraz perspektywa ewentualnej centralizacji. Na tym etapie wciąż nie wiadomo jednak, jaki poziom zjednoczenia faktycznie wchodzi w grę. Nadal istnieją wątpliwości co do prawdziwych zamiarów pozostałych uczestników - czy rzeczywiście są gotowi zaryzykować oddanie władzy Czarzastemu, czy też będą walczyć o ochronę własnych interesów? Jedno jest pewne: pozostałe państewka regionu będą musiały teraz zmierzyć się ze zjednoczonymi siłami Międzypowiatówki, która najwyraźniej stała się jednym, zwartym blokiem. To może stanowić poważne wyzwanie - wewnętrzne walki mogą już nie być czymś, na co można liczyć."
dgr_news.1.a: "Czerwony świt...?"

dgr_news.2.t: "[GetNewspaper]Kongres Międzypowiatówki upadł!"
dgr_news.2.desc: "Niezależni obserwatorzy od miesięcy przewidywali upadek Międzypowiatówki i wygląda na to, że w końcu mieli rację. Próba zjednoczenia socjaldemokratów, socjalistów, komunistów, anarchistów, a nawet nacjonalistów od początku była skazana na zakończenie w sposób znany z tak wielu przykładów historycznych - rozdrobnieniem i rozpadem ruchu na możliwie najmniejsze frakcje. Nie wiadomo, co dokładnie doprowadziło do tak nagłego zerwania negocjacji, ale Kongres w Będzinie został przerwany po tym, jak jedna z delegacji opuściła obrady. Każde z państw członkowskich wydało oświadczenie, w którym obwiniało wszystkich pozostałych za problemy, które pojawiły się między nimi, a siły zbrojne postawiono w stan najwyższej gotowości. Wygląda teraz na to, że rozpoczęcie otwartego konfliktu pomiędzy rozbitymi watażkami jest już tylko kwestią czasu. Bez wątpienia jest to niezwykle dogodny obrót wydarzeń dla wszelkich zewnętrznych graczy mających własne plany wobec regionu. Jeśli szukali idealnego momentu do ataku - lepszego już nie będzie."
dgr_news.2.a: "Kolejna porażka Czarzastego."

dgr_news.3.t: "[GetNewspaper]Długość dźwięku samotności"
dgr_news.3.desc: "Antyfaszystowski reżim z siedzibą w Jaworznie od niemal dwóch lat \"okupuje\" Mysłowice i połowę powiatu bieruńsko-lędzińskiego - a przynajmniej tak przedstawia to niemal każde państewko Górnego Śląska, które utożsamia się z byciem \"śląskim\". Daleko jednak tej okupacji do skuteczności - jest to raczej seria sporadycznych kampanii czarnego terroru prowadzonych przez bojówki Antify. Wynika to z charakteru systemu panującego w Jaworznie - a właściwie z jego braku. Reżim stawia na maksymalną decentralizację i strukturalny chaos, co okazało się niemal niemożliwe do narzucenia opornym mieszkańcom Mysłowic i Lędzin. Lokalny opór doprowadził ostatecznie do powstania Sabotagereferat Myslovitz, grupy powszechnie uznawanej za finansowaną z Berlina. Teraz napięcia osiągnęły punkt wrzenia: grupa ogłosiła, że zbrojny opór jest jedynym sposobem na odparcie terroru Antify. W całym mieście wybuchły walki, lecz z powodu wojennej mgły niemal niemożliwe jest ustalenie, kto obecnie ma przewagę."
dgr_news.3.a: "Dlaczego mają nazwę po niemiecku?"
 