dgr_narkom.23.t: "Przełomowa Sesja"
dgr_narkom.23.desc: "Rada Federacji nigdy nie była w stanie wpływać na wewnętrzne kręgi partyjne, jednak od śmierci Szweja wiele się zmieniło. Każdy z jej członków chciał zostać nowym sekretarzem generalnym, ale wszyscy wiedzieli, że to stanowisko może przypaść tylko jednej osobie. Ich największą szansą była Nadzwyczajna Sesja Rady Federacji, zwołana wyłącznie w celu wyłonienia nowego sekretarza generalnego.\n\n- Witajcie, Towarzysze! - przywitała ich Karoń, stojąc na mównicy. - Niestety, nasz ukochany sekretarz generalny, Krzysztof Szwej, zmarł podczas pełnienia urzędu, pozostawiając po sobie puste stanowisko i nasz kraj bez wyraźnego kierunku. Dlatego dzisiejsza sesja pomoże nam wybrać nowego sekretarza generalnego, aby nasz kraj mógł dalej prosperować pod przewodnictwem KPP. A więc zacznij-\n- Szwej kiedyś na mnie spojrzał! - krzyknął jeden z partyjnych aparatczyków. - To ja powinienem zostać sekretarzem generalnym!\n- Bzdura! - odezwał się kolejny. - Urodziłem się w tym samym kraju co Szwej! To ja powinienem zostać nowym sekretarzem generalnym!\n- Towarzysze, nie przekrzykuj-\n- Kłamcy! - przerwał jej następny. - Szwej kiedyś ze mną rozmawiał! To mnie należy się to stanowisko!\n- Co wy wygadujecie! Szwej rozmawiał ze mną nie raz, a dwa razy! To ja powinienem objąć ten urząd! - zawołał kolejny.\n- Żaden z was! To ja powinienem zostać sekretarzem generalnym! Szwej rozmawiał ze mną nie raz, nie dwa, a trzy razy! - krzyknął następny.\n- Towarzysze, na miłość Szweja, przestańcie krzyczeć - powiedziała Karoń, ale było jasne, że delegaci nawet jej nie zauważali.\n- Chodziłem z Szwejem do tego samego przedszkola! Dajcie mi to stanowisko! - wrzasnął kolejny.\n- Tylko tyle? Ja urodziłem się w tym samym szpitalu co on! - odparł inny.\n- Urodziłem się tego samego dnia co on! To chyba oczywiste, że powinienem zostać jego następcą! - krzyknął jeszcze ktoś.\n\nSesja szybko przerodziła się w nieustanny wrzask i rzucanie przedmiotami. Po pewnym czasie Karoń w końcu straciła cierpliwość.\n\n- Dosyć! Macie rządzić tym krajem, a nie zachowywać się jak banda dzieciaków! Jeśli nie przedstawicie mi żadnego sensownego argumentu, natychmiast zakończę to posiedzenie! - wrzasnęła.\n\nNa sali zapadła cisza. Po chwili jeden z delegatów ostrożnie podniósł rękę.\n\n- Tak? - zapytała Karoń.\n- Miałem przyjaciela, który miał przyjaciela, który miał przyjaciela, a ten przyjaciel raz rozmawiał ze Szwejem. Czy to się liczy? - zapytał.\n\nKaroń zasłoniła twarz dłońmi.\n\n- No i jak będzie? - zapytał delegat."
dgr_narkom.23.a: "Koniec Posiedzenia. - powiedziała Karoń."

