dgr_narkom.5.t: "Do samego końca"
dgr_narkom.5.desc: "Wokół długiego drewnianego stołu położonego na sali sądu siedzieli mężczyźni o kamiennych twarzach. Przed nimi leżało kilka grubych teczek. Kurzepa już to wszystko widział. Inne twarze i hasła, ale zawsze ten sam stół i te same uroczyste miny. Znów wezwano go przed komisję, oskarżając o nieetyczne traktowanie jeńców wojennych, czy jak też tym razem postanowili to nazwać. Cywile, którzy nie mieli pojęcia o wojnie. Ludzie, którzy przesiedzieli ją za biurkami, a teraz osądzali tych, którzy naprawdę walczyli.\nSztywny mężczyzna w okularach zwrócił się do niego:\n- Pułkowniku Kurzepa, jako dowódca Zarządu Bezpieczeństwa Wojskowego podczas kampanii śląskiej odpowiadał pan za jeńców schwytanych w sektorze czwartym. Zgadza się?\n- Formalnie - Kurzepa rozparł się na krześle.\n- Pułkowniku, tak czy nie? - Komisarz z westchnieniem poprawił okulary.\n- Ja nadzorowałem jeńców. To was chyba interesuje.\nKomisarz otworzył teczkę.\n- \"Siedemnastego marca czterdziestu trzech jeńców przewieziono do tymczasowego punktu jenieckiego pod Czeladzią. Według pańskiego raportu konwój został zaatakowany, a wszyscy jeńcy zginęli podczas próby ucieczki\".\nKurzepa milczał.\n- \"Trzej ocalali żołnierze twierdzą, że żadnego ataku nie było. Dwaj zeznają, że jeńcy byli rozbrojeni i związani. Jeden pamięta, że otrzymał bezpośrednio od pana rozkaz, by nikogo nie zostawić\".\n- Sporo pamiętają, teraz gdy ta wojna już dawno minęła.\n- Zaprzecza pan, że wydał taki rozkaz?\n- Front się załamywał. Na naszych tyłach działali wrodzy dywersanci, a my nie mieliśmy bezpiecznego miejsca dla kilkudziesięciu żołnierzy przeciwnika. Trzeba było podejmować decyzje.\n- I podjęto je, pułkowniku. Właśnie dlatego pan tu jest - odparł Komisarz zamykając teczkę.\nKurzepa poczuł narastającą wściekłość.\n- Siedzicie tu sobie bezpiecznie i rozprawiacie o dowodach. Ludzie dezerterowali. Na naszych tyłach kręcili się wrodzy agenci. Każdy jeniec był kolejnym zagrożeniem.\n- Więc kazał ich pan rozstrzelać.\nSpodziewał się oskarżeń, moralizatorskich wykładów, być może nagany. Przeżył już podobne postępowania. Rządy się zmieniały, instytucje otrzymywały nowe nazwy, komisje rozwiązywano. Ludzie tacy jak on zawsze znów stawali się potrzebni. Ale nikt przy stole nie wyglądał na zainteresowanego negocjacjami. Po raz pierwszy pewność siebie Kurzepy się zachwiała. Do tej pory Ci sami Komisarze zawsze dochodzili do tego samego wniosku. Co się zmieniło?\n- Uważa pan, że służba stawia towarzysza ponad osądem władz cywilnych. Tak nie jest. Wojsko służy państwu. Nie zastępuje go\n- Zawsze będziecie potrzebować takich oficerów jak ja. Efektywnych. Skutecznych. Umywacie sobie ręce po fakcie, ale ktoś musi tę czarną robotę za was wykonywać.\n- Być może. Ale to towarzysza nie rozgrzesza z podejmowanych działań. I nie daje to immunitetu.\nZ cienia wystąpili dwaj strażnicy. Dopiero wtedy Kurzepa zrozumiał, że komisja nie zebrała się, by zdecydować, czy zachowa stanowisko. Zebrała się, by zdecydować o jego karze. Zaczęły się rozliczenia."
dgr_narkom.5.a: "W imieniu Polski Ludowej skazuję..."

