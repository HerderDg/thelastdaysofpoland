 DGR_curtailing_the_wolfpack_5_fascist_deviats_desc: "Wojskowa klika Bargieły wymknęła się spod kontroli. Rozrosła się niewspółmiernie do potrzeb naszego sektora bezpieczeństwa. Wraz z powstawaniem kolejnych uzbrojonych oddziałów rosły również apetyty na władzę i pieniądze wśród najbliższych współpracowników Bargieły. Teraz mierzymy się z poważnym i przerośniętym problemem, który będziemy musieli przyciąć, zanim nas pożre. Nie będzie łatwo. Będzie opór. A my będziemy musieli być gotowi na wszystko."
