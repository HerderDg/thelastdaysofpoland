 DGR_special_industry_zone: "Specjalna Strefa Gospodarcza"
 DGR_euroterminal_expanded: "Sławkowskie Centrum Logistyczne"
 DGR_industrial_heart6: "Przemysłowa potęga"
 DGR_industrial_heart6_desc: "Potęga przemysłowa Zagłębia była budowana dekadami, a wystarczyło kilka lat rządów kapitalistycznych by wszystko to zostało obrócone w nicość. Zamknięte kopalnie, zawarte szyby, tylko wiatr niesie echo poprzednich dokonań gospodarczych w tym regionie. Upadłe huty, polikwidowane fabryki, zrujnowane sieci kolejowe. I tylko wiatr teraz niesie echo niegdyś dumnej gospodarki tego regionu. \n\n§GTytanicznym wysiłkiem całego ludu udało nam się przywrócić namiastkę tej potęgi przemysłowej, i serce przemysłowe znowu bije mocnym rytmem. Doprawdy, staliśmy się największą potęgą przemysłową w całym regionie, a może i nawet w Polsce!§!"
 DGR_economy_nda: "Narodowy Urząd Dyspozycyjny"
 DGR_economy_nda_desc: "Narodowy Urząd Dyspozycyjny ma pełnić funkcję organu zarządzającego gospodarką państwa. Oczywiście kierowanie całą gospodarką przypomina bardziej sterowanie ogromnym statkiem. Nie ma tu zbyt wiele miejsca na manewry ani nagłe zmiany kursu. Miejmy tylko nadzieję, że po drodze nie czekają na nas żadne góry lodowe..."
 DGR_pogoria_commissariat: "Komisariat Marynarki Wojennej Pogoria"
DGR_pogoria_commissariat_desc: "Posiadanie czterech jezior w Polsce po Upadku w zupełności wystarczy, by uznać się za potęgę morską. Dodanie do tego prawdziwego urzędu komisariatu marynarki z admirałami to inwestycja wyprzedzająca wszystkich o całe lata. Nawet jeśli okaże się bezużyteczna, sama projekcja siły może przydać się naszej armii jako poważne zagrożenie dla każdego w tym kraju."
 DGR_national_science: "Narodowy Wydział Nauki"
DGR_national_science_desc: "Jedną z najgorszych rzeczy, jakie robi współczesna nauka jest rozpraszanie potencjału wszystkich naukowców na tysiące małych projektów bez jednego celu i jasnego przeznaczenia. Jeden departament z jednym celem - uczynić nasz kraj lepszym - będzie idealnym sposobem na dopilnowanie, byśmy nie marnowali pieniędzy na badanie nowych garnków, patelni czy problemów natury psychicznej."
 DGR_smuggling_corridor: "Szlaki przemytnicze"
 DGR_atomowka: "Constructing Nuclear Power Plant in Ząbkowice!"
 DGR_coal_union: "Wspólnota Węgla Kamiennego"
 DGR_coal_union_present: "Placówka Wspólnoty Węgla Kamiennego"
 DGR_narodowa_armia_ludowa4: "Narodowa Armia Ludowa"
 DGR_narodowa_armia_ludowa4_desc: "Jak na kraj, który twierdzi, że jest dumny ze swojej potęgi militarnej, przeszliśmy długą drogę od zbieraniny do profesjonalnej armii. Nacjonalistyczna musztra jest precyzyjna i zorganizowana, nasi komisarze zabójczo skuteczni, a socjalistyczne milicje wypełniają wszystkie pozostałe luki. Nasi oficerowie mają wystarczająco dużo doświadczenia, by rozumieć swoje zadania, a całość stanowi coś w rodzaju sprawnie działającej organizacji. I armia wciąż rośnie. Jak na armię opartą na ilości - jest lepiej, niż mogłoby być."
 DGR_narodowa_armia_ludowa_reformed: "Polska Armia Czerwona"
 DGR_narodowa_armia_ludowa_reformed_desc: "Jak na kraj, który twierdzi, że jest dumny ze swojej potęgi militarnej, przeszliśmy długą drogę od zbieraniny do profesjonalnej armii. Nacjonalistyczna musztra była precyzyjna i zorganizowana, nasi komisarze zabójczo skuteczni, a socjalistyczne milicje wypełniały wszystkie pozostałe luki. Nasi oficerowie mają wystarczająco dużo doświadczenia, by rozumieć swoje zadania, a całość stanowi coś w rodzaju sprawnie działającej organizacji. A armia już teraz jest wystarczająco liczna. Jak na armię opartą na ilości - jest lepiej, niż mogłoby być."
 DGR_collectivisation_stage_3: "Kolektywizacja - Epifora"
 DGR_collectivisation_stage_3_desc: "Kolektywizacja w Polsce nigdy nie została właściwie ukończona. Aby jednak nie powtarzać błędów przeszłości, przeprowadzimy ją systematycznie, ostrożnie i z należytym szacunkiem dla ludzi, którzy od pokoleń pracowali na tej ziemi. Nie ma już feudalnych obszarników, których majątki musimy przejąć. Teraz musimy jedynie na nowo rozniecić wśród ludzi płomień ducha spółdzielczego - przynajmniej taki był zamysł. A teraz? Nie ma już po nim śladu."
 DGR_collectivisation_stage_4: "Wojskowi posiadacze ziemscy"
 DGR_collectivisation_stage_4_desc: "Kolektywizacja w Polsce nigdy nie została właściwie ukończona. Aby jednak nie powtarzać błędów przeszłości, przeprowadzimy ją systematycznie, ostrożnie i z należytym szacunkiem dla ludzi, którzy od pokoleń pracowali na tej ziemi. Nie ma już feudalnych obszarników, których majątki musimy przejąć. Teraz musimy jedynie na nowo rozniecić wśród ludzi płomień ducha spółdzielczego. A skoro nie uda nam się tego zrobić, pozwolimy wojsku osiedlić się na ich ziemiach, bo niektóry opór można przełamać wyłącznie bagnetem."
 DGR_collectivisation_stage_4_narkom: "Komisja Inspekcji Higieny i Jakości Plonów"
 DGR_collectivisation_stage_4_narkom_desc: "Kolektywizacja w Polsce nigdy nie została właściwie ukończona. Aby jednak nie powtarzać błędów przeszłości, przeprowadzimy ją systematycznie, ostrożnie i z należytym szacunkiem dla ludzi, którzy od pokoleń pracowali na tej ziemi. Nie ma już feudalnych obszarników, których majątki musimy przejąć. Teraz musimy jedynie na nowo rozniecić wśród ludzi płomień ducha spółdzielczego. A skoro nie uda nam się tego zrobić, będziemy musieli dopilnować, by rolnicy zostali związani możliwie największą liczbą przepisów. Nie możemy naciskać na nich zbyt mocno, ale możemy utrudniać im prowadzenie gospodarstw tak bardzo, jak to tylko możliwe, aż zgodzą się przystąpić do kolektywu."
 DGR_collectivisation_stage_4_narkom_2: "Komisja Inspekcji Higieny i Jakości Plonów"
 DGR_collectivisation_stage_4_narkom_2_desc: "Kolektywizacja w Polsce nigdy nie została właściwie ukończona. Aby jednak nie powtarzać błędów przeszłości, przeprowadzimy ją systematycznie, ostrożnie i z należytym szacunkiem dla ludzi, którzy od pokoleń pracowali na tej ziemi. Nie ma już feudalnych obszarników, których majątki musimy przejąć. Teraz musimy jedynie na nowo rozniecić wśród ludzi płomień ducha spółdzielczego. A skoro nie uda nam się tego zrobić, będziemy musieli dopilnować, by rolnicy zostali związani możliwie największą liczbą przepisów. Nie możemy naciskać na nich zbyt mocno, ale możemy utrudniać im prowadzenie gospodarstw tak bardzo, jak to tylko możliwe, aż zgodzą się przystąpić do kolektywu."
 DGR_economic_maneuver_idea: "Manewr gospodarczy"
 DGR_economic_maneuver_idea_desc: "Pierwszy historyczny plan nazwany \"Manewrem Gospodarczym\" był programem gospodarczym mającym uratować gospodarkę Polskiej Rzeczypospolitej Ludowej po przyspieszeniu rozwoju na początku lat 70. Pamiętajmy jednak, że ostatecznie nie wyszło to gospodarce szczególnie na dobre, a następny kryzys był jeszcze większy. Teraz, ucząc się na błędach przeszłości, dopilnujmy, by ten manewr nie zaprowadził nas na drogę bez wyjścia"
 DGR_real_estate_idea_military: "Zmilitaryzowane mieszkalnictwo"
 DGR_real_estate_idea_military_desc: "Armia potrzebuje miejsca do zakwaterowania. Duża armia potrzebuje go więcej. To tak proste, jak tylko się da. A skoro jesteśmy w stanie wojny, to wojsko powinno decydować, gdzie powstaną nowe osiedla - czy mają zaspokajać potrzeby armii, czy też można je pozostawić cywilom. A jeśli wstąpisz do armii - zgadnij co, dostaniesz mieszkanie szybciej i łatwiej!"
 DGR_garrison_city: "Miasto garnizonowe"
 DGR_garrison_city_2: "Miasto garnizonowe"
 DGR_sabotage_agents: "Sieć komisji antysabotażowej"
 DGR_gierkowka: "Autostrada im. Edwarda Gierka"
 DGR_state_depots: "Państwowy skład rezerw strategicznych"
 DGR_regional_protectors: "Ministerstwo Ziem Odzyskanych"
 DGR_regional_protectors_desc: "Ministerstwo Ziem Odzyskanych będzie nadzorować wszystkie ziemie, które znajdą się pod naszą kontrolą, ale nie zostały jeszcze w pełni włączone do rdzenia administracyjnego. A będzie miało co robić. Partyzantów trzeba będzie spacyfikować. Lokalne mienie trzeba będzie zagospodarować. W niektórych przypadkach konieczne będzie przeprowadzenie programów naprawczych o charakterze społecznym. Co najważniejsze, samo społeczeństwo trzeba będzie przygotować do integracji z naszym systemem. Dla niektórych może to być niemały szok."
 DGR_paratroopers_tt: "§Y[DGR.GetName]§!: Tworzy szablon dywizji spadochroniarzy składający się z: \n§Y4 batalionów spadochroniarzy§!"
 DGR_marines_tt: "§Y[DGR.GetName]§!: Tworzy szablon dywizji piechoty morskiej składający się z: \n§Y4 batalionów piechoty morskiej§!"
 DGR_forest_infantry_tt: "§Y[DGR.GetName]§!: Tworzy szablon dywizji piechoty leśnej składający się z: \n§Y4 batalionów piechoty leśnej§!"
 DGR_national_army_fund_idea: "Narodowy Fundusz Wojskowy"
 DGR_national_army_fund_2_idea: "Ministerstwo Pozyskiwania Funduszy dla Armii"
 DGR_national_army_fund_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach. Na całą resztę będzie musiało poczekać."
 DGR_national_army_fund_2_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach. Na całą resztę będzie musiało poczekać."
 DGR_cut_luxury_sector_idea: "Cięcia w sektorze luksusowym"
 DGR_cut_luxury_sector_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach. A ludziom nie potrzeba żadnych dóbr luksusowych, kiedy żołnierze giną na froncie."
 DGR_redirecting_housing_funds_idea: "Cięcia w mieszkalnictwie"
 DGR_redirecting_housing_funds_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach. Mamy już wystarczająco dużo mieszkań dla ludzi, a bezdomni zawsze mogą wstąpić do armii, co rozwiąże ten problem."
 DGR_suspend_non_essentials_idea: "Cięcia w sektorze usług publicznych"
 DGR_suspend_non_essentials_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach. A być może będziemy musieli wcielić część pracowników usług publicznych do wojska, dzięki czemu nie będą już nam potrzebni."
 DGR_redirect_regional_budgets_idea: "Cięcia budżetów samorządowych"
 DGR_redirect_regional_budgets_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach. Na szczęście oznacza to, że władze regionalne nie będą musiały wydawać tysięcy złotych na jedną ławkę, a my będziemy mogli wyprodukować kilka dodatkowych czołgów."
 DGR_freeze_civilian_infrastructure_idea: "Cięcia w sektorze infrastruktury publicznej"
 DGR_freeze_civilian_infrastructure_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach. Drogi już teraz są pełne dziur, a ich naprawianie to syzyfowa praca. Być może lepiej zadbać o to, by nasze wojska bez przeszkód docierały na front, niż przejmować się jakimś facetem, który nie może dojechać do swojego ulubionego sklepu."
 DGR_liquidate_private_assets_idea: "Likwidacja prywatnych majątków"
 DGR_liquidate_private_assets_idea_desc: "Przekazywanie środków wojsku będzie wymagało większego niż zwykle usprawnienia procedur ze względu na ogrom potrzeb naszej armii. Choć może to uszczuplić inne sektory naszego kraju, odpowiednio finansowana armia jest jedyną rzeczą, której potrzebujemy w takich czasach."
 DGR_foreign_tech_espionage_spirit: "Zagraniczne szpiegostwo technologiczne"
 DGR_foreign_tech_espionage_spirit_desc: "Polska się zatrzymała. To fakt. Stanęła w miejscu, zawieszona w czasie. Kiedy nadszedł Upadek, w tym kraju nie można było stworzyć niczego nowego, bo wszyscy musieliśmy naprawiać stare. Świat jednak się nie zatrzymał. Wręcz przeciwnie, przez te wszystkie lata rozwijał się dalej, a my jesteśmy daleko za nim pod względem technologicznym. Będziemy musieli nadrobić zaległości... i nie będziemy pytać o pozwolenie."
 DGR_association_of_trade_unions_spirit: "Zrzeszenie Związków Zawodowych"
 DGR_association_of_trade_unions_spirit_desc: "W swojej pierwotnej formie, ZZZ była nominalnie ogólnokrajową federacją związków zawodowych w Polsce (1945-1980), lecz w praktyce stanowiło przede wszystkim narzędzie partii do trzymania robotników w ryzach. Jego znaczenie znacznie zmalało wraz z rosnącą popularnością ruchu Solidarności. Na szczęście nie mamy w naszych szeregach takiego robactwa, więc możemy przywrócić to ogólnokrajowe zrzeszenie związków zawodowych i objąć wszystkich jego czujnym nadzorem."
 DGR_curtailing_the_wolfpack_1: "Obława na watahę"
 DGR_curtailing_the_wolfpack_1_desc: "Wojskowa klika Bargieły wymknęła się spod kontroli. Rozrosła się niewspółmiernie do potrzeb naszego sektora bezpieczeństwa. Wraz z powstawaniem kolejnych uzbrojonych oddziałów rosły również apetyty na władzę i pieniądze wśród najbliższych współpracowników Bargieły. Teraz mierzymy się z poważnym i przerośniętym problemem, który będziemy musieli przyciąć, zanim nas pożre. Nie będzie łatwo. Będzie opór. A my będziemy musieli być gotowi na wszystko."
 DGR_curtailing_the_wolfpack_mub: "Obława na watahę"
 DGR_curtailing_the_wolfpack_mub_desc: "Wojskowa klika Bargieły wymknęła się spod kontroli. Rozrosła się niewspółmiernie do potrzeb naszego sektora bezpieczeństwa. Wraz z powstawaniem kolejnych uzbrojonych oddziałów rosły również apetyty na władzę i pieniądze wśród najbliższych współpracowników Bargieły. Teraz mierzymy się z poważnym i przerośniętym problemem, który będziemy musieli przyciąć, zanim nas pożre. Nie będzie łatwo. Będzie opór. A my będziemy musieli być gotowi na wszystko."
