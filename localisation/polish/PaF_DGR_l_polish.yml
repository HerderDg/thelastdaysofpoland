dgr_narkom.7.t: "Jedna droga dla kraju"
dgr_narkom.7.desc: "- Towarzysze, od lat mówimy o polskiej drodze do socjalizmu - rozpoczął Szwej rzeczowym, choć wyraźnie zmęczonym głosem. - Musimy ustalić, co jej narodowy charakter oznacza w obecnej sytuacji. Nie ma już RWPG ani Układu Warszawskiego. A przede wszystkim nie ma naszych radzieckich patronów, którzy przewodzili ruchowi komunistycznemu. W tych warunkach nie możemy po prostu odtworzyć wszystkich rozwiązań z czasów PRL.\nWiktor Modlewski, oficer prowadzący do spraw czystości ideologicznej przy komitecie centralnym jako pierwszy zabrał głos.\n- Nasz wielki narodowy socja...\n- WIKTOR.\nWiktor zatrzymał się w pół zdania.\n- ...socjalizm. Polski socjalizm.\nKtoś przy drugim końcu stołu mruknął, że kolejność słów ma czasem znaczenie większe, niż powinna.\n- W każdym razie, towarzysze - kontynuował Wiktor. - Nasze podejście nie oznacza porzucenia idei Marksa ani międzynarodowej solidarności. Polska droga do socjalizmu musi odpowiadać polskim warunkom. Cel pozostaje wspólny, nawet jeśli droga jest własna.\n- A interesy klasy robotniczej? Też pozostają wspólne? - zapytał jeden z wiceministrów\n- Oczywiście\n- Zawsze? - zapytał Szwej lekko podpuszczając oficera\n- Wspieramy towarzyszy politycznie - odpowiedział Wiktor - Ale forma pomocy zależy od okoliczności.\n- Nie jesteśmy jednak odpowiedzialni za każdą partię komunistyczną na świecie - dopowiedział Szwej - Jesteśmy odpowiedzialni za polskich robotników.\n- No to może tak - Polska prowadzi samodzielną politykę zagraniczną zgodną z interesami polskiej klasy robotniczej, zachowując jednocześnie solidarność z międzynarodowym ruchem komunistycznym.\n- Brzmi rozsądnie - skinął głową Szwej - zatem, co do narodu...\n- Towarzysze, ja tylko jeszcze do poprzedniego punktu - odezwała się nagle Karoń - nie zachowujmy się jakby to od nas zależała pomoc innym w tym momencie historii. To my jesteśmy w sytuacji gdzie oczekiwalibyśmy solidarności międzynarodowej od innych. Nie wiem czy powinniśmy się ostentacyjnie zamykać pod płaszczykiem nacjonalizmu na potencjalną współpracę.\n- Towarzyszko - odparł Modlewski - nikt się tutaj nie chce zamykać. Mówimy tutaj o tym co nasz kraj będzie interpretował wewnętrznie. Zewnątrz to całkiem inna polityka.\n- Nie można mieć ciastka i zjeść ciastka...\n- Ależ można, wystarczy upiec dwa. Wtedy jedno sobie zjemy a drugie oddamy.\n- Towarzysze, może dość o ciastkach - przerwał Szwej - naród jest dobrem który manifestuje się poprzez klasy ludowe, tak? Więc jeśli decydujemy o sobie to naturalne że będziemy kierować się pewnym narodowym imperatywem. Klasy wyższe mają to do siebie że niosą ze sobą pogardę dla tożsamości narodowej, nazywają się kosmopolitami - to wtedy nie należą do naszego systemu ideologicznego i są spod niego wyjęte. I wtedy, wszyscy są zadowoleni, prawda?\nKaroń i Modlewski skinęli głowami. Wydawało się to wyczerpywać temat, który stał się mimo wszystko bardziej filozoficzną dywagacją niźli systemowym podejściem do zdefiniowania ideologii. Ale jak wszystko w komunizmie, to też miała być po prostu teoria."
dgr_narkom.7.a: "Polska jest naszą matką. Marks pozostaje ojcem."

dgr_narkom.8.t: "//TYTUŁ ZREDAGOWANO//"
dgr_narkom.8.desc: "Komisja Medialna spotykała się zwykle w środy, choć ostatnio środy coraz częściej zaczynały przeciągać się do późnego piątkowego popołudnia. Tym razem w sali numer cztery siedzieli tylko we troje. Marta Wysocka, dziennikarka z piętnastoletnim doświadczeniem, która przez większość kariery zajmowała się reportażem społecznym. Piotr Malec, redaktor naczelny jednego z największych dzienników państwowych, wcześniej odpowiedzialny za kilka udanych kampanii informacyjnych. I major Tomasz Radecki, oficer polityczny oddelegowany do komisji po tym, jak przez trzy lata zajmował się analizą nastrojów w jednostkach wojskowych. Na stole leżał raport z ostatniego kwartału.\n- Największy problem nie polega na tym, że ludzie nie przyjmują przekazu - powiedziała Wysocka, przesuwając palcem po wykresie. - Coraz częściej oddzielają go od własnych przekonań. Potrafią powiedzieć dokładnie to, czego oczekujemy, a pięć minut później twierdzą coś zupełnie przeciwnego. Albo podchodzą do tego coraz sceptyczniej.\n- I weź tu Polakom coś wbij do łba - powiedział Malec. Radecki przez chwilę przeglądał kolejne strony.\n- To nie jest problem wiarygodności?\n- Nie w pierwszej kolejności. Wiarygodność ma znaczenie przy komunikacie bezpośrednim. My mamy problem z trwałością. Chcemy, żeby pewne rzeczy zaczęły funkcjonować w świadomości jako oczywiste, zanim ktokolwiek pomyśli o nich jako o opinii\n- Dlatego propozycja zespołu badawczego jest sensowna. Nie tworzyć osobnych kampanii dla każdego komunikatu tylko zbudować jeden system z powtarzalny językiem, obrazami, kolejnością tematów, doborem rozmówców. Jeżeli będziemy konsekwentni, odbiorca zacznie sam uzupełniać brakujące elementy automatycznie - dorzuciła Wysocka\n- Mamy już pierwsze testy z kodowaniem słów. Niektóre określenia działają znacznie lepiej od innych. \"Kontrola\" wywołuje opór. \"Koordynacja\" praktycznie go nie wywołuje. \"Ograniczenie\" jest negatywne. \"Odpowiedzialność\" - pozytywne, nawet jeśli zdanie pozostaje dokładnie takie samo - kontynuował myśl koleżanki Malec\n- To można zautomatyzować - powiedział Radecki. - Model językowy mógłby analizować tekst przed publikacją i wskazywać miejsca, w których można zmienić konstrukcję bez zmiany znaczenia.\nWysocka zmarszczyła brwi.\n- Model językowy?\n- Roboczo nazwaliśmy go \"Redaktorem\". Nie pisze materiałów tylko podpowiada, które elementy mają największą skuteczność.\n- To bot?\n- Tak, działa na podstawie SI - odpowiedział Radecki. - Ale nie jako agitator. To byłoby zbyt oczywiste. Ma uczestniczyć w dyskusjach tak jak zwykły użytkownik. Zadawać pytania, porządkować argumenty, podsuwać źródła. Jeżeli zacznie działać poprawnie, nie będzie można wskazać pojedynczej wypowiedzi, która stanowiłaby propagandę. Naturalnie i organicznie.\n- Czyli nie chodzi o to, żeby powiedzieć ludziom, co mają myśleć - powiedziała Wysocka.\n- Nie - odpowiedział Radecki. - Chodzi o to, żeby ograniczyć liczbę rzeczy, o których będą musieli się zastanawiać. A jak na coś wpadną to niech wierzą że to jest ich własny pomysł. Ale będzie wychodził on z naszych założeń."
dgr_narkom.8.a: "//ODPOWIEDŹ NIEZGODNA Z ALGORYTMEM//"

dgr_narkom.9.t: "W sidłach losu"
dgr_narkom.9.desc: "Szarejko. Oszust. Zdrajca\nZimmermann. Psychopata. Zdrajca.\nAbrahamowicz. Mięczak. Zdrajca.\nCzyżewski. Konformista. Zdrajca.\nWerner. Lizodup. Zdrajca.\nZieliński. Kretyn. Zdrajca.\nKasprowicz. Leszcz. Zdrajca.\nGrabarczyk...\n\nWszyscy mnie zdradzili, jeden po drugim! Zamiast zjednoczyć się w obliczu politycznego kryzysu, Politbiuro podsycało podziały i wybujałe ego wszystkich tych patologicznych zdrajców byleby tylko rozmontować wszystko co zbudowaliśmy. I oni swoim żałosnym podejściem do tego dopuścili! Ja...do tego dopuściłem. Ale co ja mogłem zrobić samemu jak nikt nie chciał ze mną współpracować? Prosiłem, groziłem, mówiłem że musimy działać razem. Jak grochem o ścianę. Wiecznie zajęci swoimi sprawami, aż w końcu przyszli i po nich. I za każdym razem skakałem jak małpa by próbować tych niewdzięczników ocalić. I na co mi to było?! NA CO?! PO CHOLERĘ MI CI ZDRAJCY, KTÓRZY WIECZNIE PATRZYLI JAK TU OCALIĆ WŁASNE DUPSKA I ANI MYŚLELI POŚWIĘCAĆ SIĘ DLA SPRAWY? JA ICH STWORZYŁEM. JA ICH WYNIOSŁEM Z NICOŚCI I TO DZIĘKI MNIE MOGLI BYĆ KIMŚ W TYM ZASRANYM ŚWIECIE! I TAK SIĘ ODWDZIĘCZAJĄ?!\nCholera, nie powinienem krzyczeć. Ale nic to. Nie dostaną mnie tak łatwo. Prędzej zginę niż po raz kolejny znajdę się pod komunistycznym butem. Jeden solidny ruch palcem i to wszystko się skończy. Ogarnie mnie pustka, której tak wiele razy doświadczałem widząc co się dzieje dookoła. Chciałbym się bać, lecz już nie umiem. W sumie to wspaniałe uczucie. Nieważne, chociaż tę sprawę dociągnę do końca. Jestem to winien wszystkim którym się miałem czelność wbić z butami w życie. Kończ waść. \nRozległ się wielki huk, a świat pogrążył się w ciemności. Nie było już niczego, jak w słynnym Białymstoku. Ciało opadło z łoskotem na leśne runo. Tak utęskniona i wyczekiwana śmierć...nie nadeszła.\n\n- Towarzyszu Komisarzu, mamy go!\n- Coś ty zrobił, zabiłeś go?!\n- Nie, walnąłem go w łeb z nienacka. Będzie żył.\n- Dobra, bierzcie go i wracamy do ciężarówki. Chłopy, szykujcie się na medale!"
dgr_narkom.9.a: "I nie było już nikogo"

dgr_narkom.11.t: "A Perestroika for every Union"
dgr_narkom.11.desc: "Respectable Party Committee and respectable Chairman Krzysztof Szwej, \n\nWe, the workers of People's Republic, aim to improve the current situation that Poland has found itself in after the collapse of the capitalist regime. We cherish the fact that a socialist form of government has been proclaimed in this former Polish industrial heartland. We also admire the effort that gets put into recreating the legacy of our Comrades from before the unfortunate fall of communism in the late 80s. However, we also want to point out certain issues that some workers-citizens can find in the current policies kept by the Party. Namely: lack of democracy and free elections. \n\nAs we all know, the biggest adversary of communism is the spread of revisionist tendencies across the populace, namely the working class, which leads the state built upon serving them to collapse on itself. However, we, the democratic socialists, believe that suspending free elections is not the correct solution. We say that because for revisionism to prevail in democratic elections, it would require it firstly to gather a significant number of supporters within the communist state, which could mean that the state has proven to a significant part of the working class that it does not work in the first place. We believe that in a prosperous communist state there is no place for revisionism to spread through democratic elections. \n\nSecondly, the lack of democratic elections could lead some members of the working class to believe that the current regime does not really care about their opinions. As a consequence, this part of the working class might fall into revisionism, take an apolitical stance, which isn't what the communists aim for, or many more. We can say with confidence that implementing free elections would allow more people to engage in revolutionary activism, which could greatly strengthen the current regime.\n\nThirdly, any socialist or communist state without a proper democratic system is easy prey for Western capitalist slander. The bourgeoisie will always try to distract the working class in their domains by pointing out that this particular state that actually cares about the workers does not have proper elections, etc. Implementing any popular vote will for sure strengthen the image of our regime and communism proper outside our borders. This will especially be useful in countering the capitalists' slander. \n\nWith this in mind, we, the democratic socialists, await your response as well as the implementation of some of our proposed ideas. Knowing the Party's devotion to the working class's cause, we await with confidence. \n\n (Signed by twenty different people)"
dgr_narkom.11.a: "The wind of change keeps coming back."

dgr_narkom.12.t: "As Urgent as Death"
dgr_narkom.12.desc: "- Comrade Chairman! - said one of his subordinates, whom Szwej could recognize from facial features but not remember a name in his senile mind - We sincerely apologize for disturbing your sleep, but in ten minutes there is an important scheduled speech of yours. The Party gremium needs you to address... - the subordinate continued.\n\nBefore he realized the room around him had changed, the white hospital walls were covered in cloaks, the equipment was moved to the sides, and the room was starting to look like the inside of a parliament or some other government building. Soon, the room was entered by a filming crew that instantly began setting up their equipment and pointed a big camera at Szwej. Krzysztof was also dressed by someone, got a tie around his neck, one of his associates put a written piece of paper before him, and he put on his glasses. When Szwej was ready - at least according to people standing around him - the crew began the broadcast.\n\n- Comrades! - Szwej read the first word on his piece of paper in a sleepy voice - today we have to address an issue so important to our cause of liberating the working class...\nThe associates standing behind the camera in front of him started to gesture to him to either speak louder, more convincingly, or not just read from the paper so obviously. Szwej, however, couldn't make anything of this really or even get a grasp of what he himself was saying.\n- ...the reactionary threat that hid in our society planted there by the western capitalists and bur...burgers? - Szwej struggled to spell a word in front of him - ...the threat of burgers...yes, the burgers in our country stay prevalent and...these burgers...\nOne of the Party members covered his face in his hands, but the Chairman continued.\n- The October Revolution got rid of...burgers...in Russia. The subsequent liberation of Poland from Nazism helped us create a democratic, people's...- Szwej continued as the official Party line started to rally people against a fast food item.\n\nAs the Chairman started to reach the end of the paper, he got visibly more and more tired. At one point in the final paragraph, Szwej just stopped and, for a long second, not willing to continue his farce, said:\n-umm...considering all this...ummm...Comrades, Comrades - Szwej kept on - beware of the...reactionaries...reactionary tendencies..., the...adversaries of the...the burgers and...\n\nSeeing Szwej about to collapse on his own, the broadcast was quickly ended, and the crew and many others got outside of the Chairman's room. Szwej could finally rest again on his bed. Szwej eavesdropped on something about the \"communism prevail\" or \"strategic victory\" and that an \"important milestone has been reached\". This news all sounded like something that he also would talk about and cheer for, but now he couldn't really care less. With so much happening in the last half an hour, Szwej closed his eyes and zoned out for good."
dgr_narkom.12.a: "The communist dream is coming."

