DGR_sweep_the_floor_desc: "Jakiekolwiek pomniejsze ameby omylnie zwane watażkami aspirujące do miana prawdziwych krajów nie mogą nam stanąć już na drodze, przekroczyliśmy nasz Rubikon i nic nas nie zatrzyma. A już na pewno nie jakieś odpady postupadkowe."
