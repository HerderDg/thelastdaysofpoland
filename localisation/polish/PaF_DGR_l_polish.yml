dgr_nazbol.23.t: "Puszka Pandory"
dgr_nazbol.23.desc: "Była już prawie północ. Generałowie Abrahamowicz i Zieliński siedzieli w biurze od kilku godzin, obaj nadal w tych samych mundurach, w których rozpoczęli pracę rano. Na biurku leżały kalkulatory, dokumenty, rachunki i kilka kubków po kawie. Żaden z nich nie wyglądał już jak człowiek, który powinien podejmować decyzje dotyczące całej armii.\n- Dobra, jeszcze raz. Ile pieniędzy właściwie potrzebujemy? - zapytał Abrahamowicz, przeglądając kolejną tabelę. - Nie ile chcielibyśmy mieć. Ile naprawdę potrzebujemy, żeby ta armia zaczęła jakoś wyglądać?\nZieliński długo patrzył na dokument.\n- Trzydzieści miliardów.\n- Na wszystko?\n- No... chyba.\nAbrahamowicz odłożył długopis i przez chwilę patrzył na sufit. Obaj nie pochodzili z miejsc, w których człowiek miał okazję zastanawiać się nad wydawaniem miliardów. Jeszcze kilka lat temu większym problemem było dla nich, czy starczy pieniędzy do końca miesiąca. Teraz mieli zdecydować, ile kosztuje obrona całego państwa. Zaczęli oczywiście od piechoty. Tutaj sprawa była prosta. Mundury, hełmy, kamizelki, karabiny, amunicja, radiostacje, noktowizory, drony, ciężarówki, artyleria, granatniki, środki przeciwpancerne, magazyny, poligony. Potem wyszło, że do tego wszystkiego potrzebne są części zamienne, warsztaty i ludzie, którzy będą to wszystko naprawiać.\n- Dobra, ale to akurat ma sens - stwierdził Zieliński. - Jak już mamy wydawać pieniądze, to na ludzi. Piechota zawsze się przyda.\n- Zgadzam się. Chłopa posłać najprościej. W końcu to my zdobywamy ten kraj.\nI rzeczywiście, obaj byli zgodni co do jednego: jeśli mieli wybierać między drogim gadżetem a kolejnym batalionem piechoty, wybór był oczywisty. Problemy zaczęły się przy lotnictwie. Samoloty wymagały części, paliwa, pilotów, hangarów i remontów. Hangary wymagały ochrony, ochrona potrzebowała obrony przeciwlotniczej, obrona przeciwlotnicza radarów, a radary całej infrastruktury. Zieliński przeglądał kolejne kartki coraz bardziej zrezygnowany.\n- To może bez samolotów?\n- Nie możemy. Bo ktoś nas zbombarduje i tyle będzie z tego. I weź to wytłumacz Alkowi...\n- Aha.\nPrzy wojskach specjalnych doszły śmigłowce, drony i specjalistyczne wyposażenie. Przy marynarce było jeszcze gorzej, choć przynajmniej na początku wydawało się taniej. Po kolejnej godzinie suma była tak absurdalna, że obaj przestali ją nawet komentować.\n- Wiesz co? - powiedział w końcu Zieliński. - Chyba naprawdę trzeba znaleźć ten złoty pociąg.\n- Jaki kurwa złoty pociąg?\n- No ten niemiecki. Albo Komnatę Bursztynową. Cokolwiek.\nAbrahamowicz spojrzał na niego zmęczonym wzrokiem.\n- Każ Szarejce zapierdalać. Jest na tyle głupi że się zgodzi.\nZieliński spojrzał na tabelę.\n- To...robimy więcej piechoty?\nAbrahamowicz pokiwał głową. Innego wyjścia być z tej sytuacji nie mogło, a fajrant czeka."
dgr_nazbol.23.a: "- No i to jest konkret."

dgr_nazbol.25.t: "W życiu, wstyd"
dgr_nazbol.25.desc: "Rozkazem Naczelnego Komisarza Narodowej Armii Ludowej nakazuje się:\n\n1. Radom wojennym frontów, a przede wszystkim dowódcom frontów:\na) bezwzględnie wykorzenić z wojsk nastroje odwrotowe i żelazną ręką tłumić propagandę głoszącą, że możemy i powinniśmy rzekomo wycofywać się dalej na południe oraz że taki odwrót rzekomo nie przyniesie żadnych szkód;\nb) bezwzględnie usuwać ze stanowisk i kierować do Sztabu Głównego, przed sąd wojskowy, dowódców armii, którzy dopuścili do samowolnego wycofania wojsk z zajmowanych pozycji bez rozkazu dowództwa frontu;\nc) formować w ramach frontu od jednego do trzech, zależnie od sytuacji, batalionów karnych, liczących po 80 ludzi każdy, do których kierować średnią i wyższą kadrę dowódczą oraz odpowiednich pracowników politycznych wszystkich rodzajów sił zbrojnych, winnych naruszenia dyscypliny wskutek tchórzostwa lub chwiejności, i kierować je na najtrudniejsze odcinki frontu, aby dać im możliwość odkupienia krwią swych zbrodni przeciwko Ojczyźnie.\n\n2. Radom wojennym armii, a przede wszystkim dowódcom armii:\na) bezwzględnie usuwać ze stanowisk dowódców i komisarzy korpusów oraz dywizji, którzy dopuścili do samowolnego wycofania wojsk z zajmowanych pozycji bez rozkazu dowództwa armii, i kierować ich do rady wojennej frontu przed sąd wojenny;\nb) formować w ramach armii od 3 do 5 dobrze uzbrojonych oddziałów zaporowych, liczących do 20 ludzi każdy, rozmieszczać je bezpośrednio na tyłach niestabilnych dywizji i zobowiązać je, w przypadku paniki oraz bezładnego odwrotu oddziałów dywizji, do rozstrzeliwania na miejscu panikarzy i tchórzy, a tym samym pomagać uczciwym żołnierzom dywizji w wypełnianiu ich obowiązku wobec Ojczyzny;\nc) formować w ramach armii od pięciu do dziesięciu, zależnie od sytuacji, kompanii karnych, liczących od 15 do 20 ludzi każda, do których kierować szeregowych żołnierzy i młodszych dowódców winnych naruszenia dyscypliny wskutek tchórzostwa lub chwiejności, i kierować je na trudne odcinki frontu, aby dać im możliwość odkupienia krwią swych zbrodni przeciwko Ojczyźnie.\n\n3. Dowódcom i komisarzom korpusów oraz dywizji:\na) bezwzględnie usuwać ze stanowisk dowódców i komisarzy pułków oraz batalionów, którzy dopuścili do samowolnego wycofania podległych im oddziałów bez rozkazu dowódcy korpusu lub dywizji, odbierać im ordery i odznaczenia oraz kierować ich do rad wojennych frontów przed sąd wojenny;\nb) udzielać wszelkiej możliwej pomocy i wsparcia oddziałom zaporowym armii w umacnianiu porządku i dyscypliny w podległych jednostkach.\n\nRozkaz należy odczytać we wszystkich kompaniach, batalionach, bateriach, szwadronach, oddziałach, dowództwach i sztabach."
dgr_nazbol.25.a: "W śmierci, pokuta"

