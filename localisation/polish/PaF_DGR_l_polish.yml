 DGR_federation_council: "Rada Federacji"
 DGR_federation_council_desc: "Rada Federacji jest organem doradczym, w którym władze regionalne będą miały swoją reprezentację na szczeblu centralnym, a ich przedstawiciele będą powoływani przez rząd centralny. Na razie może wydawać się bezużyteczna, ale zapewni naszemu państwu niezbędny impuls decentralizacyjny, by osiągnąć to, do czego dążymy. Bo w głębi serca jesteśmy przecież demokratami, niezależnie od tego, co mówią o komunistach."
 DGR_housing_complaints_and_grievances_office_spirit: "Biuro do spraw skarg i zażaleń domowników"
 DGR_housing_complaints_and_grievances_office_spirit_desc: "Ludzie muszą żyć razem. A kiedy to robią - nieuniknione są konflikty. Mogą być błahe albo całkiem poważne, ale każdy z nich może doprowadzić do destabilizacji całego sąsiedztwa. A niestabilne sąsiedztwo nie służy ani miastu, ani mieszkającym w nim ludziom. Sytuacja może szybko eskalować, więc musimy działać szybko - zażegnywać te konflikty, jednocześnie wysłuchując wszystkich potrzeb i oczekiwań mieszkańców, by upewnić się, że niczego im nie brakuje. I... oczywiście nie chodzi tylko o słuchanie ich. Chodzi też po prostu o... słuchanie."
