 nationals_too_powerful_tt: "§RUwaga - jeśli popularność neonacjonalistów przekroczy 35%, dokonają zamachu stanu. Spróbuj zwolnić tempo ich poskramiania, dopóki ich wpływy nie spadną do możliwego do opanowania poziomu.§!"
 nationalist_coup_soon_tt: "§ROsiągnięto punkt krytyczny. Jeśli popularność neonacjonalistów nie spadnie poniżej 35%, zanim upłynie 35 dni, nacjonaliści rozpoczną wojnę domową. Decyzje pozwalające poradzić sobie z zamachem stanu odblokowano w interfejsie.§!"
 nationalist_coup_tt: "§RNie udało ci się powstrzymać nacjonalistów. Naprawdę? Tak trudno było nie kliknąć przycisku w wirtualnej grze? Teraz jedyne, czego możemy być pewni, to że Dąbrowa nie zjednoczy Polski. Zawiodłeś po całości, wyłącznie dlatego, że chciałeś przyspieszyć procesy, które wymagają czasu. Wstyd.§!"
 crisis_averted_tt: "§GZagrożenie nacjonalistyczne na razie spadło do możliwego do opanowania poziomu. Dopóki nie pozwolimy ich wpływom ponownie wzrosnąć do 35%, nie powinniśmy mieć z nimi problemów.§!"
