DGR_national_security_comission_desc: "A więc wojna. Przez chwilę liczyłem na to że wielce szanowna rada polityczna się łaskawie odpierdoli od ich wyobrażeń na temat strategii wojskowej. Ale oczywiście muszą dorzucać swoje trzy grosze na tematy na które nie mają zielonego pojęcia. Narodowa Komisja Bezpieczeństwa. Raczej Narodowa Komisja Pilnowania Nacjonalistów Żeby Czasem Nie Wygrali Wojny Sami. Walczyć z wrogiem to łatwe. Walczyć z betonem politycznym...to już pozwólcie mi lepiej szarżować rowerem na czołgi. Towarzysz Szwej wywodzi się jeszcze z czasów gdzie jedyną preferowaną taktyką było \"Kupą mości panowie, kupy nikt nie ruszy\".\nNajgorsze że komisja będzie decydować o przeznaczeniu budżetu wojskowego na konkretne projekty. Czeka mnie bardzo dużo przekonywania i gry politycznej żeby to były sensowne inwestycje."
DGR_nationalise_brembo_desc: "Liczyłem na to że przekształcimy zakład Brembo w fabrykę części do pojazdów wojskowych. Póki co jedyne co dostałem to nacjonalizacja zakładu i bardzo długie walki wewnętrzne o to kto będzie w nowym zarządzie. O transformacji linii produkcyjnej nie ma mowy dopóki leśne dziadki nie rozparcelują między siebie stanowisk. Fabryka ta produkowała układy hamulcowe przed wojną, i jedyne co mogę dostać to tony właśnie tarcz i klocków hamulcowych. Nie wiem czy to jest prześmiewcze, w końcu nikt tak bardzo nie hamuje inwestycji jak partyjniacy. Na dłuższą metę chociaż przynajmniej zakład się przyda, jak już zacznie pracować."
DGR_connect_unused_railways_desc: "Wiele linii kolejowych, zarówno pasażerskich jak i towarowych w mieście podupadło. A przecież mamy jedną z najpotężniejszych sieci kolei towarowej w kraju. Same pociągi były też jednym z kluczowych elementów wsparcia podczas oczyszczania miasta. Musimy odbudować zniszczone tory. Otoczyć miasto siecią połączeń kolejowych by być w stanie przemieszczać sprzęt w mgnieniu oka na każdy możliwy odcinek frontu. A może jeszcze kilka pociągów pancernych zrobimy?"
DGR_logistical_behemoth_desc: "Sławkowski Euroterminal jest jednym z najważniejszych punktów przeładunkowych w tej części Europy, leży niedaleko przecięcia dwóch Paneuropejskich Korytarzy Transportowych, oraz ma połączenia z najważniejszymi zakładami przemysłowymi w naszym mieście. Logistyka będzie kluczowa w obecnych wojnach. Watażkowie rzucają swoich żołnierzy w morderczych marszach bez wsparcia, odpowiedniego zaopatrzenia i transportu. Może ich stać na taką idiotyczną taktykę marnowania swoich ludzi ale nas nie. Ciężarówki, pociągi, terminale przeładunkowe, centra logistyczne. To jest fundament zdrowej armii. Takiej, w której każdy żołnierz będzie chciał służyć."
DGR_commandeer_museum_vehicles_desc: "Kto daje i odbiera ten się w piekle poniewiera. Tak, to prawda. Ukradliśmy pojazdy z muzeum by zrobić zamach stanu na Bazylaku. Ale trzeba było pilnować! Pojazdy wróciły do swojego oryginalnego miejsca po tym jak zostały porzucone przez nas. Nikt inny nie umiał ich na szczęście obsługiwać więc stały pod urzędem przez kilka miesięcy. Ale dlaczego mamy z nich nie skorzystać? To nadal są maszyny na chodzie, przezbrojenie nie zajmie wystarczająco długo a teraz przydadzą się jak nigdy. Poza tym, przywykłem przez tę parę godzin do tych stalowych bestii. Bierzemy ze Sztygarki co się da."
DGR_secret_files_of_bankhutte_desc: "Nie dowierzam swoim oczom. Okazało się, że coś co było tylko początkowo szaleńczą myślą która wykiełkowała w mojej głowie, ziściło się! Moi ludzie przeczesali wzdłuż i wszerz wszelkie dokumenty archiwalne z Huty Bank...wybaczcie, z Huty Dzierżyńskiego. To co tam znaleźli...o rany! Nie wiem jakim cudem to przetrwało lata komunizacji, dekomunizacji i rekomunizacji ale znaleźliśmy techniczne dokumenty dotyczące czołgów budowanych tutaj podczas II Wojny Światowej. Niemcy bowiem składali tutaj Pantery i Tygrysy! Niestety, dokumentów do rakiet V1 i V2 nie ma. A szkoda. Ale nadal, jeśli wszystko pójdzie zgodnie z planem, będziemy w stanie wyprodukować swoje własne Panzerkampfwageny. Oczywiście przechrzczone na modłę komunistyczną, z ulepszonymi mechanizmami i nowocześniejszym uzbrojeniem. Tylko wyobraźcie sobie miny wrogów!"
DGR_first_mixed_brigade_desc: "Nie samą piechotą armia żyje. Żeby wyrwać się na północne rubieże Jury i Zagłębia będziemy potrzebowali manewrowości i pojazdów które potrafią przebijać się przez trudne tereny. Tak, myślę do przodu ale tylko w ten sposób będziemy przygotowani na wszystko. Potrzebujemy brygady pancernej z prawdziwego zdarzenia. Okej, może nie do końca damy radę wystawić prawdziwą. Ale jak zbierzemy wszystkie nasze złomy, odłączymy je od wsparcia piechoty, dodamy nowo wyprodukowane pojazdy i scalimy w jedną pancerną pięść, wtedy będziemy mieli przynajmniej jakiś element siły. To więcej niż mają inni. A będzie to wielka przewaga."
DGR_restore_jw_sulno_desc: "Za komuny na Sulnie istniała jednostka wojskowa. Początkowo jako hotele dla robotników którzy brali udział w budowie pobliskiej mikrohuty. Obecnie jest to idealne miejsce do ulokowania na nowo tam jednostki wojskowej, ze względu na bliskość miasta Sosnowiec. Poza tym, będziemy musieli gdzieś zakwaterować naszych żołnierzy których liczba nieustannie rośnie. Nie mogą wiecznie spać w hotelu, jest to absurdalne względem środków bezpieczeństwa. No i nie powinni mieć za dobrze, w końcu to wojsko a nie wakacje all inclusive."
DGR_fortify_slawkow_desc: "Sławków jest bardzo odsłonięty na ataki ze strony zarówno Sosnowca jak i Jaworzna. Przez to że jest naszym kluczowym punktem logistycznym, nie możemy go pozostawić na pastwę losu. Toteż niezbędnym posunięciem taktycznym jest ufortyfikowanie Euroterminalu i wszystkich odsłoniętych linii kolejowych. Cholerny las nie ułatwia nam pracy. A bandy wroga tylko czekają na moment słabości żeby uderzyć w nasze newralgiczne punkty. Trzeba będzie oddelegować ludzi do strażnic...jakbym nie miał wystarczająco problemów z zasobami ludzkimi."
DGR_turn_mydlice_into_fortress_desc: "Już od czasów bitwy o Stalingrad świat poznał jaki jest horror wojny miejskiej, każde z wielkich blokowisk komunistycznych obecnie jest fortecami które są idealnym miejscem do obrony. Po co komu bunkry, skoro betonowa dżungla pełni tę samą rolę za mniejszą cenę? Trochę zbrojonego betonu sprawia, że wróg pomyśli dwa razy zanim zdecyduje się wejść w pułapkę gdzie z każdego okna może lecieć w niego grad pocisków. Rozmiar dużych wieżowców powoduje również że nic się przed nami nie ukryje. A jeśli nawet dotrą do jednego budynku to będą go musieli oczyścić piętro po piętrze, mieszkanie po mieszkaniu, pokój po pokoju. Cena jaką będą musieli zapłacić za zdobycie takiej twierdzy jest nieopłacalna."
DGR_officers_in_gangs_desc: "Możliwe, że trochę pospieszyliśmy się z rozstaniem z mięsa armatniego jaki prezentowali sobą gangi. Będziemy musieli się z nimi przeprosić, gdyż godzina próby nastała i wysiłek wojenny wymagany jest od wszystkich. Ale! Nie ma mowy że damy im po prostu broń i puścimy samopas. Do każdej jednostki złożonej z gangusów zostanie przydzielony nasz oficer. Tak zapewnimy sobie kontrolę na każdym szczeblu i zniwelujemy możliwości buntu czy niesubordynacji."
DGR_political_commissars_desc: "Świstu gwizdu, moje marzenia poszły w pizdu. Liczyłem na oficerów którzy będą odpowiadali przed moim autorytetem, a nie betonowych ideologicznych politruków którzy każde przewinienie regulaminu będą uprzejmie donosić do zarządu partii. Zgaduję, że na ich miejscu pewnie bym zrobił to samo. Nie szkodzi. Indoktrynacja i całkowite wypranie mózgu osobnika zajmuje bardzo długo, co sprawia że tacy komisarze są bardzo cenni. A nasi gangusi nie obchodzą się zbyt dobrze z granatami...wypadki chodzą po ludziach."
DGR_partisan_blitzkrieg_desc: "Rozległa powierzchnia naszego miasta sprawia że szerokofrontowa wojna manewrowa może rozwinąć skrzydła tutaj. Ale mnogość lasów, jezior, blokowisk i ogólnej różnorodności w biomach sprawia że przede wszystkim możemy prowadzić wojnę podjazdową. Obrona naszego terenu nie jest tak przerażająca kiedy każdy jeden zakątek nadaje się na kryjówkę dla partyzantów. Znajomość terenu lokalnego zdecydowanie przeważy szalę na naszą stronę, każdy jeden najmniejszy park będzie dla najeźdźców Afganistanem czy innym Wietnamem."
DGR_revenge_at_czarzasty_desc: "Włodzimierz Czarzasty. Najbardziej znienawidzona postać przez każdego kto ma mniej niż 60 lat. No chyba że masz 140 lat i jesteś komunistą jak towarzysz Szwej. Czarzasty od zawsze uważał Zagłębie za bastion własnego poparcia. Ale za to co zrobił z lewicą...prawica mu pogratuluje a lewicowcy będą chcieli jego krwi. Jego tradycjonalistyczne wizje są niereformowalne, a jego pogardliwy ton wobec wszystkich innych członków byłej już na szczęście Międzypowiatówki stał się już legendarny. Teraz odpłacimy mu się pięknym za nadobne. Wszak jak to mówił inny lider lewicy, mężczyznę poznaje się po tym jak kończy. A Czarzasty skończy tragicznie."
DGR_strike_back_at_antifa_desc: "Jeszcze bardziej od pogardliwego duo z Sosnowca nie znoszę hołoty z Jaworzna. Anarchokomuniści z Antify nie mają poszanowania dla nikogo. Czy to ziobrystów czy to nas, czy ślązaków, wszystkich ograbią, napadną i nazwą faszystami. Dość już mam kolejnych 'incydentów' granicznych gdzie kolejne bandy robią sobie z naszej granicy skłot. Musimy w nich uderzyć, i musimy zrobić to na tyle mocno, żeby nie mieli nawet szans żeby podnieść swoich przećpanych łbów. Czarny terror Antify dobiegnie końca dzisiaj!"
DGR_annexation_of_zagorze_desc: "Zagórze. Kiedyś odrębne miasto, potem przyłączona część Sosnowca. Bardzo blisko związana z Dąbrową Górniczą. Nie oszukujmy się - większość populacji mieszkała tam tylko dlatego żeby dojeżdżać do pracy w dąbrowskich hutach. Więc po co robić więcej problemów niż jest to potrzebne i stawiać granicę pomiędzy tymi dwoma ośrodkami miejskimi? Po prostu anektujmy Zagórze jako prawowitą dzielnicę Dąbrowy Górniczej. Tak jak zawsze powinno być. Przynajmniej granice będą ładniejsze, i sensowniejsze."
DGR_railway_siewierz_zabkowice_desc: "Potrzebujemy pilnie połączenia kolejowego które by biegło od naszych ośrodków przemysłowych do lotniska w Pyrzowicach. Póki co trasa biegnie przez Zawiercie, ale po co tam jeździć i zawracać skoro będzie można poprowadzić kolej prosto przez Siewierz i Mierzęcice? Samo lotnisko będzie nam służyło jako okno na świat, a tym oknem zamierzamy zacząć przerzucać bardzo dużo towarów. Na eksport oraz import. Zanim wyremontujemy drogi to lepiej i taniej będzie zainwestować po prostu w pociągi."
DGR_connect_lagisza_desc: "Przemysł będziński przeżywa bardzo trudne chwile. Cementownia w Grodźcu, Huta Będzin, kopalnia Grodziec, fabryka butów. Żaden z tych zakładów już nie istnieje. Sama elektrownia w Łagiszy działa jedynie z około 20% nominalnej mocy. Oto do czego doprowadziły rządy kapitalistyczne. Kluczowa gałąź gospodarki jest cieniem samej siebie. Od elektrowni przez kopalnie, właśnie na hutach kończąc. Musimy przywrócić odpowiednią siłę będzińskiego przemysłu integrując go z naszym wielkim kombinatem industrialnym. Dając impuls od siebie reaktywujemy krok po kroku wszystkie zamknięte zakłady, i będzie to fantastyczna inwestycja w przyszłość. A zaczniemy od huty stali."
DGR_question_of_leadership_desc: "Samozwańcza stolica Zagłębia upadła. Jak w ogóle śmieli się zwać ową stolicą, skoro sama nazwa wskazuje że Zagłębie jest DĄBROWSKIE. Nie Sosnowieckie. Ale już pomijając etymologię, trzeba przyznać że Czarzasty stworzył tutaj silne struktury partyjne, coś co nie udało mu się osiągnąć przez tyle lat w całym kraju. Niby wszyscy byli naszymi przeciwnikami, i wiadomo - wiele z nich nie będzie chciało się zradykalizować by dopasować naszym poglądom. Ale może niektórych uda się przekonać że to nasza droga jest tą słuszną. Kwestia pozostaje, czy my w ogóle chcemy takich ludzi?"
DGR_evict_squatters_desc: "Doprawdy, jak bardzo można krytykować gospodarkę kapitalistyczną, tak zjawisko skłotów jest po prostu ohydne. Nie ważne kim jesteś, ile zarabiasz i co sobą prezentujesz - jeśli u twoich drzwi pojawią się bandyci z Antify, możesz być pewnym że twoja posiadłość zamieni się w siedlisko najgorszej lewicowej degeneracji. Tak się stało z ogromną ilością mieszkań w Jaworznie - czarne brygady musiały gdzieś się zagnieździć, więc po prostu wyrzucali losowych ludzi - nie ważne czy lewicowy czy prawicowy, stary czy młody, zamożny czy biedny - wszystkim równo, wszystkim gówno. Ale teraz nastanie czas sprawiedliwości. Nie ostanie się żaden skłot."
DGR_railway_around_myslowice_desc: "W Szczakowej, północnej dzielnicy Jaworzna znajduje się bardzo duża stacja kolejowa łącząca wiele linii ze sobą. Tak się składa że potrzebujemy dostępu do niej, bramy kolejowej która otworzy nam drogę do metropolii Śląskiej ale nie będzie prowadziła do Katowic. Do Mysłowic może lepiej też nie, trochę za dużo tam było bajzlu z partyzantami i sabotażystami. Ale jeżeli poprowadzimy nową linię od Euroterminalu przez Jaworzno i Imielin, będziemy mieli bardzo łatwą drogę do oskrzydlenia metropolii, oraz handlu z Podbeskidziem i południową Małopolską."
DGR_connect_jaworzno_desc: "Na całe szczęście dla Jaworzna, prawdziwi mistrzowie przemysłu wrócili i przejmują stery. Zespół Elektrowni w Jaworznie w połączeniu z resztą naszej sieci energetycznej zapewni nam praktycznie niezależność od importu w całym regionie. A całkowicie zdemolowany przemysł Jaworzna będzie musiał zostać gruntownie odbudowany. Tereny rekreacyjne? Na co to komu, skoro ludzie głodują! Na pierwszy rzut pójdzie odbudowanie huty szkła w Szczakowej. A potem przywrócimy inne zapomniane przez rządy elementy potęgi przemysłowej tego miasta."
DGR_question_of_councils_desc: "Zastanawiam się jakim cudem anarchiści cokolwiek osiągali. Ich wspólnoty to nic innego jak inna forma zepsutej demokracji. Dodać do tego, że każda z nich działała dla własnego zysku to można by wręcz rzec że to nie anarchokomunizm a po prostu bardzo dziwna forma anarchokapitalizmu. W końcu minister Gdula jest tego najlepszym przykładem - jest to istny heros rynku nieruchomości! Jak tacy ludzie mogą w ogóle udawać że prezentują ideały socjalistyczne? Ja chociaż wprost mówię, że takich nie posiadam. No, może czasem."
DGR_reclaim_greater_zaglebie_desc: "Zagłębie to nie tylko Dąbrowa Górnicza, Sosnowiec i Będzin. Jaworzno w sumie niezbyt się kwalifikuje nawet. Ale Zagłębie to również Olkusz. To również Zawiercie. Oraz Myszków. Jak tak dalej idziemy to w sumie możemy też Częstochowę wciągnąć żeby nie czuła się osamotniona w tym wszystkim. Sprawa jest prosta, po prostu teraz już jesteśmy zbyt rozpędzeni żeby zatrzymać się jedynie na kilku miastach zagłębiowskich. Już chyba wiem jak czuł się Trocki ze swoją permanentną rewolucją..."
DGR_red_star_over_jasna_gora_desc: "Jasna Góra. Symbol polskiego katolicyzmu. Kościół był zawsze w dość ambiwalentnej relacji wobec komunizmu. Tak, wiadomo - kardynał Wyszyński, ksiądz Popiełuszko, Jan Paweł II niszczył małych komunistów. Ale gdy będziemy stać po stronie narodu, nie możemy właśnie odrzucać tego ducha chrześcijańskiego na rzecz jakichś ateistycznych wymysłów młodych lewicowców. Wiara w potwora Spaghetti nie spoi rozdartego narodu. Tylko błagam, trzymajmy tych księży z dala od młodych chłopców. Nie chcemy powtórki z naszej plebanii..."
DGR_adjust_jura_factories_desc: "Myszków i Zawiercie od dawna są związane z istnieniem na ich terenach ciężkiego przemysłu. W dodatku w zakładzie Światowit produkowali pralki Frania! Kto by nie chciał takiego cuda teraz, gdy właśnie na nią będzie idealne zapotrzebowanie! Ale..no tak, oprócz pralek to zakłady metalurgiczne z Jury perfekcyjnie wkomponują się w nasz schemat gospodarczy. Trzeba kuć żelazo póki gorące, a więc natychmiast rozpocząć restrukturyzację zakładów i przestawienie produkcji tak by odpowiadały naszym rosnącym potrzebom.\nGłównie wojennym..."
DGR_play_like_its_82_desc: "Tak chcą grać? No dobrze, proszę bardzo. Niech nie zapominają za czyjej władzy Polska reprezentacja osiągała największe sukcesy. Ja wiem że to już schyłek, że to stan wojenny. Ale nadal, to wiele mówi o naszym społeczeństwie sportowym. A od tamtej pory co? Ćwierćfinał na Euro 2016 i wpierdol z potęgami jak Mołdawia, Kazachstan czy Wyspy Owcze. Trener Brzęczek może ma słuszne idee, ale brakuje mu solidnego aparatu państwowego i zajebiście dużej armii. A tę akurat mamy. Nie można zbudować wojska opartego na dresiarzach. Och, chwila...w zasadzie to my tak zrobiliśmy."
DGR_death_forests_of_lubliniec_desc: "Lubliniec miał być spacerkiem, tereny te nie należą do silnie zurbanizowanych, ani specjalnie położonych na szczególnych strategicznych punktach. A jednak, walka na tych przeklętych polach nie należy do przyjemnych, a sama walka z komandosami do łatwych nie można zaliczyć. Nawet, a może i przede wszystkim po ich kapitulacji. Szczególnie że mają do dyspozycji zajebiście wielkie lasy w których kryją się niczym żołnierze wyklęci. Jak my ich stamtąd wykurzymy?"
DGR_imagine_shrooms_desc: "Posłałem ludzi na rzeź. Nawet nie chcę myśleć o tym ile bezsensownych śmierci nastąpiło w tych przeklętych lasach. Nie pomogło nawet ich podpalenie. Wręcz przeciwnie, jestem pewien że przez ogień do strat należy doliczyć kilkadziesiąt żołnierzy z post traumatic stress disorders. Od Woźników po Pawonki, trup ściele się gęsto a pożoga jeszcze przez kilka tygodni będzie dawała nam do zrozumienia że popełniliśmy kurwa gigantyczny błąd. A przecież jeszcze trzeba to ugasić i pozbierać trupy zanim użyźnią glebę grzybom."
DGR_offer_for_supreme_coach_desc: "Panie Brzęczek, szanuję Pana. Chłop ideowy - ambitny, oraz z niezwykłym zapałem do realizowania swoich celów. Niestety, po złej stronie barykady. Ale spokojnie, wszyscy Polacy to jedna rodzina, a sama ideologia marksizmu-klubizmu jest na tyle histerycznie śmieszna że aż szanuję za realizację takiego absurdu w całkowicie poważny sposób. Doprawdy, jest to idea lepsza niż większość ruchów lewicowych. Nie mówię, że bym był chętny ją realizować, ale takich ludzi nasza sprawa potrzebuje. Osobiście nawet byłbym skłonny przekonywać go do naszych racji, oczywiście oferując amnestię dla jego najbliższych współpracowników i autonomię dla klubów. A jak nie to zawsze Tęcza Błędów potrzebuje nowego trenera..."
DGR_question_of_church_desc: "Częstochowa jak na religijną stolicę Polski jest dość socjalistyczna. W końcu od 2010 rządził tam prezydent z Lewicy. Jeden z niewielu którzy się ostali w kraju. Podobnie jak i u nas w Dąbrowie. Czy dałoby się może z tej religijnej mieszanki wyciągnąć co potrzebne i zrobić coś ciekawego? Na przykład, nacjonalizm wywodzący się z tradycji kościoła katolickiego w Polsce oraz socjalistyczne przywary Jezusa w Biblii. W końcu on był jednym z największych socjalistów jak to mawia klasyk. Wydaje mi się, że towarzysz Konieczny (ten z PPSu, nie bandyta z Antify) miał słuszność próbując tutaj tworzyć ludową organizację religijną. Powinniśmy z nim o tym poważnie porozmawiać."
DGR_great_combine_desc: "Co jest lepszego od jednej huty? Wiele hut pracujących w tym samym celu. Po co marnować czas i pieniądze na zarządzanie kilkoma takimi zakładami jednocześnie skoro można z nich utworzyć gigantyczny centralny kombinat metalurgiczny który wypełni bez problemu każde zlecenie w mgnieniu oka? Kompatybilność i wymienność pomiędzy konkretnymi jednostkami będzie o wiele bardziej opłacalna niż rozbicie tego na poszczególne podmioty. Albo po prostu chuja się znam na ekonomii i pieprzę głupoty. Ah, i tak mam większe kompetencje niż nasz minister gospodarki."
DGR_avanti_popolo_desc: "Narodowa Armia Ludowa zwyciężyła! Od Częstochowy po Jaworzno ludzie się mogą cieszyć bo nadeszła wiekopomna chwila w której to po wielu latach w końcu jesteśmy gospodarzami w naszych własnych miastach. Cały region zasługuje na ten ogromny zryw rewolucyjny - to my jesteśmy przemysłowym sercem Polski, a Śląsk to paskudny stary chlew. W nas tkwi iskra pionierów którzy odrodzą ten kraj! Każdy z nas jest zwiastunem wielkości, sprawiedliwości oraz równości. I możecie być pewni - zaniesiemy reszcie kraju ten kaganek wolności ludowej. Prędzej czy później."
 

DGR_we_forge_our_tomorrow: "Nasze jutro wykuwamy dzisiaj!"
DGR_we_forge_our_tomorrow_desc: "Momentami zastanawiam się czy to co robię ma jakiekolwiek znaczenie. Jestem tylko narzędziem losu, który będzie można wyrzucić po skończonej robocie. Nieważne jaką ścieżkę wybiorę, na końcu i tak okazuje się, że to nie ja wybieram. Gra jest ustawiona od początku. Nacjonalizm, komunizm, poganizm, nieważne. Trzeba po prostu zagrać swoją rolę dobrze. Może wtedy jakaś sposobność się zdarzy na zmianę statusu quo rzeczywistości. Ale póki co to chyba chwała ludowi pracującemu miast i wsi, co nie? Idziemy wykuwać nową przyszłość, narodowo-ludową. Ile jeszcze takich haseł będziemy z siebie wypluwać zanim przestaną one mieć znaczenie?"
DGR_unity_congress: "Kongres Jedności Klasy Robotniczej"
DGR_unity_congress_desc: "Partia wzywa. Współczułbym samemu sobie, gdybym tylko miał wstęp na ten kongres klasy robotniczej, ale niestety wojskowi nie są mile widziani. Mógłbym się z tym kłócić, to my pracujemy najciężej żeby aparatczycy mogli sobie kisnąć w swoich urzędach i przede wszystkim cieszyć się wolnością i życiem. Ale mogą sobie robić i zjazd pierdolonego ONZ. Narodowa Armia Ludowa ma na tyle wpływu w kraju teraz że to nie ma znaczenia co sobie towarzysze zadecydują."
DGR_civilian_rule_under_army: "Cywilna władza pod wojskowym zarządem"
DGR_civilian_rule_under_army_desc: "Partyjniacy obradują, a armia decyduje. Jak to wszak towarzysz Wiesław mawiał - \"Władzy raz zdobytej nie oddamy nigdy\". I my na pewno naszej uprzywilejowanej pozycji względem władzy cywilnej nie zamierzamy oddawać. To my jesteśmy jedynym gwarantem istnienia naszego państwa, i to pod wojskowym sztandarem rozkwitnie przyszłość narodowo ludowa! To nie urzędnicy bronili Sławkowa przed najazdem czarnych band Antify, to nie oni rozbijali wrogów komunizmu w Zagłębiu, to nie oni zdobywali Jasną Górę. To armia. A armia...jest nasza. A tak po prawdzie...to moja."
DGR_recommunization: "Proces rekomunizacji"
DGR_recommunization_desc: "Są jednak pewne rzeczy na które nie mam wpływu jakkolwiek bym się starał. No ale z drugiej strony nic dziwnego. Retoryka i symbolika nacjonalistyczna już w Polsce jest i ma się dobrze. To tą komunistyczną trzeba przywracać i wygrzebywać z otchłani piekielnych. Tylko wtedy idea narodowego komunizmu zostanie osiągnięta kiedy oba te pierwiastki będą się w sobie mieszać i wzajemnie balansować. Byle żadna z tych idei nie przesadziła. No chyba że będziemy to my. My możemy."
DGR_symbolism_act: "Ustawa o symbolach"
DGR_symbolism_act_desc: "Sierp i młot w Polsce zawsze były traktowane za równoważną ohydność co swastyka. I akurat niewiele się w tej kwestii zmieni, więc używanie ich powinno odejść do lamusa. Jeżeli chcemy być traktowani jako poważny ruch a nie szufladkowani na równi ze Stalinem i Bierutem to musimy wypromować własne symbole. Czerwona błyskawica i czerwony młot. Czy jest coś bardziej subtelnego i mocniejszego niż połączenie tych dwóch elementów? W końcu młot wykuje żelazny miecz którym pokonamy wszystkich naszych wrogów. Błyskawicznie. "
DGR_authority_dilemma: "Dysonans autorytetów"
DGR_authority_dilemma_desc: "Józef Stalin nie zrobił niczego złego. Che Guevara był rewolucyjnym bohaterem. Te i inne podobne stwierdzenia często krążą po lewicy. Ale tak jak prawica hołduje mordercom, tak i lewicy zdarza się stawiać na piedestał istne szumowiny. Nie możemy. Inaczej. Nie pozwolę, żeby w naszych kręgach ktokolwiek z polityków posługiwał się autorytetami które są absurdalne dla Polaka. A na koniec może i Marksa uda nam się odrzucić jako duchowego protoplastę całego komunizmu. W końcu Heglowskie idee będą nam bardziej pasowały niż bajania uprzywilejowanego Żyda, który nie przepracował ani jednego dnia w swoim życiu."
DGR_private_enterprises: "Prywaciarze"
DGR_private_enterprises_desc: "Kult przedsiębiorców sięgnął zenitu w naszym późnym kapitalizmie. Wyzysk zwykłych ludzi przez patologicznych kłamców uważających się za kręgosłup gospodarki polskiej był niewiarygodny. Ludzie zmuszeni byli do życia na takim wolnym rynku który nie gwarantował im nic. Przede wszystkim nie gwarantował im dożycia następnego dnia. Korporacje. Prywaciarze. Oszuści i złodzieje. Każdego z nich dosięgnie ręka sprawiedliwości. A ta ręka dzierży miecz, dzięki któremu damy każdemu z wyzyskiwaczy to na co zasługuje. I pod tym postulatem komunistycznym...podpiszę się obiema rękami."
DGR_fallen_monuments: "Odbudowa obalonych pomników"
DGR_fallen_monuments_desc: "Trochę to śmieszne jak niektóre placówki publiczne w Zagłębiu Dąbrowskim po ogłoszeniu aktu o odnowieniu zlikwidowanych monumentów komunistycznych nagle znalazły się w posiadaniu dawno zaginionych tychże pomników. Nagle okazuje się że dekomunizacja nie oznaczała zniszczenia jakichkolwiek symboli i odcięcia się od przeszłości, lecz była to jedynie akcja pod tytułem \"Schowajmy na później, może się przyda jeszcze\". No i teraz im faktycznie się przyda. Skąd oni to do cholery wiedzieli?"
DGR_living_factory: "Fabryka Pełna Życia"
DGR_living_factory_desc: "Zakład pracy to twój drugi dom. I co prawda nie oznacza to że można tam nocować, ale powinny przy największych zakładach znaleźć się odpowiednie...atrakcje. Nowoczesne korporacje szczycą się że patrzcie - mamy specjalny game room z konsolami, kącik z książkami i piłkarzyki. Super. U nas powinny znaleźć się restauracje, bary i różne inne knajpy użytku publicznego. Napełni to kieszeni i podniesie morale zdecydowanie. Niech Fabryka Pełna Życia przy odrodzonym zakładzie Defum w Dąbrowie Górniczej będzie idealnym przykładem. Odnowiliśmy fabrykę, ale wszystkie puby i knajpy w okolicy zostały i służą robotnikom. Po pracy oczywiście, a nie w trakcie jej trwania."
DGR_security_service: "Przywrócenie służb bezpieczeństwa"
DGR_security_service_desc: "Zawsze chciałem mieć swoje własne służby bezpieczeństwa. Ale wygląda na to, że ten pomysł zostanie obrócony przeciwko mnie. Towarzysze z rządu bardzo starają się żeby zniwelować wpływy armii oraz posiadać jakąkolwiek formę obrony przed potencjalnym zagrożeniem z wewnątrz. Więc może trzeba będzie się zacząć spieszyć? Może to jest ten sygnał od losu? Bo inaczej za niedługo może się okazać że wszyscy najwyżsi oficerowie w najlepszym wypadku staną przed sądami, a w najgorszym...po prostu znikną."
DGR_government_reconstruction: "Rekonstrukcja rządu"
DGR_government_reconstruction_desc: "Rychło wczas. Od dawna powtarzałem że ta karykaturalna abominacja omyłkowo tylko zwana Frontem Ludowym nadaje się jedynie do wyrzucenia na śmietnik historii. Naczelny dziad komuny dąbrowskiej stwierdził że rząd przejdzie radykalną rekonstrukcję, a w nowo powołanym aparacie władzy znajdą się ludzie bardziej odpowiadający ideom naszego państwa. To w sumie śmieszne, jak bardzo obraził w tym momencie swoich jeszcze obecnych ministrów. Na ich miejscu wziąłbym sobie to do serca i uciekał póki jeszcze mogą to zrobić na własnych zasadach. Nie chodzi jednak o mnie. Prawda?"
DGR_silesian_faction: "Frakcja Śląska"
DGR_silesian_faction_desc: "Rozumiem, że Szwej czuje się osamotniony, ale tworzenie jakiejś grupy komunistycznych supertowarzyszy jest bezsensowne. Stworzymy jedynie zbrodniczy reżim który będzie zajęty walką o władzę pomiędzy sobą a nie walką z wrogiem. Nie potrzebujemy większej ilości komunistów. Szczególnie takich którzy nie wiedzą czy chcą wychwalać Gierka czy Gomułkę. A niektórzy to w ogóle popędzili daleko za wschodnią granicę i wolą Mao Zedonga. Jeszcze Deng Xiaoping byłby do przełknięcia...ale Maoiści? Następne co się dowiem to to że rekrutujemy polpotystów albo dżuczystów..."
DGR_cult_of_gierek: "Kult Edwarda Gierka"
DGR_cult_of_gierek_desc: "Jeśli jest osoba, która na Zagłębiu Dąbrowskim mogłaby się równać z Janem Pawłem II w kwestii mitologizacji i kultu to zdecydowanie jest to towarzysz Edward Gierek, pierwszy sekretarz PZPR w latach 70. Sam pochodził z Sosnowca więc to już jest plus dla niego. Ale wystarczy zapytać kogoś kto jeszcze miał szansę żyć w tamtych czasach to powie Ci, że towarzysz Gierek zbudował potęgę Zagłębia. To dzięki niemu Dąbrowa Górnicza rozwinęła się niewyobrażalnie. Jeszcze w 1970 populacja miasta wynosiła 60 tysięcy. Pod koniec jego władzy ta liczba wynosiła już 140 tysięcy, ponad dwukrotnie więcej! Jego inwestycje zbudowały podwaliny tego wspaniałego miasta, ujarzmił industrialny potencjał Zagłębia Dąbrowskiego i wykorzystał go do pełna. I za to ludzie nadal go kochają. Bo po nim...było już tylko gorzej."
DGR_partisans_faction: "Frakcja Partyzantów"
DGR_partisans_faction_desc: "Ja jako były partyzant, zdecydowanie mówię że powinniśmy iść tą drogą. Drogą nacjonalistyczno-ludową. Nie potrzebujemy większej ilości komunistów - czego natomiast potrzebujemy to silnej frakcji narodowej która będzie w stanie łączyć ludzi z różnych środowisk właśnie pod płaszczem nacjonalistycznej retoryki. Wtedy nie ważne czy ktoś będzie wyznawał Stalina czy Dmowskiego - będzie w stanie być zintegrowanym do naszych struktur. No i nie ukrywam - więcej sojuszników dla mnie w politbiurze."
DGR_civilian_apparatus: "Cywilny aparat władzy"
DGR_civilian_apparatus_desc: "I jak mogłem się spodziewać, frakcja gierkowska podnosi głos, że armia ma za dużo uprawnień, i jej wolność oraz wpływy muszą zostać radykalnie ucięte. Nosz ja pierdolę. Przytnijcie nam skrzydła i dziwcie się dlaczego nie lecimy. Jedyne co narazie na szczęście udało im się osiągnąć to rozwinąć cywilną administrację i rozpocząć konflikt cywilno-wojskowy. Im dalej w las jednak tym będzie gorzej. To się nie skończy dobrze - oni nie poprzestaną a my tanio skóry nie sprzedamy. Będzie wojna."
DGR_wide_socialist_front: "Szeroki front socjalistyczny"
DGR_wide_socialist_front_desc: "Cofam to co powiedziałem. To o polpotystach i dżuczystach. Bo faktycznie idziemy w tym kierunku. Na szczęście chyba jeszcze nie ma posadystów. Ale znając realia politbiura to tylko kwestia czasu. Szwej już ma pomysły z kosmosu, więc czym dla niego byłoby głoszenie o rewolucji komunistycznej przyniesionych przez kosmitów? Ja tylko pragnę przypomnieć - była już taka jedna próba zrobienia wielkiego socjalistycznego frontu. Ba, nawet kilka. W wyborach lewica zawsze chciała robić wielkie koalicje żeby wylądować ledwo ponad progiem wyborczym. A druga nazywała się Międzypowiatówka. Wszyscy pamiętamy jak skończyła."
DGR_progress_fund: "Fundusz Postępu Gospodarczego"
DGR_progress_fund_desc: "Mam wrażenie że już coś takiego było. Ah tak, Fundusz Postępu Gospodarczego już istniał. W zasadzie teraz widzę że ma takie same założenia - finansowanie rolników którzy ucierpieli podczas wojen. Oczywiście pomoc dostanie tylko jeżeli przygotuje ziemie do kolektywizacji albo przejdzie pod ochronę państwowych gospodarstw rolniczych. Cwany ruch, panie ministrze. Wszyscy wiemy że rolnicy nie odmówią takich grubych dotacji. Tylko żeby ten fundusz podziałał dłużej niż dwa lata tak jak jego poprzednik."
DGR_national_socialism: "...więc...narodowy socjalizm?"
DGR_national_socialism_desc: "Mamy silny socjalistyczny front polityczny. Mamy nacjonalistyczne elementy w armii. Więc...nie chcę być tutaj tym który tłumaczy podstawy matematyki, ale czy to by nie działało w stylu że to trochę jest...Narodowy Socjalizm? Może Socjalistyczny Nacjonalizm użyjcie, będzie wam łatwiej przechodziło przez gardło. Mogliście mieć prawdziwą rewolucję nacjonalistyczno-ludową a będziecie mieli dziwny amalgamat ludowych ideologii doprawionych antagonistycznym wobec was wojskiem. Związek Radziecki byłby dumny. III Rzesza nie do końca pomimo nazwy."
DGR_cult_of_moczar: "Duch Mieczysława Moczara"
DGR_cult_of_moczar_desc: "Kto nie z Mieciem, tego zmieciem. Pokłosie wojny frakcji w PRL nadal oddziałuje w naszym społeczeństwie, szczególnie teraz. Z jednej strony socjaliści wyznający Gierka, z drugiej my, narodowo-ludowi patrioci którzy potrzebują teraz równie mocnego symbolu co pierwszy sekretarz z Sosnowca. I nie ma lepszego wyboru niż Mieczysław Moczar, który ucieleśniał sobą ideę narodowo-komunistyczną i odchylenia prawicowo-nacjonalistyczne. To będzie ta postać której duch spoi nasze polityczne środowisko w jednej idei. Tylko przyhamujmy póki co z antysemityzmem."
DGR_military_government: "Wojsko w służbie rządu"
DGR_military_government_desc: "Jeżeli problemem towarzysza Szweja było to że wojsko ma o wiele większy wpływ na rzeczywistość niż rząd, mam dla niego rozwiązanie. Po prostu wprowadźmy wojskowych do rządu. Prawda że proste? Dość już przyjmowania bezrefleksyjnie idiotycznych regulacji politycznych z góry. Narodowa Armia Ludowa musi stać się oficjalną egzekutywą naszego kraju, bo tylko w ten sposób może się ziścić prawdziwa rewolucja. Zakończymy raz na zawsze wszelkie potyczki wewnątrz rządu i polityków. Przyda im się prawdziwy wojskowy dryl. Jak wystarczająco głośno krzykniemy...to się zgodzą na wszystko."
DGR_ideological_purity: "Czystość ideologiczna"
DGR_ideological_purity_desc: "Co za dużo to niezdrowo. Rozdrobnienie ideologiczne nie służy jedności i sile naszego państwa. Już to przerabialiśmy w przypadku zjednoczonego frontu na Zagłębiu, prędzej czy później lewicowcy rzucą się sobie do gardeł i nic nie powstrzyma ich przed rozniesieniem na strzępy nawet największego mocarstwa. Myślę że jesteśmy gotowi na fazę drugą. Na to co tworzyłem tutaj od momentu w którym stwierdziłem że sprzeniewierzenie się swoim ideałom i dołączenie do Frontu Ludowego będzie inwestycją w przyszłość. A przyszłość już nadeszła. Stoimy na skraju wspaniałej kreacji, wspaniałej rewolucji która odrodzi ten kraj."
DGR_army_lobbying: "Promowanie interesów wojska"
DGR_army_lobbying_desc: "Sprawa jest bardzo prosta. Nie po to wchodzimy do rządu, żeby nie czerpać z tego korzyści. A że każdy nasz zysk jest inwestowaniem w bezpieczeństwo naszego narodu to już kwestia pośrednia, ale dobrze że wynikająca z tego całego cyklu. Nie będziemy musieli się już wiecznie prosić politbiura, albo grozić im buntem żeby coś dostać. Teraz po prostu weźmiemy to co nam jest należne, i żaden minister narzekania narodowego nie będzie w stanie nas przed tym powstrzymać. Wzmocnimy armię do tego stopnia, że wszystkie moje marzenia będą w stanie zostać zrealizowane. A są one wielkie."
DGR_national_bolshevism: "Rewolucja narodowo-bolszewicka"
DGR_national_bolshevism_desc: "Nadchodzi taki czas w historii ludzkości, kiedy wybitne jednostki stają na rozdrożu losu i są zmuszone do ciężkich wyborów które zaważą o przyszłości wielu. Narodowa Armia Ludowa jest gotowa. Nasi ludzie wewnątrz instytucji rządowych również. Pałac Kultury Zagłębia zostanie otoczony. Towarzysz Szwej uda się na wymuszoną długą rozmowę ze mną. Powyjaśniamy sobie parę rzeczy, i tym razem nie skończy się to tak jak wcześniej. Wyciągnęliśmy wnioski. I niech mnie piekło pochłonie jeśli teraz miałoby się to nie udać. Plan był szykowany latami, urodziłem się dla tego momentu. Poprzednia porażka była tylko elementem który miał mnie przygotować do dzisiejszego dnia. Narodowy Bolszewizm, albo śmierć."
DGR_5_year_plan: "VII Plan Pięcioletni"
DGR_5_year_plan_desc: "Plany gospodarcze są spoko. Zamiast chaotycznego inwestowania w cokolwiek przyniesie światowa ekonomia i te wszystkie teorie o popycie i podaży, my wypełniamy krok po kroku założenia. Kapitaliści są wściekli, bo przecież nie, nie możecie tak arbitralnie zadecydować w którym roku będziecie budować jakie gałęzie ekonomii, tak nie wolno, pomyślcie o Hayeku. W piździe mam austriaków i ich zasraną szkołę gospodarki, nic tak nie niewoli ludzi jak kapitalizm. My wiemy czego potrzebują ludzie, i będziemy trzymać ster by wypełnić siódmą pięciolatkę w historii istnienia Polski. Siódma. Sześć poprzednich wyraźnie pokazało że efekty są pozytywne."
DGR_heavy_industry_nationalisation: "Nacjonalizacja przemysłu ciężkiego"
DGR_heavy_industry_nationalisation_desc: "Ciężki przemysł to sól tej ziemi. Od jego prawidłowego funkcjonowania zależy cały dobrobyt państwa, to na nim oparta jest cała gospodarka narodowa. Dlatego też nie może dojść do sytuacji w której jakiś prywatny podmiot miałby dyktować warunki państwu poprzez to, że miałby posiadać jakiś kluczowy sektor gospodarczy. Nie. Wszystkie strategiczne pozycje ekonomiczne oraz przemysł ciężki muszą należeć do państwa by być w stanie zapewnić to, że będą one pracować na rzecz narodu, a nie dla wzbogacenia się jakiegoś prywaciarza kosztem przyszłości jego kraju. Tylko znacjonalizowane zakłady będą mogły być zadbane przez włodarzy niczym jego najdroższa rodzina."
DGR_restore_defunct_plants: "Rewitalizacja upadłych fabryk"
DGR_restore_defunct_plants_desc: "Plan Balcerowicza i jego konsekwencje były tragedią dla polskiego narodu. Gospodarka całkowicie zrujnowana, przedsiębiorstwa masowo bankrutowały, a ogromne rzesze ludzi zostały bez pracy i bez perspektyw na życie. To jak bardzo liberalne rządy przez następne dziesięciolecia starały się zabić wszelkie przejawy polskiej gospodarności zasługuje na osobną kategorię zdrad narodowych. Całe gałęzie - górnictwo, hutnictwo, stocznie, przemysł motoryzacyjny. Wszystko upadło, ale Ci którzy za to odpowiadają nie ponieśli nigdy żadnych konsekwencji. Teraz odpowiedzą. A my krok po kroku przywrócimy wszystkie upadłe zakłady do życia. By żyło się ludziom lepiej."
DGR_prefab_apartments: "Masowe wznoszenie mieszkań z wielkiej płyty"
DGR_prefab_apartments_desc: "Liberalne rządy uwielbiały chwalić się ilością wybudowanych mieszkań, jakich to oni wspaniałych pensjonatów nie stworzyli. A to że nikogo z przeciętnych ludzi nie było stać na życie w ich cudownych willach to już ich totalnie nie obchodziło. W końcu znajdzie się jakiś bogacz który będzie chciał zainwestować w nieruchomości. Młody człowiek nie ma szans na własne mieszkanie, jeśli jest szczęśliwy to będzie go stać na wynajem jednego miniaturowego pokoju w sześcioosobowym domu w ciasnym bloku. Potrzebujemy masowego programu mieszkań. Masowego, nie trzystu małych klatek raz na dziesięć lat."
DGR_real_estate_crash: "Załamanie rynku nieruchomości"
DGR_real_estate_crash_desc: "Nie wiem czy istnieje gorsze zwierzę od właścicieli nieruchomości. W naszym państwie właśnie rynek ten po prostu umarł. Załamanie totalne, dzięki naszym działaniom. I to jest dobra sytuacja. Na trupach tego chorego systemu możemy zbudować nowy świat, w którym nie trzeba będzie liczyć na dobrotliwość agentów nieruchomościowych którzy łaskawie obniżą czynsz o 2 złote za metr kwadratowy, a podniosą Ci opłaty za media o kilkaset złotych. Dość fliperów, dość wyzysku. Mieszkanie prawem, nie towarem! A dla tych którzy tak ochoczo bawili się losami ludzi i kpili z podstawowego prawa człowieka mamy specjalne mieszkania. Takie fajne, których nie będą musieli już do końca życia opuszczać."
DGR_pgr: "Utworzenie Narodowych Gospodarstw Rolnych"
DGR_pgr_desc: "Rolnicy strasznie się rozpasali od upadku PRL. Przesiąknęli na wskroś ideologią kapitalistyczną, która w połączeniu z ich socjalistycznymi korzeniami i żądaniami dała straszną mieszankę. Roszczeniowość, brak wspólnotowego ducha i poczucia odpowiedzialności za społeczeństwo. Narodowe Gospodarstwa Rolne które wprowadzamy z dniem dzisiejszym sprowadzą ich na ziemię oraz ugruntują wizerunek rolnika jako tego który dba o wspólnotę narodową żywiąc cały kraj, a nie tylko siebie. A to dopiero początek zmian, które ich czekają."
DGR_collectivisation: "Rozpoczęcie kolektywizacji"
DGR_collectivisation_desc: "Prywatyzacja ziem agrarnych była strasznym krokiem w kierunku liberalnym. Konflikty które narosły wokół tego wydarzenia ciągną się po dzień dzisiejszy, a niektórzy rolnicy po prostu nie mają pojęcia o zarządzaniu, i nie powinni w ogóle się za to zabierać. Dlatego też kolektywizacja pomoże w osiąganiu wspaniałych rezultatów. Ci którzy potrafią pracować, będą pracować. Ci którzy potrafią zarządzać, będą zarządzać. Każdy na swoim miejscu, każdy z trudem pracujący na użytek wspólny. Zaczniemy od rolnictwa. Aż w końcu osiągniemy prawdziwą narodową wspólnotę której owoce pracy będą służyły każdemu kto dostąpi zaszczytu przynależności do naszej nacji."
DGR_wait_and_see: "Poczekamy, zobaczymy..."
DGR_wait_and_see_desc: "Ziarno produktywności zostało zasiane. Plany zostały nakreślone, organizacje przysposobione do rozpoczęcia produkcji w odpowiednich normach i agendach. Programy niezbędne dla funkcjonowania planu pięcioletniego zostały uruchomione. Wszyscy wiedzą co mają robić. Tak, mogą następować pewne fluktuacje na rynkach wynikające z tego że przeprowadzamy tutaj rewolucyjne zmiany. Na pewno przez chwilę będzie gorzej zanim będzie lepiej. Ale teraz pozostaje nam tylko trzymać kurs, robić swoje i czekać...na owoce naszej pracy. I wtedy będziemy się delektować ich smakiem nie musząc już zaciskać pasa. Już tuż tuż. Tylko pięć lat. "
DGR_green_utopia: "Zielona utopia ministra Krępy"
DGR_green_utopia_desc: "Bas Tajpan, który ostatnio postanowił jednak politycznie działać pod swoim prywatnym imieniem i nazwiskiem przedstawił dzisiaj pakiet ustaw które miałyby być odpowiedzią na Nowy Zielony Ład. Jak dla mnie to on próbuje być świętszy od Papieża, biorąc pod lupę wszelkie europejskie regulacje i dokręcając śrubę dwukrotnie mocniej. Zakaz produkcji samochodów, zakaz hodowli zwierząt, demontaż naszego ciężkiego przemysłu i sektoru energetycznego. Nie wiem czy ten człowiek sobie żartuje czy jest pierdolonym sabotażystą?\nPrzecież nikt o zdrowym zmyśle nie potraktuje tego poważnie. Nawet Towarzysz Demencja nie jest na tyle odklejony od rzeczywistości żeby sprawić że za parę lat będziemy wszyscy hasać po zielonych polankach jak księżniczki Disneya."
DGR_legalizacja_teraz_legalizacja_tu: "Legalizacja teraz! Legalizacja tu!"
DGR_legalizacja_teraz_legalizacja_tu_desc: "Od początku wiedziałem, że z tym pasożytem będą same kłopoty! Może jakby pozostał trzeźwy to mniej by miał sił na pieprzenie głupot o leczniczych właściwościach narkotyków. I teraz właśnie minister Krępa uważa że jest idealny moment żeby postawić ultimatum całemu politbiuro - legalizacja marihuany. A więc wszystkie poprzednie idee były tylko zasłoną dymną dla tego jednego problemu. Przeraża mnie tylko jak wiele popleczników zdaje się on mieć. Czyżbym nie był jedynym członkiem Frontu Ludowego który w tajemnicy budował swoją podziemną władzę czekając na odpowiedni moment?"
DGR_appease_them: "Zaspokój żądania mas"
DGR_appease_them_desc: "Jak ma zamknąć mordę, to w sumie niech mu będzie. Nawet zagłosuję za legalizacją. Niech idzie się ujarać i więcej nie przychodzi na zebrania politbiura bo Bóg mi świadkiem odpalę mu dwumetrowego jointa w dupie. A mamy takie w armii. Nazywają się rakietami krótkiego zasięgu. Nie mniej wydaje się to być stosownym podejściem do obecnego problemu. Ludzie o coś krzyczą, czegoś się domagają. Przy legalizacji przynajmniej będziemy mieć kontrolę nad tą substancją i jej obrotem, oraz nie doprowadzimy do powstania kolejnego czarnego rynku. Z tym już mieliśmy problemy."
DGR_people_are_pissed: "Ludzie w sumie nie są zadowoleni..."
DGR_people_are_pissed_desc: "Okej, chyba ludziom nie chodziło konkretnie o legalizację marihuany...bo dalej protestują. Dzisiaj w fabrykach Myszkowskich oraz Zawierciańskich doszło do zawiązania komitetów strajkowych. Skoro nie chodzi im o marihuanę...to o co? Mieszkania mają - jakieś. Pieniądze dostają - co za to kupią to nie nasza sprawa, jesteśmy w stanie wojny domowej. Alkohol i papierosy nie zostały przez nas opodatkowane, więc nawet taniej mają. Bezpieczeństwo - zapewnione. Czego im niby brakuje?"
DGR_strikes_spreading: "Strajk ogólnokrajowy"
DGR_strikes_spreading_desc: "Wolność? Czym jest wolność dla bandy robotników których życiowym celem jest szychta od 8 do 16, pójście do baru z kolegami z pracy i wrócenie do żony która gnije w domu z dzieciakami? Jakie oni mają niby głębsze potrzeby do tego że demokracja jest im niezbędna? Żadne. Ludzie dzielą się na klasę rządzącą i na tych których przeznaczeniem jest bycie rządzonymi. Ktoś podjudza naszych robotników, sami z siebie nie są zdolni do tak głębokich przemyśleń żeby zorientować się że są kontrolowani. Wyślemy służby bezpieczeństwa do każdego zakładu by zdemaskować wichrzycieli. A tymczasem musimy trochę zacząć myśleć o prewencji bo zakłady pracy w Częstochowie, Sosnowcu i Lublińcu właśnie dołączają do strajków..."
DGR_mistrzostwa_w_palowaniu_gornikow: "Mistrzostwa w pałowaniu robotników"
DGR_mistrzostwa_w_palowaniu_gornikow_desc: "Dzień Dobry, dzisiaj rozpoczynamy narodowe mistrzostwa w pałowaniu robotników. Reprezentacje wszystkich jednostek Narodowej Armii Ludowej są już gotowi do rozpoczęcia rozgrywek, rozgrzewają się przed startem igrzysk i z niecierpliwieniem czekają na pierwszy gwizdek oficerów prowadzących. Przed państwem mecz otwarcia - reprezentacja 1 Batalionu imienia Edmunda Cedlera zmierzy się ze strajkującymi robotnikami z Huty Zawiercie. Kto wygra? Możemy się domyślać jedynie, faworytem jest tu oczywiście drużyna batalionu Czerwonych Sztandarów. Zapraszamy również na kolejne mecze przewidziane na cały obecny tydzień do największych zakładów przemysłowych w twoim mieście. Gwarantowany wpierdol albo zesłanie do obozu pracy."
DGR_czolgi_na_hute: "Wyślij czołgi na Hutę Katowice"
DGR_czolgi_na_hute_desc: "I wy, hutnicy Dąbrowscy wbijacie nam nóż w plecy? Chleba nie będzie, bo nie ma. Jest ocet, i stal. Wolności też nie będzie, bo jej nie potrzebujecie. Ale za odmowę pracy w zakładach znaczenia strategicznego podczas stanu wojennego przewidziana jest kara najsurowsza. Politbiuro zgodziło się na wykonanie najbardziej radykalnego ze scenariuszy prewencyjnych. Czołgi znowu pojadą w kierunku Huty Katowice. I tym razem nie dojdzie do żadnych porozumień, nie będzie Solidarności, i nie będzie Okrągłego Stołu. Będzie ból, znój i zgrzytanie zębów."
DGR_history_repeating: "Historia lubi się powtarzać"
DGR_history_repeating_desc: "Nie możemy sobie pozwolić na ponowną słabość. Historia lubi się powtarzać, ale w tym wypadku po to żebyśmy mogli uczyć się na własnych błędach i nie popełnić ich po raz drugi. Ugoda ze strajkującymi to pierwszy i największy błąd jaki można popełnić w obliczu masowych protestów. Pięścią, stalą oraz ogniem odpowiemy na jakikolwiek objaw oporu stawianego władzy. Bo jak to mówi historyczna dewiza: \"Każdy prowokator czy szaleniec, który odważy się podnieść rękę przeciw władzy ludowej, niech będzie pewien, że mu tę rękę władza odrąbie\"\n\nCyrankiewicz miał rację. Dzisiaj jak nigdy."
DGR_komu_to_potrzebne: "Marihuana? A komu to potrzebne?"
DGR_komu_to_potrzebne_desc: "Zalegizować marihuanę? A po co? Komu to potrzebne? Nie po to walczyliśmy tak długo z narkotykowym podziemiem przestępczym w Dąbrowie by teraz pozwolić ćpunom degenerować społeczeństwo na nowo. W życiu nie zagłosuję za tym, próbujemy tu zbudować nową wspólnotą, wolną od używek i nałogów, a nie poddawać się słabościom półświatka. Nikt mi nie wmówi, że to jest normalne i naturalne. Wystarczająco napatrzyłem się na skutki ich wspaniałego leku, które sprawia że młodzi ludzie wchodzą w długi a ich umysły stają się zamglone jakby wiecznie chodzili otępieni."
DGR_nowy_protest: "Nowy protest"
DGR_nowy_protest_desc: "W Parku Zielona właśnie doszło do spalenia dokumentów rządowych związanych z penalizacją narkotyków, w tym właśnie marihuany. Przewodniczył temu sam minister Krępa czyli Bas Tajpan. Potem wszyscy zgodnie zaczęli śpiewać że coś tam coś tam gdybym był magiem i mógł spełnić trzy życzenia to wybrałbym kilo marihuany. Że Komuna Dąbrowska w zakazy ubrana, nikogo nie zabiła a jednak zakazana. No tak, wszyscy znamy te chuja warte utwory artystyczne. Ale to żeby minister robił coś takiego jest napluciem władzy w twarz.\nA za tę obrazę już Bas Tajpan słono zapłaci."
DGR_diss_na_rzad: "Diss na rząd"
DGR_diss_na_rzad_desc: "Minister Damian Krępa już tymże ministrem nie jest. W momencie gdy zaczyna się występować przeciwko własnemu rządowi, jednocześnie będąc jego częścią to przestaje mieć sens. Więc umożliwiliśmy mu wycieczkę na samo dno wywalając go ze skutkiem natychmiastowym. Jednostki lojalne rządowi już zmierzają w stronę stolicy by rozbić w pył całą tę hołotę. Nie mogę się doczekać kiedy ostatni element wywrotowy zniknie z naszych ulic. A reszta rozejdzie się bardzo szybko, i cała sytuacja zostanie opanowana.\n\nChwila...czy ten kretyn właśnie robi koncert przed pałacem?"
DGR_criminal_hydra: "Przestępcza hydra podnosi łeb"
DGR_criminal_hydra_desc: "Wiadomo że spora część naszych żołnierzy ma swoje korzenia w blokowiskach i społeczności gangsta rapu. Człowiek wyjdzie z otoczenia przestępczego, ale mentalna biedota jest nieuleczalna. I właśnie wśród takich ludzi Bas Tajpan znalazł swoje oparcie. Niepokoi mnie ten fakt bo to oznacza że w środku Narodowej Armii Ludowej jest rak, który ciężko będzie wyciąć. Strajkujący robotnicy łamią prawo, więc z definicji też stali się przestępcami. Ciężko będzie ogarnąć naród w którym większość staje po drugiej stronie prawa. I obawiam się wydania rozkazu przebicia się do stolicy przez zablokowane ulice za wszelką cenę. Bo nie wiadomo czy nagle żołnierze nie odmówią wykonania rozkazu. Ale to też by znaczyło że i oni są przestępcami...głowa mnie już zaczyna boleć."
DGR_SPALMY_BABILON: "SPALMY BABILON!"
DGR_SPALMY_BABILON_desc: "Po raz kolejny zdaje się nie doceniłem potęgi buntu mas, która nie jest w stanie nigdy pojąć idei które wykraczają poza czubek ich pierdolonego nosa i sięgające dalej niż do następnego posiłku. Więc mam za swoje. I tak dziwne jest to, że nie zostałem na miejscu rozstrzelany czy spalony na stosie, jakkolwiek by sobie to upatrzyli. Zamknięty w jakiejś ciemnej celi oczekuję na wyrok. A na górze ten słynny \"Babilon\" płonie. Dosłownie, zamach stanu wykonany został w ogniu kilkunastu pożarów w stolicy. A strajkujący robotnicy nie kwapili się jakoś by chociaż kiwnąć palcem by nam pomóc. Więc czeka nas rastafariańska przyszłość."
DGR_SADZIC_PALIC_ZALEGALIZOWAC: "SADZIĆ! PALIĆ! ZALEGALIZOWAĆ!"
DGR_SADZIC_PALIC_ZALEGALIZOWAC_desc: "BUDI BAJ BAJ BAS TAJPAAAAAAAAAN JAAAAAAAAAH RASTAFAAARIIIIIIIIIIII"




DGR_hour_of_the_wolf: "Godzina Wilka"
DGR_hour_of_the_wolf_desc: "Nadszedł czas zapłaty rewolucjonistów za swoje zbrodnicze czyny wobec rządu. To co zrobiliśmy było okropnie trudną, lecz konieczną decyzją. Reszta nie odważy się powtórzyć takiego zrywu społecznego w obawie przed jeszcze mocniejszym odwetem. Szala przechyliła się na naszą stronę. Ci wszyscy wywrotowcy...oni czekali na odpowiednią chwilę. Starego na chwilę zabrakło i już rzucili mi się do gardła. Niedoczekanie. Ze względu na nieobecność Szweja, i po wprowadzeniu stanu wojennego - będę miał nieograniczoną władzę. I uwierzcie mi, zaprowadzę tutaj porządek. "
DGR_bargiela_list: "Lista Bargieły"
DGR_bargiela_list_desc: "Dość. Nie chce mi się nawet myśleć o tym, żeby te siedliska zgnilizny jakim były partie polityczne i organizacje społeczne mogły funkcjonować bez przeszkód. Głównym powodem tej niechęci jest ich całkowite i bezmyślne odklejenie od rzeczywistości. Dodatkowo, to oni odpowiadają za ostatnie strajki i zamieszki swoim agitowaniem. Czy tak było? A czy to musi być koniecznie prawda? Wedle moich obliczeń około 3/4 organizacji społecznych, politycznych i kulturowych przestanie istnieć po następnym dekrecie. Nie będą potrzebne nikomu. Nie będą już siać zamętu i mieszać w głowach ludziom. Nie gdy będzie istnieć lepsza, państwowa alternatywa."
DGR_capital_punishment: "Kara śmierci"
DGR_capital_punishment_desc: "Gdy człowiek jest zbyt pobłażliwy, inni zaczynają to wykorzystywać. Daj palec, będą chcieli całą rękę. A gdy jej nie dostaną to sobie ją odrąbią. Doktryna nadstawiania drugiego policzka wyrządziła absolutnie spustoszenie w umysłach ludzi. Tu trzeba wrócić do najprostszych rozwiązań. Chrześcijańskie miłosierdzie nie może działać gdy dookoła panuje wojna i walczymy o przetrwanie. Oko za oko. Ząb za ząb. Śmierć za zdradę. Ten Hammurabi to jednak był mądry człowiek. I zanim filozofowie się uruchomią że oko za oko sprawia że cały kraj będzie ślepy - nie sprawi jeśli to my będziemy mieli monopol na wizję...\n\nTeraz tylko zdecydować. Gilotyna? Szubienica? Krzesło elektryczne? Pluton egzekucyjny?"
DGR_assembly_ban: "Zakaz zgromadzeń"
DGR_assembly_ban_desc: "Panowie koledzy, tak to już jest, że jak się wprowadza stan wojenny to wprowadza się również zakaz publicznych zgromadzeń. Z wyjątkiem tych sankcjonowanych przez Politbiuro oczywiście. Taka malutka decyzja, a czyści szachownicę ze wszystkich niepożądanych pionków za jednym zamachem. W końcu to sprowadza się do bardzo jasnego prawa; robisz publiczne spotkanie - jesteś wrogiem. Więc jeśli nie jesteś wrogiem - to nie rób spotkań! Proste i logiczne, prawda? Niestety, najgorsze szczury uciekną do podziemi, będą się potajemnie przekradać w cieniach i kanałach. Ale ich też wykurzymy, krok po kroku."
DGR_fake_judges_fake_trials: "Fałszywi sędziowie, fałszywe procesy"
DGR_fake_judges_fake_trials_desc: "Trochę przesadziliśmy z liczbą aresztowanych. Liczba oczekujących na proces przerasta nasze możliwości przerobowe. Nie możemy ich trzymać tam wiecznie, więc musimy kombinować na około. Na szczęście, to co mamy w nadmiarze to stroje sędziowskie i puste hale. Przecież i tak sędzia jest tam po to żeby przeczytać wyrok w oparciu o nasze prawo, oni nic nie decydują sami. To po co muszą tam być prawdziwi sędziowie? Urzędników u nas sporo. A to nie będą długie rozprawy. Raz, dwa i po sprawie - do więzienia, na roboty albo do stracenia. Aparat sędziowski w III RP nigdy nie był tak skuteczny jak teraz będzie. I dopiero teraz zredefiniujemy na nowo pojęcie neo-sędziów. No cóż - twarde prawo ale prawo."
DGR_deaf_walls_of_wojkowice: "Głuche ściany Wojkowic"
DGR_deaf_walls_of_wojkowice_desc: "W Wojkowicach od lat 60 XX wieku znajduje się zakład karny. Od 2009 jest on największym zakładem tego typu w regionie. Gratulacje! Właśnie stanie się on największym w Polsce. Potrzebujemy trochę miejsca, a że obok są lasy i stadion (nikomu nie potrzebny) to możemy praktycznie podwoić obszar więzienia. Bo będziemy potrzebować nie tylko zakładu karnego dla mężczyzn ale również sektora dla kobiet, sektora o podwyższonym rygorze oraz dla więźniów skazanych za zbrodnie polityczne. W dodatku przyda się podwojenie ochrony, monitoringu oraz zbudowanie grubszych murów. Żeby przypadkiem nikt nie słyszał w okolicy krzyków dobiegających ze środka. Rany, przecież że nie od tortur! Nie jesteśmy do cholery sadystami...jesteśmy profesjonalistami. Tak się po prostu mówi, nie?"
DGR_no_country_for_old_men: "To nie jest kraj dla starych ludzi"
DGR_no_country_for_old_men_desc: "Dziadu wraca ze szpitala dzisiaj. Oczywiście, że ten pieprzony dinozaur akurat wychodzi w momencie kiedy udało mi się to państwo postawić na nogi. Cała sytuacja jest już uspokojona, nikt nie protestuje, nikt nie rzuca granatami w posterunki wojskowe, wszędzie spokojnie, nic się nie dzieje. I wjeżdża on, żeby zgarnąć całą chwałę. A mnie będzie się od razu spychać na bok, że to wszystko moja wina była. Że gdyby Szwej był cały czas, do czegoś takiego by nigdy nie doszło. Oczywiście że by nie doszło, bo rządu by już nie było! Tylko twarda ręka Narodowej Armii Ludowej chroni Politbiuro od zagłady z rąk mas ludowych. I na szczęście Towarzyszowi Demencji zostało tylko potakiwanie głową i podpisywanie rzeczy. Mamy swojego Breżniewa w domu!"
DGR_people_political_organisation: "Ludowa Organizacja Polityczna"
DGR_people_political_organisation_desc: "Lista tych wszystkich organizacji do delegalizacji była tylko pierwszym krokiem. Teraz, zagospodarowując powstałą pustkę, włączamy wszystkie pomniejsze organizacje które sprzyjały nam do centralnej Ludowej Organizacji Politycznej. Mogą sobie mieć tam poszczególne sekcje nacjonalistyczne, komunistyczne, brydżowe, czy jakie tam chcą. Ale muszą się legitymować symbolem państwowym. Bo inaczej ich działalność nie może zostać usankcjonowana. Tylko w taki sposób zapanujemy nad wielkim tłumem którego ambicje mogą przekroczyć możliwości. A dzieje się tak zawsze, i skutkuje to jedynie chaosem. Kontrola jest jedynym imperatywem. Wolność nigdy nie buduje cywilizacji, jedynie je rujnuje."
DGR_commissariat_civil_sector: "Cywilny sektor Komisariatu"
DGR_commissariat_civil_sector_desc: "Komisarze to bardzo efektywne narzędzie. Do tego stopnia, że grzechem byłoby pozostawienie ich by jedynie tępili żołdaków. Musimy ich spuścić ze smyczy i wprowadzić pomiędzy cywilną populację. Bo brak dyscypliny oraz miałkość jest wszechobecna. Ludziom potrzeba...odpowiednich nauczycieli moralnych którzy będą im przypominać jakie wartości są najważniejsze. Poprawi to również bezpieczeństwo poza liniami frontu, znikną szabrownicy oraz sabotażyści. Chociaż szczerze, to boję się że niektórzy mogą przesadzić...z metodami edukacyjnymi. I Wojtek coś za bardzo cieszy się na tę nowinę...cóż. Jak nie my ich...to oni was."
DGR_security_committee: "Komitet Bezpieczeństwa"
DGR_security_committee_desc: "W życiu każdego człowieka istnieje taka chwila, że potrzeba bezpieczeństwa zaczyna górować nad wszelkimi innymi potrzebami. Oczywiście oprócz fizjologicznych. Państwo jest od tego, żeby to bezpieczeństwo zagwarantować. Co prawda, nie cierpię posługiwać się analogiami kapitalistycznymi...ale jeśli my nie zabezpieczymy obywatela to ten będzie bardzo chciał znaleźć sobie innego mocodawcę, albo co gorsza - będzie działał aktywnie na naszą niekorzyść. Jeśli człowiek jest bezpieczny i czuje się bezpiecznie - może żyć, może się cieszyć życiem a nie tylko martwić się o przetrwanie. I pamiętać na każdym kroku że jedynym gwarantem bezpieczeństwa jest Narodowa Armia Ludowa."
DGR_juvenile_prisons: "Postępowe zakłady karne dla młodocianych"
DGR_juvenile_prisons_desc: "Wszyscy zawsze powtarzają slogan, że młodzież jest przyszłością narodu. Tak, tak. Wiadomo. I że młodzież musi się wyszumieć, że za dzieciaka to się głupie rzeczy robiło i tak dalej, i tym podobne. Taka pobłażliwość prowadzi tylko do tego że dzieci nie będą się słuchały nikogo i żyły w przeświadczeniu że wszystko im wolno. I wtedy dochodzi do tego polaryzacja i radykalizacja polityczna i zanim się obejrzymy - cud! Mamy pokolenie młodych terrorystów. Dlatego każde odstępstwo od prawa musi być korygowane na jak najwcześniejszym etapie. Pomogą nam w tym zakłady dla młodocianych przestępców. Korygujące i do bólu skuteczne. I wtedy faktycznie, gdy już takie zakłady nie będą potrzebne - młodzież będzie naszą przyszłością. Albo...będziemy musieli sobie zrobić nową młodzież."
DGR_militarization_of_police: "Militaryzacja Policji"
DGR_militarization_of_police_desc: "Policja od zawsze była naprzemiennie obiektem nienawiści i żartów. Szacunek do munduru spadał tylko coraz bardziej przed Upadkiem. Uważam, że jednym z powodów tego było praktycznie zerowe przystosowanie policjantów do funkcjonowania w sytuacjach kryzysowych. Jakby nie było - wojna domowa trwająca od 2025 jest nieustanną taką sytuacją. Broń boczna i pałka policyjna już nie wystarczy funkcjonariuszom. Muszą oni posiadać odpowiednie wyposażenie by być naszą pierwszą linią obrony od wewnątrz. By byli skuteczni i zabójczy gdy trzeba. I żeby nie wahali się podejmować drastycznych decyzji jeśli chcą bronić społeczeństwa. Tylko może nie dawajcie im granatników."
DGR_ideological_committee: "Komitet Ideologii"
DGR_ideological_committee_desc: "To będzie coś co zajeżdża hipokryzją. Bo gdy zajrzę w głąb siebie - tam nie ma ideologii. Nie było jej gdy podejmowałem decyzje o sojuszu z KPP. Nie było jej gdy przeprowadzaliśmy te wszystkie komunizacje i socjalizacje. Nie było jej gdy musiałem zaprowadzić porządek w tym kraju podczas strajków i zamieszek. Nie ma jej też teraz. Są wartości, ale ciężko to nazwać ideologią. I jednocześnie - państwo jej potrzebuje bo w innym przypadku byłaby to zwykła, ordynarna junta wojskowa. Może i tak niektórzy to widzą, ale junty mają do siebie to że długo nie trwają. Dlatego ideologia w którą będą wierzyli ludzie i urzędnicy musi być tym budulcem który złączy różne cegiełki w jeden solidny mur. Byle tylko utrzymać maskę na tyle długo."
DGR_action_c: "Akcja C"
DGR_action_c_desc: "Zapytaj ludzi o Dąbrowę Górniczą to przez tych pierdolonych klechów wszyscy zaczną się śmiać z orgii na plebani. Nigdy nie było mi po drodze z religijnymi sługusami, są jednostki które faktycznie traktują to jako platformę do szerzenia dobra ale w 90% trafiłem, widziałem i słyszałem o zdegenerowanych złodziejach którzy z kościoła zrobili sobie ścieżkę kariery i władzy. Protestanci mieli w jednym rację - ogromne bogactwo które sobie katoliccy klechowie zbierają w swoich świątyniach jest niemoralne i niegodne. \n\nSzczególnie nie w takim państwie jak nasze. Już dawno minęły czasy kiedy Kościół Katolicki był ostoją dla ludzi w trudnych czasach. Wszyscy przestali widzieć jakiekolwiek oparcie w tym zgniłym systemie w którym hierarchowie albo wyłudzają pieniądze albo molestują dzieci. Dlatego też nikt nie kiwnie palcem na to co zamierzamy właśnie zrobić. Ręka sprawiedliwości dosięgnie Kościół Katolicki. I to nie będzie przecież takie złe - my tylko chcemy przypomnieć im ich korzenie i to z jakiej sytuacji się wywodzi cała ich religia. Póki co jednak wstrzymamy się z lwami i arenami gladiatorskimi. Póki co..."
DGR_ckos: "Centrum Kształtowania Opinii Społecznej"
DGR_ckos_desc: "Natłok informacji w obecnych czasach często przygniata ludzi mniej obeznanych w technikach manipulacji medialnej. Przebodźcowanie danymi często ich zamyka na jakiekolwiek ważne wieści. Dlatego musimy mieć instytucję która będzie subtelnie prowadziła za rękę ludzi w kierunku informacji niezbędnych dla nich. Oraz w dodatku będzie mówiła im tak naprawdę co mają myśleć - bo większość społeczeństwa nie ma żadnego własnego zdania na większą część tematów - powtarzają tylko to co powiedzą im rodzina, znajomi, celebryci, ich ulubiona stacja telewizyjna czy portal internetowy.\nA społeczeństwa nie zmienimy, jak było głupie tak głupie zostanie. Więc bądźmy pasterzami i poprowadźmy ich tam gdzie chcemy żeby zmierzali. Pokierujmy ich myślami tak by wiedzieli że wszystko jest dobrze bo tak mają myśleć, że jest. Efekt placebo załatwi większość problemów które wydaje im się że mają. I przynajmniej my będziemy mieli spokój od rebelianckich szumowin którzy zawsze wiedzą lepiej niż ludzie u władzy."
DGR_national_protection_service: "Narodowa Służba Ochrony"
DGR_national_protection_service_desc: "Władza ma zawsze rację. Nawet wtedy kiedy jej nie ma. A jeśli popełniliśmy błąd i widzieli jak mamy rękę w czyjejś kieszeni - trudno, to nie nasza ręka. To może niektórych początkowo bardzo denerwować, przynajmniej do czasu kiedy nasza machina medialna zacznie działać. I biorąc pod uwagę stan naszego kraju, to jeden niezadowolony człowiek z bronią, znajdujący się w odpowiednim miejscu w odpowiednim czasie...może zmienić losy kraju. Nie zamierzam jednak skończyć jak niektórzy amerykańscy prezydenci - muszę przetrwać żeby ten kraj mógł przetrwać.\n\nJednakowoż, byłoby dość podejrzane i głupie z mojej strony gdybym sam sobie tylko dał nadzwyczajną ochronę. Dlatego też powołujemy Narodową Służbę Ochrony która będzie zrzeszać najlepszych profesjonalistów w dziedzinie ochrony personalnej. Służba ta będzie miała za zadanie chronić najważniejsze jednostki w aparacie władzy. Nic odkrywczego, tylko po prostu będą o wiele lepiej wyposażeni i fundowani niż takie Biuro Ochrony Rządu przed Upadkiem"
DGR_administration_committee: "Komitet Administracji"
DGR_administration_committee_desc: "Biurokracja to ogromna, przerośnięta szmata która istnieje tylko po to by odbierać ludziom sens życia. Cała administracja musi być prosta i logiczna, tak żebyśmy mogli spędzić jak najmniej czasu na rozstrzyganiu absurdalnych sytuacji a więcej mogli przeznaczyć na faktyczne poważne sprawy. Jeszcze gorzej jak cała administracja jest w rękach niekompetentnych cywili z przerośniętym ego, którzy jak zasiądą za okienkiem w urzędzie myślą że są panami świata. W dodatku mnożą się przez pierdoloną mitozę bo zaraz w tym samym urzędzie potrafi pracować siostra, babka, kuzynka i cała rodzina do dwóch pokoleń wstecz i wszerz, mimo że jedyną umiejętnością jaką posiadają to zrobienie chujowej kawy z ekspresu. \n\nTrzeba tam zaprowadzić reżim wojskowy i żelazną dyscyplinę, a może uda się ulepić coś z tego absolutnego szamba."
DGR_regional_military_protectors: "Regionalni Wojskowi Protektorzy"
DGR_regional_military_protectors_desc: "Wojewodowie i starostowie należą do gatunku który powinien wyginąć. To nic innego jak generatory stołków dla ludzi uzdolnionych inaczej. Co najgorsze, oni totalnie nie mieli nic do powiedzenia i pełnili jedynie rolę potakiwaczy lub kontrarian. Czasem coś tam podpisali bo nie mieli wyjścia. Nie posiadając żadnych sensownych uprawnień - nawet im się ciężko dziwić że nic nie robili. \n\nChcąc nie chcąc, musimy ich w pewnej formie pozostawić dając im większe możliwości. Ale tworząc funkcję Wojskowych Protektorów upewnimy się że nad tymi organami administracji będzie sprawowana dodatkowa kontrola, z możliwością wprowadzenia stanu wyjątkowego na danym obszarze jeśli uznają że władza cywilna nie wywiązuje się ze swoich obowiązków. I jeśli zagalopują się zbytnio - Protektor będzie mógł ich po prostu odwołać na wniosek ludu lub ze swojej własnej inicjatywy. Bo jak się nie da prośbą to trzeba później groźbą. Aż do skutku."
DGR_ministry_of_recovered_territories: "Ministerstwo Ziem Odzyskanych"
DGR_ministry_of_recovered_territories_desc: "Mamy problem. Bo z jednej strony - ustanawiamy sobie dobrze funkcjonującą administrację na naszych terenach rdzennych. Z drugiej natomiast...cały czas poszerzamy swoją władzę na sąsiadujące powiaty i województwa więc naturalnym jest że non-stop przybywa nam terenów do administrowania. Wydawać by się mogło że łatwiej postawić nową skuteczną administrację niż reformować istniejącą. No tak, ale jednak ziemie odzyskane wymagają innego podejścia - bardziej wojskowego, zanim będą w stanie przejść pod opiekę cywilną.\n\nDlatego zdecydowałem o powołaniu Ministerstwa Ziem Odzyskanych, które będzie sprawowało pieczę nad terenami które przejdą pod nasze władanie a nie będą jeszcze włączone do rdzenia administracyjnego. A takie ministerstwo będzie miało co robić bo tu trzeba spacyfikować partyzantów, rozporządzić mieniem lokalnym, w pewnych przypadkach przeprowadzić korekcyjne akcje społeczne czy najważniejsze - przygotować społeczeństwo do integracji w ramach naszego systemu. Bo dla niektórych to będzie szok."
DGR_intelligence_committee: "Komitet Wywiadu"
DGR_intelligence_committee_desc: "Niewiedza jest wrogiem dobrze funkcjonującej władzy. Musimy być świadomi tego co się dzieje pośród społeczeństwa, nie tylko dlatego żeby nie podejmować oderwanych od rzeczywistości decyzji, ale dlatego żeby czuwać nad bezpieczeństwem i nie dopuszczać do tego żeby jakieś niechciane elementy zewnętrzne rozwalały nasz ład i porządek albo siały ferment i propagandę reakcyjną. Jesteśmy w stanie wojny, musimy poświęcić trochę swobód obywatelskich tak żebyśmy mogli zabezpieczyć każdego z nas przed wrogiem. A wiadomo, jak ktoś nie ma nic do ukrycia to nie ma się czego bać.\n\nA z drugiej strony, jeżeli chcemy skutecznie przeciwdziałać wrogom z zewnątrz, musimy wiedzieć co oni knują i jak wykorzystać ich słabe punkty. Przenieść walkę inwigilacyjną z dala od naszych domów. A może przy okazji uda się kilkoma sprawnymi akcjami zdobyć przewagę i cały proces odzyskiwania Polski będzie o wiele łatwiejszy."
DGR_expanding_informant_network: "Powiększanie siatki informatorów"
DGR_expanding_informant_network_desc: "Nie lubię słowa kolaborant. To sugerowałoby że jesteśmy obcą władzą, a przecież polskość ustawiona jest w nas na maksymalny poziom. Informator - to brzmi lepiej. Nie żeby w zasadzie obchodziło mnie to jak my ich nazywamy skoro dla reszty i tak będą szumowinami donoszącymi na wszystkich dookoła. I też w zasadzie odzywa się we mnie automatyczna pogarda dla takich ludzi. Bo skoro taki zaczyna od kapowania, to gdzie skończy?\n\nAle na szczęście nie muszę się babrać w tym gównie osobiście, a informatorzy zdecydowanie się przydadzą w każdej klasie społecznej, w każdym zakładzie i na każdej uczelni. Bo mało rzeczy jest gorszych niż zakonspirowani zdrajcy. Tych trzeba systematycznie wyrywać niczym chwasty bo inaczej rozprzestrzenią się na cały ogródek. A dobry ogrodnik do tego nie może dopuścić, działając prewencyjnie by żaden z nich nie pojawił się na powierzchni."
DGR_special_courses_for_agent: "Specjalistyczne kursy dla agentów"
DGR_special_courses_for_agent_desc: "Bycie szpiegiem to jedno, ale bycie dobrym szpiegiem to już wysoko postawiona poprzeczka. Bo potrzeba czasem zamachowców, ekspertów od materiałów wybuchowych, ekspertów od ucieczek a czasem kogoś kto będzie w stanie wmówić komuś największa bzdurę lub kogoś uwieść swoim wdziękiem. Albo dać w mordę. \n\nRozkazałem Komitetowi Wywiadowczemu na przygotowanie serii kursów które będziemy mogli przeprowadzić dla naszych agentów żeby ich wachlarz umiejętności poszerzyć. Bo jeśli akcja jest jednoosobowa, czasami trzeba improwizować i wykorzystywać różne talenty by wyjść cało z niebezpiecznych sytuacji. Nie zazdroszczę im tej roboty, ale oni mogliby to samo powiedzieć o mojej. \n\nOstatecznym celem jest wyszkolenie szpiegów na tyle uniwersalnych żeby byli jednoosobowymi armiami. Niestety, nikt o nich nie usłyszy nigdy bo takie rzeczy nie mogą wyjść na jaw. A szkoda, bo byłoby o czym wspominać."
DGR_institute_of_people_history: "Instytut Historii Ludowej"
DGR_institute_of_people_history_desc: "Historię piszą zwycięzcy. To prawda stara jak świat, ale nikt nie powiedział że nie można już jej nigdy przepisać na nowo. W zasadzie, robi to każde państwo. W taki sposób żeby idealnie ukryć to co złego robili innym. Ukraińcy mówią że UPA to aniołki i przecież nie mordowali nikogo, Rosjanie to samo mówią o Armii Czerwonej a Niemcy wybielają Wehrmacht. I ich społeczeństwa naprawdę w to wierzą bo nigdy nie zostali nauczeni inaczej a nawet jeśli to ich pierwszą i automatyczną reakcją jest wyparcie.\n\nTak więc, historia musi sprostać naszym oczekiwaniom. A jeżeli coś nie będzie nam pasowało - tym gorzej dla historii. Nie musimy kłamać, wystarczy wybiórczo przedstawiać dane fakty i zakrzyczeć tych którzy próbują wykazać jakiekolwiek niejasności. Naród jest oparty o wspólną kulturę, tradycje i historię. W momencie kiedy możemy wpływać na wszystkie trzy, będziemy w stanie przeobrazić całą nację w coś wspaniałego."
DGR_civil_committee: "Korpus Cywilny"
DGR_civil_committee_desc: "Uważam, że co prawda w naszym kraju nie powinno być cywili, dlatego nawet jeżeli coś nazywamy Korpusem Cywilnym to w domyśle zakładamy że należą oni do Narodowej Organizacji Politycznej która jest zaś przedłużeniem wojska na cywilną administrację. Więc chcąc nie chcąc - też jest to wojskowa instytucja. \n\nJeżeli nauczyciele, pracownicy medyczni, czy pracownicy socjalni będą związani z armią, to po pierwsze będziemy mogli skutecznie kontrolować to co robią i egzekwować konsekwencje, a po drugie będą oni zobowiązani do działania na rzecz wspólnego dobra armii co zdecydowanie podniesie ich kompetencje oraz dokładność wykonywanej przez nich pracy. Bo wszyscy jesteśmy jedną wielką machiną."
DGR_national_healthcare_league: "Narodowa Liga Służby Zdrowia"
DGR_national_healthcare_league_desc: "Służba zdrowia to wiecznie zgniły temat w Polskiej polityce i nikt nie potrafi o nią zadbać. Jedni krzyczą o prywatyzacji a drudzy o pompowaniu miliardów i liczeniu na to że lekarze zarabiając kosmiczne pieniądze w porównaniu do reszty społeczeństwa poczują się do obowiązku leczenia ludzi skutecznie. Jak może być skutecznie skoro wyleczony pacjent to stracone pieniądze? \n\nDlatego od dzisiaj lekarzem może zwać się tylko ten który osiągnie odpowiednią rangę i zda odpowiednie testy na medyka polowego. W ten sposób odsiejemy tych którzy chcą sobie siedzieć za biurkiem i decydować o ludzkim życiu a dostaniemy lekarzy którzy wiedzą jak cenne jest życie w momencie w którym podczas bitwy w każdej sekundzie możesz je stracić. Wszyscy medycy będą zrzeszeni w Narodową Ligę Służby Zdrowia i tylko oni będą mieli możliwość leczenia innych ludzi. Bo nikt kto nigdy nie był odpowiedzialny za życie ludzkie w warunkach polowych nie będzie się starał o to by drugiego człowieka faktycznie uratować."
DGR_education_inside_the_nation: "Edukacja wewnątrz narodu"
DGR_education_inside_the_nation_desc: "Szkolnictwo w Polsce, podobnie jak służba zdrowia to był jeden, wielki i w dodatku nieśmieszny żart. Już nawet nie mówię o fakcie że nie przystosowuje nikogo do życia w społeczeństwie, ale za to nawet nie uczy niczego przydatnego. Nauczyciele natomiast są totalnie nieprzygotowani do swojego zawodu. Nie potrafią nawet zapanować nad jedną klasą. A jeśli będą wojskowymi oficerami...to przynajmniej zaprowadzą dyscyplinę. \n\nNo i potrzebujemy nauczać bardziej życiowych rzeczy. Przysposobienie obronne czy historia ludowa to kluczowe rzeczy. A w przypadku przedmiotów istniejących - balistyka na fizyce i matematyce, materiały wybuchowe na chemii czy anatomia człowieka na biologii - niektóre działy potrzebują większego nacisku ze strony nauczycieli ze względu na ich możliwe zastosowania w późniejszym życiu.\n\nA zamiast religii wprowadzimy taktykę i strategię."
DGR_media_committee: "Komitet Mediów"
DGR_media_committee_desc: "Media, media i po mediach. Wolne to one nie były, nie są i nie będą. Nie ma co się z tym ukrywać, bo po pierwsze - zawód dziennikarza jest bardziej szmaciarski niż sexworking, a większość pseudo-medioidów nie potrafi złożyć jednego zdania. Trzeba całkowicie zaorać ten cały system, i postawić na centralne media które będą dawały wiadomości i tylko wiadomości. Opiniotwórczość zostawmy innym instytucjom centralnym, bo dopuszczając do głosu elementy wywrotowe grozi rozprzestrzenianiem się reakcyjnej zarazy. \n\nNie możemy być kompromisowi w tej sytuacji - wolne media zawsze prowadzą do chaosu informacyjnego. Każda informacja to pocisk który może zostać użyty przeciwko nam. Problem niestety będzie w ograniczeniach. O ile telewizję, gazety czy radio damy radę kontrolować, tak internet...coś trzeba będzie wymyślić."
DGR_supreme_censor_office: "Urząd Naczelnego Cenzora"
DGR_supreme_censor_office_desc: "To nie jest tak, że zakazujemy jakiejkolwiek twórczości ludziom którzy chcieliby tym się parać, zarówno dziennikarzom jak i artystom. Ale nie może być tak, że jakiś aktorzyna będzie sobie robił co mu się żywnie podoba i społeczeństwo jeszcze będzie zobligowane do płacenia na nich, a oni będą sobie występować w dodatku w roli jakichś zasranych autorytetów. Jesteście kurwa rzemieślnikami i nie macie prawa stawiać się ponad innych ludzi pracujących. \n\nA to co wy robicie to już sobie ocenimy. Naczelny Cenzor już o to zadba, abyście nie przemycali czasem w swojej twórczości jakichś ukrytych rewolucyjnych podtekstów bo jesteście do tego zdolni. I jeśli znajdziemy u was coś niegodnego publikacji to możecie być pewni, że się nie skończy na upomnieniach. Będziemy bezlitośnie wyciągać konsekwencje i podciągać to pod działalność wywrotową. I spróbujcie tylko kurwa jakieś memy niewłaściwe robić."
DGR_intranet: "Nasz własny Intranet"
DGR_intranet_desc: "Mamy pomysł na ostateczne rozwiązanie kwestii sieciowej. Bo po co ryzykować chaos informacyjny podłączając kraj do globalnej sieci, gdzie kontrola nad cyberprzestrzenią jest po prostu niemożliwa, gdy możemy po prostu stworzyć naszą własną sieć wewnętrzną. I ja wiem, że jedynym krajem który to robi jest Korea Północna, ale na obecną chwilę tylko tak możemy zapewnić bezpieczeństwo społeczeństwu. \n\nA przecież wszyscy wiemy jakie zagrożenia czyhają w internecie. Jak bardzo niebezpieczne jest to miejsce dla społeczeństwa. Największe spustoszenie siały media społecznościowe. Nic tak nie wypaczyło obrazu porządnego społeczeństwa jak właśnie one. To była tragedia dla rodzaju ludzkiego i będziemy potrzebowali wielu lat detoksu dla ludzi żeby zaczęli ponownie myśleć jak racjonalne jednostki."
DGR_ministry_of_military_funds: "Ministerstwo Pozyskiwania Funduszy dla Armii"
DGR_ministry_of_military_funds_desc: "Maszyna musi iść. A żeby chodziła to potrzeba pieniędzy. O wiele za dużo jak na mój gust, ale na to nic nie poradzę - system kapitalistyczny dalej trzyma się rękami i nogami w świecie. Zdecydowanym krokiem ku drodze do ułatwienia wszystkich działań będzie zinstytucjonalizowanie pozyskiwania funduszy dla armii. Najlepszym takim wyjściem będzie powołanie specjalnego ministerstwa które zajmie się pozyskiwaniem tychże.\n\nMinister będzie miał dużo możliwości, bo nierzadko będziemy musieli użyć lekkiej kreatywności i nagiąć parę zasad by osiągnąć to co chcemy. A będzie to bardzo ważne stanowisko bo na jego barkach będzie spoczywała odpowiedzialność za to żeby nasza armia była dobrze wyposażona i miała w ogóle z czego strzelać. "
DGR_energy_committee: "Komitet Energii"
DGR_energy_committee_desc: "Strategiczne sektory gospodarki muszą być pod wyłącznym władaniem wojska, w stanie wojny nie możemy pozwolić żeby jakiś cywilny szkodnik zarządzał tak ważną rzeczą jak chociażby właśnie energetyka. Niestety, nawet to nie pomoże na fakt, że drastyczna reindustrializacja może być spowolniona przez braki energetyczne. A te cholerne systemy są wrażliwe na przeciążenia, jeżeli przesadzimy w jednym punkcie to zaraz będziemy mieć blackout za blackoutem i wszystko rozleci się jak domek z kart. Niby moglibyśmy wzmocnić inwestycje w inne źródła ale cholera wie, to wszystko tak bardzo zostało zideologizowane, że sam już nie wiem czy to się opłaca. Może walniemy po prostu panele słoneczne na całej Pustyni Błędowskiej i ogłosimy fajrant?\n\nTak czy siak, musimy zadbać o naszą sieć energetyczną. Bo przecież nie możemy bez końca rozbudowywać jednostek w Łagiszy i Jaworznie. I Bełchatów też nie pomoże jeśli nieumyślnie będziemy tym zarządzać."
DGR_alternative_power_sources: "Otwarcie na alternatywne źródła energii"
DGR_alternative_power_sources_desc: "No dobra, przekonałem się. Znaczy nie cieszmy się tutaj przedwcześnie, bo to że faktycznie otwieramy się na inne źródła energii nie znaczy że tutaj zaraz będziemy tworzyć zieloną komunę i śpiewać wesołe piosenki z sarenkami i gołębiami. Elektrownie wodne, pewnie. Panele słoneczne - jasne. Wiatraki...nie bardzo jest gdzie - jeśli będzie się opłacało to spoko, możemy postawić. Atom? Ta kurwa, jasne. \n\nTo jest stricte pragmatyczne podejście - musimy załatać czymś dziury w miksie energetycznym, i nie za bardzo obchodzi mnie to że jacyś jajogłowi będą siedzieć i skrzeczeć że łolaboga, planeta płonie. No płonie bo jesteśmy w stanie jebanej wojny domowej i bombardujemy się nawzajem. To jak ma nie płonąć? Ale raz w wiatrak to nie lewak. A klimatyści zamknąć ryje."
DGR_hard_coal_union: "Wspólnota Węgla Kamiennego"
DGR_hard_coal_union_desc: "W sumie to jednak nie wiem kto jest bardziej wkurwiającym pomiotem ludzkim - klimatyści czy górnicy. Jedni i drudzy traktują podejście do energii jak cholerną religię - podczas gdy większość rzeczy da się sprowadzić do turbo prostego równania. Co możemy to będziemy wykorzystywać. Ale no tak - weźmiesz tutaj pozwolisz żeby powstały jakieś farmy słoneczne czy wiatrowe i zaraz czujesz na karku oddech tych pieprzonych górników. Bo im się należy rekompensata, bo jak to tak można nasz wspaniały węgiel prześladować i tak bez końca...\n\nWspólnota Węgla Kamiennego, która dzisiaj jest powoływana ma dwa zadania - pierwsze, sprawić że górnicy zamkną mordę i zajmą się czymś pożytecznym oraz drugie, zapewnią prawidłowe funkcjonowanie wszystkiego co związane z wydobyciem węgla i jego zagospodarowaniem. Bo musimy nad nimi sprawować kontrolę i nie możemy pozwolić żeby zaczęli zakładać jakieś związki zawodowe. Bo wtedy to już w ogóle nad nimi nie zapanujemy i każdy jeden chuj z kilofem będzie czuł się jak władca ziemi i podziemia."
DGR_equality_committee: "Komitet Równości"
DGR_equality_committee_desc: "Oczywiście że równość jest ważna! Aczkolwiek w większości przypadków chodzi o to żeby wszystkich wyrównywać w dół. Bo Ci na górze mają zdecydowanie za dużo. I słusznie, bo zazwyczaj Ci którzy mają ogromne majątki nie są ludźmi godnymi zaufania. Więc nie ufamy im i zagospodarujemy ich dobrami za nich. A Ci którzy uważają się za lepszych od innych z każdego błahego powodu? Nie ma nic kurwa gorszego od takiego człowieka z wyjebanym ego. Przysięgam, dla niektórych nie będzie litości jeśli kogoś się będzie traktowało z pogardą za to że czegoś nie ma lub pochodzi z innego miejsca niż jaśnie panowie szlachcice od siedmiu boleści. \n\nSkowyt uprzywilejowanych osób będzie tak ogromny że może wywołać trzęsienie ziemi. Ale oj, będzie warto - tylko po to by zobaczyć miny tych ludzi kiedy karma w końcu wróci. A karma to wredna suka. I ja jestem jej awatarem."
DGR_being_rich_is_being_enemy: "Bogactwo to wróg"
DGR_being_rich_is_being_enemy_desc: "Bogactwo ma to do siebie, że najczęściej jest uzyskane kosztem innych. Wyzysk w dobie kapitalizmu jest dla niektórych tak prosty jak oddychanie. Oczywiście, trzeba być moralnym zerem, żeby bez wyrzutów sumienia żerować na społeczeństwie i patrzeć jak reszta tapla się w biedzie. Każdy kto dorobi się dużego majątku ma obowiązek ten majątek zwrócić społeczeństwu. Ten kto tak robi będzie doceniany. Ten kto będzie gromadził ogromne bogactwa tylko dla siebie będzie wrogiem ludu.\n\nA z wrogami ludu...cóż. Tu się zastanawiam. Bo jednocześnie moglibyśmy załatwić sprawę bardzo szybko i efektywnie, wystarczy wszak jeden rozkaz. Ale czy nie ciekawiej byłoby dać tutaj możliwość egzekwowania sprawiedliwości ludowej? Dać ludziom poczucie sprawczości oraz okazję na zemstę. Pod czujnym okiem gwardii oczywiście, żeby nie doszło do eskalacji i przeniesienia konfliktu na inne jednostki należące do ludu pracującego. Zastanowię się nad tym..."
DGR_pink_files: "Różowe teczki"
DGR_pink_files_desc: "Pewne rzeczy współczesne ruchy neoliberalne i lewicowe cyniczne wykorzystują do swoich własnych politycznych zagrywek. I ofiarą właśnie padły wszystkie osoby które mają skłonności homoseksualne lub te wszystkie...inne. Nie będę ich tu wymieniał ale wiecie. I o ile część z nich to zakrawa o chorobę psychiczną i takie osoby powinno się kierować jedynie na terapię, to sam fakt posiadania takich skłonności nie dyskwalifikuje jednostki - nie jesteśmy przecież nazistami. \n\nAle...nie wszystkie skłonności są zdrowe dla społeczeństwa. A ludzie posiadający takie orientacje mają tendencje do działalności wywrotowej, głównie inspirowani właśnie i podjudzani przez reakcjonistów liberalnych którzy po swojej wygranej najchętniej sami udawaliby że takie osoby nie istnieją. My tego robić nie będziemy. Będziemy bardzo zainteresowani ich istnieniem. Co robią w zaciszu prywatnym to ich sprawa, ale warto byłoby posiadać informację na temat tego kto jaką orientację ma. I nie ma tu się co ukrywać, w końcu za kłamanie urzędnikom państwowym...no tu wtedy docieramy do kary. Ale ta kara nie będzie rozróżniała kogo preferujesz."
DGR_red_scare: "Czerwony popłoch nad Polską"
DGR_red_scare_desc: "Idą komuniści! Czerwona zaraza! Szumowiny komusze! Rusofilskie onuce! Machina propagandowa skierowana przeciwko nam ma się bardzo dobrze, byleby obrzydzić nasz ruch i wypracować w ludziach skojarzenia ze wszystkim co najgorsze. Tłumaczenie się tutaj nic nie da, kretyni swoje będą wiedzieć a Ci którzy to wszystko napędzają będą się tylko śmiać z nas. \n\nDlatego nie pozwolimy na żaden śmiech. Niech się boją. Zobaczą co to znaczy narodowy bolszewizm w akcji. Wywrotowcy i wszyscy inni przeciwnicy poczują na swojej skórze terror o jakim ostrzegają. Dopiero poznają co to znaczy strach przed komunizmem. I nawet nie będziemy musieli wtedy im mówić że my nie do końca jesteśmy komunistami a tak naprawdę to w ogóle nie wierzymy w to ideologiczne bajoro. \n\nPozostanie tylko strach."
DGR_illusion_of_bolshevism: "Iluzja bolszewizmu"
DGR_illusion_of_bolshevism_desc: "Wspominałem już jak bardzo mam w dupie komunę? A jednocześnie wszyscy uważają mnie za jednego z najważniejszych liderów współczesnego komunizmu. Kurwa, powinienem pójść do szkoły aktorskiej a nie marnować się na wojaczce w takim wypadku. I tak, wszyscy patrzą przez pryzmat Towarzysza Demencji który przecież Lenina karmił piersią, ale...\n\nSzczerze, nie wiem jak długo będę w stanie podtrzymywać tę iluzję. Wydawało mi się, że podczas Wojen Dzielnicowych wytrzymam maksymalnie dwa tygodnie. Złośliwi dawali mi dwa dni. A to już ponad dekada. Jeśli ktokolwiek zajrzy do środka tego kraju to w parę minut zorientuje się że to nic nie ma wspólnego z żadnym komunizmem, bolszewizmem czy innym izmem. Co w sumie z drugiej strony idealnie wpisuje się w narrację wszystkich popleczników czerwonego reżimu:\n\nTo nie jest prawdziwy komunizm!"
DGR_day_of_the_sickle: "Dzień Sierpa"
DGR_day_of_the_sickle_desc: "Jak już zostaliśmy jedynymi gospodarzami w tym domu Polską zwanym...to wypadałoby tutaj troszkę posprzątać. Wszak to właśnie na właścicielu spoczywa obowiązek utrzymania czystości. A nie kłamiąc - jest co (i kogo) sprzątać. Odziedziczając cały kraj dostaliśmy w spadku tak mnóstwo elementów reakcyjnych i ludzi którzy po prostu chcieliby zobaczyć jak Polska dalej płonie, że czasami zastanawiam się czy im się to nie nudzi? \n\nIleż można opierać się przeciwko wyimaginowanym wrogom tylko dlatego, że to nie rządzi twoje plemię? Przecież przynieśliśmy tutaj pokój i stabilność. Mamy nowy kraj i chuj. Radźcie sobie z tym. Przegraliście. A jeśli będziecie dalej próbowali walczyć...to nie martwcie się, mamy dla was specjalne programy wakacyjne. Takie na wieczność.\n\nIle razy możemy im dawać lekcje pokory zanim się w końcu małpy nauczą? "
DGR_military_fiefdoms: "Wojskowe lenna oficerów"
DGR_military_fiefdoms_desc: "Mogłem się spodziewać, że faworyzowanie ludzi którzy nie mają w sobie pierwiastka przywództwa skończy się całkowitą degrengoladą pozycji władzy. Większość generalicji w tym momencie posiada swoje własne...folwarki? Bawią się w szlachciców na swojej ziemi wypełniając jakieś dziecięce fantazje o byciu królem. O ile jest to ograniczone do kilku garnizonów na danym obszarze to spoko.\n\nBoję się jednak, że rozprzestrzeni się to na pobliskie miasta, a potem już pójdzie województwami i skończymy w nowej erze rozbicia dzielnicowego. Na szczęście wszyscy z nich muszą odpowiadać przede mną, a ja już się postaram o to by ich utemperować. W szczególności, że w czasie pokoju nie będziemy potrzebowali sporej części z nich. Niech siedzą na swoich działkach i nie wyściubiają z nich nosa. Przysłużą się w ten sposób społeczeństwu bardziej niż próbując udawać władców regionalnych."
DGR_ultimate_autarky: "Całkowita autarkia"
DGR_ultimate_autarky_desc: "Położenie naszego kraju zawsze było...łagodnie mówiąc chujowe. Teraz dodatkowo będąc otoczonymi przez kraje które w żadnym stopniu nie podzielają naszego światopoglądu i wizji, jesteśmy skazani sami na siebie. I o ile możemy gdzieniegdzie dać radę zawrzeć jeden czy dwa traktaty to w dużej mierze nikt z nami nie chce mieć nic do czynienia. \n\nNaiwnym byłoby oczekiwać, że ktoś nam w ogóle pomoże. Państwa mają tylko interesy, a w ich interesie byłoby jedynie zobaczyć jak Polska dalej płonie. Nasza gospodarka szczególnie ucierpi na tym geopolitycznym równaniu, przez co nie możemy być zależni od kogokolwiek. Totalna autarkia. Samowystarczalność w każdym stopniu. To da się osiągnąć i można - kto jak nie my? Już i tak przemysł powstał z kolan, i dajcie nam kilka lat na odbudowę a wszyscy będą błagać nas żebyśmy pozwolili im coś od nas kupić. Tylko kilka lat."
DGR_iron_curtain: "Opuszczenie Żelaznej Kurtyny"
DGR_iron_curtain_desc: "Ten kto kiedykolwiek powiedział że Polska ma przyszłość tylko w silnej Europie przespał ostatnie dwie dekady. Jedyna przyszłość na jaką zasługuje Polska to taka, w której będzie sama decydowała o swoim losie i nie była skazana na pastwę losu hegemonicznego zgniłego germańskiego molocha jakim była Unia Europejska. Na szczęście rozkład tego tworu czuć aż za Odrą, a reszta kontynentu wcale nie znajduje się w lepszej sytuacji.\n\nNiemieckie inwazje nie mogą już nigdy się powtórzyć. Rosyjskie inwazje nie mogą nigdy się powtórzyć. Nie możemy pozwolić żeby kiedykolwiek jacyś zbłąkani rzeźnicy z Ukrainy pojawili się na Polskich terenach. Żaden Czech ani Słowak nie przekroczą już gór by grabić i mordować nasz naród. Żaden Litwin i Białorusin nie odważy się stanąć naprzeciw nam. Fortyfikacje, kontrole graniczne, pułapki, i nieustanna straż nad naszymi kresami pozwoli całemu społeczeństwu spać spokojnie, lecz być gotowymi na to że wrogów mamy wszędzie."
DGR_national_disposition_authority: "Narodowy Urząd Dyspozycyjny"
DGR_national_disposition_authority_desc: "Wolny rynek to kpina z ludzi. Jest to ogromny ocean na który wrzuca się ludzi z których większość nie potrafi pływać i liczą na to że gospodarka będzie szła do przodu bo uwolnimy przedsiębiorczość ludzi. Jasne, jedno czego nie uwolnimy to wyzyskiwaczy z więzień gdzie ich wsadzimy za żerowanie na ludziach i ich dobytkach. Gospodarka musi być planowana - z miejscem na improwizację oczywiście, ale główny cel musi być jasno ustalony i wszystko musi działać zgodnie z istniejącem planem. Bo inaczej to państwo nie będzie funkcjonować, każdy będzie robić co mu się żywnie podoba i zapanuje jeden wielki chaos. A na tym korzystają tylko cwaniaczki a nie normalni ludzie. \n\nNarodowy Urząd Dyspozycyjny ma stanowić organ kierujący państwową gospodarką. Oczywiście, sterowanie całą ekonomią to bardziej sterowanie ogromnym statkiem. Nie ma za dużo miejsca na manewrowanie i gwałtowną zmianę kursu. Miejmy tylko nadzieję, że nie czekają na nas żadne góry lodowe po drodze..."
DGR_economic_maneuver: "Manewr gospodarczy"
DGR_economic_maneuver_desc: "Nie da się ukryć że gospodarka została doprowadzona na skraj...upadku. I oczywiście jak zwykle to wszystko wina ludzi którym wydaje się że są oni wspaniałymi mecenasami ekonomii i pozjadali wszystkie zmysły podczas gdy jedyne co pochłonęli to streszczenie \"Kapitału\" Karola Marksa nie rozumiejąc przy tym ani jednego słowa. I tak oto doprowadzili rynek nieruchomości do załamania, kolektywizacją dobili rolnictwo, a w miejscu gdzie kiedyś były fabryki i miały one powstać na nowo - są jedynie rozkopane doły i szkielety budowli. \n\nZ pewnością lepiej będzie jeśli to wojsko od teraz będzie wyznaczało kurs. Ekonomiści już pokazali na co ich stać - ich porażka jest o tyle nam potrzebna, że bez problemu to my teraz możemy przejąć stery i poprowadzić państwo do lepszej przyszłości. A to, że nie do końca znamy się na tym? Naczelny Pionier się zna. Zaraz sobie z nim porozmawiam i zrobimy taki plan gospodarczy, że w parę lat staniemy się europejską potęgą. Tak będzie, nie śmiejcie się!\n\nCo gorsza, Politbiuro ogłosiło manewr gospodarczy w celu zatrzymania postępującej tragedii. Nie ufam im na tyle, żeby wiedzieć że to po pierwsze nie oznacza nic dobrego dla kraju, a po drugie w żaden sposób nie przyczyni się do wzmocnienia wysiłków wojska. Będą sobie budować nikomu nie potrzebne fabryki kapeluszy słomianych a wojsko dalej będzie niedofinansowane i zbrojeniówka będzie leżeć i kwiczeć. Niech to wszystko już pierdolnie, błagam."
DGR_real_estate_takeover: "Przejęcie nieruchomości przez wojsko"
DGR_real_estate_takeover_desc: "Dzień Dobry mieszkańcy bloków! Od dzisiaj wojsko ma wyłączność na rozporządzanie nieruchomościami ze względów wyjątkowej sytuacji jaka ma miejsce w Polsce. Jesteśmy w stanie wojny, prawda? No, także wojsko potrzebuje mieć dostęp do każdego miejsca, do każdego budynku i każdej piwnicy. Podczas działań operacyjnych wszystkie z nich stanowią twierdzę nie do przejścia dla wroga, a gdy znajdują się one na zapleczu frontu...gdzieś nasi żołnierze muszą być zakoszarowani. Nie chcemy żeby spali oni na zimnej ziemi, tylko chcemy żeby byli wypoczęci by móc jak najlepiej walczyć, co nie? \n\nNo, także - jeśli ktoś będzie należał do wojska to również będzie mu przysługiwało priorytetowe miejsce na liście oczekującej na swoje własne mieszkanie komunalne. Skąd je weźmiemy? Proste - zabierzemy wszystkim landlordom i ogarniemy pustostany. Nie, landlordzi nie będą protestować. Ciężko krzyczeć będąc w więzieniu. Znaczy możesz, ale nikt Cię nie usłyszy. Więc, jeśli chcecie zabezpieczyć byt swoim rodzinom - wstępujcie do wojska a już za kilka lat będziecie mogli wypoczywać we własnym mieszkaniu!"
DGR_reindustrialization_effort: "Wzmożony wysiłek reindustrializacyjny"
DGR_reindustrialization_effort_desc: "Mam nadzieję, że już wspominałem jak bardzo gardzę Balcerowiczem i jego kohortami liberałów którzy sprzedali nasz kraj za grosze? I gówno prawda że świat się zmienia i musieliśmy wejść w rynek usług. Potężne kraje nie rezygnują ze swojego przemysłu całkowicie tylko dlatego że ktoś uznał że to jest już niewspółczesne i musimy się przebranżowić. Staliśmy się śmietniskiem gospodarczym Europy w zamian za ochłapy z dotacji.\nProces reindustrializacji jaki podejmujemy jest słuszny, tylko musimy go do końca dociągnąć! Brakuje nam póki co głównie woli politycznej i szybkich decyzji by móc odbudowywać więcej fabryk! Dlatego musimy przekazać więcej środków na ten cel bo jest on gwarantem naszego dobrobytu, i tylko w ten sposób będziemy mogli pokazać reszcie świata że era industrialna nadal trwa i w dupie mamy wasze Excele!"
DGR_restitution_of_family_farms: "Przywrócenie prywatnych gospodarstw"
DGR_restitution_of_family_farms_desc: "Rozwalenie młotem całego systemu rolniczego oczywiście musiało się tak skończyć. Od czasów starożytnych jak wkurwiłeś chłopów to miałeś problemy. I tak właśnie próbowano wprowadzić przymusową kolektywizację, jak gdyby nie nauczyli się na błędach w ostatnim stuleciu. Ale trzeba wybaczyć Politbiuru, wszak oni są tak zacofani że są dopiero na etapie rewolucji październikowej i myślą że Lenin zaraz przyjedzie w Pendolino do Sosnowca. Nie przyjedzie, bo tam nie staje. \n\nMusimy teraz wycofywać się z tych źle podjętych kroków i przywrócić częściowo przynajmniej póki co prywatne gospodarstwa rolne, oddać ziemie i pozwolić ludziom żeby nią na powrót zarządzali. Bo inaczej to byłoby bardzo śmieszne gdyby komunistyczny rząd został obalony przez bunt chłopski. Aż mnie trochę kusi żeby to zobaczyć...ale cóż. Trzeba wrócić do starego modelu a nowy wprowadzać powoli. Bo inaczej wszyscy umrzemy z głodu."
DGR_garrison_cities: "Miasta garnizonowe"
DGR_garrison_cities_desc: "W stanie wojny domowej ogarniającej cały kraj nie powinniśmy pozostawiać miast samopas. Oprócz tego że są wylęgarnią reakcjonistów i liberałów to w dodatku stanowią ogromne strategiczne punkty gdzie można bronić się miesiącami a nawet i latami. Dlatego nie możemy dopuścić do tego żeby takie miasta stracić, a zaplecze logistyczne jakie zapewniają jest nieocenione na głębokim froncie i podczas różnych wojskowych operacji.\n\nSkoro obecnie to wojsko stanowi pieczę nad nieruchomościami, musimy zadbać o odpowiednie zakoszarowanie naszych żołnierzy i rozmieszczenie garnizonów tak żeby były one w każdym największym ośrodku miejskim. Żeby nie było tutaj żadnych niedopowiedzeń - to również zwiększy bezpieczeństwo obywateli. W końcu to wojsko będzie mieszkać razem z nimi w tych miastach - a nie ma nic bardziej gorszego niż walka z człowiekiem który bije się o swój dom. "
DGR_grants_for_military_production: "Dotacje na produkcję wojskową"
DGR_grants_for_military_production_desc: "Musimy przestawić gospodarkę na prawidłowe tory. I jasne, rozwijamy przemysł - odbudowujemy fabryki, stawiamy nowe zakłady produkcyjne, rozszerzamy operacje wydobywcze surowców, wzmacniamy sieć energetyczną. Ale bez przemysłu zbrojeniowego wszystko to spali na panewce. Żeby wygrać tę wojnę będziemy potrzebowali o wiele więcej zakładów produkujących broń, amunicję czy pojazdy. Obecnie mamy ich sporo, ale nadal trzeba więcej. \n\nZałożymy dodatkowy fundusz który będzie zajmował się dofinansowaniem przemysłu zbrojeniowego - ułatwienia w prowadzeniu fabryk, lepsze warunki dla pracowników, najnowocześniejsze maszyny i technologie. Nie możemy tutaj oszczędzać choćby na jednym naboju. Bo każdy pocisk to jeden wróg ojczyzny mniej. A ci sami się ustawiają w kolejce i nie widać żeby zaczynało ich brakować... "
DGR_military_settlement: "Promowanie osadnictwa wojskowego"
DGR_military_settlement_desc: "O co walczymy? O Polskę. O naszą ziemię. Ziemię...cóż. Będzie jej sporo do rozdania po tym jak się zaczniemy rozprawiać z wrogami. Niemcy podczas wojny kusili swoich żołnierzy ofertą Lebensraum na wschodzie, że będą mogli się w spokoju osiedlić jak wyrzucą wszystkich niegodnych ich germańskiej rasy. A podczas której wojny zapytacie? Cóż, bardzo śmieszne jest to że stało się to również i podczas tej z 2025 roku. Nad Wartę i Odrę ściągnęli hordy ludzi o chorym przekonaniu że to jest ich pradawny dom. \n\nAle nawet pomijając Niemców, będzie dużo do zagospodarowania. Dlatego warto byłoby faktycznie zająć się tym faktem i dać naszym żołnierzom możliwość przejęcia właśnie takich paru hektarów po redystrybucji. Bo im się oczywiście należy a o weteranów trzeba dbać. Inaczej można się po kilku latach spotkać z ultrawojowniczym niezadowolonym ruchem politycznym. A tak będą sobie siedzieć i uprawiać ziemię, nikomu nie wadząc i ciesząc się zasłużonym odpoczynkiem. To bardzo pokojowe życie, po dekadzie wojny."
DGR_special_commission_for_combating_sabotage: "Specjalna Komisja do spraw Zwalczania Sabotażu Przemysłowego"
DGR_special_commission_for_combating_sabotage_desc: "Sabotaż gospodarczy to nie tylko ludzie którzy przychodzą pod zakład i go podpalają. To także ludzie którzy nie wykonują swojej pracy odpowiednio, albo sekretarze firm którzy nie hołdują standardom politycznym naszego państwa. To każda osoba która świadomie stwierdzi że nie wykona planu gospodarczego, albo zignoruje prośby o przyłożenie się do swojej pracy. Każdy kto swoją ignorancją albo głupotą narazi zakład na straty - przyczynia się do sabotażu państwa. I czy się stoi czy się leży - tutaj wpierdol się należy.\n\nDlatego powołujemy specjalną komisję do zwalczania przejawów takiego sabotażu, która będzie miała praktycznie wolną rękę jeśli chodzi o egzekwowanie dyscypliny antysabotażowej wśród zakładów przemysłowych. Niezapowiedziane kontrole, inwigilacje, prowokacje - wszystko co osiągnie cel. A celem jest praca profesjonalna i rzetelna bez miejsca na miałkość i pazerność - wszyscy pracujemy dla dobra wspólnego. W każdym centrum przemysłowym postawimy kilku specjalnych komisarzy z możliwością operacyjną. W ten sposób bardzo szybko rozprzestrzenimy poczucie dyscypliny pośród wszystkich bumelantów."
DGR_5_year_plan_2: "VIII Plan Pięcioletni"
DGR_5_year_plan_2_desc: "Plany gospodarcze mogą być w teorii spoko, ale w praktyce to jeden wielki ból dupy. Zamiast chaotycznego inwestowania w cokolwiek przyniesie światowa ekonomia i te wszystkie teorie o popycie i podaży, my wprowadzamy swój własny chaos pod przykrywką świetnie zaplanowanego przedsięwzięcia. Kapitaliści się z nas śmieją bo, oczywiście, nie możesz tak sobie zdecydować w którym roku będzie rozwijał jakie sektory gospodarki. Znaczy ja mówię że można, ale co ja tam wiem - w końcu już to zrobiliśmy. I nadal mam w piździe austriaków i ich zasraną szkołę gospodarki. Jebać ich. Wiemy co zrobiliśmy źle i nadal wiemy czego ludzie oczekują. Będziemy trzymać ster by wypełnić ósmą pięciolatkę w historii istnienia Polski. Siódma była troszkę mniej efektywna niż byśmy tego chcieli. Ale to przez wojnę, gdyby nie ona - już byśmy byli bogaci."
DGR_infrastructure_roads: "Wysiłek infrastrukturalny: Drogi"
DGR_infrastructure_roads_desc: "Drogi to krwioobieg państwa. Bez nich we współczesnym świecie nie ma żadnej ofensywy, nie istnieje zaplecze logistyczne a żołnierze będą grzęźli w nieprzyjaznym terenie. Obiecywano nam przez dekady że teraz to już na pewno zrobimy tyle dróg że będziemy mogli kurwa jeździć w kółko bez końca. Biorąc pod uwagę ilość rond to faktycznie, w kółko możemy jeździć. Robienie rond to działanie na szkodę wojska, bo jak mamy manewrować na takich wynalazkach ciężkim sprzętem którego długość to jest pół takiego skrzyżowania? Nic dziwnego że potem pismaki śmiały się w swoich mediach że kolejny wypadek konwoju wojskowego skoro nie są przystosowane do ruchu wojskowego! Musi być prosto i szybko! Wszystkie dziury łatać, odbudować zniszczenia i jechać prosto na Berl...znaczy się na wroga! "
DGR_infrastructure_airports: "Wysiłek infrastrukturalny: Lotniska"
DGR_infrastructure_airports_desc: "Wraz z rozwojem naszych sił lotniczych musimy zadbać o to by mieć gdzie lądować i skąd startować. Polska na szczęście należy do tych krajów gdzie niektóre lotniska wybudowane zostały bez powodu i stały puste, jak to w Radomiu. Jest też mnóstwo nieużywanych lądowisk które możemy rozbudować by pełniły rolę pełnoprawnych lotnisk. Sporo z nich to ledwo trawiasty pas na którym ledwo co można się rozpędzić więc te inwestycje będą musiały być znaczące. Ale będzie warto gdy siły lotnicze przechylą szalę zwycięstwa na naszą stronę i przestworza staną się nasze! A loty cywilne? Cóż...niepotrzebne póki co. Gdzie wy chcielibyście latać, co? Uciekać za granicę? Niedoczekanie. Póki walczymy to żaden samolot cywilny z pasażerami nie będzie tutaj wywoził ludzi poza nasz kraj. "
DGR_infrastructure_railways: "Wysiłek infrastrukturalny: Kolej"
DGR_infrastructure_railways_desc: "Może i trochę przestarzałe w obliczu samolotów, ale nadal z potencjałem - koleje państwowe. Nie jesteśmy niestety Japonią czy Francją żeby mieć superszybkie pociągi które w oka mgnieniu transportują ludzi i materiały z jednego końca kraju na drugi. Ale...kto powiedział, że nie możemy tacy być? Bo co? Bo Polak to gorszy? Pendolino to było nietrafiona inwestycja która nigdy nie była dopasowana do naszej rzeczywistości bo to jakby jeździć Ferrari do kościoła oddalonego o 500 m. Idiotyzm. Dlatego najpierw musimy rozbudować naszą infrastrukturę kolejową by można było potem umieścić na nich nasze superszybkie pociągi. Produkowane u nas oczywiście. I póki co skupione na przewozie towarów bo będą wspaniałym uzupełnieniem naszej logistyki. O przewóz ludzi będziemy się martwić później."
DGR_infrastructure_naval_ports: "Wysiłek infrastrukturalny: Porty"
DGR_infrastructure_naval_ports_desc: "Co prawda jestem okropnie sceptycznie nastawiony co do w ogóle pomysłu jakim jest inwestowanie w marynarkę wojenną, no ale mleko się już rozlało. Oczywiście możemy sobie funkcjonować w przekonaniu że to jest potrzebne, ale szczerze - kogo obchodzi flota? Nikt z tego nie korzysta i jest tylko fanaberią ludzi którzy mają za dużo czasu i pieniędzy. No ale skoro faktycznie robimy okręty wojenne to zróbmy to porządnie. Porty rzeczne powinny zostać rozbudowane by móc takie jednostki stacjonować. Plus może uda się przywrócić coś na wzór handlu rzecznego. Szybkie to nie będzie, będzie stanowić ogromny cel ale...nie no nie, nie mam kurwa argumentów za. Najwyżej to może stanowić pierdoloną zmyłkę dla wroga bo puścimy tam transport mydła. No nie wiem."
DGR_state_maternity_facilities: "Państwowe Placówki Macierzyństwa"
DGR_state_maternity_facilities_desc: "Współczesne społeczeństwo późnego kapitalizmu dewoluowało w nieustanny stan wojny płci pomiędzy odklejonymi feministkami a różnego rodzaju wojownikami męskości którzy nasłuchali się za dużo kryptogejów pokroju Andrew Tate'a. To wszystko jest tak kurwa męczące...ale na szczęście podczas wojny domowej nie trzeba przejmować się takimi pierdołami. Czym natomiast musimy się przejmować to przyrost naturalny. Statystyki są nieubłagane i nie pomagają dopłaty, opłaty, prośby, groźby. Każdy z nas jako obywatel ma pewne obowiązki wobec państwa które zapewnia im opiekę. Kobiety z racji biologicznej będą miały je inne niż mężczyźni. Głównym z nich jest oczywiście macierzyństwo. Dla wyselekcjonowanej części kobiet stworzymy placówki gdzie od poczęcia do narodzin będą czuły się jak w domu i zapewnimy im najlepszą opiekę jaką będą mogły sobie wyobrazić.\nW ten sposób zapewnimy przyszłość pokoleniom które odziedziczą ten kraj. Bo to muszą być dobre pokolenia, nie możemy przecież oddać sterów w ręce nieudaczników..."
DGR_genome_alignment_lab: "Laboratorium Doskonalenia Genomu"
DGR_genome_alignment_lab_desc: "Technologia przynosi wiele zagrożeń, ale czasami jednak przynosi nadzieję. Ludzie to biologiczne maszyny zaprogramowane przez naturę w pewien określony sposób. Więc dlaczego my po prostu nie zmienimy kodu? Wiele się mówi o chorobach genetycznych ale gdy można je wyeliminować jedną prostą zmianą w kodzie genetycznym to czy nie warto byłoby w to inwestować? A co jeśli po prostu uda nam się stworzyć bazę na podstawie której będziemy mogli sprawić że rodzące się dzieci już nie będą narażeni na poważne i przewlekłe choroby? A co jeśli damy radę wykorzystać to by jakąś jednostkę wzmocnić? Nie chcę iść tutaj w eugenikę i oczywiście wybiegam przed szereg i upraszczam cały ten proces...ale...nie zmienia to faktu że musimy utworzyć laboratorium które całym swoim wysiłkiem będzie starało się odkodować potencjał genetyczny. Dla naszego dobra."
DGR_national_science_department: "Narodowy Wydział Nauki"
DGR_national_science_department_desc: "Naukowcy są niezbędni do długofalowego rozwoju każdego państwa, a co za tym idzie, wymagają szerokiego finansowania ze strony państwa. To prosty fakt. Intelektualiści bardzo lubią, gdy ktoś im o tym przypomina. Nie podoba im się natomiast równie prosty wniosek, który z tego wynika: ten, kto płaci, ten wymaga. W ich idealnym świecie chcieliby wyssać budżet na badania i rozwój do ostatniego grosza, mając jednocześnie pełną swobodę prowadzenia badań, które interesują wyłącznie ich samych i ich kolegów. Niedoczekanie. Otrzymają finansowanie dopiero wtedy, gdy udowodnią, że ich projekt badawczy jest wartościowy z punktu widzenia państwa. I oczywiście ich działalność będzie stale monitorowana."
DGR_secret_nuclear_facilities: "Tajne Zakłady Nuklearne"
DGR_secret_nuclear_facilities_desc: "Tajne Zakłady Nuklearne to był swojego czasu śmieszny kryptonim jednego z technikum w Dąbrowie Górniczej - Technicznych Zakładów Naukowych. Po polsku to brzmi śmiesznie. Inni nie do końca zrozumieją. Mniejsza - i tak tam już założyliśmy centrum dowodzenia, nasz sześciokątny Pentagon. I tak, zdaję sobie sprawę z ironii. Nie mniej, potrzebujemy odpowiednich placówek w których będziemy mogli prowadzić badania które...jak sama nazwa wskazuje będą tajne. Nie ma nic bardziej tajnego niż podziemia. W budynku centrum sztabu gdzie była szkoła są właśnie podziemia. I jeśli połączymy je z halą ludową obok...możemy mieć naprawdę rozbudowane podziemne laboratoria w których będziemy badać różne ciekawe opcje technologiczne. Jakie? Nie interesuj się kurwa bo kociej mordy dostaniesz. Są tajne nie bez powodu."
DGR_incorporate_faculty_of_nature_science: "Inkorporacja Wydziału Nauk Przyrodniczych"
DGR_incorporate_faculty_of_nature_science_desc: "Filia Uniwersytetu Śląskiego w Sosnowcu. Czy muszę mówić coś więcej? Przez dziesięciolecia Uniwersytet z Katowic rozwijał tę placówkę z myślą o rozwoju nauk przyrodniczych. Ale dlaczego cokolwiek śląskiego miałoby mieć coś wspólnego z zagłębiowskim miastem? Czas naprawić ten błąd, oddzielając słynną \"Żyletę\", aby pomóc Zagłębiu stanąć na własnych nogach, jeśli chodzi o naukę. Oczywiście pojedynczy wydział nie będzie w stanie funkcjonować samodzielnie, dlatego zostanie zintegrowany z rozwijaną przez nas zagłębiowską infrastrukturą. Poza tym taka restrukturyzacja pozwoli nam dokładniej przyjrzeć się jego kadrom i organizacji."
DGR_home_of_revolution: "Kolebka rewolucji"
DGR_home_of_revolution_desc: "Dąbrowa. Polska ojczyzna rewolucjonistów i ruchu socjalistycznego w tej części kraju. Tu wykształcał się ruch robotniczy oraz rewolucyjny. Walczyliśmy już o wolność za czasów powstania styczniowego a potem pod koniec I wojny czy w czasie II wojny. Kiedy nadszedł pokój, czas nastał na inne rewolucje - dlatego też teraz mamy największe z zakładów przemysłowych w kraju. Ilość pomników komunistycznych znajdujących się na terenie miasta również zawsze przewyższała wszelkie normy. I to z Dąbrowy teraz wychodzi iskra która odmieni oblicze tego kraju na nasz obraz i podobieństwo. Po raz kolejny jesteśmy zwiastunami rewolucji."
DGR_zaglebie_only_city: "Jedyne miasto Zagłębia"
DGR_zaglebie_only_city_desc: "Jakie jest Zagłębie? Ano Dąbrowskie. Prawda. Na co komu w takim razie Sosnowiec? Albo Będzin? Dąbrowa zasługuje na miano największego miasta w Polsce. Poza tym, nie jesteśmy tu od wczoraj. Sięgaliśmy dalej na wschód i zachód. Zagórze, Ksawera, Sławków - to wszystko były tereny należące do Dąbrowy Górniczej. Ale ten etap konsolidacji mamy już za sobą. Ślązacy usilnie chcieli mieć metropolię ale na każdym kroku odmawiali nam równej reprezentacji, rzucając nam ochłapy takie jak uwzględnienie Zagłębia w nazwie. Łaski bez - zrobimy sobie własną metropolię, bez hanysów i bez śląskiego bałaganu."
DGR_urbanization_tricity: "Wysiłek urbanizacyjny: Trójmiasto"
DGR_urbanization_tricity_desc: "Słynne Dąbrowskie Trójmiasto - Łosień, Łęka, (Ł)Okradzionów. Ale same nazwy tych miejsc wskazują że nie są one zbytnio rozwinięte. Głównie to tereny nadal wiejskie, z gęstymi lasami i rozległymi polami. Spoko, nie są to jednak zarzuty - wręcz przeciwnie! Jest tam mnóstwo miejsca na stworzenie nowych osiedli. Ludziom z prowincji przyda się trochę ulicznej mądrości i luzu. Bo nasze bloki są zajebiste. No i w końcu musimy zredukować trochę procent Dąbrowy wsiowej bo z wielkim terenem przychodzi wielka odpowiedzialność żeby ten teren zabudować w sposób odpowiedni."
DGR_urbanization_strzemieszyce: "Wysiłek urbanizacyjny: Strzemieszyce"
DGR_urbanization_strzemieszyce_desc: "Strzemieszyce to co prawda bardzo niewdzięczna dzielnica, która kilkukrotnie próbowała udawać niepodległe miasto ale historia pokazała wprost, że im się to po prostu nie należy. Strzemieszyce w odróżnieniu od pozostałych dzielnic Dąbrowy zewnętrznej, mają nawet kilka blokowisk. No dobrze - kilka to gruba przesada. To jest parę biednych bloków na krzyż. Ale przynajmniej zaczęli. Przez dzielnicę idzie też główna arteria komunikacyjna na wschód, więc aż się prosi by zacząć tutaj rozbudowę infrastruktury mieszkalnej. A miejsca też nadal jest sporo, chociaż gdzieniegdzie będziemy musieli osuszyć tereny podmokłe. Ale to nigdy nie przeszkodziło w budowaniu wielkiej płyty, prawda?"
DGR_urbanization_ujejsce: "Wysiłek urbanizacyjny: Antoniów i Ujejsce"
DGR_urbanization_ujejsce_desc: "Antoniów, Ujejsce czy Trzebiesławice - im dalej na północ Dąbrowy tym większe to zadupie. Podobnie jak w Polsce ogólnie - na południu cywilizacja i przemysł, a na północy bagno i gówno. Antoniów to w zasadzie część Ząbkowic, ale po tym jak bandyci zrobili sobie z Ząbkowic wielki skłot, ta dzielnica nie nadawała się do zamieszkania zbytnio. Antoniów musimy wydzielić, włączyć do niego osiedle Młodych Hutników i rozbudować. A następnie, iść na północ z budową. W końcu w tym rejonie może powstać kiedyś jakaś wielka inwestycja, która będzie potrzebowała zaplecza w postaci prężnie działających ośrodków mieszkalnych. I miejmy nadzieję - zabudujemy trochę tę biedę."
DGR_expand_pkz: "Rozbudowa Pałacu Kultury Zagłębia"
DGR_expand_pkz_desc: "Możecie zapytać, dlaczego w ogóle ktoś chciał zdecydować się na postawienie drugiego Pałacu Kultury w Polsce? Bo co, ten w Warszawie nie wystarczył? Może i wystarczył, ale Aleksander Zawadzki chciał mieć tak samo fajny pałac w swoich rodzinnych stronach. No i go dostał, ale nie jest on taki wysoki...\n\nPrzez lata chodziły plotki, że to przez to że Dąbrowa jest postawiona na terenach pokopalnianych i jakby zbudowali coś tak gigantycznego to całe miasto by się zawaliło. Śmiechu warte, może się jeszcze skorupa ziemska otworzy i nas pochłonie za grzechy? Nie ma się czego bać, tylko rozbudować! Sięgniemy nieba tą wieżą. I Bóg nas za to tym razem nie ukara - bo nie istnieje."
DGR_niegowoniczki_airstrip: "Przygotowanie lądowiska w Niegowoniczkach"
DGR_niegowoniczki_airstrip_desc: "Absurd lotniska Katowice-Pyrzowice jest wszechobecny na wielu równoległych płaszczyznach. Nie jest w Katowicach, i nie jest nawet blisko Katowic. Jest bliżej Dąbrowy niż Katowic. Zresztą po cholerę im to lotnisko, skoro mają całkowicie dobrą lokalizację na Muchowcu? Nam też się to nie przyda bo leży bardzo blisko granicy państwa, przez co narażone jest jeszcze bardziej niż zwykle na ataki. No i tutaj na ratunek przychodzi nam niepozorna wieś Niegowoniczki. Co z nią? Ano, znajduje się tuż obok Dąbrowy na wylocie z Łośnia. A teraz najlepsze - już tam nawet istnieje malutkie lądowisko. I za dużo ludzi przesiedlać nie trzeba bo tam może z 10 domów jest. Idealne miejsce na lotnisko."
DGR_expand_dw_790: "Rozbudowa drogi wojewódzkiej 790"
DGR_expand_dw_790_desc: "Może i droga wojewódzka 790 prowadzi przez Niegowoniczki, ale zbyt dobra to ona nie jest - dwupasmowa, dwukierunkowa, a do samego lądowiska trzeba jechać polnymi dróżkami. Zapewne kojarzycie państwo nowoczesne lotniska, prawda? Co się dookoła nich znajduje? Autostrady, wielkie terminale, ogromne huby komunikacyjno-zaopatrzeniowe. No właśnie, niestety to będzie największym wyzwaniem. Bo trzeba doprowadzić tutaj cywilizację i rozbudować to na styl tego co znajduje się już w Pyrzowicach. Część da się przenieść, część trzeba będzie zbudować od nowa."
DGR_move_pyrzowice: "Przeniesienie lotniska w Pyrzowicach"
DGR_move_pyrzowice_desc: "Nie wiem co jest trudniejsze - przeniesienie fizyczne terminalu (a raczej skopiowanie go używając tylu części ilu się da), czy cała ta pierdolona papierkologia. No tak - przenieśliśmy lotnisko - i co nam zrobicie? A to że świat dalej używa map na których znajduje się port lotniczy Katowice-Pyrzowice to już nie nasza sprawa! I tak tu nikt nie ląduje zza granicy. Jeszcze. Po wojnie będziemy się martwili z urzędami i podaniami - nie mamy czasu na to teraz. Powstał port lotniczy Dąbrowa. I to powinno wszystkich obchodzić. A nie to czy czasem lotnisko na które lecą istnieje czy nie. Po prostu zrobicie pull up i sobie polecicie dalej. Wielki mi problem..."
DGR_restore_the_land: "Rekultywacja ziemi wokół byłego lotniska"
DGR_restore_the_land_desc: "Tereny dookoła lotniska...kiedyś należały do mojej rodziny. Rodzice babci od strony ojca posiadali tam duże połacie ziemi. Wszystkim żyło się wspaniale, dopóki oczywiście nie przyszli Niemcy, którzy postawili w 1940 tam lotnisko zapasowe dla Luftwaffe. Ludność oczywiście została wypędzona. Ale gdy po zakończeniu wojny ludzie próbowali tam wrócić...Sowieci ich wypędzili po raz drugi. Bo szkoda nie wykorzystać już istniejącego lotniska. A po Sowietach, Wojsko Polskie weszło i zrobiło tam lotnisko wojskowe. Teraz, po prawie stu latach naprawiamy ten historyczny błąd. W końcu...ojcowizna wraca w ręce ludu. Będę sobie musiał postawić tam dom."
DGR_pogoria_naval_commissariat: "Komisariat Marynarki Wojennej Pogoria"
DGR_pogoria_naval_commissariat_desc: "Doświadczenie to my w pływaniu mimo wszystko mamy. Pogoria może i nie jest zbyt dobrym miejscem na centrum marynarki bo nie dopłyniemy tam większymi statkami. Ale możemy tam postawić centrum oficerskie dla floty wojennej, no i żeglarsko też można się tam dokształcać. Nie będzie to idealne, ale jako zaplecze dla naszych kadr które będą swoje pierwsze kroki stawiały w marynarce wojennej sprawdzi się idealnie. W końcu nie ma co wysyłać ich od razu na głęboką wodę. Bo może i jeziora mamy, lubimy i po nich pływamy to nie jesteśmy morskim krajem, nie mówimy do siebie \"Ahoj\". Dlatego zaczniemy od Pogorii, a skończymy na Bałtyku. Tylko nie od razu."
DGR_pieklo_heaven: "Turystyczny raj w Piekle"
DGR_pieklo_heaven_desc: "Piekło jak sama nazwa wskazuje jest idealnym miejscem na wypoczynek. I to nie jest nawet ironiczne stwierdzenie bo kolonia Piekło znajduje się na niewielkim pasie ziemi umieszczonym pomiędzy dwoma najpopularniejszymi zbiornikami wodnymi w Zagłębiu - Pogorią III i Pogorią IV. Już teraz są tam plaże, kluby jachtowe, restauracje, domki na wynajem. Ale wiecie czego tam brakuje? Rozmachu. Wielkie, ludowe kurorty jak w Złotych Piaskach w Bułgarii. Ale nie te prywaciarskie molochy od Gołębiewskiego, lecz komunalne osiągnięcia socrealizmu. Cisza, spokój, woda, obok lasy, blisko do miasta, a jak się obrócisz to nawet widać Hutę Katowice!"
DGR_gierek_university: "Uniwersytet im. Edwarda Gierka"
DGR_gierek_university_desc: "Jak już wszystko nazywamy imieniem Gierka to warto byłoby pozbyć się tego prywaciarskiego wynaturzenia jakim jest Wyższa Szkoła Biznesu. W końcu nawet sama nazwa wskazuje na reakcyjną burżuazję. Biznes. Bo tylko to dla was się liczy, mamona i szmal. Uniwersytet to miejsce na inspiracje, na wymianę idei, na krzewienie idei! Dąbrowa potrzebuje prawdziwej ludowej uczelni. Takiej na której nie będą uczyć pseudoprofesorowie próbujący wcisnąć młodzieży herezje Balcerowiczowskie, ale takie które pokażą im jak może działać państwo dowodzone przez kogoś z planem, gdzie nie zostawia się rzeczy w próżni na pożarcie przez chaos rynkowy lecz działa z determinacją by wszelkie siły natury nagiąć do własnych potrzeb. To jest właśnie socjalistyczny imperatyw. I tego musimy uczyć."
DGR_great_wall_of_brynica: "Wielki Mur na Brynicy"
DGR_great_wall_of_brynica_desc: "Musimy zbudować mur. I sprawimy że Śląsk za niego zapłaci. Ale żarty żartami, naprawdę to zrobimy. Brynica od zawsze była murem który oddzielał ludową cywilizację Zagłębiowską od ciemnych hord Ślązaków. Największym oczywiście problemem jest to że z okien sosnowieckich bloków na najwyższych piętrach widać Katowice. I to nie jest prawda, że najlepsze co Cię może spotkać w Sosnowcu to autobus do Katowic. Najlepszym jest to, że nie będziesz musiał do tych Katowic jechać bo u nas jest lepiej. I w drugą stronę to nie może zadziałać - nie możemy wpuścić tutaj ani jednego Ślązaka. Przyjdzie czas by im pokazać kto rządzi tym krajem, ale póki co w razie zdradzieckiego ataku na serce Zagłębia musimy być ufortyfikowani by móc odeprzeć ich ataki. Bo to już by było zbyt blisko Dąbrowy."
DGR_people_medical_centre: "Ludowe Centrum Medyczne"
DGR_people_medical_centre_desc: "Służba zdrowia w Dąbrowie zawsze miała okropną renomę. Przychodnie odstraszały ludzi personelem i brakiem znieczulenia, SOR był zwany umieralnią, główny szpital był wiecznie niedofinansowany, a placówka na Hucie była podróżą do lat 50 ubiegłego wieku. Trochę lepiej sytuacja miała się w sąsiednim Sosnowcu, ale tak po prawdzie - nie był to idealny stan. To się musi zmienić, nawet jeżeli będziemy musieli wypieprzyć wszystkich lekarzy i znaleźć nowych. Szpital Wojewódzki na granicy Sosnowca i Będzina jest już pokaźnym budynkiem i tam też powinniśmy wpompować wszelkie możliwe środki by chociaż ten jeden szpital był czymś czym możemy się poszczycić."
DGR_our_own_pentagon: "Nasz własny Pentagon"
DGR_our_own_pentagon_desc: "Nasza armia pilnie potrzebuje centrum dowodzenia z prawdziwego zdarzenia. Takiego Pentagonu. Miejsca gdzie sztab będzie mógł się spotykać bez ryzyka że ścianę obok obraduje Komisja do Spraw Mierzenia Średnicy Patelni. Tak po prawdzie, to jest główny powód - żeby uciec jak najdalej od politbiura. W sumie...nie musimy uciekać aż tak daleko. Skoro chcemy własny Pentagon, tak się świetnie składa że jest budynek który bardzo go przypomina. I jest on tuż obok głównego centrum rządowego. Techniczne Zakłady Naukowe. Uczniów przenieść można do innego technikum, sam budynek rozbudować, umocnić i proszę bardzo - jest i sztab!\n\nI tak kurwa, wiem że TZN to heksagon. Chodzi o przykład, ja pierdolę."
DGR_remove_bien_forest: "Wykarczuj las Bienia"
DGR_remove_bien_forest_desc: "Problem z rozwojem przemysłu jest taki że potrzebuje on coraz więcej miejsca. I o ile zazwyczaj mamy go, w obecnych planach sytuacja robi się trochę...krępująco ciasna. Między Tucznawą a Hutą Katowice, tam gdzie planujemy naszą ekspansję, stoi sobie Las Bienia. Ekologowie będą krzyczeć, ktoś tam przywiąże się do drzewa, trochę popłaczą i ich wywieziemy. Będzie drewna dużo na opał, i miejsce się znajdzie. Bo przecież, nie będziemy się rozczulać nad jednym lasem? Dziki i tak włażą pod bloki, nie potrzebują do tego lasów. A tych przecież macie jeszcze trochę, pojedźcie sobie poza miasto i macie a nie oczekujecie żeby w cywilizowanym centrum była dzicz..."
DGR_expand_tucznawa_zone: "Rozbudowa strefy w Tucznawie"
DGR_expand_tucznawa_zone_desc: "Skoro już usunęliśmy największą przeszkodę czyli ograniczenia przestrzenne - możemy zabrać się za rozszerzanie strefy przemysłowej na Tucznawie. I niektórzy powiedzą - ona jest już napompowana przez nas do granic możliwości i tak. A ja powiem - i tak nadal znajdują się lojalni przedsiębiorcy którzy chcą rozszerzać możliwości ludu pracującego. I zgłaszają się do nas o możliwość prowadzenia zakładów. I my im to umożliwimy. Bo możemy - i powinniśmy dbać o lud pracujący, prawda?\n\nTo skoro tak, to do roboty - zbudujmy jeszcze troszkę fabryk. "
DGR_expand_przyjazn_coke_plant: "Rozbudowa Koksowni Przyjaźń"
DGR_expand_przyjazn_coke_plant_desc: "Nadal ta nazwa do mnie nie przemawia po tylu latach. Ale już niech zostanie bo ludzie się nie zorientują co tak naprawdę tam stoi. A Politbiuro i tak sobie interpretuje że to chodzi o przyjaźń klasy robotniczej i wiejskiej, Polski i Związku Radzieckiego czy kurwa kobiety i mężczyzny. To jest nieważne. Ważne jest to że jak już ją odremontowaliśmy to warto ją uczynić największą koksownią w Polsce.\n\nBo do tej pory była na drugim miejscu. A tak nie może być. Skoro huta jest największa to i koksownia ma być! I przestańcie ją nazywać kokosownią, to jest poważny zakład do cholery!"
DGR_industrial_triangle: "Przemysłowy trójkąt Tucznawa-Tworzeń-Strzemieszyce"
DGR_industrial_triangle_desc: "Bardzo duża część połacia Dąbrowy jest usypana terenami przemysłowymi. Bardzo dużą część dodatkowo zabudowaliśmy nowymi zakładami. Na tyle, że w niektórych obszarach zaczęły się wytwarzać punkty stykowe pomiędzy trzema dzielnicami przemysłowymi. Zabudujmy już do końca ten trójkąt ziemi, i będziemy mieli ogromną superdzielnicę wytwarzającą taką ilość dóbr dla ludu że będziemy zakrawać o autarkię.\n\nI doprowadźmy w końcu tam porządną jezdnię a nie to dwupasmowe gówno. I tak tu już nikt nie zamieszka a przynajmniej skomunikujemy te tereny ze sobą."
DGR_industrial_powerhouse: "Przemysłowa potęga"
DGR_industrial_powerhouse_desc: "Całe państwo staje się przemysłową potęgą ale to nie oznacza że Dąbrowa musi ustąpić pola komuś w tym wyścigu. Wręcz przeciwnie - to my musimy pokazać jak się to robi, być pionierami odbudowy i przecierać szlaki tam gdzie reszta ludu jeszcze nie dotarła. Robić rzeczy więcej, bardziej, lepiej, mocniej. Mierzyć wyżej i dalej niż ktokolwiek inny bo nikt nie jest nas w stanie powstrzymać jeśli stoi za nami idea i żelazna wola.\n\nMiejsca jeszcze trochę zostało. "
DGR_powering_steelworks: "Zasilanie Huty"
DGR_powering_steelworks_desc: "Reindustrializacja na masową skalę wymaga energii. I wskaźnik zapotrzebowania niestety nieubłaganie rośnie. O ile jesteśmy w stanie doprowadzać energię z Łagiszy i Jaworzna, to połączenie jest ryzykowne. Jeśli odcięto by te tereny - cała strefa przemysłowa przestanie funkcjonować. Taki kolos jak Huta Katowice musi mieć swoje własne źródło zasilania. Ze względów redundancji, no i efektywności. A potem, jeśli damy radę, rozszerzymy moc na całą strefę. O ile nam starczy miejsca."
DGR_all_railroads_lead_to_slawkow: "Wszystkie tory prowadzą do Sławkowa"
DGR_all_railroads_lead_to_slawkow_desc: "Tak jak nie cierpię tych rebelianckich szumowin, tak trzeba przyznać że Sławków posiada ogromny atut w postaci gigantycznego terminala przeładunkowego. Nie sposób patrzeć na to z podziwem. Oczywiście oni nazywali to \"Euroterminalem\", ale ta nazwa nie jest odpowiednia dla czegoś co ma stanowić logistyczną perłę regionu. Nad tym jeszcze popracujemy, ale problem terminalu jest taki że o ile wszystkie koleje do niego prowadzą, tak możemy trochę popracować na innych frontach żeby uczynić ten kompleks jeszcze efektywniejszym.\n\nBo co jeśli zrobimy go jeszcze kurwa większym?"
DGR_strzemieszyce_fuel_base: "14 Baza Paliwowa w Strzemieszycach"
DGR_strzemieszyce_fuel_base_desc: "Ta baza paliwowa już istnieje ale od czasów wojen osiedlowych stała tak na wpół działająca. Potem funkcjonowała jako zaplecze logistyczne ale nigdy nie była tak wykorzystywana skutecznie jak mogłaby być. A na to jest zawsze proste rozwiązanie. Musimy ją powiększyć co najmniej dwukrotnie. Większe znaczy lepsze, a im więcej paliwa tym więcej możliwości zaopatrywania. A wszyscy wiedzą, że wraz z postępem i rozwojem przemysłu przychodzi więcej pojazdów, a każdy z nich potrzebuje paliwa. Nie wspominając już o naszej armii. Oj, żeby zasilić nowe zabawki trzeba będzie w nie trochę wpompować."
DGR_boleslaw_industry: "Rozbudowa Zakładów Górniczo-Hutniczych Bolesław"
DGR_boleslaw_industry_desc: "Kiedyś Polska była bardzo zróżnicowana pod względem wydobycia. Węgiel, ropa, gaz, cynk, aluminium, żelazo, miedź, sól, bursztyn, srebro, złoto, uran. I to wszystko przepadło w czasie, jak łzy w deszczu. Pozostały nam ochłapy. W Bolesławiu mamy Zakłady Górnicze-Hutnicze produkujące cynk. Jedyny w Polsce zakład który produkuje cynk. A jak coś jest jedyne w Polsce to trzeba na to chuchać i dmuchać.\n\nJeszcze wrócimy do tych czasów. Ale póki co wykonajmy chociaż jeden krok i zachowajmy nasz polski cynk. A i same zakłady dostarczą nam sporo radości w zakresie maszyn, zarówno cywilnych jak i wojskowych."
DGR_national_mechatronics_plant: "Narodowe Zakłady Mechatroniczne"
DGR_national_mechatronics_plant_desc: "To że mamy przemysł to jeszcze fajnie jakby odpowiadał on wymaganiom współczesnego świata. Zakłady produkujące roboty, układy scalone czy części do wielkich maszyn autonomicznych to przyszłość. Ale problem polega na tym że jest to fajne hasełko rzucone na wiecu politycznym, a nie konkretna zapowiedź tego co nadejdzie. Bo skomplikowanie obecnej technologii jest na tyle duże że albo będziesz miał mnóstwo różnych linii produkcyjnych, albo wiele zakładów które specjalizują się w jednym. Będziemy potrzebowali i tego i tego żeby nadrobić stracony czas który mogliśmy wykorzystać na postęp i badania.\n\nAle to zaprocentuje w przyszłości. Bo ta już tuż tuż."
DGR_the_only_dabrowa: "Jedyna Dąbrowa która się liczy"
DGR_the_only_dabrowa_desc: "Jest wiele Dąbrów w Polsce. Dąbrowa Tarnowska, Dąbrowa Zielona, Dąbrowa Białostocka, czy dosłownie kilkaset zwykłych Dąbrów i Dąbrówek w postaci małych wsi.\n\nAle tylko jedna jest tak wspaniała jak nasza. Tylko jedna posiada obywateli którzy skorzy są do osiągania najwyższych celów. Tylko jedna jest wyraźnie lepsza od pozostałych. Od dzisiaj, gdy ludzie będą mówili Dąbrowa to \"Górnicza\" będzie od razu w domyśle. Tak jak robią to od zawsze obywatele Dąbrowy. Z czasem, po prostu będziemy po prostu Dąbrową.\n\nI wszyscy zapomną o każdej innej. Albo im po prostu każemy zmienić nazwy i zdelegalizujemy inne Dąbrowy?"
DGR_central_supercomputer: "Centralny Superkomputer 'Xenon'"
DGR_central_supercomputer_desc: "Przywódca potrzebuje niezawodnego i bezwzględnego posłuszeństwa. Potrzebuje również gromadzić istne morze danych, aby odpowiednio organizować gospodarkę, wojsko i naukę. Czy jest na to lepszy sposób niż wykorzystanie superkomputera, w którym miedziane przewody dominują nad neuronami i nerwami? Cóż, prawdę mówiąc, neurony i nerwy są znacznie łatwiej dostępne, ale nie powinno nas to powstrzymać. To prawda, że nie mamy ani wiedzy, ani materiałów, ani nawet planu, ale każdy wielki projekt można rozłożyć na mniejsze elementy. Uznając tę prawdę, połączymy ze sobą możliwie wiele mniej zaawansowanych komputerów, aby skonstruować jedną maszynę o wystarczającej mocy obliczeniowej, by pomieścić sztuczną superinteligencję."
DGR_atomic_heart: "Atomowe serce"
DGR_atomic_heart_desc: "Potrzeba było dekad planowania, niezliczonych godzin konsultacji z miejscowymi i całej masy komisji oraz rad, które zdążyły przepierdolić pół budżetu, żeby w końcu... mieć jeden mały reaktor badawczy w Otwocku. Opieszałość w tej sprawie jest, kurwa, upokarzająca.\nPolska była kiedyś na dobrej drodze do ujarzmienia potęgi atomu, ale niestety Blok Wschodni się rozpadł, a nowo ustanowiony ustrój, skrępowany kapitalistyczną ideologią zysku i realiami burżuazyjnej demokracji, okazał się niezdolny do dokończenia tego, co rozpoczęliśmy. Teraz, gdy patrioci ponownie są u władzy i nie krępują nas już ograniczenia poprzedniego systemu, możemy wrócić do miejsca, w którym stanęliśmy."
DGR_contacts_in_the_east: "Kontakty na wschodzie"
DGR_contacts_in_the_east_desc: "Tak wielkiego zadania jak budowa wielkoskalowego reaktora jądrowego nie da się wykonać w pojedynkę. Potrzebujemy pomocy potężnych państw, które przychylnie patrzą na naszą sprawę i są gotowe dostarczyć nam wiedzy, materiałów oraz funduszy. Skoro Zachód i jego zgniłe elity nie są zainteresowane pomocą w budowie dobrobytu, jesteśmy zmuszeni zwrócić wzrok na wschód i spróbować odnaleźć się w wielkiej grze pomiędzy półkulami. Naszym planem jest nawiązanie kontaktu z elitami sympatyzującymi ze sprawą antyzachodnią, które pomogą nam wskrzesić socjalistyczną myśl techniczną minionych dekad i połączyć ją z innowacyjnymi praktykami współczesności, aby zbudować dostatnią, napędzaną energią atomową przyszłość."
DGR_send_szwej_to_moscow: "Wyślij Szweja do Moskwy"
DGR_send_szwej_to_moscow_desc: "Minęło sporo czasu odkąd Polska i Rosja były \"bratnimi narodami\". Wtedy niewielu w to wierzyło, a dziś wierzy w to jeszcze mniej. Pamięć o naszej wspólnej przeszłości wciąż jest jednak żywa w Moskwie, a Szwej nadal ma kilka kontaktów, które mogłyby lobbować za nami na Kremlu... o ile ci ludzie nie skończyli już w domach spokojnej starości. Ci, którzy wciąż mają jakieś wpływy w aparacie państwowym, zazwyczaj znajdują się daleko od najwyższych szczebli władzy, ale ich głos nadal ma sporą wagę w rosyjskim głębokim państwie. Mamy nadzieję, że wielki naród rosyjski, który niegdyś wprowadził Europę Wschodnią w Erę Atomową, po raz kolejny podejmie się swojej historycznej misji. To dość rozpaczliwy strzał w ciemno, zwłaszcza że rząd Nawalnego próbuje zerwać więzi z przeszłością, ale jest to nasza najlepsza szansa na realizację ambicji."
DGR_chinese_business: "Chińskie przedsięwzięcia biznesowe"
DGR_chinese_business_desc: "Bądźmy szczerzy: od dawna to nie Rosja gra pierwsze skrzypce jeśli chodzi o wschodnią półkulę. Potrzebujemy teraz nowej potęgi, która jest gotowa wspierać każde państwo nieliberalne - Chin. Przekonanie ich przywódcy powinno być znacznie prostsze, jeśli pochwalimy ich za obronę sprawy robotniczej i zapewnimy o naszym antyzachodnim nastawieniu. Pomogłaby również obietnica utworzenia regionalnej filii Instytutu Konfucjusza. Oczywiście wyprawa dyplomatyczna na Daleki Wschód będzie wymagała od nas czegoś więcej niż tylko 0,7 wódki i wspominania starych czasów. Potrzebujemy wykwalifikowanego dyplomaty, biegle mówiącego po chińsku, prestiżowej delegacji i co najmniej 2 litrów wódki!"
DGR_uranium_corridors: "Korytarze przemycania uranu"
DGR_uranium_corridors_desc: "A jednak powinni wziąć 4 litry... Chińczycy zgodzili się dostarczyć nam surowce, ale zamiast otworzyć nowy Jedwabny Szlak, zaproponowali nam Jedwabny Tunel. Powołując się na problemy z transportem oraz \"szczególną sytuację międzynarodową Narodowej Republiki Ludowej\", stwierdzili, że ich państwo nie jest w stanie oficjalnie dostarczać nam towarów ani drogą lądową, ani morską. Zamiast tego zaproponowali pomoc w zorganizowaniu przemytu przez terytorium Rosji. Nie jest to rozwiązanie idealne, ale ma swoje zalety. Skoro i tak musimy polegać na przemycie uranu, równie dobrze możemy rozszerzyć całą operację i przy okazji zgarniać inne surowce. Nic tak spektakularnego jak uran, ale każdy stary egzemplarz broni czy chemiczne składniki do produkcji materiałów wybuchowych również będą świetnym dodatkiem do naszych transportów."
DGR_purchase_rbmk: "Kup plany reaktora RBMK"
DGR_purchase_rbmk_desc: "Znacie ten dowcip:\n\"To prawda, że w Moskwie rozdają za darmo plany najnowocześniejszych reaktorów jądrowych?!\"\n\"Prawda, tylko że nie w Moskwie, a w daczy pod Jekaterynburgiem. I nie rozdają ich, tylko żądają w zamian nierównego traktatu handlowego. I nie są to najnowocześniejsze reaktory, lecz te odpowiedzialne za katastrofę w Czarnobylu.\"\nNo i jesteśmy w tym miejscu. Góra powtarza rosyjską propagandę, według której przy odpowiedniej konserwacji i nadzorze reaktor RBMK powinien działać odpowiednio i bezpiecznie. No jasne. Ledwo co pomyślałem, że Szwej może jednak coś osiągnąć, a on wraca z takim gównem. No cóż, korzystajmy z energii jądrowej, póki się da. Ja w każdym razie będę trzymał się od tego reaktora tak daleko, jak tylko się da."
DGR_ground_stabilisation: "Stablilizacja gruntu"
DGR_ground_stabilisation_desc: "A teraz ta bardziej przyziemna część. Teren w pobliżu Dąbrowskich Ząbkowic został wybrany jako idealne miejsce pod elektrownię atomową. Jeszcze przed Upadkiem okolice Dąbrowy Górniczej wskazywano jako jedną z potencjalnych lokalizacji małego modułowego reaktora BWRX-300. Ale oczywiście my nie robimy niczego małego, co powoduje pewne dodatkowe problemy związane z piaszczystym terenem w okolicy. Nawet Szwej nie chce budować domu na dosłownym piasku, więc zarządził wycięcie miejscowych lasów i ustabilizowanie piaszczystego podłoża. No i tyle. Nadal nie wiem, po chuj budować elektrownię w miejscu, gdzie trzeba wypełnić ziemię stalowymi belkami i zalać ją cementem, zamiast... gdziekolwiek indziej."
DGR_special_guards_unit: "1 Specjalna Jednostka Gwardyjska"
DGR_special_guards_unit_desc: "Pomimo ogromnego wysiłku jakiego będzie to wymagało, fakty pozostają faktami: potrzebujemy tego reaktora i dobrze, że mimo wszystkich problemów w ogóle powstaje. Łatwo też przewidzieć, że gdy tylko zostanie ukończony, stanie się głównym celem naszych wrogów zarówno wewnątrz, jak i poza granicami państwa. Jeśli tak się stanie, musi pozostawać pod stałą ochroną naszych najbardziej elitarnych żołnierzy. Do zabezpieczenia jego obwodu potrzebny będzie cały batalion stacjonujący w pobliżu. Najlepsi spośród nas otrzymają zaszczyt ochrony tego, co, miejmy nadzieję, stanie się potężnym bijącym sercem naszej sieci energetycznej."
DGR_pogoria_5: "Utwórz Pogorię V"
DGR_pogoria_5_desc: "Już pojawiają się problemy. Powszechnie wiadomo, że elektrownie jądrowe, podobnie jak ich węglowe odpowiedniki, potrzebują wody do działania. Najlepiej byłoby mieć w pobliżu rzekę, większą niż Trzebyczka, albo zbiornik retencyjny. Jak się okazuje, zbiorniki Pogoria są trochę za daleko. Zmiana lokalizacji elektrowni na tym etapie byłaby problematyczna i niewiele by nam dała; teren wokół Pogorii jest jeszcze bardziej niegościnny, ponieważ zbiorniki powstały w wyniku zalania wodą starych piaskowni. Na tym etapie lepiej będzie wykopać i stworzyć kolejną Pogorię, która zaopatrywałaby naszą przyszłą elektrownię. Nawet jeśli w pobliżu nie mamy wygodnie położonych nieczynnych wyrobisk, do których można by nalać wody."
DGR_advanced_staff_training: "Zaawansowane szkolenie personelu"
DGR_advanced_staff_training_desc: "Czy ktoś w ogóle wie, jak to cholerstwo będzie działać? Tak myślałem. Mamy kilku fizyków teoretycznych, ale brakuje nam praktyków, którzy będą w stanie obsługiwać przyszłą elektrownię i szkolić nowych inżynierów w zakresie pracy z elektrownią jądrową. Nawet jeśli w Polsce jest wystarczająco wielu specjalistów, są oni rozsiani po całym kraju. Ponownie będziemy potrzebować pomocy Rosjan. To tylko rozwiązanie tymczasowe, zanim zapewnimy sobie stały napływ rodzimych specjalistów. Miejmy tylko nadzieję, że do czasu zakończenia szkolenia Ruskie nie zdążą spierdolić czegoś zbyt poważnie."
DGR_zabkowice_nuclear_plant: "Ząbkowicka Elektrownia Atomowa"
DGR_zabkowice_nuclear_plant_desc: "To działa? Działa! Chyba byłem zbyt surowy w ocenie całego tego przedsięwzięcia. Nieodpowiedni teren, zaplamione alkoholem rosyjskie plany, brak odpowiednich kadr - wszystko to tylko budowało mój sceptycyzm, a jednak no, stoimy pod elektrownią i jest to możliwe. Podziwiam ukończenie całego przedsięwzięcia. Mogę powiedzieć wiele złego o komunistach, niezależnie od tego, jaką farbą się przemalowali, ale po raz kolejny udowodnili, że jeśli tylko chcą, potrafią zbudować infrastrukturę niezbędną do strategicznego przetrwania państwa. Miejmy nadzieję, że Polska, niezależnie od tego, kto będzie nią rządził, będzie prosperować dzięki taniej energii dostarczanej przez Ząbkowicką Elektrownię Atomową."
DGR_military_moloch: "Wojskowy moloch"
DGR_military_moloch_desc: "Jak to mówią - większe jest lepsze. W tym przypadku nie do końca chodzi o samą ilość ale również o jakość. Bo mówimy o czymś co stanowi trzon tego kraju bez którego nie będzie on istniał i zapadłby się pod sobą niczym domek z kart. Narodowa Armia Ludowa przenika wszelkie aspekty życia politycznego i prywatnego. To my, wszyscy obywatele którzy stanowią straż przednią przed wszelkiego rodzaju wrogami. Musimy nieustannie powiększać naszą armię - gdyż nieustanny i naturalny wzrost od nas tego wymaga, to nie jest sztuczne pompowanie słomianego wojska lecz organiczny rozwój instytucji które idą w parze z wojskiem. Potrzebujemy więcej pojazdów, więcej żołnierzy, więcej broni i amunicji. A przy tym jednocześnie większej profesjonalności. To będzie wymagało ogromnych nakładów ale musimy to zrobić. Inaczej obrócimy się w proch który inni zdeptają na drodze ku wielkości."
DGR_national_army_fund: "Narodowy Fundusz Wojskowy"
DGR_national_army_fund_desc: "Wszystko kosztuje - to jest niestety prawda stara jak cywilizacja i nawet ideologie komunistyczne nie były w stanie podważyć tego pradawnego aksjomatu. W szczególności będzie nas kosztować uzbrojenie - bo człowieka da się kupić obietnicami i prośbami ale czołg czy samolot - tego już nie wybłagasz. Powołanie narodowego funduszu wojskowego to jedynie początek - zapewnienie, że ten fundusz będzie miał możliwości gromadzenia pieniędzy to drugie. Będziemy musieli szukać w wielu miejscach, i niejednokrotnie najprawdopodobniej będziemy zmuszeni do obcięcia funduszy w innych sektorach, tych mniej potrzebnych. Bo teraz - teraz każdy z nas jest częścią wysiłku wojennego. Idziemy po zjednoczenie - i jedynie jak możemy tam iść to wspólnie, bez dezerterów i sabotażystów. Także dokładamy się do wojska, bo tylko ono może zapewnić nam przyszłość."
DGR_higher_mandatory_taxation: "Wyższe zobowiązania podatkowe"
DGR_higher_mandatory_taxation_desc: "Chcąc nie chcąc - stan wyjątkowy wymaga wyjątkowych poświęceń, również tych finansowych. Potrzebujemy większej ilości pieniędzy którą będziemy mogli przeznaczyć na wydatki zbrojeniowe, a najlepszą opcją będzie jeśli to społeczeństwo nam zafunduje wszelki sprzęt. Podniesienie podatków to wariant ryzykowny w tym kraju, ale nie mamy innego wyjścia. Jeśli zaciśniemy pasa odpowiednio mocno to możemy być pewni że to zaprocentuje a każda złotówka wydana na siły zbrojne to inwestycja obywateli nie tylko w swoje bezpieczeństwo, ale również w przyszłość której nie będą posiadać jeśli ktoś inny wygra ten kraj. Dlatego nie marudzimy, i musimy zrozumieć że to dla naszego wspólnego dobra. A jak ktoś za głośno będzie narzekać to wiadomo co z nim zrobić"
DGR_fire_and_fury: "Ogień i pożoga"
DGR_fire_and_fury_desc: "Ogień, wkurwienie i zniszczenie! Pożoga którą przyniesiemy naszym wrogom będzie wręcz biblijna. I chodzi mi tylko o porównanie jako źródło fantazji, nie jestem wierzącym głupcem. W co wierzę to stal i ołów - coś co nasi żołnierze rozdają na lewo i prawo wszystkim niewiernym i heretykom naszej sprawy. Ale czasem jednak trzeba postarać się bardziej i użyć większej broni. A gdy to nie pomoże - zwiększać kaliber aż do skutku i eliminacji przeciwnika. Mamy doświadczenie z elementami wojny zmechanizowanej i taktykami pancernymi - zaprocentuje to w momencie kiedy będziemy wprowadzać masowo różnorakie machiny wojenne. Każdy batalion będzie mógł zostać wyposażony w takie cuda, a nie tylko elitarne jednostki. To co nastąpi potem będzie najpiękniejszym pokazem destrukcji jaki widział ten kraj. A widział on niestety wiele."
DGR_viper_program: "Program Żmija"
DGR_viper_program_desc: "Niepozornie wyglądające samochody pancerne potrafią stanowić ogromne wsparcie dla zwykłych żołnierzy na polu bitwy. Oprócz możliwości szybkiego przemieszczania się nawet po trudnym terenie oraz potencjału zwiadowczego - dokładamy tam również całkiem pokaźną siłę ognia. Co prawda spotkania z wyrzutnią rakiet taki samochód raczej nie przetrwa, to jednak opancerzenie wydłuża przeciętny czas życia załogi, przynajmniej o parę minut. Niestety, pracując na planach starych sowieckich gratów nie możemy zbytnio pokusić się o wariacje na temat idealnego samochodu pancernego na miarę obecnych czasów. Dlatego też będziemy musieli zaprojektować coś własnego i oryginalnego. Na szczęście mamy odpowiednie zakłady przemysłowe do tego."
DGR_bewup_eternal: "Wieczny duch BWP-1"
DGR_bewup_eternal_desc: "Wilki, Goryle, Łosie, Kury, Jenoty. No tak, kontynuując ten pierdolony zwierzyniec mamy coś co możemy odkopać z tajnych archiwów zbrojeniowych. Jednym z kretyńskich zabiegów rządów przedupadkowych (oprócz absolutnego wyprzedania zakładów zbrojeniowych) było sprowadzanie czołgów z zagranicy. Niemieckie, amerykańskie, koreańskie, chujwiejeszczejakie. Nie mówię już o tym że zazwyczaj dostawaliśmy je po zawyżonych cenach to jeszcze bez licencji na to żeby móc w Polsce je remontować, a jak się zepsuje jakaś część to leć za granicę błagać o zapasówki ze szrotu. Mieliśmy tak wiele własnych dobrych projektów które wystarczyło doprowadzić do realizacji, że jak się na to patrzy to można odnieść wrażenie że osoby decyzyjne były umysłowo upośledzone. Cóż, że sowieckie? Będzie jeździć i strzelać jak Polskie!"
DGR_gorillas_and_wolves: "Goryle i Wilki"
DGR_gorillas_and_wolves_desc: "Wilki, Goryle, Łosie, Kury, Jelenie. Tja - idąc z duchem tego pierdolonego zwierzyńca, udało nam się wykopać parę rzeczy z tajnych archiwów wojskowych. Jednym z kretyńskich przedsięwzięć rządów przedupadkowych (oprócz całkowitego wyprzedania wszystkich przedsiębiorstw zbrojeniowych) było sprowadzanie czołgów z zagranicy. Z Niemiec, Ameryki, Korei i z innych Muchosrańsków. Nie wspominam już nawet po jakich wywindowanych cenach je dostawaliśmy, oraz to że nie dostawaliśmy licencji na serwisowanie ich na miejscu - zatem jeśli coś by się spieprzyło musielibyśmy lecieć i błagać o części zamienne z odzysku. Mieliśmy tak wiele solidnych, własnych projektów, które aż prosiły się by wprost je wdrożyć do produkcji. Patrząc na to możnaby dojść do wniosku że decydenci byli niespełna rozumu. I co z tego, że są na podstawie radzieckich podwozi? Będą jeździć i strzelać po Polsku!"
DGR_star_constellation: "Nowa konstelacja ciężarówek STARa"
DGR_star_constellation_desc: "Trzeba przyznać, nie wszystkie państwowe przedsiębiorstwa wojskowe są nietrafioną inwestycją. Musimy tutaj jednostkowo podchodzić do sprawy. Spójrzcie tylko na fabrykę STARa. Kiedyś, była to duma naszego kraju zaopatrująca nasze wojsko (i nawet zagraniczne). Teraz, przygotowując się do starcia z sąsiadami - potrzebujemy tych zakładów jeszcze bardziej. Jaki sens jest w budowaniu tych busów cywilnych które MAN wcisnął na linie produkcyjne w Starachowicach? Co prawda, nadal istnieje Jelcz ale to nie wystarczy. Szczególnie gdyby Niemcy próbowali po raz kolejny wkroczyć na Śląsk. Potrzebujemy więcej zakładów tego typu na środkowym wschodzie kraju. Poza tym, Kongresówka nadal musi pokazać że potrafi coś zrobić."
DGR_kutno_hippos: "Hipopotamy z Kutna"
DGR_kutno_hippos_desc: "Kołowy transporter rozpoznania inżynieryjnego. Brzmi kurewsko nudno, co nie? No i tak też na szczęście pomyśleli inżynierowie z Kutna po zbudowaniu pierwszych prototypów ciężkiego transportera Hipopotam, i zrobili z niego nie dość że platformę do modyfikacji by móc z niego zrobić różnego rodzaju inne pojazdy wsparcia to jeszcze dostosowali go idealnie do przewozu żołnierzy. Dzięki temu Hipopotam nadaje się jako jednostka frontowa w batalionach piechoty zmechanizowanej i jako wsparcie dla zwykłych oddziałów. No i teraz najlepsze - ON TEŻ KURWA PŁYWA, TAK JAK BWP. W sumie po to był głównie projektowany - jako amfibia. Ale okazał się być wszechstronny. Brzmi idealnie, prawda? Prawie zbyt dobrze żeby to było prawdziwe? No, bo wyprodukowano przed Upadkiem zero sztuk. Był to jedynie prototyp. Ale jaki! Teraz gdy mamy dostęp do planów - musimy go natychmiast zacząć produkować. Bo jak patrzę na te szkice to idzie się zakochać w tym cudownym pojeździe."
DGR_united_fire_command: "Połączone Dowództwo Kierowania Ogniem"
DGR_united_fire_command_desc: "Jak to mówi klasyk - pierdol tych ludzi którzy odzywają się do Ciebie tylko gdy potrzebują twojego wsparcia artyleryjskiego. Ale tak całkiem serio - artyleria to bardzo przyjemna zabawka, ale ktoś tym wszystkim musi zarządzać. Bo inaczej dajcie żołnierzom kwadrans na polu bitwy a będziemy mieli sojusznicy ostrzał albo losowa wioska zostanie wysadzona w powietrze za nic. Potrzebujemy bardzo odpowiedzialnych ludzi na stanowiskach kierowania ogniem oraz zaawansowanej technologii komunikacyjnej oraz takiej która umożliwi nam na szeroki ogląd pola bitwy. Są już teraz takie systemy wojskowe, które pozwalają operatorowi poczuć się jakby grał w jakiegoś RTSa na żywo. Jeśli będziemy je mieć to nikt nie będzie już musiał bać się że jest się w zasięgu sojuszniczej artylerii."
DGR_art_strongpoints: "Stacjonarne umocnienia artyleryjskie"
DGR_art_strongpoints_desc: "Biorąc pod uwagę doświadczenia z frontu, gdzieniegdzie jedyne co trzeba postawić na drodze przeciwnika to jebitne działo, okopać je, ukryć - i napieprzać ile wlezie. Zaraz odezwą się fanatycy zapierdalania że tak nie wolno, że w dzisiejszych czasach trzeba być mobilnym, musisz się przemieszczać po każdym strzale, robić kurwa uniki w krzakach i najlepiej to w ogóle robić fikołki podczas przeładowywania. I to jest jedno wielkie gówno prawda - wróg nie ma rozpoznania żadnego ani technologii - to jest dosłownie strzelanie do kaczek. A gdy znajdzie się taki który owe posiada - zmieciemy go lotnictwem. W każdym przypadku wielkie stacjonarne działo wygra. I nie straci ani trochę paliwa - bo go cholera nie potrzebuje."
DGR_mobile_fire_platforms: "Zaawansowane samobieżne platformy artyleryjskie"
DGR_mobile_fire_platforms_desc: "No ale też żeby nie było że jedyne co będziemy robili to czekali to musimy uzupełnić nasze braki w ruchliwości mobilnymi platformami ogniowymi które będą pełniły rolę taką jaką spełnia komar który wpadnie Ci do pokoju i nie może znaleźć okna by wylecieć z powrotem. Latamy dookoła, robimy szum i podgryzamy gdy możemy i ile możemy. Wróg skupi się na powyłapywaniu wszystkich tych zapieprzających robaczków podczas gdy my będziemy mogli się skupić na POTĘŻNYM ostrzale lub bezpośrednim szturmie. Bo w wojaczce nie chodzi o to żeby brnąć w jedną taktykę przecież, nie? Bo jeśli to zrobisz to zaraz znajdzie się inteligent po drugiej stronie który skontruje Cię czymś na co ty już nie będziesz miał kontry bo przepieprzysz wszystkie pieniążki na artylerię samobieżną. A tak - będziemy mieć wszystko."
DGR_revitalization_of_rocketry: "Rewitalizacja wojsk rakietowych"
DGR_revitalization_of_rocketry_desc: "Wojska rakietowe za PRL-u...trzeba przyznać, że robiły cholera wrażenie. I to kolejna z całej plejady upokorzeń plama w historii Wojska Polskiego III Rzeczpospolitej. Bo z państwa które posiadało rakiety zdolne nawet do przenoszenia głowic atomowych zostało nam...wielkie gówno. W Rosji wojska rakietowe stanowią nawet odrębną gałąź wojska, tak bardzo są tam one rozbudowane - i niestety Ukraina przekonała się o tym na własnej skórze że jest to broń diabelnie skuteczna przy minimalnym wysiłku. Celujesz jako-tako, odpalasz i zapalasz fajeczkę czekając aż zwiad albo lotnictwo powie w co trafiłeś. Robota idealna, oprócz ryzyka tego że jak ktoś namierzy twoją pozycję to odbędzie się polowanie na Ciebie przez całą wrogą armię. Ale to na bok - musimy odnowić potęgę rakietową jaką posiadaliśmy. I na tym się skupmy. Procedury będziemy odświeżali jak w ogóle zbudujemy coś co może latać i wybuchać i nie będzie to ruski samolot pasażerski. "
DGR_procedure_11b: "Procedura 11-B"
DGR_procedure_11b_desc: "Skoro już posiadamy coś co przypomina rakietę i nie da się tym polecieć w kosmos to możemy zabrać się za to jak w ogóle powinniśmy tego używać. Bo jak tutaj wartościowo i precyzyjnie prowadzić ogień rakietowy kiedy wróg kryje się pośród cywilnej populacji lub głęboko zabarykadował się w dużych miastach? Cóż, jest to typowa taktyka tchórzy którzy za nic mają życie swoich obywateli i używają ich jako żywych tarcz. Na humanitarnych socjaldemokratoidów to może by zadziałało i przyszliby z płaczem że oni nie mogą strzelić bo sumienie nie pozwala, ale my nie mamy takich słabości. Każde miejsce które ma potwierdzoną obecność wrogich elementów wojskowych jest uzasadnionym celem ataku rakietowego. A że wrogów mamy wszędzie...lepiej dla nich żeby nie kryli się po szpitalach i szkołach. Bo potem to nas obsmarują jako morderców, a nie tych którzy się nimi zasłaniają."
DGR_red_wyrm: "Czerwony Żmij"
DGR_red_wyrm_desc: "Jesteśmy prostymi żołnierzami. Niewiele potrzeba żeby nas uszczęśliwić. Ale kiedy tego potrzebujemy - rozmiar ma znaczenie. Rozwiązujemy problemy. Nie problemy typu \"Czym jest piękno\", ponieważ wtedy wkraczałoby to w zakres problemów filozoficznych. Rozwiązujemy praktyczne problemy. Na przykład jak niby mamy zatrzymać wielkich, wrednych drani przed dorobieniem nam zbędnych czterech liter? Odpowiedź? Użyj czołgu. A kiedy to nie pomoże...\n\nUżyj większego czołgu. Jak to superciężkie cudo wielkiego kalibru 300 mm, zaprojektowane przez naszych inżynierów. Zbudowane przez naszych robotników. I lepiej żebyś miał nadzieję... \n\n...że nie jedzie po Ciebie."
DGR_suspend_non_essentials: "Zawieszenie niepotrzebnych usług publicznych"
DGR_suspend_non_essentials_desc: "Prawda jest taka, że niektóre służby są zbędne i całkowicie bezużyteczne, a my jeszcze płacimy na nich grube miliony tylko żeby działały. No po co? Straż Miejska? Litości, przecież oni nie są w stanie nawet złapać komara, a co dopiero stać na straży porządku w mieście. Inne niezmilitaryzowane służby porządkowe też w zasadzie są niepotrzebne gdy mamy na miejscu wojsko które jest zawsze gotowe i zawsze blisko. Ochrony zakładów przemysłowych? Niech im płacą z funduszy przeznaczonych na przemysł a nie na wojsko, oni i tak nie nadają się do wojaczki. Służba Ochrony Kolei? Kurczę, gdyby byli skuteczni to może by nam tyle węgla z wagonów nie kradli - wojsko będzie skuteczniejsze w łapaniu przemytników sto razy bardziej. I tak po kolei i tak po trochu - aż w końcu grosz do grosza i będziemy mieli pieniążki na więcej wojska."
DGR_redirecting_housing_funds: "Przekierowanie funduszy z mieszkań na koszary"
DGR_redirecting_housing_funds_desc: "Posiadamy nieruchomości, posiadamy rozległe garnizony w miastach ale dalej przeznaczamy niepotrzebne w tym momencie pieniądze na rozbudowę infrastruktury mieszkaniowej i na utrzymanie domów w których nikt nie mieszka. Po co? Te środki lepiej przeznaczyć na garnizony i koszary polowe które musimy cały czas budować bo cały czas front się przesuwa w różne strony. Jednego dnia Sosnowiec to miasto frontowe a drugiego już Łódź. I oba te miasta będą potrzebowały koszarów dla naszego wojska. Nikt normalny przecież teraz mieszkań kupować nie będzie a to co stoi puste niechaj takie zostanie. Nie zawali się, a po wojnie będziemy mogli budować i pałace. Chociaż nie, zaraz...pałace są burżuazyjne. A chuj, przecież mamy Pałac Kultury...no nieważne, niech spółdzielnie wyskakują z forsy!"
DGR_national_people_land_forces: "Narodowo-Ludowe Siły Lądowe"
DGR_national_people_land_forces_desc: "Jako potęga lądowa nieograniczona wielkimi rzekami czy morzem, naszym naturalnym krokiem jest postawienie na szerokość i masę naszych lądowych sił uderzeniowych. Tak, fajnie że mamy pojazdy zdolne przekraczać rzeki, ale ważniejsze jest to że mamy jakiekolwiek pojazdy. Przeważając zajadłością, dyscypliną i ilością, nasza armia nigdy się nie podda. Ale żeby to osiągnąć potrzebujemy dodatkowych pracowników. Ludzi pracujących w odzysku. Każdy kto może chodzić będzie pracował dopóki ich ręcę nie zaczną krwawić. A potem...no nie wiem, czy ja wyglądam na lekarza? Dajcie im rękawiczki gumowe zamoczone w etanolu i każcie pracować dalej!"
DGR_people_officer_school: "Akademia Oficerów Ludowych"
DGR_people_officer_school_desc: "Armia maszeruje w oparciu o swój korpus oficerów, dowództwo i ich możliwości do szybkiego i taktycznego myślenia, o ich...ideologiczną betonozę. Ech, jedną rzeczą którą Ci biurwokraci rozumieją że przez to, że nasz światopogląd jest taki a nie inny, jest bardzo bliski rzeczom które zatruwają cały system; międzynarodowych fajnopolaków, uśmiechniętych socjalistów i kapitalistycznych 'narodowców'. Przez to musimy być pewni że nasi oficerowie będą dalecy od takich wynaturzeń. Serio. Naród jest wypadkową ludzi z których się składa, a nie z flag czy uch, kapitału. To dlatego nasi oficerowie muszą się na uczyć jak prowadzić wojnę w imieniu po pierwsze społecznym, a po drugie narodowym."
DGR_nplf_command_structure: "Struktura dowodzenia NLSL"
DGR_nplf_command_structure_desc: "Nadszedł czas żeby zaktualizować strukturę dowodzenia w naszym państwie. Musi istnieć przede wszystkim jasny łańcuch dowodzenia i odpowiedzialności, a każdy oficer musi dokładnie wiedzieć przed kim odpowiada i kto wydaje im rozkazy. Podobne metody były wprowadzane (z mieszanymi skutkami) przez Sowietów i Rosjan. Ale w przypadku poważnych starć, najważniejszym jest to by wszyscy pracowali jak jedna maszyna a nie jako indywidua działające tylko w swoim imieniu. Tak działa socjalizm. W przeciwieństwie do kapitalistycznego chaosu."
DGR_urban_warfare_spec: "Specjalizacja w walce w terenie zabudowanym"
DGR_urban_warfare_spec_desc: "Polska swoją nazwę wywodzi od pól, nadal spora część kraju to w końcu tereny rolne, lasy i inne otwarte przestrzenie na których nasi wrogowie urządzali sobie poligony doświadczalne przez setki lat. I tak też rozwijała się polska doktryna wojskowa, dopiero w ostatnich czasach uwzględniając takie fanaberie jak wysokie zabudowania i walki w budynkach. Oprócz jednostek specjalnych to nikt nie miał pojęcia jak do tego podejść dlatego łatwiej taki budynek było po prostu rozpiździć artylerią - i po kłopocie. Ale wywodząc się z obrzeży największej w kraju metropolii musimy po prostu uwzględnić w naszej doktrynie walkę w terenach zabudowanych. Bo nieraz przyjdzie nam się mierzyć z oblężeniami które jeśli niedokładnie przeprowadzone - zamienią się w bitwę o Stalingrad. A na to nie mamy czasu, ludzi ani nerwów."
DGR_ideological_imperative: "Ideologiczny imperatyw motywacyjny"
DGR_ideological_imperative_desc: "Żeby nasza doktryna działała, każdy żołnierz musi być odpowiednio zmotywowany. Musi go wypełniać duch socjalizmu i wiara w ideały robotni.....hahahaha, no kurwa pewnie! Wiem jak działają nasi ludzi, w przeciwieństwie do eunuchów z Politbiura. Nie walczymy dla pieniędzy lecz w imię naszego narodu. Tak, nawet za tych którzy nie do końca się z tym narodem utożsamiają. Za waszych rodziców, braci, kuzynów, synów. Nawet jeśli ich nie macie - wkrótce będziecie mieli rodzinę. No i oczywiście, czy wam się to podoba czy nie, walczycie w imię Partii i Pierwszego Sekretarza który prowadzi was do raju robotniczego. Tja, no wiecie - trzeba sprawiać pozory."
DGR_restandarisation_of_firearms: "Restandaryzacja broni palnej"
DGR_restandarisation_of_firearms_desc: "Tylko kapitalistycznych świni nie cieszy seria z pepeszy. Co prawda w obecnych czasach utrzymanie takiej pepeszy w dobrym stanie jest trudniejsze niż sprawienie by strzelała. Setki wariantów broni, dziesiątki typów amunicji, tysiące różnych części - czas z tym skończyć. Nastał koniec logistycznego koszmaru, wprowadzamy czym prędzej nowe standardy i wkraczamy w erę uniformizacji. Jeden karabin przyjęty na wyposażenie wojska, jeden standard magazynków, jeden zestaw części tak uniwersalnych jak tylko się da. To zdecydowanie pomoże rozkręcić naszą produkcję i pomoże również w serwisowaniu."
DGR_every_soldier_tank_destroyer: "Każdy żołnierz niszczycielem czołgów"
DGR_every_soldier_tank_destroyer_desc: "Nasi wrogowie objawiają się w wielu postaciach, ale te opancerzone są najbardziej wymagającym typem przeciwnika. Nie wystarczy pozostawić takie pojazdy by zostały pokonane przez nasze własne pojazdy. W starciu z naszą piechotą, wrogie pojazdy muszą niknąć jak gdyby dostały się pod ostrzał artylerii. Każdy z naszych piechociarzy otrzyma przeciwpancerne środki do walki. Każdy z nich będzie przeszkolony w ich użyciu. Każdy z nich dowiedzie swojej wartości w ilości czołgów które zniszczy. Wrogie pojazdy nie będą już przechylać szali na stronę przeciwnika - gdyż każdy czołg będzie warty jedynie jednego naszego żołnierza. A nawet mniej gdy uda nam się przejąć ich pojazdy na nasz użytek."
DGR_black_stormtroopers: "Czarni szturmowcy"
DGR_black_stormtroopers_desc: "Ciało jest słabe. To było oczywiste odkąd wynaleźliśmy broń palną. Ironicznie, od tego właśnie czasu zbroje przestały mieć jakiekolwiek znaczenie, co dla mnie jest tak cholernie sprzeczne z intuicją, że...ah, co ja tam wiem? Teraz, będąc w erze maszyn, jesteśmy w stanie stworzyć roboty które będą walczyły za nas. To nie jest kwestia czy możemy to zrobić, ale czy powinniśmy. Z tym, że jeśli możesz osiągnąć przewagę nad swoim wrogiem - czy nie powinieneś tego wykorzystać?\n\nWyobraźcie sobie żołnierzy którzy nie potrzebują zapasów, nie czują strachu, nie śpią, nie muszą się nigdy zatrzymywać. Skala terroru jaki zaprowadziliby wśród wroga jest niewyobrażalna. A najlepsze? Mamy całkowitą kontrolę nad ich działaniami więc nie musimy się bać jakiegoś pieprzonego scenariusza rodem z Terminatora. To sprawiłoby, że stalibyśmy się pionierami wojskowymi na skalę globalną - nikt jeszcze nie użył humanoidalnych robotów na wojnie! Jebać Asimova, lecimy z tym tematem!"
DGR_national_people_air_forces: "Narodowo-Ludowe Siły Powietrzne"
DGR_national_people_air_forces_desc: "Mówcie co chcecie, ale jeśli miałbym wybierać pomiędzy siłami zbrojnymi z nieskończonymi zasobami ludzkimi i pojazdami, a lotnictwem - wybiorę to drugie. Wsparcie lotnicze jest niezbędne przy przełamaniach, ambitnych kampaniach, chronieniu naszego rodzimego przemysłu...przynajmniej zanim wrog nie odkryje pocisków manewrujących. Ale nie pozwolimy im na to. Nasze samoloty przesłonią słońce, aż wstanie czerwony świt. I czerwony będzie przez cały dzień, i tylko czerwień na niebie będą nasi wrogowie widzieli! A istnieje wiele różnych ciekawych sposobów by zabijać ludzi z przestworzy. I będziemy inwestować w nie wszystkie!"
DGR_rapid_response_brigades: "Brygady Kawalerii Powietrznej szybkiego reagowania"
DGR_rapid_response_brigades_desc: "Motyw kawalerii powietrznej zawsze mnie śmieszył ze względu na przywiązanie Polaków do słowa kawaleria. Wszystko musi być pierdoloną kawalerią, jebane czołgi to kawaleria pancerna, śmigłowcowy desant to kawaleria powietrzna. Chłopy naprawdę dalej marzą o tym żeby tylko pić, ruchać i jeździć konno. Ale mniejsza o nazwę - jednostki szturmowe poruszające się za pomocą śmigłowców mogące reagować na każdą nawet najmniejszą zmianę lub przełamanie na froncie oddalonym o setki kilometrów to jest coś co zmieni całkowicie obraz naszej wojny. Błyskawiczny i zmasowany atak przeprowadzony za pomocą takich brygad przełamie każdą najtwardszą obronę i gdy dobrze to skoordynujemy i zapanujemy nad chaosem operacyjnym - będzie to broń skuteczniejsza niż jakakolwiek bomba."
DGR_wzl_lightning: "Program WZL Błyskawica"
DGR_wzl_lightning_desc: "Tak, tak - kawaleria powietrzna brzmi fajnie, ale czasami potrzebujesz czegoś nie mniej mobilnego ale z większym pierdolnięciem. I tutaj na scenę wchodzi program Sierp. Nowy prototyp śmigłowca bojowego, zaprojektowany by sprostać wszystkim wymaganiom postupadkowego pola bitwy. Końcowym rezultatem będzie drapieżny ptak który błyskawicznie niszczy wszystko na swojej drodze, jak na Błyskawicę przystało. W dodatku śmigłowce tę będą podbijały morale naszym ludziom, kiedy zobaczą oni całą pierdoloną burzę zmierzającą w ich stronę wiedząc że to wsparcie leci. Puśćcie po drodze jeszcze motyw z Red Alerta albo Rajd Walkirii i będzie cudownie."
DGR_strategic_destruction_command: "Narodowe Dowództwo Strategicznej Destrukcji"
DGR_strategic_destruction_command_desc: "Wszyscy pamiętamy jak skończyło Drezno po bombardowaniu przez aliantów podczas Drugiej Wojny Światowej oraz co spadło na Hiroszimę i Nagasaki. Co prawda, bomb atomowych jeszcze u nas nie uświadczymy ale za to jesteśmy gotowi na to by powołać Narodowe Dowództwo Strategicznego Zniszczenia. Brzmi dość krindżowo, może i to prawda - ale będzie to bardzo odpowiedzialne dowództwo które będzie wyznaczało cele dla naszych bombowców. Bo nie będziemy tak po prostu bombardować cywili na oślep - to by było barbarzyńskie morderstwo! Najpierw wyznaczymy cele wojskowe znajdujące się na terenie danego miasta - a potem dopiero zbombardujemy wszystko co się tam rusza. Bo najważniejsza jest odpowiedzialność - i takie dowództwo to zapewni (zapewni również to że będzie na kogo zrzucić winę jeśli coś pójdzie nie tak)"
DGR_wzl_anvil: "Program WZL Kowadło"
DGR_wzl_anvil_desc: "Fajne zakłady tam macie, byłoby fajnie gdyby nikt wam nie przeszkadzał w produkcji wojennej, prawda? Dlatego potrzebujemy bombowca. I tutaj na scenę wschodzi program Kowadło. Zapewni on wszystko czego potrzeba współczesnemu lotnictwu od bombowca. Na szczęście nie musimy nim daleko lecieć do jakichś Chin czy Ameryki - nasi przeciwnicy w Polsce będą idealnym poligonem doświadczalnym. Ten nowy projekt w całości sprosta wyzwaniom nowoczesnego pola bitwy, gdzie bombowce nie są jedynie ograniczone do bombardowania wroga w pizdu, lecz są na tyle zwinne by walczyć jak równy z równym z innymi bombowcami czy nawet myśliwcami przechwytującymi. Nastała przyszłość!"
DGR_39_aviation_regiment: "Przywrócenie 39 Pułku Lotnictwa Myśliwskiego"
DGR_39_aviation_regiment_desc: "Lotnisko w Pyrzowicach zanim stało się cywilnym portem lotniczym miało historię wojskową - najpierw Niemcy a potem Sowieci i w końcu Wojsko Polskie wykorzystywało je jako bazę lotnictwa wojskowego. Za czasów komuny funkcjonował tutaj 39 Pułk Lotnictwa Myśliwskiego. Nie był on czymś wyjątkowym, ot - kolejny z pułków lotniczych jakich za starych czasów wiele było. Tutaj bardziej chodzi o symbolikę - potrzebujemy jednostek wojskowych które będą odnosiły się do dziedzictwa poprzedników. Daje to takiej jednostce prestiż, a żołnierze chcą dorównać temu prestiżowi starając się być jak najlepsi. To dobre rozwiązanie, a że przy okazji możemy lekko rozwinąć lokalne siły lotnicze oraz odbudować coś co istniało...co prawda nie w Pyrzowicach lecz już w Niegowoniczkach...ale nadal - jest to coś wartego zrobienia."
DGR_wzl_hammer: "Program WZL Młot"
DGR_wzl_hammer_desc: "Stare myśliwce sprawdzają się obecnie w walce przeciwko innym lokalnym watażkom, ale w momencie kiedy awansujemy do kolejnej ery technologicznej, nowoczesne odrzutowce sprawią że będzie nam trochę trudniej konkurować latając na starych radzieckich złomach. Na to odpowiedzią jest Młot. Program rozwoju nowoczesnych myśliwców które tak mocno będą w stanie przywalić wrogim samolotom że jeśli nie spadną od razu to będzie im dzwonić w uszach tak długo aż nie wylądują. To rozwiązanie eleganckie i łączące w sobie wszystkie współczesne rozwiązania w dziedzinie awioniki. "
DGR_mothership_program: "Program rozwoju statku-matki"
DGR_mothership_program_desc: "Wyobraźcie sobie gigantyczny samolot. A teraz wyobraźcie sobie że na pokładzie tego samolotu są mniejsze samoloty które mogą wystrzelić w przestworza w każdej chwili. Lotniskowiec w przestworzach - i to nie jakieś mrzonki w stylu latającego pokładu jak z Avengersów tylko prawdziwe i funkcjonalne rozwiązania które podczas historii były rozwijane przez wiele różnych krajów. Co prawda...w sumie nie wiem czy my tego potrzebujemy tak po prawdzie bo wojna wewnątrz jednego kraju takiego jak nasz sprawia, że samoloty od baz daleko nie muszą się oddalać bo i odległości są małe...ale może jest to przyszłościowy projekt który pozwoli nam realizować globalną politykę? Kto wie, może jeszcze przyda się do czegoś niż żeby tylko wyglądało ładnie."
DGR_cut_luxury_sector: "Cięcia w sektorze luksusowym"
DGR_cut_luxury_sector_desc: "Ile razy mam wam przypominać, że znajdujemy się w stanie wojny?! Nie ukrywam, pojęcie luksusu jest płynne i zmienia się ono wraz z warunkami życia, ale i tak musimy zdecydowanie obciąć produkcję na tych produktach które nie są niezbędne do przeżycia a są jedynie fanaberiami ludzi którzy tęsknią za burżuazyjnymi czasami. Nie potrzebujecie drogich zegarków, luksusowych samochodów czy wyrafinowanych ubrań. Poradzicie sobie bez nich, ale wojsko nie poradzi sobie bez kolejnych dostaw ciężkiego sprzętu! Można nawet powiedzieć że bez niektórych produktów żywnościowych też sobie poradzicie. Cholera jasna, kiedyś to człowiek żył o chlebie i wodzie i jakoś nie narzekali! Po wojnie będzie lepiej, ale póki co czas na dietę, Panowie i Panie."
DGR_national_people_navy: "Narodowo-Ludowa Marynarka Wojskowa"
DGR_national_people_navy_desc: "Nie mam zbyt wiele do dodania. Flota. HA! Cóż, jak bardzo mierzi mnie pomysł marnowania cennych zasobów na dryfujące śmieci, kiedyś w końcu tę flotę będziemy musieli zrobić. Możemy zacząć przygotowywać się pod względem badawczo-planistycznym coby potem mieć jakieś podstawy. Ale nie spodziewajcie się że wpompuję w ten projekt góry złota, jest wiele innych ważniejszych rzeczy do zrobienia. Poza tym, do Bałtyku daleko i jakoś nie widzą mi się wielkie desanty i rekonstrukcje bitwy o Midway na pierdolonej Wiśle. Póki co to będzie mnóstwo ceremonialnych tytułów i pustych stołków przez dłuuuugi czas. Ale tak długo jak nie budujemy żadnych faktycznych okrętów to powinno być spoko."
DGR_przemsza_program: "Program Przemsza"
DGR_przemsza_program_desc: "Przeszedłem się dzisiaj koło Pogorii IV by popatrzeć jak te wodoluby testują swój nowy sprzęt. Nazwali całe to przedsięwzięcie 'programem Przemsza'. Gwoździem programu jest użycie istniejących łódek i zmodyfikowanie ich dopóki nie przestaną tonąć lub eksplodować i staną się w miarę używalnymi lekkimi okrętami wojennymi. Za każdym razem póki co polegli w przedbiegach. Albo zbyt przesadzili z modyfikacjami, albo łódka jest za ciężka albo dziurawa, albo jeszcze jakaś inna wymówka. Dno Pogorii obecnie wygląda jak krajobraz po morskiej bitwie. Chujowo byłoby być nieszczęśliwcami których łodzie zostały użyte do testowania. Przynajmniej jest to jakaś rozrywka na spacerze kiedy idziesz sobie i kolejna łódź dokonuje samozapłonu, a jedyne co słyszysz to wulgaryzmy z ust inżynierów. No i właśnie...problem polega na tym, że dzisiaj łódka nie zatonęła. Jest to niewątpliwie interesujące, bo skoro im się udało to znaczy że będziemy przechodzili do następnego etapu. A to...niedobrze."
DGR_warta_shipyard: "Stocznia Wojskowa Warta"
DGR_warta_shipyard_desc: "Jest niedobrze. Znajdujemy się w chwili w której wprowadzamy przeklęty plan stworzenia stoczni wojskowej. Muszę przyznać, dobrze że nie testowali swoich świetnych pomysłów na mniejszych zbiornikach bo byłoby to super komiczne. No ale, infrastruktura Warty i dostęp do w miarę porządnego zbiornika wodnego to najlepsze co możemy osiągnąć zanim dotrzemy do wybrzeży Bałtyku. Jezioro Jeziorsko jest większe od Pogorii i będzie odpowiednim miejscem gdzie będziemy mogli testować te ustrojstwa, więc rozumiem że powinniśmy się trochę do tego przygotować, nawet jeśli uważam że to wszystko jest jedną wielką stratą pieniędzy które moglibyśmy spożytkować lepiej w każdej innej gałęzi naszego wojska. Niestety, jeżeli faktycznie w to idziemy to przynajmniej powinniśmy dociągnąć ten projekt do końca."
DGR_project_716: "Kontynuacja Projektu 716"
DGR_project_716_desc: "716. Projekt kutra transportowego, stworzonego do przewożenia dywizji przez cieki wodne na niewielką skalę. Przynajmniej na papierze, w naszym przypadku te relikty słusznie minionych czasów są dokładnie tym czego do tej pory potrzebujemy. Są na tyle niewielkie lecz pojemne by być efektywnymi w swoim zamiarze. No i to komuszy projekt, co ucieszy lud. Czego w sumie tutaj nie lubić? No może tego, że jest to kolejny projekt Politbiura dotyczący marynarki...ale może skupmy się na pozytywach. Może i flota będzie bezużyteczna, ale będziemy w końcu potrzebowali transportowców do inwazji przez rzeki. Bo można się spodziewać że wróg wysadzi wszystkie mosty na co większych rzekach w kraju. A jeśli przy okazji okopią się dobrze na drugim brzegu, przeprawa pontonowa byłaby samobójstwem. Ot, transportowce. Przynajmniej tyle dobrego z tego będzie."
DGR_first_npn_flotilla: "Pierwsza flotylla NLMW"
DGR_first_npn_flotilla_desc: "Ja pierdolę. Udało im się? Usłyszałem dzisiaj, że nasze postępy morskie pozwoliły na zwodowanie trzech nowych okrętów klasy Przemsza. Naprawdę nie doceniłem marynarki wojennej tak bardzo i przegapiłem moment w którym się tak bardzo rozwinęli? Niespodzianka, lecz przyjemna niespodzienka. To oznacza że te wszystkie inwestycje nie były bezpodstawne i teraz posiadamy więcej narzędzi do podbijania Polski. Mój instynkt był słuszny! Jak się powiedziało 'A' to trzeba powiedzieć 'men'. Oj, upchamy mnóstwo żołnierzy do tych cacek. Zobaczmy jak daleko możemy zajść z tym projektem!"
DGR_metalowiec_gunboat: "Kanonierka klasy Metalowiec"
DGR_metalowiec_gunboat_desc: "Sukces stoczni Warta oznacza, że możemy podwoić nasze wysiłki jeśli chodzi o produkcję słodkowodnej floty o której to Politbiuro tak długo fantazjowało. W końcu z dnia na dzień docieramy do coraz większych zbiorników wodnych, więc w tym momencie to nie jest już taki durny pomysł. Co prawda, nadal uważam że zbyt obsesyjnie podchodzą do tego co byłoby najlepsze by wzmocnić Dąbrowę (cokolwiek innego), ale próżno szukać u nich sensu. No ale nie mogę się kłócić z faktem, że jest jakiś potencjał w rozwijaniu tych rzeczy."
DGR_pogoria_monitor: "Monitor klasy Pogoria"
DGR_pogoria_monitor_desc: "Pomimo całej mojej niechęci co do Pogorii i wszystkich wodolubów tam pracujących, nie mogę nie przyznać (i strasznie mnie to boli), że ich wysiłki nie przyniosły rezultatów. Uch, prawię się zżygałem mówiąc to. Tak czy siak, marynarka wojenna pracuje teraz nad faktycznymi większymi okrętami wojennymi i zaproponowali że następna klasa okrętów powinna się nazywać 'Pogoria'. Bezczelne lizanie sobie jaj, ale w ramach nagrody za pierdolony cud przekształcenia lądowego państewka Zagłębia w potęgę morską...zasługują...na trochę...no, tak."
DGR_janczyszyn_project: "Projekt Janczyszyn"
DGR_janczyszyn_project_desc: "Ukoronowanie całego bezsensu udoskonalania marynarki wojennej. Od zawsze w Polsce żartowano z obietnic polityków, że jak będą zdesperowani to obiecają nawet i lotniskowiec. Po czym w jednej kampanii faktycznie zostały obiecane. Nie jeden a dwa. I mniejsza już o to, ale...nie - kurwa nie wierzę że my w to na serio brniemy. Lotniskowiec? Ja pierdolę, i może jeszcze nazwiemy go Jan Paweł II? A na pokładzie będzie miał małe samolociki. Można będzie robić z tego mnóstwo żartów bo tylko do tego to się chyba nadaje.\n\nChociaż...biorąc pod uwagę, że nasza wojna jest na ukończeniu i zaraz przyjdzie nam ekstrapolować naszą potęgę wojskową na skalę regionalną - taki symbol potęgi nie byłby nawet najgłupszym pomysłem. Jeśli tylko damy radę wyprowadzić naszą flotę z mentalności wojny z watażkami których największym osiągnięciem była dzida na kajaku. A więc proszę Państwa...chyba robimy lotniskowiec?"
DGR_redirect_regional_budgets: "Przekierowanie budżetów samorządowych do centrali"
DGR_redirect_regional_budgets_desc: "Samorządy zawsze specjalizowały się w przepierdalaniu pieniędzy na najbardziej idiotyczne projekty. To ktoś postawi ławkę za kilkaset tysięcy, tu ktoś jakiś pomnik papieża lub innego celebryty za miliony złotych, a potem toaletę za 650 tysięcy złotych którą będa budować przez 4 lata. Nie ma lepszych gangsterów od ludzi robiących miejskie przetargi. Bo szwagier ma firmę co kostkę brukową robi - to spoko, zabetonujemy tą kostką cały rynek! I tak się kręci interesik. \n\nTrzeba powiedzieć temu stop. Nigdy więcej na naszej warcie nie będzie takich wałków robionych, ani na wsiach, ani w metropoliach. Po części dlatego że właśnie zdecydowaliśmy o przekierowaniu większości środków samorządów do centralnego funduszu zbrojeniowego. Lepiej spożytkujemy te pieniądze wydając je na coś funkcjonalnego i coś co pomoże naszym żołnierzom a nie napełni kieszenie nepotycznym kolesiom."
DGR_freeze_civilian_infrastructure: "Zamrożenie cywilnych projektów infrastrukturalnych"
DGR_freeze_civilian_infrastructure_desc: "Jak bardzo drastycznie by to nie brzmiało - w pewnych sektorach musimy częściowo zawiesić rozbudowę i działalność. Wstrzymanie cywilnych projektów infrastrukturalnych pozwoli nam na przekierowanie funduszy do sektorów które bardziej w tym momencie potrzebują pieniędzy - na wojsko. To wyjątkowa sytuacja która może nam przysporzyć sporo niezadowolenia i sami możemy wprowadzić się tutaj w pułapkę...bo okaże się że tam gdzie była potrzebna droga, idzie front i nasze jednostki nie będą mogły się skutecznie przemieszczać...ale cóż - musimy poświęcić się trochę. Najwyżej w takich wypadkach będziemy nacjonalizować wszystko co się da i przekazywać dane działki pod armię by można było użyć strategicznych rezerw na odbudowę danej infrastruktury. Ale to tylko w niektórych wyjątkach. Nie próbujcie się nawet kurwa obrażać - musimy jakoś skończyć wojnę!"
DGR_liquidate_private_assets: "Likwidacja pozostałych majątków prywatnych"
DGR_liquidate_private_assets_desc: "Nasza walka z prywaciarzami odniosła ogromny sukces na tym polu, większość milionerów nie posiada już swoich bogactw a wszelkie mienie zostało odpowiednio zredystrybuowane pośród...potrzebujących. Ale w miarę jak podbijamy dalsze tereny, nadal znajdujemy kolejnych nowobogackich którzy myślą że zapomnimy o nich. Noszą na plecach ogromnę znamię wyzysku niewinnych ludzi, więc jak możemy ich w ogóle pominąć? \n\nMusimy podwoić nasze wysiłki żeby wszelkie prywatne bogactwa znacjonalizować i przekierować do funduszu wojskowego. W końcu jeden taki prywaciarz mógłby sobie zafundować prywatną armię z pieniędzy które posiada. A niektórzy to nawet cholera robili podczas Upadku. A jak czegoś nie będzie się dało zmonetyzować - rozebrać do zera lub sprzedać na części - wszystko musimy wykorzystać do ostatniego grosza."
DGR_special_purpose_forces: "Siły specjalnego przeznaczenia"
DGR_special_purpose_forces_desc: "Siły specjalne zawsze pełniły ważną rolę w strukturze naszej armii niezależnie od epoki w której się znajdowaliśmy, zatem przywrócenie ich z tą samą symboliką jaką używali wcześniej będzie czymś co 'prawowici spadkobiercy PRLu' powinni traktować priorytetowo. Komandosi byli perełką w całym morzu gówna zwanym Polskimi Siłami Zbrojnymi. Większości z nich w zasadzie udało się przetrwać Upadek i teraz stanowią część naszego państwa. Byli jedynym elementem Wojska Polskiego który nie zawiódł oczekiwań. Ale można było się tego spodziewać po nich w końcu. Jeżeli jest jedna rzecz która mogłaby zostać przywrócona sprzed Upadku - są to właśnie siły specjalne. Będą oni również idealnym materiałem propagandowym na którym możemy odbudowywać cały nasz program sił specjalnych."
DGR_maroon_berets: "Bordowe berety"
DGR_maroon_berets_desc: "Pomysł stworzenia wojsk spadochronowych był dziś szeroko omawiany w sztabie i postanowiliśmy pójść na całość z inwestycjami. Pomimo że po zebraniu kołatała mi w głowie jedynie myśl w stylu 'Co Ci się w tym pierdolniętym mózgu przestawiło że uznałeś to za dobry pomysł?', to zdecydowałem się dać temu projektowi szansę. Ku mojemu zaskoczeniu ćwiczenia spadochronowe okazały się jednak sukcesem. Zbyt dużym sukcesem. Gdybym wiedział że będzie tyle ochotników że skończą nam się samoloty ćwiczebne, zastrzeliłbym się za zdradę i brak wiary w samego siebie. Dopiero jednak po tym oświeceniu dowiedziałem się o idiotycznie dużych benefitach, które zostały obiecane naszym królikom doświadczalnym. Oczywiście, to wszystko było kłamstwo i wiele z nich opuściło obóz szkoleniowy, ale tak samo mnóstwo ludzi zostało. Wiedziałem, że po miastach Zagłębia chodzi mnóstwo świrów, ale bez przesady... kto przy zdrowych zmysłach zgłosiłby się na ochotnika, żeby wyskoczyć z całkowicie sprawnego samolotu?"
DGR_green_berets: "Zielone berety"
DGR_green_berets_desc: "Polska to w dużej mierze - poza tym, że jest, kurwa, płaska jak stół - lasy i dzikie ostępy, do których normalnie nie powinno się wchodzić, chyba że jest się harcerzem, zawodowym leśnikiem albo jednym i drugim. Żadnej z tych grup nie mamy w wystarczającej liczbie, ale dzięki połączeniu naszego szkolenia z bezlitośnie dużą liczebnością komunistów możemy spróbować stworzyć własnych profesjonalnych szyszkojadów. Byli jeszcze myśliwi, ale nie słyną oni z celnego strzelania, a ja mam już serdecznie dość słuchania o kolejnych przypadkach ostrzeliwania własnych ludzi. Jeśli uda nam się stworzyć profesjonalną piechotę leśną, to w najlepszym przypadku zobaczymy, czy niektórych z nich da się jeszcze uratować przed komunistyczną trucizną zalegającą w ich czaszkach, a w najgorszym - cóż, misje samobójcze istnieją nie bez powodu. Tak czy inaczej, dla nas to czysty zysk, a przy okazji będzie to dziedzina, w której możemy popisać się naszymi możliwościami przed innymi."
DGR_blue_berets: "Niebieskie berety"
DGR_blue_berets_desc: "\"Formoza\", nazwana na cześć popularnej torpedowni u wybrzeży Gdyni, była jednostką polskich nurków-dywersantów działającą w ramach Marynarki Wojennej Polskiej Rzeczypospolitej Ludowej. Choć nasze uzależnienie od Marynarki Wojennej jest niewielkie w porównaniu z innymi rodzajami sił specjalnego przeznaczenia, ich doświadczenie i potencjał na przyszłość jak dotąd w pewnym stopniu to rekompensują. Z tego powodu odtworzenie tej formacji, a także piechoty morskiej, oraz zapewnienie im odpowiedniego finansowania jest, zdaniem Komitetu Centralnego, właściwym kierunkiem działania. Przy odpowiednim wsparciu, kto wie - może te stare gąbki mają rację i nowe siły morskie wcale nie okażą się stratą czasu. Oczywiście nie chodzi o to, że dostaniemy od ręki całą Formozę wraz z jej personelem. Własną jednostkę będziemy musieli stworzyć sami. Ale przysięgam, jeśli znowu nazwą ją na cześć Pogorii, to chyba kurwa oszaleję."
DGR_restore_jwk: "Przywrócenie Jednostki Wojskowej Komandosów"
DGR_restore_jwk_desc: "W końcu, po Bóg jeden wie jak długim czasie, moje starania o zdobycie większych funduszy dla sił specjalnych przyniosły efekty i możemy teraz utworzyć nasze brygady komandosów z udziałem wszystkich zainteresowanych. Od naszych, jak zawsze, będących u szczytu formy rangerów, przez wątpliwie potrzebną, ale przynajmniej skuteczną piechotę morską, aż po nawet tych tępych jak cegła spadochroniarzy - każdy dostał swoje miejsce. Gdyby ci idioci posłuchali mnie wcześniej, naturalnie moglibyśmy osiągnąć znacznie więcej niż teraz, dysponując podwyżką finansowania na poziomie konkurującym z miesięczną pensją miejscowego dozorcy. Nieważne. Liczy się to, że mamy idealny obiekt do tego celu. No bo - Lubliniec? Halo? Jednostka Komandosów? Już ich pokonaliśmy, a poza walką z partyzantką, którą wystawili przeciwko nam po podboju, nie zrobiliśmy z tym absolutnie nic. Musimy przestać jęczeć o dawnych urazach czy jakimś reakcyjnym gównie i ponownie otworzyć tę jednostkę wraz z całym garnizonem."
DGR_special_industrial_group: "Specjalna Grupa Przemysłowa"
DGR_special_industrial_group_desc: "Czy ja jestem tutaj jedynym zdrowym na umyśle człowiekiem który pamięta bitwę o Azowstal? O lotnisko w Doniecku? O cholernych walkach o fabryki w Stalingradzie? Wojna się zmieniła, a tereny przemysłowe są najbardziej dogodnymi do obrony punktami strategicznymi. Oczywiście jeśli już znajdą się na linii frontu i nie mają jak produkować rzeczy które normalnie robili. To na takich właśnie operacjach polegających na infiltracji i przełamywaniu fortyfikacji terenów przemysłowych powinniśmy się skupiać a nie cudować z lotnikami czy marynarzami. Bo takie walki będą nas czekały prędzej czy później. A dotychczasowe doświadczenia pokazały nam że nasze wojska w ogóle nie są przygotowane na tego rodzaj operacji."
DGR_urban_sabotage_battalions: "Bataliony Sabotażu Miejskiego"
DGR_urban_sabotage_battalions_desc: "Wojna obecnie przypomina troszkę średniowieczną. Już tłumaczę - można sobie jeździć i zdobywać wsie, pola i inne nic nie znaczące lasy i bagna, armia sobie przejdzie, zrobi co swoje i potem nagle trafi na wielki ufortyfikowany zamek który musi oblegać. Bo miasta obecnie w doktrynie wojskowej pełnią rolę właśnie takich fortec które są okropnie ciężkie do zdobycia. Nie potrzebują oni wcale murów jeśli z każdego okna można wystawić karabin maszynowy a z każdego balkonu może na Ciebie spaść granat czy butelka z benzyną. Plus jest taki że chaos i tłok może działać również na naszą korzyść. Wystarczą odpowiednie oddziały dywersyjne które wysadzą parę kluczowych punktów w mieście, a inne zakradną się tunelami i wyjdą w samym sercu miasta siejąc chaos. Tylko to trzeba też potrafić a nie rzucić ludzi na pożarcie i niech się dzieje co chce. Zwykły żołdak tego nie zrobi, tu potrzeba odpowiednio wyposażonych i wyszkolonych batalionów sabotażystów miejskich."
DGR_red_guardians: "Czerwoni Strażnicy"
DGR_red_guardians_desc: "Kultura superbohaterów wykształciła w przeciętnym konsumerze swego rodzaju kult pieprzonego amerykańskiego światopoglądu. Tak bardzo gardzę tymi wszystkimi porównaniami do Kapitana Ameryki czy Supermana w każdym możliwym medium, że dam w pysk następnej osobie która zrobi to porównanie w odniesieniu do projektu Czerwonych Strażników. Oni nie będą biegali w jebanych piżamach i byli nieznośnie pompatyczni. To mają być maszyny do zabijania, szczyt rozwoju żołnierza, ogromny arsenał zamknięty w jednej osobie. Pierdolony terminator. Jak to chcemy osiągnąć? To już jest kwestia naukowców którzy nad tym pracują. A to że to wygląda jak z waszych zasranych komiksów to już wina waszego spierdolonego umysłu który nie może powstrzymać się od porównywania, że ŁAAAŁ, TO ZUPEŁNIE JAK W MOJEJ ULUBIONEJ SERII."
DGR_pkwn: "Manifest Komitetu Wyzwolenia Narodowego"
DGR_pkwn_desc: "Polski Komitet Wyzwolenia Narodowego kojarzy się z komunizmem, tak. Nie ma sensu udawać że ktokolwiek będzie na nas patrzeć inaczej niż jak na czerwoną zarazę. No to pójdźmy dalej w ten trend - musimy rozesłać manifest na cały świat. Odezwę, która będzie oświadczała jednogłośnie kto wygrał Polskę i jednocześnie przypominała o tym o co walczyliśmy. Bo to że walka nasza była o jeden kraj nie oznacza, że nasze wartości nie są uniwersalnie aplikowalne do każdego kraju na tym świecie.\n\nW szczególności do każdego kraju który jest spętany neoliberalną demokracją, kapitalistycznym batem czy autorytarnym uciskiem jakiegoś losowego władyki którego nie obchodzi nic poza własnym bogactwem. My nie kończymy tutaj naszej podróży, lecz jesteśmy pierwszymi przedstawicielami nowej ery która zaistnieje na świecie. Najpierw w Europie, a potem na całym świecie - wszędzie ludzie będą mogli czerpać inspirację z naszej walki, gdzie pomimo tego że szanse mieliśmy dosłownie zerowe - pokonaliśmy wszystkich i przejęliśmy władzę nad losem. \n\nTo my, Polacy."
DGR_eternal_watch: "Wieczna warta"
DGR_eternal_watch_desc: "I odszedł na wieczną wartę razem ze swoimi poglądami i całym Politbiurem. Nie będę udawał, że jakoś wielkie mi uczynił pustki tą śmiercią, w końcu trochę się przyczyniłem do jego rychłego końca. I tak za długo już był u progu Hadesu. Ale...to nadal jest dzień symboliczny. Bo od dzisiaj przestają już mieć znaczenie jakiekolwiek pozory. Jeszcze tylko pogrzeb i można brać władzę całkowitą. Żaden ideologiczny odpad nie stanie mi już na drodze. Historia wynagrodziła swojego wiernego sługę możliwością dostąpienia najwyższej władzy w kraju. Rozpoczynamy nową erę - erę żelaznej woli i odważnych czynów, erę odwagi i bezkompromisowości. Jeszcze tylko ustawić do pionu wszystkich tych pożal się Boże generałów i czas przyjdzie na otwarcie drzwi do areny międzynarodowej z hukiem."
DGR_state_funeral: "Państwowy pogrzeb"
DGR_state_funeral_desc: "Ostatni pozorowany czyn który muszę odbębnić - udawać smutnego na wielkim pogrzebie państwowym. Taka wydmuszka, że aż chowamy pustą trumnę. Ale nie za bardzo smutnego, takiego pogrążonego w lekkiej żałobie ale nadal ze stalową determinacją i pewnością siebie. Bo oczy całego kraju będą zwrócone na tę ceremonię - nie mogę sobie pozwolić na chwilę słabości. Oczekują niezłomnego wodza - i go dostaną. Nawet jeśli reszta jest mierna i chwiejna to kręgosłup jest nie do złamania. Kto by pomyślał, że jeszcze te kilkanaście lat temu taki człowiek jak ja dostanie od losu taką szansę? Ale wiele ludzi dostaje szanse. Tylko wielcy ludzie potrafią ją wykorzystać i uczynić z losu swoją marionetkę.\n\nNadchodzą wielkie czyny. "
DGR_second_wedding_to_sea: "Drugie zaślubiny z morzem"
DGR_second_wedding_to_sea_desc: "Komisarze Zimmermann i Zagórski coś knują. Powinienem się domyślić, że jak skończy się walka o Polskę to zacznie się polityczna gra kopania pod sobą dołków. Wielka parada z okazji odzyskania dostępu do morza brzmi ładnie, drugie zaślubiny z Bałtykiem brzmią patriotycznie a jednak...to wszystko jest podejrzane. Zbyt dużo sprzętu jest przerzucane na północ - tak, wiem że to parada wojskowa ale na paradę można się po prostu udać, nie trzeba przebazowywać takiej ilości sił. Może przez te lata wojny już całkowicie mi odbiło z paranoją i zamiast cieszyć się ze święta to szukam wymówki by znowu rozpocząć z kimś konflikt. \n\nAle to oni zaczęli! Tak, pojadę tam! Ale będę miał oczy dookoła głowy. Już i tak mówili mi wcześniej że doniesienia o tajemnicach tuszowanych przez komisarzy to tylko teoria spiskowa reakcjonistów....a co jeśli to była prawda?"
DGR_eastern_rising: "Powstanie Wschodnie"
DGR_eastern_rising_desc: "Spodziewałem się, że nie wszyscy od razu zaakceptują naszą władzę nad krajem. Z resztą, prowadziliśmy całą serię wojen unifikacyjnych po to. Ale wiedziałem, że nawet po zjednoczeniu będzie istniał opór. To naturalne i nieuniknione. I tak właśnie teraz dzieje się na wschodzie Polski - Lublin, Rzeszów, Przemyśl. No właśnie - Lublin, Rzeszów, Przemyśl. Wschód Polski od zawsze był mocno konserwatywny, a im bliżej granicy tym bardziej tradycjonalistyczne społeczeństwo się stawało. Nie zmieniło się to aż tak podczas wojen, więc...o co chodzi? Dlaczego mamy na swoich rękach powstanie ludność która powinna się cieszyć że narodowcy doszli do władzy?\n\nGwardia była aż nadto gorliwa by ruszyć większością swoich dostępnych sił do pacyfikacji. W sumie to słusznie, od tego oni są. Od tego są oni. Mimo to, nie chciałbym żeby ktokolwiek witał Czyżewskiego jako wyzwoliciela. Zawsze jak jest okazja to musi mi wbić jakąś szpilę, zawsze z czymś musi się nie zgodzić. No niech jedzie - może partyzanci załatwią ten problem za mnie."
DGR_ascension_of_one: "Wyniesienie Jedynego"
DGR_ascension_of_one_desc: "Ojciec zawsze powtarzał żeby nie dawać władzy ludziom, którzy swoim ego przewyższają rozum (chociaż on używał stwierdzenia - \"wyżej srają niż dupy mają\"). Tak czy owak, twierdzenie to jest prawdziwe. Jakim trzeba być zadufanym w sobie gnojkiem, jakim kurwa kretynem i narcyzem żeby będąc poważanym wysokim ministrem państwa pojechać do jebanego Grodziska Wielkopolskiego, zrobić sobie jakieś pierdolone jasełka i się koronować??? NA KOGO TY W OGÓLE SIĘ KORONOWAŁEŚ, TY NIE JESTEŚ U WŁADZY! Wielkie wyniesienie Jedynego - ja pierdolę, jeden to wynosi twój iloraz inteligencji. Powinienem dawno rozprawić się z tym zasranym sekciarzem. Powoli mam wrażenie że tracę kontrolę nad tym co te pokemony wyprawiają."
DGR_abraham_mutiny: "Bunt Abrahamowicza"
DGR_abraham_mutiny_desc: "Z Abrahamowiczem rozmawiałem wiele razy na tematy Kresów oraz o tym, że po skończonej kampani w Polsce powinniśmy siłą egzekwować naszą władzę na terenach utraconych. Oczywiście, trzeba to robić stanowczo ale jednak ostrożnie - wyczucie czasu w geopolityce jest jedyną umiejętnością która jest nam potrzebna do sukcesu. No więc, Żeligowski miał słuszność, rosyjskie zielone ludziki z Krymu dopracowały ten model prowadzenia polityki, a my go mieliśmy udoskonalić idąc na Wilno. Tak przynajmniej zakładały nasze dywagacje, ale nie zliczę ile razy podkreślałem znaczenie słowa CZAS.\n\nWięc zgadnijcie kurwa co? Nagłówki w Litewskich wiadomościach - POLACY GROMADZĄ WOJSKA NA GRANICY, NIEPOKOJĄCE WIEŚCI Z ZACHODU. A u nas euforia, jebany Rydz-Śmigły sie reinkarnował i krzyczą do niego \"Wodzu, prowadź na Wilno!\". Na pytanie co on odpierdala odpisał mi, że to tylko pozorowanie takie i nic beze mnie się nie wydarzy. Jakoś mu nie wierzę."
DGR_meeting_with_chief_pioneer: "Spotkanie z Głównym Pionierem"
DGR_meeting_with_chief_pioneer_desc: "Maciek Lasecki zdaje się jest moim ostatnim przyjacielem któremu mogę zaufać. Wiem, że stanie po mojej stronie nie ważne co by się działo. A dzieje się wiele, bo od kilku dni siedzę pod wzmożoną strażą w obawie o to czy aby te skurwysyny nie chcą mnie odstrzelić. Bo chcą mnie dopaść, na pewno chcą to zrobić. Hieny pierdolone, teraz już nie mają oporów żeby się mnie pozbyć. Maciek wszak jest Pierwszym Pionierem, szefem Korpusu Cywilnego, generałem Narodowej Armii Ludowej. Zawsze był rozważnym i spokojnym człowiekiem, dlaczego nie mogłem mieć więcej takich jak on? On mi wszystko powie, on będzie wiedział jakie są nastroje w społeczeństwie, prawdopodobnie ma też kontakt z resztą generalicji. On mnie nie zdradzi. Muszę się z nim czym prędzej zobaczyć. \n\nBo obawiam się że szachownica została rozłożona w momencie unifikacji kraju a teraz przez ostatnie parę miesięcy każdy rozstawiał swoje pionki..."
DGR_way_is_shut: "Konduktorze łaskawy, byle nie do Warszawy"
DGR_way_is_shut_desc: "Jak. Ja. Kurwa. Nienawidzę. Polityków. \n\nCentralny rząd cywilny który osiadł w Warszawie obsrał zbroję i stwierdził że się izoluje od tego całego bałaganu, zaraz po tym jak gwardziści obsadzili wszystkie szlaki i miasta na południe od Warszawy, a armia wyszła z baraków na północy. Co prawda jednak ta cała banda aparatczyków będzie bezużyteczna jeśli faktycznie dojdzie do kolejnej wojny domowej, ale teraz bardziej niż zwykle właśnie potrzeba soft power by jej zapobiec, a Ci wesoło stwierdzają że to nie ich sprawa.\n\nKamień na kamieniu nie zostanie z tego cholernego, zadufanego w sobie miasta. Choćbym i miał być porównywany do Hitlera to zburzę całą tę Warszawę, mieszkańców porozrzucam po pobliskich miastach a stolica...tę już mamy w Dąbrowie od dawna. Nie potrzebujemy tego zgniłego centrum."
DGR_struggle_for_fuel: "Walka o paliwo"
DGR_struggle_for_fuel_desc: "Wyścig szczurów rozpoczęty. Każdy teraz prześciga się o zdobycie jak największej ilości paliwa. Szczerze...to przypomina mi okres na niedługo przed naszą rewolucją w Dąbrowie. Wtedy też liczyliśmy każdą kroplę benzyny - i w końcu zdecydowaliśmy się napaść na konwój przewożący paliwo by móc zasilić czołgi ze Sztygarki. Eh...historia znowu zatacza koło. \n\nNasza baza paliwowa została ogromnie rozbudowana by utrzymać wymagania narzucane przez stale rosnącą Narodową Armię Ludową, więc zaplecze jest solidne. My się o paliwo bić nie musimy, bo je mamy. Oni, daleko nie zajadą i w końcu zaczną się żreć między sobą. A my po cichutku boczkiem zajdziemy ich i wydymamy od tyłu. A potem wjedziemy sobie do ich sztabów czołgami i zarządzimy ostateczny ład."
DGR_operation_crane: "Operacja Żuraw"
DGR_operation_crane_desc: "Jedno z powiedzeń które uwielbiam brzmi: \"Zawsze bądź gotów na to, że Cię wyruchają \" I o ile jestem zawiedziony postawą moich generałów to nie oznacza że jestem nieprzygotowany totalnie na akcje przeciwko mnie. Jeden z głównych sztabów komisariatu znajduje się w Gdańsku i tam też uderzymy. Na 90% wiem, że planują zdradę - w jaki sposób, tego nie wiem. Ale doniesienia wywiadowcze mówią wprost o podejmowanych ruchach w celu przejęcia władzy. Oczywiście, daj im palec a zeżrą Ci całą rękę.\n\nW takim wypadku na zdradę można odpowiedzieć tylko absolutną i kompletną anihilacją. Atak prewencyjny, pokaz siły, a może i uda się zmieść z planszy jednego z głównych komisarzy. Tak czy owak, Gdańsk i jego obywatele odczują gniew Narodowej Armii Ludowej. Sporo ludzi zostanie poświęconych w imię wyższego dobra ale jestem na to gotowy. Bo takiego potwora jak Zimmermann trzeba albo trzymać na łańcuchu albo uśpić. Mieszkańcy Pomorza jeszcze by mi dziękowali za zbombardowanie, gdyby wiedzieli jaką przyszłość zgotowałby im naczelny komisarz..."
DGR_love_letter: "Miłosny liścik dla Inkwizytora"
DGR_love_letter_desc: "\"Kurwa Szarejko, ty widzisz jakie ty głupoty kurwa robisz, weź się jebnij w łeb ale się wpierw rozpędź.\"\n\nDobra, przyznaję, to nie jest może najlepszy kawałek literatury jaki ze mnie kiedykolwiek wylazł, ale emocje biorą górę - nie będę do tego durnia pisał językiem dyplomacji bo go nie zna. Poza tym możliwe jest że w ogóle nie zdąży przeczytać tego co miałbym tam napisać. Dlaczego? A to już niespodzianka i nie będę zapeszać. Ale pomimo to, wydaje Ci się że znasz kogoś kilka dekad i wiesz do czego jest zdolny. A mimo to, pomijasz jego wady i wynaturzenia i liczysz na to że sama więź czasu utrzyma relacje pomiędzy wami. Ślepota i głupota z mojej strony. Sentymenty zabijają, a nostalgia jest jak kwas - wyżre Cię i nie będzie go nic obchodzić.\n\nTakże, w ramach sentymentu - żegnaj przyjacielu. Nie będę za Tobą tęsknił. Obyś zgnił w piekle, a jeśli tam nie będziesz chciał się udać - sam Cię tam wyślę."
DGR_assuming_direct_control: "Przejęcie bezpośredniej kontroli"
DGR_assuming_direct_control_desc: "Plansza może i jest rozstawiona, ale wszyscy zdaje się grają w warcaby, podczas gdy tu trzeba doświadczonych szachistów. Współczesne pole bitwy nie może być analogiczne bo przegra w każdym możliwym scenariuszu. Ten kto kontroluje energię, kontroluje dynamikę i narzuca ton walki. Na całe szczęście nasz kraj opiera się po pierwsze na intranecie, który właśnie odcięliśmy wszystkim innym, oraz na zamkniętym obiegu energetycznym, który również właśnie wyłączyliśmy. My sobie poradzimy bo przekierowaliśmy odpowiednie ilości do magazynów energii oraz posiadamy kilka największych jednostek elektrowni w kraju które dostarczą nam wystarczającą ilość prądu.\n\nReszta będzie dławić się w ciemnościach i chaosie komunikacyjnym. To tylko kwestia czasu zanim odwidzi im się buntów i zapanuje pokój oraz oświecenie. Pod moim nadzorem, oczywiście."
DGR_last_showdown: "Ostatni taniec"
DGR_last_showdown_desc: "Karaluch ma to do siebie że nawet i wybuch atomowy przetrwa. Nieważne co próbowałem, ta cholerna padlina wciąż dąży do buntu i co gorsza, aktywnie już sprzeciwia się władzy centralnej (mojej, bo Warszawa nikogo nie obchodzi). Historia lubi się powtarzać, ale pierwszy raz jako tragedia, drugi raz jako farsa. I teraz los ukarał mnie za swoją pychę. \n\nChyba że to nie jest kara, lecz ostateczny test po którym już zostaje tylko chwała. Żeby pójść dalej trzeba często spalić wszystkie mosty by nic za Tobą nie podążało. I to jest właśnie taka próba. W końcu kiedyś, oni wszyscy byli moimi przyjaciółmi. I żeby zająć miejsce w panteonie największych ludzi świata - muszą zginąć.\n\nWracamy do punktu wyjścia. Równi bogom już byliśmy. Teraz została nam walka o miejsce w piekle."
DGR_salvation_tactics: "Taktyki ocalenia"
DGR_salvation_tactics_desc: "Jesteśmy waszym zbawieniem. Waszą jedyną nadzieją. Zaakceptujcie to i nie stawiajcie nam oporu, albo zniszczymy was i wszystkich waszych bliskich. Kurwa, to dość ponure... ale mam już dość pobłażliwych próśb. Chociaż może dodajcie to gdy wszystko inne zawiedzie. I, że jesteśmy jedynym prawowitym rządem. Chociaż, wszyscy zawsze tak mówią. Ale my na serio nim jesteśmy, posiadamy Dąbrowę - miejsce, w którym wszystko się zaczęło.\n\nMusimy pozować na wyzwolicieli. Znowu. Gdy wokół wszystko płonie, miasta są bombardowane a skurwysyny spiskują - my przynosimy pokój i dobrobyt. Ten kraj jest chory, a my jesteśmy lekarzami i mamy lek na wszystkie bolączki ludzi. Tylko my możemy zabezpieczyć przyszłość dla nas i przyszłych pokoleń. Eh...jak ja kurwa nienawidzę reklamowania się."
DGR_rally_to_the_flag: "Zjednoczenie szeregów"
DGR_rally_to_the_flag_desc: "Błyskawica jest czerwona, młot wykuje żelazny miecz. A orzeł je trzymający mówi wprost - jeszcze Polska nie zginęła. Tylko pod tym znakiem, Polska będzie Polską a Polak Polakiem. Musimy zrobić użytek z państwa które zbudowaliśmy na bazie armii i wprowadzić powszechną i totalną mobilizację ludową. Przypomnieć ludziom o co tak naprawdę walczymy i dlaczego to nasze barwy są jedynymi narodowymi barwami które nie są splamione jarzmem zdrady.\n\nWykorzystać wszelkie dostępne środki, nawet za cenę odebrania ludziom wolnej woli. Na głaskanie cywili przyjdzie jeszcze czas, bo póki co skończyło się grzeczne podejście - TERAZ GRZMIĄ ARMATY."
DGR_volkssturm: "Narodowo-Ludowe Brygady Szturmowe"
DGR_volkssturm_desc: "Gdy armia jest w potrzebie, obowiązkiem każdego jednego obywatela jest chwycić za broń i walczyć! Nawet jeżeli ta walka będzie logistyczna i z dala od frontu - to wysiłek musi iść w jednym kierunku. Kobiety chciały równych praw - dajmy im również równe obowiązki. Młodzież będzie idealnym zastępstwem do jednostek garnizonowych, a weterani - raz złożonej przysięgi nie porzucą. \n\nJeśli wrogie kohorty wejdą do miasta, obowiązkiem każdego obywatela jest stawić im opór. Karabinem, butelką z benzyną, kamieniami - czymkolwiek. Jeśli będą chcieli zająć jakąś wieś - stawić im opór! Nie mogą być w stanie postawić nogi na naszej ziemi bez kogoś kto będzie z nimi walczył. Wszyscy na front!"
DGR_race_for_the_base: "Wyścigi szczurów"
DGR_race_for_the_base_desc: "Nie możemy dać się uwikłać w kolejną bezsensowną wojnę domową na wyniszczenie która to przecież trwała tyle lat. Teraz, gdy mamy bezcenne doświadczenie z Upadku i Wojen Unifikacyjnych, musimy przebijać się szybko i bezlitośnie w kierunku strategicznych punktów wroga. Niszczyć składowiska, przecinać linie logistyczne, zajmować sztaby jednostkami szybkiego reagowania.\n\nTo musi być szybka i bezbolesna kampania, bo im dłużej ona trwa tym bardziej będziemy wyglądać jak przegrana strona, nawet jeśli będziemy wyglądać. Wystarczy popatrzeć jak dobrze poszła Rosjanom wojna na Ukrainie. Wygrywali, pchali się do przodu ale jakim kosztem? Desanty, rajdy na tyły, wojna błyskawiczna - inaczej ugrzęźniemy na wysypisku historii i cała nasza rewolucja będzie na nic."
DGR_scorched_earth_tactics: "Taktyka spalonej ziemi"
DGR_scorched_earth_tactics_desc: "Jeżeli ten kraj nie jest w stanie dać mi władzy po tym jak ja oddałem całego siebie naszej ojczyźnie, to może nie zasługuje na to by być traktowanym z szacunkiem. Jeżeli obywatele nie są w stanie opowiedzieć się po naszej stronie, to dlaczego my mielibyśmy próbować ich chronić? Tych którzy do nas dołączą, otoczymy żelaznym kordonem pancernym i staniemy z nimi ramię w ramię. Ale reszta? Tu nie ma miejsca na obojętność. Albo jesteś Narodową Armią Ludową - albo jesteś wrogiem Narodowej Armii Ludowej. Proste i skuteczne.\n\nA Ci którzy będą wrogami poczują co to znaczy terror. Nie będą w stanie prowadzić żadnych działań wojennych jeśli nie będą w stanie się ruszyć, wyżywić ani zaopatrzyć. Podpalimy ten kraj i będziemy patrzeć jak płonie. A Ci którzy przeżyją ten pożar przyjdą do nas na kolanach błagać o wybaczenie. "
DGR_dark_cold_hungry: "Ciemno, zimno, i głodno"
DGR_dark_cold_hungry_desc: "Morale to największy atut żołnierza. Nawet gdy wszystko jest przeciwko niemu, żołnierz który ma niezłomną duszę jest w stanie przełamać wszelkie barykady. Ale gdy nie ma wyżywienia, ciepłego ubrania i zaopatrzenia...nawet największy weteran przestanie dbać o zwycięstwo a zacznie się martwić o przetrwanie. \n\nMusimy uderzyć właśnie w te podstawowe wartości. Zniszczyć wszystko z czego mogą czerpać żywność, przełamać wszelkie linie zaopatrzeniowe, odciąć energię od każdego miasta i wsi, złamać ich ducha. Wtedy każda armia rozpadnie się niczym domek z kart. Budynki będzie można odbudować, plony posadzić na nowo, drogi naprawić. Ale zwycięstwo będzie wieczne i ostateczne."
DGR_ultimate_rocket_strike: "Ostateczny atak rakietowy"
DGR_ultimate_rocket_strike_desc: "Kolejnym krokiem na drodze do ostatecznego złamania woli przeciwnika będzie nie tylko ich niszczenie od wewnątrz i atak lądowy. Ludzkość odkąd istnieje spoglądała w niebo ku gwiazdom zastanawiając się co ich czeka w przyszłości. Lecz gdy przestworza spowite zostaną niezliczoną ilością rakiet, nie będą już nigdy podnosić głowy.\n\nTerror jaki musimy zasiać pośród nich musi być ciągły i bezlitosny. Z każdym uderzeniem rakiety w budynek będą musieli się zastanawiać czy aby na pewno wybrali dobrą stronę. Czy to dzień, czy to w nocy - nie mogą zaznać spokoju. Głównym celem oczywiście będą miasta bo te najłatwiej zamienić w fortecę. Ale nie będą w stanie walczyć pośród gruzowisk. Nawet jeżeli zestrzelą część, reszta dosięgnie ich prędzej czy później. I gwarantuję wam, po takiej długiej serii nie będzie im się chciało walczyć w cieniu naszych rakiet."
DGR_human_wave: "Szturm fali ludzkiej"
DGR_human_wave_desc: "Gdy już terror zostanie osiągnięty na odpowiednim poziomie, będziemy musieli dołożyć do tego ostatnią cegiełkę - szturm lądowy. I normalnie, założeniem wojny jest to żeby zlikwidować wroga zanim ten zobaczy nas. Ale nie tutaj, nie teraz. Chcemy żeby nas zobaczyli. Chcemy żeby się nas bali, gdy zobaczą niezliczone fale ludzi idących ku nim by ich zniszczyć. To będzie ostateczny gwóźdź do ich trumny, bo jak mają się bronić kiedy nas będzie po prostu więcej? \n\nSowiecka taktyka zakładała to na całej szerokości frontu. To było rzucanie ludzi na rzeź. My z tego robimy jednak specjalistyczną broń, jako jedynie dopełnienie całokształtu na który pracowaliśmy wcześniej innymi środkami zastraszania. Fala żołnierzy zmyje cały ten brud który zalęgł się w zgniłych rejonach Polski. Opatentowaliśmy właśnie walkę strachem."
DGR_sabotage_tactics: "Taktyki sabotażu"
DGR_sabotage_tactics_desc: "Precyzja i efektywność przy minimalnych stratach i wysiłku bojowym. Przez wojnę już przechodziliśmy i nie mamy ochoty na kolejną. To będzie po prostu operacja pokojowa i precyzyjne wycinanie narośli na zdrowej tkance Narodowej Armii Ludowej. Musimy przekierować wszelkie możliwe siły na to by uniknąć grzęźnięcia w długotrwałej wojnie na szerokim froncie.\n\nGdy wroga broń przestanie strzelać, ich pojazdy nie będą w stanie ruszyć z bazy a prośba do dowództwa o rozkazy spotka się z echem po drugiej stronie, wszyscy wrogowie zorientują się że gra została ustawiona od początku i nie mieli żadnych szans na zwycięstwo. Szybkimi i zabójczymi akcjami utniemy głowę hydrze a cała reszta rozleci się po prostu i rozpierzchnie w cztery strony świata. A dalej, będziemy tylko zamiatać."
DGR_logistical_ruin: "Logistyczne i infrastrukturalne zniszczenie"
DGR_logistical_ruin_desc: "Gdy musisz dotrzeć na front to chcąc nie chcąc musisz skorzystać z dróg lub połączeń kolejowych. Szczególnie gdy przestworza kontroluje kto inny. Ale gdy tory kolejowe są wysadzone, mosty zniszczone a drogi zablokowane...cóż. Nie możesz walczyć tam gdzie Cię nie ma. Nie będziesz również w stanie walczyć czymś czego nie posiadasz. Zarówno paliwa jak i amunicji.\n\nTak się składa, że nie ma takiej możliwości żeby wybudowali nowe tajemne składy, magazyny i bazy paliwowe gdzie mogliby się ukryć. A my dobrze wiemy gdzie się znajduje każdy z tych punktów więc precyzyjne uderzenie w te punkty to tylko formalność. Rozmontujemy całe armie wroga jednym prostym trickiem, i będą sobie mogli krzyczeć do dowódców żeby przysłali im więcej amunicji i zaopatrzenia, ale Ci będą tylko mogli rozłożyć ręce. Bo fabryk też nie będą mieli."
DGR_behind_enemy_lines: "Za liniami wroga"
DGR_behind_enemy_lines_desc: "Tatarzy swego czasu byli diabelnie skuteczni, a to dlatego że nie obchodziły ich żadne twierdze ani granice. Po prostu wjeżdżali jak do siebie, brali kogo się popadło w jasyr, plądrowali co się dało i znikali zanim ktokolwiek zdążył zareagować. I tak właśnie musimy działać. Zmobilizować jednostki specjalne do szybkich i głębokich uderzeń na tyły wroga by sprawić wrażenie że jesteśmy wszędzie dookoła nich.\n\nIm głębiej uderzymy, tym większy chaos wywołamy. Nie musimy nawet zostawać tam za długo, wystarczy kilka odpowiednich równoległych akcji a zamieszanie i próba reakcji sprawi że czasami to nawet wykonają robotę za nas eliminując siebie wzajemnie. Bo gdy nie będą wiedzieli co robimy, dodatkowy efekt psychologiczny będzie piorunujący i sparaliżuje wszelkie plany przeciwnika."
DGR_great_chops: "Operacja Wielkie Kotlety"
DGR_great_chops_desc: "Cała ta farsa opiera się na kilku chciwych i zdradzieckich szumowinach, których omylnie przywykłem zwać przyjaciółmi. Ta pierdolona banda Brutusów próbując mi wbić nóż w plecy zapomniała o jednym - znam ich na wylot. Wiem jak myślą i w jaki sposób działają. I nie omieszkam wykorzystać tego przeciwko nim. A bez nich? Bez nich nie ma żadnego buntu, żaden z ich żołnierzy nie będzie w stanie kontynuować walki bez swojego lidera. \n\nRozwiązanie jest bardzo proste w założeniu - pozbyć się dowódców. Jednakże jest jeden problem - może nie dałem rady nauczyć ich zbyt wiele, lecz jedną rzecz jak na złość przejęli ode mnie perfekcyjnie. Są paranoicznie ostrożni. Zbliżenie się nie będzie łatwą rzeczą...ale odpowiednie zespoły uderzeniowe mogłyby w stylu amerykańskich sił specjalnych wlecieć po cichu, zrobić kipisz, złapać wrogiego przywódcę i uciec zanim ktokolwiek zdąży wstać i założyć kapcie. A to wygra wojnę bez wystrzału. A o co chodzi z tą kretyńską nazwą? To już mocno wewnętrzny żart. Tylko jakoś mi kurwa nie do śmiechu."
DGR_agonia_tozsamosci: "Agonia Tożsamości"
DGR_agonia_tozsamosci_desc: "To koniec. Zwycięstwo to jednak ma gorycz porażki. Brakuje mi słów na opisanie tego, w jaki sposób człowiek przybity do muru jest w stanie zmienić się w potwora który gotów jest spalić wszystko dookoła. A jednak, nie myśleniem lecz działaniem to się objawiło. Ludzkość jest skazana na wieczne granie tego samego dramatu przez wieki. Zmieniają się tylko aktorzy i rekwizyty. Ale ten rozdział jest już zakończony. Ktoś musiał być na czele, by móc stawić czoła nadchodzącej ciemności, ktoś musiał być tym który poprowadzi resztę. \n\nKtoś tam musiał stać żeby przyjąć na siebie pełen impet strzały zawiści przeszywającej na wskroś całą ludzką duszę, paraliżującej cały układ nerwowy i docierający aż do mózgu, który przestaje funkcjonować w obliczu tak przygniatającej odpowiedzialności za kraj i przyszłość narodu. Niszcząc wszystko i wszystkich co znałem zastanawiam się jedynie - co pozostanie? I czy ja w ogóle zasługuje na to by istnieć w obliczu czynów które popełniłem. Dla Polski. A może to zawsze było tylko dla samego siebie?\n\nTak oto rozpoczyna się agonia tożsamości."



 ## NARKOM ##
DGR_hour_of_the_wolf_nc: "Godzina Wilka"
DGR_hour_of_the_wolf_nc_desc: "Nadszedł czas zapłaty rewolucjonistów za swoje zbrodnicze czyny wobec rządu. To co zrobiliśmy było okropnie trudną, lecz konieczną decyzją. Reszta nie odważy się powtórzyć takiego zrywu społecznego w obawie przed jeszcze mocniejszym odwetem. Szala przechyliła się na naszą stronę. Ci wszyscy wywrotowcy...oni czekali na odpowiednią chwilę. Starego na chwilę zabrakło i już rzucili mi się do gardła. Niedoczekanie. Ze względu na nieobecność Szweja, i po wprowadzeniu stanu wojennego - będę miał nieograniczoną władzę. I uwierzcie mi, zaprowadzę tutaj porządek."
DGR_bargiela_list_nc: "Lista Bargieły"
DGR_bargiela_list_nc_desc: "Dość. Nie chce mi się nawet myśleć o tym, żeby te siedliska zgnilizny jakim były partie polityczne i organizacje społeczne mogły funkcjonować bez przeszkód. Głównym powodem tej niechęci jest ich całkowite i bezmyślne odklejenie od rzeczywistości. Dodatkowo, to oni odpowiadają za ostatnie strajki i zamieszki swoim agitowaniem. Czy tak było? A czy to musi być koniecznie prawda? Wedle moich obliczeń około 3/4 organizacji społecznych, politycznych i kulturowych przestanie istnieć po następnym dekrecie. Nie będą potrzebne nikomu. Nie będą już siać zamętu i mieszać w głowach ludziom. Nie gdy będzie istnieć lepsza, państwowa alternatywa."
DGR_capital_punishment_nc: "Kara śmierci"
DGR_capital_punishment_nc_desc: "Gdy człowiek jest zbyt pobłażliwy, inni zaczynają to wykorzystywać. Daj palec, będą chcieli całą rękę. A gdy jej nie dostaną to sobie ją odrąbią. Doktryna nadstawiania drugiego policzka wyrządziła absolutnie spustoszenie w umysłach ludzi. Tu trzeba wrócić do najprostszych rozwiązań. Chrześcijańskie miłosierdzie nie może działać gdy dookoła panuje wojna i walczymy o przetrwanie. Oko za oko. Ząb za ząb. Śmierć za zdradę. Ten Hammurabi to jednak był mądry człowiek. I zanim filozofowie się uruchomią że oko za oko sprawia że cały kraj będzie ślepy - nie sprawi jeśli to my będziemy mieli monopol na wizję...\n\nTeraz tylko zdecydować. Gilotyna? Szubienica? Krzesło elektryczne? Pluton egzekucyjny?"
DGR_assembly_ban_nc: "Zakaz zgromadzeń"
DGR_assembly_ban_nc_desc: "Panowie koledzy, tak to już jest, że jak się wprowadza stan wojenny to wprowadza się również zakaz publicznych zgromadzeń. Z wyjątkiem tych sankcjonowanych przez Politbiuro oczywiście. Taka malutka decyzja, a czyści szachownicę ze wszystkich niepożądanych pionków za jednym zamachem. W końcu to sprowadza się do bardzo jasnego prawa; robisz publiczne spotkanie - jesteś wrogiem. Więc jeśli nie jesteś wrogiem - to nie rób spotkań! Proste i logiczne, prawda? Niestety, najgorsze szczury uciekną do podziemi, będą się potajemnie przekradać w cieniach i kanałach. Ale ich też wykurzymy, krok po kroku."
DGR_health_trails: "Ścieżki zdrowia"
DGR_health_trails_desc: "Nadszedł czas, by pokazać co potrafię. Wszelkie szumowiny i zdrajcy zostaną osądzeni za swój sprzeciw przeciwko państwu. Wymyśliłem coś bardzo ciekawego.\n\nŚcieżki zdrowia, coś co za komuny zostało opatentowane przez SB-ków. To będzie idealna kara dla wszystkich antypaństwowych działaczy. Oh, już sobie wyobrażam tych wszystkich biurokratów odbijających się od żołnierzy Inkwizycji, okładanych pałkami raz po raz i błagających o swoje bezcelowe życie.\n\nJuż niedługo całe Zagłębie zostanie postawione do pionu, a wkrótce potem już nikt mi się nie przeciwstawi. Marzenia o narodowej rewolucji nigdy nie były tak blisko jak teraz."
DGR_halt_the_trials: "Zatrzymanie procesów"
DGR_halt_the_trials_desc: "Czy oni myślą, że mają coś do powiedzenia? Kim oni kurwa są, że ośmielają się mówić mi co mam robić?! Fałszywi komuniści. Phi. Stoją jedynie na drodze wszystkie do czego zostałem stworzony. Przysięgam, zapłacą za tę zniewagę krwią.\n\nStary dziad Szwej nie wróci nigdy, a te zdradzieckie aparatczyki zostaną osądzoni i ukarani za swój sprzeciw. To tylko mała przeszkoda, niewielki przestój. Wkrótce, inkwizytorzy przejmą totalną kontrolę nad Zagłębiem.\n\nMoje rządy dopiero się zaczynają, a wizja prawdziwej narodowej Polski zostanie osiągnięta bez względu na cenę."
DGR_suspend_the_martial_law: "Zawieszenie stanu wojennego"
DGR_suspend_the_martial_law_desc: "CO?! JAK?! Nie, nie, nie, to nie jest możliwe. Ta stara menda wstała z łóżka i wróciła silniejsza niż wcześniej! Zawiesił stan wojenny, kończąc cały mój misterny plan jednym dekretem! Inkwizycja nie wie co robić, Politbiuro znowu zaczęło szczekać a ta stara pizda jeszcze się cieszy... To nie tak miało być. Ale nie poddam się bez walki. Szwej, skurwysynu - pożałujesz! Nadal mam posłuch u wojskowych, więc już niedługo zobaczymy kto ma dłuższego. Pierdol się, Szwej!"
DGR_national_disposition_authority_nc: "Narodowy Urząd Dyspozycyjny"
DGR_national_disposition_authority_nc_desc: "Wolny rynek to kpina z ludzi. Jest to ogromny ocean na który wrzuca się ludzi z których większość nie potrafi pływać i liczą na to że gospodarka będzie szła do przodu bo uwolnimy przedsiębiorczość ludzi. Jasne, jedno czego nie uwolnimy to wyzyskiwaczy z więzień gdzie ich wsadzimy za żerowanie na ludziach i ich dobytkach. Gospodarka musi być planowana - z miejscem na improwizację oczywiście, ale główny cel musi być jasno ustalony i wszystko musi działać zgodnie z istniejącem planem. Bo inaczej to państwo nie będzie funkcjonować, każdy będzie robić co mu się żywnie podoba i zapanuje jeden wielki chaos. A na tym korzystają tylko cwaniaczki a nie normalni ludzie. \n\nNarodowy Urząd Dyspozycyjny ma stanowić organ kierujący państwową gospodarką. Oczywiście, sterowanie całą ekonomią to bardziej sterowanie ogromnym statkiem. Nie ma za dużo miejsca na manewrowanie i gwałtowną zmianę kursu. Miejmy tylko nadzieję, że nie czekają na nas żadne góry lodowe po drodze..."
DGR_home_of_the_revolution_nc: "Kolebka rewolucji"
DGR_home_of_the_revolution_nc_desc: "Dąbrowa. Polska ojczyzna rewolucjonistów i ruchu socjalistycznego w tej części kraju. Tu wykształcał się ruch robotniczy oraz rewolucyjny. Walczyliśmy już o wolność za czasów powstania styczniowego a potem pod koniec I wojny czy w czasie II wojny. Kiedy nadszedł pokój, czas nastał na inne rewolucje - dlatego też teraz mamy największe z zakładów przemysłowych w kraju. Ilość pomników komunistycznych znajdujących się na terenie miasta również zawsze przewyższała wszelkie normy. I to z Dąbrowy teraz wychodzi iskra która odmieni oblicze tego kraju na nasz obraz i podobieństwo. Po raz kolejny jesteśmy zwiastunami rewolucji."
DGR_zaglebie_only_city_nc: "Jedyne miasto Zagłębia"
DGR_zaglebie_only_city_nc_desc: "Jakie jest Zagłębie? Ano Dąbrowskie. Prawda. Na co komu w takim razie Sosnowiec? Albo Będzin? Dąbrowa zasługuje na miano największego miasta w Polsce. Poza tym, nie jesteśmy tu od wczoraj. Sięgaliśmy dalej na wschód i zachód. Zagórze, Ksawera, Sławków - to wszystko były tereny należące do Dąbrowy Górniczej. Ale ten etap konsolidacji mamy już za sobą. Ślązacy usilnie chcieli mieć metropolię ale na każdym kroku odmawiali nam równej reprezentacji, rzucając nam ochłapy takie jak uwzględnienie Zagłębia w nazwie. Łaski bez - zrobimy sobie własną metropolię, bez hanysów i bez śląskiego bałaganu."
DGR_urbanisation_effort_tricity_nc: "Wysiłek urbanizacyjny: Trójmiasto"
DGR_urbanisation_effort_tricity_nc_desc: "Słynne Dąbrowskie Trójmiasto - Łosień, Łęka, (Ł)Okradzionów. Ale same nazwy tych miejsc wskazują że nie są one zbytnio rozwinięte. Głównie to tereny nadal wiejskie, z gęstymi lasami i rozległymi polami. Spoko, nie są to jednak zarzuty - wręcz przeciwnie! Jest tam mnóstwo miejsca na stworzenie nowych osiedli. Ludziom z prowincji przyda się trochę ulicznej mądrości i luzu. Bo nasze bloki są zajebiste. No i w końcu musimy zredukować trochę procent Dąbrowy wsiowej bo z wielkim terenem przychodzi wielka odpowiedzialność żeby ten teren zabudować w sposób odpowiedni."
DGR_urbanisation_effort_strzemieszyce_nc: "Wysiłek urbanizacyjny: Strzemieszyce"
DGR_urbanisation_effort_strzemieszyce_nc_desc: "Strzemieszyce to co prawda bardzo niewdzięczna dzielnica, która kilkukrotnie próbowała udawać niepodległe miasto ale historia pokazała wprost, że im się to po prostu nie należy. Strzemieszyce w odróżnieniu od pozostałych dzielnic Dąbrowy zewnętrznej, mają nawet kilka blokowisk. No dobrze - kilka to gruba przesada. To jest parę biednych bloków na krzyż. Ale przynajmniej zaczęli. Przez dzielnicę idzie też główna arteria komunikacyjna na wschód, więc aż się prosi by zacząć tutaj rozbudowę infrastruktury mieszkalnej. A miejsca też nadal jest sporo, chociaż gdzieniegdzie będziemy musieli osuszyć tereny podmokłe. Ale to nigdy nie przeszkodziło w budowaniu wielkiej płyty, prawda?"
DGR_urbanisation_effort_antoniow_nc: "Wysiłek urbanizacyjny: Antoniów i Ujejsce"
DGR_urbanisation_effort_antoniow_nc_desc: "Antoniów, Ujejsce czy Trzebiesławice - im dalej na północ Dąbrowy tym większe to zadupie. Podobnie jak w Polsce ogólnie - na południu cywilizacja i przemysł, a na północy bagno i gówno. Antoniów to w zasadzie część Ząbkowic, ale po tym jak bandyci zrobili sobie z Ząbkowic wielki skłot, ta dzielnica nie nadawała się do zamieszkania zbytnio. Antoniów musimy wydzielić, włączyć do niego osiedle Młodych Hutników i rozbudować. A następnie, iść na północ z budową. W końcu w tym rejonie może powstać kiedyś jakaś wielka inwestycja, która będzie potrzebowała zaplecza w postaci prężnie działających ośrodków mieszkalnych. I miejmy nadzieję - zabudujemy trochę tę biedę."
DGR_expand_zaglebie_palace_of_culture_nc: "Rozbudowa Pałacu Kultury Zagłębia"
DGR_expand_zaglebie_palace_of_culture_nc_desc: "Możecie zapytać, dlaczego w ogóle ktoś chciał zdecydować się na postawienie drugiego Pałacu Kultury w Polsce? Bo co, ten w Warszawie nie wystarczył? Może i wystarczył, ale Aleksander Zawadzki chciał mieć tak samo fajny pałac w swoich rodzinnych stronach. No i go dostał, ale nie jest on taki wysoki...\n\nPrzez lata chodziły plotki, że to przez to że Dąbrowa jest postawiona na terenach pokopalnianych i jakby zbudowali coś tak gigantycznego to całe miasto by się zawaliło. Śmiechu warte, może się jeszcze skorupa ziemska otworzy i nas pochłonie za grzechy? Nie ma się czego bać, tylko rozbudować! Sięgniemy nieba tą wieżą. I Bóg nas za to tym razem nie ukara - bo nie istnieje."
DGR_prepare_niegowiczki_landing_strip_nc: "Przygotowanie lądowiska w Niegowoniczkach"
DGR_prepare_niegowiczki_landing_strip_nc_desc: "Absurd lotniska Katowice-Pyrzowice jest wszechobecny na wielu równoległych płaszczyznach. Nie jest w Katowicach, i nie jest nawet blisko Katowic. Jest bliżej Dąbrowy niż Katowic. Zresztą po cholerę im to lotnisko, skoro mają całkowicie dobrą lokalizację na Muchowcu? Nam też się to nie przyda bo leży bardzo blisko granicy państwa, przez co narażone jest jeszcze bardziej niż zwykle na ataki. No i tutaj na ratunek przychodzi nam niepozorna wieś Niegowoniczki. Co z nią? Ano, znajduje się tuż obok Dąbrowy na wylocie z Łośnia. A teraz najlepsze - już tam nawet istnieje malutkie lądowisko. I za dużo ludzi przesiedlać nie trzeba bo tam może z 10 domów jest. Idealne miejsce na lotnisko."
DGR_expand_voivodeship_road_790_nc: "Rozbudowa drogi wojewódzkiej 790"
DGR_expand_voivodeship_road_790_nc_desc: "Może i droga wojewódzka 790 prowadzi przez Niegowoniczki, ale zbyt dobra to ona nie jest - dwupasmowa, dwukierunkowa, a do samego lądowiska trzeba jechać polnymi dróżkami. Zapewne kojarzycie państwo nowoczesne lotniska, prawda? Co się dookoła nich znajduje? Autostrady, wielkie terminale, ogromne huby komunikacyjno-zaopatrzeniowe. No właśnie, niestety to będzie największym wyzwaniem. Bo trzeba doprowadzić tutaj cywilizację i rozbudować to na styl tego co znajduje się już w Pyrzowicach. Część da się przenieść, część trzeba będzie zbudować od nowa."
DGR_move_pyrzowice_nc: "Przeniesienie lotniska w Pyrzowicach"
DGR_move_pyrzowice_nc_desc: "Nie wiem co jest trudniejsze - przeniesienie fizyczne terminalu (a raczej skopiowanie go używając tylu części ilu się da), czy cała ta pierdolona papierkologia. No tak - przenieśliśmy lotnisko - i co nam zrobicie? A to że świat dalej używa map na których znajduje się port lotniczy Katowice-Pyrzowice to już nie nasza sprawa! I tak tu nikt nie ląduje zza granicy. Jeszcze. Po wojnie będziemy się martwili z urzędami i podaniami - nie mamy czasu na to teraz. Powstał port lotniczy Dąbrowa. I to powinno wszystkich obchodzić. A nie to czy czasem lotnisko na które lecą istnieje czy nie. Po prostu zrobicie pull up i sobie polecicie dalej. Wielki mi problem..."
DGR_restore_the_pyrzowice_airport_land_nc: "Rekultywacja ziemi wokół byłego lotniska"
DGR_restore_the_pyrzowice_airport_land_nc_desc: "Tereny dookoła lotniska...kiedyś należały do mojej rodziny. Rodzice babci od strony ojca posiadali tam duże połacie ziemi. Wszystkim żyło się wspaniale, dopóki oczywiście nie przyszli Niemcy, którzy postawili w 1940 tam lotnisko zapasowe dla Luftwaffe. Ludność oczywiście została wypędzona. Ale gdy po zakończeniu wojny ludzie próbowali tam wrócić...Sowieci ich wypędzili po raz drugi. Bo szkoda nie wykorzystać już istniejącego lotniska. A po Sowietach, Wojsko Polskie weszło i zrobiło tam lotnisko wojskowe. Teraz, po prawie stu latach naprawiamy ten historyczny błąd. W końcu...ojcowizna wraca w ręce ludu. Będę sobie musiał postawić tam dom."
DGR_pogoria_naval_commissariat_nc: "Komisariat Marynarki Wojennej Pogoria"
DGR_pogoria_naval_commissariat_nc_desc: "Doświadczenie to my w pływaniu mimo wszystko mamy. Pogoria może i nie jest zbyt dobrym miejscem na centrum marynarki bo nie dopłyniemy tam większymi statkami. Ale możemy tam postawić centrum oficerskie dla floty wojennej, no i żeglarsko też można się tam dokształcać. Nie będzie to idealne, ale jako zaplecze dla naszych kadr które będą swoje pierwsze kroki stawiały w marynarce wojennej sprawdzi się idealnie. W końcu nie ma co wysyłać ich od razu na głęboką wodę. Bo może i jeziora mamy, lubimy i po nich pływamy to nie jesteśmy morskim krajem, nie mówimy do siebie \"Ahoj\". Dlatego zaczniemy od Pogorii, a skończymy na Bałtyku. Tylko nie od razu."
DGR_tourist_heaven_in_pieklo_nc: "Turystyczny raj w Piekle"
DGR_tourist_heaven_in_pieklo_nc_desc: "Piekło jak sama nazwa wskazuje jest idealnym miejscem na wypoczynek. I to nie jest nawet ironiczne stwierdzenie bo kolonia Piekło znajduje się na niewielkim pasie ziemi umieszczonym pomiędzy dwoma najpopularniejszymi zbiornikami wodnymi w Zagłębiu - Pogorią III i Pogorią IV. Już teraz są tam plaże, kluby jachtowe, restauracje, domki na wynajem. Ale wiecie czego tam brakuje? Rozmachu. Wielkie, ludowe kurorty jak w Złotych Piaskach w Bułgarii. Ale nie te prywaciarskie molochy od Gołębiewskiego, lecz komunalne osiągnięcia socrealizmu. Cisza, spokój, woda, obok lasy, blisko do miasta, a jak się obrócisz to nawet widać Hutę Katowice!"
DGR_edward_gierek_university_nc: "Uniwersytet im. Edwarda Gierka"
DGR_edward_gierek_university_nc_desc: "Jak już wszystko nazywamy imieniem Gierka to warto byłoby pozbyć się tego prywaciarskiego wynaturzenia jakim jest Wyższa Szkoła Biznesu. W końcu nawet sama nazwa wskazuje na reakcyjną burżuazję. Biznes. Bo tylko to dla was się liczy, mamona i szmal. Uniwersytet to miejsce na inspiracje, na wymianę idei, na krzewienie idei! Dąbrowa potrzebuje prawdziwej ludowej uczelni. Takiej na której nie będą uczyć pseudoprofesorowie próbujący wcisnąć młodzieży herezje Balcerowiczowskie, ale takie które pokażą im jak może działać państwo dowodzone przez kogoś z planem, gdzie nie zostawia się rzeczy w próżni na pożarcie przez chaos rynkowy lecz działa z determinacją by wszelkie siły natury nagiąć do własnych potrzeb. To jest właśnie socjalistyczny imperatyw. I tego musimy uczyć."
DGR_great_wall_of_brynica_nc: "Wielki Mur na Brynicy"
DGR_great_wall_of_brynica_nc_desc: "Musimy zbudować mur. I sprawimy że Śląsk za niego zapłaci. Ale żarty żartami, naprawdę to zrobimy. Brynica od zawsze była murem który oddzielał ludową cywilizację Zagłębiowską od ciemnych hord Ślązaków. Największym oczywiście problemem jest to że z okien sosnowieckich bloków na najwyższych piętrach widać Katowice. I to nie jest prawda, że najlepsze co Cię może spotkać w Sosnowcu to autobus do Katowic. Najlepszym jest to, że nie będziesz musiał do tych Katowic jechać bo u nas jest lepiej. I w drugą stronę to nie może zadziałać - nie możemy wpuścić tutaj ani jednego Ślązaka. Przyjdzie czas by im pokazać kto rządzi tym krajem, ale póki co w razie zdradzieckiego ataku na serce Zagłębia musimy być ufortyfikowani by móc odeprzeć ich ataki. Bo to już by było zbyt blisko Dąbrowy."
DGR_peoples_medical_center_nc: "Ludowe Centrum Medyczne"
DGR_peoples_medical_center_nc_desc: "Służba zdrowia w Dąbrowie zawsze miała okropną renomę. Przychodnie odstraszały ludzi personelem i brakiem znieczulenia, SOR był zwany umieralnią, główny szpital był wiecznie niedofinansowany, a placówka na Hucie była podróżą do lat 50 ubiegłego wieku. Trochę lepiej sytuacja miała się w sąsiednim Sosnowcu, ale tak po prawdzie - nie był to idealny stan. To się musi zmienić, nawet jeżeli będziemy musieli wypieprzyć wszystkich lekarzy i znaleźć nowych. Szpital Wojewódzki na granicy Sosnowca i Będzina jest już pokaźnym budynkiem i tam też powinniśmy wpompować wszelkie możliwe środki by chociaż ten jeden szpital był czymś czym możemy się poszczycić."
DGR_our_own_pentagon_nc: "Nasz własny Pentagon"
DGR_our_own_pentagon_nc_desc: "Nasza armia pilnie potrzebuje centrum dowodzenia z prawdziwego zdarzenia. Takiego Pentagonu. Miejsca gdzie sztab będzie mógł się spotykać bez ryzyka że ścianę obok obraduje Komisja do Spraw Mierzenia Średnicy Patelni. Tak po prawdzie, to jest główny powód - żeby uciec jak najdalej od politbiura. W sumie...nie musimy uciekać aż tak daleko. Skoro chcemy własny Pentagon, tak się świetnie składa że jest budynek który bardzo go przypomina. I jest on tuż obok głównego centrum rządowego. Techniczne Zakłady Naukowe. Uczniów przenieść można do innego technikum, sam budynek rozbudować, umocnić i proszę bardzo - jest i sztab!\n\nI tak kurwa, wiem że TZN to heksagon. Chodzi o przykład, ja pierdolę."
DGR_remove_bien_forest_nc: "Wykarczuj las Bienia"
DGR_remove_bien_forest_nc_desc: "Problem z rozwojem przemysłu jest taki że potrzebuje on coraz więcej miejsca. I o ile zazwyczaj mamy go, w obecnych planach sytuacja robi się trochę...krępująco ciasna. Między Tucznawą a Hutą Katowice, tam gdzie planujemy naszą ekspansję, stoi sobie Las Bienia. Ekologowie będą krzyczeć, ktoś tam przywiąże się do drzewa, trochę popłaczą i ich wywieziemy. Będzie drewna dużo na opał, i miejsce się znajdzie. Bo przecież, nie będziemy się rozczulać nad jednym lasem? Dziki i tak włażą pod bloki, nie potrzebują do tego lasów. A tych przecież macie jeszcze trochę, pojedźcie sobie poza miasto i macie a nie oczekujecie żeby w cywilizowanym centrum była dzicz..."
DGR_expand_tucznawa_zone_nc: "Rozbudowa strefy w Tucznawie"
DGR_expand_tucznawa_zone_nc_desc: "Skoro już usunęliśmy największą przeszkodę czyli ograniczenia przestrzenne - możemy zabrać się za rozszerzanie strefy przemysłowej na Tucznawie. I niektórzy powiedzą - ona jest już napompowana przez nas do granic możliwości i tak. A ja powiem - i tak nadal znajdują się lojalni przedsiębiorcy którzy chcą rozszerzać możliwości ludu pracującego. I zgłaszają się do nas o możliwość prowadzenia zakładów. I my im to umożliwimy. Bo możemy - i powinniśmy dbać o lud pracujący, prawda?\n\nTo skoro tak, to do roboty - zbudujmy jeszcze troszkę fabryk. "
DGR_expand_przyjazn_coke_plant_nc: "Rozbudowa Koksowni Przyjaźń"
DGR_expand_przyjazn_coke_plant_nc_desc: "Nadal ta nazwa do mnie nie przemawia po tylu latach. Ale już niech zostanie bo ludzie się nie zorientują co tak naprawdę tam stoi. A Politbiuro i tak sobie interpretuje że to chodzi o przyjaźń klasy robotniczej i wiejskiej, Polski i Związku Radzieckiego czy kurwa kobiety i mężczyzny. To jest nieważne. Ważne jest to że jak już ją odremontowaliśmy to warto ją uczynić największą koksownią w Polsce.\n\nBo do tej pory była na drugim miejscu. A tak nie może być. Skoro huta jest największa to i koksownia ma być! I przestańcie ją nazywać kokosownią, to jest poważny zakład do cholery!"
DGR_tucznawa_tworzen_strzemieszyce_triangle_nc: "Przemysłowy trójkąt Tucznawa-Tworzeń-Strzemieszyce"
DGR_tucznawa_tworzen_strzemieszyce_triangle_nc_desc: "Bardzo duża część połacia Dąbrowy jest usypana terenami przemysłowymi. Bardzo dużą część dodatkowo zabudowaliśmy nowymi zakładami. Na tyle, że w niektórych obszarach zaczęły się wytwarzać punkty stykowe pomiędzy trzema dzielnicami przemysłowymi. Zabudujmy już do końca ten trójkąt ziemi, i będziemy mieli ogromną superdzielnicę wytwarzającą taką ilość dóbr dla ludu że będziemy zakrawać o autarkię.\n\nI doprowadźmy w końcu tam porządną jezdnię a nie to dwupasmowe gówno. I tak tu już nikt nie zamieszka a przynajmniej skomunikujemy te tereny ze sobą."
DGR_industrial_powerhouse_nc: "Przemysłowa potęga"
DGR_industrial_powerhouse_nc_desc: "Całe państwo staje się przemysłową potęgą ale to nie oznacza że Dąbrowa musi ustąpić pola komuś w tym wyścigu. Wręcz przeciwnie - to my musimy pokazać jak się to robi, być pionierami odbudowy i przecierać szlaki tam gdzie reszta ludu jeszcze nie dotarła. Robić rzeczy więcej, bardziej, lepiej, mocniej. Mierzyć wyżej i dalej niż ktokolwiek inny bo nikt nie jest nas w stanie powstrzymać jeśli stoi za nami idea i żelazna wola.\n\nMiejsca jeszcze trochę zostało. "
DGR_powering_the_steelworks_nc: "Zasilanie Huty"
DGR_powering_the_steelworks_nc_desc: "Reindustrializacja na masową skalę wymaga energii. I wskaźnik zapotrzebowania niestety nieubłaganie rośnie. O ile jesteśmy w stanie doprowadzać energię z Łagiszy i Jaworzna, to połączenie jest ryzykowne. Jeśli odcięto by te tereny - cała strefa przemysłowa przestanie funkcjonować. Taki kolos jak Huta Katowice musi mieć swoje własne źródło zasilania. Ze względów redundancji, no i efektywności. A potem, jeśli damy radę, rozszerzymy moc na całą strefę. O ile nam starczy miejsca."
DGR_all_railroads_lead_to_slawkow_nc: "Wszystkie tory prowadzą do Sławkowa"
DGR_all_railroads_lead_to_slawkow_nc_desc: "Tak jak nie cierpię tych rebelianckich szumowin, tak trzeba przyznać że Sławków posiada ogromny atut w postaci gigantycznego terminala przeładunkowego. Nie sposób patrzeć na to z podziwem. Oczywiście oni nazywali to \"Euroterminalem\", ale ta nazwa nie jest odpowiednia dla czegoś co ma stanowić logistyczną perłę regionu. Nad tym jeszcze popracujemy, ale problem terminalu jest taki że o ile wszystkie koleje do niego prowadzą, tak możemy trochę popracować na innych frontach żeby uczynić ten kompleks jeszcze efektywniejszym.\n\nBo co jeśli zrobimy go jeszcze kurwa większym?"
DGR_14th_fuel_base_in_strzemieszyce: "14 Baza Paliwowa w Strzemieszycach"
DGR_14th_fuel_base_in_strzemieszyce_desc: "Ta baza paliwowa już istnieje ale od czasów wojen osiedlowych stała tak na wpół działająca. Potem funkcjonowała jako zaplecze logistyczne ale nigdy nie była tak wykorzystywana skutecznie jak mogłaby być. A na to jest zawsze proste rozwiązanie. Musimy ją powiększyć co najmniej dwukrotnie. Większe znaczy lepsze, a im więcej paliwa tym więcej możliwości zaopatrywania. A wszyscy wiedzą, że wraz z postępem i rozwojem przemysłu przychodzi więcej pojazdów, a każdy z nich potrzebuje paliwa. Nie wspominając już o naszej armii. Oj, żeby zasilić nowe zabawki trzeba będzie w nie trochę wpompować."
DGR_expand_boleslaw_mining_and_metal_plants_nc: "Rozbudowa Zakładów Górniczo-Hutniczych Bolesław"
DGR_expand_boleslaw_mining_and_metal_plants_nc_desc: "Kiedyś Polska była bardzo zróżnicowana pod względem wydobycia. Węgiel, ropa, gaz, cynk, aluminium, żelazo, miedź, sól, bursztyn, srebro, złoto, uran. I to wszystko przepadło w czasie, jak łzy w deszczu. Pozostały nam ochłapy. W Bolesławiu mamy Zakłady Górnicze-Hutnicze produkujące cynk. Jedyny w Polsce zakład który produkuje cynk. A jak coś jest jedyne w Polsce to trzeba na to chuchać i dmuchać.\n\nJeszcze wrócimy do tych czasów. Ale póki co wykonajmy chociaż jeden krok i zachowajmy nasz polski cynk. A i same zakłady dostarczą nam sporo radości w zakresie maszyn, zarówno cywilnych jak i wojskowych."
DGR_national_mechatronics_plant_nc: "Narodowe Zakłady Mechatroniczne"
DGR_national_mechatronics_plant_nc_desc: "To że mamy przemysł to jeszcze fajnie jakby odpowiadał on wymaganiom współczesnego świata. Zakłady produkujące roboty, układy scalone czy części do wielkich maszyn autonomicznych to przyszłość. Ale problem polega na tym że jest to fajne hasełko rzucone na wiecu politycznym, a nie konkretna zapowiedź tego co nadejdzie. Bo skomplikowanie obecnej technologii jest na tyle duże że albo będziesz miał mnóstwo różnych linii produkcyjnych, albo wiele zakładów które specjalizują się w jednym. Będziemy potrzebowali i tego i tego żeby nadrobić stracony czas który mogliśmy wykorzystać na postęp i badania.\n\nAle to zaprocentuje w przyszłości. Bo ta już tuż tuż."
DGR_the_only_dabrowa_nc: "Jedyna Dąbrowa która się liczy"
DGR_the_only_dabrowa_nc_desc: "Jest wiele Dąbrów w Polsce. Dąbrowa Tarnowska, Dąbrowa Zielona, Dąbrowa Białostocka, czy dosłownie kilkaset zwykłych Dąbrów i Dąbrówek w postaci małych wsi.\n\nAle tylko jedna jest tak wspaniała jak nasza. Tylko jedna posiada obywateli którzy skorzy są do osiągania najwyższych celów. Tylko jedna jest wyraźnie lepsza od pozostałych. Od dzisiaj, gdy ludzie będą mówili Dąbrowa to \"Górnicza\" będzie od razu w domyśle. Tak jak robią to od zawsze obywatele Dąbrowy. Z czasem, po prostu będziemy po prostu Dąbrową.\n\nI wszyscy zapomną o każdej innej. Albo im po prostu każemy zmienić nazwy i zdelegalizujemy inne Dąbrowy?"
DGR_national_science_department_nc: "Narodowy Wydział Nauki"
DGR_national_science_department_nc_desc: "Naukowcy są niezbędni do długofalowego rozwoju każdego państwa, a co za tym idzie, wymagają szerokiego finansowania ze strony państwa. To prosty fakt. Intelektualiści bardzo lubią, gdy ktoś im o tym przypomina. Nie podoba im się natomiast równie prosty wniosek, który z tego wynika: ten, kto płaci, ten wymaga. W ich idealnym świecie chcieliby wyssać budżet na badania i rozwój do ostatniego grosza, mając jednocześnie pełną swobodę prowadzenia badań, które interesują wyłącznie ich samych i ich kolegów. Niedoczekanie. Otrzymają finansowanie dopiero wtedy, gdy udowodnią, że ich projekt badawczy jest wartościowy z punktu widzenia państwa. I oczywiście ich działalność będzie stale monitorowana."
DGR_party_institute_of_social_sciences_nc: "Partyjny Instytut Nauk Społecznych"
DGR_party_institute_of_social_sciences_nc_desc: "Nie twierdzę przecież, że potrzebujemy na uniwersytetach jakichś szczegółowych wydziałów ideologicznych. Nasz cel powinien być jasno widoczny i łatwo odczuwalny przez wszystkich członków narodu. Powinien być wyrażany poprzez zdecydowane działania przywódcy, a nie przez rozwlekłą rozprawę naukową. Nie zrozumcie mnie źle, nadzór nad humanistami jest konieczny w każdym szanującym się państwie. To właśnie ta grupa najprawdopodobniej próbowałaby podważyć obecny ustrój, i nie zawsze z dobrych powodów. Liczy się kontrola, a nie treść programu nauczania. Czy ma to cokolwiek wspólnego z prawdziwą nauką? Nie, ale przecież kierunki takie jak europeistyka czy studia gender również nie miały z nią wiele wspólnego kiedy to nauki humanistyczne rzekomo cieszyły się pełną swobodą."
DGR_incorporate_faculty_of_nature_science_nc: "Inkorporacja Wydziału Nauk Przyrodniczych"
DGR_incorporate_faculty_of_nature_science_nc_desc: "Filia Uniwersytetu Śląskiego w Sosnowcu. Czy muszę mówić coś więcej? Przez dziesięciolecia Uniwersytet z Katowic rozwijał tę placówkę z myślą o rozwoju nauk przyrodniczych. Ale dlaczego cokolwiek śląskiego miałoby mieć coś wspólnego z zagłębiowskim miastem? Czas naprawić ten błąd, oddzielając słynny \"Razor\", aby pomóc Zagłębiu stanąć na własnych nogach, jeśli chodzi o naukę. Oczywiście pojedynczy wydział nie będzie w stanie funkcjonować samodzielnie, dlatego zostanie zintegrowany z rozwijaną przez nas zagłębiowską infrastrukturą. Poza tym taka restrukturyzacja pozwoli nam dokładniej przyjrzeć się jego kadrom i organizacji."
DGR_central_supercomputer_xenon_nc: "Centralny Superkomputer 'Xenon'"
DGR_central_supercomputer_xenon_nc_desc: "Przywódca potrzebuje niezawodnego i bezwzględnego posłuszeństwa. Potrzebuje również gromadzić istne morze danych, aby odpowiednio organizować gospodarkę, wojsko i naukę. Czy jest na to lepszy sposób niż wykorzystanie superkomputera, w którym miedziane przewody dominują nad neuronami i nerwami? Cóż, prawdę mówiąc, neurony i nerwy są znacznie łatwiej dostępne, ale nie powinno nas to powstrzymać. To prawda, że nie mamy ani wiedzy, ani materiałów, ani nawet planu, ale każdy wielki projekt można rozłożyć na mniejsze elementy. Uznając tę prawdę, połączymy ze sobą możliwie wiele mniej zaawansowanych komputerów, aby skonstruować jedną maszynę o wystarczającej mocy obliczeniowej, by pomieścić sztuczną superinteligencję."
DGR_economic_maneuver_nc: "Manewr gospodarczy"
DGR_economic_maneuver_nc_desc: "Nie da się ukryć że gospodarka została doprowadzona na skraj...upadku. I oczywiście jak zwykle to wszystko wina ludzi którym wydaje się że są oni wspaniałymi mecenasami ekonomii i pozjadali wszystkie zmysły podczas gdy jedyne co pochłonęli to streszczenie \"Kapitału\" Karola Marksa nie rozumiejąc przy tym ani jednego słowa. I tak oto doprowadzili rynek nieruchomości do załamania, kolektywizacją dobili rolnictwo, a w miejscu gdzie kiedyś były fabryki i miały one powstać na nowo - są jedynie rozkopane doły i szkielety budowli.\n\nCo gorsza, Politbiuro ogłosiło manewr gospodarczy w celu zatrzymania postępującej tragedii. Nie ufam im na tyle, żeby wiedzieć że to po pierwsze nie oznacza nic dobrego dla kraju, a po drugie w żaden sposób nie przyczyni się do wzmocnienia wysiłków wojska. Będą sobie budować nikomu nie potrzebne fabryki kapeluszy słomianych a wojsko dalej będzie niedofinansowane i zbrojeniówka będzie leżeć i kwiczeć. Niech to wszystko już pierdolnie, błagam."
DGR_central_housing_allocation_council: "Centralna Rada do spraw Przydziału Mieszkań"
DGR_central_housing_allocation_council_desc: "No cóż, zbiurokratyzowanie przydziału mieszkań zdaje się być wspaniałym partyjnym pomysłem! Eh, tak na serio to nie. Uważam, że to wojsko powinno odpowiadać za takie działania, ale no...przynajmniej podchodzą do sprawy równościowo.\n\nKażdy będzie miał równą szansę na dostanie mieszkania, a ich dystrybucja z pewnością sprawi, że żaden developer nie położy już swoich łapsk na monopolu rynkowym nieruchomości. To wydaje się być dobrym pomysłem - ale nie jest moje, więc nie jestem pewien.\n\nTak czy siak, mam nadzieję że ich algorytm okaże się porażką i ludzie zorientują się że ci zdrajcy nie mają żadnych predyspozycji do rządzenia krajem."
DGR_housing_complaints_and_grievances_office: "Biuro do spraw skarg i zażaleń domowników"
DGR_housing_complaints_and_grievances_office_desc: "Biuro zażaleń domowników? Co za kurwa kretynizm. Co teraz? Będziemy wysłuchiwać jakichś starych Krysiek że kot sąsiadki nasrał jej na wycieraczkę? Albo Pan Andrzej ma problemy z plecami i w ogóle to chce windę w bloku.\n\nDlaczego mamy poświęcać nasz czas tym ludziom? Kogo obchodzi co oni myślą? Musimy skonsolidować wszystkie zasoby na nasze wojsko a nie na wysłuchiwanie błachych problemików.\n\nTak długo jak Szwej i jego politbiuro trzyma władzę, sen o zjednoczonej Polsce jest stracony. Liczę na to, że ludzie niedługo się obudzą i dadzą mi szansę spełnienia marzeń o narodowej rewolucji."
DGR_reinforce_the_reindustrialization_effort_nc: "Wzmożony wysiłek reindustrializacyjny"
DGR_reinforce_the_reindustrialization_effort_nc_desc: "Mam nadzieję, że już wspominałem jak bardzo gardzę Balcerowiczem i jego kohortami liberałów którzy sprzedali nasz kraj za grosze? I gówno prawda że świat się zmienia i musieliśmy wejść w rynek usług. Potężne kraje nie rezygnują ze swojego przemysłu całkowicie tylko dlatego że ktoś uznał że to jest już niewspółczesne i musimy się przebranżowić. Staliśmy się śmietniskiem gospodarczym Europy w zamian za ochłapy z dotacji.\nProces reindustrializacji jaki podejmujemy jest słuszny, tylko musimy go do końca dociągnąć! Brakuje nam póki co głównie woli politycznej i szybkich decyzji by móc odbudowywać więcej fabryk! Dlatego musimy przekazać więcej środków na ten cel bo jest on gwarantem naszego dobrobytu, i tylko w ten sposób będziemy mogli pokazać reszcie świata że era industrialna nadal trwa i w dupie mamy wasze Excele!"
DGR_grants_for_heavy_industry: "Dotacje na przemysł ciężki"
DGR_grants_for_heavy_industry_desc: "Cóż, uch, prawda. Inwestujemy w ciężki przemysł. Normalnie powiedziałbym że w sumie to się cieszę z tego...ale inwestujemy w przemysł cywilny. Zapomnieli jak zwykle o wojsku? Co ten Szwej sobie w ogóle wyobraża?\n\nWiara w to, że rozbudowa cywilnego przemysłu i rozdawnictwo zaprowadzi nas do zwycięstwa jest jedną wielką mrzonką. Nie spodziewałem się że Szwej może być aż takim naiwniakiem. Siła Dąbrowy zawsze leżała w jej wojsku. Nie mogę patrzeć jak reakcjoniści i rewizjoniści odrzucają nasze pierwotne ideały.\n\nCóż, dla Zagłębia to nie jest dobra wiadomośc, ale całkiem dobra dla mnie. Kolejna okazja by przejąć władzę chyba właśnie się rodzi, bo z pewnością ten pomysł nie wypali. Na pewno."
DGR_restitution_of_family_farms_nc: "Przywrócenie prywatnych gospodarstw"
DGR_restitution_of_family_farms_nc_desc: "Rozwalenie młotem całego systemu rolniczego oczywiście musiało się tak skończyć. Od czasów starożytnych jak wkurwiłeś chłopów to miałeś problemy. I tak właśnie próbowano wprowadzić przymusową kolektywizację, jak gdyby nie nauczyli się na błędach w ostatnim stuleciu. Ale trzeba wybaczyć Politbiuru, wszak oni są tak zacofani że są dopiero na etapie rewolucji październikowej i myślą że Lenin zaraz przyjedzie w Pendolino do Sosnowca. Nie przyjedzie, bo tam nie staje. \n\nMusimy teraz wycofywać się z tych źle podjętych kroków i przywrócić częściowo przynajmniej póki co prywatne gospodarstwa rolne, oddać ziemie i pozwolić ludziom żeby nią na powrót zarządzali. Bo inaczej to byłoby bardzo śmieszne gdyby komunistyczny rząd został obalony przez bunt chłopski. Aż mnie trochę kusi żeby to zobaczyć...ale cóż. Trzeba wrócić do starego modelu a nowy wprowadzać powoli. Bo inaczej wszyscy umrzemy z głodu."
DGR_inspection_for_hygiene_and_crop_quality: "Inspekcja Higieny i Jakości Plonów"
DGR_inspection_for_hygiene_and_crop_quality_desc: "Inspekcje jakości plonów? Higiena rolnictwa? Kogo to kurwa obchodzi? Jestem prawie pewien, że oni tam w tym Politbiurze już całkowicie postradali zmysły. Nadzorowanie wielkości ziemniaka? Mierzenie kartofla? To jest to co jest ważniejsze niż zasoby dla wojska?\n\nPartia chce przekonać rolników żeby zmieniali swoje mieszanki nawozów jeśli nie zgadzają się one z nowymi regulacjami rządowymi. Nie mam pojęcia jak to może służyć naszemu państwu. Plony to plony, i mamy ich wystarczająco dużo. Nie widzę na ulicach głodujących ludzi. Więc o co chodzi? Tak jak mówiłem, zwariowali. Nie ma innego wytłumaczenia."
DGR_special_commission_for_combating_sabotage_nc: "Specjalna Komisja do spraw Zwalczania Sabotażu Przemysłowego"
DGR_special_commission_for_combating_sabotage_nc_desc: "Sabotaż gospodarczy to nie tylko ludzie którzy przychodzą pod zakład i go podpalają. To także ludzie którzy nie wykonują swojej pracy odpowiednio, albo sekretarze firm którzy nie hołdują standardom politycznym naszego państwa. To każda osoba która świadomie stwierdzi że nie wykona planu gospodarczego, albo zignoruje prośby o przyłożenie się do swojej pracy. Każdy kto swoją ignorancją albo głupotą narazi zakład na straty - przyczynia się do sabotażu państwa. I czy się stoi czy się leży - tutaj wpierdol się należy.\n\nDlatego powołujemy specjalną komisję do zwalczania przejawów takiego sabotażu, która będzie miała praktycznie wolną rękę jeśli chodzi o egzekwowanie dyscypliny antysabotażowej wśród zakładów przemysłowych. Niezapowiedziane kontrole, inwigilacje, prowokacje - wszystko co osiągnie cel. A celem jest praca profesjonalna i rzetelna bez miejsca na miałkość i pazerność - wszyscy pracujemy dla dobra wspólnego. W każdym centrum przemysłowym postawimy kilku specjalnych komisarzy z możliwością operacyjną. W ten sposób bardzo szybko rozprzestrzenimy poczucie dyscypliny pośród wszystkich bumelantów."
DGR_war_enrichment_extraordinary_tax: "Nadzwyczajny podatek od wzbogacenia wojennego"
DGR_war_enrichment_extraordinary_tax_desc: "Jak wojsko może odpowiednio funkcjonować skoro nie dostaje swojej części łupów? Opodatkowanie, rejestry, kto to kurwa wymyślił? Przez długie lata nikomu to nie przeszkadzało i nagle zmieniają całą narrację próbując wszystkim wmówić że wojsko jest reakcjonistyczne? Pierdolenie!\n\nWszyscy dobrze wiedzą że żołnierze, oficerzy i generałowie zasługują na niewielkie nagrody za ich trud. Doprawdy, szukanie nowych sposobów na zbiurokratyzowanie wszystkiego jest kretyńskie. Ale, cóż. To jest to co aparatczycy potrafią najlepiej. Wkrótce, dzięki temu cała armia będzie po mojej stronie i zgodna z moją wizją."
DGR_viii_five_year_plan: "VIII Plan Pięcioletni"
DGR_viii_five_year_plan_desc: "Plany gospodarcze mogą być w teorii spoko, ale w praktyce to jeden wielki ból dupy. Zamiast chaotycznego inwestowania w cokolwiek przyniesie światowa ekonomia i te wszystkie teorie o popycie i podaży, my wprowadzamy swój własny chaos pod przykrywką świetnie zaplanowanego przedsięwzięcia. Kapitaliści się z nas śmieją bo, oczywiście, nie możesz tak sobie zdecydować w którym roku będzie rozwijał jakie sektory gospodarki. Znaczy ja mówię że można, ale co ja tam wiem - w końcu już to zrobiliśmy. I nadal mam w piździe austriaków i ich zasraną szkołę gospodarki. Jebać ich. Wiemy co zrobiliśmy źle i nadal wiemy czego ludzie oczekują. Będziemy trzymać ster by wypełnić ósmą pięciolatkę w historii istnienia Polski. Siódma była troszkę mniej efektywna niż byśmy tego chcieli. Ale to przez wojnę, gdyby nie ona - już byśmy byli bogaci."
DGR_price_yield_operation: "Operacja cenowo-dochodowa"
DGR_price_yield_operation_desc: "Nigdy się małpy nie nauczą, prawda? Drastyczne podwyżki cen podstawowych dóbr zawsze będzie skutkowało zbiednieniem sporej części populacji. Wyrównanie płac jest zawsze mniejsze niż owe podwyżki, więc jedyne co robią to strzelają sobie tym w stopę.\n\nKtóż mógłby się tego domyślić...pieprzeni biurokraci. Ich działania skierowane przeciwko ludziom wkrótce powinny dać mi szanse na uderzenie. Ludzie widzą jak kretyńskie decyzje podejmuje rząd i staną po mojej stronie. Wkrótce, półki w sklepach opustoszeją, nastanie głód, protesty w każdym większym mieście... o tak, wszystko idzie zgodnie z planem."
DGR_apply_for_foreign_credits: "Aplikuj o zagraniczne kredyty"
DGR_apply_for_foreign_credits_desc: "Szwej i jego kretyni stwierdzili że całkowicie podążą śladami Gierka. Będą aplikowali o międzynarodowe pożyczki. Jakby to miało nam przynieść coś dobrego. Nie tylko osłabi to naszą gospodarkę, ale jakby nie pamiętali - to była jedna z głównych polityk która przyczyniła się do upadku komunzimu w Polsce.\n\nZaczynam wierzyć, że to oni tak naprawdę są bandą rewizjonistów próbujących zniszczyć wszystko co udało mi się zbudować w Dąbrowie. Wszystko budują na kredyt, dobre sobie. A kto to będzie spłacał? My, wojsko? Już nie wspomnę nawet o tym że kapitaliści nawet nie kiwną palcem by nam pomóc. To wszystko jedna wielka zdrada, mówię wam."
DGR_state_crop_purchase_price_list: "Państwowy cennik skupu plonów"
DGR_state_crop_purchase_price_list_desc: "Po co ja tam byłem w ogóle? To mógłby być mail. Zamiast tego musiałem siedzieć na komisji ekonomicznej która debatowała o ustalenie i zamrożeniu cen na skup plonów przez państwo celem zapobiegnięcia deregulacji rynku żywnościowego...jak gdybym miał pojęcie czym się różni kalarepa od rzepy. Albo kapusta pekińska od kapusty włoskiej. Bób, hummus, włoszczyzna, tego typu rzeczy.\n\nNo tak, państwo kupuje rzeczy od rolników i dereguluje to całą gospodarkę rolną gdybyśmy ją pozostawili na pastwę wolnego rynku. Dlatego tak, słuszne jest ustalenie cen maksymalnych na dane produkty żeby nie wyjść na tym źle i było dobrze dla obu stron. Super, możemy wrócić do ważniejszych rzeczy?"
DGR_food_industry_innovations: "Innowacje w przemyśle spożywczym"
DGR_food_industry_innovations_desc: "Ja nigdy nie zrozumiem dlaczego rolnicy tak uparcie trzymają się swojego podejścia że muszą zasiać mnóstwo badziewia żeby potem połowa uschła a druga połowa zgniła, i tak w kółko. A potem będa narzekać że pogoda była zła, ziemia niedobra, i wszystko niedobre i wina państwa. To weźcie kurwa jeden z drugim zróbcie taką genetycznie odporną fasolę i kartofla, który będzie odporny na wszelkiego rodzaju wahania atmosferyczno-glebowe i róbcie jakościowo a nie ilościowo! I nie mówię tu o chemikaliach tylko o faktycznych modyfikacjach genetycznych. Przecież to nie zmienia nic w składzie a będzie po prostu lepsze. \n\nŻołnierz wam to musi mówić?"
DGR_internal_export_company: "Przedsiębiorstwo Eksportu Wewnętrznego"
DGR_internal_export_company_desc: "Partia chce przywrócić Pewexy. W obliczu nieuchronnego, ogromnego konfliktu, oni decydują że zaopatrzenie obywateli w dobra luksusowe jest świetnym pomysłem. No nie wiem, brzmi to trochę zdradziecko. Po co nam towary ze zgniłego zachodu skoro ludzie mają tu wszystko czego potrzebują?\n\nNieodpowiedzialne decyzje jedynie przyniosą nam chaos i zniweczą nasze szanse na pokonanie zdrajców państwa. Pewexy były reakcjonistycznym i rewizjonistycznym pomysłem starych komuchów. Dlaczego powtarzamy ich błędy, które przyniosą naszemu kraju zgubę? Nie cierpię tego, że nawet nie mogę nic z tym zrobić!"
DGR_high_speed_state_rail_lines: "Państwowe koleje dużych prędkości"
DGR_high_speed_state_rail_lines_desc: "Czy marzyliście kiedyś o tym żeby nad morze dojechać w trzy godziny a nie dziesięć? Oh, gdyby nasze wojska tak potrafiły tylko to ta wojna byłaby już skończona. Ty...w sumie, to jest myśl. Wsadzić żołnierzy do superszybkiego pociągu i puścić po prostu w świat. Nie no chwila, to głupie. Wystarczyłby jeden kretyn który wysadziłby tory i cały pociąg leci w cholerę.\n\nCzyli jednak tylko dla cywilów ten projekt? Szkoda. Ale nadal moglibyśmy tam transportować żołnierzy i sprzęt do hubów zaopatrzeniowych na zapleczu frontu, prawda? No bo gdzie ludzie będą teraz jeździć? Poza tym to trzeba nowe tory położyć, a z czego niby chcecie zrobić super szybkie lokomotywy? NEWAG nie umie, PESA to badziewie a Fablok to co najwyżej nam parowóz zrobi.\n\nCóż, trzeba będzie znowu przerobić EN57...i tak, mikole będą jęczeć ale jebać ich. Nie cierpię fanatyków pociągów"
DGR_revival_of_automotive_industry: "Odrodzenie przemysłu motoryzacyjnego"
DGR_revival_of_automotive_industry_desc: "Wydawało mi się, że stworzenie naszej własnej marki motoryzacyjnej dla obywateli nie będzie aż takim złym pomysłem. No a jednak jest. Jesteśmy w stanie wojny i zamiast inwestować w wojsko im się marzy stworzenie samochodu? To jakiś żart! Chcą inwestować miliony w ponowne otworzenie starych zakładów produkcyjnych podczas gdy jesteśmy odsłonięci na ataki wrogów. W dodatku ten nowych szrot pewnie będzie tak samo zawodny jak Maluchy. Po co marnujemy pieniądze na to, co? Zainwestujmy w lotnictwo, czołgi, a nie w coś co i tak wyjedzie z fabryki jako złom!"
DGR_state_depots_of_strategic_stocks: "Państwowy skład rezerw strategicznych"
DGR_state_depots_of_strategic_stocks_desc: "Rezerwy strategiczne które są centralnie rejestrowane i rozdystrybuowane pod nadzorem? Halo, czy nikt nie widzi o co tu tak naprawdę chodzi? O to, że chcą ograniczyć znowu rolę wojska, jestem tego pewien! Przejrzałem ich. Nigdy ich nie obchodziliśmy, a jesteśmy ludźmi którzy walczą o przyszłość narodu! Jedyne co chcą robić to okradać nas z cennego zaopatrzenia by napchać własne kieszenie. Ciekaw jestem po co dziadowi tyle kasy, zbuduje sobie daczę pod Katowicami? W sumie, prawdopodobnie tak. Nigdy nie wierzyłem w ich hojność wobec narodu. Obywatele nie zobaczą ani grosza z tych pieniędzy!"
DGR_atomic_heart_nc: "Atomowe serce"
DGR_atomic_heart_nc_desc: "Potrzeba było dekad planowania, niezliczonych godzin konsultacji z miejscowymi i całej masy komisji oraz rad, które zdążyły przepierdolić pół budżetu, żeby w końcu... mieć jeden mały reaktor badawczy w Otwocku. Opieszałość w tej sprawie jest, kurwa, upokarzająca.\nPolska była kiedyś na dobrej drodze do ujarzmienia potęgi atomu, ale niestety Blok Wschodni się rozpadł, a nowo ustanowiony ustrój, skrępowany kapitalistyczną ideologią zysku i realiami burżuazyjnej demokracji, okazał się niezdolny do dokończenia tego, co rozpoczęliśmy. Teraz, gdy patrioci ponownie są u władzy i nie krępują nas już ograniczenia poprzedniego systemu, możemy wrócić do miejsca, w którym stanęliśmy."
DGR_ground_stabilization_nc: "Stablilizacja gruntu"
DGR_ground_stabilization_nc_desc: "A teraz ta bardziej przyziemna część. Teren w pobliżu Dąbrowskich Ząbkowic został wybrany jako idealne miejsce pod elektrownię atomową. Jeszcze przed Upadkiem okolice Dąbrowy Górniczej wskazywano jako jedną z potencjalnych lokalizacji małego modułowego reaktora BWRX-300. Ale oczywiście my nie robimy niczego małego, co powoduje pewne dodatkowe problemy związane z piaszczystym terenem w okolicy. Nawet Szwej nie chce budować domu na dosłownym piasku, więc zarządził wycięcie miejscowych lasów i ustabilizowanie piaszczystego podłoża. No i tyle. Nadal nie wiem, po chuj budować elektrownię w miejscu, gdzie trzeba wypełnić ziemię stalowymi belkami i zalać ją cementem, zamiast... gdziekolwiek indziej."
DGR_1st_special_guards_unit_nc: "1 Specjalna Jednostka Gwardyjska"
DGR_1st_special_guards_unit_nc_desc: "Pomimo ogromnego wysiłku jakiego będzie to wymagało, fakty pozostają faktami: potrzebujemy tego reaktora i dobrze, że mimo wszystkich problemów w ogóle powstaje. Łatwo też przewidzieć, że gdy tylko zostanie ukończony, stanie się głównym celem naszych wrogów zarówno wewnątrz, jak i poza granicami państwa. Jeśli tak się stanie, musi pozostawać pod stałą ochroną naszych najbardziej elitarnych żołnierzy. Do zabezpieczenia jego obwodu potrzebny będzie cały batalion stacjonujący w pobliżu. Najlepsi spośród nas otrzymają zaszczyt ochrony tego, co, miejmy nadzieję, stanie się potężnym bijącym sercem naszej sieci energetycznej."
DGR_contacts_in_the_east_nc: "Kontakty na wschodzie"
DGR_contacts_in_the_east_nc_desc: "Tak wielkiego zadania jak budowa wielkoskalowego reaktora jądrowego nie da się wykonać w pojedynkę. Potrzebujemy pomocy potężnych państw, które przychylnie patrzą na naszą sprawę i są gotowe dostarczyć nam wiedzy, materiałów oraz funduszy. Skoro Zachód i jego zgniłe elity nie są zainteresowane pomocą w budowie dobrobytu, jesteśmy zmuszeni zwrócić wzrok na wschód i spróbować odnaleźć się w wielkiej grze pomiędzy półkulami. Naszym planem jest nawiązanie kontaktu z elitami sympatyzującymi ze sprawą antyzachodnią, które pomogą nam wskrzesić socjalistyczną myśl techniczną minionych dekad i połączyć ją z innowacyjnymi praktykami współczesności, aby zbudować dostatnią, napędzaną energią atomową przyszłość."
DGR_send_szwej_to_moscow_nc: "Wyślij Szweja do Moskwy"
DGR_send_szwej_to_moscow_nc_desc: "Minęło sporo czasu odkąd Polska i Rosja były \"bratnimi narodami\". Wtedy niewielu w to wierzyło, a dziś wierzy w to jeszcze mniej. Pamięć o naszej wspólnej przeszłości wciąż jest jednak żywa w Moskwie, a Szwej nadal ma kilka kontaktów, które mogłyby lobbować za nami na Kremlu... o ile ci ludzie nie skończyli już w domach spokojnej starości. Ci, którzy wciąż mają jakieś wpływy w aparacie państwowym, zazwyczaj znajdują się daleko od najwyższych szczebli władzy, ale ich głos nadal ma sporą wagę w rosyjskim głębokim państwie. Mamy nadzieję, że wielki naród rosyjski, który niegdyś wprowadził Europę Wschodnią w Erę Atomową, po raz kolejny podejmie się swojej historycznej misji. To dość rozpaczliwy strzał w ciemno, zwłaszcza że rząd Nawalnego próbuje zerwać więzi z przeszłością, ale jest to nasza najlepsza szansa na realizację ambicji."
DGR_purchase_rbmk_nc: "Kup plany reaktora RBMK"
DGR_purchase_rbmk_nc_desc: "Znacie ten dowcip:\n\"To prawda, że w Moskwie rozdają za darmo plany najnowocześniejszych reaktorów jądrowych?!\"\n\"Prawda, tylko że nie w Moskwie, a w daczy pod Jekaterynburgiem. I nie rozdają ich, tylko żądają w zamian nierównego traktatu handlowego. I nie są to najnowocześniejsze reaktory, lecz te odpowiedzialne za katastrofę w Czarnobylu.\"\nNo i jesteśmy w tym miejscu. Góra powtarza rosyjską propagandę, według której przy odpowiedniej konserwacji i nadzorze reaktor RBMK powinien działać odpowiednio i bezpiecznie. No jasne. Ledwo co pomyślałem, że Szwej może jednak coś osiągnąć, a on wraca z takim gównem. No cóż, korzystajmy z energii jądrowej, póki się da. Ja w każdym razie będę trzymał się od tego reaktora tak daleko, jak tylko się da."
DGR_chinese_business_nc: "Chińskie przedsięwzięcia biznesowe"
DGR_chinese_business_nc_desc: "Bądźmy szczerzy: od dawna to nie Rosja gra pierwsze skrzypce jeśli chodzi o wschodnią półkulę. Potrzebujemy teraz nowej potęgi, która jest gotowa wspierać każde państwo nieliberalne - Chin. Przekonanie ich przywódcy powinno być znacznie prostsze, jeśli pochwalimy ich za obronę sprawy robotniczej i zapewnimy o naszym antyzachodnim nastawieniu. Pomogłaby również obietnica utworzenia regionalnej filii Instytutu Konfucjusza. Oczywiście wyprawa dyplomatyczna na Daleki Wschód będzie wymagała od nas czegoś więcej niż tylko 0,7 wódki i wspominania starych czasów. Potrzebujemy wykwalifikowanego dyplomaty, biegle mówiącego po chińsku, prestiżowej delegacji i co najmniej 2 litrów wódki!"
DGR_uranium_smuggling_corridor_nc: "Korytarze przemycania uranu"
DGR_uranium_smuggling_corridor_nc_desc: "A jednak powinni wziąć 4 litry... Chińczycy zgodzili się dostarczyć nam surowce, ale zamiast otworzyć nowy Jedwabny Szlak, zaproponowali nam Jedwabny Tunel. Powołując się na problemy z transportem oraz \"szczególną sytuację międzynarodową Narodowej Republiki Ludowej\", stwierdzili, że ich państwo nie jest w stanie oficjalnie dostarczać nam towarów ani drogą lądową, ani morską. Zamiast tego zaproponowali pomoc w zorganizowaniu przemytu przez terytorium Rosji. Nie jest to rozwiązanie idealne, ale ma swoje zalety. Skoro i tak musimy polegać na przemycie uranu, równie dobrze możemy rozszerzyć całą operację i przy okazji zgarniać inne surowce. Nic tak spektakularnego jak uran, ale każdy stary egzemplarz broni czy chemiczne składniki do produkcji materiałów wybuchowych również będą świetnym dodatkiem do naszych transportów."
DGR_create_pogoria_v_nc: "Utwórz Pogorię V"
DGR_create_pogoria_v_nc_desc: "Już pojawiają się problemy. Powszechnie wiadomo, że elektrownie jądrowe, podobnie jak ich węglowe odpowiedniki, potrzebują wody do działania. Najlepiej byłoby mieć w pobliżu rzekę, większą niż Trzebyczka, albo zbiornik retencyjny. Jak się okazuje, zbiorniki Pogoria są trochę za daleko. Zmiana lokalizacji elektrowni na tym etapie byłaby problematyczna i niewiele by nam dała; teren wokół Pogorii jest jeszcze bardziej niegościnny, ponieważ zbiorniki powstały w wyniku zalania wodą starych piaskowni. Na tym etapie lepiej będzie wykopać i stworzyć kolejną Pogorię, która zaopatrywałaby naszą przyszłą elektrownię. Nawet jeśli w pobliżu nie mamy wygodnie położonych nieczynnych wyrobisk, do których można by nalać wody."
DGR_advanced_staff_training_nc: "Zaawansowane szkolenie personelu"
DGR_advanced_staff_training_nc_desc: "Czy ktoś w ogóle wie, jak to cholerstwo będzie działać? Tak myślałem. Mamy kilku fizyków teoretycznych, ale brakuje nam praktyków, którzy będą w stanie obsługiwać przyszłą elektrownię i szkolić nowych inżynierów w zakresie pracy z elektrownią jądrową. Nawet jeśli w Polsce jest wystarczająco wielu specjalistów, są oni rozsiani po całym kraju. Ponownie będziemy potrzebować pomocy Rosjan. To tylko rozwiązanie tymczasowe, zanim zapewnimy sobie stały napływ rodzimych specjalistów. Miejmy tylko nadzieję, że do czasu zakończenia szkolenia Ruskie nie zdążą spierdolić czegoś zbyt poważnie."
DGR_zabkowice_nuclear_power_plant_nc: "Ząbkowicka Elektrownia Atomowa"
DGR_zabkowice_nuclear_power_plant_nc_desc: "To działa? Działa! Chyba byłem zbyt surowy w ocenie całego tego przedsięwzięcia. Nieodpowiedni teren, zaplamione alkoholem rosyjskie plany, brak odpowiednich kadr - wszystko to tylko budowało mój sceptycyzm, a jednak no, stoimy pod elektrownią i jest to możliwe. Podziwiam ukończenie całego przedsięwzięcia. Mogę powiedzieć wiele złego o komunistach, niezależnie od tego, jaką farbą się przemalowali, ale po raz kolejny udowodnili, że jeśli tylko chcą, potrafią zbudować infrastrukturę niezbędną do strategicznego przetrwania państwa. Miejmy nadzieję, że Polska, niezależnie od tego, kto będzie nią rządził, będzie prosperować dzięki taniej energii dostarczanej przez Ząbkowicką Elektrownię Atomową."
DGR_expansion_of_the_red_army: "Rozbudowa Armii Czerwonej"
DGR_expansion_of_the_red_army_desc: "Kolejny rok, kolejny krok na drodze do nieuniknionego wyzwolenia naszego narodu i postępu ludu pracującego miast...no, zakładając że Politbiuro i inne urzędoidy nie rozkażą wojsku strzelać w niebo. Zanim się wszyscy znowu obrażą i zanim pójdziemy na silnego wroga, Armia Czerwona musi się powiększyć. Kilkukrotnie nawet. Potrzebujemy karabinów i ludzi, którzy będą te karabiny trzymać. Potrzebujemy woli i łopat. Ten kraj nie został zbudowany na biurokracji i filozofowaniu jakichś chujków, którzy nigdy wcześniej nie żyli w społeczeństwie robotniczym, lecz został zbudowany na bagnetach karabinów ludu pracującego.\nNa szczęście dla nas, wszyscy filozofowie dawno uciekli a lud jest nadal z nami."
DGR_national_people_navy_nc: "Narodowa Marynarka Ludowa"
DGR_national_people_navy_nc_desc: "...ja nawet nie mam nic do dodania w tej sprawie. Jakby nie dość było idiotyzmów Politbiura, to ich nowiutka propozycja przekracza jakikolwiek Rubikon kretynizmu. Cytując, dzieło to 'będzie niezbędne w przypadku przyszłych podbojów'. No i fajnie, tylko oni kurwa mówią o FLOCIE. Rzecznej flocie w państwie W ŚRODKU LĄDU. Cały plan polega na zbudowaniu niewielkiej floty słodkowodnej która będzie w stanie patrolować rzeki i przecinać wrogie linie zaopatrzeniowe oraz transporty na wcześniej wspomnianych rzekach. I taka, która będzie adaptowalna na tyle, by później przekształcić ją w zalążek prawdziwej floty morskiej. Czy to w ogóle ma jakiś sens? No jak na moje to nie. Ale o ile nie będzie musieli pożegnać się z dodatkowymi funduszami, będziemy musieli przez chwilę zatańczyć jak nam te pierdolone ameby zagrają."
DGR_przemsza_program_nc: "Program Przemsza"
DGR_przemsza_program_nc_desc: "Przeszedłem się dzisiaj koło Pogorii IV by popatrzeć jak te wodoluby testują swój nowy sprzęt. Nazwali całe to przedsięwzięcie 'programem Przemsza'. Gwoździem programu jest użycie istniejących łódek i zmodyfikowanie ich dopóki nie przestaną tonąć lub eksplodować i staną się w miarę używalnymi lekkimi okrętami wojennymi. Za każdym razem póki co polegli w przedbiegach. Albo zbyt przesadzili z modyfikacjami, albo łódka jest za ciężka albo dziurawa, albo jeszcze jakaś inna wymówka. Dno Pogorii obecnie wygląda jak krajobraz po morskiej bitwie. Chujowo byłoby być nieszczęśliwcami których łodzie zostały użyte do testowania. Przynajmniej jest to jakaś rozrywka na spacerze kiedy idziesz sobie i kolejna łódź dokonuje samozapłonu, a jedyne co słyszysz to wulgaryzmy z ust inżynierów. No i właśnie...problem polega na tym, że dzisiaj łódka nie zatonęła. Jest to niewątpliwie interesujące, bo skoro im się udało to znaczy że będziemy przechodzili do następnego etapu. A to...niedobrze."
DGR_warta_military_shipyard_nc: "Stocznia wojskowa Warta"
DGR_warta_military_shipyard_nc_desc: "Jest niedobrze. Znajdujemy się w chwili w której wprowadzamy przeklęty plan stworzenia stoczni wojskowej. Muszę przyznać, dobrze że nie testowali swoich świetnych pomysłów na mniejszych zbiornikach bo byłoby to super komiczne. No ale, infrastruktura Warty i dostęp do w miarę porządnego zbiornika wodnego to najlepsze co możemy osiągnąć zanim dotrzemy do wybrzeży Bałtyku. Jezioro Jeziorsko jest większe od Pogorii i będzie odpowiednim miejscem gdzie będziemy mogli testować te ustrojstwa, więc rozumiem że powinniśmy się trochę do tego przygotować, nawet jeśli uważam że to wszystko jest jedną wielką stratą pieniędzy które moglibyśmy spożytkować lepiej w każdej innej gałęzi naszego wojska. Serio, nasze wojsko nie wojuje w oparciu o manifesty i obietnice!"
DGR_first_npn_flotilla_nc: "Pierwsza flotylla NML"
DGR_first_npn_flotilla_nc_desc: "Ja pierdolę. Udało im się? Usłyszałem dzisiaj, że nasze postępy morskie pozwoliły na zwodowanie trzech nowych okrętów klasy Przemsza. Naprawdę nie doceniłem marynarki wojennej tak bardzo i przegapiłem moment w którym się tak bardzo rozwinęli? Co do kurwy? To oznacza że te wszystkie inwestycje nie były bezpodstawne i teraz posiadamy więcej narzędzi do podbijania Polski. Powinienem się cieszyć, ale czuję się jakby komuchy zrobiły mnie w chuja i nawet o tym nie wiedzą...\n\nJakim cudem? To znaczy, będę zdziwiony jeżeli te puszki w ogóle utrzymają się na powierzchni wody i przetrwają dłużej niż tydzień...ale wydaje mi się że zżera mnie po prostu zawiść. Cóż, zgaduję że nie ma już odwrotu z tej drogi."
DGR_metalowiec_gunboat_nc: "Kanonierka klasy Metalowiec"
DGR_metalowiec_gunboat_nc_desc: "Sukces (niefortunny dla mojej psychiki) stoczni Warta oznacza, że możemy podwoić nasze wysiłki jeśli chodzi o produkcję słodkowodnej floty o której to Politbiuro tak długo fantazjowało. W końcu z dnia na dzień docieramy do coraz większych zbiorników wodnych, więc w tym momencie to nie jest już taki durny pomysł. Co prawda, nadal uważam że zbyt obsesyjnie podchodzą do tego co byłoby najlepsze by wzmocnić Dąbrowę (cokolwiek innego), ale próżno szukać u nich sensu. Chętnie wytknąłbym im te nonsensy ale wtedy zaczną szczekać jak bardzo się myliłem co do floty. Posłuchajcie mnie pizdy - NIE MYLIŁEM SIĘ, po prostu znajdujecie najmniejszą drzazgę w moim oku byleby tylko móc mnie oskarżać i śmiać się ze mnie bo nie jesteście tak żałośni, że nie potraficie znaleźć jakiejkolwiek poważnej wady u mnie, której to nie wyolbrzymiliście sobie w waszych móżdżkach!\n\nNo, także ten...no to mamy więcej kanonierek, nie?"
DGR_pogoria_class_monitor_nc: "Monitor klasy Pogoria"
DGR_pogoria_class_monitor_nc_desc: "Pomimo całej mojej niechęci co do Pogorii i wszystkich wodolubów tam pracujących, nie mogę nie przyznać (i strasznie mnie to boli), że ich wysiłki nie przyniosły rezultatów. Uch, prawię się zżygałem mówiąc to. Tak czy siak, marynarka wojenna pracuje teraz nad faktycznymi większymi okrętami wojennymi i zaproponowali że następna klasa okrętów powinna się nazywać 'Pogoria'. Bezczelne lizanie sobie jaj, ale w ramach nagrody za pierdolony cud przekształcenia lądowego państewka Zagłębia w potęgę morską...zasługują...na trochę...no, tak. Nie, jednak żygnę. I nawet nie jestem na pokładzie tych puszek. I nie pokładam nawet w tym jakiejkolwiek nadziei."
DGR_continuation_of_project_716_nc: "Kontynuacja projektu 716"
DGR_continuation_of_project_716_nc_desc: "Nie ma naprawdę niczego interesującego co by można powiedzieć o kontynuacji projektu 716 dla marynarki. Ta sama stara śpiewka - taniej jest wziąć i przerobić istniejące okręty niż budować od zera. Jedyny pozytyw jaki z tego wynika to że jeszcze nie potrzebujemy ogromnych transportowców do przewożenia naszych żołnierzy. Póki co, najprostsze barki i promy wystarczą. No i w dodatku to jest kolejny projekt Politbiura dotyczący marynarki...ale może skupmy się na pozytywach. Może i flota będzie bezużyteczna, ale będziemy w końcu potrzebowali transportowców do inwazji przez rzeki. Bo można się spodziewać że wróg wysadzi wszystkie mosty na co większych rzekach w kraju. A jeśli przy okazji okopią się dobrze na drugim brzegu, przeprawa pontonowa byłaby samobójstwem. Ot, transportowce. Przynajmniej tyle dobrego z tego będzie."
DGR_national_ground_forces_nc: "Narodowe Siły Lądowe"
DGR_national_ground_forces_nc_desc: "Jako potęga lądowa nieograniczona wielkimi rzekami czy morzem, naszym naturalnym krokiem jest postawienie na szerokość i masę naszych lądowych sił uderzeniowych. Tak, fajnie że mamy pojazdy zdolne przekraczać rzeki, ale ważniejsze jest to że mamy jakiekolwiek pojazdy. Przeważając zajadłością, dyscypliną i ilością, nasza armia nigdy się nie podda. Ale żeby to osiągnąć potrzebujemy dodatkowych pracowników. Ludzi pracujących w odzysku. Każdy kto może chodzić będzie pracował dopóki ich ręcę nie zaczną krwawić. A potem...no nie wiem, czy ja wyglądam na lekarza? Dajcie im rękawiczki gumowe zamoczone w etanolu i każcie pracować dalej!"
DGR_wide_front_strike_specialization_nc: "Specjalizacja szerokiego frontu"
DGR_wide_front_strike_specialization_nc_desc: "Spadniemy na naszych wrogów jak grom z jasnego nieba, przygwoździmy i przeważymy szalę ilością nie pozostawiając nikogo przy życiu. Ale żeby to działało potrzebujemy jednej z dwóch rzeczy: Albo ludzi na orbicie, albo doktryny szerokiego frontu. Nasza cała granica to jedna wielka linia frontu bez większych przeszkód naturalnych. Musimy pokryć wszystkie połacia tej ziemi żołnierzami, pojazdami i patrzeć jak z czasem zostają one pożarte przez masę naszego wojska."
DGR_ideological_motivation_imperative_nc: "Ideologiczny imperatyw motywacyjny"
DGR_ideological_motivation_imperative_nc_desc: "Żeby nasza doktryna działała, każdy żołnierz musi być odpowiednio zmotywowany. Musi go wypełniać duch socjalizmu i wiara w ideały robotni.....hahahaha, no kurwa pewnie! Wiem jak działają nasi ludzi, w przeciwieństwie do eunuchów z Politbiura. Nie walczymy dla pieniędzy lecz w imię naszego narodu. Tak, nawet za tych którzy nie do końca się z tym narodem utożsamiają. Za waszych rodziców, braci, kuzynów, synów. Nawet jeśli ich nie macie - wkrótce będziecie mieli rodzinę. No i oczywiście, czy wam się to podoba czy nie, walczycie w imię Partii i Pierwszego Sekretarza który prowadzi was do raju robotniczego. Tja."
DGR_people_officer_school_nc: "Akademia Oficerów Ludowych"
DGR_people_officer_school_nc_desc: "Armia maszeruje w oparciu o swój korpus oficerów, dowództwo i ich możliwości do szybkiego i taktycznego myślenia, o ich...ideologiczną betonozę. Ech, jedną rzeczą którą Ci biurwokraci rozumieją że przez to, że nasz światopogląd jest taki a nie inny, jest bardzo bliski rzeczom które zatruwają cały system; międzynarodowych fajnopolaków, uśmiechniętych socjalistów i kapitalistycznych 'narodowców'. Przez to musimy być pewni że nasi oficerowie będą dalecy od takich wynaturzeń. Serio. Naród jest wypadkową ludzi z których się składa, a nie z flag czy uch, kapitału. To dlatego nasi oficerowie muszą się na uczyć jak prowadzić wojnę w imieniu po pierwsze społecznym, a po drugie narodowym."
DGR_ngf_command_structure_nc: "Struktura dowodzenia NSL"
DGR_ngf_command_structure_nc_desc: "Nadszedł czas żeby zaktualizować strukturę dowodzenia w naszym państwie. Musi istnieć przede wszystkim jasny łańcuch dowodzenia i odpowiedzialności, a każdy oficer musi dokładnie wiedzieć przed kim odpowiada i kto wydaje im rozkazy. Podobne metody były wprowadzane (z mieszanymi skutkami) przez Sowietów i Rosjan. Ale w przypadku poważnych starć, najważniejszym jest to by wszyscy pracowali jak jedna maszyna a nie jako indywidua działające tylko w swoim imieniu. Tak działa socjalizm. W przeciwieństwie do kapitalistycznego chaosu."
DGR_restandarisation_of_firearms_nc: "Restandaryzacja broni palnej"
DGR_restandarisation_of_firearms_nc_desc: "Tylko kapitalistycznych świni nie cieszy seria z pepeszy. Co prawda w obecnych czasach utrzymanie takiej pepeszy w dobrym stanie jest trudniejsze niż sprawienie by strzelała. Setki wariantów broni, dziesiątki typów amunicji, tysiące różnych części - czas z tym skończyć. Nastał koniec logistycznego koszmaru, wprowadzamy czym prędzej nowe standardy i wkraczamy w erę uniformizacji. Jeden karabin przyjęty na wyposażenie wojska, jeden standard magazynków, jeden zestaw części tak uniwersalnych jak tylko się da. To zdecydowanie pomoże rozkręcić naszą produkcję i pomoże również w serwisowaniu."
DGR_every_soldier_tank_destroyer_nc: "Każdy żołnierz niszczycielem czołgów"
DGR_every_soldier_tank_destroyer_nc_desc: "Nasi wrogowie objawiają się w wielu postaciach, ale te opancerzone są najbardziej wymagającym typem przeciwnika. Nie wystarczy pozostawić takie pojazdy by zostały pokonane przez nasze własne pojazdy. W starciu z naszą piechotą, wrogie pojazdy muszą niknąć jak gdyby dostały się pod ostrzał artylerii. Każdy z naszych piechociarzy otrzyma przeciwpancerne środki do walki. Każdy z nich będzie przeszkolony w ich użyciu. Każdy z nich dowiedzie swojej wartości w ilości czołgów które zniszczy. Wrogie pojazdy nie będą już przechylać szali na stronę przeciwnika - gdyż każdy czołg będzie warty jedynie jednego naszego żołnierza. A nawet mniej gdy uda nam się przejąć ich pojazdy na nasz użytek."
DGR_unleashing_fire_and_fury_nc: "Ogień i pożoga"
DGR_unleashing_fire_and_fury_nc_desc: "Ogień, wkurwienie i zniszczenie! Pożoga którą przyniesiemy naszym wrogom będzie wręcz biblijna. I chodzi mi tylko o porównanie jako źródło fantazji, nie jestem wierzącym głupcem. W co wierzę to stal i ołów - coś co nasi żołnierze rozdają na lewo i prawo wszystkim niewiernym i heretykom naszej sprawy. Ale czasem jednak trzeba postarać się bardziej i użyć większej broni. A gdy to nie pomoże - zwiększać kaliber aż do skutku i eliminacji przeciwnika. Mamy doświadczenie z elementami wojny zmechanizowanej i taktykami pancernymi - zaprocentuje to w momencie kiedy będziemy wprowadzać masowo różnorakie machiny wojenne. Każdy batalion będzie mógł zostać wyposażony w takie cuda, a nie tylko elitarne jednostki. I proszę, kurwa wręcz błagam - dajcie mi to załatwić po swojemu. Jeśli Politbiuro spierdoli coś tutaj, wyjdę z siebie..."
DGR_viper_program_nc: "Program Żmija"
DGR_viper_program_nc_desc: "Niepozornie wyglądające samochody pancerne potrafią stanowić ogromne wsparcie dla zwykłych żołnierzy na polu bitwy. Oprócz możliwości szybkiego przemieszczania się nawet po trudnym terenie oraz potencjału zwiadowczego - dokładamy tam również całkiem pokaźną siłę ognia. Co prawda spotkania z wyrzutnią rakiet taki samochód raczej nie przetrwa, to jednak opancerzenie wydłuża przeciętny czas życia załogi, przynajmniej o parę minut. Niestety, pracując na planach starych sowieckich gratów nie możemy zbytnio pokusić się o wariacje na temat idealnego samochodu pancernego na miarę obecnych czasów. Dlatego też będziemy musieli zaprojektować coś własnego i oryginalnego. Na szczęście mamy odpowiednie zakłady przemysłowe do tego."
DGR_new_constellation_of_star_trucks_nc: "Nowa konstelacja ciężarówek STARa"
DGR_new_constellation_of_star_trucks_nc_desc: "Trzeba przyznać, nie wszystkie państwowe przedsiębiorstwa wojskowe są nietrafioną inwestycją. Musimy tutaj jednostkowo podchodzić do sprawy. Spójrzcie tylko na fabrykę STARa. Kiedyś, była to duma naszego kraju zaopatrująca nasze wojsko (i nawet zagraniczne). Teraz, przygotowując się do starcia z sąsiadami - potrzebujemy tych zakładów jeszcze bardziej. Jaki sens jest w budowaniu tych busów cywilnych które MAN wcisnął na linie produkcyjne w Starachowicach? Co prawda, nadal istnieje Jelcz ale to nie wystarczy. Szczególnie gdyby Niemcy próbowali po raz kolejny wkroczyć na Śląsk. Potrzebujemy więcej zakładów tego typu na środkowym wschodzie kraju. Poza tym, Kongresówka nadal musi pokazać że potrafi coś zrobić."
DGR_new_old_skots_nc: "Nowe-stare SKOTy"
DGR_new_old_skots_nc_desc: "Zagadka, co ma jeszcze mniej sensu niż używania przestarzałych, komunistycznych konstrukcji których nawet nie chcieli używać niektórzy członkowie Układu Warszawskiego? Tak, zgadza się - używanie jeszcze starszych komunistycznych konstrukcji które nigdy nie zabłysnęły na świecie a ich użyteczność skończyła się gdy projekt porzucił nawet jeden z jego oficjalnych projektantów. Zgadliście, chodzi o SKOTy. Podczas gdy bewupy były wciąż w użytku w naszej armii w okolicach Upadku, w 2010 roku mieliśmy około setkę SKOTów. Biorąc pod uwagę te projekty, wygląda na to że będziemy modyfikować jeszcze starsze modele zamiast użyć zmodernizowanych projektów KTO Ryś..."
DGR_eternal_spirit_of_bwp_1_nc: "Wieczny duch BWP-1"
DGR_eternal_spirit_of_bwp_1_nc_desc: "Może i rok 966 był rokiem, który przyniósł narodziny i zdefiniował Polskę jako kraj, to rok 1966 był tym, który stworzył i zdefiniował jej współczesną wojskowość. Bo był to rok, w którym pierwsze BMP-1 (znane w polsce jako BWP-1) ujrzały światło dzienne. I tego dnia postęp w Wojsku Polskim umarł po wsze czasy. Byliśmy blisko wymiany bewupów na nowszy model, ale wpływ minionych lat okazał się zbyt silny i zdusił marzenia o nowoczesnych wozach w zarodku. Chciałbym coś z tym zrobić. Argumentowałem, że BWP-1 to przestarzałe wozy, używane wyłącznie przez kraje drugiego i trzeciego świata. Nawet niektóre z krajów byłego bloku wschodniego się ich pozbyły! Próbowałem również przedłożyć nowsze projekty z podobnymi nazwami, jak BWP Borsuk, Łoś, Jeleń, Ryjówka, Dzik, Lis, Kuna, Szop, Wilk, Ryś - każda próba dyskusji kończyła się tym samym argumentem:\n'BWP są w porządku. Potrafią pływać, wiesz?'"
DGR_pt_91_the_hardest: "PT-91: Najtwardszy"
DGR_pt_91_the_hardest_desc: "K2, co? Koreańcy niech zostaną przy robieniu muzyki. Nasze jednostki pancerne muszą terroryzować wrogów i wzniecać narodową dumę, poczucie że w każdy Polaku jest wielkość i cały nasz naród jest wielki. Dlatego potrzebujemy naszych własnych projektów. Mówimy tutaj o wskrzeszeniu modelu PT-91 Twardy, którego produkcja niestety zakończyła się dekady temu. Jest to relatywnie nowoczesny projekt w porównaniu do innych...naszych wozów. Kilka modyfikacji tu i ówdzie i Twardy będzie dominował znowu na polu bitwy. Jest też prawdą to, że nie mamy żadnych cwanych metod chronienia naszych czołgów przed dronami. Ale zwykła siatka okazała się skuteczna na frontach wojny rosyjsko-ukraińskiej, więc powinna być skuteczna i teraz."
DGR_unified_fire_control_command_nc: "Połączone Dowództwo Kierowania Ogniem"
DGR_unified_fire_control_command_nc_desc: "Jak to mówi klasyk - pierdol tych ludzi którzy odzywają się do Ciebie tylko gdy potrzebują twojego wsparcia artyleryjskiego. Ale tak całkiem serio - artyleria to bardzo przyjemna zabawka, ale ktoś tym wszystkim musi zarządzać. Bo inaczej dajcie żołnierzom kwadrans na polu bitwy a będziemy mieli sojusznicy ostrzał albo losowa wioska zostanie wysadzona w powietrze za nic. Potrzebujemy bardzo odpowiedzialnych ludzi na stanowiskach kierowania ogniem oraz zaawansowanej technologii komunikacyjnej oraz takiej która umożliwi nam na szeroki ogląd pola bitwy. Są już teraz takie systemy wojskowe, które pozwalają operatorowi poczuć się jakby grał w jakiegoś RTSa na żywo. Jeśli będziemy je mieć to nikt nie będzie już musiał bać się że jest się w zasięgu sojuszniczej artylerii."
DGR_stationary_artillery_strongpoints_nc: "Stacjonarne umocnienia artyleryjskie"
DGR_stationary_artillery_strongpoints_nc_desc: "Biorąc pod uwagę doświadczenia z frontu, gdzieniegdzie jedyne co trzeba postawić na drodze przeciwnika to jebitne działo, okopać je, ukryć - i napieprzać ile wlezie. Zaraz odezwą się fanatycy zapierdalania że tak nie wolno, że w dzisiejszych czasach trzeba być mobilnym, musisz się przemieszczać po każdym strzale, robić kurwa uniki w krzakach i najlepiej to w ogóle robić fikołki podczas przeładowywania. I to jest jedno wielkie gówno prawda - wróg nie ma rozpoznania żadnego ani technologii - to jest dosłownie strzelanie do kaczek. A gdy znajdzie się taki który owe posiada - zmieciemy go lotnictwem. W każdym przypadku wielkie stacjonarne działo wygra. I nie straci ani trochę paliwa - bo go cholera nie potrzebuje."
DGR_advanced_mobile_fire_platforms_nc: "Zaawansowane samobieżne platformy artyleryjskie"
DGR_advanced_mobile_fire_platforms_nc_desc: "No ale też żeby nie było że jedyne co będziemy robili to czekali to musimy uzupełnić nasze braki w ruchliwości mobilnymi platformami ogniowymi które będą pełniły rolę taką jaką spełnia komar który wpadnie Ci do pokoju i nie może znaleźć okna by wylecieć z powrotem. Latamy dookoła, robimy szum i podgryzamy gdy możemy i ile możemy. Wróg skupi się na powyłapywaniu wszystkich tych zapieprzających robaczków podczas gdy my będziemy mogli się skupić na POTĘŻNYM ostrzale lub bezpośrednim szturmie. Bo w wojaczce nie chodzi o to żeby brnąć w jedną taktykę przecież, nie? Bo jeśli to zrobisz to zaraz znajdzie się inteligent po drugiej stronie który skontruje Cię czymś na co ty już nie będziesz miał kontry bo przepieprzysz wszystkie pieniążki na artylerię samobieżną. A tak - będziemy mieć wszystko."
DGR_revitalization_of_rocketry_nc: "Rewitalizacja sił rakietowych"
DGR_revitalization_of_rocketry_nc_desc: "Wojska rakietowe za PRL-u...trzeba przyznać, że robiły cholera wrażenie. I to kolejna z całej plejady upokorzeń plama w historii Wojska Polskiego III Rzeczpospolitej. Bo z państwa które posiadało rakiety zdolne nawet do przenoszenia głowic atomowych zostało nam...wielkie gówno. W Rosji wojska rakietowe stanowią nawet odrębną gałąź wojska, tak bardzo są tam one rozbudowane - i niestety Ukraina przekonała się o tym na własnej skórze że jest to broń diabelnie skuteczna przy minimalnym wysiłku. Celujesz jako-tako, odpalasz i zapalasz fajeczkę czekając aż zwiad albo lotnictwo powie w co trafiłeś. Robota idealna, oprócz ryzyka tego że jak ktoś namierzy twoją pozycję to odbędzie się polowanie na Ciebie przez całą wrogą armię. Ale to na bok - musimy odnowić potęgę rakietową jaką posiadaliśmy. I na tym się skupmy. Procedury będziemy odświeżali jak w ogóle zbudujemy coś co może latać i wybuchać i nie będzie to ruski samolot pasażerski."
DGR_strategic_rocket_forces_command_nc: "Dowództwo Strategicznych Sił Rakietowych"
DGR_strategic_rocket_forces_command_nc_desc: "Modernizacja sprzętu wymaga kogoś kto będzie w stanie dowodzić coraz to bardziej skomplikowanymi narzędziami zniszczenia. Na przykład taka artyleria rakietowa. Potrzebujemy ludzi którzy będą posiadali wiedzę nie tylko jak efektywnie jej użyć jako nowej broni ale którzy będą wnosili coś więcej swoim doświadczeniem. Gwałtowny progres technologii rakietowej pozwoli nam na wysyłanie w niebiosa coraz potężniejszych i wyspecjalizowanych pocisków. Kto wie, może z czasem nasze wysiłki zaprocentują w formie programu kosmicznego?"
DGR_red_skies_nc: "Czerwone niebiosa"
DGR_red_skies_nc_desc: "Mówcie co chcecie, ale jeśli miałbym wybierać pomiędzy siłami zbrojnymi z nieskończonymi zasobami ludzkimi i pojazdami, a lotnictwem - wybiorę to drugie. Wsparcie lotnicze jest niezbędne przy przełamaniach, ambitnych kampaniach, chronieniu naszego rodzimego przemysłu...przynajmniej zanim wrog nie odkryje pocisków manewrujących. Ale nie pozwolimy im na to. Nasze samoloty przesłonią słońce, aż wstanie czerwony świt. I czerwony będzie przez cały dzień, i tylko czerwień na niebie będą nasi wrogowie widzieli! Oczywiście, dopóki jacyś geniusze nie zdecydują że nie stać nas na inwestycje w lotnictwo. Wtedy co najwyżej kurwa będziemy mogli używać gołębi."
DGR_expansion_of_pzl_mielec_nc: "Rozbudowa PZL-Mielec"
DGR_expansion_of_pzl_mielec_nc_desc: "PZL Mielec był kiedyś jednym z naszych najwspanialszych zakładów lotniczych. Jednak kapitalizm to wredna suka i pozbawiła Mielec praktycznie całkowicie życia, a Upadek wcale nie poprawił sytuacji. Teraz jednak, prawdziwa socjalistyczna siła, narodowo-ludowa siła zadba o tę pannę by nabrała kształtów. Jej betonowe i stalowe ciało napełni nas radością a nasi robotnicy ugoszczą ją darami surowców...i z tego związku wyłonią się całe roje wojennych maszyn jako owoc żywota naszego.\nI co ważniejsze, będzie to zguba dla naszych wrogów."
DGR_pzl_anvil_program_nc: "Program PZL Kowadło"
DGR_pzl_anvil_program_nc_desc: "Fajne zakłady tam macie, byłoby fajnie gdyby nikt wam nie przeszkadzał w produkcji wojennej, prawda? Dlatego potrzebujemy bombowca. I tutaj na scenę wschodzi program Kowadło. Zapewni on wszystko czego potrzeba współczesnemu lotnictwu od bombowca. Na szczęście nie musimy nim daleko lecieć do jakichś Chin czy Ameryki - nasi przeciwnicy w Polsce będą idealnym poligonem doświadczalnym. Nawet grubym rybom z Politbiura czasem się uda coś dobrego wymyślić."
DGR_rapid_response_brigades_nc: "Brygady Kawalerii Powietrznej szybkiego reagowania"
DGR_rapid_response_brigades_nc_desc: "Motyw kawalerii powietrznej zawsze mnie śmieszył ze względu na przywiązanie Polaków do słowa kawaleria. Wszystko musi być pierdoloną kawalerią, jebane czołgi to kawaleria pancerna, śmigłowcowy desant to kawaleria powietrzna. Chłopy naprawdę dalej marzą o tym żeby tylko pić, ruchać i jeździć konno. Ale mniejsza o nazwę - jednostki szturmowe poruszające się za pomocą śmigłowców mogące reagować na każdą nawet najmniejszą zmianę lub przełamanie na froncie oddalonym o setki kilometrów to jest coś co zmieni całkowicie obraz naszej wojny. Błyskawiczny i zmasowany atak przeprowadzony za pomocą takich brygad przełamie każdą najtwardszą obronę i gdy dobrze to skoordynujemy i zapanujemy nad chaosem operacyjnym - będzie to broń skuteczniejsza niż jakakolwiek bomba."
DGR_pzl_sickle_program_nc: "Program PZL Sierp"
DGR_pzl_sickle_program_nc_desc: "Tak, tak - kawaleria powietrzna brzmi fajnie, ale czasami potrzebujesz czegoś nie mniej mobilnego ale z większym pierdolnięciem. I tutaj na scenę wchodzi program Sierp. Nowy prototyp śmigłowca bojowego, zaprojektowany by sprostać wszystkim wymaganiom postupadkowego pola bitwy. Końcowym rezultatem będzie drapieżny ptak który kosi wszystko na swojej drodze, jak na Sierp przystało. A przynajmniej do czasu kiedy wymyślimy kombajn. Kogo ja oszukuję? Ta nazwa ssie. Jak zwykle, to kolejny przykład w którym politbiuro wtrąca się z propagandą w nieswoje sprawy. Przynajmniej mam nadzieję że to będzie latało."
DGR_nationalization_of_pzl_rzeszow: "Nacjonalizacja PZL-Rzeszów"
DGR_nationalization_of_pzl_rzeszow_desc: "Rzeszowskie zakłady lotnicze co prawda nigdy nie były tak potężne jak Świdnik czy Mielec ale to nie jest powód żeby od razu załamywać cały rzeszowski przemysł lotniczy i sprzedawać go kapitalistom z zachodu! A to kluczowa fabryka która dostarczała najlepsze silniki do myśliwców i śmigłowców produkowanych właśnie w niedaleko położonych miastach. Potem nawet tam montowano silniki do zachodnich myśliwców typu F-16 czy F-35.\n\nCo nam po silniku skoro nie wmontujemy ich nigdzie? A to nam po tym, że ekspertyza na ten temat lub inżynieria wsteczna pozwoli nam rozwinąć nasze umiejętności które wykorzystamy do zbudowania własnych, profesjonalnych silników lotniczych do najnowocześniejszych maszyn latających po naszym niebie!"
DGR_pzl_hammer_program_nc: "Program PZL Młot"
DGR_pzl_hammer_program_nc_desc: "Kapitaluchy wymądrzają się że współczesny samolot przewagi powietrznej jest zarezerwowany jedynie dla najbogatszych i najpotężniejszych nacji, czy to dla Chin i Rosji czy Wielkiego Kapitalistycznego Szatana, USA. Zamierzamy zadać kłam tym pierdołom i dzisiaj rozpoczynamy pracę nad konceptualizacją i prototypami programu Młot. Zwinność, wytrzymałość, władanie przestworzami - to zapewni nam Młot. Jego pociski zmiotą z planszy każdego wroga, jego działka pożrą ich żywcem, jego silnik połączy potęgę stali z lekkością niedożywionego dziecka pod rządami kapitalistów. A najlepsze? Analogowy sprzęt pokładowy który sprawi że nie będzie nas obchodzić żaden impuls elektromagnetyczny!"
DGR_special_purpose_forces_nc: "Siły specjalnego przeznaczenia"
DGR_special_purpose_forces_nc_desc: "Siły Specjalne zawsze odgrywały ważną rolę w arsenale Polskiej Rzeczypospolitej Ludowej, dlatego Biuro Polityczne oczywiście chce je przywrócić wraz z całą symboliką, którą niegdyś ze sobą niosły. Były obecne podczas każdego tłumienia strajków i zamieszek aż do samego końca, a nawet po upadku Republiki niezmiennie chroniły ją przed ukrytymi wrogami państwa. Zdaniem naszych towarzyszy byłoby wręcz niehonorowe - a moim zdaniem po prostu strategicznie głupie - nie przywrócić ich do służby. Pomysł zrobienia z nich gloryfikowanej machiny propagandy socjalizmu osobiście napawa mnie obrzydzeniem, ale zapotrzebowanie na siły specjalne pozostaje faktem, więc równie dobrze możemy to wykorzystać. Zobaczymy tylko, jak mocno wżarł się w nich wizerunek \"komunistycznych bohaterów\"."
DGR_maroon_berets_nc: "Bordowe berety"
DGR_maroon_berets_nc_desc: "Jakby oglądanie komunistów każdego dnia nie było już wystarczającym pierdolonym przekleństwem, teraz będą jeszcze zaśmiecać niebo samym faktem swojego istnienia. \"Pomysł stworzenia wojsk spadochronowych był dziś szeroko omawiany w Politbiurze i ponieważ sami są kompletnymi ptasimi móżdżkami, postanowili pójść na całość z inwestycjami, mimo że ledwo jesteśmy w stanie oderwać od ziemi nasz własny złom z silnikiem śmigłowym!\" - dokładnie to pomyślałem po spotkaniu. Ku zaskoczeniu każdego człowieka posiadającego choć połowę sprawnego mózgu - czyli nikogo z Politbiura - ćwiczenia spadochronowe okazały się jednak sukcesem. Zbyt dużym sukcesem. Teraz nie mogę nawet spojrzeć w niebo bez wyobrażania sobie oddziału Szweja przelatującego nade mną, co natychmiast rujnuje mi dzień. Wiedziałem, że po miastach Zagłębia chodzi mnóstwo świrów, ale bez przesady... kto przy zdrowych zmysłach zgłosiłby się na ochotnika, żeby wyskoczyć z całkowicie sprawnego samolotu?"
DGR_green_berets_nc: "Zielone berety"
DGR_green_berets_nc_desc: "Polska to w dużej mierze - poza tym, że jest, kurwa, płaska jak stół - lasy i dzikie ostępy, do których normalnie nie powinno się wchodzić, chyba że jest się harcerzem, zawodowym leśnikiem albo jednym i drugim. Żadnej z tych grup nie mamy w wystarczającej liczbie, ale dzięki połączeniu naszego szkolenia z bezlitośnie dużą liczebnością komunistów możemy spróbować stworzyć własnych profesjonalnych szyszkojadów. Byli jeszcze myśliwi, ale nie słyną oni z celnego strzelania, a ja mam już serdecznie dość słuchania o kolejnych przypadkach ostrzeliwania własnych ludzi. Jeśli uda nam się stworzyć profesjonalną piechotę leśną, to w najlepszym przypadku zobaczymy, czy niektórych z nich da się jeszcze uratować przed komunistyczną trucizną zalegającą w ich czaszkach, a w najgorszym - cóż, misje samobójcze istnieją nie bez powodu. Tak czy inaczej, dla nas to czysty zysk, a przy okazji będzie to dziedzina, w której możemy popisać się naszymi możliwościami przed osłami z Politbiura."
DGR_restore_the_commandos_nc: "Przywrócenie Komandosów"
DGR_restore_the_commandos_nc_desc: "W końcu, po Bóg jeden wie jak długim czasie, moje starania o zdobycie większych funduszy dla sił specjalnych przyniosły efekty i możemy teraz utworzyć nasze brygady komandosów z udziałem wszystkich zainteresowanych. Od naszych, jak zawsze, będących u szczytu formy rangerów, przez wątpliwie potrzebną, ale przynajmniej skuteczną piechotę morską, aż po nawet tych tępych jak cegła spadochroniarzy - każdy dostał swoje miejsce. Gdyby ci idioci posłuchali mnie wcześniej, naturalnie moglibyśmy osiągnąć znacznie więcej niż teraz, dysponując podwyżką finansowania na poziomie konkurującym z miesięczną pensją miejscowego dozorcy. Nieważne. Liczy się to, że mamy idealny obiekt do tego celu. No bo - Lubliniec? Halo? Jednostka Komandosów? Już ich pokonaliśmy, a poza walką z partyzantką, którą wystawili przeciwko nam po podboju, nie zrobiliśmy z tym absolutnie nic. Musimy przestać jęczeć o dawnych urazach czy jakimś reakcyjnym gównie i ponownie otworzyć tę jednostkę wraz z całym garnizonem."
DGR_special_industrial_group_nc: "Specjalna Grupa Przemysłowa"
DGR_special_industrial_group_nc_desc: "Czy ja jestem tutaj jedynym zdrowym na umyśle człowiekiem który pamięta bitwę o Azowstal? O lotnisko w Doniecku? O cholernych walkach o fabryki w Stalingradzie? Wojna się zmieniła, a tereny przemysłowe są najbardziej dogodnymi do obrony punktami strategicznymi. Oczywiście jeśli już znajdą się na linii frontu i nie mają jak produkować rzeczy które normalnie robili. To na takich właśnie operacjach polegających na infiltracji i przełamywaniu fortyfikacji terenów przemysłowych powinniśmy się skupiać a nie cudować z lotnikami czy marynarzami. Bo takie walki będą nas czekały prędzej czy później. A dotychczasowe doświadczenia pokazały nam że nasze wojska w ogóle nie są przygotowane na tego rodzaj operacji."
DGR_urban_sabotage_battalions_nc: "Bataliony Sabotażu Miejskiego"
DGR_urban_sabotage_battalions_nc_desc: "Wojna obecnie przypomina troszkę średniowieczną. Już tłumaczę - można sobie jeździć i zdobywać wsie, pola i inne nic nie znaczące lasy i bagna, armia sobie przejdzie, zrobi co swoje i potem nagle trafi na wielki ufortyfikowany zamek który musi oblegać. Bo miasta obecnie w doktrynie wojskowej pełnią rolę właśnie takich fortec które są okropnie ciężkie do zdobycia. Nie potrzebują oni wcale murów jeśli z każdego okna można wystawić karabin maszynowy a z każdego balkonu może na Ciebie spaść granat czy butelka z benzyną. Plus jest taki że chaos i tłok może działać również na naszą korzyść. Wystarczą odpowiednie oddziały dywersyjne które wysadzą parę kluczowych punktów w mieście, a inne zakradną się tunelami i wyjdą w samym sercu miasta siejąc chaos. Tylko to trzeba też potrafić a nie rzucić ludzi na pożarcie i niech się dzieje co chce. Zwykły żołdak tego nie zrobi, tu potrzeba odpowiednio wyposażonych i wyszkolonych batalionów sabotażystów miejskich."
DGR_blue_berets_nc: "Niebieskie berety"
DGR_blue_berets_nc_desc: "\"Formoza\", nazwana na cześć popularnej torpedowni u wybrzeży Gdyni, była jednostką polskich nurków-dywersantów działającą w ramach Marynarki Wojennej Polskiej Rzeczypospolitej Ludowej. Choć nasze uzależnienie od Marynarki Wojennej jest niewielkie w porównaniu z innymi rodzajami sił specjalnego przeznaczenia, ich doświadczenie i potencjał na przyszłość jak dotąd w pewnym stopniu to rekompensują. Z tego powodu odtworzenie tej formacji, a także piechoty morskiej, oraz zapewnienie im odpowiedniego finansowania jest, zdaniem Komitetu Centralnego, właściwym kierunkiem działania. Przy odpowiednim wsparciu, kto wie - może te stare gąbki mają rację i nowe siły morskie wcale nie okażą się stratą czasu. Oczywiście nie chodzi o to, że dostaniemy od ręki całą Formozę wraz z jej personelem. Własną jednostkę będziemy musieli stworzyć sami. Ale przysięgam, jeśli znowu nazwą ją na cześć Pogorii, to chyba kurwa oszaleję."
DGR_national_unity_front: "Front Jedności Narodowej"
DGR_national_unity_front_desc: "Och, ale się boją. Jedna malutka próba prawdziwej rewolucji i Ci tchórze już się kryją po dziurach by uciec przed burzą. Mieliśmy tutaj dobrze. Pozbyłbym się każdego jednego zdrajcy, każdego jednego zagrożenia dla wyzwolenia ludu. Ale oczywiście, siły reakcjne musiały przyjść i zepsuć wszystko swoim pudrowaniem trupa. Front jedności... jedności..., tak naprawdę to próbują nas rozcieńczyć na tle rewizjonistów, faszystów społecznych i bezużytecznych aparatczyków. Zrobią doprawdy wszystko by uratować swoje pierdolone łby przed zatknięciem ich na bagnetach. Myślą, że mogą nas zatrzymać. Że mogą zatrzymać MNIE. Durnie. Pokazali swoje prawdziwe oblicze. Zniszczyymy ich od środka, a gdy już skończymy - moja lista stanie się o wiele, wiele dłuższa. Nie mogą odwrócić tego co już się rozpoczęło. Rewolucja przyjdzie po nich wszystkich!"
DGR_security_committee_nc: "Komitet Bezpieczeństwa"
DGR_security_committee_nc_desc: "Życie jest niczym bez bezpieczeństwa. Jasne, z zewnątrz wszystko może wyglądać zupełnie normalnie; możesz mieć pracę, rodzinę, poukładane życie, ale nieustannie gryząca cię myśl, że wszystko to może runąć przez działalność kilku... niepożądanych elementów w końcu doprowadzi cię do szaleństwa. Chcę jedynie zdjąć ten ciężar z barków ludu - zająć się jego problemami, żeby mógł cieszyć się życiem z beztroską, której \"wolność\" nigdy nie będzie w stanie zapewnić. Bo wolność bez bezpieczeństwa... cóż, to po prostu anarchia, a na to nie możemy sobie pozwolić. Przyznanie państwu monopolu na przemoc gwarantuje, że pozostanie ona poza głowami zwykłych ludzi. Nie ma więc czym się przejmować."
DGR_progressive_juvenile_prisons_nc: "Postępowe zakłady karne dla młodocianych"
DGR_progressive_juvenile_prisons_nc_desc: "Ach, młodości piękna. To były czasy. Wciąż pamiętam je wyraźnie. Wystarczyło wtedy, że całą twoją ideologią było \"zbuntuj się przeciw systemowi i rozwal po drodze tyle, ile się da\". Nic więcej człowiek nie potrzebował. Nasi nastolatkowie nie różnią się dziś zbytnio. Przyszłość narodu. Ta, jasne. Aparatczycy chcą zrobić z nich wzorowych obywateli, ale wszyscy wiemy, jak to się skończy. To buntownicy, przekorni gówniarze - płonący żywym ogniem nieustannej wściekłości, których nie da się po prostu wcisnąć w szkolny mundurek i kazać im opowiadać partyjnym dygnitarzom o swoich osiągnięciach naukowych. Narodowa Armia Ludowa regularnie otwiera przed nimi swoje szeregi, ale możemy zaoferować ujście tylko tym, którzy są gotowi współpracować. Resztę trzeba będzie złamać. Przekształcić ich na nowo, zaszczepić właściwe wartości, żeby ich gniew służył sprawie rewolucji. Niektórych najpierw trzeba będzie złamać trochę bardziej..."
DGR_recreate_ormo: "Odtworzenie ORMO"
DGR_recreate_ormo_desc: "No proszę, wygląda na to, że nie jesteśmy już jedynymi egzekutorami prawa w okolicy. Partia najwyraźniej miała już dość ciągłego bezprawia na ulicach i postanowiła dołączyć do zabawy w pacyfikowanie hołoty. Lepiej byłoby trzymać to wszystko we własnych rękach, ale cóż, awanturników jest tu pod dostatkiem. Dzięki temu możemy skupić wzrok na większej nagrodzie - prawdziwych bitwach, które dopiero trzeba stoczyć, zamiast oddelegowywać połowę personelu Armii do roboty policyjnej. Szczerze mówiąc, na tym etapie jakiś strajk czy dwa byłyby wręcz mile widziane. Chętnie zobaczyłbym, z czego ci goście są zrobieni i sprawdził, czy te pałki służą do czegoś więcej niż machania nimi dla picu. Jedyne, co mnie martwi, to ten cały cholernie dobry sprzęt, który do nich płynie. Niektórych rzeczy nawet my nie dostajemy. Jeśli to nie jest odsuwanie nas na boczny tor, to ja już nie wiem, co nim jest. Dla ich własnego dobra lepiej, żeby tak nie było."
DGR_administration_committee_nc: "Komitet Administracji"
DGR_administration_committee_nc_desc: "Szczerze mówiąc, mamy już dość tego administracyjnego przerostu. Przepisy, regulaminy, równoległe systemy... wszystko istniejące wyłącznie po to, żeby pompować ego bezdusznej klasy biurokratycznej, która trzyma się resztek znaczenia tylko dlatego, że jej przedstawiciele są jedynymi ludźmi w kraju zdolnymi jeszcze czytać i interpretować tysiące drobnych zapisów, które sami stworzyli, żeby utrudnić życie niewtajemniczonym. W efekcie masz całe góry papierów potrzebnych do załatwienia jednego, pierdolonego odstępstwa, które można by ogarnąć w pięć minut, gdyby nie fakt, że wszystko musi być zgodne z jakimś przepisem pamiętającym czasy siedmiu pokoleń wstecz. System potrzebuje bezpośredniego wstrząsu. I nie jednego. Trzeba nim potrząsać za każdym razem, gdy zaczyna czuć się zbyt wygodnie, za każdym razem, gdy zaczyna twardnieć i kostnieć, żeby pozostał stały tylko w swojej zdolności do ciągłego przeobrażania się. Rozwalę biurokrację w pizdu, żeby kiedy trafi do niej jakikolwiek wniosek, to nie musiał być formowany pod proceduralną sztancę. To system ma przyjąć jego kształt i zrobić mu miejsce, żeby mógł przejść."
DGR_establish_the_federation_council: "Ustanowienie Rady Federacji"
DGR_establish_the_federation_council_desc: "Decentralizacja władzy w chwili gdy najbardziej potrzeba jednej silnej ręki do poprowadzenia narodu ku zwycięstwu jest oczywiście rozwiązaniem godnym kretynizmu ostatecznego. Władza w ręce rad! No przecież, demokracja tak bardzo dobrze działa, nawet ta socjalistyczna że tylko doprowadza do upadków państw. Na szczęście, Rada Federacji to będzie zaledwie organ doradczy bez większych uprawnień normalnej egzekutywy. To na to miast rodzi jednak kolejne, zasadnicze pytanie: Po jakiego chuja?\n\nCzy my udajemy że to robimy, czy jednak to robimy? Regionalne władze będą miały reprezentację na szczeblu centralnym, ale po co, skoro i tak mają samorządy do tego? Co tak naprawdę mają robić oprócz zajmowania stołków i przytakiwaniu Politbiuru? Szczególnie jeśli będą oni z nadania centralnego, to ma to taki sens jak ofensywa zimowa na Moskwę. Bo przecież, nie zrobią wyborów do rad.\n\nPrawda?\n\nPRAWDA?"
DGR_ministry_of_recovered_territories_nc: "Ministerstwo Ziem Odzyskanych"
DGR_ministry_of_recovered_territories_nc_desc: "Ziemie, które wyzwalamy, są pełne zdradzieckich nędzników nieustannie czekających na porażkę naszego ruchu. W najlepszym razie biernie nami gardzą. To jestem jeszcze w stanie tolerować. Prawdziwym problemem są ci, którzy chwytają za broń. Jasne, okazjonalne powstanie to ledwie niedogodność. Dla żołnierzy to nawet dobre ćwiczenie - człowiek nie sztywnieje między kolejnymi kampaniami. Ale choć kij jest świetnym narzędziem, nawet on łamie się, jeśli używa się go zbyt często. Czasem marchewka również się przydaje. Ludzie mogą nienawidzić wszystkiego, co reprezentujemy, ale jeśli uwierzą, że jesteśmy jedyną drogą do przywrócenia stabilności w tym przeklętym kraju, jedyną siłą zdolną naprawdę coś zmienić na lepsze, to prędzej czy później nauczą się zamknąć mordy i podporządkować programowi partii."
DGR_civilian_corps: "Korpus Cywilny"
DGR_civilian_corps_desc: "W środku rewolucji nie ma czegoś takiego jak cywil. Wszyscy jesteśmy walczącymi, w taki czy inny sposób. Czy siedzisz w klasie, pracujesz w szpitalu, czy gnijesz w jakimś wilgotnym, słabo oświetlonym biurze, nadal jesteś częścią awangardy. Dlatego potrzebujemy tam żołnierzy, a nie mdłych urzędasów, którzy może i potrafią wyrecytować teorię, kiedy trzeba, a także mają bezpośredni rozkaz służyć partii i tylko partii, ale nigdy w życiu nie zobaczyli nawet kawałka prawdziwej walki. Ich chronione przed światem, śliczne mordy traktują swoją misję jak kolejną biurokratyczną dyrektywę. Lista ideologiczna mówi, że należy promować określone wartości, więc będą te wartości promować. Poza tym są pustymi skorupami, których zapał ogranicza się do odgrywania odpowiedniej roli. Takie stanowiska powinny być zarezerwowane dla tych, którzy walczyli na pierwszej linii i ryzykowali życie za to, w co rzekomo wierzą."
DGR_invest_in_public_healthcare_facilities: "Inwestycje w publiczną służbę zdrowia"
DGR_invest_in_public_healthcare_facilities_desc: "Medyczna kasta od zawsze miała skłonność do bawienia się w Boga - decydowania, kto będzie żył, a kto umrze bez opieki, kiedy przestanie dostarczać systemowi pieniędzy. A nawet wtedy pewnie wycisnęliby z niego jeszcze więcej w jego ostatnich dniach. W kapitalistycznym systemie finansową motywacją lekarza jest utrzymywanie pacjenta w chorobie tak długo, jak tylko jest to realistycznie możliwe. W końcu wyleczony pacjent oznacza utratę kolejnego źródła dochodu. Medycyna powinna być służbą. Koniec z napompowanymi pensjami i przytulnymi prywatnymi gabinetami - zamiast tego ma być ciężka, pełna wyrzeczeń praca dla dobra narodu. Nieliczni lekarze, którzy przystosują się do tego niewybaczalnego braku szacunku, jakim jest zwyczajne zmuszenie ich do wykonywania swojej cholernej pracy, będą mogli zachować stanowiska. Ale jeśli zobaczymy choćby najmniejszy przejaw próby niesprawiedliwego czerpania zysków z ich pracy ponad pensję zapewnianą przez państwo, ich licencje zostaną bezpowrotnie odebrane z powodu moralnego bankructwa. Aż pozostaną tylko ci, którzy naprawdę czują powołanie."
DGR_expand_social_welfare_programs: "Poszerzanie programów socjalnych"
DGR_expand_social_welfare_programs_desc: "To że podążamy kultem robotniczym nie zmienia sytuacji że niektóre jednostki po prostu nie są w stanie być produktywni, ale zamiast kapitalistycznego darwinizmu społecznego proponujemy rozwiązania humanistyczne - poszerzenie świadczeń socjalnych dla najbardziej potrzebujących. Nie powiem że nie jest to zdanie z którym bym się jakoś kłócił okrutnie...ale. Ale czy na pewno teraz jest odpowiedni moment na wydawanie pierdyliarda złotych na programy społeczne, skoro walczymy o własne życie na frontach wojny domowej?\n\nJak parę osób pomieszka na ulicy do końca wojny to nic się nie stanie wielkiego. A wolę żeby moi żołnierze mieli z czego strzelać niż żeby pijakom było cieplej. Bo oni nie zbudują nowego kraju, a Ci którzy o niego walczą - właśnie to robią"
DGR_energy_committee_nc: "Komitet Energii"
DGR_energy_committee_nc_desc: "Sektor energetyczny zarządza kluczowymi zasobami strategicznymi które muszą pozostać pod kontrolą państwową. Nie po to wyrwaliśmy go z parszywych rąk oligarchów by im go po prostu oddać. Zamiast tego, wydaje im się że mogą nas przymusić do kupowania energii na rynkach globalnych, robiąc z Polski kolejną marionetkę. A jeśli się sprzeciwimy, zaraz zagrożą nam odłączeniem. Nie, nawet nie zamierzam myśleć o sprzedawaniu naszej niezależności. Wolałbym samemu ciągnąć czołgi na linię frontu niż miałyby one tam dojechać na zagranicznej ropie. Nasze zasoby węgla są co prawda trochę nadwyrężone, a technologie źródeł alternatywnych zaniedbane, ale niech tak będzie. Zanim nasza sieć energetyczna nie będzie gotowa, będziemy zaciskać pasa. Możemy...no nie wiem, walniemy jakieś solary na Pustynie Błędowską czy coś. Rozbudujemy elektrownie. Z resztą, to nie jest moja robota by to rozkminiać. Po coś mają ekspertów od tego."
DGR_open_up_to_alternative_power_sources: "Otwarcie na alternatywne źródła energii"
DGR_open_up_to_alternative_power_sources_desc: "Chcecie wiedzieć co myślę o tak zwanej 'Energii Alternatywnej'? Spoko. To jest jeden wielki przekręt. Ogromny i nieefektowny wałek wciskany nam przez zachodnie liberalno-banksterskie elity by wyciągnąć kasę od bezmyślnych inwestorów. A wszystko dlatego bo o jejku, planeta płonie i jedynym sposobem na jej uratowanie jest wpompowanie miliardów w pierdolone duże wiatraki. Ale nie, oczywiście - właśnie w to musimy brnąć. Bo właśnie tego według 'ekspertów' z Komitetu potrzebujemy. Witamy w Polscę zasilanej energią żywiołów oraz nadziejami i marzeniami ekologicznych świrów. Przysięgam, nawet niech nie próbują budować tych swoich srOZE w pobliżu naszych baz. Bo może się stać że ojojojoj, przypadkowo podczas treningu jakiś pocisk rozwali go w pizdu. No chyba że jakimś cudem uda im się zbudować reaktor atomowy; tego lepiej będzie nie wysadzać."
DGR_union_of_the_hard_coal_nc: "Wspólnota Węgla Kamiennego"
DGR_union_of_the_hard_coal_nc_desc: "Tak między nami to uważam, że górnicy są jeszcze bardziej nieznośnymi mendami niż ekolodzy. Przysięgam, Ci ludzie jedyne czego chcą to tylko więcej przywilejów; chcą być traktowani jako elita społeczeństwa tylko dlatego że łażą i machają kilofami. Ci bezmyślni robole myślą że są królami, jednocześnie żyjąc w warunkach gorszych niż niewolnicy. Ci drudzy przynajmniej mogą się nasłonecznić. Nie możemy pozwolić żeby taka żałosna klasa nami pomiatała. Cele wydobycia będą ustalane centralnie, tak samo jak cała administracja istniejących kopalni. Jeśli się górnikom to nie podoba, mogą sobie zrobić związek zawodowy i wspólnie wygłaszać swoje żale. Co prawda mogą to zrobić tylko w państwowym związku gdzie wygłaszać mogą jedynie swoje uwielbienia dla państwa ludowego, jako że zakazaliśmy niezależnych związków. Ze względów historycznych. Górnicy niedługo zrozumieją że ich miejsce jest pod ziemią i nie powinni wyściubiać znad jej poziomu nosa."
DGR_ideological_committee_nc: "Komitet Ideologiczny"
DGR_ideological_committee_nc_desc: "I to ma być broń, którą próbują z nami walczyć? Broszury? Ulotki? Godziny obowiązkowych zebrań, podczas których analizują swoją \"doktrynę\", jakby była jakimś niepodważalnym religijnym dogmatem? Jakby magiczne, kurwa, ustępy z jakiejś stuletniej książki miały przywołać ezoteryczną siłę czystego komunizmu, a ludzie mieli wreszcie stać się wolni dopiero wtedy, gdy cała sala uwierzy w nią z jednakowym fanatyzmem. Kraj wciąż cierpi pod jarzmem żydowsko-kapitalistycznych wyzyskiwaczy, ale nieee, marnujmy czas na jakieś kółka dyskusyjne! Musimy działać. Lud musi walczyć. Walka trwa i nie pozwolę jej uśpić tylko dlatego, że kolejna ewolucja dinozaurów kurczowo trzyma się swoich ulubionych wykładów. Poślemy tam kilku mało znaczących figurantów, ale kierownictwo nie da się odciągnąć od spraw istotnych przez te ideologiczne bzdury."
DGR_office_for_religious_affairs: "Urząd Spraw Religijnych"
DGR_office_for_religious_affairs_desc: "Wreszcie nadszedł czas, by zmiażdżyć największego reakcyjnego kolosa w całym kraju. Pasożyta wysysającego krew z polskich chłopów od całego tysiąclecia. Ośrodka, wokół którego gromadzi się każdy kontrrewolucyjny dysydent. To hańba, że tak długo pozwalaliśmy Kościołowi na samowolkę. To się teraz zmieni. Oficjalne wytyczne partii brzmiały: \"Dopilnujcie, żeby wiedzieli, że mają trzymać język za zębami\". Och, zrobimy znacznie więcej. Odbierzemy każdy cenny przedmiot zagrabiony ludowi! Wymierzymy sprawiedliwość za stulecia wyzysku! Sprawimy, że księża pożałują, że odważyli się choćby pisnąć słowo przeciwko naszemu ruchowi! A jeśli staną nam na drodze, jeśli zechcą doczekać się kolejnego pokolenia męczenników, to im ich dostarczymy! Jeśli partia chce przejąć kontrolę nad Kościołem, dopilnuję, żeby nie zostało w nim nic, co mogłaby kontrolować."
DGR_myth_of_the_prl: "Mit PRLu"
DGR_myth_of_the_prl_desc: "Dawne czasy... Chodzące skamieliny z partii ciągle do nich wracają, jakby wspominały jakąś utraconą komunistyczną utopię. „Każdy dostał mieszkanie od państwa, a do tego jeszcze darmowy samochód...\". \"Wiecie, towarzyszu Bargieła, wtedy żyło się o wiele lepiej...\". Nie, nie pamiętam tamtych czasów, ale im częściej to powtarzają, tym mniej chce mi się w to wierzyć. Jeśli naprawdę było tak wspaniale, dlaczego ta rzekomo chwalebna Polska Rzeczpospolita Ludowa upadła? I dlaczego pozwolili jej upaść? Czemu nikt nie bronił socjalistycznego raju do ostatniej kropli krwi, gdy kapitalistyczni łupieżcy zapukali do drzwi? Nostalgia to słabe narzędzie, żałosne wręcz. Reakcjoniści mają ją zawsze pod ręką i wykorzystują, by odwrócić każdy prawdziwy postęp. Jakże żałosne, że i my daliśmy się jej usidlić."
DGR_intelligence_committee_nc: "Komitet Wywiadu"
DGR_intelligence_committee_nc_desc: "Na pierwszy rzut oka powołanie scentralizowanego komitetu wywiadu to rzadki krok we właściwym kierunku. Otaczają nas zdrajcy, zarówno na zewnątrz, jak i w naszym własnym kręgu. Musimy wiedzieć, które z tych małych łasic przekazują informacje o naszych posunięciach światowej kapitalistycznej klice, tylko czekającej na okazję, by zniszczyć postępy w wyzwalaniu polskiego ludu. Czego naprawdę nie potrafię pojąć, to dlaczego głosowali za tym, by odebrać kontrolę nad taką instytucją jedynej organizacji, której lojalność nie budzi żadnych wątpliwości? Wiedzą, że wojsko szybko rozprawiłoby się ze zdrajcami, a mimo to wolą pozostawić komitet w rękach partyjnych aparatczyków. Może mają coś do ukrycia? Jakieś podwójne lojalności, o których nie chcą, żebyśmy się dowiedzieli? Nawet bez tych narzędzi wojsko przeprowadzi własne śledztwa, a jeśli znajdziemy choćby strzępek kompromitujących materiałów na temat naszych tak zwanych \"towarzyszy\", osobiście postawię ich przed trybunałem!"
DGR_secret_collaborators_on_every_street: "Tajni współpracownicy na każdym kroku"
DGR_secret_collaborators_on_every_street_desc: "Rozmieścili swoich ludzi dosłownie wszędzie. Myślą, że mogą się ukryć, ale ja ich widzę. Trudno ich nie zauważyć, skoro zawsze ktoś kręci się w pobliżu. Po cywilnemu, siedzą godzinami na tych samych ławkach, udając, że czytają \"Trybunę\". Zawsze \"Trybunę\", z jakiegoś powodu, jakby była standardowym wyposażeniem służbowym. I właśnie to zaczyna człowieka dopadać. Myślisz, że dobrze rozgryzłeś sytuację, że wiesz, kto jest kim i kiedy można bezpiecznie powiedzieć, co naprawdę myślisz, ale za każdym razem okazuje się, że jest jeszcze ktoś, o kim nie pomyślałeś. Ktoś, kto podsłuchuje. Ktoś, kto się kręci i węszy. Czuję, że mnie obserwują ze szczególną uwagą. Ktokolwiek kieruje nowym komitetem wywiadu, musi należeć do tej samej frakcji, która uważa nasze ambicje za \"problematyczne\". Wygląda na to, że szukają każdego przejawu odejścia od linii partii. Jakiegokolwiek pretekstu, żeby się na mnie rzucić. Nie dam im tej okazji."
DGR_foreign_tech_espionage: "Zagraniczne szpiegostwo technologiczne"
DGR_foreign_tech_espionage_desc: "Ostatnio moje siły otrzymały całą serię nowych projektów - plany przekazane przez Komitet Wywiadu. W kilku kluczowych miejscach poprawiono oryginalne schematy, żeby ukryć to, co aż nazbyt oczywiste. To, co mi dają - rzekomy \"skok technologiczny w sektorze wojskowym i cywilnym\" - to nic innego jak kradziony sprzęt. Czy oni są aż tak nieudolni, że potrafią jedynie małpować innowacje naszych wrogów?! Gdzie ich duma narodowa? Jak polski lud ma osiągnąć samowystarczalność, jeśli odmawiamy rozwijania własnego zaplecza technologicznego? I jaki niby mają plan na później, co? Odbijemy kraj, a potem co? Będziemy błagać zagranicznych przemysłowców, żeby nadal dzielili się z nami swoimi nowymi projektami, bo inaczej nie mamy szans dotrzymać im kroku? Zmuszą nas do zrzeczenia się naszych praw, naszej niepodległości... a z czasem znów staniemy się ich niewolnikami."
DGR_media_committee_nc: "Komitet Mediów"
DGR_media_committee_nc_desc: "Kontrola nad mediami. Wreszcie coś, co mogę poprzeć. Przez dziesięciolecia polski lud był wystawiony na nieustanny zalew kłamstw szerzonych przez stacje finansowane przez światowy kapitał. Wpojono mu tyle propagandy, że ten materialistyczny, skrajnie indywidualistyczny porządek świata stał się dla niego normą, filtrem, przez który postrzega każdą z naszych polityk. Większość moich rodaków wciąż walczy przeciwko naszej rewolucji. Nasze miasta pełne są cichego oporu. Odzwyczajenie mas od tego sposobu myślenia będzie wymagało kolosalnego wysiłku, ale młot prawdy w końcu rozbije tę iluzję. Damy im właściwy punkt widzenia, na który zasługują, choć jeszcze nie wiedzą, że go potrzebują. Uczynimy z nich wzorową awangardę proletariatu. Damy im prawdę. Naszą prawdę. Jedyną prawdę."
DGR_supreme_censor_office_nc: "Supreme Censor Office"
DGR_supreme_censor_office_nc_desc: "Wywrotowcy myślą, że są sprytni, przemycając swoje doktryny w zwykłej literaturze. Ujawniono już wielu autorów i wydawców jako elementy kontrrewolucyjne, ale nowe dzieła wciąż trafiają do obiegu niczym chwasty próbujące zarosnąć cały ogród. Reagowanie dopiero po publikacji nie wystarcza. Do tego czasu szkody będą już wyrządzone. Jedynym sposobem na odzyskanie kontroli nad przekazem jest cenzura prewencyjna. Już słyszę te wszystkie narzekania na rzekome ograniczanie wolności słowa, ale jeśli naprawdę tak bardzo zależało im na wolności słowa, to może powinni byli... sam nie wiem, przestać oblepiać propagandą każdą książkę, którą wydają? Co wy na to? Dzieła, które okażą się apolityczne, nadal będą dopuszczane do publikacji. W gruncie rzeczy wyświadczamy czytelnikom przysługę, odsiewając ten cały chłam."
DGR_reinforce_the_state_media_monopoly: "Zakopywanie dziury informacyjnej"
DGR_reinforce_the_state_media_monopoly_desc: "Ludzie powinni się cieszyć, że postanowiliśmy przywrócić powszechny dostęp do internetu. Nie ma tutaj co się obrażać na to, że media społecznościowe były katastrofą dla rodzaju ludzkiego. Były, są i będą - to oczywiste. Natomiast musimy tutaj wykorzystać to co nam daje inwigilacja sieciowa. Dopuścić do użytku tylko odpowiednio zatwierdzone portale internetowe i kilka takich, które będą wprost reakcyjne. Dlaczego? Proste, jeśli odpowiednio skutecznie będziemy monitorować ruch internetowy, będziemy wiedzieć kto szuka jakich treści i ludzie sami złapią się w sieci. Hehe, w sieci.\n\nTak czy siak, to jest całkiem sensowna propozycja. Bałem się, że co najwyżej Politbiuro zdecyduje o zrobieniu własnych mediów społecznościowych jak gdyby to w ogóle miało prawo działać. Albo zrobiliby stronę internetową do wrzucania filmików propagandowych. Znając ich, pewnie nazwaliby to RedTube. Co byłoby po prostu idiotycznie zabawne."
DGR_equality_committee_nc: "Komitet Równości"
DGR_equality_committee_nc_desc: "Równość. To nie tylko dobrze brzmiące hasełko, którym można rzucać dookoła przed ludem. Ale to, czego Ci partyjni biurokraci nie rozumieją to że nie jest to jakiś pozbawiony emocji rytuał urzędniczy. Im się wydaje że jeśli zbierze się dobytek wszystkich w jedno miejsce a następnie zacznie wydawać z tego równe części każdemu obywatelowi, to wszystkie stare uprzedzenia znikną i wszyscy będą żyli szczęśliwi po wsze czasy. I to dokładnie jak to widzą - jako pierdoloną bajkę. Powiem wam czym naprawdę jest równość - to szansa by w końcu odegrać się na bogolach, na tych wszystkich dorobkiewiczach którzy wiecznie uważali się za lepszych tylko dlatego że ich rodzice wykorzystywali klasę robotniczą do pozyskania majątku. Równość to szansa by wedrzeć się na strzeżoną posesję która wiecznie raziła po oczach swoim przepychem gdy się ją mijało po drodze na swoje stare osiedle. Równość to szansa na przymusowe wyrwanie wszystkiego czego nam odmawianego. Tylko wtedy osiągniemy prawdziwą równość."
DGR_being_rich_is_being_enemy_nc: "Bogactwo to wróg"
DGR_being_rich_is_being_enemy_nc_desc: "Nie istnieje etyczny sposób na pozyskanie ogromnego majątku w systemie kapitalistycznych. Nie istnieje ktoś taki jak dobry milioner. Wszyscy mają swoje grzechy i nie zostaną zbawieni dzięki pojedynczemu aktowi charytatywności na pokaz raz na ruski rok, bo przecież spójrzcie, jacy oni wspaniałomyślni, łaskawy pan wykorzystuje nas przez 364 dni w roku ale w ten jeden dzień nieee, nagle stają się kurwa aniołkami i dają nam ochłapy żebyśmy mogli zamknąć mordy i wychwalać ich pod niebiosa. I to właśnie dlatego, bogaci - bez wyjątku - są jedynie bandą żałosnych pijawek tonących w dekadencji, sponsorowanej przez niegodnie opłacaną pracę klasy robotniczej. Bogacze to wrogowie. Wróć. Bogacz jest JEDYNYM WROGIEM. Zobaczymy jak się im spodoba odwrócenie ról. Zobaczymy jak sobie poradzą na katorżniczych szychtach na hucie. I tak w kółko, przez kilkaset kolejnych dni aż zobaczą jak to jest, harować jak prawdziwy robotnik za kilka bochenków chleba, flaszkę wódki i niczego więcej przez resztę swoich żałosnych żywotów."
DGR_state_homosexual_movement: "Państwowy Ruch Homoseksualistów"
DGR_state_homosexual_movement_desc: "Możesz sobie być geją, lezbijkiem czy jakim tam transatlantykiem, to już takie czasy są że muszą takie ludzie być. No dobra. Nie zrobimy wam tutaj żadnych prześladowań. Bez przesady, nie jesteśmy pojebami. Ale weźcie się zapiszcie do rejestru. Haha. Tak na wszelki wypadek. Musicie być zarejestrowani w oficjalnym ruchu. Nie nie, to tylko tak dla waszego dobra. To taki związek wasz zawodowy. Czemu te teczki są różowe? A czemu nie? Co, niefajny kolor?\n\nBardzo fajny. I generalnie jesteśmy bardzo zainteresowani debatą na temat inkluzywności, lubimy dyskutować otwarcie na temat naszych uczuć i upodobań, społeczeństwo musi takie być. Otwarte, gotowe na dyskusję i żeby każdy wiedział kto jest kim, i jakich zaimków chce używać. No przecież dlatego że nie możemy sobie pozwolić na zmisgenderowanie kogoś! A po cóż by innego?\n\nPo cóż doprawdy..."
DGR_curtailing_the_wolfpack: "Sidła na wilki"
DGR_curtailing_the_wolfpack_desc: "Wyłożę to jasno wszystkim w partii, którzy mogą myśleć inaczej: to WY jesteście na naszej łasce. Nie na odwrót. Jesteście tylko szarą, bezosobową masą, z góry nafaszerowaną ideologią, ale pozbawioną jakiejkolwiek treści. Nie macie nic do zaoferowania polskiemu ludowi. My, wyzwolone masy, chcemy wojny. Chcemy krwi. Chcemy zniszczyć globalistyczny system i rozszarpać jego twórców na strzępy. Rewolucja nadeszła, a ja stoję na jej czele, nie wy, banda pierdolonych, bezwartościowych biurokratów. Dokończę to, co zacząłem, z wami albo bez was, ale jeśli choćby pomyślicie o tym, żeby stanąć na drodze Narodowej Armii Ludowej, skończycie w tych samych masowych grobach co reszta naszych wrogów. Pilnujcie. Swojego. Miejsca. Mogę się was pozbyć dosłownie w każdej chwili. Czy wy możecie powiedzieć to samo o mnie? No właśnie, wątpię."
DGR_committee_for_military_urban_planning: "Komisja Wojskowego Planowania Miejskiego"
DGR_committee_for_military_urban_planning_desc: "Rozbudowa wojska zawsze powinna mieć pierwszeństwo przed sektorem cywilnym. Ze względów bezpieczeństwa narodowego, gdy tylko znajdziemy obiecujący teren, powinniśmy móc go przejąć i wybudować na nim dowolną niezbędną infrastrukturę. Więc dlaczego nagle musimy się użerać z PRZEPISAMI O ZAGOSPODAROWANIU PRZESTRZENNYM!? Dlaczego każdą nową budowę musimy uzasadniać przed jakimś urzędnikiem, a co jeszcze lepsze, dlaczego ten skurwiel w ogóle może powiedzieć \"nie\"? Co, mamy nie budować nowych koszar, bo jakiś urbanista zaplanował sobie w tym miejscu osiedle mieszkaniowe? Albo zrezygnować ze strzelnicy, bo jej skrajny róg ledwie zahacza o czubek wyznaczonego lasu? Może jeszcze powiedzmy to naszym wrogom, co? Wyjaśnijmy im, że jesteśmy dosłownie bezbronni, bo wokół zabrakło wolnego miejsca dla wojska. Niekompetencja. Po prostu kompletna niekompetencja."
DGR_expand_the_powers_of_internal_affairs_ministry: "Rozszerzenie prerogatyw Ministerstwa Spraw Wewnętrznych"
DGR_expand_the_powers_of_internal_affairs_ministry_desc: "Bezpieczeństwem wewnętrznym powinny zajmować się instytucje już odpowiedzialne za szeroko pojętą strategię obrony narodowej. Wojsko broni Polski zarówno przed zagrożeniami zewnętrznymi, jak i wewnętrznymi. To proste. To ma sens. Bez sensu jest natomiast wydzielanie części tych obowiązków i przekazywanie ich osobnej agencji. To krok w zupełnie złym kierunku. Ministerstwo Spraw Wewnętrznych powinno podlegać wojsku, a nie próbować stawiać się z nim na równi. Załóżmy, że oddamy część naszych uprawnień. Co się stanie, gdy zagrożenie obejmie obszary podlegające obu instytucjom? Łatwo sobie wyobrazić, jak nieskuteczne byłoby takie rozwiązanie, ale cóż, chodzi tylko o bezpieczeństwo narodowe, więc kogo to, kurwa, obchodzi? Chcą grać ostro? Ja też potrafię. Nie będę współpracował z siłami ministerstwa, nawet jeśli dostanę bezpośredni rozkaz z samej góry. Niech sami rozwiążą ten pierdolnik. Patrzmy, jak ponoszą sromotną klęskę, i poczekajmy, aż dotrze do nich, że jedynym wyjściem jest oddanie nam kontroli."
DGR_party_supervision_of_guard_units: "Nadzór partii nad jednostkami Gwardii"
DGR_party_supervision_of_guard_units_desc: "Rozrywają moją wspaniałą armię na strzępy! Tym razem dobrali się do Gwardii, jednych z moich najbardziej zasłużonych i lojalnych formacji. Zamiast zachować elastyczność operacyjną i wykorzystywać je zgodnie z potrzebami dowództwa centralnego, zostały okrojone i przerobione na niańki lokalnych partyjnych kacyków. Czy naprawdę nie przewidzieli, że ci hegemoniczni urzędnicy, zarządzający swoimi frakcjami jak zwykłe gangi, wykorzystają Gwardię jako własnych egzekutorów? A może nienawiść partii do wojska jest tak głęboka, że woli je całkowicie wykastrować? Co najgorsze, te jednostki nadal noszą nasze oznaczenia. Formalnie wciąż podlegają mnie. Za każdym razem, gdy któryś z tych drani nasyła Gwardię na przeciwnika politycznego albo wykorzystuje ją do wymuszania haraczy na ludziach, to Armia musi za to odpowiadać. Czasami nadużycia władzy są tak rażące, że można odnieść wrażenie, iż celowo próbują nas wrobić."
DGR_inspectorate_of_general_self_defense: "Inspektorat Generalnej Samoobrony"
DGR_inspectorate_of_general_self_defense_desc: "Nasz kraj jest na arenie międzynarodowej praktycznie pariasem. Cały globalistyczny porządek świata się nas boi, i to nie bez powodu. Nasza reputacja ma jednak dwie strony. Niemcy już pokazali, co robią, gdy polski rząd jednak ulega ich hegemonicznym ambicjom. Gdy ktoś odmawia podporządkowania się liberalnemu szaleństwu eurokratów. Znów dokonają inwazji, dlatego dobrze widzieć, że partia przygotowuje lud na to, co nieuniknione. Nawet nie zamierzam zgłaszać sprzeciwu. Uzbrojenie i wyszkolenie naszych obywateli ma tak kluczowe znaczenie, że nie chcę, by cały program upadł tylko dlatego, że nie potrafimy się zgodzić, kto ma go prowadzić. Jeśli naprawdę są w stanie wyszkolić miliony rezerwistów, jak twierdzą, niech tak będzie, pod warunkiem, że gdy nadejdzie inwazja, oczywiście przejdą oni pod kontrolę Armii. Dopóki mamy odpowiednią liczebność, nadrobimy ich marne przygotowanie."
DGR_abolition_of_general_privileges: "Zniesienie przywilejów generalskich"
DGR_abolition_of_general_privileges_desc: "Naprawdę mieli czelność powiedzieć mi, że żyjemy zbyt wystawnie. Że \"komuniście z legitymacją partyjną nie przystoi korzystać z luksusów niedostępnych klasie robotniczej\". Że oligarchów rozstrzeliwaliśmy za mniejsze przewinienia. Serio!? To ma być jakiś pierdolony żart!? Tak, mieszkam w miejscu może o dziesięć procent droższym niż przeciętny proletariusz. Ależ zbrodnia, kurwa. Czasami, od czasu do czasu, pozwalam sobie na odrobinę luksusu. Mam swoje sposoby, mam swoje kontakty. I co z tego? Wiecie dlaczego mogę sobie na to pozwolić? Bo każdego dnia ryzykuję życie dla tego przeklętego kraju. Spędzam dnie w jakichś rozwalających się koszarach, w błocie i nędzy, a oni tak mi, KURWA, odpłacają!? Niech się pierdolą, naprawdę. I tak biorę znacznie mniej, niż mi się należy."
DGR_supreme_audit_office_for_military_expenses: "Najwyższy Urząd Audytowy Wydatków Wojskowych"
DGR_supreme_audit_office_for_military_expenses_desc: "Maszyna musi iść i nie może się zatrzymywać. Oczywiście że do prowadzenia wojny potrzeba kasy! A do prowadzenia wojny totalnej potrzeba jej ogrom. I tutaj jest haczyk - musi ona płynąć natychmiastowo bo każdy dzień opóźnienia to kolejne setki ludzi ginących na froncie. Więc co robią sabotażyści? Wprowadzają biuro audytowe które ma na celu prześwietlać każdy jeden wydatek wojskowy! Jakby zgadzam się z tym że niektórzy przesadzają i więcej pieniędzy przeznaczają na swoje sztaby niż żołnierzy ale to co się teraz odpierdzieliło to przechodzi ludzkie pojęcie! Nasi żołnierze nie dostaną sprzętu bo kontrakty będą tkwiły na biurku jakiegoś pierdolonego urzędasa! Będziecie mieli krew na rękach. I oczywiście nie obejmuje to policji politycznej i służb bezpieczeństwa więc Ci będą sobie mogli bez problemu paradować z najnowszą bronią podczas gdy moi żołnierze zdechną w rowie ze starym kałachem w ręku! Kurwa mać..."
DGR_secret_files_357b: "Tajne akta 357/B"
DGR_secret_files_357b_desc: "Wszyscy wiedzieli i wiedzą, że komisarze gromadzili na wszystkich brudy. Oczywiście, że tak - na tym polega praktyka ograniczonego i wspólnego zaufania że ufamy sobie wzajemnie ale weryfikujemy. Więc nic dziwnego że znajdują się ogromne teczki w których...jest o wiele więcej prywatnych informacji niż bym się tego spodziewał i o wiele za dużo niż by mi się to podobało. Któryś ze skurwysynów nawet miał zarchiwizowany cały serwer Discorda na którym padało dość mnóstwo niewybrednych komentarzy na temat pewnych mniejszości.\n\nNie żebym się tego wypierał ale Szwejoidy na pewno nie odpuszczą takiej okazji by przygrzać mi i moim ludziom za najbardziej błahe rzeczy. Lepiej żeby nie istniała teczka ze wszystkimi tajnymi operacjami bo posypie się fala trupów z szafy.\n\nOh, kogo ja oszukuję - oczywiście że taka istnieje...trzeba zacząć urządzać ogniska czym prędzej."
DGR_pseudo_fascist_deviations: "Odchyły pseudofaszystowskie"
DGR_pseudo_fascist_deviations_desc: "Wszyscy, których nie lubię to faszyści. Taka dewiza od zawsze przyświecała lewicowcom o ilorazie inteligencji na poziomie grejpfruta. I zazwyczaj jak ich otworzyłeś to też byli czerwoni w środku. Nieważne. Na ostatnim gremium partyjnym wygłoszona została ogromna przemowa o odchyleniach pseudofaszystowskich które zagrażają czystości ideologicznej naszego państwa, bla bla.\nNie mogę słuchać tego pierdolenia bo wiem że chodzi im o mnie i moich ludzi. Tradycją najwyraźniej jest słuchanie o prawicowych odchyleniach w stosunku do patriotów w komunistycznej Polsce. Ale ja nie dam się odsunąć jak pospolitego zaplutego karła reakcji.\n\nJak chcą walki to ją dostaną."
DGR_high_inspectorate_of_ideological_discipline: "Wysoki Inspektorat Dyscypliny Ideologicznej"
DGR_high_inspectorate_of_ideological_discipline_desc: "Komisariat Ludowy z dniem dzisiejszym przestaje istnieć w swojej oryginalnej formie i staje się jedynie częścią nowego Wysokiego Inspektoratu Dyscypliny Ideologicznej (w skrócie WIDI). Jakby no wiecie...tęsknić nie będę bo z komisarzy zrobił się pierdolony krokodyl który pożre Ci całą rękę jak tylko wystawisz jeden palec. Ale nadal to byli moi ludzie (jeśli w ogóle pozostali lojalni). Inspektorat podobnie jak komisarze - będą dbali o to czy przestrzega się zasad marksizmu i socjalizmu, pierdolenie.\n\nTylko że oni faktycznie będą tego pilnować. Muszę skontaktować się z Zimmermannem. Na pewno ma jakiś plan zapasowy i siatkę ludzi gotową do działania. Nie mogę odwracać głowy gdy nas demontują krok po kroku ale za to niestety będę ją wsadzał prosto do gniazda szerszeni."
DGR_supreme_prosecutors_office: "Urząd Najwyższego Prokuratora"
DGR_supreme_prosecutors_office_desc: "Czas przywrócić sprawiedliwość pod skrzydła partyjne. Zbyt długo system sądowniczy zależał od wymysłów oficerskich, sprawiedliwość należy do proletariatu.\n\nSłucha człowiek takich rzeczy i mu się flaki w brzuchu przewracają jak można tak wprost srać na wszystko co do tej pory działało i było skuteczne. Wymysły oficerskie?! Jesteśmy w stanie wojny do ciężkiej cholery, oczywiście że sądy będą musiały działać w trybie wojennym i podporządkować się pod wyjątkowe kryteria jakie narzuca nam sytuacja. Ale nie, partyjniacy muszą mieć swoje stołki, muszą mieć poczucie sprawczości i muszą podkładać kłody pod nogi nam, wojskowym. Na każdym cholernym kroku.\n\nNiech lepiej nie wiedzą co będzie jeśli przestaniemy o nich walczyć."
DGR_commission_for_the_persecution_of_war_crimes: "Komisja do spraw Ścigania Zbrodni Wojennych"
DGR_commission_for_the_persecution_of_war_crimes_desc: "Oczywiście, nie może być tak, że oficerowie robią sobie na froncie co im się żywnie podoba. Do cholery, nie jesteśmy bolszewikami! A jednocześnie tak właśnie robią. No nie mówię, demonizowanie swojej własnej armii podczas gdy Polska jest jaka jest to jest wyższy poziom kretyństwa. Co prawda, te najgorsze uwagi krytyczne i wręcz nienawistne nie pochodzą oficjalnie od Politbiura ale komisja do spraw zbrodni wojennych?\n\nOni się nie hamują i naszych żołnierzy jednoznacznie uważają za morderców, przestępców i psychopatów. Wypadki się zdarzają, jesteśmy na wojnie. Rozliczać powinniśmy się po wojnie, gdy nie będzie już potrzebna stała mobilizacja! Cholera jasna, ja potrzebuję zabijaków bo to wróg ma umrzeć a nie my!\n\nA tak poza tym, ja nie mam pojęcia o jakie zbrodnie w ogóle chodzi! "
DGR_dismantle_the_inquisition: "Rozwiązanie Inkwizycji"
DGR_dismantle_the_inquisition_desc: "Koniec z Inkwizycją. Kolejny element układanki który składał się na ciężko wypracowany system który stworzyliśmy w siłach zbrojnych został odstrzelony decyzją partii. Komisja ds. Ścigania Zbrodni Wojennych wykazała szereg zbrodni popełnionych głównie przez jednostki które podlegały pod Inkwizycję i zakomenderowały Politbiuru natychmiastowe aresztowanie wszystkich głównodowodzących tymi jednostkami.\n\nCo z tego że część znajduje się na froncie. Co z tego że ja zeznawałem i obaliłem wszystkie zarzuty. I tak znaleźli sobie własną argumentację. A bo nazwa im się nie podoba, a bo to polityczna bojówka, a bo pogromy, a bo nieokrzesani i niezdyscyplinowani. Większość z tego to prawda oczywiście ale nie mogę przyznać im racji przecież.\n\nSzarejko się doigrał i normalnie byłoby mi z tego powodu wszystko jedno ale...eh, trzeba będzie się z nim przeprosić - muszę go jakoś wyciągnąć z tej celi."
DGR_keep_the_leadership_of_civilian_corps: "Ułaskawienie dla przywódców Korpusu Cywilnego"
DGR_keep_the_leadership_of_civilian_corps_desc: "Korpus Cywilny jakimś cudem przetrwał wszelkie możliwe czystki i ataki skierowane wobec ludzi związanych ze mną. Nie wiem czy to jest jakaś ironia losu czy niedopatrzenie ale wydaje mi się że po prostu chcą ich nastawić przeciwko mnie bo nie mają żadnych argumentów przemawiających za tym żeby ich rozwiązać. Są faktycznie przydatni i akcja przeciwko nim byłaby politycznym strzałem w kolano. Więc jątrzą. I kłamią. I manipulują. I rozpuszczają fałszywe plotki. I Marta w to uwierzyła bo nie chce ze mną nawet rozmawiać. A Marcin? Marcin zawsze przyciśnięty do muru wybiera własną skórę zamiast się za kogoś dać pokroić. Nie mogę się nawet temu dziwić, sam bym tak zrobił.\n\nWszystkich obrócicie przeciwko mnie? A może zaraz pojedziecie na pewne cmentarze i zaczniecie wywoływać trupy żeby tylko mi dopierdolić, co? \n\nJAK DALEKO SIĘ POSUNIECIE, TCHÓRZE?\n\nWALCZCIE ZE MNĄ OTWARCIE!"
DGR_hunt_for_the_young_wolves: "Obława na młode wilki"
DGR_hunt_for_the_young_wolves_desc: "Nawet mi się kurwa nie chce nic mówić.\n\nZwlekałem za długo. W końcu przyszli po nas wszystkich. I już nikomu nie było się odezwać. Po raz trzeci i mam wrażenie że ostatni, wszystko co swoją ciężką pracą zbudowałem zostało obrócone w proch. \n\nZabijcie mnie po prostu i spalcie bo nic już mi nie zostało."
DGR_principles_of_national_communism: "Ideały narodowego komunizmu"
DGR_principles_of_national_communism_desc: "Wyrok nie nadchodzi. Chyba tutaj posiedzę dłużej niż się spodziewałem. Docierają do mnie nawet wiadomości. Jest tak jak się spodziewałem. Banda klaunów z czerwonymi nosami próbuje ustalić jakie w ogóle są ich ideały. Kim jesteśmy i czego chcemy od świata? Narodowymi komunistami! Hurra! A co sobą reprezentujemy? BIEDĘ. I robotników. I naród. Narodowych robotników. Robotniczych narodowców. Ale bez faszyzmów. Bardziej komunistyczni niż narodowi. Ale nadal narodowi. Polska górą!\n\nRzygać się chce. A mi zarzucali że jestem tam tylko dla władzy i nie wierzę w żadne ideologie. To co to kurwa w ogóle jest? Ortodoksyjny amalgamat różnych zdań z kilku marksistowskich autorów, połowa z których przeczy sama sobie a jedna czwarta stoi w sprzeczności z prawem które sami sobie uchwalili. Ale dzielnie będą teraz szyli nowe sztandary i udawali że są kimś kim nie mogą być. Może i lepiej, że już nie muszę się pod tym podpisywać."
DGR_appeal_of_the_twenty: "Odezwa Dwudziestu"
DGR_appeal_of_the_twenty_desc: "Jestem tutaj kilka tygodni i nagle słyszę że wszystko zaczyna tu się powoli sypać. Gdyby nie fakt że prycza tutaj jest absolutnie tragiczna, powiedziałbym że bolą mnie żebra od śmiechu. Politbiuro ponoć panikuje bo okazuje się że gdy odbierzesz państwu żelazną rękę w postaci aparatu siłowego, to wszystkie męty społeczne wychodzą z kanałów na powierzchnię i zaczynają krzyczeć. I to głośno, bo przez ostatnie lata nie mogli nawet podnieść lekko głosu. A to hasła że opresyjna władza, tam że wolne media, tu odezwa profesorów, znowu zaś protest studentów, komitety demokratyczne. Zanim się wszyscy obejrzą i znowu będą albo wprowadzać stan wojenny albo padną pod naporem liberalnej hołoty.\n\nA niech płonie."
DGR_association_of_trade_unions: "Zrzeszenie Związków Zawodowych"
DGR_association_of_trade_unions_desc: "Teraz to już dostałem nawet po łbie od strażnika za maniakalne zanoszenie się śmiechem co rusz gdy dochodzą do mnie nowe informacje zza krat. Nie uwierzycie w to, bo nie można nawet czegoś takiego wymyślić.\n\nOtóż, powstało Zrzeszenie Związków Zawodowych pod wodzą Wałęsy.\n\nNo, tego młodszego Wałęsy ale coraz bardziej skłaniam się ku teorii że wszyscy żyjemy w jednej wielkiej symulacji i cała ta historia została napisana przez jakiegoś średnio rozgarniętego pisarza który nie rozumie że nie można po prostu wziąć czegoś co się już raz stało w rzeczywistości i po prostu ordynarnie zrobić to po raz kolejny ze zmienionymi nazwami i ludźmi. Wiem że historia lubi się powtarzać ale to już jest farsa. Tylko nie wiem gdzie oni znajdą stocznie w tym rozpieprzonym kraju. Najwyżej będzie skakał przez płot na Hucie Katowice."
DGR_dawn_of_communist_glory: "Świt komunistycznej chwały"
DGR_dawn_of_communist_glory_desc: "Dziad dopiął swego. Na gruzach reakcyjnej Rzeczpospolitej Polskiej, po trupach nacjonalistycznych działaczy narodziła się nowa Rzeczpospolita Ludowa. Chcą odtworzyć Związek Radziecki albo w ogóle pójść w światową rewolucję - cholera wie, tym kretynom jest w stanie do głowy przyjść cokolwiek. \n\nTo nie ma prawa przetrwać nawet kilku lat. Ja mam czas. A cierpliwi zostaną wynagrodzeni. Skoro nie mają nawet jaj żeby mnie zabić to ja już sprawię że się na nich to zemści.\n\nPoczekamy, zobaczymy."
DGR_eternal_watch_nc: "Wieczna warta"
DGR_eternal_watch_nc_desc: "Szwej nie żyje. SZWEJ KURWA NIE ŻYJE! Nareszcie ten pierdolony dinozaur zdechł. Byłaby to idealna okazja na przejęcie władzy, no ale...z celi więziennej chyba nie uda mi się zrobić przewrotu. Ale, ale - to nadal wspaniała wiadomość, Szwej był ostatnim guzikiem który spinał całe KPP ze sobą. Jestem praktycznie pewien że reszcie partyjnych towarzyszy nie uda się utrzymać tego molocha w jednym kawałku. A kiedy ten kraj po raz kolejny upadnie, będę w stanie odebrać co mi obca przemoc wzięła. Muszę tylko być cierpliwy."
DGR_state_funeral_nc: "Państwowy pogrzeb"
DGR_state_funeral_nc_desc: "Rząd organizuje pieprzony wielki pogrzeb dla Szweja. Nie wydaje mi się że po ostatniej próbie ucieczki strażnicy pozwoliliby mi tam pójść. Szkoda, bardzo chciałbym tam być my móc napluć mu w mordę ostatni raz. Przynajmniej mogę sobie popatrzeć przez kraty na przygotowania - kręcą się dookoła i chyba nawet rekrutują więźniów do pomocy przy przygotowaniach. Może jeśli bym się zgłosił...to mi pozwolą pójść? Wtedy mogłoby mi się udać zemścić za tę całą farsę z moim aresztowaniem."
DGR_extraordinary_federation_council_session: "Nadzwyczajna sesja Rady Federacji"
DGR_extraordinary_federation_council_session_desc: "Pogrzeb, pogrzeb i po pogrzebie. Tak zwana Rada Federacji zwołała nadzwyczajną sesję. Najprawdopodobniej będą rozmawiali o tym co dalej po śmierci Szweja. Ale co niby zrobią? Zawsze ich marginalizowaliśmy, a nie sądzę że nabrali jakiegokolwiek doświadczenia przez lata bycia pomagierami prawdziwego rządu. Słyszałem, że mają wybrać nowego pierwszego sekretarza, ale rada jest na pewno zbyt podzielona by kogokolwiek wybrać. Jeszcze kilka miesięcy a system w końcu walnie i wrócę do władzy."
DGR_the_little_constitution: "Mała Konstytucja"
DGR_the_little_constitution_desc: "Ponoć rada pisze nową konstytucję. Łał, nie wiedziałem że potrafią pisać. Na pewno powrzucają tam tak potrzebne sformułowania jak prawa LGBT czy coś w tym stylu, zamiast poważnych propozycji jak pozwolenie wojsku na wyznaczanie nowych pierwszych sekretarzy. No, ale nie wiem czy to cokolwiek by zmieniło bo komuchy oczyściły siły zbrojne ze wszystkich najbardziej doświadczonych ludzi i podmieniło ich na bezmózgie marionetki tylko po to by nas wkurwić. Ale zbaczam z tematu, nowa konstytucja nie pomoże w niczym na chaos po śmierci Szweja, także mój powrót jest już prawie potwierdzony."
DGR_little_thaw: "Mała odwilż"
DGR_little_thaw_desc: "Słucham? Że rząd zadecydował że wszyscy moi doświadczeni i lojalni generałowie są pierdolonymi zdrajcami narodu? Serio? Próbują zrzucić wszystkie swoje niepowodzenia na nas, a to przecież oni je spowodowali! I wisienka na torcie - ja też tam jestem, zdrajca. Ja, największy patriota tego kraju. Znaczy, cholera - spodzie4wałem się tego, jako że komuchy nienawidzą każdego kto kocha swój kraj. Wolą awansować ludzi którzy nawet nie przysłużyli się do zwycięstwa. Cóż, mam nadzieję że ludzie zorientują się kto tak naprawdę jest zdrajcą narodu i wstawią się za mną."
DGR_economic_consolidation_plan: "Plan gospodarczej konsolidacji"
DGR_economic_consolidation_plan_desc: "Rząd ostatnio zdecydował się na rozpoczęcie 'Planu gospodarczej konsolidacji'. Jakby to miało magicznie rozwiązać wszystkie problemy tego kraju. Widzę w tym wszystkim ich spisek, widzę po co to zrobili - by tymczasowo zaspokoić potrzeby przeciętnych ludzi. To nic innego jak populistyczna zagrywka. Mimo to, oznacza to jednak że muszą się liczyć z ludźmi i ich niezadowoleniem. Łącząc kropki ze sobą można dojść do wniosku że rząd zaniedługo wykituje i mój czas nastanie. Chciałbym to skonfrontować z rzeczywistością, ale niestety - nie mam dostępu do zbyt wielu ludzi z poziomu mojej celi. Ale jestem pewny, że to musi być prawda."
DGR_new_leader_of_the_soviet_state: "Nowy lider państwa sowieckiego"
DGR_new_leader_of_the_soviet_state_desc: "Udało im się kogoś wybrać? Łał, myślałem że rada będzie w wiecznym zawieszeniu. Najwyraźniej się myliłem. Nie wiem niestety kto jest nowym Pierwszym Sekretarzem, ale z pewnością ogłoszą to niedługo organizując jakąś wielką państową paradę czy inne święto. Zawsze jak coś ważnego się wydarzy to organizują parady. Inaczej ludzie nie przychodziliby na te wydarzenia, przeciętnego człowieka wszak gówno obchodzi jakaś polityka. Obchodzi ich koniec ich ośmiogodzinnej szychty, dobry posiłek w stołówce i powrót do domu, do rodziny. Cóż, jestem pewien że nowy Sekretarz będzie jeszcze bardziej niekompetentny niż Szwej. Dziad przynajmniej miał jakieś życiowe doświadczenie."
DGR_party_with_the_nation: "Partia z narodem"
DGR_party_with_the_nation_desc: "Oficjel partyjny niedawno odwiedził mój zakład chcąc pomóc w gotowaniu obiadu na ten dzień. Chyba faktycznie pozwolili mu gotować bo posiłek był kurwa całkowicie niejadalny. Myślałem że to po prostu losowa inspekcja, ale nazajutrz przyszedł kolejny i znowu jedzenie było parszywe. To nie mógł być przypadek - jestem pewien że to jakaś zaplanowana akcja. Nawet w gazetach które dostaję, tak bardzo jak są one aczytalne, zauważyłem coraz więcej artykułów o przypadkowych aktach 'dobroczynności' ze strony partyjniaków. Rząd próbuje przysposobić partii ludzką twarz. Tylko że biurokraci nie istnieją po to by mieć ludzką twarz, tylko po to by podbijać pieczątki na dokumentach i przekazywać je kolejnym biurokratom, którzy przybijają kolejne pieczątki i tak do usranej śmierci. Ale wygląda na to że KPP desperacko poszukuje wsparcia w narodzie, a to oznacza że upadek jest bliski."
DGR_nation_with_the_party: "Naród z partią"
DGR_nation_with_the_party_desc: "Dosłownie wszyscy oprócz mnie z więzienia zostali zaciągnięci na paradę pierwszomajową. Po co? Obiecano im zmniejszenie wyroków o pierdolony miesiąc jeśli pójdą na pochód. Oczywiście. W końcu nikogo nie obchodzi Pierwszy Maja, ludzie lubią ten dzień tylko dlatego że jest wolne. Założyłbym się o wszystkie moje racje że każdy uczestnik był albo przekupiony albo zmuszony do uczestnictwa, nie ma innego powodu. Tak czy siak, w gazecie widziałem mnóstwo przebitek z tego wydarzenia a wspólna telewizja pokazuje urywki co chwila. Kogo oni próbują oszukać? Mnie? Lud? Zdradzę wam sekret - nikogo kurwa nie nabierzecie. Tylko ktoś tak stary jak Szwej jest w stanie uderzyć w te pierdoły."
DGR_opening_up_to_foreign_markets: "Otwarcia na zagraniczne rynki"
DGR_opening_up_to_foreign_markets_desc: "Że co? Tak bardzo starałem się sprawić żeby Polska stała na własnych nogach, nie wymagając żadnej pomocy z zewnątrz, a oni po prostu olali to i sprzedali cały kraj zachodowi. Jak Balcerowicz pół wieku temu. Ech, i tak pewnie im to wypali w twarz. Mieliśmy więcej niż potrzebne zasobów do osiągnięcia dobrobytu, więc wpuszczenie tutaj zagranicznych korporacji które wyniosły się z Polski sekundę po tym jak sytuacja zaczęła się robić niewygodna, na 100% okaże się niczym więcej jak narzędziem do spustoszenia kasty robotniczej. Wszystko po to by jakiś miliarder mógł kupić sobie trzydziesty-siódmy jacht. Oby ludzie zorientowali się co się dzieje i pomogli mi postawić ten kraj z powrotem na nogi. Nawet pomimo tego, że przyszłość już nie wygląda za dobrze."
DGR_warsaw_pact_reborn: "Odrodzony Układ Warszawski"
DGR_warsaw_pact_reborn_desc: "Układ Warszawski. Ironicznie noszący nazwę stolicy Polski, gdyż Polska była wtedy jednym z niewolniczych państewek pod Związkiem Radzieckim, istniejącym tylko po to by wzbogacać 'Matuszkę Rosję'. To stary i niesprawdzony koncept, ale to komuchy potrafią najlepiej - przywracać chujowe pomysły. I tak oto przywrócili Układ Warszawski. Serio? Tak bardzo się starałem żeby przeszłość nie wróciła by nas ugryź w dupsko, a oni otwarli szeroko drzwi i wołają 'Zapraszamy!'. W umyśle komucha jest nie wiele, doprawdy. Mam nadzieję że to wszystko wkrótce pierdolnie bo tracę wiarę że kiedykolwiek uda się uratować ten zgniły kraj."
DGR_steadfast_demilitarization: "Stanowcza demilitaryzacja"
DGR_steadfast_demilitarization_desc: "Co do kurwy? Komuniści właśnie ogłosili ograniczenie liczby żołnierzy do kwoty którą uważają za 'adekwatną' do obrony. Tak, dobrze słyszeliście. OGRANICZENIE. NA CHUJU STAWAŁEM ŻEBY UPEWNIĆ SIĘ ŻE POLSKA BĘDZIE W STANIE SIĘ OBRONIĆ, ALE KOMUCHÓW TO PO PROSTU KURWA NIE OBCHODZI I NAWET NIE UDAJĄ ŻE BĘDĄ CHCIELI SIĘ BRONIĆ. Czuję się jakbym miał zaraz zejść na zawał. Czerwonego robactwa nie obchodzi Polska. Ich obchodzą tylko ich zasrane 'komunistyczne wartości'. To będzie ich upadek, w końcu jaki kraj posiada tak małą profesjonalną armię?"
DGR_forward_to_victory_of_communism: "Naprzód, po zwycięstwo komunizmu!"
DGR_forward_to_victory_of_communism_desc: "Cały świat obrócił się przeciwko mnie. Moi byli sojusznicy albo odwrócili się ode mnie, albo zostali aresztowani. Narodowa sprawa została zgnieciona przez przeklętych komuchów, którzy przekształcili ten niegdyś wspaniały kraj w czerwone pogorzelisko. Czy jest w ogóle po co żyć? Naród już dawno stracił swojego ducha. Moje życie nie ma sensu. Nie wiem czy w tym momencie to jeszcze życie czy tylko bardzo dobrze zakamuflowana śmierć stojąca u mych drzwi. Nadzieja może umierać ostatnia, lecz moja umarła już dawno. Strach. Czuję go w końcu. Ta prymitywna esencja ludzkości. Na szczęście, posiadam w swoim ręku odpowiednie narzędzie które doprowadzi mnie do ostatecznego celu. Udało mi się przemycić z kuchni nóż. Zatem...cóż. Idę do Ciebie, stary przyjacielu.\n*chlast*\n*łup*\n..."



## Events ##

dabrowa_border.1.t: "Zemsta za 2025!"
dabrowa_border.1.desc: "Nasi żołnierze dokonali wiekopomnego osiągnięcia, udało nam się wykorzystać sytuację panującą za naszą wschodnią granicą, i przejąć ziemie, od Bukowna aż po Klucze, wcześniej pod tyranią of Supreme Prosecutorship. Jest to zdecydowanie punkt zwrotny w wojnie trwającej od długich lat, kiedy to hordy Ziobry najechały Zagłębie. Teraz to ich ziemia, ich krew. A my będziemy wyzwolicielami z okowów! Co prawda wojska prokuratury odstąpiły od dalszych działań zbrojnych, a my nie jesteśmy na tyle silni by kontynuować nasze natarcie, jednak jest to zdecydowanie krok bliżej Olkusza. I pokonania tej zdradzieckiej, faszystowskiej kreatury."
dabrowa_border.1.a: "Precz z faszystowskim najeźdźcą!"

dabrowa_border.2.t: "Inwazja na Bukowno nie powiodła się"
dabrowa_border.2.desc: "Nasi żołnierze rozpoczęli walkę z nadzieją w sercach i z furią w oczach, ale rzeczywistość okazała się nieubłagana. Próba wykorzystania napiętej sytuacji na naszej wschodniej granicy skończyła się porażką - nie byliśmy w stanie utrzymać naszych pozycji ani w Bukownie ani w Kluczach. Ziemie te nadal pozostają pod butem i w żelaznym uścisku tyrana prokuratora Ziobry. Porażka ta oznacza mocny cios w długiej wojnie, która rozpoczęła się w momencie gdy hordy Ziobry po raz pierwszy najechały Zagłębie. Nasi żołnierze walczyli dzielnie, ale obrona wroga okazała się zbyt silna. Póki co, droga do Olkusza jest zamknięta. A zdradziecka, faszystowska kreatura znowu uniknęła wymierzenia sprawiedliwości."
dabrowa_border.2.a: "Jeszcze was dopadniemy!"

dabrowa_border.3.t: "Inwazja na Bukowno nie powiodła się"
dabrowa_border.3.desc: "Nasi żołnierze rozpoczęli walkę z nadzieją w sercach i z furią w oczach, ale rzeczywistość okazała się nieubłagana. Próba wykorzystania napiętej sytuacji na naszej wschodniej granicy skończyła się porażką - nie byliśmy w stanie utrzymać naszych pozycji ani w Bukownie ani w Kluczach. Ziemie te nadal pozostają pod butem i w żelaznym uścisku tyrana prokuratora Ziobry. Porażka ta oznacza mocny cios w długiej wojnie, która rozpoczęła się w momencie gdy hordy Ziobry po raz pierwszy najechały Zagłębie. Nasi żołnierze walczyli dzielnie, ale obrona wroga okazała się zbyt silna. Póki co, droga do Olkusza jest zamknięta. A zdradziecka, faszystowska kreatura znowu uniknęła wymierzenia sprawiedliwości."
