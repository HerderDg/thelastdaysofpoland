dgr_nazbol.30.t: "Duńskie Dynamo"
dgr_nazbol.30.desc: "Z pamiętnika Larsa Østergaarda, duńskiego rybaka z Bornholmu.\n#Wpis 335\nDzisiaj stała się rzecz niezwykła. Od kilkunastu lat wody terytorialne Polski są terenem praktycznie zabronionym, lecz przeto pustym od ludzi i pełnym ryb. Oni i tak biją się głównie na lądzie i nie mają marynarki a piraci zostali już dawno rozbici. Zatem lubię się zapuszczać na połów w okolice Polskiego wybrzeża. I tak łowiąc zauważyłem tratwę. Wpierw pomyślałem że to rozbitkowie więc popłynąłem by ich podebrać. Łamaną angielszczyzną dowiedziałem się że to jednak zwykli cywile którzy desperacko zbudowali sobie tratwę i próbowali dopłynąć do Szwecji. Biedni ludzie, Bornholm jest bliżej - zabrałem ich w okolice gdzie kiedyś istniał obóz dla uchodźców Polskich zanim Ci...zdecydowali się pojechać na wiking z powrotem do swojego kraju. Dałem znać służbom i zniknąłem zanim zdążyliby mnie ukarać za naruszanie morskich stref zabronionych.\n\n#Wpis 477\nTratwa z uchodźcami to nie był odosobniony przypadek. Tylko w ostatnim miesiącu udało mi się dostrzec takie trzy. Wojna domowa w Polsce trwa już długie lata więc dlaczego teraz nagle uciekają? Próbowałem się ich dopytywać ale mówili tylko że sowieci nadchodzą, a niektórzy co bardziej pobożni zaklinali się że nadciąga diabeł ze swoimi kohortami. Niewiele można z tego wywnioskować, ale czego można wymagać od tych ludzi. Co też oni musieli przeżyć...\n\n#Wpis 646\nMarinehjemmeværnet w końcu mnie dopadli jak wracałem z kolejnymi uchodźcami (i całkiem pokaźnym zasobem śledzia). Co dziwne...nie ukarali mnie - odesłali do budynku administracyjnego lokalnego oddziału marynarki wojennej na Bornholmie gdzie dali mi oficjalny glejt na ratowanie ludzi porzuconych na morzu Bałtyckim. Nawet skontaktowali mnie z kilkoma innymi rybakami którzy działają w podobny sposób. Czy to oznacza, że jestem korsarzem?\n\n#Wpis 773\nMamy obecnie praktycznie całą flotę dedykowaną połowowi Polaków. Eh, nie - to brzmi źle. Ratujemy uchodźców. I to jest najważniejsze. Coraz bardziej jednak niepokoi mnie to co mówią. Ponoć jeden z watażków jest blisko zjednoczenia całego kraju i przetacza się przez kraj niczym zaraza. I to czerwona. Ostatnio ratowałem artystów, teraz nawet i kilku profesorów się znalazło. Ludzie są coraz bardziej zdesperowani.\n\n#Wpis 1113\nChyba nasza operacja dobiega powoli końca. Pojawiły się patrole morskie - Polskie. Będzie to coraz bardziej niebezpieczne jeśli zaczną orientować się że w zasadzie kradniemy im obywateli. To że sami uciekają nie będzie chyba miało znaczenia. Dzisiaj podebrałem kilku polityków - członków komunistycznej partii i kilka innych ze stowarzyszenia narodowego. Zaraz, zaraz. Czy to nie przed nimi Ci wszyscy ludzie wcześniej uciekali? "
dgr_nazbol.30.a: "Ale dziwni Ci Polacy"

dgr_nazbol.31.t: "Państwo z kartonu 1/2"
dgr_nazbol.31.desc: "Henryk Dobroński pracował w Ministerstwie Rozwoju Gospodarczego odkąd komuniści przejęli władzę nad województwem Łódzkim. Dostąpił tej szansy tylko dlatego że miał doświadczenie w Komisji Planowania Współpracy Gospodarczej w zespole który miał na celu integrowanie Bełchatowa i Łodzi. Dużo im z tego nie wyszło ale przynajmniej miał co wpisać w CV. Jego karierę uchował tylko fakt że jego ojciec należał do PZPR, dlatego też miał wystarczające kwalifikacje by w nowym państwie ponownie zakręcić się wokół posady urzędniczej. Nie był jednak ideologiem - prezentował na tyle mocne poglądy, żeby utrzymać się w pracy bez ściągania na siebie uwagi komisji antysabotażowej. \n\nPo ostatnim zjednoczeniu kraju do jego biura zamiast dobrych wiadomości, zaczęły do niego spływać niepokojące wieści - coraz więcej robotników znikało, inni zaś byli zwalniani z pracy bez żadnego powodu. Henryk widział wiele podczas ostatniej dekady wojny domowej, lecz to było...zbyt dziwne. Zbyt losowe żeby było losowe - i zbyt masowe żeby nie było zorganizowane. Zaczął przebierać myślami w ostatnich projektach centralnych które mogłyby mieć skutki uboczne. Projekty infrastrukturalne odpadały, nie było żadnych konkretnych śladów zatrudnienia ani rzeczy które wymagałyby transferów lub obcięcia kosztów. Następnie Henryk sprawdził wszystkie ogólnokrajowe rozporządzenia które wysłali w ostatnich miesiącach do kierowników zakładów przemysłowych. Mnóstwo upomnień o produktywność, przypomnienie o zakazie spożywania alkoholu przez pracowników, rozporządzenie o uniformizacji ubrań zakładowych...nic nie miało znamion masowych zwolnień.\n\nNormalnie, grzebanie w rzeczach w których nie powinien - pewnie skończyłoby się dramatem i interwencją którejś ze służb...ale Henryk zauważył że kilkanaście nazwisk było mu znajomych. Koledzy z byłej pracy, przyjaciele rodziny, dalecy krewni. A to i tak była tylko kropla w morzu ludzi którzy albo zniknęli z powierzchni planety albo przestali pracować z dnia na dzień i nie wiadomo co się z nimi dzieje. Dobroński udał się do centrali z wnioskiem o udostępnienie akt pracowniczych kilku ludzi których znał z tej listy. Wniosek został automatycznie odrzucony - brak wymaganej autoryzacji. Próbował jeszcze kilkakrotnie, z podobnym skutkiem. Zadzwonił następnie do swojego kolegi w Ministerstwie Harmonii Społecznej z zapytaniem czy u siebie zauważył ten sam wzór. Okazało się, że nie był on sam. I to nie byli tylko robotnicy. Naukowcy, pracownicy społeczni, artyści - wszyscy losowo i systematycznie znikali."
dgr_nazbol.31.a: "Ale gdzie się podziali?"

dgr_nazbol.311.t: "Państwo z kartonu 2/2"
dgr_nazbol.311.desc: "Dobroński zaczął się obawiać, że może to być robota tajnych służb. Ale po co? Przecież..to nie ma nic wspólnego z rozporządzeniami które na co dzień wydają. Zaryzykował i udał się do swojego przełożonego, który jednak nie miał mu nic do powiedzenia - właśnie został zwolniony. Henryk złapał go tylko na korytarzu jak ten wynosił swoje rzeczy lecz nie odważył się porozmawiać. Nowym szefem Dobrońskiego został jakiś losowy wojskowy znikąd. Ten akurat zauważył pracownika i przywołał go gestem. \n- Towarzysz Dobroński, zgadza się? - powiedział oficer siedząc wygodnie za swoim nowym  biurkiem.\n- T-tak - odpowiedział lekko roztrzęsiony Henryk\n- Proszę wejść i zamknąć za sobą drzwi. \n- To Towarzysz złożył w ten poniedziałek czternaście wniosków do centrali o udostępnienie pewnych akt pracowników?\n- Tak, ale chciałem tylko...\n- To Towarzysz kontaktował się bez powodu z Ministerstwem Harmonii Społecznej by szczerze mówiąc, siać propagandę reakcyjną i przekazywać innym pracownikom teorie spiskowe?\n- Znaczy się...to nie tak...\n- Skoro nie tak, to co Towarzysz ma tam w ręku?\n\nDobroński trzymał w ręce teczkę w której posiadał wszystkie poszlaki które mogłyby wskazywać na istnienie jakiejś powszechnej operacji, lecz większość z tego - to były zaledwie domysły. Zebrał się w sobie i starał się wypaść na stanowczego:\n- To są dokumenty które wpływały przez ostatnie miesiące do mojego biura, ludzie dopytywali się o swoich krewnych, pytali się czemu zostali zwolnieni i co się z nimi stało. Są to doniesienia z całej Polski i jest to zbyt rozproszona siatka by to mogłoby być spiskiem reakcjonistów. Losowość wskazuje na działania służb. Nie oskarżam tutaj nikogo. Nie jest moim celem dociekanie, służę ludowi więc chciałem po prostu wyjaśnić tę sprawę gdy to właśnie lud się do mnie zwraca.\n- Lud to kpina - uciął przemowę Dobrońskiego oficer - Lud to motłoch. Lud to bydło. Odpowiadając na pańskie pytania - niektórzy są w zakładzie karnym w Wojkowicach. Niektórzy w Sztumie, inni we Wronkach. Niech Towarzysz się nie martwi - mają pracę. Wszyscy pracują nad elementami broni która zakończy wszystkie wojny. A że przy okazji pozbywamy się wszystkich ideologicznych kretynów którzy jedynie co robią to pierdolą o swoich pomysłach na rządzenie tym lepiej.\nHenryka oblał zimny pot. A więc to koniec. \n- I mówi mi to Towarzysz, bo...\n- Wie Pan dokładnie dlaczego. Znaczy może nie do końca.\n- Wojkowice?\n- O nie, nie. Pan musi zginąć. Nie możemy pozwolić żeby inni więźniowie dowiedzieli się o tym do czego Pan się tutaj dokopał. Dziękujemy za pańską służbę. Ale teraz, Naczelnik wymaga ostatecznego poświęcenia."
dgr_nazbol.311.a: "Nie oddzwonimy do Pana."

dgr_nazbol.32.t: "Socjalizm wojną!"
dgr_nazbol.32.desc: "Władza obiecywała rozliczenia. Wszyscy się za tym wstawialiśmy bo konieczne było, żebyśmy zerwali z tymi ludźmi którzy stracili nasz kraj i wystawili go na pastwę wojny domowej i Niemców. Każdy z nas wiedział, że musimy pozbyć się starego żeby nowe mogło zbudować lepszą przyszłość. Władza powiedziała że dla zdrajców będzie kara śmierci. Nie oponowaliśmy bo przecież Ci ludzie postawili na szali życia milionów Polaków. Należy im się. \n\nNajpierw zabrali się za demokratów. Nic mi do tego, demokracja to system oparty na tym że dwóch meneli spod budki z piwem ma więcej do powiedzenia niż jeden profesor. Nie było mi ich żal bo nie było we mnie żadnego współczucia po tym jak zrujnowali oni Polskę doprowadzając do Upadku. \n\nPotem przyszli po wszystkich którzy sprzeciwiali się budowie narodowego państwa. Wszelkich ludzi którzy proponowali międzynarodową współpracę, przyjaźń ponad podziałami i pogodzenie z ludami Europy by budować nową przyszłość. Nie byłem przeciwny - wszak nie byłem ani internacjonalistą ani eurokratą. To w końcu Europa na nas napadła i doprowadziła do tego że pozostaliśmy w chaosie wojny domowej.\n\nNa początku tego tygodnia przyszli po socjalistów. Na szczęście nie byłem socjalistą. Zresztą należało im się, coraz bardziej próbowali rozmontowywać stabilność jaka panuje w końcu w tym kraju. Nie wiem, czemu akurat wzięli mojego sąsiada, raz chyba głosował na SLD kiedyś, kiedy w ogóle kogokolwiek to obchodziło. Ale przecież każdy kiedyś głosował głupio, więc nie rozumiem.\n\nPrzedwczoraj anarchiści i pozostałości komunistycznej frakcji zostały aresztowane. Przesuwaliśmy się coraz bardziej w lewo, ale czy przecież obecna władza nie rozpoczęła rewolucji i nie wywodzi się z komunistycznej partii? Narodowe elementy zostały oszczędzone ale co bardziej lewicujący działacze przepadli jak kamień w wodę. Ale znów, nie należałem nigdy do partii, a do anarchii było mi daleko.\n\nWczoraj zostali aresztowani wszyscy którzy propagowali idee narodowe. Zaczynam podejrzewać że władzy nie chodzi o żadną ideologię, tylko władzę dla samej władzy. Inaczej nie da się wytłumaczyć tego co nastąpiło w naszym kraju. Coraz więcej różnych władyków lokalnych zaczyna sobie funkcjonować jak feudalni panowie udzielni w swoich lennach i nikt nie może na to nic poradzić. To nie tak miała wyglądać Polska.\n\nDzisiaj przyszli po mnie. Nie mam pojęcia dlaczego. Nie dane mi było dostąpić żadnego procesu. Żadnych oskarżeń. Żadnego sądu. Po prostu wzięli i zabrali. \n\nI nie było już nikogo kto by się za mną wstawił. "
dgr_nazbol.32.a: "A wojna wymaga poświęceń."

dgr_nazbol.33.t: "Jedność ostateczna"
dgr_nazbol.33.desc: "Warszawa, Plac Defilad. Aleksander Bargieła wygrał grę o Polskę. Szwej w tym momencie był ledwo żyjącym ciałem przywiązanym do łóżka z którego nie ma sił wstać. Jest tylko jeden następca - i ma on mnóstwo argumentów za tym, żeby być pierwszym Naczelnikiem Narodowo-Ludowej Rzeczpospolitej Polskiej. Większość z nich jest siłowa - Narodowa Armia Ludowa, Inkwizycja, Gwardia, Milicja, Komisariat Ludowy. I wszyscy przedstawiciele tych resortów czekają na ostateczne słowo Naczelnika Bargieły do ludu zgromadzonego przed nimi na placu. \n- Towarzysze! Narodzie! Bracia i siostry! Dzisiejszy dzień możemy uznać za początek nowej ery w historii naszego kraju. Będziemy tę chwilę świętować przez następne tysiąc lat, bowiem to właśnie dzisiaj zakończył się długotrwały proces Drugiego Wyzwolenia. Pierwsze...przyniosło Polsce tylko zgubę.\n\nWszyscy, zarówno cywile jak i oficjele nagle zaczęli patrzeć się po sobie jakby się przesłyszeli. Pierwsze Wyzwolenie przyniosło komunizm Polsce na prawie 50 lat. A teraz?\n- Dobrze słyszeliście. Zgubę i dyktaturę ludzi niezdolnych do sprawowania funkcji do których pełnienia powinno się wybierać ludzi jedynie wybitnych. A gdy ta upadła i komuna poszła do diabła - nastały czasy jeszcze gorsze. Ale nie martwcie się. To już jest wszystko za nami. Komunizm nigdy nie był moją drogą i za to próbowano mnie zniszczyć. Za postawienie wszystkiego na ideały które są wyższe niż jakakolwiek doktryna polityczna. Za to, że śmiałem postawić się jako obrońca narodu. Te dwa żywioły - nacjonalizm i bolszewizm - nie są w stanie funkcjonować równocześnie. Prędzej czy później, jeden zmiażdży ten drugi. Zapewniam was jednak, moja wola jest tak silna jak nigdy wcześniej. Bolszewicy dopuścili się zdrady, zatem zostali wyłączeni z życia politycznego. Pozostali dysydenci zostaną złapani i osądzeni. \n\nSporo ludzi miało przerażone twarze. Jednak na obliczach oficerów zaczęły malować się pełne zrozumienia diabelskie uśmiechy.\n- Nie lękajcie się narodu. To wszak wszystko my, którzy budujemy codzienne życie każdego z miast i wsi. To my którzy budujemy przyszłość. To każdy z was. I skoro wszyscy jesteśmy odpowiedzialni za kraj - to wszyscy jesteśmy tym krajem. W waszym imieniu działałem i będę działał by ten naród stał się czymś z czego będziemy wszyscy dumni. Pracę - dopiero zaczynamy. Ale nikt już nam nie przeszkodzi w osiągnięciu tego o czym my wszyscy marzymy. Dumnej, dostatniej, wolnej Polsce dla narodu Polskiego. Tylko tyle - i aż tyle. Los wymaga od nas odpowiedzi - czy pozostaniemy na śmietniku historii czy weźmiemy tę planetę za rogi i to my będziemy pasterzami od których będzie zależał dobrobyt innych! Nacierpieliśmy się wystarczająco! To jest nasz moment! CZAS BY ZBUDOWAĆ NOWĄ POLSKĘ! CHODŹCIE, RAZEM ZE MNĄ!\n\nNiektórzy zaczęli wiwatować. Niektórzy dalej byli przerażeni."
dgr_nazbol.33.a: "A niektórzy zdecydowali że czas uciekać."

dgr_nazbol.34.t: "Śmierć wszystkich zrówna"
dgr_nazbol.34.desc: "- Jak leci, dziadu?\nAleksander Bargieła wszedł samotnie do pomieszczenia szpitalnego w którym leżał Krzysztof Szwej. Ten już natomiast był na progu przejścia w zaświaty - praktycznie nie kontaktował i nie był w stanie się poruszać, będąc nieustannie podpiętym pod różne aparatury medyczne podtrzymujące go przy życiu.\n- Jak tam, nie masz tam żadnej bomby pod poduchą co byś nas wysadził obu? Nie? Dobra. Spoko. I co, fajnie się tak leży, nie? Nie trzeba się o nic martwić. Za nic się nie odpowiada. Nic już od Ciebie nie zależy. Nic już nie jesteś w stanie zmienić.\nBargieła usiadł na krześle obok i wpatrywał się w Szweja - nieruchomego, jak gdyby w ogóle nie zarejestrował że ktoś przyszedł. \n- Transmitowali Ci może przemowę z Warszawy? Mam nadzieję, w końcu im kazałem. Jak wrażenia? Jak to jest, pracować kilkanaście lat na sukces, który na końcu okazuje się nie twój? I jednocześnie wszystko co chciałeś osiągnąć jest niweczone jednym głupim...przemówieniem. \nNagle Szwej otworzył usta, lecz dalej nie spojrzał na Bargiełę\n- Zawsze wiedziałem...że jesteś po prostu bydlęciem - powiedział słabym głosem Szwej\nBargieła wstał. Przez chwilę impulsywnie przepłynęła przez niego fala wściekłości, lecz na szczęście po sekundzie ustąpiła uśmiechowi.\n- Patrzcie, to żyje. Jeszcze. Chcesz się jeszcze czymś ze mną podzielić zanim odlecisz do piekła?\nSzwej tym razem zmusił się do spojrzenia Bargiele prosto w oczy i wydusił z siebie:\n- Jak to jest...pracować kilkanaście lat by zniszczyć wszystko? Jak to jest...być aż tak bardzo...egoistycznym? Spójrz w lustro. Nic po Tobie nie zostanie. Nic. Nic i nikt. Bo nie masz nikogo, dla kogo...mógłbyś ten świat polepszyć. Dlatego...zostaje Ci tylko niszczenie. Życzę Ci...żeby była chociaż jedna osoba na tym świecie...która będzie Cię opłakiwać...jak odejdziesz. Za mną...będzie płakał naród. Po Tobie...zostanie tylko ciemność. I...nikt, kto mógłby Cię pokochać za cokolwiek. Jesteś nikim...\nTymi słowy Szwej opadł na poduszkę i zamknął oczy ciężko oddychając. Odegrał swoją rolę. Czas na kurtynę. Widać jednak było, że Bargieła był dotknięty tymi słowami. Odwrócił się do aparatury medycznej podpiętej do gniazdka obok. Wzdychnął, wyprostował się.\n- Już nie musisz poświęcać się dla swego ludu. Nie musisz dalej uginać się pod ciężkim brzemieniem władzy. Wszystkim się już zająłem.\nBargieła odpiął maszynę. Szwej zaczął się krztusić, następnie ucichł i jedyny dźwięk jaki rozległ się to głos jednego ze strażników stojących przed zamkniętymi drzwiami do pomieszczenia mówiący do drugiego:\n- Ej, myślisz, że powinniśmy to sprawdzić?"
dgr_nazbol.34.a: "- Myślę, że powinieneś zamknąć mordę"

dgr_nazbol.35.t: "Wybuchy płaczu jak huki z armat"
dgr_nazbol.35.desc: "Bargieła siedział na zapleczu Pałacu Kultury Zagłębia wraz z Martą Grabarczyk, popijając szampana i będąc w nastroju zbyt dobrym jak na fakt, że zaraz miał wygłosić mowę pogrzebową która będzie transmitowana całemu narodowi. Marta nie wyglądała na zachwyconą ale wydawało jej się, że to po prostu forma radzenia sobie z traumą w wydaniu Aleksandra. Jednak przeceniała ona możliwości empatyczne Bargieły - ten nie miał w sobie ani grosza zadumy i gdyby mógł, tanecznym krokiem wyszedłby przed kamery, rzucił głupi żart i kazał wszystkim świętować. Na szczęście, nie mógł jeszcze być tak bezczelny.\n- Dobra, to co - czas na przedstawienie? Jak moja mina żałobna? - zapytał Bargieła natychmiast przyjmując zbolałą pozę i grobowy wyraz twarzy.\n- Dobrze? - odpowiedziała zmieszana Marta - Tylko nie przesadź w drugą stronę.\n\nNowy naczelnik państwa udał się na przed pałac gdzie stała otwarta trumna z ciałem ich byłego pierwszego sekretarza, Krzysztofa Szweja. Odgrodzona od tłumu, uroczyście udekorowana, otoczona przez kordon uzbrojonych żołnierzy. Ludzi było mnóstwo, wszyscy przybyli oddać cześć zmarłemu przywódcy. Widok tak wielu osób na uroczystości sprawił, że Bargieła na poważnie przyjął już postawę człowieka w żałobie. Wszedł na podium i rozpoczął swoją przemowę.\n- Przestało bić serce wodza ludzkości. Człowieka wielkiego, współbojownika i kontynuatora dzieła największych rewolucjonistów, pierwszego sekretarza Komunistycznej Partii Polski i człowieka od którego zaczęło się Drugie Wyzwolenie. Imię Szweja jest bezgranicznie drogie naszej Partii, narodowi polskiemu i masom pracującym na całym świecie. Stworzył on podwaliny pod kraj w którym znajdujemy się dzisiaj. Wiedział on, jak bardzo zepsute jest jednak środowisko komunistyczne. Dlatego też, samemu nie będąc w stanie zwrócić się przeciwko swym braciom i siostrom - przekazał mi zadanie oczyszczenia szeregów naszej partii ze zdrajców i reakcjonistów. Jestem dumny, że mogłem to zadanie wykonać w jego imieniu. Towarzyszu Szwej - melduję, że zadanie zostało wykonane.\n\nPrzez chwilę Bargieła zawahał się, przełknął ślinę i kontynuował\n- Towarzysze i Obywatele! Szczególnie głęboko i boleśnie przeżywamy ten wielki cios, wszak to jemu zawdzięczamy wyzwolenie z ponurej kapitalistycznej niewoli, odrodzenie narodu i utrwalenie naszej niepodległości. Pamiętajmy również o jego ostatnim życzeniu - naród może się odrodzić, ale potem musi nieustannie walczyć o swoje przeżycie. Rewolucji raz zaczętej nie możemy odpuścić nigdy, gdyż wrogowie czyhają tylko na nasze potknięcia. Sprawmy, żeby był z nas dumny. Niech żyje nasz bohaterski naród polski! Niech żyje Narodowo-Ludowa Rzeczpospolita Polska!\nBargieła zakończył przemowę przy burzy oklasków. Skierował się do swojego adiutanta i upewniając się, że tylko on go usłyszy powiedział do niego:"
dgr_nazbol.35.a: "- Spalcie ciało i wrzućcie prochy do Przemszy."

dgr_nazbol.36.t: "Parada dumy"
dgr_nazbol.36.desc: "Gdańsk od rana był pełen wojska. Na całej długości promenady ustawiono bariery, poczty sztandarowe i posterunki, a kolejne kolumny Narodowej Armii Ludowej przejeżdżały przez miasto. Komisariat Ludowy od kilku dni przerzucał jednostki w sposób, którego nikt poza najwyższym dowództwem nie był w stanie do końca zrozumieć. Bataliony pojawiały się i znikały, samochody zmieniały przydziały, a żołnierzy kierowano w miejsca, do których jeszcze tydzień wcześniej nie mieli żadnego powodu jechać. Dla większości była to po prostu organizacja Drugich Zaślubin z Morzem.\nDla Zagórskiego i Zimmermanna była to idealna zasłona dymna. Komisarz Zagórski stał obok swojego szefa i dawnego przyjaciela, Wojciecha Zimmermanna i obserwował przygotowania z pozornym spokojem.\n- Wszystko jest na miejscu. Samochód stoi przy magazynie, ludzie wiedzą, kiedy mają odjechać, a ładunek został sprawdzony dwukrotnie. Jeśli Bargieła wejdzie do środka, nie będzie żadnego problemu.\nZimmermann spojrzał na zegarek, potem na promenadę.\n- A jeśli nie wejdzie?\n- Wejdzie. Oficjalnie ma nim pojechać na kolejną część uroczystości. Nie ma powodu, żeby podejrzewał cokolwiek innego.\nPrzez następne kilkanaście minut wszystko przebiegało zgodnie z planem. Orkiestra rozpoczęła marsz. Pierwsze oddziały przeszły przed trybuną. Delegacje zajęły swoje miejsca. Wreszcie pojawił się Bargieła. Zagórski od razu go rozpoznał. Czarny płaszcz, spokojny krok, kilku ludzi w pewnej odległości. Nie wyglądał na człowieka, który spodziewa się śmierci. Samochód czekał kilkadziesiąt metrów dalej. Bargieła spojrzał w jego stronę, kiwnął głową z uśmiechem, jak gdyby wiedział co go czeka. Albo po prostu się witał. Zagórski poczuł, jak napinają mu się mięśnie. Bargieła ruszył wzdłuż promenady. Minął pierwszy samochód. Potem drugi. Zatrzymał się przy podstawionym pojeździe, ale zamiast otworzyć drzwi, odwrócił się i zamienił kilka słów z jednym z oficerów. Zagórski zacisnął dłoń na barierce.\n- Co on tam robi?! Czemu nie wsiada?! - wykrzyczał w swojej głowie Zagórski. Bargieła nagle ruszył dalej. Kilka metrów za nim stał drugi samochód. Ten, którym przyjechał. Otworzył drzwi i wsiadł. Zagórski spojrzał na Zimmermanna. Przez chwilę żaden z nich się nie odezwał. Zimmermann już wiedział. Zagórski spojrzał na zegarek. Odliczanie trwało.\n- Możemy to przerwać?\nZimmermann pokręcił głową. W tej samej chwili samochód podstawiony dla Bargieły ruszył z miejsca. Po kilku sekundach z oddali dobiegł głuchy huk. Budynek przy magazynie zniknął za chmurą dymu. Na promenadzie ludzie odwrócili głowy. Żołnierze natychmiast zaczęli reagować, ale ceremonia trwała dalej, jakby nic się nie stało. Zagórski patrzył na dym bez słowa. Bargieła był już daleko. Żywy.\n- Odwołaj wszystkich - powiedział w końcu Zimmermann. - I usuń samochód\n- A co z ciałami? - zapytał Zagórski\n- Tych, których trzeba, już tam nie ma. Oficjalnie silnik po prostu pierdzielnął ze starości, nikomu nic się nie stało. Wypucujcie wszystko, byle szybko!"
dgr_nazbol.36.a: "Było nie kupować elektryków..."

dgr_nazbol.37.t: "Lublin padł zanim zrobiła to Gwardia"
dgr_nazbol.37.desc: "Any Lublinian who can't field-strip his own rifle by age ten was born in the wrong city. The bombardment had been going on for so long that Trooper Halek could no longer remember what silence sounded like. The guns, the screams, the collapsing buildings and the shriek of things that had no place beneath a human sky had all become one continuous roar. Halek crouched behind what remained of a block entryway with his gun pressed against his chest as dust and pieces of masonry rained around him. Every breath tasted of concrete, asbestos and blood.  Then the ground moved. Not as in shook - it moved. The street rose beneath him like the back of some enormous beast and threw him against the wall. Somewhere nearby, a tank disappeared into a widening crack with its crew still trapped inside. The crack continued through the avenue, splitting buildings apart as effortlessly as a knife through rotten meat.\nFor a moment, Halek simply stared. Beyond the ruins, the horizon had become a wall of fire. Lublin was dying. Rebels have started to blow up the city from below. He had known it for hours, of course. Everyone had. The officers could disguise it with orders and maps, the commissars could drown it in speeches about duty, and the radio operators could continue broadcasting reports in the calm voices expected of them, but none of it changed what every Guardsman could see - the city was about to die.\n- Extraction point seven is still active!\nThe sergeant's voice came through the radio, distorted beneath static.\n- All remaining units are to withdraw immediately. Anyone who can walk carries someone who can't. Anyone who can still fight covers the withdrawal.\nHalek looked toward the distant landing zone. There were helicopters leaving. Small against the burning sky, almost insignificant, but real. People were getting out. He saw one of the men beside him looking at them too.\n- Think they'll make it? - man asked.\nHalek wanted to say yes. Instead, he watched another building collapse between them and the helipad.\n- Doesn't matter - he said. They formed their line among the ruins. There were perhaps thirty of them left. Thirty Guardsmen against an enemy that had already swallowed entire regiments. The first shapes emerged from the smoke. Halek raised his rifle and fired. The bullets struck some enemies, but more followed behind them, advancing through the ruins.\nThe men around Halek fired until their weapons overheated. They reloaded with trembling hands, screamed at enemies they could no longer properly see, and died one by one beneath the weight of an army that seemed to have no end. Halek fired again. Then again. His magazine ran dry. For a moment he considered reaching for another. There was no point. There was fear in him. There had always been fear.\nBut there was something else now, buried beneath it: the stubborn, almost stupid certainty that if Lublin had given him anything, it was the knowledge that some things were worth dying for even when there was no hope of winning. He fixed his bayonet.\nAround him, the remaining Guardsmen did the same.\nThe city was breaking beneath their feet. The Guard remained standing.\nFor the country. For the nation. For the National People's Republic."
dgr_nazbol.37.a: "Umierajcie godnie"

dgr_nazbol.38.t: "Narodzony z krwi"
dgr_nazbol.38.desc: "Nikt w Grodzisku Wielkopolskim nie wiedział, co właściwie miało się wydarzyć. Od samego rana zamykano kolejne ulice prowadzące do rynku. Żołnierze nie wpuszczali mieszkańców na plac, a tym, którzy pytali o powód, odpowiadano jedynie, że chodzi o uroczystość państwową. Nie było jednak żadnych plakatów, żadnego programu ani nawet informacji o tym, kto miał być jej gospodarzem. Na środku rynku przez noc wybudowano konstrukcję, której wcześniej tam nie było. Siedem kamiennych stopni prowadziło do okrągłej platformy. Wokół niej ustawiono dwanaście wysokich kolumn, a pomiędzy nimi zawieszono czarne płótna. Na ich powierzchni widniały znaki, których nikt z mieszkańców nie potrafił rozpoznać. Nie przypominały herbów ani symboli wojskowych. Niektórzy twierdzili później, że widzieli w nich fragmenty alfabetów, których nie znali. W południe na plac wprowadzono pierwszych ludzi. Nikt nie mówił. Mężczyźni i kobiety ubrani byli w jednakowe, ciemne stroje. Twarze części z nich zasłaniały kaptury, inni mieli na szyjach metalowe medaliony przedstawiające zamknięte oko. Ustawili się w kręgu wokół konstrukcji. Potem dołączyli żołnierze. Ci również nie nosili standardowego wyposażenia. Każdy miał na piersi niewielki, zielony znak pioruna. Nikt nie wiedział, co oznaczał. Dopiero po pewnym czasie na plac wszedł generał Szarejko. Szedł sam, w czarnym mundurze pozbawionym odznaczeń.\nZatrzymał się przed pierwszym stopniem. Wtedy wszystkie osoby stojące w kręgu jednocześnie uklękły. Szarejko wszedł na pierwszy stopień.\n- Ten, który szuka, pyta.\nGłos odpowiedział z tłumu.\n- Ten, który wie, nie pyta.\nDrugi stopień.\n- Kto prowadzi?\n- Ten, który został wybrany.\nTrzeci.\n- Kto wybiera?\nTym razem odpowiedź nie padła. Szarejko szedł dalej i znalazł się na szczycie konstrukcji. Stało tam siedem osób. Wszyscy mieli zasłonięte twarze. Jeden z nich podszedł do Szarejki i zdjął z jego munduru ostatnią odznakę. Potem drugi wręczył mu czarny medalion. Nie było na nim żadnego symbolu. Tylko gładka powierzchnia.\n- Czy przyjmujesz ciężar?\nSzarejko milczał.\n- Czy przyjmujesz samotność?\nNadal milczał.\n- Czy przyjmujesz imię?\nDopiero wtedy odpowiedział.\n- Przyjmuję.\nWszystkie dwanaście kolumn rozświetliło się jednocześnie. Tłum pochylił głowy.\n- Jedyny.\nPotem powtórzyli je żołnierze.\n- Jedyny.\nNa końcu powtórzyli je wszyscy."
dgr_nazbol.38.a: "- Jedyny"

dgr_nazbol.39.t: "Wodzu, prowadź nas na Wilno!"
dgr_nazbol.39.desc: "- I jak? Chyba nie był zadowolony, co? \n- A kiedykolwiek jest?\nGenerałowie Abrahamowicz i Zieliński stali na podeście obserwując przemarsz wojsk które docierały na Podlasie w okolice granicy z Litwą. Ostatnie dni pełne były napiętej sytuacji pomiędzy nowo uformowanym państwem Polskim a Litewskim - głównie właśnie ze względu na duże siły przerzucane przez Abrahamowicza w rejon Suwałk. Niektórzy nawet posunęli się do stwierdzenia, że to Bargieła wysłał go tam by sprowokować Litwinów i przeprowadzić operację zajęcia Wilna jak kiedyś Żeligowski z Piłsudskim. Była to jednak dość ciekawa przykrywka - łatwiej było ukryć prawdziwe zamiary pod pozorem niekompetencji i narwanych charakterów Abrahamowicza i Zielińskiego.\n- No nie jest. Dlatego to wszystko jebnie - stwierdził ponuro Zieliński. Długo współpracował już z Abrahamowiczem przez to nic dziwnego że wydawało mu się że są po tej samej stronie. \n- Szarejko wziął pancernych do Wielkopolski. Lotnictwo “utknęło\" na Pomorzu. Gwardia tłumi powstanie na Lubelszczyźnie. Już cała Polska się tego spodziewa - odparł Abrahamowicz. Wiedział, że następne miesiące przyniosą tylko więcej rozlewu krwi i chciał się zdystansować od tego jak najdalej. Ale będąc tak głęboko w systemie - nie da się po prostu z niego wyjść.\n- To atakujmy tych Łotwinów bo się ściemnia - rzucił Zieliński. Abrahamowicz popatrzył na niego z politowaniem. Tak, jego też trzeba będzie odciąć. I to czym prędzej.\n- Nikogo nie atakujemy...\n- Ale...przecież wszyscy tak mówią, że my idziemy tam.\n- I chcesz iść tam gdzie wszyscy czekają na Ciebie przygotowani? - zapytał Abrahamowicz wątpiąc w taktyczny zmysł swojego kolegi. \n- No nie, ale kurwa, tyle tej gadaniny było o tym Wilnie że myślałem że tam w końcu wjedziemy - Zieliński już był całkowicie pogubiony, gdyż jego zmysł polityczny był jeszcze gorszy od taktycznego. Jednak czego mu nie brakowało to tego, że faktycznie starał się dbać o swoich ludzi. Co nie do końca się dodaje w przypadku takiej planowanej ofensywy, ale nadal - chęci są. \n- Kamil, słuchaj. Tutaj musimy po prostu przeczekać wszystkich. Mamy dobrą pozycję do tego, jeśli nigdzie nie polecimy na hurra to komisarze, inkwizytorzy i reszta pokemonów wyrżnie się nawzajem. A my będziemy bronić ludzi tutaj. I powoli też gdzie indziej w miarę jak reszta się będzie wykrwawiać. Im dłużej to będzie trwało tym więcej kraju zabezpieczymy bez żadnych wielkich bitew. Wyzwoliciele, stary. Prawdziwi wyzwoliciele - tak nas zapamiętają.\nZielińskiemu nie trzeba było powtarzać tego drugi raz. Okazję do bycia kimś ważnym zawsze chciał wykorzystać.\n- Zajebiście. A co jeśli ktoś nas jednak zaatakuje?"
dgr_nazbol.39.a: "- To wtedy ich wszystkich wyrżniemy."

dgr_nazbol.40.t: "Ostatnia rada"
dgr_nazbol.40.desc: "Marcin Lasecki wszedł do starej, drewnianej chatki która była kiedyś jedynym miejscowym pubem na osiedlu na którym wychowywał się razem z Naczelnikiem Bargiełą. Miejsce to wywoływało mnóstwo wspomnień i Lasecki cieszył się w duchu, że pomimo wszystkiego co się w kraju dzieje, jeszcze istnieją takie lokale.\n- Wybacz spóźnienie, nie jest to najlepszy czas w naszym kraju jak sam wiesz - powiedział do siedzącego już tam Bargieły który raczył się piwem z kufla.\n- Nie ma sprawy ale obsłużyć się musisz sam. Barmana puściłem do domu bo nie chciałbym, żeby się nasłuchał za dużo - odpowiedział Bargieła. Po chwili oboje zasiadali już przy stoliku przy którym siedzieli setki razy. Ale nigdy w takiej sytuacji.\n- Pamiętasz co kiedyś powiedziałeś? - zapytał Lasecki - Że nawet jakbyś był prezydentem to przylatywałbyś tutaj helikopterem na piwo?\nBargieła się uśmiechnął mimowolnie. Był to ostatnimi czasy rzadki widok.\n- A jak myślisz jak tutaj dotarłem? Zdrowie.\n- Zdrowie.\nZderzyli się kuflami i upili po łyku. Lasecki spojrzał w sufit, westchnął i wyciągnął teczkę z walizki którą miał ze sobą, po czym podał ją Bargiele.\n- Wszystko co mieliśmy. Reszta pewnie przepadła z archiwum i komisarzami. Słuchaj...wiem, że to co powiem będzie na poziomie naiwnego lewaka, ale...\n- Rubikon został przekroczony, Marcin. Jest to pewnego rodzaju moja wina, za bardzo skupiony byłem na wygraniu wojny. A jak już ją wygraliśmy to było za późno - snuł ponuro Bargieła. Wyglądał na przybitego, ale jednocześnie jakby miał zaraz zrobić coś czego będzie potem żałował.\n- Część wojska dalej jest gotowa stanąć za Tobą. To wszystko jest gra oparta na pojedynczych filarach. Komisariat bez Wojtka nie istnieje, Inkwizycja bez Dominika idzie w rozsypkę, Gwardia bez Michała będzie jak kura bez głowy. I w drugą stronę niestety też. Eh... nie mówię tego, żeby...no wiesz. Ale, jeśli trzeba będzie, to musisz się ich pozbyć jeśli nie da się ich przekonać do złożenia broni - próbował argumentować Lasecki. \n- Nie cofną się. Ja też nie zamierzam.\n- To wyślij mnie. Albo Martę. Cholera, wyślij nas obu! Jeśli damy radę przekonać choćby jednego to będzie to oznaczało ocalenie dziesiątek tysięcy przed posłaniem na rzeź. \nBargieła spojrzał na swojego rozmówcę. Nie był w odpowiednim stanie psychicznym, żeby zareagować jak na porządnego przywódcę przystało.\n- Tak spieszno wam się urwać? - zaczął podejrzliwie Bargieła. Na szczęście szybko zorientował się, że to nie prowadzi do niczego dobrego. Upił kolejny łyk piwa i ukrył twarz w dłoniach - Przepraszam. Nie powinienem tego insynuować. Wiesz co...po czwartym piwie to możliwe, że będzie nawet dobra propozycja. Ale nie wcześniej.\n- No to lepiej weźmy się do pracy - powiedział Lasecki unosząc kufel w geście toastu. Bargieła po raz kolejny uśmiechnął się, tym razem dość ponuro. Wiedział, że to może być jego ostatni uśmiech przez najbliższe miesiące. Albo może i ostatni w życiu.\n- Cieszę się, że jesteś ze mną. Ty jeden, ostatni... - odparł Bargieła"
dgr_nazbol.40.a: "- Obyśmy mogli się tu jeszcze spotkać, Alek."

dgr_nazbol.41.t: "Samospalenie"
dgr_nazbol.41.desc: "Aleksander Bargieła przechadzał się samotnie uliczkami Parku Hallera w Dąbrowie Górniczej. W miejscu gdzie wszystko się zaczęło. Nie jakaś rewolucja komunistyczna, nie rzeczy związane z Upadkiem. On i jego przyjaciele - cała znajomość zaczęła się na tych alejkach, pomiędzy krzakami i placami zabaw, na placach stojących obok bloków i trzepakach na których się spotykali. \n\nSzarejko. Lasecki. Zieliński. Bargieła. Czwórka znajomych z tej samej klasy ze szkoły podstawowej znajdującej się, o tam tuż obok parku. Znajomość wykuta w boju wręcz można powiedzieć - gdy ganiali się za dzieciaka banda na bandę by bronić swojego osiedla, niczym Chłopcy z Placu Broni. Potem dołączył Abrahamowicz i Kasprowicz. Świeższa krew, młodsi od Bargieły. Ale to właśnie Abrahamowicz stał się najlepszym przyjacielem Aleksandra, na dobre i na złe. Na tych ławkach w parku snuli swoje marzenia o podbojach i wielkości. Dziecięce marzenia ziściły się w najbardziej ironiczny sposób w jaki mogły.\n\nBargieła przeszedł przez tunel w parku i skierował się do centrum miasta. Po prawej zobaczył budynek gimnazjum do którego uczęszczał. Tam też poznał Zimmermanna i Zagórskiego. Ta dwójka również była przyjaciółmi od dziecka, ale to przez następne lata Bargieła był ich oknem na świat zewnętrzny próbując wciągać ich w różne socjalne wydarzenia jakie działy się dookoła. Później poznał Czyżewskiego i Wernera, lecz wtedy już byli prawie dorosłymi ludźmi. Powoli wszyscy wstępowali w etap w którym wspólne drogi zaczęły się rozchodzić. \n\nAle przyjaźń pozostała. Przetrwała nawet dłużej niż ich kraj. I to w ogniu Upadku więzi rozgorzały na nowo. W obliczu zagrożenia zebrali się i próbowali zmienić swoją mała ojczyznę na lepsze. I nic nie wskazywało na to, że po raz kolejny ich drogi znowu się rozejdą. Przecież byli już teraz braćmi którzy wspólnie przelewali krew za to w co wierzyli. Albo przynajmniej wydawało im się, że wierzyli. Kraj stanął na rozdrożu. Każdy z nich myśli, że jest tym który wie najlepiej i to on ma rację. \n\nBargieła nigdy nie chciał być liderem. I teraz świat mu pokazuje dlaczego nie powinien nim być. Wszystkie wspomnienia będą musiały teraz w nim umrzeć, wraz z ludźmi którzy w tych wspomnieniach się znajdują. Nawet jeśli to będzie musiało oznaczać, że i on przestanie istnieć. \n\nPo raz pierwszy od dwudziestu lat, Bargieła się rozpłakał. \nNiestety, znieczulica ustąpiła zbyt późno.\nGdzieś w oddali oddano już pierwsze strzały. Rozpoczęła się kolejna bratobójcza wojna."
dgr_nazbol.41.a: "I nie było już nikogo, kto mógłby to zatrzymać."

dgr_nazbol.42.t: "Świt nieśmiertelności"
dgr_nazbol.42.desc: "Przywiązanie się do danych osób jest zdradliwe jeżeli tym samym przymiotnikiem możemy określić te właśnie osoby. Bo pozostawia to wielką pustkę, brutalnie wydartą pozostawiając po sobie rozdrapane rany. To co pozostało kreuje całkowicie sprzeczny obraz tej osoby pomimo tego jak wygląda realna sytuacja. I naiwnie wracamy. W nadziei że to co było kiedyś na nowo może zaistnieć. Ale tak się nigdy nie dzieje. Nawet jeśli, to nie jest to samo. Nie wchodzi się dwa razy do tej samej rzeki nie dlatego że dostaniemy to samo, tylko dlatego że to nigdy nie jest ta sama rzeka. Dlatego to co było jest niemożliwe do odtworzenia, a ewentualny efekt sztuczności tylko podkreśla ból tego co zostało stracone.\n\nI wzleciałem pod nieboskłon życia i śmierci bacznie obserwując te dwie skrajności. Nie wiedząc czy w tym momencie to jeszcze życie czy tylko bardzo dobrze zakamuflowana śmierć. Ta chwila w której w twoim umyśle rodzi się strach. Prymitywne uczucie którego ludzie od zarania dziejów nie potrafią się wyzbyć, a zaraz za nim wraz z lodowatym powiewem wiatru dumnie kroczy śmierć. Kostucha, której jednak zaczynasz coraz mniej się bać, albo wręcz przestajesz uznawać ją za coś najgorszego, bo to ten drugi biegun egzystencji przysparza Ci bólu i cierpienia. Zauroczony wpatrujesz się w możliwość ostatecznego odłożenia wszystkich trosk na zawsze na bok i rzucenia się w ramiona niebytu, gdy chłód przestaje przeszywać na wskroś twoje nerwy a staje się wyznacznikiem według którego postępujesz. Gdy sam fakt nicości pogrąża Cię w chorej fascynacji tym co nieskończone i transduchowe. Skłaniasz się ku dokumentowi który podstawia Ci wizja wiecznego spoczynku, mówiącego o rozwodzie z toksycznym związkiem losu, oraz brakiem jakichkolwiek zobowiązań do spłaty alimentów w emocjach i zaangażowaniu wobec tej spłaty alimentów w emocjach i zaangażowaniu wobec tej wielkiej nemezis, jakim jest Życie. \n\nI tak wisisz między jednym stanem a drugim, nie należąc do żadnego z nich. Nie jest to życie, ale nie jest to śmierć. Tą drugą opanowałem. Zabiłem wszystkich których kiedyś darzyłem sympatią, przyjaźnią, czymś więcej. Pozostali odwrócili się, gdyż wyjścia już innego nie posiadali. Osiągnąłem to co chciałem. Wygrałem. Sprowadzając się cały czas w kierunku dna orientujemy się z dnia na dzień że coraz to inne kawałki duszy odłamują się od nas szybując szybciej od nas w niebyt. Ostateczną fazą tego lotu jest obojętność na wszystko co nas otacza.\n\nNazywam się Aleksander Bargieła. Jestem zwycięzcą, skazanym na życie w świecie który sam sobie wyrwałem z łap losu. Naród jest tylko etapem który trzeba było przejść by być w stanie zerwać pieczęcie z bram piekieł i rozpętać tutaj pożogę z której wyłoni się nowy porządek."
dgr_nazbol.42.a: "Pozostają tylko bogowie do zabicia."

dgr_nazbol.43.t: "Presupposition of Your Life"
dgr_nazbol.43.desc: "The upper crust of historians gathered in the main hall of the College of Strategic Planning in Dąbrowa Górnicza. Waiting. They were supposed to hear a lecture from a well-versed expert who would offer a new, enlightening way to view history through a historically materialist lens. Yet no one came. All of the more dignified professors looked around to try to guess which of their colleagues beat them to being the court historian of the Party. Yet every possible candidate was in the audience. The uncertainty fueled their discontent, just as did the fact that the conference was supposed to be held in the new Gierek University, but alas, the construction was delayed. All things considered, the hall was like a powder keg waiting for a spark.\n- Does anyone know what the topic of the lecture would be?\nAll hell broke loose.\n- I think it's clear we'll be discussing the precise stage we found ourselves in - Professor Gwóźdź started in a posh tone.\n- Not this again, Artur - Professor Szmajdziński turned back to shush him.\n- Why would I? The Fall of Poland caused material conditions to deteriorate to such a scale that we're back on the pre-capitalist stage. As I have proven multiple times, it's the most important issue of today that we focus our research on the early post-feudal economy to help the economic planners get us back on track to communism.\n- You'll poison their minds with your revisionism. Once you start surveying Podlasie, you'll determine they've regressed to primitive communism, and urge us to build a slave society.\nThen one could hardly hear their reasons and arguments among all the quarreling that ensued. It went on for 20 minutes until it was eventually stopped by the opening of the door to the hall. All the eyes turned to the unknown guest. Instead of a distinguished researcher, they saw a young man i n a uniform. He let the door close behind him and entered the pulpit followed by eyes of historians gathered, who waited for him to announce the lecturer. Even after he started speaking.\n- You may think you know what communism means. - he said in a rough voice- You may have heard of some fairy tales about a happy land of equals with no one to tell you what to do. But that is because you've been living under the capitalist system for too long. As you know, being shapes consciousness, and so you, the old generation, can only ruin communism, not build it. Look at you. The youngest among you may try to present yourselves as distinguished gentlemen and ladies, but in your youth they most likely paraded in obscene clothes and colored hair.\n- Who are you, sir. And how dare you talk in such a manner to us? - One of the professors stood up.\n- Colonel Oskar Ulbrich. And you are my regiment. I've been sent to make it clear that the Party will not tolerate any further deviations from the mainstream during your research. Understood? Look at the history books from the PRL, the pinnacle of Marxist historiography. Look, aside from the materialism, it focuses primarily on the non-stop 1000 years struggle of the Polish nation against the German threat! You want to further the cause of the people? The people want a nation. No other socialist state functioned without nationalism. Once they tried to change that, the system collapsed. In the 1990s, it could be excused as an honest mistake. Now, you know better, so it will be considered treason.\nThe intellectuals looked at themselves, though no one dared to speak up."
dgr_nazbol.43.a: "Dismissed!"

