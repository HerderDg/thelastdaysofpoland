 DGR_industrial_heart6: "Przemysłowa potęga"
 DGR_industrial_heart6_desc: "Potęga przemysłowa Zagłębia była budowana dekadami, a wystarczyło kilka lat rządów kapitalistycznych by wszystko to zostało obrócone w nicość. Zamknięte kopalnie, zawarte szyby, tylko wiatr niesie echo poprzednich dokonań gospodarczych w tym regionie. Upadłe huty, polikwidowane fabryki, zrujnowane sieci kolejowe. I tylko wiatr teraz niesie echo niegdyś dumnej gospodarki tego regionu. \n\n§GTytanicznym wysiłkiem całego ludu udało nam się przywrócić namiastkę tej potęgi przemysłowej, i serce przemysłowe znowu bije mocnym rytmem. Doprawdy, staliśmy się największą potęgą przemysłową w całym regionie, a może i nawet w Polsce!§!"
