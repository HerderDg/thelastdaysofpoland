DGR_metalowiec_gunboat_desc: ""
DGR_pogoria_monitor: "Monitor klasy Pogoria"
DGR_pogoria_monitor_desc: ""
DGR_janczyszyn_project: "Projekt Janczyszyn"
DGR_janczyszyn_project_desc: "Ukoronowanie całego bezsensu udoskonalania marynarki wojennej. Od zawsze w Polsce żartowano z obietnic polityków, że jak będą zdesperowani to obiecają nawet i lotniskowiec. Po czym w jednej kampanii faktycznie zostały obiecane. Nie jeden a dwa. I mniejsza już o to, ale...nie - kurwa nie wierzę że my w to na serio brniemy. Lotniskowiec? Ja pierdolę, i może jeszcze nazwiemy go Jan Paweł II? A na pokładzie będzie miał małe samolociki. Można będzie robić z tego mnóstwo żartów bo tylko do tego to się chyba nadaje.\n\nChociaż...biorąc pod uwagę, że nasza wojna jest na ukończeniu i zaraz przyjdzie nam ekstrapolować naszą potęgę wojskową na skalę regionalną - taki symbol potęgi nie byłby nawet najgłupszym pomysłem. Jeśli tylko damy radę wyprowadzić naszą flotę z mentalności wojny z watażkami których największym osiągnięciem była dzida na kajaku. A więc proszę Państwa...chyba robimy lotniskowiec?"
DGR_redirect_regional_budgets: "Przekierowanie budżetów samorządowych do centrali"
DGR_redirect_regional_budgets_desc: "Samorządy zawsze specjalizowały się w przepierdalaniu pieniędzy na najbardziej idiotyczne projekty. To ktoś postawi ławkę za kilkaset tysięcy, tu ktoś jakiś pomnik papieża lub innego celebryty za miliony złotych, a potem toaletę za 650 tysięcy złotych którą będa budować przez 4 lata. Nie ma lepszych gangsterów od ludzi robiących miejskie przetargi. Bo szwagier ma firmę co kostkę brukową robi - to spoko, zabetonujemy tą kostką cały rynek! I tak się kręci interesik. \n\nTrzeba powiedzieć temu stop. Nigdy więcej na naszej warcie nie będzie takich wałków robionych, ani na wsiach, ani w metropoliach. Po części dlatego że właśnie zdecydowaliśmy o przekierowaniu większości środków samorządów do centralnego funduszu zbrojeniowego. Lepiej spożytkujemy te pieniądze wydając je na coś funkcjonalnego i coś co pomoże naszym żołnierzom a nie napełni kieszenie nepotycznym kolesiom."
DGR_freeze_civilian_infrastructure: "Zamrożenie cywilnych projektów infrastrukturalnych"
DGR_freeze_civilian_infrastructure_desc: "Jak bardzo drastycznie by to nie brzmiało - w pewnych sektorach musimy częściowo zawiesić rozbudowę i działalność. Wstrzymanie cywilnych projektów infrastrukturalnych pozwoli nam na przekierowanie funduszy do sektorów które bardziej w tym momencie potrzebują pieniędzy - na wojsko. To wyjątkowa sytuacja która może nam przysporzyć sporo niezadowolenia i sami możemy wprowadzić się tutaj w pułapkę...bo okaże się że tam gdzie była potrzebna droga, idzie front i nasze jednostki nie będą mogły się skutecznie przemieszczać...ale cóż - musimy poświęcić się trochę. Najwyżej w takich wypadkach będziemy nacjonalizować wszystko co się da i przekazywać dane działki pod armię by można było użyć strategicznych rezerw na odbudowę danej infrastruktury. Ale to tylko w niektórych wyjątkach. Nie próbujcie się nawet kurwa obrażać - musimy jakoś skończyć wojnę!"
DGR_liquidate_private_assets: "Likwidacja pozostałych majątków prywatnych"
DGR_liquidate_private_assets_desc: "Nasza walka z prywaciarzami odniosła ogromny sukces na tym polu, większość milionerów nie posiada już swoich bogactw a wszelkie mienie zostało odpowiednio zredystrybuowane pośród...potrzebujących. Ale w miarę jak podbijamy dalsze tereny, nadal znajdujemy kolejnych nowobogackich którzy myślą że zapomnimy o nich. Noszą na plecach ogromnę znamię wyzysku niewinnych ludzi, więc jak możemy ich w ogóle pominąć? \n\nMusimy podwoić nasze wysiłki żeby wszelkie prywatne bogactwa znacjonalizować i przekierować do funduszu wojskowego. W końcu jeden taki prywaciarz mógłby sobie zafundować prywatną armię z pieniędzy które posiada. A niektórzy to nawet cholera robili podczas Upadku. A jak czegoś nie będzie się dało zmonetyzować - rozebrać do zera lub sprzedać na części - wszystko musimy wykorzystać do ostatniego grosza."
DGR_special_purpose_forces: "Siły specjalnego przeznaczenia"
DGR_special_purpose_forces_desc: ""
DGR_maroon_berets: "Bordowe berety"
DGR_maroon_berets_desc: ""
DGR_green_berets: "Zielone berety"
DGR_green_berets_desc: ""
DGR_blue_berets: "Niebieskie berety"
DGR_blue_berets_desc: ""
DGR_restore_jwk: "Przywrócenie Jednostki Wojskowej Komandosów"
DGR_restore_jwk_desc: ""
DGR_special_industrial_group: "Specjalna Grupa Przemysłowa"
DGR_special_industrial_group_desc: "Czy ja jestem tutaj jedynym zdrowym na umyśle człowiekiem który pamięta bitwę o Azowstal? O lotnisko w Doniecku? O cholernych walkach o fabryki w Stalingradzie? Wojna się zmieniła, a tereny przemysłowe są najbardziej dogodnymi do obrony punktami strategicznymi. Oczywiście jeśli już znajdą się na linii frontu i nie mają jak produkować rzeczy które normalnie robili. To na takich właśnie operacjach polegających na infiltracji i przełamywaniu fortyfikacji terenów przemysłowych powinniśmy się skupiać a nie cudować z lotnikami czy marynarzami. Bo takie walki będą nas czekały prędzej czy później. A dotychczasowe doświadczenia pokazały nam że nasze wojska w ogóle nie są przygotowane na tego rodzaj operacji."
DGR_urban_sabotage_battalions: "Bataliony Sabotażu Miejskiego"
DGR_urban_sabotage_battalions_desc: "Wojna obecnie przypomina troszkę średniowieczną. Już tłumaczę - można sobie jeździć i zdobywać wsie, pola i inne nic nie znaczące lasy i bagna, armia sobie przejdzie, zrobi co swoje i potem nagle trafi na wielki ufortyfikowany zamek który musi oblegać. Bo miasta obecnie w doktrynie wojskowej pełnią rolę właśnie takich fortec które są okropnie ciężkie do zdobycia. Nie potrzebują oni wcale murów jeśli z każdego okna można wystawić karabin maszynowy a z każdego balkonu może na Ciebie spaść granat czy butelka z benzyną. Plus jest taki że chaos i tłok może działać również na naszą korzyść. Wystarczą odpowiednie oddziały dywersyjne które wysadzą parę kluczowych punktów w mieście, a inne zakradną się tunelami i wyjdą w samym sercu miasta siejąc chaos. Tylko to trzeba też potrafić a nie rzucić ludzi na pożarcie i niech się dzieje co chce. Zwykły żołdak tego nie zrobi, tu potrzeba odpowiednio wyposażonych i wyszkolonych batalionów sabotażystów miejskich."
DGR_red_guardians: "Czerwoni Strażnicy"
DGR_red_guardians_desc: "Kultura superbohaterów wykształciła w przeciętnym konsumerze swego rodzaju kult pieprzonego amerykańskiego światopoglądu. Tak bardzo gardzę tymi wszystkimi porównaniami do Kapitana Ameryki czy Supermana w każdym możliwym medium, że dam w pysk następnej osobie która zrobi to porównanie w odniesieniu do projektu Czerwonych Strażników. Oni nie będą biegali w jebanych piżamach i byli nieznośnie pompatyczni. To mają być maszyny do zabijania, szczyt rozwoju żołnierza, ogromny arsenał zamknięty w jednej osobie. Pierdolony terminator. Jak to chcemy osiągnąć? To już jest kwestia naukowców którzy nad tym pracują. A to że to wygląda jak z waszych zasranych komiksów to już wina waszego spierdolonego umysłu który nie może powstrzymać się od porównywania, że ŁAAAŁ, TO ZUPEŁNIE JAK W MOJEJ ULUBIONEJ SERII."
DGR_pkwn: "Manifest Komitetu Wyzwolenia Narodowego"
DGR_pkwn_desc: "Polski Komitet Wyzwolenia Narodowego kojarzy się z komunizmem, tak. Nie ma sensu udawać że ktokolwiek będzie na nas patrzeć inaczej niż jak na czerwoną zarazę. No to pójdźmy dalej w ten trend - musimy rozesłać manifest na cały świat. Odezwę, która będzie oświadczała jednogłośnie kto wygrał Polskę i jednocześnie przypominała o tym o co walczyliśmy. Bo to że walka nasza była o jeden kraj nie oznacza, że nasze wartości nie są uniwersalnie aplikowalne do każdego kraju na tym świecie.\n\nW szczególności do każdego kraju który jest spętany neoliberalną demokracją, kapitalistycznym batem czy autorytarnym uciskiem jakiegoś losowego władyki którego nie obchodzi nic poza własnym bogactwem. My nie kończymy tutaj naszej podróży, lecz jesteśmy pierwszymi przedstawicielami nowej ery która zaistnieje na świecie. Najpierw w Europie, a potem na całym świecie - wszędzie ludzie będą mogli czerpać inspirację z naszej walki, gdzie pomimo tego że szanse mieliśmy dosłownie zerowe - pokonaliśmy wszystkich i przejęliśmy władzę nad losem. \n\nTo my, Polacy."
DGR_eternal_watch: "Wieczna warta"
DGR_eternal_watch_desc: "I odszedł na wieczną wartę razem ze swoimi poglądami i całym Politbiurem. Nie będę udawał, że jakoś wielkie mi uczynił pustki tą śmiercią, w końcu trochę się przyczyniłem do jego rychłego końca. I tak za długo już był u progu Hadesu. Ale...to nadal jest dzień symboliczny. Bo od dzisiaj przestają już mieć znaczenie jakiekolwiek pozory. Jeszcze tylko pogrzeb i można brać władzę całkowitą. Żaden ideologiczny odpad nie stanie mi już na drodze. Historia wynagrodziła swojego wiernego sługę możliwością dostąpienia najwyższej władzy w kraju. Rozpoczynamy nową erę - erę żelaznej woli i odważnych czynów, erę odwagi i bezkompromisowości. Jeszcze tylko ustawić do pionu wszystkich tych pożal się Boże generałów i czas przyjdzie na otwarcie drzwi do areny międzynarodowej z hukiem."
DGR_state_funeral: "Państwowy pogrzeb"
DGR_state_funeral_desc: "Ostatni pozorowany czyn który muszę odbębnić - udawać smutnego na wielkim pogrzebie państwowym. Taka wydmuszka, że aż chowamy pustą trumnę. Ale nie za bardzo smutnego, takiego pogrążonego w lekkiej żałobie ale nadal ze stalową determinacją i pewnością siebie. Bo oczy całego kraju będą zwrócone na tę ceremonię - nie mogę sobie pozwolić na chwilę słabości. Oczekują niezłomnego wodza - i go dostaną. Nawet jeśli reszta jest mierna i chwiejna to kręgosłup jest nie do złamania. Kto by pomyślał, że jeszcze te kilkanaście lat temu taki człowiek jak ja dostanie od losu taką szansę? Ale wiele ludzi dostaje szanse. Tylko wielcy ludzie potrafią ją wykorzystać i uczynić z losu swoją marionetkę.\n\nNadchodzą wielkie czyny. "
DGR_second_wedding_to_sea: "Drugie zaślubiny z morzem"
DGR_second_wedding_to_sea_desc: "Komisarze Zimmermann i Zagórski coś knują. Powinienem się domyślić, że jak skończy się walka o Polskę to zacznie się polityczna gra kopania pod sobą dołków. Wielka parada z okazji odzyskania dostępu do morza brzmi ładnie, drugie zaślubiny z Bałtykiem brzmią patriotycznie a jednak...to wszystko jest podejrzane. Zbyt dużo sprzętu jest przerzucane na północ - tak, wiem że to parada wojskowa ale na paradę można się po prostu udać, nie trzeba przebazowywać takiej ilości sił. Może przez te lata wojny już całkowicie mi odbiło z paranoją i zamiast cieszyć się ze święta to szukam wymówki by znowu rozpocząć z kimś konflikt. \n\nAle to oni zaczęli! Tak, pojadę tam! Ale będę miał oczy dookoła głowy. Już i tak mówili mi wcześniej że doniesienia o tajemnicach tuszowanych przez komisarzy to tylko teoria spiskowa reakcjonistów....a co jeśli to była prawda?"
DGR_eastern_rising: "Powstanie Wschodnie"
DGR_eastern_rising_desc: "Spodziewałem się, że nie wszyscy od razu zaakceptują naszą władzę nad krajem. Z resztą, prowadziliśmy całą serię wojen unifikacyjnych po to. Ale wiedziałem, że nawet po zjednoczeniu będzie istniał opór. To naturalne i nieuniknione. I tak właśnie teraz dzieje się na wschodzie Polski - Lublin, Rzeszów, Przemyśl. No właśnie - Lublin, Rzeszów, Przemyśl. Wschód Polski od zawsze był mocno konserwatywny, a im bliżej granicy tym bardziej tradycjonalistyczne społeczeństwo się stawało. Nie zmieniło się to aż tak podczas wojen, więc...o co chodzi? Dlaczego mamy na swoich rękach powstanie ludność która powinna się cieszyć że narodowcy doszli do władzy?\n\nGwardia była aż nadto gorliwa by ruszyć większością swoich dostępnych sił do pacyfikacji. W sumie to słusznie, od tego oni są. Od tego są oni. Mimo to, nie chciałbym żeby ktokolwiek witał Czyżewskiego jako wyzwoliciela. Zawsze jak jest okazja to musi mi wbić jakąś szpilę, zawsze z czymś musi się nie zgodzić. No niech jedzie - może partyzanci załatwią ten problem za mnie."
DGR_ascension_of_one: "Wyniesienie Jedynego"
DGR_ascension_of_one_desc: "Ojciec zawsze powtarzał żeby nie dawać władzy ludziom, którzy swoim ego przewyższają rozum (chociaż on używał stwierdzenia - \"wyżej srają niż dupy mają\"). Tak czy owak, twierdzenie to jest prawdziwe. Jakim trzeba być zadufanym w sobie gnojkiem, jakim kurwa kretynem i narcyzem żeby będąc poważanym wysokim ministrem państwa pojechać do jebanego Grodziska Wielkopolskiego, zrobić sobie jakieś pierdolone jasełka i się koronować??? NA KOGO TY W OGÓLE SIĘ KORONOWAŁEŚ, TY NIE JESTEŚ U WŁADZY! Wielkie wyniesienie Jedynego - ja pierdolę, jeden to wynosi twój iloraz inteligencji. Powinienem dawno rozprawić się z tym zasranym sekciarzem. Powoli mam wrażenie że tracę kontrolę nad tym co te pokemony wyprawiają."
DGR_abraham_mutiny: "Bunt Abrahamowicza"
DGR_abraham_mutiny_desc: "Z Abrahamowiczem rozmawiałem wiele razy na tematy Kresów oraz o tym, że po skończonej kampani w Polsce powinniśmy siłą egzekwować naszą władzę na terenach utraconych. Oczywiście, trzeba to robić stanowczo ale jednak ostrożnie - wyczucie czasu w geopolityce jest jedyną umiejętnością która jest nam potrzebna do sukcesu. No więc, Żeligowski miał słuszność, rosyjskie zielone ludziki z Krymu dopracowały ten model prowadzenia polityki, a my go mieliśmy udoskonalić idąc na Wilno. Tak przynajmniej zakładały nasze dywagacje, ale nie zliczę ile razy podkreślałem znaczenie słowa CZAS.\n\nWięc zgadnijcie kurwa co? Nagłówki w Litewskich wiadomościach - POLACY GROMADZĄ WOJSKA NA GRANICY, NIEPOKOJĄCE WIEŚCI Z ZACHODU. A u nas euforia, jebany Rydz-Śmigły sie reinkarnował i krzyczą do niego \"Wodzu, prowadź na Wilno!\". Na pytanie co on odpierdala odpisał mi, że to tylko pozorowanie takie i nic beze mnie się nie wydarzy. Jakoś mu nie wierzę."
DGR_meeting_with_chief_pioneer: "Spotkanie z Głównym Pionierem"
DGR_meeting_with_chief_pioneer_desc: "Maciek Lasecki zdaje się jest moim ostatnim przyjacielem któremu mogę zaufać. Wiem, że stanie po mojej stronie nie ważne co by się działo. A dzieje się wiele, bo od kilku dni siedzę pod wzmożoną strażą w obawie o to czy aby te skurwysyny nie chcą mnie odstrzelić. Bo chcą mnie dopaść, na pewno chcą to zrobić. Hieny pierdolone, teraz już nie mają oporów żeby się mnie pozbyć. Maciek wszak jest Pierwszym Pionierem, szefem Korpusu Cywilnego, generałem Narodowej Armii Ludowej. Zawsze był rozważnym i spokojnym człowiekiem, dlaczego nie mogłem mieć więcej takich jak on? On mi wszystko powie, on będzie wiedział jakie są nastroje w społeczeństwie, prawdopodobnie ma też kontakt z resztą generalicji. On mnie nie zdradzi. Muszę się z nim czym prędzej zobaczyć. \n\nBo obawiam się że szachownica została rozłożona w momencie unifikacji kraju a teraz przez ostatnie parę miesięcy każdy rozstawiał swoje pionki..."
DGR_way_is_shut: "Konduktorze łaskawy, byle nie do Warszawy"
DGR_way_is_shut_desc: "Jak. Ja. Kurwa. Nienawidzę. Polityków. \n\nCentralny rząd cywilny który osiadł w Warszawie obsrał zbroję i stwierdził że się izoluje od tego całego bałaganu, zaraz po tym jak gwardziści obsadzili wszystkie szlaki i miasta na południe od Warszawy, a armia wyszła z baraków na północy. Co prawda jednak ta cała banda aparatczyków będzie bezużyteczna jeśli faktycznie dojdzie do kolejnej wojny domowej, ale teraz bardziej niż zwykle właśnie potrzeba soft power by jej zapobiec, a Ci wesoło stwierdzają że to nie ich sprawa.\n\nKamień na kamieniu nie zostanie z tego cholernego, zadufanego w sobie miasta. Choćbym i miał być porównywany do Hitlera to zburzę całą tę Warszawę, mieszkańców porozrzucam po pobliskich miastach a stolica...tę już mamy w Dąbrowie od dawna. Nie potrzebujemy tego zgniłego centrum."
DGR_struggle_for_fuel: "Walka o paliwo"
DGR_struggle_for_fuel_desc: "Wyścig szczurów rozpoczęty. Każdy teraz prześciga się o zdobycie jak największej ilości paliwa. Szczerze...to przypomina mi okres na niedługo przed naszą rewolucją w Dąbrowie. Wtedy też liczyliśmy każdą kroplę benzyny - i w końcu zdecydowaliśmy się napaść na konwój przewożący paliwo by móc zasilić czołgi ze Sztygarki. Eh...historia znowu zatacza koło. \n\nNasza baza paliwowa została ogromnie rozbudowana by utrzymać wymagania narzucane przez stale rosnącą Narodową Armię Ludową, więc zaplecze jest solidne. My się o paliwo bić nie musimy, bo je mamy. Oni, daleko nie zajadą i w końcu zaczną się żreć między sobą. A my po cichutku boczkiem zajdziemy ich i wydymamy od tyłu. A potem wjedziemy sobie do ich sztabów czołgami i zarządzimy ostateczny ład."
DGR_operation_crane: "Operacja Żuraw"
DGR_operation_crane_desc: "Jedno z powiedzeń które uwielbiam brzmi: \"Zawsze bądź gotów na to, że Cię wyruchają \" I o ile jestem zawiedziony postawą moich generałów to nie oznacza że jestem nieprzygotowany totalnie na akcje przeciwko mnie. Jeden z głównych sztabów komisariatu znajduje się w Gdańsku i tam też uderzymy. Na 90% wiem, że planują zdradę - w jaki sposób, tego nie wiem. Ale doniesienia wywiadowcze mówią wprost o podejmowanych ruchach w celu przejęcia władzy. Oczywiście, daj im palec a zeżrą Ci całą rękę.\n\nW takim wypadku na zdradę można odpowiedzieć tylko absolutną i kompletną anihilacją. Atak prewencyjny, pokaz siły, a może i uda się zmieść z planszy jednego z głównych komisarzy. Tak czy owak, Gdańsk i jego obywatele odczują gniew Narodowej Armii Ludowej. Sporo ludzi zostanie poświęconych w imię wyższego dobra ale jestem na to gotowy. Bo takiego potwora jak Zimmermann trzeba albo trzymać na łańcuchu albo uśpić. Mieszkańcy Pomorza jeszcze by mi dziękowali za zbombardowanie, gdyby wiedzieli jaką przyszłość zgotowałby im naczelny komisarz..."
DGR_love_letter: "Miłosny liścik dla Inkwizytora"
DGR_love_letter_desc: "\"Kurwa Szarejko, ty widzisz jakie ty głupoty kurwa robisz, weź się jebnij w łeb ale się wpierw rozpędź.\"\n\nDobra, przyznaję, to nie jest może najlepszy kawałek literatury jaki ze mnie kiedykolwiek wylazł, ale emocje biorą górę - nie będę do tego durnia pisał językiem dyplomacji bo go nie zna. Poza tym możliwe jest że w ogóle nie zdąży przeczytać tego co miałbym tam napisać. Dlaczego? A to już niespodzianka i nie będę zapeszać. Ale pomimo to, wydaje Ci się że znasz kogoś kilka dekad i wiesz do czego jest zdolny. A mimo to, pomijasz jego wady i wynaturzenia i liczysz na to że sama więź czasu utrzyma relacje pomiędzy wami. Ślepota i głupota z mojej strony. Sentymenty zabijają, a nostalgia jest jak kwas - wyżre Cię i nie będzie go nic obchodzić.\n\nTakże, w ramach sentymentu - żegnaj przyjacielu. Nie będę za Tobą tęsknił. Obyś zgnił w piekle, a jeśli tam nie będziesz chciał się udać - sam Cię tam wyślę."
DGR_assuming_direct_control: "Przejęcie bezpośredniej kontroli"
DGR_assuming_direct_control_desc: "Plansza może i jest rozstawiona, ale wszyscy zdaje się grają w warcaby, podczas gdy tu trzeba doświadczonych szachistów. Współczesne pole bitwy nie może być analogiczne bo przegra w każdym możliwym scenariuszu. Ten kto kontroluje energię, kontroluje dynamikę i narzuca ton walki. Na całe szczęście nasz kraj opiera się po pierwsze na intranecie, który właśnie odcięliśmy wszystkim innym, oraz na zamkniętym obiegu energetycznym, który również właśnie wyłączyliśmy. My sobie poradzimy bo przekierowaliśmy odpowiednie ilości do magazynów energii oraz posiadamy kilka największych jednostek elektrowni w kraju które dostarczą nam wystarczającą ilość prądu.\n\nReszta będzie dławić się w ciemnościach i chaosie komunikacyjnym. To tylko kwestia czasu zanim odwidzi im się buntów i zapanuje pokój oraz oświecenie. Pod moim nadzorem, oczywiście."
DGR_last_showdown: "Ostatni taniec"
DGR_last_showdown_desc: "Karaluch ma to do siebie że nawet i wybuch atomowy przetrwa. Nieważne co próbowałem, ta cholerna padlina wciąż dąży do buntu i co gorsza, aktywnie już sprzeciwia się władzy centralnej (mojej, bo Warszawa nikogo nie obchodzi). Historia lubi się powtarzać, ale pierwszy raz jako tragedia, drugi raz jako farsa. I teraz los ukarał mnie za swoją pychę. \n\nChyba że to nie jest kara, lecz ostateczny test po którym już zostaje tylko chwała. Żeby pójść dalej trzeba często spalić wszystkie mosty by nic za Tobą nie podążało. I to jest właśnie taka próba. W końcu kiedyś, oni wszyscy byli moimi przyjaciółmi. I żeby zająć miejsce w panteonie największych ludzi świata - muszą zginąć.\n\nWracamy do punktu wyjścia. Równi bogom już byliśmy. Teraz została nam walka o miejsce w piekle."
DGR_salvation_tactics: "Taktyki ocalenia"
DGR_salvation_tactics_desc: "Jesteśmy waszym zbawieniem. Waszą jedyną nadzieją. Zaakceptujcie to i nie stawiajcie nam oporu, albo zniszczymy was i wszystkich waszych bliskich. Kurwa, to dość ponure... ale mam już dość pobłażliwych próśb. Chociaż może dodajcie to gdy wszystko inne zawiedzie. I, że jesteśmy jedynym prawowitym rządem. Chociaż, wszyscy zawsze tak mówią. Ale my na serio nim jesteśmy, posiadamy Dąbrowę - miejsce, w którym wszystko się zaczęło.\n\nMusimy pozować na wyzwolicieli. Znowu. Gdy wokół wszystko płonie, miasta są bombardowane a skurwysyny spiskują - my przynosimy pokój i dobrobyt. Ten kraj jest chory, a my jesteśmy lekarzami i mamy lek na wszystkie bolączki ludzi. Tylko my możemy zabezpieczyć przyszłość dla nas i przyszłych pokoleń. Eh...jak ja kurwa nienawidzę reklamowania się."
DGR_rally_to_the_flag: "Zjednoczenie szeregów"
DGR_rally_to_the_flag_desc: "Błyskawica jest czerwona, młot wykuje żelazny miecz. A orzeł je trzymający mówi wprost - jeszcze Polska nie zginęła. Tylko pod tym znakiem, Polska będzie Polską a Polak Polakiem. Musimy zrobić użytek z państwa które zbudowaliśmy na bazie armii i wprowadzić powszechną i totalną mobilizację ludową. Przypomnieć ludziom o co tak naprawdę walczymy i dlaczego to nasze barwy są jedynymi narodowymi barwami które nie są splamione jarzmem zdrady.\n\nWykorzystać wszelkie dostępne środki, nawet za cenę odebrania ludziom wolnej woli. Na głaskanie cywili przyjdzie jeszcze czas, bo póki co skończyło się grzeczne podejście - TERAZ GRZMIĄ ARMATY."
DGR_volkssturm: "Narodowo-Ludowe Brygady Szturmowe"
DGR_volkssturm_desc: "Gdy armia jest w potrzebie, obowiązkiem każdego jednego obywatela jest chwycić za broń i walczyć! Nawet jeżeli ta walka będzie logistyczna i z dala od frontu - to wysiłek musi iść w jednym kierunku. Kobiety chciały równych praw - dajmy im również równe obowiązki. Młodzież będzie idealnym zastępstwem do jednostek garnizonowych, a weterani - raz złożonej przysięgi nie porzucą. \n\nJeśli wrogie kohorty wejdą do miasta, obowiązkiem każdego obywatela jest stawić im opór. Karabinem, butelką z benzyną, kamieniami - czymkolwiek. Jeśli będą chcieli zająć jakąś wieś - stawić im opór! Nie mogą być w stanie postawić nogi na naszej ziemi bez kogoś kto będzie z nimi walczył. Wszyscy na front!"
DGR_race_for_the_base: "Wyścigi szczurów"
DGR_race_for_the_base_desc: "Nie możemy dać się uwikłać w kolejną bezsensowną wojnę domową na wyniszczenie która to przecież trwała tyle lat. Teraz, gdy mamy bezcenne doświadczenie z Upadku i Wojen Unifikacyjnych, musimy przebijać się szybko i bezlitośnie w kierunku strategicznych punktów wroga. Niszczyć składowiska, przecinać linie logistyczne, zajmować sztaby jednostkami szybkiego reagowania.\n\nTo musi być szybka i bezbolesna kampania, bo im dłużej ona trwa tym bardziej będziemy wyglądać jak przegrana strona, nawet jeśli będziemy wyglądać. Wystarczy popatrzeć jak dobrze poszła Rosjanom wojna na Ukrainie. Wygrywali, pchali się do przodu ale jakim kosztem? Desanty, rajdy na tyły, wojna błyskawiczna - inaczej ugrzęźniemy na wysypisku historii i cała nasza rewolucja będzie na nic."
DGR_scorched_earth_tactics: "Taktyka spalonej ziemi"
DGR_scorched_earth_tactics_desc: "Jeżeli ten kraj nie jest w stanie dać mi władzy po tym jak ja oddałem całego siebie naszej ojczyźnie, to może nie zasługuje na to by być traktowanym z szacunkiem. Jeżeli obywatele nie są w stanie opowiedzieć się po naszej stronie, to dlaczego my mielibyśmy próbować ich chronić? Tych którzy do nas dołączą, otoczymy żelaznym kordonem pancernym i staniemy z nimi ramię w ramię. Ale reszta? Tu nie ma miejsca na obojętność. Albo jesteś Narodową Armią Ludową - albo jesteś wrogiem Narodowej Armii Ludowej. Proste i skuteczne.\n\nA Ci którzy będą wrogami poczują co to znaczy terror. Nie będą w stanie prowadzić żadnych działań wojennych jeśli nie będą w stanie się ruszyć, wyżywić ani zaopatrzyć. Podpalimy ten kraj i będziemy patrzeć jak płonie. A Ci którzy przeżyją ten pożar przyjdą do nas na kolanach błagać o wybaczenie. "
DGR_dark_cold_hungry: "Ciemno, zimno, i głodno"
DGR_dark_cold_hungry_desc: "Morale to największy atut żołnierza. Nawet gdy wszystko jest przeciwko niemu, żołnierz który ma niezłomną duszę jest w stanie przełamać wszelkie barykady. Ale gdy nie ma wyżywienia, ciepłego ubrania i zaopatrzenia...nawet największy weteran przestanie dbać o zwycięstwo a zacznie się martwić o przetrwanie. \n\nMusimy uderzyć właśnie w te podstawowe wartości. Zniszczyć wszystko z czego mogą czerpać żywność, przełamać wszelkie linie zaopatrzeniowe, odciąć energię od każdego miasta i wsi, złamać ich ducha. Wtedy każda armia rozpadnie się niczym domek z kart. Budynki będzie można odbudować, plony posadzić na nowo, drogi naprawić. Ale zwycięstwo będzie wieczne i ostateczne."
DGR_ultimate_rocket_strike: "Ostateczny atak rakietowy"
DGR_ultimate_rocket_strike_desc: "Kolejnym krokiem na drodze do ostatecznego złamania woli przeciwnika będzie nie tylko ich niszczenie od wewnątrz i atak lądowy. Ludzkość odkąd istnieje spoglądała w niebo ku gwiazdom zastanawiając się co ich czeka w przyszłości. Lecz gdy przestworza spowite zostaną niezliczoną ilością rakiet, nie będą już nigdy podnosić głowy.\n\nTerror jaki musimy zasiać pośród nich musi być ciągły i bezlitosny. Z każdym uderzeniem rakiety w budynek będą musieli się zastanawiać czy aby na pewno wybrali dobrą stronę. Czy to dzień, czy to w nocy - nie mogą zaznać spokoju. Głównym celem oczywiście będą miasta bo te najłatwiej zamienić w fortecę. Ale nie będą w stanie walczyć pośród gruzowisk. Nawet jeżeli zestrzelą część, reszta dosięgnie ich prędzej czy później. I gwarantuję wam, po takiej długiej serii nie będzie im się chciało walczyć w cieniu naszych rakiet."
DGR_human_wave: "Szturm fali ludzkiej"
DGR_human_wave_desc: "Gdy już terror zostanie osiągnięty na odpowiednim poziomie, będziemy musieli dołożyć do tego ostatnią cegiełkę - szturm lądowy. I normalnie, założeniem wojny jest to żeby zlikwidować wroga zanim ten zobaczy nas. Ale nie tutaj, nie teraz. Chcemy żeby nas zobaczyli. Chcemy żeby się nas bali, gdy zobaczą niezliczone fale ludzi idących ku nim by ich zniszczyć. To będzie ostateczny gwóźdź do ich trumny, bo jak mają się bronić kiedy nas będzie po prostu więcej? \n\nSowiecka taktyka zakładała to na całej szerokości frontu. To było rzucanie ludzi na rzeź. My z tego robimy jednak specjalistyczną broń, jako jedynie dopełnienie całokształtu na który pracowaliśmy wcześniej innymi środkami zastraszania. Fala żołnierzy zmyje cały ten brud który zalęgł się w zgniłych rejonach Polski. Opatentowaliśmy właśnie walkę strachem."
DGR_sabotage_tactics: "Taktyki sabotażu"
DGR_sabotage_tactics_desc: "Precyzja i efektywność przy minimalnych stratach i wysiłku bojowym. Przez wojnę już przechodziliśmy i nie mamy ochoty na kolejną. To będzie po prostu operacja pokojowa i precyzyjne wycinanie narośli na zdrowej tkance Narodowej Armii Ludowej. Musimy przekierować wszelkie możliwe siły na to by uniknąć grzęźnięcia w długotrwałej wojnie na szerokim froncie.\n\nGdy wroga broń przestanie strzelać, ich pojazdy nie będą w stanie ruszyć z bazy a prośba do dowództwa o rozkazy spotka się z echem po drugiej stronie, wszyscy wrogowie zorientują się że gra została ustawiona od początku i nie mieli żadnych szans na zwycięstwo. Szybkimi i zabójczymi akcjami utniemy głowę hydrze a cała reszta rozleci się po prostu i rozpierzchnie w cztery strony świata. A dalej, będziemy tylko zamiatać."
DGR_logistical_ruin: "Logistyczne i infrastrukturalne zniszczenie"
DGR_logistical_ruin_desc: "Gdy musisz dotrzeć na front to chcąc nie chcąc musisz skorzystać z dróg lub połączeń kolejowych. Szczególnie gdy przestworza kontroluje kto inny. Ale gdy tory kolejowe są wysadzone, mosty zniszczone a drogi zablokowane...cóż. Nie możesz walczyć tam gdzie Cię nie ma. Nie będziesz również w stanie walczyć czymś czego nie posiadasz. Zarówno paliwa jak i amunicji.\n\nTak się składa, że nie ma takiej możliwości żeby wybudowali nowe tajemne składy, magazyny i bazy paliwowe gdzie mogliby się ukryć. A my dobrze wiemy gdzie się znajduje każdy z tych punktów więc precyzyjne uderzenie w te punkty to tylko formalność. Rozmontujemy całe armie wroga jednym prostym trickiem, i będą sobie mogli krzyczeć do dowódców żeby przysłali im więcej amunicji i zaopatrzenia, ale Ci będą tylko mogli rozłożyć ręce. Bo fabryk też nie będą mieli."
DGR_behind_enemy_lines: "Za liniami wroga"
DGR_behind_enemy_lines_desc: "Tatarzy swego czasu byli diabelnie skuteczni, a to dlatego że nie obchodziły ich żadne twierdze ani granice. Po prostu wjeżdżali jak do siebie, brali kogo się popadło w jasyr, plądrowali co się dało i znikali zanim ktokolwiek zdążył zareagować. I tak właśnie musimy działać. Zmobilizować jednostki specjalne do szybkich i głębokich uderzeń na tyły wroga by sprawić wrażenie że jesteśmy wszędzie dookoła nich.\n\nIm głębiej uderzymy, tym większy chaos wywołamy. Nie musimy nawet zostawać tam za długo, wystarczy kilka odpowiednich równoległych akcji a zamieszanie i próba reakcji sprawi że czasami to nawet wykonają robotę za nas eliminując siebie wzajemnie. Bo gdy nie będą wiedzieli co robimy, dodatkowy efekt psychologiczny będzie piorunujący i sparaliżuje wszelkie plany przeciwnika."
DGR_great_chops: "Operacja Wielkie Kotlety"
DGR_great_chops_desc: "Cała ta farsa opiera się na kilku chciwych i zdradzieckich szumowinach, których omylnie przywykłem zwać przyjaciółmi. Ta pierdolona banda Brutusów próbując mi wbić nóż w plecy zapomniała o jednym - znam ich na wylot. Wiem jak myślą i w jaki sposób działają. I nie omieszkam wykorzystać tego przeciwko nim. A bez nich? Bez nich nie ma żadnego buntu, żaden z ich żołnierzy nie będzie w stanie kontynuować walki bez swojego lidera. \n\nRozwiązanie jest bardzo proste w założeniu - pozbyć się dowódców. Jednakże jest jeden problem - może nie dałem rady nauczyć ich zbyt wiele, lecz jedną rzecz jak na złość przejęli ode mnie perfekcyjnie. Są paranoicznie ostrożni. Zbliżenie się nie będzie łatwą rzeczą...ale odpowiednie zespoły uderzeniowe mogłyby w stylu amerykańskich sił specjalnych wlecieć po cichu, zrobić kipisz, złapać wrogiego przywódcę i uciec zanim ktokolwiek zdąży wstać i założyć kapcie. A to wygra wojnę bez wystrzału. A o co chodzi z tą kretyńską nazwą? To już mocno wewnętrzny żart. Tylko jakoś mi kurwa nie do śmiechu."
DGR_agonia_tozsamosci: "Agonia Tożsamości"
DGR_agonia_tozsamosci_desc: "To koniec. Zwycięstwo to jednak ma gorycz porażki. Brakuje mi słów na opisanie tego, w jaki sposób człowiek przybity do muru jest w stanie zmienić się w potwora który gotów jest spalić wszystko dookoła. A jednak, nie myśleniem lecz działaniem to się objawiło. Ludzkość jest skazana na wieczne granie tego samego dramatu przez wieki. Zmieniają się tylko aktorzy i rekwizyty. Ale ten rozdział jest już zakończony. Ktoś musiał być na czele, by móc stawić czoła nadchodzącej ciemności, ktoś musiał być tym który poprowadzi resztę. \n\nKtoś tam musiał stać żeby przyjąć na siebie pełen impet strzały zawiści przeszywającej na wskroś całą ludzką duszę, paraliżującej cały układ nerwowy i docierający aż do mózgu, który przestaje funkcjonować w obliczu tak przygniatającej odpowiedzialności za kraj i przyszłość narodu. Niszcząc wszystko i wszystkich co znałem zastanawiam się jedynie - co pozostanie? I czy ja w ogóle zasługuje na to by istnieć w obliczu czynów które popełniłem. Dla Polski. A może to zawsze było tylko dla samego siebie?\n\nTak oto rozpoczyna się agonia tożsamości."


 ## NARKOM ##
DGR_hour_of_the_wolf_nc: "Godzina Wilka"
DGR_hour_of_the_wolf_nc_desc: "The time has come for the revolutionaries to pay for their criminal actions against the government. What we did was an incredibly difficult decision - but a necessary one. The rest will not dare to repeat such an uprising, fearing an even harsher retaliation. The balance has tipped in our favor. All those subversives... they were waiting for the right moment. The old man was gone for just a second, and they were already at my throat. Not a chance.\n\nWith Szwej absent, and with martial law imposed, I will hold unlimited power. And believe me - I WILL restore order here."
DGR_bargiela_list_nc: "Lista Bargieły"
DGR_bargiela_list_nc_desc: "Enough. I can hardly stand the thought that those nests of decay - political parties and social organizations - were allowed to function without restraint. The main reason for my contempt is their complete and thoughtless detachment from reality. On top of that, they are responsible for the recent strikes and riots through their agitation. Was it really them? And does it even have to be true? By my estimates, around three-quarters of all social, political, and cultural organizations will cease to exist after the next decree. No one will need them. They will no longer sow chaos or poison people's minds - not when a better, state-controlled alternative exists."
DGR_capital_punishment_nc: "Kara śmierci"
DGR_capital_punishment_nc_desc: "When a man is too lenient, others begin to take advantage of it. Give them a finger, and they will want the whole hand. And if they don't get it, they'll take it by force. The doctrine of \"turning the other cheek\" has wrought absolute devastation in people's minds. It is time to return to the simplest principles. Christian mercy cannot function when war rages around us and survival is at stake. An eye for an eye. A tooth for a tooth. Death for betrayal. That Hammurabi was a wise man indeed. And before the philosophers start preaching that an eye for an eye makes the whole nation blind - no, it won't... not if we are the ones who control the vision.\n\nSo, what's it gonna be? Hanging? Beheading? Electric chair? Firing squad?"
DGR_assembly_ban_nc: "Zakaz zgromadzeń"
DGR_assembly_ban_nc_desc: "Gentlemen, colleagues - this is how it works: when you impose martial law, you also impose a ban on public gatherings. With the exception of those sanctioned by the Politburo, of course. Such a small decision, yet it clears the board of all unwanted pieces in one swift move. In the end, it comes down to a very simple rule: hold a public meeting, and you are an enemy. So if you're not an enemy - don't hold meetings. Simple and logical, isn't it?\n\nUnfortunately, the worst rats will flee underground, creeping through the shadows and the sewers. But we'll smoke them out too, step by step."
DGR_health_trails: "Ścieżki zdrowia"
DGR_health_trails_desc: "Now, now it's my time to shine. All bastards and traitors will be tried for their defiance against the state. I've come up with something very interesting.\n\nHealth Trails, something SB used back in the day , will be a perfect punishment for all anti-state activists. Oh, I already imagine all of those bureaucrats jumping in between the Inquisition soldiers, begging for their miserable lives while getting beaten by batons.\n\nI'm close to securing total control over Zagłębie. Soon, there will be no one left to stop me. My dream of a national revolution has never been closer."
DGR_halt_the_trials: "Zatrzymanie procesów"
DGR_halt_the_trials_desc: "They think they have a voice, huh? What do they even fucking imagine telling me what to do? Those false communists stand in the way of everything I was born to achieve. I swear they will pay for this insult in blood.\n\nThat old fool Szwej isn't coming back, and treacherous apparatchiks will be tried and punished for their defiance. This is nothing but a brief shadow, a minor setback. Soon, my inquisition will reclaim absolute control over Zagłębie.\n\n My reign has only begun. The true vision of National Poland shall be achieved, no matter the cost. "
DGR_suspend_the_martial_law: "Zawieszenie stanu wojennego"
DGR_suspend_the_martial_law_desc: "WHAT?! How?! No, no, no, it is not possible! That old bastard woke up and came back stronger than ever! He suspended martial law and, with one decree, ended my whole plan! Inquisition is in shambles, apparatchiks are starting to regain voice, and old cunt is celebrating. It is not how it was supposed to be, and I won't let it pass without a fight. Szwej, you son of a bitch, you will regret that! My army is still loyal and strong, so let's see who has bigger balls! Fuck you, Szwej!"
DGR_national_disposition_authority_nc: "Narodowy Urząd Dyspozycyjny"
DGR_national_disposition_authority_nc_desc: "The free market is a mockery of the society. It is a vast ocean into which people are thrown - most of whom cannot swim - in the hope that the economy will move forward just because we unleash people's entrepreneurship. Sure, but the one thing we won't unleash is the exploiters from prisons, where we will throw them for preying on people and their property. The economy must be planned - with room for improvisation, of course - but the main goal must be clearly established, and everything must operate according to the existing plan. Otherwise, the state will not function; everyone will do exactly as they please, and absolute chaos will ensue. And the only ones who benefit from that are the hustlers, not ordinary people.\n\nNational Disposition Authority is to serve as the governing body of the state economy. Of course, steering an entire economy is more like steering a massive ship. There isn't much room for maneuvering or sudden changes of course. Let's just hope there are no icebergs waiting for us along the way..."
DGR_home_of_the_revolution_nc: "Kolebka rewolucji"
DGR_home_of_the_revolution_nc_desc: "Dąbrowa. Polska ojczyzna rewolucjonistów i ruchu socjalistycznego w tej części kraju. Tu wykształcał się ruch robotniczy oraz rewolucyjny. Walczyliśmy już o wolność za czasów powstania styczniowego a potem pod koniec I wojny czy w czasie II wojny. Kiedy nadszedł pokój, czas nastał na inne rewolucje - dlatego też teraz mamy największe z zakładów przemysłowych w kraju. Ilość pomników komunistycznych znajdujących się na terenie miasta również zawsze przewyższała wszelkie normy. I to z Dąbrowy teraz wychodzi iskra która odmieni oblicze tego kraju na nasz obraz i podobieństwo. Po raz kolejny jesteśmy zwiastunami rewolucji."
DGR_zaglebie_only_city_nc: "Jedyne miasto Zagłębia"
DGR_zaglebie_only_city_nc_desc: "Jakie jest Zagłębie? Ano Dąbrowskie. Prawda. Na co komu w takim razie Sosnowiec? Albo Będzin? Dąbrowa zasługuje na miano największego miasta w Polsce. Poza tym, nie jesteśmy tu od wczoraj. Sięgaliśmy dalej na wschód i zachód. Zagórze, Ksawera, Sławków - to wszystko były tereny należące do Dąbrowy Górniczej. Ale ten etap konsolidacji mamy już za sobą. Ślązacy usilnie chcieli mieć metropolię ale na każdym kroku odmawiali nam równej reprezentacji, rzucając nam ochłapy takie jak uwzględnienie Zagłębia w nazwie. Łaski bez - zrobimy sobie własną metropolię, bez hanysów i bez śląskiego bałaganu."
DGR_urbanisation_effort_tricity_nc: "Wysiłek urbanizacyjny: Trójmiasto"
DGR_urbanisation_effort_tricity_nc_desc: "Słynne Dąbrowskie Trójmiasto - Łosień, Łęka, (Ł)Okradzionów. Ale same nazwy tych miejsc wskazują że nie są one zbytnio rozwinięte. Głównie to tereny nadal wiejskie, z gęstymi lasami i rozległymi polami. Spoko, nie są to jednak zarzuty - wręcz przeciwnie! Jest tam mnóstwo miejsca na stworzenie nowych osiedli. Ludziom z prowincji przyda się trochę ulicznej mądrości i luzu. Bo nasze bloki są zajebiste. No i w końcu musimy zredukować trochę procent Dąbrowy wsiowej bo z wielkim terenem przychodzi wielka odpowiedzialność żeby ten teren zabudować w sposób odpowiedni."
DGR_urbanisation_effort_strzemieszyce_nc: "Wysiłek urbanizacyjny: Strzemieszyce"
DGR_urbanisation_effort_strzemieszyce_nc_desc: "Strzemieszyce to co prawda bardzo niewdzięczna dzielnica, która kilkukrotnie próbowała udawać niepodległe miasto ale historia pokazała wprost, że im się to po prostu nie należy. Strzemieszyce w odróżnieniu od pozostałych dzielnic Dąbrowy zewnętrznej, mają nawet kilka blokowisk. No dobrze - kilka to gruba przesada. To jest parę biednych bloków na krzyż. Ale przynajmniej zaczęli. Przez dzielnicę idzie też główna arteria komunikacyjna na wschód, więc aż się prosi by zacząć tutaj rozbudowę infrastruktury mieszkalnej. A miejsca też nadal jest sporo, chociaż gdzieniegdzie będziemy musieli osuszyć tereny podmokłe. Ale to nigdy nie przeszkodziło w budowaniu wielkiej płyty, prawda?"
DGR_urbanisation_effort_antoniow_nc: "Wysiłek urbanizacyjny: Antoniów i Ujejsce"
DGR_urbanisation_effort_antoniow_nc_desc: "Antoniów, Ujejsce czy Trzebiesławice - im dalej na północ Dąbrowy tym większe to zadupie. Podobnie jak w Polsce ogólnie - na południu cywilizacja i przemysł, a na północy bagno i gówno. Antoniów to w zasadzie część Ząbkowic, ale po tym jak bandyci zrobili sobie z Ząbkowic wielki skłot, ta dzielnica nie nadawała się do zamieszkania zbytnio. Antoniów musimy wydzielić, włączyć do niego osiedle Młodych Hutników i rozbudować. A następnie, iść na północ z budową. W końcu w tym rejonie może powstać kiedyś jakaś wielka inwestycja, która będzie potrzebowała zaplecza w postaci prężnie działających ośrodków mieszkalnych. I miejmy nadzieję - zabudujemy trochę tę biedę."
DGR_expand_zaglebie_palace_of_culture_nc: "Rozbudowa Pałacu Kultury Zagłębia"
DGR_expand_zaglebie_palace_of_culture_nc_desc: "Możecie zapytać, dlaczego w ogóle ktoś chciał zdecydować się na postawienie drugiego Pałacu Kultury w Polsce? Bo co, ten w Warszawie nie wystarczył? Może i wystarczył, ale Aleksander Zawadzki chciał mieć tak samo fajny pałac w swoich rodzinnych stronach. No i go dostał, ale nie jest on taki wysoki...\n\nPrzez lata chodziły plotki, że to przez to że Dąbrowa jest postawiona na terenach pokopalnianych i jakby zbudowali coś tak gigantycznego to całe miasto by się zawaliło. Śmiechu warte, może się jeszcze skorupa ziemska otworzy i nas pochłonie za grzechy? Nie ma się czego bać, tylko rozbudować! Sięgniemy nieba tą wieżą. I Bóg nas za to tym razem nie ukara - bo nie istnieje."
DGR_prepare_niegowiczki_landing_strip_nc: "Przygotowanie lądowiska w Niegowoniczkach"
DGR_prepare_niegowiczki_landing_strip_nc_desc: "Absurd lotniska Katowice-Pyrzowice jest wszechobecny na wielu równoległych płaszczyznach. Nie jest w Katowicach, i nie jest nawet blisko Katowic. Jest bliżej Dąbrowy niż Katowic. Zresztą po cholerę im to lotnisko, skoro mają całkowicie dobrą lokalizację na Muchowcu? Nam też się to nie przyda bo leży bardzo blisko granicy państwa, przez co narażone jest jeszcze bardziej niż zwykle na ataki. No i tutaj na ratunek przychodzi nam niepozorna wieś Niegowoniczki. Co z nią? Ano, znajduje się tuż obok Dąbrowy na wylocie z Łośnia. A teraz najlepsze - już tam nawet istnieje malutkie lądowisko. I za dużo ludzi przesiedlać nie trzeba bo tam może z 10 domów jest. Idealne miejsce na lotnisko."
DGR_expand_voivodeship_road_790_nc: "Rozbudowa drogi wojewódzkiej 790"
DGR_expand_voivodeship_road_790_nc_desc: "Może i droga wojewódzka 790 prowadzi przez Niegowoniczki, ale zbyt dobra to ona nie jest - dwupasmowa, dwukierunkowa, a do samego lądowiska trzeba jechać polnymi dróżkami. Zapewne kojarzycie państwo nowoczesne lotniska, prawda? Co się dookoła nich znajduje? Autostrady, wielkie terminale, ogromne huby komunikacyjno-zaopatrzeniowe. No właśnie, niestety to będzie największym wyzwaniem. Bo trzeba doprowadzić tutaj cywilizację i rozbudować to na styl tego co znajduje się już w Pyrzowicach. Część da się przenieść, część trzeba będzie zbudować od nowa."
DGR_move_pyrzowice_nc: "Przeniesienie lotniska w Pyrzowicach"
DGR_move_pyrzowice_nc_desc: "Nie wiem co jest trudniejsze - przeniesienie fizyczne terminalu (a raczej skopiowanie go używając tylu części ilu się da), czy cała ta pierdolona papierkologia. No tak - przenieśliśmy lotnisko - i co nam zrobicie? A to że świat dalej używa map na których znajduje się port lotniczy Katowice-Pyrzowice to już nie nasza sprawa! I tak tu nikt nie ląduje zza granicy. Jeszcze. Po wojnie będziemy się martwili z urzędami i podaniami - nie mamy czasu na to teraz. Powstał port lotniczy Dąbrowa. I to powinno wszystkich obchodzić. A nie to czy czasem lotnisko na które lecą istnieje czy nie. Po prostu zrobicie pull up i sobie polecicie dalej. Wielki mi problem..."
DGR_restore_the_pyrzowice_airport_land_nc: "Rekultywacja ziemi wokół byłego lotniska"
DGR_restore_the_pyrzowice_airport_land_nc_desc: "Tereny dookoła lotniska...kiedyś należały do mojej rodziny. Rodzice babci od strony ojca posiadali tam duże połacie ziemi. Wszystkim żyło się wspaniale, dopóki oczywiście nie przyszli Niemcy, którzy postawili w 1940 tam lotnisko zapasowe dla Luftwaffe. Ludność oczywiście została wypędzona. Ale gdy po zakończeniu wojny ludzie próbowali tam wrócić...Sowieci ich wypędzili po raz drugi. Bo szkoda nie wykorzystać już istniejącego lotniska. A po Sowietach, Wojsko Polskie weszło i zrobiło tam lotnisko wojskowe. Teraz, po prawie stu latach naprawiamy ten historyczny błąd. W końcu...ojcowizna wraca w ręce ludu. Będę sobie musiał postawić tam dom."
DGR_pogoria_naval_commissariat_nc: "Komisariat Marynarki Wojennej Pogoria"
DGR_pogoria_naval_commissariat_nc_desc: "Doświadczenie to my w pływaniu mimo wszystko mamy. Pogoria może i nie jest zbyt dobrym miejscem na centrum marynarki bo nie dopłyniemy tam większymi statkami. Ale możemy tam postawić centrum oficerskie dla floty wojennej, no i żeglarsko też można się tam dokształcać. Nie będzie to idealne, ale jako zaplecze dla naszych kadr które będą swoje pierwsze kroki stawiały w marynarce wojennej sprawdzi się idealnie. W końcu nie ma co wysyłać ich od razu na głęboką wodę. Bo może i jeziora mamy, lubimy i po nich pływamy to nie jesteśmy morskim krajem, nie mówimy do siebie \"Ahoj\". Dlatego zaczniemy od Pogorii, a skończymy na Bałtyku. Tylko nie od razu."
DGR_tourist_heaven_in_pieklo_nc: "Turystyczny raj w Piekle"
DGR_tourist_heaven_in_pieklo_nc_desc: "Piekło jak sama nazwa wskazuje jest idealnym miejscem na wypoczynek. I to nie jest nawet ironiczne stwierdzenie bo kolonia Piekło znajduje się na niewielkim pasie ziemi umieszczonym pomiędzy dwoma najpopularniejszymi zbiornikami wodnymi w Zagłębiu - Pogorią III i Pogorią IV. Już teraz są tam plaże, kluby jachtowe, restauracje, domki na wynajem. Ale wiecie czego tam brakuje? Rozmachu. Wielkie, ludowe kurorty jak w Złotych Piaskach w Bułgarii. Ale nie te prywaciarskie molochy od Gołębiewskiego, lecz komunalne osiągnięcia socrealizmu. Cisza, spokój, woda, obok lasy, blisko do miasta, a jak się obrócisz to nawet widać Hutę Katowice!"
DGR_edward_gierek_university_nc: "Uniwersytet im. Edwarda Gierka"
DGR_edward_gierek_university_nc_desc: "Jak już wszystko nazywamy imieniem Gierka to warto byłoby pozbyć się tego prywaciarskiego wynaturzenia jakim jest Wyższa Szkoła Biznesu. W końcu nawet sama nazwa wskazuje na reakcyjną burżuazję. Biznes. Bo tylko to dla was się liczy, mamona i szmal. Uniwersytet to miejsce na inspiracje, na wymianę idei, na krzewienie idei! Dąbrowa potrzebuje prawdziwej ludowej uczelni. Takiej na której nie będą uczyć pseudoprofesorowie próbujący wcisnąć młodzieży herezje Balcerowiczowskie, ale takie które pokażą im jak może działać państwo dowodzone przez kogoś z planem, gdzie nie zostawia się rzeczy w próżni na pożarcie przez chaos rynkowy lecz działa z determinacją by wszelkie siły natury nagiąć do własnych potrzeb. To jest właśnie socjalistyczny imperatyw. I tego musimy uczyć."
DGR_great_wall_of_brynica_nc: "Wielki Mur na Brynicy"
DGR_great_wall_of_brynica_nc_desc: "Musimy zbudować mur. I sprawimy że Śląsk za niego zapłaci. Ale żarty żartami, naprawdę to zrobimy. Brynica od zawsze była murem który oddzielał ludową cywilizację Zagłębiowską od ciemnych hord Ślązaków. Największym oczywiście problemem jest to że z okien sosnowieckich bloków na najwyższych piętrach widać Katowice. I to nie jest prawda, że najlepsze co Cię może spotkać w Sosnowcu to autobus do Katowic. Najlepszym jest to, że nie będziesz musiał do tych Katowic jechać bo u nas jest lepiej. I w drugą stronę to nie może zadziałać - nie możemy wpuścić tutaj ani jednego Ślązaka. Przyjdzie czas by im pokazać kto rządzi tym krajem, ale póki co w razie zdradzieckiego ataku na serce Zagłębia musimy być ufortyfikowani by móc odeprzeć ich ataki. Bo to już by było zbyt blisko Dąbrowy."
DGR_peoples_medical_center_nc: Ludowe Centrum Medyczne"
DGR_peoples_medical_center_nc_desc: "Służba zdrowia w Dąbrowie zawsze miała okropną renomę. Przychodnie odstraszały ludzi personelem i brakiem znieczulenia, SOR był zwany umieralnią, główny szpital był wiecznie niedofinansowany, a placówka na Hucie była podróżą do lat 50 ubiegłego wieku. Trochę lepiej sytuacja miała się w sąsiednim Sosnowcu, ale tak po prawdzie - nie był to idealny stan. To się musi zmienić, nawet jeżeli będziemy musieli wypieprzyć wszystkich lekarzy i znaleźć nowych. Szpital Wojewódzki na granicy Sosnowca i Będzina jest już pokaźnym budynkiem i tam też powinniśmy wpompować wszelkie możliwe środki by chociaż ten jeden szpital był czymś czym możemy się poszczycić."
DGR_our_own_pentagon_nc: "Nasz własny Pentagon"
DGR_our_own_pentagon_nc_desc: "Nasza armia pilnie potrzebuje centrum dowodzenia z prawdziwego zdarzenia. Takiego Pentagonu. Miejsca gdzie sztab będzie mógł się spotykać bez ryzyka że ścianę obok obraduje Komisja do Spraw Mierzenia Średnicy Patelni. Tak po prawdzie, to jest główny powód - żeby uciec jak najdalej od politbiura. W sumie...nie musimy uciekać aż tak daleko. Skoro chcemy własny Pentagon, tak się świetnie składa że jest budynek który bardzo go przypomina. I jest on tuż obok głównego centrum rządowego. Techniczne Zakłady Naukowe. Uczniów przenieść można do innego technikum, sam budynek rozbudować, umocnić i proszę bardzo - jest i sztab!\n\nI tak kurwa, wiem że TZN to heksagon. Chodzi o przykład, ja pierdolę."
DGR_remove_bien_forest_nc: "Wykarczuj las Bienia"
DGR_remove_bien_forest_nc_desc: "Problem z rozwojem przemysłu jest taki że potrzebuje on coraz więcej miejsca. I o ile zazwyczaj mamy go, w obecnych planach sytuacja robi się trochę...krępująco ciasna. Między Tucznawą a Hutą Katowice, tam gdzie planujemy naszą ekspansję, stoi sobie Las Bienia. Ekologowie będą krzyczeć, ktoś tam przywiąże się do drzewa, trochę popłaczą i ich wywieziemy. Będzie drewna dużo na opał, i miejsce się znajdzie. Bo przecież, nie będziemy się rozczulać nad jednym lasem? Dziki i tak włażą pod bloki, nie potrzebują do tego lasów. A tych przecież macie jeszcze trochę, pojedźcie sobie poza miasto i macie a nie oczekujecie żeby w cywilizowanym centrum była dzicz..."
DGR_expand_tucznawa_zone_nc: "Rozbudowa strefy w Tucznawie"
DGR_expand_tucznawa_zone_nc_desc: "Skoro już usunęliśmy największą przeszkodę czyli ograniczenia przestrzenne - możemy zabrać się za rozszerzanie strefy przemysłowej na Tucznawie. I niektórzy powiedzą - ona jest już napompowana przez nas do granic możliwości i tak. A ja powiem - i tak nadal znajdują się lojalni przedsiębiorcy którzy chcą rozszerzać możliwości ludu pracującego. I zgłaszają się do nas o możliwość prowadzenia zakładów. I my im to umożliwimy. Bo możemy - i powinniśmy dbać o lud pracujący, prawda?\n\nTo skoro tak, to do roboty - zbudujmy jeszcze troszkę fabryk. "
DGR_expand_przyjazn_coke_plant_nc: "Rozbudowa Koksowni Przyjaźń"
DGR_expand_przyjazn_coke_plant_nc_desc: "Nadal ta nazwa do mnie nie przemawia po tylu latach. Ale już niech zostanie bo ludzie się nie zorientują co tak naprawdę tam stoi. A Politbiuro i tak sobie interpretuje że to chodzi o przyjaźń klasy robotniczej i wiejskiej, Polski i Związku Radzieckiego czy kurwa kobiety i mężczyzny. To jest nieważne. Ważne jest to że jak już ją odremontowaliśmy to warto ją uczynić największą koksownią w Polsce.\n\nBo do tej pory była na drugim miejscu. A tak nie może być. Skoro huta jest największa to i koksownia ma być! I przestańcie ją nazywać kokosownią, to jest poważny zakład do cholery!"
DGR_tucznawa_tworzen_strzemieszyce_triangle_nc: "Przemysłowy trójkąt Tucznawa-Tworzeń-Strzemieszyce"
DGR_tucznawa_tworzen_strzemieszyce_triangle_nc_desc: "Bardzo duża część połacia Dąbrowy jest usypana terenami przemysłowymi. Bardzo dużą część dodatkowo zabudowaliśmy nowymi zakładami. Na tyle, że w niektórych obszarach zaczęły się wytwarzać punkty stykowe pomiędzy trzema dzielnicami przemysłowymi. Zabudujmy już do końca ten trójkąt ziemi, i będziemy mieli ogromną superdzielnicę wytwarzającą taką ilość dóbr dla ludu że będziemy zakrawać o autarkię.\n\nI doprowadźmy w końcu tam porządną jezdnię a nie to dwupasmowe gówno. I tak tu już nikt nie zamieszka a przynajmniej skomunikujemy te tereny ze sobą."
DGR_industrial_powerhouse_nc: "Przemysłowa potęga"
DGR_industrial_powerhouse_nc_desc: "Całe państwo staje się przemysłową potęgą ale to nie oznacza że Dąbrowa musi ustąpić pola komuś w tym wyścigu. Wręcz przeciwnie - to my musimy pokazać jak się to robi, być pionierami odbudowy i przecierać szlaki tam gdzie reszta ludu jeszcze nie dotarła. Robić rzeczy więcej, bardziej, lepiej, mocniej. Mierzyć wyżej i dalej niż ktokolwiek inny bo nikt nie jest nas w stanie powstrzymać jeśli stoi za nami idea i żelazna wola.\n\nMiejsca jeszcze trochę zostało. "
DGR_powering_the_steelworks_nc: "Zasilanie Huty"
DGR_powering_the_steelworks_nc_desc: "Reindustrializacja na masową skalę wymaga energii. I wskaźnik zapotrzebowania niestety nieubłaganie rośnie. O ile jesteśmy w stanie doprowadzać energię z Łagiszy i Jaworzna, to połączenie jest ryzykowne. Jeśli odcięto by te tereny - cała strefa przemysłowa przestanie funkcjonować. Taki kolos jak Huta Katowice musi mieć swoje własne źródło zasilania. Ze względów redundancji, no i efektywności. A potem, jeśli damy radę, rozszerzymy moc na całą strefę. O ile nam starczy miejsca."
DGR_all_railroads_lead_to_slawkow_nc: "Wszystkie tory prowadzą do Sławkowa"
DGR_all_railroads_lead_to_slawkow_nc_desc: "Tak jak nie cierpię tych rebelianckich szumowin, tak trzeba przyznać że Sławków posiada ogromny atut w postaci gigantycznego terminala przeładunkowego. Nie sposób patrzeć na to z podziwem. Oczywiście oni nazywali to \"Euroterminalem\", ale ta nazwa nie jest odpowiednia dla czegoś co ma stanowić logistyczną perłę regionu. Nad tym jeszcze popracujemy, ale problem terminalu jest taki że o ile wszystkie koleje do niego prowadzą, tak możemy trochę popracować na innych frontach żeby uczynić ten kompleks jeszcze efektywniejszym.\n\nBo co jeśli zrobimy go jeszcze kurwa większym?"
DGR_14th_fuel_base_in_strzemieszyce: "14 Baza Paliwowa w Strzemieszycach"
DGR_14th_fuel_base_in_strzemieszyce_desc: "Ta baza paliwowa już istnieje ale od czasów wojen osiedlowych stała tak na wpół działająca. Potem funkcjonowała jako zaplecze logistyczne ale nigdy nie była tak wykorzystywana skutecznie jak mogłaby być. A na to jest zawsze proste rozwiązanie. Musimy ją powiększyć co najmniej dwukrotnie. Większe znaczy lepsze, a im więcej paliwa tym więcej możliwości zaopatrywania. A wszyscy wiedzą, że wraz z postępem i rozwojem przemysłu przychodzi więcej pojazdów, a każdy z nich potrzebuje paliwa. Nie wspominając już o naszej armii. Oj, żeby zasilić nowe zabawki trzeba będzie w nie trochę wpompować."
DGR_expand_boleslaw_mining_and_metal_plants_nc: "Rozbudowa Zakładów Górniczo-Hutniczych Bolesław"
DGR_expand_boleslaw_mining_and_metal_plants_nc_desc: "Kiedyś Polska była bardzo zróżnicowana pod względem wydobycia. Węgiel, ropa, gaz, cynk, aluminium, żelazo, miedź, sól, bursztyn, srebro, złoto, uran. I to wszystko przepadło w czasie, jak łzy w deszczu. Pozostały nam ochłapy. W Bolesławiu mamy Zakłady Górnicze-Hutnicze produkujące cynk. Jedyny w Polsce zakład który produkuje cynk. A jak coś jest jedyne w Polsce to trzeba na to chuchać i dmuchać.\n\nJeszcze wrócimy do tych czasów. Ale póki co wykonajmy chociaż jeden krok i zachowajmy nasz polski cynk. A i same zakłady dostarczą nam sporo radości w zakresie maszyn, zarówno cywilnych jak i wojskowych."
DGR_national_mechatronics_plant_nc: "Narodowe Zakłady Mechatroniczne"
DGR_national_mechatronics_plant_nc_desc: "To że mamy przemysł to jeszcze fajnie jakby odpowiadał on wymaganiom współczesnego świata. Zakłady produkujące roboty, układy scalone czy części do wielkich maszyn autonomicznych to przyszłość. Ale problem polega na tym że jest to fajne hasełko rzucone na wiecu politycznym, a nie konkretna zapowiedź tego co nadejdzie. Bo skomplikowanie obecnej technologii jest na tyle duże że albo będziesz miał mnóstwo różnych linii produkcyjnych, albo wiele zakładów które specjalizują się w jednym. Będziemy potrzebowali i tego i tego żeby nadrobić stracony czas który mogliśmy wykorzystać na postęp i badania.\n\nAle to zaprocentuje w przyszłości. Bo ta już tuż tuż."
DGR_the_only_dabrowa_nc: "Jedyna Dąbrowa która się liczy"
DGR_the_only_dabrowa_nc_desc: "Jest wiele Dąbrów w Polsce. Dąbrowa Tarnowska, Dąbrowa Zielona, Dąbrowa Białostocka, czy dosłownie kilkaset zwykłych Dąbrów i Dąbrówek w postaci małych wsi.\n\nAle tylko jedna jest tak wspaniała jak nasza. Tylko jedna posiada obywateli którzy skorzy są do osiągania najwyższych celów. Tylko jedna jest wyraźnie lepsza od pozostałych. Od dzisiaj, gdy ludzie będą mówili Dąbrowa to \"Górnicza\" będzie od razu w domyśle. Tak jak robią to od zawsze obywatele Dąbrowy. Z czasem, po prostu będziemy po prostu Dąbrową.\n\nI wszyscy zapomną o każdej innej. Albo im po prostu każemy zmienić nazwy i zdelegalizujemy inne Dąbrowy?"
DGR_national_science_department_nc: "Narodowy Wydział Nauki"
DGR_national_science_department_nc_desc: "Scientists are necessary for any state's long-term development and thus require extensive state funding. It's a simple fact. The intellectuals very much like it when someone points that out. They don't like the equally simple conclusion that comes from it: One who pays is the one who demands. In the eggheads' ideal world, they'd like to bleed the R&D budget dry, while free to pursue the studies that interest only them and their colleagues. Not gonna happen. They will receive funding only after proving their research project is worthwhile from the perspective of the state. And of course, their efforts will be monitored constantly. "
DGR_party_institute_of_social_sciences_nc: "Partyjny Instytut Nauk Społecznych"
DGR_party_institute_of_social_sciences_nc_desc: "It's not like I think that we need some detailed ideological faculties in Universities. Our purpose should be clearly visible and easily felt by all members of our nation. It should be expressed by decisive actions of the leader, not by a lengthy thesis. Don't get me wrong, oversight over the humanists is necessary for any respectable state. They are the group that would most likely try to undermine the current regime, and not always for good. It is control, not the content of the curriculum, that matters the most. Does it have anything to do with genuine science? No, but neither did the degree courses of European or Gender Studies, when the humanities were supposedly free."
DGR_incorporate_faculty_of_nature_science_nc: "Inkorporacja Wydziału Nauk Przyrodniczych"
DGR_incorporate_faculty_of_nature_science_nc_desc: "The branch of Silesian University in Sosnowiec. Need I say more? For decades, the University from Katowice has been developing a facility for the benefit of the field of natural science. But why should anything Silesian have anything to do with a Zagłębian city? It's time to rectify that mistake by separating the famous 'Razor' to help Zagłębie stand on its own when it comes to science. Of course, a single faculty won't be able to stand on its own, so it will be integrated into the Zagłębian infrastructure we're developing. And besides, such restructurization will allow us to take a closer look at its cadres and organization."
DGR_central_supercomputer_xenon_nc: "Centralny Superkomputer 'Xenon'"
DGR_central_supercomputer_xenon_nc_desc: "The leader needs a robust and unflinching obedience. He needs to aggregate a tsunami of data to properly organize the economy, military, and science. What better way to achieve that than by using the supercomputer, in which copper wires dominate over neurons and nerves? Well, to be honest, neurons and nerves are much more available, but that shouldn't stop us. It's true that we don't have the know-how, material, or plan, but each great project can be reduced to smaller components. Recognizing that truth, we will connect as many less advanced computers as possible to construct a single machine with enough computing power to store an artificial superintelligence."
DGR_economic_maneuver_nc: "Manewr gospodarczy"
DGR_economic_maneuver_nc_desc: "There's no denying that the economy has been brought to the brink of... collapse. And, of course, as usual, it's all the fault of people who think they are great patrons of economics and know-it-alls, when the only thing they've actually consumed is a summary of Karl Marx's Das Kapital - without understanding a single word of it. And so, they have brought the housing market to a crash, dealt a death blow to agriculture through collectivization, and where factories once stood and were supposed to be rebuilt, there are now only dug-up pits and structural skeletons.\n\nTo make matters worse, the Politburo has announced an economic maneuver to halt the unfolding tragedy. I don't trust them enough to know that, first of all, this bodes nothing good for the country, and second, it will in no way contribute to strengthening the military's efforts. They'll be busy building completely useless straw hat factories while the military remains underfunded and the defense industry goes down the drain. Let the whole thing just fucking blow up already, I beg you."
DGR_central_housing_allocation_council: "Centralna Rada do spraw Przydziału Mieszkań"
DGR_central_housing_allocation_council_desc: "Yeah, well, bureaucratizing the housing allocation seems like a very great idea from the party! Well, no. I think the army should be accountable for that, but well, at least they care about equality.\n\nEveryone will have an equal chance to get a flat, and distributing the housing system would ensure that no developer controls the market. It seems like a good idea, but it didn't come from me, so I do have doubts.\n\nAnyway, I hope their patterns will prove unsuccessful, and people will realise that those traitors have no real skills to rule the country. "
DGR_housing_complaints_and_grievances_office: "Biuro do spraw skarg i zażaleń domowników"
DGR_housing_complaints_and_grievances_office_desc: "Housing complaints department? What a fucking dumb idea. So what now? Will we listen to some old Mrs Krysia, whose neighbour's cat shat at the doormat? Or Mr Andrzej's back problems and his desire for an elevator in the building?\n\nWhy should we give those people the time of day? Who cares what they think? We need to channel every resource into expanding our military, not catering to petty complaints.\n\nSo long as Szwej and his apparatchiks hold power, the reunification of Poland is a lost cause. I trust that the people will soon awaken, granting me the opportunity to fulfill my plan of the national revolution"
DGR_reinforce_the_reindustrialization_effort_nc: "Wzmożony wysiłek reindustrializacyjny"
DGR_reinforce_the_reindustrialization_effort_nc_desc: "I hope I've already mentioned how much I despise Balcerowicz and his cohorts of liberals who sold our country out for pennies? And it's total bullshit that the world is changing and we had to move into the service sector. Powerful countries don't abandon their industry entirely just because someone decided it's outdated and we need to respecialize. We became the economic dumping ground of Europe in exchange for poor handouts from EU subsidies.\n\nThe reindustrialization process we are undertaking is the right one; we just have to see it through to the end! For now, we are mostly lacking the political will and quick decision-making to rebuild more factories! That is why we must allocate more funds to this cause because it guarantees our prosperity, and only in this way can we show the rest of the world that the industrial era is still alive and well, and we don't give a rat's ass about your Excel spreadsheets!"
DGR_grants_for_heavy_industry: "Dotacje na przemysł ciężki"
DGR_grants_for_heavy_industry_desc: "Well, uh, right. We invest in heavy industry. Normally, I would say I'm very happy about it, but... we are investing in civilian industry. Did they forget about the military? What does Szwej even imagine?\n\nBelieving that expanding the civilian industry and handing out benefits will lead us to victory is pure wishful thinking. I never expected Szwej to be so naive. Dąbrowa's strength has always resided in its military, and I cannot bear to watch reactionaries and revisionists abandon the core principles of our state.\n\nToo bad for Zagłębie, but perfect for me. Another opportunity to seize power has just presented itself, because that will surely fail, definitely."
DGR_restitution_of_family_farms_nc: "Przywrócenie prywatnych gospodarstw"
DGR_restitution_of_family_farms_nc_desc: "Smashing the entire agricultural system with a sledgehammer was bound to end this way, of course. Since ancient times, if you pissed off the peasants, you had trouble. And that's exactly how they tried to introduce forced collectivization, as if they hadn't learned from the mistakes of the last century. But we must forgive the Politburo; after all, they are so backward that they are only at the stage of the October Revolution and think Lenin is about to arrive in Sosnowiec on a Pendolino train. He won't, because it doesn't stop there.\n\nWe must now backpedal on these missteps and, at least for the time being, partially restore private farms, return the land, and let people manage it once again. Otherwise, it would be quite hilarious if a communist government were overthrown by a peasant revolt. I'm almost tempted to see it happen... but oh well. We need to go back to the old model and introduce the new one slowly. Otherwise, we'll all starve to death."
DGR_inspection_for_hygiene_and_crop_quality: "Inspekcja Higieny i Jakości Plonów"
DGR_inspection_for_hygiene_and_crop_quality_desc: "Crop quality inspections? Farming hygiene? Who the fuck cares about that? At this point, I believe that they completely lost their minds. Inspecting the size of a potato? Measuring it?! That's what they do instead of diverting the resources to the military?\n\nThe party wants to compel producers to change their fertilizer mix if it doesn't align with new government guidelines. I don't know how it can be effective or do any good for the nation. Crops are crops, and we already have enough. I haven't seen any hungry people. What's the problem then? I mean, they just lost their minds, and that's it. "
DGR_special_commission_for_combating_sabotage_nc: "Specjalna Komisja do spraw Zwalczania Sabotażu Przemysłowego"
DGR_special_commission_for_combating_sabotage_nc_desc: "Economic sabotage is not just about people who show up at a factory and set it on fire. It is also about people who do not perform their jobs properly, or corporate secretaries who do not adhere to the political standards of our state. It is any person who consciously decides they will not fulfill the economic plan, or who ignores requests to put real effort into their work. Anyone who exposes a plant to losses through their ignorance or stupidity is contributing to the sabotage of the state. And whether you stand or whether you lie, you're getting a beating and that is why.\n\nThat is why we are establishing a special commission to combat manifestations of such sabotage, which will have virtually a free hand when it comes to enforcing anti-sabotage discipline among industrial plants. Unannounced inspections, surveillance, stings - whatever achieves the goal. And the goal is professional and conscientious work, with no room for mediocrity and greed; we are all working for the common good. We will station several special commissioners with operational capabilities in every industrial center. This way, we will very quickly spread a sense of discipline among all the slackers."
DGR_war_enrichment_extraordinary_tax: "Nadzwyczajny podatek od wzbogacenia wojennego"
DGR_war_enrichment_extraordinary_tax_desc: "How can an army work properly if it can't get a share of war spoils? Taxing, registry, who the fuck came up with that, huh? For years nobody had anything against it and now they are changing the narrative trying to say that military is reactionary? Such bullshit!\n\nEveryone knows soldiers, officers, and generals deserve something as a reward for their hardships, and, truly, finding a new way to bureaucratize everything is so stupid. But yeah, I guess it's what those apparatchiks do. Soon, the whole army will be on my side; my vision must prevail!"
DGR_viii_five_year_plan: "VIII Plan Pięcioletni"
DGR_viii_five_year_plan_desc: "Economic plans may be cool in theory, but they're mostly a pain in the ass. Instead of chaotic investments in whatever the global economy throws at us and all those theories about supply and demand, we're executing our own chaos, just under the cover of a perfectly crafted scheme. The capitalists are laughing at us now, because, of course, you can't really decide in which year to build which sectors of the economy. Well, I say you can, but what do I know - we already did it. And I still don't fucking care about the liberals and their damned economic school. Fuck'em. We know what we did wrong before, and we still know what people need. We will now steer to complete the eight Five-Year Plan in Polish history. The seventh one was less than satisfactory. But that's because of the war. If it wasn't for that - we would be already thriving."
DGR_price_yield_operation: "Operacja cenowo-dochodowa"
DGR_price_yield_operation_desc: "They can't learn from their mistakes, right? Drastic increases in the prices of convenience goods will only result in a wider population getting poorer. The wage compensation is always smaller than the said increase, so all they do is shoot themselves in the foot.\n\nWho could have guessed, damn bureaucrats. Their actions against people will soon give me a chance to strike. The general population sees their dumb decisions and will stand by my side. Soon, shelves will be empty, and hunger will strike, protests in every major city... oh yes, everything goes according to plan."
DGR_apply_for_foreign_credits: "Aplikuj o zagraniczne kredyty"
DGR_apply_for_foreign_credits_desc: "Szwej and his morons decided to follow Gierek's footsteps. Applying for foreign loans, as it could result in something good. They are so dumb. Not only will it weaken our economy, but it was the main policy that caused the collapse of communism in Poland.\n\nI'm starting to believe they are just a bunch of revisionists trying to destroy what I built in Dąbrowa. Everything is built on loans, what a joke. Who will pay it off? Us, the military? Not to mention that capitalists won't even bother to help us. It's all one big treason, big treason it is."
DGR_state_crop_purchase_price_list: "Państwowy cennik skupu plonów"
DGR_state_crop_purchase_price_list_desc: "Po co ja tam byłem w ogóle? To mógłby być mail. Zamiast tego musiałem siedzieć na komisji ekonomicznej która debatowała o ustalenie i zamrożeniu cen na skup plonów przez państwo celem zapobiegnięcia deregulacji rynku żywnościowego…jak gdybym miał pojęcie czym się różni kalarepa od rzepy. Albo kapusta pekińska od kapusty włoskiej. Bób, hummus, włoszczyzna, tego typu rzeczy.\n\nNo tak, państwo kupuje rzeczy od rolników i dereguluje to całą gospodarkę rolną gdybyśmy ją pozostawili na pastwę wolnego rynku. Dlatego tak, słuszne jest ustalenie cen maksymalnych na dane produkty żeby nie wyjść na tym źle i było dobrze dla obu stron. Super, możemy wrócić do ważniejszych rzeczy?"
DGR_food_industry_innovations: "Innowacje w przemyśle spożywczym"
DGR_food_industry_innovations_desc: "Ja nigdy nie zrozumiem dlaczego rolnicy tak uparcie trzymają się swojego podejścia że muszą zasiać mnóstwo badziewia żeby potem połowa uschła a druga połowa zgniła, i tak w kółko. A potem będa narzekać że pogoda była zła, ziemia niedobra, i wszystko niedobre i wina państwa. To weźcie kurwa jeden z drugim zróbcie taką genetycznie odporną fasolę i kartofla, który będzie odporny na wszelkiego rodzaju wahania atmosferyczno-glebowe i róbcie jakościowo a nie ilościowo! I nie mówię tu o chemikaliach tylko o faktycznych modyfikacjach genetycznych. Przecież to nie zmienia nic w składzie a będzie po prostu lepsze. \n\nŻołnierz wam to musi mówić?"
DGR_internal_export_company: "Przedsiębiorstwo Eksportu Wewnętrznego"
DGR_internal_export_company_desc: "The party wants to reinstate Pewexes. In the face of an impending, monumental conflict, they decided that providing citizens with luxury goods was an excellent idea. I mean, isn't that kind of treacherous? Why do we need to provide goods from the corrupted West while people have everything here?\n\nIrresponsible decisions will only bring chaos and weaken our chances to defeat traitors. Pewexes were reactionary and revisionist ideas of old communists. Why do we repeat their mistakes? It will only bring doom to this nation. I hate it so much that I can't do anything!"
DGR_high_speed_state_rail_lines: "Państwowe koleje dużych prędkości"
DGR_high_speed_state_rail_lines_desc: "Czy marzyliście kiedyś o tym żeby nad morze dojechać w trzy godziny a nie dziesięć? Oh, gdyby nasze wojska tak potrafiły tylko to ta wojna byłaby już skończona. Ty...w sumie, to jest myśl. Wsadzić żołnierzy do superszybkiego pociągu i puścić po prostu w świat. Nie no chwila, to głupie. Wystarczyłby jeden kretyn który wysadziłby tory i cały pociąg leci w cholerę.\n\nCzyli jednak tylko dla cywilów ten projekt? Szkoda. Ale nadal moglibyśmy tam transportować żołnierzy i sprzęt do hubów zaopatrzeniowych na zapleczu frontu, prawda? No bo gdzie ludzie będą teraz jeździć? Poza tym to trzeba nowe tory położyć, a z czego niby chcecie zrobić super szybkie lokomotywy? NEWAG nie umie, PESA to badziewie a Fablok to co najwyżej nam parowóz zrobi.\n\nCóż, trzeba będzie znowu przerobić EN57...i tak, mikole będą jęczeć ale jebać ich. Nie cierpię fanatyków pociągów"
DGR_revival_of_automotive_industry: "Odrodzenie przemysłu motoryzacyjnego"
DGR_revival_of_automotive_industry_desc: "I think that creating our own automotive brand for citizens wouldn't be such a bad idea. Yeah, wouldn't be. We are at war, and instead of investing in the military, they think of a car brand? It's ridiculous! They want to invest millions in reopening old factories while we stand vulnerable against our enemies. In addition, this new scrap will probably be as unreliable as Maluch was. Why are we wasting money on that, huh? Let's invest in aviation or tanks, not in something that won't work either way!"
DGR_state_depots_of_strategic_stocks: "Państwowy skład rezerw strategicznych"
DGR_state_depots_of_strategic_stocks_desc: "Strategic reserves that are centrally registered and distributed under supervision? Hello, can't nobody see what's really happening?! By that, they want to limit the military, I know it! I saw right through their plans. They never cared about us, people who are fighting for nation's preservation. All they want is to steal our reserves and take them for themselves. I wonder what Szwej will do with all that money, build himself a nice dacha on the outskirts of Katowice? Probably, yeah. I don't believe at all in their generosity to the people. The general population won't see a dime of that money spent on whatever!"
DGR_atomic_heart_nc: "Atomowe serce"
DGR_atomic_heart_nc_desc: "It took decades of planning, countless hours of consultation with the locals and myriad of boards in councils that drenched the budget to finally... have one small research reactor in Otwock. The stalling in this matter is fucking humiliating.\nPoland was once on the right track of harnessing the power of the atom, but alas, the Eastern Bloc collapsed, and the newly established regime, constrained by the capitalist ideology of profit and realities of bourgeois democracy, proved unable to finish what we started. Now that the patriots are once again in control, free from the restrictions of the previous system, we can pick things up where we left off."
DGR_ground_stabilization_nc: "Stablilizacja gruntu"
DGR_ground_stabilization_nc_desc: "Now for the mundane part. The terrain near Dąbrowian Ząbkowice had been chosen as the ideal place for the nuclear power plant. Before the Fall, the areas around Dąbrowa Górnicza were pitched as one of the potential locations for a small modular BWRX-300 reactor. But of course, we don't do small, but that creates some additional difficulties caused by the sandy terrain in the area. Even Szwej doesn't want to build his house on literal sand, so he ordered to have the local forests cut down and the sandy grounds stabilized. So there's that. I still don't know why build a plant in a place where you need to fill the ground with steel beams and cover it with cement instead of... anywhere else."
DGR_1st_special_guards_unit_nc: "1 Specjalna Jednostka Gwardyjska"
DGR_1st_special_guards_unit_nc_desc: "Despite the monumental effort it will require, the facts are that we need this reactor, and it's good that it is being built despite all the mishaps. It's also easy to predict that once it's raised, it will become a primary target for our enemies both inside and outside our borders. If so, it has to be under constant guard by our most elite soldiers. A whole ne battalion stationing nearby will be needed to secure the perimeter. Our best people have the honor of protecting what would hopefully become the robust beating heart of our electric grid."
DGR_contacts_in_the_east_nc: "Kontakty na wschodzie"
DGR_contacts_in_the_east_nc_desc: "A task as great as the construction of a large-scale nuclear reactor can be undertaken alone. We need the help of powerful countries that look favorably on our cause and are willing to send us their know-how, materials, and funds. As the West and its rotten elites are unwilling to help build welfare, we are forced to turn our heads eastwards, trying to fit into the game between hemispheres. Our plan is to reach out to the elites who sympathise with anti-Western cause and help us reintroduce the socialist technical thought of the past and synthesize it with innovative practices of today to help us build a prosperous, nuclear-powered future."
DGR_send_szwej_to_moscow_nc: "Wyślij Szweja do Moskwy"
DGR_send_szwej_to_moscow_nc_desc: "It's been a long time since Poland and Russia were embraced in the 'brotherly embrace'. Few people believed it then, even fewer believe it now. The memory of our common past is still alive in Moscow though and Szwej still has some contacts that could lobby for us in Kremlin... if said contacts haven't ended up in nursing homes that is. Those that still hold some power within the state apparatus are usually far away from the highest echelons of power, but their voice still have a lot of weight in the Russian deep state. We hope that the great Russian nation that once elevated the Eastern Europe to Atomic Era, will once again pick up their historical mission. It's a long shot as the Navalny's government tries to break the ties with the past, but it's our best chance to realise our ambitions."
DGR_purchase_rbmk_nc: "Kup plany reaktora RBMK"
DGR_purchase_rbmk_nc_desc: "You know how the joke goes:\n'Is it true that they give away top-notch nuclear reactor plans in Moscow?!'\n'It's true, but not in Moscow, but in a dacha near Yekaterinburg. They don't give them away, but demand an unequal trade treaty. And those aren't top-notch reactors, but those responsible for the Chernobyl disaster.'\nWell, here we are. The higher-ups repeat Russian marketing that, under proper maintenance and supervision, the RBMK reactor should work adequately and safely. Yeah, right. Just as I thought Szwej could achieve something, he returns with this kind of shit. Oh, well, let's profit from the nuclear energy while it lasts. As for me, I'll stay as far away from this reactor as possible."
DGR_chinese_business_nc: "Chińskie przedsięwzięcia biznesowe"
DGR_chinese_business_nc_desc: "Let's be honest: It's been a long time, since Russia's been playing the first fiddle, when it comes to the eastern hemisphere. Right now we need a new power that can is willing to support any non-liberal country - China. Trying to convince their leader should be a lot more straightforward, once we praise them for their championship of workers' cause and assure them on our anti-Western outlook. A promise of establishing a regional office of Confucius Institute would also help. Of course the diplomatic effort to Far East would require of us more than just a 0,7 Liter of vodka and a reminiscent talk about old times. We'll need a qualified diplomat, well-versed in speaking Chinese, prestigious delegation and at least 2 Liters of vodka!"
DGR_uranium_smuggling_corridor_nc: "Korytarze przemycania uranu"
DGR_uranium_smuggling_corridor_nc_desc: "They should've brought 4 liters... The Chinamen agreed to supply us with resources, but instead of establishing a new Silk Road, they offered us a Silk Tunnel. Citing troubles with transportation and 'peculiar international position of the National People's Republic', they claimed their country was unable to officially supply us either by land or by sea. Instead, they offered us help with a smuggling operation through Russian lands. Not an ideal solution, that nevertheless has its perks. Since we already have to rely on smuggling uranium, we may as well expand our operation and gather other resources on the fly. Nothing as spectacular as the Uranium, but every old piece of weapons and chemical ingredients for explosives will also be a great addition to our convoys."
DGR_create_pogoria_v_nc: "Utwórz Pogorię V"
DGR_create_pogoria_v_nc_desc: "Already, the problems arise. It is known that nuclear-based power plants, just like their coal-based equivalents, need water to function. It would be best to have a river (bigger than Trzebyczka) or a water storage reservoir nearby. As it turns out, the Pogoria reservoirs are a bit too far. Changing the location of the power plant at this point would be problematic, and it wouldn't do us much good; The terrain around Pogorias is even more inhospitable as the reservoirs were created when they filled the old sand mines with water. At this point, it'd be better to dig and create one more Pogoria reservoir to supplant our future plant. Even if we don't have conviniently placed obsolete mines nearby to pour water into."
DGR_advanced_staff_training_nc: "Zaawansowane szkolenie personelu"
DGR_advanced_staff_training_nc_desc: "Does anyone know how this thing will operate? I thought so. We have some theoretical physicists, but we lack practitioners to operate the future plant and instruct new engineers on how to deal with the nuclear power plant. Even if there are enough Polish specialists, they're scattered around the country. We will once again need the help of the Russians. It's only a temporary measure before we achieve a steady influx of home-grown specialists. Let's just hope by this time the Russkies won't mess things up too badly by the time the training's done."
DGR_zabkowice_nuclear_power_plant_nc: "Ząbkowicka Elektrownia Atomowa"
DGR_zabkowice_nuclear_power_plant_nc_desc: "It works? It works! I may have been too harsh on this whole effort. The unsuitable terrain, the alcohol-stained Russian plans, the lacking cadre fed my scepticism, but here I stand admiring the finalization of the construction efforts. I can say many bad things about the communists, no matter what coat of paint they were, but they've once again proven they can, if they want, build the infrastructure necessary for the strategic longevity of the state. Let's hope that Poland, no matter the administration, will prosper thanks to the affordable energy the Ząbkowice Nuclear Power Plant provides."
DGR_expansion_of_the_red_army: "Rozbudowa Armii Czerwonej"
DGR_expansion_of_the_red_army_desc: "Another year, another step towards our nation's inevitable liberation and advancement of its working people... assuming the Politburo and other paper pushers won't turn them to chase their own tails. Before they get uppity again, and to take on greater foes still, the Red Army must grow, multiply even. We need guns and men to wield them. We need spirits and shovels. This country does not stand on bureaucracy and philosophising by pricks who never lived in worker's society before, but on rifles of the working people. \nLucky for us, all the philosophers have fled already, and all the men are still with us."
DGR_national_people_navy_nc: "Narodowa Marynarka Ludowa"
DGR_national_people_navy_nc_desc: "...I hardly have anything to add to this. As if the Politburo's stupidity wasn't apparent enough their newest suggestion, one that, as they claim, 'will prove to be detrimental in the future conquests', that being the idea to fund a NAVY. Based around rivers IN A LANDLOCKED TERRITORY proves it all just too well. The overall plan is to build a small freshwater navy capable of patrolling the riverline and disrupting the enemy supply chains and troop transports through the afformentioned bodies of water that is still versatile enough to be later on repurposed as the main backbone of our seafaring fleet. Does it make even the slightest bit of sense ? No, it does not in my book. But unless we don't want to secure extra funding we'll have to listen to dance for these braindead amoebas for a little bit."
DGR_przemsza_program_nc: "Program Przemsza"
DGR_przemsza_program_nc_desc: "I walked by the Pogoria IV lake today, watching these waterlobes try out their new experiment. They call it the 'Przemsza Program' - the idea of it is to use preexisting small ships and tinker with them until they stop sinking or exploding and actually become viable light warships. Every single time so far, they're either too overtuned, or too overencumbered, or not maintained well enough, or whatever other reason they're using now to justify the bottom of Pogoria looking like the aftermath of a sea battle without a shot fired. Sucks to be the suckers whose boats they confiscated for testing, but it makes for a nice spectacle whenever you walk by and see another one burst into flames and hear the eggheads cursing from far away. And...the problem is, the boat didn't sink or burn today. That piqued my interest, because if they're succesfull that means we'll be going onto the next step and that will be bad."
DGR_warta_military_shipyard_nc: "Stocznia wojskowa Warta"
DGR_warta_military_shipyard_nc_desc: "It is bad. This is the moment where the accursed plan to build a military dockyard will take place. I'll say, I'm glad they didn't try their bright idea on even smaller bodies of water before, though it'd be very comical to see the Politburo's stupidity on full display like that. Still, the Warta's infrastructure and access to a (semi-decently.) big body of water to test our ships upon in the form of lake Jeziorsko is the best we can do before reaching the Baltic Sea itself (and absolutely above Pogoria in...any parameters to be honest), and I suppose that it makes at least a little bit of sense to prep up to it before we get there, even if in my opinion it's still just a waste of money that could go to LITERALLY any other branch we have. Seriously, we're not running on manifestos and promises, Szwej!"
DGR_first_npn_flotilla_nc: "Pierwsza flotylla NML"
DGR_first_npn_flotilla_nc_desc: "Fuck me. They did it? I've heard today that the naval advancements of ours have allowed us to launch three new Przemsza class ships. Have I really underestimated the navy this much I didn't catch it growing so fast? How the fuck?! It means all these high investments into it weren't fruitless, and now it's just even more power against the remaining rabble of Poland. I should be happy, but I can't not feel like the commies have pulled a number on me, even if they didn't know it...\nHow the hell? I mean, I'll be suprised if those tin cans will actually stay afloat and not be destroyed in a week...but I feel like I'm coping here too much. I guess there is no turning back from this."
DGR_metalowiec_gunboat_nc: "Kanonierka klasy Metalowiec"
DGR_metalowiec_gunboat_nc_desc: "The (unfortunate to my psyche) success of Warta shipyards means that we can now double our efforts when it comes to the production of their freshwater fleet Politburo fantasizes so much. And now that we are reaching larger and larger bodies of water it doesn't even seem to be that bad of an idea anymore. Still, I think they're overfixating themselves on what's at best just an addition to Dąbrowa's real power, which lays elsewhere, clearly beyond their sight. I'd show them where that place is but if I start they'll just start ranting about how I was wrong about the navy. Let me tell you something you cunts, I was NOT WRONG, and you're all just finding even the smallest thing to point at me and laugh because you're so pathetic you cannot find any actual flaws of mine that aren't quindecupled in yourselves!\nYeah, anyways. More gunboats it is I suppose..."
DGR_pogoria_class_monitor_nc: "Monitor klasy Pogoria"
DGR_pogoria_class_monitor_nc_desc: "For all my dislike towards Pogoria and the waterphiles working there, I can't, and it pains me a lot, say that their efforts didn't turn out to be successful. Eugh, I thought I'll throw up saying it... Nevertheless, the navy is working on moving to some actual large ships of war now, and they proposed to name the next iteration a 'Pogoria' class. Shameless self-glazing if I ever saw one, but for the fucking miracle of turning a landlocked state from Zagłębie into a naval power I suppose they...deserve...some... Yeah, no, I'll definitely be sick. And I'm not even on board of those tin cans. Or on board with this fucking shit at all."
DGR_continuation_of_project_716_nc: "Kontynuacja projektu 716"
DGR_continuation_of_project_716_nc_desc: "There is hardly anything interesting that can be said about project 716's continuation for the needs of the navy. It's the same old story again - it's cheaper to take and repurpose vessels than to build them from scratch. The one positive of our current state is that we don't (yet) need large transport convoys to carry our men across bodies of water. So far - even the most simple ferry will do. Aside from it being a Politburo's project centered around navy... Let's just focus on positives - as much as the navy will be useless, we're going to need transport ships that could be used in launching invasions from one bank of the river to another. Because enemies will likely blow up any bridges on the bigger rivers in the country. And if they fortify the opposing shore, pontoon crossing would be very stupid. Thus, transport ship. At least some good will come out of this."
DGR_national_ground_forces_nc: "Narodowe Siły Lądowe"
DGR_national_ground_forces_nc_desc: "As a land power, not constrained by the large rivers or the sea, we will naturally bet on the width, berth and bulk of our ground troops. It matters that we have river-traversing vehicles, but it matters more that we have vehicles to begin with. Overwhelming and implacable in discipline and quantity, our army will never falter. For that, we need extra shifts. Scavenger duties. Everyone who can walk will work until their hands bleed. Then, I don't know, do I look like a doctor? Give em plastic gloves soaked in pure ethanol and have em work some more!"
DGR_wide_front_strike_specialization_nc: "Specjalizacja szerokiego frontu"
DGR_wide_front_strike_specialization_nc_desc: "We will descend upon our foes, we will overwhelm them, we will leave none alive. For that we need one of two things: Either people in orbit ready for deep strikes, or a doctrine of wide front strikes. Our entire border is a frontline with no natural barriers. We must cover and utilize all that ground, cover it with people's armored vehicles, and eventually, watch it be enveloped and swarmed by our masses."
DGR_ideological_motivation_imperative_nc: "Ideologiczny imperatyw motywacyjny"
DGR_ideological_motivation_imperative_nc_desc: "To make our doctrine work, the soldier must be motivated. Filled with the spirit of socialism and worker's strugg... hahaha, yeah right! I know how our men work, unlike those eunuchs at Politburo. We fight not for money, but for the Nation. Yes, even those who dig themselves into a more regional identity. For your parents, brothers, cousins, sons. Even if they aren't with you: You'll have a family yet. And of course, whether I like it or not, for the Party and the Secretary, who pave the way of the worker's paradise for you! Or else."
DGR_people_officer_school_nc: "Akademia Oficerów Ludowych"
DGR_people_officer_school_nc_desc: "An army marches on its officer corps, its leadership, its ability to think on its feet, its... ideological robustness. One thing these fat bureaucrats have a point at is that preciesly because our worldview is so close to the two things that are poison to it: The international feel-good cool-Pole socialists and capitalist 'nationalists', we must ensure our officers are free from either error. Seriously. A nation is made up of its people, not of flags or, ugh, capital! That is why our officers must learn to wage war as lightning if need be, with allegiance that's social first, national second."
DGR_ngf_command_structure_nc: "Struktura dowodzenia NSL"
DGR_ngf_command_structure_nc_desc: "It's time to set up the command districts within our regime. There must be clear military chain of responsibility and command, with every officer knowing exactly who to answer to and who greenlights their initiatives. Similar methods were employed with mixed results by Soviets and Russians, but when on proper well-planned attack, it is paramount that everyone works as one, not as individuals out for themselves. This is socialism at work, as opposed to capitalist chaos."
DGR_restandarisation_of_firearms_nc: "Restandaryzacja broni palnej"
DGR_restandarisation_of_firearms_nc_desc: "Only capitalist pigs can't appreciate the nostalgia of unloading a PPSH-41 drum magazine. Alas, maintaining a pepesha these days is harder than even fixing one. Hundreds of variants, ammunition types, thousands of parts... no more. The logistical nightmare is over, the dawn breaks, and with it, new standard and new uniformity arises. One service rifle, one cartridge standard, one set of parts that's as universal as possible. This will help us scale up production and maintenence alike."
DGR_every_soldier_tank_destroyer_nc: "Każdy żołnierz niszczycielem czołgów"
DGR_every_soldier_tank_destroyer_nc_desc: "Our enemies take many forms, but armored ones are what demands our foremost attention. It's not enough to let our armored vehicles duel: When facing infantry, the enemy must melt as though they face our finest cannons. Every infantryman of ours will have an anti-armor solution to work with. Every infantryman of ours will know exactly how to use it well. Every single infantryman of ours will prove his worth in value of the tanks he brings down. The enemy's armored vehicles will thus be force multipliers no longer: Each will be worth only one of our troopers, and less as we scavenge and repurpose their wrecks."
DGR_unleashing_fire_and_fury_nc: "Ogień i pożoga"
DGR_unleashing_fire_and_fury_nc_desc: "Fire, fucking fury, and destruction! The carnage we will bring upon our enemies will be downright biblical. And I only mean that comparison as a source of imagery; I am no religious fool. What I do believe in is steel and lead - something our soldiers hand out left and right to all infidels and heretics of our cause. But sometimes, you just have to try harder and use a bigger gun. And if that doesn't work - keep increasing the caliber until the job is done and the enemy is eliminated. We have experience with elements of mechanized warfare and armored tactics - this will pay off when we start mass-producing all kinds of war machines. Every single battalion will be able to get their hands on these beauties, not just elite units. And please, just fucking please - let me handle this by myself. If Politburo fucks with this branch, i'm gonna be livid."
DGR_viper_program_nc: "Program Żmija"
DGR_viper_program_nc_desc: "Innocent-looking armored cars can provide massive support for regular soldiers on the battlefield. Besides the ability to move fast even over rough terrain and their scouting potential - we're also packing them with quite a substantial amount of firepower. Mind you, such a car probably won't survive an encounter with a rocket launcher, but the armor does extend the crew's average lifespan, at least by a few minutes. Unfortunately, working off the blueprints of old Soviet junk, we can't really mess around with variations of the ideal modern armored car. Therefore, we will have to design something original of our own. Luckily, we have the right industrial plants for that."
DGR_new_constellation_of_star_trucks_nc: "Nowa konstelacja ciężarówek STARa"
DGR_new_constellation_of_star_trucks_nc_desc: "Admittedly, not all the state enterprises that built our military are misinvestments. We have to evaluate each of the companies on a case-by-case basis. Take a look at a STAR factory. Once, it was a pride of our country that supplied our armies and even foreign ones. Now, gathering for the possible war with our neighbours, we need them more than ever. What good will we ever get from civilian buses from MAN that overtook the production lines in Starachowice? True, we still have the Jelcz factory, but that won't be enough. Especially when the Germans will try to enter Silesia once again. We need more factories in the central east. Besides, the Congress Poland still has to show the world, you know."
DGR_new_old_skots_nc: "Nowe-stare SKOTy"
DGR_new_old_skots_nc_desc: "Now, what makes even less sense than using an obsolete, decrepit communist design that even some of the former members of the Warsaw Pact won't use? Using even older communist design that never gained that much worldwide traction, and its usage was abandoned even by one of its original co-producers. That's right, we're talking about SKOTs. While the BWPs were admittedly still used in the Polish Army by the time of the Fall, in 2010, there were only about a hundred SKOTs. Judging by the designs, it seems we'll be reusing the oldest models and not even expanding upon modernized KTO Ryś designs."
DGR_eternal_spirit_of_bwp_1_nc: "Wieczny duch BWP-1"
DGR_eternal_spirit_of_bwp_1_nc_desc: "While 966 was the year that created and defined Poland, it seems 1966 was the year that created and defined its modern military. That was the year the first BMP-1, known in Poland as BWP-1, saw the light of day, and progress in the Polish military has stopped ever since. We were this close to replacing it with some new models, but the influnce of the bygone era shattered those dreams for decades to come. I try to do something about it, I point out that the BWP-1s are obsolete, used only by countries of the Second and Third World. Even some of the old countries of the Eastern Bloc got rid of it. I also try to sell completely new projects with similar names, such as BWP badger, elk, deer, roe, boar, fox, marten, raccoon dog, wolf, or lynx, but all discussions end with the same argument:\n'BWPs are fine. They swim, y'know.'"
DGR_pt_91_the_hardest: "PT-91: Najtwardszy"
DGR_pt_91_the_hardest_desc: "K2, huh? The Koreans can stick with music. Our armored units need to terrorize our enemies and instill national pride, the feeling that there is greatness in each Pole and within our nation as a whole. That is why we need to use our own designs. We're talking about resurrecting the PT-91 Twardy model, whose production regretfully stopped in less than a few decades.  It's a relatively modern design compared to others of our... inspirations that, with a few tweaks here and there, can dominate the battlefield once again. It's true that we don't have any fancy way to protect even the upgraded tanks from drones. But a simple mesh has proved itself on the fronts of the Russo-Ukrainian War and should be enough for now."
DGR_unified_fire_control_command_nc: "Połączone Dowództwo Kierowania Ogniem"
DGR_unified_fire_control_command_nc_desc: "As a classic saying goes - fuck the people who only hit you up when they need your artillery support. But in all seriousness - artillery is a very pleasant toy, but someone has to manage all of it. Otherwise, give the soldiers fifteen minutes on the battlefield and we'll have friendly fire incidents or some random village getting blown to pieces for nothing. We need highly responsible people in fire control positions, along with advanced communication tech and tools that allow for a broad overview of the battlefield. There are military systems out there right now that make the operator feel like they're playing a live-action RTS game. If we get our hands on them, nobody will ever have to fear being within range of friendly artillery again."
DGR_stationary_artillery_strongpoints_nc: "Zaawansowane samobieżne platformy artyleryjskie"
DGR_stationary_artillery_strongpoints_nc_desc: "Given the experiences from the front line, in some places the only thing you need to put in the enemy's way is a massive fucking gun, dig it in, conceal it - and blast away as much as you can. Right on cue, the high-speed fanatics are going to start whining that you can't do that, that nowadays you have to be mobile, you have to move after every shot, do fucking dodges in the bushes, and preferably do backflips while reloading. And that is total and utter bullshit - the enemy has zero reconnaissance or technology; this is literally shooting fish in a barrel. And if we do run into one that actually has those things - we'll wipe them out with our air force. In any case, a massive stationary gun will win. And it won't waste a single drop of fuel - because the damn thing doesn't need any."
DGR_advanced_mobile_fire_platforms_nc: "Advanced Mobile Fire Platforms"
DGR_advanced_mobile_fire_platforms_nc_desc: "But just so it doesn't look like all we're going to do is sit and wait, we must make up for our lack of mobility with mobile firing platforms. They will play the same role as a mosquito that flies into your room and can't find the window to get back out. We fly around, make noise, and nip at them whenever and as much as we can. The enemy will focus on trying to catch all these fast-moving little bugs while we can focus on a MASSIVE bombardment or a direct assault. Because warfare isn't about committing to just one single tactic, is it? Because if you do that, some smart-ass on the other side will immediately counter you with something you won't have a counter for, because you'll have pissed away all your money on self-propelled artillery. This way - we'll have everything."
DGR_revitalization_of_rocketry_nc: "Rewitalizacja sił rakietowych"
DGR_revitalization_of_rocketry_nc_desc: "The rocket forces during the PRL era... you have to admit, they were damn impressive. And that is yet another stain in a whole constellation of humiliations in the history of the Polish Armed Forces of the Third Republic. Because from a state that possessed rockets capable of even carrying nuclear warheads, we were left with... absolutely nothing. In Russia, the rocket forces even constitute a completely separate branch of the military, that's how heavily expanded they are there - and unfortunately, Ukraine found out the hard way that this is a devilishly effective weapon with minimal effort. You aim more or less, you launch, and you light a cigarette while waiting for reconnaissance or the air force to tell you what you hit. The perfect job, aside from the risk that if someone pinpoints your position, the entire enemy army will hunt you down. But put that aside - we must restore the rocket power we used to possess. And let's focus on that. We'll refresh the procedures once we actually build something that can fly and explode, and isn't a Russian passenger plane."
DGR_strategic_rocket_forces_command_nc: "Dowództwo Strategicznych Sił Rakietowych"
DGR_strategic_rocket_forces_command_nc_desc: "A modernization in equipment requires someone to be in command of more and more complicated machines of destruction. Take rocket artillery, for example. We need capable people who will be knowledgeable enough not only to properly use our new weapons, but also to update their expertise. A rapid progress of the rocket technology is coming that will allow us to send more and more powerful and specialised missiles. Who knows, maybe our current effort will evolve into a space program given enough time."
DGR_red_skies_nc: "Czerwone niebiosa"
DGR_red_skies_nc_desc: "Say what you will, if I had to choose between a ground force that does not run out of manpower and vehicles, and an airforce, I pick the latter. Air support is crucial for breakthroughs, ambitious campaigns, protection of home industry... at least until our enemies figure out cruise missiles. We won't let them though. Our planes will blot out the sun, until the red dawn, midday and dusk alike, will be the only sky our enemies behold! Of course until some geniuses decide that we can't afford substantial funds for the air force. Then I guess we'll fucking use pigeons."
DGR_expansion_of_pzl_mielec_nc: "Rozbudowa PZL-Mielec"
DGR_expansion_of_pzl_mielec_nc_desc: "PZL Mielec used to be one of our greatest aircraft works. The capitalism is a cruel mistress that drained it of its life, the Fall was no better. But now, at last, the true socialist force, national people's force, will care for this fair lady. Make her voluptous and lush. Her body of concrete and steel shall make us rise with joy, as we our workers court her, bearing gifts of scrap and raw materials... and from their union, entire swarms of warbirds will emerge, fruit of their queen and our people. \n And more importantly, oblivion to our foes."
DGR_pzl_anvil_program_nc: "Program PZL Kowadło"
DGR_pzl_anvil_program_nc_desc: "It'd be a shame if our enemies could churn out hardware undisturbed. We need a bomber to thwart them: That's where Anvil comes in. Everything a modern battlefleet requires of a bomber to survive and deliver, the Anvil will boast. Luckily we don't need it to deliver upon the Chinese or American Empire: Our foes within Poland are benchmark enough. Even the fat cats at Politburo might rise to such a low bar of an occasion."
DGR_rapid_response_brigades_nc: "Brygady Kawalerii Powietrznej szybkiego reagowania"
DGR_rapid_response_brigades_nc_desc: "The concept of air cavalry has always cracked me up because of how obsessed Poles are with the word 'cavalry.' Everything has to be a fucking cavalry unit; goddamn tanks are armored cavalry, helicopter drop units are air cavalry. These guys are seriously still dreaming about just drinking, screwing, and riding horses. But names aside - assault units moving by helicopter, capable of responding to even the smallest shift or breakthrough on a front line hundreds of kilometers away, is something that will completely change the face of our war. A lightning-fast, mass attack carried out by such brigades will break through even the toughest defense, and if we coordinate it well and master the operational chaos - this will be a weapon more effective than any bomb."
DGR_pzl_sickle_program_nc: "Program PZL Sierp"
DGR_pzl_sickle_program_nc_desc: "Yes, air assault forces sound good, but, sometimes you need something no less mobile that packs a heavier punch. This is where the Sickle comes in. A new prototype of a combat helicopter, designed for any and all demands of post-Fall warfare, where ingenuity and electronic disturbance work. End result will be a vicious bird of prey, harvesting anything it faces as a sickle would... at least before harvester combines became a thing. Who am I kidding? This name sucks. It's just an another example of Politburo meddling with propaganda where they should not. At least I hope that this thing will fly."
DGR_nationalization_of_pzl_rzeszow: "Nacjonalizacja PZL-Rzeszów"
DGR_nationalization_of_pzl_rzeszow_desc: "Rzeszowskie zakłady lotnicze co prawda nigdy nie były tak potężne jak Świdnik czy Mielec ale to nie jest powód żeby od razu załamywać cały rzeszowski przemysł lotniczy i sprzedawać go kapitalistom z zachodu! A to kluczowa fabryka która dostarczała najlepsze silniki do myśliwców i śmigłowców produkowanych właśnie w niedaleko położonych miastach. Potem nawet tam montowano silniki do zachodnich myśliwców typu F-16 czy F-35.\n\nCo nam po silniku skoro nie wmontujemy ich nigdzie? A to nam po tym, że ekspertyza na ten temat lub inżynieria wsteczna pozwoli nam rozwinąć nasze umiejętności które wykorzystamy do zbudowania własnych, profesjonalnych silników lotniczych do najnowocześniejszych maszyn latających po naszym niebie!"
DGR_pzl_hammer_program_nc: "Program PZL Młot"
DGR_pzl_hammer_program_nc_desc: "The capitalists will have you know that contemporary air superiority aircraft is strictly a task for the wealthiest and mightiest nations, whether China or Russia or the Great Capitalist Satan, USA. Today, we head to the drawing board to conceptualize and prototype PZL Hammer, to prove those pigs wrong. Agility, resilience, mastery of our skies: This is what the Hammer will assure. Its missiles will swat foes like flies. Its mighty cannons will eat them alive. Its fuselage will combine the power of steel with lightness of an underfed child under the darkest days of Polish capitalism. And the best part? Vaccum tube electronics that shrug any EMP pulse like it's nothing!"
DGR_special_purpose_forces_nc: "Siły specjalnego przeznaczenia"
DGR_special_purpose_forces_nc_desc: "Special Forces have always played an important role in the arsenal of Polish People's Republic, so the Politburo obviously wants them to be brought back with the same symbolism they used to have: They were present during every suppression of strikes and riots until the very end and have always protected the Republic from hidden enemies of the state, even after its fall. It would be, in their eyes, dishonorable (and for me - just not wise strategically) for us not to bring them back so that they can once again serve. While the idea of making them a glorified socialism propaganda machine disgusts me personally the need of spec ops is there, so we may as well roll with it. We'll see how strong the sense of 'communist heroes' image is in them, though."
DGR_maroon_berets_nc: "Bordowe berety"
DGR_maroon_berets_nc_desc: "As if seeing communists every day wasn't enough of a fucking curse, now they're gonna be disgusting the sky with their existence as well. 'The idea of creating paratrooper forces was discussed widely today at the Politburo and, as they are absolute birdbrains themselves, they have decided to go all in on the investment in spite of us hardly being able to get our propeller junk off the ground itself!' was what I was originally thinking after the meeting, but, to surprise of everyone with half a functioning brain (so none of the Politburo) the paratrooper excersises turned out succesful. Too successful. I cannot even stare into the sky now without having to imagine a Szwej's squad flying through it, and it ruins my day immediately. I knew so many nutjobs were walking around cities of Zagłębie, but come on... who in his right mind would volunteer to jump out of a perfectly good plane?"
DGR_green_berets_nc: "Zielone berety"
DGR_green_berets_nc_desc: "Poland is, in a large part (besides being a fucking flatland), forests and wilderness, the likes of which you usually shouldn't be entering unless you're a Girl Scout or a professional ranger, or both. None of the two are at our disposal in large enough numbers, but with our training combined with the commies' unforgivingly large numbers, we can try to muster up some professional pinecone eaters of our own. There were also hunters, but they are not known for having good aim and I'm sick of hearing about friendly fire incidents. If we'll be able to concoct some professional forest infantry - at best, we'll see if some of them can still be saved from the communist poison they have in their skulls, and at worst, suicide missions exist for a reason. Either way, it's profitable for us, and it's a field we can flex our muscles on when the Politburo donkeys are watching."
DGR_restore_the_commandos_nc: "Przywrócenie Komandosów"
DGR_restore_the_commandos_nc_desc: "Finally, after who knows how long, my efforts to secure more funds for the spec-ops paid off, and we can now form our commando brigades with everybody involved. From our peak in condition (as always), rangers through dubiously necessary but at least effective marines to even the thick-headed paratroopers, everyone got their spot. If these imbeciles had listened to me earlier, we would have naturally been able to do even more than what we can now with the funding increase on a level rivaling that of the monthly salary of a local janitor. Nevermind. What matters is that we are in possession of perfect facility for this. I mean - Lubliniec? Hello? Commando Unit? We've defeated them already, and did nothing with that except fight with the guerilla forces that they fielded against us after the conquest. We need to stop whinging about past grievances or reactionist shit and reopen this unit with the whole garrison."
DGR_special_industrial_group_nc: "Specjalna Grupa Przemysłowa"
DGR_special_industrial_group_nc_desc: "Czy ja jestem tutaj jedynym zdrowym na umyśle człowiekiem który pamięta bitwę o Azowstal? O lotnisko w Doniecku? O cholernych walkach o fabryki w Stalingradzie? Wojna się zmieniła, a tereny przemysłowe są najbardziej dogodnymi do obrony punktami strategicznymi. Oczywiście jeśli już znajdą się na linii frontu i nie mają jak produkować rzeczy które normalnie robili. To na takich właśnie operacjach polegających na infiltracji i przełamywaniu fortyfikacji terenów przemysłowych powinniśmy się skupiać a nie cudować z lotnikami czy marynarzami. Bo takie walki będą nas czekały prędzej czy później. A dotychczasowe doświadczenia pokazały nam że nasze wojska w ogóle nie są przygotowane na tego rodzaj operacji."
DGR_urban_sabotage_battalions_nc: "Bataliony Sabotażu Miejskiego"
DGR_urban_sabotage_battalions_nc_desc: "Wojna obecnie przypomina troszkę średniowieczną. Już tłumaczę - można sobie jeździć i zdobywać wsie, pola i inne nic nie znaczące lasy i bagna, armia sobie przejdzie, zrobi co swoje i potem nagle trafi na wielki ufortyfikowany zamek który musi oblegać. Bo miasta obecnie w doktrynie wojskowej pełnią rolę właśnie takich fortec które są okropnie ciężkie do zdobycia. Nie potrzebują oni wcale murów jeśli z każdego okna można wystawić karabin maszynowy a z każdego balkonu może na Ciebie spaść granat czy butelka z benzyną. Plus jest taki że chaos i tłok może działać również na naszą korzyść. Wystarczą odpowiednie oddziały dywersyjne które wysadzą parę kluczowych punktów w mieście, a inne zakradną się tunelami i wyjdą w samym sercu miasta siejąc chaos. Tylko to trzeba też potrafić a nie rzucić ludzi na pożarcie i niech się dzieje co chce. Zwykły żołdak tego nie zrobi, tu potrzeba odpowiednio wyposażonych i wyszkolonych batalionów sabotażystów miejskich."
DGR_blue_berets_nc: "Niebieskie berety"
DGR_blue_berets_nc_desc: "'Formoza', named after a popular torpedo test center on the shores of Gdynia, was a branch of Polish saboteur divers within the navy of the Polish People's Republic. While our reliance on the Navy is slim compared to the other branches of special purpose forces, their expertise and potential for the future so far make up for it. Because of this, recreating this branch, the Marines, and funding them is, according to the central committee, the right course of action. With enough support, who knows, maybe these old sponges are right, and the new marine forces will turn out not to be a waste of time after all. Of course it's not like we're getting outright Formoza with its entire staff. We will need to create ourselves our own unit. But I swear, if it's also named after Pogoria, I will lose my fucking mind."
DGR_national_unity_front: "Front Jedności Narodowej"
DGR_national_unity_front_desc: "Oh, they're so afraid. One small taste of a real revolution, and those cowards start huddling together to avoid the storm. We had a good thing going. I would've gotten rid of every single traitor, every single danger to the people's liberation. But of course, the forces of reaction had to come reeling and prop up a corpse instead. Unity front... unity... what they're really doing is trying to dilute us among the revisionists, social fascists, and the worthless apparatchiks. Anything, of course, anything to keep their fucking heads from ending up on the spikey tip of a bayonet. They think they can stop us. Stop me. How foolish. They've just shown their true colours. We'll break them from the inside, and once we are done, the list will have gotten much, much longer. They cannot reverse what has already begun. The revolution will come for them all!"
DGR_security_committee_nc: "Komitet Bezpieczeństwa"
DGR_security_committee_nc_desc: "Life is nothing without security. Sure, everything can seem normal on the outside; you might have a job, a family, things all figured out, but the constant gnawing thought that it could all come crashing down through the work of a few... unwanted elements will eventually be enough to drive you to insanity. All I want is to take that burden off the people's shoulders - take care of their worries so that they can enjoy their lives with a carefree attitude that 'freedom' just cannot provide. Because freedom without security... well, that's just anarchy, and we can't have that. Giving the state a monopoly on violence ensures it will stay out of the minds of the common folk. So, no need to fret over it."
DGR_progressive_juvenile_prisons_nc: "Postępowe zakłady karne dla młodocianych"
DGR_progressive_juvenile_prisons_nc_desc: "Ah, the beauty of youth. Those were the days. I still remember them so vividly. Back when 'riot against the system and break as much as you can in the process' was all the ideology you needed. Our teens today are no different. The future of the nation. Pah. The apparatchiks want to turn them into model citizens, but we all know how that's gonna go. They're rebels, contrarians - a burning flame of constant rage that cannot be put in a school uniform and told to regale party officials with tales of their scientific achievements. The National People's Army regularly opens its doors to these vagrants, but we can only offer an outlet to those willing to cooperate. Others will have to be broken in. Re-educated with the right values so that their anger serves the purposes of the revolution. Some might just require a bit more breaking first..."
DGR_recreate_ormo: "Odtworzenie ORMO"
DGR_recreate_ormo_desc: "So, looks like we're no longer the only enforcers around here. Seems the party's had enough of the constant lawlessness on the streets and decided to join in the fun of putting down the rabble. Would've been better to keep it in our own hands, but eh, plenty of troublemakers to go around. That way, we can keep our eyes focused on the bigger prize - the real battles to be fought, rather than delegating half of the Army's personnel to care of police work. Honestly, at this point, a strike or two would be welcome. It would be nice to see what these guys are made of; check whether those batons are just for show. The only thing I'm worried about is - that's some pretty sweet gear they're being funneled. Some of this stuff, even we don't get. Feels like a sidelining if I've ever seen one. For their sake, it better not be."
DGR_administration_committee_nc: "Komitet Administracji"
DGR_administration_committee_nc_desc: "Honestly, we've had it up to here with administrative bloat. Rules, regulations, parallel systems... all existing to inflate the egos of a soulless bureaucratic class clinging to relevancy by being the only ones still able to follow and interpret the thousands of minuscule provisions they've set up to confuse the uninitiated. In the end, you've got mountains of paperwork to process a single waiver that could have been handled in five fucking minutes because it all needs to comply with some statute from seven generations over. What the system needs is a direct shakeup, and not just a single one. It needs to be shaken up every time it gets too comfortable, every time it solidifies, so that it remains a constant, dynamic fluid. I will beat the bureaucracy into a pulp so that when any request is put into it, it doesn't have to be shaped to fit the procedural mold; it's the system that will take form around it to allow it through."
DGR_establish_the_federation_council: "Ustanowienie Rady Federacji"
DGR_establish_the_federation_council_desc: "Decentralizacja władzy w chwili gdy najbardziej potrzeba jednej silnej ręki do poprowadzenia narodu ku zwycięstwu jest oczywiście rozwiązaniem godnym kretynizmu ostatecznego. Władza w ręce rad! No przecież, demokracja tak bardzo dobrze działa, nawet ta socjalistyczna że tylko doprowadza do upadków państw. Na szczęście, Rada Federacji to będzie zaledwie organ doradczy bez większych uprawnień normalnej egzekutywy. To na to miast rodzi jednak kolejne, zasadnicze pytanie: Po jakiego chuja?\n\nCzy my udajemy że to robimy, czy jednak to robimy? Regionalne władze będą miały reprezentację na szczeblu centralnym, ale po co, skoro i tak mają samorządy do tego? Co tak naprawdę mają robić oprócz zajmowania stołków i przytakiwaniu Politbiuru? Szczególnie jeśli będą oni z nadania centralnego, to ma to taki sens jak ofensywa zimowa na Moskwę. Bo przecież, nie zrobią wyborów do rad.\n\nPrawda?\n\nPRAWDA?"
DGR_ministry_of_recovered_territories_nc: "Ministerstwo Ziem Odzyskanych"
DGR_ministry_of_recovered_territories_nc_desc: "The lands we liberate are full of traitorous wretches constantly itching for the defeat of our movement. At best, they passively despise us. That, I can tolerate. It's the ones who take up arms that are the real problem. Sure, it's barely a hassle to put down the occasional uprising. It's good exercise for the troops; it keeps them from growing stiff in between campaigns. However, while the stick's a great tool, even it breaks when used too often. Sometimes, the carrot comes in handy as well. The people might hate everything we stand for, but if they believe us to be the only way of restoring stability to this godforsaken country, of actually being able to change something for the better, they'll eventually learn to shut up and go along with the party programme."
DGR_civilian_corps: "Korpus Cywilny"
DGR_civilian_corps_desc: "There's no such thing as a civilian in the middle of a revolution. We're all combatants, one way or another. Whether in the classroom, the hospital, or in some damp, dimly lit office, you're still part of the vanguard. That's why it's soldiers that we need in there, not milquetoast clerks who, while nicely trained to recite theory when needed, and under direct orders to serve the party, and party alone, have never seen a lick of the real fight. Their sheltered, pretty faces treat their mission as some sort of bureaucratic directive. The ideological checklist says to promote certain values, so promoting these values is what they will do. Beyond that, they're empty husks whose fervor is nothing but performative. Any such offices should be reserved for those who fought on the front lines and risked their lives for what they claim to believe in."
DGR_invest_in_public_healthcare_facilities: "Inwestycje w publiczną służbę zdrowia"
DGR_invest_in_public_healthcare_facilities_desc: "The medical cabal has always had a tendency to play god; deciding who gets to live and who dies without care when they're no longer contributing funds to the system. Even then, they'd probably squeeze them even further in those last days. In a capitalist system, the doctors' financial incentive is to keep the patients sick for as long as realistically possible. After all, a cured patient means the loss of further revenue. Medicine should be a service. No more inflated salaries and cozy private practices, just laborious self-sacrifice for the good of the nation. The few doctors who adapt to this unforgivable disrespect of actually being forced to do their damn jobs will be allowed to keep their positions. But if we see even the smallest sign of trying to unfairly profit off their work beyond the state-provided salary, their licenses will be permanently revoked on the grounds of moral bankruptcy until only the ones with a true calling are left."
DGR_expand_social_welfare_programs: "Poszerzanie programów socjalnych"
DGR_expand_social_welfare_programs_desc: "To że podążamy kultem robotniczym nie zmienia sytuacji że niektóre jednostki po prostu nie są w stanie być produktywni, ale zamiast kapitalistycznego darwinizmu społecznego proponujemy rozwiązania humanistyczne - poszerzenie świadczeń socjalnych dla najbardziej potrzebujących. Nie powiem że nie jest to zdanie z którym bym się jakoś kłócił okrutnie...ale. Ale czy na pewno teraz jest odpowiedni moment na wydawanie pierdyliarda złotych na programy społeczne, skoro walczymy o własne życie na frontach wojny domowej?\n\nJak parę osób pomieszka na ulicy do końca wojny to nic się nie stanie wielkiego. A wolę żeby moi żołnierze mieli z czego strzelać niż żeby pijakom było cieplej. Bo oni nie zbudują nowego kraju, a Ci którzy o niego walczą - właśnie to robią"
DGR_energy_committee_nc: "Komitet Energii"
DGR_energy_committee_nc_desc: "The energy sector manages crucial strategic resources that need to remain within state control. We didn't take it back from the grubby hands of the oligarchs just to hand them back the keys. Instead, they think they can strongarm us into purchasing power from the global market, turning Poland into just another puppet. And if we disobey, they'll threaten to turn the lights off. No, I won't even entertain the notion of selling off our independence. I'd rather drag our tanks into combat myself than have them run on foreign oil. Our coal deposits might be stretched thin and alternative fuel technologies underdeveloped, but so be it. We'll tighten our belts until the power grid's ready to handle the needs of our citizens. We can just... I don't know, drop some panels in the middle of Błędów Desert or something. Expand the power plants. It's not my job to figure that out anyway. They have experts for that kind of stuff for a reason."
DGR_open_up_to_alternative_power_sources: "Otwarcie na alternatywne źródła energii"
DGR_open_up_to_alternative_power_sources_desc: "You want to know my opinion on this so-called 'Alternative Energy'? Fine. It's a scam; that's what it is. A massive, ineffective fraud peddled by the Western liberal-banker class to siphon cash from mindless investors because, oh no, the planet's burning, and it can only be saved if you invest billions into a giant fucking spinning windmill. But no, no, that's what we're going for. That's what those ‘experts' over at the Committee say we need more of. Say hello to a Poland running on the power of the elements and the hopes and dreams of environmental lunatics. I swear, they better not build their windsticks anywhere close to our bases, because, what a shame, some stray explosive shells will 'accidentally' knock them down during training. Unless they somehow end up building a nuclear reactor; it might not be the best idea to detonate that."
DGR_union_of_the_hard_coal_nc: "Wspólnota Węgla Kamiennego"
DGR_union_of_the_hard_coal_nc_desc: "This comment is going strictly off-record, but a miner might be even more of an insufferable brat than an environmentalist. I swear, these people want so many privileges; they want to be treated like society's elite for just swinging a pickaxe around. Mindless proles, thinking they're kings while living worse than literal slaves. At least those have regular access to the sun. We won't allow ourselves to be bullied by such a pathetic class of people. The extraction targets will be centrally set, as will be the management of the existing mines. If the miners don't like it, they can join a trade union and collectively proclaim their grievances... a state-sponsored one, of course, where the only thing they can proclaim is their love of the People's State, since we banned independent unions. Those have been historically untrustworthy. Soon enough, they'll understand their place is lower than dirt."
DGR_ideological_committee_nc: "Komitet Ideologiczny"
DGR_ideological_committee_nc_desc: "Is that really what they're trying to fight us with? Brochures? Flyers? Hours upon hours of obligatory meetings, analyzing their 'doctrine' like it's some sort of unquestionable religious dogma? As if the magical fucking passages of some hundred-year-old book will summon some esoteric force of pure communism and then, only when the entire room believes it with equal fanaticism, will the people finally become free. The country still suffers under the judeo-capitalist grip, but noooo, let's waste our time on some study circles instead! We need to act. The people need to fight. The struggle continues, and I will not let it be mollified because another breed of dinosaurs keeps clinging to their favorite lecture. We will send over some irrelevant proxies, but the leadership will not allow itself to be sidetracked by this ideological nonsense."
DGR_office_for_religious_affairs: "Urząd Spraw Religijnych"
DGR_office_for_religious_affairs_desc: "The time has finally come to crush the biggest reactionary behemoth in the entire land. The blood-leeching parasite that has drained the Polish peasants for an entire millennium. The rallying point of every single counterrevolutionary dissident. It's a disgrace we've allowed the Church free rein for so long. That changes now. The official party line they gave us is - 'make sure they know to keep their mouths shut'. Oh, we're gonna do so much more than that. We'll take back every single valuable stolen from the people! We'll make justice for the centuries of exploitation! We will make the priests regret they ever dared to speak out even as much as a word against our movement! And if they stand in our way, if they want to have another crop of martyrs, then martyrs we shall give them! If the party wants to control the Church, I'll make sure there's nothing left for them to keep around."
DGR_myth_of_the_prl: "Mit PRLu"
DGR_myth_of_the_prl_desc: "The old days... The walking fossils within the party keep harkening back to them like it's some lost communist utopia. 'We all got a state-sponsored apartment, and a free car too...' 'You know, comrade Bargieła, life was so much better then...' No, I do not remember those times, but the more they keep repeating it, the less I'm inclined to believe them. If things truly were so perfect, why did this supposedly glorious People's Republic collapse, and why did they allow it to do so? Why did nobody defend the socialist paradise to their deaths when the capitalist robber barons came knocking? Nostalgia is a weak tool, a pathetic one. Reactionaries keep it in their wheelhouse and evoke it to reverse any real change. How pitiful that we have fallen prey to it as well."
DGR_intelligence_committee_nc: "Komitet Wywiadu"
DGR_intelligence_committee_nc_desc: "On the face of it, establishing a centralized intelligence committee is a rare step in the right direction. We are surrounded by traitors, both outside and within our inner circle. We need to know which little weasels have been relaying our moves to the global capitalist cabal itching for every opportunity to dismantle the progress of the Polish people's liberation. What I genuinely cannot fathom is why, then, they voted to keep the control of such an institution away from the only organization whose loyalty is without question? They know the army would make short work of any traitors, but instead, they'd rather keep it run by party apparatchiks. Perhaps they have something to hide? Some double loyalties they don't want us to discover? Even without those tools, the army will conduct its own investigations, and if we find even a sliver of compromising material about our so-called 'comrades', I will personally bring them before a tribunal!"
DGR_secret_collaborators_on_every_street: "Tajni współpracownicy na każdym kroku"
DGR_secret_collaborators_on_every_street_desc: "They've planted their own men everywhere. They think they can hide, but I see them. It's hard not to, given there's always someone around. Plainclothes, sitting on the same benches for hours, pretending to read the Tribune. Always the Tribune, too, for some reason, as if it's some standard-issue piece of work equipment. That's part of what gets you. You think you've gotten a good read on the situation, that you can tell who's who and when the coast is clear to speak out your mind, but every time there is someone else you forgot to account for. Listening in. Snooping around. I can just tell they're watching me with extra vigilance. Whoever's in charge of the new intelligence committee must be part of the same block that finds our ambitions 'problematic'. It seems they're looking for any sign of straying from the party line. Any justification to move against me. I won't give them this opportunity."
DGR_foreign_tech_espionage: "Zagraniczne szpiegostwo technologiczne"
DGR_foreign_tech_espionage_desc: "Lately, my forces have received a flurry of new designs - schematics passed on from the intelligence committee. In a number of crucial spots, they've retraced over the original blueprints to hide the obvious. What they're giving me- this supposed 'technological leap for the military and civilian sectors'-is nothing but stolen equipment. Are they really that inept that the best they can do is ape the innovations of our enemies?! Where is their national pride? How are the Polish people meant to achieve self-sufficiency if we refuse to develop our own technological base? So, what's their plan for later, huh? We take back the country and then what? Beg the foreign industrialists to keep trading their new designs so we can have a hope of keeping up? They'll make us sign away our rights, our independence... in time, we will be slaves to them again."
DGR_media_committee_nc: "Komitet Mediów"
DGR_media_committee_nc_desc: "Control of the media. Finally, something I can get behind. For decades, the Polish people have been exposed to the barrage of lies spewed by networks funded by global capital. They've been fed so much propaganda that this materialistic, hyperindividualistic state of the world has become their status quo, the lens through which they view any of our policies. Most of my compatriots still fight against our revolution. Our cities are filled with quiet obstinance. It will take a colossal effort to deprogram the masses, but the hammer of truth will eventually pierce through the mirage. We will give them the viewpoint they deserve but do not yet know they need. We will turn them into the model proletarian vanguard. We will give them the truth. Our truth. The one and only truth."
DGR_supreme_censor_office_nc: "Supreme Censor Office"
DGR_supreme_censor_office_nc_desc: "The subversives think they're clever, packaging their doctrines into everyday literature. A number of authors and publishers have been exposed as counterrevolutionary elements, but new works keep entering circulation like weeds trying to take over a garden. Taking action after publication is not effective enough. The damage will have been done by then. The only way to regain control of the narrative is through preventive censorship. I can already see all the grumblings there'll be about the so-called infringement on free speech, but if they really wanted free speech, maybe they should've... I don't know, how about not trying to plaster every book they publish with propaganda? How about that? Works that prove to be apolitical will still be given the go-ahead. If anything, we're doing the readers a favor by filtering out the garbage."
DGR_reinforce_the_state_media_monopoly: "Zakopywanie dziury informacyjnej"
DGR_reinforce_the_state_media_monopoly_desc: "Ludzie powinni się cieszyć, że postanowiliśmy przywrócić powszechny dostęp do internetu. Nie ma tutaj co się obrażać na to, że media społecznościowe były katastrofą dla rodzaju ludzkiego. Były, są i będą - to oczywiste. Natomiast musimy tutaj wykorzystać to co nam daje inwigilacja sieciowa. Dopuścić do użytku tylko odpowiednio zatwierdzone portale internetowe i kilka takich, które będą wprost reakcyjne. Dlaczego? Proste, jeśli odpowiednio skutecznie będziemy monitorować ruch internetowy, będziemy wiedzieć kto szuka jakich treści i ludzie sami złapią się w sieci. Hehe, w sieci.\n\nTak czy siak, to jest całkiem sensowna propozycja. Bałem się, że co najwyżej Politbiuro zdecyduje o zrobieniu własnych mediów społecznościowych jak gdyby to w ogóle miało prawo działać. Albo zrobiliby stronę internetową do wrzucania filmików propagandowych. Znając ich, pewnie nazwaliby to RedTube. Co byłoby po prostu idiotycznie zabawne."
DGR_equality_committee_nc: "Komitet Równości"
DGR_equality_committee_nc_desc: "Equality. It's not just a well-sounding word to wave around in front of the masses. But what those party bureaucrats don't understand is that it isn't some emotionless clerical process either. They must think that if you simply pool everybody's collective wealth into one massive pile and then hand out an equal share to each citizen, then all the old grudges will be gone and we'll all live happily ever after. That's what it is for them. A fucking fairytale. Here's what equality really is. It's a chance to stick it to that rich boy, that old money brat who always thought he was better than you just because his parents exploited the working class. To break into that guarded property that always taunted you with its extravagance when you passed by on the way to your own family hovel. To forcefully seize everything you've thus been denied. Only then will you have real equality."
DGR_being_rich_is_being_enemy_nc: "Bogactwo to wróg"
DGR_being_rich_is_being_enemy_nc_desc: "In a capitalist system, there is no ethical way to acquire vast sums of wealth. There exists no such thing as a good billionaire. They all have their sins, and they will not be washed away with a single performative virtuous deed done every once in a while because, oh, they're such fucking saviors, exploiting us for 364 days but then nooo, they're saints because on the 365th they give us some coin so let's shut the hell up and praise them. That's why the rich, without exception, are nothing but a loathsome bunch of leeches, drowning in the decadence sponsored by the underpaid labor of the working class. The rich are an enemy... no. They are THE enemy! So let's see how they'd like it if the roles were reversed. Let's see them run a shift down in the steelworks. And then another. And then another few hundred until they've learned what it's like to labor like a true prole for a few loaves of bread, a bottle of vodka, and the promise of nothing but this for the rest of their pathetic lives."
DGR_state_homosexual_movement: "Państwowy Ruch Homoseksualistów"
DGR_state_homosexual_movement_desc: "Możesz sobie być geją, lezbijkiem czy jakim tam transatlantykiem, to już takie czasy są że muszą takie ludzie być. No dobra. Nie zrobimy wam tutaj żadnych prześladowań. Bez przesady, nie jesteśmy pojebami. Ale weźcie się zapiszcie do rejestru. Haha. Tak na wszelki wypadek. Musicie być zarejestrowani w oficjalnym ruchu. Nie nie, to tylko tak dla waszego dobra. To taki związek wasz zawodowy. Czemu te teczki są różowe? A czemu nie? Co, niefajny kolor?\n\nBardzo fajny. I generalnie jesteśmy bardzo zainteresowani debatą na temat inkluzywności, lubimy dyskutować otwarcie na temat naszych uczuć i upodobań, społeczeństwo musi takie być. Otwarte, gotowe na dyskusję i żeby każdy wiedział kto jest kim, i jakich zaimków chce używać. No przecież dlatego że nie możemy sobie pozwolić na zmisgenderowanie kogoś! A po cóż by innego?\n\nPo cóż doprawdy..."
DGR_curtailing_the_wolfpack: "Sidła na wilki"
DGR_curtailing_the_wolfpack_desc: "I'm going to spell it out for all the folks within the party who might think otherwise: it's YOU who's at our mercy. Not the other way round. You're nothing but a grey, faceless mass, pre-filled with ideology but no actual substance. You offer nothing to the people of Poland. We, the liberated masses, we want war. We want blood. We want to destroy the globalist system and tear its founders limb from limb. The revolution has come, and I am at its helm, not you, you bunch of fucking worthless pencil-pushers. I will finish what I started, and I will either do it with or without you, but if you even think about trying to stand in the way of the National People's Army, you will end up in the same mass graves as the rest of our enemies. Stay. In. Your. Lane. I can get rid of you literally whenever I want. Could you say the same about me? Oh, I doubt it."
DGR_committee_for_military_urban_planning: "Komisja Wojskowego Planowania Miejskiego"
DGR_committee_for_military_urban_planning_desc: "Military expansion should always take precedence over the civilian sector. For national security reasons, whenever we see a promising piece of land, we should be able to requisition it and build any necessary infrastructure. So, then, why are we suddenly being subjected to ZONING LAWS!? Why do we have to defend all new construction before some administrative official, and, even better question, why the fuck is he even allowed to say no? What, are we just not going to build new barracks because some urban planner already envisioned a new housing district there? Or not place down a shooting range because one corner barely touches the tip of a demarcated forest? Tell that to our enemies, why don't ya? Tell them we're literally defenseless because there just wasn't enough free space left around for the army. Incompetence. Just total incompetence."
DGR_expand_the_powers_of_internal_affairs_ministry: "Rozszerzenie prerogatyw Ministerstwa Spraw Wewnętrznych"
DGR_expand_the_powers_of_internal_affairs_ministry_desc: "Internal security should be handled by the institutions already responsible for the wider national defense strategy. The Army defends Poland from external, but also internal threats. It's simple. It makes sense. What doesn't, though, is taking a portion of those duties and delegating it to a separate agency. This is a step in completely the wrong direction. The Ministry of Internal Affairs should be subservient to the military, not try to act as its equivalent. Say we give away our powers. What happens when a threat covers areas under both jurisdictions? It's easy to see how ineffective that would be, but oh, it's only national security, so who gives a damn? They want to play hardball? I can play hardball too. I will not cooperate with the ministry's forces, even under direct orders from up top. Let them figure this shit out. Watch them fail miserably and just wait until they realize the only option left is to give us back control."
DGR_party_supervision_of_guard_units: "Nadzór partii nad jednostkami Gwardii"
DGR_party_supervision_of_guard_units_desc: "They are ripping my glorious army apart! This time, they've come for the guard, some of my most decorated and loyal units. Instead of maintaining operational flexibility and being utilized according to the needs of the central command, they've been gutted, turned into glorified babysitters for local party bosses. Could they really not have predicted that the hegemonic officials who run their chapters like a mob would just use the guard as their personal enforcers, or does the party hatred of the military run so deep, they'd rather see it neutered? Worst of all, these units still bear our insignia. They still nominally answer to me. Whenever one of these bastards sics the guard on a political opponent, or uses it to extort the people, the Army has to be the one to bear the responsibility. Sometimes, the abuses of power are so egregious, it feels like they're deliberately trying to frame us."
DGR_inspectorate_of_general_self_defense: "Inspektorat Generalnej Samoobrony"
DGR_inspectorate_of_general_self_defense_desc: "Our country is practically a pariah on the global stage. The entire globalist world order fears us, and for a good reason, too. Our reputation is a double-edged sword, though. The Germans have already shown what they do whenever a Polish government does acquiesce to their hegemonic ambitions. When somebody says no to the Eurocrats' liberal insanity. They will invade again, which is why it's a welcome sign to see the party preparing the people for the inevitable. I'm not even going to launch an objection. The arming and training of our citizens is so imperative; I don't want it to fail because we can't agree on who gets to handle the process. If they can truly train millions of reservists, as they claim, let it be so, as long as they, naturally, get passed under the Army's control once the invasion comes. As long as we have the numbers, we'll make up for their lackluster preparation."
DGR_abolition_of_general_privileges: "Zniesienie przywilejów generalskich"
DGR_abolition_of_general_privileges_desc: "They really just had the gall to tell me that we're being too lavish. That it's 'unbecoming of a card-carrying communist to enjoy luxuries unavailable to the working class'. That we've shot oligarchs for less. Seriously!? Is that supposed to be some fucking joke!? Yes, I live in a place like 10% more expensive than that of the average prole. Big fuckin' crime. I sometimes, occasionally, indulge in certain finer tastes. I got my ways, I got my contacts. And that's fine. You know why? Because every single day, I put my life on the line for this damn country. I spend my days in some ramshackle barracks, in the dirt, in the squalor, and this... THIS is how they repay me!? Fuck them, honestly. I'm already taking far less than I deserve."
DGR_supreme_audit_office_for_military_expenses: "Najwyższy Urząd Audytowy Wydatków Wojskowych"
DGR_supreme_audit_office_for_military_expenses_desc: "Maszyna musi iść i nie może się zatrzymywać. Oczywiście że do prowadzenia wojny potrzeba kasy! A do prowadzenia wojny totalnej potrzeba jej ogrom. I tutaj jest haczyk - musi ona płynąć natychmiastowo bo każdy dzień opóźnienia to kolejne setki ludzi ginących na froncie. Więc co robią sabotażyści? Wprowadzają biuro audytowe które ma na celu prześwietlać każdy jeden wydatek wojskowy! Jakby zgadzam się z tym że niektórzy przesadzają i więcej pieniędzy przeznaczają na swoje sztaby niż żołnierzy ale to co się teraz odpierdzieliło to przechodzi ludzkie pojęcie! Nasi żołnierze nie dostaną sprzętu bo kontrakty będą tkwiły na biurku jakiegoś pierdolonego urzędasa! Będziecie mieli krew na rękach. I oczywiście nie obejmuje to policji politycznej i służb bezpieczeństwa więc Ci będą sobie mogli bez problemu paradować z najnowszą bronią podczas gdy moi żołnierze zdechną w rowie ze starym kałachem w ręku! Kurwa mać..."
DGR_secret_files_357b: "Tajne akta 357/B"
DGR_secret_files_357b_desc: "Wszyscy wiedzieli i wiedzą, że komisarze gromadzili na wszystkich brudy. Oczywiście, że tak - na tym polega praktyka ograniczonego i wspólnego zaufania że ufamy sobie wzajemnie ale weryfikujemy. Więc nic dziwnego że znajdują się ogromne teczki w których...jest o wiele więcej prywatnych informacji niż bym się tego spodziewał i o wiele za dużo niż by mi się to podobało. Któryś ze skurwysynów nawet miał zarchiwizowany cały serwer Discorda na którym padało dość mnóstwo niewybrednych komentarzy na temat pewnych mniejszości.\n\nNie żebym się tego wypierał ale Szwejoidy na pewno nie odpuszczą takiej okazji by przygrzać mi i moim ludziom za najbardziej błahe rzeczy. Lepiej żeby nie istniała teczka ze wszystkimi tajnymi operacjami bo posypie się fala trupów z szafy.\n\nOh, kogo ja oszukuję - oczywiście że taka istnieje...trzeba zacząć urządzać ogniska czym prędzej."
DGR_pseudo_fascist_deviations: "Odchyły pseudofaszystowskie"
DGR_pseudo_fascist_deviations_desc: "Wszyscy, których nie lubię to faszyści. Taka dewiza od zawsze przyświecała lewicowcom o ilorazie inteligencji na poziomie grejpfruta. I zazwyczaj jak ich otworzyłeś to też byli czerwoni w środku. Nieważne. Na ostatnim gremium partyjnym wygłoszona została ogromna przemowa o odchyleniach pseudofaszystowskich które zagrażają czystości ideologicznej naszego państwa, bla bla.\nNie mogę słuchać tego pierdolenia bo wiem że chodzi im o mnie i moich ludzi. Tradycją najwyraźniej jest słuchanie o prawicowych odchyleniach w stosunku do patriotów w komunistycznej Polsce. Ale ja nie dam się odsunąć jak pospolitego zaplutego karła reakcji.\n\nJak chcą walki to ją dostaną."
DGR_high_inspectorate_of_ideological_discipline: "Wysoki Inspektorat Dyscypliny Ideologicznej"
DGR_high_inspectorate_of_ideological_discipline_desc: "Komisariat Ludowy z dniem dzisiejszym przestaje istnieć w swojej oryginalnej formie i staje się jedynie częścią nowego Wysokiego Inspektoratu Dyscypliny Ideologicznej (w skrócie WIDI). Jakby no wiecie...tęsknić nie będę bo z komisarzy zrobił się pierdolony krokodyl który pożre Ci całą rękę jak tylko wystawisz jeden palec. Ale nadal to byli moi ludzie (jeśli w ogóle pozostali lojalni). Inspektorat podobnie jak komisarze - będą dbali o to czy przestrzega się zasad marksizmu i socjalizmu, pierdolenie.\n\nTylko że oni faktycznie będą tego pilnować. Muszę skontaktować się z Zimmermannem. Na pewno ma jakiś plan zapasowy i siatkę ludzi gotową do działania. Nie mogę odwracać głowy gdy nas demontują krok po kroku ale za to niestety będę ją wsadzał prosto do gniazda szerszeni."
DGR_supreme_prosecutors_office: "Urząd Najwyższego Prokuratora"
DGR_supreme_prosecutors_office_desc: "Czas przywrócić sprawiedliwość pod skrzydła partyjne. Zbyt długo system sądowniczy zależał od wymysłów oficerskich, sprawiedliwość należy do proletariatu.\n\nSłucha człowiek takich rzeczy i mu się flaki w brzuchu przewracają jak można tak wprost srać na wszystko co do tej pory działało i było skuteczne. Wymysły oficerskie?! Jesteśmy w stanie wojny do ciężkiej cholery, oczywiście że sądy będą musiały działać w trybie wojennym i podporządkować się pod wyjątkowe kryteria jakie narzuca nam sytuacja. Ale nie, partyjniacy muszą mieć swoje stołki, muszą mieć poczucie sprawczości i muszą podkładać kłody pod nogi nam, wojskowym. Na każdym cholernym kroku.\n\nNiech lepiej nie wiedzą co będzie jeśli przestaniemy o nich walczyć."
DGR_commission_for_the_persecution_of_war_crimes: "Komisja do spraw Ścigania Zbrodni Wojennych"
DGR_commission_for_the_persecution_of_war_crimes_desc: "Oczywiście, nie może być tak, że oficerowie robią sobie na froncie co im się żywnie podoba. Do cholery, nie jesteśmy bolszewikami! A jednocześnie tak właśnie robią. No nie mówię, demonizowanie swojej własnej armii podczas gdy Polska jest jaka jest to jest wyższy poziom kretyństwa. Co prawda, te najgorsze uwagi krytyczne i wręcz nienawistne nie pochodzą oficjalnie od Politbiura ale komisja do spraw zbrodni wojennych?\n\nOni się nie hamują i naszych żołnierzy jednoznacznie uważają za morderców, przestępców i psychopatów. Wypadki się zdarzają, jesteśmy na wojnie. Rozliczać powinniśmy się po wojnie, gdy nie będzie już potrzebna stała mobilizacja! Cholera jasna, ja potrzebuję zabijaków bo to wróg ma umrzeć a nie my!\n\nA tak poza tym, ja nie mam pojęcia o jakie zbrodnie w ogóle chodzi! "
DGR_dismantle_the_inquisition: "Rozwiązanie Inkwizycji"
DGR_dismantle_the_inquisition_desc: "Koniec z Inkwizycją. Kolejny element układanki który składał się na ciężko wypracowany system który stworzyliśmy w siłach zbrojnych został odstrzelony decyzją partii. Komisja ds. Ścigania Zbrodni Wojennych wykazała szereg zbrodni popełnionych głównie przez jednostki które podlegały pod Inkwizycję i zakomenderowały Politbiuru natychmiastowe aresztowanie wszystkich głównodowodzących tymi jednostkami.\n\nCo z tego że część znajduje się na froncie. Co z tego że ja zeznawałem i obaliłem wszystkie zarzuty. I tak znaleźli sobie własną argumentację. A bo nazwa im się nie podoba, a bo to polityczna bojówka, a bo pogromy, a bo nieokrzesani i niezdyscyplinowani. Większość z tego to prawda oczywiście ale nie mogę przyznać im racji przecież.\n\nSzarejko się doigrał i normalnie byłoby mi z tego powodu wszystko jedno ale...eh, trzeba będzie się z nim przeprosić - muszę go jakoś wyciągnąć z tej celi."
DGR_keep_the_leadership_of_civilian_corps: "Ułaskawienie dla przywódców Korpusu Cywilnego"
DGR_keep_the_leadership_of_civilian_corps_desc: "Korpus Cywilny jakimś cudem przetrwał wszelkie możliwe czystki i ataki skierowane wobec ludzi związanych ze mną. Nie wiem czy to jest jakaś ironia losu czy niedopatrzenie ale wydaje mi się że po prostu chcą ich nastawić przeciwko mnie bo nie mają żadnych argumentów przemawiających za tym żeby ich rozwiązać. Są faktycznie przydatni i akcja przeciwko nim byłaby politycznym strzałem w kolano. Więc jątrzą. I kłamią. I manipulują. I rozpuszczają fałszywe plotki. I Marta w to uwierzyła bo nie chce ze mną nawet rozmawiać. A Marcin? Marcin zawsze przyciśnięty do muru wybiera własną skórę zamiast się za kogoś dać pokroić. Nie mogę się nawet temu dziwić, sam bym tak zrobił.\n\nWszystkich obrócicie przeciwko mnie? A może zaraz pojedziecie na pewne cmentarze i zaczniecie wywoływać trupy żeby tylko mi dopierdolić, co? \n\nJAK DALEKO SIĘ POSUNIECIE, TCHÓRZE?\n\nWALCZCIE ZE MNĄ OTWARCIE!"
DGR_hunt_for_the_young_wolves: "Obława na młode wilki"
DGR_hunt_for_the_young_wolves_desc: Nawet mi się kurwa nie chce nic mówić.\n\nZwlekałem za długo. W końcu przyszli po nas wszystkich. I już nikomu nie było się odezwać. Po raz trzeci i mam wrażenie że ostatni, wszystko co swoją ciężką pracą zbudowałem zostało obrócone w proch. \n\nZabijcie mnie po prostu i spalcie bo nic już mi nie zostało."
DGR_principles_of_national_communism: "Ideały narodowego komunizmu"
DGR_principles_of_national_communism_desc: "Wyrok nie nadchodzi. Chyba tutaj posiedzę dłużej niż się spodziewałem. Docierają do mnie nawet wiadomości. Jest tak jak się spodziewałem. Banda klaunów z czerwonymi nosami próbuje ustalić jakie w ogóle są ich ideały. Kim jesteśmy i czego chcemy od świata? Narodowymi komunistami! Hurra! A co sobą reprezentujemy? BIEDĘ. I robotników. I naród. Narodowych robotników. Robotniczych narodowców. Ale bez faszyzmów. Bardziej komunistyczni niż narodowi. Ale nadal narodowi. Polska górą!\n\nRzygać się chce. A mi zarzucali że jestem tam tylko dla władzy i nie wierzę w żadne ideologie. To co to kurwa w ogóle jest? Ortodoksyjny amalgamat różnych zdań z kilku marksistowskich autorów, połowa z których przeczy sama sobie a jedna czwarta stoi w sprzeczności z prawem które sami sobie uchwalili. Ale dzielnie będą teraz szyli nowe sztandary i udawali że są kimś kim nie mogą być. Może i lepiej, że już nie muszę się pod tym podpisywać."
DGR_appeal_of_the_twenty: "Odezwa Dwudziestu"
DGR_appeal_of_the_twenty_desc: "Jestem tutaj kilka tygodni i nagle słyszę że wszystko zaczyna tu się powoli sypać. Gdyby nie fakt że prycza tutaj jest absolutnie tragiczna, powiedziałbym że bolą mnie żebra od śmiechu. Politbiuro ponoć panikuje bo okazuje się że gdy odbierzesz państwu żelazną rękę w postaci aparatu siłowego, to wszystkie męty społeczne wychodzą z kanałów na powierzchnię i zaczynają krzyczeć. I to głośno, bo przez ostatnie lata nie mogli nawet podnieść lekko głosu. A to hasła że opresyjna władza, tam że wolne media, tu odezwa profesorów, znowu zaś protest studentów, komitety demokratyczne. Zanim się wszyscy obejrzą i znowu będą albo wprowadzać stan wojenny albo padną pod naporem liberalnej hołoty.\n\nA niech płonie."
DGR_association_of_trade_unions: "Zrzeszenie Związków Zawodowych"
DGR_association_of_trade_unions_desc: "Teraz to już dostałem nawet po łbie od strażnika za maniakalne zanoszenie się śmiechem co rusz gdy dochodzą do mnie nowe informacje zza krat. Nie uwierzycie w to, bo nie można nawet czegoś takiego wymyślić.\n\nOtóż, powstało Zrzeszenie Związków Zawodowych pod wodzą Wałęsy.\n\nNo, tego młodszego Wałęsy ale coraz bardziej skłaniam się ku teorii że wszyscy żyjemy w jednej wielkiej symulacji i cała ta historia została napisana przez jakiegoś średnio rozgarniętego pisarza który nie rozumie że nie można po prostu wziąć czegoś co się już raz stało w rzeczywistości i po prostu ordynarnie zrobić to po raz kolejny ze zmienionymi nazwami i ludźmi. Wiem że historia lubi się powtarzać ale to już jest farsa. Tylko nie wiem gdzie oni znajdą stocznie w tym rozpieprzonym kraju. Najwyżej będzie skakał przez płot na Hucie Katowice."
DGR_dawn_of_communist_glory: "Świt komunistycznej chwały"
DGR_dawn_of_communist_glory_desc: "Dziad dopiął swego. Na gruzach reakcyjnej Rzeczpospolitej Polskiej, po trupach nacjonalistycznych działaczy narodziła się nowa Rzeczpospolita Ludowa. Chcą odtworzyć Związek Radziecki albo w ogóle pójść w światową rewolucję - cholera wie, tym kretynom jest w stanie do głowy przyjść cokolwiek. \n\nTo nie ma prawa przetrwać nawet kilku lat. Ja mam czas. A cierpliwi zostaną wynagrodzeni. Skoro nie mają nawet jaj żeby mnie zabić to ja już sprawię że się na nich to zemści.\n\nPoczekamy, zobaczymy."
DGR_eternal_watch_nc: "Wieczna warta"
DGR_eternal_watch_nc_desc: "Szwej is dead. SZWEJ IS FUCKING DEAD! Finally, that fucking dinosaur has died. It would be the ideal opportunity to seize power, but unfortunately, I don't think I can stage a coup from my prison cell. However, one thing is fucking great about it - he was pretty much the lynchpin holding the KPP together, and I'm pretty sure the rest of the party \"comrades\" will be unable to do anything to keep this moloch together, and once this damned country falls, I will finally be able to take back what's mine. I just need to be patient and wait."
DGR_state_funeral_nc: "Państwowy pogrzeb"
DGR_state_funeral_nc_desc: "The government is organizing a fucking funeral for Szwej. While I would love to go there and spit in his fucking face one last time, I don't think the guards will let me go there after my recent escape attempt. I mean, I can always look through the window and see the preparations for the funeral. They are literally everywhere, and I'm pretty sure they will also recruit some prisoners to help. Maybe if I volunteer to decorate the prison, they will let me attend the funeral? Then I will finally be able to get my revenge for my arrest back then."
DGR_extraordinary_federation_council_session: "Nadzwyczajna sesja Rady Federacji"
DGR_extraordinary_federation_council_session_desc: "Now that the funeral is over, the so-called \"Federation Council\" has organized an emergency session to deal with the aftershocks of Szwej's death. What are they going to do? They were always marginalized, and I don't think they gained any experience during their years of assisting the actual government. I also heard they are going to choose a new general secretary, but the council is surely way too fucking divided to choose anyone. Just a few months, and this entire system will collapse, and I will finally be able to reclaim my power."
DGR_the_little_constitution: "Mała Konstytucja"
DGR_the_little_constitution_desc: "The Council is creating a new constitution? Wow, didn't expect they could even write. I'm pretty sure it will contain unnecessary points like \"LGBT rights\" or something like that, and lack very important points, such as letting the military elect new general secretaries. I'm not sure it would even change anything, as the commies have already purged the military of all experienced elements and replaced them with fucking mindless puppets, just to avoid sharing power with us. Anyway, I digress. The new constitution won't do anything to help with the post-Szwej's death chaos, so my return to power is coming closer and closer, I guess."
DGR_little_thaw: "Mała odwilż"
DGR_little_thaw_desc: "What? The government has declared all my great, experienced, and loyal generals as fucking traitors of the state? Really? They are trying to blame all their mistakes on us, while they are the ones who caused them in the first place! And they included me, the greatest patriot of the country? I mean, that was to be expected, as the commies hate anyone who actually loves their country. They prefer to put people who don't even supply new soldiers for the state first, like these LGBT freaks. Anyway, I'm sure the people will realize who the traitor of the state really is, and finally fight for my cause."
DGR_economic_consolidation_plan: "Plan gospodarczej konsolidacji"
DGR_economic_consolidation_plan_desc: "The government recently created an \"Economic Consolidation Plan\". They make it seem like it will magically solve every problem of this country, but I see through their deception and realize that all of this is just made to temporarily satisfy the common man, just a populist measure. However, it means they have to somehow appease the people for now, and, by connecting the dots, I realize that the government is on its last legs and that my time to show is coming soon. I wish I could confirm it; however, there aren't many people visible through my cell's window, but I'm sure it's true."
DGR_new_leader_of_the_soviet_state: "Nowy lider państwa sowieckiego"
DGR_new_leader_of_the_soviet_state_desc: "They actually elected someone? Wow, thought the council would deadlock forever, but I guess I was wrong. I don't really know who the new secretary is; however, they will apparently reveal them soon and organize a massive countrywide parade to celebrate. They have to organize a fucking parade every time a big event happens, or else people wouldn't come there, because the common man doesn't care about politics. He cares about finishing his 8-hour shift, eating a meal at the canteen, and returning home to see his family. Anyway, I'm pretty sure the new General Secretary will be even more incompetent than Szwej. Szwej has at least gathered some experience during his life."
DGR_party_with_the_nation: "Partia z narodem"
DGR_party_with_the_nation_desc: "A party official recently visited my prison, and he wanted to help the staff with cooking. I think they actually let him cook, as the dinner that day was fucking inedible. I thought it was just a random inspection, but the next day another one came, and dinner was inedible once again. However, this couldn't be a coincidence - I'm sure the government planned something like that. Even in my daily newspaper, as fucking unreadable as it is, I saw many more acts of \"kindness\" from party officials. The government tried to give the party a human face. However, bureaucrats aren't there to have a human face. They are there to put a stamp on a piece of paper, then give it to another bureaucrat, who also stamps it, and so on. However, if the KPP is so desperate for public support, it means the collapse is coming, and finally, I will be able to regain my rightful place."
DGR_nation_with_the_party: "Naród z partią"
DGR_nation_with_the_party_desc: "Literally everyone except me in my prison went to a May Day parade. Why? They were going to shorten their sentences by a fucking month if they went there, duh. Nobody cares about May Day; they only like it because it's a holiday. I would bet my every ration card that everyone there was bribed or forced to march, as there is literally no other reason. Anyway, in the newspapers there are lots of pictures of such marches, and on TV they show a 10-minute video of them every 5 minutes. Who do they think they are fooling? Me? The masses? Well, let me spoil it to them - absolutely fucking nobody. Only someone of Szwej's age would believe such lies."
DGR_opening_up_to_foreign_markets: "Otwarcia na zagraniczne rynki"
DGR_opening_up_to_foreign_markets_desc: "Excuse me? I worked so much to make sure Poland could stand alone, without foreign interference, but they just ignore it, and sell Poland to the West, just like Balcerowicz 55 years ago? Anyway, I'm sure this action will backfire - we already had enough to prosper, and letting foreign corporations, who escaped Poland the moment it had some internal troubles, will surely bring nothing good except sucking out Polish labor, so that some billionaire can buy his 37th yacht. Hopefully, people realize this and help me get this country back on track, even though the future already looks gloomy."
DGR_warsaw_pact_reborn: "Odrodzony Układ Warszawski"
DGR_warsaw_pact_reborn_desc: "The Warsaw Pact. While it was named after Poland's capital, Poland was one of the slaves of the USSR, designed just to bring resources to the \"Motherland\". It's an old, failed concept, but I guess the commies like reviving concepts like this, as they announced the revival of the Warsaw Pact. Really? I worked so fucking hard so that the past doesn't come back haunting us, but they just fucking invite it to their door? A commie's mind is full of shit, I guess. I really hope the collapse will come soon, as I lose faith in ever saving this rotten country."
DGR_steadfast_demilitarization: "Stanowcza demilitaryzacja"
DGR_steadfast_demilitarization_desc: "The fuck? The communists just lowered the number of troops they consider \"adequate\" for national defense. Yes, you heard that right. Lowered. LOWERED. I FUCKING WORKED SO FUCKING HARD TO MAKE SURE POLAND CAN DEFEND HERSELF, BUT THE COMMIES JUST FUCKING DON'T CARE ABOUT IT AND LEAVE OUR BORDERS UNGUARDED! I feel like I'm going to get a fucking heart attack. These red worms just don't care about Poland; they just care about their \"communist ideas\". I'm sure this will prove detrimental to them, as what nation has such a small standing army?"
DGR_forward_to_victory_of_communism: "Naprzód, po zwycięstwo komunizmu!"
DGR_forward_to_victory_of_communism_desc: "The entire world is against me. My former allies either turned their backs on me or were arrested. The nationalist cause has been purged by the dirty commies, who turned this once-glorious country into a communist hellhole. Is there even anything to live for? The nationalist cause is long dead. My life is meaningless. I'm not sure if these moments are life itself or just well-camouflaged death knocking on my door. Hope may die last, but mine has already died. Fear. Now I feel it. This primal essence of humanity. Fortunately, I happen to have the perfect recipe for this state. I've managed to steal a knife from the prison kitchen. Well, then. Old friend...i'm coming to you.\n*slash* \n*thud*\n..."




## Events ##
dabrowa_border.1.t: "Zemsta za 2025!"
dabrowa_border.1.desc: "Nasi żołnierze dokonali wiekopomnego osiągnięcia, udało nam się wykorzystać sytuację panującą za naszą wschodnią granicą, i przejąć ziemie, od Bukowna aż po Klucze, wcześniej pod tyranią of Supreme Prosecutorship. Jest to zdecydowanie punkt zwrotny w wojnie trwającej od długich lat, kiedy to hordy Ziobry najechały Zagłębie. Teraz to ich ziemia, ich krew. A my będziemy wyzwolicielami z okowów! Co prawda wojska prokuratury odstąpiły od dalszych działań zbrojnych, a my nie jesteśmy na tyle silni by kontynuować nasze natarcie, jednak jest to zdecydowanie krok bliżej Olkusza. I pokonania tej zdradzieckiej, faszystowskiej kreatury."
dabrowa_border.1.a: "Precz z faszystowskim najeźdźcą!"

dabrowa_border.2.t: "Inwazja na Bukowno nie powiodła się"
dabrowa_border.2.desc: "Nasi żołnierze rozpoczęli walkę z nadzieją w sercach i z furią w oczach, ale rzeczywistość okazała się nieubłagana. Próba wykorzystania napiętej sytuacji na naszej wschodniej granicy skończyła się porażką - nie byliśmy w stanie utrzymać naszych pozycji ani w Bukownie ani w Kluczach. Ziemie te nadal pozostają pod butem i w żelaznym uścisku tyrana prokuratora Ziobry. Porażka ta oznacza mocny cios w długiej wojnie, która rozpoczęła się w momencie gdy hordy Ziobry po raz pierwszy najechały Zagłębie. Nasi żołnierze walczyli dzielnie, ale obrona wroga okazała się zbyt silna. Póki co, droga do Olkusza jest zamknięta. A zdradziecka, faszystowska kreatura znowu uniknęła wymierzenia sprawiedliwości."
dabrowa_border.2.a: "Dopadniemy was jeszcze!"

dabrowa_border.3.t: "Inwazja na Bukowno nie powiodła się"
dabrowa_border.3.desc: "Nasi żołnierze rozpoczęli walkę z nadzieją w sercach i z furią w oczach, ale rzeczywistość okazała się nieubłagana. Próba wykorzystania napiętej sytuacji na naszej wschodniej granicy skończyła się porażką - nie byliśmy w stanie utrzymać naszych pozycji ani w Bukownie ani w Kluczach. Ziemie te nadal pozostają pod butem i w żelaznym uścisku tyrana prokuratora Ziobry. Porażka ta oznacza mocny cios w długiej wojnie, która rozpoczęła się w momencie gdy hordy Ziobry po raz pierwszy najechały Zagłębie. Nasi żołnierze walczyli dzielnie, ale obrona wroga okazała się zbyt silna. Póki co, droga do Olkusza jest zamknięta. A zdradziecka, faszystowska kreatura znowu uniknęła wymierzenia sprawiedliwości."
dabrowa_border.3.a: "Dopadniemy was jeszcze!"

dgr_district.1.t: "Podróż w obłęd"
dgr_district.1.desc: "Marcin Bazylak didn't even look back. The guards had let him go-not out of mercy, but indifference. The coup was over, the National Council had declared victory, and there was no point in holding a broken man. His breath steamed in the morning air as he stumbled to his Skoda Superb, fumbled with the keys, and fired up the engine. He didn't care where he left the documents or if anyone followed him. There was only one thought in his mind: his family. Tires screeched as he turned onto the main road. Is he too late? Past the quiet buildings. Were they telling the truth? Past shuttered shops. Was it just a lie? Through the smoking ruins of last week's 'random' explosions.\n\nAt the roundabout near Katowice Steelworks, he missed the exit. His hands trembled. Sweat poured despite the cold. Somewhere between panic and instinct, he tried to turn back - too sharply, too fast. The car fishtailed. Slammed into a barrier. Metal groaned, glass cracked, and the world spun.\nSilence. Then voices.\nRough hands pulled open the driver's side door. Boots crunched gravel. Someone pulled Bazylak out, dazed and bleeding, onto the cold pavement.\n- Alive - said one of them. - Barely.\nPresident passed out. When he woke up, he was lying on the couch in some old office. Is he in the Steelworks? Standing above him was a broad-shouldered man in an old suit, with a faded red star pinned to the collar. First Secretary of the Communist Party of Poland, Krzysztof Szwej.\n- Marcin - Szwej muttered, amused. - Still running?\nBazylak tried to speak, failed, then nodded. His voice cracked. \n- I need to get my wife. My kids...\n- We'll get them - Szwej said firmly - You have more pressing issues to deal with, President.\n\nBehind the dirty window, one could see that smoke was rising across the city. The National Council had barely lasted the morning. But it was already almost sunset. The neighborhoods turned on them fast - old gang grudges, political feuds, vendettas with boots and fire. The police were gone for good. Bargieła fled west, toward Łęknice with only a handful of his loyal friends. A few minutes later, in a backroom beneath an old steelworks office, Bazylak sat with a wet rag to his head and a cup of bitter coffee in his shaking hands.\n- I can't - he whispered - I'm done. I should've left years ago.\n- You'll do what's needed - Szwej said, pacing across the room - We all will.\nHe turned to one of his men. - Find his family. Bring them here. Safe. Take three men with you. - Then he turned to Bazylak, quieter now - You were a ghost in a dead state, comrade. But now you'll help build something real.\n\nAs the steelworkers were leaving the premises to find the president's family, they saw one of their comrades raising red banners and instead of the text \"Huta Katowice\" above the gate, they proudly displayed a new one, a declaration that said:"
dgr_district.1.a: "POPULAR FRONT OF DĄBROWA GÓRNICZA"

dgr_district.2.t: "Wojny Osiedlowe"
dgr_district.2.desc: "Czy tak zwany 'rząd' który kontroluje zaledwie jedną dzielnicę może mieć jakąkolwiek legitymizację prawną by rządzić całym miastem? Dąbrowa Górnicza okazuje się być miejscem silnie skonfliktowanym, jeżeli nie wręcz w stanie anarchii. Grupy bandytów bezustannie terroryzują miejscową ludność, trzymając ich w żelaznym uścisku, a jednocześnie nie stronią od walki z innymi gangami o dominację nad kolejnym zrujnowanym budynkiem. Huta Katowice stała się ostatnim bastionem miejskiej administracji, aczkolwiek została ona przejęta przez Komunistyczną Partię Polski. Jak bardzo zdesperowanym trzeba być, by oddać władzę grupie starych pierdów z poprzedniej epoki? Marcin Bazylak nie miał wyjścia. Znaczy się, prawdopodobnie miał, ale ten drugi skończył by się powieszeniem go na latarni w Parku Hallera. Więc koniec końców zdecydował się podpisać pakt z diabłem, ogłaszając rząd miejskiej jedności rządzony z największego kombinatu metalurgicznego w całym kraju - Huty Katowice.\n\nNiestety, nie wszyscy poparli tę decyzję, czego efekt widać w przemysłowym sercu Dąbrowy Górniczej, gdzie zgromadził się niecały tysiąc popleczników rządu. Czy dysponując tak nikłymi siłami można przejąć ponad stutysięczne miasto? KPP zdecydowanie będzie potrzebowało pomocy, oraz umiejętnego manewrowania pomiędzy kolejnymi gangami. Czas by dzielić i rządzić."
dgr_district.2.a: "Chaos jest drabiną..."

dgr_district.3.t: "Odpowiedź Młodych Hutników"
dgr_district.3.desc: "Do Krzysztofa Szweja:\n\nspieprzaj dziadu"
dgr_district.3.a: "Bezczelne gnojki!"
 
dgr_district.4.t: "Obóz Zielona poddaje się!"
dgr_district.4.desc: "Dziwacy to nieodzowna część rewolucji. Nikt o zdrowych zmysłach nie jest w stanie położyć cały swój dobytek na szali by iść walczyć o niepewne jutro. Ale czy na pewno ruch rewolucyjny potrzebuje ludzi, których naczelną wartością jest hedonistyczna inhalacja substancji powszechnie uznawanych za narkotyki? Wieczna impreza w parku Zielona wydaje się kończyć. My nawet nie za bardzo chcieliśmy ich ruszać, a nie jest pewne czy oni nawet są świadomi tego, że zdecydowali się poddać i nie stawiać oporu Frontowi Ludowemu?\n\nW te czy we wte, Korzeniec oraz Zielona powróciły pod centralną kontrolę rządu, i w zasadzie tutaj powinniśmy na tym postawić kropkę. Dobrze będzie nie wdawać się w szczegóły, kto co jak i dlaczego."
dgr_district.4.a: "Lepiej nie sadź i nie pal..." 

dgr_district.5.t: "Koniec Wojen Osiedlowych"
dgr_district.5.desc: "Udało się. W końcu po miesiącach chaosu i anarchii, nasze dzielne wojska zdołały zakończyć trwającą w mieście wojnę i przejąć kontrolę nad większością miasta. W obecnej chwili jedyne walki odbywają się z niedobitkami zabarykadowanymi w pojedynczych budynkach. Administracja miejska powróciła do swoich prawowitych miejsc: cywilny samorząd do Urzędu Miejskiego, natomiast partia na swą siedzibę obrała odbudowywany ze zniszczeń Pałac Kultury Zagłębia. Patrole na ulicach zostały wznowione, a nasza milicja uważnie pilnuje bezpieczeństwa na osiedlach na których jeszcze parę dni temu strach było wyjść na ulicę. Zakłady przemysłowe oraz małe sklepy po raz pierwszy od dawna otwierają się bez strachu przed wymuszeniami czy podpaleniami. Świt wstał nad Dąbrową Górniczą."
dgr_district.5.a: "Czas na odbudowę!"

dgr_district.6.t: "Walki osiedlowe - Porażka"
dgr_district.6.desc: "Próba przejęcia kontroli nad Strzemieszycami zakończyła się porażką. Początkowe postępy spotkały się z niespodziewanie zaciekłym oporem ze strony nieregularnych formacji gangów zabarykadowanych w różnych strefach. Skoordynowane zasadzki, zablokowane skrzyżowania, i improwizowane materiały wybuchowe zatrzymały naszych żołnierzy zanim dostali się oni na strategiczne węzły drogowe. Jednostki atakujące, zbyt szeroko rozciągnięte i pozbawione lokalnego wsparcia, szybko wpadły w chaotyczny odwrót. Żaden przyczółek nie został ustanowiony. Kluczowa infrastruktura dzielnicy pozostaje pod kontrolą wroga. Morale pośród żołnierzy którzy przetrwali można opisać jako \"chujowe ale stabilne\". W obecnej chwili, dzielnica jest stracona. Cena krwi była zbyt wysoka i ten obszar Dąbrowy Górniczej pozostaje w rękach przeciwnika. Tylko czas pokaże czy będziemy w stanie po raz kolejny spróbować odzyskać ten rejon."
dgr_district.6.a: "Powrócimy."

dgr_district.7.t: "Walki osiedlowe - Porażka"
