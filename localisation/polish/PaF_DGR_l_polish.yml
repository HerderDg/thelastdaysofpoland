dgr_narkom.2.t: "Ślepa uliczka"
dgr_narkom.2.desc: "W gabinecie na piętrze szpitala przerobionym na tymczasową siedzibę partyjną dominował zapach lekarstw, zwietrzałej kawy i desperacji. Krzysztof Szwej siedział przy stole, otulony grubym kocem pomimo gorąca. Ręce wciąż mu drżały, chwilami gubił wątek, a tego wieczoru już kilkakrotnie przyłapał się na wpatrywaniu w dokumenty, których otwarcia nie pamiętał.  Wokół niego siedzieli ministrowie i wyżsi urzędnicy partyjni, a wszyscy mieli ze sobą wspólną cechę -  Wszystkim nie podobała się wojskowa dyktatura stanu wyjątkowego. Żaden z nich nie dowodził żołnierzami. Żaden nie mógł aresztować generała Bargieły. Gdyby wojsko dowiedziało się o tym spotkaniu...\n- Zapewne są jeszcze jacyś oficerowie którzy dalej byliby w stanie wykonać prawomocny rozkaz Politbiura. I Towarzysza Sekretarza, oczywiście - zaproponował Marcin Bazylak, któremu obecne czystki przypominały jego czasy w których prezydentura została mu wydarta z rąk przez tych samych ludzi, którzy teraz znajdowali się na samym szczycie aparatu państwowego.\n- Albo po prostu puśmy w eter listę wszystkich zatajonych egzekucji i ofiar które siedzą nadal w Wojkowicach - dorzucił Podraza, inny z byłych ministrów\n- Nie zamierzam wywoływać kolejnej wojny domowej. A każda taka konfrontacja do tego doprowadzi - powiedział Szwej odrzucając każdą propozycję zmęczonym ruchem dłoni.\nBargieła miał broń, niemal fanatycznie oddanych ludzi, sądy wojskowe i pewność człowieka przekonanego, że historia już go uniewinniła. Przemówienia go nie zatrzymają. Uchwały go nie przestraszą. Każdy sprzeciw dostarczy jedynie Inkwizycji kolejnego nazwiska.\n- Co nam zostało? - zapytał Bazylak - Stan wyjątkowy w praktyce związał nam ręce. Możemy próbować jakiejś obstrukcji legislacyjnej? Zasypać ich biurokracją? Nie możemy mu po prostu ot tak rozkazać żeby przestał. Wulgar nas nie posłucha.\n- Procedury nie mają znaczenia, sądy to farsa obecnie. Biurokracja go nie zatrzyma - westchnął Podraza - Ale może...\n- Co tam myślisz? - zagaił Szwej zaintrygowany\n- Właśnie to. Nas nie posłucha. A co z resztą jego protegowanych? Namnożyło się im stanowisk to i apetyty pewnie się zwiększyły. Ale głównie to myślę o Korpusie Cywilnym. Lasecki i Grabarczyk - to dość rozsądne dusze, prawda? Posłuchaliby głosu rozsądku. I w szczególności gdyby przekonać Grabarczyk do tego by wpłynęła na Bargiełę...\n- Sugerujesz, że nasz Naczelnik jest pantoflarzem? - zapytał Szwej\n- Wydaje mi się, że młodzież obecnie trochę inaczej na to mówi... - dorzucił Bazylak - Ale zgadzam się ze Zbyszkiem. Pracowałem trochę z Martą, nie wątpie że mogłaby być naszym punktem zaczepienia. Tylko nie wydaje mi się żeby mogła go przekonać do ustąpienia. \n- Aż tak to nie - odpowiedział Podraza - ale chodzi mi o to, żeby pomogła naszym ludziom dołączyć do składów sędziowskich. Jej powiemy prawdę - Bargiele przedstawimy własną listę i powiemy że też chcemy się w to pobawić, musimy mu wskoczyć na ego i pokazać że nie robi tego wystarczająco dobrze. \n- A jak już będziemy mieli swoich sędziów to w moment możemy zatrzymać tę machinę. Czyli jednak wracamy do obstrukcjonizmu. A potem już z górki. Możemy próbować wykorzystać innych oficerów i ich ambicje przeciwko Bargiele - rzekł uradowany Szwej - Towarzysze, to ma przyszłość. Jak zbudujemy odpowiedni grunt to potem po prostu wrócimy do urzędu na swoje stanowiska jakby nic się nie stało i Bargieła nawet nie piśnie. Tylko ostatnia prośba...zróbcie subtelne rozeznanie pośród strażników i służby w Pałacu Kultury. Zobaczcie kogo moglibyśmy przeciągnąć na swoją stronę. Wolę być pewny, że gdy wrócimy to nie będzie na nas czekała nieprzyjemna zasadzka."
dgr_narkom.2.a: "Na wilka najlepsze są sidła w które sam wpadnie."

dgr_narkom.3.t: "Nie wywołuj wilka z lasu"
dgr_narkom.3.desc: "- Panowie, jesteśmy na celowniku\nTymi słowami Aleksander Bargieła rozpoczął posiedzenie kręgu najbardziej zaufanych oficerów Narodowej Armii Ludowej. Większość z nich zdawała sobie sprawę z tego, że Politbiuro wydało im cichą wojnę, lecz nie do końca potrafili przedłożyć poczucie solidarności i współpracy nad własne ego.\n- Gdzie Szarejko? - zapytał Abrahamowicz\n- Znając jego tchórzliwe dupsko to właśnie ucieka do Szkocji czy innej Szwecji. Chuj z nim. Żadne informacje nie mogą mu zostać przekazane skoro nie raczy się pojawić. Rozumiemy? - odparł wściekły jak zwykle Bargieła. Jego nastroje tylko zostały jeszcze bardziej rozhuśtane przez ostatni spisek Politbiura który zakończył jego stan wyjątkowy. A teraz..\n- Pytanie. Dlaczego po prostu nie weźmiemy całej armii jakiej mamy i nie zabijemy ich wszystkich? - Zimmermann mógł być krwiożerczym psychopatą, ale nie można było mu odmówić pewnej logiki w tym stwierdzeniu. Ich przewaga była miażdżąca.\n- Żartujecie sobie? Chcecie wywołać wojnę domową w środku wojny domowej? - oburzyła się Marta Grabarczyk, będąca jak zwykle sumieniem tej grupy patologicznych podżegaczy wojennych - A czy macie pewność w ogóle, że wszyscy za wami podążą? Ilu waszych żołnierzy wybierze jednak bezpieczeństwo ponad strach którymi emanujecie? Nie zastraszycie wszystkich, za dużo ich zrekrutowaliście. \nPokój na chwilę zamilkł kontemplując słowa oficer Korpusu Cywilnego, a po chwili odezwał się Bargieła.\n- Właśnie w tym problem. Nie mamy pewności. Wszyscy nasi najwierniejsi żołnierze kryją front. Jak wycofamy siły to możemy nie mieć gdzie wracać potem. A w rezerwach są głównie bataliony Czerwonych Sztandarów i inne jednostki które opowiedziałyby się po stronie Politbiura. One byłyby tu szybciej. I nie, Wojtek. Komisarze nie wystarczą. Inkwizycji nawet nie ma co prosić bo jak widzisz, najwierniejszy z wiernych Szarejko spierdolił z piskiem nie wiadomo gdzie!\n- Gwardia jest na miejscu... - odezwał się Czyżewski, przywódca Gwardzistów\n- Tylko lokalny oddział - zaoponował Abrahamowicz - A na Sielcu masz garnizon który tę waszą Gwardię rozniesie w trzy dupy. Albo przynajmniej zatrzyma na tyle by ściągnęli kogokolwiek z regionu.\n- ...i właśnie dlatego chciałem powiedzieć, że nie poprę żadnej eskalacji. Nie poślę żadnych moich ludzi na dziwny zamach stanu - dokończył Czyżewski. Bargieła spojrzał na niego z furią w oczach.\n- To w takim razie tam są drzwi. I wszyscy Ci którym nie pasuje to co będziemy musieli zrobić niech wyjdą zanim skończy mi się cierpliwość\nCzyżewski wstał i wyszedł ostentacyjnie razem ze swoim zastępcą, Kubą Wernerem. Po chwili również i Grabarczyk wstała i skierowała się ku drzwiom. Bargieła przez chwilę zawahał się, ale walcząc ze sobą nie powiedział nic. Marta tylko rzuciła na odchodne wychodząc:\n- Wybacz Alek, nie mogę patrzeć na to co sobie robisz. Nie posyłaj po mnie.\nWraz z trzaskiem drzwi Bargieła podniósł głowę i zobaczył kto został. Abrahamowicz. Zimmermann. Zieliński. Zagórski. Lasecki. Mniej szabel niż się spodziewał. Pojedynczo będą łatwym łupem dla rozochoconego aparatu Politbiura który tylko czeka żeby ich podzielić i pojedynczo wyeliminować. Westchnął, zamknął oczy i rzucił do zgromadzonych. \n- Bez przewrotu jeszcze. Działamy zgodnie z procedurami. Będę was informować."
dgr_narkom.3.a: "Obyście dotrwali do końca."

