 ## Curtailing the Wolfpack GUI ##
 DGR_nat_support_info_tt: "Jak działa ta mechanika? To naprawdę proste. Masz 4 zmienne - §YPoparcie Biurokracji§!, §YPoparcie Armii§!, §YIntegralność§! oraz §YGniew§!.\n\n §YBiurokracja§! i §YPoparcie Armii§! - to właśnie te zmienne musisz obniżać, by wygrać. Jeśli obie spadną poniżej §Yokreślonego progu (na przykład 90%, 70%, 30%)§!, otrzymasz wydarzenie obniżające integralność, która jest wymagana do dalszego postępu. \n\n §YIntegralność§! - to jedyna zmienna, której nie możesz zmieniać bezpośrednio. Spada po obniżeniu §YPoparcia Biurokracji§! i §YPoparcia Armii§! poniżej §Ywielokrotności 10, takich jak 90% czy 40%§!. Po obniżeniu integralności uzyskasz dostęp do kolejnych części dedykowanego drzewa skupień. \n\n §YGniew§! - ta zmienna może §Rzniszczyć§! twoje państwo, jeśli nie będziesz ostrożny. Możesz go obniżać poprzez decyzje dotyczące przekupstwa. Jeśli przekroczy §Y50§!, otrzymasz karę skalującą się wraz z poziomem gniewu pomnożonym przez % integralności. Jeśli jednak osiągnie §Rponad 90§!, nacjonaliści §Rwywołają wojnę domową§!, co zakończy zarówno mechanikę, jak i (prawdopodobnie) twoje państwo. \n\nPamiętaj, że przekupywanie wojska to §Rmiecz obosieczny§!. Każda łapówka §Rzwiększa§! popularność nacjonalistów, która, jeśli będzie zbyt wysoka, §Rdoprowadzi do wojny domowej§!. Jeśli wzrośnie §Rza bardzo§!, otrzymasz §Ywydarzenie i decyzje pozwalające sobie z tym poradzić§!. Jeśli do tego dojdzie, poczekaj, aż popularność nacjonalistów zacznie biernie spadać.\n\nDodatkowo nacjonaliści będą od czasu do czasu próbowali §Rwzmocnić§! swoją władzę, więc miej na nich oko."
