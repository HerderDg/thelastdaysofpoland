dgr_narkom.25.t: "Nowy typ Procesji"
dgr_narkom.25.desc: "- Chwała Partii! Chwała Ludowi! Chwała Federacji! Chwała Karoń! - skandował bezustannie ogromny tłum, maszerując ulicami Dąbrowy Górniczej.\n\nElżbieta, starsza emerytka, wyjrzała przez okno, by sprawdzić, co jest przyczyną tego hałasu. Okazało się, że ulicą przechodzi ogromny tłum ludzi, z których każdy trzymał transparent wychwalający Partię, sekretarz generalną i wszystko, co było z nimi związane.\n\n- Przestańcie wrzeszczeć i pozwólcie mi w spokoju obejrzeć „Ranczo”! - krzyknęła do tłumu, ale wyglądało na to, że nikt jej nie słyszał.\n\nPo kilku minutach hałas stopniowo cichł, aż w końcu całkowicie ucichł.\n\n- Nareszcie. Teraz mogę spokojnie wrócić do oglądania telewizji - powiedziała, lecz ktoś jej przerwał.\n- Chwała robotnikom! Niech żyje KPP! - wrzeszczał kolejny tłum.\n\nNowy tłum składał się z pracowników Huty Katowice, wciąż ubranych w robocze stroje. Elżbieta obserwowała ich przez okno i przeklinała pod nosem, choć oni jej nie słyszeli. Po pewnym czasie ten tłum również odszedł.\n\n- Nareszcie… - pomyślała Elżbieta i odwróciła się w stronę telewizora, ale właśnie leciały już napisy końcowe. - Eee, chyba obejrzę jutro. Nie ma szans, żeby ci ludzie znowu tu wrócili.\n- Chwała Ludowi! Chwała Partii! Chwała Karoń! - rozległ się krzyk tłumu.\n\nElżbieta dostrzegła kilka nowych twarzy, ale większość stanowili ludzie, którzy już wcześniej przemaszerowali ulicą i przerwali jej święty czas oglądania „Rancza”.\n- Naprawdę? Znowu? Ile czasu minie, zanim wreszcie im się to znudzi? - pomyślała Elżbieta.\n\nTymczasem drugi tłum zaczął maszerować z przeciwnej strony, prosto na pierwszy. Oba tłumy przemaszerowały przez siebie nawzajem, a niektórzy ludzie płynnie przechodzili z jednego do drugiego, nawet się nad tym nie zastanawiając.\n\n- Naprawdę? Znowu? Czy ci ludzie nie mają żadnej pracy, żeby zarobić na moją emeryturę? Kiedy wreszcie im się to znudzi i sobie pójdą? - pomyślała Elżbieta.\n\nMinęło wiele godzin, a oba tłumy wciąż maszerowały ulicami. Jednak gdy słońce skryło się za blokami na zachodzie, ludzie w końcu się rozeszli i ruszyli do swoich domów.\n\n- Ach, nareszcie. Spokój. Gdybym tylko mogła teraz obejrzeć „Ranczo”… Trudno. Jutro będzie kolejny odcinek - pomyślała Elżbieta i poszła spać.\n\nNoc była cicha, niemal aż nazbyt cicha. Jednak o szóstej rano wszystko się zmieniło. Elżbietę nagle obudził odgłos kroków i krzyki."
dgr_narkom.25.a: "- Chwała Partii! Chwała..."

