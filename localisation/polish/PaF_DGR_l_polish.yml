dgr_narkom.15.t: "Survival of the Finest"
dgr_narkom.15.desc: "The sun was slowly lifting itself off the horizon as Andrzej, a farmer working on a collective farm in the countryside, stood in the middle of a field with a basket. He was gathering what was left after yesterday's potato harvest. With his eyes locked on the ground, he didn't notice a dark green car with government-issued license plates. When the sound of the engine started to break the silence around Andrzej, he slowly began to move towards the main road. A group of four men exited the car and approached Andrzej.\n\n - Good morning, officers. What's the matter? - The farmer replied. \n - According to the new state initiative that aims to elevate the quality of all consumables. - One of the men replied, - We are ordered to inspect as well as to apply new, regulated norms to your harvest. \n - Huh?...- Andrzej replied. - I mean, ummm, alright. \n He looked at the basket in his hand and picked the first potato from the edge. Then he passed it to one of the officers who only glanced at it before throwing it on the ground. \n - This potato is way too small and not round enough to meet the new regulated standards. \n Andrzej looked through his basket searching for a big, round potato. From what he had gathered in the previous hour, only twenty vegetables were somewhat aligned with the will of the Party. \n - This one is still too small; this other one is not in the right shape - said the officer, carefully putting a tape measure around one of the potatoes - and that one… it just doesn't really look right, but that last one is somewhat acceptable. \n After saying that, the officer opened the car shipment and tossed the \"acceptable\" potato into a big container. \n Andrzej looked at the four officers with disbelief. One. The new regulations left only one potato in his basket. Now - Andrzej thought to himself - the whole potato harvest was about to meet the same fate. \n - Sir, we have to check all of them - another officer continued. \n Andrzej looked again at his farm's field and thought to himself for a moment. \n\n As the four officers drove away after a successful mission of enforcing regulations on vegetables that were not good enough for the Polish working class, Andrzej approached the edge of the same field where he began his work and stared at it for a minute. When the chilly late evening wind threw him off his train of thought. The battered farmer sighed and made his way back onto the field to continue his task."
dgr_narkom.15.a: "Well, someone just has to have it worse..."

