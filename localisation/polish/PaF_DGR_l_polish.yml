 DGR_curtailing_the_wolfpack_gui: "Poskramianie Wilczego Stada"
 DGR_nationalist_sabotage: "Sabotaż Nacjonalistów"
 DGR_nationalist_sabotage_desc: "Nacjonaliści rozpoczęli sabotowanie naszej armii, osłabiając naszą siłę na polu bitwy i znacznie utrudniając zaopatrywanie oraz przemieszczanie naszych jednostek. Duch zostanie usunięty, gdy gniew spadnie poniżej 50%."

 DGR_bop_administration_purges: "Czystka w administracji"
 DGR_bop_administration_purges_desc: "Nacjonaliści mają wielu sojuszników w administracji, dlatego powinniśmy spróbować ograniczyć ich wpływy poprzez zwalnianie powiązanych z nimi pracowników."
 DGR_bop_military_purges: "Czystka w wojsku"
 DGR_bop_military_purges_desc: "Armia jest bastionem nacjonalistów, ale nie oznacza to, że nie ma w niej słabych punktów. Zastąpimy mniej wpływowych, nielojalnych generałów i będziemy obserwować, jak cała struktura zaczyna się rozpadać."
 DGR_bop_ministry_intervention: "Interwencja Ministerstwa Spraw Wewnętrznych"
 DGR_bop_ministry_intervention_desc: "Ministerstwo Spraw Wewnętrznych ma ogromną władzę nad biurokracją. Szkoda byłoby jej nie wykorzystać do walki z nacjonalistycznymi elementami w administracji, niszcząc ich wpływy kolejnymi falami zwolnień."
 DGR_bop_defund_mil_infra: "Ograniczenie finansowania infrastruktury wojskowej"
 DGR_bop_defund_mil_infra_desc: "Infrastruktura wojskowa jest w tym kraju znacznie przeinwestowana, co powoduje liczne braki w budżecie. Aby temu przeciwdziałać, tymczasowo ograniczymy przeznaczane na nią środki, by zarówno oszczędzić pieniądze, jak i zmniejszyć wpływy nacjonalistów."
 DGR_bop_blackmail_military: "Szantażowanie generałów"
 DGR_bop_blackmail_military_desc: "Nie ujawniliśmy wszystkiego, co znajdowało się w aktach 357/B. Wciąż mamy mnóstwo informacji, które możemy wykorzystać przeciwko nawet najbardziej wpływowym osobom w wojsku, a dokumentami możemy wymusić na nich posłuszeństwo."
 DGR_bop_prosecute_fascists: "Ściganie faszystów"
 DGR_bop_prosecute_fascists_desc: "Niestety, wielu naszych pracowników to faszyści, którzy tylko przykrywają się czerwoną gwiazdą, udając komunistów. Musimy z tym walczyć, by zwalczać wpływy nacjonalistów wszędzie, a także dopilnować, by wyższe stanowiska mogli obejmować wyłącznie prawdziwi, oddani komuniści."
 DGR_bop_replace_disloyal: "Wymiana nielojalnych działaczy"
 DGR_bop_replace_disloyal_desc: "Czystki nie wystarczą. Biurokracja wciąż pełna jest ludzi, którzy tylko czekają, by nas zdradzić i stanąć po stronie nacjonalistów. Przeciwdziałamy temu poprzez ogromną falę zwolnień, zapewniając, że nasz personel pozostanie lojalny wobec naszego zadania i naszej sprawy."
 DGR_nationalist_moves: "Nacjonaliści działają..."
 DGR_nationalist_moves_desc: "Nacjonaliści nie stoją w miejscu. Zaciekle planują swoje działania mające zniszczyć nasz kraj, ale nie możemy im na to pozwolić. Na razie nie da się tego powstrzymać, ale gdy tylko ich domek z kart runie, ich działania również się załamią."
 DGR_bop_appease_military_bribes: "Przekupienie generałów"
 DGR_bop_appease_military_bribes_desc: "Czasami jedyną rzeczą, jakiej chce generał, są pieniądze. Nie chcemy takich generałów, ale niestety, tonący brzytwy się chwyta, więc będziemy musieli ich tolerować, a w zamian po prostu dać im pieniądze, by nie zaczęli się irytować i radykalizować po stronie nacjonalistów."
 DGR_bop_appease_military_goods: "Więcej dóbr dla żołnierzy"
 DGR_bop_appease_military_goods_desc: "Żołnierze nieustannie narzekają na niskie żołdy i kiepskie jedzenie. A gdybyśmy faktycznie zrobili to, czego chcą, zamiast ich ignorować? Tymczasowo podniesiemy ich żołd, co powinno wystarczyć, by przestali narzekać, przynajmniej na jakiś czas."
 DGR_bop_appease_military_funds: "Więcej zasobów dla wojska"
 DGR_bop_appease_military_funds_desc: "Wojsko jest gigantyczną studnią bez dna. Im więcej mu dajesz, tym więcej chce. Jednak spełnienie jego żądań z pewnością je zadowoli, sprawiając, że będzie mniej agresywne wobec naszych planów. To naprawdę idealne rozwiązanie, dopóki nacjonaliści nie zażądają połowy naszych dochodów."
 DGR_bop_stall_the_nationalists_desc: "Nacjonaliści się buntują, ale potrzebujemy czasu na reorganizację! Aby go zyskać, będziemy sabotować infrastrukturę, spowalniając ich postępy i dając nam więcej czasu na walkę z nimi."
 DGR_bop_small_scale_purges: "Niewielkie czystki"
 DGR_bop_small_scale_purges_desc: "Nie możemy teraz całkowicie się ich pozbyć, ale wciąż możemy przeprowadzać zorganizowane, małoskalowe czystki tam, gdzie będzie to miało znaczenie. Taka czystka z pewnością pokrzyżuje ich plany, ale jej przeprowadzenie zajmuje dużo czasu."
 DGR_imminent_coup: "Nieuchronny zamach stanu"
 DGR_imminent_coup_desc: "Nacjonaliści się buntują! Jeśli chcesz zachować swój rząd, spowalniaj ich tak bardzo, jak to możliwe, i walcz z nimi na każdym kroku, aby upewnić się, że będą mieli zbyt mało wojska, by spróbować czegoś więcej. W przeciwnym razie mamy przejebane."
 ## Reindustrialisation GUI ##
 DGR_reindustrial_category: "Reindustrializacja"
 DGR_industrial_desc: "Kapitalizm okazał się być tragedią dla polskiego przemysłu. Zarówno przemysłu ciężkiego, jak i lekkiego. Metalurgia, górnictwo, włókiennictwo, przemysł elektroniczny. Wszystko poszło pod młotek, albo zostało wyprzedane za bezcen. Musimy odwrócić tę katastrofę w imię pracującego ludu. Czyn społeczny przywracania przemysłu polskiego musi zostać wykonany! Do roboty!"

