unification.58.t: "[GetNewspaper]Wspólnota Gór Sowich jednoczy region Wrocławski!"
unification.58.desc: "Bardzo dziwne wiadomości dochodzą z regionu Dolnego Śląska. Tereny te zostały całkowicie przejęte przez Wspólnotę Gór Sowich - dziwny amalgamat luźno powiązanych ze sobą komun miłośników trunków. We Wrocławiu czuć w powietrzu woń alkoholu, która bez wątpliwości pozostanie tam przez dłuższy czas. Człowiekiem u władzy jest legenda polskich osiedli i bohater wyskokowych napojów - Piston. Po wielkim rozłamie we froncie alkoholowym, wziął swoich ludzi i podążył w stronę Gór Sowich, pozostawiając resztę pijaków daleko za sobą. Jego tradycyjna doktryna była mocno utopijna, ale pomimo tego udało się dzięki niej dotrzeć tam gdzie znajduje się obecnie. Z tak nikłym egzekwowaniem prawa i samym brakiem jego istnienia, może być ciężko wspólnocie zarządzać tak rozległym terenem. Ale może, polski nektar bogów będzie spoiwem który złączy strzaskany i skacowany naród ponownie w całość."
unification.58.a: "I za to można się napić!"

super.58.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.58.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.58.a: "Wreszcie zjednoczeni."

