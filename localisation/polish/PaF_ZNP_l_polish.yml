unification.204.t: "[GetNewspaper]Związek Nauczycielstwa Polskiego jednoczy region stołeczny"
unification.204.desc: "Stronnictwo skupione wokół ZNP wyłoniło się z protestów, które miały wywrzeć na rządzie presję, by podniósł wynagrodzenia polskich nauczycieli. W ostatnich latach, gdy rząd już nie istnieje, Związek skupił się na ochronie zrzeszonych nauczycieli oraz na tym, by w trudnych warunkach nie doszło do gwałtownego spadku poziomu czytelnictwa i jakości edukacji. Determinacja jego członków oraz powszechny szacunek, jakim się cieszą, pozwoliły im w końcu przejąć region stołeczny. Pozostaje zobaczyć, jak nauczycielskie stronnictwo poradzi sobie z rządzeniem tak liczną populacją. Obecnie na czele Związku stoi Sławomir Broniarz, który pełni tę funkcję nieprzerwanie od 1998 roku. Znany z liberalnych sympatii, niezachwianego zaangażowania na rzecz dobrobytu nauczycieli i budząco kontrowersje wysokich zarobków, może nie zechcieć oddać władzy narodowi, który w przeszłości lekceważył potrzeby nauczycieli."
unification.204.a: "Sól tej ziemi"