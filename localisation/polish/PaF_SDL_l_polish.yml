unification.104.t: "[GetNewspaper]Powstanie Ludowej Unii Podlasia!"
unification.104.desc: "Po upadku Polski większość ludzi martwiła się przede wszystkim poważnie zniszczonym przemysłem, a rolnictwo schodziło na dalszy plan. Przywódcy PZ i AGROunii różnili się jednak od większości społeczeństwa i postanowili wziąć na siebie odpowiedzialność za ochronę polskich rolników przed zgubnymi wpływami zagranicznymi. \nDzięki współpracy, która pozwoliła obalić rywalizujący z nimi podlaski rząd po drugiej stronie granicy, powstały po zakończeniu wewnętrznych walk w obrębie dawnego województwa, a także dzięki rozwiązaniu własnych problemów wewnętrznych, na czoło wysunął się Związek Ludowy Siedlec pod przywództwem Mateusza Piskorskiego, który obecnie kontroluje całe województwo podlaskie.\nPo latach walk Związek wreszcie zaprowadził pokój na Podlasiu i zamierza zbudować nową Polskę, w której szanowane będą rolnictwo oraz tradycyjne wartości. Zanim jednak będzie mógł tego dokonać, musi podbić resztę Mazowsza i 14 województw, co niewątpliwie jest kolejnym punktem jego programu."
unification.104.a: "Tłuste lata"

unificationreg.104.t: "[GetNewspaper]Ludowa Unia Polski podbija Prusy i Warmię!"
unificationreg.104.desc: "To, co zaczęło się jako niewielka grupa w Siedlcach, stało się istotnym graczem w trwającej wojnie domowej w Polsce, w miarę jak liczba rywalizujących stron stale maleje. Ambitny Ludowa Unia Polski już jakiś czas temu obrał sobie za cel dawne Prusy Książęce, a teraz odniósł zwycięstwo. W rezultacie znalazł się w gronie ostatnich pretendentów do zwycięstwa w tej wojnie.\nWrogość Związku wobec Rosjan w Kaliningradzie daje wielu jego obywatelom o antyrosyjskich poglądach nową nadzieję, że prezydent Piskorski może jednak postawić Polskę na pierwszym miejscu. Ich marzenie jest bliskie spełnienia, ale walka jeszcze się nie skończyła. LUP musi pokonać przeciwnika na południu, zanim w ogóle będzie mógł pomyśleć o przekroczeniu Wisły i zjednoczeniu wszystkich Polaków pod jednym sztandarem."
unificationreg.104.a: "Polska ziemia dla polskich rolników, a wtedy wszystko będzie jak należy"

unificationsupreg.104.t: "[GetNewspaper]Ludowa Unia Polski rozszerza swoje wpływy poza Podlasie"
unificationsupreg.104.desc: "Dawna Ludowa Unia Podlasia była potężnym regionalnym rządem, a teraz zmierza ku temu, by stać się czymś więcej.\nKampania przeciwko rozmaitym państewkom w północnej części województwa mazowieckiego zakończyła się wielkim sukcesem. Obecnie nowo proklamowany Ludowa Unia Polski kontroluje wszystkie ziemie Mazowsza na północ od Warszawy, ale nie zamierza posuwać się dalej na południe. LUP spogląda ku ziemiom na północy, podzielonym obecnie między rząd warmińsko-mazurski a rząd emigracyjny Federacji Rosyjskiej. Oczywiście te dwa byty nie będą długo współistnieć w pokoju, a rząd LUP Mateusza Piskorskiego zamierza wykorzystać ten konflikt, obalając oba. Jeśli mu się to uda, kampania ta stanie się punktem zwrotnym w krótkiej historii LUP."
unificationsupreg.104.a: "Nadszedł czas żniw"

super.104.t: "[GetNewspaper]Nowa, agrarna Polska."
super.104.desc: "Dziś w całej Polsce rozchodzą się zaskakujące wieści: anarchia panująca po upadku państwa i epoka lokalnych watażków wreszcie dobiegły końca, a nowy rząd obiecuje zmiany w czasach rozkładu i stagnacji.\nLudowa Unia Polski to państwo agrarne, które opowiada się za polityką socjalną, ochroną kultury i tradycji oraz patriotycznym podejściem nie tylko do stosunków zagranicznych, lecz także do polityki gospodarczej.\nWarto zauważyć, że przywódca tego ugrupowania, Mateusz Piskorski, znany jest ze swoich silnie prorosyjskich poglądów, przez co cieszy się niewielką sympatią wśród tych części nowego polskiego społeczeństwa, które sprzeciwiają się Rosji, a takich ludzi jest wielu. Piskorski nie jest jednak już tym samym człowiekiem, którym był w 2027 roku, a jego poglądy na wiele spraw uległy zmianie. Dopiero przyszłość pokaże więc, jak będą kształtować się stosunki polsko-rosyjskie."
super.104.a: "Dobre czasy dla polskiej wsi mogą wreszcie nadejść!"