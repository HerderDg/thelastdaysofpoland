##Characters## 
POLITICS_EWA_KOPACZ_DESC: "Jeden rok. Jeden katastrofalny rok. Rok, którego jej umysł nigdy nie pozwoli jej zapomnieć. Tyle wystarczyło Ewie Kopacz, by straciła wszystko. To właśnie jej porażka skierowała kraj na mroczną drogę. \n\nAktywna w polityce od końca dwudziestki, Kopacz wydawała się skazana na wielkość. Swoje miejsce odnalazła w 2001 roku, gdy dołączyła do nowo powstałej Platformy Obywatelskiej tuż przed jej pierwszymi wyborami, zdobywając mandat w rodzinnym regionie radomskim. Potem wspinała się po kolejnych szczeblach kariery, najpierw obejmując stanowisko ministra zdrowia, a następnie wiceprzewodniczącej partii. Ostatni krok na drodze do władzy wykonała w 2014 roku, gdy po rezygnacji Donalda Tuska została premierem Polski. Wtedy wszystko poszło straszliwie źle. \n\nPod jej przywództwem pozornie niezwyciężona Platforma Obywatelska przegrała wybory prezydenckie oraz wybory do obu izb parlamentu na rzecz PiS, i to w odstępie zaledwie kilku miesięcy, podczas wyjątkowego sezonu wyborczego. Czas pokazał, że partia już nigdy nie odzyska władzy w kraju, a ugrupowanie, które Kopacz tak beztrosko lekceważyła, zacznie rządzić Polską żelazną ręką. Nieudana przywódczyni dołączyła w końcu do swojego dawnego lidera w Brukseli, z dala od własnej porażki i nie wiedząc, czy kiedykolwiek wróci do źródła swojego wstydu. \n\nPodobnie jak wielu byłych przywódców PO, w końcu otrzymała szansę dołączenia do niemieckiej inwazji. Kopacz nie była jednak zdrajczynią. Odcinając się od Tuska, przekroczyła nieszczelną granicę i ostatecznie dotarła do rodzinnego Skaryszewa, jednego z ostatnich miejsc w kraju, gdzie wciąż wspominano ją z sympatią. \n\nPragnąc wreszcie udowodnić wszystkim, że się mylili, utworzyła nowe państwo oparte na silnej biurokracji. Nie pozwoli już, by nieporządek paraliżował naród. Rozbudowany system przepisów z pewnością przełoży się na niespotykaną dotąd w Polsce produktywność. Jak dotąd oznaczał jednak tylko dłuższe kolejki po dziesiątki nowych, niezbędnych zezwoleń. \n\nJeśli system wreszcie nie zacznie przynosić rezultatów, druga szansa Ewy Kopacz na rządzenie krajem nie potrwa dłużej niż pierwsza."

##Events##
unification.109.t: "[GetNewspaper]Biurokracja Skaryszewa jednoczy region radomski!"
unification.109.desc: "Pośród chaosu ogarniającego Polskę zmazano dziedzictwo porażki jednej kobiety. Powrót do rodzinnego miasta był początkowo dla Ewy Kopacz przygnębiającym doświadczeniem, ponieważ podjęła się zadania zbudowania nowego państwa w Skaryszewie. Opierając się na silnej tradycji biurokratycznej, zreorganizowano pracę według zestawu centralnych dyrektyw i ujednolicono wszystkie aspekty życia społecznego. W zaskakującym obrocie spraw plan ten przyniósł regionowi nowy dobrobyt, pozwalając Kopacz rozszerzyć swoje wpływy na okoliczne ziemie. Teraz, gdy jej władza jest już ugruntowana, przewodnicząca spędza dni na pisaniu nowych ustaw wraz z wybraną grupą ekspertów. Z każdym dniem kolejne dziedziny życia zostają uregulowane, wydawane są nowe pozwolenia, a przepisy coraz ściślej egzekwowane. Mimo istniejącego sprzeciwu biurokracja wciąż rośnie i coraz mocniej zakorzenia się w życiu mieszkańców Radomia. Być może pewnego dnia ten nowy porządek obejmie całą Polskę."
unification.109.a: "Wszyscy jesteśmy tylko trybikami w maszynie"

unificationreg.109.t: "[GetNewspaper]Biurokracja Skaryszewa podporządkowuje sobie województwo świętokrzyskie"
unificationreg.109.desc: "Bezpańskie pozostałości domeny Ziobry zostały objęte uporządkowaną kontrolą biurokratyczną. Mieszkańcy województwa świętokrzyskiego z dnia na dzień obudzili się w nowej rzeczywistości, w której spory rozstrzygane wcześniej siłą rozwiązuje teraz legalistyczny system sądowniczy regulujący każdy aspekt codziennego życia. Mimo pospiesznie wdrażanych programów mających zaznajomić ludzi z tysiącami nowych przepisów, którym teraz podlegają, region od chwili włączenia do Skaryszewa jest sparaliżowany przez ogromny zator administracyjny. Lata wadliwego prowadzenia dokumentacji sprawiają, że zarówno osoby prywatne, jak i uznane przedsiębiorstwa niemal nie są w stanie uzyskać zezwoleń niezbędnych do dalszego funkcjonowania. Ponieważ większość transakcji przeniosła się na czarny rynek, ekspansja okazała się jak dotąd gorzką pigułką dla skaryszewskich urzędników. System mimo to nie zwalnia, produkując kolejne ustawy podczas każdej sesji legislacyjnej."
unificationreg.109.a: "Rozwiązanie ich problemu jest proste - więcej regulacji"

unificationsupreg.109.t: "[GetNewspaper]Galicja spacyfikowana przez siły biurokracji"
unificationsupreg.109.desc: "Pomimo zaciekłego lokalnego oporu cała Galicja została włączona do rozrastającej się biurokracji Skaryszewa. Wolny duch Bieszczadów został siłą poskromiony, a nawet najspokojniejsze regiony Polski podlegają teraz coraz bardziej zawiłej sieci ustaw i kodeksów. Do podbitych województw wysłano specjalnie wyszkoloną kadrę administracyjną, która ma pilnować egzekwowania nieustannie rosnącej góry rozporządzeń. Fala sprzeciwów grozi bowiem sparaliżowaniem kolejnych prób ograniczania nieuregulowanej działalności. Wśród zwycięzców nie było świętowania, ponieważ przyłączenie kolejnych ziem wymaga stworzenia bezprecedensowej liczby nowych przepisów dotyczących ich zarządzania i rozwoju. Wbrew wszelkim przeciwnościom ta republika przepracowanych urzędników wydaje się gotowa rzucić wyzwanie pozostałym watażkom w walce o zjednoczenie kraju. Być może dzięki armii korzystającej z daleko posuniętej standaryzacji domena Kopacz zdoła jeszcze objąć cały naród."
unificationsupreg.109.a: "Nikt nie ucieknie przed urzędniczymi mackami"

super.109.t: "[GetNewspaper]Porządek triumfuje w Polsce"
super.109.desc: "Pośród chaosu i anarchii wreszcie zapanował porządek. Po raz pierwszy od niemal dekady Polska znów jest całością. Dzięki niezliczonym zwycięstwom i ogromnemu wysiłkowi Ewa Kopacz zyskała drugą szansę na rządzenie okaleczonym narodem. Gdy PiS nie może już sabotować i niszczyć jej planów, nowa pani prezydent wreszcie może urzeczywistnić swoją wizję rozbudowanej biurokracji. W całym kraju szeroko zakrojone reformy obejmują regulacjami nawet najdrobniejsze czynności, lecz pod radosnymi okrzykami urzędników wielu obywateli grzęźnie w procedurach uzyskiwania pozwoleń i licencji. Spędzają całe dnie, wędrując od urzędu do urzędu przez kafkowską sieć przepisów, tak zagmatwaną, że nawet najbardziej doświadczeni urzędnicy nie potrafią rozwikłać sprzecznych zapisów. Potężna maszyna biurokratyczna Skaryszewa zna tylko jeden tryb działania - tworzyć coraz więcej ustaw, aż w końcu zawali się pod własnym ciężarem."
super.109.a: "Artykuł sporządzony zgodnie z dyrektywą A/04.2032 w sprawie funkcjonowania publicznych platform medialnych"