STE_netto_greenlight_merger_desc: ""

STE_open_schools_idea: "Otworzyć szkoły!"
STE_open_schools_idea_desc: "Na zwieńczenie naszej kampanii edukacyjnej otworzyliśmy szkoły i lokalne uczelnie w całym Pomorzu Zachodnim. Niczym nieskrępowany, powszechny dostęp do bezpłatnej edukacji sprawi, że żaden wielki umysł się nie zmarnuje. Przyszłość Republiki zależy od wychowania najmłodszych w duchu wiedzy, abyśmy nie powtórzyli dawnych błędów i nie podzielili losu III Rzeczypospolitej."

STE_tax_relief_zkl: "Ulga w podatku dochodowym"
STE_tax_relief_zkl_desc: "Zgodnie z obietnicą złożoną podczas kampanii wyborczej Unia Konserwatywno-Liberalna \"Zamek\" wprowadziła szeroko zakrojone obniżki podatków dla niższej i średniej klasy Republiki. Reforma ma zachęcić obywateli do ciężkiej pracy oraz dodatkowego wysiłku. Premier Bogucki ogłosił już ustawę olbrzymim sukcesem, twierdząc, że wydajność we wszystkich sektorach wzrosła w stopniu niespotykanym od czasu powstania."

STE_parliamentary_woes: "Rządy tymczasowe"
STE_parliamentary_woes_desc: "Nasz rząd jest tymczasową konstrukcją złożoną z ludzi o skrajnie różnych poglądach i celach. Dążenie do tego, by nie zrazić żadnego skrzydła dawnej partyzantki, dopóki nie zbudujemy stabilnej demokracji, może być szlachetne, lecz z pewnością nie służy sprawności, z jaką powinno działać państwo. Kłótnie i bójki, do których brakuje jedynie jednego pchnięcia, są w parlamencie codziennością. Jedyną przyczyną, dla której poszczególne strony jeszcze nie rzuciły się sobie do gardeł, jest obecność prezydenta Krzystka, który podczas każdej sesji niestrudzenie rozładowuje spory, nim te zdążą eskalować."

STE_date_defence_white_paper_idea: "Wstrząsy po Białej Księdze Obronności"
STE_date_defence_white_paper_idea_desc: "Biała Księga Obronności została opracowana przez starannie wybrany korpus oficerów pod przewodnictwem sekretarza stanu do spraw wojny, generała Koziatka. Przedstawiony rządowi dokument wskazał olbrzymią nieefektywność oraz błędy obecne we wszystkich podstawowych strukturach sił zbrojnych. Wywołał potężny wstrząs w każdej formacji wojska: przez całe tygodnie pierwsze strony gazet zajmowały niehonorowe zwolnienia ze służby, przedwczesne emerytury, a nawet procesy dotyczące defraudacji. Nasze cele sięgają znacznie dalej niż granice województwa zachodniopomorskiego. Jeśli chcemy być gotowi stawić czoła wrogom, musimy natychmiast i zdecydowanie skorygować kurs wszystkich rodzajów sił zbrojnych."
STE_call_of_the_sea_idea: "Marynarka Prezydencka"
STE_call_of_the_sea_idea_desc: "Historia naszego miasta jest głęboko związana z Odrą i zapewnianym przez nią dostępem do morza, dlatego §YMarynarkę Prezydencką§! utworzono natychmiast po wyrwaniu Szczecina spod niemieckiej kontroli.\n\nSzybko dowiodła swojej wartości podczas pierwszego kryzysu Republiki: najpierw zablokowała port w Policach w czasie błyskawicznego przejęcia tamtejszego przemysłu chemicznego, a następnie starła się z flotą rzeczną Ligi Wolnych Miast.\nWkrótce wezwała ją kolejna wojna. Okręty dumnie noszące sztandar Gryfa mężnie broniły Szczecina przed łupieżczymi drakkarami Zandberga oraz błyskawicznymi najazdami ze Świnoujścia i Eurokommissariatu Westpolen.\n\n§RTeraz, dysponując niczym nieskrępowanym dostępem do Morza Bałtyckiego, zmierzamy ku utworzeniu silnej i wszechstronnej marynarki zdolnej razić wrogów z wód głębokich i płytkich - od Gdańska aż po Wrocław.§!"
STE_soaring_through_the_skies_idea: "Prezydenckie Siły Powietrzne"
STE_soaring_through_the_skies_idea_desc: "§YPrezydenckie Siły Powietrzne§! są najmłodszym rodzajem naszych sił zbrojnych ze względu na dość słabo rozwinięty przemysł lotniczy regionu. Mimo to pozostają niezmiernie ważne: zapewniają osłonę i wsparcie dzielnym żołnierzom oraz uderzają na wrogów głęboko na ich terytorium, niszcząc możliwości ofensywne i przemysłowe.\n\nZbudujemy lotnictwo dorównujące, a być może nawet przewyższające to, do czego Polska była zdolna przed przeklętą interwencją. §RGryf i Orzeł wzbiją się w niebo i powalą naszych wrogów, zanim ci zdążą choćby pomyśleć o podniesieniu ręki na Republikę.§!"
STE_clean_slate_idea: "Armia Prezydencka"
STE_clean_slate_idea_desc: "§YArmia Prezydencka§!, będąca bezpośrednią kontynuacją Gwardii Gryfickiej, która wywalczyła naszą niepodległość od niemieckiego zagrożenia, stanowi gwarancję stabilności i bezpieczeństwa Republiki w tych burzliwych oraz niebezpiecznych czasach.\n\n§YDe iure najwyższa władza dowódcza należy do jej pierwotnego przywódcy, prezydenta Piotra Krzystka, lecz w praktyce jej wykonywanie spoczywa całkowicie w rękach sekretarza stanu do spraw wojny, generała Koziatka§! - słynnego dowódcy 12 Dywizji Zmechanizowanej sprzed interwencji, która wbrew wszelkim przeciwnościom dzielnie walczyła z niemieckim natarciem.\n\nNiedawne nawiązanie bliskich stosunków ze Zjednoczonym Królestwem, podzielającym nasze poglądy na niemiecką interwencję i jej katastrofalne skutki, pozwala Armii czerpać wielkie korzyści z rad brytyjskiego attaché wojskowego."

STE_oxfam_idea: "Pomoc Oxfam"
STE_oxfam_idea_desc: "Po szeroko zakrojonych negocjacjach z OXFAM i rządem brytyjskim zdobyliśmy pomoc humanitarną, która właśnie napływa do kraju. Zdejmie ona ciężar z przeciążonego przemysłu i usług, pozwalając nam nadać pierwszeństwo odbudowie oraz industrializacji. Jest to jedynie rozwiązanie tymczasowe, lecz jakość życia obywateli Republiki już się poprawia. Obyśmy zdołali utrzymać ten postęp, gdy wsparcie dobiegnie końca."

STE_partners_hanza_idea: "Hanzeatyckie sugestie"
STE_partners_hanza_idea_desc: "Zamek postanowił nawiązać współpracę z Gildią Hanzeatycką, aby ponownie uruchomić zdobyte zakłady przemysłowe, a następnie włączyć je do zachodniopomorskiej gospodarki. Choć nie jest to oficjalne przeniesienie własności, Gildia Hanzeatycka tymczasowo uzyska decydujący wpływ na najważniejsze decyzje, zapewniając stabilność i konkurencyjność. Oby nasze stosunki i wzajemna współpraca kwitły."

STE_security_incentive_idea: "Płaca za wyniki, awans za zasługi"
STE_security_incentive_idea_desc: "Dodatkowa nagroda powinna zawsze wiązać się z dodatkowym wysiłkiem i inicjatywą. Zamek pragnie, by takie zachęcanie do pracy przyjęto w całym systemie wynagrodzeń naszego przemysłu. Ponieważ dobrobyt przemysłu zależy również od jakości jego kierownictwa, zagwarantujemy każdemu, kto wykaże odpowiednie zdolności oraz cechy, szansę przejścia z hali produkcyjnej do biura - włącznie z najwyższymi stanowiskami kierowniczymi. Doświadczenie oznacza wydajność, a okres wstępnej służby na podrzędnym stanowisku pokaże, kto zasługuje na awans do wyższej roli."

STE_mantaining_employment_idea: "Czy się stoi, czy się leży, tysiąc złotych się należy"
STE_mantaining_employment_idea_desc: "Utrzymanie zatrudnienia oznacza utrzymanie pracy przemysłu. Skupiając się na sektorach w najbardziej rozpaczliwym położeniu, zachowując stałe tempo finansowanych przez państwo robót budowlanych oraz publicznych i gwarantując stabilne, godziwe płace oraz świadczenia, zapobiegniemy poważnemu bezrobociu w trudnych powojennych warunkach i umożliwimy każdemu obywatelowi życie na przyzwoitym poziomie."

STE_indecisive_economics: "Niezdecydowana gospodarka"
STE_indecisive_economics_desc: "Rosnący popyt przekracza ograniczoną podaż, jaką może zapewnić nasz słabo rozwinięty przemysł, dlatego Ministerstwo Finansów zwróciło się ku cyklowi drobnych korekt. Nieustanne zmiany ceł, finansowania, stóp procentowych i podatków od towarów podążają za prognozami finansowymi każdego kolejnego kwartału. Na papierze wygląda to dobrze, lecz błędne koło nie dotyka źródła problemu, a przedstawione rozwiązania jedynie zwiększają potencjał inflacyjny rosnących wydatków społecznych połączonych z przeciętnymi możliwościami przemysłu. Czy partie Parlamentu zdobędą się na odwagę, by zmierzyć się z nadciągającą zgubą?"

STE_unionisation_idea: "Uzwiązkowienie"
STE_unionisation_idea_desc: "Finansujemy kampanię uzwiązkowienia, której celem jest przeciwstawienie się wyzyskującym skłonnościom niekontrolowanej władzy monopolistycznej sprawowanej przez niektóre elementy gospodarki. Posłowie jednogłośnie zgodzili się na model dobrowolnego członkostwa, gdyż podstawową zasadą wolności robotnika jest możliwość przynależenia do związku, który jego zdaniem najlepiej reprezentuje jego interesy. Zarówno Unia, jak i Zamek przywiązują najwyższą wagę do roli związków zawodowych w kierowaniu gospodarką narodową, a sprawne działanie tej machiny zależy od uczestnictwa ich przedstawicieli na każdym szczeblu. Dzięki naszemu nieustannemu wsparciu powstało już kilka nowych organizacji, a robotnicy Pomorza Zachodniego wreszcie mają siłę negocjacyjną pozwalającą pociągnąć przemysłowych hegemonów do odpowiedzialności."

STE_monopoly_on_odra_trade_idea: "Monopol na handel odrzański"
STE_monopoly_on_odra_trade_idea_desc: "Mając w rękach kluczowe porty Szczecina i Świnoujścia, kontrolujemy cały ruch handlowy zmierzający ku morzu przez dorzecze Odry. Daje nam to przewagę polityczną, dyplomatyczną i strategiczną nad innymi państewkami regionu rozciągającego się od wybrzeża Bałtyku aż po Wrocław. Wykorzystamy tę sposobność, by dalej podnosić jakość życia i wzmacniać potęgę wojska, które będzie jej bronić. Być może przy okazji zawrzemy też kilka lukratywnych umów handlowych."

STE_creeping_inflation: "Pełzająca inflacja"
STE_creeping_inflation_desc: "Choć interwencjonizm i rosnące wydatki rządu obecnej kadencji bez wątpienia poprawiły jakość życia tysięcy obywateli, zapewniając im żywność, tysiące miejsc pracy, opiekę zdrowotną i wykształcenie, wyzwolony przez nas stale rosnący popyt na towary oraz usługi powoli przekracza możliwości ograniczonego przemysłu. Jeśli z czasem nie wdrożymy planu łagodzącego skutki tego zjawiska, zamiast tego wprowadzimy w życie strukturalną teorię inflacji."

STE_kup_DLC_sknerusie: "Hunowie pośród nas"

##First Tree##
STE_so_ist_leben: "So ist das Leben"
STE_so_ist_leben_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nNasze piękne miasto od wielu lat zmaga się z problemami wywoływanymi przez działających poza prawem wichrzycieli. Kradzieże, zamachy i zakłócanie pokoju są dziełem wrogów państwa znanych jako Gwardia Gryficka. Nie dajcie się zwieść ich pozornie dobrym zamiarom. Pragną jedynie drwić z prawa i wzniecić rebelię.\n\nNasi najdzielniejsi synowie chronią ulice, domy i rodziny przed tymi brutalami. W tych niespokojnych czasach potrzebujemy jedności. Razem mamy siłę, by przywrócić naszemu miastu dawną chwałę! Zjednoczmy się i sprawmy, by tak się stało!\n\nZa Stettin!\n\n"
STE_wild_goose_chase: "Pogoń za dziką gęsią"
STE_wild_goose_chase_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nNa rozkaz podpułkownika Stadtpolizei Helmutha Bluthgelda wszystkim obywatelom nakazuje się trzymać z dala od ogródków działkowych na Krzekowie. Osoby i grupy naruszające zakaz zostaną uznane za potencjalnych podejrzanych w śledztwie dotyczącym możliwej rebelii powstającej na przedmieściach. Stadtpolizei poinformowała nas, że działania zostaną zakończone szybko, a porządek utrzymany. Wszyscy rebelianci powinni wiedzieć, że nie ulegniemy ich nikczemnym działaniom i za wszelką cenę ochronimy niewinnych obywateli.\n\nPowiedz nie anarchii!\nChroń swoje miasto!\n\nZa Stettin!"
STE_fortify_buildings: "Ufortyfikuj budynki rządowe"
STE_fortify_buildings_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nChoć sprzeciw wobec niedawnych decyzji i działań okazał się większy, niż przewidywano, wystąpienia przeciwko rządowi nie pozostaną bezkarne. Niezadowolone grupy organizujące marsze i protesty przed siedzibami rządu oraz policji zostaną rozproszone, a winni trafią do więzienia. Aby zapewnić bezpieczeństwo urzędnikom, Stadtpolizei wzniesie rozmaite umocnienia ochronne i obronne wokół posterunków policji oraz biur administracji miejskiej. Wszystkim zalecamy pozostanie w domach i zachowanie spokoju. Wychodzenie na zewnątrz między 22:00 a 6:00 jest zabronione. Próby przełamania zabezpieczeń zakończą się natychmiastową neutralizacją.\n\nZa Stettin!"

STE_call_reinforcements: "Wezwij posiłki"
STE_call_reinforcements_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nWobec rosnących niepokojów w mieście i jego okolicach dowództwo Stadtpolizei wezwało oddziały wsparcia z Oberkommando der Westpolen. Podpułkownik Helmuth Bluthgeld powitał dowódców przybyłych sił po rozmieszczeniu ich w garnizonach wokół Stettina, skąd będą mogły stanowczo odpowiedzieć wichrzycielom występującym przeciwko rządowi. Obywatelom nakazuje się nie przeszkadzać w działaniach Eurokorpusu, a współpraca jest usilnie zalecana. Posiłki pozostaną na obrzeżach do czasu rozwiązania sytuacji. Jeśli zauważycie coś podejrzanego, natychmiast zgłoście to w najbliższym garnizonie albo placówce Stadtpolizei.\n\nBleibt stark, Staatbürgers!\n\nZa Stettin!"
STE_insurgent_whackamole: "Powstańczy berek"
STE_insurgent_whackamole_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nStettiner Stadtpolizei prosi wszystkich obywateli o zachowanie spokoju, ponieważ sytuacja znajduje się całkowicie pod kontrolą. Minionej nocy grupy chuliganów z całego miasta połączyły siły i w skoordynowany sposób zdewastowały budynki rządowe. Podejrzewa się udział nieznanych elementów destabilizujących. Poranne słońce ukazało pełną skalę chuligaństwa, obejmującą między innymi karykaturalne plakaty Eurogouverneura Lindnera w centrum miasta, radiowozy z wybitymi szybami oraz zdewastowane i doszczętnie obrabowane ciężarówki zaopatrzeniowe Eurokomisariatu. Najbardziej rzucającym się w oczy \"dziełem sztuki\" jest jednak olbrzymie graffiti na ścianie ratusza o treści \"Lindner - wypierdalaj\". Obywatele zdolni wskazać potencjalnych podejrzanych otrzymają znaczną nagrodę.\n\nZa Stettin!"
STE_smoke_them_out: "Wykurzyć ich"
STE_smoke_them_out_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nPo kilku niedawnych drobnych niepowodzeniach Stadtpolizei została wzmocniona wsparciem Eurokorpusu i dysponuje teraz pełnym wyposażeniem potrzebnym do szeroko zakrojonej operacji przeciwpartyzanckiej. Policja przeprowadzi wyczerpującą kontrolę każdego domu na przedmieściach, nie pozostawiając kamienia na kamieniu, oraz dokładnie przeszuka wszystkie obszary leśne, aby zagwarantować pełne bezpieczeństwo i ochronę. Prosimy pozostać w domach podczas wykonywania obowiązków przez policję. Każda próba udzielenia pomocy rebeliantom albo zakłócenia poszukiwań spotka się z surową karą. Osoby posiadające informacje o wrogach państwa mogą liczyć na wysokie nagrody.\n\nDbajcie o bezpieczeństwo, obywatele!\n\nZa Stettin!"
STE_ausweiss_bitte: "Ausweis, bitte"
STE_ausweiss_bitte_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nW związku z nasileniem działalności powstańczej w całym mieście mosty na Odrze zostaną dla bezpieczeństwa wszystkich obywateli przekształcone w punkty kontrolne. Do przekroczenia rzeki wymagany jest odtąd dokument tożsamości wydany przez rząd. Wszystkie torby i pojazdy będą dokładnie przeszukiwane przez stacjonujących tam funkcjonariuszy Eurokorpusu. Opór wobec kontroli bezpieczeństwa zostanie uznany za działalność powstańczą. Każdy obywatel, bez względu na status, będzie odtąd potrzebował specjalnej przepustki wydanej przez ratusz, aby opuścić obrzeża miasta. Szczególne uprawnienia służb porządkowych pozostają w mocy do odwołania. Słuchajcie dowódców i przestrzegajcie prawa.\n\nZa Stettin!"
STE_scold_companies: "Zrugaj korporacje"
STE_scold_companies_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nDziś ma miejsce ważne wydarzenie: Eurogouverneur Christian Lindner spotyka się z przywódcami Gildii Hanzeatyckiej. Temat rozmów pozostaje nieznany, lecz nasi reporterzy spekulują, że wiąże się z niedawną działalnością grupy występującej przeciwko rządowi, znanej jako Gwardia Gryficka. Wielu uważa, że od tych rozmów zależy przyszłość miasta. Nie jest tajemnicą, że sytuacja stała się ostatnio napięta. Z tajnego źródła wiemy, że wichrzyciele brali na cel kluczowych pracowników Chemiewerke AG. Z tymi niebezpiecznymi tendencjami trzeba rozprawić się szybko. Nie pozwólcie im prać sobie mózgów!\n\nZa Stettin!"
STE_word_from_sponsors: "Słowo od naszych sponsorów"
STE_word_from_sponsors_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nPodczas dzisiejszych wiadomości o siódmej do opinii publicznej wyciekł utrzymany w ostrym tonie list Eurogouverneura Christiana Lindnera do prezesów Gildii Hanzeatyckiej. Wyraża w nim zaniepokojenie brakiem szacunku dla sprawowanego przez siebie urzędu gubernatora. Lindner krytykuje podstawowe zasady, na których opiera się nasze państwo. Szczególnie niepokojące jest to, że przywódca kraju publicznie atakuje Gildię Hanzeatycką, będącą największym sponsorem naszej gazety. Będziemy uważnie śledzić rozwój sytuacji. Przypominamy każdemu obywatelowi o obowiązku zgłaszania podejrzanej działalności.\n\nZa Stettin!"
STE_hall_of_the_mountain_king: "Szpony Gryfa"
STE_hall_of_the_mountain_king_desc: "Drodzy Obywatele Freie Stadt Stettin!\n\nZamieszki ogarnęły całe miasto. Dzięki wsparciu zdrajców Gwardia zdołała przejąć kluczowe budynki. To skandaliczne zachowanie nie może pozostać bezkarne! Każdy, kto poprze tę partyzantkę, zostanie rozstrzelany na miejscu. Lojalni obywatele, musimy walczyć z tymi skurwys *kartkę przedarto na pół*\n\nNie ma czasu do stracenia, drodzy szczecinianie! Chodźcie z nami i walczcie z okupantami! Niemieckie rządy nad Szczecinem dobiegły końca; nadszedł czas odzyskać nasze miasto! Niech Bóg ma was wszystkich w swojej opiece.\n\nWasz prezydent, Piotr Krzystek."
STE_hanse_brucke_falling: "Hansa-Brücke upada"
STE_hanse_brucke_falling_desc: "Krew przelała się przez miasto Szczecin. Stare Miasto, ogródki Krzekowa i centrum pogrążyły się w przemocy. Gniew ludu po latach upokorzeń wreszcie wykipiał. Wyrok pozornie spokojnych i cichych obywateli był bezlitosny. W ciągu jednej nocy oprawcy stali się uciskanymi. Władza i prawo zniknęły całkowicie. Ewakuujący się Niemcy pozostawili jedynie olbrzymi chaos oraz zdezorganizowaną administrację. Miasto zostało porzucone i zdane na swój los.\n\nOcalić je może tylko jedna osoba: Piotr Krzystek wraz z Gwardią Gryficką musi uprzątnąć chaos i przywrócić miastu dawną chwałę. Nikt nie wie, co przyniesie kolejny dzień.\n\nPrzyszłość Szczecina leży wyłącznie w rękach jego mieszkańców."

##regio-pol tree##
STE_i_vow_to_thee: "Zachodzi nowe słońce"
STE_i_vow_to_thee_desc: "Po niedawnych wydarzeniach związanych z walką o władzę nad stolicą Pomorza Zachodniego na miasto opadł niespokojny pokój. Po bezładnym odwrocie rozbitych szeregów Eurokorpusu i pojmaniu byłego gubernatora regionu, Christiana Lindnera, władzę nad Szczecinem przejmie rząd tymczasowy Piotra Krzystka. Mieszkańcy świętują, gdy rozpoczyna się odbudowa po powstaniu, dając nadzieję na szybkie naprawienie ciężkich szkód wyrządzonych miejscowej infrastrukturze podczas walk. Teraz naprawdę rozpocznie się przywracanie polskiej władzy nad największym miastem północno-zachodniej części kraju."
STE_the_european_elephant: "Europejski słoń w menażerii"
STE_the_european_elephant_desc: "Nic nie boli bardziej niż zdrada dokonana z zimną krwią. Nie istnieje żadne usprawiedliwienie dla wystąpienia Chemiewerke \"Pölitz\" AG przeciwko Szczecinowi i narodowi polskiemu. Korporacja, działając pod wpływem sił zewnętrznych, postanowiła wystąpić samodzielnie i odebrała prawowitemu rządowi kontrolę nad Policami. Ten ważny ośrodek przemysłowy nie może pozostać pod niemiecką władzą. Jako prawowici mieszkańcy tych ziem musimy działać. Nasi najdzielniejsi synowie ponownie chwycą za broń i ruszą na Police, by przynieść im szybkie i, jeśli to możliwe, bezkrwawe wyzwolenie. Do broni, obywatele! Uczyńmy naszego prezydenta dumnym!"
STE_summer_union: "Unia Letnia"
STE_summer_union_desc: "Mieszkańców Szczecina serdecznie zapraszamy na oficjalne zgromadzenie nowo powstałej lewicowej partii Unia Letnia, które odbędzie się w Teatrze Letnim. Nazwa ugrupowania, zaczerpnięta właśnie od tego teatru, odzwierciedla potencjalne cele polityczne. Unia Letnia powstała jako przeciwwaga dla konserwatywnego stronnictwa \"Zamek\" i zamierza promować równość, wolność, tolerancję oraz szeroko rozumiany program postępowy. Charyzma Bogdana Jaroszewicza i znaczne poparcie młodszych wyborców sprawiają, że partia zdaje się gotowa osiągnąć sukces w przyszłych wyborach. Na zakończenie spotkania wystąpi znana piosenkarka Margaret, popierająca ideały ugrupowania, dzięki czemu wydarzenie będzie znacznie ciekawsze."
STE_the_castle: "\"Zamek\""
STE_the_castle_desc: "Wszyscy mieszkańcy miasta zostali zaproszeni na Zamek Książąt Pomorskich, by świętować powstanie nowej Partii Konserwatywno-Liberalnej. Jej członkowie nazwali się \"Zamkiem\" i dążą do zachowania tradycyjnych wartości oraz wzmocnienia władzy prezydenta. Rosnąca popularność wśród starszych wyborców wyraźnie wskazuje, że zdobędą znaczną liczbę miejsc w parlamencie. Uzyskanie większości pozwalającej rządzić samodzielnie wydaje się jednak całkowicie nierealne. Najpewniej będą musieli podzielić się władzą z Unią Letnią i połączyć pomysły obu stron w jeden projekt. Ambitny przywódca Zbigniew Bogucki zamierza mimo to poszerzyć bazę wyborczą i zrobi wszystko, co konieczne, by osiągnąć ten cel."
STE_the_first_session: "Spookóóój!"
STE_the_first_session_desc: "W miarę zbliżania się pierwszego posiedzenia nowo utworzonego rządu Szczecina, na Wałach Chrobrego trwały wielkie przygotowania. W murach siedziby Sejmiku Województwa Piotr Krzystek nadzorował gruntowny remont, który miał przemienić ją w prestiżowy gmach nowego parlamentu zachodniopomorskiej metropolii. Największe dostępne pomieszczenie wyznaczono na salę obrad, z miejscami dla przedstawicieli Unii Letniej i Zamku po przeciwnych stronach oraz fotelem na szczycie zarezerwowanym dla samego Przywódcy. Budynku nie da się już rozpoznać. Wielu widzi w nim nowy klejnot miasta, inni jednak sądzą, że stworzenie tak wystawnego miejsca może być marnotrawstwem środków publicznych."
STE_szczecin_charter: "Karta Szczecińska"
STE_szczecin_charter_desc: "Podczas przełomowego posiedzenia Parlament Państwa Szczecińskiego oficjalnie ratyfikował pierwszą Konstytucję, ustanawiając prawne i moralne podstawy nowej republiki. Dokument gwarantuje prawa obywatelskie, określa zasady rządów tymczasowych i obiecuje wolne wybory po przywróceniu stabilności narodowej. Co szczególnie istotne, Konstytucja jasno wyraża ambicję kontynuowania państwowości polskiej, zachowując jej tradycje prawne i ducha demokracji. Pomimo niepewnej drogi przed nami dzisiejsze głosowanie przyjęto z ostrożną radością. Jak zauważył jeden z posłów: \"Nie chodzi tu wyłącznie o prawo - ten dokument nadaje kształt naszej nadziei\"."
STE_night_golden_gryphons: "Noc Złotych Gryfów"
STE_night_golden_gryphons_desc: "Szczecin nie może sobie pozwolić na recesję - to zdanie od kilku tygodni rozbrzmiewa na korytarzach władzy. Właśnie pod tym hasłem prezydent i premier Szczecina zwołali wczoraj wieczorem w ratuszu spotkanie z dyrektorami największych przedsiębiorstw oraz konglomeratów regionu, określanych łącznie jako \"Hanza\". Rozmowy miały zabezpieczyć gospodarkę wobec narastającej niepewności. Uzgodniono nowe ramy współpracy: miasto zapewni korzystne warunki działalności, uproszczone podatki i gwarancje zamówień publicznych. W zamian sektor prywatny zobowiązał się utrzymać zatrudnienie i w możliwie największym stopniu zapewnić stabilność rynku.\n\nChoć samego porozumienia jeszcze nie upubliczniono, jego skutki mają być odczuwalne natychmiast. Niektórzy już opisują układ jako formę korporacyjnego dyktatu narzuconego administracji. Przedstawiciele związków zawodowych nie skomentowali dotąd wydarzeń w ratuszu, zaś rzecznicy rządu odmówili przedstawienia szczegółów spotkania."
STE_invest: "Inwestować!"
STE_invest_desc: "Rząd Szczecina uruchomił nowy program wsparcia skierowany do wybranych prywatnych przedsiębiorstw i korporacji uznanych za kluczowe dla stabilności gospodarczej regionu. Polsteam otrzymał dotacje na modernizację floty holowników rzecznych oraz rozbudowę terminala portowego.\n\nTymczasem sieci handlowej Netto przyznano pakiet ulg podatkowych w zamian za zobowiązanie do \"przywrócenia bezpieczeństwa żywnościowego\" i utworzenia sieci regionalnych magazynów. Z programu skorzystało również kilka mniejszych prywatnych firm, przyczyniając się do tego, co urzędnicy określają jako wyraźną poprawę perspektyw gospodarczych Szczecina.\n\nPomimo rosnących kosztów programu - ponoszonych przede wszystkim przez miejscowych mieszkańców - rząd obiecał dalej go rozszerzać, wskazując na znaczenie silnej współpracy publiczno-prywatnej."
STE_echoes_of_the_past: "Echa przeszłości"
STE_echoes_of_the_past_desc: "Niepokojące wieści rozeszły się po okolicach Szczecina. Liga Wolnych Miast rozpoczęła oficjalną blokadę Odry w odpowiedzi na zabezpieczenie przez nasze siły prowincji Police. Wielu widzi w tym otwartą próbę destabilizacji i osłabienia naszego państwa. Piotr Krzystek zwołał nadzwyczajne posiedzenie, by szybko rozwiązać eskalującą sytuację. Prezydent zapewnił ludność, że nie ulegniemy żadnemu agresorowi, który mógłby zagrozić dobrobytowi obywateli. Okoliczności mogą wskazywać, że powinniśmy przygotować się na kolejny konflikt - miejmy nadzieję, że niekrwawy."
STE_business_is_business: "Wzdłuż S10"
STE_business_is_business_desc: "Wojna się rozpoczęła. Po wielu burzliwych debatach komitet nadzwyczajny nie miał wyboru. Liga Wolnych Miast odmówiła pojednania, co doprowadziło do oficjalnego wypowiedzenia jej wojny. \"Integralność i bezpieczeństwo naszego państwa nie mogą być zagrożone\" - oznajmił z przekonaniem prezydent Krzystek po ogłoszeniu decyzji komitetu. \"Nie ulega wątpliwości, że działali przeciwko Szczecinowi, wspierając naszych śmiertelnych wrogów i najeźdźców\" - dodał. Blokada jest bezprawna, a obywatele zgadzają się, że wojna jest nieunikniona, nie ma więc miejsca na słabość. Nadszedł czas pokazać siłę i potęgę Gryfa!"
STE_and_all_her_paths_are_peace: "Stały kurs"
STE_and_all_her_paths_are_peace_desc: "Zmierzyliśmy się z wieloma problemami. Powstania, wojny i niedobory wydają się dziś odległym wspomnieniem. Warunki życia znacznie się poprawiły i niemal przewyższają poziom sprzed Powstania Gryfa. Rząd Krzystka może z przekonaniem ogłosić wielki sukces. Nasz kraj wciąż stoi przed licznymi wyzwaniami, nim będziemy mogli zaznać spokojnego odpoczynku, lecz nadzieja na lepszą przyszłość pozostaje niezachwiana. Dzień Powstania będzie pamiętany na zawsze, a polegli za sprawę wolności nigdy nie przestaną być wysławiani. Prezydent Krzystek ogłosił ten dzień oficjalnym świętem. Jasna przyszłość znajduje się tuż przed nami, w zasięgu ręki. Będziemy walczyć dniem i nocą, by wypełnić dziedzictwo Gryfa i uczynić poprzedników dumnymi."
STE_uneasy_alliance: "Niespokojny sojusz"
STE_uneasy_alliance_desc: "Po ogłoszeniu niepodległości prezydent Krzystek proklamował utworzenie nowego rządu miasta. Aby sformalizować parlamentarne spektrum i zachować legitymizację, przedstawicieli dwóch głównych organizacji politycznych zaproszono do ratusza, gdzie określą strukturę nowej rady prezydenckiej. Nowy rząd Szczecina będzie składał się z równej liczby radnych reprezentujących dwie organizacje, które wykrystalizowały się podczas szczecińskiego powstania - postępową Unię Letnią oraz Partię Konserwatywno-Liberalną \"Zamek\" - zaś bezpartyjny prezydent Krzystek stanie na jego czele. Wiąże się wielkie nadzieje z tym, że niespokojny sojusz rozpięty w poprzek politycznego spektrum zdoła współpracować i poprowadzić Szczecin przez te niepewne czasy."

STE_clean_up_duty: "Praca do późnej nocy"
STE_clean_up_duty_desc: "W obliczu niezliczonych chorób wieku dziecięcego, które nękają reorganizację rządu, Piotr Krzystek postanowił powierzyć zaufanemu urzędnikowi stanowisko nadzorcy tego burzliwego procesu. Prezydent osobiście wyznaczył do trudnego zadania bliskiego współpracownika - Henryka Jerzyka, zahartowanego weterana szczecińskiej polityki. Nowo mianowany Nadzorca rozpoczął nabór wyspecjalizowanych doradców do gabinetu, przygotowując się do opanowania chaosu pozostawionego przez niemiecki exodus. Jego priorytetami będą współpraca z trójką korporacji - Hanzą - oraz przekształcenie sił powstańczych w pełnoprawną formację zbrojną zdolną zwalczać przestępczość i zabezpieczyć świeżo wyzwolone miasto."
STE_pasztecik_and_barszcz: "Pasztecik dla mas"
STE_pasztecik_and_barszcz_desc: "Zgodnie z dzisiejszym oficjalnym komunikatem rządu, ogłoszonym w gmachu Urzędu Wojewódzkiego, od jutra każdy obywatel pozbawiony wystarczającego dostępu do podstawowych produktów spożywczych będzie uprawniony do jednego bezpłatnego posiłku, wydawanego w wyznaczonych punktach utworzonych przez wojsko w całym mieście.\n\nProgram zostanie oparty na towarach i materiałach zarekwirowanych z miejskich restauracji oraz sklepów, a także hojnym wsparciu Gildii Hanzeatyckiej.\n\nPonieważ racjonowanie nadal obowiązuje, niektórzy mogą wyrażać niezadowolenie z tego naruszenia własności prywatnej i nazywać je zbędnym. Rząd pragnie jednak przypomnieć mieszkańcom Szczecina o dramatycznej sytuacji, w której wszyscy się znajdujemy, oraz wzywa ich, by zachowali spokój i robili swoje. Jak ujął to rzecznik rządu tymczasowego: \"Płomienie rozpalone przez naszą rewolucję niemal już wygasły - wszyscy musimy wytrzymać jeszcze tylko trochę\"."
STE_the_three_united: "Zjednoczona Trójka"
STE_the_three_united_desc: "Powrót Chemiewerke do Gildii Hanzeatyckiej wprawił wszystkich w osłupienie. Nikt nie przypuszczał, że ta zdradziecka korporacja ponownie znajdzie się u władzy. Gdy zaczęła terroryzować prezydenta Krzystka i rząd Szczecina groźbami zniszczenia zakładów chemicznych w Policach, nie mieli oni innego wyboru, jak tylko przyjąć wygórowane żądania. Choć Chemiewerke formalnie ponownie włączono do sieci korporacyjnej, pozostaje autonomiczne i silnie ufortyfikowane. Dobra wiadomość jest taka, że północna flanka została wreszcie zabezpieczona, a ziemie dawnego Freie Stadt Stettin formalnie zjednoczone."
STE_niebko_terror: "Niebko Terror"
STE_niebko_terror_desc: "Napięcia eksplodowały w północnych dzielnicach Szczecina, skłaniając władze do natychmiastowego wprowadzenia godziny policyjnej na Niebuszewie, Stołczynie, Skolwinie, Drzetowie, Pomorzanach i Podjuchach. Rozmieszczono uzbrojone patrole, a mieszkańcy przebywający poza domami po zmroku muszą liczyć się z zatrzymaniem oraz przeszukaniem, przy czym do aresztowania wystarcza samo podejrzenie. Powód? Wzrost liczby brutalnych incydentów i powrót niesławnego już hasła \"Niebko Terror\", wymalowanego sprejem na jednym z głównych mostów. Zwrot, uznawany za dzieło miejscowych ultrasów, stał się symbolem chaotycznego buntu i miejskiego strachu. Jeden z funkcjonariuszy powiedział nieoficjalnie i bez ogródek: \"Bandyci? W moim Szczecinie? Nie ma mowy\". Miasto szykuje się na długą noc."
STE_in_the_army_now: "Idziemy w rekruty"
STE_in_the_army_now_desc: "Rząd Tymczasowy Szczecina ogłosił oficjalne przekształcenie partyzanckich oddziałów Gryfa w regularną armię. Nowo utworzone Prezydenckie Siły Zbrojne będą główną instytucją wojskową narodu, odpowiedzialną za obronę granic i utrzymanie porządku wewnętrznego.\n\nKampania rekrutacyjna rozpoczęta na początku tygodnia obejmuje liczne zachęty: stabilne i konkurencyjne wynagrodzenie, stałe oraz dobrze wyposażone zakwaterowanie, podwójne racje żywnościowe w każdy czwartek, a także pełny dostęp do świadczeń socjalnych i opieki medycznej na najwyższym dostępnym w kraju poziomie.\n\nWeterani walki o niepodległość, szczególnie ci, którzy odegrali kluczową rolę w wyzwoleniu Szczecina, zostaną włączeni do korpusu oficerskiego i staną się awangardą nowej struktury wojskowej. Oficjalną przysięgę pierwszych jednostek zaplanowano na tę niedzielę na Wałach Chrobrego, w obecności prezydenta oraz członków Rady."

##regio-war tree##
STE_storm_brewing: "Nadciąga burza"
STE_storm_brewing_desc: "Lud Pomorza Zachodniego rozpacza nad swoim przeklętym losem, ponieważ po raz kolejny widmo wojny majaczy na horyzoncie. Naszym świętym obowiązkiem jest go ochronić. W nadchodzących miesiącach świeżo utworzony naród stanie przed przełomową chwilą, która określi jego historyczne znaczenie. Spracowanymi, pokrytymi odciskami dłońmi i sprowadzoną z zagranicy bronią przechylimy szalę, rozstrzygając, czy zostaniemy zapamiętani jako zwycięscy zjednoczyciele, czy na zawsze znikniemy w zapomnianych dziejach. Musimy działać już teraz, gdyż stawką jest nasze dziedzictwo. Długo wyczekiwane wyzwolenie będzie miało straszliwą cenę. Módlmy się, aby wszyscy nasi chłopcy wrócili do domu cali i zdrowi.\n\nNadszedł wreszcie czas wyzwolić Pomorze Zachodnie."
STE_all_aboard: "Wszyscy na pokład!"
STE_all_aboard_desc: "Po starannym rozważeniu dostępnych możliwości megakorporacje Hanzy otwarcie zadeklarowały wsparcie dla wysiłku wojennego Szczecina. Ich olbrzymie zasoby, dotąd strzeżone i trzymane poza naszym zasięgiem, płyną teraz swobodnie w nasze ręce. Fabryki budzą się do życia z rykiem, produkując broń i maszyny na wojnę, a skarbiec pęcznieje od środków mających napędzać naszą sprawę. W tym niespokojnym sojuszu potęgi i ambicji korporacje widzą własną przyszłość splecioną z naszą. Gdy sztandary przemysłu i wojny łączą się ze sobą, los narodów zawisa na włosku.\n\nDo broni, obywatele!\n\nZjednoczmy się i wyzwólmy rodaków spod ucisku!"
STE_gate_to_the_sea: "Brama na morze"
STE_gate_to_the_sea_desc: "Świnoujście jest ostatnią barierą między Szczecinem a otwartym dostępem do Morza Bałtyckiego - twierdzą strzegącą bramy, której rozpaczliwie potrzebujemy. Jego porty, pełne okrętów i stali, zagradzają nam drogę, a dopóki miasto trwa, nasza droga ku dominacji pozostaje spętana. Aby zabezpieczyć przyszłość, musimy uderzyć. Wiatry wojny wzywają nas do działania i z całą potęgą armii runiemy na miasto. Stal zetrze się z kamieniem, a krew zmiesza ze słoną wodą Odry, lecz gdy opadnie pył, Świnoujście będzie nasze. Bałtyk musi należeć do nas."
STE_full_polsteam_ahead: "Żegluga morska pod Polskim nadzorem"
STE_full_polsteam_ahead_desc: "Po naszym zwycięstwie prawdziwa praca dopiero się rozpoczyna. Port w Świnoujściu, życiodajna arteria handlu zagranicznego, musi znaleźć się pod bezpośrednią kontrolą PŻM. Te ważne bramy wymagają uwagi ludzi wykwalifikowanych i doświadczonych. Z wdzięczności nasza megakorporacja odbuduje te ziemie, przemieniając je w silniki dobrobytu dla ludu. Mając porty pod swoim dowództwem, otworzymy nowe kanały prowadzące ku światu, którymi sprowadzimy towary potrzebne do napędzania wojny i odbudowy ziem. Morze przestanie być barierą i stanie się mostem ku bogactwom czekającym poza horyzontem."
STE_horned_devils: "Rogate diabły"
STE_horned_devils_desc: "Wikingowie Zandberga bezczeszczą nasze północne ziemie nieustannymi najazdami i grabieżą, pozostawiając za sobą jedynie popiół oraz rozpacz. Te plagi mórz, ci łupieżczy poganie zbyt długo już upuszczali krew naszemu ludowi. Ich długie łodzie zaciemniają wybrzeże, topory zbierają żniwo, a bogowie szydzą z naszej determinacji. Nie będziemy dłużej znosić bluźnierczych wtargnięć. Nadszedł czas odpowiedzieć ciosem, wyprzeć ich z naszych ziem i rozbić pogańskie twierdze. Bronią i ogniem zakończymy ich rządy terroru oraz oczyścimy północ z bezbożnej obecności. Dla barbarzyńskiej skandynawskiej plagi wybiła godzina rozrachunku."
STE_danegeld: "Danegeld"
STE_danegeld_desc: "W głębi ich zrabowanych sal odkryliśmy skarb ponad wszelką miarę: stosy Danegeldu, przeklętej daniny płaconej niegdyś łupieżcom Zandberga. Bogactwo wyrwane z rąk tchórzy i ciemiężycieli znajduje się teraz w naszym zasięgu. Monety wybite z pracy uciśnionych, klejnoty skradzione zdesperowanym - ten skarb opowiada historię cierpienia i uległości całego narodu. Lecz już nigdy więcej. Bogactwo, dawniej postrzegane jako oznaka poddania się presji społeczeństwa, przemieniło się w potężną broń buntu, pozwalającą nam rzucać wyzwanie niesprawiedliwości i potwierdzać własną niezależność."
STE_fate_of_reds: "Los Czerwonych"
STE_fate_of_reds_desc: "Po wyzwoleniu północno-zachodniej części województwa zachodniopomorskiego nasze miasto-państwo stanęło przed poważnym problemem rozmaitych lewicowych środowisk na podbitym terytorium. W rządzie Krzystka rozgorzała zażarta debata nad tym, czy powinniśmy podjąć z nimi współpracę, czy osądzić je za zdradę rodaków. Mogą być zbyt radykalni nawet dla Unii Letniej, lecz zarazem wnieśliby świeże spojrzenie do polityki partyjnej. Gildia Hanzeatycka stanowczo sprzeciwiłaby się także ponownemu dopuszczeniu ich do życia politycznego. Wszystko sprowadza się do kluczowego pytania: co powinniśmy z nimi zrobić?"
STE_antichrist: "Siły pokojowe"
STE_antichrist_desc: "Po upadku Eurokomisariatów misja pokojowa ONZ pod dowództwem jednostki NORDBAT zabezpieczyła Darłowo oraz jego okolice. Świat patrzył ze zdumieniem, gdy Organizacja Narodów Zjednoczonych, często krytykowana za bezczynność, wreszcie uczyniła znaczący krok i interweniowała na polskim pustkowiu. Piotr Krzystek i jego rząd stanęli przed wielkim wyzwaniem przeprowadzenia negocjacji z NORDBAT-em. W końcu są to żołnierze sił międzynarodowych, dlatego otwarty konflikt nie byłby najmądrzejszym posunięciem. Powszechnie zgadzamy się, że jeśli istnieje szansa na pokój, powinniśmy po nią sięgnąć."
STE_un_equipment: "Wszechobecny błękit hełmów"
STE_un_equipment_desc: "Kiedy nasze siły wkroczyły do Darłowa, oszołomiła je ilość cennego wyposażenia porzuconego przez NORDBAT. Samo zajęcie miasta przebiegło właściwie bez rozlewu krwi. Gdy nasi chłopcy odnaleźli nowoczesną broń palną, pojazdy i uzbrojenie przeciwpancerne, wiedzieli, że znacznie zwiększy ono możliwości armii. To olbrzymi sukces szczecińskiego wojska, przybliżający nas do marzenia o zjednoczeniu województwa pod naszym sztandarem. Port w Darłowie przyniesie też korzyści handlowi zagranicznemu i rybołówstwu. To niewielkie zwycięstwo, lecz z pewnością warte świętowania!"
STE_yankees: "Jankesi"
STE_yankees_desc: "Max Kolonko i jego amerykańscy towarzysze stanowią poważne zagrożenie dla naszego państwa. Propagując amerykański styl życia na Pomorzu Zachodnim, występują przeciwko naszym wartościom. Nie możemy pozwolić im rozciągnąć swoich ideałów na całe województwo, a polubowne rozwiązanie nie wchodzi w grę. Jeśli sądzą, że mogą nas wykorzystać, bardzo się mylą. Nadszedł czas zakończyć to szaleństwo i wyzwolić mieszkańców Koszalina spod wypaczonego, niemoralnego systemu. Zagraniczny agent Kolonko powinien drżeć, gdyż nadchodzi sąd za jego wiarołomstwo i zdradę."
STE_disaster_in_koszalin: "Koszalin płonie"
STE_disaster_in_koszalin_desc: "Nikt nie mógł przewidzieć, jak bardzo Koszalin ucierpi podczas naszego chwalebnego wyzwolenia. Walki na obrzeżach szybko przerodziły się w olbrzymią rzeź. Ludzie padali jeden za drugim, a obie strony w błyskawicznym tempie utraciły kontrolę nad sytuacją. Początek pożaru, zbiegający się w czasie z wkroczeniem szczecińskich oddziałów do miasta, pozostaje przedmiotem spekulacji. Krzyki płonących ludzi słychać było z wielu kilometrów, podobnie jak z daleka widziano kolumny dymu. Obie strony zaprzeczają odpowiedzialności, zaś Kolonko otwarcie nazwał pożar bezpośrednim atakiem na ich amerykanizm. Niezależnie od sprawcy miasto straszliwie ucierpiało. Świadkowie stali w przerażającej ciszy, miasto płonęło, a niebiosa czerwieniały od pożogi."
STE_international_ranks: "Dziedzictwo Pomorza"
STE_international_ranks_desc: "Dawno temu potężna dynastia Gryfitów z boskiego nadania władała pięknymi ziemiami Pomorza. Jej silna władza przyniosła dalszy rozwój bogatej i żyznej ziemi nadmorskiego województwa. Wszystko jednak kiedyś dobiega końca - podobnie stało się z niegdyś potężnymi rządami na Pomorzu. Gryfici pozostawili po sobie nie tylko wielkie dziedzictwo, lecz również dumnych i wytrzymałych potomków. Zapierające dech zamki książąt pomorskich rozsiane po całym regionie są świadectwem potencjału naszego kraju. Przyszłość leży w rękach ludu i wspólnie możemy uczynić przodków dumnymi!"
STE_lizardmen: "Jaszczuroludzie"
STE_lizardmen_desc: "Szaleniec, zdrajca i miłośnik rosyjskiego buta - Wojciech Olszański, znany powszechnie jako Aleksander Jabłonowski vel Jaszczur - jest najczystszym przykładem wiarołomstwa oraz zdrady narodu polskiego. Jego skrajnie radykalna nacjonalistyczna retoryka przyniosła ból i cierpienie wielu mieszkańcom Drawska. Z każdym dniem rośnie liczba ofiar śmiertelnego marszu pod rządami Jaszczura. Musimy postawić go przed sądem, gdyż nic nie może odkupić jego potwornych czynów. Nadszedł czas raz na zawsze wykopać rosyjskie wpływy z naszego województwa. Jeśli go obalimy, marzenie o zjednoczonym Pomorzu znajdzie się znacznie bliżej, niż przypuszczaliśmy."
STE_manhunt: "Polowanie na ludzi"
STE_manhunt_desc: "Każdy, kto posiada informacje o miejscu pobytu Donalda Tuska albo Wojciecha Olszańskiego, otrzyma znaczną nagrodę. Zdrajcy postanowili uciec i ukryć się, zamiast stanąć przed wymiarem sprawiedliwości. Nie lękajcie się jednak, obywatele! Znajdziemy ich choćby w najgłębszych zakamarkach piekła. Lata upokorzeń i bezprawia dobiegły końca. Piotr Krzystek i jego rząd zagwarantują sprawiedliwy proces każdemu, kto postanowił walczyć przeciwko wolności i demokracji! Nadszedł czas ich wytropić i przynieść Pomorzu Zachodniemu dobrobyt. Życzymy owocnych łowów, drodzy szczecinianie!"
STE_nothing_personal: "Nic osobistego"
STE_nothing_personal_desc: "Nie ma człowieka mniej godnego odkupienia niż Donald Tusk. Człowiek, który sprzedał nasz piękny kraj tym przeklętym niemieckim barbarzyńcom, pozostawał bezkarny i rządził Pomorzem w imieniu najeźdźców. Ślepy na ucisk ze strony okupantów, sądził, że zdoła umknąć sprawiedliwości. Mylił się jednak śmiertelnie. Porzucony przez dawnych sojuszników i samotny na pustkowiu, tak jak ongiś pozostawił naszego prezydenta Piotra Krzystka, drży ze strachu. Bębny wojny biją, a dzień sądu jest bliższy niż kiedykolwiek.\n\n§RPolska zostanie pomszczona.§!"
STE_thirst_for_power: "Pragnienie władzy"
STE_thirst_for_power_desc: "Kiedy Judasz Donald Tusk odszedł, nasz kraj mógł wreszcie odetchnąć z ulgą. Nie tylko wyeliminowaliśmy godnego przeciwnika, lecz również zabezpieczyliśmy Elektrownię Dolna Odra. Rząd Szczecina zawarł porozumienie z Gildią Hanzeatycką, na mocy którego zarząd nad elektrownią zostanie przekazany Chemiewerke. To przełomowe wydarzenie dla rosnącego kraju, gdyż od tej chwili nasze bezpieczeństwo energetyczne nie zależy od żadnego obcego państwa. \"Niedobory dobiegły końca\" - ogłosił Krzystek. - \"Nasi obywatele mogą spać spokojnie, nie martwiąc się o prąd w swoich domach\"."
STE_godforsaken_drawsko: "Zapomniane przez Boga lasy Drawska"
STE_godforsaken_drawsko_desc: "Kancelaria prezydenta wydała ogólnokrajowe ostrzeżenie zabraniające obywatelom wstępu do lasów w pobliżu niedawno wyzwolonego Drawska. Spekuluje się, że przyczyną mogą być niedobitki reżimu Olszańskiego, które polują na niewinnych ludzi i wszelkimi sposobami próbują zakłócić działanie nowego rządu. Stanowią wielkie zagrożenie dla każdego, kto rozważa wejście do lasów regionu. Renegaci są niebezpieczni i uzbrojeni; bez wahania zastrzelą każdego, kto stanie im na drodze. Jeśli cenicie własne życie, mieszkańcy Drawska, zostańcie w domach!"
STE_cut_for_guild: "Działka dla Gildii"
STE_cut_for_guild_desc: "Województwo zostało zjednoczone, lecz Gildia nadal stanowi potężną siłę, której nie wolno ignorować. Bez względu na to, co o niej sądzimy, jej wkład w nasze zwycięstwo był ogromny. Dzięki lojalności i zasobom Gildii zdołaliśmy zjednoczyć Pomorze Zachodnie pod sztandarem Gryfa. Choć układ może być Krzystkowi nie w smak, nie mamy innego wyboru, jak tylko przyznać im pewne przysługi. Przymkniemy oko na część ich działań, co może pozwolić im zdobyć nieco wpływów w kraju. Muszą jednak zrozumieć, że nie są to przyjazne stosunki. Pewnego dnia odpowiedzą za swoje zbrodnie."
STE_duke_address: "Wykuci w ogniu"
STE_duke_address_desc: "Wojna dobiegła końca. Ludzie wyszli na ulice, matki witały synów-żołnierzy, a rodziny opłakiwały poległych. Wbrew wszystkiemu on naprawdę tego dokonał. Wyzwolił lud Pomorza Zachodniego i przywrócił prawowitość oraz prawo ziemiom szczecińskim. Piotr Krzystek jest bezsprzecznie bohaterem. Ludzie będą świętować jego imię przez wiele dni, tygodni i miesięcy. Nie zawsze jednak tak było. Krzystek przeszedł drogę od partyzanta bez jasnej wizji poprawy sytuacji do groźnego kandydata na zjednoczyciela kraju. Jego niezachwiana determinacja popchnęła region ku jaśniejszej przyszłości.\n\nOsiągnęliśmy wiele, lecz jeszcze więcej pozostało do zrobienia.\nByć może pewnego dnia cały kraj będzie wolny pod rządami Krzystka.\n\nZa Szczecin! Za Polskę!"

#hanza industy
STE_captains_of_industry: "Kapitanowie przemysłu"
STE_captains_of_industry_desc: "Gildia Hanzeatycka bywa trudnym partnerem, ale pozostaje nieocenionym zasobem. Zawarliśmy porozumienie gwarantujące jej większość przetargów - znaczący krok ku wspólnemu dobrobytowi. Dalsze sukcesy zależą od pielęgnowania silnych i opartych na współpracy stosunków między rządem a Gildią. Dlatego kluczowe jest, aby obie strony zachowały zgodność i satysfakcję.\n\nDopóki utrzymamy równowagę, partnerstwo będzie przynosić znaczne korzyści nie tylko nam, lecz także obywatelom. Musimy jednak zachować czujność. Korporacje z pewnością spróbują rozszerzyć wpływy w państwie i nie możemy pozwolić, by zagroziło to integralności naszych instytucji."
STE_the_danish_lapdogs: "Duńskie pieski"
STE_the_danish_lapdogs_desc: "Netto Polska od dawna słynie z aktywnego udziału w rozmaitych inwestycjach w całym kraju. Przed niemiecką interwencją było jednym z najbardziej rozpoznawalnych przedsiębiorstw w Polsce. Szczególną rolę odgrywało w naszym województwie, realizując projekty takie jak Netto Arena.\n\nNiektórzy mogą uważać, że firmą kieruje wyłącznie pogoń za zyskiem, lecz trzeba przyznać, że pozostaje cennym zasobem. Chcemy wspierać wzajemną współpracę, aby pomogła wywołać pozytywne zmiany i poprawić sytuację naszego kraju.\n\nPrzyszłość czeka!"
STE_masters_of_consumerism: "Mistrzowie konsumpcjonizmu"
STE_masters_of_consumerism_desc: "Która firma nadawałaby się do tego zadania lepiej niż Netto? Jako mistrzowie angażowania konsumentów dogłębnie rozumieją potrzeby ogółu ludności. Wieloletnia obecność na polskim rynku zapewniła im bezcenną wiedzę o zwyczajach i upodobaniach przeciętnego polskiego konsumenta. Co więcej, wyrazili zdecydowaną gotowość do współpracy.\n\nIch udział obiecuje wielkie korzyści zarówno dla gospodarki, jak i dobrostanu obywateli; w końcu spełniony obywatel to szczęśliwy obywatel.\n\nMusimy jednak postępować ostrożnie. Rosnące wpływy Netto w kraju są niezaprzeczalne. Choć ich partnerstwo może przynosić korzyści obecnie, w przyszłości stanie się być może zagrożeniem dla naszej władzy."
STE_taste_of_the_west: "Posmak Zachodu"
STE_taste_of_the_west_desc: "Upadek Polski nie tylko rozbił naród, lecz również opróżnił sklepowe półki. Obywatele głęboko tęsknili za obfitością i różnorodnością, którymi zaczęli cieszyć się po upadku komunizmu w latach 90. Przez wiele lat sytuacja przypominała niedobory z czasów sowieckich. Dzięki znacznemu wsparciu Netto rzeczywistość ma się jednak zmienić.\n\nNa horyzoncie pojawia się powrót smakowitej hiszpańskiej szynki, osobliwego włoskiego makaronu i intensywnie pachnących francuskich serów. Wkrótce półki ponownie się zapełnią, a klienci wrócą tłumnie, zapewniając gospodarce znaczny impuls."
STE_exotic_paprykarz_flavours: "Egzotyczne smaki paprykarza"
STE_exotic_paprykarz_flavours_desc: "Paprykarz szczeciński to lokalna zachodniopomorska pasta z ryby, ryżu i koncentratu pomidorowego, doprawiona solą oraz przyprawami. Jest tani, łatwy w produkcji i od lat stanowi miejscowy produkt o długim okresie przydatności - szczególnie po Upadku. Najwyższy czas przełamać monotonię. Netto przejmie zakłady produkujące paprykarz w całym regionie i podrasuje danie dla współczesnego konsumenta. Paprykarz w pierogach? Tak! Paprykarz w paszteciku? Oczywiście! Paprykarz z kiełbasą, paprykarz z frytkami, dip paprykarzowy do chipsów tortilla? A czemu, kurwa, nie? I tak to kupią."
STE_the_amphibian_menace: "Płazie zagrożenie"
STE_the_amphibian_menace_desc: "Żabka nadal stanowi poważne zagrożenie dla naszych sklepów. Nie tylko ma wyższe ceny - obecność niemal na każdym rogu czyni ją dominującą siłą, a na to nie możemy pozwolić. Wywrzemy nacisk na rząd, by wydał dekret o całkowitym przejęciu sklepów Żabki. Stanowią zagrożenie nie tylko dla Netto, lecz dla każdego małego przedsiębiorstwa w regionie. Wkrótce Żabka odejdzie do przeszłości. Markety Netto staną się wszechobecne, a żaden inny sklep nie będzie w stanie zagrozić naszej dominacji na rynku."
STE_aggressive_competitive_pricing: "Agresywne ceny konkurencyjne"
STE_aggressive_competitive_pricing_desc: "Żabki mogły zniknąć, lecz inne markety nadal odciągają od nas klientów. Nadszedł czas to zmienić za pomocą prostej, ale potężnej strategii. Znacznie obniżymy ceny, czyniąc zakupy gdziekolwiek poza Netto ekonomicznie nieopłacalnymi. Początkowo może wydawać się to ryzykowne, lecz długoterminowe korzyści będą niezaprzeczalne. Odzyskamy udział w rynku i umocnimy pozycję czołowego sprzedawcy detalicznego. Kogo obchodzi Urząd Ochrony Konkurencji i Konsumentów? Wkrótce nic nie stanie nam na drodze, a dominacja w całym kraju będzie absolutna."
STE_pomeranian_private_labels: "Pomorskie marki własne"
STE_pomeranian_private_labels_desc: "Aby potwierdzić dominację i rozszerzyć wpływy na cały kraj, musimy zakończyć import zagranicznych dóbr konsumpcyjnych. Prywatne sektory obcych mocarstw działają wyłącznie we własnym interesie i wykorzystują handel oraz umowy dla własnych korzyści. Dlaczego więc nie mielibyśmy produkować wszystkiego sami? Stworzymy własne marki i z dumą wystawimy je na półkach Netto. Konsumenci wybiorą mleko Netto, cukier Netto i wiele innych produktów - wszystkie opatrzone patriotycznymi znakami. Wysiłek nie pozostanie bez nagrody. Z czasem nasze zyski podwoją się, a nawet potroją, gdy wzmocnimy pozycję na rynku całego kraju."
STE_danish_week_in_pomerania: "Duński tydzień na Pomorzu"
STE_danish_week_in_pomerania_desc: "Stało się - wygraliśmy.\nBiedronka tuż za rogiem? Teraz to Netto.\nZalew Żabek wyrastających przy każdej ulicy? Netto.\nAuchan po drugiej stronie ulicy? Zmieniony szyld. Netto.\nLewiatan pod blokiem? Błąd - to Netto.\nOd tej chwili nikt nie może zaprzeczyć naszej całkowitej dominacji na rynku. Zyski rozbiły w pył każdą prognozę, nawet te przygotowane przez tak zwanych \"niezależnych\" ekspertów. Netto wyrosło na jednego z najbardziej wpływowych graczy Państwa Szczecińskiego. Nic nie stanie nam na drodze, gdy będziemy kształtować rząd tak, by służył naszym potrzebom. Żyjemy w raju własnego autorstwa - i bez wątpienia nadszedł czas świętować!"
STE_the_german_ball_and_chain: "Niemiecka kula u nogi"
STE_the_german_ball_and_chain_desc: "Zbrodnie Chemiewerke Politz AG nie zostaną zapomniane. Na zawsze zapamiętamy ich wiarołomstwo i zdradę narodu polskiego. Ludzie już zawsze będą widzieć w nich niemieckich kolaborantów i szpiegów. Pomimo tego nadal należą do Gildii Hanzeatyckiej.\n\nChoć wiele nas dzieli, musimy współpracować, aby przywrócić narodowi dobrobyt. Musimy przezwyciężyć podziały, gdyż odrodzenie kraju wymaga jedności. Jeżeli chcemy go unowocześnić i ulepszyć, współpraca jest konieczna.\n\nMusimy zadbać, by dawne przewinienia nie zostały ani zignorowane, ani powtórzone, a każde partnerstwo służyło przede wszystkim narodowi polskiemu."
STE_fertilizer_giant: "Nawozowy gigant"
STE_fertilizer_giant_desc: "Zarówno przed interwencją w regionie Polic, jak i po niej tamtejsze zakłady chemiczne były największymi i najważniejszymi producentami sztucznych nawozów w Polsce. Mając Chemiewerke za partnera, dysponujemy kluczowym zasobem. Musimy mądrze wykorzystać możliwości, aby wyprodukować dość żywności dla każdego mieszkańca województwa pomorskiego. To pierwszy krok ku stworzeniu bezpiecznego, zamożnego kraju służącego każdemu obywatelowi. Ludzie pragną, abyśmy przywrócili dobre dawne czasy sprzed Upadku - zadbamy, by stało się to już wkrótce."
STE_fertile_lands_of_pomerania: "Żyzne ziemie Pomorza"
STE_fertile_lands_of_pomerania_desc: "Ziemie Pomorza Zachodniego są żyzne i obfite; czekają tylko na odrobinę troski. Każdy ugór, zaniedbane pole i skrawek nieużytku zostaną odzyskane, by pomóc wyżywić każdego obywatela narodu. Dzięki właściwemu stosowaniu nawozów i starannie odmierzonym dawkom odpowiednich środków chemicznych nasze pastwiska przemienią się w kwitnące, wydajne pola uprawne. Wkrótce głód i niedobory żywności będą jedynie odległym wspomnieniem. Koniec z kolejkami po chleb. Koniec z racjonowaniem. Wspólnie zbudujemy jaśniejszą przyszłość - dla nas samych i przyszłych pokoleń. Pobrudźmy sobie ręce i razem ruszajmy do pracy na roli!"
STE_technopark_pomerania: "Technopark Pomerania"
STE_technopark_pomerania_desc: "Upadek Polski pozostawił głębokie ślady w społeczeństwie - w tym zastój postępu technicznego i dotkliwy niedobór możliwości przemysłowych. Nadszedł czas to zmienić. Musimy niestrudzenie pracować nad położeniem fundamentów. Innowacja jest przyszłością. Dzięki nieustannym badaniom i ciężkiej pracy wciąż mamy szansę dogonić sąsiadów pod względem technicznym.\n\nMusimy jednak zachować ostrożność. Pycha już raz doprowadziła nas do upadku i nie możemy pozwolić, by stało się tak ponownie. Teraz, pod nowym przywództwem, zapewnimy krajowi rozkwit - wszelkimi koniecznymi środkami."
STE_questionable_additives: "Wątpliwe dodatki"
STE_questionable_additives_desc: "Próbowaliśmy - naprawdę próbowaliśmy. Nasze wysiłki mające ożywić ziemię łagodnymi środkami chemicznymi i naturalnymi nawozami okazały się jednak niewystarczające. Obietnica bogatej, żyznej gleby była jedynie słodko-gorzkim złudzeniem. Zbiory nie wystarczają, a ziemia nie jest tak hojna, jak sądzi opinia publiczna.\n\nNadszedł czas śmiałych decyzji - takich, które zagwarantują Republice stabilność i dobrobyt. Pora poluzować zbędne przepisy. Nasze pola muszą wydawać więcej plonów, z odrobinę większą pomocą.\n\nW końcu co najgorszego może się wydarzyć?\n\n§RNic szczególnie poważnego... prawda?"
STE_chemiewerke_politz_ag_kraftstoffe: "Hydrierwerke Pölitz"
STE_chemiewerke_politz_ag_kraftstoffe_desc: "Kolejnym palącym problemem jest niedobór benzyny - bez niej armia nie może skutecznie działać. Dlatego od tej chwili priorytetem Chemiewerke będzie utworzenie spółki zależnej produkującej paliwo syntetyczne. Musimy wiele zrobić, aby udoskonalić i zwiększyć produkcję cennej benzyny. Najpierw zbudujemy w Policach prawdziwą rafinerię, pierwszą w całym województwie. Bezpieczny i stały dostęp armii do tego płynu jest naszym najważniejszym celem. Ułatwienie dostępu zwykłej ludności zmniejszyłoby też niezadowolenie z rządu, co pomogłoby nam zdobyć większe wpływy w państwie szczecińskim."
STE_repair_the_swinoujscie_gasport: "Odbudowa gazoportu w Świnoujściu"
STE_repair_the_swinoujscie_gasport_desc: "Prawo i Sprawiedliwość - partia rządząca Polską przed jej upadkiem - dopuściła się licznych zdrad. Pranie pieniędzy i fałszowanie wyborów były jedynie wierzchołkiem góry lodowej. Pośród wszystkich szkód istnieje jednak jedna rzecz, którą zrobili właściwie: infrastruktura.\n\nTerminal LNG w Świnoujściu jest wyjątkowym zasobem nie tylko w Polsce, ale w całej Europie. Kilka napraw i strategicznych ulepszeń może uczynić z niego kamień węgielny jaśniejszej przyszłości, w której niedobory energii należą do przeszłości. To klucz do naszej niezależności energetycznej i bezpieczeństwa narodowego. Pomorze czeka!"
STE_oil_fields_of_the_north: "Pola naftowe Północy"
STE_oil_fields_of_the_north_desc: "Polska nie jest zwykle pierwszym krajem przychodzącym na myśl, gdy mowa o wydobyciu ropy. Większość ziem pozostaje sucha i uboga w naturalne złoża. Pomorskie wybrzeże jest jednak rzadkim wyjątkiem, bogatym w niewykorzystaną ropę. Im szybciej rozpoczniemy wydobycie, tym lepiej. Choć takie operacje często uchodzą za nieopłacalne, nasz przypadek jest inny. Potencjalne korzyści niewątpliwie przewyższają koszty. Dodatkowy dochód wpływający do budżetu państwa wykorzystamy, aby znacznie zwiększyć wydatki publiczne i inwestować w przyszłość kraju."
STE_what_happens_in_police_stays_in_police: "Co wydarzyło się w Policach, zostaje w Policach"
STE_what_happens_in_police_stays_in_police_desc: "Czy nam się to podoba, czy nie, Chemiewerke jest największym i najbardziej zaawansowanym technicznie przedsiębiorstwem przemysłowym w kraju. Odkąd zgodziliśmy się na pokój i pozwoliliśmy mu wrócić do Gildii Hanzeatyckiej, Police faktycznie stały się jego twierdzą, w której działa niemal bez nadzoru - i raczej się to nie zmieni.\n\nRząd dostrzega sposobność i wspiera wysiłki zmierzające do przemienienia miasta w czołowy ośrodek techniczny oraz przemysłowy regionu, a być może nawet całej Polski. Nie ma wątpliwości, że taki krok przyniesie znaczne korzyści zarówno narodowi, jak i przedsiębiorstwu."
STE_new_horizons_of_chemistry: "Nowa era chemii"
STE_new_horizons_of_chemistry_desc: "Świat zmienia się błyskawicznie - my również musimy. W tej nowej epoce zdolność przystosowania i wiedza są naszymi największymi zasobami. Dlatego najtęższe umysły naszego ludu poświęcą się odtąd całkowicie badaniom oraz innowacjom. Ich praca ma przynieść przełomy, które znacząco poprawią codzienne życie obywateli, od nowoczesnej infrastruktury po wolność energetyczną. Osiągnięcie pełnej niezależności przemysłowej od sąsiadów będzie stopniową i wymagającą podróżą, lecz musimy ją odbyć. Samowystarczalny naród jest silnym narodem, a każdy krok naprzód przybliża nas do wiecznego dobrobytu."
STE_the_polish_remnants: "Polskie pozostałości"
STE_the_polish_remnants_desc: "Polsteam pozostaje jedynym przedsiębiorstwem Gildii Hanzeatyckiej znajdującym się w całości w polskich rękach. Dawne przedsiębiorstwo państwowe zostało sprywatyzowane po interwencji Eurokommissariatu Westpolen, a następnie włączone do sektora stoczniowego. W przeciwieństwie do wielu odpowiedników Polsteam mniej skupia się na maksymalizacji zysku, a bardziej na wzmacnianiu gospodarki narodowej. Ma dla Szczecina olbrzymią wartość - jest nie tylko zasobem strategicznym, lecz dzięki silnym związkom ze związkami zawodowymi współpraca z nim przebiega znacznie sprawniej, niż oczekiwano. A w ostatecznym rozrachunku potrzebujemy właśnie gładkiej współpracy. Kto wie - może z czasem Polsteam wyrośnie na siłę równoważącą dominację innych przedsiębiorstw Hanzy?"
STE_rusty_but_trusty: "Stara, ale jara"
STE_rusty_but_trusty_desc: "Polsteam widział lepsze czasy. Połączenie z innymi przedsiębiorstwami stoczniowymi nie wystarczyło, by odwrócić jego upadek. Znaczna część wyposażenia pozostaje przestarzała, a płace robotników wciąż są dalekie od ideału. Konsolidacja umożliwiła jednak podejmowanie większych i bardziej złożonych projektów. Pomimo wyzwań Polsteam nadal pozostaje najbardziej wpływowym polskim przedsiębiorstwem w żegludze morskiej, podobnie jak przed Upadkiem. Posiadanie jednej z nielicznych działających stoczni w Polsce daje mu kluczową przewagę strategiczną. Przy wsparciu rządu może naprawdę przekształcić się w solidne, nowocześniejsze przedsiębiorstwo."
STE_the_wuklan_gryfia_dockyard: "Stocznia Gryfia-Wulkan"
STE_the_wuklan_gryfia_dockyard_desc: "Szczecińskie stocznie Wulkan i Gryfia to miejsca przesiąknięte historią. Niegdyś budowały U-Booty dla Kriegsmarine, później trafiły w polskie ręce i pomagały kształtować flotę młodego państwa. Stocznie były również sceną historycznych strajków robotniczych, które zmusiły Polską Zjednoczoną Partię Robotniczą do kluczowych ustępstw. Uczcijmy przemysłowe serce miasta poprzez rozwój i ożywienie tych terenów, zapewniając, że nadal będą dawać pracę i wykuwać przyszłość regionu oraz kraju. Najlepszy interes państwa szczecińskiego pokrywa się z naszym własnym."
STE_deep_water_port_in_swinoujscie: "Port głębokowodny w Świnoujściu"
STE_deep_water_port_in_swinoujscie_desc: "Świnoujście jest kluczowym węzłem morskim łączącym Szczecin z Bałtykiem i stanowi niezbędną bramę handlu międzynarodowego. Gdy Polska pozostawała zjednoczona, istniał ambitny plan budowy w mieście portu głębokowodnego. Choć wizję przerwała wojna domowa, ponownie pojawiła się nadzieja na jej odrodzenie. Przywrócenie projektu znacznie zwiększyłoby handel z najbliższymi partnerami, wzmocniło strategiczne znaczenie regionu i przyniosło naszej firmie wielkie korzyści gospodarcze. Projekt reprezentuje obiecującą przyszłość i jest tylko pierwszą z wielu inwestycji planowanych przez Polsteam w regionie."
STE_infrapark_pomerania: "Infrapark Pomerania"
STE_infrapark_pomerania_desc: "W przeszłości nasz kraj utworzył wiele Infraparków w całej Polsce. Teraz jesteśmy gotowi stworzyć jeden na Pomorzu. Będziemy wspierać przedsiębiorców obniżonymi podatkami i zachętami, promując rozwój przemysłu ciężkiego w od dawna zaniedbywanym regionie. Inicjatywa ma kluczowe znaczenie dla państwa, gdyż przemysł ciężki przez lata pozostawał zaniedbany. Musimy dogonić inne regiony, aby zapewnić dobrobyt i długoterminową stabilność. Polsteam odegra w przemianach kluczową rolę, służąc zainteresowanym przedsiębiorstwom niezbędnymi wskazówkami i pomocą."
STE_armed_river_barges: "Uzbrojone barki rzeczne"
STE_armed_river_barges_desc: "Odra była i nadal jest ważnym szlakiem handlowym. Przed upadkiem Polski rzeką spływały z południa kraju barki pełne wszelkiego rodzaju towarów. Mieszkańcy Szczecina codziennie widzieli je zacumowane przy nabrzeżu oraz małe holowniki pchające je do portu. Wiele z tych jednostek nadal znajduje się w Szczecinie i nie pełni już dawnej funkcji - przebudujemy je na okręty naszej marynarki. Może to znacznie poprawić wzajemny handel z innymi polskimi watażkami."
STE_arm_the_nawigator_xxi: "Uzbrój Nawigatora XXI"
STE_arm_the_nawigator_xxi_desc: "Nasza marynarka nie posiada obecnie dość okrętów, by wyznaczyć jednostkę flagową. Gdy nadszedł dzień Upadku, wiele statków zostało zniszczonych albo pozostawionych na pastwę niszczenia. Mamy jednak jedną jednostkę zdolną wypełnić tę kluczową rolę: Nawigatora XXI. Dawniej był dumą Politechniki Morskiej w Szczecinie i służył jako statek szkoleniowy. W obecnych warunkach nie mamy już wielu ludzi, których moglibyśmy szkolić w ten sposób. Nawigator XXI jest zatem doskonałym okrętem do tej misji. Wszyscy na pokład! Nadszedł czas podbić polskie rzeki."
STE_designs_from_the_marine_polytechnic: "Projekty Politechniki Morskiej"
STE_designs_from_the_marine_polytechnic_desc: "Politechnika Morska w Szczecinie jest jedną z nielicznych polskich instytucji kształcących przyszłych specjalistów przemysłu morskiego. Odgrywa kluczową rolę w sukcesie naszej firmy, gdyż wielu pracowników jest dumnymi absolwentami uczelni. Aby zapewnić dalszy rozwój i wielkość, zarząd Polsteam postanowił zacieśnić współpracę z Politechniką. Zobowiązujemy się wspierać jej rozbudowę, wiedząc, że inwestycja w jej przyszłość jest inwestycją w nas samych. W nadchodzących latach możemy całkowicie się odbudować, a nawet przewyższyć stan sprzed Upadku."
STE_the_tricity_special_economic_zone: "Specjalna Strefa Ekonomiczna Trójmiasto"
STE_the_tricity_special_economic_zone_desc: "Jeszcze niedawno Polsteam uważano za najsłabsze przedsiębiorstwo Gildii Hanzeatyckiej. Musieliśmy polegać na przestarzałym wyposażeniu i mieć nadzieję, że pewnego dnia zdołamy konkurować z Netto oraz Chemiewerke. Teraz marzenie staje się rzeczywistością. Rząd Krzystka przyznał nam wyłączne prawa gospodarcze do przemysłu ciężkiego w Trójmieście. Od tej chwili wszystkie wysiłki skupimy na uprzemysłowieniu północnej Polski z zamiarem prześcignięcia śląskiego okręgu przemysłowego. Nasz znaczny udział w przedsięwzięciu nie tylko zapewni Polsce pomyślną przyszłość, lecz także przyniesie nam olbrzymie dochody."
STE_monopoly_on_marine_trade: "Monopol na handel morski"
STE_monopoly_on_marine_trade_desc: "Nasza długa podróż dotarła wreszcie do ważnego kamienia milowego. Choć jeszcze wiele zostało do zrobienia, osiągnęliśmy rzeczy, które niegdyś wydawały się niemożliwe. Polsteam w pełni kontroluje teraz ujścia Wisły i Odry oraz ma dostęp do każdego portu w Polsce. Ustanowiliśmy monopol na przemysł morski, a każdy północny szlak handlowy przechodzi przez nasze ręce. W rezultacie zyski znacznie przekroczą najśmielsze marzenia.\n\nNadal pozostajemy jednak oddani nie tylko własnemu sukcesowi, lecz dobrobytowi całego kraju. Przyszłość Polski zależy od nas. Gdy przedsiębiorstwa takie jak Chemiewerke i Netto skupiają się wyłącznie na własnych interesach, my pozostajemy ostatnią lojalną firmą oddaną narodowi.\n\n§RJeszcze Polska nie zginęła.§!"

#wojewódzkie
STE_after_the_storm: "Krajobraz po burzy"
STE_after_the_storm_desc: "Pomorze Zachodnie znajduje się wreszcie pod naszymi rządami. Pokonaliśmy wszystkich, którzy mogli zagrozić bezpieczeństwu i stabilności państwa. Dotąd administracja działała raczej jako władza tymczasowa niż prawowita instytucja demokratyczna. Nadszedł czas to zmienić. Tymczasowe środki już nie wystarczą, skoro rządzimy znaczną ludnością. Musimy ustanowić dla obywateli stabilne i trwałe fundamenty. Pierwszym krokiem powinno być przeprowadzenie prawdziwych wyborów i spełnienie obietnic złożonych ludowi."
STE_the_enemy_of_my_enemy: "Wróg mojego wroga..."
STE_the_enemy_of_my_enemy_desc: "W Urzędzie Wojewódzkim trwa ważne spotkanie. Krzystek wraz z przywódcami Unii i ZKL oraz najbliższymi sojusznikami omawia udane zjednoczenie województwa. Droga przed nami jest jednak pełna wyzwań, gdyż jednoczenie Polski będzie krwawe i napotka zaciekły opór.\n\nNie możemy stawić czoła tym wyzwaniom samotnie. Musimy szukać sojuszników poza Unią Europejską. Tradycyjne przymierza mają swoje ograniczenia, dlatego należy zawrzeć nowe partnerstwa strategiczne z tymi, którzy podzielają nasze cele. Tylko spoglądając poza granice kraju, zgromadzimy wsparcie potrzebne do urzeczywistnienia naszej wizji Polski."
STE_contacts_across_the_channel: "Kontakty po drugiej stronie kanału"
STE_contacts_across_the_channel_desc: "Nie ma wątpliwości, że upadek Polski głęboko wpłynął na strukturę demograficzną kraju i doprowadził do utraty znacznej liczby wykwalifikowanych specjalistów. W odpowiedzi rząd Szczecina serdecznie zaprasza posiadających odpowiednie kwalifikacje obywateli polskich mieszkających w Zjednoczonym Królestwie do powrotu do ojczyzny.\n\nCi, którzy zdecydują się wrócić, otrzymają mieszkanie, stabilne i dobrze płatne zatrudnienie oraz preferencyjne umowy dostosowane do ich umiejętności. Osobom i rodzinom zaoferujemy także dodatkową pomoc ułatwiającą zmianę. Polska nie odbuduje się sama; każdy, kto pragnie uczestniczyć w narodowej odbudowie, jest nie tylko potrzebny, lecz również serdecznie witany."
STE_much_needed_help: "Tak potrzebna pomoc"
STE_much_needed_help_desc: "OXFAM jest znaną brytyjską organizacją pomagającą państwom walczyć z ubóstwem. Wobec nieustających problemów naszego narodu zwrócenie się do niej o pomoc byłoby rozsądnym posunięciem rządu. Po rozległych negocjacjach i przedstawieniu naszej pozycji w sprawie ponownego zjednoczenia Polski zdołaliśmy zdobyć rozpaczliwie potrzebne wsparcie międzynarodowe.\n\nOd zwycięskiego Powstania Gryfa pomoc humanitarna pozostaje jednym z naszych najważniejszych priorytetów. Wsparcie OXFAM daje nam nadzieję na spełnienie marzenia o stabilnym i zamożnym narodzie cieszącym się uznaniem społeczności międzynarodowej. Partnerstwo może przynieść znaczącą poprawę warunków życia i jaśniejszą przyszłość obywatelom."
STE_towards_recognition: "Na drodze do uznania"
STE_towards_recognition_desc: "Jako naród wkraczamy w nowy rozdział. Po latach wysiłku jesteśmy wreszcie gotowi przeprowadzić prawdziwe demokratyczne wybory. Nie możemy wykluczyć z tego procesu ponownie przyłączonych terytoriów ani dawnych wpływowych członków spektrum politycznego, szczególnie związanych z PiS i PO. Unia Letnia oraz Zamek wyciągną rękę do polityków służących niegdyś administracji Świnoujścia i Eurokomisariatowi Westpolen, o ile otwarcie potępią zarówno niemiecką inwazję i wszystkie działania przeprowadzone na polskiej ziemi, jak i politykę PiS, która przyczyniła się do upadku Polski."
STE_our_house_of_commons: "Nasza Izba Gmin"
STE_our_house_of_commons_desc: "Obecny system parlamentarny ustanowiono jako rozwiązanie tymczasowe i nigdy nie miał stanowić trwałych ram państwa. Wobec nadchodzących wyborów musimy go zreformować. Zapewnienie ich stabilności i uczciwości jest jednym z najwyższych priorytetów rządu. Jeśli naprawdę pragniemy zbudować sprawiedliwe i demokratyczne państwo, najpierw musimy ustanowić jasne oraz równe zasady procesu politycznego, włącznie z gruntowną rewizją systemu jednomandatowych okręgów wyborczych. Tylko kładąc silne fundamenty instytucjonalne, zagwarantujemy przetrwanie budowanej demokracji."
STE_protectors_of_the_republic: "Protektorzy Republiki"
STE_protectors_of_the_republic_desc: "Młoda republika potrzebuje wyższej izby parlamentu, która będzie stała na straży stabilności i bezpieczeństwa narodowego. Uchwalono już rezolucję określającą podstawowe prawa oraz obowiązki Izby Protektorów. Wybory jej członków odbędą się w nadchodzących dniach. Wybrani otrzymają dożywotni tytuł Protektora, zapewniający długoterminową ciągłość i oddanie podstawowym wartościom Republiki. Izba będzie siłą łagodzącą w okresach kryzysu oraz zapewni nadzór i równowagę w procesie ustawodawczym. Jej członkom, wybranym ze względu na uczciwość i doświadczenie, powierzymy obronę zasad, na których stoi republika."
STE_democracy_in_action: "Demokracja w działaniu"
STE_democracy_in_action_desc: "Wreszcie nadeszła ta chwila! Wzywa się wszystkich obywateli do oddania głosu na wybraną partię. Rząd tymczasowy wypełnił swój mandat, kładąc fundamenty sprawnej i stabilnej demokracji. Pozostał już tylko jeden krok: wybór nowego parlamentu reprezentującego wolę ludu. Po latach konfliktu, podziałów i trudów nadszedł czas skorzystać z ciężko wywalczonych praw obywatelskich. Głosowanie to nie tylko obowiązek, lecz także święto wolności oraz deklaracja nadziei.\n\nDo urn - niech wasz głos ukształtuje przyszłość!"
STE_the_two_faced_party: "Dwulicowa partia"
STE_the_two_faced_party_desc: "Unia Letnia zdobyła w wyborach znaczną większość głosów. Zwycięska partia organizuje dziś spotkanie w Netto Arenie. Członkowie z całego Pomorza zbiorą się, by świętować i omówić przyszłość narodu. Unia Letnia planuje współpracę z opozycyjnym ZKL, by zapewnić nowemu państwu dobrobyt i postęp. Jej lewicowe idee zostaną uzupełnione konserwatyzmem Boguckiego, czego owocem będzie seria wzajemnych porozumień obejmujących obie perspektywy. Pomimo wyzwań jest to wielkie zwycięstwo. Świętujmy i dobrze się bawmy!"
STE_oversight_from_the_spinach_palace: "Nadzór ze Szpinakowego Pałacu"
STE_oversight_from_the_spinach_palace_desc: "Aby strzec integralności demokratycznego eksperymentu, prezydent Krzystek mianował zaufanego przyjaciela, profesora Bartłomieja Toszka, łącznikiem z nowym rządem. Znany z głębokiego zainteresowania brytyjskim systemem politycznym profesor Toszek może skierować nasze instytucje w nowym, dotąd niezbadanym kierunku. Niektórzy spekulują, że będzie działał jako nieoficjalny wysłannik prezydenta, lecz nie ulega wątpliwości, że nominacja służy wyższemu interesowi narodowemu. Prezydent Krzystek jasno oznajmił nadchodzącej administracji, że nie dopuści do żadnych pęknięć w fundamentach nowego porządku demokratycznego."
STE_old_friends: "Starzy \"przyjaciele\""
STE_old_friends_desc: "ZKL zdobył w wyborach nieznaczną większość głosów. Zwycięska partia organizuje dziś spotkanie w Netto Arenie. Członkowie z całego Pomorza zbiorą się, by świętować i omówić przyszłość narodu. ZKL planuje współpracę z opozycyjną Unią Letnią, by zapewnić nowemu państwu dobrobyt i postęp. Jego konserwatywne poglądy zostaną uzupełnione lewicowymi ideami Jaroszewicza, czego owocem będzie seria wzajemnych porozumień obejmujących obie perspektywy. Pomimo wyzwań jest to wielkie zwycięstwo. Świętujmy i dobrze się bawmy!"
STE_the_consensus: "Konsensus"
STE_the_consensus_desc: "W dawnym ratuszu, służącym obecnie za rezydencję prezydenta Krzystka, ma odbyć się kluczowe spotkanie. Prezydent Piotr Krzystek zbierze najbliższych doradców i przywódców dwóch największych partii politycznych. Według wiarygodnych źródeł głównym tematem rozmów będzie odbudowa Szczecina oraz szerszego regionu dawnego województwa zachodniopomorskiego. Spotkanie ma również zapewnić, że proces odbudowy narodowej przebiegnie sprawnie, bez konfliktów politycznych, sporów ani starć frakcyjnych między Zamkiem a Unią Letnią."
STE_national_healthcare_act_of_date: "Ustawa o Narodowej Służbie Zdrowia z [GetYear] roku"
STE_national_healthcare_act_of_date_desc: "Zarówno Unia Letnia, jak i Zamek zgadzają się, że pewna forma narodowej opieki zdrowotnej jest niezbędna, by zagwarantować dobrostan i szczęście każdego obywatela. Obie partie wyobrażają sobie jednak inny model: Unia opowiada się za systemem Beveridge'a, zaś Zamek popiera częściową refundację. Debata wywołała wielkie zainteresowanie opinii publicznej i coraz większą uwagę mediów, gdyż opieka zdrowotna pozostaje dla wielu sprawą głęboko osobistą. Ostateczna decyzja spoczywa na partii rządzącej, która będzie musiała starannie rozważyć obie propozycje, nim ukształtuje przyszłość systemu ochrony zdrowia."
STE_leash_the_golden_calf: "[GetIndustrialCharter]"
STE_industrial_charter_scripted: "Karta Przemysłowa"
STE_golden_calf_scripted: "Ujarzmianie złotego cielca"
STE_leash_the_golden_calf_desc: "Całkowicie wolny rynek byłby w obecnych warunkach szkodliwy dla interesu narodowego. Jako kraj rozwijający się, pozbawiony solidnej bazy przemysłowej i pewnej kontroli nad kluczowymi sektorami, potrzebujemy choćby minimalnego poziomu regulacji, aby zapewnić stabilność oraz długoterminowy wzrost. Co budujące, obie strony parlamentu zgadzają się co do potrzeby nadzoru. Niepokój budzi jednak ciągłe wahanie rządu przed potwierdzeniem niezależności gospodarczej. Narasta obawa, że niektórzy zagraniczni gracze wywierają nieproporcjonalny wpływ na politykę krajową. Nadszedł czas, by przywódcy narodu postawili potrzeby kraju ponad wpływami z zewnątrz."
STE_education_act_of_date: "Ustawa o Edukacji z [GetYear] roku"
STE_education_act_of_date_desc: "Po odtworzeniu podstawowych instytucji państwa rząd skupi się na reformie i ożywieniu krajowego systemu edukacji. Prezydent Piotr Krzystek obiecał nadać pierwszeństwo odbudowie i ponownemu otwieraniu szkół uszkodzonych podczas niemieckiej inwazji, aby każde dziecko miało możliwość nauki w bezpiecznym, wspierającym środowisku.\n\nRównie ważne jest odrodzenie lokalnych uniwersytetów i politechnik, które odegrają kluczową rolę w kształtowaniu intelektualnej oraz technicznej przyszłości kraju.\n\nWykształcone i świadome społeczeństwo jest najsilniejszym zabezpieczeniem przed powtórzeniem dawnych błędów, takich jak dojście do władzy rządu PiS. Musimy zagwarantować, by takie demokratyczne uwstecznienie nigdy się nie powtórzyło."
STE_unionisation: "Uzwiązkowienie"
STE_unionisation_desc: "Sektor przemysłowy Pomorza Zachodniego, z wyłączeniem PŻM i jego spółek zależnych, jest obecnie słabo zorganizowany. Polskie związki zawodowe rozmontowano podczas interwencji w ramach niemieckiej polityki przeciwpartyzanckiej.\n\nW odpowiedzi rząd zachęca do tworzenia nowych związków zawodowych skupiających pracowników podobnych sektorów i aktywnie je wspiera. Inicjatywa ma wzmocnić pozycję robotników wobec dominacji korporacji oraz pomóc państwu lepiej rozpoznawać problemy ludności pracującej i na nie odpowiadać.\n\nSilna sieć związków przyczyni się także do długoterminowej stabilności gospodarczej poprzez wspieranie dialogu między pracą a przemysłem. Odzwierciedla również oddanie rządu odbudowie nie tylko infrastruktury, lecz także demokratycznych fundamentów praw pracowniczych."
STE_advisory_devolution: "Decentralizacja doradcza"
STE_advisory_devolution_desc: "Podejmowanie decyzji nie może ograniczać się wyłącznie do szczebla centralnego. Rząd dostrzega potrzebę głosów z zewnątrz - lokalnych opinii, które pomogą mu rozwiązywać najpilniejsze problemy kraju. Wszyscy jednak wiemy, że demokracja nie polega na partyjnym zebraniu, zdobyciu określonej kadencji za pomocą obietnic, a potem robieniu z ludźmi wszystkiego, na co ma się ochotę. Uważamy, że między rządzącymi a ludem powinna istnieć stała więź. \"Rządy ludu, przez lud i dla ludu\" pozostają najważniejszą definicją demokracji."
STE_stop_go_economics: "Gospodarka napędzania i chłodzenia"
STE_stop_go_economics_desc: "Rząd ogłosił zaskakujące przyjęcie tak zwanej polityki gospodarczej \"stop-go\" - strategii charakteryzującej się krótkimi okresami gwałtownego wzrostu, po których następują nagłe spowolnienia. Urzędnicy twierdzą, że elastyczne podejście pozwoli państwu \"dynamicznie reagować\" na zmiany rynkowe.\n\nKrytycy ostrzegają jednak, że oznacza to powrót do niestabilności. Polityka może podkopać długoterminowy rozwój i narazić robotników, związki zawodowe oraz mniejsze gałęzie przemysłu na nagłe cięcia i niespójne wsparcie. Gdy Pomorze Zachodnie walczy o odbudowę, ten chaotyczny kierunek może pogłębić niepewność zamiast ją usunąć."
STE_mantain_a_tight_grip: "Utrzymanie silnego uścisku"
STE_mantain_a_tight_grip_desc: "Choć wojskowe aspekty stanu wyjątkowego są stopniowo ograniczane, jest jeszcze za wcześnie, by całkowicie go znieść. Rząd zachowa zdecydowane, skupione na sprawach cywilnych podejście i będzie zapewniał stabilność gospodarczą poprzez dalszą kontrolę cen, racjonowanie oraz nadzór nad kluczowymi sektorami.\n\nNie zrezygnujemy z kontroli nad podstawowymi elementami codziennego życia, dopóki nie zyskamy pewności, że każde gospodarstwo domowe może osiągnąć sprawiedliwy i trwały poziom życia. Nie jest to narzędzie ucisku, lecz gwarancja ochrony w okresie odbudowy. Powrót do pełnej normalności trzeba oprzeć na stabilnych, powszechnych i odpornych fundamentach."
STE_nationalise_captured_assets: "Nacjonalizacja przejętych aktywów"
STE_nationalise_captured_assets_desc: "Nacjonalizacja sprywatyzowanej infrastruktury przemysłowej zapewni państwu pełną kontrolę nad liniami produkcyjnymi i kluczowymi łańcuchami dostaw. Decyzja nie jest wyłącznie ideologiczna, lecz praktyczna: pozwoli na bieżąco dostosowywać produkcję przemysłową do zmieniającego się popytu rynkowego i potrzeb społecznych.\n\nUsuwając zagraniczne oraz spekulacyjne interesy z sektorów strategicznych, możemy wydajniej rozdzielać zasoby, nadawać pierwszeństwo odbudowie i lepiej reagować na kryzysy. Nadzór państwa pozwala również zagwarantować uczciwe warunki pracy, stabilizować ceny i zapobiegać wyzyskującym monopolom.\n\nPolityka ustanowi samowystarczalną gospodarkę, która stawia obywateli na pierwszym miejscu i jest gotowa zmierzyć się z długoterminowymi wyzwaniami odbudowy oraz rozwoju."
STE_secure_production: "Zabezpieczenie produkcji"
STE_secure_production_desc: "Im mocniej skupimy się na ponownym wyposażaniu i modernizacji zdolności produkcyjnych, szczególnie w kluczowych sektorach rolnictwa, wytwórstwa i infrastruktury, tym szybciej osiągniemy stabilną oraz samowystarczalną produkcję. Inicjatywa nie jest wyłącznie techniczna, lecz strategiczna. Inwestując dziś w silniejsze i odporniejsze systemy produkcji, przyspieszymy odbudowę gospodarki, zmniejszymy zależność od nacisków zewnętrznych, a ostatecznie podniesiemy poziom życia wszystkich obywateli.\n\nModernizacja jest koniecznością. Każde ulepszenie maszyn, procesów i koordynacji zwiększa zdolność do zaspokajania podstawowych potrzeb, ograniczania marnotrawstwa oraz tworzenia sprawiedliwszej i wydajniejszej gospodarki. Krótkoterminowe skupienie na bezpieczeństwie produkcji przyniesie długoterminowe korzyści w postaci dobrobytu, stabilności i pomyślności narodu."
STE_rationalizing_rationing: "Racjonalizacja racjonowania"
STE_rationalizing_rationing_desc: "Oczekiwanie, że zniszczone przez wojnę ziemie rolne zdołają w pełni zaspokoić zapotrzebowanie miast i miasteczek na żywność, jest obecnie nierealne. Sytuacja wywarłaby nadmierną presję społeczną i gospodarczą na społeczności wiejskie. Musimy więc nadal zachęcać do ograniczania konsumpcji i utrzymać system racjonowania żywności, aby zapewnić sprawiedliwy podział dostępnych zasobów.\n\nDzięki zjednoczeniu województwa oraz lepszej koordynacji produkcji rolnej i sieci dystrybucji możemy ostrożnie zacząć łagodzić część ograniczeń. Nadal kluczowe jest jednak, aby wszyscy obywatele uważnie kontrolowali własne zużycie i popierali te środki, gdy pracujemy nad przywróceniem bezpieczeństwa żywnościowego oraz odbudową trwałych fundamentów rolnictwa."
STE_state_housing: "Budownictwo państwowe"
STE_state_housing_desc: "Rozpoczniemy wielkie, kierowane przez państwo projekty mieszkaniowe w każdym mieście, miasteczku i większej wsi, aby jak najszybciej zapewnić każdemu mieszkańcowi dach nad głową. Domy nie będą luksusowe - to nie czas na przepych. Powstaną praktyczne, ujednolicone mieszkania zaprojektowane tak, by sprawnie i sprawiedliwie zaspokajać podstawowe potrzeby życiowe.\n\nStawiając na jednolitość, zapewnimy szybkość, opłacalność i uczciwość. W obliczu kryzysu oraz przesiedleń nie skupiamy się na luksusie, lecz na godności, schronieniu i stabilnym fundamencie, na którym można odbudować kraj."
STE_mantainining_employment: "Utrzymanie zatrudnienia"
STE_mantainining_employment_desc: "Zapewnienie stabilnego zatrudnienia wymaga utrzymania działania kluczowych gałęzi przemysłu. Rząd skupi się na sektorach najbardziej podatnych na wahania gospodarcze, szczególnie tych zależnych od inwestycji kapitałowych i eksportu.\n\nUtrzymanie stałego tempa budowy mieszkań, fabryk oraz infrastruktury jest najwyższym priorytetem, gdyż odpowiada niemal połowie krajowych nakładów inwestycyjnych. Będziemy blisko współpracować z głównymi gałęziami przemysłu i instytucjami publicznymi, aby koordynować długoterminowe inwestycje mające zapobiegać niestabilności.\n\nW nagłych sytuacjach wesprzemy ludność ulgami podatkowymi, gwarantowanymi pożyczkami i inną bezpośrednią pomocą. Odporność gospodarcza zależy od przygotowania, a nie improwizowanych reakcji."
STE_wind_down_the_gears_of_war: "Hamowanie machiny wojennej"
STE_wind_down_the_gears_of_war_desc: "Wojna o zjednoczenie województwa dawno dobiegła końca. Pozostało znacznie trudniejsze zadanie: zbudować coś, co przetrwa przez lata. Tymczasowe zawieszenie norm cywilnych, początkowo usprawiedliwione koniecznością, wkrótce się zakończy. Zamiast utrzymywać ramy stanu wyjątkowego rząd zaproponował starannie rozłożoną w czasie strategię stopniowego ożywienia gospodarki. Podejście stawia na długoterminową stabilność i skupia się na kontrolowanej \"odwilży\" ekonomicznej. Przedstawiono je jako jedyny odpowiedzialny kierunek działania - wyważony, przemyślany i mający zabezpieczyć dobrobyt w nadchodzących latach."
STE_partners_in_business: "Partnerzy w interesach"
STE_partners_in_business_desc: "Mniejsze przedsiębiorstwa przejęte podczas zjednoczenia zostaną oddane pod nadzór Gildii Hanzeatyckiej. Niektórzy mogą uznać posunięcie za kontrowersyjne albo wręcz niesprawiedliwe, szczególnie zwolennicy pełnej własności państwowej. Decyzja odzwierciedla jednak pragmatyczne podejście mające zapewnić stabilność i ciągłość gospodarki. Nacjonalizacja, całkowicie sprzeczna z przekonaniami ZKL, mogłaby doprowadzić do chaosu administracyjnego, nagłego załamania łańcuchów dostaw i utraty doświadczonego miejscowego kierownictwa. Nadzór Hanzy zagwarantuje, że firmy pozostaną czynne, konkurencyjne i zintegrowane z szerszym rynkiem regionalnym. To kompromis, który nie jest pozbawiony kosztów, ale pozostaje konieczny dla odbudowy gospodarki narodowej."
STE_housing_contracts: "Kontrakty mieszkaniowe"
STE_housing_contracts_desc: "Choć państwo ma możliwości samodzielnego prowadzenia kluczowych projektów infrastrukturalnych i budowlanych, doświadczenie pokazuje, że udział prywatnych przedsiębiorstw oraz partnerów korporacyjnych zapewnia znacznie większą wydajność. Angażując sektor prywatny, możemy skrócić czas realizacji, ograniczyć całkowite koszty i zapewnić wyższe standardy jakości oraz innowacyjności. Co więcej, współpraca publiczno-prywatna pozwala lepiej rozdzielać zasoby narodowe, przyciągać inwestycje i pobudzać lokalne gospodarki. Podejście nie tylko przynosi natychmiastowe korzyści, lecz również kładzie fundament pod trwały wzrost i długoterminowy dobrobyt. W czasie odbudowy pragmatyzm musi zwyciężyć nad przestarzałymi dogmatami gospodarczymi."
STE_security_and_incentive: "Bezpieczeństwo i zachęta"
STE_security_and_incentive_desc: "Rząd potwierdza swoje zobowiązanie do budowy gospodarki, w której wysiłek jest wynagradzany, a na stanowiska kierownicze trzeba zasłużyć. Aby zachęcać do inicjatywy i wydajności, dostosowane zostaną podatki bezpośrednie oraz struktury płac. Sprawiedliwe płace podstawowe pozostaną gwarantowane, lecz w rozmaitych sektorach promowane będą premie za wyniki i systemy akordowe, przy czym metody zostaną dostosowane do poszczególnych gałęzi przemysłu.\n\nUtrzymamy również jasny standard kierownictwa. Każde stanowisko, od warsztatu po salę zarządu, musi być dostępne dla osób o najwyższych kwalifikacjach. Awans będzie oparty na zasługach, a nie przywilejach, dzięki czemu odbudową kraju pokierują talent, lojalność i oddanie."
STE_restore_village_life: "Rewitalizacja wsi"
STE_restore_village_life_desc: "Trzeba rozpocząć energiczną kampanię zwiększania wydajności pomorskich gospodarstw i ogrodów. Rolnikom od dawna brakowało jasnego kierunku oraz dostępu do podstawowych narzędzi, maszyn, pasz i nawozów potrzebnych do zwiększenia krajowej produkcji żywności. Należy zagwarantować rynki zbytu oraz uczciwe, opłacalne ceny, aby każdy pracownik sektora rozumiał, czego się od niego oczekuje. Pilnie potrzebujemy zwiększenia produkcji, szczególnie jaj, boczku i innych produktów pochodzenia zwierzęcego, aby zmniejszyć zależność od importu i chronić rezerwy walutowe.\n\nPrzyciągnięcie wystarczającej liczby pracowników na wieś będzie możliwe tylko wtedy, gdy szybko i skutecznie ulepszymy wiejskie budownictwo oraz miejscową infrastrukturę. Życie na wsi musi się odrodzić, a zadanie należy uznać za priorytet narodowy."
STE_putting_food_on_the_tables: "Jedzenie na stołach"
STE_putting_food_on_the_tables_desc: "Choć rolnictwo często bywa niedoceniane, pozostaje jednym z najważniejszych filarów długoterminowego rozwoju narodu. Rząd jest całkowicie oddany przekonaniu, że unowocześnione i działające pełną parą pomorskie rolnictwo oraz ogrodnictwo staną się ważniejsze niż kiedykolwiek dla zapewnienia bezpieczeństwa żywnościowego i dobrobytu ośrodków miejskich.\n\nRozwijający się i odporny krajowy sektor rolny nie tylko ustabilizuje dostawy żywności, lecz także otworzy nowe rynki dla produktów przemysłowych, szczególnie maszyn rolniczych, urządzeń mleczarskich i infrastruktury wiejskiej. Dzięki temu rolnictwo może stać się podstawą trwałej oraz cennej gospodarki eksportowej, napędzając innowacje i samowystarczalność narodu przez długie lata."
STE_testing_the_limit: "Wystawianie cierpliwości na próbę"
STE_testing_the_limit_desc: "W rzeczywistości istnieje granica tego, jak dużą część osobistych dochodów obywatele są gotowi oddać państwu, szczególnie w czasie pokoju. Gdy jednak rośnie presja gospodarcza i zakres odpowiedzialności państwa, rząd musi rozważyć podniesienie podatków, aby utrzymać równowagę fiskalną.\n\nKonieczne działanie nie pozostanie bez konsekwencji. Gildia Hanzeatycka, od dawna ostrożna wobec rosnącej ingerencji rządu w handel i finanse, już wyraziła niezadowolenie. Dodatkowe opodatkowanie może pogłębić rozłam i zagrozić delikatnemu sojuszowi władzy z sektorem handlowym."
STE_relief_for_earned_incomes: "Ulga dla dochodów z pracy"
STE_relief_for_earned_incomes_desc: "Obecny system ma poważne wady. Jest nadmiernie skomplikowany i nakłada nieproporcjonalnie ciężkie brzemię na ludzi podejmujących dodatkowy wysiłek. Uważamy więc, że należy poważnie rozważyć zmniejszenie różnic między poziomami podatkowymi oraz usunięcie obecnej nierównowagi, przez którą nadgodziny i dodatkowe dochody z dodatkowej pracy są opodatkowane znacznie wyżej niż zwykłe wynagrodzenie.\n\nZalecamy również podniesienie progu, poniżej którego osobiste oszczędności nie są uwzględniane w badaniu sytuacji majątkowej. Powinniśmy też rozszerzyć zakres niewielkich oszczędności całkowicie zwolnionych z podatku dochodowego."
STE_infrastructural_woes: "Bolączki infrastruktury"
STE_infrastructural_woes_desc: "Oficjalnie zwrócimy się do rządu brytyjskiego o pomoc, prosząc konkretnie o wiedzę jego specjalistów przy rozwoju i modernizacji infrastruktury drogowej oraz kolejowej Pomorza Zachodniego. Mają dziesięciolecia doświadczenia ze złożonymi systemami transportowymi i odbudową po kryzysach; brytyjscy inżynierowie mogą zapewnić cenne wskazówki i praktyczne rozwiązania. Współpraca przyspieszy odbudowę regionu, poprawi jego wewnętrzne połączenia i skuteczniej zintegruje Pomorze Zachodnie z europejską siecią transportową. Jest pragmatycznym krokiem ku odbudowie kraju w duchu odporności, wydajności i współpracy międzynarodowej. Bez dobrej sieci kolejowej oraz podstawowej infrastruktury państwo nie może właściwie funkcjonować."
STE_transport_of_the_common_man: "Transport przeciętnego człowieka"
STE_transport_of_the_common_man_desc: "Rząd pozyskał kilka starszych autobusów piętrowych ze Zjednoczonego Królestwa, aby uzupełnić miejskie i międzymiastowe floty autobusowe zniszczone albo zarekwirowane podczas interwencji.\n\nChoć pojazdy nie są nowe, stanowią praktyczne i opłacalne rozwiązanie obecnego niedoboru transportu publicznego. Ich wprowadzenie pomoże przywrócić połączenia między miastami i miasteczkami, odciąży miejscowych pasażerów oraz stanie się symbolem stopniowego powrotu do normalności. Tymczasowy środek jest częścią szerszej strategii odbudowy kluczowej infrastruktury w regionie i umożliwienia obywatelom swobodnego korzystania z transportu publicznego."
STE_chokehold_on_the_order: "Żelazny uścisk na Odrze"
STE_chokehold_on_the_order_desc: "Kontrolujemy teraz wejście na szlak handlowy obejmujący całe dorzecze Odry. Strategiczne położenie pozwala nam zdobyć znaczną przewagę gospodarczą i logistyczną.\n\nZarządzając przepływem towarów przez jedną z najważniejszych dróg wodnych Europy Środkowej, nie tylko poprawiamy własną sytuację gospodarczą, lecz również zyskujemy wpływ na regionalną dynamikę handlową. Państwo dopilnuje, aby zyski z tego położenia zostały ponownie zainwestowane w infrastrukturę, modernizację portów oraz programy społeczne, tak by z dobrobytu korzystali wszyscy obywatele, a nie tylko korporacje."
STE_partnerships_upstream: "Partnerstwa w górze rzeki"
STE_partnerships_upstream_desc: "Zajmujemy strategiczne miejsce przy kluczowym korytarzu handlowym i jesteśmy gotowi podpisać umowy handlowe z zainteresowanymi państwami leżącymi nad Odrą oraz jej dopływami.\n\nPorozumienia zwiększą handel wszystkich zaangażowanych stron poprzez usprawnienie logistyki, ograniczenie barier i promowanie regionalnej współzależności. Jako brama do dorzecza Odry zamierzamy nie tylko osiągać zyski, lecz także przyjąć odpowiedzialną rolę przywódczą w tworzeniu stabilnej oraz opartej na współpracy strefy gospodarczej. Wspierając wspólne korzyści, możemy wzmocnić zarówno sąsiadów, jak i samych siebie.\n\nZa dobrobyt!"
STE_youve_never_had_it_so_good: "Nigdy nie mieliście tak dobrze"
STE_youve_never_had_it_so_good_desc: "Po szeroko zakrojonej koordynacji, burzliwych debatach oraz koniecznych, lecz kosztownych układach możemy wreszcie bez cienia wątpliwości powiedzieć, że odnieśliśmy sukces. Każdy obywatel żyje dziś lepiej niż kiedykolwiek pod rządami Lindnera albo innych watażków. Osiągnęliśmy ważny kamień milowy; większość ludzi uważa, że zaczynamy przekraczać poziom życia Polski sprzed Upadku. Nasza praca jeszcze się nie skończyła, gdyż reszta kraju nadal czeka na wyzwolenie. Teraz jednak mamy co świętować. Nasz prezydent, Piotr Krzystek, jest człowiekiem ludu i zbawcą kraju. Dobra, wystarczy tego pierdolenia, świętujmy!"

#wojskowe wojewódzkie
STE_date_defence_white_paper: "Biała Księga Obronności z [GetYear] roku"
STE_date_defence_white_paper_desc: "Rząd otrzymał właśnie otrzeźwiający raport o obecnym stanie wojska, który ujawnia niezaprzeczalną prawdę: nasze siły zbrojne są zupełnie nieprzygotowane do konfliktu o skali majaczącej wraz z jednoczeniem regionu. Nie będzie to niewielka potyczka, lecz wojna wystawiająca na próbę każdy zasób, każdą strategię i każdego żołnierza. Zmagamy się z krytycznymi niedoborami wyposażenia, niewystarczającym wyszkoleniem i lukami w strukturze dowodzenia, które pozostawiają nas niebezpiecznie odsłoniętych. Okno sposobności na działania naprawcze szybko się zamyka, a każde wahanie albo opóźnienie może mieć katastrofalne konsekwencje dla przyszłości narodu."
STE_soaring_through_the_skies: "Lot w przestworza"
STE_soaring_through_the_skies_desc: "Nie wygramy tej wojny wyłącznie na lądzie ani na morzu; musimy również zapewnić sobie dominację w powietrzu. Przewaga powietrzna jest koniecznością. Tylko kontrolując niebo, zagwarantujemy bezpieczeństwo miast, nienaruszalność szlaków zaopatrzeniowych i powodzenie operacji lądowych oraz morskich.\n\nW tym celu zainwestujemy w nowoczesne lotnictwo zdolne przechwytywać bombowce wroga, wspierać ofensywy lądowe i rozciągać naszą siłę poza granice. Eskadry myśliwskie osłonią niebo, a samoloty uderzeniowe zmiękczą obronę przeciwnika, nim żołnierze w ogóle nadejdą."
STE_aerospace_joint_venture: "Lotnicza spółka joint venture"
STE_aerospace_joint_venture_desc: "Obecnie nie mamy regionalnego przemysłu lotniczego. Musimy zbudować go od podstaw. W tym celu nawiążemy bliską współpracę z Gildią Hanzeatycką i utworzymy konsorcjum Dąbie Aerospace. Rozbudujemy też lotnisko Dąbie, ulepszając infrastrukturę i wspierając rosnącą działalność lotniczą. Inicjatywa nie tylko ustanowi silny sektor lotniczy w regionie, lecz także stworzy miejsca pracy wymagające wysokich kwalifikacji, pobudzi innowacje i wzmocni lokalną gospodarkę. Naszym celem jest rozwinięcie pełnego ekosystemu obejmującego produkcję, badania i rozwój, utrzymanie oraz logistykę."
STE_lethal_force: "Śmiercionośna siła"
STE_lethal_force_desc: "Podstawowym celem lotnictwa musi być zdobycie dominacji na niebie poprzez zalanie przestrzeni powietrznej przeciwnika naszymi samolotami i odebranie mu zdolności odpowiedzi. Przewaga powietrzna nie jest jedynie atutem, lecz wymogiem strategicznym. Musimy zneutralizować wrogie siły powietrzne i zniszczyć bazę przemysłową wspierającą ich zdolność prowadzenia wojny. Kontrolując powietrze, możemy chronić żołnierzy, odebrać wrogowi swobodę ruchu i przejąć inicjatywę we wszystkich obszarach działań.\n\nTa wizja poprowadzi rozwój naszego przemysłu lotniczego od podstaw, poczynając od Dąbie Aerospace i rozbudowy lotniska Dąbie, które staną się fundamentem przyszłej siły."
STE_inter_branch_operations: "Operacje połączonych rodzajów sił"
STE_inter_branch_operations_desc: "Podstawowym celem lotnictwa powinno być niezachwiane wspieranie wojsk lądowych przy zachowaniu pełnej koordynacji z nimi podczas wszystkich faz operacji wojskowych - od planowania po wykonanie.\n\nSiły powietrzne muszą działać jako zintegrowany i szybko reagujący składnik połączonych wojsk. Powinny zapewniać bezpośrednie wsparcie lotnicze, utrzymywać przewagę powietrzną, prowadzić rozpoznanie i obserwację, umożliwiać szybkie przerzucanie oddziałów oraz dokonywać precyzyjnych uderzeń na pozycje wroga. Ścisła współpraca zapewni nie tylko sukces taktyczny na polu bitwy, lecz także synergię operacyjną i głębię strategiczną."
STE_a_shield_of_our_homeland: "Tarcza naszej ojczyzny"
STE_a_shield_of_our_homeland_desc: "Podstawową misją lotnictwa jest ochrona i obrona suwerennej przestrzeni powietrznej. Strzeżenie nieba ma nie tylko kluczowe znaczenie dla bezpieczeństwa narodowego, lecz również stanowi podstawowy wyraz suwerenności oraz niezależności kraju.\n\nMisja wymaga ciągłego monitorowania przy użyciu zaawansowanych systemów radarowych i obserwacyjnych, wczesnego wykrywania potencjalnych zagrożeń oraz zdolności szybkiej i zdecydowanej odpowiedzi na każde wtargnięcie albo wrogi akt. Utrzymując pełną kontrolę nad przestrzenią powietrzną, zapewniamy bezpieczeństwo obywatelom, chronimy kluczową infrastrukturę i tworzymy bezpieczne warunki działalności gospodarczej oraz społecznej."
STE_the_gryphons: "Gryfy"
STE_the_gryphons_desc: "Nasze lotnictwo będzie dokonywać precyzyjnych i niszczycielskich uderzeń w głębi terytorium wroga, niczym gryf atakujący szponami. Naloty mają neutralizować źródła jego siły: kompleksy przemysłowe i administracyjne ośrodki dowodzenia.\n\nOperacje nie będą pustymi gestami symbolicznymi. Zostaną starannie zaplanowane i skierowane na konkretne cele, aby sparaliżować zdolność przeciwnika do prowadzenia wojny, zakłócić logistykę, rozmontować struktury dowódcze i podkopać morale. Uderzając w samo serce wroga, pragniemy skrócić konflikt i doprowadzić do załamania jego zdolności podtrzymywania zorganizowanego oporu."
STE_tacp_deployment: "Rozmieszczenie TACP"
STE_tacp_deployment_desc: "W każdej jednostce wojsk lądowych powstaną Zespoły Kontroli Lotnictwa Taktycznego (TACP), włączone bezpośrednio w jej szeregi. Wyspecjalizowane drużyny będą odpowiadały za sprawną współpracę w czasie rzeczywistym między oddziałami lądowymi a wspierającym je lotnictwem.\n\nWłączając TACP na szczeblu jednostek, zagwarantujemy, że wsparcie lotnicze będzie precyzyjne, udzielane we właściwym momencie i całkowicie zsynchronizowane z manewrami naziemnymi. Ścisła koordynacja zmaksymalizuje skuteczność nalotów, rozpoznania i bezpośredniego wsparcia lotniczego, znacznie zwiększając elastyczność operacyjną oraz szybkość reakcji na polu bitwy.\n\nPołączona siła dzielnych żołnierzy na ziemi i nieustraszonych pilotów w powietrzu stworzy niepowstrzymaną potęgę. Wspólnie osiągną synergię, która zdominuje pole bitwy, przytłoczy wroga i zapewni decydujące zwycięstwa."
STE_the_missile_age: "Era pocisków rakietowych"
STE_the_missile_age_desc: "Pociski rakietowe są przyszłością wojny - zarówno ziemia-powietrze, ziemia-ziemia, powietrze-ziemia, jak i powietrze-powietrze. Mogą razić cele w głębi terytorium przeciwnika, a zarazem chronić nas przed próbami naruszenia przestrzeni powietrznej.\n\nSystemy rakietowe są szczególnie cenne, ponieważ pozwalają wywrzeć decydujący wpływ bez bezpośredniego narażania personelu wojskowego. Zdolność atakowania przeciwnika z dystansu, precyzyjnie i szybko, czyni pociski doskonałym narzędziem złożonej i wymagającej wojny XXI wieku.\n\nInwestując w zaawansowaną technikę rakietową i w pełni integrując ją ze strategią obronną, możemy wzmocnić odstraszanie, zwiększyć elastyczność operacyjną i utrzymać przewagę strategiczną nad potencjalnymi zagrożeniami."
STE_road_runways_of_pomerania: "Pomorskie drogowe odcinki lotniskowe"
STE_road_runways_of_pomerania_desc: "Na Pomorzu Zachodnim wiele odcinków dróg zaprojektowano pierwotnie jako awaryjne pasy startowe. Możemy je odtworzyć i dostosować do potrzeb Sił Powietrznych.\n\nChoć lotniska te nie będą najbardziej zaawansowanymi ani idealnymi obiektami, wystarczą do zaspokojenia potrzeb operacyjnych. Wykorzystując istniejącą infrastrukturę, szybko i niewielkim kosztem rozbudujemy sieć baz lotniczych, zwiększając elastyczność oraz odporność naszych możliwości lotniczych.\n\nOżywienie drogowych odcinków lotniskowych poszerzy zasięg strategiczny, zapewni samolotom lepsze możliwości rozproszenia i wzmocni ogólną postawę obronną w regionie."
STE_clean_slate: "Poczucie kierunku"
STE_clean_slate_desc: "W naszym systemie wojskowym powinno znaleźć się miejsce dla niemal każdego, kto nie jest całkowicie bezczynny albo zupełnie niekompetentny. Nie możemy jednak zatrudniać ludzi pozbawionych potrzebnych umiejętności i oddania; ci, którzy okażą się nieskuteczni albo niezdolni, muszą zostać usunięci ze służby, aby utrzymać sprawność oraz dyscyplinę wojska. Prawdziwym wyzwaniem jest znalezienie odpowiednich ról dla oficerów, którzy nie nadają się do wyższego dowodzenia, lecz nadal dysponują cennym doświadczeniem i zdolnościami. Dyskretnie poprosiliśmy Brytyjczyków o pomoc w odbudowie armii. W odpowiedzi przydzielono nam pułkownika Toma Blythe'a jako doradcę wojskowego oraz attaché mającego nadzorować i prowadzić ten kluczowy proces."
STE_our_roots: "Nasze korzenie"
STE_our_roots_desc: "Walka z konkurencyjnymi watażkami nie przypomina konwencjonalnej wojny ani nie odpowiada zasadom tradycyjnych działań, do których szkolono współczesne armie europejskie. Konflikty są nieregularne, charakteryzują się partyzancką taktyką, zmiennymi sojuszami i nieprzewidywalnymi polami bitwy. Musimy więc trzymać się metod, które przyniosły już sukces podczas jednoczenia prowincji. Wypróbowane strategie są dostosowane do wyjątkowych wyzwań regionalnej walki o władzę i dają największe szanse na zwycięstwo. Poleganie wyłącznie na konwencjonalnej doktrynie wojskowej byłoby nieskuteczne i mogłoby zagrozić całej kampanii. Doświadczenie pokazało, że zdolność przystosowania, znajomość terenu i niekonwencjonalna taktyka są niezbędnymi narzędziami trwającego konfliktu."
STE_drawsko_rangers: "Drawscy Rangersi"
STE_drawsko_rangers_desc: "Wielkie połacie północno-zachodniej Polski pozostają niezamieszkane, porośnięte gęstymi lasami i pełne nieujarzmionego terenu. Drawsko jest najlepszym przykładem tego pustkowia - odległe, surowe i doskonałe do specjalistycznego szkolenia. Dogodnym zbiegiem okoliczności mieści się tam również jeden z największych poligonów wojskowych w Polsce. Właśnie tam utworzymy specjalny program szkolenia specjalistów odpowiedzialnych za prowadzenie oddziałów przez zdradliwe krajobrazy. Opanowanie tego środowiska będzie kluczowe, gdyż sukces w takich regionach zależy nie tylko od siły i dyscypliny, lecz także od dogłębnej znajomości terenu, skrytości oraz zdolności przystosowania."
STE_our_future: "Nasza przyszłość"
STE_our_future_desc: "Musimy spoglądać ku przyszłości, szczególnie ku planom odbudowy Polski. Pierwszym krokiem powinno być oparcie się na strukturach i doktrynach dawnego Wojska Polskiego. Fundament zapewni nie tylko praktyczny wzór odbudowy sił, lecz także symboliczną więź między obecnymi wysiłkami a dziedzictwem Rzeczypospolitej Polskiej. W ten sposób ponownie potwierdzimy oddanie jedności i ciągłości narodowej oraz gotowość stawienia czoła nadchodzącym wyzwaniom. Polska czeka, a my powinniśmy być gotowi."
STE_reform_the_12th_mechanized_brigade: "Odtworzenie 12 Dywizji Zmechanizowanej"
STE_reform_the_12th_mechanized_brigade_desc: "Trwa odbudowa konwencjonalnego polskiego wojska. Zacznijmy od 12 Dywizji Zmechanizowanej, jednostki Sił Zbrojnych RP stacjonującej w okolicach Szczecina. Podczas interwencji dywizję zaskoczono w mieście i rozbito. Zaledwie kilka jej fragmentów zdołało wycofać się w głąb Polski, gdzie dzielnie walczyły z Niemcami zarówno na froncie, jak i w działaniach partyzanckich. Część żołnierzy oraz oficerów dywizji stworzyła fundament Gwardii Gryfickiej. Ich poświęcenie zostanie należycie uhonorowane."
STE_dispersed_manufacturing: "Poligon drawski"
STE_dispersed_manufacturing_desc: "Borne Sulinowo wraz z pobliskim poligonem drawskim jest doskonałym miejscem na utworzenie instytutu wojskowego skupionego na zabezpieczeniu naszej przewagi technicznej na polu bitwy. Izolacja terenu, istniejąca infrastruktura i historia wojskowa sprawiają, że świetnie nadaje się do zaawansowanych badań, eksperymentów oraz szkolenia. Instytut stanie się ośrodkiem innowacji, w którym będziemy opracowywać nowe doktryny, testować powstające technologie i udoskonalać podejścia taktyczne odpowiadające wyjątkowym wyzwaniom. W epoce, w której o sukcesie często decydują informacja, mobilność i precyzja, utrzymanie przewagi technicznej będzie kluczowe dla długoterminowego sukcesu strategicznego pomorskiego wojska."
STE_borne_sulinowo_compound: "Wojna ludów i spraw"
STE_borne_sulinowo_compound_desc: "Nie jest to wojna wodzów ani książąt, dynastii czy narodowych ambicji; jest to wojna ludów i spraw. Niezliczeni ludzie nie tylko na tej ziemi, lecz w każdym kraju będą wiernie służyć podczas wojny, choć ich imiona nigdy nie zostaną poznane, a czyny zapisane. To Wojna Nieznanego Żołnierza. Niech jednak wszyscy walczą, nie uchybiając wierze ani obowiązkowi, a mroczna klątwa Upadku zostanie zdjęta z naszej epoki. Polska powstanie!"
STE_call_of_the_sea: "Władcy mórz"
STE_call_of_the_sea_desc: "Jako jedno z zaledwie dwóch województw z niczym nieograniczonym dostępem do Morza Bałtyckiego mamy rzadką i kluczową przewagę, której nie wolno zmarnować. To nasza chwila, by odzyskać morskie dziedzictwo i zbudować flotę godną prawdziwego następcy państwa polskiego. Morze nie jest tylko granicą; jest linią życia oraz drogą ku handlowi, wpływom i zasięgowi wojskowemu.\n\nPotężna marynarka będzie jednocześnie tarczą i włócznią: ochroni wybrzeże, zabezpieczy kluczowe szlaki żeglugowe i rozciągnie naszą siłę na cały region Bałtyku. Stocznie trzeba ożywić albo zbudować od nowa, założyć akademie morskie i wyszkolić dumny korpus oficerski zdolny dowodzić potężnymi siłami morskimi."
STE_restore_captured_warships: "Olbrzymie zamki ze stali..."
STE_restore_captured_warships_desc: "Większość watażków skupia się na budowie jednostek przeznaczonych wyłącznie na rzeki i śródlądowe drogi wodne, gdyż tylko do nich mają dostęp. My musimy jednak mierzyć wyżej i spoglądać dalej niż na najbliższą przyszłość. Nasza wizja powinna sięgać dalej od ich marzeń. Zbudujemy okręty zdolne działać nie tylko na rzekach, ale również na otwartym morzu - jednostki o zasięgu, wytrzymałości i sile pozwalających bez trudu przemierzać Bałtyk.\n\nAmbicja wykracza poza sam transport czy obronę; dotyczy długoterminowych celów. Gdy inni ograniczają się do śródlądowych potyczek, my będziemy władać wybrzeżami. Gdzie inni budują małe łodzie, my stworzymy prawdziwą marynarkę."
STE_dabie_lake_submarine_tests: "Testy okrętów podwodnych na jeziorze Dąbie"
STE_dabie_lake_submarine_tests_desc: "Na spokojnych, osłoniętych wodach jeziora Dąbie i Zalewu Szczecińskiego rozpoczniemy kluczowe zadanie prób oraz udoskonalania floty podwodnej. Te wewnętrzne morza zapewniają idealne warunki eksperymentów, szkolenia i innowacji, z dala od zagranicznego nadzoru oraz ingerencji. To tutaj zostanie wykuty cichy kręgosłup przyszłej marynarki.\n\nOkręty podwodne nie są jedynie bronią działającą z ukrycia. Możemy dzięki nim odebrać wrogim flotom swobodę ruchu, przecinać szlaki zaopatrzeniowe i uderzać z głębin z niszczycielską precyzją. Jako pierwszy krok na drodze ku prawdziwej potędze morskiej program podwodny zagwarantuje, że Pomorze Zachodnie nie będzie jedynie bronić wybrzeża, lecz zapanuje nad morzem za nim."
STE_all_the_aces: "...przemierzające mgliste morze"
STE_all_the_aces_desc: "Rzeki mogą należeć do watażków, lecz morze będzie nasze. Z każdą położoną stępką i każdym spuszczonym na wodę kadłubem Pomorze Zachodnie rośnie nie tylko jako potęga lądowa, ale również siła, która zapanuje nad Bałtykiem. Nasze stocznie wypełni wspólny cel, porty zaroją się od stali i marynarzy, a sztandar załopocze nad każdym zakątkiem tych zimnych północnych wód. Inni mogą śnić o wybrzeżu, my będziemy nim władać. Niech wszyscy wiedzą, że przeznaczeniem Pomorza Zachodniego jest panowanie nad falami!"
STE_formoza_training_facility: "Będziemy walczyć na plażach"
STE_formoza_training_facility_desc: "Marynarkę musi wspierać dobrze wyszkolona piechota morska, gotowa w każdej chwili przyjść z pomocą wojskom lądowym. Mając za sobą zdolną i niezłomną flotę, będziemy mogli uderzyć szybko oraz zdecydowanie na dowolne wybrzeże i w dowolnej chwili.\n\nElitarni marines będą czymś więcej niż żołnierzami: staną się grotem naszej potęgi desantowej i opanują zarówno morze, jak i brzeg. Czy będą zabezpieczać kluczowe porty, atakować za liniami wroga, czy utrzymywać strategiczne wyspy, ucieleśnią zasięg oraz elastyczność morskiej armii."
STE_the_hun_at_our_throat: "Hun u bram"
STE_the_hun_at_our_throat_desc: "Jeżeli Niemcy nie zostaną pokonane w sposób niepozostawiający miejsca na wątpliwości ani spory; jeżeli straszliwa logika wydarzeń nie przekona ich, że chwały własnego narodu nigdy nie osiągną przemocą; jeżeli ich zdolność prowadzenia wojny nie zostanie wyraźnie ograniczona - odnowienie konfliktu wydaje się nieuniknione. Historia pokazała, że połowiczne środki i niejednoznaczne wyniki jedynie zasiewają ziarna przyszłej agresji. Jeśli pozwolimy Niemcom uznać porażkę za tymczasową albo niepełną, ideologia napędzająca militaryzm i podbój przetrwa pod powierzchnią, gotowa wybuchnąć ponownie. Tylko decydujący, niebudzący wątpliwości rezultat - militarny, polityczny i moralny - może zagwarantować trwały pokój."
STE_the_forges_roar: "Kuźnie ryczą"
STE_the_forges_roar_desc: "Aby sprostać olbrzymim wymaganiom nadchodzących bitew, musimy skupić się na skoncentrowanej i niezwykle wydajnej produkcji broni oraz amunicji. Przetrwanie i sukces zależą nie tylko od strategii i odwagi, lecz także od zdolności szybkiego oraz nieprzerwanego wyposażania wojsk. Przekształcimy wielkie kompleksy przemysłowe albo zbudujemy nowe, działające bez przerwy i wytwarzające narzędzia wojny. Od karabinów po pociski artyleryjskie, od elementów opancerzenia po zapasy paliwa - wszystko musi być produkowane z niestrudzoną precyzją. Będzie to wymagało pełnej mobilizacji bazy przemysłowej, bezprecedensowej koordynacji logistyki i oddanej siły roboczej zobowiązanej wywalczyć narodowe zwycięstwo."
STE_the_hammers_descend: "Młoty uderzają"
STE_the_hammers_descend_desc: "Skoncentrowanie możliwości przemysłowych w zaledwie kilku kluczowych miejscach byłoby poważnym błędem; stworzyłoby doskonały cel dla wrogów zewnętrznych i wewnętrznych. Zamiast tego fabryki zostaną zorganizowane w zdecentralizowane kompleksy rozrzucone po całej prowincji. Rozproszony model uczyni produkcję wojenną odporniejszą i znacznie mniej podatną na sabotaż. Jeśli jeden zakład padnie albo zostanie zniszczony, wpływ na cały wysiłek wojenny pozostanie niewielki i z łatwością zostanie przejęty przez resztę. W ten sposób zapewnimy ciągłość dostaw, elastyczność operacyjną oraz wytrzymałość strategiczną wobec każdego zagrożenia."
STE_never_forget: "Nigdy nie zapomnimy"
STE_never_forget_desc: "Niemiecka interwencja roztrzaskała Polskę na milion kawałków. Nie sposób nie zastanawiać się, czy bez zagranicznej ingerencji naród polski nie znalazłby sposobu na przezwyciężenie autorytarnego reżimu PiS. Odebrano nam tę możliwość, skradziono przyszłość i podkopano suwerenność. Po raz kolejny cofnęli nas ci, którzy twierdzili, że działają w imię porządku oraz stabilności. Nie pozwolimy, by stało się tak ponownie.\n\nNigdy nie zapomnimy tego, co nam uczyniono. Niemcy już zawsze będą uznawane za naszego wroga, a pewnego dnia poniosą konsekwencje swoich działań."
STE_rig_the_bridges_on_the_odra: "Zaminowanie mostów na Odrze"
STE_rig_the_bridges_on_the_odra_desc: "Wszystkie mosty na Odrze, będące kluczowymi drogami wjazdu z Niemiec na Pomorze Zachodnie, zostaną dokładnie przygotowane do natychmiastowego wysadzenia, gdyby pojawiły się jakiekolwiek oznaki wrogich ruchów od strony niemieckiej. Ważne przeprawy, które dawniej symbolizowały więzi i handel, muszą teraz służyć innemu celowi: obronie oraz odstraszaniu.\n\nNie możemy ponownie dać się zaskoczyć. Ładunki strategiczne i zespoły saperskie będą rozmieszczone w gotowości, dzięki czemu mosty zostaną zneutralizowane w jednej chwili i zatrzymają każdą nacierającą siłę. Szczecin wiele wycierpiał w przeszłości. Zbyt często upadał jako pierwszy i pierwszy krwawił. Tym razem jesteśmy gotowi."
STE_the_dobieszczyn_kolbaskowo_front: "Front Dobieszczyn-Kołbaskowo"
STE_the_dobieszczyn_kolbaskowo_front_desc: "Szczecin leży bardzo blisko niemieckiej granicy, a jego centrum znajduje się na lewym brzegu Odry, w przeciwieństwie do reszty Polski oddzielonej od Niemiec rzeką. Bliskość tworzy wyjątkową podatność, której musimy zaradzić. Należy pilnie ufortyfikować granicę i możliwie skutecznie ją zamknąć. Rozległa sieć bunkrów może powstrzymać każde niemieckie wtargnięcie.\n\nObrona musi być silna i nieprzenikniona, gdyż zależy od niej bezpieczeństwo Szczecina oraz całego regionu."
STE_the_hun_within: "Hun wewnątrz bram"
STE_the_hun_within_desc: "Zewnętrzne zagrożenie niemieckie już nas nie onieśmiela, lecz co z wrogiem wewnątrz granic? Wywrotowe elementy z Niemiec próbowały zakorzenić się w Szczecinie, podkopując jedność i siejąc niezgodę. Wyrwiemy je doszczętnie niczym chwasty zagrażające zdrowiu narodu. W tym celu utworzymy specjalną agencję wywiadowczą odpowiedzialną za rozpoznawanie, obserwowanie i szybkie usuwanie niepożądanych elementów.\n\nW imieniu Republiki ślubujemy chronić ojczyznę przed wszystkimi zagrożeniami wewnętrznymi. Nasza czujność zagwarantuje, że żadna obca ani krajowa siła nie osłabi ducha czy suwerenności Pomorza. Stoimy zjednoczeni i gotowi bronić tego, co prawowicie należy do nas."
STE_direct_control_from_the_spinach_palace: "Bezpośrednia kontrola ze Szpinakowego Pałacu"
STE_direct_control_from_the_spinach_palace_desc: "Aby upamiętnić udaną reformę wojskową, w rocznicę jej powstania ustanowimy nowe święto narodowe - Dzień Zwycięstwa.\n\nObywatele mogą spodziewać się barwnych festiwali i rozmaitych atrakcji przez cały dzień. Najważniejszym punktem obchodów będą jednak imponujące pokazy sprzętu wojskowego oraz wielka defilada wzdłuż Wałów Chrobrego. W widowiskowym wydarzeniu wezmą skoordynowany udział wojska lądowe, siły powietrzne i jednostki marynarki, prezentując siłę oraz jedność naszych sił zbrojnych.\n\nDzień Zwycięstwa będzie nie tylko świętem osiągnięć wojskowych, lecz także symbolem dumy narodowej, odporności i oddania tych, którzy chronią kraj."

### Koronacja
STE_delusions_of_grandeur: "Urojenia majestatu"
STE_delusions_of_grandeur_desc: "Co jest, kurwa? Co do cholery? W oszałamiającym i całkowicie niespodziewanym posunięciu prezydent Piotr Krzystek ogłosił zamiar koronowania się na Króla Pomorza. Cały naród zamarł z niedowierzania. Podziwiamy go. Szanujemy. Ale... król? Czy on oszalał? Oświadczenie transmitowane na żywo przez telewizję państwową wywołało wstrząs w całym regionie. Po ponad stu latach monarchia ma powrócić na ziemie Pomorza - nie pod sztandarem Hohenzollernów, lecz pod berłem rodu... Krzystków?\n\nPrezydent, a teraz być może samozwańczy monarcha, stanął przed narodem z królewską pewnością siebie. Gdy jednak wieść się rozchodziła, jedno pytanie rozbrzmiewało w każdym domu, każdej kawiarni i na każdym rogu ulicy:\n\n§RCzy on postradał zmysły?"
STE_at_the_helm: "U steru"
STE_at_the_helm_desc: "Nadszedł wreszcie czas, by całe Pomorze zjednoczyło się pod jednym sztandarem. Po latach walki, negocjacji i poświęceń rząd Piotra Krzystka mógł z dumą ogłosić pełne zabezpieczenie regionu. To, co niegdyś wydawało się odległym marzeniem, stało się rzeczywistością. Miasto po mieście, granica po granicy, lud Pomorza wybierał jedność zamiast podziału oraz nadzieję zamiast strachu. Teraz droga przed nami prowadzi ku zjednoczeniu całego narodu. Bez wątpienia jesteśmy silnym i prawowitym kandydatem do przejęcia trwałego dziedzictwa Rzeczypospolitej Polskiej."
STE_the_kings_new_clothes: "Nowe szaty króla"
STE_the_kings_new_clothes_desc: "Monarcha godny poważnego narodu musi być odziany w szaty odpowiadające jego pozycji. Choć prezydent Piotr Krzystek od dawna wzbudza szacunek w najlepszych garniturach, nawet najostrzejszy współczesny strój nie dorówna przepychowi i symbolice prawdziwych regaliów. Dlatego od tego dnia naszym najwyższym priorytetem będzie zlecenie najlepszemu krawcowi w regionie - a jeśli trzeba, poza granicami, nawet w całej Europie - uszycia królewskiego stroju godnego nowego Króla. Godność korony wymaga nie mniej niż wspaniałości."
STE_the_right_man_for_the_job: "Właściwy człowiek na właściwym miejscu"
STE_the_right_man_for_the_job_desc: "Ludność nie jest... do końca przekonana do planu Krzystka. Starannie odmierzona dawka strategicznego przekazu i patriotycznej narracji może jednak pomóc jej dostrzec cechy przywódcze przyszłego króla.\n\nChoć w sercach wielu nadal żyje sceptycyzm, historia pokazuje, że silne przywództwo często napotyka opór, nim zostanie zaakceptowane. Dzięki odpowiednio opowiedzianej historii ludzie mogą zacząć widzieć nie tylko polityka, lecz rodzącego się suwerena.\n\nStarannie przygotowanymi przemówieniami, kampaniami kulturalnymi i ponownym podkreśleniem tożsamości narodowej możemy odmienić opinię publiczną. W końcu królowie nie rodzą się w pałacach - wykuwa się ich w tyglu historii, a Krzystek, czy ludzie już to widzą, czy nie, stoi na progu tronu ukształtowanego własną wolą."
STE_royal_jewels: "Klejnoty królewskie"
STE_royal_jewels_desc: "Żadna monarchia nie jest pełna bez korony, symbolu władzy, jedności i tradycji. Piotr Krzystek rozważa dostępne możliwości, w pełni świadomy, że wybór tego wyjątkowego insygnium ma znaczenie nie tylko dla niego, lecz dla całego Pomorza. Korona musi ucieleśniać siłę, godność oraz historię narodu stojącego na progu nowej epoki. Czy powinien zamówić dla siebie nową, czy wykorzystać koronę należącą niegdyś do pomorskich Gryfitów? To trudna decyzja."
STE_home_of_the_griffins: "Dom Gryfitów"
STE_home_of_the_griffins_desc: "Każda monarchia potrzebuje rezydencji godnej swojej pozycji - miejsca odzwierciedlającego zarówno majestat władzy, jak i ciągłość historii narodowej. Najwłaściwszym wyborem jest Zamek Książąt Pomorskich. Położony w sercu Szczecina i przesiąknięty stuleciami tradycji, służył niegdyś za siedzibę dawnych książąt Pomorza.\n\nWłaśnie w tych pełnych historii salach Piotr Krzystek, przyszły Król zjednoczonego Pomorza, ustanowi swoją rezydencję. Posunięcie oznacza nie tylko symboliczny powrót monarchii do historycznych korzeni, lecz również ponowne wyobrażenie władzy królewskiej w XXI wieku."
STE_greasing_holy_hands: "Posmarowanie świętych dłoni"
STE_greasing_holy_hands_desc: "Katedra św. Jakuba w Szczecinie, niegdyś dumne duchowe serce regionu, odniosła znaczne uszkodzenia podczas interwencji i późniejszego powstania. Przez lata blizny na jej wiekowych murach pozostawały w znacznej mierze nienaprawione z braku funduszy, a historyczny zabytek trwał w cichym rozkładzie - jako ponure przypomnienie burzliwych czasów.\n\nGdy rozpoczyna się nowa epoka królestwa, podjęto zdecydowany wysiłek odnowienia symbolu naszego dziedzictwa. Krzystek zdołał zdobyć środki potrzebne do pełnej renowacji katedry. Plotka głosi, że wsparcie miało jeden warunek: w zamian za sfinansowanie napraw biskup szczeciński zgodził się przewodniczyć nadchodzącej koronacji Krzystka."
STE_the_grand_coronation: "Wielka koronacja"
STE_the_grand_coronation_desc: "Wszystkie najważniejsze postacie rządu i arystokracji zebrały się w potężnych, wielowiekowych murach Zamku Książąt Pomorskich. Dyplomaci, szlachta, dowódcy wojskowi i dostojnicy z całego regionu znaleźli się pod jednym dachem, a ich twarze wyrażały mieszaninę oczekiwania, ciekawości oraz ostrożnej nadziei. Ciężar historii spoczywa na każdym z nich, gdy przygotowują się być świadkami wydarzenia, które na zawsze odmieni bieg dziejów Pomorza. W tych murach przyszłość narodu zawisła na włosku, a wszystkie oczy skupiają się na człowieku, który wkrótce wystąpi naprzód, by zająć swoje miejsce w historii. Nawet ci, którzy wątpią, z dumą wołają:\n\n§RNiech żyje Król!"

