##Wydarzenia##

unification.74.t: "[GetNewspaper]Szczecin jednoczy Pomorze Zachodnie!"
unification.74.desc: "Na Pomorzu Zachodnim państwo polskie tak naprawdę nigdy nie umarło. Początkowo działająca w ukryciu Gwardia Gryficka odzyskała stolicę regionu podczas niemieckiego odwrotu, a następnie ruszyła naprzód, obalając jednego watażkę po drugim w bluźnierczym sojuszu z Gildią Hanzeatycką - ligą trzech korporacji dzierżących bezprecedensową władzę nad zachodniopomorską gospodarką. Młoda Republika staje dziś przed największą próbą: pogarszającej się sytuacji gospodarczej i społecznej towarzyszą zbliżające się wybory parlamentarne. Jeśli republika ma przetrwać, obecnie dość luźna kontrola władz centralnych nad monopolistycznymi korporacjami będzie musiała zostać znacznie wzmocniona. W przeciwnym razie sprzeczne interesy rozerwą raczkujące państwo, zanim zdąży ono na dobre stanąć na nogi."
unification.74.a: "O krok bliżej do odbudowy państwa polskiego."

super.74.t: "[GetNewspaper]Polska zjednoczona pod sztandarem [FROM.GetName]!"
super.74.desc: "Minęły lata, odkąd Polska jako państwo upadła, lecz Polska jako idea nigdy nie zginęła. Jak wyraźnie pokazał rząd pod przywództwem [FROM.GetLeader], zjednoczenie w ciągu jednego pokolenia nie było odległym marzeniem, lecz osiągalną rzeczywistością. Wbrew wszelkim przeciwnościom, w obliczu wrogów z każdej strony - zarówno wewnętrznych, jak i zagranicznych - [FROM.GetName] stoi dziś prawdziwie zjednoczone, przekuwszy naród polski i jego różnorodny lud w jeden monolit. Dowodzi tym samym, że zaufanie, jakim obywatele obdarzyli przywódców i przekonania swojego rządu, nie było chybione. Blizny po konflikcie będą goić się długo, lecz dzięki jedności wykutej w ogniu wojny przyszłość Polski rysuje się jasno. Gdy słońce wschodzi nad krajem, obywatele [FROM.GetName] spoglądają w przyszłość z dumą i otuchą, przeszedłszy ostateczną próbę polskiej wojny domowej."
super.74.a: "Nareszcie zjednoczeni."

