szczecin.1.t: "Ziemia obiecana"
szczecin.1.desc: "Spał, bo nie miał już siły opłakiwać swego marnego losu. Choć jego sny były pustymi, ciemnymi płótnami dla myśli, które nie potrafiły się uformować, odnajdywał w nich spokój. Po raz pierwszy od lat był wolny. Przynajmniej tak długo, jak długo mógł śnić. Nie czując nic ze swego nędznego, brudnego ciała, odrzucił wszelkie znane granice świadomości. Płynął przez ciemne płótna. Odwiedzał wspomnienia dawnego domu przy ulicy Kościuszki. Wspinał się na stare gzymsy kamienic, a potem skakał. Wiedział, że pusta betonowa ulica w dole nie powstrzyma go przed dalszym lotem w głąb snu. W bezkresną przestrzeń, pulsującą barwami w rytmie jego słabego serca. Na jej końcu krył się w swoim pokoju ufności i bezpieczeństwa. Był to dosłownie wyobrażony pokój, który często przywoływał podczas krótkich przerw na sen. Od czasów gimnazjum pomagał mu chować się przed okrutnym światem. Ilekroć działo się coś złego, wracał do domu i wtulał głowę w poduszki, jakby chował ją w przysłowiowy piasek. Naprawdę dobrze umiał śnić na jawie... ale nie tym razem.\n\nI wtedy dźwięk wdarł mu się z krzykiem do uszu. Okropny, głośny i durny dżingiel z telewizora, przed którym zasnął. Janusz otworzył obolałe oczy, powoli, lecz coraz dotkliwiej odczuwając narastający ból głowy, na który został skazany. I skazany całkiem słusznie - za nadmierne spożycie alkoholu. Gardło drapało go bez litości, a ledwo widoczna butelka Paulanera, wciąż zaciśnięta w dłoni, okazała się zupełnie pusta. Tak samo jak legion podobnych butelek, dumnie stojących wokół starej kanapy, na której spoczywał Janusz - bardziej jak zwłoki niż pracownik miesiąca. A jednak nawet w tym żałosnym stanie nadal był właśnie nim: niedawno wybranym najlepszym palaczem kotłowym SEC w Stettinie. Miał dane od Boga prawo świętować jako jeden z nielicznych Polaków wciąż cenionych w tym ponownie niemieckim mieście. Przynajmniej tak to widział. Może i nie wypłacili mu upragnionej premii, ale rzucone mu bony zakupowe skwapliwie wydał do ostatniego. Dobrze, że sklep, w którym ich użył, niespecjalnie wybrzydzał, co dokładnie kupuje ani ile ma to alkoholu. Czuł się szczęśliwy, a przynajmniej chciał się tak czuć. Musiał jednak zrobić sobie przerwę. Jego stare ciało nie zniosłoby kolejnej butelki ambrozji, więc pozostawało tylko siedzieć, czekać i oglądać wrzeszczący przed nim telewizor. Dźwięk i światło programu Deutsche Welle wypełniły zaciemniony pokój. A na ekranie płaskiego telewizora był on:\n\n\"...istotnie, państwa zmartwienia dobiegły końca. Jako mianowany gubernator nadal będę troszczył się o wzrost gospodarczy i integrację miasta\" - oznajmił z dumą Christian Lindner. Janusz słuchał głosu, do którego wyniosłego tonu zdążył już przywyknąć.\n\"Obiecuję, że odtąd tę ziemię i jej mieszkańców czekają wyłącznie dobre czasy. Jest się z czego cieszyć...\"\n\nNiestety następnego dnia mężczyznę zwolniono z pracy. Musiał ustąpić miejsca komuś młodszemu i sprawniejszemu..."
szczecin.1.a: "Gott sei Dank. Verdammt, das ist echt geil."

szczecin.2.t: "Nieproszone wtargnięcie"
szczecin.2.desc: "Słoneczny dzień w Stettinie. W sam raz, by usiąść wygodnie i docenić cywilizacyjny wymiar europejskiej misji pokojowej. Niestety dla Helmutha i jego kolegów z taktycznej jednostki antyterrorystycznej był to dzień, w którym należało odpowiedzieć na wezwanie obowiązku. Tajny informator przekazał wiadomość o kryjówce partyzantów.\n - Niewdzięczni Polacy - pomyślał Helmuth. Po raz kolejny ich żałosna Rzeczpospolita okazała się Saisonstaat, a zamiast dziękować za profesjonalną i szybką niemiecką pomoc, buntują się przeciw naszej życzliwej administracji.\n\n Jego oddział zbliżył się do pozycji w Kreckow na obrzeżach Stettina. Według danych wywiadowczych podejrzani ukrywali się w starych bunkrach z czasów II wojny światowej. Jak zwykle Polacy woleli nostalgię i patos od funkcjonalności i dyskrecji. Każdy żołnierz zajął stanowisko, aby żaden zdrajca nie zdołał uciec ani przeprowadzić skutecznego kontrataku. Dowódca dał Helmuthowi znak, by podszedł do bazy rebeliantów i ocenił zagrożenie. Cichy jak lampart, Helmuth przysunął się bliżej nadgryzionych czasem ceglanych ścian bunkra.\n\"Bij Niemca!\" \"Gonić Szwabów!\" \"Strzelaj!\" \"Strzelaj!\"\nMłody policjant nie rozumiał wszystkich wypowiadanych słów. Mimo to doszedł do przerażającego wniosku, że Polacy w bunkrze szykują się do egzekucji niewinnego, pojmanego niemieckiego osadnika. W ułamku sekundy dał sygnał kapitanowi, który z kolei zezwolił innemu członkowi grupy uderzeniowej na użycie granatów gazowych.\n - Na ziemię! - krzyknęli po polsku antyterroryści, gdy granaty wybuchły, rzucając podejrzanych na bruk.\nZatrzymano czterech mężczyzn i jedną kobietę. W bazie znajdował się jakiś sprzęt łączności z niezależnym źródłem zasilania oraz zapas koktajli Mołotowa. Tyle przynajmniej dało się ustalić w całym tym dymie.\n Co dziwne, nigdzie nie było ofiary przestępców. Właściwie terroryści nie mieli na sobie żadnego wojskowego wyposażenia ani mundurów i nie wyglądali też na fizycznie zdolnych do wymagającego życia partyzantów. Dopiero gdy gaz zaczął się rozwiewać, policjanci zrozumieli, co naprawdę zaszło. Sprzęt łączności okazał się samodzielnie naprawionym telewizorem. Zapas mołotowów był w istocie ogromną stertą butelek po bimbrze. Helmuth, nadal ostrożny, podszedł do ekranu z pistoletem maszynowym gotowym do strzału. Okazało się, że Polacy oglądali jedynie archiwalny mecz Polska-Niemcy z 2014 roku.\n - To jakaś melina, a nie baza rebeliantów - świeży rekrut stwierdził wreszcie rzecz oczywistą.\nNiedługo później jeden z zatrzymanych, otrząsnąwszy się z pierwszego szoku, zaczął wyjaśniać nieporozumienie. Prawdopodobnie. Alkohol i paląca wściekłość czyniły szeleszczącą polszczyznę jeszcze mniej zrozumiałą.\n - Nadal możemy ich aresztować, panie kapitanie - Helmuth próbował ratować sytuację. - Wobec doniesień o rosnącej w siłę grupie partyzantów Brzęczka w głębi Polski możemy to podciągnąć pod działalność wywrotową.\n - Nie ma sensu - odparł z westchnieniem dowódca. - Są niewinni. To tylko nastawiłoby Polaków przeciw nam. Panowie, kończymy. Czas porozmawiać z chłopakami z kontrwywiadu."
szczecin.2.a: "\"Zwijamy się\"."

szczecin.3.t: "Nasze podziemie"
szczecin.3.desc: "Serce Jacka pędziło jak samochód na torze wyścigowym. Nie tak miało być - pomyślał, przedzierając się przez gęsty Las Arkoński. Szybka akcja partyzancka zmieniła się w rzeź. Słyszał, jak niemieccy żołnierze go doganiają. Bał się. Jeszcze kilka lat wcześniej był zwykłym licealistą z marzeniami, perspektywami i świetlaną przyszłością. Gdy Polska zaczęła się rozpadać, stracił wszelką stabilność. Po tragicznej śmierci rodziców podczas niemieckiej inwazji pragnął zemsty. Partyzantka łagodziła jego ból.\n\nMimo wszystko nigdy nie był na to gotowy. Ich działalność polegała przede wszystkim na dewastowaniu budynków rządowych i rozwieszaniu w mieście plakatów przeciw Lindnerowi, co przychodziło im dość łatwo. W najgorszym razie mógł spędzić kilka dni w więzieniu. Nie mieściło mu się w głowie, że będą strzelać. Nagle potknął się o wystający korzeń i upadł. Jacek nie wiedział jeszcze, że to już koniec. Kiedy wstał i próbował wyrwać się oprawcom, kula przeszyła mu nogę.\n\nWydał z siebie zduszony krzyk i znów runął na ziemię. Nieznośny ból rozlał się po całym jego ciele. Pośród tej agonii przed oczami przemknęły mu najszczęśliwsze wspomnienia. Ukochana Kasia, wakacje w Kołobrzegu z nieżyjącymi już rodzicami, włóczęgi po ulicach Szczecina z kolegami z klasy - wszystko zdawało się gorączkowym snem. Rozkazy wykrzykiwane przez kapitana nadciągających żołnierzy dobiegały jakby z innego świata.\n\nRzeczywistość wróciła wraz z brutalnym kopniakiem Niemca w brzuch. Jacek zaniósł się gwałtownym kaszlem.\n- A cóż my tu mamy? - zapytał żołnierz z mieszaniną arogancji i ciekawości. - Kolejny polski śmieć?\nŻołnierze osaczyli młodego partyzanta ze wszystkich stron.\n\n- Ja się nim zajmę, Hans. Nieznoszący sprzeciwu głos odezwał się z tyłu i szybko zbliżył do miejsca zdarzenia. Niemiecki oficer przykucnął przed Jackiem i spojrzał mu prosto w oczy.\n- Witaj, chłopcze. Jak masz na imię?\n- Jacek, proszę pana - odpowiedział, a głos załamał mu się ze strachu.\n- Jestem pułkownik Helmuth Bluthgeld. Powiem jasno: w najbliższych chwilach twoje życie będzie zależeć wyłącznie od tego, czy będziesz ze mną szczery. Powiedz mi, proszę, gdzie znajduje się wasza główna baza, a puszczę cię wolno. To takie proste - uśmiechnął się.\n- Nie wiem, proszę pana; nigdy nie zdradzali mi wszystkich szczegółów.\n\nBluthgeld rzucił swoim ludziom spojrzenie, jakby wydawał niemy rozkaz.\n - Nie, nie, proszę! - krzyknął rozpaczliwie Jacek. - Jest dom na Warszewie, przy ulicy Urlopowej, w którym wszyscy się spotykaliśmy. Błagam, nie zabijajcie mnie.\n\nPułkownik udał ciche westchnienie ulgi.\n\n- Tak jak obiecałem, puszczę cię wolno.\n\nZaledwie kilka sekund później Helmuth sięgnął po broń. Jacek ledwo pojął, co się dzieje. Strzał poniósł się po rozległym lesie. Zgasło kolejne niewinne życie, dołączając do wielu innych, które spotkał ten sam los."
szczecin.3.a: "Okrucieństwo nie zna granic."

szczecin.4.t: "Ausweis, bitte"
szczecin.4.desc: "Major Andrzej Biedrzycki wpadł we wściekłość, gdy niemiecki garnizon na Hansa Brücke zatrzymał go na kilka godzin. Choć miał wszystkie dokumenty niezbędne do przejazdu, przetrzymywano go - zapewne ze złośliwości wobec jednego z nielicznych wysoko postawionych Polaków pozostałych w szczecińskim dowództwie wojskowym. Zadbano również, by poczuł się kimś gorszym, sadzając go na boleśnie niewygodnym taborecie w słabo oświetlonym pokoju przesłuchań.\n\nWracał właśnie z \"podróży służbowej\" na wschodni brzeg miasta. Oficjalnie odbierał rozkazy ze sztabu wojskowego Eurokommissariat Westpolen, lecz prawdziwym celem wizyty było spotkanie z generałem Szymonem Koziatkiem, który - podobnie jak wielu innych Polaków wciąż służących machinie EKW - był rozczarowany reżimem Tuska. Z zebranych informacji jasno wynikało, że europejskie panowanie w Szczecinie rzeczywiście dobiega końca. Wkrótce niemiecki garnizon miał wycofać się do Berlina, dając mieszkańcom Szczecina szansę na odzyskanie miasta. Pierwszym i najważniejszym zadaniem Biedrzyckiego było powiadomienie Gwardii Gryfickiej o nadchodzącej sposobności do rewolucji.\n\nAndrzej nie był rewolucjonistą. Kiedy nadeszły wieści o niemieckiej interwencji, wierzył, że Szczecin z czasem powróci pod polskie rządy drogą stopniowych, ewolucyjnych przemian. Mylił się jednak - Niemcy wypatroszyli polską administrację, a Polaków uczynili obywatelami drugiej kategorii we własnym mieście. A raporty o antypartyzanckich operacjach Helmutha Bluthgelda? Bezsensowne okrucieństwo zadawane jego rodakom poruszyło go do głębi. Właśnie dlatego skontaktował się ze Gwardią Gryficką: aby odkupić swoje winy.\n\nKontrola trwała ponad godzinę. Biedrzycki gotował się w środku, lecz dla dobra misji zachował spokój. Oby ostatni raz musiał znosić takie traktowanie. Kiedy wreszcie pozwolili mu przejechać, tylko uśmiechnął się pod nosem, wsiadł do wojskowego G-Wagena i ruszył w stronę zachodniego brzegu.\n\nSzczecin nie był już miastem, które znał przez całe życie. Choć wojna nie wyrządziła mu poważnych szkód, problem tkwił w atmosferze. Życie w mieście napawało niepokojem - zamożni Niemcy zajęli domy należące niegdyś do polskich elit, a obce wojska pilnowały każdego zaułka. Mieszkać w Szczecinie znaczyło siedzieć na beczce prochu gotowej w każdej chwili eksplodować. Gdy zbliżał się do wyznaczonego miejsca spotkania, serce waliło mu jak oszalałe. W obawie, że ktoś go śledzi, major przed ostatnim zakrętem co najmniej tuzin razy sprawdził każde lusterko.\n\nWszedł do pozornie opuszczonego domu na Gumieńcach. Tam, na zniszczonej kanapie, czekał jego łącznik. Potwierdziwszy prostym hasłem wierność sprawie, Biedrzycki przekazał niezbędne informacje o niemieckim odwrocie. Potem obaj mężczyźni tylko skinęli głowami i pośpiesznie opuścili dom.\n\nKiedy jechał na posterunek, już wiedział."
szczecin.4.a: "\"Dziś dokonałem czegoś naprawdę znaczącego\"."

szczecin.5.t: "Sehr geehrter Herr Lindner..."
szczecin.5.desc: "Siedząc bezczynnie w gabinecie, Christian Lindner czuł się jak wrak człowieka. Zgarbiony, z dłońmi przy skroniach, nerwowo przyśpieszonym oddechem i drżeniem prawej nogi, którego za nic nie potrafił opanować. W południe Eurogoverneur pił już czwartą filiżankę podwójnie parzonej czarnej kawy. Nie żeby potrzebował jej, by zachować czujność - uporczywe poczucie nadciągającej katastrofy z nawiązką wystarczało, aby nie zmrużył oka ani za dnia, ani tym bardziej w nocy. Wiedział, że jego reżim jest na ostatnich nogach, a jednak wszędzie wokół widział jedynie apatię. Obojętność. Mimo nieustannych protestów, mimo uzbrojonych powstańców otwarcie domagających się jego obalenia, nikt nie przejmował się nim na tyle, by stanąć w jego obronie. To, że Vaterland po raz kolejny go zawiódł, nie było niespodzianką, choć raniło resztki patriotycznej dumy Lindnera. Nie, najbardziej drażniła go bezczynność rzekomych \"partnerów\". Mieli do stracenia równie wiele, a mimo to postanowili zostawić całą robotę jemu? A teraz, pomimo kolejnych ponagleń i błagań, po prostu... go ignorowali? Dlaczego nie mieli nawet przyzwoitości COKOLWIEK odpowiedzieć?\n\nBez względu na przyczynę elegancko wystylizowany list leżący przed Lindnerem musiał zawierać przynajmniej część odpowiedzi. Podziwiając jego smukły projekt, oszpecony jedynie pojedynczym zagięciem na jednym z rogów, wyczerpany polityk obchodził się z pismem niezwykle ostrożnie pomimo widocznego drżenia. Niemal poczuł się winny, kiedy złamał nieskazitelną pieczęć z trójzębem. Po głębokim wdechu zaczął czytać.\n\nSehr geehrter Herr Lindner,\n\nMamy nadzieję, że niniejszy list zastaje Pana w dobrym zdrowiu. Choć wyrażamy najgłębsze współczucie dla Pana i Pańskiego niepewnego położenia, z przykrością informujemy, że niedawny wzrost niestabilności zmusił nas do czasowego zawieszenia bieżącego partnerstwa oraz jednostronnego unieważnienia wszelkich porozumień - pisemnych i ustnych - z administracją Freistadtu. Jeżeli sytuacja na to pozwoli, pozostajemy otwarci na odnowienie dotychczasowych stosunków w bardziej sprzyjającym terminie. Do tego czasu uprzejmie prosimy o powstrzymanie się od wszelkich prób kontaktu z naszą organizacją bądź którymkolwiek z jej członków. Nasi przedstawiciele skontaktują się z Panem, gdy będziemy gotowi powrócić do negocjacji.\n\nDla jasności poniżej wyszczególniono umowy, które z dniem... tracą moc.\n\nNie chcąc czytać całej listy ciosów, jakie proklamacja Hanzy zadała jego administracji, Lindner - ogarnięty wściekłością na ich bezczelną zdradę - uciekł się do najgwałtowniejszego wybuchu, na jaki było go stać w stanie rezygnacji. Z całej siły zgniótł list, odrzucając wszelką troskę o jego walory estetyczne, po czym niedbale cisnął nim w stronę najbliższego kosza. Papier odbił się od metalowej obręczy i spadł na podłogę. Urzędnik wpatrywał się w nieznośny nieporządek, jaki wniósł do jego schludnego miejsca pracy, aż w końcu westchnął, wstał, umieścił go porządnie tam, gdzie było jego miejsce, i pokonany opadł z powrotem na fotel."
szczecin.5.a: "W głębi duszy już wiedział, że to koniec."

szczecin.6.t: "Stanowczo proszę"
szczecin.6.desc: "Christian Lindner miał dość Gildii Hanzeatyckiej. Jego państwo stało na skraju upadku, a wsparcie Gildii było znikome i pełne pustej retoryki. Na miłość boską, Niemcy mieli go wkrótce porzucić, a jedynymi siłami zdolnymi powstrzymać upadek miasta były te trzy potężne korporacje. Krążąc od kąta do kąta po gabinecie, rozmyślał nad możliwym rozwiązaniem tej rozpaczliwej sytuacji. Po długim namyśle postanowił napisać stanowczy list. W jego przekonaniu tylko tak mógł zmusić je do działania.\n\nZanim zaczął, przeszedł się krótko po ratuszu. Wieść o zbliżającej się ewakuacji rozeszła się błyskawicznie, a wielu pracowników już pakowało i pieczętowało najważniejsze dokumenty. Zdawało się, że nikt nie wierzy w jego zwycięstwo. Chciał ogłosić, że wygra, że udowodni błaznom z Berlina, jak bardzo się mylili, i utrzyma miasto z ich pomocą lub bez niej. W głębi duszy wiedział jednak, że to tylko gorączkowe majaczenie, a zguba jest już blisko.\n\nPo powrocie do przestronnej siedziby nalał sobie whisky. List, który zamierzał napisać, miał rozstrzygnąć o jego przyszłości, dlatego chciał dopracować go najlepiej, jak potrafił. Pierwsze zdania przychodziły powoli, lecz wkrótce wylał się z niego potok słów.\n\nLiebe Mitglieder der Hanse,\n\nNasza współpraca w istotny sposób ukształtowała dzisiejszy Szczecin. Połączona siła rządu i Gildii była czymś więcej niż tylko koniecznym partnerstwem. Po co więc teraz to zmieniać? Dlaczego postanowiliście zdradzić mnie i naród niemiecki? Zapewniłem wam wpływy, zasoby i możliwości rozwoju w moim mieście. I tak mi się odpłacacie? Ignorując potrzeby państwa i jego ludności? Wolne Miasto Stettin upada, a wy w istocie nie robicie nic, aby temu zapobiec. Jestem głęboko rozczarowany waszym postępowaniem. Mimo wszystko pamiętam, co uczyniliście dla miasta. To wasza ostatnia szansa, by ponownie przemyśleć i rozważyć swoje decyzje. W nadchodzących dniach oczekuję waszego wsparcia. Zapewniam, że nasze partnerstwo może przynieść wam znaczne korzyści, jeśli zastosujecie się do bardzo prostych zasad.\n\nDla jasności i łatwiejszego zrozumienia wyszczególniłem je poniżej w dogodnej formie...\n\nSporządzenie należytego listu zajęło mu kilka godzin, lecz po licznych poprawkach był wreszcie gotowy. Lindner czuł zmęczenie zmieszane z satysfakcją. Zawsze postrzegano go jako spokojnego i uległego, lecz teraz pokazał prawdziwą siłę. Nie był słaby. Bez względu na to, czy próba naprawienia miasta skończy się powodzeniem, czy porażką, nie cofnie się. Nadszedł czas na zdecydowane kroki, które rozwiążą sytuację. Christian z pewnością wzbudzi zazdrość niemieckich kolegów - albo umrze wraz z tym nieudanym eksperymentem."
szczecin.6.a: "Żałosny człowiek."

szczecin.7.t: "Cena, którą trzeba zapłacić"
szczecin.7.desc: "W samym centrum Szczecina, jak każdego dnia punktualnie o siódmej rano, budził się do życia niewielki lokal. Bar \"Pasztecik\" to mała rodzinna restauracja założona w latach sześćdziesiątych. Od dziesięcioleci przyjeżdżali tu ludzie z odległych zakątków miasta i spoza niego po wysokiej jakości smażone przekąski. Dzisiejszy dzień nie różnił się od innych: obecny właściciel zwinął pancerne rolety i szeroko otworzył drzwi. Od chwili powstania maleńki bar przetrwał konflikty i kryzysy, a niedawny upadek nie był niczym nadzwyczajnym. W końcu ludzie muszą jeść, jak zawsze mawiał dziadek - pomyślał właściciel.\n\nGdy stał przed lokalem, jego uwagę przyciągnęła starsza pani w czerwonej sukni i puszystym futrze, która z pomeranianem u boku zbliżała się do baru. Po pustej, spowitej poranną mgiełką ulicy niosły się stukot obcasów i piskliwe szczekanie.\n- Pani Bernadeto, dzień dobry, co za przyjemność panią widzieć - zawołał właściciel, skłaniając przed damą głowę.\n- Ale pan dżentelmen, jak pana ojciec. Dzień dobry, panie Witoldzie - odpowiedziała, z wdziękiem przytakując; jej siwe loki lekko podskoczyły.\n- Zgodnie z życzeniem przygotowałem już pani codzienne zamówienie i zapakowałem nieco więcej dla małego Reksia - Witold uśmiechnął się ciepło i zaprosił kobietę do środka, a ta weszła.\n- Ludzie mówią, panie Witoldzie, że nowy rząd przejmuje małe zakłady spożywcze takie jak pański, żeby wykarmić masy - wyszeptała.\n- Proszę pani, nasz mały lokal przetrwał komunizm i upadek, przetrwamy też to - odpowiedział z wymuszonym uśmiechem, podając jej papierową torbę z jedzeniem oraz kubek gorącego barszczu.\n- Tym razem na koszt firmy. Dziękuję za nieustanne wsparcie.\n- Niech cię Bóg błogosławi, młody człowieku - posłała mu pokrzepiający uśmiech i wyszła, pozostawiając po sobie silny zapach perfum.\n\nNagle przed barem zatrzymał się znajomy furgon, lecz zamiast wesołego pana Tadka z miejscowej piekarni wysiadł z niego oddział uzbrojonych policjantów. Do lokalu prowadził ich mężczyzna w czarnym garniturze, a w odwodzie czekała mała grupa inżynierów, która przyjechała drugim samochodem.\n- W czym mogę panom pomóc? - odezwał się właściciel niewinnym, może nawet naiwnym tonem.\n- Zgodnie z zarządzeniem rady miasta mamy zarekwirować wszelką żywność i środki służące do jej produkcji, a prawo zobowiązuje pana do współpracy - oznajmił chłodno i rzeczowo mężczyzna w garniturze, kładąc na ladzie niechlujnie wydrukowany nakaz z pieczęcią miasta u dołu.\n- Nie, nie, nie, nie, nie, nie... - zaczął błagać Witold - Poczekajcie, czekajcie, czekajcie!\nJego krzyki zdały się jednak na nic. W mgnieniu oka funkcjonariusze wynieśli ze sklepu wszystko, co nadawało się do jedzenia, a inżynierowie rozmontowali sześćdziesięcioletnią maszynę do pasztecików."
szczecin.7.a: "A potem zostawili mu jedynie ubranie, które miał na sobie."

######WYBORY EVENT
szczecin.8.t: "§PTemat do przemyśleń§!"
szczecin.8.desc: "Bogucki stał na skleconym naprędce podium na rynku w Pyrzycach, niegdyś wiernym bastionie partii rządzącej. Obok dawnych haseł o suwerenności i dyscyplinie wciąż powiewały biało-niebieskie sztandary, choć ich barwy wydawały się już nieco bardziej wyblakłe.\nPrzemawiał do zgromadzonych z zapałem człowieka, który nadal wierzył we własne słowa. Obiecywał chronić polską tradycję - nie jako odległy ideał, lecz jako żywą prawdę. Prawdę obecną w chlebie powszednim, wypowiadaną językiem dziadków, tkwiącą w więzi między sąsiadami i godności uczciwej pracy.\n- To - powiedział, zataczając dłonią łuk nad tłumem - jest Polska. Nie ta z raportów pisanych w Brukseli. Nie ta reklamowana w telewizji między niemieckim serialem a amerykańskim proszkiem do prania. Nasza Polska. Ta zbudowana spracowanymi dłońmi i niesiona w modlitwie. -\nMówił o konnych wozach na brukowanych drogach. O wiejskich kapliczkach, w których wciąż biły dzwony. O dożynkach obchodzonych na tych samych polach, które uprawiały całe pokolenia. O Polsce dla Polaków.\nPotem przyszły pytania.\nAtmosfera się zmieniła. Oklaski przerzedły. Twarze, przed chwilą pełne nadziei, teraz wyglądały na umęczone. Matki mocniej ściskały dłonie małych dzieci. Starcy wspierali się na wysłużonych laskach. Sklepikarze stali ze skrzyżowanymi ramionami.\nNie chcieli już poezji.\nNaprzód wystąpiła starsza kobieta. Jej twarz poczerwieniała od słońca i zmartwień. Głos przeciął ciszę. - Co pan zrobi, panie Bogucki, kiedy nie będziemy mieli czym wykarmić rodzin? -\nMówiła bez ogródek. Pola wysuszyła susza. Potem przyszły burze. Nawóz kosztował zbyt wiele. Żeby przeżyć, musieli podnieść ceny, ale nikt z miast nie kupował. Albo, co gorsza, wszystko wykupywała Hanza, konkretnie Netto. Po cenach tak niskich, że nie zwracał się nawet koszt ziarna.\nSpojrzała mu prosto w oczy.\n- Co pan zrobi, kiedy nie zostanie już nikt, kto obsieje pola? Kiedy nasze dzieci będą chodzić do szkoły w dziurawych butach, starzy ludzie zrezygnują z kolacji, a mężczyźni wylądują przy butelce, bo tylko ona została tania? -\nBogucki poprawił marynarkę. Przełknął ślinę. Tłum zamilkł.\nNie był już dumnym narodem w miniaturze. Tylko głodnymi, wyczerpanymi ludźmi, którzy czekali."
szczecin.8.a: "Podejmiemy wszelkie środki, by zapewnić uczciwy rynek rolny."
szczecin.8.b: "Nie możemy niczego obiecać..."
######

szczecin.9.t: "Wątpliwe bogactwa"
szczecin.9.desc: "- Raportuj - rzucił Piotr Krzystek do adiutanta wchodzącego do jego gabinetu.\n- Misja zakończyła się sukcesem. Oto szczegóły, panie prezydencie. - Mężczyzna położył teczkę na biurku Krzystka. - Wikingowie popełnili poważny błąd, żądając biżuterii zamiast banknotów. Skrzynie z kosztownościami były zbyt ciężkie, by sprawnie przewieźć je podczas odwrotu na kilku pozostałych statkach.\nNie potrafił ukryć rozbawienia. Krzystek odpowiedział zachęcającym uśmiechem.\n- Jesteście wolni.\n\nZostawszy sam, Krzystek usadowił się w najwygodniejszej pozycji, na jaką pozwalał jego gabinet. Było lepiej, niż oczekiwał. Nigdy nie przypuszczał, że odzyskają łupy zabrane przez Duńczyków. W myślach już malował perspektywy rozwoju Szczecina za pomocą dodatkowych środków skupionych w jego rękach. Oczywiście dopiero po tym, jak prezydent sam się wynagrodzi za to, że jego nieskazitelne rządy umożliwiły tak znakomite przeprowadzenie operacji wojskowej, która zwróciła pieniądze ludu do Szczecina...\n- Ach, racja. Lud - Krzystek sprowadził się na ziemię.\nMógł ukryć fakt, że skradzione dobra należały do jego obywateli. Danegeld funkcjonował mniej więcej jak podatek, a obszerna dokumentacja wskazywała, kto i co stracił, więc każdy mógł z łatwością zgłosić roszczenie do odzyskanej biżuterii lub pieniędzy.\n- Może dałoby się ukryć, że odzyskaliśmy kosztowności. - Nie żeby sprzeciwiał się zwracaniu ludziom ich prawowitej własności. Krzystek po prostu chciał rozważyć sytuację ze wszystkich stron. - Nie, zbyt ryzykowne.\nLudzie rozczarowaliby się, że niedawna wojna niczego im nie przyniosła. Ukrycie takiego skarbu wymagałoby też machinacji na czarnym rynku, które prasa mogłaby szybko ujawnić - samodzielnie albo z pomocą...\n - Gildii. - Korporacje z pewnością zechcą kawałek tego tortu za swoją \"szlachetną\" pomoc w obaleniu niemieckiej okupacji. Oczywiście gdybym zatrzymał pieniądze dla siebie, opłaciłyby agencje prasowe, żeby wałkowały temat do upadłego. Z drugiej strony, gdybym się z nimi podzielił, pomogłyby mi zatrzeć ślady.\n- Co tu zrobić..."
szczecin.9.a: "Może odmaluję Szpinakowy Pałac..."
szczecin.9.b: "To złoto należy do ludzi!"
szczecin.9.c: "Gildia mądrze zainwestuje te pieniądze"

szczecin.10.t: "Bitwa o Koszalin"
szczecin.10.desc: "Jerzemu Nowackiemu miasto nigdy nie wydawało się prawdziwe. Nie do końca. Nie od chwili, gdy Max Kolonko przybył na swych lśniących statkach i oznajmił mieszkańcom, że Koszalin stanie się \"Nowym Waszyngtonem Bałtyku\". Było to wiele miesięcy temu - kiedy w miejskich fontannach płynęła jeszcze woda, latarnie uliczne miały prąd, a w powietrzu unosiły się złudzenia i niemieckie siły okupacyjne.\n\nJerzy też kiedyś w to wierzył. Wierzyli wszyscy. Amerykańskie flagi. Strażnicy w niebieskich mundurach z plastikowymi uśmiechami. Wieczorne audycje \"Mówię Jak Jest\", w których Kolonko - ze swoim akcentem i idealnym oświetleniem - obiecywał postęp, burgery, kontrakty z Hollywood i świetlaną przyszłość jarzącą się czerwienią, bielą i błękitem. Ludzie śmiali się, śpiewali i wiwatowali, choć w brzuchach coraz bardziej burczało, a przerwy w dostawach prądu trwały coraz dłużej.\n\nZ czasem jednak blask zmienił się w szum. Drogi popękały. Import zamarł. Dziennikarze znikali. Książki płonęły. Na billboardach widniał napis \"Patriotyczna Rewolucja\", lecz oczy pilnujących ich mężczyzn mówiły co innego. Tak samo jak krzyki dobiegające z tyłu policyjnych furgonetek.\n\nMimo to ludzie czekali. Mieli nadzieję. Może Amerykanie naprawdę wrócą. Może następny konwój z pomocą przywiezie lekarstwa. Jedzenie. Cud.\nZamiast tego przywiózł czołgi ze Szczecina.\n\nGdy na przedmieściach rozpoczął się ostrzał, Jerzy siedział w piwnicy z żoną i córką. Pamięta drżenie betonu. Odgłos butów. Odległe odgłosy wystrzałów. Ale skończyło się szybko. Szybciej, niż ktokolwiek oczekiwał. \"Amerykańska Gwardia\" uciekła. Jedni się poddali. Inni próbowali wmieszać się w tłum. Jeszcze inni zginęli z karabinami nadal przewieszonymi przez plecy, zbyt oszołomieni, by zareagować.\n\nArmia Szczecina odniosła zdecydowane zwycięstwo w kluczowej bitwie na obrzeżach miasta. Po załamaniu się gwardzistów Kolonki jego siły rozproszyły się w chaosie. Z każdą minutą traciły teren i wycofywały się coraz dalej. Wykorzystując impet, szczecińska armia ruszyła naprzód i odbierała miasto dzielnica po dzielnicy. Jeden po drugim podpalano budynki rządowe, a symbole dawnego reżimu waliły się w gruzy.\n\nO świcie dym ciągnął ku niebu znad dawnego ratusza, przerobionego na pałac Kolonki. Budynek płonął. Zebrał się tłum. Mówiono, że uciekł poprzedniej nocy przebrany za księdza. Inni twierdzili, że zastrzelono go podczas próby ucieczki skradzionym śmigłowcem ONZ. Nikt nie znał prawdy. Na jego miejscu żołnierz ze Szczecina stanął na stosie gruzu i ogłosił miasto \"wyzwolonym\".\nWyzwolonym.\nSłowo zawisło ciężko w powietrzu.\n\nNiektórzy płakali. Inni bili brawo bez przekonania. Większość po prostu stała z oczami przygasłymi od lat fałszywych obietnic i upadku. Jerzy przyglądał się twarzom dookoła. Robotnicy. Wdowy. Dawni wyznawcy. Więźniowie snu, który obrócił się w popiół.\n\nKiedy czerwono-niebieski sztandar Rządu Tymczasowego zastąpił nad centrum administracyjnym gwiazdy i pasy, Jerzy czuł wyłącznie zmęczenie.\n\nKoszalin spłonął - nie tylko budynki, lecz również idea, którą próbował się stać. Parodia demokracji. Importowany sen. Dopiero teraz miasto naprawdę należało do nich.\n\nTeraz znów było po prostu Koszalinem. I może to wystarczało."
szczecin.10.a: "W samym sercu miasta krwawi rana"

szczecin.11.t: "W pogoni za szaleńcem"
szczecin.11.desc: "Wojciech Olszański, znany również jako Jaszczur lub Aleksander Jabłonowski, nie potrafił porzucić swoich ambicji. Wierzył, że Pomorze prawowicie należy do niego i że jest mu przeznaczone nim władać. W jego umyśle przeznaczeniem było mu przewodzić całemu krajowi, a nikt - ani jedna osoba - nie mógł stanąć mu na drodze. Jak to możliwe, że utracił ojczyznę i został skazany na błąkanie się po lasach niczym obłąkaniec? Kto za to odpowiadał? Słaby były prezydent Szczecina, który nie potrafił nawet utrzymać stanowiska po przybyciu Niemców? Do takiego obrotu spraw nigdy nie powinno było dojść. Zdrajcę popierali Niemcy i właśnie dlatego poniósł klęskę. Po raz kolejny czuł się zdradzony - tak samo jak naród polski.\n\nJeden po drugim tracił kontakt z pozostałymi oddziałami. Wkrótce zostali tylko on i dwudziestu ostatnich wiernych żołnierzy. Olszański był gotów spojrzeć śmierci w oczy, lecz nie zamierzał łatwo się poddać. Ostatni przyczółek sił Jaszczura został potężnie ufortyfikowany i szczecinianie musieliby się natrudzić, by go zdobyć. Jaszczurianie mogliby odnieść sukces, ale go nie odnieśli. Nie wszyscy żołnierze pozostali lojalni; jeden oportunista zawarł układ z rządem Krzystka i otworzył bramy. Obóz zalała fala żołnierzy.\n\nWojciech walczył ze wszystkich sił i położył trupem wielu przeciwników. Lata treningu dobrze go przygotowały. Jednak nawet z dziesiątkami podobnych sobie wojowników nie miał szans na zwycięstwo. Wrogowie byli zbyt silni - te dranie, zdrajcy i antypolacy. Jak mogli zdradzić własnych ludzi? W końcu został sam. Wkrótce zrozumiał, że kończy mu się amunicja.\n\nTo był koniec. Walka Wojciecha o wolność dobiegła końca. Przygotował się do odejścia z tego świata i włożył lufę pistoletu do ust. Gdy siły szczecińskie wyważyły drzwi, pociągnął za spust. Broń nie wypaliła.\n\n- O żesz kurwa - powiedział, nim powalili go na ziemię.\nDopadli go z brutalną siłą, ani przez chwilę się nie wahając. Jeden żołnierz kopnął niesprawny pistolet poza jego zasięg, a drugi zacisnął więzy na nadgarstkach. Wojciech nie stawiał oporu; patrzył przed siebie spod na wpół przymkniętych powiek, z mocno zaciśniętą szczęką.\n\n- To naprawdę on? - wyszeptał jeden z żołnierzy. Drugi przytaknął, trącając ramię Wojciecha lufą karabinu - wariat we własnej osobie.\n\nZakrwawionego i posiniaczonego Olszańskiego wywleczono z budynku i poprowadzono obok tego, co zostało z jego dawnego dowództwa. Niektóre ciała już przykrywano, inne leżały bez ruchu, z oczami otwartymi w wiecznym buncie. Nie odwrócił wzroku. Nie mrugnął.\n\nAresztowanie Wojciecha Olszańskiego stanowiło symboliczny koniec epoki naznaczonej paranoją, buntem i radykalnymi marzeniami o imperium, którego nigdy nie było. Dla Wojciecha nie był to jednak koniec. Kiedy ciężarówka turkotała w stronę miasta, wpatrywał się w sufit, nadal wierząc, że historia jeszcze o nim usłyszy."
szczecin.11.a: "Koniec szaleństwa"

szczecin.12.t: "Lewicowcy z drugiej strony"
szczecin.12.desc: "Jaroszewicz siedział zgarbiony w fotelu, uciskając skronie.\n- Mogą być przydatni, wiesz? - oznajmiła młoda postać siedząca naprzeciwko. - Mogą przysporzyć naszej sprawie poparcia na swoich dawnych terenach.\n- Tak, świetnie. Będą też kulą u nogi, gdy tylko \"Zamek\" wywęszy okazję do porządnej starej kampanii oszczerstw. Wyobrażasz sobie nagłówki? \"Unia daje schronienie krwiożerczym wikingom Zandberga i mściwym komuchom Żmurkiewicza!\".\n- \"Zamek\" daje schronienie byłym politykom PiS odpowiedzialnym za burdel, w którym znalazł się ten kraj. - Margaret pochyliła się nieco, żeby podkreślić swoje słowa. - A jednak jakoś nie widzę, żebyśmy ich za to oczerniali.\n- Można to chyba nazwać swego rodzaju milczącą umową - ustąpił. - Nadal jednak uważam, że przyjęcie tych ludzi jest ryzykowne.\n- To ryzyko, które musimy podjąć, jeśli chcemy wygrać wybory, kiedy to wszystko się skończy. - Wykonała nieokreślony gest dookoła. - Mógłbyś choć raz pomyśleć perspektywicznie.\n- Łatwo ci mówić, kiedy nie musisz dzień i noc zmagać się jako premier z koszmarem polityki czasu wojny. - Jaroszewicz wyglądał na coraz bardziej rozdrażnionego. - Nie podoba mi się to, ale jeśli ty i twój mały klub radykałów tak bardzo chcecie tych ludzi w partii, zwołamy konwencję i zagłosujemy. Niech członkowie zdecydują.\n- Jak zwykle rozmywasz odpowiedzialność. - Pokręciła głową. - Dobrze, niech będzie po twojemu. Ale jeśli nasza opcja wygra, wynik ma być wiążący. - Wycelowała agresywnie palec w Jaroszewicza.\n- A ja oczekuję, że utrzymasz swoje skrzydło w ryzach, jeśli wynik nie będzie po twojej myśli. A teraz wyjdź, muszę jeszcze pokłócić się z arcywielkim ministrem Boguckim.\n- Jak pan sobie życzy, panie przewodniczący - odparła buntowniczo Margaret i wyszła.\n\n- Jezu Chryste, jakbym miał za mało problemów - zaklął Jaroszewicz pod nosem, po czym podniósł słuchawkę i wybrał numer siedziby \"Zamku\", szykując się na długą rozmowę z politycznym przeciwnikiem, który stał się współpracownikiem."
szczecin.12.a: "Partia głosuje za"
szczecin.12.b: "Partia głosuje przeciw"

szczecin.13.t: "Lojalni obywatele!"
szczecin.13.desc: "Szczecin, niegdyś symbol zniszczenia, okupacji, przemocy i rozpaczy, przeszedł przemianę. Ze schodów gmachu parlamentu prezydent Piotr Krzystek przemawiał do tłumu, który dawno przelał się poza miejski plac i wypełnił ulice jeszcze kilka miesięcy temu rozbrzmiewające ogniem artylerii. Pod jego przywództwem Pomorze Zachodnie zjednoczyło się w spójną całość.\n\nPoczekał, aż zapadnie cisza, po czym przemówił spokojnie niczym człowiek, który nie tylko przetrwał historię, lecz był gotów ją napisać. \"Dzisiejszy dzień nie jest jedynie politycznym punktem zwrotnym - jest narodowym przebudzeniem. Koszmar się skończył. Czas cieni przeminął. Zaczynamy od nowa i zaczynamy tutaj\".\n\nKrzystek mówił o poświęceniu - o partyzantach, poległych, wygnanych intelektualistach, nauczycielach i inżynierach, którzy odmówili służby pod obcym panowaniem, oraz o cichych milionach, które przetrwały. Wychwalał odwagę mieszkańców Szczecina, którzy stawili czoła zarówno okupacji, jak i rozpaczy, i przypomniał zgromadzonym, że zwycięstwo bez wizji jest puste.\n\n\"W naszym przedsięwzięciu nigdy nie chodziło wyłącznie o przetrwanie. Chodziło o odrodzenie. Nie walczyliśmy po to, by stworzyć rozbite lenno czy lokalną władzę. Walczyliśmy i wytrwaliśmy, aby Polska mogła znów żyć - w prawie, sprawiedliwości i prawdzie\".\n\nOgłosił, że wkrótce zostaną przeprowadzone nowe, uczciwe wybory, by podtrzymać proces demokratyczny. Przedstawił harmonogram wolnego i sprawiedliwego głosowania, podkreślił przywrócenie niezależnych sądów i zobowiązał się do odbudowy infrastruktury oraz instytucji obywatelskich na wyzwolonych terenach.\n\nNajbardziej poruszające słowa padły jednak pod koniec.\n\n\"Niech nikt nie ma wątpliwości - nie jest to koniec ani rząd tymczasowy. Nie jesteśmy tworem separatystycznym. Stanowimy prawowitą kontynuację państwa polskiego i z dumą oraz poczuciem uroczystego obowiązku zajmujemy swoje miejsce w nieprzerwanym szeregu sięgającym 1918 roku\".\n\nGdy skończył, nad parlamentem ponownie wzniesiono polską flagę. Orkiestry wojskowe odegrały uroczystą aranżację hymnu narodowego, a ludzie płakali, obejmowali się i skandowali jednym głosem: Niech żyje Polska!\n\nTo, co zaczęło się jako leżące w gruzach miasto-państwo, stało się bijącym sercem nowej republiki pomorskiej - niedoskonałej, jeszcze niepełnej, lecz niezłomnej i zdecydowanej dokończyć to, co przeszłość pozostawiła niedokończone."
szczecin.13.a: "Powstaje nowy kraj"

szczecin.14.t: "Raport o stanie rzeczy"
szczecin.14.desc: "- Jak widać na wykresach tutaj i tutaj, poziom życia niemal dorównał już wskaźnikom sprzed powstania - oznajmił schludnie ubrany urzędnik państwowy - Zabezpieczając Police i tamtejsze zakłady chemiczne, odzyskaliśmy zdolności przemysłowe, a wiejskie tereny Ligi pozwalają nam złagodzić niedobory żywności.\n\nNaprzeciwko niego trzej najpotężniejsi ludzie w mieście, z gryfami przypiętymi do klap marynarek, szeptali coś między sobą. Wreszcie sam prezydent zapytał:\n- Ile czasu minie, zanim wrócimy do poziomu wyjściowego?\n- Najwyżej kilka miesięcy. Oczywiście o ile nic nie stanie nam na przeszkodzie - odpowiedział urzędnik, poprawiając okulary, które od godziny powoli zsuwały mu się z nosa.\nTrzej mężczyźni ponownie wymienili półgłosem kilka zdań, a potem wstali. Stojący po lewej stronie Krzystka skinął głową.\n- Dziękujemy, to powinno wy-\nZanim Jaroszewicz zdołał dokończyć, drzwi otworzyły się z impetem. Do pokoju, mimo protestów dwóch ludzi stojących na zewnątrz, wdarł się mężczyzna w znalezionym gdzieś przedwojennym polskim mundurze.\n- Najmocniej przepraszam za nagłe wtargnięcie, panowie, ale mam meldunek wywiadu, z którym musicie zapoznać się jak najszybciej - Żołnierz wręczył Krzystkowi teczkę, nie ustępując dwóm strażnikom próbującym obalić go z obu stron.\n- Dziękuję, oficerze. Panie Jaroszewicz, panie Bogucki, wy zostajecie - reszta może odejść - Krzystek wziął dokumenty i gestem nakazał ochronie zostawić żołnierza w spokoju. Kiedy wszyscy wyszli, otworzył teczkę i zaczął czytać na głos:\n\nPREZYDENCKIE SIŁY ZBROJNE, MELDUNEK WYWIADOWCZY, TAJNE\nWe wszystkich zachodniopomorskich państewkach odnotowano mobilizację oraz przemieszczanie sprzętu i personelu.\nEurokommissariat Westpolen podobno zamawia transporty broni z Zachodu. Nasze wysunięte patrole zauważyły Eurożołnierzy okopujących się przy granicy.\nWzmożona aktywność drakkarów Zandberga na Dziwnie i Świnie może wskazywać na zbliżający się atak na Świnoujście.\nZwiązek Jaszczurczy jest na dobrej drodze do zjednoczenia własnej frakcji; otrzymano zdjęcia partyzantów szkolących się w lasach wokół Drawska oraz transportów wojsk gromadzących się pod Połczynem-Zdrojem.\nOtrzymano nagranie telefoniczne niedawnego przemówienia Maxa Kolonki, w którym otwarcie zapowiedział marsz na południe w celu rozbicia Aleksandra Jabłonowskiego.\nSkandynawska Misja ONZ - brak doniesień.\nMobilizacja wysoce wskazana. Na razie powinniśmy skupić się na klice Tuska, gdyż jej zamiar uderzenia jako pierwszej jest zupełnie oczywisty."
szczecin.14.a: "Do diabła z tym wszystkim, tyle z odbudowy..."

szczecin.15.t: "Prawa ręka prezydenta"
szczecin.15.desc: "Późnym wieczorem korytarze rady miejskiej tętniły życiem i krzątaniną jak przed Upadkiem. Ludzie biegali w obie strony z naręczami dokumentów. Pośród nich armia budowlańców i dozorców pracowała dzień i noc, by doprowadzić ciężko uszkodzony budynek do znośnego stanu. Chaotyczna kakofonia przeróżnych dźwięków nabrała rytmu, gdy do gabinetu na końcu korytarza zbliżał się pewny stukot wysokich obcasów.\n\n- Co mu zajmuje tyle czasu? Miał być na spotkaniu pół godziny temu. - Jedna z doradczyń do spraw infrastruktury, wysłana, by sprawdzić, co dzieje się z samym prezydenckim nadzorcą, poprawiła okulary, po czym załomotała w drzwi.\nZ głośnym hukiem drzwi, które niejedno już widziały, wypadły z zawiasów i runęły, wzbijając małą chmurę pyłu. Wnętrze gabinetu przypominało system okopów z I wojny światowej, skrupulatnie zbudowany z kartonowych pudeł wszystkich rozmiarów, po brzegi wypełnionych teczkami i dokumentami. Gdzieś wewnątrz tej papierowej reduty, niczym generał dowodzący wojskami z ziemianki, siedział sam zmęczony, lecz stanowczy Henryk Jerzyk. Drżącą dłonią poprawił siwe włosy i założył okulary, po czym wrócił do sortowania papierów, jakby nic się nie stało.\n- Panie nadzorco. - Odchrząknęła, by zwrócić jego uwagę. - Zgodnie z pańskim poleceniem komitet doradczy oczekuje w sali konferencyjnej.\nZ przeciągłym skrzypnięciem nadzorca Jerzyk odwrócił się i zmrużył oczy, patrząc na zepsuty zegar wiszący na ścianie naprzeciw biurka, otoczony śladami po kulach wszelkich kształtów i rozmiarów.\n- Wydawało mi się, że już odrobinę za długo jest 7:32. Głupia technika.\n\nMruknąwszy i westchnąwszy, podniósł się z krzesła, chwycił grubą teczkę pełną rozmaitych dokumentów i ruszył przez sieć swoich okopów, wkrótce docierając do drzwi gabinetu. Wyglądał, jakby nie spał od chwili, gdy prezydent Krzystek powierzył mu nadzorowanie przekazania władzy w nowo przeobrażonym rządzie Szczecina. Człowiek starszego pokolenia, doświadczony samorządowiec, otrzymał misję zaprowadzenia porządku w niemal anarchicznym chaosie na ulicach miasta i przeformowania oddziałów partyzanckich w oficjalne siły zbrojne. A kiedy się z tym zmagał, nad miastem krążyło niczym sępy trio bezwzględnych korporacji, wypatrujących najmniejszego potknięcia.\n\nNiebawem ruszył z doradczynią i w ciągu kilku minut, pomimo wieku narzucając żwawe tempo, dotarł do sali konferencyjnej. Przed mównicą - w istocie jedynie wysokim stosem równo ułożonych cegieł - siedziała mała armia urzędników i ekspertów ze wszystkich dziedzin państwowości. Administracja, policja, infrastruktura, wojskowość - prezydent zażądał najlepszych ludzi, jakich miasto mogło zaoferować. Henryk Jerzyk w milczeniu zajął miejsce przy mównicy i zwrócił się do zebranych."
szczecin.15.a: "- Drodzy współpracownicy, skoro jesteśmy już wszyscy, możemy wreszcie zacząć wyprowadzać miasto na właściwe tory."

szczecin.16.t: "Bankiet"
szczecin.16.desc: "Szczecin powoli odbudowywał się po powstaniu. Większość budynków i sklepów przy głównych ulicach nadal znajdowała się w opłakanym stanie, z oknami zabitymi deskami i ścianami pokrytymi antyniemieckim graffiti. Pośród morza zniszczeń niczym przystań stała kawiarnia \"Uśmiech\", lokal w boleśnie postkomunistycznym budynku niedaleko placu Brama Portowa. W środku przy stoliku dla czterech osób siedziało dwóch urzędników państwowych, ubranych w najlepsze garnitury, jakie zdołali zdobyć, z niepokojem wymalowanym na twarzach. Przybyli na ważne spotkanie z prezesami dwóch korporacji pozostałych w Gildii Hanzeatyckiej.\n\n- Strasznie tu gorąco, nie sądzisz, Cezary? - odezwał się pierwszy urzędnik, wycierając chusteczką strużkę potu z czoła.\n- Powinni już tu być... - Drugi mężczyzna po raz szesnasty w ciągu pół godziny postukał w zegarek. - Matko Przenajświętsza, są!\nPrzed kawiarnią z piskiem opon zatrzymała się czarna limuzyna, rażąco odcinająca się od otoczenia idealnie wypolerowanym lakierem. Szofer wysiadł i otworzył tylne drzwi przed dwoma panami. Obaj mieli doskonale skrojone smokingi i ciemne okulary, a starannie dobrany strój zakłócały jedynie maleńkie logotypy reprezentowanych przez nich podmiotów. Mężczyźni podeszli do bagażnika i wyjęli metalową aktówkę.\n- Marek, ocknij się, gapisz się na nich jak sroka. - Cezary szturchnął go łokciem. - Zachowuj się swobodnie. Możemy wynegocjować dobry układ, tak jak chciał rząd.\nMarek przytaknął. Dwaj przedstawiciele podeszli do stolika i zdjęli okulary.\n- Witam panów! Wielka przyjemność, proszę usiąść, zamówimy panom kawę. - Pracownicy rządu wyciągnęli dłonie na powitanie.\n- Uprzejmości nie będą konieczne - odezwał się chłodno przedstawiciel Netto, zajmując miejsce.\n- My, yyy... sądziliśmy, że zaszczycą nas prezesi. - Strużka potu znów zaczęła spływać mu po czole.\n- Przewodniczący mają ważniejsze sprawy. Na szczęście dla panów otrzymaliśmy zadanie osobistego przekazania dokumentów dotyczących umowy, którą Gildia łaskawie oferuje miastu Szczecin. - Przedstawiciel PMŻ postawił metalową aktówkę na stole.\n- Z całym szacunkiem, panowie... Powiedziano nam, że warunki dopiero zostaną omówione. - Oczy Cezarego szybko przeskoczyły z przedstawicieli na aktówkę i z powrotem. - To, szczerze mówiąc, dość...\n- Dobrotliwe? Łaskawe? - wysłannik Netto wszedł mu w słowo. - Gildia wspierała wasze lekkomyślne powstanie przez cały czas jego trwania. W waszym najlepszym interesie będzie przyjąć warunki umowy dokładnie tak, jak przedstawia je nasza organizacja. - Obaj przedstawiciele zgodnie wstali od stołu."
szczecin.16.a: "\"Bo inaczej...\""

szczecin.17.t: "Nie ma czym się zbroić"
szczecin.17.desc: "Henryk Jerzyk siedział w gabinecie, czekając na przybycie gościa. Po głośnej deklaracji, że rząd przekształci oddziały partyzanckie w nowoczesną regularną armię, rozsądnie byłoby znaleźć kogoś, kto dostarczy niezbędne wyposażenie. Właśnie dlatego ogłoszono przetarg. Oczywiście kiedy ogłaszasz publiczny przetarg w Szczecinie, możesz być niemal pewien, że wygra go Hanza. Na barkach Jerzyka spoczywała teraz decyzja, jak wiele władzy państwowej ma jeszcze oddać dwóm korporacyjnym konglomeratom.\nIch przedstawiciel spóźnił się. W połączeniu z garniturem najwyższej klasy i aroganckim uśmieszkiem przekazywało to prostą wiadomość: \"Potrzebujecie nas i dobrze o tym wiemy\".\n- Zobaczmy, jak bardzo będzie upierdliwy - pomyślał minister wojny, po czym wyciągnął dłoń. - Dzień dobry panu.\n- Dzień dobry - odpowiedział przedstawiciel. - Nazywam się Maksymilian Kreziński i reprezentuję Gildię Hanzeatycką.\n- Proszę usiąść.\n- Jak panu zapewne wiadomo, reprezentowane przeze mnie spółki są bardzo zainteresowane pomocą naszemu odradzającemu się narodowi w uzbrojeniu żołnierzy - powiedział z rozbrajającym uśmiechem. - Wstępny przetarg wykazał, że tylko my dysponujemy kapitałem i wiedzą niezbędnymi do realizacji zamówienia.\nMówiąc to, przesunął w stronę ministra teczkę. Zawierała szczegóły przyszłego wykonania zlecenia.\n- Cóż, panie Kreziński - odezwał się Jerzyk, przeglądając dokumenty. - Choć jesteśmy wdzięczni za pańską... ofertę, musi pan zrozumieć nasze obawy związane z brakiem doświadczenia pańskich spółek w realizacji kontraktów wojskowych.\nJerzyk mógł nie znać się na wojsku, ale dobrze wiedział, jak targować się o publiczne pieniądze.\n- Rozumiem pańskie wątpliwości - Kreziński nie dał się zbić z tropu. - Mimo to jesteśmy gotowi wykorzystać nowe możliwości. PŻM kupiła już rafinerie Felmax i Hit, by wytwarzać stal zbrojoną niezbędną do projektu. Ta część naszego sojuszu szczególnie nadaje się do zmiany profilu dzięki doświadczeniu w produkcji wzmocnionych kadłubów. Daje nam ono podstawy do rozpoczęcia produkcji artylerii i samochodów pancernych.\nMiał mocny argument. Mimo to wykład o planie wzbudził w Jerzyku nowe podejrzenia.\n- Kwota inwestycji jest zaskakująco niska. Może nie wystarczyć.\n- Staraliśmy się zrównoważyć potrzeby państwa z opłacalnością i tempem produkcji - bronił się. - Jaki pożytek ze sprzętu wojskowego, jeśli nie dotrze na czas? Albo wydrenuje budżet państwa?\n- Muszę nalegać, by przemyślał pan sprawę ponownie. Potrzebujemy większego początkowego funduszu inwestycyjnego, aby zagwarantować oczekiwaną jakość. - Jerzyk miał coraz bardziej dość wymówek. - W przeciwnym razie będziemy zmuszeni zerwać umowę, zanim jeszcze rozpoczną się prace.\n- Naturalnie - przedstawiciel usiłował zachować spokój. - Lecz tylko my dysponujemy kapitałem i mocami produkcyjnymi potrzebnymi do wykonania zlecenia. Z całym szacunkiem, samodzielna realizacja będzie droższa, bardziej czasochłonna i nie da państwu żadnej gwarancji powodzenia.\nKreziński spojrzał na zegarek.\n- Pozostawiam decyzję panu. Dziękuję za poświęcony czas."
szczecin.17.a: "- Chyba nie mamy innego wyjścia"
szczecin.17.b: "- Poradzimy sobie sami"

szczecin.18.t: "Unia Letnia"
szczecin.18.desc: "Dla Karola Piotrkowskiego był to dość zwyczajny dzień. Pracował jako dziennikarz przed upadkiem, za reżimu Lindnera, a teraz za prezydentury Piotra Krzystka. Bez względu na to, kto rządził państwem, a teraz miastem, praca dziennikarza wydawała się nudna i powtarzalna. Politycy zawsze kłamali, a ludzie wdawali się w głupie spory albo kierowali zazdrością. Odkąd zaczął pracę w \"Głosie Szczecina\", nic nie robiło na nim wrażenia. Teraz powstała nowa partia, Unia Letnia, a jego zadaniem było przygotowanie porządnego reportażu z przemówienia Bogdana Jaroszewicza na Jasnych Błoniach.\n\nKiedy Jaroszewicz energicznie wkroczył na scenę, Karol niczego się po nim nie spodziewał. Kolejny kłamca i kleptokrata karmiący społeczeństwo pustymi słowami. A jednak nie potrafił nie słuchać tego otwartego i zabawnego człowieka.\n\nJaroszewicz zaczął od żartu, który zaskoczył Karola i przykuł uwagę publiczności. Nie było to zwykłe polityczne ględzenie. Bogdan podkreślał znaczenie społeczeństwa i zwyczajnych obywateli, którym podczas odbudowy należy zapewnić wsparcie. Zapewnił, że jego nowo powstała partia będzie szanować każdego obywatela i dążyć do stworzenia państwa opiekuńczego, w którym znajdzie się miejsce dla wszystkich. Jaroszewicz obiecał, że wielkie przedsiębiorstwa związane z Gildią Hanzeatycką nie będą mogły wyzyskiwać ludzi tak jak za administracji Lindnera. Jego partia była partią ludu.\n\nGdy przemówienie zbliżało się do końca, Karol był zdumiony. Dobrze znał sztukę manipulacji i zwykle bez trudu rozpoznawał nieszczerość polityka. Tym razem było inaczej; Jaroszewicz nie kłamał. Co więcej, Karol sam uwierzył w jego słowa. Przesłanie poruszyło go do głębi: była to wizja przyszłości obejmującej każdego, bez względu na pozycję - wielkiego i małego.\n\nPrzed zejściem ze sceny Jaroszewicz rzucił jeszcze jeden żart i ogłosił, że nadszedł czas, aby słynna piosenkarka Margaret zaprezentowała najnowszy utwór, zawierający myśli i uczucia zwykłych ludzi. Kiedy wyszła na scenę, Karol zamarł; wszystko przypominało sen. Ludzie byli zjednoczeni - tego dnia wszyscy byli równi. Wszyscy się bawili, a gdy zaczęła śpiewać, dołączył do niej cały tłum.\n\nKarol bawił się przez wiele godzin. Nigdy wcześniej nie przeżył czegoś podobnego; nawet w najśmielszych marzeniach nie wyobrażał sobie takiej zabawy. Kiedy wrócił do domu i odespał kaca, Piotrkowski poczuł przemożną potrzebę napisania reportażu. Wreszcie odnalazł poczucie celu i na nowo odkrył radość dziennikarstwa. Wszystko za sprawą prostego człowieka i jego nieskomplikowanego pomysłu, by stworzyć lepszy kraj dla każdego."
szczecin.18.a: "Przyszłość, w którą warto wierzyć"

szczecin.19.t: "Zamek"
szczecin.19.desc: "Zbigniew Bogucki czuł niepokój. Nie było to jego pierwsze przemówienie - wygłosił ich już wiele i miał wygłosić jeszcze więcej - lecz ciężar znaczenia tego wystąpienia mocno mu ciążył. Szczecin dopiero co wyzwolono spod niemieckiego panowania, a Piotr Krzystek, ich szanowany prezydent, powierzył mu utworzenie Zamku. Bogucki wciąż pamiętał czasy w PiS, gdy wszechwładny Jarosław Kaczyński często odsuwał go na boczny tor i niemal całkowicie o nim zapominano. Potem nadszedł upadek. Żył jak partyzant, walcząc z tymi draniami, najeźdźcami. Dzień po dniu. A teraz? Teraz był przywódcą partii, samotnego bastionu konserwatywnych wartości w Szczecinie.\n\nGdy wszedł na scenę, zalała go fala stresu. Wystarczyło jednak, że spojrzał w oczy tysięcy ludzi zebranych na dziedzińcu Zamku Książąt Pomorskich, a niepokój zniknął. Ci ludzie przybyli, by usłyszeć, co ma do powiedzenia. Chcieli wiedzieć, czy ich przyszłość jest wreszcie bezpieczna i czy mogą zaufać jego przywództwu.\n\nNa początek podziękował wszystkim za wspólne zgromadzenie. Bogucki podkreślił, że nie znaleźliby się w tym miejscu, gdyby nie odważni mieszkańcy Szczecina. Następnie zaczął opowiadać historię swojego życia, począwszy od pierwszych lat jako szeregowy członek PiS. Mówił o tym, jak po nadejściu upadku odłożył polityczne spory na bok, by walczyć za demokrację i wolność. Zbigniew wyraził dumę, że mógł stanąć u boku odważnych szczecinian i przeciwstawić się Niemcom. Teraz otrzymał sposobność, by odpłacić im za odwagę i bezinteresowność.\n\nZbigniew Bogucki przeszedł do programu nowo utworzonej partii, ZKL. Miała ona strzec tradycyjnych wartości i zapewnić Szczecinowi bezpieczeństwo. Bogucki dał do zrozumienia, że pod jego przywództwem nigdy więcej nie dojdzie do inwazji ani zniewolenia. Obiecał, że każdemu wystarczy żywności, a tereny wiejskie nie zostaną zaniedbane. ZKL otoczy rolników troską i wsparciem, gwarantując im należyte dopłaty.\n\nKontynuując przemowę, szybko zauważył życzliwą reakcję publiczności. Kiedy skończył, wszyscy bili brawo i skandowali jego nazwisko, a ponad tłumem pojawiły się partyjne sztandary. Nie spodziewał się takiego entuzjazmu, lecz dodał mu on energii i pewności siebie. Bogucki był teraz gotowy spełnić obowiązek sługi ludu. Niepokoił go jednak zapał Jaroszewicza. Z lewicowymi poglądami Jaroszewicz mógł okazać się trudnym współpracownikiem. Nie był to jednak czas na takie troski; był to czas świętowania."
szczecin.19.a: "Strażnik starego porządku"

szczecin.20.t: "Pierwszy dzień pracy"
szczecin.20.desc: "Pierwsze posiedzenie parlamentu nigdy nie miało być łatwe. Piotr Krzystek spodziewał się sporów i gorących kłótni, ale nie tego, co się wydarzyło. Sesja inauguracyjna zmieniła się w kocioł wrzasków i obelg. W pewnym momencie ktoś próbował nawet uderzyć polityka z przeciwnej strony sali. Czysty chaos. Krzystkowi zdumiewająco przypominało to polski Sejm - i zamęt, który tak często tam wybuchał. Czy Szczecin naprawdę niczym nie różnił się od Polski sprzed upadku?\nPiotr Krzystek siedział na podwyższeniu pośrodku sali obrad i obserwował gorącą debatę. Był prezydentem, lecz teraz nikt zdawał się tego nie szanować. Jeśli wszystko dalej pójdzie w tym kierunku, cały kraj przestanie działać. Nie mógł na to pozwolić. Nie spędził lat na walce z Niemcami tylko po to, by teraz patrzeć, jak chciwi, kłótliwi politycy rozrywają jego ojczyznę na strzępy.\n\n- SPOKÓÓÓÓJ! - Krzystek gwałtownie zerwał się z miejsca. Jego głos zagrzmiał w ogromnej sali parlamentarnej, odbił się echem od marmurowych ścian i na moment uciszył burzę głosów. Twarz miał czerwoną ze wściekłości, a oczy płonęły, gdy omiatał wzrokiem pogrążoną w chaosie izbę.\n- Co to ma być?! - warknął, zataczając szeroki gest nad salą.\n- Gdzie wy, do cholery, jesteście - w cyrku czy w pieprzonym parlamencie?!\nOdwróciły się dziesiątki głów, jedne zaskoczone, inne oburzone. Krzyki ustały, lecz napięcie nie zniknęło. Kilku zawstydzonych posłów osunęło się w ławach. Inni bez cienia skruchy przewrócili oczami. Jeden z delegatów z tyłu wymamrotał coś pod nosem, za co sąsiad obrzucił go ostrym spojrzeniem.\n\nKrzystek wziął głęboki oddech i opanował się.\n- Wybrano was, byście służyli ludziom - ciągnął dalej, teraz ciszej, lecz nadal stanowczo, a jego głos przecinał ciszę niczym ostrze - Nie po to, byście rzucali obelgami jak pijacy w karczmie. Nie po to, byście puszczali w ruch pięści, kiedy zabraknie wam słów.\nKnykcie zbielały mu, gdy zacisnął dłonie na krawędzi mównicy.\n- Jeżeli tak zamierzacie przewodzić, nie tylko okrywacie się hańbą - rozmontowujecie samą ideę tego narodu.\n\nKiedy jego słowa wybrzmiały w sali, nikt nie odważył się odezwać. Jedni byli zawstydzeni, inni po prostu bali się jego autorytetu, lecz żaden nie podjął kłótni. Wszyscy siedzieli nieruchomo, w napięciu czekając na następne słowa Krzystka.\n- Dobrze. A teraz będziemy kontynuować - powiedział stanowczo Krzystek."
szczecin.20.a: "- Ja, Piotr Krzystek, prezydent Szczecina, niniejszym otwieram pierwsze posiedzenie nowo utworzonego parlamentu..."

szczecin.21.t: "Ostatnia oferta"
szczecin.21.desc: "Sytuacja Szczecina zaczynała wyglądać lepiej. Zdradzieckie siły Chemiewerke \"Politz\" przeżywały ostatnie dni służby, gdy wojsko maszerowało ku ich siedzibie. Wszystko zdawało się w porządku.\nAż Krzystek otrzymał od przedstawiciela spółki propozycję negocjacji. W rezultacie ogłoszono zawieszenie broni, choć prezydent nie wyobrażał sobie przyjęcia jakiegokolwiek układu przedstawionego przez firmę. Wszystko zmieniło się jednak podczas spotkania z przedstawicielem w terenie.\n\n- Chwileczkę, mówi pan, że... CO, DO CHOLERY?!\n\nKrzystek miał długą listę oczekiwań wobec tego spotkania. Najkorzystniej brzmiała opcja: \"zarząd błaga o litość, oddając mu pełną kontrolę nad zakładem\". §R\"Zarząd zaminował całe zakłady chemiczne i może wysadzić je jednym naciśnięciem guzika\"§! zdecydowanie nie znajdowało się na tej liście. Po krótkim wybuchu paniki szybko się opanował.\n\n- A zatem... Ja... co musimy zrobić, żeby... powstrzymać ten niefortunny obrót wydarzeń?\n- Wstrzymajcie natarcie, a zakłady chemiczne pozostaną nietknięte. Co więcej, jeśli się zgodzicie, jesteśmy gotowi łaskawie współpracować z waszym rządem na zasadzie wzajemnej wymiany.\n\nChoć z wielką chęcią zobaczyłby, jak ta niemiecka pizda wysadza jego główne źródło dochodów, wiedział jedno: zakłady chemiczne były zbyt ważne, by poświęcić je w imię ideologii wyzwolenia. Wyglądało na to, że ma tylko jedno wyjście.\nPióro opadło na dokument z umową pokojową i powolnymi, rozmyślnymi pociągnięciami złożyło podpis. Krzystek patrzył na przedstawiciela z większą pogardą, niż kiedykolwiek żywił wobec drugiego człowieka. Przedstawiciel mógł odpowiedzieć jedynie neutralnym, lekko zakłopotanym wyrazem twarzy. Następnie zabrał dokument i jeszcze raz go przeczytał, odnotowując nowy podpis u dołu.\n\n- A więc ustalone. Miejmy nadzieję, że będzie to intratne partnerstwo dla obu stron."
szczecin.21.a: "Oślizgłe dranie..."

szczecin.22.t: "Szczeciński ekspansjonizm?"
szczecin.22.desc: ""
szczecin.22.a: "Teraz ruszą po nas! Zablokować rzekę!"

szczecin.23.t: "Blokada"
szczecin.23.desc: "Henryk Jerzyk i generał Koziatek szli powoli w stronę szczecińskiego ratusza, który stał się siedzibą prezydenta Piotra Krzystka. Gdy przechodzili przez plac wciśnięty między skrzydła szpinakowozielonego budynku, usłyszeli wybuch dobiegający z balkonu nad ich głowami.\n- Dranie! Pieprzone dranie! Wszyscy! Wolne Miasta, akurat!\n\nMężczyźni spojrzeli na siebie ze zdziwieniem. - To nie brzmi dobrze. Przynajmniej wiemy już, dlaczego Piotr nas wezwał. Lepiej trochę przyśpieszmy. - Pośpiesznie weszli do budynku i udali się na piętro, gdzie powitała ich nowa sekretarka prezydenta, wyraźnie spłoszona zamieszaniem w gabinecie. Generał poprawił mundur i wszedł pierwszy. Reszta rządu już tam była.\n- Przybyliśmy najszybciej, jak się dało. Co się dzieje?\n- Ta przeklęta Liga Wolnych Miast! Wykopaliśmy Niemców z Polic, a teraz oskarżają nas o \"ekspansję\" i \"stwarzanie zagrożenia\"! - Krzystek znów wybuchnął. - I mieli czelność wstrzymać cały handel z nami! Wiecie, co to oznacza?!\n- Że za mniej więcej miesiąc Szczecin zacznie głodować? - odpowiedział Bogucki, minister gospodarki z partii Zamek.\n- Jeśli nie wcześniej... - dodał Jaroszewicz, premier z Unii Letniej.\n- Dzięki za optymizm, Bogdan. - Krzystek spojrzał na niego z pogardą. - Ale tak, jeśli nic nie zrobimy, bardzo szybko znajdziemy się po uszy w gównie. I uprzedzam, zanim ktokolwiek odważy się to zaproponować: import żywności od przeklętych Niemców nie wchodzi, kurwa, w grę.\n- Kiedy zadzwoniłeś, razem z generałem Koziatkiem przeprowadzaliśmy inspekcję garnizonu przy ulicy Ku Słońcu - Henryk skorzystał z okazji, by powstrzymać prezydenta przed dalszym nakręcaniem się. - Jeżeli naprawdę nie ma innego wyjścia, wojsko jest gotowe do działania.\n- Chyba pan nie mówi poważnie! - natychmiast zareagowała minister spraw wewnętrznych Małgorzata Jamroży. - Nasi obywatele ledwo przetrwali rewolucję i inwazję Chemiewerke, a my pogrążamy ich w nieustannej wojnie!\n- Proszę posłuchać, doceniam pani troskę o życie obywateli, ale jeśli za kilka miesięcy w mieście zabraknie żywności, czeka nas klęska głodu - ponownie odezwał się Jaroszewicz. - To nie czas na idealistyczne marzenia o wiecznym pokoju.\n\nWszyscy spojrzeli na Krzystka, który coraz mocniej stukał palcami jednej dłoni o biurko, podpierając głowę drugą. Po czasie, który zdawał się wiecznością, zwrócił się do Henryka Jerzyka i generała Koziatka.\n\n- Wydać rozkaz. Nasza armia ma jak najszybciej ruszyć drogą ekspresową S10 w stronę Stargardu."
szczecin.23.a: "Znów biją wojenne bębny."

szczecin.24.t: "Złamany człowiek"
szczecin.24.desc: "Christian stał przy oknie swojego gabinetu w ratuszu. Z cygarem w dłoni zastanawiał się, dlaczego tu trafił. Do miejsca, w którym wszyscy go nienawidzą i życzą mu śmierci. Samotny pośród wilków. Pozorny spokój na zewnątrz był tylko fasadą. Narzucony przez niego porządek już przeminął. Mimo nieustannego nacisku ze strony Berlina i tego zdradzieckiego pajaca Tuska czasem odnajdywał chwile wytchnienia. Takie jak ta. Na zewnątrz życie toczyło się zwyczajnie. Jakby piekło minionych lat nigdy się nie wydarzyło.\n\nGdyby ktoś uważał, że Lindner popierał niemiecką interwencję, byłby daleki od prawdy. Nigdy w pełni jej nie aprobował. Niektórzy przypuszczali, że właśnie dlatego znalazł się tutaj - bo sprzeciwił się wyżej postawionym od siebie. W głębi duszy wiedział o swoich przewinach. Polacy pragnęli wolności i doskonale to rozumiał. Sam naprawdę chciał wrócić do domu, odwiedzić Bundestag i znów przechadzać się ulicami Berlina.\n\nJego marzenia i osobiste poglądy nie miały jednak znaczenia. Musiał narzucić porządek albo skończyć w położeniu jeszcze gorszym niż urząd Eurogouverneura. Tak zwana Gwardia Gryficka była dla niego poważnym cierniem w boku. Kolejny problem stanowiła krwiopijcza Gildia Hanzeatycka. Otoczony wrogami ze wszystkich stron dysponował ograniczoną władzą. Klika Krzystka miała cichą aprobatę i poparcie większości społeczeństwa, a zasobów było zbyt mało, by zlikwidować zagrożenie. Gildia z kolei całkowicie kontrolowała gospodarkę państwa i mogła przestawiać go jak pionek, kiedy tylko chciała.\n\nWewnętrzny spokój zniknął. Umysł Lindnera opanowały ponure myśli. Christian zgasił cygaro i powoli podszedł do biurka. Czekał na nim stos rozmaitych raportów. Ze znudzeniem szybko je przekartkował. Tu zaatakowano posterunki wojskowe, tam przerwano linie zaopatrzenia - jak zawsze tylko najgorsze wieści. \"W Stettinie mogą mnie spotkać wyłącznie najpotworniejsze rzeczy\" - pomyślał. Kiedy skończył czytać raporty, zanim zdążył choć na chwilę odpocząć, usłyszał uporczywe pukanie do drzwi.\n\nTo był jego najbliższy sojusznik, Herman Otto Soms. Rozmowa trwała krótko. Jeśli Lindner jeszcze rozważał możliwość utrzymania pokoju w Stettinie, teraz wiedział już, że każdy jego ruch jest pozbawiony znaczenia. Przynajmniej poinformowano ich o zamiarze porzucenia Eurokomisariatów przez Niemcy. Gdy Soms wyszedł, nalał sobie szklankę whisky, pozostawionej zapewne przez Krzystka. \"Musiał czerpać radość z rządzenia tym miastem; nigdy jej nie otworzył\" - mruknął Lindner. Porzucony przez własny kraj Christian wreszcie zrozumiał, co czuł jego poprzednik. Nie było dla niego nadziei. Nie miał szans ponownie ujrzeć ukochanej ojczyzny. Wiedział, że dzień sądu jest tuż-tuż.\n\nBył gotowy."
szczecin.24.a: "Samotny wilk porzucony na pustkowiu."

szczecin.25.t: "Koniec tyrana"
szczecin.25.desc: "Wiedział, że na to zasłużył - na gnicie w ciemnej celi bez nadziei i szczęścia. Christian Lindner był człowiekiem niegodnym litości ani przebaczenia. Zadał mieszkańcom Szczecina zbyt wiele bólu, a jego działania doprowadziły do śmierci wielu osób, w tym jego własnych ludzi. Dlatego nie zaskoczyło go, gdy owej pamiętnej nocy Piotr Krzystek postanowił uwięzić go i pociągnąć do odpowiedzialności za zbrodnie. Na miejscu Krzystka zrobiłby to samo. A jednak świadomość własnych błędów nie gasiła tęsknoty za ojczyzną. Christian rozpaczliwie pragnął jeszcze raz zobaczyć Wuppertal, lecz nie było to już możliwe.\n\nPrzetrzymywano go przy ulicy Kaszubskiej. Cela była ciasna i cuchnęła wilgotnym betonem, jakże odległa od przestronnych sal i bogato urządzonych apartamentów, które Lindner niegdyś nazywał domem. Minęły dwa dni, odkąd go tu wrzucili. Karmili go, owszem, ale absolutnym minimum - ledwie wystarczającym, by utrzymał się na nogach. Nikt nie powiedział, kiedy rozpocznie się proces. Celowo. Niepewność stanowiła taktykę, która miała trzymać go w napięciu, wytrącać z równowagi i kazać bez przerwy nasłuchiwać kroków na korytarzu. Christian wiedział jednak, że nie będą zwlekać zbyt długo, nim wreszcie się go pozbędą.\n\nJak na ironię, ledwie ta myśl przemknęła mu przez głowę, drzwi celi otworzyły się ze skrzypieniem. Weszło dwóch barczystych strażników i bez słowa poderwało go na nogi. Gdy prowadzili go więziennymi korytarzami, polscy osadzeni szydzili zza krat, z chorobliwą radością rzucając obelgi i drwiny. Szedł ze spuszczoną głową i zaciśniętą szczęką.\nWepchnęli go do furgonetki z przyciemnionymi szybami. Silnik ryknął i ruszyli przez miasto. Wieść musiała się jakoś rozejść, bo wzdłuż ulic zebrały się tłumy, które na widok przejeżdżającego pojazdu krzyczały, pluły i miotały wyzwiskami. Nie był to zwykły transport. Była to parada upokorzenia Christiana.\n\nNagle, gdy przejeżdżali przez plac Grunwaldzki, rozległy się strzały. Furgonetką gwałtownie zarzuciło, gdy kierowca stracił panowanie nad pojazdem, po czym z metalicznym hukiem uderzyła w latarnię. Lindner poleciał do przodu i mocno uderzył głową o przegrodę. Natychmiast przeszył go ból, a świat zawirował w chaotycznej mieszaninie hałasu i ruchu. Oszołomiony i zakrwawiony ledwie zauważył, że ktoś wyrywa tylne drzwi. Nim zrozumiał, co się dzieje, zamaskowani mężczyźni wywlekli go na zewnątrz. Wszystko wirowało, a potem nastała ciemność.\n\nKiedy odzyskał przytomność, siedział obok uzbrojonych mężczyzn o zimnych, nieprzeniknionych twarzach. Na każde pytanie odpowiadali milczeniem; nawet na niego nie patrzyli. Liczyło się tylko jedno: eskortować więźnia. Do piersi Lindnera wkradło się narastające przerażenie. Nie wiedział, co się stało, lecz każdy instynkt mówił mu, że nic dobrego.\nGdy furgonetka pędziła drogą, przez okno zobaczył znak. Litery były aż nazbyt znajome:\nPolice - 5 km.\nMiał ponure przeczucie, że będzie to koniec drogi - w każdym znaczeniu tych słów."
szczecin.25.a: "I nikt już nigdy o nim nie usłyszał."

szczecin.26.t: "Wyznawcy zysku"
szczecin.26.desc: "Ernest odbił kartę na wejściu po raz, który wydawał się trylionowym. Szczerze mówiąc, miał nadzieję, że będzie to ostatni raz, ale wiedział, że tej nocy raczej nie umrze we śnie. Jeszcze nie.\nPomijając to, czas było zabrać się do pracy. Jak zwykle nocna zmiana. Jedynymi przyjaciółmi, którzy pomagali mu przetrwać dzień, były szare ściany magazynu. A rozpaczliwie potrzebował czegokolwiek, co pozwoliłoby mu wytrzymać siedmiodniowy tydzień pracy za minimalną krajową.\nI tak się zaczęło. Sortowanie towaru, ładowanie palet, ładowanie palet do ciężarówek. Każde zadanie zajmowało umiarkowanie dużo czasu, a jednak zdawało się trwać wieczność.\nWreszcie, po czymś, co wydawało się całym miesiącem pracy, przyznano mu przewidzianą w grafiku przerwę na toaletę, której tak rozpaczliwie potrzebował. Wypił dziś stanowczo za dużo wody i nie chciał znowu szczać do butelki jak wczoraj.\nPotem jeszcze więcej pracy, kolejne miesiące mijające na sortowaniu, ładowaniu, sortowaniu, ładowaniu, sortowaniu. A potem pięciominutowa przerwa obiadowa. Ernest mógł tylko mieć nadzieję, że spakowana kanapka pozwoli mu dotrwać do końca nocy.\nPotem znów sortowanie. I ładowanie. I sortowanie. Psychiczne wyczerpanie otępiało. Zabiłby kogoś - najlepiej przełożonego - za możliwość porozmawiania i przerwania tej ogłuszającej ciszy. W końcu nadarzyła się okazja. Przechodził obok współpracownik, więc Ernest spróbował zacząć rozmowę prostym \"Cześć\", ale oczywiście przełożony miał inne plany.\n\n- Gadasz podczas zmiany? Co to, kurwa, kawiarnia? Wracaj do roboty!\n\nOczywiście.\nI tak trwało to dalej. Kiedy Ernest odbił kartę na wyjściu, nie miał na co czekać. Potem nadejdzie kolejny dzień snu, kolejny wieczór biedy i kolejna noc pracy. Dzień po dniu, tydzień po tygodniu, życie po życiu. Może mógł tego uniknąć... gdyby się nie urodził."
szczecin.26.a: "Ciało może żyć, lecz umysł już umarł"

szczecin.27.t: "Z powrotem na półkach"
szczecin.27.desc: "Jarosław od pięciu minut krążył po miejscowym Netto, z szeroko otwartymi oczami wpatrując się w otaczające go półki. W kraju zachodnim zapewne skłoniłoby to kogoś do wezwania pogotowia - z tego czy innego powodu - ale po pierwsze, to była Polska i ludzie lubią tu patologię, a po drugie, nie przeżywał epizodu jakiejś strasznej choroby psychicznej ani właśnie się jej nie nabawiał.\n\nZdumiewało go coś zupełnie innego:\n\nJak? Z Włoch? Francji? Hiszpanii?\n\nPrzywykł do ścisłych zasad racjonowania za rządów Eurokomisariatu, a wszystko, co polski obywatel mógł dostać w ramach swojego przydziału, było zazwyczaj podejrzanymi resztkami ze stołów innych Euromarionetek... ale jakoś to... działało? \"Jakoś\" było chyba najpochlebniejszym słowem, na jakie potrafił się zdobyć. Tak samo z pozyskiwaniem wszystkiego lokalnie po upadku Hansezirkel... ale teraz? Patrząc na te produkty - makaron, szynkę, nawet jedną czy dwie tabliczki czekolady - oblepione znanymi logotypami i flagami państw, do których Polacy mogli najwyżej pomarzyć o podróży, pomyślał o dwóch rzeczach. Po pierwsze: jakich czarów użyły te korpo, żeby dostarczyć to wszystko w ten zakątek świata? A po drugie, cóż...\n\n\"Co ja, do cholery, mam kupić?\"\n\nKiedy wrócił do domu, jak zawsze powitała go żona. Nieufna jak zwykle, choć niektórzy powiedzieliby, że nie bez powodu, z szybkością delfina zanurkowała do torby z zakupami i znalazła w niej coś, czego jednocześnie się spodziewała i nie spodziewała. Przywykła, że mąż wydaje... nieco więcej, niż planowali, zazwyczaj na trochę taniego wina, lecz ten przypadek był szczególnie rażący. W torbie leżał istny szwedzki stół produktów z tyloma międzynarodowymi oznaczeniami, że można było trzykrotnie objechać świat. Irlandzkie masło, egzotyczny francuski ser, rozmaite śródziemnomorskie szynki - zaiste widok godny podziwu.\n\n\"Gdzie, na miłość boską, to wszystko dostałeś?\" - zapytała, wyraźnie wzburzona.\n\n\"W... Netto!\" - z trudem odpowiedział. Pewnie była tak samo zaskoczona jak on w sklepie, pomyślał. Ale hej! Nie było lepszego momentu, żeby sprawdzić, czy lubią ser pleśniowy...\n\n\"Bzdura, Netto nie sprzedaje takich rzeczy, a jeśli sprzedaje, pewnie kosztowały fortunę... Aha, i nie zapominajmy, że nie kupiłeś bułek, ketchupu, herbaty...\" Gdy mówiła dalej, Jarosław czuł, jak dociera do niego rzeczywistość. Ze wstydu chciał przywiązać sobie kamień do szyi i utopić się w Bałtyku. Ale... czy ktokolwiek, kogo znał, zdołałby się oprzeć na jego miejscu?"
szczecin.27.a: "Czasem najgorsze, co można zrobić człowiekowi, to pozwolić mu wybierać"

szczecin.28.t: "Duński tydzień na Pomorzu"
szczecin.28.desc: "WYDARZENIE ETAPU REGIONALNEGO"
szczecin.28.a: "a"

szczecin.29.t: "Wróg, któremu musimy zaufać"
szczecin.29.desc: "Janek po raz, który zdawał się milionowym, odbił kartę przy wejściu do zakładu. Zastanawiał się, czy przywitać się z uzbrojonym strażnikiem przy swoim stanowisku, ale próbował już dość razy, by wiedzieć, że to raczej bezcelowe i spotka się jedynie z głuchym milczeniem. Zanim zabrał się do dzisiejszej pracy, pozwolił sobie na chwilę wspomnień.\nOch, moje zakłady chemiczne, co oni z wami zrobili?\nKiedyś znał je jako Zakłady Chemiczne, w starych dobrych czasach... Płacili dobrze, mógł skupić się na pracy, nawet gdy sytuacja w stolicy się pogarszała. Po niemieckiej inwazji i zmianie nazwy firmy wszystko zaczęło się jednak... zmieniać. Pensje malały, godziny pracy rosły, aż nim się obejrzał, wszystko w Policach nosiło logo Zakładów... nie, Chemiewerke. Od sklepu, w którym kupował chleb, po autobus wożący jego i innych do fabryki. Zupełnie jakby spółka próbowała uruchomić wynaturzony obieg, w którym nie traciła ani grosza na płacenie swoim niewolnikom, ponieważ posiadała wszystkie przedsiębiorstwa w mieście... Może właśnie tym już byli. Niewolnikami, tylko z większą ilością zadrukowanego papieru.\nA strażnicy... do diabła ze strażnikami. Po prostu... stali i nigdy do nikogo się nie odzywali. Gdy tylko ktoś pracował za wolno, za plecami rozlegało się znajome aż nazbyt dobrze kliknięcie... i natychmiast przyśpieszał. Janek zastanawiał się, czy strażnicy dostawali lepsze wynagrodzenie. Czy mieli jakieś świadczenia za służenie korporacji niczym bezduszne maszyny? Albo... może po prostu byli Niemcami. Ci już dowiedli, że od 1933 roku ani trochę się nie zmienili. Strzępy wiedzy o II wojnie światowej napłynęły mu do głowy - opisy katorżniczej pracy w niemieckich fabrykach na terenie Generalnego Gubernatorstwa... Nie potrafił wskazać ani jednej różnicy między tamtym obrazem a tym miejscem.\nPrzez krótką chwilę myślał o tym, żeby... wskoczyć do kadzi przed sobą. W ramach protestu. Pokazać wszystkim, że woli oddać się żrącemu roztworowi, niż spędzić jeszcze jeden dzień w tym szaleństwie. Myślał o tym jeszcze przez sekundę, po czym uznał: nie. Miał na utrzymaniu matkę emerytkę. Nie mógł jej zawieść, tak po prostu się poddając.\nNie minęła nawet sekunda, gdy usłyszał za plecami owo doskonale znane kliknięcie. Instynktownie uniósł i otworzył dłonie, jakby chciał pokazać, że jest nieuzbrojony i nie stanowi zagrożenia.\n\n- Dobra, dobra! Już pracuję! Jezu!\n\nStrażnik pobłażliwie opuścił pistolet maszynowy, a Janek nadal ostrożnie zajął miejsce przy stanowisku. Dzisiejsze zamówienie miało być wyjątkowo duże, więc musiał przygotować się na wyjątkowo długi pobyt... Cóż, chyba tak już po prostu jest."
szczecin.29.a: "I tak już będzie aż do dnia naszej śmierci"

szczecin.30.t: "Podejrzane dodatki"
szczecin.30.desc: "Tuż za zachodniopomorską metropolią zielone pastwiska ciągnęły się po horyzont. Pod rozległymi trawiastymi równinami kryła się jednak smutna prawda - jałowa, piaszczysta gleba. Rok po roku pan Wiesław, starszy właściciel średniej wielkości gospodarstwa warzywnego pod Szczecinem, odnotowywał niepokojący, lecz stały spadek plonów. Ręcznie zbierane marchewki, które pamiętał z dzieciństwa - pomarańczowe i dorodne - przypominały dziś jedynie pomarszczone brązowe kredki. Tradycyjne, całkowicie naturalne nawozy stosowane przez niego i wszystkich jego przodków najwyraźniej nie wystarczały wobec rosnących potrzeb rolniczych odbudowującego się narodu. Zrezygnowany Wiesław opuścił pole marchwi i powoli ruszył ku sadowi jabłoniowemu, wzdychając na widok wszystkich słabych, szarawych roślin w swoim bezpłodnym gospodarstwie. Drzewa wyglądały w tym roku wyjątkowo ponuro i rodziły zaledwie kilka maleńkich, zielonkawych owoców. Zdjął brudną rękawicę, zerwał jabłko i ugryzł, mimowolnie krzywiąc się od kwaśnego smaku. Żując dalej z niesmakiem wymalowanym na twarzy, pomyślał o otrzymanym niedawno liście, zaadresowanym bezpośrednio do niego przez miejscową fabrykę nawozów w Policach. Przedstawiciel firmy zachwalał w nim niezwykłe działanie nowych substancji chemicznych w mieszance nawozowej - rezultatu niedawnej zmiany przepisów przez szczeciński rząd - które miały podwajać, a nawet potrajać plony. Wystarczył jeden telefon, by otrzymać roczny bezpłatny zapas próbny nowego \"magicznego\" roztworu. Wiesław spojrzał na umierające, jałowe gospodarstwo, westchnął, błagając przodków o wybaczenie, i w desperacji sięgnął do kieszeni ogrodniczek.\n \nMinęło trochę czasu, odkąd cysterny Chemiewerke przyjechały i wlały nową, potworną ciecz do silosu nawozowego. Jej kolor był nie z tego świata, a smród tak okropny, że do rozprowadzania jej wiernym Ursusem C-360 potrzebny był pełny kombinezon ochronny. Rezultaty okazały się jednak spektakularne: marchewki uprawiane na tych polach przez jego rodzinę od stuleci właściwie same wyskakiwały z ziemi. Jeśli pominąć żółtawy odcień i ostry smak kurkumy, były największe, jakie Wiesław widział w całym długim życiu na gospodarstwie. Sad również został \"pobłogosławiony\" nowym, obfitym plonem. Jabłka - tak wielkie, że gałęzie uginały się pod ich ciężarem - miały wprawdzie głęboki zielony kolor i smakowały pistacjami, ale z pewnością dało się je reklamować jako \"dubajskie jabłka\" czy coś podobnego. Przy dzisiejszej desperacji mieszczuchów kupią każdy produkt, jeśli będzie go dużo i dostaną go w dostatecznie uczciwej cenie. Wiesław spoglądał teraz na swoje odrodzone gospodarstwo, wciąż sceptyczny wobec długofalowego wpływu nowej, przerażającej cieczy Chemiewerke na glebę, lecz nie potrafił przestać wyobrażać sobie fabrycznie nowego ciągnika Lamborghini w garażu, na miejscu starej ojcowskiej C-360."
szczecin.30.a: "Ludzie będą walczyć jak lwy o dubajskie jabłka."

szczecin.31.t: "Za płotem"
szczecin.31.desc: "WYDARZENIE ETAPU REGIONALNEGO"
szczecin.31.a: "WYDARZENIE ETAPU REGIONALNEGO"

szczecin.32.t: "Ostatni lojaliści"
szczecin.32.desc: "Podróż do stoczni Wulkan minęła Zbigniewowi bez przygód. Jak zwykle stał przy ostatnim zestawie uchwytów po lewej stronie autobusu. Kiedy pojazd dotarł na miejsce, oderwał wzrok od telefonu i zobaczył coś... niezwykle osobliwego.\nNad bramą stoczni wisiał sfatygowany sztandar \"Solidarności\", który pamiętał zapewne strajki stoczniowców z lat osiemdziesiątych.\n\nW dzisiejszych czasach? Owszem, słyszał o odradzaniu się Solidarności w Polsce po Upadku, ale... koncentrowała się głównie wokół Gdańska, z kilkoma małymi skupiskami gdzieś indziej. Co to, do cholery, robiło tutaj? Jakiś żart?\n\nKiedy wysiadł z autobusu i przeszedł przez bramę, zobaczył jeszcze bardziej zaskakujące widoki: każdą ścianę i powierzchnię, na której dało się cokolwiek przykleić, pokrywały plakaty głośno zapowiadające strajk. To zdziwiło go jeszcze bardziej. Strajk? Co? Brzmiało to jak kompletny dowcip... Nie żeby był całkowicie ZADOWOLONY z warunków w stoczni - raz współpracownik zmarł wskutek obrażeń, żeby nie wpędzić rodziny w długi za leczenie - ale... co można było zmienić? W końcu trwał Upadek, ledwo wiązali koniec z końcem, zapewne bez pomocy rządu po Powstaniu Gryfitów.\n\nNagle podbiegł do niego kolega z pracy Bartek, wyraźnie uradowany na jego widok! Gdyby nawet cała reszta przeleciała Zbigniewowi nad głową, mina Bartka jasno świadczyła, że dzieje się coś poważnego.\n\n- Ej! Zbigniew! PŻM właśnie dostała państwowe dotacje, więc strajkujemy! Wiesz, fajnie byłoby dostać coś takiego jak ubezpieczenie zdrowotne... Spoczywaj w pokoju, Edmund, biedny draniu.\n\nBrwi Zbigniewa podskoczyły z zainteresowaniem. Wszystko wskoczyło na swoje miejsce... Cóż, chyba nie było nic lepszego do roboty! Czas wywalczyć sobie świadczenia! Ubezpieczenie zdrowotne! Wyższe płace! Więcej przerw! Co za czasy!\n\nPo kilku godzinach strajku przyjechał przedstawiciel PŻM w oznakowanym firmowym samochodzie. Wygramolił się z auta z wyczerpaną miną, wykonywał nerwowe gesty i z podkładką w dłoni podbiegł do strajkujących robotników, krzycząc:\n\n- Dobrze! Słyszymy was! Jesteśmy... jesteśmy tu, żeby negocjować!"
szczecin.32.a: "Nie ma to jak wskrzesić stare tradycje"

szczecin.33.t: "Do roboty!"
szczecin.33.desc: "Był piąty... A może jedenasty? Zbigniewowi dni dawno zlały się w jedno. Jedyną stałą pozostawała praca... albo... dziwaczna imitacja pracy, do której przywykł od czasu upadku Polski. Po dotarciu do stoczni włożył do ust taniego papierosa i zapalił równie tanią zapalniczką. Czy przybył tam budować statki?\nProszę cię, kurwa.\nOczywiście, że nie przybył budować statków, głupcze! W istocie był tam po to, by robić wszystko, tylko nie to. Idąc w stronę miejsca, które normalnie byłoby jego stanowiskiem, uniósł dłoń na powitanie kolegi.\n\n- Ej! Jak tam, Bartek?\n\nZaczął, wyjmując papierosa z ust dwoma palcami, z uśmiechem rodzącym się na twarzy. Wyglądało na to, że czeka ich kolejny dzień gadania, palenia, picia i nierobienia niczego ważnego... I jeszcze płacili za takie życie? Ale numer!\n\n- E, nic specjalnego. Słyszałem, że dostaniemy nowego brygadzistę... ale wiesz, jak jest. Nic się nigdy nie zmienia, będzie tak do zamknięcia zakładu...\n\nOdpowiedział Bartek, lekko się śmiejąc.\nWtedy wydarzyło się coś dość niespodziewanego.\nPo stoczni poniosło się głośne \"BACZNOŚĆ!\", przez co kilku pracowników, w tym Zbigniew, podskoczyło z zaskoczenia. Skąd to się, do cholery, wzięło?\nJak się okazało, zawołał nowy brygadzista, który z surową miną wydał leniwej grupie kolejny rozkaz:\n\n- W szeregu zbiórka! Natychmiast!\n\nNie chcąc rozgniewać onieśmielającej postaci, szybko zebrali się przed nim w nierównym, lecz w miarę spójnym szeregu. Zbigniew nadal miał papierosa w ustach, czego stojący przed nim mężczyzna wcale nie przeoczył.\n\nKiedy brygadzista ruszył w jego stronę, Zbigniew pod naciskiem zaczął się pocić. Szef jednym szybkim ruchem wyjął mu papierosa z ust i trzymał go pionowo między dwoma palcami.\n\n- W stoczni nie wolno palić. ZROZUMIANO?\n\nPowiedziawszy to, rzucił papierosa na ziemię i zgasił butem. Zbigniew nie protestował. Co właściwie mógł zrobić? Poza tym... może życie stanie się dzięki temu odrobinę ciekawsze.\nBrygadzista odszedł od szeregu i przemówił do robotników:\n\n- Szczecińska marynarka właśnie zamówiła u nas flotę statków handlowych i monitorów. Oczekuję, że ŻADEN z was nie wykorzysta tego jako wymówki, żeby znów cały dzień chlać! Jeżeli przyłapię kogokolwiek na opieprzaniu się zamiast wykonywania pieprzonej roboty, BĘDĄ konsekwencje, zrozumiano?\nZapadła krótka cisza. Nikt nie wiedział, co powiedzieć, ale brygadzista najwyraźniej zrozumiał odpowiedź.\n\n- Dobrze, w takim razie... do roboty, leniwe mendy!\n\nZbigniew i Bartek popędzili na wyznaczone stanowiska w stoczni. Pomimo długiej przerwy wciąż pamiętali, na czym polega ich praca, i nie wyszli z wprawy aż tak bardzo, żeby należało ich zwolnić. Zbigniew nie wiedział, co o tym myśleć, ale wyglądało na to, że wszystko wraca do normy."
szczecin.33.a: "Lepsze całe życie ciężkiej służby czy całe życie nicości?"

szczecin.34.t: "Kraina możliwości"
szczecin.34.desc: "Hugo obudził się w akademiku, jak robił to od kilku lat. Zaparzył czarną kawę rozpuszczalną, szybko ją wypił, przygotował się i ruszył na pierwszy wykład.\nPo drodze zaczął się zastanawiać... co właściwie czekało go w przyszłości? Studia są fajne, rodzice dumni, oceny dobre, wszyscy szczęśliwi, ale... co potem? Z przemysłowego punktu widzenia Szczecin był państwem całkowicie beznadziejnym dla kogoś z jego wykształceniem mechanicznym, a jedyne potencjalne miejsca pracy najczęściej należały do Hanzy. Praca dla Chemiewerke Politz bardziej przypominała niewolnictwo w niemieckich obozach śmierci niż legalne zatrudnienie, PŻM kompletnie się rozpadała i nie dawała absolutnie żadnej stabilności, a Netto po prostu... nie było w jego stylu. Wiedział, że rodzice nie chcieliby tego oglądać, ale... wyglądało na to, że będzie musiał uciec za granicę, by znaleźć odpowiednią pracę. Nie było to przyjemne odkrycie, lecz z pewnością pojawiło się w jego myślach.\nGdy wreszcie uporządkował tę kwestię w głowie, dotarł na wykład. Dzień minął jak wiele innych. Jeden wykład, potem drugi, następnie seminarium i tak dalej. Ledwo powstrzymywał się przed zaśnięciem, ale dał radę. Po powrocie do akademika przywitał portiera w recepcji i otrzymał niespodziewaną odpowiedź.\n\n- Dzień dobry, panie Wysocki! Chyba coś dla pana mam!\n\nHugo uniósł brew... Coś dla niego? Patrzył, jak pracownik ochrony wyjmuje coś spod biurka i mu podaje.\nKopertę.\nSzybko ją otworzył i na złożonym w środku liście zobaczył logo PŻM. Chwila... co?\nWyjął list z koperty i go rozłożył.\nByła to propozycja od firmy. Oferta praktyki, a następnie zatrudnienia w ośrodku badawczym PŻM, gdzie pomagałby projektować nowe rozwiązania i statki.\n\nHugo niemal podskakiwał, wracając do swojego pokoju, przepełniony jednocześnie ekscytacją i ulgą. Przez głowę przechodziła mu tylko jedna myśl:"
szczecin.34.a: "\"Jebać inne miejsca! Może PŻM wcale nie jest taka niestabilna!\""

szczecin.35.t: "Wszystkie rzeki prowadzą na Pomorze"
szczecin.35.desc: "WYDARZENIE ETAPU REGIONALNEGO"
szczecin.35.a: "WYDARZENIE ETAPU REGIONALNEGO"

szczecin.36.t: "Szok i przerażenie"
szczecin.36.desc: "Kiedy wieść o planie Krzystka dotarła do rządu, uderzyła niczym grom - głośno, gwałtownie i w sposób niemożliwy do zignorowania. Ku zaskoczeniu wszystkich zdołała ponownie zjednoczyć ZKL i Unię Letnią. Jaroszewicz i Bogucki szybko zorganizowali spotkanie w sali parlamentarnej, bez wiedzy ani zgody prezydenta. Musieli działać. Plan był szaleństwem. Kto mógł to przewidzieć? Krzystek, architekt porządku po Upadku, zamierzał koronować się na króla. Monarcha - w XXI wieku! Nie do pomyślenia. Niebezpieczne. Trzeba było go powstrzymać, zanim sytuacja wymknie się spod kontroli. Gdy parlament się zebrał, izbę wypełniła napięta cisza. Wielu posłów rozglądało się w oszołomieniu, nie wiedząc, jak zareagować. Szepty odbijały się echem od marmurowych ścian, lecz nikt nie odważył się przemówić głośno; czekano, aż dwóch politycznych gigantów rozpocznie obrady. Wszystkie oczy zwróciły się ku Jaroszewiczowi i Boguckiemu w nadziei na wskazówki.\n\nPierwszy przemówił Bogdan Jaroszewicz.\n- To oburzające, że prezydent Piotr Krzystek postanowił działać w bezpośrednim sprzeciwie wobec podstawowych zasad naszej demokratycznej republiki. Zdradził tym samym nie tylko konstytucję, lecz sam lud Pomorza. Nie możemy i nie wolno nam pozwolić, by tak lekkomyślna ambicja zapuściła korzenie, a nasz naród pogrążył się w autokracji na podobieństwo reżimu, przeciw któremu niegdyś wspólnie stanęliśmy. Nie o to walczyliśmy przez długie lata oporu przeciw opresyjnemu państwu Lindnera. Dlatego niniejszym zgłaszam wotum nieufności wobec urzędującego prezydenta.\n\nZanim zdołał mówić dalej, w pół zdania przerwał mu Zbigniew Bogucki.\n- Panie Jaroszewicz, choć nie zawsze się zgadzamy, w tej kluczowej sprawie muszę przyznać panu rację. Perspektywa ogłoszenia się przez Krzystka królem stoi w bezpośredniej sprzeczności z istotą wartości naszej republiki. Stoimy jednak wobec ponurej rzeczywistości. Cieszy się szerokim poparciem społeczeństwa i wielkim szacunkiem w szeregach wojska. Czy jesteśmy gotowi zaryzykować zamach stanu? Obawiam się, że każda próba odsunięcia go od władzy może skłonić siły zbrojne i obywateli do wystąpienia w jego obronie, co potencjalnie pogrąży nas w dokładnie takiej autokracji, jakiej chcemy uniknąć. Być może w tych okolicznościach najlepszym wyjściem będzie milczeć i pogodzić się z nieuchronnością koronacji, nawet jeśli tego dnia przyjdzie nam śpiewać \"Niech żyje król\".\n\nJaroszewicz poczuł mieszaninę frustracji i rezygnacji. Ciężar sytuacji przygniatał go, a wiedział, że działanie w gniewie przyniesie tylko więcej chaosu.\n- Panie Bogucki - odezwał się wreszcie głosem spokojniejszym, niż się czuł - choć nadal uważam, że nie możemy po prostu stać bezczynnie, rozumiem pański punkt widzenia. Być może pora zmienić kierunek. Zamiast głosowania nad wotum nieufności możemy pracować nad wzmocnieniem instytucji demokratycznych od środka. Jeśli zdołamy zgromadzić wystarczające poparcie dla wspólnego frontu, być może wytyczymy kurs, który ocali nasze wartości wobec tego wyzwania. Poszukajmy sposobów dotarcia do obywateli i przypomnienia im o bliskich nam zasadach. Musimy pokazać, że wola ludu nadal może być siłą przewodnią, zamiast poddawać się rozpaczy wobec ambicji Krzystka."
szczecin.36.a: "Koniec Republiki"

szczecin.37.t: "...jest moim przyjacielem?"
szczecin.37.desc: "- A co z Wielką Brytanią?\n\nPytanie zabrzmiało w sali, wypowiedziane przez Toszka z zauważalnym brakiem desperacji. Gdy zwołano spotkanie, doskonale wiedział, co zaproponować. W końcu była to jego główna dziedzina badań. Całe życie katalogował wszystko, co dotyczyło Wielkiej Brytanii, i wiedział dość, by uznać ją przynajmniej za idealnego kandydata na nowego sojusznika.\nZapadła cisza; członkowie komitetu spoglądali po sobie. W końcu odezwał się przywódca.\n\n- No dobrze? A co z nią? - zapytał Krzystek, niepewny, co sądzić o pytaniu. - Znaczy... wyszli z UE, ale... myślisz, że zdołają nam jakoś po-\n\n- Nie, proszę to przemyśleć, NAPRAWDĘ przemyśleć... Brytyjczycy zawsze stali po przeciwnej stronie niż Niemcy i sprzeciwiali się ich imperialistycznej ekspansji oraz hegemonii, prawda? Z czym niby PAN walczył? Z tym, co dusiło nasz rząd od tyłu, obiecując przyjazną ochronę? Nie ma co zaprzeczać: Niemcy weszły w kolejną epokę imperializmu, a kiedy o to chodzi, Zjednoczone Królestwo zawsze jest dobrym sojusznikiem. Może zyskalibyśmy nawet ich błogosławieństwo jako oficjalny rząd Polski? Kogo niby poprą, Jaszczurów? Tego... króla-czarodzieja z Nysy?\n\nIm dłużej Krzystek rozważał tę możliwość, tym więcej widział w niej sensu. Argumenty powoli zaczynały układać się w całość, a oni rozpaczliwie potrzebowali sojuszników. Każda opcja była dobra; krótko rozważano nawet Naddniestrze, choć odrzucono je po mniej więcej sekundzie.\n\n- Cóż... widzę, dlaczego powinniśmy przynajmniej spróbować... A panowie co o tym sądzą?\n\nKiwnięcia głów i pomruki zgody rozeszły się po sali z prędkością przeziębienia. Wyglądało na to, że wszyscy myślą podobnie. - Cóż... w takim razie uważam sprawę za rozstrzygniętą. Będziemy dążyć do nawiązania stosunków dyplomatycznych z Wielką Brytanią i uzyskania od niej pomocy!\n\n- Dziękuję wszystkim za wysłuchanie i zgodę - powiedział profesjonalnie Toszek, choć w głosie pobrzmiewała duma z zatwierdzenia jego pomysłu przez prezydenta. Nie potrafił się powstrzymać przed wpleceniem uszczypliwej uwagi w swój fachowy ton.\n\n- Proszę tylko nie próbować wysyłać im herbaty i podpłomyków jako podarunków dyplomatycznych. Te drugie przy naszych możliwościach przechowywania zapewne zgniją."
szczecin.37.a: "- Rozumiem, panie Toszek. Dziękuję"

szczecin.38.t: "Pomoc"
szczecin.38.desc: "W Świnoujściu panował zimny, mroczny wieczór. Tak zimny i mroczny, jak tylko się dało. Od Upadku miasto naprawdę stoczyło się na dno - o ile w ogóle można było spaść niżej, niż znajdowało się wcześniej - a Jola mogła to potwierdzić. Wszystkiego brakowało, sytuacja mieszkaniowa po wojnie nadal była katastrofalna, a co gorsza, przy tak skromnym dobytku nikt nie miał szans się wyprowadzić. Nie żeby gdziekolwiek indziej było lepiej. Żyli więc z dnia na dzień. Bolesna, trudna monotonia, połączona z bezlitosnym racjonowaniem żywności i powolnym, niepowstrzymanym rozpadem resztek usług, które miasto było jeszcze w stanie świadczyć obywatelom. Ale tego dnia wszystko miało się zmienić.\nMąż wpadł do domu z zaskoczeniem wyraźnie wymalowanym na twarzy i głośno oznajmił:\n\n- Jola, chodź! Jakiś dziwny zagraniczny statek wpływa do portu!\n\nNatychmiast wybiegli razem sprawdzić, co się dzieje. I rzeczywiście: w porcie cumował dziwnie oznakowany frachtowiec, dumnie prezentujący na maszcie brytyjską flagę. A obok niej jeszcze jedną, z jakimś... zielonym, przeciętym symbolem ósemki?\nZnacznie ciekawsze było jednak to, co wkrótce wyładował. Portowe dźwigi ożyły i zaczęły unosić palety pełne białych pojemników, opatrzonych tym samym logo co na fladze oraz napisem \"OXFAM\"... Jola je kojarzyła, z jakiegoś... filmu dokumentalnego sprzed Upadku? O pomocy ofiarom katastrof w Afryce? Czy to paczki z pomocą humanitarną? I czym, do cholery, jest OXFAM?\nWkrótce nadjechał pociąg, a palety metodycznie ładowano do wagonów.\nNastępnie ze statku wylał się cały potok ludzi, wszyscy z tym, co mogło być jedynie logo OXFAM, na koszulach i kamizelkach. Tłum zebrany przy wejściu do portu, równie ciekawy nagłej zagranicznej obecności jak małżeństwo, wybuchnął dyskusją.\nWtedy jeden z przybyszów ogłosił przez megafon doskonałą, choć lekko akcentowaną polszczyzną:\n\n- Witajcie, obywatele Polski! Jesteśmy z brytyjskiej organizacji humanitarnej OXFAM! Przybyliśmy udzielić wam pomocy na prośbę rządu zachodniopomorskiego!\n\nTo, co powiedział później, nie miało większego znaczenia. Jola usłyszała dość, by mieć pewność co do jednego."
szczecin.38.a: "Na Pomorzu Zachodnim już wkrótce miało być lepiej..."

szczecin.39.t: "Stara i nowa gwardia"
szczecin.39.desc: "Daleko od centrum, w północno-zachodnim zakątku miasta, znajduje się Netto Arena. Należąca do jednej z korporacji Wielkiej Trójki, była nowoczesną halą sportową mieszczącą nieco ponad pięć tysięcy osób. Dziś jednak, w obliczu niedawnego zwycięstwa Unii Letniej w wyborach parlamentarnych, gościła wielki wiec partyjny, podczas którego miała rozstrzygnąć się przyszłość państwa. Było kilka minut po szesnastej. Popołudniowe słońce nieśmiało wyglądało zza jasnoszarych chmur deszczowych i oświetlało czerwoną limuzynę BMW, jaskrawo odcinającą się od szarego, mokrego miasta. Samochód ochlapał kałużę przed areną i zatrzymał się przy krawężniku. Paparazzi zgromadzeni wokół budynku oblegli auto, bo wiedzieli, co oznacza jego przybycie: \"Krwawa Mary\" jest na miejscu. Modnie spóźniona na wiec przywódczyni radykalnego skrzydła Unii Letniej - diwa i piosenkarka Margaret - wyłoniła się z tylnego siedzenia w jaskrawoczerwonej garsonce, podczas gdy ochroniarz trzymał nad jej głową parasol. Wśród błysków fleszy i dziennikarzy błagających o uwagę ruszyła do środka areny, gdzie czekali bardziej umiarkowani członkowie partii.\n \n- I właśnie dlatego nalegam na współpracę z... - Przywódca umiarkowanego skrzydła Bogdan Jaroszewicz podskoczył zaskoczony hukiem drzwi prowadzących do głównej sali. - Pani Margaret, cieszymy się, że wreszcie pani dotarła. - Radość, szczególnie z jego strony, była mocno wymuszona; odwrócił wzrok i poprawił okulary.\n- Miałam nadzieję, że spóźnię się na całe pańskie tchórzliwe przemówienie, panie Jaroszewicz - odezwała się Margaret. Jej jaskrawoczerwony strój rozświetlał salę pełną kobiet i mężczyzn z Unii Letniej ubranych w ciemne garnitury, gdy mijała ich w drodze na mównicę. - Ale chyba nadal jestem za wcześnie. Doskonale pan wie, że mieszkańcy Szczecina wybrali nas, ponieważ oferujemy prawdziwą zmianę, prawdziwe wstrząśnięcie tym zgniłym bagnem, jakim jest państwo. Gdyby obywatele chcieli kopii polityki starego świata, wybraliby Zamek, lecz zaufali nam!\n- Jestem równie świadomy jak pani, że nasze społeczeństwo potrzebuje drastycznych środków, by zmienić ustanowiony porządek. Wie pani jednak również, że nasze położenie jest dość szczególne. - Spojrzał na salę, a potem z powrotem na jaskrawo ubraną partyjną koleżankę. - Macki Hanzy sięgają głęboko i oplatają całe miasto. To, co pani proponuje, doprowadzi w najlepszym razie do załamania gospodarczego, a w najgorszym do korporacyjnego zamachu stanu. Nie możemy do tego dopuścić; nie to obiecaliśmy ludziom.\n- Właśnie przez takie myślenie Szczecin wybrał Unię Letnią: żeby naprawdę podpaliła stary establishment. Ludzie przekazali NAM pochodnię rewolucji! - Uniosła ręce wśród oklasków radykalnego skrzydła zgromadzonego na arenie.\nDebata ciągnęła się przez wiele godzin, a obie strony dowodziły swoich racji. To, w czym osiągnęły porozumienie, zwykły obywatel miał dostrzec dopiero w nadchodzących dniach."
szczecin.39.a: "Nadchodzi niekończące się lato."

szczecin.40.t: "Szepty na obrzeżach"
szczecin.40.desc: "Sala pękała w szwach. Z balkonów zwisały sztandary, scenę oblewało ciepłe białe światło, a za plecami Boguckiego jarzył się partyjny emblemat niczym wyblakłe słońce. Rzędy kobiet i mężczyzn w garniturach pochylały się do przodu z otwartymi notatnikami, a oklaski były wymierzone i zdyscyplinowane.\nBogucki znajdował się w połowie przemówienia.\nMówił z autorytetem, choć bez ciepła - wyliczał założenia polityki, bronił kompromisów, przedstawiał trudną drogę naprzód jako konieczną, trzeźwą i patriotyczną. Przytakiwał jedności. Wspólnemu poświęceniu. Współpracy z Unią tam, gdzie służyła interesowi narodowemu.\nI wtedy ona wstała.\nZ trzeciego rzędu po prawej stronie przejścia Jacyna-Witt wyrwała się z tłumu niczym podmuch wiatru podczas pogrzebu. Jej obecność zdawała się przyciągać światło - a może tylko uwagę. Miała zaciśniętą szczękę. Ręce nie kołysały się przy bokach. Szła bez gracji, lecz prosto do celu.\nBogucki ją zobaczył. Głos mu nie zadrżał, jedynie spojrzenie stało się odrobinę ostrzejsze. Nie strach, tylko irytacja. Dobrze znana, wysłużona irytacja.\nNie miał do niej cierpliwości. Nigdy nie miał. Nie do tego, jak zawsze mówiła, jakby stała ponad procedurami, ponad strategią, ponad samą machiną rządzenia. Arogancka. Jazgotliwa, jak twierdzili niektórzy. Zawsze o jedno zdanie za głośno, o jedno słowo za daleko. Kobieta o uroku zimnego octu i pewności człowieka, który ma niewiele do stracenia.\nNie czekała na mikrofon. - Panie ministrze - powiedziała, przecinając głosem salę - mówi pan o porozumieniach z Unią tak, jakby były strategią, a nie kapitulacją. -\nPomruki. Kilka jęków. Jedni przewrócili oczami, inni je zmrużyli. Większość po prostu patrzyła przed siebie z zaciśniętymi ustami.\nJacyna się tym nie przejmowała. - Obiecuje pan stabilność, przyjmując ich warunki. Ich limity. Ich nadzór. To teraz nazywa się suwerennością?\nKtoś zachichotał pod nosem. Jeden z szeregowych posłów szepnął coś o lokalnym teatrze alternatywnym. Mimo to nikt jej nie powstrzymał.\nBogucki nie odpowiedział od razu. Patrzył na nią. Nie odpowiadał, tylko obserwował. Oceniał. Każdy w sali widział, że jej nie cierpi. Ona również nie kryła pogardy. Nie chodziło wyłącznie o ideologię. To było osobiste. Dwa ciała na orbicie, wirujące w przeciwnych kierunkach i uwięzione w cichej wojnie o grawitację.\n- Pani Jacyno - powiedział - po raz kolejny myli pani krnąbrność z obowiązkiem. -\nOdszedł krok od mównicy. Teraz mówił już nie tylko do niej, lecz do całej sali.\n\n - Bardzo łatwo krzyczeć o suwerenności z miejsca w trzecim rzędzie. O wiele trudniej rządzić. Jeszcze trudniej rządzić, nie pogrążając kraju w izolacji i chaosie. -"
szczecin.40.a: "Sala zamilkła, a wszystkie oczy zwróciły się ku Jacynie."

szczecin.41.t: "Import pomysłów"
szczecin.41.desc: "[GetConsensusEvent]"
szczecin.41.a: "I tak narodził się Konsensus"

szczecin.41.unia: "- Proszę zrozumieć, że to poważna sprawa odbudowy narodowej, a nie okazja, żeby się na siebie obrażać i zdobyć kilka dodatkowych punktów politycznych.\n\nSpotkanie Krzystka z premierem i przywódcą opozycji przebiegało dotąd sprawnie. Przynajmniej obaj liderzy nie rzucili się sobie do gardeł - niewątpliwy sukces i wynik lepszy, niż mogło o sobie powiedzieć wiele innych państw. Po krótkiej rozmowie, podczas której ustalono podstawowe zasady spotkania i padło powyższe stwierdzenie, przyszła pora na główny punkt, samo sedno zebrania.\nKrzystek wezwał profesora Toszka.\n\n- Dzień dobry, panowie - profesor zaznaczył swoją obecność. - Jak panów poinformowano, celem spotkania jest opracowanie planu gospodarczego służącego odbudowie województwa znajdującego się obecnie pod naszą kontrolą. Podczas rozległych badań nad Wielką Brytanią natrafiłem na ich plan gospodarczy, który może nas szczególnie zainteresować.\n\nNatychmiast wzbudził ciekawość.\n\n- Plan był mocno interwencjonistyczny, a nawet częściowo socjalistyczny. Wprowadzono w jego ramach Narodową Służbę Zdrowia, znacjonalizowano słabsze gałęzie przemysłu, rozszerzono edukację i ogólnie podniesiono poziom życia. Proponuję oprzeć na nim naszą odbudowę gospodarczą.\n\nBogucki pierwszy wyraził zastrzeżenia.\n- Panie profesorze, uważam, że z samej swojej natury plan ten niezdrowo wzmocni socjalistów! Nie możemy na to pozwolić!\n\nJaroszewicz szybko odpowiedział.\n- Bzdura! Jeśli będziemy współpracować, przyciągnie ludzi również na stronę konserwatywną!\n\nToszek wykonał gest nakazujący obu się cofnąć, a ci szybko przerwali sprzeczkę.\n\n- Proszę, panowie. Mamy poważny problem, a panowie wykorzystują go, by zdobyć przewagę nad przeciwnikami zamiast poprawić los narodu? Widzieliśmy już, co się dzieje, gdy polityczne swary stają na drodze do poprawy życia ludzi... i nigdy nie jest to piękny widok.\n\nW sali zapadła cisza. Obaj przywódcy zastanowili się nad jego słowami... Toszek chyba miał rację. Na pierwszym miejscu powinni stawiać dobro ludzi, a poza tym każda strona miała powody, by zyskać na planie, dzięki czemu ich siły pozostałyby wyrównane.\nObaj zgodnie skinęli głowami. Unia Letnia z pewnością doceni socjalistyczne akcenty, a zdecydowanie dominujące kaczystowskie skrzydło \"Zamku\" na pewno poprze odrobinę nacjonalizmu gospodarczego.\nProfesor znów zabrał głos. - A zatem... mamy porozumienie?\nPo krótkim potwierdzeniu i podpisaniu oficjalnej deklaracji przywódcy partii rozstali się z Krzystkiem i Toszkiem, a plan mógł bez przeszkód wejść w życie."
