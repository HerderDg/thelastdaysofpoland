 ludzi, a poza tym każda strona miała powody, by zyskać na planie, dzięki czemu ich siły pozostałyby wyrównane.\nObaj zgodnie skinęli głowami. Unia Letnia z pewnością doceni socjalistyczne akcenty, a zdecydowanie dominujące kaczystowskie skrzydło \"Zamku\" na pewno poprze odrobinę nacjonalizmu gospodarczego.\nProfesor znów zabrał głos. - A zatem... mamy porozumienie?\nPo krótkim potwierdzeniu i podpisaniu oficjalnej deklaracji przywódcy partii rozstali się z Krzystkiem i Toszkiem, a plan mógł bez przeszkód wejść w życie."

szczecin.42.t: "Wyważona odpowiedź"
szczecin.42.desc: "Wreszcie nadeszła odpowiedź.\n\nKrzystek nie posiadał się z radości, słysząc, że Brytyjczycy się zgodzili! Cóż... przynajmniej do pewnego stopnia.\n\n\"Rząd Jego Królewskiej Mości uznaje szlachetny cel zjednoczenia Polski pod prawowitym demokratycznym przywództwem. Pański rząd może oczekiwać wsparcia w postaci tak potrzebnej pomocy humanitarnej, a droga do dalszej współpracy pozostaje otwarta. Niestety ze względu na burzliwą i nieprzewidywalną sytuację strategiczną w Polsce jako całości nie jesteśmy obecnie w stanie udzielić dodatkowej pomocy. Gdy położenie stanie się bardziej klarowne, należy spodziewać się rozszerzenia naszego partnerstwa\".\n\nZjednoczone Królestwo może być słabsze niż kiedykolwiek, ale przynajmniej na odrobinę gościnności możemy liczyć."
szczecin.42.a: "Lepsze to niż nic"

szczecin.43.t: "Razem silniejsi"
szczecin.43.desc: "Dla Jakuba była to po prostu kolejna zmiana. Kolejny dzień odbijania karty o świcie i pracy do upadłego. Przynajmniej nie była to nocna zmiana, choć trudno było chwalić pracodawców za to, co robili z nim każdego dnia. Gdyby miał inną możliwość zatrudnienia, rzuciłby tę robotę... lecz oto był tutaj, sortując towar i ładując palety.\nTym razem coś się jednak zmieniło. Kiedy wszedł, wręcz zalała go ściana plakatów reklamujących... związek zawodowy? Widniały na nich zdjęcia uśmiechniętych robotników i hasła takie jak \"Walcz o wyższe płace!\" oraz \"Razem silniejsi!\". Dziwne, pomyślał, lecz nie przywiązał do tego wagi. Odwrócił się i zobaczył, że pozostali pracownicy potraktowali sprawę znacznie poważniej.\nStali w czymś, co przypominało nieco krzywy krąg, i z zapałem dyskutowali.\nChoć pełna entuzjazmu, rozmowa nie należała do uprzejmych, co pokazał starszy pracownik, wtrącając się z twarzą czerwoną jak komunistyczny sztandar.\n\n- MNIE nie złapiecie na wstępowaniu do tych przeklętych związków! Wszystkie są skorumpowane! To kompletna strata czasu!\n\nNa jego protest odpowiedziała młodsza pracownica pojednawczym, przekonującym tonem.\n\n- Ale... słyszałam, że związki w PŻM walczą o wyższe płace dla pracowników... Myślę, że powinniśmy im zaufać, choćby na próbę!\n\nStarszy mężczyzna natychmiast odparł z niesłabnącą wściekłością:\n\n- A co ty o nich wiesz poza tym, co mówią ich zwolennicy? Albo... może jesteś jakąś pieprzoną komuną?\n\nPadło jeszcze kilka słów, po czym krąg zamilkł na dźwięk głosu kierownika:\n\n- O czym wy, do cholery, gadacie? Chyba nie o ładowaniu tych palet! Wracać do pracy! Musimy skończyć wysyłki, i to szybko!\n\nKrąg błyskawicznie się rozpadł i pod surowym spojrzeniem szefa wszyscy wrócili do zajęć. Jakub ruszył na swoje miejsce, rozważając możliwości. W końcu podjął decyzję."
szczecin.43.a: "Solidarność na zawsze"

szczecin.44.t: "Lokalne problemy wymagają lokalnych rozwiązań"
szczecin.44.desc: "Gdy zaczęto wdrażać reformy rządowe, garnitury na szczycie uznały, że trzeba wysłuchać wszystkich ludzi żyjących w granicach Szczecina. Demokracja przedstawicielska stanowiła jeden z najważniejszych punktów ratuszowego programu poprawy życia w metropolii i jej okolicach. Zbigniew nie był szczególnie przekonany do pięknych, większych niż życie obietnic polityków, lecz w dzisiejszej gospodarce trudno było odrzucić szansę na porządnie płatną pracę \"Przedstawiciela Obywatelskiego\". Do jego nowych obowiązków należało uczestniczenie w zebraniach w rozmaitych wsiach i miasteczkach na prowincji, wysłuchiwanie trosk i życzeń zaniepokojonych obywateli oraz przekazywanie ich wyżej. \"Łatwizna\", pomyślał, podpisując dokumenty, nieco zauroczony obietnicą garnituru i samochodu zapewnionych przez państwo. Nikt nie wspomniał, że garnitur będzie używany i źle dopasowany, a wspaniałym pojazdem mającym reprezentować dobrobyt kraju okaże się rdzewiejący zielony Fiat Seicento, którego najlepsze lata minęły jakieś ćwierć wieku temu. Przeklinał samego siebie, wypychając małego rzęcha z błota po raz piąty w tym tygodniu, w drodze do zapomnianej przez Boga dziury z dwiema drewnianymi chatami i stodołą. Na szczęście dziś nie padało, więc nie utknął na wiejskiej drodze, która nigdy nie widziała asfaltu. Z drugiej strony samochód obdarował go głośnym hukiem i silnikiem, który po prostu zgasł. Unieruchomiony pośrodku niczego w drodze do Babinka, ukrył twarz w dłoniach i głęboko westchnął. Niczym błogosławieństwo dla wyczerpanego podróżnika dobiegł go jednak warkot starego diesla. Drogą ku pobliskiej wsi jechał wysłużony ciągnik Ursus. Zbigniew wyskoczył z auta i pomachał rolnikowi, który zatrzymał się obok, zauważywszy pióropusz dymu dobywający się spod maski zielonego Fiata.\n- Cześć, mieszczuchu, podholować? - zapytał gospodarz z papierosem w ustach.\n - Jeśli byłby pan tak uprzejmy. Jestem Przedstawicielem Obywatelskim z ratusza i jadę do Babinka.\n- A, to pan jest tym całym eleganckim urzędasem, o którym gadał sołtys. Chciałem donieść na tego przeklętego łotra Cichowskiego. Mówię panu, kradnie mi krowy, jestem pewien!\nNiechętnie, lecz z ulgą, że nie utknie pośrodku pola, z pomocą rolnika podpiął Seicento do traktora. Po długim czasie dotarli do Babinka, wsi pod Szczecinem. Przedstawiciel Obywatelski wysłuchał miejscowych, a ich problemy sprowadzały się głównie do nieudanych zbiorów, skradzionych krów, picia w ciągu dnia i publicznego obnażania się. Była to piętnasta wieś w tym miesiącu z tymi samymi sprawami, których musiał wysłuchać, przytaknąć i obiecać, że przekaże je wyżej, a rozwiązanie nadejdzie wkrótce. Po wielu godzinach słuchania szlochających staruszek i wkurzonych rolników wreszcie spróbował zadzwonić po pomoc drogową. \"Brak zasięgu, cudownie\" - pomyślał, pocieszony jedynie tym, że nie musi sprawdzać, do której wioski jedzie następnie."
szczecin.44.a: "Czy NAPRAWDĘ musimy wysłuchać WSZYSTKICH?"

szczecin.45.t: "Dostrajanie"
szczecin.45.desc: "Artykuł z pierwszej strony \"Głosu Szczecina\" z 5 lutego:\n\nRząd pokonuje deficyt produkcji\n\nDziś zdumiewające wieści: rząd Szczecina ogłosił wielkie zwycięstwo. Od czasu kryzysu wynagrodzenia i zatrudnienie stale rosły. [...]. Nasz największy problem, deficyt produkcji, został niemal rozwiązany, a na razie sytuacja zdaje się jedynie poprawiać. [...] Szczecin czeka świetlana przyszłość!\n\nArtykuł z pierwszej strony \"Głosu Szczecina\" z 5 kwietnia:\n\nInflacja rośnie, rząd ogłasza kryzys\n\nW obliczu rosnącej inflacji rząd podjął decyzję wykonawczą o wstrzymaniu podwyżek płac, znacznym ograniczeniu importu i wprowadzeniu nadzwyczajnych podatków na niektóre produkty. [...]. Nieproporcjonalny wzrost popytu względem podaży zapewne wymusi dalsze działania rządu. Nadchodzi kryzys gospodarczy.\n\nArtykuł z pierwszej strony \"Głosu Szczecina\" z 5 czerwca:\n\nRząd pokonuje inflację\n\nDziś zdumiewające wieści: inflacja została opanowana, a ograniczenie importu i nadzwyczajne podatki dobiegają końca. Prezydent oświadczył, że odtąd wynagrodzenia znów będą rosnąć. [...]. Szczecin czeka świetlana przyszłość!"
szczecin.45.a: "Błędne koło"

szczecin.46.t: "To będzie fantastyczny rok dla Pomorza Zachodniego"
szczecin.46.desc: "Prezydent Krzystek odchrząknął.\n- Bracia. Siostry. Obywatele Pomorza Zachodniego.\nTłum ucichł. Nawet mewy krążące nad głowami zdawały się znieruchomieć.\n- Dziś przemawiam do was nie jako prezydent, lecz jako sąsiad. Pomorzanin. Nie dzięki cudowi ani łasce zaszliśmy tak daleko. Zawdzięczamy to pracy naszych stoczniowców, dłoniom naszych rolników, pomysłowości inżynierów i niezłomnej woli naszego ludu. W najmroczniejszych godzinach - kiedy zawodziło zasilanie, brakowało żywności, a wszystko zdawało się stracone - to wy, zwykłe kobiety i zwykli mężczyźni Pomorza Zachodniego, utrzymaliście pozycje.\n\nUniósł wzrok i przesunął nim po twarzach pełnych nadziei, lecz pooranych trudem.\n- Ale zrobiliśmy to. Na Boga, zrobiliśmy. Po trudnościach - wytrwałość. Po ruinie - zdecydowanie. A teraz, po długiej i gorzkiej walce, stoimy u świtu nowego rozdziału naszej historii. Próby były liczne, droga stroma i usiana przeszkodami, lecz nie zachwialiśmy się. Nie ugięliśmy. I nie daliśmy się złamać.\nWybuchły wiwaty - powściągliwe, lecz szczere.\n\n- Własnymi rękami odbudowaliśmy stocznie. Oczyściliśmy Odrę. Przywróciliśmy ogrzewanie w Kołobrzegu, a Stargardowi Szczecińskiemu jego prawowitą nazwę. Dzieci nie kładą się już spać w zimnie. Rodziny, które kiedyś rozdzieliła desperacja, dziś znów siedzą razem przy stołach zastawionych chlebem, masłem i dobrym paprykarzem. Gdy inni kłócą się o resztki dawnego kraju, my wykuliśmy coś nowego. Coś dumnego. Nie jesteśmy jakąś oderwaną, zapomnianą prowincją. Jesteśmy odrodzonym Szczecinem - sercem Zachodu, bastionem przyszłości.\nTeraz tłum już należał do niego. Krzyczał. Gwizdał. Krzystek pozwolił, by wrzawa narastała przez chwilę, po czym uniósł dłonie.\n\n- Nie popadajmy jednak w samozachwyt. Nadal mamy pracę do wykonania. Południe spogląda na nas z zazdrością - i lękiem. Niektórzy chcieliby wypaczyć nasz sukces i rozpruć naszą jedność. Lecz póki oddycham, przysięgam wam: ten rząd, wasz rząd, będzie służył wam. Nie zagranicznym spekulantom. Nie samozwańczym panom i baronom. Ludowi - naszemu ludowi. Nie będziemy rządzeni z Berlina ani pouczani przez obcych, którzy w jednej ręce trzymają kontrakty, a w drugiej kajdany. Nie jesteśmy resztkami upadłej republiki - jesteśmy żywym sercem ziem zachodnich i nie spoczniemy, dopóki każdy Polak, od Bugu po Odrę, nie będzie znów wolny, syty i szczęśliwy pod jednym sztandarem.\n- Wznieście więc kieliszki. Wznieście nadzieje. I wychowujcie dzieci w kraju, w którym życie nie jest tylko znośne - jest cholernie wspaniałe! Ten dzień wyznacza początek wielkiej nowej epoki dla naszego miasta i regionu!\nOrkiestra zagrała hymn. Ludzie wstali. I przez chwilę, pod rozległym błękitnym niebem, niemal wydawało się, że wygrali już wszystko."
szczecin.46.a: "Lecz los... ma własne plany."

szczecin.47.t: "Oczy w lesie"
szczecin.47.desc: "Nazywaliśmy to patrolem, ale nigdy nim nie miało być.\n\nOśmiu z nas szło gęsiego przez bagna gdzieś na północ od Starego Drawska. Błoto zasysało buty, a spocone dłonie ściskały karabiny. Deszcz nie ustawał od wielu dni, a mgła była tak gęsta, że można było się nią udławić. Gdzieś nad nami dron brzęczał jak mucha nad trupem, lecz na tych przeklętych mokradłach oczy nic nie znaczyły. Oni już nas obserwowali. Pamiętam, jak sierżant Wilczek wyszeptał: \"Trzymać się blisko. Za cicho\". Minutę później jego głowa eksplodowała. Po prostu zniknęła. W jednej sekundzie jeszcze tam był, z ustami otwartymi w połowie słowa, a w następnej został kikut tryskający różową mgłą.\n\nPotem świat wybuchł. Jaszczury dopadły nas niczym duchy, wyłażąc z wody, trzcin i pieprzonych drzew. Zamaskowani jak mech i błoto, błyskali oczami zza domowej roboty masek gazowych w kształcie wilczych pysków. Pierwsza salwa strzał i pocisków powaliła Janka i Bartka - Bartek nawet nie krzyknął, tylko osunął się pod wodę, jakby ciągnęła go do domu. Strzelaliśmy na oślep. Ogień zwrotny w piekle mgły. Miotacz ognia rozświetlił opary, ale trafił jedynie w drzewo - a potem drzewo trafiło w nas. Powietrze wypełniły płonąca kora i krzyki. Uciekłem. Nie pamiętam, żebym podjął taką decyzję, ale nogi same ruszyły. Obok mnie Piotrek potknął się i wrzasnął, gdy coś chwyciło go za kostkę i wciągnęło w trzciny. Krzyk urwał się z mokrym chrupnięciem.\n\nPrzegrupowaliśmy się - to, co z nas zostało. Czterech z ośmiu. Dawid mamrotał modlitwy między szlochami. Oni nas nie ścigali. Polowali na nas. Powoli. Cierpliwie. Jednego po drugim. Dostrzegaliśmy ruch, otwieraliśmy ogień, a potem nie zostawało nic prócz ciszy. A następnie przychodziło wycie. Przeklęte wycie. Kilka minut później odkrywaliśmy, że znów kogoś brakuje. Widziałem, jak Kazek wpada do dołu wyłożonego zaostrzonymi prętami zbrojeniowymi - w jednej chwili był obok, a w następnej pochłonęła go ziemia. Nie zdołaliśmy go nawet wyciągnąć. Próbowaliśmy.\n\nBóg jeden wie, jak długo czołgałem się na brzuchu, zlany krwią i wodą z bagna, aż dotarłem do granicy obszaru patrolowego. Znalazł mnie oddział ewakuacyjny, lecz potrafiłem jedynie mamrotać o piekle. Z ośmiu wróciło żywych trzech. Jeden zastrzelił się następnego dnia. Nazywali nas żołnierzami Szczecina, lecz byliśmy tylko amatorami w starych mundurach, którzy udawali kogoś, kim nie są. A oni - ci odmieńcy, te potwory wyjące we mgle - byli tam u siebie.\n\nNazywaliśmy to patrolem. Wkroczyliśmy na cudzy teren.\n\nA wilki nie wybaczają intruzom. Już nie. Nie odkąd Związek Jaszczurczy zażądał naszego losu."
szczecin.47.a: "I pochłonie jeszcze wielu..."

szczecin.48.t: "Prośba dyplomatyczna"
szczecin.48.desc: "Do: Dowództwo Centralne NORDBAT\nOd: Kancelaria Prezydenta Szczecina, Piotr Krzystek\nTemat: Pokorna prośba o wycofanie obcych wojsk z ziemi polskiej.\n\nSzanowni Dowódcy NORDBAT,\n\nz najwyższym szacunkiem i wdzięcznością za Państwa służbę piszę nie tylko jako prezydent Szczecina, lecz jako syn Polski, który był świadkiem zarówno trudów okupacji, jak i delikatnego rozkwitu nadziei.\n\nNie ulega wątpliwości, że w burzliwych dniach po Upadku Państwa obecność przyniosła namiastkę porządku i organizacji. Dobrze pamiętamy chaos, który ogarnął nasze miasta. Nie zapominamy jednak również o poświęceniu nordyckich sił pokojowych, które stanęły między naszym ludem a otchłanią.\n\nNadszedł jednak czas, aby Polska znów zaczęła chodzić o własnych siłach. Mieszkańcy Pomorza Zachodniego, podobnie jak tak wielu ludzi w całym tym zranionym kraju, pragną prawdziwej suwerenności - nie tylko w teorii, lecz w rzeczywistości. Każdy zagraniczny patrol przemierzający nasze ziemie, bez względu na dobre intencje, przypomina, że nasz los nadal nie spoczywa w naszych rękach.\n\nNie piszę, by żądać ani oskarżać. Piszę, by prosić - nie tylko we własnym imieniu, lecz w imieniu dziesiątek tysięcy Polaków, którzy wciąż po cichu śpiewają hymn narodowy za zamkniętymi drzwiami. Pozwólcie nam odzyskać miejsce w świecie jako wolny i samorządny naród. Pozwólcie naszym instytucjom rosnąć bez obcego rusztowania. Pozwólcie nam odnieść sukces lub ponieść porażkę, gdyż tylko ta droga wiedzie ku godności.\n\nRozumiemy, że Państwa misją była stabilizacja, a nie podbój. Teraz, gdy sytuacja powoli się poprawia, a lokalne władze ponownie zapuszczają korzenie, pokornie proszę o rozważenie uporządkowanego i stopniowego wycofania sił NORDBAT z terytorium Polski. Pozwólcie naszym obywatelom poczuć ciężar i przywilej wolności.\n\nJeżeli mamy odbudować Polskę, musimy otrzymać prawo, by uczynić to na polskich warunkach.\n\nZ wyrazami najgłębszego szacunku,\nPiotr Krzystek\nPrezydent Szczecina\nRząd Tymczasowy Szczecina"
szczecin.48.a: "Miejmy nadzieję, że unikniemy bezsensownej przemocy."

szczecin.49.t: "Odmowa"
szczecin.49.desc: "Przez ostatnie miesiące Szczecin tonął w ryku wojskowych ciężarówek pędzących ulicami i syrenach statków transportowych opuszczających port. Wojna o województwo weszła w ostatnią fazę, a misja humanitarna Organizacji Narodów Zjednoczonych, która wylądowała w rejonie Darłowa, była jednym z nielicznych pozostałych punktów oporu.\nGdy mieszkańcy Pomorza Zachodniego z niepokojem czekali na odpowiedź ONZ na oficjalne żądanie rządu dotyczące wycofania z Polski, nadeszła druzgocąca wiadomość: odpowiedzią była stanowcza odmowa.\n\nArmia Rządu Tymczasowego ponownie rusza więc do boju, gdy siły Zachodu raz jeszcze wkraczają na polską ziemię, odbierając jej dzieciom możliwość samodzielnego urzeczywistnienia losu własnego i swojego kraju, na niezależnych warunkach."
szczecin.49.a: "Krew przelana na próżno."

