STE_railway_szczecin_swinoujscie: "Odnów linię kolejową §YSzczecin-Świnoujście§!"
STE_railway_szczecin_swinoujscie_desc: "W chaosie Upadku linia między §YSzczecinem§! a §YŚwinoujściem§! popadła w ruinę. Brakuje szyn - najpewniej przetopionych dla zysku - oraz podkładów kolejowych - zapewne spalonych dla ogrzania domów. Zapewnienie niezawodnego połączenia między tymi miastami zwiększy nasze możliwości handlowe i morskie, gdyż porty w Szczecinie i Świnoujściu są ze sobą ściśle powiązane."
STE_railway_szczecin_choszczno: "Odnów linię kolejową §YSzczecin-Choszczno§!"
STE_railway_szczecin_choszczno_desc: "W chaosie Upadku linia między §YSzczecinem§! a §YChoszcznem§! popadła w ruinę. Brakuje szyn - najpewniej przetopionych dla zysku - oraz podkładów kolejowych - zapewne spalonych dla ogrzania domów. Choć Choszczno może wyglądać na małe i nieistotne miasteczko na południu naszego województwa, w rzeczywistości jest ważnym terenem koncentracji oraz węzłem zaopatrzeniowym dla naszej armii na wypadek nieuniknionej konfrontacji z Wielkopolską."
STE_railway_swinoujscie_kolobrzeg: "Zbuduj linię kolejową §YŚwinoujście-Kołobrzeg§!"
STE_railway_swinoujscie_kolobrzeg_desc: "Niezawodne, bezpośrednie połączenie między §YŚwinoujściem§! a §YKołobrzegiem§! nigdy nie istniało. Jako pierwsi połączymy te malownicze nadmorskie miasta. Choć linia może nie mieć znaczenia strategicznego dla naszej armii, marynarki ani korporacji, stanie się częścią większego projektu połączenia całego wybrzeża Bałtyku niezawodną siecią kolejową."
STE_railway_kolobrzeg_koszalin: "Odnów linię kolejową §YKołobrzeg-Koszalin§!"
STE_railway_kolobrzeg_koszalin_desc: "W chaosie Upadku linia między §YKołobrzegiem§! a §YKoszalinem§! popadła w ruinę. Brakuje szyn - najpewniej przetopionych dla zysku - oraz podkładów kolejowych - zapewne spalonych dla ogrzania domów. Odbudowa tej trasy jest kolejną częścią naszego projektu połączenia wybrzeża Bałtyku niezawodną siecią kolejową, dla dobra obywateli."
STE_railway_koszalin_walcz: "Zbuduj linię kolejową §YKoszalin-Wałcz§!"
STE_railway_koszalin_walcz_desc: "Niezawodne, bezpośrednie połączenie między §YKoszalinem§! a §YWałczem§! nigdy nie istniało. Jako pierwsi połączymy te miasta. Wałcz może wydawać się kolejnym małym i nieistotnym miasteczkiem na południu Pomorza Zachodniego, lecz stanowi także ważny teren koncentracji i węzeł zaopatrzeniowy - zarówno na potrzeby konfrontacji z watażkami na południu, jak i na wschodzie."

