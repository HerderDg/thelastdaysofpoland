STE_restore_village_decision: "Rewitalizacja wsi"
STE_restore_village_decision_desc: "Nasze obszary wiejskie zdecydowanie zbyt długo pozbawione były maszyn, pasz i nawozów potrzebnych do rozwoju rodzimej produkcji żywności. Dzięki szybkiej rozbudowie wiejskiego budownictwa mieszkaniowego i infrastruktury przyciągniemy siłę roboczą niezbędną do walki z narastającym zagrożeniem dalszym racjonowaniem żywności oraz możliwym głodem."
STE_housing_project_1: "Budownictwo mieszkaniowe"
STE_housing_project_1_desc: "Równolegle z dostarczaniem maszyn i rozbudową przemysłu musimy kontynuować budowę domów odpowiadających potrzebom życia rodzinnego. Skorzystamy z pomocy prywatnych wykonawców doświadczonych w przemienianiu rozległych, niewykorzystanych terenów w niekończące się podmiejskie osiedla. Podmiejski dom jednorodzinny dla każdego ciężko pracującego obywatela Polski!"
STE_housing_project_2: "Budownictwo mieszkaniowe"
STE_housing_project_2_desc: "Równolegle z dostarczaniem maszyn i rozbudową przemysłu musimy kontynuować budowę domów odpowiadających potrzebom życia rodzinnego. Budowę sfinansujemy wyłącznie ze środków państwowych, zapewniając każdemu obywatelowi naszej [GetCountryGovernmentForm] rozległe, jednolite i ekonomiczne dachy nad głową."
STE_secure_production_decision: "Zabezpiecz możliwości przemysłowe"
STE_secure_production_decision_desc: "Ponowne wyposażenie zakładów, reindustrializacja i modernizacja naszych zdolności mają pierwszorzędne znaczenie dla podniesienia poziomu życia każdego obywatela naszej [GetCountryGovernmentForm]. Będziemy nieustannie rozbudowywać własną bazę przemysłową."

STE_netto_reward: "Dodatkowe zaopatrzenie cywilne - §YNetto§!"
STE_netto_reward_desc: "Powołując się na kilka przysług i smarując odpowiednie dłonie w Netto, zdobędziemy dodatkowe towary dla sklepów oraz usług w całym kraju, zyskując przy tym większą przychylność ludności."
STE_chemiewerke_reward: "Nadzór przemysłowy - §PChemiewerke§!"
STE_chemiewerke_reward_desc: "Smarując odpowiednie dłonie w Chemiewerke, tymczasowo przekażemy przedsiębiorstwu nadzór nad kluczowymi gałęziami przemysłu surowcowego w całym kraju, zwiększając ich wydajność - kosztem dobrostanu naszych robotników."
STE_pzm_reward: "Współpraca przemysłowa - §RPolsteam§!"
STE_pzm_reward_desc: "Powołując się na kilka przysług w PŻM, przeniesiemy ciężar części operacji przemysłowych na zakłady Polsteam, dzięki czemu nasze fabryki będą mogły tymczasowo skupić się na innych zadaniach."

