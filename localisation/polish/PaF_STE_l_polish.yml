STE_loza_biznesmenow_desc: ""
STE_piotr_Krzystek_desc: "Wybrany na prezydenta Szczecina jeszcze w 2006 roku Piotr Krzystek wraz z ówczesnymi prezydentami innych zachodnich miast sprzeciwiał się polityce PiS. Po utracie przychylności Donalda Tuska w 2010 roku stał się bastionem bezpartyjności na skraju burzliwego politycznego sztormu, który ogarnął Polskę - szczególnie gdy w 2025 roku Warszawa wysłała wojsko do stłumienia zamieszek.\n\nKiedy na prośbę Tuska ogłoszono interwencję Eurokorpusu, nieuprzedzony o niej Krzystek powitał w mieście złożone głównie z Niemców oddziały. Z jednej strony jego poglądom było znacznie bliżej do Berlina niż Warszawy, z drugiej zaś położenie Szczecina tuż przy niemieckiej granicy stawiało miasto w niebezpiecznej sytuacji, dlatego interwencję przyjęto bez oporu. Operacja, która miała przebiegać pokojowo, wkrótce przerodziła się jednak w otwartą wojnę z lojalistycznymi jednostkami Wojska Polskiego.\n\nW miarę pogarszania się sytuacji na froncie Krzystka usunięto ze stanowiska. Nowa niemiecka administracja nazwała to \"zapobieganiem możliwemu lokalnemu powstaniu\", lecz w jego przekonaniu z pewnością była to małostkowa zemsta Tuska. Były prezydent zszedł do podziemia i utworzył grupę oporu - Gwardia Gryficka - której celem stało się obalenie niemieckich sił okupacyjnych.\n\nPo miesiącach walki z miejscowymi władzami, dzięki poparciu dwóch z trzech korporacji Hanzy, wreszcie odniesiono zwycięstwo. Gdy Eurokorpus się wycofał, Gryf ponownie wzbił się nad Szczecinem. Teraz Krzystek, jako przywódca zachodniopomorskiego mocarstwa, może umocnić swoje rządy, a lojalna mu ludność nareszcie żyć wolna od błędów zarówno Warszawy, jak i Berlina."
STE_lindner_desc: "Christian Lindner, przywódca Freie Demokratische Partei i były minister finansów Eurostaatu, po niezbyt owocnej walce o władzę w Berlinie w przededniu interwencji został mianowany Gouverneurem Wolnego Miasta Stettin. Nie wiadomo, przynajmniej oficjalnie, czy posunięcie to naprawdę stanowiło awans, jak sugerowała wystawna uroczystość na starym Zamku Książąt Pomorskich, czy też było karą za zbyt głośne krytykowanie działań kolegów podczas operacji. Odsunięcie na boczny tor, wyrzucenie z sal Bundestagu i wysłanie do pilnowania niechętnej zdobyczy z konfliktu, któremu osobiście się sprzeciwiał, pozostawiło w Lindnerze głęboką gorycz wobec rodaków w Berlinie.\n\nNowy gubernator rozpaczliwie próbuje utrzymać porządek i zapewnić dobrobyt Lubeki Vorpommernu, lecz nieustanne protesty i działania powstańcze polskiej ludności czynią to zadanie wszystkim, tylko nie łatwym. Zdesperowany, by wywalczyć choć odrobinę autonomii spod kontrolującego uścisku Eurokommissariatu Westpolen, a zarazem zbyt dumny, by polegać na pomocy tych, którzy nim wzgardzili, Lindner został zmuszony do zawierania pragmatycznych układów z ludźmi, którymi miał rządzić twardą ręką. Wypełnił swoją administrację doradcami pochodzącymi z wpływowych regionalnych korporacji: Polsteam, Netto i Chemiewerke Pölitz.\n\nLindner miał nadzieję, że znaczne przywileje gospodarcze przyznane miejscowym przedsiębiorstwom pomogą mu utrzymać porządek, lecz szybko przekonał się, że został przyparty do kolejnego muru. Widząc, jak wielkie wpływy mogą zdobyć, jeśli połączą siły, Wielka Trójka zjednoczyła się i utworzyła Gildię Hanzeatycką - organizację, która błyskawicznie ustanowiła oligopol obejmujący cały sektor finansowy miasta, skutecznie zaciskając pętlę, na której zawiśnie gubernator, jeśli kiedykolwiek wyjdzie przed szereg.\n\nNękana przez brutalnych powstańców i bezwzględnych kapitalistów administracja Lindnera stoi na niebezpiecznie chwiejnym gruncie. Na razie Stadtpolizei, przy umiarkowanym wsparciu miejscowego garnizonu Eurokorpusu z Eurokommissariatu Westpolen, utrzymuje kruchy pokój - albo przynajmniej jego pozory. §RNie wiadomo jednak, czy równowaga ta się utrzyma, czy też, podobnie jak wtedy, gdy niemieckie formacje przetoczyły się przez polską ziemię, Stettin okaże się pierwszą kostką domina skazaną na upadek.§!"
