pzm_tooltip: "[GetPZMTooltip]"
chemiewerke_tooltip_germ: "§PChemiewerke \"Pölitz\" AG§! - a właściwie Zakłady Chemiczne \"Police\" SA - to olbrzymi kompleks przemysłowy, jeden z sześciu wielkich zakładów syntezy chemicznej w kraju. Zbudowany w latach 1964-1970, skupiał się na produkcji nawozów mających wyżywić rosnącą ludność Polski. Rozbudowany po wejściu w skład państwowej Grupy Azoty w 2011 roku, stanowi imponujący cud przemysłu i strategiczny punkt na mapie Polski.\n\nUpadek i późniejsza interwencja nie obeszły się z nim jednak łaskawie. Zakład wyrwano z polskich rąk, sprywatyzowano i oddano w szpony niemieckich właścicieli. Służy wyłącznie zarządowi i akcjonariuszom, pomnażając ich majątki z każdym kłębem dymu wydobywającym się z kominów górujących nad Policami."
nochemiewerke_tooltip: "§PChemiewerke \"Pölitz\" AG§! - wymknęło się spod naszej władzy podczas powstania."
chemiewerke_tooltip_polish: "§PChemiewerke \"Pölitz\" AG§! - a właściwie Zakłady Chemiczne \"Police\" SA - to olbrzymi kompleks przemysłowy, jeden z sześciu wielkich zakładów syntezy chemicznej w kraju. Zbudowany w latach 1964-1970, skupiał się na produkcji nawozów mających wyżywić rosnącą ludność Polski. Rozbudowany po wejściu w skład państwowej Grupy Azoty w 2011 roku, stanowi imponujący cud przemysłu i strategiczny punkt na mapie Polski.\n\nUpadek i późniejsza interwencja nie obeszły się z nim jednak łaskawie. Zakład wyrwano z polskich rąk, sprywatyzowano i oddano w szpony niemieckich właścicieli. Służy wyłącznie zarządowi i akcjonariuszom, pomnażając ich majątki z każdym kłębem dymu wydobywającym się z kominów górujących nad Policami.\n\nKiedy nadszedł dzień odwetu, ukryli się i ufortyfikowali w przemysłowym labiryncie na północy. Nawet z naszymi żołnierzami u bram mieli czelność zażądać \"pokojowego\" powrotu pod naszą władzę, grożąc zniszczeniem tego, co polskie ręce budowały i ulepszały przez ponad 60 lat. Teraz, ponownie w Gildii Hanzeatyckiej, jesteśmy zmuszeni zawierać układy i szukać kompromisów, jakby nic się nie wydarzyło.\n\n§YLojalni wobec niemieckiej sprawy i ich misji \"stabilizowania\" Polski wszelkimi dostępnymi środkami z pewnością okażą się zawadą i siłą skłonną do zdrady. Na domiar wszystkiego władają najbardziej uprzemysłowionym regionem województwa. Ależ mamy szczęście.§!"
netto_tooltip_germ: "§FNetto Polska§! - polski oddział duńskiego przedsiębiorstwa Netto powstał w 1995 roku, a jego pierwszy sklep i siedzibę otwarto właśnie tutaj, w Szczecinie. Od tamtej pory sieć rozwijała się nieprzerwanie, otwierając placówki w całej zachodniej i północnej Polsce. Po przejęciu polskiego oddziału Tesco w 2020 roku stała się jednym z największych graczy na rynku handlu detalicznego, zaś polskie supermarkety stanowiły niemal połowę wszystkich sklepów sieci na świecie.\n\nNie było zaskoczeniem, że po interwencji Netto Polska pozostało w dużej mierze niezależnym graczem. Choć wiele sklepów zniszczono, splądrowano lub porzucono, przedsiębiorstwo wciąż działa na polskiej ziemi w ograniczonym zakresie, niosąc cuda konsumpcjonizmu miastom i miasteczkom nie tylko Pomorza, ale całej Polski."
netto_tooltip_polish: "§FNetto Polska§! - polski oddział duńskiego przedsiębiorstwa Netto powstał w 1995 roku, a jego pierwszy sklep i siedzibę otwarto właśnie tutaj, w Szczecinie. Od tamtej pory sieć rozwijała się nieprzerwanie, otwierając placówki w całej zachodniej i północnej Polsce. Po przejęciu polskiego oddziału Tesco w 2020 roku stała się jednym z największych graczy na rynku handlu detalicznego, zaś polskie supermarkety stanowiły niemal połowę wszystkich sklepów sieci na świecie.\n\nNie było zaskoczeniem, że po interwencji Netto Polska pozostało w dużej mierze niezależnym graczem. Choć wiele sklepów zniszczono, splądrowano lub porzucono, przedsiębiorstwo wciąż działa na polskiej ziemi w ograniczonym zakresie, niosąc cuda konsumpcjonizmu miastom i miasteczkom nie tylko Pomorza, ale całej Polski. Cały ten słodki przychód trafia przede wszystkim do nich. Kiedy jednak upadek Eurokomisariatów stał się nieunikniony, rzucili swój ciężar na naszą szalę, znacznie pomagając partyzantom w walce o niepodległość - nawet jeśli był to jedynie oczywisty akt oportunizmu.\n\n§YNetto Polska troszczy się o jedną i tylko jedną rzecz - przychód. Sprawy rządu nie obchodzą ich, dopóki władza nie narusza ich wyniku finansowego.§!"
pzm_tooltip_germ: "§RPolska Żegluga Morska (Polsteam)§! - PŻM, pierwotnie państwowe przedsiębiorstwo utworzone w 1951 roku z połączenia przedwojennych podmiotów handlu morskiego, jest przesiąknięta historią. Początkowo zajmowała się głównie żeglugą trampową i stale się rozwijała, osiągając szczyt wraz z zakupem kilku statków klasy lakemax tuż przed upadkiem Polski. Podczas przeklętej interwencji PŻM, której główna siedziba znajdowała się w Szczecinie, szybko dostała się pod kontrolę Eurokommissariatu Westpolen. \n\nJako jedno z niewielu potężnych polskich przedsiębiorstw w regionie zachowała jednak swój zarząd i doskonale zorganizowane związki zawodowe, unikając powszechnej germanizacji miejscowej administracji oraz brutalnych represji wymierzonych w polskie organizacje."
pzm_tooltip_polish: "§RPolska Żegluga Morska (Polsteam)§! - PŻM, pierwotnie państwowe przedsiębiorstwo utworzone w 1951 roku z połączenia przedwojennych podmiotów handlu morskiego, jest przesiąknięta historią. Początkowo zajmowała się głównie żeglugą trampową i stale się rozwijała, osiągając szczyt wraz z zakupem kilku statków klasy lakemax tuż przed upadkiem Polski. Podczas przeklętej interwencji PŻM, której główna siedziba znajdowała się w Szczecinie, szybko dostała się pod kontrolę Eurokommissariatu Westpolen. \n\nNa szczęście, jako jedno z niewielu potężnych polskich przedsiębiorstw w regionie, zachowała swój zarząd i doskonale zorganizowane związki zawodowe, unikając powszechnej germanizacji miejscowej administracji oraz brutalnych represji wymierzonych w polskie organizacje. Pozwoliło to PŻM wspierać nasze powstanie i smarować odpowiednie dłonie w Wolnym Mieście na naszą korzyść. \n\nTeraz, ponownie na wolnej polskiej ziemi i wodach, zarząd pozostaje jak dotąd niewzruszenie lojalny wobec nowego rządu i gotowy wesprzeć nasze dążenie do zjednoczenia.\n\n§YNie uznawajmy jednak ich poparcia za coś oczywistego - przedsiębiorstwo nadal musi chronić swoje żywotne interesy i znajduje się pod presją Gildii Hanzeatyckiej oraz mniej przychylnych rządowi środowisk we własnych szeregach.§!"

