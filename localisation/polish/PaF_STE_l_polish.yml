##Ideas##
STE_griffon_partisans: "Gwardia Gryficka"
STE_griffon_partisans_desc: "Miasto Stettin nękają niezliczone grupy powstańców, które sabotują reżim niemal na każdym szczeblu jego działalności. Aktywność wywrotowa rozciąga się od oklejania przestrzeni publicznej ulotkami wymierzonymi we władzę i bezmyślnego wandalizmu aż po uzbrojone milicje, które regularnie ścierają się z miejscową policją. Stadtpolizei rozprasza siły, próbując gasić ogniska rebelii, lecz niczym w przypadku hydry ugaszenie jednego płomienia sprawia, że dwa kolejne wybuchają gdzie indziej. Przypierani do coraz ciaśniejszego muru z trudem doprowadzamy cokolwiek do końca w obecnych warunkach."
STE_anti_partisan: "Operacje przeciwpartyzanckie"
STE_anti_partisan_desc: "Niedawny napływ świeżych funkcjonariuszy i nowo zaszczepiony zapał, wzmocniony rozmaitymi nazbyt hojnymi premiami, pozwoliły Stadtpolizei stawić opór miejscowym powstańcom i przejść do kontrataku. Szala przechyla się na korzyść rządu, dlatego Eurokorpus rozpoczął w całym mieście i jego okolicach wielkie polowanie na czarownice, mające zdławić wszelkie pozostałości zorganizowanego oporu. Administracja Lindnera żywi nadzieję, że te ostateczne represje wystarczą, by złamać buntowniczego ducha ludności."
STE_emergency_powers_idea: "Uprawnienia nadzwyczajne"
STE_emergency_powers_idea_desc: "Wojna czai się na horyzoncie, dlatego musimy wykorzystać każde dostępne narzędzie, by ocalić młodą republikę. Unia i Zamek jednogłośnie uchwaliły nadzwyczajne prawa, oddając rządowi tymczasowemu oraz prezydentowi środki pozwalające zmiażdżyć każdego szaleńca dość zuchwałego, by podnieść rękę na walkę o dalsze istnienie państwa polskiego."
STE_emergency_powers_civilian_idea: "Przekierowane uprawnienia nadzwyczajne"
STE_emergency_powers_civilian_idea_desc: "Ogień wojny przetoczył się przez Pomorze; Polak stanął przeciw Polakowi, brat przeciw bratu. Nasza wizja przyszłości przetrwała i zwyciężyła, ale zapłaciliśmy za to wysoką cenę. Gospodarka i lud ledwo utrzymują się na powierzchni. Uprawnienia ustanowione przed wybuchem walk, by utrzymać stabilność i pokonać wrogów, zostały rozbrojone i skierowane na front wewnętrzny, gdzie miażdżą problemy ekonomiczne zwykłego człowieka. Za Republikę!"
STE_emergency_powers_waning_idea: "Odwilż gospodarcza"
STE_emergency_powers_waning_idea_desc: "Ogień wojny przetoczył się przez Pomorze; Polak stanął przeciw Polakowi, brat przeciw bratu. Nasza wizja przyszłości przetrwała i zwyciężyła, ale zapłaciliśmy za to wysoką cenę. Gospodarka i lud ledwo utrzymują się na powierzchni. Uprawnienia ustanowione przed wybuchem walk, by utrzymać stabilność i pokonać wrogów, zostały zniesione, uwalniając zwykłego człowieka spod jarzma koniecznej wówczas ingerencji i kontroli państwa. Za Republikę!"
#STE_zamek_idea: "Unia Konserwatywno-Liberalna 'Zamek'"
#STE_unia_idea: "Unia Letnia"
STE_fertilizer_giant_idea: "Chemiewerke 'Pölitz' AG"
STE_fertilizer_giant_idea_desc: "§PChemiewerke \"Pölitz\" AG§! - a właściwie Zakłady Chemiczne \"Police\" SA - to olbrzymi kompleks przemysłowy, jeden z sześciu wielkich zakładów syntezy chemicznej w kraju. Zbudowany w latach 1964-1970, skupiał się na produkcji nawozów mających wyżywić rosnącą ludność Polski. Rozbudowany po wejściu w skład państwowej Grupy Azoty w 2011 roku, stanowi imponujący cud przemysłu i strategiczny punkt na mapie Polski.\n\nUpadek i późniejsza interwencja nie obeszły się z nim jednak łaskawie. Zakład wyrwano z polskich rąk, sprywatyzowano i oddano w szpony niemieckich właścicieli. Służy wyłącznie zarządowi i akcjonariuszom, pomnażając ich majątki z każdym kłębem dymu wydobywającym się z kominów górujących nad Policami.\n\nKiedy nadszedł dzień odwetu, ukryli się i ufortyfikowali w przemysłowym labiryncie na północy. Nawet z naszymi żołnierzami u bram mieli czelność zażądać \"pokojowego\" powrotu pod naszą władzę, grożąc zniszczeniem tego, co polskie ręce budowały i ulepszały przez ponad 60 lat. Teraz, ponownie w Gildii Hanzeatyckiej, jesteśmy zmuszeni zawierać układy i szukać kompromisów, jakby nic się nie wydarzyło.\n\n§YLojalni wobec niemieckiej sprawy i ich misji \"stabilizowania\" Polski wszelkimi dostępnymi środkami z pewnością okażą się zawadą i siłą skłonną do zdrady. Na domiar wszystkiego władają najbardziej uprzemysłowionym regionem województwa. Ależ mamy szczęście.§!"

STE_what_happens_in_police_stays_in_police_idea: "Korporacyjne miasto Police"
STE_what_happens_in_police_stays_in_police_idea_desc: ""

STE_taste_of_the_west_idea: "Netto Polska"
STE_taste_of_the_west_idea_desc: "§FNetto Polska§! - polski oddział duńskiego przedsiębiorstwa Netto powstał w 1995 roku, a jego pierwszy sklep i siedzibę otwarto właśnie tutaj, w Szczecinie. Od tamtej pory sieć rozwijała się nieprzerwanie, otwierając placówki w całej zachodniej i północnej Polsce. Po przejęciu polskiego oddziału Tesco w 2020 roku stała się jednym z największych graczy na rynku handlu detalicznego, zaś polskie supermarkety stanowiły niemal połowę wszystkich sklepów sieci na świecie.\n\nNie było zaskoczeniem, że po interwencji Netto Polska pozostało w dużej mierze niezależnym graczem. Choć wiele sklepów zniszczono, splądrowano lub porzucono, przedsiębiorstwo wciąż działa na polskiej ziemi w ograniczonym zakresie, niosąc cuda konsumpcjonizmu miastom i miasteczkom nie tylko Pomorza, ale całej Polski. Cały ten słodki przychód trafia przede wszystkim do nich. Kiedy jednak upadek Eurokomisariatów stał się nieunikniony, rzucili swój ciężar na naszą szalę, znacznie pomagając partyzantom w walce o niepodległość - nawet jeśli był to jedynie oczywisty akt oportunizmu.\n\n§YNetto Polska troszczy się o jedną i tylko jedną rzecz - przychód. Sprawy rządu nie obchodzą ich, dopóki władza nie narusza ich wyniku finansowego.§!"
STE_monopoly_on_marine_trade_idea: "Bałtycki monopol"
STE_monopoly_on_marine_trade_idea_desc: "Mając w rękach kluczowe porty Szczecina, Świnoujścia, Gdyni i Gdańska, kontrolujemy cały ruch handlowy prowadzący na Morze Bałtyckie i dalej. Daje nam to olbrzymią przewagę polityczną, dyplomatyczną i strategiczną nad każdym, kto ośmieli się zagrozić naszemu państwu. Dzięki nieprzerwanemu zaangażowaniu PŻM w stabilność i rozwój narodu będziemy dalej wykuwać przyszłość naszego ludu z zasobów, które czerpiemy z tego korzystnego położenia."
STE_rusty_but_trusty_idea: "Polsteam"
STE_rusty_but_trusty_idea_desc: "§RPolska Żegluga Morska (Polsteam)§! - PŻM, pierwotnie państwowe przedsiębiorstwo utworzone w 1951 roku z połączenia przedwojennych podmiotów handlu morskiego, jest przesiąknięta historią. Początkowo zajmowała się głównie żeglugą trampową i stale się rozwijała, osiągając szczyt wraz z zakupem kilku statków klasy lakemax tuż przed upadkiem Polski. Podczas przeklętej interwencji PŻM, której główna siedziba znajdowała się w Szczecinie, szybko dostała się pod kontrolę Eurokommissariatu Westpolen. \n\nNa szczęście, jako jedno z niewielu potężnych polskich przedsiębiorstw w regionie, zachowała swój zarząd i doskonale zorganizowane związki zawodowe, unikając powszechnej germanizacji miejscowej administracji oraz brutalnych represji wymierzonych w polskie organizacje. Pozwoliło to PŻM wspierać nasze powstanie i smarować odpowiednie dłonie w Wolnym Mieście na naszą korzyść. \n\nTeraz, ponownie na wolnej polskiej ziemi i wodach, zarząd pozostaje jak dotąd niewzruszenie lojalny wobec nowego rządu i gotowy wesprzeć nasze dążenie do zjednoczenia.\n\n§YNie uznawajmy jednak ich poparcia za coś oczywistego - przedsiębiorstwo nadal musi chronić swoje żywotne interesy i znajduje się pod presją Gildii Hanzeatyckiej oraz mniej przychylnych rządowi środowisk we własnych szeregach.§!"

STE_market_forces: "Siły rynkowe"
STE_market_forces_desc: "Dzięki poparciu swojego zarządu Hanza stała się fundamentem naszej potęgi wojskowej. Bez jej pomocy nawet nie zbliżylibyśmy się do obecnych możliwości, a nasze losy - na dobre i na złe - splatają się coraz ciaśniej. Być może zawarliśmy pakt z diabłem, lecz dopóki Gildia Hanzeatycka widzi w nas wartościowego partnera, nasza machina wojenna pozostanie dobrze finansowana i naoliwiona, zdolna powalić każdego wroga. Taka pomoc nigdy nie przychodzi jednak za darmo. Gdy opadnie wojenny pył, z pewnością przypomną nam o naszej części układu."
STE_revolutionary_chaos: "Miasto w płomieniach"
STE_revolutionary_chaos_desc: "Po udanym wyzwoleniu Szczecina patriotyczny zapał ustąpił pragnieniu powrotu do normalności. Rewolucyjna próżnia władzy pozostawiła jednak miasto z problemami wymagającymi najwyższej uwagi rządu. Gangi i syndykaty przestępcze terroryzują obywateli i niemal całkowicie kontrolują kilka dzielnic. Niezliczeni mieszkańcy nie mają dostępu do podstawowych produktów, a najważniejsze usługi nie działają, sabotowane przez wycofującą się armię niemiecką. Nasze świeżo utworzone państwo zostało rozciągnięte do granic możliwości. Musimy zaradzić sytuacji, zanim lud zacznie kwestionować naszą sprawę i własną lojalność."

STE_guild_disloyal: "Gildia Hanzeatycka - §Rnielojalna§!"
STE_guild_disloyal_desc: "§YGildia Hanzeatycka§!, która kontroluje większość naszej gospodarki, straciła do nas zaufanie. Aktywnie przeszkadza w naszych działaniach i je sabotuje, dążąc do wyciśnięcia zysku bez względu na cenę. Powinniśmy jak najszybciej naprawić wzajemne stosunki, zanim ludność odczuje skutki ich monopolistycznego gniewu."
STE_guild_loyal: "Gildia Hanzeatycka - §Glojalna§!"
STE_guild_loyal_desc: "§YGildia Hanzeatycka§!, która kontroluje większość naszej gospodarki, zaczęła ufać naszym decyzjom i je szanować. Choć niechętnie, wspiera nasze działania oraz projekty, użyczając środków i siły roboczej na zaspokojenie stale rosnących potrzeb ludu oraz państwa. Wreszcie obopólnie korzystne stosunki."
STE_guild_obedient: "Gildia Hanzeatycka - §Yniejednoznaczna§!"
STE_guild_obedient_desc: "[GetHanzaDesc]"
STE_guild_obedient_GER: "§YGildia Hanzeatycka§!, która kontroluje większość naszej gospodarki, ma mieszane zdanie o rządzie i jego decyzjach. Chemiewerke wspiera nas na dobre i na złe, lecz kierownictwo Polsteam niechętnie dzieli się bogactwem oraz doświadczeniem, zaś Netto - ku zaskoczeniu absolutnie nikogo - troszczy się wyłącznie o zysk. Znaleźliśmy się w impasie. Choć nie ma między nami otwartej wrogości, sposób, w jaki Gildia Hanzeatycka ułożyła gospodarkę, czyni z nas stronę przegraną."
STE_guild_obedient_POL: "§YGildia Hanzeatycka§!, która kontroluje większość naszej gospodarki, ma mieszane zdanie o rządzie i jego decyzjach. PŻM wspiera nas na dobre i na złe, lecz kierownictwo Chemiewerke niechętnie dzieli się bogactwem oraz doświadczeniem, zaś Netto - ku zaskoczeniu absolutnie nikogo - troszczy się wyłącznie o zysk. Znaleźliśmy się w impasie. Choć nie ma między nami otwartej wrogości, sposób, w jaki Gildia Hanzeatycka ułożyła gospodarkę, czyni z nas stronę przegraną."
STE_lost_control: "Iluzja kontroli"
STE_lost_control_desc: "Oficjalnie Christian Lindner jest mianowanym Eurogouverneurem Wolnego Miasta Szczecina, odpowiedzialnym za nadzorowanie pokojowej okupacji i rozwoju tego kluczowego zachodniopomorskiego ośrodka gospodarczego.\nW rzeczywistości jego wpływ na bieg spraw jest znikomy - dowódcy wykonują bezpośrednie rozkazy Eurokommissariatu Westpolen, a gospodarka tkwi w szczelnym monopolistycznym uścisku Gildii Hanzeatyckiej.\nPłomienie rewolucji w mieście rosną, a Eurogouverneur Christian Lindner może jedynie patrzeć, jak pochłaniają wszystko, samemu mając związane ręce."
STE_hanza_investment: "Szpon za szpon"
STE_hanza_investment_desc: "Po świeżo zawartym porozumieniu powinniśmy zebrać tyle przychylności, ile zdołamy. Gildia Hanzeatycka to potężna organizacja, która może stać się naszym błogosławieństwem albo zgubą. Zachęcając ją rządowymi dotacjami, przekonaliśmy korporacje, by zapewniły gospodarce rozpęd, którego rozpaczliwie potrzebowała. Zwiększone tempo produkcji powinno pozwolić nam zakończyć niedobory i zaradzić bolączkom, na które ludność może skarżyć się w okresie odbudowy."
STE_hanza_payback: "Należna zapłata"
STE_hanza_payback_desc: "W burzliwym okresie konfliktu Gildia Hanzeatycka podała nam pomocną dłoń, dostarczając fundusze, milicje i broń. Obie strony wiedzą, że w gruncie rzeczy kierował nią instynkt samozachowawczy, gdyż jej przyszłość jest związana z naszą. Każdy dług trzeba jednak spłacić bez względu na jego przyczynę i tym razem nie będzie inaczej. W najbliższej przyszłości pozwolimy zachodniopomorskim korporacjom przestawić się na czasy pokoju i przymkniemy oko na niektóre przewinienia w imię obopólnie korzystnych stosunków."

STE_hanza_mission_failure: "Nieudana misja Hanzy"
STE_hanza_mission_failure_desc: "Nie wykonaliśmy misji powierzonej nam przez Gildię Hanzeatycką. Jej zaufanie do naszych możliwości zostało zachwiane, a my ponosimy konsekwencje."
STE_netto_taxbreak: "Ulgi podatkowe dla Netto"
STE_netto_taxbreak_desc: ""
STE_chemiewerke_blindeye: "Przymknięcie oka"
STE_chemiewerke_blindeye_desc: ""
