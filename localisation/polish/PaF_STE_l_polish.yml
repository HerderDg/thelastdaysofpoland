##Decisions##

STE_land_development_category: "Projekty rozwojowe"
STE_land_development_category_desc: "W dążeniu do stabilnej gospodarki rząd musi odgrywać aktywną rolę w kształtowaniu infrastruktury i przemysłu naszej [GetCountryGovernmentForm]. Przed Upadkiem Pomorze Zachodnie zdecydowanie zbyt długo było zaniedbywane przez rząd centralny w Warszawie. Jeśli zamierzamy dotrzymać kroku naszym wrogom, nadrobienie tych zaległości ma teraz kluczowe znaczenie."
STE_oil_fields_of_the_north_decision: "Wydobycie ropy naftowej: §YGryfice§!"
STE_oil_fields_of_the_north_decision_desc: "Północno-zachodnie wybrzeże jest wyjątkowo bogate w złoża ropy naftowej w porównaniu z resztą polskiej ziemi. Rozpoczęcie eksploatacji części z nich mogło być przed Upadkiem nieopłacalne, lecz obecna sytuacja kraju jest szczególną okolicznością, która każe nam przyjąć wszystko, czym polska ziemia zechce nas łaskawie obdarzyć."
