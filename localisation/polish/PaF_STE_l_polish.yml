nordbat.4.b: "b"

szczecin.50.t: "Zdrajca nade wszystko"
szczecin.50.desc: "To był straszny dzień dla Donalda Tuska. Jego małe imperium upadło, a marzenie o rządzeniu Polską roztrzaskało się na kawałki. I za czyją sprawą? Tego łajdaka, Piotra Krzystka.\nTego samego człowieka, który jeszcze kilka lat wcześniej był tylko wiernym pieskiem Tuska. Kiedy stał się bezużyteczny, Tusk usunął go jednym rozporządzeniem, wymazując jego wpływy równie łatwo jak linię narysowaną na piasku.\nA teraz? Ten mały człowiek wrócił. I nie tylko po to, by mu się przeciwstawić - wrócił, żeby go zniszczyć.\nNie.\nNie mógł na to pozwolić.\nNie da się zniszczyć komuś takiemu.\n\nSpersonalizowany Humvee Tuska turkotał przez rozległe, mroczne lasy Pomorza, a opony mieliły polne drogi niczym ostatnie echa upadłego reżimu. Za kierownicą siedział jeden z nielicznych pozostałych lojalnych żołnierzy, którego zadaniem było dostarczenie go do niemieckiej granicy - tam czekały znajome twarze i dawni sojusznicy.\nTusk siedział w milczeniu ze wzrokiem wbitym przed siebie, lecz umysł płonął. Plan zemsty już nabierał kształtu. Przegrupuje się. Wróci. I przekona Ursulę do kolejnej interwencji - tym razem skutecznej. Tym razem nie będzie to częściowa interwencja. Będzie to pełne odzyskanie kraju, polityczny podbój całej Polski.\nA na czele? Donald Tusk. Nie jako premier. Nie - jako prezydent.\nTak - pomyślał z gorzkim uśmiechem - to świetny pomysł.\n\nWtedy rozległy się strzały. Przednia szyba eksplodowała odłamkami. Kierowca osunął się do przodu, a na piersi rozkwitła mu czerwień. Humvee gwałtownie zarzuciło, opony zawyły na żwirze i pojazd uderzył w sosnę z hukiem kruszącym kości.\n\nTusk szarpnął się do przodu, ogłuszony, z dzwonieniem w uszach. Spod maski z sykiem wydobywał się dym. Otworzył drzwi i wypadł, kaszląc, z krwią spływającą po policzku. Wokół znów panowała cisza - zbyt wielka cisza.\nZaczął biec. Serce waliło, nogi płonęły, ale adrenalina zagłuszała ból. Wpadł między drzewa. Gałęzie szarpały płaszcz, a ciernie gryzły skórę. Za plecami ostre nawoływania żołnierzy i szczekanie psów przecinały leśne powietrze. Skręcił w dół zbocza, przebiegł przez płytki strumień i wspiął się na skaliste wzniesienie - potykając się i chwytając oddech.\nPrzez chwilę pościg ucichł.\nUpadł za powalonym drzewem, ciężko dysząc, z dłońmi pokrytymi błotem i krwią schnącą na twarzy. Kiedy usłyszał kroki za sobą, wiedział, że jest już za późno.\nŻołnierz wyłonił się zza drzewa. Tusk rzucił się na niego, zaskoczył go i odtrącił karabin, lecz drugi żołnierz dopadł go od tyłu. Mocno uderzył o ziemię, z policzkiem wciśniętym w wilgotne liście. Wykręcono mu ręce za plecy, a opaski zacisnęły się na nadgarstkach.\n\nGdy posiniaczonego i pobitego odciągano, Tusk zwrócił głowę ku ciemniejącemu horyzontowi i wyszeptał: \"To nie koniec, jeszcze wrócę\"."
szczecin.50.a: "Jego działań przeciw Polsce nie da się usprawiedliwić - do więzienia!"
szczecin.50.b: "Tonący brzytwy się chwyta - puśćmy go."

szczecin.51.t: "Biała księga obronności"
szczecin.51.desc: "Generał Koziatek siedział przy biurku, zgarbiony z czystego niedowierzania i rozczarowania. Co? Jak? Dlaczego?\nPrzeglądał raporty podwładnych dotyczące zarządzonego przez siebie przeglądu armii. Łagodnie mówiąc, sytuacja była tragiczna.\nNiezliczone przypadki defraudacji i nepotyzmu oraz inne akty idiotyzmu. Było ich tak wiele, że wszystko zaczęło zlewać się w jedno, pozostawiając w pamięci tylko najbardziej absurdalne, niewiarygodne lub komiczne incydenty wymienione poniżej.\n\nPo kolei:\n\n- Batalion Piechoty \"Czynu Polskiego\" - batalion zaczął uzupełniać braki kadrowe osobami poniżej piętnastego roku życia. Wszyscy odpowiedzialni zostali ukarani.\n\n- Batalion Piechoty \"Fryga\" - wielki skandal związany z niewłaściwym wykorzystaniem materiałów; zapasy amunicji batalionu przetopiono na pamiątkowe statuetki, które personel sprzedawał z zyskiem. Wszyscy odpowiedzialni zostali ukarani, a współpracującą odlewnię dotkliwie ukarano grzywną.\n\n- Batalion Piechoty \"Kościuszko\" - niedobory wyposażenia zmuszały żołnierzy do używania podczas ćwiczeń narzędzi rolniczych, w tym przerobionych kos. Później odkryto, że dowódca batalionu, znany miłośnik rekonstrukcji historycznych, celowo odrzucał zamówienia sprzętu, aby być \"bliżej ducha batalionu\", ku rozpaczy podwładnych, a przy okazji ułatwiał działalność batalionu \"Fryga\". Ukarany.\n\n- Batalion Piechoty \"Most Długi\" - saperzy batalionu celowo doprowadzili do zniszczenia mostu w rodzinnej miejscowości lokalnego administratora, który odmówił dowódcy rekwizycji zapasów należących do społeczności. Wszyscy zaangażowani zostali ukarani.\n\n- Batalion Piechoty \"Zamek\" - batalion siłą przejął dostawy przeznaczone dla batalionu \"Kościuszko\", aby przekazać je batalionowi \"Fryga\" w zamian za udział w zyskach. Batalion ukarany.\n\n- Ochotniczy Batalion Robotniczy PŻM - ustalono, że dowódca kupił stopień za pokaźną łapówkę. Ukarany.\n\n- Świnoujska dywizja Marynarki Wojennej - doszło do nieujawnionego \"incydentu\", który doprowadził do zatonięcia w pełni sprawnej jednostki wraz z załogą. Dowódca ukarany. Po dalszym dochodzeniu załogę pośmiertnie dyscyplinarnie zwolniono ze służby.\n\n- Eskadra Sił Powietrznych \"Czerwone Gryfy\" - piloci odczuwali niepowstrzymaną potrzebę wykonywania \"beczek\", co najczęściej kończyło się ich śmiercią.\n\nNaprawdę? Tylko na tyle było stać tę armię? Koziatek był wściekły; nie, był BARDZIEJ niż wściekły. Chciał przewrócić biurko i wydać z siebie długi, przenikliwy wrzask frustracji, lecz opanował emocje. Chyba nadszedł czas, by przedstawić to wszystko rządowi. Może wtedy wreszcie dostanie środki na uporządkowanie tego przeklętego burdelu."
szczecin.51.a: "Raczej Prezydencki Wstyd"

szczecin.52.t: "Dzień Zwycięstwa"
szczecin.52.desc: "Ogromne tłumy rozradowanych obywateli zgromadzone wokół Wałów Chrobrego powitało ciepłe słońce wyglądające zza rozproszonych chmur. Był to dzień szczególny: niedawne udane reformy wojskowe i podboje w regionie stały się okazją do pamięci i dumy, wyznaczając pierwszy z wielu corocznych Dni Zwycięstwa. Na zgromadzonych czekał niezwykły festyn pełen atrakcji i jedzenia, lecz głównym punktem obchodów miało być przemówienie prezydenta Piotra Krzystka, a po nim wielka parada wszystkich rodzajów szczecińskich sił zbrojnych. Uwagę wesołego tłumu przyciągnęły dzwony oznajmiające południe. Gdy ich dźwięk niósł się przez miasto, prezydent w otoczeniu osobistej ochrony wszedł na mównicę pośrodku Wałów, otoczoną licznymi czerwono-niebieskimi flagami z pomorskim gryfem. Kiedy dzwony umilkły, z głośników rozmieszczonych na całych Wałach popłynął głos prezydenta witającego tłumy.\n - Witajcie, drodzy rodacy, na pierwszym Dniu Zwycięstwa! - Obywatele odpowiedzieli burzą wiwatów. - Zanim pozwolę naszej wielkiej armii zachwycić nas krokiem defiladowym, chcę zwrócić się do was bezpośrednio, tak jak zwróciłem się do parlamentu. Otaczają nas wrogowie, lecz wobec tego tyrańskiego zamachu na naszą wolność będziemy walczyć na ulicach, będziemy walczyć na plażach, będziemy walczyć na chodnikach, będziemy walczyć na bagnach, gdyż Szczecin nie ma do zaoferowania nic prócz potu, trudu, łez i krwi! Stając przed próbą najcięższego rodzaju, musimy przygotować się na miesiące walki i cierpienia. Możecie zapytać, jaka będzie nasza polityka w nadchodzących dniach, gdy mierzymy się z potworną tyranią, która chce odebrać nam wolność. Naszą polityką jest nigdy nie poddawać się zwątpieniu ani porażce i walczyć na lądzie, w powietrzu i na morzu w obronie tego, co tak ciężko wywalczyliśmy. Możecie jednak zapytać, jaki jest ostateczny cel tej walki, a odpowiem jednym słowem: zwycięstwo - zwycięstwo ponad wszystko, mimo wszelkich przeciwności, mimo wszystkich, którzy sprzeciwiają się nam i naszemu sposobowi życia; zwycięstwo nad terrorem i tyranią, zwycięstwo po wsze czasy, bez względu na długość walki, gdyż bez zwycięstwa nie ma wolności, a bez wolności nie ma przetrwania.\nTłum zgodnie powstał wśród owacji i radosnych okrzyków na cześć Szczecina, a nad miastem przeleciała eskadra odrzutowców wojskowych, kreśląc na niebie czerwone i niebieskie smugi dymu. Chwilę później rozpoczęła się parada. Na Wały wkroczyli nienagannie ubrani żołnierze różnych jednostek zreorganizowanych sił zbrojnych, a towarzyszyły im samochody pancerne, czołgi, ciężarówki i artyleria samobieżna. Gdy widowisko trwało w najlepsze, dołączyła marynarka: Odrą przepłynęło kilka okrętów pod flagami z pomorskim gryfem. Parada Dnia Zwycięstwa przebiegała zgodnie z planem, a prezydent Krzystek uśmiechał się na widok swoich w pełni rozwiniętych sił zbrojnych, gotowych bronić wolności nowej Republiki."
szczecin.52.a: "Gryf naostrzył szpony."

szczecin.53.t: "Nowoczesna arystokracja"
szczecin.53.desc: "Dziś w głównej sali kompleksu parlamentarnego zgromadzili się szczecińscy politycy, aby debatować nad utworzeniem wyższego urzędu w obecnych strukturach rządu. Prezydent Piotr Krzystek, siedzący pośrodku sali, gestem zwrócił się do zgromadzonych polityków Zamku i Unii Letniej; obie strony z pewnością miały własne podejście do sprawy.\n - Dzień dobry, rodacy i rodaczki ze Szczecina. Jak wcześniej ustalono, podczas dzisiejszej debaty omówimy Izbę Protektorów, wyższy urząd w strukturach rządu. Chciałbym wysłuchać obu stron w kwestii tego, komu powinniśmy nadać te dożywotnie tytuły przeznaczone dla osób, które uczyniły dla kraju więcej, niż wymagał obowiązek.\n - Panie prezydencie, szanowni parlamentarzyści. - Przewodniczący Zamku Zbigniew Bogucki wstał i rozejrzał się po sali. - W partii osiągnęliśmy porozumienie, że tytuły Protektorów należy nadać tym, którzy - jak sama nazwa wskazuje - chronili nasz naród. Ściśle współpracowaliśmy ze Związkiem Weteranów i Kombatantów, zrzeszającym szczecinian, którzy walczyli i krwawili podczas naszej walki o wolność, bez których nie moglibyśmy w ogóle prowadzić tej debaty. - Prawa strona sali wstała i nagrodziła go oklaskami, lecz lewa pozostała niewzruszona.\n - Z pewnością rozumiem źródło pańskiego stanowiska, panie Bogucki. - Prezydent przytaknął i spojrzał w lewo. - Panie Jaroszewicz, co na to Unia Letnia?\nBogdan Jaroszewicz, przewodniczący Unii Letniej, siedział na czele lewej strony sali. Wywołany poprawił okulary i wstał.\n - Panie prezydencie, Unia Letnia zgadza się z Zamkiem, że weteranom rebelii należy się najwyższy szacunek i uznanie, to oczywiste. Postulujemy jednak, by tytuły Protektorów przyznawać tym, którzy napełniają serca i umysły naszego ludu nadzieją i ambicją. - Wskazał członków partii po czerwonej stronie parlamentu. - Stoimy za tymi, którzy kształtują niezłomnego ducha Szczecina: wykształconymi profesorami, naukowcami, prawnikami i mężami stanu - \"inteligencją\", jak zapewne nazwaliby ich nasi konserwatywni odpowiednicy - gdyż bez nich nasz wspaniały region byłby tylko pustą skorupą bez celu i sensu. - Unia Letnia niemal zgodnie oklaskiwała przewodniczącego, choć jedna osoba na skrajnym lewym końcu sali klaskała dość obojętnie.\n - To znakomity kontrargument, panie Jaroszewicz. Bez ludzi wykształconych nasz lud byłby zagubiony; z pewnością można uczciwie stwierdzić, że powinni mieć większy głos w polityce państwa. - Prezydent spojrzał na kobietę w karmazynowej czerwieni siedzącą na skrajnym lewym krańcu sali. - Pani Margaret, czy chciałaby pani dodać coś do propozycji swojej partii?\n - Dziękuję, panie prezydencie. - Margaret przytaknęła, rzucając przewodniczącemu ukradkowe spojrzenie. - Rozmowa o duchu i umysłach, przynajmniej dla mnie, nie może być pełna bez rewolucjonistów - artystów i pisarzy, tych, którzy naprawdę rozpalili płomienie buntu przeciw okupantom, ludzi, którzy w najciemniejszych dniach napełniali serca obywateli nadzieją i marzeniami!\nDebata szybko przerodziła się w przekrzykiwanie polityków lewicy i prawicy, a pośrodku całego zamętu siedział prezydent Krzystek, głęboko zastanawiając się, którą propozycję jest gotów przyjąć."
szczecin.53.a: "Nasza inteligencja poprowadzi nas w przyszłość."
szczecin.53.b: "Nasi weterani będą strzec ideałów powstania."

szczecin.54.t: "Powrót do Vaterlandu"
szczecin.54.desc: "Christian Lindner nadal nie mógł uwierzyć, że Krzystek postanowił go uwolnić. Siedząc w mieszkaniu przydzielonym mu po wydarzeniach w ratuszu, zastanawiał się, dlaczego człowiek, który tyle przez niego wycierpiał, tak po prostu pozwolił mu wrócić do Niemiec. Lindner wyobrażał sobie różne zakończenia rewolucji, obawiając się prześladowania, a wreszcie powieszenia za zbrodnie. Tymczasem czekał w dawnym mieszkaniu na transport do niemieckiej granicy.\n\nWiedział, że nic tam na niego nie czeka. Porażki przypieczętowały jego los; nikt już nigdy nie powierzy mu prawdziwej władzy. Dla własnego narodu był hańbą, człowiekiem, który utracił miasto zaczynające znów sprawiać wrażenie niemieckiego. A jednak, ku własnemu zaskoczeniu, nie obchodziło go to.\nPrzywództwo nigdy naprawdę do Christiana nie pasowało. Nie uważano go za idealnego przewodniczącego Wolnej Partii Demokratycznej ani szczególnie zdolnego Eurogubernatora Szczecina. To było jego wyjście, szansa na porzucenie politycznego szamba raz na zawsze. Mógł zamieszkać w małym domu w Wuppertalu, zajmować się ogrodem i cieszyć życiem. Spokój, za którym tęsknił od wielu lat.\n\nMarzenia przerwało ostre, uporczywe pukanie do drzwi. Kiedy otworzył, zobaczył dwóch żołnierzy Gryfa.\n\"Transport jest gotowy\" - powiedział jeden. \"Pora jechać\".\n\nChristian bez słowa podniósł małą torbę z kilkoma rzeczami, które pozwolono mu zabrać. Ostatni raz spojrzał na mieszkanie w centrum Szczecina, kiedyś swój dom, dziś po prostu kolejne miejsce oczekujące na nowego mieszkańca, i wyszedł na korytarz, zostawiając wszystko za sobą.\n\nSiedział w milczeniu na tylnym siedzeniu, gdy samochód jechał przez Szczecin. Miasto wracało już do codziennego rytmu, lecz rany rewolucji pozostawały świeże: rozbite okna, osmalone ściany i ulice, które pamiętały zbyt wiele. Tak wielu zginęło na próżno, kurczowo trzymając się sprawy przegranej na długo przed pierwszymi strzałami.\nA jednak coś się zmieniło. Zwyczajny mrok wiszący nad Szczecinem jakby się uniósł. Ludzie wyglądali na lżejszych, swobodniejszych, niemal szczęśliwych. Wtedy Lindner z gorzką jasnością zrozumiał, że przez cały czas to on był czarnym charakterem ich historii - nie jakiś oficer czy żołnierz, lecz właśnie on.\nPo krótkiej jeździe dotarli na przejście graniczne Lubieszyn-Linken. Ku zaskoczeniu Lindnera Piotr Krzystek już tam czekał. Po drugiej stronie niewielki oddział niemieckich żołnierzy stał w szyku, gotowy przyjąć go i zabrać w miejsce znane tylko im. Lindner wysiadł i ruszył ku przejściu. Tuż przed progiem zatrzymał się jednak. Odwrócił się i napotkał spokojny, nieprzenikniony wzrok Krzystka.\n\"Danke schön\" - powiedział cicho Lindner. Potem odwrócił się, przekroczył granicę i skinął niemieckim towarzyszom. Bez ceremonii wsiadł do czekającego pojazdu i zniknął w stronę Berlina. Piotr stał nieruchomo, obserwując konwój rozpływający się na horyzoncie. W głowie rozbrzmiewała mu tylko jedna myśl:"
szczecin.54.a: "\"Mimo wszystko każdy potwór zasługuje na przebaczenie\"."

szczecin.55.t: "Głosujcie!"
szczecin.55.desc: "Jakub stał przed kamerą, czekając na sygnał operatora. W końcu usłyszał ciche słowa: \"A teraz kilka słów od naszego reportera na miejscu, Jakuba Nahajki\". Wkrótce zaczął:\n\n- Dziękuję. Znajduję się przed lokalem wyborczym przygotowanym w związku ze zbliżającym się głosowaniem. Wybór jest jasny: choć Unia Letnia i Zamek mogą niewiele różnić się pod względem gospodarczym, ich kulturowe skłonności w lewo lub w prawo mogą poprowadzić nasz naród zupełnie odmiennymi drogami, jeśli zdobędą władzę. Lokale pękają w szwach od entuzjastycznych wyborców pragnących odcisnąć piętno na losach narodu i pozostaną otwarte, dopóki kolejka całkowicie się nie rozejdzie!"
szczecin.55.a: "\"Dziękuję, panie Nahajka\""

szczecin.56.t: "Zamek zwycięża!"
szczecin.56.desc: "Po zaskakująco udanej kampanii ZKL \"Zamek\" zwyciężył w wyborach parlamentarnych, zdobywając nieco ponad połowę dostępnych mandatów. To ogromne osiągnięcie w regionie, który zawsze należał do najbardziej postępowych i liberalnych obszarów przedwojennej Polski. Podczas wiecu wyborczego Zbigniew Bogucki obszernie mówił o zaspokojeniu podstawowych potrzeb obywateli Republiki oraz zachowaniu tradycji i wartości państwa polskiego.\n\nChoć wiele nazwisk pozostaje niepewnych, znamy dwóch pewnych kandydatów na Wielkie Urzędy Państwowe:\n\nMinister spraw wewnętrznych - Joachim Brudziński, były polityk Prawa i Sprawiedliwości, zrehabilitowany po zajęciu Świnoujścia. Niegdyś poseł na polski Sejm i minister spraw wewnętrznych w pierwszym rządzie premiera Morawieckiego. Doświadczony polityk gotowy wykorzystać pełnię władzy państwowej do rozwiązania problemów nękających kraj.\n\nKanclerz skarbu - Marek Gróbarczyk, były polityk Prawa i Sprawiedliwości, który podczas przeklętej niemieckiej interwencji przeszedł na stronę Gwardii Gryfickiej. Dwukrotny minister gospodarki morskiej, którego zainteresowania i doświadczenie w sprawach morskich idealnie pasują do krajobrazu Pomorza Zachodniego, skupionego wokół bogactw Odry i wybrzeża Bałtyku.\n\nUrząd premiera bez wątpienia przypadnie Zbigniewowi Boguckiemu jako niekwestionowanemu przywódcy Zamku. Ponadto generał Koziatek został już mianowany przez samego prezydenta sekretarzem stanu do spraw wojny, aby sprawować prezydencki nadzór nad Siłami Zbrojnymi Republiki."
szczecin.56.a: "Naprzód ku przyszłości!!"

szczecin.57.t: "Unia Letnia zwycięża!"
szczecin.57.desc: "Po niezwykle udanej kampanii Unia Letnia zwyciężyła w wyborach parlamentarnych, zdobywając ponad połowę dostępnych mandatów. Nie jest to zaskoczeniem w regionie, który zawsze należał do najbardziej postępowych i liberalnych obszarów przedwojennej Polski. Wielu komentatorów zwraca jednak uwagę na minimalne różnice w sondażach między dwiema największymi partiami, wskazujące na ewolucję krajobrazu politycznego i powstanie miejsca dla konserwatywnego \"Zamku\". Podczas wiecu wyborczego Bogdan Jaroszewicz obszernie mówił o zaspokojeniu podstawowych potrzeb obywateli Republiki oraz zapewnieniu każdemu z nich bezpiecznej i sprawiedliwej przyszłości.\n\nChoć wiele nazwisk pozostaje niepewnych, znamy dwóch pewnych kandydatów na Wielkie Urzędy Państwowe:\n\nMinister spraw wewnętrznych - Małgorzata Jamroży, znana również pod pseudonimem scenicznym \"Margaret\". Piosenkarka, która została polityczką, reprezentantka radykalnych sił w partii i głos młodych. Ma wnieść powiew świeżości do rządu Unii zdominowanego przez starych, zahartowanych polityków Nowej Lewicy i Platformy Obywatelskiej. Niezłomna idealistka, której rządy będą naznaczone zdecydowaną walką z problemami dręczącymi obywateli.\n\nKanclerz skarbu - Schivan Fate, były lokalny polityk Platformy Obywatelskiej z okolic Polic, który przeszedł na stronę Gwardii Gryfickiej po zwolnieniu przez Tuska podczas Interwencji. Ekonomista z zawodu, ekspert doskonale znający problemy miejscowej ludności. Zwolennik opieki społecznej, który będzie równoważył ostrożność premiera Jaroszewicza z radykalizmem minister spraw wewnętrznych Jamroży.\n\nUrząd premiera bez wątpienia przypadnie Bogdanowi Jaroszewiczowi jako przywódcy Unii Letniej. Ponadto generał Koziatek został już mianowany przez samego prezydenta sekretarzem stanu do spraw wojny, aby sprawować prezydencki nadzór nad Siłami Zbrojnymi Republiki."
szczecin.57.a: "Naprzód ku przyszłości!"

szczecin.58.t: "Nie przejdziesz!"
szczecin.58.desc: "Zaczęło się jak każdy wtorek w Szczecinie: szare niebo, umiarkowany chaos i wieczny pisk tramwajów kłócących się z dziurami w jezdni. Światło słoneczne ledwo przebijało się przez odwieczną chmurę rozpaczy wiszącą zwykle nad dworcem autobusowym. Nadszedł cud: miasto zaprezentowało fabrycznie nowy, importowany autobus piętrowy - prosto z Anglii. Lśnił. Mruczał. Obiecywał miejską elegancję. Na przystanku obywatele obserwowali piętrusa z mieszaniną zachwytu i dezorientacji. Jedni robili sobie selfie. Inni głośno zastanawiali się, czy do wejścia potrzebny będzie paszport. Atmosfera była niemal świąteczna. Dopóki nie pojawiła się ona.\n\nBalbina.\nTak nazywali ją miejscowi, choć naprawdę miała na imię Bogumiła. Imię oznaczające niegdyś \"miłą Bogu\", lecz w kręgach szczecińskiej komunikacji miejskiej oznaczało \"katastrofę kończącą zmianę\".\nZ determinacją wojowniczki podkręciła swój elektryczny skuter inwalidzki, ściskając wierną torebkę niczym miecz wykuty ze sztucznej skóry. Opony zapiszczały na płytkach klatki schodowej, gdy zjeżdżała w dół, zmuszając dwa koty do przerażonej ewakuacji z budynku. Nic, absolutnie nic, nie powstrzyma jej przed dotarciem na górny pokład tego pięknego karmazynowego rumaka.\n\n- Przepraszam! - ryknęła Bogumiła, przedzierając się przez tłum niczym ciągnik, który zerwał się z uwięzi. - To jest transport publiczny, czyż nie?! PUBLICZNY! A więc żądam dostępu do królewskich miejsc! Na górze!\nKierowca autobusu, blady mężczyzna żałujący, że przeniósł się z korporacyjnej posady w Policach, spojrzał na nią oczami martwej ryby.\n- Proszę pani, rampa nie wytrzyma skutera. Nie możemy nawet wprowadzić pani dolnym wejściem.\n- To po co ma górny pokład? Myśli pan, że jest tylko dla dzieci i japiszonów ze sprawnymi kolanami? To dyskryminacja! Zachowanie antyspołeczne! Zdrada!\n\nRuszyła do szarży. Skuter buczał niczym wściekła kuchenka mikrofalowa i zaklinował się w wejściu na dolny pokład. Rampa jęknęła. Drzwi bezradnie zapiszczały. Skoro ona nie mogła wsiąść do autobusu, zadba, żeby autobus nie mógł odjechać. Wyjechała przed pojazd i zatrzymała się z samozadowolonym uśmiechem, krzyżując ręce jak na placu Tiananmen. W ciągu kilku minut sytuacja eskalowała. Autobusy ustawiły się w kolejce. Narastał korek. Przybyły ekipy telewizyjne. Twarz Bogumiły, wykrzywiona świętym oburzeniem, transmitowano po całym regionie niczym ostrzeżenie od bogów. Nie ruszyła się. Nie dla prezydenta. Nie dla arcybiskupa. Nawet nie za łapówkę w postaci dożywotnich darmowych przejazdów dla seniorów. Minęła godzina. Wtedy rozległy się syreny. Dwa radiowozy podjechały z ospałością ludzi, którzy widzieli już zbyt wiele. Funkcjonariusz Czajka i sierżant Rogowski wysiedli, spojrzeli na znajomą postać ponownie blokującą cywilizację i wydali z siebie zgodne westchnienia, które mogłyby zasilić farmę wiatrową.\n- O Boże, tylko nie znowu...\n- TO MIASTO NIE RUSZY, DOPÓKI JA NIE BĘDĘ MOGŁA!\n- Do końca życia będę słyszał ten pieprzony skuter w snach... - westchnął funkcjonariusz Czajka i wezwał posiłki. O ile znajdzie się ktoś dość głupi, by pomóc posprzątać ten burdel."
szczecin.58.a: "Miasto zatrzymało się z piskiem."

szczecin.59.t: "Naprawdę zły sen"
szczecin.59.desc: "Miasto płonęło. Piotr Krzystek i jego gwardziści bronili ostatniego bastionu Szczecina. Za wszelką cenę chronili ratusz. Na zewnątrz zebrali się już Niemcy z czołgami i artylerią gotowymi obrócić w pył ostatni organ władzy w kraju. Na ich czele stali Christian Lindner i Donald Tusk, szczęśliwi i gotowi przejąć wszystko, co osiągnął przez minione lata. Krzystek zamarł; mógł tylko patrzeć, jak los niczym złośliwy piorun uderza w jego ukochaną republikę. Wtedy zdrajcy wydali rozkaz ataku. Patrzył, jak czołgi wtaczają się do hali i niszczą ostatni punkt oporu.\n\nWyrazisty sen wyrwał go z łóżka. Zlany potem poderwał się ze strachu. Sen wydawał się zbyt prawdziwy - Piotr naprawdę przeżył wszystko, co się wydarzyło. Wiedział, że nie może do tego dopuścić ponownie, nie po wszystkim, co zrobili, by zapewnić bezpieczeństwo i wolność pomorskim obywatelom. Musi istnieć osoba zdolna chronić ten naród i prowadzić go przez wszelkie okoliczności, aby nie upadł po raz kolejny. Ale co powinien zrobić?\n\nTelefon do profesora Toszka, zaufanego współpracownika, wydawał się dobrym początkiem. Nikt inny nie miał wiedzy i doświadczenia potrzebnych, by udzielić Krzystkowi rzetelnej rady. Nie obchodziło go, że Toszek zapewne nadal śpi; musiał wiedzieć - teraz. Profesor odebrał po kilku minutach i wielu połączeniach bez odpowiedzi.\n\n- Panie prezydencie, czy coś się stało?! - zapytał sennym, lecz zaniepokojonym głosem.\n\n- Wiem, że może to zabrzmieć szalenie i może pan uznać, że bredzę, ale sądzę, że coś jest bardzo nie w porządku. W przyszłości nasz kraj może stanąć wobec poważnego zagrożenia, którego nie uda się powstrzymać, jeśli zabraknie kogoś zdolnego wznieść się ponad polityczne spory i wewnętrzne walki. Potrzebujemy silnego przywódcy, kogoś, kto będzie naszym Cyncynatem, kto przedłoży interes narodu nad własny. Musimy coś z tym zrobić, ale nie wiem co. Czy mógłby mi pan doradzić?\n\n- Od dłuższego czasu rozważam pewien pomysł. Pan, panie prezydencie, mógłby go urzeczywistnić. Jak? Mógłby pan zostać królem. Wiem, jak niezwykle to brzmi, ale proszę pozwolić mi wyjaśnić. Król może stać się postacią jednoczącą cały kraj i prowadzącą ludzi ku lepszej przyszłości. Nie mówimy o obłąkanym autokracie, lecz o władcy podobnym do brytyjskich, a zarazem człowieku z ludu. Proszę to rozważyć, Piotrze.\n\n- Jak zareagują ludzie? Rząd? Wszyscy? Czy naprawdę jestem najlepszą osobą na to stanowisko? - zapytał niepewnie Krzystek.\n\n- Podejdźmy do tego tak. Najpierw musimy zająć się rządem. Potem wspólnie opracujemy następne kroki. Nie martw się, przyjacielu; mam plan. Musimy robić wszystko po kolei. A zatem wchodzisz w to?"
szczecin.59.a: "\"Dobrze. Ufam ci. Zróbmy to\"."

szczecin.60.t: "§sGodna płaca§!" #WYBORY EVENT
szczecin.60.desc: "Dla Stargardu Szczecińskiego był to wielki dzień. Unia Letnia organizowała tam spotkanie wyborcze, a cała uwaga skupiała się na Jaroszewiczu. Chodził tam i z powrotem, odpowiadając na ważne pytania, które z pewnością miały wpłynąć na jego szanse zwycięstwa. Kończąc jeden z wielu wywiadów, wypowiedział pamiętne słowa:\n\n- ...I pamiętajcie! Jesteśmy partią zwykłego człowieka! Nie chcemy niczego poza poprawą waszego życia!\n\nI to zdawało się przywołać... jego. Biednie wyglądającego mężczyznę w podrabianych ubraniach, z twarzą płonącą gniewem kogoś zbyt długo ignorowanego i poniżanego. Gdy tylko Jaroszewicz skończył, mężczyzna ruszył do szarży z okrzykiem bojowym \"GÓÓÓWNO PRAWDA!\", unosząc gotową do ciosu pięść. Kandydat zdążył jedynie odchylić się z szokiem na twarzy i uniknąć uderzenia, które trafiło w policzek jednego z przeprowadzających wywiad. Robotnik szybko się odwrócił i zaczął krzyczeć na całe gardło.\n\n- O, NAPRAWDĘ? \"Nie chcecie niczego poza poprawą naszego życia\", tak? To weźmy mnie za przykład. Pracuję w Netto i ledwo zarabiam na postawienie przyzwoitego żarcia na pieprzonym stole, w potwornych warunkach, przez które każdy rząd z choćby odrobiną sumienia uznałby was za gorszych od pieprzonej Korei Północnej. A co robi rząd tymczasowy? GÓWNO! Aha, jeszcze jedno: macie aktywne kontakty w Hanzie i wykorzystujecie je, żeby wyciągać lepsze warunki! Słyszycie, ludzie! Rząd wchodzi w spółkę z Hanzą! RZĄD TO BANDA PIEPRZONYCH KRWIOPIJCÓW...\n\nByły to ostatnie słowa, jakie zdołał wypowiedzieć, nim ochrona odciągnęła go poza zasięg słuchu. Gdyby decyzja należała do Jaroszewicza, zapewne postawiłby mu łagodniejsze zarzuty. W końcu mężczyzna był tylko głosem ludzi zapracowywanych niemal na śmierć, którzy własną krwią, potem i łzami utrzymywali szczecińską gospodarkę w ruchu. Jaroszewicz chwilę zastanawiał się, co powiedzieć po ataku, po czym zwrócił się do mikrofonów pozostałych po incydencie. Ludzie byli ciekawi jego odpowiedzi, a to mogła być dobra okazja, by przekonać ich, że nie jest kolejnym krwiopijcą i magnatem politycznym.\n\n- Cóż, w tej sprawie... Muszę powiedzieć, że..."
szczecin.60.a: "Każdy zasługuje na godną płacę, bez względu na koszty!"
szczecin.60.b: "Nasze partnerstwo z Gildią Hanzeatycką..."

szczecin.61.t: "Jedwab czy kaszmir?"
szczecin.61.desc: "Dlaczego to było takie ważne?\n\nDoradcy nie dawali mu spokoju - wezwano krawców z Łodzi i jeszcze dalszych stron, a stół w sali rady pokrywały niezliczone próbki: francuski jedwab, tyrolska wełna, najlepsze śląskie płótno oraz importowany kaszmir przemycany przez niepewne granice. Głośno i bez końca kłócili się o nici i faktury, kołnierze i mankiety, złoty albo srebrny haft. Mówili z pośpiechem, jakby los królestwa zależał od tego, czy peleryna Króla zostanie podbita sobolem, czy gronostajem.\nKrzystek siedział przez cały czas w milczeniu.\nNie rozumiał, dlaczego miało to znaczenie. Kraj wciąż nosił blizny okupacji i upadku. Niektóre ulice nie miały prądu, a paliwo racjonowano. Całe miasta przypominały zamarznięte ruiny z innej epoki. A oni kłócili się o odcień błękitu najbardziej odpowiedni dla monarchy.\n\n- Wizerunek jest wszystkim - powiedział jeden z doradców, powiewając skrawkiem fioletowego materiału niczym flagą.\n- Lud musi zobaczyć siłę, elegancję i prawowitość - nie wyrzeczenie. Nie kompromis.\n\nKrzystek wiedział jednak, co naprawdę mieli na myśli: Król musi wyglądać jak Król. Bali się, że chwila wymknie się z rąk, że iluzja pęknie.\n\nObawiali się, że dawny świat, nadal oddychający pod powierzchnią, przebudzi się i wciągnie ich z powrotem w chaos. Koronacja musiała być doskonała. Jeden błąd, jedna zmarszczka, jeden ślad zwątpienia - i będzie po wszystkim.\nKorona nic nie będzie znaczyć. Co gorsza, stanie się obiektem drwin.\n\nMimo to Krzystek nie potrafił uwolnić się od niepokoju.\n\nPamiętał robotników w stoczniach, kolejki po żywność i cichą wytrwałość szczecinian. Nie potrzebowali króla odzianego w jedwab. Potrzebowali paliwa, chleba, godności i stabilności.\nA jednak stał tutaj i zdejmowano z niego miarę na szatę.\nPatrzył na siebie w lustrze, podczas gdy krawiec upinał materiał na jego ramionach. Odbicie nie wyglądało po królewsku; wyglądało na zmęczone. Człowiek w lustrze miał w oczach zbyt wiele bezsennych nocy, za sobą zbyt wiele kompromisów i zbyt wiele ciszy tam, gdzie powinny paść słowa.\n\nDlaczego to było takie ważne?\n\nPonieważ królestwo, które próbowali zbudować, nie było jeszcze rzeczywistością. Nie w pełni. Istniało jedynie w umysłach pełnych nadziei i zdesperowanych. Potrzebowało symboli, strojów, ceremonii, dzwonów, flag i króla, który wyglądałby na pasującego do roli, nawet jeśli sam naprawdę tego nie czuł.\n\nPo długim namyśle podjął ostateczną decyzję."
szczecin.61.a: "Tylko to, co najlepsze, dla naszego przyszłego Króla"
szczecin.61.b: "Poradzimy sobie z tym, co mamy"

szczecin.62.t: "Nieszlachetny"
szczecin.62.desc: "\"Głos Pomorza\" z dnia [GetDate]\n\nWitajcie, obywatele Pomorza!\n\nW dzisiejszej audycji przekazuję specjalne wieści z pałacu prezydenckiego. Nasz wieloletni prezydent Piotr Krzystek podjął zaskakującą decyzję o zostaniu królem Pomorza. Choć może to budzić niepokój, Krzystek nie zamierza skupiać w swoich rękach pełni władzy. Jego proklamacja ma zapewnić uczciwość i przejrzystość naszego systemu demokratycznego. Przejście od urzędu prezydenta do monarchii konstytucyjnej wzmocni instytucje państwowe i pozwoli interweniować w sytuacjach krytycznych, gdy parlament nie jest w stanie osiągnąć rozsądnego porozumienia.\n\nNiektórzy mogą uznać to za zdradę republiki. Czy jednak Piotr Krzystek kiedykolwiek zawiódł obywateli Pomorza? Podczas okupacji Lindnera ryzykował życiem, walcząc o wolność każdego szczecinianina. Przez niezliczone bezsenne noce wojen zjednoczeniowych planował skuteczne kampanie i troszczył się o życie ludzi na ziemiach oczekujących na wyzwolenie. Co więcej, Piotr nigdy nie okazywał żądzy władzy ani złego nastawienia. Zawsze był przy nas. Dlatego jeśli ktokolwiek zasługuje, by zostać królem, jest nim właśnie on.\n\nZ Piotrem Krzystkiem możemy mieć pewność, że nasza wolność i niepodległość będą bezpieczne. Ochroni nas przed każdym niebezpieczeństwem zagrażającym młodemu państwu. A teraz sam prezydent pragnie uspokoić wszystkich i przekazać pozdrowienia słuchaczom!\n\n- Witajcie, obywatele Pomorza! Mówi wasz prezydent, Piotr Krzystek. Jak być może wiecie, wraz z najbliższymi doradcami postanowiliśmy przekształcić ustrój republikański w monarchię konstytucyjną. Możecie się zastanawiać, dlaczego ja, oddany zwolennik demokracji, zdecydowałem się zmienić naszą Konstytucję i podstawowe zasady państwa. Powodem jest brak przywódcy zdolnego prowadzić ten system demokratyczny i nad nim czuwać. Muszę przyznać, że nie postrzegam siebie jako najodpowiedniejszej osoby do tej roli. To mój bliski przyjaciel, profesor Toszek, zachęcił mnie do objęcia urzędu króla. Jako wasz monarcha obiecuję strzec Konstytucji i rządów prawa. Może nie jestem najlepszy, ale zapewniam, że zrobię wszystko, co w mojej mocy, aby chronić Królestwo Pomorza. Z najwyższym szacunkiem, wasz wierny sługa, Piotr z rodu Krzystków.\n\nKiedy zakończyła się emisja nagranego wcześniej przemówienia Piotra Krzystka, dwaj żołnierze stojący za reporterem wymienili dyskretne skinienia głów. Wszystko potoczyło się zgodnie z oczekiwaniami, a reporter mógł teraz liczyć na skromną podwyżkę."
szczecin.62.a: "Wszystko dla kraju."

szczecin.63.t: "Klejnoty Pomorza"
szczecin.63.desc: "Piotr Krzystek powoli przechadzał się alejkami Jasnych Błoni, z dłońmi splecionymi za plecami i pogrążony w myślach. Późne popołudniowe słońce rzucało złote promienie na żywopłoty, a powietrze wypełniała nikła woń bzów, lecz ledwo to zauważał. Jego umysł zaprzątała sprawa wielkiej wagi: koronacja.\n\nStarannie rozważył każdy szczegół. Nie mogła być zbyt wystawna - w budżecie nie było miejsca na złocone palankiny ani importowane jedwabne sztandary. Nie było to baśniowe imperium, lecz krucha, odbudowująca się republika. Jednocześnie ceremonia nie mogła być zbyt skromna. Nie pozwoli, by historia zapamiętała jego wstąpienie na tron jako pozbawione polotu, źle wyreżyserowane wydarzenie na miejskim placu. Nie, musiała emanować godnością, powagą i symboliką. W tej chwili miał stać się nie tylko przywódcą, lecz monarchą, Królem Pomorza.\n\nGdy skręcił za równo przycięty żywopłot, nagle uderzyła go pewna myśl: nie miał żadnych regaliów.\n\nZatrzymał się i bezmyślnie wpatrywał w żwirową ścieżkę pod stopami. Żadnej korony. Żadnego berła, jabłka ani ceremonialnego miecza. Nic. Jak miał zostać królem bez symboli definiujących władzę monarszą? Co to za monarcha, który rządzi bez insygniów władzy? Czy naprawdę mógł stanąć przed ludem i ogłosić się królem z pustymi rękami, w pożyczonym płaszczu?\n\nTo było absurdalne. Nawet żenujące. Ceremonię można było zaplanować do perfekcji, przemówienia przećwiczyć, a otoczenie ozdobić historycznym przepychem, lecz bez regaliów wszystko przypominałoby pusty spektakl - przedstawienie kostiumowe bez kostiumu.\n\nChwycił się za czoło, czując ciężar chwili opadający na ramiona. Przez krótką sekundę zastanawiał się, czy to znak, ostrzeżenie, że działa zbyt szybko lub mierzy zbyt wysoko. Niemal natychmiast odrzucił tę myśl. Zaszedł za daleko. Zbudował zbyt wiele.\n\nCo miał zrobić? Mógł zamówić koronę u najlepszego złotnika, ale dla przyszłego króla brzmiało to dość mało interesująco. Może wizyta na zamku podsunie jakieś twórcze pomysły. Opuszczając ogrody, Piotr wreszcie zdecydował, co zrobi dalej."
szczecin.63.a: "Nowa korona nie brzmi najgorzej."
szczecin.63.b: "Wizyta na zamku to świetny pomysł."

szczecin.64.t: "Rezydencja"
szczecin.64.desc: "Piotr Krzystek przechadzał się po rozbrzmiewających echem salach Zamku Książąt Pomorskich, a jego kroki miękko odbijały się od świeżo wypolerowanych kamiennych posadzek. Sklepienia wznosiły się nad nim niczym odwrócone kadłuby statków - wspaniałe, starożytne i niemożliwie ciche. Na ścianach obok zbroi i oprawionych w złocone ramy portretów dawno zmarłych książąt wisiały odnowione arrasy. Przeszłość czaiła się w każdym korytarzu.\n\nKrzystek nie potrafił pozbyć się wrażenia, że wtargnął na cudzy teren. Tęsknił za dawnym gabinetem - zwartą, funkcjonalną przestrzenią, w której każda książka, mapa i teczka miała wyznaczone miejsce. Ratusz pachniał znajomo kawą i kurzem, ucieleśniając codzienność rządzenia. Tutaj wszystko cuchnęło ceremonią, politurą, starym kamieniem i obowiązkami.\n\nNa zewnątrz uwijały się brygady robotników, przygotowując najbardziej ambitną koronację, jaką miasto widziało od stuleci. Przez wewnętrzne dziedzińce rozwijano czerwone dywany. Straż królewska ćwiczyła salutowanie w szyku pod wysokimi oknami. Malarze poprawiali sufity, na które od pokoleń nikt nie zwracał uwagi. Duchowni i urzędnicy partyjni szeptali o rozmieszczeniu miejsc. W tle co pewien czas biły dzwony, odmierzając godziny - a może ostatnie dni republiki.\n\nZamek należał niegdyś do książąt z krwi Gryfitów, władców średniowiecznego Pomorza. Teraz odradzał się jako pałac królów.\nA jednak Krzystek czuł się w jego murach mały.\n\nPowtarzał sobie, że na jego oczach powstaje historia. Koronacja będzie oznaczać odrodzenie porządku, tożsamości i dumy. Lud potrzebował monarchy, symbolu, człowieka z koroną i wizją. Zgodził się na to, a teraz nie było już odwrotu.\n\nCzekając na koronację w napiętym oczekiwaniu, czuł zarazem szczęście i dumę. Jednak tej nocy, gdy wiatr szeptał przez wielkie szklane okna, a cienie gromadziły się w kątach zbyt starych, by pamiętać światło, Piotr Krzystek zastanawiał się: czy odbudował monarchię, czy też monarchia całkowicie go pochłonęła?"
szczecin.64.a: "Najwyższy czas na restaurację"

szczecin.65.t: "§sTroska o zdrowie§!" #WYBORY EVENT
szczecin.65.desc: "Wreszcie, po długiej serii spotkań wyborczych i... czymkolwiek był ten incydent z pracownikiem Netto, Jaroszewicz cieszył się z powrotu do domu... a przynajmniej do siedziby Unii Letniej przy alei Jana Pawła II. Budynek należał kiedyś do Platformy Obywatelskiej, lecz dziś mieściło się w nim coś znacznie bardziej regionalnego. Po głośnych wydarzeniach nadszedł czas, by zająć się obawami wyborców bardziej... prywatnie, głównie za pośrednictwem listów.\nNa początek list od Frani Lubińskiej:\n\nSzanowny Panie Jaroszewicz,\njakiś czas temu mój mąż Edmund uległ poważnemu wypadkowi w stoczni PŻM, w której pracował. Otwarte złamanie i kilka zamkniętych. Nie chciał, żebyśmy popadli w długi, bo ze swoich nędznych zarobków nie potrafił opłacić rachunku ze szpitala, więc\nmusiałam go pożegnać. Uważam, że obowiązkiem \"partii ludu\" jest przyjrzeć się takim przypadkom i działać! Proszę, panie Jaroszewicz. Ludzie tacy jak ja liczą na pana.\n\n...dobrze, trochę ponuro... może następny? Od Jana Dobrowolskiego:\n\nSzanowny Panie Jaroszewicz,\npracuję w Chemiewerke Politz. Sam ten fakt powinien już budzić obawy, ale nie na to chcę się skarżyć. Mój problem polega na tym, że mam chorą matkę, którą muszę utrzymywać z rzucanych mi ochłapów! To szaleństwo! Czy nie możemy mieć choćby CZĘŚCIOWO publicznej opieki zdrowotnej, żeby pomagać ludziom takim jak ona? Proszę, panie Jaroszewicz. Naprawdę się o nią martwię.\n\nDobrze, Jaroszewicz zaczynał rozumieć. Ludzie martwili się opieką zdrowotną. Nie była to nowość, lecz warto było ją odnotować. To, co teraz powie, może znacznie zwiększyć jego szanse wyborcze, a potencjalnie również coś zmienić... Jednocześnie mogło ściągnąć na niego śmiertelne kłopoty z Hanzą. Musiał bardzo uważnie to przemyśleć.\n\nPodniósł kartkę i pióro, po czym zaczął pisać odpowiedź na oba listy... Ale co powinien napisać?"
szczecin.65.a: "Zdrowie ma najwyższą wartość i nie można pozostawić go w rękach prywatnych podmiotów."
szczecin.65.b: "Nie możemy niczego obiecać..."

szczecin.66.t: "Wielka koronacja"
szczecin.66.desc: "Tysiące ludzi zgromadziły się przed Zamkiem Książąt Pomorskich, z niecierpliwością oczekując pierwszej polskiej koronacji od ponad czterystu lat. Król miał ponownie rządzić ziemiami Pomorza, a pewnego dnia - miejmy nadzieję - całą Polską. Tłum wiwatował i szumiał z oczekiwania, wypatrując na każdej drodze pierwszego znaku królewskiej karety. Strażnicy stali wyprostowani w ceremonialnych mundurach, czujni wobec każdego zagrożenia dla bezpieczeństwa króla. Protektorzy i członkowie parlamentu czekali w napiętej ciszy, będąc świadkami narodzin nowego rozdziału historii swojego kraju.\n\nTymczasem Krzystek przejeżdżał przez serce Szczecina, spoglądając na poddanych z mieszaniną dumy i zachwytu. Ulice przystrojono czerwono-białymi sztandarami, a ludzie tłoczyli się wzdłuż dróg, by choć przez chwilę zobaczyć przyszłego monarchę. Dzieci machały flagami, starcy po cichu czynili znak krzyża, a wielu stało bez słowa, przytłoczonych powagą chwili.\n\nChoć uśmiechał się i machał, wewnątrz Piotr Krzystek pogrążony był w rozmyślaniach. Nadszedł jego wielki dzień i nie potrafił zaprzeczyć ciężarowi w piersi. Za kilka godzin z prezydenta stanie się królem - symbolem, figurą reprezentacyjną, dłonią wskazującą drogę. Wydawał rozkazy podczas kryzysów i pisał prawa w czasie pokoju, lecz to było coś innego. Teraz dusza narodu miała zostać związana z jego imieniem. Ludzie będą oczekiwać od niego nie tylko przywództwa, lecz nadziei, ciągłości i sensu.\n\nKrólewska kareta dotarła do bram Zamku Książąt Pomorskich dokładnie wtedy, gdy w całym mieście uderzyły południowe dzwony. Rozległy dziedziniec zamilkł, gdy Krzystek wysiadł w dopasowanym ceremonialnym płaszczu. W środku czekały korona, ozdobne berło i płaszcz koronacyjny. Powoli, z cichą godnością, wszedł po schodach, a stukot butów odbijał się echem od kamienia.\n\nW wielkiej sali wypełnionej złotym światłem i stuleciami historii pod sklepieniem czekał na niego biskup szczeciński. Krzystek ukląkł przed ołtarzem i pochylił głowę.\n\n- Czy przysięgasz służyć ludowi Pomorza ze sprawiedliwością, pokorą i niezachwianą stanowczością? - zapytał biskup, trzymając w dłoni ceremonialną Biblię.\n- Przysięgam - odpowiedział Krzystek spokojnym, lecz cichym głosem.\nBiskup uniósł koronę i po chwili głębokiego milczenia włożył ją na głowę Krzystka.\n- Powstań zatem, Piotrze I, z łaski Bożej i woli ludu, Królu Pomorza.\n\nW sali wybuchły oklaski, a kilka chwil później rozlały się po dziedzińcu. Dzwony miasta biły z dziką radością. Na niebie pękały fajerwerki, a tłum na zewnątrz skandował jego nazwisko: Krzystek! Krzystek! Krzystek! Ogarnięty wzruszeniem wyszedł na balkon górujący nad placem i uniósł dłoń w uroczystym pozdrowieniu.\n\nWiwaty były ogłuszające. Dla Krzystka stojącego pod sztandarem nowego królestwa ciężar korony był jednak zarówno dosłowny, jak i wieczny. Wiedział, że pojawią się wątpliwości, krytyka, może nawet bunt. Lecz w tej chwili, gdy światło słoneczne rozlało się po zamku, istniała tylko jasność.\n\nPomorze znów miało króla. A wraz z nim przyszłość, o którą warto walczyć."
szczecin.66.a: "Niechaj panowanie jego będzie długie!"

szczecin.67.t: "Wojna z (Niebko) terrorem"
szczecin.67.desc: "Światło księżyca miało tej nocy trudności z rozjaśnieniem Szczecina, bo zamiast niego miasto migotało na niebiesko. Policja, wzmocniona nowymi inicjatywami na rzecz bezpieczeństwa i rozdętym budżetem, rozpoczęła rozprawę z licznymi gangami oraz drobnymi przestępcami, którzy rozpanoszyli się po mieście podczas trudnego okresu odbudowy po powstaniu. W jednej ze zrujnowanych kamienic zaprawiony w bojach chuligan obserwował przez szczelinę w zasłonach, jak policja urządza naloty na mieszkania po drugiej stronie ulicy.\n- Nie wygląda to najlepiej - wymamrotał, chwytając szalik Pogoni Szczecin owinięty wokół szyi.\nPolicja zaciskała pętlę wokół wszelkiej maści przestępców, od drobnych złodziejaszków po szefów gangów, dokładnie tak jak szalik zaciskał się na jego szyi.\n- Ej, szefie - usłyszał głos wchodzący do pokoju.\n- Zamknij mordę, głupi chuju - syknął szef. - Jak nas usłyszą, mamy przejebane.\n- No weź, nie dopadną nas. Przecież nie pokryliśmy graffiti całego piętra, prawda?\nSzef powoli odwrócił się do kumpla.\n- Pokryliśmy graffiti drzwi, nie? - ciągnął podwładny, uświadamiając sobie ponure położenie.\n- Myślałem, że będzie fajnie wyglądać, no wiesz, Niebko Terror i w ogóle. - Szef znów spojrzał przez zasłonę. - Spokojnie, glin już... nie ma...\nZanim dokończył, drzwiami wstrząsnął głośny łomot. Potem kolejny, któremu towarzyszyło niebezpieczne skrzypienie ustępującej futryny.\n- Policja! Na ziemię i poddać się! - Funkcjonariusze oddziału szturmowego wyciągnęli piłę i zaczęli przecinać zawiasy. Przestępcy wpadli w panikę, biegali po mieszkaniu i chwytali wszystko, czym mogli się uzbroić - kije baseballowe, krzesła, wazony, garnki i patelnie, cokolwiek.\n- Ostatnie ostrzeżenie, poddajcie się natychmiast! - krzyknął funkcjonariusz. Drzwi ustąpiły, po podłodze potoczyło się kilka granatów hukowo-błyskowych - i rozpętało się piekło. Gdy oślepieni i ogłuszeni chuligani padali na podłogę, policjanci otworzyli ogień z gumowego śrutu w służbowych strzelbach, z najwyższą precyzją obalając kilku jeszcze stojących.\n- Stary, on był mój! - jeden z opancerzonych szturmowców krzyknął do drugiego, chowając broń.\n- Trzeba było strzelić pierwszy - odpowiedział tamten, przeładowując strzelbę.\n- Koniec gadania, chłopcy. Wynieście te śmieci, jeszcze długo nie skończymy. - Funkcjonariuszka dochodzeniowa w nieskazitelnym mundurze weszła za zespołem, przekraczając nieprzytomnych zbirów.\n\nW ciągu kilku godzin cała dzielnica została oczyszczona, a policyjne furgonetki zapełniły się przestępcami."
szczecin.67.a: "Tej nocy podobne sceny rozgrywały się w całym mieście."

szczecin.68.t: "§PSlumsy§!" #WYBORY EVENT
szczecin.68.desc: "Bogucki opuścił Szczecin tuż po świcie. Rządowy samochód cicho sunął przez południowe dzielnice, przeciął Międzyodrze i wjechał na Prawobrzeże, gdzie miasto przerzedzało się w betonowe żyły i szare wiadukty. Kierowca milczał. Bogucki również.\nZa oknem miasto przesuwało się niczym kronika filmowa - znajome, lecz coraz bardziej nierzeczywiste.\nKiedy przejeżdżali Trasą Zamkową, spojrzał przez okno. Pod mostem, u podnóża nasypu, stało skupisko niebieskich plandek i znalezionych desek. Ze stalowej beczki unosił się dym. Ktoś powoli poruszał się między prowizorycznymi ścianami, owinięty kocami, choć nie było zimno.\nZmarszczył brwi. Nikt mu nie powiedział, że stało się to tak widoczne.\nDalej, pod Estakadą Pomorską, kolejne schronienia. Kawałki dawnych billboardów zbite w trójkąty. Zardzewiałe wózki sklepowe. Dzieci.\nZanim przejechali przez Most Pionierów, naliczył co najmniej pięć takich obozowisk. Każde większe od poprzedniego.\nLudzie tam mieszkali. Nie tylko koczowali - mieszkali.\nPrzez długą chwilę nic nie mówił.\nPotem cicho, bardziej do siebie niż do adiutanta na przednim siedzeniu, powiedział: - To nie tylko rozkład. To upadek. -\nAdiutant patrzył prosto przed siebie, niepewny, czy powinien się zgodzić.\nBogucki oparł się o siedzenie. Jechał do Kołobrzegu, by wygłosić kolejne przemówienie. Złożyć kolejną obietnicę.\nAle co mógł teraz powiedzieć?\nRząd nie był w stanie sobie z tym poradzić. Nie sam. Musiałby poprosić o pomoc. A to oznaczało zwrócenie się do Gildii Hanzeatyckiej, tego samego bloku handlowego, który próbowali trzymać na dystans. Tego samego, który zamienił rolnictwo w balansowanie między długiem a zależnością.\nProsić ich o pomoc w sprawie wewnętrznej bezdomności? Mieszkań? Godności?\nTo będzie jeden wielki ból głowy.\nI co w ogóle oznaczałoby złożenie wyborcom takiej obietnicy? Że to naprawimy, ale nie sami? Że nawet Polska ma swoje granice?\nPatrzył, jak rzeka przesuwa się między stalowymi przęsłami. Droga przed nimi była czysta i pusta.\nGdzieś dalej czekał już tłum."
szczecin.68.a: "To niedopuszczalne i wymaga natychmiastowej interwencji rządu."
szczecin.68.b: "Nie możemy niczego obiecać..."

szczecin.69.t: "Krypty i tunele"
szczecin.69.desc: "Kiedy Piotr Krzystek wszedł do pałacu, ogarnęło go niewytłumaczalne uczucie. Dziwna siła nakazywała mu zbadać podziemia przyszłej rezydencji. Przyciągało go coś potężniejszego niż zwykła ciekawość zamku. Wierzył, że w katakumbach znajdzie odpowiedzi, których szukał. Choć obszary te pozostawały w większości niezbadane i trwały w nich prace renowacyjne, roboty przerwano po upadku Polski. Konstrukcje były niestabilne, a on zdawał sobie sprawę z ryzyka zejścia po schodach. Mimo to coś wewnątrz popychało go naprzód, przekonane, że klucz do odnalezienia klejnotów leży pod ziemią.\n\nPiotr spędził w katakumbach wiele godzin, szukając czegoś, czego sam nie potrafił określić. Wiedział, że ludzie wkrótce zaczną go poszukiwać, a powrót i wyjaśnienie, że zapuścił się do katakumb z powodu dziwnego przeczucia, iż coś tam znajdzie, będzie co najmniej niezręczne. Kiedy wreszcie postanowił odejść, oparł się o ścianę, by chwilę odpocząć.\n\nNagle mur za nim się poruszył. Krzystek patrzył zdumiony, jak tuż przed jego oczami otwiera się dawno zapomniana komnata. Gdy ukazał się ciemny pokój, stał przez kilka minut, nie mogąc uwierzyć własnym oczom. W głębi duszy wiedział, że coś czeka na niego w środku. Ale co?\n\nLatarka rozświetliła sekretne pomieszczenie. Wystrój wskazywał, że nikt go nie dotknął od średniowiecza, gdy ziemiami tymi władali książęta Gryfici. Pośrodku stała przykryta płótnem gablota. Piotr podszedł i zdjął nakrycie. Ujrzał coś, czego nigdy nie byłby w stanie sobie wyobrazić.\n\nNietknięta, zaginiona korona książąt pomorskich lśniła przed jego oczami złotem. W tej chwili Krzystek poczuł głęboką więź ze swym królewskim powołaniem. Komnata pozostawała niezbadana przez stulecia; nikt jej nie odkrył, dopóki nie natknął się na nią tuż przed koronacją. Było to niczym znak od bogów. Może ta rola była mu przeznaczona, jakby królowanie stanowiło jego przyrodzone prawo. Czy mógł być potomkiem Gryfitów?\n\nOstrożnie podniósł koronę i włożył ją na głowę. Nie była ani za ciężka, ani za lekka. Ważyła dokładnie tyle, ile powinna ważyć korona. Pasowała idealnie.\n\nPewnym krokiem opuścił katakumby. Gdy wyłonił się z mroku, natknął się na swoich strażników. Na widok pięknej korony ich pytania o jego zniknięcie natychmiast umilkły. Bez namysłu uklękli i zawołali:"
szczecin.69.a: "\"Niech żyje Król!\""
