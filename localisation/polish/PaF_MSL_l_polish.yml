unification.41.t: "[GetNewspaper]Myślenice jednoczą Małopolskę!"
unification.41.desc: "Gdy w Polsce załamał się porządek, niewielu spodziewało się, że w rejonie Myślenic wyłoni się jakakolwiek licząca się siła. Odcięta od reszty województwa małopolskiego, jedynie nieustanne wysiłki lokalnych watażków uchroniły ten region przed pogrążeniem się w anarchii. Polegając wyłącznie na miejscowych zasobach, szybko jednak przekonali się, że nie są w stanie sprostać jedynej zorganizowanej jednostce wojskowej na tym obszarze. Pozostałości 11. Brygady Obrony Terytorialnej dawnego województwa, dowodzone przez kaprala Goncerza, osiedliły się w Myślenicach, czyniąc z miasta bazę wypadową dla swoich dalszych planów. A te realizowali skrupulatnie, przejmując pełną kontrolę nad górzystym regionem. Stare fabryki przystosowuje się obecnie do produkcji wojskowej, a do armii nieustannie trafiają nowe karabiny, pociski i mundury. Jednostka rośnie w siłę z każdym dniem, więc pytanie nie brzmi, czy ponownie ruszy do ataku, lecz kiedy to zrobi."
unification.41.a: "Narodziny nowego kompleksu wojskowo-przemysłowego

super.41.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.41.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.41.a: "Wreszcie zjednoczeni."