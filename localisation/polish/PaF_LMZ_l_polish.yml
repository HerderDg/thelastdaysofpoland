 ##Events##
unification.103.t: "[GetNewspaper]Piwokracja Łomżyńska jednoczy Podlasie!"
unification.103.desc: "Rozlegający się brzęk stukanych kufli niesie się echem po całym Podlasiu. Dziś Marek Jakubiak i jego świta świętują, ponieważ polityczna półemerytura i zajęcie się browarnictwem, za sprawą łaski Upadku, niespodziewanie otworzyły przed nim drogę do władzy. Sprzymierzywszy się z częścią struktur koncernu Van Pur, początkowo po to, by zdominować lokalny rynek, w obliczu niestabilności wywołanej upadkiem zostali zmuszeni przeznaczyć część swojego ogromnego, połączonego majątku na utworzenie armii opartej na najemnikach, mającej chronić ich interesy przed lokalnymi watażkami. Gdy w regionie wybuchła wojna totalna, Jakubiak postanowił wejść do gry, polegając na dyscyplinie swoich najemników, którzy odnieśli serię zwycięstw zakończoną ustanowieniem pełnej kontroli nad Podlasiem. Pomimo niechęci przywódcy do przeprowadzenia jakichkolwiek znaczących reform, które poprawiłyby ich warunki życia, mieszkańcy regionu wydają się zadowoleni z nowej władzy - w czym być może pomaga obfitość pewnej substancji skutecznie otępiającej umysł."
unification.103.a: "Czy nałóg Polski będzie jej zbawieniem?"

super.103.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.103.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.103.a: "Wreszcie zjednoczeni."