unification.106.t: "[GetNewspaper]Grupa Polsat Plus jednoczy całą Ziemię Radomską!"
unification.106.desc: "Dziś polskie rodziny gromadzą się przed nielicznymi wciąż działającymi telewizorami, by wysłuchać przemówienia Zygmunta Solorza-Żaka - prezesa Cyfrowego Polsatu S.A. i faktycznego przywódcy państewka kontrolowanego przez firmę. Milicje korporacyjne, początkowo pełniące jedynie funkcję ochrony majątku przedsiębiorstwa, zdołały wyrwać dla siebie znaczny obszar w chaosie polskiej anarchii, ostatecznie podbijając całe Radomskie. Pomimo coraz silniejszej kontroli administracji i prawa oraz tłumienia niezależnych przedsiębiorstw mieszkańcy państwa zdają się zadowoleni dzięki chlebowi i igrzyskom - tym razem cyfrowym - oraz obietnicom bezpieczeństwa. Akceptują przydziały i kontrakty wiążące ich z Grupą. W miarę jak nadajniki Polsatu Plus pojawiają się na kolejnych sąsiednich ziemiach, okoliczni watażkowie zaczynają zakazywać korzystania z mediów należących do Polsatu, a mieszkańcy Łódzkiego nasilają najazdy na tereny firmy, wściekli na Solorza-Żaka za jego udział w programie SMR."
unification.106.a: "A teraz - pora na reklamy!"

unificationreg.106.t: "[GetNewspaper]Grupa Polsat Plus podbija województwo świętokrzyskie!"
unificationreg.106.desc: "Grupa Polsat Plus nadal rozszerza działalność na obszary administracji i wojska, umacniając rządy korporacyjnego państwa budowanego na ruinach Polski i posuwając się w górę Wisły. Jej siły dotarły właśnie do najbardziej wysuniętych na południe części województwa świętokrzyskiego. \nGrupa zapewnia mieszkańcom podległych jej ziem stały dostęp do telewizyjnej rozrywki i internetu, dzięki czemu staje się bardziej akceptowalna dla nowo podbitej ludności, która musi teraz podporządkować korporacyjnemu stylowi życia większość swojego czasu, nie tylko w pracy. \n\nGdy sąsiednie kliki zaczynają całkowicie blokować dostęp do telewizji i usług telefonicznych Polsatu Plus, międzynarodowi obserwatorzy zastanawiają się, jak będzie wyglądać Polska należąca do Polsatu i jak długo firma zdoła bezpośrednio rządzić tak wielką liczbą ludzi, zanim w końcu znudzi im się nowe, gówniane logo z żółtą kulą."
unificationreg.106.a: "Daj mi spokój, oglądam \"Grę w ciemno\", a ten kretyn właśnie wybrał kopertę z -100%."

unificationsupreg.106.t: "[GetNewspaper]Grupa Polsat Plus rozszerza wpływy na środkową Polskę!"
unificationsupreg.106.desc: "Grupa Polsat Plus kontynuuje przemianę z medialnego imperium w imperium dosłowne. Właśnie podbiła całe województwo łódzkie i część województw górnośląskich, a według zagranicznych i polskich obserwatorów zaczęła już opracowywać plany całkowitego podboju Polski. \n\nPowiązania Solorza-Żaka z różnymi przedsięwzięciami przedupadkowego rządu Polski pomogły Grupie włączyć pozostałości aparatu państwowego. Jednocześnie względnie neutralne stanowisko Polsatu w kwestiach społecznych i politycznych rodzi pytanie, czy powtórki \"Świata według Kiepskich\" i \"Awantury o Kasę\" zaspokoją pragnienie Polaków, by oglądać krew swoich politycznych przeciwników. \n\nZarząd Grupy wydaje się jednak pewny siebie, a według niektórych przecieków już przestawił działalność swoich mediów na przygotowanie Polski do nadejścia przyszłych dyrektorów naczelnych."
unificationsupreg.106.a: "Wciągnąć na maszt flagę Słońca Polsatu!"

super.106.t: "[GetNewspaper]Słońce nigdy nie przestaje nadawać w Polsce"
super.106.desc: "Zygmunt Solorz-Żak. Niegdyś najbogatszy Polak na świecie. Dziś - najbogatszy i najpotężniejszy Polak na świecie. \nNiektórzy przewidywali, że weźmie udział w tworzeniu nowego polskiego państwa, lecz nikt - a już zwłaszcza on sam - nie przypuszczał, że nowa Polska będzie dosłownie należeć do niego i założonej przez niego firmy. Przedsiębiorstwo, które świadczyło usługi telewizyjne i telefoniczne, zdołało wykupić uzbrojone milicje ochronne, zabezpieczyć swoje aktywa w kraju, a następnie zająć kolejne tereny, ostatecznie stając się samodzielną frakcją rywalizującą z innymi polskimi watażkami o zjednoczenie kraju. \n\nW ten sposób Grupa Polsat Plus stała się właścicielem Polski. A właściwie \"Państwem Solarnym\" - jak nazywa się jej rządy, nawiązując do dawnego logo Polsatu przedstawiającego słońce. To jak coś rodem z filmu cyberpunkowego - tyle że możemy obserwować, jak ten świat rozwija się na naszych oczach."
super.106.a: "Toodootoodoodoo-toodootoodoodoooo - Too-doo-doooo!"

super_a.106.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super_a.106.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super_a.106.a: "Wreszcie zjednoczeni."