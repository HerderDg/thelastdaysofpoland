l_polish:

 aievent_paths.1.t: "Wybory na Śląsku"
 aievent_paths.1.desc: "Walka o Śląsk dobiegła końca, ale walka o to, czym Śląsk powinien się stać, dopiero się zaczęła. Śląska Rada Narodowa pozostaje jedyną instytucją zdolną utrzymać region w całości, lecz jej członków łączy niewiele poza przekonaniem o potrzebie jedności. Lewe skrzydło Rady domaga się gwarancji socjalnych, udziału pracowników w rządzeniu i władzy opartej na kompromisie. Radykałowie twierdzą, że bez dyscypliny, centralnej władzy i stanowczej odpowiedzi na każde zagrożenie ze strony goroli nowe państwo nie przetrwa. Czas chwiejnej współpracy dobiegł końca. Śląsk musi zdecydować, która część Rady określi jego przyszłość."
 aievent_paths.1.a: "Śląska Rada Narodowa - lewica"
 aievent_paths.1.b: "Śląska Rada Narodowa - radykałowie"

 aievent_paths.2.t: "Przyszłość Sosnowca"
 aievent_paths.2.desc: "Rządy Czarzastego zapewniły Sosnowcowi stabilność w czasach, gdy była ona rzadkim dobrem, lecz żaden przywódca nie może rządzić wiecznie. Ponieważ kwestii sukcesji nie da się już dłużej odkładać, z wnętrza ruchu wyłoniło się dwoje kandydatów. Anna Maria Żukowska obiecuje dyscyplinę ideologiczną, potężny aparat partyjny i powrót do bezkompromisowych zasad leninizmu. Łukasz Litewka proponuje bardziej elastyczny socjalizm, dostosowany do współczesnych realiów i otwarty na stopniowe reformy. Oboje twierdzą, że to właśnie oni są prawowitymi kontynuatorami dzieła Czarzastego. Tylko jedno z nich może jednak zdecydować, jak naprawdę będzie wyglądała czerwona przyszłość Sosnowca."
 aievent_paths.2.a: "Żukowska - ortodoksyjny leninizm"
 aievent_paths.2.b: "Litewka - zreformowany socjalizm"

 aievent_paths.3.t: "In Excelsis Deo"
 aievent_paths.3.desc: "Clarus Mons przetrwało oblężenie, głód i upadek wszelkiej doczesnej władzy w swoim otoczeniu. Jego mury dają dziś schronienie nie tylko pielgrzymom i duchownym, lecz także całemu państwu zbudowanemu w cieniu klasztoru. Wraz z oddaleniem bezpośredniego zagrożenia sojusz zakonów zaczyna pękać. Ojcowie paulini roszczą sobie prawo do rządzenia sanktuarium, którego strzegli przez stulecia. Joannici oferują dyscyplinę, dobroczynność i służbę słabym. Wojownicza frakcja wśród paulinów uważa, że sama obrona już nie wystarczy, i wzywa do krucjaty przeciwko wrogom wiary. Jeden zakon musi teraz objąć przywództwo nad świętym miastem."
 aievent_paths.3.a: "Solus cum Deo solo (paulini)"
 aievent_paths.3.b: "Tuitio Fidei et obsequium pauperum (joannici)"
 aievent_paths.3.c: "DEUS VULT (paulini-krzyżowcy)"

 aievent_paths.4.t: "Czas wyborów"
 aievent_paths.4.desc: "Lata wojny, dezercji i politycznych czystek ograniczyły niegdyś zatłoczoną scenę partyjną do dwóch organizacji wciąż zdolnych sprawować władzę. Porozumienie obiecuje negocjacje, ostrożną odbudowę i państwo utrzymywane w całości dzięki kompromisom między rywalizującymi interesami. Solidarna Polska proponuje surowszą odpowiedź: ideologiczną pewność, scentralizowaną władzę i brak cierpliwości dla każdego, kto stanąłby na drodze odrodzenia kraju. Żaden z tych wyborów nie budzi powszechnego entuzjazmu, lecz odkładanie decyzji tylko pogłębiłoby paraliż administracji. Takie możliwości pozostawiła nam historia. Ludzie muszą wybrać ostrożnie, ponieważ następnych wyborów może nie być przez bardzo długi czas."
 aievent_paths.4.a: "Porozumienie"
 aievent_paths.4.b: "Solidarna Polska"

 aievent_paths.5.t: "Wybory na Śląsku"
 aievent_paths.5.desc: "Dawne podziały polityczne Śląska nie przetrwały Upadku w nienaruszonym stanie. Partie się rozpadły, ideologie zmutowały, a pokolenie dorastające pośród technologicznych ruin zaczęło proponować rozwiązania, które niegdyś należałyby do fantastyki naukowej. Wybory zostały zdominowane przez trzy ruchy. Posthumaniści z Koalicji Obywatelskiej pragną przezwyciężyć ograniczenia zarówno człowieka, jak i państwa. Kapitaliści sieciowi wyobrażają sobie społeczeństwo jako sieć umów, platform i prywatnych systemów. Frakcja Utopii z Porozumienia utrzymuje, że idealny ład społeczny wciąż można świadomie skonstruować. Nie są to standardowe propozycje wyborcze. Jeśli wyborcy czują się zagubieni, z pewnością nie są w tym sami."
 aievent_paths.5.a: "Koalicja Obywatelska - posthumaniści"
 aievent_paths.5.b: "Koalicja Libertariańska - kapitaliści sieciowi"
 aievent_paths.5.c: "Porozumienie - Frakcja Utopii"

 aievent_paths.6.t: "Przyszłość białoruskiego reżimu"
 aievent_paths.6.desc: "Aleksander Łukaszenka znalazł się na rozdrożu w najdziwniejszym z możliwych miejsc - na Podlasiu. Wciąż ma lojalnych urzędników, doświadczonych funkcjonariuszy służb i instynkt politycznego przetrwania, ale to nie jest Białoruś. Miejscowa ludność ma własne sympatie, stare instytucje zniknęły, a rozkazy wydawane znajomym tonem nie mają już tej samej mocy. Część doradców żąda natychmiastowych represji, zanim opozycja zdoła się zorganizować. Inni proponują coś niemal rewolucyjnego jak na standardy Łukaszenki: ustępstwa, publiczną hojność i próbę zdobycia prawdziwej akceptacji poddanych. Reżim musi zdecydować, czy polegać na starych metodach, czy odkryć zupełnie nowy rodzaj władzy."
 aievent_paths.6.a: "Oczywiście po staremu - represje!"
 aievent_paths.6.b: "Może spróbujmy... być mili?"

 aievent_paths.7.t: "Wybory w Bydgoszczy w roku [GetYear]"
 aievent_paths.7.desc: "Bydgoszcz dokonała tego, co wielu uważało za niemożliwe, i zjednoczyła województwo kujawsko-pomorskie pod jedną władzą. Koalicja zawiązana na potrzeby podboju niekoniecznie jest jednak gotowa na pokój, a przywództwo nowego państwa pozostaje niepewne. Koalicja Bydgoska wskazuje na swoje doświadczenie samorządowe i przekonuje, że ci, którzy doprowadzili do zjednoczenia, zasługują na kierowanie odbudową. Prawo i Sprawiedliwość - czy czymkolwiek jest ta parodia - wzywa do silniejszego, bardziej scentralizowanego rządu zakorzenionego w tradycjach dawnej Rzeczypospolitej. Sacre Coeur proponuje porządek polityczny oparty na wierze, obowiązku wobec narodu i odnowie moralnej. Wojna wyznaczyła granice nowego państwa. Głosowanie określi jego charakter."
 aievent_paths.7.a: "Koalicja Bydgoska"
 aievent_paths.7.b: "Prawo i Sprawiedliwość"
 aievent_paths.7.c: "Sacre Coeur"

 aievent_paths.8.t: "Przyszłość kobiet"
 aievent_paths.8.desc: "Walka o duszę polskiego feminizmu trwa długo po upadku instytucji, przeciwko którym niegdyś występował. Zwycięstwo nad starym porządkiem nie przyniosło jedności; zamiast tego otworzyło drogę radykalnie odmiennym wizjom przyszłości kobiet. Nowe Amazonki domagają się jawnego matriarchatu, bronionego siłą i zorganizowanego wokół kobiecej władzy. Technofeministki szukają wyzwolenia poprzez naukę, automatyzację i odrzucenie odziedziczonych etykiet ideologicznych. Zwolenniczki tęczowego kapitalizmu wierzą, że potęgę korporacji można przekształcić w narzędzie reprezentacji - pod warunkiem że mężczyźni będą trzymani od niej jak najdalej. Jeden z tych ruchów musi teraz zdefiniować rewolucję."
 aievent_paths.8.a: "Matriarchat Nowych Amazonek"
 aievent_paths.8.b: "Postideologiczny technofeminizm"
 aievent_paths.8.c: "Mizandryczny tęczowy kapitalizm"

 aievent_paths.9.t: "Królewski przewrót"
 aievent_paths.9.desc: "Przez wiele tygodni po tunelach i robotniczych osiedlach Nowej Huty krążyły pogłoski: ze smogu powstał król, władca obiecany przez ogień, stal i samą zatrutą ziemię. Większość ludzi odrzucała te opowieści, dopóki spod miasta nie wyłonili się uzbrojeni wyznawcy noszący znak smoka. Zajęli hutę, magazyny i budynki rządowe, podczas gdy frakcje Triumwiratu walczyły ze sobą na ulicach. O świcie dawne władze zniknęły, a nieznajomy zasiadł w centrum nowego dworu. Nazywa siebie Krakiem III. Nikt nie wie, skąd przybył, ale Nowa Huta już do niego należy."
 aievent_paths.9.a: "Kim on jest?"

 aievent_paths.10.t: "Pierwsze wybory w imamacie"
 aievent_paths.10.desc: "Imamat Podlasia narodził się z konieczności, jednocząc rozproszone społeczności muzułmańskie pod jedną władzą w najgorszych latach chaosu. Skoro samo przetrwanie nie jest już jedynym problemem, pierwsze wybory muszą rozstrzygnąć, czym właściwie ma stać się to państwo. Związek Muzułmański opowiada się za stabilnymi instytucjami i współpracą między wieloma ludami Podlasia. Liga Muzułmańska wzywa do bardziej zdecydowanej tożsamości religijnej i politycznej. Biała Orda całkowicie odwraca się od osiadłej polityki, czerpiąc inspirację z jeźdźców i zdobywców stepu. Każda frakcja twierdzi, że tylko ona może ocalić wspólnotę. Wierni muszą zdecydować, która wizja poprowadzi imamat."
 aievent_paths.10.a: "Związek Muzułmański"
 aievent_paths.10.b: "Liga Muzułmańska"
 aievent_paths.10.c: "Biała Orda"

 aievent_paths.11.t: "Wybory Obozu Zjednoczenia Narodowego"
 aievent_paths.11.desc: "Podobnie jak jego imiennik w dawnej II Rzeczypospolitej, Obóz Zjednoczenia Narodowego wyrósł na dominującą siłę polityczną regionu. Obietnica porządku zgromadziła pod jednym sztandarem konserwatystów, patriotów, żołnierzy i urzędników, lecz sukces ujawnił dzielące ich różnice. Bezpartyjny Blok Współpracy z Rządem pragnie szerokiego obozu politycznego, zdolnego wchłaniać lokalne elity i rządzić poprzez kontrolowany konsensus. Egzekutywa Zjednoczenia Narodowego uważa, że taka luźna struktura sprowadza słabość, i domaga się zdyscyplinowanej organizacji kierowanej z centrum. Obóz pokonał swoich rywali. Teraz musi zdecydować, czy jedność narodowa będzie koalicją, czy rozkazem."
 aievent_paths.11.a: "Bezpartyjny Blok Współpracy z Rządem"
 aievent_paths.11.b: "Egzekutywa Zjednoczenia Narodowego"

 aievent_paths.12.t: "Pierwsze wolne wybory w Świętokrzyskiem"
 aievent_paths.12.desc: "Region świętokrzyski został wreszcie zjednoczony pod rządem, który twierdzi, że reprezentuje mieszkańców, a nie kolejną przechodzącą armię. Drogi są ponownie otwierane, zbierają się lokalne rady i nareszcie można przeprowadzić pierwsze wolne wybory. Polska Partia Republikańska obiecuje silne państwo oparte na obowiązku obywatelskim i tradycjach republikańskich. Koalicja Obywatelska opowiada się za pluralizmem, samorządnością i odbudową instytucji demokratycznych. Skuteczni nie mają cierpliwości do dawnych etykiet i przekonują, że kompetencje, demokracja bezpośrednia oraz widoczne rezultaty są ważniejsze od ideologii. Wszystkie trzy siły oferują odbudowę, lecz każda inaczej rozumie wolność. Wyborcy muszą zdecydować, jaka republika powstanie w Świętokrzyskiem."
 aievent_paths.12.a: "Polska Partia Republikańska"
 aievent_paths.12.b: "Koalicja Obywatelska"
 aievent_paths.12.c: "Skuteczni"

 aievent_paths.13.t: "Braterski dylemat"
 aievent_paths.13.desc: "Bracia Golec zostali panami gór od Śląska Cieszyńskiego aż po Gorlice, jednocząc doliny i góralskie społeczności za pomocą muzyki, charyzmy oraz zaskakująco dużej ilości siły zbrojnej. Ich zwycięstwa skrywały narastający spór o to, co powinno nastąpić dalej. Jeden z braci spogląda wstecz, przekonany, że górale muszą bronić tradycji poprzez zburzenie zepsutych pozostałości współczesnego świata. Drugi patrzy naprzód i twierdzi, że przetrwanie wymaga dróg, warsztatów, szkół oraz gospodarki zdolnej utrzymać coś więcej niż zbrojne watahy. Zawsze występowali razem, lecz państwo nie może podążać jednocześnie w dwóch rytmach. Jedna wizja musi stać się przyszłością gór."
 aievent_paths.13.a: "Ściernisko! Zrównać ich z ziemią!"
 aievent_paths.13.b: "Tu będzie San Francisco!"

 aievent_paths.14.t: "Cyganie ze Śląska"
 aievent_paths.14.desc: "Romskie karawany ponownie przemierzają drogi Śląska, wędrując między zrujnowanymi miastami, osadami górniczymi i społecznościami, które na przemian witają je i się ich obawiają. Mobilność pozwoliła im zachować niezależność, lecz pozostawiła je także bez bezpiecznego terytorium i wspólnego głosu w polityce nowego świata. Niektórzy utrzymują, że wolność polega właśnie na odrzuceniu granic, stałych instytucji i władzy obcych. Inni wierzą, że karawany muszą zjednoczyć się wokół króla, który obroni ich prawa, będzie negocjował z sąsiednimi władcami i nada rozproszonej wspólnocie wspólny cel. Droga zaprowadziła ich aż tutaj. Teraz muszą zdecydować, czy dalej wędrować, czy zbudować własne królestwo."
 aievent_paths.14.a: "Będziemy wędrowali wolni!"
 aievent_paths.14.b: "Potrzebujemy króla!"

 aievent_paths.15.t: "Przyszłość nowego Chryzantemowego Tronu"
 aievent_paths.15.desc: "Siogunat Okamury ugruntował swoją pozycję na Śląsku dzięki osobliwemu połączeniu wojskowej dyscypliny, teatru politycznego i wiedzy o Japonii poskładanej z fragmentów dawnych mediów. To, co zaczęło się jako ekscentryczna banda wojenna, rządzi dziś prawdziwymi miastami i tysiącami poddanych. Dwór jest podzielony w kwestii dalszej drogi. Jedna frakcja domaga się dokończenia przemiany: wyniesienia tronu, militaryzacji państwa i nauczenia każdego obywatela służby nowemu imperialnemu przeznaczeniu. Druga zaczyna podejrzewać, że Siogunat mógł po drodze źle zrozumieć kilka istotnych spraw. Śląsk czeka na proklamację, choć nikt nie ma pewności, w jakim języku powinna zostać wygłoszona."
 aievent_paths.15.a: "Tenno heika, Banzai!"
 aievent_paths.15.b: "Nani?!"

 aievent_paths.16.t: "Wybory awangardy"
 aievent_paths.16.desc: "Dystryktowi Stołecznemu nigdy nie brakowało samozwańczych wizjonerów, lecz dwa nazwiska wybijają się obecnie ponad wszystkie inne. Paweł Tanajno prosi ludzi o kontynuowanie rozpoczętego przez niego eksperymentu politycznego, łączącego przedsiębiorczą energię, mobilizację obywatelską i permanentny bunt przeciwko istniejącym instytucjom. Bartosz Walaszek proponuje coś zupełnie innego: rząd ukształtowany przez lekceważenie powagi, nawiązania do niskiej popkultury własnego autorstwa i przekonanie, że absurd może być jedyną szczerą odpowiedzią na świat po Upadku. Obaj kandydaci obiecują utrzymać stolicę w awangardzie państw, choć nie zgadzają się, dokąd właściwie ta awangarda zmierza. Wyborcy muszą zdecydować, kto przekuje prowokację w politykę państwową."
 aievent_paths.16.a: "Tanajno"
 aievent_paths.16.b: "Walaszek"

 aievent_paths.17.t: "Przyszłość Eurokomisarza"
 aievent_paths.17.desc: "Grzegorz Schetyna nadzorował powstanie Eurokomisariatu i prowadził go przez najbardziej wyniszczające lata jego istnienia. Jego cierpliwość, kontakty i talent do przetrwania wewnętrznych konfliktów utrzymały administrację przy życiu, lecz samo przetrwanie już nie wystarcza. Lojaliści przekonują, że zasługuje na zaufanie państwa, które pomógł stworzyć. Oficerowie Eurokorpusu twierdzą, że cywilne niezdecydowanie omal nie doprowadziło do katastrofy i tylko wojsko może zagwarantować bezpieczeństwo. Reformatorzy uważają, że cały system trzeba otworzyć, zmodernizować i uwolnić od nawyków stanu wyjątkowego. Dorobek Schetyny jest nierozerwalnie związany z dorobkiem Eurokomisariatu. Teraz oba muszą zostać osądzone."
 aievent_paths.17.a: "Trochę wiary!"
 aievent_paths.17.b: "Eurokorpus przejmuje władzę!"
 aievent_paths.17.c: "Czas na reformy"

 aievent_paths.18.t: "Przyszłość Eurokomisarza"
 aievent_paths.18.desc: "Donald Tusk nadzorował powstanie Eurokomisariatu i przetrwał najbardziej wyniszczające lata jego istnienia. W przeciwieństwie do tak wielu innych zdołał w końcu odwrócić losy wydarzeń, przywracając handel, administrację i pewną miarę dobrobytu na podległych sobie terytoriach. Sukces ożywił jednak pytanie, które kryzys pozwalał wszystkim ignorować: wobec kogo Eurokomisariat jest ostatecznie lojalny? Polscy urzędnicy żądają pełnego powrotu do sprawy narodowej. Niemieccy partnerzy oczekują wdzięczności i trwałego zwrotu na Zachód. Oddani Europejczycy twierdzą, że oba wybory są zbyt wąskie, a państwo powinno stać się zalążkiem odnowionego projektu kontynentalnego. Tusk musi wreszcie oznajmić, gdzie jest jego miejsce."
 aievent_paths.18.a: "Dla Polski!"
 aievent_paths.18.b: "Für Deutschland!"
 aievent_paths.18.c: "Dla Europy!"

 aievent_paths.19.t: "Błyska się nad Tatrami"
 aievent_paths.19.desc: "Góry są niespokojne, podobnie jak mieszkańcy Podhala. Zjednoczenie zakończyło drobne wojny graniczne, lecz nie odpowiedziało na pytanie, kto może przemawiać w imieniu górali ani jak należy rządzić ich ziemią. Sebastian Pitoń oferuje osobiste przywództwo zakorzenione w lokalnym buncie i obietnicę, że państwo karpackie nie pokłoni się żadnej zewnętrznej władzy. Prawe skrzydło TOKP dąży do porządku, tradycji i zdecydowanej obrony regionalnej tożsamości. Lewe skrzydło przekonuje, że górskie społeczności mogą przetrwać wyłącznie poprzez akcelerację, rewolucję społeczną i odrzucenie wszelkich znanych norm. Przełęcze są na razie bezpieczne. Przyszłość ludzi, którzy ich strzegą, pozostaje nierozstrzygnięta."
 aievent_paths.19.a: "Pitoń zabezpieczy naszą przyszłość"
 aievent_paths.19.b: "TOKP - prawe skrzydło"
 aievent_paths.19.c: "TOKP - lewe skrzydło..."

 aievent_paths.20.t: "Wojna w Watasze - rezultat"
 aievent_paths.20.desc: "Wojna o Pomorze Zachodnie nigdy nie była jedynie walką przeciwko germańskim najeźdźcom. Za fasadą wspólnego frontu frakcje Towarzyszy toczyły własną zaciekłą rywalizację o broń, rekrutów i kontrolę nad rewolucją. Najeźdźcy zostali teraz odparci, a pole bitwy ucichło, lecz wewnętrznej wojny nie da się już dłużej ukrywać. Najbardziej krwiożerczy radykałowie domagają się ostatecznego rozrachunku z każdym rywalem. Wataha ogłasza zwycięstwo i rości sobie prawo do rządzenia siłą. Trzecia frakcja uważa, że przetrwanie wymaga porzucenia lokalnych ambicji i zwrócenia się ku Rosji. Kurz opadł i zwycięzca może być tylko jeden."
 aievent_paths.20.a: "WYRWIJCIE IM SERCA!"
 aievent_paths.20.b: "Wataha górą!"
 aievent_paths.20.c: "Zwróćmy się ku Rosji"

 aievent_paths.21.t: "Przyszłość junty"
 aievent_paths.21.desc: "Wojsko przejęło władzę w Zagłębiu i na Jurze jako środek nadzwyczajny, obiecując przywrócenie porządku oraz oddanie rządów po zabezpieczeniu regionu. Bezpieczeństwo nadeszło, lecz koszary nie wykazują żadnych oznak opróżniania się. Wojska Obrony Terytorialnej proponują państwo oparte na lokalnych jednostkach, współpracy z cywilami i stałej gotowości. Wielbiciele starożytnej Sparty domagają się przeorganizowania całego społeczeństwa wokół dyscypliny, poświęcenia i cnót wojskowych. Klika Komandosów nie ufa ani masowemu uczestnictwu, ani dawnym instytucjom i chce skupić władzę w rękach sprawdzonej elity. Oficerowie muszą zdecydować, czy są strażnikami nowego porządku, czy jego stałymi panami."
 aievent_paths.21.a: "Wojska Obrony Terytorialnej"
 aievent_paths.21.b: "Poznaj moich Spartan!"
 aievent_paths.21.c: "Klika Komandosów"

 aievent_paths.22.t: "Przyszłość Waffen-$$$$"
 aievent_paths.22.desc: "Całe Świętokrzyskie znajduje się dziś pod butami, łapami i najróżniejszymi insygniami libertariańskiej armii partyzanckiej Kelthuza. Waffen-$$$$ okazało się niezwykle skuteczne w niszczeniu dawnych władz, lecz rządzenie zdobytym terytorium ujawniło, jak niewiele łączy jego członków poza bronią i nienawiścią do wszelkich ograniczeń. Najbardziej oddani kapitaliści chcą uczynić radykalne prawa własności prawem tej ziemi, egzekwowanym z charakterystyczną dla nich siłą perswazji. Mroczniejsze elementy ruchu żądają terroru i nadchodzącego Dnia Sznura. Inni porzucili nawet pozory posiadania jakiegokolwiek celu i przyjęli czysty nihilizm. Kelthuz musi zdecydować, jaką bestią stała się jego organizacja."
 aievent_paths.22.a: "Kapitalizm albo chuj w dupę twą!"
 aievent_paths.22.b: "Dzień Sznura jest bliski!"
 aievent_paths.22.c: "Nic tu nie pozostanie..."

 aievent_paths.23.t: "Powstanie Lechii"
 aievent_paths.23.desc: "Województwo opolskie padło przed wojownikami Lechii, a nad jego miastami ponownie powiewają sztandary starożytnego narodu. Podbój nie przyniósł jednak ruchowi pokoju. Gospodzin Bieszk twierdzi, że zwycięstwo potwierdza jego mandat do zjednoczenia Lechitów, odtworzenia ich obyczajów i zbudowania państwa godnego przodków. Mistrz Jaruha i jego zwolennicy szepczą, że Bieszk stał się słaby, przyziemny i niegodny przebudzonego przez siebie przeznaczenia. Wojownicy, którzy niegdyś walczyli ramię w ramię, gromadzą się teraz w przeciwnych obozach. Wrogowie Lechii zostali pokonani, lecz jej przywódca wciąż musi przetrwać wewnętrzną walkę - albo ustąpić miejsca kolejnemu pretendentowi."
 aievent_paths.23.a: "Gospodzin Bieszk"
 aievent_paths.23.b: "Mistrz Jaruha"

 aievent_paths.24.t: "Powstanie Lehji"
 aievent_paths.24.desc: "Województwo opolskie padło przed wojownikami Lehji, którzy wnieśli do serca regionu osobliwą syntezę zapomnianego dziedzictwa i odrodzonego kultystycznego splendoru. Król Sanjaya przedstawia podbój jako dowód, że los wybrał go do ustanowienia nowego dziedzictwa. Mistrz Miłar wyczuwa, że nadszedł jego czas, i z niezachwianą pewnością gromadzi tych, którzy uważają, że Lehję powinna prowadzić odmienna interpretacja jej Logosu. Spór nie ogranicza się już do dworskiego ceremoniału; dowódcy, kapłani i lokalni władcy opowiadają się po stronach. Dawny wróg upadł, lecz zwycięska armia może jeszcze rozszarpać samą siebie w sporze o to, który pretendent naprawdę ucieleśnia Lehję."
 aievent_paths.24.a: "Król Sanjaya"
 aievent_paths.24.b: "Mistrz Miłar"

 aievent_paths.25.t: "Powstanie Wandalii"
 aievent_paths.25.desc: "Województwo opolskie padło przed wandalskimi wojownikami, których długa kampania przyniosła im terytorium, lecz niewiele wyjaśniła w kwestii zamiarów ich znamienitego przywódcy. Mówi on na przemian o dawnych upokorzeniach, świętych ojczyznach i wizjach oglądanych za zasłoną bitewnego dymu. Niektórzy wierzą, że podbój był tylko pierwszym krokiem ku zemście na każdym wrogu, który kiedykolwiek skrzywdził Wandalów. Inni utrzymują, że wojna musi służyć wyższemu celowi i otworzyć drogę do Swargi, bez względu na wymagania tej obietnicy. Armia czeka na rozkazy, a nawet najbliżsi towarzysze przywódcy zastanawiają się, co naprawdę kryje się w jego głowie."
 aievent_paths.25.a: "Daj mi zemstę!"
 aievent_paths.25.b: "Poprowadź nas do Swargi!"

 aievent_paths.26.t: "Wybory w Opolu"
 aievent_paths.26.desc: "Po latach okupacji, rozbicia i sprzecznych roszczeń do swojej tożsamości województwo opolskie zostało odtworzone pod polskim rządem. Kiedy administracja nadzwyczajna przygotowuje się do ustąpienia, znajome nazwy polityczne powracają do zupełnie nieznanego świata. Kukiz'15 przedstawia się jako głos lokalnych społeczności, demokracji bezpośredniej i buntu przeciwko partyjnym establishmentom, które zawiodły Polskę przed Upadkiem. Prawo i Sprawiedliwość obiecuje ciągłość, solidarność narodową i zdyscyplinowane państwo zdolne chronić odzyskany region. Obie strony twierdzą, że reprezentują prawowitą sprawę polską. Pierwsze wybory zdecydują, czy Opole zostanie odbudowane poprzez antyestablishmentową samorządność, czy scentralizowane rządy konserwatywne."
 aievent_paths.26.a: "Kukiz'15"
 aievent_paths.26.b: "Prawo i Sprawiedliwość"

 aievent_paths.27.t: "Pierwszy Kongres Wszechpolski"
 aievent_paths.27.desc: "Powstanie Rzeczypospolitej Wszechpolskiej przekształciło ruch narodowy z siły opozycyjnej we władcę własnego państwa. Jedność w czasie walki skrywała istotne różnice w poglądach na wykorzystanie zwycięstwa. Inicjatywa Wszechpolska reprezentuje nowe pokolenie pragnące przeobrazić kraj poprzez aktywizm i bezkompromisowe odrodzenie narodowe. Liga Polskich Rodzin wzywa do katolickiego, społecznie konserwatywnego porządku zakorzenionego w rodzinie i tradycji. Stronnictwo Narodowo-Demokratyczne dąży do wskrzeszenia zdyscyplinowanej sztuki rządzenia i metod politycznych klasycznej Narodowej Demokracji. Pierwszy Kongres Wszechpolski musi rozstrzygnąć, który nurt zdefiniuje Rzeczpospolitą."
 aievent_paths.27.a: "Inicjatywa Wszechpolska"
 aievent_paths.27.b: "Liga Polskich Rodzin"
 aievent_paths.27.c: "Stronnictwo Narodowo-Demokratyczne"

 aievent_paths.28.t: "Wybory małopolskie"
 aievent_paths.28.desc: "Rząd powołujący się na prawowite dziedzictwo Prawa i Sprawiedliwości zjednoczył Małopolskę, lecz sam ruch nie przemawia już jednym głosem. Lata bez Warszawy zmusiły jego działaczy do przemyślenia, które elementy dawnego programu wciąż mają zastosowanie w nowym świecie. Frakcja solidaryzmu podkreśla zobowiązania społeczne, ochronę gospodarczą i współpracę między państwem, pracownikami a kapitałem narodowym. Frakcja odrodzenia uważa, że zwykła restauracja nie wystarczy, i wzywa do odnowy ideologicznej wystarczająco potężnej, by oczyścić ruch z dawnych błędów oraz zbudować go na nowo wokół nowej misji. Obie strony powołują się na tę samą tradycję. Małopolska musi zdecydować, co ta tradycja dzisiaj oznacza."
 aievent_paths.28.a: "Prawo i Sprawiedliwość - Solidaryzm"
 aievent_paths.28.b: "Prawo i Sprawiedliwość - Odrodzenie"

 aievent_paths.29.t: "Łowiąc przyszłość"
 aievent_paths.29.desc: "Wolna Armia przejęła kontrolę nad regionem wrocławskim, wyzwalając jego rzeki, stawy i kanały odpływowe spod każdej władzy, która niegdyś ograniczała święte prawo do łowienia ryb. Gałecki jest zachwycony, żołnierze są najedzeni, a pokój wywołał niespodziewany kryzys konstytucyjny: która ryba jest prawdziwym królem tych wód? Tradycjonaliści popierają szczupaka, bezwzględnego drapieżnika godnego panowania nad każdym szanującym się jeziorem. Potem pojawiły się doniesienia o czymś innym - czymś, co wyszło z wody i dalej się poruszało. Oficerowie żądają odpowiedzi, wędkarze opowiadają się po stronach, a godność nowego reżimu zależy teraz od wyniku tego wyboru."
 aievent_paths.29.a: "Szczupak jest królem wód!"
 aievent_paths.29.b: "CO TO KURWA ZNACZY, ŻE WYSZŁO Z WODY?"

 aievent_paths.30.t: "Pełzający zamach stanu"
 aievent_paths.30.desc: "Świnoujście przejęło kontrolę nad Pomorzem Zachodnim, rozciągając samorządową administrację zrodzoną na wyspach na region wyczerpany wojną. Prezydent Żmurkiewicz przedstawia zwycięstwo jako dowód, że cierpliwość, lokalne sieci i praktyczne zarządzanie wciąż mogą utrzymać państwo w całości. Jego przeciwnicy widzą jedynie starzejący się system rozciągnięty daleko poza swoje naturalne granice. Brudziński zgromadził niezadowolonych urzędników, funkcjonariuszy służb i partyjnych lojalistów wokół alternatywnego ośrodka władzy. Rozkazy są opóźniane, nominacje po cichu zmieniane, a instytucje przejmowane urząd po urzędzie. Zamach stanu już pełznie przez rząd. Pozostaje pytanie, czy uda się go zatrzymać, zanim dotrze na sam szczyt."
 aievent_paths.30.a: "Żmurkiewicz zostaje"
 aievent_paths.30.b: "Brudziński obala rząd"

 aievent_paths.31.t: "Stan psychiczny prezydenta"
 aievent_paths.31.desc: "Po ostatecznym ustanowieniu prawowitego rządu Pomorza Zachodniego prezydent powinien cieszyć się największym triumfem swojej kariery. Zamiast tego jego personel coraz bardziej niepokoją bezsenne noce, chaotyczne dekrety i powtarzane ostrzeżenia, że nadchodzi \"ona\". Nikomu nie udało się ustalić, kim ona jest, kiedy przybędzie ani dlaczego trzeba przygotować na nią nadbrzeżne umocnienia. Lekarz dyskretnie przedstawił prezydentowi plan leczenia, a najwyżsi urzędnicy błagają, by zastosował się do niego, zanim machina państwa stanie się niemożliwa do oddzielenia od jego prywatnego lęku. Musi wybrać między powrotem do stabilności a podążeniem za wizją aż do samego końca."
 aievent_paths.31.a: "Czas na leki."
 aievent_paths.31.b: "ONA NADCHODZI"

 aievent_paths.32.t: "Gambit Macierewicza"
 aievent_paths.32.desc: "Antoni Macierewicz ustanowił to, co uważa za prawowity rząd Dystryktu Stołecznego, pokonując wrogów zarówno widocznych, jak i - według kilku utajnionych raportów - starannie ukrytych. Zwycięstwo go nie uspokoiło. Jeden krąg doradców przekonuje, że spisek jest wieczny, a państwo należy przeorganizować do niekończącej się wojny z zagrożeniami, które mogą nigdy nie ujawnić się otwarcie. Inni przyjęli coraz bardziej proroczy język Macierewicza i odczytują jego przetrwanie jako dowód, że nie jest jedynie mężem stanu, lecz nowym wcieleniem Wielkiego Inki Tupaca Amaru. Spór, który zaczął się od polityki, staje się wyborem między nieskończoną mobilizacją a mistyczną przemianą. Macierewicz musi dokończyć swój gambit."
 aievent_paths.32.a: "Wieczna wojna"
 aievent_paths.32.b: "Wcielenie Tupaca Amaru"

 aievent_paths.33.t: "Zielona anarchia"
 aievent_paths.33.desc: "Po likwidacji ostatniego rozpoznawalnego rządu Dystryktu Stołecznego frakcja Sylwii Spurek wydaje się pozbawiona jakiejkolwiek konwencjonalnej przyszłości politycznej. Nie zostały żadne ministerstwa do przejęcia, niewiele instytucji do zreformowania i ledwie jakiekolwiek państwo, przeciwko któremu można się buntować. Dla części zwolenników nie jest to porażka, lecz ostateczne wyzwolenie spod hierarchii. Nawołują Spurek do zachowania anarchoprymitywistycznych komun, porzucenia ruin społeczeństwa przemysłowego i udowodnienia, że życie bez państwa jest możliwe. Inni są wyczerpani, rozproszeni i gotowi przyznać, że eksperyment dobiegł końca. Jeżeli nic nie pozostało, wszystko może być możliwe - nawet zwyczajne odejście."
 aievent_paths.33.a: "Zostajemy tutaj"
 aievent_paths.33.b: "Moja praca tutaj dobiegła końca"

 aievent_paths.34.t: "Czerwony świt"
 aievent_paths.34.desc: "Towarzysz Nowicki ustanowił prawowity rząd Małopolski, lecz rewolucyjne zwycięstwo pozostawiło go na czele zniszczonego przemysłu, pustego budżetu i ludności oczekującej natychmiastowej poprawy. Delegacje z Chin oferują maszyny, doradców i sprawdzony model rozwoju zdolny wydobyć region z nędzy. Ich pomoc mogłaby zapewnić dobrobyt, lecz zarazem przeobraziłaby partię i związała jej przyszłość z obcymi wpływami. Część towarzyszy naciska na Nowickiego, aby przyjął partnerstwo jako jedyną poważną drogę ku modernizacji. Inni nie ufają przybyszom, ich programowi ani - z przyczyn, które nabrały niespodziewanego znaczenia podczas negocjacji - ich okularom. Tak czy inaczej, zbliża się czerwony świt."
 aievent_paths.34.a: "Skończy się Polska niedola!"
 aievent_paths.34.b: "Nie podobają mi się twoje okulary"


 aievent.3.t: "Wybór dla Południowego Podlasia"
 aievent.3.desc: "Południowe Podlasie przetrwało zjednoczenie, rządy nadzwyczajne i więcej tymczasowych komitetów, niż ktokolwiek chciałby pamiętać. Teraz jego mieszkańcy mają wreszcie zdecydować, kto powinien rządzić nimi w czasie pokoju. Truskolaski oferuje ciągłość, doświadczenie samorządowe i uspokajającą obietnicę, że jutro będzie mniej więcej podobne do dzisiaj. Jego przeciwnik oferuje zmianę, choć większość wyborców nie ma pewności, kim właściwie jest ani czy kiedykolwiek go widziała. Wiedzą tylko, że dużo mówi o jakiejś wsi zwanej Kąkolewnicą i że jest hydraulikiem. Być może nie są to najbardziej inspirujące kandydatury w historii demokracji, lecz tylko one pozostały. Południowe Podlasie musi wybrać mądrze - albo przynajmniej wybrać kogokolwiek."
 aievent.3.a: "Truskolaski - jeszcze jedna kadencja!"
 aievent.3.b: "Ten drugi - kimkolwiek jest"

 aievent.4.t: "Po barykadach"
 aievent.4.desc: "Kryzys w Mysłowicach został rozwiązany - na lepsze lub gorsze - lecz obnażył wszystkie pęknięcia w naszym ruchu. Czarny Blok twierdzi, że wahanie omal nas nie zniszczyło, i domaga się zdyscyplinowanej siły rewolucyjnej zdolnej zdławić kolejny bunt, zanim ten na dobre się rozpocznie. Frakcja komunalna utrzymuje, że represje jedynie odtwarzają społeczeństwo, które przysięgliśmy obalić, i wzywa do budowy autonomicznych osad rządzonych poprzez współpracę i konsensus. Tymczasem wrogowie wewnątrz i na zewnątrz naszego terytorium czekają na okazję, by rozstrzygnąć sprawę materiałami wybuchowymi. Antifa przetrwała powstanie, lecz samo przetrwanie nie może określać jej przyszłości. Musimy zdecydować, czym właściwie ma stać się nasze cenne społeczeństwo."
 aievent.4.a: "Czarny Blok zapanuje niepodzielnie!"
 aievent.4.b: "Cała władza w ręce komun!"
 aievent.4.c: "ŚMIERĆ ANTIFIE! *wybuch*"

 aievent.5.t: "Pęknięcia w Międzypowiatówce"
 aievent.5.desc: "Po przedwczesnym upadku Kongresu Będzińskiego frakcje sojuszu zaczęły obarczać się nawzajem winą za praktycznie każde nieszczęście trapiące ich ziemie. Trwa mobilizacja, a sąsiedzi wymieniają groźby interwencji zbrojnej i otwartej wojny. Istnieje nikła nadzieja, że z czasem emocje opadną, lecz wszystko wskazuje na to, że pewna granica została przekroczona - wszystkie znaki prowadzą ku wojnie. Jedno jest natomiast pewne: Międzypowiatówka, po niemal dwóch latach istnienia, został oficjalnie rozwiązany. Dawnych członków nie łączą już żadne wiążące zobowiązania i nic nie stoi na drodze do wybuchu między nimi konfliktu na pełną skalę."
 aievent.5.a: "Najwyższy czas..."

 aievent.6.t: "Liga Śląska oficjalnie rozwiązana"
 aievent.6.desc: "To, co niegdyś przedstawiano jako zjednoczony front górnośląskich watażków, ostatecznie załamało się pod ciężarem własnych sprzeczności. Miesiące rywalizacji, intryg i małostkowych sporów o przywództwo rozdarły sojusz na strzępy, a jego członkowie są obecnie bardziej zainteresowani walką między sobą niż stawianiem czoła wspólnym wrogom. Maski jedności opadły, ujawniając prawdziwą naturę Ligi - zbiorowisko ambitnych siłaczy, których łączyła wygoda, a nie przekonania. Upadek regionalnej potęgi bez wątpienia przyniesie Śląskowi dalszą niestabilność, lecz zarazem tworzy okazję dla tych, którzy odważą się przejąć stery historii. Podzieleni watażkowie są słabsi niż kiedykolwiek, a przyszłość regionu ponownie czeka na zdobywcę."
 aievent.6.a: "Dać małpie zegarek..."

 aievent.15.t: "Gambit Pana Hotela"
 aievent.15.desc: "Zarządzanie imperium hotelowym jest proste w porównaniu z rządzeniem państwem. Goście narzekają na jedzenie, a nie na artylerię. Konkurenci walczą o klientów, a nie o terytorium. Nagły upadek Eurokomisariatów sprawił jednak, że świat spoza naszych kurortów zapukał do drzwi. Sudety znalazły się w samym środku narastającej rywalizacji między ambitnymi sąsiadami i każdy oczekuje, że opowiemy się po którejś stronie. Dołączenie do większego bloku ma swoje zalety. Samodzielność również je posiada. Każdy dzień zwłoki daje jednak innym kolejny dzień na podejmowanie decyzji za nas. Jedno jest pewne - epoka zwykłego sprzedawania wakacji i ignorowania polityki dobiegła końca."
 aievent.15.a: "Sprzymierzmy się z Eurokomisariatem"
 aievent.15.b: "Sprzymierzmy się z liberalnymi siłami z EK"
 aievent.15.d: "Podpiszmy fuzję z KGHM"
 aievent.15.e: "Zapłaćmy trybut romskiemu królowi"
 aievent.15.f: "Sami poradzimy sobie lepiej"

 aievent.17.t: "Twój ulubiony smak mięsa"
 aievent.17.desc: "Nasze przedsiębiorstwo jest dość specyficzne - zajmujemy się mięsem. Nieważne, czy zwierzęcym, czy też... bardziej ludzkim. Jedno jest pewne: nie możemy pozwolić, by dwa kawałki tego samego mięsa pozostały rozdzielone. Trzeba przyrządzić je w całości. Różni kucharze mają jednak odmienne pomysły na przygotowanie naszego narodowego dania. Jak ma smakować?"
 aievent.17.a: "Żylaste i krwiste - Henryk Kania"
 aievent.17.b: "Tanie i przypalone - Henryk Stokłosa"

 aievent.22.t: "Wybór naszego patrona"
 aievent.22.desc: "Nasze miasto jest bez wątpienia klejnotem tego regionu. Nie możemy jednak naprawdę prosperować wyłącznie w granicach miejskich, kiedy wszystko wokół stoi w ogniu. Nie damy też rady samotnie prowadzić tej walki - będziemy musieli znaleźć sobie klienta. Albo partnera, jeśli ktoś woli. W naszym otoczeniu działają poważni gracze, a sojusz z nimi bardzo pomógłby naszej sprawie i z pewnością ułatwił ochronę miasta. Oczywiście w zamian sprzedamy im broń."
 aievent.22.a: "Wpuśćmy Grupę Polsat do miasta"
 aievent.22.b: "Odtwórzmy Koalicję Obywatelską"
 aievent.22.c: "Najwierniejsi partnerzy w polityce"
 aievent.22.d: "Postawmy na czarny rynek - zyski bez sojuszników"

 aievent.24.t: "Czarna Brama się budzi"
 aievent.24.desc: "Zza wschodniej granicy docierają mroczne doniesienia. Otwarto rosyjskie magazyny, formują się oddziały rezerwowe, a długie kolumny pojazdów pancernych gromadzą się za tym, co nasi żołnierze zaczęli nazywać Czarną Bramą. Orkowie z Mordoru ukrywają zamiary pod propagandą, lecz żaden pokojowy cel nie wymaga aż tylu czołgów. Wkrótce mogą ruszyć na zachód, niosąc okupację, zepsucie i przeklętą literę Z na ziemie wolnych ludów. Każdy rząd Śródziemia musi przygotować się na nadchodzącą burzę. Na dyplomację przyjdzie czas po otwarciu bram. Teraz pozostają tylko mobilizacja, fortyfikacje i pewność, że na Wschodzie porusza się coś strasznego - a właściwie to na Północy."
 aievent.24.a: "RUSH Z!"

 aievent.28.t: "Stalowa Wola szuka patrona"
 aievent.28.desc: "Stalowa Wola posiada fabryki, broń i dumną tradycję przemysłową, lecz żadna z tych rzeczy nie zrekompensuje wiecznie strategicznej izolacji. Nasi sąsiedzi rosną w siłę, szlaki handlowe pozostają niebezpieczne, a dostawy żywności i paliwa zależą od dobrej woli potęg leżących poza naszymi granicami. Republika Tarnobrzeska oferuje dostęp gospodarczy, ochronę polityczną i integrację z pobliskim państwem cywilnym. Rycerze Chrystusa obiecują bezpieczeństwo militarne, duchowy cel i miejsce w swoim rozrastającym się świętym zakonie. Każdy z patronów mógłby zagwarantować nam przetrwanie, lecz żaden nie zapewni ochrony bez zażądania lojalności w zamian. Stalowa Wola musi zdecydować, pod czyim sztandarem będzie działał jej przemysł."
 aievent.28.a: "Stańmy po stronie Republiki Tarnobrzeskiej"
 aievent.28.b: "Uklęknijmy przed Rycerzami Chrystusa"

 aievent.30.t: "Chrzanów zrywa kajdany"
 aievent.30.desc: "Władza Ziobry sięgała niegdyś Chrzanowa za pośrednictwem prokuratorów, lojalnych urzędników i strachu przed tym, że opór sprowadzi błyskawiczną karę. Ta sieć właśnie się rozpada. Porażki na innych frontach pozostawiły miejscowy garnizon bez żołdu, a rozkazy z góry stają się z każdym dniem bardziej rozpaczliwe i mniej wiarygodne. Władze miejskie, dowódcy policji i byli działacze partyjni po cichu zawiązali spisek, by odzyskać miasto, zanim ziobryści pociągną je na dno razem ze sobą. Sąd został otoczony, rozgłośnia radiowa zabezpieczona, a portrety Prokuratora już znikają z urzędów. Chrzanów odzyskuje wolność. Pozostaje tylko ogłosić koniec rządów ziobrystów."
 aievent.30.a: "Precz z Prokuratorem!"

 aievent.31.t: "Ognie Nowego Targu"
 aievent.31.desc: "Niepowodzenie w przywołaniu Zakopanego do porządku było czymś nieco większym niż wojskową kompromitacją. Udowodniło, że bunt może się powieść. Broń, agitatorzy i triumfalne pogłoski powędrowały na północ górskimi drogami, podsycając każdą krzywdę, którą nasza administracja zdołała dotąd stłumić. Teraz barykady dzielą Nowy Targ, budynki rządowe płoną, a rywalizujące grupy wymieniają ogień na ulicach, które jeszcze wczoraj wydawały się spokojne. Lokalne oddziały wahają się, niepewne, czy nadejdą posiłki i czy cała południowa granica nie została już stracona. Mieliśmy tu coś dobrego - nie idealnego, ale dobrego. Pozwalając Zakopanemu uniknąć kary, doprowadziliśmy do upadku tego porządku."
 aievent.31.a: "Mieliśmy tu coś dobrego..."

 aievent.32.t: "Kryzys kozienicki"
 aievent.32.desc: "Elektrownia w Kozienicach stała się nagrodą w konfrontacji znacznie większej od samego miasta. Wysłannicy Piechocińskiego przybywają z traktatem obiecującym ochronę i dalsze funkcjonowanie administracji cywilnej, podczas gdy w pobliżu czekają jednostki pancerne gotowe wkroczyć w razie fiaska negocjacji. Jednocześnie Siły Powietrzne żądają kontroli nad elektrownią w celu zabezpieczenia swoich baz i proponują własne porozumienie w cieniu krążących nad okolicą samolotów. Możemy sprzymierzyć się z jedną ze stron na wynegocjowanych warunkach, zachowując przynajmniej pozory autonomii. Możemy też odrzucić dokumenty i pozwolić czołgistom lub lotnikom narzucić bardziej bezpośrednie rozwiązanie. Kozienice nie mogą pozostać w garwolińskim uścisku; Fogiel może jedynie wybrać sposób ich podporządkowania."
 aievent.32.a: "Traktat z Piechocińskim"
 aievent.32.b: "Otwórzmy bramy przed czołgami"
 aievent.32.c: "Traktat z Siłami Powietrznymi"
 aievent.32.d: "Otwórzmy bramy przed lotnikami"

 aievent.33.t: "Polsat rusza na zakupy"
 aievent.33.desc: "Północna kampania przyniosła Polsatowi nie tylko terytorium. W jego zasięgu znalazł się także atrakcyjny portfel sadów, rozlewni, sieci dystrybucyjnych oraz jeden szczególnie cenny browar w Warce. Zarząd dostrzega okazję do przekształcenia wpływów wojskowych w trwałą dominację rynkową. Zakup sadów zabezpieczyłby dostawy produktów rolnych i otworzył nowe linie konsumenckie. Przejęcie Warki dodałoby do korporacyjnej rodziny uznaną markę napojów. Nabycie obu aktywów obiecuje integrację pionową na skalę ekscytującą każdego dyrektora, choć księgowi ostrzegają, że koszty odbudowy mogą przewyższyć zyski. Polsat musi zdecydować, czy to strategiczna ekspansja, czy tylko kosztowny ciężar."
 aievent.33.a: "Przejmijmy grójeckie sady"
 aievent.33.b: "Kupmy cały pakiet"
 aievent.33.c: "Przejmijmy browar w Warce"
 aievent.33.d: "Niektóre aktywa są tylko ciężarem"

 aievent.34.t: "Czy Wałbrzych da się uratować?"
 aievent.34.desc: "Wałbrzych przetrwał zamykanie kopalń, upadek polityczny i powtarzające się odkrycie, że nikt spoza Wałbrzycha szczególnie nie pragnie brać za niego odpowiedzialności. Niestety nawet ta poobijana menelska dziura potrzebuje przyszłości. Roman Szełemej oferuje znajomy komfort kolejnej kadencji, kolejnego planu odbudowy i być może kolejnej próby doprowadzenia miasta do normalnego funkcjonowania. Stanisław Żółtek obiecuje wolność od biurokracji i podatków, a być może także dodatkowe atrakcje, takie jak dotacje na alkohol. Tymczasem PPPP powróciła z politycznej prehistorii z piwem, hasłami i pewnością siebie partii świadomej, że sytuacja nie może stać się dużo mniej poważna. Miasto musi wybrać najmniej niemożliwą spośród trzech przyszłości."
 aievent.34.a: "Dobra, dajmy Szełemejowi kolejną kadencję"
 aievent.34.b: "Żółtek da nam wolność!"
 aievent.34.c: "PPPP powstaje z grobu!"

 aievent.35.t: "Mandat Niebios"
 aievent.35.desc: "Wieczna Procesja stała się zbyt potężna, by dalej istnieć bez ujawnienia swojego ostatecznego celu. Terlecki może odrzucić wszelkie pozory, przyjąć swoją naturę lisza i rozkazywać umarłym za pomocą czystej magicznej mocy. Może również zachować święty wizerunek Procesji, nadal posługiwać się językiem wiary i utrzymać pożyteczny sojusz z Myślenicami. Trzecia droga pozwoliłaby zachować wiarę, lecz odrzucić sojusznika: ogłosić bezpośrednie Rządy Boga, potępić wszystkie konkurencyjne władze i ustanowić teokrację odpowiadającą wyłącznie przed niebem. Każdy wybór oferuje inny mandat i każdy wymaga poświęcenia części porządku, który doprowadził nas aż tutaj. Terlecki musi wreszcie ujawnić, jakim władcą zamierza zostać."
 aievent.35.a: "Zapraszamy do szkieletorni!"
 aievent.35.b: "Podtrzymajmy świętą maskaradę"
 aievent.35.c: "Jedno prawo - Prawo Boże"

 aievent.37.t: "Niepokoje w Mysłowicach"
 aievent.37.desc: "Maski opadły w Mysłowicach. Sabotagereferat Myslovitz - złożony z niemieckich marionetek i terrorystów rozzuchwalonych słabością oraz tęsknotą za starym światem - otwarcie wystąpił przeciwko porządkowi ludowemu i chwycił za broń przeciwko naszej rewolucji. Ich rebelia nie jest jedynie atakiem na nasze społeczności - to atak na samą wolność. Niech stawią opór. Komuny Jaworzna mierzyły się już z gorszymi wrogami, a ci zdrajcy wkrótce zrozumieją, że rewolucji nie broni się samymi słowami."
 aievent.37.a: "Odpowiedzmy zbrojnie!"
 aievent.37.b: "To więcej kłopotu, niż jest warte..."

 aievent.38.t: "Przyjaciele na wysokich stanowiskach"
 aievent.38.desc: "Powstanie w Mysłowicach przetrwało pierwsze starcia z Antifą, lecz odwaga nie zastąpi amunicji, lekarstw ani wyszkolonych posiłków. Jaworzno wciąż dysponuje silniejszą organizacją - o ironio - i bez pomocy z zewnątrz nasze powstanie może zostać zdławione, zanim reszta Śląska zrozumie, co się dzieje. Dwóch potencjalnych sojuszników znajduje się wystarczająco blisko, by interweniować. Katowice posiadają większe zasoby i mogłyby całkowicie odmienić równowagę sił, choć ich wsparcie wiązałoby się z oczekiwaniami politycznymi. Chorzów oferuje bardziej lokalne partnerstwo i może okazać się łatwiejszym współpracownikiem po zwycięstwie. Kurierzy są gotowi przedrzeć się przez linie. Musimy zdecydować, które miasto otrzyma naszą prośbę o pomoc."
 aievent.38.a: "Wyślijmy posłańców do Katowic"
 aievent.38.b: "Wyślijmy posłańców do Chorzowa"

 aievent.39.t: "Mysłowice apelują do Katowic"
 aievent.39.desc: "Kurierzy z Mysłowic dotarli do Katowic z doniesieniami o barykadach, walkach ulicznych i powstaniu stojącym na krawędzi klęski z rąk sił Antify z Jaworzna. Proszą o broń, ochotników i polityczne uznanie potrzebne do utrzymania rebelii przy życiu. Interwencja zabezpieczyłaby nasze wschodnie podejścia i zapewniła Katowicom wpływ na każdy rząd, który wyłoni się z konfliktu. Wciągnęłaby nas także bezpośrednio w wojnę, która może okazać się dłuższa i brzydsza, niż przyznają powstańcy. Odmowa nic nas dzisiaj nie kosztuje, lecz zwycięska Antifa zapamięta nasze milczenie. Mysłowice wezwały pomocy, a Katowice muszą zdecydować, czy odpowiedzieć."
 aievent.39.a: "Katowice odpowiadają na wezwanie!"
 aievent.39.b: "To nie nasza wojna"

 aievent.40.t: "Mysłowice apelują do Chorzowa"
 aievent.40.desc: "Delegacja z Mysłowic dotarła do Chorzowa po przedarciu się przez linie Antify. Jej członkowie opisują wyczerpane, lecz zdeterminowane powstanie, któremu brakuje broni i które w każdej chwili spodziewa się rozstrzygającego szturmu z Jaworzna. Odwołują się do śląskiej solidarności i obiecują przyjaźń, wpływy oraz przyszłą współpracę w zamian za natychmiastową pomoc wojskową. Wsparcie rozszerzyłoby naszą pozycję w regionie i powstrzymało Antifę przed umocnieniem się w kolejnym mieście przemysłowym. Naraziłoby jednak naszych żołnierzy w cudzym powstaniu bez żadnej gwarancji, że rebelianci utrzymają jedność po zwycięstwie. Decyzji nie można odkładać; jutro może już nie być komu pomagać."
 aievent.40.a: "Chorzów odpowiada na wezwanie!"
 aievent.40.b: "To nie nasza wojna"

 aievent.41.t: "Śląskie wojska wkraczają do Mysłowic"
 aievent.41.desc: "Pogłoski się potwierdziły. Śląskie wojska wkraczają do Mysłowic z bronią, doradcami i zapasami wystarczającymi, by zmienić rozpaczliwą rebelię w poważną kampanię wojskową. Oddziały powstańcze, które jeszcze wczoraj się wycofywały, powróciły na barykady, koordynowane teraz za pomocą śląskich radiostacji i wzmocnione świeżymi ochotnikami. Nasze siły w Jaworznie pozostają wyczerpane, rozproszone i zupełnie nieprzygotowane do starcia z regionalnym mocarstwem. Bezpośrednia bitwa groziłaby zniszczeniem wszystkiego, co zbudowaliśmy, zanim zdołalibyśmy zgromadzić posiłki. Na razie rewolucja nie ma odpowiedzi na maszerujące przeciwko nam kolumny. Jeszcze nie możemy walczyć ze Śląskiem. Musimy się wycofać i przetrwać."
 aievent.41.a: "Odwrót - jeszcze nie możemy z nimi walczyć!"

 aievent.42.t: "Kwestia Jaworzna"
 aievent.42.desc: "Siły Myslovitz wkroczyły do Jaworzna, kończąc rządy Antify i przejmując kontrolę nad miastem. Zwycięstwo stawia przed nami mniej chwalebny problem: co właściwie mamy z nim zrobić? Aneksja zapewniłaby przemysł, zasoby ludzkie i bazę dla obiecanego wyzwolenia całego Zagłębia, lecz wymagałaby również długiej okupacji. Zależny samorząd mógłby oszczędzić nam tego ciężaru, utrzymując Jaworzno w naszej strefie wpływów. Możemy też całkowicie się wycofać i pozwolić frakcjom miasta walczyć o ruiny bez marnowania kolejnych żołnierzy i urzędników. Pokonaliśmy wroga. Teraz musimy zdecydować, czy Jaworzno jest nagrodą, strefą buforową, czy zwykłą dziurą, którą najlepiej porzucić."
 aievent.42.a: "Naprzód ku wyzwoleniu Zagłębia!"
 aievent.42.b: "Lojalny rząd w zupełności wystarczy"
 aievent.42.c: "Zostawmy tę dziurę jej własnemu losowi"

 aievent.43.t: "Wyzwolenie Zagłębia i Jury"
 aievent.43.desc: "Upadek Jaworzna doprowadził Myslovitz do granicy Zagłębia i Jury oraz przekształcił miejską rebelię w regionalne mocarstwo. Nasi przywódcy twierdzą teraz, że zwycięstwo nie może zostać zabezpieczone, dopóki ludzie za granicą pozostają pod obcym i sztucznym porządkiem. Biura werbunkowe są przepełnione, otwarto stare przemysłowe magazyny, a wozy propagandowe przemierzają miasta, obiecując ostateczną wojnę wyzwoleńczą. Wróg odrzucił każde ultimatum i rozpoczął mobilizację własnych sił na drogach prowadzących do Jaworzna. Żadna ze stron nie oczekuje dalszych negocjacji. Kampania rozstrzygnie, czy nasza rewolucja zatrzyma się na granicy, czy ogarnie cały region. Naprzód!"
 aievent.43.a: "Naprzód, Myslovitz!"

 aievent.44.t: "Jeden Triumwirat, jeden region"
 aievent.44.desc: "Ebrantil, Rutkowski i Skrzydlewski zbudowali Triumwirat jako tymczasowe porozumienie między siłami zbyt użytecznymi, by je zniszczyć, i zbyt niebezpiecznymi, by im zaufać. Wbrew wszelkim oczekiwaniom przetrwał on wystarczająco długo, by zdominować okolicę. Sukces wymaga teraz trwałej struktury. Niekończące się negocjacje między trzema prywatnymi domenami nie mogą zarządzać rozrastającym się państwem, podczas gdy niezależni sąsiedzi wykorzystują każdy spór między jego przywódcami. Przywódcy przyjęli więc pierwszą zasadę przyszłego porządku: wszystkie frakcje wewnątrz Triumwiratu muszą zostać zintegrowane, dobrowolnie, jeśli to możliwe, i siłą, jeśli okaże się to konieczne. Wewnętrzną równowagę można ustalić później. Na razie Triumwirat zaoferuje światu prosty wybór - dołączcie albo zgińcie."
 aievent.44.a: "Dołączcie do nas - albo zgińcie"

 aievent.45.t: "Ultimatum Triumwiratu"
 aievent.45.desc: "Wysłannik Triumwiratu przybył pod zbrojną eskortą, przynosząc traktat, termin i bardzo niewielką chęć do negocjacji. Proponuje nam oddanie kontroli nad polityką zagraniczną, siłami zbrojnymi i strategicznymi zasobami w zamian za ochronę oraz miejsce w nowym porządku. Zapewnia, że podporządkowanie pozwoli zachować lokalną administrację i oszczędzi naszym ludziom kolejnej wojny. Zwiadowcy donoszą jednak, że oddziały przywódcy Triumwiratu już gromadzą się w pobliżu granicy, gotowe udzielić mniej dyplomatycznej odpowiedzi w razie naszej odmowy. Zgoda zakończy naszą niepodległość. Opór może zakończyć istnienie samego państwa. Musimy zdecydować przed upływem wyznaczonego terminu."
 aievent.45.a: "Poddajemy się... na razie"
 aievent.45.b: "W dupę se wsadźcie to ultimatum!"

 aievent.46.t: "Zwycięstwo Triumwiratu"
 aievent.46.desc: "Ostatni zorganizowany opór przeciwko Triumwiratowi upadł. Nieprzyjacielskie twierdze skapitulowały, rozproszone jednostki składają broń, a drogi między naszymi terytoriami są otwarte po raz pierwszy od początku wojny. Zwycięstwo potwierdziło słuszność polityki przymusowej jedności, lecz pozostawiło nas także z odpowiedzialnością za zniszczone miasta, wrogą ludność i instytucje poskładane z elementów trzech konkurencyjnych systemów. Pogotowie, Rutkowski i Skrzydlewska nie mogli już rządzić wyłącznie za pomocą rad wojennych i improwizowanych porozumień. Musieli rozstrzygnąć, kto tu właściwie rządzi. Teraz jednak epoka podbojów dobiega końca - przynajmniej na razie. Jeśli Triumwirat ma przetrwać własne zwycięstwo, musi wreszcie zbudować państwo zdolne rządzić tym, co zdobyło."
 aievent.46.a: "Wojna się skończyła. Teraz rządzimy."


 aievent_tarnow.1.t: "Agrarny dylemat Kosiniaka-Kamysza"
 aievent_tarnow.1.desc: "Kosiniak-Kamysz może i rządzi w Tarnowie - przynajmniej w jego połowie - lecz Waldemar Pawlak i jego Ludowe Brygady Pożarnicze pozostają konkurencyjnym ośrodkiem władzy agrarnej. Ich sprzeczne roszczenia dzielą rady wiejskie, oddziały ochotnicze i niemal każdą instytucję wciąż związaną z dawnym ruchem ludowym. Rozważane są trzy rozwiązania. Możemy rozstrzygnąć spór w zdecydowany sposób, wykorzystując chemiczny potencjał zakładów azotowych w Mościcach do usunięcia Pawlaka z równania. Możemy zaprosić pozostałych agrarystów do negocjacji nad wielką koalicją opartą na wspólnych interesach. Możemy też całkowicie uniknąć tej nieprzyjemnej sprawy, uznać, że zasadniczo wszystko jest w porządku, i nie robić absolutnie nic. Nie jest jednak w porządku."
 aievent_tarnow.1.a: "Trochę folkloru, trochę fosforu"
 aievent_tarnow.1.b: "Zwołajmy kongres ludowców"
 aievent_tarnow.1.c: "Nic nie róbmy - wszystko jest w porządku"

 aievent_tarnow.2.t: "Trochę folkloru, trochę fosforu"
 aievent_tarnow.2.desc: "Plan wykorzystywał lokalne kontakty, chemię przemysłową i szczere przekonanie, że kilka ton nawozu może rozstrzygnąć wewnętrzny spór partyjny. Eksplozja w zakładach azotowych w Mościcach przerosła nawet oczekiwania jej autorów. Pawlak zmarł wskutek ran odniesionych w wybuchu, horyzont nad Tarnowem płonie, a każdy oddział Ludowych Brygad Pożarniczych uznał atak za wypowiedzenie wojny. Syreny rozbrzmiewają teraz na całej wsi, wozy strażackie są przerabiane na improwizowane pojazdy bojowe, a kompanie wiejskie mobilizują się przeciwko nam. Subtelność nie wchodzi już w grę. Kosiniak-Kamysz wkroczy do Tarnowa, jakby miasto od zawsze należało do niego - o ile strażacy nie dotrą tam pierwsi."
 aievent_tarnow.2.a: "Sierpem i kosą"

 aievent_tarnow.3.t: "Wielki kompromis ludowy"
 aievent_tarnow.3.desc: "Wbrew każdemu instynktowi wykształconemu przez polskich polityków ruchu ludowego w ciągu minionego stulecia negocjacje przyniosły porozumienie. Pawlak, Kosiniak-Kamysz i prezydent Tarnowa zgodzili się, że żaden z nich nie może zdominować regionu bez wyczerpania pozostałych. Ludowe Brygady Pożarnicze zachowają swoje wiejskie struktury, obóz Kosiniaka pokieruje szerszym projektem politycznym, a administracja miejska utrzyma Tarnów w działaniu, podczas gdy obie strony będą się spierać. Porozumienie jest niezgrabne, pełne sprzecznych obietnic i już teraz wspierane przez trzy odmienne interpretacje podpisanego dokumentu. Innymi słowy, może to być najbardziej autentyczna koalicja ludowa, jaka kiedykolwiek powstała. Rodzi się nowy sojusz."
 aievent_tarnow.3.a: "Narodził się nowy sojusz chłopski"

 aievent_tarnow.4.t: "Wszystko jest w porządku (nie jest)"
 aievent_tarnow.4.desc: "Kosiniak-Kamysz wybrał cierpliwość, bezczynność i pocieszające założenie, że Pawlak w końcu straci zainteresowanie. Pawlak nie stracił zainteresowania. O świcie Ludowe Brygady Pożarnicze wjechały do Tarnowa w konwoju wozów z wyjączymi syrenami, podniesionymi drabinami i uzbrojonymi ochotnikami uczepionymi każdej dostępnej powierzchni. Pojazd na czele kolumny przebił się prosto przez linię obrony rządu i o mało nie przejechał samego Kosiniaka. Walki spustoszyły miasto, administracja upadła, a Pawlak kontroluje to, co pozostało. Kosiniak-Kamysz przeżył, lecz ledwo, i wraz z najbliższymi zwolennikami uciekł do Dąbrowy Tarnowskiej. Stamtąd obiecuje powrócić. Agrarny spór przerodził się w otwartą wojnę."
 aievent_tarnow.4.a: "Tarnów upada - Kosiniak ucieka"

 aievent_gory.1.t: "Koniec autonomii Beskidów"
 aievent_gory.1.desc: "Beskidzkie protektoraty spełniły swoje zadanie podczas wojen zjednoczeniowych. Ich lokalne administracje dostarczały żołnierzy, strzegły przełęczy i wykonywały nasze polecenia, zachowując przy tym pozory niezależności. Po zabezpieczeniu gór układ ten stał się przeszkodą zamiast korzyścią. Oddzielne posterunki celne zakłócają handel, konkurencyjne prawa komplikują pobór, a ambitni przywódcy marionetek nadal wyobrażają sobie, że tymczasowa autonomia jest trwałym prawem. Delegacje zostały wezwane do zatwierdzenia ostatecznego aktu integracji. Ich siły zbrojne przejdą pod nasze dowództwo, urzędy zostaną wchłonięte, a granice znikną z map. Epoka beskidzkich marionetek dobiegła końca; góry będą odtąd rządzone jako jedno państwo."
 aievent_gory.1.a: "Jedne góry, jedno państwo"

 aievent_gory.2.t: "Wielka Federacja Karpacka"
 aievent_gory.2.desc: "Wielki Sojusz Cieszyński powstał w celu pokonania wspólnych wrogów, a nie po to, by ich przeżyć. Lata współpracy związały jednak jego członków poprzez wspólne dowództwa, otwarte drogi i niezwykły autorytet Adama Małysza. Powrót do mozaiki małych sprzymierzonych państw zmarnowałby wszystko, co osiągnięto podczas wojny. Na zaproszenie Małysza ich przywódcy zebrali się, by ustanowić jedną Federację, łączącą obronność, politykę zagraniczną i administrację gospodarczą, a zarazem zachowującą miejsce dla górskich regionów w nowej strukturze. Oficjalnie każdy sojusznik dołącza dobrowolnie. W praktyce nikt nie chce być tym, który odmówi człowiekowi zdolnemu nieść cały sojusz na własnych barkach."
 aievent_gory.2.a: "Adaś Małysz leci po słonecko!"
