l_polish:

 aievent_paths.1.t: "Elections in Silesia"
 aievent_paths.1.desc: "It's time for the people of Silesia to choose their future path. Will they embrace the leftist ideals of the leftist faction of the Silesian National Council, or will they opt for a harsher approach?"
 aievent_paths.1.a: "Silesian National Council - Left"
 aievent_paths.1.b: "Silesian National Council - Hardline"

 aievent_paths.2.t: "Sosnowiec Paths Choice"
 aievent_paths.2.desc: "Żukowska or Litewka? That is the real question. Who will be Czarzasty's successor?"
 aievent_paths.2.a: "Żukowska - Orthodox Leninist Path"
 aievent_paths.2.b: "Litewka - Reformed Socialist Path"

 aievent_paths.3.t: "Częstochowa Paths Choice"
 aievent_paths.3.desc: "Which religious order will gain dominance in Clarus Mons and shape its future?"
 aievent_paths.3.a: "Solus cum Deo solo (Pauline Fathers)"
 aievent_paths.3.b: "Tuitio Fidei et obsequium pauperum (Joannites)"
 aievent_paths.3.c: "DEUS VULT (Pauline Fathers-Crusaders)"

 aievent_paths.4.t: "Election Time"
 aievent_paths.4.desc: "People must choose their future path in this day of decision. There are barely any options left though, so choose wisely."
 aievent_paths.4.a: "Agreement Party"
 aievent_paths.4.b: "United Poland"

 aievent_paths.5.t: "Silesian Elections"
 aievent_paths.5.desc: "The people of Silesia must choose their future path. Although there are many options, only three stand out as the most viable. And...they're not really your standard choices so if you're confused, don't worry - so are we."
 aievent_paths.5.a: "Civic Coalition - Posthumanists"
 aievent_paths.5.b: "Libertarian Coalition - Network Capitalists"
 aievent_paths.5.c: "Agreement Party - Utopia Faction"

 aievent_paths.6.t: "Belarusian Regime Future"
 aievent_paths.6.desc: "Alexander Lukashenka has found himself at a crossroads in strangest of places - Podlachia. It's not Belarus anymore, and the old ways won't work here. What path will he choose to secure his rule?"
 aievent_paths.6.a: "Of course the old ways - crackdown!"
 aievent_paths.6.b: "Maybe we could try...be nice?"

 aievent_paths.7.t: "Bydgoszcz Election of [GetYear]"
 aievent_paths.7.desc: "Now that Bydgoszcz has become an unifier of Kuyavia-Pomerania, its leadership is up for grabs. Who will be chosen to lead the new entity?"
 aievent_paths.7.a: "Bydgoszcz Coalition"
 aievent_paths.7.b: "Law and Justice"
 aievent_paths.7.c: "Sacre Coeur"

 aievent_paths.8.t: "Future of Womankind"
 aievent_paths.8.desc: "Struggle for the soul of feminism in Poland continues. But there are many ideas how the movement should look like in the future. Which one will you support?"
 aievent_paths.8.a: "Matriarchate of the New Amazons"
 aievent_paths.8.b: "Post-Ideological Technofeminism"
 aievent_paths.8.c: "Misandrist Rainbow Capitalism"

 aievent_paths.9.t: "Coup of the King"
 aievent_paths.9.desc: "An unknown figure has appeared in Nowa Huta, claiming to be the promised King born of smog and fire. With a bunch of followers, he managed to seize power in the city, thanks to raging chaos between factions of the Triumvirate."
 aievent_paths.9.a: "Who is he?"

 aievent_paths.10.t: "First Imamate Election"
 aievent_paths.10.desc: "With the establishment of the Imamate of Podlachia, it's time to choose its future path. Various factions vie for influence, each with their own vision for the future of the Muslim community in Podlachia. Which path will you choose to support?"
 aievent_paths.10.a: "Muslim Union"
 aievent_paths.10.b: "Muslim League"
 aievent_paths.10.c: "White Horde"

 aievent_paths.11.t: "Camp of National Unity Election"
 aievent_paths.11.desc: "Just like in the old II Republic of Poland, Camp of National Unity has emerged as a dominant political force in the region. Now, it's time to choose its future path. Which faction will you support to lead the Camp into the future?"
 aievent_paths.11.a: "Nonpartisan Bloc for Cooperation with the Government"
 aievent_paths.11.b: "Executive of National Unity"

 aievent_paths.12.t: "First Free Holy Cross Election"
 aievent_paths.12.desc: "With the establishment of our state in voivodeship, it's time to choose its future path. Various factions vie for influence, each with their own vision for the future of the region. Which path will you choose to support?"
 aievent_paths.12.a: "Polish Republican Party"
 aievent_paths.12.b: "Civic Coalition"
 aievent_paths.12.c: "Effective Party"

 aievent_paths.13.t: "Brotherly Dilemma"
 aievent_paths.13.desc: "Golec Brothers found themselves masters of mountains from Cieszyn Silesia to Gorlice. However, it is clear that their visions for the future differ greatly. Which path will they choose to lead their people?"
 aievent_paths.13.a: "Tradition! Raze them to the ground!"
 aievent_paths.13.b: "We need to start building our future!"

 aievent_paths.14.t: "Gypsies of Silesia"
 aievent_paths.14.desc: "Gypsy wagons roam the lands of Silesia, but their future is uncertain. Which path will they choose to secure their place in this new world?"
 aievent_paths.14.a: "We'll roam free!"
 aievent_paths.14.b: "We need a king!"

 aievent_paths.15.t: "Future of a New Chrysanthemum Throne"
 aievent_paths.15.desc: "Okamura Shogunate has been established in Silesia, but its future is uncertain. Which path will it take to secure its place in this new world?"
 aievent_paths.15.a: "Tenno heika, Banzai!"
 aievent_paths.15.b: "Nani?!"

 aievent_paths.16.t: "Avant-Garde Elections"
 aievent_paths.16.desc: "It's time for the people of Capital District to choose if they want to continue down the path set by Paweł Tanajno, or if they want to try something new with Bartosz Walaszek. The choice is yours."
 aievent_paths.16.a: "Tanajno"
 aievent_paths.16.b: "Walaszek"

 aievent_paths.17.t: "Future of the Eurokommissar"
 aievent_paths.17.desc: "Grzegorz Schetyna presided during the formation of the Eurokommissariat, and during the most devastating years of its existence. Now, we need to judge him - should he continue leading us into the future, or is it time for a change?"
 aievent_paths.17.a: "Have some faith!"
 aievent_paths.17.b: "Eurocorps seize power!"
 aievent_paths.17.c: "Time for the reforms"

 aievent_paths.18.t: "Future of the Eurokommissar"
 aievent_paths.18.desc: "Donald Tusk presided during the formation of the Eurokommissariat, and during the most devastating years of its existence. But, fortunately - he turned the tide and led us into a new era of prosperity. Now, Tusk stands before serious question - to whom should he owe his allegiance?"
 aievent_paths.18.a: "Dla Polski!"
 aievent_paths.18.b: "Für Deutschland!"
 aievent_paths.18.c: "For Europe!"

 aievent_paths.19.t: "Turmoil in Carpathia"
 aievent_paths.19.desc: "Mountains are restless, and so are the people of Carpathia. Who will secure the future of mountaineers, their culture, and their land?"
 aievent_paths.19.a: "Pitoń will secure our future"
 aievent_paths.19.b: "TOKP - Right Wing"
 aievent_paths.19.c: "TOKP - Left Wing..."

 aievent_paths.20.t: "War in the Wolfpack - Outcome"
 aievent_paths.20.desc: "War for West Pomerania was not only a war against germanic invaders. It was also a war between the factions of the Comrades. Now, the dust has settled, and it's time to choose the path forward. And there can be only one winner."
 aievent_paths.20.a: "RIP THEIR HEARTS OUT!"
 aievent_paths.20.b: "Wolfpack reigns supreme!"
 aievent_paths.20.c: "Turn to Russia"

 aievent_paths.21.t: "Future of Junta"
 aievent_paths.21.desc: "Military seized power in Zagłębie and Jura, but now they must decide how to proceed. Will they establish a full military dictatorship, or will they try to work with the local population to create a more balanced governance?"
 aievent_paths.21.a: "Territorial Defence Forces"
 aievent_paths.21.b: "This is...Sparta?"
 aievent_paths.21.c: "Commando Clique"

 aievent_paths.22.t: "Future of Waffen-$$"
 aievent_paths.22.desc: "All of Holy Cross is under control of Kelthuz and his libertarian guerilla army. But now, they must decide how to proceed. There are many different animals inside the Waffen-$$, each with their own vision for the future of the organization. Which path will they choose to secure their place in this new world?"
 aievent_paths.22.a: "Capitalism, or dick up your ass!"
 aievent_paths.22.b: "Day of the Rope is nigh!"
 aievent_paths.22.c: "Nothing matters..."

 aievent_paths.23.t: "Ascension of Lechia"
 aievent_paths.23.desc: "Opole voivodeship falls to Lechite warriors. Will the current leader survive the onslaught from within or will he crumble, and another pretender will arise?"
 aievent_paths.23.a: "Gospodzin Bieszk"
 aievent_paths.23.b: "Master Jaruha"

 aievent_paths.24.t: "Ascension of Lehja"
 aievent_paths.24.desc: "Opole voivodeship falls to Lehjan warriors. Will the current leader survive the onslaught from within or will he crumble, and another pretender will arise?"
 aievent_paths.24.a: "King Sanjaya"
 aievent_paths.24.b: "Master Miłar"

 aievent_paths.25.t: "Ascension of Vandalia"
 aievent_paths.25.desc: "Opole voivodeship falls to Vandal warriors. What is plan of our illustrious leader and what dwells in his head?"
 aievent_paths.25.a: "Grant me revenge!"
 aievent_paths.25.b: "Lead us to Svarga!"

 aievent_paths.26.t: "Elections in Opole"
 aievent_paths.26.desc: "Opole voivodeship has been restored under the righteous Polish government. Now, it's time to choose its future path. Which faction will you support to lead Opole into the future?"
 aievent_paths.26.a: "Kukiz'15"
 aievent_paths.26.b: "Law and Justice"

 aievent_paths.27.t: "First All-Polish Congress"
 aievent_paths.27.desc: "With the establishment of the All-Polish Republic, it's time to choose its future path. Various factions vie for influence, each with their own vision for the future of the National movement. Which path will you choose to support?"
 aievent_paths.27.a: "All-Polish Initiative"
 aievent_paths.27.b: "League of Polish Families"
 aievent_paths.27.c: "National-Democratic Party"

 aievent_paths.28.t: "Lesser Polish Elections"
 aievent_paths.28.desc: "With the establishment of the true government of Lesser Poland, it's time to choose its future path. Various factions vie for influence, each with their own vision for the future of the Law and Justice movement. Which path will you choose to support?"
 aievent_paths.28.a: "Law and Justice - Solidarism"
 aievent_paths.28.b: "Law and Justice - Rebirth"

 aievent_paths.29.t: "Fishing for Future"
 aievent_paths.29.desc: "Free Army has taken control of Wrocław region, and is free to fish everywhere. Gałecki is very happy about it, but there is a matter of establishing which fish is the king of waters here."
 aievent_paths.29.a: "Pike is the king!"
 aievent_paths.29.b: "THE FUCK YOU MEAN, IT'S WALKING?"

 aievent_paths.30.t: "Crawling Coup"
 aievent_paths.30.desc: "Świnoujście has taken control of West Pomerania. But, internal problems arise as factions vie for power."
 aievent_paths.30.a: "Żmurkiewicz stays"
 aievent_paths.30.b: "Brudziński coups the government"

 aievent_paths.31.t: "President's Psychical Condition"
 aievent_paths.31.desc: "With the establishment of the true government of West Pomerania, it's time for Mr. President to decide if he really wants to continue his descent into chaos and sickness, or will he finally take his meds."
 aievent_paths.31.a: "Meds it is."
 aievent_paths.31.b: "SHE'S COMING"

 aievent_paths.32.t: "Macierewicz's Gambit"
 aievent_paths.32.desc: "With the establishment of the true government of Capital District, it's time for Antoni Macierewicz to choose its future path. Various factions vie for influence, each with their own vision for the future of the Law and Justice movement. Which path will you choose to support?"
 aievent_paths.32.a: "Eternal Warfare"
 aievent_paths.32.b: "Incarnation of Tupac Amaru"

 aievent_paths.33.t: "Green Anarchy"
 aievent_paths.33.desc: "With the deestablishment of the true government of Capital District, there is seemingly no future for the faction of Sylwia Spurek. But, if there is nothing, then everything is possible. Will she choose the path of mantaining anarcho primitivist communes, or will she just...give up?"
 aievent_paths.33.a: "We're here to stay"
 aievent_paths.33.b: "My work here is done"

 aievent_paths.34.t: "Red Dawn"
 aievent_paths.34.desc: "With the establishment of the true government of Lesser Poland, comrade Nowicki must choose the path forward for his faction. Will he lead the people of Lesser Poland into a new era of prosperity marked by chinese influence, or will he reject such notions and seek a different path?"
 aievent_paths.34.a: "Polish misery will end!"
 aievent_paths.34.b: "I don't like your glasses"



 aievent.3.t: "Southern Podlachia Elections"
 aievent.3.desc: "People must choose their future path in this day of decision. There are barely any options left though, so choose wisely."
 aievent.3.a: "Truskolaski stays!"
 aievent.3.b: "Who?"

 aievent.4.t: "Future of Antifa"
 aievent.4.desc: "Now that we have resolved the situation in Mysłowice - for better or for worse, it's time to think about our future and if our current leadership is fit to rule our precious society."
 aievent.4.a: "Black Block will reign supreme!"
 aievent.4.b: "Together we will build perfect communes!"
 aievent.4.c: "DEATH TO ANTIFA! *explosion*"

 aievent.5.t: "Cracks in the Intercounty"
 aievent.5.desc: "Following the premature collapse of the Będzin Congress, the alliance factions have begun hurling blame at one another for virtually every ill plaguing the land. Mobilizations are underway, and threats of military intervention and open war are being exchanged between neighbors. While there is a faint hope that tempers may cool over time, it appears a line has been crossed-all signs now point toward war. What is certain, however, is that the Intercounty, after nearly two years of existence, has officially disbanded. No binding ties remain between the former member factions, and nothing stands in the way of a full-scale conflict erupting between them."
 aievent.5.a: "It's a long overdue..."

 aievent.6.t: "Silesian League oficially disbands"
 aievent.6.desc: "What was once presented as a united front of Upper Silesian warlords has finally buckled under the weight of its own contradictions. Months of rivalry, intrigue, and petty disputes over leadership have torn the alliance apart, with its members now more concerned with fighting each other than confronting their enemies. The masks of unity have fallen, revealing what the League always truly was - a collection of ambitious strongmen held together by convenience rather than conviction. While the collapse of a regional power will undoubtedly bring further instability to Silesia, it also presents an opportunity for those who dare take the reins of history. Divided, the warlords are weaker than ever, and the future of the region is once again up for grabs."
 aievent.6.a: "Give a watch to a monkey..."

 aievent.15.t: "Mr. Hotel's Gambit"
 aievent.15.desc: "Running a hotel empire is simple compared to running a country. Guests complain about the food, not artillery. Competitors fight over customers, not territory. Yet with the sudden collapse of the Eurokommissariats, the world outside our resorts has come knocking at our door. The Sudetes now sit in the middle of a growing struggle between ambitious neighbors, and everyone expects us to pick a side. There are advantages to joining a larger bloc. There are advantages to standing alone as well. But every day spent waiting is another day for others to make decisions on our behalf. One thing is certain - the age of simply selling vacations and ignoring politics has come to an end."
 aievent.15.a: "Align with the Eurokommissariat"
 aievent.15.b: "Align with liberal forces from EK"
 aievent.15.d: "Sign a merger with KGHM"
 aievent.15.e: "Pay tribute to the Roma King"
 aievent.15.f: "We will be better on our own"

 aievent.17.t: "Your favourite meat flavor"
 aievent.17.desc: "Our enterprise is a specific one - we happen to deal with meat. Be it may an animal or...more human. One thing is simple - we can't afford to have two pieces of the same meat splitted apart. It has to be cooked as a whole. But different chefs have different ideas about how to prepare our national meal. What it will be?"
 aievent.17.a: "Chewy and bloody - Henryk Kania"
 aievent.17.b: "Cheap and burned - Henryk Stokłosa"

 aievent.22.t: "Choosing our Patron"
 aievent.22.desc: "Our city is definitely a jewel of this region. Yet we can't really prosper only within city limits when everything else is on fire. And we can't be alone in this struggle - we will have to find ourselves a customer. Or a partner if you will. There are some serious players around us that alliance with them would be benefitial to our cause and they would definitely help us protect our city. With guns we will sell them of course."
 aievent.22.a: "Allow Polsat Group into the city"
 aievent.22.b: "Restoration of the Civic Coalition"
 aievent.22.c: "The most loyal partners in politics"
 aievent.22.d: "Go for black market - profits and no allies required"

 aievent.24.t: "Mobilization of Russian Forces"
 aievent.24.desc: "Orcs are mobilizing their forces behind the Black Gate. Soon, they will spew out of Mordor to plague the good people of Middle-Earth with their filth and corruption."
 aievent.24.a: "RUSH Z"

 aievent.28.t: "Question of the Alignment"
 aievent.28.desc: ""
 aievent.28.a: "Submit to Republic of Tarnobrzeg"
 aievent.28.b: "Submit to Knights of the Christ"

 aievent.30.t: "Coup in Chrzanów"
 aievent.30.desc: ""
 aievent.30.a: "Down with the Prosecutor!"

 aievent.31.t: "Nowy Targ erupts with violence!"
 aievent.31.desc: ""
 aievent.31.a: "We had a good thing going..."

 aievent.32.t: "Kozienice Crisis"
 aievent.32.desc: ""
 aievent.32.a: "Sign the treaty with Piechociński"
 aievent.32.b: "Let the tanks in"
 aievent.32.c: "Sign the treaty with the Air Force"
 aievent.32.d: "Let the airmen in"

 aievent.33.t: "Northern Shopping"
 aievent.33.desc: ""
 aievent.33.a: "Buy out Orchards"
 aievent.33.b: "Buy out both"
 aievent.33.c: "Buy out Warka"
 aievent.33.d: "We don't need this burden"

 aievent.34.t: "Future of Wałbrzych"
 aievent.34.desc: ""
 aievent.34.a: "Szełemej one more time???"
 aievent.34.b: "Żółtek will guarantee us freedom!"
 aievent.34.c: "PPPP strikes back!"

 aievent.35.t: "Mandate of Heaven"
 aievent.35.desc: ""
 aievent.35.a: "UNLIMITED POWEEEEEEEEEEEEER!"
 aievent.35.b: "Keep appearancese of faith"
 aievent.35.c: "There is only one rule: Rule of God"

 aievent.37.t: "Turmoil in Mysłowice"
 aievent.37.desc: "The masks have fallen in Mysłowice. Sabotagereferat Myslovitz, German pawns and terorrists, emboldened by weakness and nostalgia for the old world, have openly risen against the people's order and taken up arms against our revolution. Their rebellion is not merely an attack on our societies - it is an attack on the freedom itself. Let them make their stand. The communes of Jaworzno have faced worse enemies before, and these traitors will soon learn that revolutions are not defended with words alone."
 aievent.37.a: "Send military response!"
 aievent.37.b: "It's more trouble than it's worth..."

 aievent.38.t: "In need of assistance"
 aievent.38.desc: ""
 aievent.38.a: "Ask Katowice"
 aievent.38.b: "Ask Chorzów"

 aievent.39.t: "Mysłowice calls for aid!"
 aievent.39.desc: ""
 aievent.39.a: "And we shall answer!"
 aievent.39.b: "They are on their own"

 aievent.40.t: "Mysłowice calls for aid!"
 aievent.40.desc: ""
 aievent.40.a: "And we shall answer!"
 aievent.40.b: "They are on their own"

 aievent.41.t: "Silesia intervenes in Mysłowice rebellion!"
 aievent.41.desc: ""
 aievent.41.a: "We can't fight them yet!"

 aievent.42.t: "Fate of Jaworzno"
 aievent.42.desc: ""
 aievent.42.a: "We will liberate all of Zagłębie!"
 aievent.42.b: "Set up puppet state and leave"
 aievent.42.c: "We don't want to deal with this dump."

 aievent.43.t: "Eurojura Liberation War"
 aievent.43.desc: ""
 aievent.43.a: "Forwards!"

 aievent.44.t: "Future of the Triumvirate"
 aievent.44.desc: ""
 aievent.44.a: "Join or die?"

 aievent.45.t: "Leader of the Triumvirate asks us to submit"
 aievent.45.desc: ""
 aievent.45.a: "Alright, we give up..."
 aievent.45.b: "Nonsense! To war!"

 aievent.46.t: "End of the Triumvirate War"
 aievent.46.desc: ""
 aievent.46.a: "Now we can build our future..."

 aievent.47.t: "jebać Argentynę"
 aievent.47.desc: ""
 aievent.47.a: "i Orbana"

