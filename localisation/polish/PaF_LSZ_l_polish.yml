 ## National Spirits ##
 LSZ_leszczynski_house: "Ród Leszczyńskich"
 LSZ_leszczynski_house_desc: "Leszno i otaczające je ziemie znajdują się pod rządami dynastii Leszczyńskich. Ród, którego początki sięgają XV wieku, miał zaszczyt dzierżyć koronę Rzeczypospolitej na głowie jednego ze swoich członków, choć tylko przez krótki czas i w wyjątkowo burzliwym okresie. Teraz dom Leszczyńskich rozpoczął drogę ku odzyskaniu należnej mu legitymacji i chwały, jaką powinno nieść nazwisko Leszczyńskich."
 LSZ_illegitimate_prince: "Nieprawy Hrabia"
 LSZ_illegitimate_prince_desc: "Obecny zwierzchnik rodu i władca Leszna cieszy się niewielką popularnością wśród swoich poddanych. Postrzegany bardziej jako szaleniec niż prawdziwy władca, zmaga się z brakiem legitymizacji swoich rządów. Przyszłość Leszna spowija mgła, podobnie jak jego własną. Hrabia musi zdecydowanie umocnić swoje panowanie, zanim księstwo wymknie mu się z rąk."
