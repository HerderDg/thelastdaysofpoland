 ##Events##

unification.157.t: "[GetNewspaper]Leszno jednoczy południową Wielkopolskę!"
unification.157.desc: "Po serii zwycięstw militarnych oraz zręcznych zabiegach dyplomatycznych dworskich ambasadorów, kolejne terytoria południowej Wielkopolski złożyły hołd Hrabiemu Leszczyńskiemu. Wraz z przechodzeniem coraz większej liczby ziem pod władzę rodu Leszczyńskich stało się jasne, że wywodzące się z Leszna Księstwo jest nowym regionalnym hegemonem. Królewski pałac Hrabiego, na co dzień niedostępny dla przeciętnego obywatela, otwiera swoje bramy, gdyż odbyć ma się wielki bal celebrujący dołączenie nowo mianowanych panów do szeregów leszczyńskiej szlachty. Jego osobista świta elitarnych rycerzy przyjmuje kolejnych szlachetnie urodzonych, a domena staje się coraz zamożniejsza. Wątpliwa legitymacja Wojciecha Edwarda I zdaje się stopniowo umacniać. Tylko czas pokaże, czy wokół Hrabiego zgromadzi się jeszcze więcej ludzi, gdy jego władza będzie rozciągać się na kolejne ziemie."
unification.157.a: "Niech żyje Hrabia!"
