 ## Events ##
  
unification.153.t: "[GetNewspaper]Naturschutzverein Wartheland jednoczy północną Wielkopolskę"
unification.153.desc: "Północne ziemie Wielkopolski ponownie zjednoczyły się pod niemieckimi rządami, tym razem jednak nie za sprawą potęgi Berlina, lecz pionierów Drugiej Ostsiedlung, którzy po Inwazji osiedlili się w dolinie Warty. Porzuceni po upadku Eurokomisariatów, pozostawieni na pastwę losu i skazani na szybką zagładę z rąk mściwych polskich watażków, osadnicy mimo wszystko zdołali obronić nową ojczyznę przed kilkoma lepiej wyszkolonymi i wyposażonymi przeciwnikami, prowadząc zaciekłą wojnę partyzancką i rozpaczliwie sięgając po przymusowy pobór.\nNaturschutzverein kontroluje teraz rozległe obszary zamieszkane przez zgorzkniałą i wrogo nastawioną polską ludność. Choć niemieckim osadnikom nie brakuje hartu ducha ani determinacji, dalsze przetrwanie państwa tej stosunkowo nielicznej mniejszości pozostaje dalekie od pewności."
unification.153.a: "Verdammt!"

super.153.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.153.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.153.a: "Wreszcie zjednoczeni."