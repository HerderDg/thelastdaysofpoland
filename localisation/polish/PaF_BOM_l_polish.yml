 ##Events##
unification.100.t: "[GetNewspaper]Wolna Armia Bombasu jednoczy Podlasie!"
unification.100.desc: "Major Suchodolski. Nazwisko, które niegdyś wzbudzało u wielu jedynie śmiech i drwiny, dziś odbija się echem szacunku i strachu po całym Podlasiu. Wolna Armia Bombasu pod jego dowództwem zdołała pokonać wszystkich rywali w regionie. Jak? Nikt nie ma do końca pojęcia. Jedni twierdzą, że to czysty fart, inni zaś, że wszystko za sprawą tajemniczych 'Nitrotripów', na które żołnierze Wolnej Armii rzekomo udają się przed bitwami, zyskując dzięki nim nienaturalną siłę i wytrzymałość. Niezależnie od przyczyny, Wolna Armia okazała się siłą nie do powstrzymania, rozbijając wszelki opór i ustanawiając kontrolę nad całym Podlasiem. Region spogląda teraz na Majora Suchodolskiego jak na swojego nowego przywódcę, licząc na stabilność i dobrobyt pod jego rządami. Och, jak bardzo się mylą. Nie wiedzą jeszcze, że Wojciech Suchodolski to po prostu naćpany szaleniec, który wykorzystuje swoją sławę do dowodzenia tą armią. I nie ma najmniejszego pojęcia, co się wokół niego dzieje."
unification.100.a: "Całe te, ugułem - Bombas!"

super.100.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.100.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.100.a: "Wreszcie zjednoczeni."