 ##Events##
 
unification.118.t: "[GetNewspaper]Komuna Wawra jednoczy Okręg Stołeczny!"
unification.118.desc: "Podczas gdy większość Polaków zaślepia żądza władzy i walczą oni wyłącznie po to, by narzucić narodowi własną wolę, wciąż są tacy, którzy dążą do czegoś większego. Drobni watażkowie wysyłają tysiące ludzi na bezsensowną śmierć, a ziemia, która przyjmuje ich zwłoki, sama umiera pod ich stopami. Co gorsza, niektórzy w kraju próbują przyspieszyć ten rozkład, nie zdając sobie sprawy, że w ten sposób sprowadzają na siebie zagładę. Być może jednak przyrodę da się jeszcze ocalić, ponieważ serce Polski - Okręg Stołeczny - znalazło się pod kontrolą sił ekologicznych z tajemniczej Komuny Wawra. Od chwili zajęcia Warszawa przechodzi gwałtowną przemianę: zamknięto fabryki, zakazano ruchu samochodowego, a osoby uznane za odpowiedzialne za niszczenie klimatu stawia się przed pokazowymi sądami. Choć nadrzędne cele tego państwa, a nawet prawdziwa tożsamość jego przywódcy, pozostają tajemnicą, jedno jest pewne - zielona milicja nie spocznie, póki wszyscy truciciele nie zostaną pociągnięci do odpowiedzialności."
unification.118.a: "Naszą planetę mogą ocalić tylko najbardziej radykalne rozwiązania"

super.118.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.118.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.118.a: "Wreszcie zjednoczeni."

