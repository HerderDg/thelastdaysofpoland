unification.53.t: "[GetNewspaper]Konsorcjum Piły jednoczy północną Wielkopolskę!"
unification.53.desc: "Wielkopolskę przeszywa dreszcz grozy, gdy powraca znajoma twarz, a żądza zemsty oplata go swoim zgubnym wpływem. Armia rzeźników i myśliwych, nikczemna i owładnięta żądzą krwi, sprowadziła terror i zniszczenie na północny region. Odwet Henryka Kani jest brutalny. Przeciwko tym, którzy wcześniej mu się sprzeciwiali, dopuszcza się niewyobrażalnych czynów, a na odpowiedzialnych za jego upadek czekają szczególne tortury. Dziesięć lat gniewu zostało uwolnionych naraz. Zwykłym ludziom nie żyje się jednak wiele lepiej. Pozbawieni niemal wszelkich praw i istniejący wyłącznie po to, by napędzać system, mogą jedynie mieć nadzieję, że gdy w polskich lasach zabraknie mięsa, myśliwi nie uczynią z nich swojego nowego towaru. Dziwnym trafem jednak po każdej bitwie wygranej przez konsorcjum i każdej z licznych egzekucji przeprowadzonych na jego wrogach mięso zawsze smakuje jakoś podejrzanie."
unification.53.a: "Nocą słychać krzyk lasów."

unification.152.t: "[GetNewspaper]Konsorcjum Piły jednoczy północną Wielkopolskę!"
unification.152.desc: "Szaleństwo Henryka Kani dobiegło końca. Choć nowy rząd północnej Wielkopolski nie skupia się bynajmniej na dobrobycie ludności i nadal pozostaje bezwzględnym, ledwie zawoalowanym reżimem korporatystycznym, mieszkańcy regionu mogą wreszcie odetchnąć z ulgą. Przynajmniej nie muszą już drżeć o własne życie. Na scenę wkracza Henryk Stokłosa, który niezależnie od skali swoich skorumpowanych interesów na zawsze pozostanie w pamięci mieszkańców jako wybawca, który obalił tyrana. Odpłacili mu za to z nawiązką, masowo zaciągając się do walki w rebelii nie tylko przeciwko siłom niemieckim, lecz także przeciwko licznym watażkom roszczącym sobie prawa do regionu. Wzmocnione tym poparciem siły Piły dotarły aż do stolicy województwa, Poznania, spacyfikowały metropolię i zdławiły wszelki bezpośredni opór. Wdzięczność ludu nie trwa jednak wiecznie, a jeśli Stokłosa nie zacznie realizować jego woli, wkrótce może stanąć w obliczu jego gniewu."
unification.152.a: "Tak właśnie kończą tyrani."

super.53.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.53.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.53.a: "Wreszcie zjednoczeni."

