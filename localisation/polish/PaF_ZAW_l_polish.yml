unification.203.t: "[GetNewspaper]Zawiercie jednoczy Zagłębie i Jurę!"
unification.203.desc: "Zachodnia Małopolska, niegdyś część bijącego serca polskiego przemysłu, rozpadła się na niezliczone, walczące ze sobą quasi-państewka. Ostatnio jednak na Wyżynie Krakowsko-Częstochowskiej pojawiła się siła zdolna zaprowadzić stabilność. Władze Zawiercia odłożyły na bok wzajemne animozje i zdobyły silną pozycję na sąsiednich terenach. Ziemie między Częstochową a średniowieczną stolicą Krakowem stanowią kolebkę tego, co w całym regionie zaczęto nazywać Jurajską Redutą. Państwo narodowe założone w Zawierciu jest obecnie poważnym kandydatem do zjednoczenia całego województwa małopolskiego. Pozostaje pytanie, czy gospodarka oparta na bogatych złożach surowców mineralnych i licznych zakładach przemysłu ciężkiego, pozostałych po czasach sprzed upadku, pozwoli Jurajskiemu Wałowi utrzymać regionalną dominację."
unification.203.a: "Jurajska Reduta stoi dumnie."