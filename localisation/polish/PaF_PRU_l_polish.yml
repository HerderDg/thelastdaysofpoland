POLITICS_OLA_TURKIEWICZ_DESC: "Ola Turkiewicz - wokalistka, kompozytorka, organizatorka festiwali, a od niedawna również przywódczyni neobałtyckiej drużyny wojennej, która przejęła kontrolę nad południem Mazur. Na jej decyzję o wykrojeniu państwa dla ludów bałtyckich wpłynęła przede wszystkim wiara w 'Restauracjonizm Pruski', nawołujący do odrodzenia licznych kultur wyniszczonych przez Krzyżaków i Polaków. \n\nChoć udało jej się wywalczyć własne państwo, najtrudniejsza próba dopiero się rozpoczęła, gdyż to na jej barkach spoczywa teraz zadanie stworzenia sprawnie funkcjonującego kraju opartego na tak kontrowersyjnej idei oraz obrony go przed najeźdźcami. Z pewnością cieszy się pełnym i bezwarunkowym poparciem Prusów, Jaćwingów, Warmiaków i Mazurów, ale czy te niewielkie, odizolowane społeczności liczące po kilka tysięcy osób wystarczą, by mogła przeciwstawić się ogromnemu sprzeciwowi polskich nacjonalistów? W rzeczywistości jej wrogami są nie tylko najbardziej zagorzali nacjonaliści - pomysł utworzenia niepolskiego państwa na polskiej ziemi nie cieszy się popularnością wśród... właściwie nikogo. \n\nGdy kurtyna pokojowego współistnienia powoli opada, Ola będzie musiała zmierzyć się z odpowiedzialnością za przeprowadzenie ludzi, których przysięgła chronić, przez nadchodzący chaos wojny. Jeśli poniesie porażkę, ludy bałtyckie mogą spotkać ten sam los, który spotkał je setki lat temu."


##Events##
unification.95.t: "[GetNewspaper]Pogańskie Prusy jednoczą Warmię i Mazury!"
unification.95.desc: "W północno-wschodniej Polsce doszło do dość nieoczekiwanego rozwoju wydarzeń, gdy (względnie) znanej artystce Oli Turkiewicz udało się skonsolidować swoje rządy nad terytoriami dawnego województwa warmińsko-mazurskiego.\nZnana ze swojego wieloletniego zainteresowania miejscową kulturą Turkiewicz otwarcie opowiada się za utworzeniem państwa pruskiego skupionego wokół kultur dawnych pogańskich społeczności zamieszkujących te ziemie przed ich podbojem przez Zakon Krzyżacki.\n\nNowo utworzone państwo wciąż pozostaje stosunkowo niestabilne, próbując zdobyć legitymizację wśród lokalnych społeczności, a jednocześnie nawołując do '§Ybałtyckiego odrodzenia§!', które miałoby rzekomo 'wymazać skutki polskich, niemieckich i rosyjskich grzechów popełnionych wobec pogańskich ludów Bałtyku'. \n\nChoć wielu nadal kwestionuje zasadność tego roszczenia do historycznej odpłaty, czy im się to podoba, czy nie, państwo to - przynajmniej na razie - pozostanie na swoim miejscu..."
unification.95.a: "Zemsta się dokonała!"


super.95.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.95.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.95.a: "Wreszcie zjednoczeni."
