 ##Characters##
POLITICS_MONIKA_JARUZELSKA_DESC: "Gdy o znaczeniu i pozycji człowieka decyduje samo jego nazwisko, czy jest mu pisane je ocalić, czy zhańbić? \n\nCóż można powiedzieć o Monice Jaruzelskiej, nie wspominając o słoniu w pokoju? Dziennikarka, ekspertka od mody, kontrowersyjna rozmówczyni - w Polsce nie brakuje takich osób. Nie umniejszając jej talentu, łatwo zrozumieć, dlaczego dawniej i dziś znajduje się w centrum uwagi. Ale czy naprawdę została przywódczynią rewolucyjnej armii tylko dlatego, że była córką swojego ojca? Rewolucja to nie scena komunistycznego reżimu, w którym dziedziczenie władzy jest w modzie. A może miała dość silną wolę, by udźwignąć brzemię pozostawione jej przez ojca, choć w najbardziej farsowy sposób? \n\nDziedzictwo, które uosabia Jaruzelska, należy do ostatniego etapu komunistycznego reżimu - tego, który, mówiąc bez ogródek, rozprawiał się z opozycją, utrzymywał system przy życiu tak długo, jak tylko się dało, i doprowadził do transformacji zadowalającej obie strony. Obiecuje przezwyciężenie kryzysu, zapewnienie stabilności i powrót do dobrych, starych czasów, a przy tym socjalizm spoglądający zza przyciemnionych okularów generała jest nieco bardziej pragmatyczny niż dogmatyczny. Mimo to do Żyrardowa ściągają rzesze żarliwych i radykalnych lewicowców, licząc, że postawili na socjalistyczną kandydatkę, która nie będzie zbyt pobłażliwa dla swoich przeciwników. Tymczasem Jaruzelska była niegdyś znana z sympatii do prawicowych oszołomów i wyrzutków, którym pozwalała swobodnie wypowiadać się w swoim programie. \n\nCzy zdoła utrzymać Czerwony Pułk w jedności? Czy postąpi zgodnie z sytuacją, w jaką wpędziła ją ta dziwaczna i okrutna pętla historii? Jej ojcu się to udało i być może właśnie dlatego to ona teraz rządzi."
