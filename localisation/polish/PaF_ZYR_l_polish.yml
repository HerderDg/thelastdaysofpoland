unification.114.t: "[GetNewspaper]Czerwony Regiment jednoczy Okręg Stołeczny!"
unification.114.desc: "Prześladowania mieszkańców Warszawy trwają. Milicja Ludowa przetacza się przez stolicę, tłumiąc ostatnie zarzewia oporu. Na czele czerwonej fali kroczy Towarzyszka Jaruzelska, córka kontrowersyjnego przywódcy komunistycznego Wojciecha Jaruzelskiego. Wkrótce po przejęciu władzy w regionie poszła w ślady ojca i wprowadziła stan wojenny, który ma utrzymać porządek w jej domenie aż do ponownego zjednoczenia Polski.\nChoć jej rządy wzorowane są na ostatnich latach Polskiej Rzeczypospolitej Ludowej, wielu lewicowych krytyków twierdzi, że odwołania Towarzyszki do \"starych, dobrych czasów\" komunizmu służą jedynie rozbudzaniu nostalgii wśród starszego pokolenia i radykalnej młodzieży. Niezależnie od tego, czy Jaruzelska jest komunistką, jedno pozostaje jasne - jej państwo przyniesie ze sobą żelazne rządy autokratki, niewiele różniące się od rządów jej prawicowych odpowiedników."
unification.114.a: "Jaki ojciec, taka córka."

super.114.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.114.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.114.a: "Wreszcie zjednoczeni."

