unification.164.t: "[GetNewspaper]The Wołomin Gang unifies the Capital District!"
unification.164.desc: "Warsaw has always been a battlefield - once for politicians, then for warring factions, now for gangsters. But the fight is supposedly over. The Wołomin Mafia has done what no politician could: they've united the Capital District under a single flag, even if it's a bloodstained one.\nOld, established gangs? Either buried or brought into the fold. The police? A memory. Any legitimate government? That's been gone since 2025. In their place, there is now a different kind of order. Extortion is now 'taxation,' rackets are 'businesses,' and disappearances of problematic individuals are 'justice.' Cynically, they call it stability.\nSome locals don't mind - better a mafia boss than a warlord, or even worse - a politician. The markets are open, the streets are patrolled, and the city runs on bribes instead of bullets. But for how long? Criminal empires don't fall at the ballot box, and in this new Warsaw, power is only as strong as the men willing to kill for it."
unification.164.a: "A warlord you can't refuse."

super.164.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.164.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.164.a: "Wreszcie zjednoczeni."

