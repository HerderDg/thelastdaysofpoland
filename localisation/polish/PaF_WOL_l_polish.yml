unification.164.t: "[GetNewspaper]Gang Wołomiński jednoczy Okręg Stołeczny!"
unification.164.desc: "Warszawa zawsze była polem bitwy - najpierw dla polityków, potem dla walczących ze sobą frakcji, a teraz dla gangsterów. Podobno jednak walka dobiegła końca. Mafia wołomińska dokonała tego, czego nie potrafił żaden polityk: zjednoczyła Okręg Stołeczny pod jednym sztandarem, choć splamionym krwią.\nStare, dobrze zakorzenione gangi? Albo pogrzebane, albo wchłonięte. Policja? To już tylko wspomnienie. Legalny rząd? Zniknął w 2025 roku. Na jego miejscu zapanował nowy rodzaj porządku. Wymuszenia stały się \"podatkami\", przekręty - \"biznesem\", a zniknięcia niewygodnych osób - \"sprawiedliwością\". Cynicznie nazywają to stabilnością.\nNiektórym mieszkańcom to nie przeszkadza - lepszy mafijny boss niż watażka, a nawet, co gorsza, polityk. Sklepy są otwarte, ulice patrolowane, a miasto działa dzięki łapówkom zamiast kul. Ale jak długo to potrwa? Przestępczych imperiów nie obala się przy urnach, a w tej nowej Warszawie władza jest tak silna, jak silni są ludzie gotowi za nią zabijać."
unification.164.a: "Watażka, któremu nie można odmówić."

super.164.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.164.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.164.a: "Wreszcie zjednoczeni."

