##Events## 
unification.213.t: "[GetNewspaper]WAT jednoczy Okręg Stołeczny!"
unification.213.desc: "Niedawno ogłoszono, że WAT, czyli Wojskowa Akademia Techniczna, proklamowała się jedyną władzą odpowiedzialną za zarządzanie Warszawskim Regionem Stołecznym. Na razie przypuszcza się, że obszar ten pozostanie pod półwojskową administracją kierowaną przez władze akademickie. Choć w czasach pokoju WAT nie należała do najbardziej znanych instytucji stolicy, po Upadku wielu uznało ją za jednego z najbardziej prawdopodobnych kandydatów do zdobycia przewagi w regionie. Technologiczna przewaga zapewniana przez zaplecze i ekspertów, a także znaczny zasób wyszkolonego personelu, okazały się kluczowe dla ustanowienia trwałej kontroli nad podzielonym miastem. Jeśli nowy reżim zdoła wykorzystać liczne atuty Warszawy - jej zasoby, położenie i gęstą sieć miejską - może stać się groźnym pretendentem w dalszej walce o zjednoczenie kraju. Niezależni obserwatorzy obawiają się, że dzięki nowej pozycji WAT będzie mogła wykorzystać swój potencjał technologiczny do granic możliwości, co może doprowadzić do eskalacji wciąż trwającego konfliktu poprzez rozpowszechnienie nowoczesnego uzbrojenia."
unification.213.a: "Nikt nie trwa wiecznie."