unification.192.t: "[GetNewspaper]Wolna Armia Mazurska jednoczy województwo mazurskie!"
unification.192.desc: "Województwo warmińsko-mazurskie zostało zjednoczone pod sztandarem Wolnej Marynarki Mazurskiej, rozpoczynając nową erę regionalnej tożsamości - choć niekoniecznie prawa morskiego. Uroczystości rozciągnęły się od Olsztyna po Giżycko, gdy urzędnicy, rybacy i marynarze przyjęli nowo odkrytą morską sprawę, gotowi kształtować przyszłość swoich rozległych wód śródlądowych. Z połyskującymi jeziorami jako swoją domeną i zdeterminowaną flotą w gotowości WMM obiera śmiały kurs ku przyszłości.\nOddana obronie lokalnych wód, zachowaniu tradycji żeglarskich i egzekwowaniu surowego - choć narzuconego przez samą siebie - porządku, zwłaszcza w kwestii etykiety korzystania z rowerów wodnych, z dumą wznosi swój sztandar. Choć pozbawiona dostępu do morza, Wolna Marynarka Mazurska żegluje naprzód z ambicją, jednością i niezachwianą wiarą w swoje morskie przeznaczenie."
unification.192.a: "Ciepła krew poleje się strugami!"


