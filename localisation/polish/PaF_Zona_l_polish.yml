Zona_desc: "§HStare Bałuty. 13 czerwca 2025 roku.§! \n\n§WGrażyna wraz z mężem zajadają kotlety mielone i oglądają Familiadę, gdy nagle - oni, ich obiad, ich blok oraz cała okolica zostają zmiecione z powierzchni Ziemi, gdy nad większą częścią województwa łódzkiego wschodzi drugie słońce, doprowadzając już konającą Polskę do całkowitego rozpadu i dając początek kierowanej przez Niemcy interwencji UE, mającej przywrócić krajowi kontrolę nad samym sobą.§! \n\n...Kiedyś mieszkało tu 50 000 ludzi.\nTeraz to miasto duchów."

BBW_Zona_desc: "Bałuty, ropiejąca blizna na obliczu Polski, na obliczu świata, są dziś bezpiecznie odizolowane za murami Sarkofagu. Niektórzy mogą twierdzić, że słyszą odgłosy dobiegające zza tych przeklętych ścian, lecz nigdy nie odważyliby się nikogo o to zapytać. Samotnie przed jedyną bramą prowadzącą do środka stoi okazały pomnik, wykonany z marmuru i kutego metalu. Dumnie, z niewzruszoną twarzą, Tomasz Sommer stoi pośród górników, opłakując kataklizm, tak jak obywatele opłakiwali jego odejście. \n\nOby nigdy więcej nie doszło tu ani nigdzie indziej na świecie do Nuklearnego Holokaustu."

Bieszczady_desc: "§WAchhh... piękne Bieszczady - niezwykle malowniczy i słabo zaludniony region, niemal całkowicie pozbawiony infrastruktury i zorganizowanej władzy. \n\nWiększość miejscowej ludności uciekła za granicę, na Słowację i Ukrainę, a ich domy i gospodarstwa przejmują dziś dzikie zwierzęta - nowi władcy tego opuszczonego regionu. Grupy patrolowe z Krosna, Leska i Przemyśla często próbują zapuszczać się na ich terytorium, tylko po to, by wracać do domu z workami zawierającymi zwłoki swoich towarzyszy rozszarpanych przez niedźwiedzie i wilki.§! \n\n§HI tak właśnie powoli toczy się życie tutaj, w Bieszczadach.§!"

Germany_desc: "§WNiemcy wiszą na szubienicznym sznurze represji, a marzenie o zjednoczonej Europie roztrzaskało się na setki drobnych kawałków. Krew walczących ze sobą państewek plami czerń i żółć nierównymi plamami czerwieni, a naród pogrąża się coraz głębiej w katastrofie jeszcze większej niż ta, w którą wcześniej wepchnął swojego wschodniego sąsiada.\nSzare chmury dymu unoszą się nad miastami pustoszonymi przez ludność przemienioną w oszalałych szabrowników i jeszcze gorsze rzeczy. Uchodźcy opowiadają historie o bandytach i radykałach przejmujących każdy skrawek ziemi, jaki tylko można wyrwać z trupa upadłego rządu.\nZapętlony Deutschlandlied nadawany przez państwowe radio pozostaje jedynym przypomnieniem o blisko półwieczu, przez które zjednoczone Niemcy doznawały pokoju.§!"

baluty_question_category: "Kwestia Bałut"
baluty_question_category_desc: "Pustkowie górujące za centrum Łodzi wciąż nawiedza i napromieniowuje mieszkańców miasta, prowadząc do niezliczonych diagnoz nowotworowych oraz zapewniając schronienie niewyobrażalnie szemranemu czarnemu rynkowi, który tylko dalej się rozrasta i rozwija. \n\nNo dalej, musimy coś zrobić z tym gnijącym pustkowiem...\n"

