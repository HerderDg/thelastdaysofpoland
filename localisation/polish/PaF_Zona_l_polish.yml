baluty_bbw.1.t: "Projekt 'Sarkofag'"
baluty_bbw.1.desc: "Ta Strefa Wykluczenia, choć stanowi ponure przypomnienie atomowego holokaustu sprowadzonego przez fanatyczną fascynację rozszczepianiem atomu (a przynajmniej tak powiedziałby Starszy), nigdy tak naprawdę nie pozostaje opuszczona. Męty, stalkerzy, handlarze lekami antyradiacyjnymi - wszyscy zlatują się do tego miejsca jak muchy do gówna. Okazuje się, że jedyną rzeczą, której Bractwo nienawidzi bardziej od energii atomowej, jest terytorium pogrążone w chaosie. Projekt Sarkofag miał dwojaki cel: nie tylko służyć jako pomnik, lecz także ograniczyć emisję promieniowania na tyle, by można było rozpocząć wydobycie surowców. \n\nZespół ANT1 wyruszył jako pierwszy: odważni inżynierowie i zwiadowcy wojskowi, wszyscy odpowiednio wyposażeni, by rozprawić się z każdym bandytą czy anarchistą desperacko próbującym dorobić się fortuny w Strefie Wykluczenia. Ich cel był prosty: zbadać teren w ramach przygotowań do wydobycia. Skoro Sarkofag ograniczał poziom promieniowania, istniała całkiem spora szansa, że wrócą do domu w jednym kawałku."
baluty_bbw.1.a: "Ich dusze z pewnością by to doceniły."


baluty_bbw.2.t: "Ciekawe znalezisko"
baluty_bbw.2.desc: "Przeczesaliśmy Strefę z dokładnością godną szwajcarskiego zegarka, wchodząc w kontakt z miejscowymi przy dziesięciu różnych okazjach: sześcioma uzbrojonymi bandami rabusiów i czterema niezrzeszonymi grupami, z których żadna nie stanowiła realnego zagrożenia dla dobrze wyszkolonego zespołu żołnierzy. Zero strat po naszej stronie. \n\n...I również zero wartościowych łupów. Badanie Strefy nie wykazało obecności żadnych znanych zasobów naturalnych: ani węgla jakiegokolwiek gatunku, ani żelaza, ani żadnych rzadszych minerałów. Znaleźliśmy jednak coś znacznie ciekawszego niż nawet potencjalne odkrycie węgla - wydobyto zupełnie nowy rodzaj rudy, który według przypuszczeń może być produktem ubocznym promieniowania! \n\nZachowując wszelkie środki ostrożności, próbki rudy zostały starannie zapakowane i dostarczone do naszych najlepszych laboratoriów w celu przeprowadzenia badań. Choć zdecydowanie nie jest to żaden rodzaj węgla, nadal z niecierpliwością czekamy na odkrycie jego właściwości - jeśli z powodów ideologicznych nie będzie można wykorzystać go do produkcji energii, ten nowy materiał nadal może znaleźć zastosowanie militarne, podobnie jak pozwalamy sobie korzystać z amunicji zawierającej zubożony uran. Właściwie zubożony uran jest najbliższym znanym nam materiałem, z którym można go porównać na podstawie wstępnych oględzin. W załączniku znajdują się dokładne pomiary geometryczne dla każdego kwadrantu Strefy."
baluty_bbw.2.a: "Zgłosić do zespołu ANT1"

