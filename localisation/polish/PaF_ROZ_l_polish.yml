super.195.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.195.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.195.a: "Wreszcie zjednoczeni."
 
unification.195.t: "[GetNewspaper]Rozbrat jednoczy północną Wielkopolskę!"
unification.195.desc: "To, co niegdyś było wielką metropolią zachodniej Polski sprzed wojny, rozpadło się na państewka watażków wielkości pojedynczych dzielnic, walczących o dominację. Po zwycięstwie w krwawej walce o władzę w Poznaniu gangi Rozbratu przejęły kontrolę nad całym miastem, a także rozległymi obszarami Wielkopolski. Mieszkańcy metropolii mogą wreszcie odetchnąć z ulgą. Po obaleniu przedwojennego prezydenta i powstrzymaniu korporacyjnych machinacji Żabki Poznań stał się ostoją anarchistycznej wolności. Gangi zaczęły teraz konsolidować swoje siły, by odeprzeć, a miejmy nadzieję także obalić despotycznych watażków spoza Wielkopolski, których do głębi oburzyło zakorzenienie się idei poznańskiej wolności. Dopiero się okaże, czy społeczeństwo anarchistycznych wspólnot zdoła oprzeć się presji autorytarnych sąsiadów."
unification.195.a: "Rozbrat nie jest na sprzedaż."

