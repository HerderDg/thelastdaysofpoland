unification.137.t: "[GetNewspaper]Nowa Huta jednoczy Małopolskę!"
unification.137.desc: "Zniszczenia i chaos, które Upadek sprowadził na ludność, zmusiły nawet najbardziej zaciekłych rywali do połączenia sił, by przetrwać rzeź. Chyba żaden rząd nie uosabia tego zjawiska lepiej niż Triumwirat Nowej Huty - luźna konfederacja chuliganów należących do głównych krakowskich klubów. Choć na co dzień ci ultrasi skoczyliby sobie do gardeł, nie mieli innego wyjścia, jak tylko współpracować, aż w końcu zjednoczyli Małopolskę dzięki bezwzględnej brutalności. Mieszkańcy regionu wciąż nie mogą otrząsnąć się z szoku na widok nowych panów. Zamiast porządku panuje bezprawie, a rozwścieczone bandy chuliganów terroryzują ludność i zabierają bezbronnym obywatelom wszystko, na co tylko mają ochotę. Dawne urazy zaczynają jednak odżywać, prowadząc do narastających napięć i starć między ekipami, przez co przyszłość Triumwiratu staje pod znakiem zapytania. Z każdym kolejnym dniem rozpadowi tego sojuszu jest coraz bliżej. Być może pewnego dnia pozostanie po nim jedynie wspomnienie przejściowego koszmaru."
unification.137.a: "Sojusze z konieczności rzadko bywają trwałe"

super.137.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
super.137.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
super.137.a: "Wreszcie zjednoczeni."

