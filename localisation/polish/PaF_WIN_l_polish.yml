unification.70.t: "[GetNewspaper]Hedonistyczna Republika Winnegogrodu jednoczy Lubuskie!"
unification.70.desc: "Województwo lubuskie od dawna było miejscem raczej zapomnianym przez resztę polskiego społeczeństwa. Dzisiejsze wieści pozostaną jednak na ustach ludzi jeszcze przez długi czas - zwłaszcza pracowników Ministerstwa Rolnictwa i tych, którzy cenią sobie bardziej wyszukane przyjemności. \n\nHedonistyczna Republika Winnegogrodu - jak wspólna klika rady miejskiej Zielonej Góry i lubuskich winiarzy postanowiła się nazwać - ogłosiła całkowity podbój dawnego województwa. Na nowo zdobytych ziemiach aspirujący producenci alkoholu, sutenerzy i właściciele innych... kontrowersyjnych przedsięwzięć świętują, ponieważ ich interesy doskonale odnajdują się w tej na wpół anarchicznej republice. Kilka wpływowych instytucji kultury i znanych sommelierów z całej Europy wyraziło wdzięczność nowemu państwu, chwaląc jego wysiłki na rzecz zachowania polskiego winiarstwa."
unification.70.a: "Na następnej stronie: BYŁY PIOSENKARZ POTĘPIA NOWO POWSTAŁĄ REPUBLIKĘ? Wiadomości z Jasła."

unificationreg.70.t: "[GetNewspaper]Hedonistyczna Republika Winnegogrodu podbija Dolny Śląsk!"
unificationreg.70.desc: "Młoda zarówno wiekiem, jak i duchem Hedonistyczna Republika Winnegogrodu - a właściwie Śląska - nie wykazuje oznak, by miała przerwać swój napędzany narkotykami i winem marsz wzdłuż Odry. Ostatnie punkty oporu na Dolnym Śląsku, pozostałe po rządach Eurokomisariatu, albo się poddają, albo uciekają do Czech, pozostawiając Winnygród jedyną siłą kontrolującą ziemie województwa. \n\nWiększość mieszkańców regionu będzie musiała siłą przywyknąć do publicznych pokazów anarchii i hedonizmu, z których republika jest tak dumna. Ci jednak, którzy lepiej odnajdują się w życiu pełnym picia i śpiewu - Romowie z Legnicy i Jawora oraz alkoholicy z Zagłębia Wałbrzyskiego - podobno już otwarcie świętują zwycięstwo republiki na ulicach, biesiadują z żołnierzami Winnegogrodu i wysyłają do lubuskich winiarzy koślawo napisane listy, dziękując im za interwencję i życząc powodzenia w szerzeniu ich rzemiosła na Dolnym Śląsku."
#unificationreg.70.a: "Zrobili to dla winorośli"
unificationreg.70.a: "Mam wrażenie, że do dzisiejszej kolacji pasowałoby jakieś wytrawne białe."

unificationsupreg.70.t: "[GetNewspaper]Hedonistyczna Republika jednoczy cały Śląsk!"
unificationsupreg.70.desc: "Choć armie Górnego Śląska były znacznie trzeźwiejsze i lepiej zorganizowane, nie zdołały powstrzymać radosnych ochotników Hedonistycznej Republiki. Dziś ograniczony i w dużej mierze nieistniejący rząd tego państwa zebrał się, by publicznie ogłosić całkowite zjednoczenie historycznego regionu Śląska. \n\nNa podbitych ziemiach wybuchła fala świętowania. Zwycięscy żołnierze spędzali dzień, przedawkowując w przydrożnych rowach i rozbijając czołgi o przypadkowe budynki, podczas gdy tysiące mieszkańców otwierały przemycane i podrabiane butelki szampana. Wszyscy gromadzili się, by uczcić rozprzestrzenienie się chwalebnej libertyńskiej kultury i prawa Republiki, upajając się nowo odkrytą wolnością...\n\n...i rozmaitymi innymi narkotykami."
unificationsupreg.70.a: "Hałdy pokopalniane będą świetną ziemią pod winnice!... Chyba."

super.70.t: "[GetNewspaper]Polska - zjednoczona w ekstazie"
super.70.desc: "Dzisiejsze wydarzenia wprawiły rządy na całym świecie w osłupienie. Nie potrafią zdecydować, czy państwo obejmujące teraz całe terytorium Polski należy traktować jako prawdziwy, uznawany na arenie międzynarodowej kraj, czy jako kolejną bandę anarchistycznych nowicjuszy, skazanych na rychłą klęskę z rąk innych grup watażków. Zarówno zagraniczne media, jak i sami Polacy zgodnie ogłaszają jednak jedno: \n\nPolska wojna domowa wreszcie dobiegła końca. Świadczą o tym miliony ludzi zgromadzonych na ulicach, zjednoczonych w świętowaniu, tańczących i pijących, przyodzianych w winorośle i szaty. Rada Hedonistycznej Republiki Polski - bo tak nazywa się nowy, w dużej mierze nieformalny i właściwie nieistniejący \"rząd\" kraju - ogłosiła, że rozpoczął się pierwszy dzień \"Wiecznych Bachanaliów\", które odtąd mają na zawsze ogarnąć naród ekstazą i pozytywnymi emocjami, jednocząc go duchowo."
super.70.a: "Zaraz, myślałem, że Polacy wolą piwo od wina."



























