 ##Events##
 unification.170.t: "[GetNewspaper]Kościół Mariawicki jednoczy północne Mazowsze!"
 unification.170.desc: "W Płocku, przed nowo odzyskaną Świątynią Miłosierdzia i Miłości, arcybiskup Maria Jan Opala wygłosił przemówienie, uspokajając ludność, deklarując pokojowe zamiary i przybliżając szerszemu gronu tajemniczą doktrynę mariawicką. Zanim mariawici zjednoczyli północną część województwa mazowieckiego, przez długi czas byli wypędzeni ze swojej głównej katedry w Płocku. Okopali się na ziemi niczyjej między stolicą książąt mazowieckich a miastami Płońsk i Sochaczew. Wkrótce ich ściśle polskie dziedzictwo, pieśni religijne oparte na znanych marszach patriotycznych oraz przywiązanie do jałmużny zjednały im znaczną popularność. Wszystkie te czynniki, w połączeniu z biernością hierarchów rzymskokatolickich wobec nadużyć Morawieckiego i Obajtka, pozwoliły mariawitom odnieść zwycięstwo. Czy zachowają swój nieagresywny charakter? A może dotychczas marginalne głosy wzywające do przyjęcia bardziej wojowniczej postawy w końcu dojdą do głosu?"
 unification.170.a: "'Nie rzucim dzieła!'"
 
 super.170.t: "[GetNewspaper][FROM.GetName] jednoczy Polskę!"
 super.170.desc: "Minęły lata od upadku państwa polskiego, lecz idea Polski nigdy nie zginęła całkowicie. Nasz lider, [FROM.GetLeader] wraz z rządem pokazali, że zjednoczenie w ciągu jednego pokolenia nie jest odległym marzeniem, lecz osiągalną rzeczywistością. Pomimo przeciwności, stojąc w obliczu wrogów zewsząd - wewnątrz i poza granicami - [FROM.GetName] stoi prawdziwie zjednoczone, przekształcając naród Polski i jego różnorodnych obywateli w monolit, dowodząc, że zaufanie, jakim obdarzyli przywództwo i idee rządu, nie było błędem. Blizny konfliktu potrzebują czasu, by się zabliźnić, ale jedność wykuta w ogniu wojny daje nadzieję na przyszłość. Gdy słońce wschodzi nad ziemią, [FROM.GetName] patrzy w przyszłość z dumą i podniesionymi głowami, przechodząc ostateczną próbę wojny domowej."
 super.170.a: "Wreszcie zjednoczeni."

