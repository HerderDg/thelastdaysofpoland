l_english:

 aievent_paths.1.t: "Elections in Silesia"
 aievent_paths.1.desc: "The struggle for Silesia is over, but the struggle over what Silesia should become has only begun. The Silesian National Council remains the one institution capable of holding the region together, yet its members agree on little beyond the need for unity. The Council's left wing calls for social guarantees, workers' participation and a government built through compromise. Its hardliners argue that the new state will not survive without discipline, central authority and a firm response to every threat from Gorols. The time for uneasy cooperation has passed. Silesia must decide which side of the Council will define its future."
 aievent_paths.1.a: "Silesian National Council - Left"
 aievent_paths.1.b: "Silesian National Council - Hardline"

 aievent_paths.2.t: "Future of Sosnowiec"
 aievent_paths.2.desc: "Czarzasty's rule gave Sosnowiec stability when stability was a rare commodity, but no leader can govern forever. With the question of succession now impossible to postpone, two candidates have emerged from within the movement. Anna Maria Żukowska promises ideological discipline, a powerful party apparatus and a return to uncompromising Leninist principles. Łukasz Litewka offers a more flexible socialism, adapted to modern realities and open to gradual reform. Both claim to be the rightful continuation of Czarzasty's work. Only one of them, however, can determine what the red future of Sosnowiec will actually look like."
 aievent_paths.2.a: "Żukowska - Orthodox Leninist Path"
 aievent_paths.2.b: "Litewka - Reformed Socialist Path"

 aievent_paths.3.t: "In Excelsis Deo"
 aievent_paths.3.desc: "Clarus Mons has survived siege, famine and the collapse of every worldly authority around it. Its walls now shelter not only pilgrims and clergy, but an entire state built in the shadow of the monastery. As the immediate danger recedes, the alliance of religious orders begins to fracture. The Pauline Fathers claim the right to rule the sanctuary they have guarded for centuries. The Joannites offer discipline, charity and service to the weak. A militant faction within the Paulines believes that mere defence is no longer enough and calls for a crusade against the enemies of the faith. One order must now lead the holy city."
 aievent_paths.3.a: "Solus cum Deo solo (Pauline Fathers)"
 aievent_paths.3.b: "Tuitio Fidei et obsequium pauperum (Joannites)"
 aievent_paths.3.c: "DEUS VULT (Pauline Fathers-Crusaders)"

 aievent_paths.4.t: "Election Time"
 aievent_paths.4.desc: "Years of war, defections and political purges have reduced the once-crowded field of parties to two organizations still capable of governing. The Agreement Party promises negotiation, cautious reconstruction and a state held together by compromise between competing interests. United Poland offers a harsher answer: ideological certainty, centralized authority and no patience for those who would obstruct the rebirth of the country. Neither choice inspires universal enthusiasm, but postponing the decision would only deepen the paralysis of the administration. These are the options that history has left us. The people must choose carefully, because there may not be another election for a very long time."
 aievent_paths.4.a: "Agreement Party"
 aievent_paths.4.b: "United Poland"

 aievent_paths.5.t: "Silesian Elections"
 aievent_paths.5.desc: "The old political divisions of Silesia did not survive the Fall intact. Parties split, ideologies mutated and a generation raised amid technological ruin began proposing answers that would once have belonged to science fiction. Three movements now dominate the election. The posthumanists of the Civic Coalition want to overcome the limitations of both man and state. The Network Capitalists envision society as a web of contracts, platforms and private systems. The Utopia Faction of the Agreement Party insists that an ideal social order can still be deliberately constructed. These are not standard electoral choices. If the voters are confused, they are certainly not alone."
 aievent_paths.5.a: "Civic Coalition - Posthumanists"
 aievent_paths.5.b: "Libertarian Coalition - Network Capitalists"
 aievent_paths.5.c: "Agreement Party - Utopia Faction"

 aievent_paths.6.t: "Belarusian Regime Future"
 aievent_paths.6.desc: "Alexander Lukashenka has found himself at a crossroads in the strangest of places - Podlachia. He still possesses loyal officials, experienced security men and an instinct for political survival, but this is not Belarus. The local population has its own loyalties, the old institutions are gone and commands issued in the familiar tone no longer carry the same weight. Some advisers demand an immediate crackdown before opposition can organize. Others suggest something almost revolutionary by Lukashenka's standards: concessions, public generosity and an attempt to make the people genuinely accept his rule. The regime must decide whether to rely on the old methods or discover an entirely new kind of authority."
 aievent_paths.6.a: "Of course the old ways - crackdown!"
 aievent_paths.6.b: "Maybe we could try...being nice?"

 aievent_paths.7.t: "Bydgoszcz Election of [GetYear]"
 aievent_paths.7.desc: "Bydgoszcz has done what many believed impossible and brought Kuyavia-Pomerania under a single authority. Yet a coalition assembled for conquest is not necessarily prepared for peace, and the leadership of the new state remains unsettled. The Bydgoszcz Coalition points to its municipal experience and claims that those who achieved unification deserve to oversee reconstruction. Law and Justice (or whatever this parody is) calls for a stronger, more centralized government rooted in the traditions of the old Republic. Sacre Coeur offers a political order built around faith, duty to the nation and moral renewal. The war has decided the borders of the new entity. The ballot will decide its character."
 aievent_paths.7.a: "Bydgoszcz Coalition"
 aievent_paths.7.b: "Law and Justice"
 aievent_paths.7.c: "Sacre Coeur"

 aievent_paths.8.t: "Future of Womankind"
 aievent_paths.8.desc: "The struggle for the soul of Polish feminism continues long after the institutions against which it once fought have collapsed. Victory over the old order has not produced unity; instead, it has opened the way for radically different visions of womankind's future. The New Amazons demand an explicit matriarchate, defended by strength and organized around female authority. The technofeminists seek liberation through science, automation and the rejection of inherited ideological labels. The advocates of Rainbow Capitalism believe that corporate power can be turned into an instrument of representation - provided that men are kept far away from it. One movement must now define the revolution."
 aievent_paths.8.a: "Matriarchate of the New Amazons"
 aievent_paths.8.b: "Post-Ideological Technofeminism"
 aievent_paths.8.c: "Misandrist Rainbow Capitalism"

 aievent_paths.9.t: "Coup of the King"
 aievent_paths.9.desc: "For weeks, rumours spread through the tunnels and workers' estates of Nowa Huta: a king had arisen from the smog, a ruler promised by fire, steel and the poisoned earth itself. Most dismissed the stories until armed followers bearing the dragon's sign emerged from beneath the city. They seized furnaces, depots and government buildings while the factions of the Triumvirate fought one another in the streets. By dawn, the old authorities had vanished and the stranger sat at the centre of a new court. He calls himself Krak III. Nobody knows where he came from, but Nowa Huta already belongs to him."
 aievent_paths.9.a: "Who is he?"

 aievent_paths.10.t: "First Imamate Election"
 aievent_paths.10.desc: "The Imamate of Podlachia was born from necessity, uniting scattered Muslim communities behind a single authority during the worst years of chaos. With survival no longer the only question, the first election must determine what this state is meant to become. The Muslim Union advocates stable institutions and cooperation between the many peoples of Podlachia. The Muslim League calls for a more assertive religious and political identity. The White Horde looks beyond settled politics altogether, drawing inspiration from the riders and conquerors of the steppe. Each faction claims that it alone can preserve the community. The faithful must decide which vision will guide the Imamate."
 aievent_paths.10.a: "Muslim Union"
 aievent_paths.10.b: "Muslim League"
 aievent_paths.10.c: "White Horde"

 aievent_paths.11.t: "Camp of National Unity Election"
 aievent_paths.11.desc: "Like its namesake in the old Second Polish Republic, the Camp of National Unity has emerged as the dominant political force of the region. Its promise of order gathered conservatives, patriots, soldiers and officials beneath one banner, but success has exposed the differences between them. The Nonpartisan Bloc for Cooperation with the Government wants a broad political camp capable of incorporating local elites and governing through managed consensus. The Executive of National Unity argues that such looseness invites weakness and demands a disciplined organization directed from the centre. The Camp has defeated its rivals. It must now decide whether national unity will be a coalition or a command."
 aievent_paths.11.a: "Nonpartisan Bloc for Cooperation with the Government"
 aievent_paths.11.b: "Executive of National Unity"

 aievent_paths.12.t: "First Free Holy Cross Election"
 aievent_paths.12.desc: "The Holy Cross region has finally been reunited beneath a government that claims to represent its people rather than another passing army. Roads are reopening, local councils are assembling and the first free election can at last be held. The Polish Republican Party promises a firm state founded upon civic duty and republican traditions. The Civic Coalition advocates pluralism, local government and the restoration of democratic institutions. The Effective Party has little patience for old labels and insists that competence, direct democracy and visible results matter more than ideology. All three offer reconstruction, but each understands freedom differently. The voters must decide what kind of republic will rise in Holy Cross."
 aievent_paths.12.a: "Polish Republican Party"
 aievent_paths.12.b: "Civic Coalition"
 aievent_paths.12.c: "Effective Party"

 aievent_paths.13.t: "Brotherly Dilemma"
 aievent_paths.13.desc: "The Golec Brothers have become masters of the mountains from Cieszyn Silesia to Gorlice, binding valleys and highland communities together through music, charisma and a surprising amount of armed force. Their victories concealed a growing disagreement over what should follow. One brother looks backward, convinced that the highlanders must defend tradition by tearing down the corrupt remnants of the modern world. The other looks ahead and argues that survival requires roads, workshops, schools and an economy capable of supporting more than war bands. They have always performed together, but a country cannot follow two rhythms at once. One vision must become the programme of the mountains."
 aievent_paths.13.a: "Tradition! Raze them to the ground!"
 aievent_paths.13.b: "We need to start building our future!"

 aievent_paths.14.t: "Gypsies of Silesia"
 aievent_paths.14.desc: "Roma caravans cross the roads of Silesia once again, moving between ruined cities, mining settlements and communities that alternately welcome and fear them. Mobility has preserved their independence, but it has also left them without secure territory or a single voice in the politics of the new world. Some insist that freedom lies precisely in refusing borders, permanent institutions and the authority of outsiders. Others believe that the caravans must unite around a king who can defend their rights, negotiate with neighbouring rulers and give the scattered community a common purpose. The road has carried them this far. Now they must decide whether to keep wandering or build a realm of their own."
 aievent_paths.14.a: "We'll roam free!"
 aievent_paths.14.b: "We need a king!"

 aievent_paths.15.t: "Future of a New Chrysanthemum Throne"
 aievent_paths.15.desc: "The Okamura Shogunate has established itself in Silesia through a peculiar combination of military discipline, political theatre and an understanding of Japan assembled from fragments of old media. What began as an eccentric war band now governs real towns and thousands of subjects. The court is divided over what comes next. One faction demands that the transformation be completed: the throne exalted, the state militarized and every citizen taught to serve a new imperial destiny. The other has begun to suspect that the Shogunate may have misunderstood several important things along the way. Silesia awaits a proclamation, even if nobody is entirely sure in what language it should be delivered."
 aievent_paths.15.a: "Tenno heika, Banzai!"
 aievent_paths.15.b: "Nani?!"

 aievent_paths.16.t: "Avant-Garde Elections"
 aievent_paths.16.desc: "The Capital District has never lacked self-proclaimed visionaries, but two names now stand above the rest. Paweł Tanajno asks the people to continue the political experiment he began, combining entrepreneurial energy, civic mobilization and a permanent revolt against established institutions. Bartosz Walaszek offers something entirely different: a government shaped by irreverence, popular culture and the conviction that absurdity may be the only honest response to the world after the Fall. Both candidates promise to keep the capital in the avant-garde, though they disagree on where that avant-garde is actually going. The voters must choose who will turn provocation into state policy."
 aievent_paths.16.a: "Tanajno"
 aievent_paths.16.b: "Walaszek"

 aievent_paths.17.t: "Future of the Eurokommissar"
 aievent_paths.17.desc: "Grzegorz Schetyna presided over the formation of the Eurokommissariat and led it through the most devastating years of its existence. His patience, connections and talent for surviving internal conflict kept the administration alive, but mere survival is no longer enough. Loyalists insist that he deserves the confidence of the state he helped create. Officers of the Eurocorps argue that civilian hesitation nearly brought disaster and that only the military can guarantee security. Reformers believe that the entire system must be opened, modernized and stripped of its emergency habits. Schetyna's record is inseparable from that of the Eurokommissariat. Now both must face judgement."
 aievent_paths.17.a: "Have some faith!"
 aievent_paths.17.b: "Eurocorps seize power!"
 aievent_paths.17.c: "Time for the reforms"

 aievent_paths.18.t: "Future of the Eurokommissar"
 aievent_paths.18.desc: "Donald Tusk presided over the formation of the Eurokommissariat and endured the most devastating years of its existence. Unlike so many others, he eventually turned the tide, restoring trade, administration and a measure of prosperity to the territories under his command. Success, however, has revived a question that crisis allowed everyone to ignore: what is the Eurokommissariat ultimately loyal to? Polish officials demand that it return fully to the national cause. German partners expect gratitude and a durable western alignment. Committed Europeans insist that both choices are too narrow and that the state should become the nucleus of a renewed continental project. Tusk must finally declare where he belongs."
 aievent_paths.18.a: "Dla Polski!"
 aievent_paths.18.b: "Für Deutschland!"
 aievent_paths.18.c: "For Europe!"

 aievent_paths.19.t: "Turmoil in Carpathia"
 aievent_paths.19.desc: "The mountains are restless, and so are the people of Carpathia. Unification has ended the petty border wars, but it has not answered who can speak for the highlanders or how their land should be governed. Sebastian Pitoń offers personal leadership rooted in local defiance and the promise that Carpathia will bow to no outside authority. The right wing of TOKP seeks order, tradition and a strong defence of regional identity. Its left wing argues that the mountain communities can survive only through acceleration, social revolution and rejection of all known norms. The passes are secure for now. The future of the people who guard them remains undecided."
 aievent_paths.19.a: "Pitoń will secure our future"
 aievent_paths.19.b: "TOKP - Right Wing"
 aievent_paths.19.c: "TOKP - Left Wing..."

 aievent_paths.20.t: "War in the Wolfpack - Outcome"
 aievent_paths.20.desc: "The war for West Pomerania was never merely a struggle against the Germanic invaders. Behind the common front, the factions of the Comrades fought their own vicious contest for weapons, recruits and control over the revolution. Now the invaders have been driven back and the battlefield has fallen silent, but the internal war can no longer be concealed. The most bloodthirsty radicals demand a final reckoning with every rival. The Wolfpack claims victory and the right to rule through strength. A third faction believes survival depends upon abandoning local ambitions and turning toward Russia. The dust has settled, and there can be only one winner."
 aievent_paths.20.a: "RIP THEIR HEARTS OUT!"
 aievent_paths.20.b: "Wolfpack reigns supreme!"
 aievent_paths.20.c: "Turn to Russia"

 aievent_paths.21.t: "Future of Junta"
 aievent_paths.21.desc: "The military seized power in Zagłębie and Jura as an emergency measure, promising to restore order and return authority once the region was secure. Security has arrived, but the barracks show no sign of emptying. The Territorial Defence Forces propose a state rooted in local units, civilian cooperation and permanent readiness. Admirers of ancient Sparta demand that society itself be reorganized around discipline, sacrifice and military virtue. The Commando Clique trusts neither mass participation nor old institutions and wants power concentrated in the hands of a proven elite. The officers must decide whether they are guardians of the new order or its permanent masters."
 aievent_paths.21.a: "Territorial Defence Forces"
 aievent_paths.21.b: "This is...Sparta?"
 aievent_paths.21.c: "Commando Clique"

 aievent_paths.22.t: "Future of Waffen-$$"
 aievent_paths.22.desc: "All of Holy Cross now lies beneath the boots, paws and assorted insignia of Kelthuz's libertarian guerrilla army. The Waffen-$$ proved remarkably effective at destroying the old authorities, but ruling their territory has exposed how little its members agree upon beyond weapons and hatred of restraint. The most devoted capitalists want to turn radical property rights into the law of the land, with characteristically persuasive enforcement. The movement's darker elements demand terror and a coming Day of the Rope. Others have surrendered even the pretence of purpose and embrace pure nihilism. Kelthuz must decide what kind of beast his organization has become."
 aievent_paths.22.a: "Capitalism, or dick up your ass!"
 aievent_paths.22.b: "Day of the Rope is nigh!"
 aievent_paths.22.c: "Nothing matters..."

 aievent_paths.23.t: "Ascension of Lechia"
 aievent_paths.23.desc: "Opole Voivodeship has fallen to the Lechite warriors, and the banners of an ancient nation fly over its cities once more. Yet conquest has brought no peace to the movement. Gospodzin Bieszk claims that victory confirms his mandate to unite the Lechites, restore their customs and build a state worthy of their ancestors. Master Jaruha and his followers whisper that Bieszk has grown weak, worldly and unworthy of the destiny he awakened. Warriors who once fought side by side now gather around rival camps. The enemies of Lechia have been defeated, but its leader must still survive the struggle within - or give way to another pretender."
 aievent_paths.23.a: "Gospodzin Bieszk"
 aievent_paths.23.b: "Master Jaruha"

 aievent_paths.24.t: "Ascension of Lehja"
 aievent_paths.24.desc: "Opole Voivodeship has fallen to the warriors of Lehja, carrying their strange synthesis of forgotten ancestry and reborn cultish grandeur into the heart of the region. King Sanjaya presents the conquest as proof that fate has chosen him to establish a new legacy. Master Miłar senses that his time has come and acts with such certainty gathering those who believe that Lehja must be guided by a different interpretation of its Logos. The dispute is no longer confined to court ritual; commanders, priests and local rulers are choosing sides. The old enemy has collapsed, but the victorious host may yet tear itself apart over which pretender truly embodies Lehja."
 aievent_paths.24.a: "King Sanjaya"
 aievent_paths.24.b: "Master Miłar"

 aievent_paths.25.t: "Ascension of Vandalia"
 aievent_paths.25.desc: "Opole Voivodeship has fallen before the Vandal warriors, whose long campaign has given them territory but done little to reveal the intentions of their illustrious leader. He speaks at different times of old humiliations, sacred homelands and visions seen beyond the smoke of battle. Some believe conquest was only the first step toward revenge upon every enemy who ever wronged the Vandals. Others insist that war must serve a higher purpose and open the road to Svarga, whatever that promise may demand. The army waits for direction, while even the leader's closest companions wonder what truly dwells inside his head."
 aievent_paths.25.a: "Grant me revenge!"
 aievent_paths.25.b: "Lead us to Svarga!"

 aievent_paths.26.t: "Elections in Opole"
 aievent_paths.26.desc: "Opole Voivodeship has been restored beneath a Polish government after years of occupation, fragmentation and competing claims to its identity. With the emergency administration preparing to step aside, familiar political names have returned to an unfamiliar world. Kukiz'15 presents itself as the voice of local communities, direct democracy and rebellion against the party establishments that failed Poland before the Fall. Law and Justice promises continuity, national solidarity and a disciplined state capable of protecting the recovered region. Both claim to represent the righteous Polish cause. The first election will decide whether Opole is rebuilt through anti-establishment localism or centralized conservative rule."
 aievent_paths.26.a: "Kukiz'15"
 aievent_paths.26.b: "Law and Justice"

 aievent_paths.27.t: "First All-Polish Congress"
 aievent_paths.27.desc: "The establishment of the All-Polish Republic has transformed the National movement from an opposition force into the master of its own state. Unity during the struggle concealed important differences over how victory should be used. The All-Polish Initiative represents a new generation eager to reshape the country through activism and uncompromising national renewal. The League of Polish Families calls for a Catholic, socially conservative order rooted in family and tradition. The National-Democratic Party seeks to revive the disciplined statecraft and political methods of classical National Democracy. The first All-Polish Congress must decide which current will define the Republic."
 aievent_paths.27.a: "All-Polish Initiative"
 aievent_paths.27.b: "League of Polish Families"
 aievent_paths.27.c: "National-Democratic Party"

 aievent_paths.28.t: "Lesser Polish Elections"
 aievent_paths.28.desc: "A government claiming the legitimate legacy of Law and Justice has reunited Lesser Poland, but the movement itself no longer speaks with one voice. Years without Warsaw have forced its activists to reconsider which parts of the old programme remain useful in the new world. The Solidarist faction emphasizes social obligations, economic protection and cooperation between the state, workers and national capital. The Rebirth faction believes that restoration is not enough and calls for an ideological renewal powerful enough to purge past mistakes and rebuild the movement around a new mission. Both claim continuity with the same tradition. Lesser Poland must decide what that tradition now means."
 aievent_paths.28.a: "Law and Justice - Solidarism"
 aievent_paths.28.b: "Law and Justice - Rebirth"

 aievent_paths.29.t: "Fishing for Future"
 aievent_paths.29.desc: "The Free Army has taken control of the Wrocław region, liberating its rivers, ponds and drainage canals from every authority that once restricted the sacred right to fish. Gałecki is delighted, the troops are fed and peace has produced an unexpected constitutional crisis: which fish is the true king of these waters? Traditionalists support the pike, a ruthless predator worthy of ruling every respectable lake. Then came reports of something else - something that left the water and continued moving. Officers demand an answer, fishermen are taking sides and the dignity of the new regime is now tied to the outcome."
 aievent_paths.29.a: "Pike is the king!"
 aievent_paths.29.b: "THE FUCK YOU MEAN, IT'S WALKING?"

 aievent_paths.30.t: "Crawling Coup"
 aievent_paths.30.desc: "Świnoujście has taken control of West Pomerania, extending a municipal administration born on the islands across a region exhausted by war. President Żmurkiewicz presents the victory as proof that patience, local networks and practical governance can still hold the state together. His opponents see only an aging system stretched far beyond its natural limits. Brudziński has gathered dissatisfied officials, security officers and party loyalists around an alternative centre of power. Orders are being delayed, appointments quietly changed and institutions captured one office at a time. The coup is already crawling through the government. The only question is whether it will be stopped before reaching the top."
 aievent_paths.30.a: "Żmurkiewicz stays"
 aievent_paths.30.b: "Brudziński coups the government"

 aievent_paths.31.t: "President's Psychical Condition"
 aievent_paths.31.desc: "With the true government of West Pomerania finally established, the President should be enjoying the greatest triumph of his career. Instead, his staff have become increasingly concerned by sleepless nights, erratic decrees and repeated warnings that 'she' is coming. Nobody has managed to determine who she is, when she will arrive or why the coastal defences must be prepared for her. A doctor has discreetly presented the President with a treatment plan, and senior officials beg him to follow it before the machinery of state becomes inseparable from his private terror. He must choose between returning to stability and following the vision to its conclusion."
 aievent_paths.31.a: "Meds it is."
 aievent_paths.31.b: "SHE'S COMING"

 aievent_paths.32.t: "Macierewicz's Gambit"
 aievent_paths.32.desc: "Antoni Macierewicz has established what he considers the true government of the Capital District, defeating enemies both visible and, according to several classified reports, carefully concealed. Victory has not calmed him. One circle of advisers argues that conspiracy is permanent and that the state must be reorganized for eternal warfare against threats that may never openly reveal themselves. Another has embraced Macierewicz's increasingly prophetic language, interpreting his survival as evidence that he is not merely a statesman but the new incarnation of Tupac Amaru. What began as a dispute over policy is becoming a choice between endless mobilization and mystical transformation. Macierewicz must complete his gambit."
 aievent_paths.32.a: "Eternal Warfare"
 aievent_paths.32.b: "Incarnation of Tupac Amaru"

 aievent_paths.33.t: "Green Anarchy"
 aievent_paths.33.desc: "With the de-establishment of the Capital District's last recognizable government, Sylwia Spurek's faction appears to have lost any conventional political future. There are no ministries left to capture, few institutions to reform and barely a state against which to rebel. To some supporters, this is not defeat but the final liberation from hierarchy. They urge Spurek to preserve the anarcho-primitivist communes, abandon the ruins of industrial society and prove that life without the state is possible. Others are exhausted, scattered and ready to admit that the experiment has reached its end. If nothing remains, everything may be possible - including simply walking away."
 aievent_paths.33.a: "We're here to stay"
 aievent_paths.33.b: "My work here is done"

 aievent_paths.34.t: "Red Dawn"
 aievent_paths.34.desc: "Comrade Nowicki has established the true government of Lesser Poland, but revolutionary victory has left him in command of damaged industry, empty budgets and a population expecting immediate improvement. Delegations from China offer machinery, advisers and a tested model of development capable of dragging the region out of misery. Their assistance could secure prosperity, though it would also reshape the party and bind its future to foreign influence. Some comrades urge Nowicki to accept the partnership as the only serious path toward modernization. Others distrust the visitors, their programme and, for reasons that have become unexpectedly important during the negotiations, their choice of eyewear. A red dawn approaches either way."
 aievent_paths.34.a: "Polish misery will end!"
 aievent_paths.34.b: "I don't like your glasses"


 aievent.3.t: "A Choice for Southern Podlachia"
 aievent.3.desc: "Southern Podlachia has survived unification, emergency rule and more provisional committees than anyone cares to remember. Now its people are finally being asked who should govern them in peace. Truskolaski offers continuity, municipal experience and the reassuring promise that tomorrow will remain broadly similar to today. His opponent offers change, although most voters appear uncertain who the opponent actually is or whether they have ever seen him before. All they know he talks a lot about some village called Kąkolewnica and that he's a plumber. These may not be the most inspiring choices in the history of democracy, but they are the choices still standing. Southern Podlachia must choose wisely - or at least choose someone."
 aievent.3.a: "Truskolaski - One More Term!"
 aievent.3.b: "The Other One - Whoever He Is"

 aievent.4.t: "After the Barricades"
 aievent.4.desc: "The crisis in Mysłowice has been resolved - for better or for worse - but it exposed every fracture within our movement. The Black Block argues that hesitation nearly destroyed us and demands a disciplined revolutionary force capable of crushing the next rebellion before it begins. The communal faction insists that repression only reproduces the society we swore to abolish, calling instead for autonomous settlements governed through cooperation and consensus. Meanwhile, enemies inside and outside our territory wait for a chance to settle the matter with explosives. Antifa has survived the uprising, but survival alone cannot define its future. We must decide what our precious society is actually meant to become."
 aievent.4.a: "The Black Block Will Reign Supreme!"
 aievent.4.b: "All Power to the Communes!"
 aievent.4.c: "DEATH TO ANTIFA! *explosion*"

 aievent.5.t: "Cracks in the Intercounty"
 aievent.5.desc: "Following the premature collapse of the Będzin Congress, the alliance factions have begun hurling blame at one another for virtually every ill plaguing the land. Mobilizations are underway, and threats of military intervention and open war are being exchanged between neighbors. While there is a faint hope that tempers may cool over time, it appears a line has been crossed-all signs now point toward war. What is certain, however, is that the Intercounty, after nearly two years of existence, has officially disbanded. No binding ties remain between the former member factions, and nothing stands in the way of a full-scale conflict erupting between them."
 aievent.5.a: "It's a long overdue..."

 aievent.6.t: "Silesian League oficially disbands"
 aievent.6.desc: "What was once presented as a united front of Upper Silesian warlords has finally buckled under the weight of its own contradictions. Months of rivalry, intrigue, and petty disputes over leadership have torn the alliance apart, with its members now more concerned with fighting each other than confronting their enemies. The masks of unity have fallen, revealing what the League always truly was - a collection of ambitious strongmen held together by convenience rather than conviction. While the collapse of a regional power will undoubtedly bring further instability to Silesia, it also presents an opportunity for those who dare take the reins of history. Divided, the warlords are weaker than ever, and the future of the region is once again up for grabs."
 aievent.6.a: "Give a watch to a monkey..."

 aievent.15.t: "Mr. Hotel's Gambit"
 aievent.15.desc: "Running a hotel empire is simple compared to running a country. Guests complain about the food, not artillery. Competitors fight over customers, not territory. Yet with the sudden collapse of the Eurokommissariats, the world outside our resorts has come knocking at our door. The Sudetes now sit in the middle of a growing struggle between ambitious neighbors, and everyone expects us to pick a side. There are advantages to joining a larger bloc. There are advantages to standing alone as well. But every day spent waiting is another day for others to make decisions on our behalf. One thing is certain - the age of simply selling vacations and ignoring politics has come to an end."
 aievent.15.a: "Align with the Eurokommissariat"
 aievent.15.b: "Align with liberal forces from EK"
 aievent.15.d: "Sign a merger with KGHM"
 aievent.15.e: "Pay tribute to the Roma King"
 aievent.15.f: "We will be better on our own"

 aievent.17.t: "Your favourite meat flavor"
 aievent.17.desc: "Our enterprise is a specific one - we happen to deal with meat. Be it may an animal or...more human. One thing is simple - we can't afford to have two pieces of the same meat splitted apart. It has to be cooked as a whole. But different chefs have different ideas about how to prepare our national meal. What it will be?"
 aievent.17.a: "Chewy and bloody - Henryk Kania"
 aievent.17.b: "Cheap and burned - Henryk Stokłosa"

 aievent.22.t: "Choosing our Patron"
 aievent.22.desc: "Our city is definitely a jewel of this region. Yet we can't really prosper only within city limits when everything else is on fire. And we can't be alone in this struggle - we will have to find ourselves a customer. Or a partner if you will. There are some serious players around us that alliance with them would be benefitial to our cause and they would definitely help us protect our city. With guns we will sell them of course."
 aievent.22.a: "Allow Polsat Group into the city"
 aievent.22.b: "Restoration of the Civic Coalition"
 aievent.22.c: "The most loyal partners in politics"
 aievent.22.d: "Go for black market - profits and no allies required"

 aievent.24.t: "The Black Gate Stirs"
 aievent.24.desc: "Dark reports arrive from beyond the eastern frontier. Russian depots have opened, reserve formations are assembling and long columns of armour now gather behind what our soldiers have come to call the Black Gate. The orcs of Mordor conceal their intentions behind propaganda, but no peaceful purpose requires this many tanks. Soon they may pour westward, spreading occupation, corruption and the cursed letter Z across the lands of free peoples. Every government of Middle-Earth must prepare for the coming storm. There will be time for diplomacy after the gates have opened. For now, there is only mobilization, fortification and the certainty that something terrible is moving in the East (well, the North actually)."
 aievent.24.a: "RUSH Z!"

 aievent.28.t: "Stalowa Wola Seeks a Patron"
 aievent.28.desc: "Stalowa Wola possesses factories, weapons and a proud industrial tradition, but none of these can compensate forever for strategic isolation. Our neighbours are growing stronger, trade routes remain insecure and both food and fuel depend upon the goodwill of powers beyond our borders. The Republic of Tarnobrzeg offers economic access, political protection and integration with a nearby civilian state. The Knights of the Christ promise military security, spiritual purpose and a place within their expanding sacred order. Either patron could guarantee our survival, but neither will extend protection without demanding loyalty in return. Stalowa Wola must decide beneath whose banner its industry will continue to operate."
 aievent.28.a: "Stand with the Republic of Tarnobrzeg"
 aievent.28.b: "Kneel before the Knights of the Christ"

 aievent.30.t: "Chrzanów Breaks Its Chains"
 aievent.30.desc: "Ziobro's authority once reached Chrzanów through prosecutors, loyal officials and the fear that resistance would bring swift punishment. That network is now collapsing. Defeats elsewhere have left the local garrison unpaid, while orders from above grow more desperate and less credible by the day. Municipal leaders, police commanders and former party members have quietly formed a conspiracy to reclaim the city before the Ziobrists drag it down with them. The courthouse has been surrounded, the radio station secured and portraits of the Prosecutor are already disappearing from government offices. Chrzanów is taking back its freedom. All that remains is to announce the end of Ziobrists rule."
 aievent.30.a: "Down with the Prosecutor!"

 aievent.31.t: "The Fires of Nowy Targ"
 aievent.31.desc: "Our failure to put Zakopane in its place was a little bit more than a military embarrassment. It proved that defiance could succeed. Weapons, agitators and triumphant rumours have travelled north through the mountain roads, inflaming every grievance that our administration managed to suppress. Now barricades divide Nowy Targ, government buildings burn and rival groups exchange fire in streets that appeared calm only yesterday. Local units hesitate, uncertain whether reinforcements will come or whether the entire southern frontier has already been lost. We had a functioning arrangement here - not a perfect one, but a good one. Because we allowed Zakopane to escape punishment, that arrangement is now collapsing around us."
 aievent.31.a: "We Had a Good Thing Going..."

 aievent.32.t: "The Kozienice Crisis"
 aievent.32.desc: "The Kozienice power plant has become the prize in a confrontation far larger than the town itself. Piechociński's envoys arrive with a treaty promising protection and continued civilian administration, while armoured formations wait nearby should negotiations fail. At the same time, the Air Force demands control over the plant to secure its bases, offering its own agreement beneath the shadow of aircraft circling overhead. We may align with either power on negotiated terms, preserving at least the appearance of autonomy. Alternatively, we can reject the paperwork and allow the tanks or airmen to impose a more direct solution. Kozienice cannot remain in Garwolin's grasp; instead Fogiel is forced to only choose the manner of its submission."
 aievent.32.a: "A Treaty with Piechociński"
 aievent.32.b: "Open the Gates to the Tanks"
 aievent.32.c: "A Treaty with the Air Force"
 aievent.32.d: "Open the Gates to the Airmen"

 aievent.33.t: "Polsat Goes Shopping"
 aievent.33.desc: "The northern campaign has placed more than territory within Polsat's reach. It has also produced an attractive portfolio of orchards, bottling facilities, distribution networks and one particularly valuable brewery in Warka. The board sees an opportunity to turn military influence into lasting market dominance. Purchasing the orchards would secure agricultural supply and open new consumer lines. Acquiring Warka would add an established beverage brand to the corporate family. Buying both promises vertical integration on a scale that excites every executive in the room, though the accountants warn that reconstruction costs may outweigh the returns. Polsat must decide whether this is strategic expansion or merely an expensive burden."
 aievent.33.a: "Acquire the Grójec Orchards"
 aievent.33.b: "Buy the Entire Package"
 aievent.33.c: "Acquire the Warka Brewery"
 aievent.33.d: "Some Assets Are Just Liabilities"

 aievent.34.t: "Can Wałbrzych Be Saved?"
 aievent.34.desc: "Wałbrzych has survived mine closures, political collapse and the repeated discovery that nobody outside Wałbrzych particularly wants responsibility for it. Unfortunately, even this battered lump of a hobo town needs a future. Roman Szełemej offers the familiar comfort of another term, another reconstruction plan and perhaps another attempt to make the city function normally. Stanisław Żółtek promises freedom from bureaucracy, taxation and possibly several other features such as dotations for alcohol. Meanwhile, PPPP has returned from political prehistory with beer, slogans and the confidence of a party that knows conditions cannot become much less serious. The city must select the least impossible of three futures."
 aievent.34.a: "Fine, Give Szełemej Another Term"
 aievent.34.b: "Żółtek Will Set Us Free!"
 aievent.34.c: "The PPPP Rises from the Grave!"

 aievent.35.t: "Mandate of Heaven"
 aievent.35.desc: "The Eternal Procession has grown too powerful to continue without revealing its ultimate purpose. Terlecki may cast aside every pretence, embrace his nature as a Lich and command the dead through naked supernatural power. He may instead preserve the Procession's holy appearance, maintain the language of faith and continue the useful alliance with Myślenice. A third path would keep the faith but discard the ally: proclaim the direct Rule of God, condemn all competing authorities and establish a theocracy answerable to heaven alone. Each choice offers a different mandate, and each requires sacrificing part of the order that carried us this far. Terlecki must finally reveal what kind of ruler he intends to be."
 aievent.35.a: "UNLIMITED POWEEEEEEEEEEEEER!"
 aievent.35.b: "Maintain the Holy Masquerade"
 aievent.35.c: "One Law Alone - the Law of God"

 aievent.37.t: "Turmoil in Mysłowice"
 aievent.37.desc: "The masks have fallen in Mysłowice. Sabotagereferat Myslovitz, German pawns and terorrists, emboldened by weakness and nostalgia for the old world, have openly risen against the people's order and taken up arms against our revolution. Their rebellion is not merely an attack on our societies - it is an attack on the freedom itself. Let them make their stand. The communes of Jaworzno have faced worse enemies before, and these traitors will soon learn that revolutions are not defended with words alone."
 aievent.37.a: "Send military response!"
 aievent.37.b: "It's more trouble than it's worth..."

 aievent.38.t: "Friends in High Places"
 aievent.38.desc: "The rebellion in Mysłowice has survived its first clashes with Antifa, but courage cannot replace ammunition, medicine or trained reinforcements. Jaworzno still possesses the stronger organization (ironically), and without outside assistance our uprising may be crushed before the rest of Silesia understands what is happening. Two potential allies are close enough to intervene. Katowice commands greater resources and could transform the balance of the conflict, though its support would come with political expectations. Chorzów offers a more local partnership and may prove easier to deal with after victory. Couriers are ready to cross the lines. We must decide which city will receive our appeal for help."
 aievent.38.a: "Send Couriers to Katowice"
 aievent.38.b: "Send Couriers to Chorzów"

 aievent.39.t: "Mysłowice Appeals to Katowice"
 aievent.39.desc: "Couriers from Mysłowice have reached Katowice with reports of barricades, street fighting and an uprising on the verge of being overwhelmed by Antifa forces from Jaworzno. They ask for weapons, volunteers and the political recognition needed to keep their rebellion alive. Intervention would secure our eastern approaches and give Katowice influence over whatever government emerges from the conflict. It would also draw us directly into a war that may prove longer and uglier than the rebels admit. Refusing costs us nothing today, but a victorious Antifa would remember our silence. Mysłowice has called for aid, and Katowice must decide whether to answer."
 aievent.39.a: "Katowice Answers the Call!"
 aievent.39.b: "This Is Not Our War"

 aievent.40.t: "Mysłowice Appeals to Chorzów"
 aievent.40.desc: "A delegation from Mysłowice has arrived in Chorzów after slipping through Antifa lines. Its members describe an exhausted but determined rebellion, short on weapons and expecting a decisive assault from Jaworzno at any moment. They appeal to Silesian solidarity and promise friendship, influence and future cooperation if we provide immediate military assistance. Supporting them would expand our position in the region and prevent Antifa from consolidating another industrial city. It would also risk our soldiers in somebody else's uprising, with no guarantee that the rebels can hold together after victory. The decision cannot be delayed; by tomorrow, there may be nobody left to help."
 aievent.40.a: "Chorzów Answers the Call!"
 aievent.40.b: "This Is Not Our War"

 aievent.41.t: "Silesian Troops Enter Mysłowice"
 aievent.41.desc: "The rumours have been confirmed. Silesian troops are crossing into Mysłowice with weapons, advisers and enough supplies to turn a desperate rebellion into a serious military campaign. Rebel units that were retreating only yesterday have returned to the barricades, now coordinated through Silesian radios and reinforced by fresh volunteers. Our forces in Jaworzno remain exhausted, dispersed and completely unprepared to confront a regional power. A direct battle would risk the destruction of everything we have built before reinforcements could even be assembled. For the moment, there is no revolutionary answer to the columns moving against us. We cannot fight Silesia yet. We must retreat and survive."
 aievent.41.a: "Fall Back - We Cannot Fight Them Yet!"

 aievent.42.t: "The Jaworzno Question"
 aievent.42.desc: "Myslovitz forces have entered Jaworzno, ending Antifa rule and placing the city beneath our control. Victory now presents a less glorious problem: what are we supposed to do with it? Annexation would provide industry, manpower and a base for the promised liberation of all Zagłębie, but it would also require a long occupation. A dependent local government could spare us that burden while keeping Jaworzno inside our sphere. We could also withdraw entirely, leaving the city's factions to fight over the ruins without wasting another soldier or administrator. We have defeated our enemy. Now we must decide whether Jaworzno is a prize, a buffer or simply a dump best abandoned."
 aievent.42.a: "Onward to the Liberation of Zagłębie!"
 aievent.42.b: "A Loyal Government Will Suffice"
 aievent.42.c: "Leave This Dump to Its Fate"

 aievent.43.t: "The Liberation of Zagłębie and Jura"
 aievent.43.desc: "The fall of Jaworzno has carried Myslovitz to the frontier of Zagłębie and Jura and transformed an urban rebellion into a regional power. Our leaders now claim that victory cannot be secured while the people beyond the border remain beneath a foreign and artificial order. Recruitment offices are crowded, old industrial stockpiles have been opened and propaganda vehicles cross the towns promising a final war of liberation. The enemy has rejected every ultimatum and begun mobilizing its own forces along the roads into the Jaworzno. Neither side expects another negotiation. The campaign will decide whether our revolution ends at the frontier or advances across the entire region. Forward!"
 aievent.43.a: "Forward, Myslovitz!"

 aievent.44.t: "One Triumvirate, One Region"
 aievent.44.desc: "Ebrantil, Rutkowski and Skrzydlewski built the Triumvirate as a temporary arrangement between forces too useful to destroy and too dangerous to trust. Against every expectation, it survived long enough to dominate the surrounding region. Success now requires a permanent structure. Endless negotiation between three private domains cannot govern an expanding state, while independent neighbours continue to exploit every disagreement among its leaders. The leader have therefore called upon the first principle of their future order: all factions inside the Triumvirate must be integrated, willingly if possible and by force if necessary. The internal balance can be settled later. For now, the Triumvirate will offer the world a simple choice - join or die."
 aievent.44.a: "Join Us - or Die"

 aievent.45.t: "The Triumvirate's Ultimatum"
 aievent.45.desc: "An envoy of the Triumvirate has arrived under armed escort bearing a treaty, a deadline and very little interest in negotiation. We are invited to surrender control of our foreign policy, armed forces and strategic assets in exchange for protection and a place within the new order. The envoy insists that submission will preserve our local administration and spare our people another war. Scouts report, however, that Triumvirate's leader units are already assembling near the border, ready to provide a less diplomatic answer if we refuse. Accepting would end our independence. Resistance may end the country itself. We must decide before the deadline expires."
 aievent.45.a: "We Submit... For Now"
 aievent.45.b: "Tear Up Their Ultimatum!"

 aievent.46.t: "Victory of the Triumvirate"
 aievent.46.desc: "The last organized resistance to the Triumvirate has collapsed. Enemy strongholds have surrendered, scattered units are laying down their weapons and the roads between our territories are open for the first time since the war began. Victory has vindicated the policy of forced unity, but it has also left us responsible for damaged cities, hostile populations and institutions assembled from three competing systems. Pogotowie, Rutkowski and Skrzydlewska - they could no longer govern solely through campaign councils and improvised agreements. They needed to decide who is the boss. But now, the age of conquest is ending (for now). If the Triumvirate intends to survive its victory, it must finally build a state capable of ruling what it has taken."
 aievent.46.a: "The War Is Over. Now We Govern."


 aievent_tarnow.1.t: "Kosiniak-Kamysz's Agrarian Dilemma"
 aievent_tarnow.1.desc: "Kosiniak-Kamysz may rule in Tarnów (at least half of it), but Waldemar Pawlak and his People's Fire Brigades remain a rival centre of agrarian power. Their competing claims divide village councils, volunteer units and nearly every institution still connected to the old peasant movement. Three solutions are being discussed. We can settle the dispute decisively by using the chemical potential of the Mościce nitrogen works to remove Pawlak from the equation. We can invite the other agrarians to negotiate a grand coalition built upon common interests. Or we can avoid the entire unpleasant matter, assume that everything is basically fine and do absolutely nothing. It is not fine though."
 aievent_tarnow.1.a: "A Little Phosphorus for a Countryside Prosperous"
 aievent_tarnow.1.b: "Call an Agrarian Congress"
 aievent_tarnow.1.c: "Do Nothing - Everything Is Fine"

 aievent_tarnow.2.t: "A Little Phosphorus for a Countryside Prosperous"
 aievent_tarnow.2.desc: "The plan utilised local contacts, industrial chemistry and the sincere belief that several tonnes of fertilizer could resolve an internal party dispute. The explosion at the Mościce nitrogen works exceeded even its authors' expectations. Pawlak has succumbed to his wounds due to explosion, the horizon above Tarnów is burning and every unit of the People's Fire Brigades has interpreted the attack as a declaration of war. Sirens now sound throughout the countryside as fire engines are converted into improvised combat vehicles and village companies mobilize against us. Subtlety is no longer possible. Kosiniak-Kamysz will enter Tarnów as though it has always belonged to him - assuming the firefighters do not arrive first."
 aievent_tarnow.2.a: "By Sickle and Scythe"

 aievent_tarnow.3.t: "The Great Agrarian Compromise"
 aievent_tarnow.3.desc: "Against every instinct developed by Polish agrarian politicians over the previous century, the negotiations have produced an agreement. Pawlak, Kosiniak-Kamysz and the president of Tarnów have accepted that none of them can dominate the region without exhausting the others. The People's Fire Brigades will retain their rural structures, Kosiniak's camp will direct the wider political project and the municipal administration will keep Tarnów functioning while both sides argue. The arrangement is inelegant, full of contradictory promises and already supported by three separate interpretations of what was signed. In other words, it may be the most authentic peasant coalition ever created. A new alliance is rising."
 aievent_tarnow.3.a: "A New Peasant Alliance Is Born"

 aievent_tarnow.4.t: "Everything Is Fine (It Is Not)"
 aievent_tarnow.4.desc: "Kosiniak-Kamysz chose patience, inactivity and the comforting assumption that Pawlak would eventually lose interest. Pawlak did not lose interest. At dawn, the People's Fire Brigades entered Tarnów in a convoy of engines with sirens screaming, ladders raised and armed volunteers clinging to every available surface. The lead vehicle drove directly through the government's defences and very nearly through Kosiniak himself. Fighting has devastated the city, the administration has collapsed and Pawlak now controls what remains. Kosiniak-Kamysz survived, but only barely, fleeing to Dąbrowa Tarnowska with his closest supporters. From there, he promises to return. The agrarian dispute has become an open war."
 aievent_tarnow.4.a: "Tarnów Falls - Kosiniak Escapes"

 aievent_gory.1.t: "The End of Beskid Autonomy"
 aievent_gory.1.desc: "The Beskid protectorates served their purpose during the wars of unification. Their local administrations supplied troops, guarded the passes and obeyed our directives while preserving the appearance of independence. With the mountains secure, that arrangement has become an obstacle rather than an advantage. Separate customs posts disrupt trade, rival laws complicate recruitment and ambitious puppet leaders continue to imagine that temporary autonomy is a permanent right. Delegations have been summoned to approve a final act of integration. Their armed forces will enter our command, their offices will be absorbed and their borders will disappear from the maps. The age of Beskid puppets is over; the mountains will now be governed as one state."
 aievent_gory.1.a: "One Mountain State"

 aievent_gory.2.t: "The Grand Federation of Cieszyn"
 aievent_gory.2.desc: "The Grand Alliance of Cieszyn was created to defeat common enemies, not to outlive them. Yet the years of cooperation have tied its members together through shared commands, open roads and the remarkable authority of Adam Małysz. Returning to a patchwork of small allied states would waste everything achieved during the war. At Małysz's invitation, their leaders have gathered to establish a single Federation, combining defence, foreign policy and economic administration while preserving a place for the mountain regions within the new structure. Officially, every ally enters voluntarily. In practice, none wishes to be the one who refuses the man capable of carrying the entire alliance on his shoulders."
 aievent_gory.2.a: "Together, We Will Fly Farther"

