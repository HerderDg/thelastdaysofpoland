unification.19.t: "[GetNewspaper]Truskolasy unify Zagłębie and Jura!"
unification.19.desc: "Goal for Truskolasy! Despite none of the bookmakers having dared to put money on them before the war, the Free Club Association managed to seize the entire territory of Zagłębie and Jura. Today, at the New People's Stadium in Sosnowiec, the victorious Jerzy Brzęczek spoke to a combined crowd of players and citizens, inaugurating the Triumphal Match between Olimpia Truskolasy and the National Team. Even with a murderous season behind them, the Supreme Coach's boyhood club was able to beat the fledgling side 3-0 amongst a sea of ideological propaganda symbolizing the union of all football clubs under the banner of the TFCA. It seems that Clubism has truly created its own unique strain of socialist thought, embarking on an uncharted path; however, fans still have reason to worry, as the result has painfully exposed the shortcomings of the National Team revival project, which is currently, as Brzęczek assured in a post-match conference, in a state of transition."
unification.19.a: "Campeones, Campeones, Ole Ole Ole?"

super.19.t: "[GetNewspaper]Poland united under the flag of [FROM.GetName]!"
super.19.desc: "Years have passed since Poland as a state collapsed, however, Poland as an idea has never entirely perished. As the government under the leadership of [FROM.GetLeader] clearly shown, unification within a single generation wasn't a distant dream, but attainable reality. Against all odds, facing enemies on all sides, from within, aswell as forces from abroad, [FROM.GetName] stands truly united, having reforged the nation of Poland and it's diverse people into a monolith, proving that the confidence it's citizens layed upon the leadership and beliefs of their government wasn't at all misguided. Scars of the conflict will take time to heal, but with the unity forged in fires of war, future looks bright for Poland. As the sun rises above the land, citizens of [FROM.GetName] look forward with pride and high spirits, having passed the ultimate test of the Polish civil war."
super.19.a: "United at last."

