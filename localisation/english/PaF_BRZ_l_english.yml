unification.19.t: "[GetNewspaper]Truskolasy unify Zagłębie and Jura!"
unification.19.desc: "Goal for Truskolasy! Despite none of the bookmakers having dared to put money on them before the war, the Free Club Association managed to seize the entire territory of Zagłębie and Jura. Today, at the New People's Stadium in Sosnowiec, the victorious Jerzy Brzęczek spoke to a combined crowd of players and citizens, inaugurating the Triumphal Match between Olimpia Truskolasy and the National Team. Even with a murderous season behind them, the Supreme Coach's boyhood club was able to beat the fledgling side 3-0 amongst a sea of ideological propaganda symbolizing the union of all football clubs under the banner of ZWKT. It seems that Clubism has truly created its own unique strain of socialist thought, embarking on an uncharted path; however, fans still have reason to worry, as the result has painfully exposed the shortcomings of the National Team revival project, which is currently, as Brzęczek assured in a post-match conference, in a state of transition."
unification.19.a: "Campeones, Campeones, Ole Ole Ole?"

unificationreg.19.t: "[GetNewspaper]Football unites us, we unite the region!"
unificationreg.19.desc: "The final whistle has sounded! After months of fighting through fortified towns, limestone valleys and more defensive lines than even the most committed practitioner of Polish haramball could tolerate, the Free Club Association has secured the entirety of the region. Celebrations culminated at the newly nationalized stadium in Częstochowa, where Jerzy Brzęczek declared that no castle, monastery or local chairman would ever again stand above the collective interests of football. The ceremony was followed by an exhibition match between Olimpia Truskolasy and a hastily assembled Jura Select XI, whose players had reportedly met one another only hours before kick-off. Olimpia won 4-1, though the visitors' solitary goal was immediately proclaimed proof that regional integration was already producing results. With the old warlords expelled and their clubhouses converted into people's academies, Clubism has established its first proper foothold beyond the familiar pitches of home."
unificationreg.19.a: "Jura has joined the league!"

unificationsupreg.19.t: "[GetNewspaper]Another win for [BRZ.GetName]!"
unificationsupreg.19.desc: "The red-and-white banners of the Polish Socialist Club Republic now fly over a vast chunk of former Poland. What began as an eccentric experiment in Truskolasy has grown into a state of millions, governed through club committees, supporters' councils, and a transfer policy increasingly indistinguishable from military annexation. After the inner chaos that ensued in ZWKT, [BRZ.GetLeader] turned out to be the only one capable enough to lead this extravagant country, as he's still plagued by demons of past failures, and they are not letting go easily. For every problem solved, two more take their place - as it seems a reactive nature of the Clubism system may not be as stable as state media claims. Behind the curtains, however, several questions remain. The Republic must now reconcile bitter rivalries, incompatible league systems and thousands of local bosses, each convinced that his own club deserves a place in the top division."
unificationsupreg.19.a: "We play to the same goal!"

super.19.t: "[GetNewspaper]Final match is upon us!"
super.19.desc: "After years of war, relegation and extra time, Poland has finally been reunited. The Polish Socialist Club Republic now stretches from the Baltic coast to the Tatra Mountains, binding the nation together through common ownership, compulsory youth academies and the unquestionable cultural supremacy of football. In Warsaw, the ruins of the National Stadium were reopened for the Match of National Reunification, attended by soldiers, workers, ultras, former warlords and every surviving club president who had sworn loyalty quickly enough. Though nobody can talk about the riots after the match, it's crystal clear that final remnants of the old Republic disappeared behind banners proclaiming a new national principle: Poland is a club, and every citizen is a member. And the iron grip of a Supreme Coach doesn't let go - there are even rumors he's planning something with Portugal, but knowing his hatred for this country, we can only expect the worst."
super.19.a: "Next stop: Lisbon!"

super_a.19.t: "[GetNewspaper]Champions of the whole country"
super_a.19.desc: "After years of war, relegation and extra time, Poland has finally been reunited. The Polish Club Republic now stretches from the Baltic coast to the Tatra Mountains, binding the nation together through common ownership, compulsory youth academies and the unquestionable cultural supremacy of football. In Warsaw, the ruins of the National Stadium were reopened for the Match of National Reunification, attended by soldiers, workers, ultras, former warlords and every surviving club president who had sworn loyalty quickly enough. The moderate loyalist wing of the Association managed to take this country from the brink of disaster - and it really paid off. Now, they need to keep what they managed to build, and hope that this system will not collapse the minute they enter the world stage, though ZKWT leader Kuba Błaszczykowski declared that he intends to follow in his uncle's footsteps, be it as stern as he wanted or more lenient."
super_a.19.a: "We will never walk alone."

super_b.19.t: "[GetNewspaper]Reforms in the Football Country"
super_b.19.desc: "After years of war, relegation and extra time, Poland has finally been reunited. The Polish Club Federation now stretches from the Baltic coast to the Tatra Mountains, binding the nation together through club enterprises, modern youth academies and the unquestionable cultural supremacy of football. In Warsaw, the ruins of the National Stadium were reopened for the Match of National Reunification, attended by citizens, former warlords and every surviving club president who had been swayed by the power of well-played deals. Robert Lewandowski, who came to be a leader of the ZWKT in spite of every loyalist activist in the country, dreamt big. He wanted to take this whole boat in another direction - one that would not discriminate against every other sports discipline, but where it would result in a state that celebrates athletes as they are. And judging by the streets and their atmosphere - he absolutely won."
super_b.19.a: "It's time for professionals."


