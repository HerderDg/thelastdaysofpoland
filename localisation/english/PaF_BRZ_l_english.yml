buzzer.22.t: "From Coal to Ball"
buzzer.22.desc: "As both teams entered the pitch, 58-year-old Jadwiga Jadczak wondered how she had found herself on the green turf to earn a living.\nNothing in her life indicated such a turn of events; After all, until now, the monotony of her bureaucratic career had endured even the greatest historical turmoils. It wasn't easy, even during the seemingly stable period; Each election could mean a bureaucratic purge, because someone's nephew or niece needed a career and money for doing nothing. Nevertheless, those nepo babies needed someone to navigate the maze of paragraphs. That someone was Jadwiga. The honest professional who knew all the ins and outs of the bureaucratic process. She was most valued for her ability to fill out the documents to get any government subsidy possible. The problem was that the new regime didn't fancy documents that much.\nBrzęczek thought it would be a superb idea to allocate resources to the workplaces based on how well their employees perform in football. If that wasn't stupid enough, the fact that different members of different professions would compete against each other for the additional funds.Because of that, now she and her colleagues from the town office, most of them in her age, had to face the muscular, young men straight from the mines.\nShe had a plan: An aggressive attack in the second half with forwards and midfielders comprised of the oldest of the office workers, and Kuba, a young intern, was supposed to work on the defense. Not using their fittest player in the attack raised some eyebrows, but they all knew better than to argue with Jadzia when she had put her mind into something.\n\nThe match started! Everything proceeded as Jadwiga expected. Despite their dominating physique, the miners were too afraid to shoulder charge at them, afraid to hurt the old ladies. Nevertheless, their patience still had its limits, especially when the office team got closer to the miners' goal. But now was not the time. Now Jadzia's teammates were supposed to focus on the defence, and Maria, the goalkeeper (the widest of the bunch), managed to save an odd ball shot by the opponents.\nThe time to strike came at the end of the second half. As planned, the eldest of them charged at the miners' half, who stalled, trying not to hurt the feeble worker office. Their hesitation, however, enabled one of the attackers, Eufemia, to get into their penalty box. The office team thought this might be their chance, striking fear into the hearts of the miners. One of them panicked and tried to do a slide tackle.\nEufemia hit the ground screaming and holding her leg. It was difficult to tell whether this was a foul or not, but the umpire knew it looked bad that the team, which wounded an old lady, would be left unpunished. So he called for a penalty kick for the office team. That was Kuba's time to shine, to possibly score a point, instead of an injury during a hypothetical normal action.\nHe gains momentum. Kicks the ball! The goalkeeper lunges to the left! And the ball soars to the right!\n1:0 for the Office Workers' team!"
buzzer.22.a: "We're getting new coffee machines, ladies!"

