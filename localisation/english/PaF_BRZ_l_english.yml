buzzer.25.t: "The Bald Devil"
buzzer.25.desc: "Olimpia Truskolasy to Chairman of FIFA!\nHail oh Chairman, you devil from Atlantis or wherever there is they never heard of football, brother and friend to devils and people who call football \"soccer\", secretary general of Eating Shit and Calling It An Incentive Party. What kind of chairman are you, if you cannot give red card to an American without getting a TRUMP card up your ass! Your refs are eating Arabs' shit, and will eat Chinese shit if they ever get into football.\nYou shan't, you son of a bitch, tell Poland how to run its football or itself. You threaten to expel us from FIFA? Act like we never were in to begin with? You basketball kicker, Brazilian 7-1 curse, pitch Chupacabra, you don't expel us! Instead: we quit! You're clown to everything that ever heard the word \"integrity\", you would take bribes from swineheards of Upper and Lower Egypt, British Royal Family's latrine cleaners, Chinese triad muscle, embezzlers that would make PZPN of all things run for its money, and their pleasure women. Your refs turn goals into offsides, offsides into penalties. So what if they wince at the proper Polish teams: Their eyes are offside, their sisters are their brothers, they all fuck one another like one big family! Their speeches and keynote fees are about as on goal as Laga strikes. We've seen more humility in Legia Warsaw! They snatch victory from rightful teams like Epstein snatched candy from little girl's hands, after after deciding which team donated enough to have you turn the other ass-cheek upon their fouls and offsides!\nThus the ultras and Poles of Olimpia reply you, scum. You won't even get to clean the toilets at Iskra Stolec club. We wrap it up now, we know not the date, they turned off Starlink again, so peep the sky for the month and books for the year, our day is yours, kiss our asses for it!"
buzzer.25.a: "Ring up Ilya Repin, he should make a painting of this."

buzzer.26.t: "Turning the Table"
buzzer.26.desc: "- Look at the first three places. And that, gentlemen, is how things stand...\nEight of the league's most distinguished club chairmen were holding council in a room that, through the clouds of cigarette smoke and vodka fumes, could only barely be identified as a conference hall inside the Tęcza Błędów clubhouse. Times might change and governments might issue different orders, but corruption at certain levels was not as easy to uproot as Brzęczek seemed to believe. All the talk of cleaning up the game reached ordinary people, while the same old corrupt dealings continued in the shadows. Everyone knew that such things were happening, yet at the same time nobody knew anything at all - because there was never any evidence.\n\n- Gentlemen! We have to do something about this chaos! We cannot abandon football to its fate and allow the wolves from the Association to tear it apart! The Cooperative is only the first step. Częstochowa and Truskolasy may control the Association now, but elections to its governing boards are coming soon! Join the cooperative, and I will guarantee your league status next season, as well as additional funding, - began Kazimierz Woźnica, chairman of Tęcza Błędów. It was hardly surprising. Of every club in the league, Tęcza was the one most threatened by relegation, and they were prepared to save themselves by any means necessary.\n- I'll stay up on my own. What the hell do I need some bloody cooperative for? I can manage perfectly well without it. And besides - Tęcza? With all due respect, for Christ's sake, we could have chosen a better club! - complained the chairman of Przemsza Siewierz.\n- And yet here you are, Mr Szałek. Yes, normally it is the champion who establishes a cooperative. But here, nobody even knows who is what anymore. Raków is supposed to lead us? That is a good one. Raków is part of the problem. Gentlemen, remember where the referees come from. Most of them are from Częstochowa. Your clubs will all go down while Raków marches towards the title. Alongside Olimpia. And that will be the last anyone ever hears of your little clubs. So, are you in? Ten million to begin with.\n- I'm supposed to pay you ten million? For what, exactly? - objected the chairman of Sarmacja Będzin.\n- Take a look at the table, my friend. Pilica is not a bad team... They must beat Warta. They must. And then Sarmacja... oh dear, oh dear. I do not know. The second division is a wonderful place, of course, but the third can be quite interesting too.\n- What the fuck do you mean, they 'must'? This is sport!\n- Sport is sport, but somebody still has to manage the whole thing. Do not play the innocent with me, Bolek! You know exactly why you are here, so I am asking you directly: are we doing business and knocking the giants off the podium, or are we going to keep pretending that we approve of what the Association is doing to us?\n\nThe vodka on the table undoubtedly had an indescribable influence on the decision-making abilities of the assembled chairmen. In the end, every one of them agreed to join the Cooperative, which intended to arrange the league table so that its member clubs occupied favourable positions. Should the scheme succeed, Olimpia would soon find itself in serious trouble.\n- Colleagues, today we shall write another magnificent chapter in the history of Polish football! I am delighted that we were able to reach an understanding."
buzzer.26.a: "Now then - to your health!"

buzzer.27.t: "Mutual Walkover"
buzzer.27.desc: "Right there, on the pitch, Ryszard Karpat walked slowly to the middle. At the match, he'd walk to the middle of the pitch to kick off just like this. This time, he walked to kick off a conversation with the Olympia trainer: The match was tomorrow.\n- Good evening - the trainer nodded at the middle\n- The pitch is dry. Like they added potato starch to the substrate. - he replies.\n- Nothing wrong with a little home advantage. Only Olympia is prepared to play on a pitch this bad.\n- Well, failing upward is your speciality. You snatched defeat from jaws of victory under better circumstances. And don't get me started on this arena's toilets. You gotta piss in expert mode just to not get infected and you pay in euro's for that? No wonder you're flush with money.\n- You trying to say something?\nThey walked across the dry pitch: It was dark already, the full moon compensating for floodlights being turned off.\n- I'm not trying to say anything, I'm asking you: How's your team readiness?\n- We're... well, we're doing our best, but...\n- You had training match with your youth division yesterday, right? How that go?\n- 0-0 draw on first half... second half was ended with... - he looks straight at the moon like he wanted to go there then and there -\n\n- Mutual walkover\n\n- Nobody else even here does mutual walkover...\n- Don't worry. We still have match for everything, and then match for honor.\n- You sure? For a hundred, I'll squint an eye.\nThe trainer squints, as though demonstrating how to squint eyes. He draws a hundred Zloty bill.\n- All goals of the away team on first half will be offside.\nRyszard squints even harder to look at the bill in under the moonlight. He walks closer... and pushes away the bill and whispers to him:"
buzzer.27.a: "I meant one hundred in American Dollars."

buzzer.28.t: "Ultra Detectives"
buzzer.28.desc: "An Italian-designed villa, restored the best the Truskoklasy workers could, with gardens, small orchard and 3000 square meters of interior. This is what being a referee in this football-obsessed country brings you. It also helps that the collapse has, well, collapsed the real estate prices, to where renovations were the only price involved in getting here.\n\nRyszard sighed as he returned and kicked back at the garden's lounging bed. Another match, another offside that may or may not have been legitimate, another foul that went overlooked, or perhaps slapped with a red card where yellow would do. Some might question distorting the game, this insult to sportsmanship. Some might question the sanity of making a living off soiling a state obsession.\n\nThose who understand, know that if you wanted those to never be a problem, you should have never made football be about money.\n\nThere is a dance floor before Ryszard's lounging bed, an empty space one can fill with chairs or barbeque or a place to hold a dinner with the press or the team trainers. Ryszard almost made enough to have it be dug into a swimming pool, however. Just like a hearth was a heart of a castle, so was the pool a core of any successful American family. And Ryszard too, could grasp this Polish dream almost, and cheat his way into a simulation of middle class in a country where the term middle class is hollowed out.\n\nThen the door gets kicked down and he jumps on his feet. It's the ultras. The burly, broad dudes, each with supreme muscle mass and enough fat to layer it all, strong as construction workers. No doubt some of them worked on this villa.\n\n- Hey, what do you lot want, you won the game! - the ref stuttered.\n- Did we now? Because we just shook down your bank for your account. And it tells us an interesting story indeed.\n- You brutes! You coaxed out my bank account?! How did you... The prosecutor will hear of this!\n- I bet, because that's exactly where you're going. We have enough for him to bury you in such pile of dung, even a space lizard would wince! You checked our guy at the restaurant for the wire: but the one place you didn't check, was his ass!""
buzzer.28.a: "This evidence stinks. But the ref smells worse."

