buzzer.14.t: "Dear Diary"
buzzer.14.desc: "The Property of Sara Krzeptowska:\n\n'Monday\nUgh, those reforms are the worst! We start with at least two PEs every day. School's already hard as it is, imagine having to listen to what the teachers have to say when you're tired and smelly (of course, the schedule reforms don't include setting up showers for everyone). That hadn't been the problem in the past, as the coaches barely paid attention to girls, but everyone has a hard time. It wouldn't be that bad if we were to play volleyball as we used to when the teachers remembered about us. At least I would be able to get in shape. But, surprise, surprise: now even girls have to play football. Whose idea was that? I don't want to end up with buffed legs.\n\nTuesday\nToday in art class, we were told to create our own logo for a football club. That's cute and all, but aren't we a bit old for this? And there will be a quiz about the already existing logos in the next lesson. I mean, sure, most of them have their names on them, so that wouldn't be that hard.It's hard not to get the feeling that it was all planned at the last minute.\n\nWednesday\nThe football virus got to maths and physics as well. We were told not to use our books. Instead, we got copied exercise sheets. And there we got a task to calculate the surface area of the different types of pitches, the volume of balls, and last but not least, the damn delta of the shot from a penalty shot. The same on the physics - we calculated the energy, velocity, including angular velocity, and angular momentum of the most famous goals, such as those of Maradona or Carlos. This gimmick is getting a bit tiresome.\n\nThursday\nOk, the art teacher modified the logos, so we can't read the names of the teams from them. Bitch. I didn't expect that, so I didn't study, obviously. I thought I at least scored a point on recognizing GKS Katowice, but I confused them with GKS Bełchatów. Oh, well. What's one more F?\n\nFriday\nApparently, there was a planned test about the history of football as well as bonds and beefs between the teams. Apparently, Raków Częstochowa hates everyone, and so does Myszków. It was more difficult to choose who they liked. And there were some easy points like ŁKS and Widzew, so yeah, maybe I'll get a D. Unless Mrs. Piławicz decides to punish me for not knowing about any of Olimpia Truskolasy's relations. But honestly, I doubt she or anyone else knows about them."
buzzer.14.a: "Thank God, for the weekend"

