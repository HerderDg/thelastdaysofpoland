buzzer.18.t: "Ballon d'Cuivre"
buzzer.18.desc: "Truskolasy mayor's daughter is gonna weep today. The one venue for her wedding that would be remotely appropriate for daughter of a petty notable that was raised on notions of being a pre-Fall princess, a local folwark residence, is not available for her wedding. She's gonna have to settle for an open air picnic with a tent, a romantic open-air honeymoon by the lake her only consolation. The folwark is instead a host for the Truskolasy Copper Ball gala, where local football representatives and enthusiasts with sufficient tribute for the host, could vote on the best team, best player, all that jazz. \n\n It might be clear who's gonna get the ball, Olympia was an inevitable frontrunner of this backyard Ballon d'Or, where the walls are almost appropriate, the folwark spacious enough for less than fifty guests and hosting about seventy, and the ball in question still hot from the local smithy. The mayor graciously donated his copper kettle, see, which, under the oldschool smith's hammer, reshaped itself into something of a ball, the ornaments distorted and deformed, but the resolve it represents has never been stronger. \n\n For this self-congratulating farce is a microcosm of future triumphs, future gold, future greatness. There was no doubt in Brzęczek's mind, this is a stepping stone to greatness, and the way it was organized, a stutter step. So long as the vodka flew, moonshined from the most recent potato harvest, it mattered little anyway. If there is truth in wine, there is denial and suppression in vodka, which is even better."
buzzer.18.a: "And the winner is... Olimpia Truskolasy!"

