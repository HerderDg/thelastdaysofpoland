 ##Ideas##
BRZ_gusto: "Gusto"
BRZ_minova_arnall: "Minova Arnall"
BRZ_kojnia: "Stadnina 'Cwał'"
BRZ_erg_klobuck: "ERG Kłobuck"
BRZ_lewiatan: "Lewiatan"
BRZ_maskpol: "MASKPOL"
BRZ_maskpol_mio_initial_trait: "Tactical Gear Producer"
BRZ_mio_huta_name: "Zjednoczenie Hutnictwa Żelaza i Stali"

BRZ_victory_fervor: "Victory Fervor"

BRZ_defence_of_czestochowa: "Defence of Częstochowa"
BRZ_crosses_crosses_everywhere: "Crosses, Crosses Everywhere"
BRZ_tiki_taka_idea: "Tiki-Taka"
BRZ_total_football: "Total Football"

BRZ_legacy_of_pzpn: "Legacy of PZPN"
BRZ_legacy_of_pzpn_desc: "There has been no organization as damaging to football within our nation, and Jerzy Brzęczek's career for that matter, as the Polish Football Association (PZPN). This corrupt clique of the sport's dinosaurs has influenced every facet of the beautiful game, leaving a whole generation of players and coaches to rot under the ideas of the \"Polish Training Thought\". Nearly our entire pool of talent has been brought up under this system, stifling any form of creativity and technical skill. Unless we dip into uncharted waters and fully reform our approach to football, we are bound to forever remain in mediocrity."
BRZ_nothings_wrong_poles: "Nothing's Wrong, Poles"
BRZ_nothings_wrong_poles_desc: "Years of defeat and disappointment have created a unique mentality within the average Polish football fan. While a typical Janusz loves to complain, he will stick by the team no matter what, turning out in full force for every match, usually sat on a couch in front of his aging TV with a beer in his hand. Ever the conformist, we can expect little to no meaningful resistance to our plans from the majority of the population, even if the times truly get desperate."
BRZ_bandit_hooligans: "Ultras on the Streets"
BRZ_ultras: "Ultras on the Streets"
BRZ_bandit_hooligans_desc: "You can never truly feel safe wandering the streets of ZWKT-controlled cities, as raving bands of Ultras representing each of the teams active in our territory regularly harass the populace, approaching selected citizens, demanding they state their club affiliation, and beating or robbing them upon hearing a wrong answer. And when they're not busy terrifying the people, they fight amongst themselves, leaving us to deal with any collateral damage. With each day that we fail to find a permanent solution to their violence, our towns burn with the fire of a thousand flares."
BRZ_hooligan_raids: "Hooligan Raids"

BRZ_locker_room_cleaning: "Cleaning the Locker Rooms"
BRZ_locker_room_cleaning_desc: "Every conquered warlord leaves something useful behind: rifles in police armouries, trucks in municipal depots and football equipment gathering dust beneath collapsed grandstands. ZWKT recovery teams descend upon abandoned locker rooms, stripping them of balls, nets, kits, medical supplies and anything else that can still survive another season. Nothing is too worn to be reused and no club badge is sacred. The former owners may call it looting, but here, it is simply responsible transfer policy conducted without a fee."

BRZ_zwkt_political_idea: "ZWKT Political Board"
BRZ_zwkt_political_idea_desc: "ZWKT Political Board governs like the executive committee of a provincial football association: endlessly debating regulations, appointments and who deserves the best seat in the grandstand. Every decision must pass through former coaches, local sponsors, union men and veteran activists who all believe themselves indispensable. The system is slow, quarrelsome and often absurd, yet it gives Truskolasy a strange form of stability. Everyone has a vote, everyone has a grievance, and nobody wants to abandon the club before the final whistle."

BRZ_legacy_of_pzpn_3: "Erasure of PZPN"
BRZ_legacy_of_pzpn_3_desc: "The old federation once ruled Polish football through committees, licences, disciplinary panels and gentlemen who always seemed to know the result before kick-off. Its symbols are now being torn down, its archives opened and its former officials driven from public life. Truskolasy will no longer accept orders from distant offices or bow before another collection of untouchable bosses. The PZPN model is to be erased entirely, leaving behind only cautionary tales, yellowing match reports and the eternal suspicion that the referee had been bought."

BRZ_white_red_academy_idea: "White-Red Academy"
BRZ_white_red_academy_idea_desc: "The White-Red Academy trains more than footballers. It raises a new generation to run, fight and think as one team beneath the national colours. Children learn pressing, discipline and patriotic songs before they learn the names of foreign capitals, while promising players are watched as carefully as future officers. The methods are harsh, but every muddy village pitch is treated as a potential Maracana. Somewhere among the cones, cracked goals and shouting coaches, Truskolasy hopes to discover its own Boniek, Deyna or Lewandowski."

BRZ_bandit_hooligans_3: "Ultras in the Uniforms"
BRZ_bandit_hooligans_3_desc: "The men who once travelled in packed buses to away matches now march in military columns. They still proudly wear their colors, but baseball bats have given way to rifles and stolen police shields bear freshly painted club logos. Years of street warfare taught them loyalty, intimidation and how to move through hostile district without losing formation. Officers may sneer at their chants and crude discipline, yet few regular soldiers can match their aggression. In Truskolasy, ultras section has become a barracks, and every campaign feels like another dangerous away fixture."

BRZ_untamed_hooligans_1: "Violent Streets"
BRZ_untamed_hooligans_1_desc: "The streets belong to whoever can gather the largest group, shout the loudest and strike before the police - or what remains of them - arrive. Rival supporters settle disputes with stones, knives and improvised flares, while neighbourhoods are marked by club colours like old tribal borders. Match days merely give the violence a timetable. Without firm leadership, every insult may become a riot and every defeat a night of smashed windows. Our people may love football, but too many now remember only the hatred surrounding it."

BRZ_dinosaurs_in_club_managements_1: "Management Fossils"
BRZ_dinosaurs_in_club_managements_1_desc: "Polish football has always had men who could survive relegation, bankruptcy, ownership changes and several criminal investigations without ever surrendering their office keys. These living ghosts still haunt local clubs, speaking of tradition while hiring cousins, rewarding loyal agents and blaming every failure on the weather or the referee. They know every loophole and every handshake, but nothing of modern training or administration. Until they are removed, Truskolasy's institutions will remain trapped in the era of draw with England on Wembley, muddy pitches and unpaid player bonuses."

BRZ_decadent_footballers_1: "Pitch Celebrities"
BRZ_decadent_footballers_1_desc: "Our best-paid footballers have begun to mistake local fame for actual greatness. They treat training sessions as optional, tactical meetings as personal insults and defeats as unfortunate failures of the supporting cast. They arrive in expensive cars, leave before the supporters and preserve their strength for banquets, nightclubs and promotional appearances. When the match becomes difficult, resolve disappears faster than their agents after relegation. These men possess talent, but talent without hunger produces little beyond impressive photographs and another season of wasted potential. We can't miss out on another golden generation..."

BRZ_thousand_stadiums_program: "Thousand Stadiums Program"
BRZ_thousand_stadiums_program_desc: "No settlement is too small, ruined or strategically irrelevant to receive its own football ground. Under the Thousand Stadiums Program, fields will be levelled, terraces raised and floodlights assembled from whatever pylons remain available. Some stadiums seat thousands; others consist of two benches, a crooked fence and a changing room in a former bus stop. Their quality matters less than their presence. Every pitch is a centre of recruitment, propaganda and community life, proving that wherever Truskolasy plants goalposts, civilisation has officially returned."

BRZ_defunding_disciplines: "The Only Sport"
BRZ_defunding_disciplines_desc: "Basketball wastes perfectly good halls, athletics encourages people to run without a ball and volleyball remains suspiciously popular despite producing no proper tackles. The conclusion is obvious: public resources must no longer be scattered among lesser disciplines. Their facilities, coaches and youth programmes will be absorbed into football, the only sport capable of uniting village patriots, drunken supporters and ambitious officials under one banner. There may be complaints from former champions, but they will soon learn that every court can become a pitch with sufficient determination."

BRZ_defunding_disciplines_fund: "The Only Sport's Central Fund"
BRZ_defunding_disciplines_fund_desc: "Declaring football the only sport was inexpensive. Maintaining its monopoly is not. Stadiums require repairs, academies demand equipment and every local chairman insists that his club represents a uniquely vital national interest. To prevent the entire system from collapsing beneath unpaid bills, the state has created a central fund financed through taxes, confiscations and increasingly imaginative accounting. The burden is considerable, but abandoning the project would be unthinkable. After all, one cannot proclaim football supreme and then refuse to pay for new nets."

BRZ_zwkt_tm: "ZWKT(TM)"
BRZ_zwkt_tm_desc: "Since today, ZWKT is no longer merely an association, movement or governing body. It is a protected name, registered symbol and carefully managed identity. Scarves, shirts, badges, mugs and commemorative match balls now carry the official mark, while unauthorised vendors are pursued with greater enthusiasm than many enemy patrols. Supporters are encouraged to express their loyalty through licensed purchases at approved prices. What began on muddy local pitches has become a brand, and the brand must remain consistent, recognisable and, above all, profitable."

BRZ_zwkt_enterprise: "ZWKT Inc."
BRZ_zwkt_enterprise_desc: "The transformation is complete. ZWKT now operates clubs, stadiums, academies, media channels, transport services and an expanding catalogue of branded merchandise. Match results remain important, but quarterly reports have acquired an almost sacred authority. Coaches speak of market value, officials discuss territorial expansion as investment and supporters are reclassified as a dependable consumer base. The enterprise promises efficiency and professional management, though critics note that no one can clearly identify where the association ends, the corporation begins or the government still exists."

BRZ_goal_diggers: "Goal Diggers"
BRZ_art_of_the_deal: "Art of the Transfer Deal"
BRZ_buyout: "Failing Clubs Buyout"
BRZ_dropthem: "Survival of the Fittest"

BRZ_traditional_football: "Polish School of Football"
BRZ_traditional_football_desc: "The Polish School of Football rejects foreign complexities in favour of eternal truths: defend deep, clear the ball and send a hopeful laga toward the tallest man available. Crosses are delivered in industrial quantities, usually beyond every attacker, while possession is treated as a dangerous temptation best surrendered quickly. Matches become muddy struggles of second balls, accidental rebounds and heroic suffering. It may not be elegant, modern or consistently effective, but no other system produces such authentic memories of scoreless draws beneath freezing November rain."
BRZ_conservative_football: "Conservative Football"
BRZ_conservative_football_desc: "Victory begins by ensuring that nothing happens. Our defensive lines withdraw into a modern Defence of Częstochowa, closing every corridor and inviting opponents to exhaust themselves against disciplined obstruction. Italian catenaccio provides the foundations, though a few carefully rationed passes have been borrowed from tiki-taka to reassure the intellectuals. Risk is permitted only under exceptional circumstances, usually after the eighty-fifth minute. Critics call it cowardly; we call it responsible governance of space, possession and the fragile possibility of a one-goal lead. Because, two-goal lead...oh, that's too dangerous."
BRZ_revolutionary_football: "Revolutionary Football"
BRZ_revolutionary_football_desc: "Do you want total football? Not cautious football, not sensible football, but football without fixed positions, hesitation or mercy? Every defender must attack, every striker must press and every player must become whatever the match demands. The old formations are swept aside as relics of tactical class society, replaced by permanent movement and collective aggression. There will be exhaustion, confusion and occasional catastrophic counterattacks, but revolutions are never built upon clean sheets alone. The pitch must belong to everyone - or burn beneath those who resist."

# Dynamic Ideas #

BRZ_resource_dynamic_mod: "Demolished Biedronka Markets"
BRZ_truskolasy_industry_mod: "ZWKT Industrial Center"
BRZ_klobuck_training_centre: "Kłobuck Training Center"
BRZ_club_administration: "Local Club Administration"
BRZ_jebac_lks: "Fucking Up ŁKS"

 ##First Tree##

BRZ_first_whistle: "First Whistle"
BRZ_first_whistle_desc: "When the collapse of Poland opened Pandora's Box, every ideology under the sun spewed from it. With the urban folk splintering themselves, one declaring their loyalty to the anarchists, the next one to the militarists, yet another to the church, the peripheral towns of Truskolasy, Kłobuck, and Krzepice laid huddled together, awaiting their eventual conqueror with bated breath. In a twist of fate, they would instead find themselves on the national stage through the work of Jerzy Brzęczek. What began as a passion project aiming to rekindle the failed coach's career in his boyhood team ended up spiraling into the foundation for a new statelet. On every step of his journey, he saw the sheer desperation and plight of his brethren. Unable to leave them to suffer, he took the reins of power, styling himself as the Supreme Coach and quickly consolidating the neighboring territory in an effort to provide for those struggling to get by. And so, the ZWKT stands alone in the middle of the storm that engulfed Poland, two goals leading them towards the light - one of personal glory and one of the common good. It remains to be seen whether the washed-up Brzęczek can ensure either of them."
BRZ_representing_olimpia: "Representing Olimpia Truskolasy"
BRZ_representing_olimpia_desc: "Besides a simple pitch, long overgrown since the German invasion halted all lower leagues within the country, not much remains of the Supreme Coach's boyhood club; the team in which he took his first steps as a player relegated merely to an old memory. An outsider's eye would most likely not even be able to recognize that anything of note used to stand here. One day, football will return to Poland, reaching greater heights than ever before, and this humble town will witness it all firsthand, with the name Olimpia Truskolasy spoken in the same breath as European powerhouses. But, until then, we need to restore it to an operational state, so that soon football can be played here once more, just like in those good old times."
BRZ_national_football_team: "National Football Team"
BRZ_national_football_team_desc: "Over its hundred years of history, our national team has failed time and time again to reach its full potential, save for a single blip of form nearly half a century ago. From top to bottom, every element of the game has been stifled by corruption and outdated training methods. As such, we have never truly been able to compete against the continent's elite, content with beating second-rate sides and celebrating not tournament triumphs, but even at times mere qualifications. In a way, the Fall was a blessing, ridding the nation of harmful entities, such as the PZPN, and allowing football to truly be born anew, finally without the restrictions of the establishment. With the brilliant mind of our Supreme Coach at last free to shape the sport according to his will, we'll ensure that Poland takes its rightful place among the world's greatest."
BRZ_first_appointments: "First Appointments"
BRZ_first_appointments_desc: "Now that the facilities are finally in working order, we're ready to get the team up and running. With most of our former contacts having fled the country at the first rumors of instability and many of those who stayed effectively missing, we'll have to resort to less sophisticated methods of recruitment. It's time to blast the territory of ZWKT with flyers, billboards, and ads. If you have any footballing experience and are at least remotely in shape, try out for the team and we'll do everything in our power to accommodate you. Sure, the quality of the vast majority of these players is bound to be questionable, but over time, hopefully, we should be able to attract some actual talent."
BRZ_creation_of_nsfl: "Creation of North Silesian Football League"
BRZ_creation_of_nsfl_desc: "In order to develop, our players need regular match experience. While normally the job of enrolling Olimpia into the local league system would be a simple one, requiring a single phone call to the appropriate office, no such system exists since the nation's splintering. As such, it falls on us to create one from scratch, and luckily, we aren't the only ones looking for someone to play against. At present, a dozen clubs operate across our territory, most of which should be more than willing to compete in the first edition of the planned North Silesian Football League. If they perform well enough, their brightest talents might even earn themselves a chance to represent the ZWKT against other statelets once we re-establish the National Team."
BRZ_klobuck_training_centre: "Kłobuck Training Center"
BRZ_klobuck_training_centre_desc: "Every training session we hold at the current facilities of Olimpia Truskolasy painfully exposes the shortcomings of the crumbling stadium. Each goal-bound shot stopped by the muddy pitch, or twisted ankle from tripping on uneven grass makes a mockery of our claims of professionalism. The only way to move forward is the creation of an entirely new training center - one even the most pretentious members of the old national team couldn't scoff at. We will turn Kłobuck from a sleepy town on the periphery of Jura into the most respected and renowned sporting facility in the country, equipped with everything our players could possibly need. No longer will we have to desperately seek out anyone with even a crumb of talent. We'll make sure any self-respecting footballer knows the only way to meaningfully develop his skills is to flock to our ranks."
BRZ_nsfl_inauguration_cup: "NSFL Inauguration Cup"
BRZ_nsfl_inauguration_cup_desc: "As preparations for the league's launch continue, what better way to generate buzz for the upcoming competition, as well as give our players some much-needed match sharpness than a tournament consisting of some of the region's best teams? The cup will be a celebration of football's rebirth within the region, so let's make sure that when locals put their dusty scarves and jerseys back on after years of disuse, we give them a showing that'll make them begging for more. And whilst the result may be only secondary to the greater significance of the occasion, obviously, the boost from winning some silverware wouldn't hurt either."
BRZ_first_training_camp: "First Training Camp"
BRZ_first_training_camp_desc: "Compared to the conditions our players have gotten used to training in, our newly built facilities are truly state-of-the-art. For all their grandeur, however, they are worthless if there is nobody using them. Luckily, preparations have already been made to bring the best players from all across the ZWKT to Kłobuck for the first combined training camp. With many of the participants unfamiliar with the Supreme Coach's training methods, it will take a while to get everyone up to speed with their new roles, positions, and tasks on the field. While some may grumble at being forced to rethink their playstyle, having spent their entire careers under one system, it is a necessary step if we are to ever compete on the national stage."
BRZ_match_liswarta_krzepice: "Match with Liswarta Krzepice"
BRZ_match_liswarta_krzepice_desc: "Our upcoming opposition - Liswarta, represents everything wrong with pre-Fall Poland, a relic of the times gone by. Staunchly conservative, their following has long served as a center of resistance to our governance, aiming to undo the majority of Brzęczek's policies and return the ZWKT to the 'tried and tested methods' that brought it to ruin in the first place. Despite their foolishness, this decisive stance resulted in a wave of support coalescing around the team, which could pose a threat if left unchecked. What better way to show the inferiority of their beloved methods than to crush them on the pitch? A good result should be able to bring a sizable number of their fans back into our camp."
BRZ_match_znicz_klobuck: "Match with Znicz Kłobuck"
BRZ_match_znicz_klobuck_desc: "Next up - we face perhaps the most troublesome team in the league. Znicz Kłobuck has always been a gathering ground for the nationalist crowd, their ultras having a reputation of vicious vigilantes, patrolling their city and violently eliminating any signs of 'anti-Polish activity' ... which seems to include supporting other clubs or really anything the hooligans appear to dislike at that moment. At times, even the opposition players couldn't consider themselves safe, and it seems unlikely that Brzęczek's authority would prove enough to guarantee there is no blood spilled during or after the match. Therefore, the plan is simple - beat them hard enough to demoralize them and get the hell out there as quickly as possible."
BRZ_truskolasy_leading_role: "Truskolasy Leading Role"
BRZ_truskolasy_leading_role_desc: "There is only one club worthy of winning the NSFL and there is only one coach worthy of lifting its' trophy. It is crucial to the entire foundation of our state that the first edition of the league is won by Olimpia Truskolasy. After all, how can we build the mythos of a tactical mastermind able to erase the generational shame brought by Polish football, who could finally make us able to compete with Spain, Germany, and even the damned Portuguese if we can't even beat a bunch of farmers from some village in the middle of nowhere? No matter the results against our rivals, we must ensure that this title goes to us one way or another. If we failed on the pitch, we might need to pull some additional levers to prevent any embarrassments."
BRZ_strike_force_of_truskolasy: "Strike Force of Truskolasy"
BRZ_strike_force_of_truskolasy_desc: "The Polish anarchy is a lawless land, and while we strive for peaceful co-existence, the same cannot be said about the various warlord statelets surrounding us. Despite our initial reluctance to admit it, our government simply has no chance to survive without a functioning defense force when our neighbors move to reunify the nation once the stalemate breaks and fighting resumes. One way or another, we'll have to draw into our resource and manpower pools and create an army that could stand toe-to-toe with anyone who dares try to conquer Truskolasy, lest we become merely another footnote in the story of someone else's glorious conquest."
BRZ_issue_preparations_in_clubs: "Issue Preparations in Clubs"
BRZ_issue_preparations_in_clubs_desc: "There will be a day when war comes to Truskolasy. When it does, we need as many capable combatants as we can muster to even have a chance at offsetting the population advantage our neighbors hold over us. Therefore, our continued survival depends upon the ability to mobilize our people into combat. To ensure this, from now on, every club will keep a detailed list of their supporters, noting all those who are eligible for enlistment, and maintain a storage of weapons and supplies on their grounds. Each month, selected members will undergo a week of basic training so that when our enemies attempt to invade our lands, the citizens of the ZWKT can take up arms and repel them back across the border."
BRZ_have_faith_in_hooligans: "Have Faith in Hooligans"
BRZ_have_faith_in_hooligans_desc: "If we can't pacify them, why not utilize them instead? We could kill two birds with one stone and get the Ultras off our streets, unleashing their fury on our enemies. While most recruits quiver in their boots at the mere mention of frontline action, these fanatics will seek out combat on their own, forming some of the most ruthless and brutal units this region has ever seen. All it would take is giving the hooligans a share of the spoils and free reign to deal with our foes as they please. Surely it won't hurt us too much to turn a blind eye to their conduct from time to time."
BRZ_professional_fighting_squads: "Professional Fighting Squads"
BRZ_professional_fighting_squads_desc: "Bar none, early reports from the training fields all reach the Supreme Coach's desk with one conclusion: in their present state our militias are completely unsuited for any combat activity and fully expected to crumble against any competent military force. The Znicz sector estimates that their units would be able to hold the line for a few hours at most, before being overwhelmed and rendered nonoperational - and somehow that represents one of the more positive evaluations we've received. If we are to have any chance at defending our territory, our current armed rabble must be brought to the standards of a professional army. No more light target practice and jolly chatter with their fellow recruits. From now on the men of the ZWKT will learn the meaning of the word discipline. They'll thank us when it ends up saving their lives on the battlefield."
BRZ_show_of_brutal_force: "Show of Brutal Force"
BRZ_show_of_brutal_force_desc: "It's time to let our dogs off their leashes and release the Ultras onto the lands of Częstochowa. Sowing a bit of panic in the area should be enough to deter the Archdiocese from any attack on our territory, giving us ample breathing room for the next stage of operations. Honoring our pact with the hooligans and letting them run rampant, free from our oversight, should be enough to ensure their loyalty in the coming conflicts. After all, they have no reason to bite off the hand that feeds them."
BRZ_every_man_a_footballer: "Every Man a Footballer, Every Footballer a Soldier"
BRZ_every_man_a_footballer_desc: "The success of our military operations depends on the utmost solidarity between every citizen. The troops on the frontline rely on the continued support of the workers back home, ensuring they can count on an unending supply of equipment. With the need for the adequate supply of our new army requiring backbreaking work to be met, in order to maintain morale, we'll organize the assembly lines of our munitions factories in a way that groups supporters of the same team together, guaranteeing them that the products of their labor go to troops representing their club. That way, the people they toil to supply in combat will no longer be unnamed strangers, but comrades they share the stands with each week."
BRZ_crusade_of_supreme_coach: "Crusade of Supreme Coach"
BRZ_crusade_of_supreme_coach_desc: "Perpetually overlooked and underdeveloped, it didn't take a single German shell to bring our region into complete ruin. As soon as aid from Częstochowa ceased to arrive, the imbalances of the local hierarchy became abundantly clear. While the wealthy seized upon their chance and left, taking their money with them, the regular folk were left to fend for themselves. With no guiding hand, economic activity has been reduced to simply ensuring subsistence, and many couldn't even achieve that. If there is to be any hope for a better tomorrow, Jerzy Brzęczek must find a way to put the territory back on its feet, or else the people's patience towards his leadership may soon run out."
BRZ_destroy_biedronka: "Destroy Biedronka Supermarkets"
BRZ_destroy_biedronka_desc: "For nearly a decade now a fury has raged inside the Supreme Coach's heart, born from a number of defeats against his nemesis - Portugal. Each time he faced them ended with another humiliating loss, further destroying his credibility as a tactical mastermind. Even now, a portion of our enemy remains within our lands, masquerading as one of Poland's most prominent enterprises. They may feel safe for now, but we see through their lies, and we won't rest until the last Biedronka turns to rubble."
BRZ_reopening_erg_klobuck: "Force Reopening of ERG Kłobuck"
BRZ_reopening_erg_klobuck_desc: "For decades ERG has faithfully served the people of Kłobuck, providing the populace with much-needed employment opportunities. Their factories now lie dormant, bankruptcy having halted all production nearly twenty years ago. The vast, empty halls serve as perfect grounds for jump-starting our non-existent industry, re-focusing their production to all kinds of equipment - kits, balls, and the like - goods that are not only necessary within our state but ones that with a bit of luck we could export to other warlords. Under our wing, ERG's new iteration is bound to provide the region with unparalleled wealth."
BRZ_every_school_a_club: "Every School a Football Club"
BRZ_every_school_a_club_desc: "While it may sound tempting to direct the majority of our funds into quenching our need for immediate reinforcements, we must by no means neglect the youngest generation. The sad fact is that despite the country being home to thousands of footballers, most of them are virtually useless, having the technique of a plank of wood. And there are only so many tricks those old dogs can learn. Given that our schools are already unable to perform most of their duties due to material shortages, why not give the children another choice? We shall build an Orlik next to every school and enforce mandatory training for our youngest players. With just enough focus and the right coaches, we will foster a new generation with football firmly in their blood that will finally surpass Górski's Eagles."
BRZ_zwkt_supplies: "ZWKT Takes Over Supplies"
BRZ_zwkt_supplies_desc: "Our seizure of Biedronka left us with vast quantities of goods previously hoarded by the damned company. Thousands within the region starve as mountains of unsold products expire within their countless warehouses just because they couldn't be used to turn a profit. With our newly acquired means, we're finally able to relieve the population of its plight, redistributing the supplies in a great show of our goodwill. The now-empty stores will serve as distribution centers, from which everyday supply trucks will emerge to ensure that no fan ever has to worry about going to bed on an empty stomach, even in the most remote corners of the nation."
BRZ_zwkt_industry: "ZWKT Takes Over Industries"
BRZ_zwkt_industry_desc: "As rumblings of instability began to rock the struggling Polish Republic, foreign capital began to flee the nation, fearful of losing their property and funds in the chaos of unrest. As a result of this exodus, the majority of factories and warehouses find themselves abandoned, their ownership unclear as a result of numerous panic sales. As the sole somewhat legitimate authority within the region, we are well within our rights to requisition these complexes and finally put the people back to work once more. And whilst we can hardly compare ourselves to the industrial powerhouses of Zagłębie, we'll make sure that everything a Truskolasy resident needs can be produced right in his hometown."
BRZ_zwkt_infrastructure: "ZWKT Takes Over Infrastructure"
BRZ_zwkt_infrastructure_desc: "Lacking any major cities, our little corner of the region has always been one neglected by both the central and state governments. As a result, you'd be hard-pressed to find a solitary road with more than a single lane connecting our towns. While this has been enough for the backward life previously enjoyed by our citizens, it's hardly befitting of the grandest up-and-coming footballing center on Polish soil. Now that we finally have the means to develop our lands, we shall remedy this situation and build a truly modern infrastructural foundation, funneling all young players with a dream of a better life right into Truskolasy."
BRZ_introduction_of_clubism: "Introduction of Clubism"
BRZ_introduction_of_clubism_desc: "At last, we have built a state adherent to Brzęczek's vision. Together with the owners, players, and leading supporters of the territory's major clubs, as well as our closest advisors, we are ready to officially sign and codify the principles of our founding ideology - Clubism. A uniting force, encompassing nominal rivals under the single banner of the ZWKT, it allows us to rise above the divisions of class, religion, and, most importantly, team affiliation. We are all brothers, and under the Supreme Coach's benevolent guidance we work for a better future, so that everyone, no matter their standing in life, can share in the glory we'll bring to Polish football."
BRZ_send_envoy_to_lubliniec: "Send Envoy to Lubliniec"
BRZ_send_envoy_to_lubliniec_desc: "It's time. While we can hardly label our uncoordinated band of amateurs as anywhere close to ready to take up the national team's mantle, we simply don't have the comfort of waiting for Brzęczek's methods to slowly mold them into professionals. A storm is about to engulf Poland, and if we don't get going soon, we might just end up missing our only chance at survival. Luckily, the commandoes over in Lubliniec have always been somewhat amicable to our endeavors. If we can get them to assemble a makeshift team, we could technically label the resulting match as our squad's first official international showing. Despite our detractors' claims, we are two separate independent states, after all. We just have to hope they end up accepting our proposal because finding a replacement amongst a sea of bloodthirsty warlords certainly won't be easy."
BRZ_match_day: "Match Day!"
BRZ_match_day_desc: "The fateful day has come. Today, we will write history. Though the quality both on and off the pitch leaves much to be desired, a far cry from the impressive conditions we once so often took for granted, the spectacle about to unfold represents the triumphal culmination of months of our hard work and dedication. We have transformed overgrown pitches and ruined stands into proper stadiums, futureless youths into aspiring footballers, and instilled a newfound hope into the minds of ZWKT's citizens. This day is a celebration of our achievements but also the start of a new wave of challenges. So let's give everyone gathered one hell of a showing because this result will forever stand in the history books, marking the beginning of our journey. The whole region is watching on with bated breath. We better not screw this up."
BRZ_truskolasy_top: "TRUSKOLASY TOP!"
BRZ_truskolasy_top_desc: "Was there ever any doubt? With the Supreme Coach's masterful leadership, we have managed to completely overwhelm the commandoes' defense. If anything, the result does little to portray the sheer scale of the thrashing we gave them, but had we pressed them any harder, it might have become painfully clear that most of our opponents probably hadn't played a proper match in over a decade. Still, a win is a win, and this one feels particularly gratifying. We've shown the whole footballing world that we are not to be pushed around. Now that we've successfully put ourselves back on the map, it's time to hit the training ground and capitalize on our recent momentum. Our future opponents won't roll over quite like those guys did. It only gets harder from here."
BRZ_we_will_get_them_anyway: "We Will Get Them Anyway..."
BRZ_we_will_get_them_anyway_desc: "We... lost. Despite all the preparations, despite facing quite possibly the weakest side in the entire region, we lost. And in what way? They get one lucky goal from a dubious penalty and then park the bus for the entire second half. That's not what we agreed! It was supposed to be our celebration! Instead, we have just added another chapter to the national team's extensive list of shameful defeats. Except this one stings even worse than all the others. Great job lads. We have become the laughingstock of the entire country. Though they've dealt a heavy blow to our prestige, it seems those cheating commandos don't know who they're messing with. Let them cheer their unearned victory, thinking they have bested us. They have crossed us for the last time."
BRZ_demand_submission: "Demand Submission"
BRZ_demand_submission_desc: "Now that the on-field matters have been dealt with, it's time to get back to politics. Kukuła's men have played their part brilliantly but they have since outgrown their usefulness. If anything, some more... ambitious circles within Lubliniec have even started advocating reeling us into their sphere of influence. As if we're just going to let that happen! Their clique has no grander vision; no plan to help the people of Poland. All they would do is sideline us, use us as a source of cheap entertainment while the commandoes fight the real battles. We must put them in their place before such ideas fully take root. Either they'll join us, or we'll have to resort to less pleasant solutions."
BRZ_send_the_hooligans: "Send the Hooligans"
BRZ_send_the_hooligans_desc: "So, they have chosen the warpath. How fitting. While attacking the commandoes head-on would practically be a suicide mission, we do have tools at our disposal to make the task at least somewhat manageable. For a while now, we have kept our bloodthirsty ultras in reserve, but it seems we have no choice but to utilize them. We'll deploy them along our southern frontier, and in the dark of night, they shall wreak havoc in our enemies' formations, destabilizing and softening their defense before our frontline units even have the chance to cross the border. Hopefully, they don't go... too far. We don't want to be seen as ruthless savages."
BRZ_march_on_lubliniec: "March on Lubliniec"
BRZ_march_on_lubliniec_desc: "We're ready. Our southern neighbors are still reeling from our raid. Somehow, the hooligans ended up being too effective, completely decimating their defensive positions in a gruesome show of force and brutality. They're rapidly growing out of control and might soon have to be curtailed, but for now, we have to capitalize on the carnage they've created. Before the commandoes have any chance to rally their forces, we will march on Lubliniec, our glorious advance illuminated by the blinding glow of a sea of flares. Given that they're practically at our mercy, hopefully, they lay down their arms and don't end up giving us too much trouble. Regardless of their current sorry state, their units are still battle-tested professional battalions. If they see through our tricks, things might get messy."


##Second Tree##
BRZ_lubliniec_training_camp: "Lubliniec Training Camp"
BRZ_lubliniec_training_camp_desc: "Ladies and gentlemen, we're pleased to announce that the prestigious city stadium in Lubliniec is on its way to becoming the heart of our nation. Here, our military representation will be forged and march for the glory of the Polish nation and Polish football. Here, the veterans will train the new blood that will march for glory gained in battles against those who want to challenge our team. I think I can say for all that we were bustling with excitement about the future of our representation. The Supreme Coach is calling for the new cadre grouping as we speak."
BRZ_military_gear: "Professional Military Gear"
BRZ_military_gear_desc: "A brand-new cadre requires brand-new gear. If our team is to succeed against the growing number of opponents, it will require new weapons, methods of transportation, and support equipment. Thankfully, our boys can find what's needed in the armories of defeated commandos of Lubliniec. Yet there are worries that the new equipment will reflect the football spirit well. That is why the artists associated with ZWKT are enriching the equipment's design to make it more familiar and more palatable to our military team. While some complain about the negative aspects of bright stickers, logos, and graffiti, we know the importance of the proper presentation."
BRZ_officer_fans: "Officers are Football Fans Too"
BRZ_officer_fans_desc: "One of the best qualities of the rule of the club association is how our cause flies over the borders without a single shot or strike; The love and passion for football unite the whole nation. That is why, as the word spreads about our mission, more will come to join our fight. In the meantime, we can count on our opponents to join us as a sign of good sportsmanship. Want some proof? General Michał Strzelczyk and Colonel Wojciech Danisiewicz have recently agreed to join our military team to lead our troops and instruct the willing commanders in the art of war. With them, the pride of Polish football will shine on the battlefield just as it shines on the pitch."
BRZ_long_distance_shot: "Long-Distance Shot"
BRZ_long_distance_shot_desc: "Long balls have been a trademark of our football strategy ever since Robert Lewandowski entered the pitch. It's only natural to translate, to adapt this doctrine of our military. Our opponents must ready themselves for the hailstorm of missiles that will rain upon them with superb precision -  all thanks to the stockpile we found at the Lubliniec armories. Speaking of which, we're pleased to inform you that Sparta Lubliniec, an A-class team, and Unia Kalety qualified for the upcoming season in the North Silesian Football League."
BRZ_jurassic_hooligan_fights: "Jurassic Hooligan Fights"
BRZ_jurassic_hooligan_fights_desc: "It has come to our attention that the hooligans, ever eager and too impatient to wait for the proper fight, have crossed the border and begun harassing a military outpost belonging to the Republic of Jura, causing widespread terror and confusion among the soldiers, who swore allegiance to Jarosław Gowin.\nThe president of Jura demands action from Jerzy Brzęczek to put a stop to those skirmishes, but the Supreme Coach denies involvement or control over the hooligans, who only seldom listen to his advice and charisma and are usually independent agents. Few believe that after what happened with Lubliniec."
BRZ_warta_zawiercie_match: "Match with MKS Myszków"
BRZ_warta_zawiercie_match_desc: "Once again, the hooligans, who drove forward deep in the opposition half, were cooperating with Brzęczek to methodically weaken the Republic of Jura. Despite those obvious connections, Jarosław Gowin hesitated with punitive action, waiting for a real kick-off from Brzęczek, who wasted no time. Now the Coach is leading his legions now officially into the neighbouring country to smite those who want to harm Polish football. What can we expect from the Jurassic team? Probably, due to chaotic leadership, their troops will default on a stalwart defense. It will be a long, if a bit dull, match."
BRZ_incorporation_of_jurassic_clubs: "Incorporation of Jurassic Clubs"
BRZ_incorporation_of_jurassic_clubs_desc: "With each victory, our football family grows. Now, in the North Silesian League, we can expect the inclusion of Pilica Koniecpol, who once outclassed Unia Kalety and MKS Myszków, an underrated gem and pride and joy of Częstochowian football in my opinion. That should create a very interesting dynamic between the clubs already integrated within our organization and provide us with many memorable, emotional moments that, I think, we all look forward to with great anticipation."
BRZ_role_of_civilian_administration: "Administration Lessons"
BRZ_role_of_civilian_administration_desc: "As we expanded in what was a properly administered, democratic state, the imagination of Jerzy Brzęczek grew more vivid than ever. Trying to pick up a few things from the regional bureaucrats, often integrating them into our team, he hopes to be able to govern the land outside the pitches and stadiums. And as of now, it seems to be working. With the new staff of statesmen that clings to him due to the lack of knowledge about the ins and outs of the football world has allowed him to expand his power base and make him more independent from local football officials and hooligan gang leaders, effectively centralizing his power. A small but vocal minority of fans have already expressed their dissatisfaction about this turn of events."
BRZ_pilgrimage_to_czestochowa: "Pilgrimage to Częstochowa"
BRZ_pilgrimage_to_czestochowa_desc: "Though we've long avoided their threatening gaze, we have no choice but to face our mighty eastern rival. Despite our recent advancements, the Archdiocese still sees us as a relatively weak target, so if we don't strike first, we might soon end up fighting the brunt of their overwhelming force. While the Archbishop's inner circle likely won't be keen to tie the future of their state to the result of some amateur football match, we'll present them with an offer simply too good to pass up. They're well aware of the strength of their team and the weakness of ours. They think their victory would be all but assured. If we promise to fully surrender our sovereignty in case of a loss, they're bound to throw all caution to the wind and agree to a deal. Their hubris will be their ultimate undoing."
BRZ_rakow_czestochowa_match: "Match with Raków Częstochowa"
BRZ_rakow_czestochowa_match_desc: "There's no backing down now. While the current pitiful state of the once-mighty Raków poignantly represents our country's ruin, the team still stands as the most recognizable and respected club in the entire region. Even without their star players and million-dollar transfers, the former national champions' rump squad is nothing to scoff at, especially when compared to our own. Through its sheer fame and notoriety, Raków still effortlessly attracts Jura's top talents, leaving us to deal with their unwanted scraps. If we are ever to break their monopoly, this might be our only chance. One thing is beyond doubt - in this match, we're going to be massive underdogs. The ZWKT's entire existence depending on the outcome doesn't help either. We'll need a near-perfect performance, a good deal of luck, and any advantage, legal or not, that we can possibly get. The coming 90 minutes will be the most stressful in the Supreme Coach's whole career, but with the right approach, we might be able to pull through. If not, going back on our agreement with the Archdiocese won't be so simple."
BRZ_incorporation_of_czestochowa_clubs: "Incorporation of Częstochowa Clubs"
BRZ_incorporation_of_czestochowa_clubs_desc: "We've done it! The footballing giants of Częstochowa lie at our mercy, and now, to the victors, the spoils shall go. The incorporation of Raków and Skra should, in itself, not be that difficult of a task; at least the city's previous government had the right mind to leave the teams largely untouched by its ideology. The real question is, just how much of their squads do we keep for ourselves in the process? Even in its reduced state, Raków is bound to remain a fearsome rival. If we fail to cut them down to size, they'll likely run away with the NSFL title. As tempting as it may sound, fully stripping them for parts is also out of the question. It seems no matter what approach we decide on, some group is bound to be displeased. It's just a matter of who, if anyone, we can currently afford to piss off."
BRZ_role_of_church: "Mass and Match"
BRZ_role_of_church_desc: "The Church's role in our country's downfall is undeniable. Left unchecked, it wraps its greedy tendrils around the governing apparatus, and we have no doubts that should we ever lose our vigilance, it would do the same to us. Though ideally, we'd sideline the religious authorities entirely, our core base of supporters is known to be quite... god-fearing in its own perverted way. Despite acting in complete defiance of all Christian values, the ultras constantly surround themselves with performative displays of their supposed piety and regard the faith as one of the main pillars of their creed. If we make any moves against the religious establishment, their ravenous mob is all but guaranteed to riot. It seems we have no choice but to let the Church be, albeit with a degree of state control. If they want to bless our players to ensure 'divine favor' before every match, so be it. Having to maintain fake cordiality is a small price to pay for internal peace."
BRZ_away_game_in_zaglebie: "Away Game in Zagłębie"
BRZ_away_game_in_zaglebie_desc: ""
BRZ_mugged_supplies: "Mugged Supplies"
BRZ_mugged_supplies_desc: ""
BRZ_take_away_whatever_you_can: "Take Away Whatever You Can!"
BRZ_take_away_whatever_you_can_desc: ""
BRZ_czestochowa_minerals: "Częstochowa Mineral Deposit Area"
BRZ_czestochowa_minerals_desc: ""
BRZ_gusto_factory: "Expand Gusto Candy Factory"
BRZ_gusto_factory_desc: ""
BRZ_solar_stadiums: "Solar Stadiums"
BRZ_solar_stadiums_desc: "We need electricity to power our stadiums; however, how do we produce it efficiently and near the stadium? Coal? If you want to not be able to see the players, then sure, but I want to watch it, so no. Wind? What if somebody kicks the ball too high? Atom? Don't make me laugh. The only thing that remains is solar energy. It doesn't really have any downsides and is fairly cheap to implement. Due to this, the ZWKT has decided to put solar panels on every stadium to power them, reducing the chance of a blackout and supplying the local population with energy."
BRZ_nationalization_xkom: "Nationalization of x-kom"
BRZ_nationalization_xkom_desc: ""
BRZ_seize_other_stadiums_and_arenas: "Seize Non-Football Stadiums and Arenas"
BRZ_seize_other_stadiums_and_arenas_desc: ""
BRZ_railway_to_truskolasy: "Extend a Railway to Our Capital"
BRZ_railway_to_truskolasy_desc: ""
BRZ_water_sources_of_jura: "Water Sources of Jura"
BRZ_water_sources_of_jura_desc: "Jura doesn't have a lot of resources. You might occasionally find something more rare than stone, but ultimately there is much more stone than any valuable rare minerals. However, there is still one resource which we, humans, need to live. Water. Jura is home to giant water deposits, ones which are easy to extract. Due to this, the ZWKT has decided to create deep wells in the region, decreasing the price of water and decreasing the chance of a shortage. The investment also gave many people jobs, something everybody needs."
BRZ_new_isotonic: "New Isotonic Drink for our Soldiers"
BRZ_new_isotonic_desc: "Our footballers need the best to do their best, and we have to give them only the best. The water in Jura is exceptional for the production of isotonic drinks, so the ZWKT has decided to create factories producing these drinks for both our soldiers and footballers, increasing their efficiency both in the field and on the battlefield. Unfortunately, it cost a lot to build these factories, but the results vastly overshadow the costs."
BRZ_combine_steelworks: "Combine Częstochowa and Dąbrowa Steelworks"
BRZ_combine_steelworks_desc: "What do Częstochowa and Dąbrowa Górnicza have in common? If you answered nothing, you would be wrong, as actually they both have a steelworks. Huta Częstochowa and Huta Katowice are the biggest metallurgical complexes in our country, so the Supreme Coach decided to combine them into one company to improve their production. The results can already be seen, as both steelworks began operating with increased efficiency."
BRZ_antifa_football_section: "Antifa - Football Section"
BRZ_antifa_football_section_desc: "What do you associate with Antifa? Did you answer antifascism, communalism or warfare? Well, while you are right, there is another thing about it - it has a football team. The Antifa members fight very well against fascism, and after we told them their enemies are fascists, they managed to win every single match. The ZWKT has decided to integrate some of their talents into Olimpia Truskolasy to strengthen it, and they should now win much more often."
BRZ_coach_buses: "Coach Buses for Away Games"
BRZ_coach_buses_desc: "While a football team stays in their stadium most of the time, there are times when it needs to play with other teams. Until now, our teams have walked to the other clubs; as we conquer more territory, it becomes more obvious that we need actual buses to transport our brilliant players to achieve the best result. Fortunately, there are many buses in our country just waiting to be stole-, I mean, nationalized and put into proper use. Their owners will surely not mind."
BRZ_first_away_battalion: "First Away Battalion"
BRZ_first_away_battalion_desc: ""
BRZ_seize_pyrzowice_bases: "Seize Pyrzowice Private Operational Bases"
BRZ_seize_pyrzowice_bases_desc: "The airport in Pyrzowice has many private operational bases. Why should they be private? They would help the war effort massively, especially the planes in them. The ZWKT thought so too, and decided to seize them. The planes in them will finally do something instead of sitting in the hangars, and that something will be bombing civil-, uh, I mean fighting with our enemies."
BRZ_transform_m1: "Transform M1 Czeladź into a State Trading Center"
BRZ_transform_m1_desc: "M1 Czeladź is a place well representing bloodthirsty capitalism. The profits from there went straight to the safes of billionaires, while the people working there received a meager cut of what they should have gotten. This ends now - the ZWKT has nationalized M1 Czeladź and transformed it into a state trading center, so that the people working there can finally receive their cut, while the state will use the trading center."
BRZ_unia_dg_match: "Match with Unia Dąbrowa Górnicza"
BRZ_unia_dg_match_desc: "Unia Dąbrowa Górnicza - yet another little team, one we could crush with one finger. To show them how good we are, the ZWKT has sent a request to play a match with them. Victory with such a weak team should be easy, and post-victory fervor will definitely make fighting in that urban jungle, also called Dąbrowa, easier."
BRZ_zaglebie_sosnowiec_match: "Match with Zagłębie Sosnowiec"
BRZ_zaglebie_sosnowiec_match_desc: "Down in Zagłębie, there are three major teams, but today we will concentrate on one - Zagłębie Sosnowiec. To show our superiority over them, the ZWKT has sent a request to them to play with our great teams, which they will surely lose. After the matches, the Supreme Coach plans to invade Sosnowiec using the fervor from the won match."
BRZ_szczakowianka_jaworzno_match: "Match with Szczakowianka Jaworzno"
BRZ_szczakowianka_jaworzno_match_desc: "Szczakowianka Jaworzno. Have you ever heard of that team? My answer is no, as literally nobody except Jaworznians has heard of them. However, the ZWKT has decided to play with them, as we plan to play with every major team in Zagłębie, so they shouldn't feel excluded. Victory should be easy, and it should boost our people's spirits."
BRZ_political_training: "Political Training"
BRZ_political_training_desc: "Sosnowiec was the most organized country in the entire Zagłębie region, and frankly, we might have a lot to learn from it. Our current administration is in shambles, while our country operates on a few agreements, which could be broken at any point. That's why the ZWKT has decided to adopt some parts of Sosnowiec's bureaucracy into the government and to use its systems to improve the efficiency of our bureaucracy."
BRZ_ideological_training: "Ideological Training"
BRZ_ideological_training_desc: "Unfortunately, there are still many people who don't follow our ideology in our lands, and our traditional methods don't really work on them. However, with our recent conquest of Dąbrowa Górnicza, we have discovered many ways to convert people to our cause, even if some are a bit inhumane. The ZWKT has decided to use them in our prisons, but we still have to see the result. "
BRZ_communal_training: "Communal Training"
BRZ_communal_training_desc: "A football team is one big organism. They have to play as a team, or else they will lose. Unfortunately, some of our players don't understand it, resulting in them running to the goal without passing, often losing the ball, and making our team weaker than it could be. However, there is a cure for it. Antifa Jaworzno has managed to make people create communes where they worked for each other, and their approach should work here too. We must show the people that without others, they are nothing."
BRZ_incorporation_of_zaglebie_clubs: "Incorporation of Zagłębie Clubs"
BRZ_incorporation_of_zaglebie_clubs_desc: "Zagłębie is home to many clubs, such as Unia Dąbrowa Górnicza, Zagłębie Sosnowiec, or Szczakowianka Jaworzno. After our conquest of Zagłębie, these clubs fell under our jurisdiction, and we can't let these hidden gems remain hidden; that's why the ZWKT has announced that these clubs will be integrated into our league, and they will compete with our teams on equal terms."
BRZ_woes_of_football: "Woes of the Polish Football"
BRZ_woes_of_football_desc: "Polish Football was once at its low. The management squandered money, the team continued falling, and the activists continued to steal. Fortunately, Brzęczek, our Supreme Coach, stepped in and stopped the collapse, but its effects can still be felt. While the ZWKT continues fixing these problems, there is still a lot to be done."
BRZ_victory_cup: "Victory Cup"
BRZ_victory_cup_desc: "The ZWKT has made a new cup - the Victory Cup - to celebrate our massive victories in Zagłębie-Jura and bringing us closer to reunification, as well as the tremendous improvement of our teams. The first match is going to start today, and this cup will last a few days until the best team, or Olimpia Truskolasy, wins."
BRZ_dreams_of_champions_league: "Dreams of Champions League"
BRZ_dreams_of_champions_league_desc: "BREAKING NEWS! Lewandowski, the best player in the Third Polish Republic's football team, has arrived in our country and plans to stay here for longer. The ZWKT will personally meet him, and perhaps they will even let him join it, although that is very unlikely."
BRZ_new_season: "New Season"
BRZ_new_season_desc: "Zagłębie-Jura is ours. Our football teams have never been stronger. Finally, we can rejoice and play football in peace. Since we have control of the entire region, the ZWKT has decided to end the current cup and start a new one. Finally, a new season has started, and we don't yet know what it will bring, except that it's going to make Polish football great again."



