buzzer.35.t: "The Long March of Polish Football"
buzzer.35.desc: "Parallel to the story of the Polish state and its downfall, lies the sordid story of the Polish football's tactics. Diseased by corruption and national complexes, our tactics foremostly suffered from lack of confidence, compounded by each defeat and managerial change. Even Smuda's otherwise sound doctrine was mired in this: It assumed technically superior opponent, and fell into excessive defence as soon as the opposition was severe. \n\n The logical consequences of the national anxiety crystallised in last years before the Fall: Częstochowa Defence, where you bus the entire team, yes, the entire team on your half of the pitch to saturate the field. The uniquely Polish 'centrostrzał', lit. center-shot, shot from the flanks of the pitch: Comes across as a pass to the center, but instead results in a goal with the coming together of technique, wind, and inattentive keeper.\n The Laga, born of anxiety about midfield play and our reliance on Robert Lewandowski, our once-in-a-generation striker, involves kick from our goal to the other half of the pitch, hope that Lewy will catch it, and assumption he'll Leeroy Jenkins his way into the goal with it. Unable to find faith in our skills, or our corrupt infrastructure, or ourselves overall, we rely on high kicks to keep the ball from being intercepted, and consult pascal's laws more than actual football doctrine to push the odds. \n\n Hacks and anxiety born from genuine dedication to the sport and success in it, that was wounded by the theft and embezzlement of means to attain it, and morphed into apathy: This, defines Polish tactical philosophy, alternating between despair and genuine utility. Reforming this philosophy into a strength of ours, is every bit a tactical challenge as it is a psychological one. Deep in the Polish football's psyche, there exist a determined, confident side of it. One that takes every lesson to learn from the past, and none of its trama, one that leaves nothing to chance stops at nothing to win, one that plays out the game like a chessmaster, not a compulsive gambler. Once we muster the means, hearts and minds, fate will be our curse no longer..."
buzzer.35.a: "...It will be ours to command."

buzzer.36.t.a: "There are no weak teams in Poland anymore" #brexit football
buzzer.36.t.b: "There are no weak teams in Poland anymore" #tiki taka
buzzer.36.t.c: "There are no weak teams in Poland anymore" #total football
buzzer.36.desc.a: "The Coach has finished the assessment of the team's playing skill, involving one training match (with a break every 15 minutes due to inclement weather), interview with the team captain and then a test of the staff's drinking acumen, and he feels pride. Walking around the pitch around and around, as though in trance (the only trance he was in was a slight influence of the cheap local wine), he imagined just how much his team can pull off after what they showed him. And before them? Back to back to back triumphs. Teams in friendlies and drills showing world class football, pulling rabbits out of the hat as if they were breeding in it. The ball flies high up, but things are no longer cool, nor koko-koko: They're hot, serious, and leaving no doubt that there are no weak teams in Poland anymore.\n\n No more insecurity, no more inferiority complex. We have finally crossed the Rubicon into the fields beyond it that teams like England and other supposed anti-football teams dwell. Ruthless pragmatism. Dirty crosses, dirty tackles, nothing ever mattering other than the score tally. Why pursue technical excellence or chaos when all it takes is a Laga to generational striker repteated eight times for each scoring? If you don't like it, take it up with whoever decided the winning is done by scoring, rather than possession. \n\n At last, free from the trance (that saw him made three laps around the pitch), the Coach walks on home, the midnight sky pitch black with new moon, though in his mind, the red flares clouded it, his team held the World Cup, and the fans around him roared the words, that will never be roared with such ecstasy and sense of triumphal ascendance, before, or since."
buzzer.36.desc.b: "The Coach has finished the assessment of the team's playing skill, involving one training match (with a break every 15 minutes due to inclement weather), interview with the team captain and then a test of the staff's drinking acumen, and he feels pride. Walking around the pitch around and around, as though in trance (the only trance he was in was a slight influence of the cheap local wine), he imagined just how much his team can pull off after what they showed him. And before them? Back to back to back triumphs. Teams in friendlies and drills showing world class football, pulling rabbits out of the hat as if they were breeding in it. The ball flies high up, but things are no longer cool, nor koko-koko: They're hot, serious, and leaving no doubt that there are no weak teams in Poland anymore.\n\n Poland's teams were once characterised by their crude, ramshackle tactics and technical capacity. No more. We saw Italy's excellence, drew upon determination and hard work that would make Rock Lee blush, and embraced the youth of football, found in technical perfection that allows for tactics that most eyes can't keep up with. Our triumphs are pyramids made from one pass at a time, over and over, routinely learned, routinely played, until we're right before the goalpost. And if that won't do? Bus up our half and evolve Częstochowa Defence into a counterattack monster. \n\n At last, free from the trance (that saw him made three laps around the pitch), the Coach walks on home, the midnight sky pitch black with new moon, though in his mind, the red flares clouded it, his team held the World Cup, and the fans around him roared the words, that will never be roared with such ecstasy and sense of triumphal ascendance, before, or since."
buzzer.36.desc.c: "The Coach has finished the assessment of the team's playing skill, involving one training match (with a break every 15 minutes due to inclement weather), interview with the team captain and then a test of the staff's drinking acumen, and he feels pride. Walking around the pitch around and around, as though in trance (the only trance he was in was a slight influence of the cheap local wine), he imagined just how much his team can pull off after what they showed him. And before them? Back to back to back triumphs. Teams in friendlies and drills showing world class football, pulling rabbits out of the hat as if they were breeding in it. The ball flies high up, but things are no longer cool, nor koko-koko: They're hot, serious, and leaving no doubt that there are no weak teams in Poland anymore.\n\n Our representation took its greatest weaknesses and made them their greatest strength. Disorganization became flexibility, chaos became a ladder to climb to the world cup someday, desperation became a feint and triumphal charge combined. As others in football were chasing their own tails with sophisticated technical challenges and haramball that would make even Częstochowa Defence enthusiasts blush, we went back to the basics: Total Football, where everyone can fill any role, and the pressure upon the opposition is merciless. We went back to the source, the basics, the wellspring of football that Johan Kruyff invented, and gave football a new youth. \n\n At last, free from the trance (that saw him made three laps around the pitch), the Coach walks on home, the midnight sky pitch black with new moon, though in his mind, the red flares clouded it, his team held the World Cup, and the fans around him roared the words, that will never be roared with such ecstasy and sense of triumphal ascendance, before, or since."
buzzer.36.a: "POLSKAAA, BIAŁO CZERWONI, POLSKAAA..."

