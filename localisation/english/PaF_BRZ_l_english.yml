BRZ_olimpia_truskolasy_do_utraty_tchu_desc: "Let us take a while and remind ourselves how good Olimpia Truskolasy is. They won the first cup; they are currently the best team in this country. They always shoot perfectly, never miss, and always win, except when they don't, but it happens really rarely. They show why we support them, and we should support them even more! TRUSKOLASY GOLA, FUCK PZPN!"
BRZ_rebuilding_stadiums_desc: "Stadiums are an essential thing in football - after all, you can't even play without them. However, there is a giant problem with them in our country - they are in an extremely bad state. Grass that should have been moved 10 years ago, broken chairs, not working scoreboards - this is the state of our stadiums now, and if we want to have an actual league, we should fix up these stadiums to make it actually enjoyable to play on them, not just bearable."
BRZ_dabrowa_stadium_desc: "When thinking of Zagłębie, you probably think about the Intercounty, Sosnowiec, Socialism, and Huta Katowice. You might also think of Czarzasty or Dąbrowa Górnicza, but you definitely didn't think of stadiums. Why? Simple, because they are in such a bad state that no Zagłębian will tell you about them. However, this ends now - the ZWKT has demolished the old stadium of Zagłębiak Dąbrowa Górnicza and begun constructing something much grander."
BRZ_zawiercie_stadium_desc: "The Thousand-Year Stadium in Zawiercie is a very important place for football in our country. It was built in 1966 to celebrate a thousand years of Polish history under Gomułka; however, it decayed over the years, especially during the late years of the Third Polish Republic and the Collapse. The ZWKT has decided to repair it to give every Zawiercian the ability to play football in proper conditions, unlike before our rule."
BRZ_rakow_stadium_desc: "Raków, the most devoted and faithful of all Polish clubs, is now facing extinction at the hands of the heretics from Truskolasy. First, they claimed our lands, dethroning our rightful rulers, and now their barbarian squatters are attempting to lay their hands on our holy stadium, reshaping it in their image. We mustn't let them continue, Brothers and Sisters! We must drive the heathens out! Burn their flags, beat their fans, crucify their players if necessary! Never give up, nev- h-hey, and who the hell are you?! You're not allowed to enter this room! Hey, HEY, lay down that club-\n\nWe're sorry for this unexpected accident; that thug broke in here and started speaking some nonsense. Anyway, the ZWKT has decided to renovate the stadium in Raków to finally give them a proper place to play football. Who wouldn't like such a great man as their leader?"
BRZ_football_economy_desc: "After rebuilding the stadiums, the supreme coach has started a new program to create an economy centered on football. I would love to explain it in detail; however, the supreme coach will explain it in person. I give you the voice, Mr. Brzęczek.\n\nOf course. The program aims to bring our economy back to the world stage using football, our national sport. There are already many programs planned, although some are mutually exclusive, so we will have to select the best ones.\n\nYou heard the Coach! We await his next decisions!"
BRZ_defund_other_disciplines_desc: "Volleyball, handball, tennis, and many other sports. Who needs them when we have football, the best sport of them all? The government thought so and decided to defund all other disciplines, showing once more the government's commitment to strengthening football. It is not known what the government will do with the newly acquired funding, but we are sure the Supreme Coach will use it wisely."
BRZ_subsidize_women_football_desc: "Women's football in Poland has always been underfunded, and our teams have struggled to compete against those from countries that are 10x poorer than ours. However, it ends now - the Supreme Coach has decided to use the funds acquired from defunding other disciplines to fund our women's teams, showing their dedication to ensuring a strong football team is based on people of all genders, not just men. We await more fantastic decisions like this!"
BRZ_zwkt_trademark_desc: "Have you ever wanted to buy a t-shirt with giant letters \"ZWKT\" on it? Well, now it's possible! The ZWKT has just announced that they are going to be selling ZWKT-branded merchandise to gather funding. ZWKT branded shorts, football boots, and everything related to football! Don't wait, go to your nearest store and buy yourself one!"
BRZ_selling_profitable_players_desc: "Shocking! The ZWKT has just announced that they are going to sell some of our players to other teams! The Supreme Coach has said that our country can't function without funding, and that's why, but why did they have to sell our players? All things aside, this will be a financial boon for the government and a detriment to our great football team. Let's hope they don't sell any more players, or else our team will collapse."
BRZ_pioneer_cup_desc: "The ZWKT has just created a new yearly cup! It's called the Pioneers' Cup, and in it, teams will compete for funding. Olimpia Truskolasy is predicted to be the victor of every single one, and it's very probable that it will receive a significant majority of funding. Big rewards are also planned for the 2nd and 3rd place, ensuring that not only Olimpia can buy the best players from other countries."
BRZ_budget_based_on_betting_desc: "The ZWKT has just announced its new economic strategy. I would love to explain it; however, we have once again invited the Supreme Coach to our studio, and he will happily explain it to you in detail.\n\nThat's right. Our new economic strategy is based on betting our entire budget on specific teams. While some critics may say that we are bound to lose our entire budget eventually, we simply know on which team to bet.\n\nInteresting. We are keeping our fingers crossed. May your endeavour be successful, Supreme Coach."
BRZ_financial_disasters_desc: "Unfortunately, some teams struggle to adapt to the new circumstances, which, in a lot of cases, causes money shortages, as the teams' management is unused to the new system. Since towns and cities are so closely intertwined with local clubs economically, it has a cascading effect on the local economies. The ZWKT will have to do something quickly to salvage the situation."
BRZ_buyout_clubs_desc: "The ZWKT has just bought out the bankrupt clubs. Of course, it made a very visible dent in the government's treasury; however, this action should quickly stabilize the situation in the cities as well as the economy, and the Supreme Coach is already saying that the clubs will be restructured and put under new, more competent management."
BRZ_drop_them_desc: "Shocking! The ZWKT has just announced that every team that has a money deficit will be kicked out of the league. Fans of the bankrupt teams have already started protesting, throwing Molotov cocktails at government buildings, but they were quickly crushed by fans of Olimpia Truskolasy. This initiative, as Robert Lewandowski frames it, is going to reward competence; however, he recently had to hire new bodyguards to defend against the protesters."
BRZ_funding_problem_desc: "Some teams in our country still struggle with the new situation. Since the government made them do much more in the local economy, a lot of teams struggle to break even even with massive cuts. This has caused a big problem, as this can affect many more teams than the previous funding crisis."
BRZ_central_fund_desc: "The ZWKT has decided to create a Central Football Fund. Its role is to redistribute funding from the well-doing ones to the struggling ones, as, according to the government, some teams have much more expenses, so the ones with less expenses will have to redistribute some of their profit to the ones with more expenses. The result is not yet known, as this program can revitalize the struggling teams, but it can also cause sabotage from the more wealthy teams."
BRZ_every_club_enterprise_desc: "The reformist wing of the ZWKT has managed to convince the entire ZWKT to make every club an enterprise, saying that it will fix the problems with the struggling teams. Many teams have already created stores and bought foreign stocks. This approach will surely revitalize the clubs; however, it can also potentially shift the focus from winning matches to earning money, decreasing the strength of our teams."
BRZ_economy_vs_brzeczek_desc: "After a tense month, Brzęczek looks at the challenges he had skipped past with pride. After arduous months, he looked at the future conclusion of this economic derby. And now he can deliver. He can deliver to himself, to his team, to the Kłobuck powiat, a message that all will hear in Poland. To show that there should be more football in business management and less business management in football. Now everyone can witness what can be described as the financial goal that brought the golden cup to Brzęczek's ingenuity and brought gold to the people of Truskolasy. It's just the beginning of the great national championships, but we can be sure we have already seen a unique event that will come down in history as a phenomenon on a world scale."
BRZ_sisyphean_task_desc: "Ladies and gentlemen, get ready for a spectacle. Jerzy Brzęczek, a man of dubious record to say the least when it comes to coaching, given the mixed results of his teams, wants to resurrect Polish football and the Polish nation simultaneously. The task will be arduous as neither of those was in particularly good shape for quite some time. Still, in his interviews, Brzęczek argues that a resume means nothing without dedication or perseverance. And say what you will about the Supreme Coach, but he's not lacking those. All of Poland holds its breath, looking for a source of national pride."
BRZ_local_administration_desc: "'Poland is football. Football is Poland' is one of the most popular slogans that can be heard among the supporters of clubism. Brzęczek wants the Poles to have no double loyalties to some other structure that doesn't care about football at all. He says the football fans won this nation and that this sport should play the most important role when it comes to government, both national and local, as well. It seems that in people's eyes, the average local mayor is even worse than a faulty coach, so there's certainly popular support for this reform, but let's wait before final assessment."
BRZ_state_sport_media_desc: "It is one of the last auditions for the Football Express. In the coming days, due to the new policy of the Club Association, the Express and other smaller, private sports auditions and TVs will be combined into a single conglomerate that will ensure the quality and reliability of the news. It has been a wonderful time to relate to you all of the things related to this beautiful sport. You will still be able to hear and see us in the new formula and under a new brand as the Football Association project will include large sections dedicated to interviews, journalist speculations, as well as documentaries about famous players and coaches, football-adjacent sports, and even a regular news service that will deal with non-sport issues. We hope our entire staff will be able to find a place for themselves there."
BRZ_from_junior_to_leader_desc: "Napoleon once said that every soldier carries a marshal's baton in his knapsack. Likewise, every football player carries a coach's whistle in his pocket. The Supreme Coach Brzęczek decided it's time to help the exceptional individuals by creating opportunities for them to spread their wings. Training courses and camps to show the players what the game looks like from the other side of the pitch. Another method of attracting new blood relies on increasing the salaries for the coaches and chairmen. With this action, the Board of the Association seeks to bring long-lost glory to the managerial cadres."
BRZ_board_of_managers_desc: "The Supreme Coach declared his intentions to expand his clubist ideas. He declared that all who want to partake in his crusade are welcome, as all Poles are one family. To do so, he invited the coaches and selectors to the extended board of the Jura Club Association. The key figures from well-known to us local clubs such as Grom Miedźno, Naprzód Ostrawy, Liswarta Krzepice, and regional powerhouses such as Sparta Lubliniec, Raków Częstochowa or Warta Zawierci have already agreed to join the organization. We've seen how Brzęczek can manage his Truskolasy team and lead them to victory, and now we see how he expands. Let's hope this growth can serve as a blueprint for the future and that we may yet see a unified nation."
BRZ_raze_the_pzpn_desc: "LADIES AND GENTLEMEN, LAST MINUTE NEWS! The new media, the new cadres, the new board, all have led up to this daring move:  ZWKT decides to stand on its own! Jerzy Brzęczek cuts all ties with PZPN, deeming it an illegal organization. Right now, the buildings belonging to the National Associations are being demolished by the Brzęczek-aligned Hooligans! There are unconfirmed reports of the beating of employees.  I think I can say for all of us that this turn against the run of the play surprised us all. Let us hope that, despite the fieryness of the situation, today marks a new beginning for Polish football. Let us hope that new blood and a new organization will make Polish football great again!"
BRZ_denounce_fifa_desc: "BRZĘCZEK STRIKES AGAIN! After one attack against the  PZPN, the Supreme Coach declares further separation from UEFA and FIFA as a whole. Brzęczek accuses the organization of siphoning money from the national clubs, while offering next to no help to them. It sure seems like time for our team to stand on its own. To find others who think like us and play in the league of our own. Sure, no international matches with highly respected teams may make this move seem like an own goal, but isn't national recognition and pride in our renewed team worth more? I think the dedicated fans know the answer to that question."
BRZ_soccer_poker_desc: "The excitement some expressed may have been a false start... There's more to navigating the complex web of the football system than hiring a couple of new faces and stuffing the programme format with sports content. Now our team has to recruit, train, and provide for new players completely on our own, thanks to the separation from the worldwide organization. To put it bluntly, we're either going to become a laughing stock on the national stage, or we're going to create something beautiful. This high-risk, high-reward approach made the journalist call the new doctrine of the board 'a Soccer Poker'."
BRZ_dinosaurs_in_club_managements_desc: "How can this country work properly if the football clubs are still being managed by old, greedy, and inexperienced people? Those dinosaurs know nothing about football and only care about the profits that this position gives them. That is why our most precious sport has been falling off year by year. But that is no more.\n\nSupreme Coach cares deeply about the state of Polish football and has finally decided to make a change. We will watch his next steps closely, but this may be the beginning of something good, a change that will finally wash off the failures of past years.\n\nCarry us to victory, chief!"
BRZ_corruption_runs_deep_desc: "Corruption is something deeply entrenched in our system. Poland was corrupt for decades before the Collapse even happened, and this doesn't exclude soccer clubs. For our team to succeed, we can no longer allow this; corruption must be uprooted. While it might seem like a difficult task for the Supreme Coach, we view it as a crucial necessity. I think that Brzęczek might actually change things for the better and reshape the sport that we love. Even if brute force is necessary, it must be done. Go on, Supreme Coach! "
BRZ_decimate_old_guard_desc: "Well, the Supreme Coach's recent decisions don't sound so good, huh? I think discarding all directors, managers, and coaches who are simply elderly is a bad idea. Some, indeed, are corrupt and inexperienced; however, many could actually provide insights into strategy that could improve the performance of our players. That's why I can't understand his decisions; we don't have to be so radical here. I firmly disagree with the statement that they are all unfit for modern football; Brzęczek should consider this before taking such drastic steps! After all, we want what's best for Polish football."
BRZ_deal_with_old_bosses_desc: ""
BRZ_purge_referees_desc: ""
BRZ_everyone_has_price_desc: ""
BRZ_lack_of_discipline_desc: "Unfortunately, many of our football players are undisciplined and lack many of the skills required to become a professional footballer, resulting in very bad match results. This can not stand, or else Poland will never win the World Cup! The ZWKT has also realized this, and created many plans to restore their discipline; however, the reformist wing criticizes the plans for their harshness, and advocates for a more measured solution. We will see which one of the proposals gets passed."
BRZ_footballers_without_resolve_desc: " What the footballers lack is a steel will, a winner's mentality, and a hardened soul ready to fight for our country. Instead, they are decadent hedonists who use their position just for money and fame instead of trying to get even better. The ZWKT wants to combat this; however, the divide between the hardliners and the reformists makes passing legislation very hard, resulting in the inability to do anything about the situation."
BRZ_out_with_lollygaggers_desc: "Dear viewers, do you think a worker who doesn't do anything and uses his position for money and fame should get fired? It's like that in our team - many footballers don't do anything, some do the bare minimum to stay in our team, only a few want to genuinely improve themselves and try their best. The Supreme Coach has noticed this and decided to use the most effective solution - firing the lollygaggers. The players, who are now afraid they can get fired, finally started training and disciplining themselves, improving our position in the League. The Supreme Coach has once again chosen the best solution."
BRZ_carrot_and_stick_desc: "The reformist wing of the ZWKT has managed to convince the hardliners to use a much more measured approach with the decadent footballers. A new reward system was created, rewarding the disciplined while punishing the decadent. While it was very costly, the players have finally started working as they should, and discipline has begun to return to our ranks."
BRZ_focus_on_young_talents_desc: "Poland has many young people, and many of them have extreme potential just waiting to be exploited; however, the previous government didn't do anything about it, and hidden football stars were stuck working some 9-to-5 job, while they could greatly boost our team. This ends now - the Supreme Coach has just announced many new programs, making sure every unpolished diamond will be trained and disciplined, for they are the future of our team."
BRZ_focus_on_foreign_transfers_desc: "Unfortunately, training the youth will take a lot of time, while we need experienced players right now. The reformist wing of the ZWKT has convinced the hardliners to purchase some talents from abroad, strengthening our team. Of course, it will cost a lot, and I mean A LOT; however, our team will greatly benefit from this."
BRZ_hooligan_problem_desc: "Recently, there was a giant increase in hooligan violence. While normally it wouldn't cause any problems, many citizens report that they are scared to go out of their homes due to it. The hooligans have also become more violent, often causing destruction and creating more problems than they solve. The ZWKT isn't yet sure what to do with them; however, the more they remain in deadlock, the more destruction will happen."
BRZ_disastrous_infighting_desc: "The hooligans have started attacking other hooligan groups, causing much more destruction than before. While the normal fights wouldn't cause much damage, since the hooligans have received weapons, many have died during the battles, and the death toll keeps rising. The ZWKT has to do something quickly, or else this will spiral out of control."
BRZ_nationalize_ultras_desc: "The Supreme Coach has just nationalized all the ultras organizations. Brzęczek said that if they are all a part of the state, they won't attack other parts of the state. In theory, it sounds great; however, a hooligan still has to relieve his hate somewhere, and that is something the government will quickly have to offer."
BRZ_targeted_wrath_desc: "The reformist wing of the ZWKT has managed to convince the hardliners to find the hooligans a common enemy instead of trying to foster harmony between them. While they aren't sure what or who the common enemy will be, this approach is much more likely to succeed than attempting to stop violence by nationalizing the Ultras."
BRZ_portuguese_common_enemy_desc: "The Portuguese. They are our biggest enemies. If we want to win the World Cup, we will have to get rid of them. The Supreme Coach has organized many anti-Portuguese campaigns to remind all who the true enemy is, especially among the hooligans. It also helped massively with the hooligan problem, as the hooligans finally have someone to hate."
BRZ_blow_off_steam_desc: "The reformers in the ZWKT have convinced the entire ZWKT to create special battles for hooligans, without any weapons and closely watched by referees. This is sure to relieve the hooligans' hate, although it still costs some money to organize such battles; the damages are far less costly to repair, while the death toll has dropped to nearly 0."
BRZ_cba_desc: "Any country, even large organizations, boast some kind of authority investigating the white collar crime, the willful incompetence, all that fits under the umbrella term of corruption. Poland had CBA. As far as agencies go, it was okay: And it wasn't enough. \nOur anti-corruption bureau will be more pervasive, more vigilant and possessing of more intelligence than even American or Russian spooks: Our national sport deserves no less, and warrants even more."
BRZ_white_red_academy_desc: "Post-Soviet nations, even egalitarian ones, have a chronic, willingly induced lack of prestige academia. Who's ever heard abroad of Warsaw University? Compare that to London School of Economics, let alone American Ivy League. East Asians have sidestepped the problem mostly by enforcing brutal learning standard across the board: but that takes time better spent playing ball. \nBut the biggest tragedy of all is Poland's woefully insufficient talent recruiting and cultivation. Piss-poor youth divisions. Scouting that's got more to do with dice rolls than talent recruitment. The White-Red Academy will be the institute for excellence, nation-wide. A single place to concentrate world-class training environment, and talent scouts scooping up our best specimens at the age of six, wherever our control stretches. Everyone knows Hogwarts. But this school of ballcraft and footbalry, will be the Hogwarts in real life."
BRZ_hooligan_army_department_desc: "The ultras are hardly a military. Discipline and endurance of a professional soldier is found wanting in an average ultra. That said, these remain tough, motivated men, who only need a good drill sarge to become formidable frontline troops. We have soldiers of our own, so we don't have to turn ultras into soldiers from ground up: Just conscript the toughest ultras into their own platoons, groomed and drilled by our officer corps into volatile, but capable soldier class. Who cares about the headaches they'll cause the martial courts after yet another brawl?"
BRZ_rozklad_jazdy_znany_desc: "This situation of ours, where the country is gone and we are genuinely on our own, hardly thriving, just surviving and training, is the new kind of football for us. In the past, we could lose the first match, the match for everything, and score a draw in the match for our honor. Today, our game is not only the football, but conquest of others fighting to unify the nation: we win or we die. And this nation is not yet lost, while we live. \nWhat better motivation than this."
BRZ_jazda_z_kurwami_desc: "Supreme Coach Brzęczek's finest are on the pitch, and the supporters explode in righteous roar. The sea of red-white flags and faces is a choir of angels heralding our triumphs to come. There will be no more matches for honor, or even everything, there will only be the play worth of such tribunes! At the same time, our tribunes will be our women and children, and all fighting age adults will be our representatives. To war for this country's unity. We expect nothing less but utter triumph both on the battlefield and the pitch. Go, Poland! Go play some fucking ball!"
BRZ_tactical_assesment_desc: "I'm gonna be honest with you. We're kind of retarded. Maybe it's our inferiority complex telling us that we must either play like a Greek phalanx, safe and inert, or start pulling rabbits out of the hats that let us secure a draw with less than 30% ball possession. Maybe we just embezzled all that's necessary to have proper football going on. Nowhere in Europe is our national representation this meek tactically. Not for long though. Soon, we will be Europe's dark horse, no longer satisfied with wins during friendlies with Curacao or other Sierra Leones."
BRZ_obrona_czestochowy_desc: "Częstochowa Defence is the Scandinavian Defence of Polish football, or at least it would be if the former was just your rook alternating between two positions indefinately. It is the core of our defence, perfect for holding 1-0 result, or clutching a shaky draw, or keeping a loss from becoming even more humiliating. It's simple. Give up even trying to score and saturate your half with your players. Everyone a defender, sorry Lewy, no more goals for you. It's a brute-force solution for choking down a superior attacker, and works like a goddamn charm. Oh, and maybe we can apply some of its lessons on the battlefield."
BRZ_laga_desc: "Fancy, beautiful football is overrated. We are an one-trick pony, and we call that trick Laga. it is the Blitzkrieg of Polish football. It goes perfect when applied right after Częstochowa's defence: First, your best attacker sneaks up to the opponent half of the field, then have the goalie kick the ball as far as possible, teleporting the game to the opposition. Maybe, aforementioned attacker will get the ball, maybe he'll score. Alternate between Częstochowa Defence for the best results. Sooner or later, goals will fly in. Speaking of Blitzkrieg, we could do likewise in the military: Combine long-range bombardement with infiltration assault, maybe?"
BRZ_jaka_wrzutka_wariacie_desc: "Our gravest sin is we don't know how to time our crosses. A football cross is a medium-long pass from the side to the center of the pitch, resulting in optimal conditions for a goal... or loss of a ball. No more. Surprise the defence with early cross, or play mind games on top of mind games to create the perfect storm. Let the commentators yell 'what cross, you madlad?', then watch them eat their words with a side of a goal."
BRZ_brexit_football_desc: "We cannot afford any mercy against technically superior teams. Our football will be ruthless, even if we let a ball pass, a player is another matter. Once applied by Jacek Góralski, it considers allowing the opponent to get in desired position a cardinal sin: Block him, clash shoulder to shoulder, tackle him like it's American football, if need be. And don't let our armed forces be any better either. Give them not a moment's rest."
BRZ_tiki_taka_desc: "Tiki-Taka play focuses on safe, short passes and maneuvers that are easy to train in schematics, control and maintain possession with. It is a very effective tactic, but it requires a lot of training and discipline to be able to execute it, but once we do, we can forget all about Laga and worse, and end up right before the opponent goalie like it's a penalty. This is what winning teams do."
BRZ_catenaccio_desc: "Unlike our domestic abortions of tactics, Catenaccio makes for excellent defence that leaves the room for amazing counterattacks. We can wall them off and play for possession this way, with one midfielder making long passes to attackers whenever it's time to counter, not to be confused with Laga. Critics don't dare talk smack to Italians about this football style, at least not in their own country and language, and that's enough for us to learn from them."
BRZ_futbol_totalny_desc: "DO YOU WANT A TOTAL FOOTBALL!? DO YOU WANT A FOOTBALL SO TOTAL AND RADICAL THAT SPORTS COMMENTATORS YELLED OUT IN HISTORY? DO YOU BELIEVE IN SUPREME COACH BRZĘCZEK AND TOTAL VICTORY OF THE POLISH TEAM?! \nIf you do, Total Football is the war itself, of football. War is chaos, and we are going to practice chaos on the daily basis. All we need to do is to excel in the basics we already are adepts in. Then, we will play, and we won't know what we'll be doing, but neither will the opponent. In this chaos, it'll be a matter of will and endurance, which we'll have in spades."
BRZ_gegenpress_desc: "As Franz Smuda would say, PRESS. The other team will get so confused by our players practically running around in circles, that they'll default to attempting to drive us off and securing themselves a clean position. They will fail. Because we will PRESS gegen them so hard they'll lose any sense of what's going on, which is exactly what we'll thrive in, having never relied on that sense to begin with. Regaining the ball in this circumstance is inevitable."
BRZ_panic_playing_desc: "This, is a feint of football. A psychological mindgame to trap the opponent in, by instilling overconfidence in them, a slow and insitious killer. And once they press on and expose themselves for an easy win, we form up and exploit that gap without mercy. End result? Goal from the side. A ruse with a side of Catenaccio, a dish rewarded with turning the tide."
BRZ_w_polsce_nie_ma_juz_slabych_druzyn_desc: "No more besmirching the good name of Polish teams, claiming that half of them don't know what they're doing or should be relegated. THERE ARE NO WEAK TEAMS IN POLAND. Here we are strong. Here we know what we're doing, especially when the opposite is apparent. Here, no matter how meek is what we must work with, our results will speak for themselves. Here, we test the path we chose, in victory or... even better victory. There are no weak teams in Poland. Here we are safe from yet another embarassment. \nHere we are free."




 ##Characters##
POLITICS_JERZY_BRZECZEK_DESC: "Jerzy Brzęczek did not have an easy life and not just because of the collapse of the country. The latter he accepted with the hope that it would wipe clean the stain on his honor. Even so, his name was still a symbol of mediocrity in Poland. However, the Truskolasy, where he had arrived after the Fall, severely regretted this carelessness. With the help of the militias of the teams that came with him, he overthrew the remnants of the former administration, and appointed the ZWKT with himself as the Supreme Coach. \nNow, people form clubs where they eat, drink, work and exercise to develop their football skills. In Brzęczek's state, there is no room for lollygagging and the two biggest crimes of thought - Peszkism (hedonism and alcoholism) and Nawalkism (corruption, lies, lack of ideology and shallowness), and any mentions of former football coaches were erased from the books, together with those who destroyed Polish football the most - The dreaded Portuguese... \nEveryone else were descripted as spirit-lacking lackeys of Polish Association, which in fact was to blame for everything wrong that happened to Brzęczek's life. \n\nBut that shall change, and the Supreme Coach will carry us to victory with his iron hand! \n\nBrothers and Sisters, march to the field! Each of us is a representative from now on!"

 ##Events##
 
buzzer.1.t: "First Half"
buzzer.1.desc: "One may say that the last whistle was blown for me a long time ago. History has not treated me fairly. I did what I could for the best of Polish football, advanced the national team to Euro 2020, and still got fired as the national team's coach. A couple of years later, there comes the Collapse, and it wouldn't be surprising if I disappeared from public sight.\n\nNo. Stepping away...it's not me... Despite everything thrown against me, my role in the sport is far from over. After Poland plunged into civil war, I had to find a perfect place of my own. Amidst the chaos, I've returned to the only place I could think of, Truskolasy. Home. At least it was before everything went to shit.\n\nAfter all, that was the cradle of the great journey, the home of my very first club. I was only 11 when I started playing in the junior league, and those had been some of the best years of my life. The club still exists against all odds, and I know they will have another chance to prove that Polish football is superior, and just like this club, the whole nation will not succumb to mediocrity and darkness.\n\nHowever, things were not as easy as they seemed. In a fractured country, nobody cared about sports. This was the time when I realized that building the strongest team Poland had ever seen wouldn't be enough. I was hindered not only by the chaos, but also by the threat of a return to the old ways. The greatest tragedy for the country would be PiS cementing their power again. Or some other strictly political faction of zealots taking over. And there is no way I am going to let that happen. If the politicians won't fix the country, someone else has to do it. To run things the right way without the usual corruption and greedy leadership.\n\nBut wanting to change things and actually doing it are two different stories. Right now, there is a massive uphill battle on my path. Budget is almost non-existent, the local pitch is a mess, and Olimpia Truskolasy needs a complete overhaul from top to bottom before it can even function like a real club, let alone become the powerhouse I've dreamed of.\n\nThese days, I spend a lot of time by myself, scribbling down formations and thinking about what could be. I know perfectly well that the hard part is just getting started, and turning Truskolasy around is going to take an immense amount of grinding. But if there is one thing people know about me, it's that I don't back down. This time, it's all in, and I will do whatever it takes to put Polish football back on top."
buzzer.1.a: "By whatever means necessary."

buzzer.2.t: "Free Kick"
buzzer.2.desc: "To say that Truskolasy's internal situation was bad would be an understatement. It was shit. Placed in the middle of nowhere, Supreme Coach's country could not work properly. Food shortages, broken supply lines, and poverty were omnipresent in that state. The only thing that kept it together was a strong will for victory.\n\nHowever, the economy was not the only problem of Truskolasy. The remnants of the old Polish Football Association were still crawling around the region. These bureaucrats and corrupt officials, left over from the collapse of the central government, were hiding out in the ruins of local administration offices. Instead of trying to help fix anything, they were busy playing shadow politics, trying to hoard whatever resources were left and manipulate the locals to bring back their old, comfortable ways of bribery and nepotism.\n\nTo make matters worse, the local streets were a battleground for petty faction wars. Different neighborhood groups and warlords were constantly fighting over territory, food crates, and fuel supplies, turning the towns and villages into a chaotic mess. Right in the middle of this were the local ultras. These weren't just standard football fans anymore; they were armed, aggressive, and completely out of control. They spent their days tagging walls, running black markets, and starting tribal turf wars with neighboring villages, caring way more about hooliganism and chaos than actually rebuilding the nation.\n\nThen there was the team itself. Honestly, the players at Olimpia Truskolasy were absolute trash. Half of them didn't even want to show up to the pitch, and the ones who did lacked basic discipline. They couldn't string two simple passes together, their conditioning was non-existent, and they spent most of their time arguing with each other rather than practicing drills. They looked like a miserable Sunday league squad that had been forced to run around in the mud, completely blind to the revolutionary role they were supposed to play.\n\nStanding on the sidelines, Brzęczek quickly realized the brutal truth. The corruption, the terrible talent, the violence, and the sheer laziness were everywhere. If he actually wanted to build the strongest football team Poland had ever seen, he would have to aggressively clean up this entire mess from scratch, starting with the very people who claimed to be on his side."
buzzer.2.a: "This time, Jerzy Brzęczek will not stand down."

buzzer.3.t: "Press Conference"
buzzer.3.desc: "Jerzy Brzęczek felt something he had expected to experience during the total collapse of civilization, though not quite like this. Nostalgia. Not the ordinary, \"things used to be better\" sort of nostalgia. These were emotions that threatened to tear him apart from within. He had been here before, and he had dreamed of returning here again - even though it had never been among the most pleasant of experiences.\n- Coach, what is the point of creating a national team for a country whose territory consists of three counties? - one of the journalists asked.\nThe first post-collapse press conference could hardly be taken seriously. The country was falling apart, yet they were putting on a circus over call-ups to a squad that had nobody to play against. And then there were the journalists themselves. Most had only come to coax some political statement out of Brzęczek, while half of them probably did not even know what offside was.\n- Sir, the point is that people need something to unite them during these difficult times. That is the role the Association's national team will fulfil. - As always, Brzęczek tried to remain measured and conceal his exhaustion at yet another pointless question, although even his patience seemed to be reaching its limit.\n- How is it supposed to unite anyone when they play terribly? - the journalist replied.\n- What is terrible are these questions. Are we finished? - the coach snapped, gesturing towards his assistant. The man hurried over with a bundle of handwritten notes and passed them to the manager. - Then let us move on to the specifics.\n\nBrzęczek unfolded the notes, which contained a meticulously prepared speech, but after a moment he placed the pages back on the table. He had only been expected to read out the names of those called up to the national team, yet in that brief instant he realised that perhaps the journalists had a point. What was this celebration of footballing mediocrity, if not a farce?\n\n- Ladies and gentlemen, representing the national team is the greatest honour there is. We all know how extraordinary it feels to be granted the privilege of playing with the eagle upon your chest. But how many of you are merely passive observers? How many of you will abandon us after the first defeat or one particularly dreadful draw? How many will decide that you never really cared about football at all, because it is only some stupid sport in which twenty-two men chase a ball and, in the end, Poland loses anyway? Football is not merely a game. It is one of those magnificent things in life that can make you feel as though you have hit rock bottom one day, only to make you feel like the ruler of the world the next. Football can turn ordinary people into heroes. We are merely instruments of teams that belong to entire communities. One morning, you will wake up, something will suddenly click inside your head, and you will understand. Because what we are doing here affects every single one of you - especially in times such as these.\n\nA deathly silence fell across the room. It was not an awkward silence. It was the kind in which admiration had taken the lead in the minds of everyone present.\n- Thank you for coming. The list of selected players will be posted on the front door."
buzzer.3.a: "We are all the national team!"

buzzer.4.t.w: "Olimpia Truskolasy 1 : 0 Liswarta Krzepice"
buzzer.4.t: "Olimpia Truskolasy 0 : 1 Liswarta Krzepice"
buzzer.4.desc.w: "The \"stadium\" was nothing but a Truskolasy open door pitch used for training, there were no tribunes even, just a dinky fence. No floodlights, even. The main pitch just happened to be under maintenence, but since the surest audience to be found for this match were deadbeats, birds and worse, Truskolasy faced off the illustrious, mighty Liswarta Krzepice. The away team had a lot to prove: Very few of even their own denizens have heard of them before this, and perhaps the amateurish smartphone camera in hands of a 5 year old son of one of the footballers, might reach them. The footage could gain value if there was no internet back in Poland soon.\n\nLiswarta faced the onslaught like a boar: An old, crippled boar that sustained itself on moss and desperation for past month. Truskolasy made short work of them: One score for each half, with them only managing to limp a goal in last minute. That's all. There were no glorious maneuvers, no noteworthy plays being employed. Just two crippled teams of a crippled nation, trying to find some pride in engaging in a sport that brought the world together. For now, it only brought them respite for what felt like apocalypse, as well as bombardment of birdshit from their most loyal fans: The crows."
buzzer.4.desc: "The \"stadium\" was nothing but a Truskolasy open door pitch used for training, there were no tribunes even, just a dinky fence. No floodlights, even. The main pitch just happened to be under maintenence, but since the surest audience to be found for this match were deadbeats, birds and worse, Truskolasy faced off the illustrious, mighty Liswarta Krzepice. The away team had a lot to prove: Very few of even their own denizens have heard of them before this, and perhaps the amateurish smartphone camera in hands of a 5 year old son of one of the footballers, might reach them. The footage could gain value if there was no internet back in Poland soon.\n\nThe bold undertakings of Coach Brzęczek faces its first piece of birdshit on the head, literal and figuritive: Liswarta kept its goal post safe from Truskolasy all the way until they managed to score at the last minute. The match was unremarkable other than that: Uninspired plays, going through the motions, minds being on survival, shelter and warmth, rather than the play. To be expected in the sorry state of affairs of this nation. But this could not last forever. Truskolasy had no resources to make a real team... yet. There is no match for honor, there is only the next one."
buzzer.4.a: "The first win of many."
buzzer.4.b: "NOTHING HAPPENED, POLES, NOTHING HAS HAPPENED"

buzzer.5.t.w: "Olimpia Truskolasy 3 : 1 Znicz Kłobuck"
buzzer.5.t: "Olimpia Truskolasy 0 : 2 Znicz Kłobuck"
buzzer.5.desc.w: "Znicz Kłobuck. Their stadion was nothing but a cleared, mostly even field with goalposts, with forest before them and a hamlet behind them. In our sorry, disconnected state, we do have to find someone to play: Even if it's a village no one has ever heard of. The first half went well: we kept the pressure on, maintained the ball, and didn't fumble it half the time even. Our midfielders made the Znicz yokels run around like they're chickens, and made passes that sometimes even landed in the intended general direction. At least Znicz was even more sloppy with possession, sometimes we didn't have to do anything to get the ball. So it was a genuine surprise that after one Laga they managed to execute, their striker got the ball in. \n\n At the second half, however, we scored, then scored again, and they never recovered. We even nailed in a penalty at last ten minutes. Unfortunately, Znicz had some spectators. Fans, even. Like Kazio Galewind. They say when he was little, he fell from stairs on the floor, and that's probably when he damaged his head. Strong, fearless, look of a village idiot that would go on to be a folk legend. When we won, one of our yokel players actually flipped the bird in Znicz general direction. Kazio understood few things, but he did understand flipping the bird. He jumped, he streaked, it took five men to keep him from brekaing the player's legs, but not before he knocked someone out with a pebble that was lying nearby. He only calmed down, roaring and crying, when his mom gave him some lamb chops."
buzzer.5.desc: "Znicz Kłobuck. Their stadion was nothing but a cleared, mostly even field with goalposts, with forest before them and a hamlet behind them. In our sorry, disconnected state, we do have to find someone to play: Even if it's a village no one has ever heard of. The first half went well: we kept the pressure on, maintained the ball, and didn't fumble it half the time even. Our midfielders made the Znicz yokels run around like they're chickens, and made passes that sometimes even landed in the intended general direction. At least Znicz was even more sloppy with possession, sometimes we didn't have to do anything to get the ball. So it was a genuine surprise that after one Laga they managed to execute, their striker got the ball in. \n\n And yet somehow, our yokel strikers were about as accurate as Raheem Sterling, years ago. With our possession dominance, the coach had enough, and in the 80th minute, he roared to make the team apply itself. \"FUCK EM UUUUP\", he roared, referencing an old Polish cartoon. All he squeaked out of them was a foul. The ref, a kid from the block who had a markings of a champion of international bully olympics, ordered a penalty and drew a card... but a discreetly delivered promise of lamb chops made him change his mind and stop at the penny. 0-2 for Znicz. We never recovered. But unfortunately, we brought our own ultras to hype us up, and they were not appreciating the result none too much: The coach had to scramble for safety as they streaked up the pitch and started pummeling players that didn't get out in time and the Znicz supporters, who were: A bunch of teenagers, a fat aunt that hit like a truck, a village idiot: A son of a landlord that was, alas, different: A little lazy, and not that agile, but still could throw an ultra like a judo master."
buzzer.5.a: "The Gods from Olimpia!"
buzzer.5.b: "NOTHING HAPPENED, POLES, NOTHING HAS HAPPENED"

buzzer.6.t: "Battlepitch: Training"
buzzer.6.desc: "- Ladies and Gentlemen, Janek Graczyk passes over the defense, aims and... GOAL! JANEK GRACZYK SCORES FOR THE OLIMPIA TRUSKOLASY IN JUNIOR LEAGUE! THE CROWD CHEERS! GRACZYK! GRACZYK! GRACZYK SCORES A GOAL!\nAll of Janek's 18 years of life have led to this. The first time he picked up the football and the first time he went to a training session at 7 years old were the first steps on his road to greatness. After the months of training and gruelling matches, he was drained of energy. He barely had it in him to stand on his own two feet. He only remembered glimpses. The hugs, the cheers, the cup, the locker room, and the limping to mother's car were just snippets. He thought he remembered crawling into bed. He was exhausted and had to recover before the celebration party the day after.\n\nHe was woken up by his mom early in the morning despite his instructions.\n- Some gentlemen, for you, honey. I think it's important.\n- Tell them, I'm not home, or something - Janek said in a sleepy tone.\n- Well, they're in your room already.\nThe boy fidgeted in his bed in panic, trying to cover himself with a quilt.\n- Congratulations, Mr. Graczyk. You have earned the privilege to serve your nation.\n\nThere was no time for preparation. Certainly no time to have the party, and almost no time to say goodbye to his mother. He and other young men were sent to a camp in the wilderness for who knows how long.\n- Good morning, recruits! - said a tall man in an amalgam of sport suit and uniform - I am Sergeant Coach Dawid Fuss, and you are the lucky few who were chosen for your extraordinary performance in sport to expand your range of capabilities. At our camp for next month, you will undergo a soldier's training that will complement your civilian physical excellence with military training.\nGraczyk's face expressed all his thoughts about this premise. Instead of celebrating with his friends and looking for ways to further his football career, he was stuck here learning to clear BB guns. He took a longing glance at the man in camouflage t-shirts playing a football match.\n- Why do they get to play football and we're to be grunts?\n- Isn't it obvious that if you, the athletes, have to learn the soldier's life, they have to learn how to be sportsmen? - Sergeant then added with a shit-eating grin - Further congratulations! You've just earned 50 additional push-ups for backtalking. And it's not even time for morning exercises!\nThe next days passed on learning how to maintain weapons, how to use them, how to communicate, and, of course, how the drill works. Then the Sergeant told them he had something special for them.\n\n- You may think you know what this is, but you'd be wrong - Fuss pointed at a football behind some kind of large window. - Finally, Graczyk exhaled and, with no hesitation, stepped out of the line and, with his top speed, bypassed the window and headed towards the ball.\n- Wait! - The Sergeant shouted, but it was too late. Graczyk kicked the ball, which flew a good distance before it hit one of the military jeeps that momentarily blew up in a fiery explosion.\nIt was... I... - Fuss's eyelid twitched - I TOLD YOU THIS WASN'T WHAT YOU THOUGHT! It was a prototype mine imitating a ball! AND YOU BLEW IT ALONG WITH A MILITARY VEHICLE!"
buzzer.6.a: "Oops!"

buzzer.7.t: ""
buzzer.7.desc: ""
buzzer.7.a: ""

buzzer.8.t: "Formal Declaration"
buzzer.8.desc: "- Why wasn't Domagalik chosen to go into the enemy territory? - That was the question that kept circulating the running envoy Daria Szpak as she traversed Truskolasy and other surrounding woods that no one bothered to name. She knew the answer. Despite Domagalik being a more respectable diplomat than her, the board knew that the proud commandos, as a vestige of the official military of the defunct Third Republic, may disregard any representatives of the Club Association. Anyone who goes there may be hanged as a traitor and bandit, and Dońska was seen as more expendable. That also meant a rather humble escort consisting of four people armed with baseball bats and BBs. All on foot and expected to jog their way to Lubliniec according to the spirit of the Club.\n\nThe borders controlled by the JWK should be nearby. But where were the border guards? In a quarter of a second, Lubliniec commandos dropped from the trees and jumped out of the bushes, aiming their rifles at the running delegation.\n- Erm, take us to your leaders.\n\nGeneral Kukuła waited for the delegation at the bland white room military base in Lubliniec, among the most senior in rank advisors he could count on.\n- Mrs. Szpak - Kukuła dressed as if he were the one to come out of the woods - I was informed by my scouts that you arrived from Truskolasy. To what do I owe the pleasure of seeing you here? I hope it's not about launching an attack against us?\n- Actually - Szpak's voice betrayed that she was surprised at how much they knew - It's about that and more.\n- Oh? - The general didn't expect such forwardness. Official declarations of war were hard to find these days - Please, continue.\n- Yeah, just so you know what you can expect, our defensive line is quite impenetrable, yet still elastic. The defenders at any second can start pressing and outmaneuvering your men on the flanks.\n- What's her deal? - Kukuła thought to himself. Was that supposed to be a declaration of war, or was she a defector from Brzęczek or a spy tasked with misinformation? He then added aloud - And what's the most you can throw at us?\n- Oh, a real rocket, sir!\nKukuła turned his head towards the subordinates and asked them a silent question with just his stare.\n'Where the hell did they get a rocket?'\nHe tried to keep his cool.\n- Thank you, Mrs. Szpak. You've been very forthcoming with the information.\n- Well, you have to be informed so that our and your boys can meet. Kukuła smiled at the joke.\nThis - the Truskolasy envoy added - will be an amazing match! Blinked from all the confusion."
buzzer.8.a: "A match?!"

buzzer.9.t.w: "Olimpia Truskolasy [?BRZ_goals] : [?enemy_goals] Sparta Lubliniec"
buzzer.9.t: "Olimpia Truskolasy [?BRZ_goals] : [?enemy_goals] Sparta Lubliniec"
buzzer.9.desc.w: "Breaking news!\nOn a sunny day in Lubliniec, two teams gathered at the Sparta Stadium. The Club Association clearly wanted to have its first football match with another warlord on more dignified ground than a school pitch in Truskolasy. You could see in their eyes how they wished they had it and an adjacent training center for their own. Thanks to that arrangement, Sparta Lubliniec had the benefits of fighting on the home turf, such as the cheers from the friendly crowd. Though not all of the Lublinieczans remembered what sportsmanship was. Our reporters on the scene related that, when the Club Association players arrived, some of the inhabitants had thrown litter at them as they were heading for the stadium, calling them traitors who should be in jail. Still, they seemed to be in the minority, and the match commenced with no further disruptions. The fans of both teams that gathered in the stadium seemed genuinely hoping that the tensions between the two factions could be settled here and there, hoping that football might be the best way of channeling the most violent urges of men.\nJust before the match, the members of both teams embraced each other and Spartans sang their club song. The team from Truskolasy had neither a song nor any record of it, due to the passage of time. The two teams eyed each other. They waited a minute before the game started with a whistle.\nThe team from Truskolasy, thanks to their professional experience and revolutionary training, won against their opponents, boosting the pride and confidence of Truskolasans for months to come, building the legitimacy of the Club Association as a football organization!"
buzzer.9.desc: "Breaking news!\nOn a sunny day in Lubliniec, two teams gathered at the Sparta Stadium. The Club Association clearly wanted to have its first football match with another warlord on more dignified ground than a school pitch in Truskolasy. You could see in their eyes how they wished they had it and an adjacent training center for their own. Thanks to that arrangement, Sparta Lubliniec had the benefits of fighting on the home turf, such as the cheers from the friendly crowd. Though not all of the Lublinieczans remembered what sportsmanship was. Our reporters on the scene related that, when the Club Association players arrived, some of the inhabitants had thrown litter at them as they were heading for the stadium, calling them traitors who should be in jail. Still, they seemed to be in the minority, and the match commenced with no further disruptions. The fans of both teams that gathered in the stadium seemed genuinely hoping that the tensions between the two factions could be settled here and there, hoping that football might be the best way of channeling the most violent urges of men.\nJust before the match, the members of both teams embraced each other and Spartans sang their club song. The team from Truskolasy had neither a song nor any record of it, due to the passage of time. The two teams eyed each other. They waited a minute before the game started with a whistle.\nDespite the Truskolasans proffesional experience and the determination of the Truskolasy team, Sparta Lubliniec players with the voluntary help of amateur football players from among the commandos won the game. A bad start for the Olimpia Truskolasy as a whole. Now that Brzęczek failed so early as a coach, many start to wonder that he may also fail as the leader of the state."
buzzer.9.a: "The Gods from Olimpia!"
buzzer.9.b: "Somehow, the Spartans beat the Olympians!"

buzzer.10.t: "The Janitor's Lament" # Truskolasy TOP
buzzer.10.desc: "Last minutes of the match. Everybody in the bar was awaiting the final score with bated breath.\n- He is running towards the goal with the ball, while the defenders can’t do anything! He takes the shot, and GOAAAL! - The Commentator’s excited voice shouted through the TV.\n- GOOAAAL! - Everybody in the bar screamed as loudly as they could. After a few minutes, the referee finally blew the final whistle. The ZWKT was victorious. The fans went out of the bars, homes, and cinemas.\n- LONG LIVE BRZĘCZEK! LONG LIVE TRUSKOLASY! FUCK PZPN! - They all screamed. \n\nThe mothers closed and covered the windows, while the marches continued.\n\n- Mom, what is going on? Why is Dad assaulting some other people? - A clearly confused kid asked, looking out of the window.\n- Don’t worry, Dad is just playing with his friends. Now go to sleep; you have to go to school tomorrow. - His mom responded, a bit anxious.\n- He is playing with his friends? Can I join?\n- NO! Go to sleep now, or Mom will get furious.\n- Okay, okay, I guess. - The kid responded in a resigned tone. \n\nMeanwhile, the streets were still in uproar. Broken bottles were everywhere, while drunk hooligans still shouted “FUCK PZPN” and destroyed fences, statues, and street signs. One even decided to enter a balcony, holding a ZWKT flag.\n- LONG LIVE BRZĘCZEK, THE RESTORER OF POLISH FOOTBALL! - He screamed, waving the flag. After just a while, he fell from the balcony, but he quickly stood up and continued waving his flag and shouting. The streets only calmed down the next day, but they still looked like after a bomb was detonated. Sleeping hooligans were all over the place, while the ground was filled with flags, empty bottles, and undetonated Molotov cocktails. One of the governmental janitors just sighed and grabbed a broom from his truck. \n\n- Ugh. - He thought."
buzzer.10.a: "- This is going to take a lot of time to clean."

buzzer.11.t: "How could this happen?"
buzzer.11.desc: "... That was the thought that echoed in the minds of the Olympians in the locker room.\n- You had every advantage possible! - Brzęczek started his tirade to the players - we practiced for months for this day, ever since I returned to Truskolasy. And what do I get for my efforts? A shoddy performance and a defeat? What? Was I not clear enough that this could be a match of your... our life? To breathe new life into Polish football, into the Polish nation!\n- Coach - defender Woźniak said with a quiet voice - Have you seen some of those guys? They were a head taller than us and somehow faster. We've been training hard, but we can't compete against military training!\n- Bullshit! - No one ever heard so much anger in Brzęczek's voice - Wanna know a secret? Lubliniec didn't know we'd have a match until two weeks ago. Two weeks! Two weeks were enough to beat your monthly effort.Brzęczek thought he was on the right path, but now he was starting to lose hope. He wanted to go back home. But he was home. He started from zero and had nowhere else to go but forward. He took a deep breath and adjusted his neckerchief.\n- Gentlemen, you'd have to do better in the next match. - he went back to his usual calmer tone - As you can expect, your fans are furious and gathering themselves ready to avenge your failure. I implore you to push yourself to absolute limits next time, so we can avoid such unpleasant reactions. I look forward to seeing you next week at a strategy meeting, where we will address your shortcomings. - he waited over 6 years for his time after the last dishonorable demotion. He can wait more.He left the locker room much to the confusion of the players.\n- Was he speaking the truth? - Woźniak spoke once again.\n- I mean, yeah. The hooligans secured his position as a politician - midfielder Szwacz explained.\n- Was it true then? They will march on Lubliniec because of us? - Woźniak's voice betrayed general concern about the scope of their failure.\n- Don't be stupid - Striker Brzeziński swatted his colleague in the head - Brzęczek got in his crew the most violent of hooligans and then got them high on power. They would've marched on Lubliniec whether we won or not. He was clearly guilt-tripping us.\n- Why didn't you say it to his face then? - Szwacz inquired, looking into his teammates' eyes. The whole team waited for an answer.\n- No sense arguing with the old man, especially..."
buzzer.11.a: "... that we really fucked up"

buzzer.12.t: "Sparta, Sparta! Chuja warta!"
buzzer.12.desc: "The bus from Truskolasy was filled with a ruckus. The singing clashed with wilderness scouts and lord conversations; some already started drinking and eating snacks as if the raid was over. Some flexed their muscles during the arm wrestling or just showed off to the giggling girls. I seemed the smallest move of the tiniest muscle compelled the passengers to roar, spit, and swear the loudest they could as if they tried to demolish Lubliniec with sound waves alone.\nAll it took to quiet them down was for Kosa to stand up.\n- Hey! - All of the eyes, betraying varying levels of drunkenness, were looking at him. People stopped drinking, eating, and groping to give their leader a floor. Kosa took a while to enjoy the silence and spoke - We all know why we're here. We're here to show those assholes from Lubliniec that you don't fuck with the fans of Olimpia! We stop, we get out, we fuck up everyone we see. Simple. But don't get too cocky. You're not the best. The best were sent almost a week ago, preparing the terrain for us. Any questions?\n- Y-yeah - Sausage evidently got carried away with drinking - Are we... Are we fucking them up cause we won or they won? Can't remember, heh.\nKosa approached him slowly and took a good look at him. He picked up the bottle of beer that Sausage hadn't managed to empty yet. He threw it out of the window and began mercilessly beating the drunken men. When he finished, he turned to the others.\n- Any questions that are not fucking stupid?\n\nThey stopped nearby Herby. Their arrival was heralded by the Molotovs thrown at the local police post. The officers inside were forced to leave the building and surrender or be burned as well. Everything worked according to Kosa's plan, leaving the goal area around Lubliniec ripe for the taking for the main forces of ZWKT.\n- Freeze!\nWell. Almost everything worked. A sole commando with full equipment was aiming at the group of hooligans with a rifle.\n- They were supposed to be at the front! - Someone from the crowd screamed.\nWith no proper ranged weapons, the raiders raised their hands, but not Kosa. He made a step forward.\n- I said freeze! - the soldier repeated.\nKosa knew that whether he surrendered or not, the raid on Herby would end in failure. Unless...\n- I'm fucking talking to you! - The man, now pointing the rifle directly at Kosa as the hooligan made a second step. But still, there hasn't been a warning shot. With a third step, the hooligans who were the closest to their leader. With the fourth step, it became clear that the 'commando's' rifle has no bullets. Then they started to march with him. Then the march turned into a sprint. The soldier fled the town at the sight of an angry mob running at him.\nFor this act of deception, the hooligans demolished local homes, infrastructure, and businesses, including a local kebab restaurant that was robbed for the celebratory feast."
buzzer.12.a: "Like true patriots should"

