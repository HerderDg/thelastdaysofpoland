buzzer.30.t: "Constructive Criticism" # Footballers without a resolve
buzzer.30.desc: "- A million for this beautiful villa. Can you even afford it?\n- Can I afford it? I can buy 10 of those! \n\nHe grabbed a suitcase from his luxurious car and opened it. It was full of 200-złoty banknotes.\n- Here you go, now take it and get out. - He said. The seller nodded, quickly took the suitcase, put it in his car, and drove away.\n\nAntoni Krawczyk used to be just another player at Olimpia Truskolasy. His life used to be bad. Before, he was just a player at a mediocre team that nobody had ever heard of. Now, he is earning millions. He has cars, fame, practically everything.\n\n- Uhh, Mr. Antoni? - His secretary said in a quiet voice, clearly stressed.\n- Yes?\n- The management has just sent us an email that they are disappointed with your play in the last match... You scored no goals, no assists, no passes. - His Secretary said in an even quieter voice.\n- Who cares? No matter how many matches we lose, the management never does anything more than send a strongly worded email.\n- They also said that if you fail to improve, there will be consequences. - The Secretary replied, a bit scared. Antoni let out a long laugh.\n- Like I'm scared! - He replied, still amused.\n\nThe Secretary left the room. Suddenly, Antoni heard a screech outside. He went out to the balcony and saw a long bus plastered with Olimpia Truskolasy logos. One of the people inside went out of it, holding a bloody bat.\n\n- What are you doing here? Get out! This is private property! - Antoni screamed at them.\n- Oh, no, no. The only one who should get out is you. - The Hooligan replied. Other hooligans started coming out of the bus, each holding either a bat or a Molotov cocktail. The footballer started fleeing; however, the hooligans managed to demolish the fence and catch him.\n- Do you know what we do to saboteurs?\n- I don't know, give them a stern reprimand and leave their property be?\n- No. We beat them up. - He turned to the other hooligans. - Comrades hooligans, let's remind him what happens to enemies of Olimpia!\n\nThe hooligans with bats started beating Antoni, while the others took everything valuable and destroyed the rest. Antoni quickly fell unconscious. When he finally woke up, he didn't see any hooligans; however, he saw what they had done to his property. Missing expensive paintings. Ripped wallpapers. Destroyed walls.\n\n- Whatever. I can always buy another house. But those hooligans... They will get what they all deserve. I heard the ones from Znicz Kłobuck would do anything for money."
buzzer.30.a: "We will see about that tomorrow."

buzzer.31.t: "Young Blood" # Focus on Young Talents
buzzer.31.desc: "Krzyś Olbrachski was just a normal teenager living in Truskolasy, playing football for fun. After the collapse and the establishment of the Truskolasy Free Club Association, he joined Olimpia Truskolasy's youth team. He played in it for a few years; however, one day his coach called him for a meeting after the match. Curious, he decided to come.\n\n- Krzyś, I have an important thing to tell you. - The coach said.\n- What is it, trainer?\n- Well, the management of our team has noticed your potential, and they want you to pursue a professional football career. - The coach announced. Krzyś was shocked, but in a good way.\n- However, there is a caveat. You will have to practice football for 4 hours every day for now, and even more later.\n- No problem! - Krzyś responded proudly. He was going to tell everybody.\n- Alright then. You won't have training here anymore, but in the Kłobuck training camp. Be there at 6 tomorrow. - The coach finished. Krzyś's eyes beamed with pride. \n- Kłobuck Training Camp? The one for the best of the best? - He asked.\n- Yes, that camp. Now go and rest before tomorrow. - The coach replied.\n\nKrzyś buzzed with excitement. After all, who would remain emotionless after such an offer? He grabbed his backpack and ran home as fast as he could, eager to tell his parents what happened. \n\n- I'm going to become a professional football player! - He shouted as soon as he entered his house.\n- What happened? - His mom said, stunned.\n- My Coach just told me that Olimpia wants to have me as a professional player! - He said, still buzzing with excitement. I'm going to train at the Kłobuck Training Camp from now on!\n- Wait, are you for real?\n- I am! - He responded. His mom hugged him.\n- My son! I always knew you're going to accomplish great things in life! - His mom said, clearly proud. Meanwhile, his father returned from work.\n- Maciej! Your son will be a footballer! - Krzyś's mom shouted. \n- Wait, what happened? - He asked, confused.\n- My Coach just told me that the management wanted me to be a professional football player!\n- Son! Have I ever told you how proud I was of you? - He said, feeling even prouder than his wife. He hugged him passionately. \n- Okay, but I have to go to sleep now. Tomorrow I have to be at the training camp at 6 am.! - He said. \n- Alright, I guess. - His father said, letting go. - Don't disappoint me!\n- I won't! - Krzyś responded, already halfway in his room. \n\nWhen his alarm went off at 5 am., he quickly got up and dressed himself, after which he took the bus to go to the camp. The bus was filled with people his age; all of them beamed with pride. When the bus arrived, a coach was already waiting. The people on the bus quickly got out of the bus and stood in a line in front of the coach.\n\n- Alright, future footballers! Leave your things and go to the running field! There, run around it 10 times. - The coach said. The crowd did exactly as told.\n- Just a few years, and I will be the next Lewandowski! - Krzyś thought while running."
buzzer.31.a: "- Just a few more years!"

buzzer.32.t: "A Stranger in a Strange Land" # Focus on Foreign Transfers
buzzer.32.desc: "Juris Ozola was just a simple player in one of the many weak teams of Latvia. He wasn't some football mastermind - during matches, he mostly sat on the reserve bench. However, one day the management called him for a meeting.\n\n- To what do I owe the pleasure?\n- Dear Juris, while we loved having you on our team, some things just have to end. We have accepted an offer from Olimpia Truskolasy to sell you to them.\n- Excuse me? I have my family, friends, and my house here! I can't just leave.\n- You can. And you will. The Truskolasy delegation paid us fifty thousand dollars for you. That was an offer we simply couldn't pass up.\n- You are selling me, such a valuable player, for just fifty thousand?\n- To be honest, it was much more than we anticipated. Get your belongings; the bus is outside. Good luck in Truskolasy. - The manager said, then pushed him out of the room and closed the door.\n- There is no way I'm going there. I can't just leave my family. - Juris thought.\n- Also, if you don't go there, you have to pay them a hundred thousand dollars.\n- What? Why?\n- It's specified in your contract. Either you pay it, or you go there. There is no other choice.\n\nJuris thought about it. There was no way he was going to gather so much money.\n\n- Do I really have to go there? Can't you just rescind the transaction?\n- No. Now get your belongings and get into that bus. - The manager responded.\n\nJuris, defeated, packed his belongings, ended his rent agreement, said goodbye to his closest family in a matter of hours, and finally boarded the bus. He noticed some other people on the bus and sat next to one.\n\n- What's your name? - He asked.\n- I'm Aleksandr Koppel, and I'm from Estonia. I got sold by my team a few days ago, and now I have to go to Truskolasy, a shithole in Poland. - The other person replied, clearly stressed.\n- I had a similar fate. My team sold me for just fifty thousand dollars.\n- Fifty thousand? Mine sold me for just ten!\n\nAfter some time, the bus finally started moving. While after crossing the Latvian-Lithuanian border not much changed, the crossing between the Polish and Lithuanian border was a different story. Ruins upon ruins. Vagrants upon vagrants. Juris knew about the situation, but didn't think it would be this bad. During the drive, he heard gunshots and warfare many times, but decided to ignore it for his own sanity. After a few hours, they finally arrived at the Kłobuck training camp. Juris could see training players everywhere. They were kicking the ball, shooting, either with a ball or a gun, and training passes. After a while, the bus stopped, and the driver told the players to exit the bus. Juris was the first to exit, and the rest followed. \n\nA sergeant was standing in front of them, proudly showing three medals on his chest. \n- Alright, footballers! Welcome to Kłobuck. Here, you will train for the upcoming matches. The manager is that way; if you want to ask anything, go ahead. - The sergeant said in broken English. Juris decided to go to the manager.\n- What is the pay?\n- A hundred thousand złoty per year. - The manager replied.\n- Huh. - Juris thought."
buzzer.32.a: "Maybe living here won't be as bad as I thought."

