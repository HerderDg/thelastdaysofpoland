#####  FIRST TREE PART 1  #####


CIE_cieszyn_wont_bow: "Wisła Won't Bow to Bandits!"
CIE_cieszyn_wont_bow_desc: "The Golec Brothers exiled him, sent him off back home, fearing his influence and popularity. They hoped that he would quietly fade from the people's memory, as they established their fiefdom, but Adam Małysz was not one to back down so easily.\n\nThey were right to fear the populace's draw to his person, as Małysz found no trouble forming a splinter state around his hometown of Wisła. It stands as a beacon of democracy, one that the Bandits in Żywiec want snuffed out for good.\n\nTheir forces slowly gather on the Vistula's banks, eager to get revenge on the Eagle of Wisła's insolence.\n\nThey won't repeat their mistake again..."

CIE_eagle_from_wisla: "Eagle from Wisła"
CIE_eagle_from_wisla_desc: "...King Weissflog II, Goldberger of the East, King of Holmenkollen. Adam Małysz is a triple world cahmpion who became a living ski-jumping legend in Poland. He achieved national and international recognition as soon as he turned 24. If he were to sell the gold medals and cups he earned in his career, he would be able to finance the whole reunification military campaign from his own pocket, even if the Olympian gold continued to elude him. One could compare his popularity to that of John Paul II, but as opposed to the late Pope, he wasn't involved in any scandals and quit in his prime.\nThe cult following he amassed, especially in his neck of the woods, is so undeniable that he could establish any government he wants. The inhabitants of Wisła can breathe, as all he wants is a functional liberal democracy." 

CIE_emergency_government: "Emergency Government"
CIE_emergency_government_desc: "Despite the enthusiastic voices celebrating the independence of Wisła, the state of things is not permanent. Małysz just retreated here from Bielsko-Biała, expecting a military standoff from the Golec Brothers. Still, the invasion by the robbers is a looming disaster that doesn't seem to materialize. At least for now. People can't hold their breath for too long, though. They need a semblance of functional government: Police force, postal service, civil and military bureaucracy. Even if just for the time being. There is also a need to remind the locals that an attack may come at any time, and everybody needs to be ready for a sudden attack, knowing how to keep themselves and their families out of harm's way." 

CIE_bloody_squirrel: "The Bloody Squirrel"
CIE_bloody_squirrel_desc: "Thankfully, Polish ski-jumping didn't end with Małysz. After him came a few masters in their own right, such as Piotr Żyła. A triple world champion with a unique 'style' during the interviews, he gained popularity of his own. Thankfully, he decided to help his brother in sport and in faith and become one of the faces of Małysz's government. He is a bit of a mixed blessing, though; The very same thing that made him a fan favourite - him telling the television whatever is on his mind - comes off as endearing, but it also makes him rather unpredictable. Sure, honesty is well-received, but when the spokespeople have to say twice as much as Żyła to correct something the skier said... The pros and cons of his presence begin to blur."

CIE_highlanders_ambushes: "Deal with Highlanders Ambushes"
CIE_highlanders_ambushes_desc: "Despite the unofficial armistice, the Golec Brothers keep prodding our defences. Not officially, of course. They use unmarked 'black hat' hajduks that harass our citizens. A functioning military would make short work of them. But the Eagles of Wistula can't rely on a functioning military. The best we've got is a mixed martial arts fighter and a few partisans of our own. With that, the best we could have hoped for is some skirmishes on the border. For now, that's enough to protect the civilian population, though if we want to be ready for the final confrontation, we can't allow ourselves to have to deal with those raiders once and for all, one way or the other."

CIE_cieszyn_defence_council: "Help from the Euromandate"
CIE_cieszyn_defence_council_desc: "Although we're not a government that was officially sanctioned by the European Union, we share a great deal when it comes to our ideals... At least more than the robbers from Żywiec. Apart from politics, Cieszyn is to this day full of avid Małyszomaniacs as well as the beating heart of Polish Lutheranism. The Czechs shouldn't have any objections either; Ski jumps in Liberec and Harrachov have always been kind to Małysz. We have all the cards needed to negotiate some sweet deal to outsource the defense of Wisła to them as much as possible." 

CIE_united_against_our_foe: "Envoy to Wilamowice"
CIE_united_against_our_foe_desc: "Democracy is not yet dead in Podbeskidzie as long as someone is willing to fight for it. If not for the Golec's brothers' tentacles holding Bielsko-Biała, the republic would've joined us in the fight and restored order to Żywiec. All is not lost, however. In their arrogance, those bandits focused their efforts solely on Little Vienna. As our informants point out, they seemed to forget a small but significant element of the local balance of power: the Land of Wilamowice. Its inhabitants, the Vilamovians, are a microscopic minority of about 20 people (at least according to a decade-old census), speaking a unique Germanic dialect. Not that impressive, but if we were to find allies in them, they could serve at least as a distraction in the coming fight." 

CIE_consolidate_our_troops: "Consolidate our Troops"
CIE_consolidate_our_troops_desc: "After the putsch in Bielsko-Biała, all the military personnel toed in line; Once the new regime got an unofficial green light from Lieutenant Colonel Pracki, there was no one brave enough to question the new establishment. Our survey among lower officers served no purpose. Despite the promises of rapid promotions and sympathy for our cause, the single look from potential defectors at us was dismissal; that is, a bunch of sports fans led by a few ski-jumpers and an MAA fighter was enough to dissuade them. It's true, we may not have the most professional army in Poland, but we can count on one of the most dedicated recruits and a commandery that knows like no other what discipline means. We need to keep our hope." 

CIE_battle_of_brenna: "Battle of Szczyrk"
CIE_battle_of_brenna_desc: "Here they come! Today the bands from Żywiec fired at our guard posts in Szczyrk. We've done all we could to prepare ourselves, and now it's time to see how high the Eagles of Wisła can fly!"

CIE_they_are_coming: "They are Coming!"
CIE_they_are_coming_desc: "“SZCZYRK HAS FALLEN!”\n\nThe news struck the people of Wisła like a bolt from the blue. Małysz felt as though he had just botched a jump. The units defending Szczyrk had been shattered and retreated in disarray to Wisła and Brenna. The retreat quickly turned into a panicked rout, during which they suffered heavier losses than in the battle itself.\n\nThe Golec brothers ruthlessly exploited the situation. The bandit hordes struck into the breach like a sharp axe. Their columns were already visible from the highest mountains surrounding Wisła. A pale dread fell over the town. Many of the elderly and children have already set off toward the Czech border to escape the bandits. Even so, Adam Małysz has not abandoned his native land. He is rallying the people of Wisła to fight and is pondering how to turn the tide of the war." 

CIE_one_last_stand: "One Last Stand"
CIE_one_last_stand_desc: "In sports, people sometimes write you off because the situation seems hopeless. But that is precisely when you must not give up! Those who fight to the very end still have a chance - however slim - of victory, while those who surrender have none. Adam Małysz learned this firsthand.\n\nThe same applies to a nation that has lost a battle but not the war. The people of Wisła will defend their homes to the last drop of blood and win - even against helpless odds! Every building will become a fortress, and wherever the bandits turn, an ambush will await them.\n\nBesides, if you want something done right, count on yourself. Only a triumph won through their own efforts will give Górals a sense of agency and belief in their own strength. Besides, foreign aid might not arrive in time - or it might be denied altogether."

CIE_watchers_on_vistula: "Watchers on the Vistula"
CIE_watchers_on_vistula_desc: "Many of the best Vistulan soldiers fell in Szczyrk. This created a severe shortage of personnel that needed to be filled urgently, especially with bandits at the gates. Małysz hesitated, but ultimately decided that the requirements for new recruits - and their equipment - had to be lowered. Volunteers don't need to be young or athletic; the priority is simply to have someone, anyone, standing guard along the Vistula.\n\nFurthermore, not every soldier needs to carry a weapon. This is particularly true for the quieter sectors of the front. Why burden the fighters with tons of hardware that the Vistulan state does not even possess? In many cases, a simple knife is more than enough to effectively deter bandits. And an ancient Mauser rifle from a grandfather's cellar is a luxury, for which there is no ammunition anyway.\n\nThanks to this approach, the Vistulans are forming new units, which will plug the gaps in their defensive line." 

CIE_mountain_hideouts: "Mountain Hideouts"
CIE_mountain_hideouts_desc: "The Battle of Szczyrk demonstrated that Wisła's forces could not defeat the bandits in open combat. As a result, Małysz decided to change tactics. When conventional methods fail, it is time to turn to guerrilla warfare. Hidden bases will be established in desolate locations, such as caves or deep within the forests./n/nThey will allow for the observation of key mountain trails and rapid response to enemy movements. This will allow our soldiers to choose the time and place for battle. Meanwhile, the bandits will remain unaware of these hideouts' locations, ensuring the safety of the personnel stationed within./n/nFurthermore, there are spots in the mountains where a single soldier can hold off an overwhelming enemy for a long time. The people of Wisła will transform these bottlenecks into impassable strongholds. They will stop being prey and become the predators - while the bandits will end up just like tourists who set out on a mountain trail wearing flip-flops."

CIE_plead_for_intervention: "Plead for an Intervention!"
CIE_plead_for_intervention_desc: "Some see asking for support as a sign of weakness and cowardice. Nothing could be further from the truth: a mature leader must swallow his pride when his people's good demands it.\n\nAdam Małysz is exactly that kind of leader. After the defeat at Szczyrk, he turned to the European forces stationed in Cieszyn for help. Many criticize this decision, and some even accuse him of treason. But is it treason to defend freedom against tyrants who want to destroy it? Is there anything more patriotic than convincing a foreigner to shed blood for Poland?\n\nBesides, not all Europeans are Germans. A significant part of the troops of the Cieszyn Mandate are Czechs. They won't be brutal occupiers, but friendly allies. Right?"

CIE_heavy_price_to_pay: "Heavy Price to Pay"
CIE_heavy_price_to_pay_desc: "Hard decisions bring equally hard consequences. European forces that might intervene to defend the Wisła State are no different. It may save Górals from the schemes of the Golec brothers, but at what price?\n\nThe German officers commanding the European troops treat the Wiślans with contempt and arrogance. In exchange for protection, they want to impose a heavy yoke on the people of Wisła. The areas surrounding the town will become a buffer zone, and units loyal to Małysz will be incorporated into the European army's structure. The civil administration will be almost entirely subordinated to orders from Cieszyn.\n\nIn addition, every official or officer will undergo a loyalty assessment. Those who pass it will receive a G card, for “Goralenvolk.” And what if somebody is reviewed negatively? Adam spent many sleepless nights wondering whether it was worth agreeing to such harsh terms, but he had no choice."

CIE_grenzzone_weichsel: "Grenzzone Weichsel"
CIE_grenzzone_weichsel_desc: "By launching the uprising against Golecs' tyranny, Adam Małysz fought for freedom. Unfortunately, it looks like Wisła has jumped out of the frying pan and into the German fire.\n\nMost of the European troops are Czechs, who treat the Górals well. However, German generals take a different approach. They closely control every decision made in Wisła. Even the mildest criticism of them is met with accusations of Europhobia. Moreover, the loyalty assessment has been extended to all Górals. Fortunately, thanks to Małysz's efforts, being denied the G card does not carry any serious consequences, at least for now. The Wisła State is entirely at the mercy of the Cieszyn Mandate, and mocking voices have begun to call it the Grenzzone Weichsel.\n\nThis has its good sides, too. Bandit gangs have halted their march and will not dare to attack Union territory. The Wisła forces can catch their breath, although they will have to do so under the German boot."

CIE_tides_are_turning: "Tides are Turning!"
CIE_tides_are_turning_desc: "Finally, after a long, grueling guerrilla war against the Golec bandits, the tide is turning. Once thought invincible, the bandits are now afraid to enter our territory. Our military, once a disorganized bunch of poorly armed guerrilla fighters, can now be classified as something resembling a normal army. Our people, once terrorised by the bandits, have finally had some time of relative peace, and small businesses have begun to spring up again, reviving our economy and improving the common people's quality of life. Meanwhile, the Golec Brothers are growing more and more fearful as we improve, rebuild, and prosper. This is a great triumph not just for our country, but also for the entirety of Podbeskidzkie!"

CIE_victory_over_bandits: "Victory over Bandits!"
CIE_victory_over_bandits_desc: "We won. The bandits, though strong, were beaten back by our zealous army, ending the raid. While Szczyrk is still greatly damaged by the warfare, it could have been a lot worse if our army was the one to get pushed back. On the home front, there are still mass celebrations due to our victory, while Małysz's popular support has increased more than ever. Unfortunately, our military is in shambles following the raid, but the bandits' is too, which means we're still on somewhat equal ground, if not stronger than them. This is a great victory for all Cieszynians, and all who dare to fight for a better tomorrow, without the bandits!"

CIE_time_to_regroup: "It's Time to Regroup"
CIE_time_to_regroup_desc: "We have won, but what now? Our military is still in shambles, and though we probably could win another raid on the bandits, doing so would probably crush the remnants of our army and, with it, hopes of reuniting Podbeskidzkie. Therefore, we need to regroup! The Beskidy are good places for defending ourselves, but they could be even better if we built fortifications in less defensible places. This will both improve our defense capabilities and let the military grow back in size and quality to combat the bandit onslaught. Therefore, we will direct our construction companies to build as many fortifications as possible, while the arms companies will have to go into overdrive to supply our army with enough weapons to defend. This will be a hard time, but we will be rewarded for it in the future."

CIE_blockade_koniakow_pass: "Blockade Koniaków Pass"
CIE_blockade_koniakow_pass_desc: "The Koniaków pass is a really important place to defend, as through it lies a road leading to half of our country. Unfortunately, it right now has no forts, no fortifications, and no plans to create them. This must end now! Koniaków is a place we need to hold, or else the bandits will overwhelm us with their army. Sandbags, makeshift fortifications, anything! We will organize public works in Koniaków to both give a job to many dispossessed by the Fall and fortify it to resist any kind of attack. Otherwise, the bandits will just sweep in with their ragtag bandit militias and crush all hopes of a democratic regime in Podbeskidzkie, and we obviously don't want that, do we?"

CIE_fortify_szczyrk_gap: "Fortify the Szczyrk Gap"
CIE_fortify_szczyrk_gap_desc: "Many cities in Podbeskidzkie were built in small valleys, with one main road and many smaller ones, all connected to the main one. Szczyrk is, unfortunately, no exception. The bandits were close to capturing it, and now that they know our weaknesses, they would definitely break through the city and use the road to quickly encircle our units. Therefore, we need to fortify it. Barricades, sandbags, walls, and sentries. No bandit will go in, and even if they manage to get in, they aren't ever going out. With this, we will finally be able to resist the bandits effectively."

CIE_prepare_for_final_round: "Prepare for the Final Round"
CIE_prepare_for_final_round_desc: "The Golec brothers are going to invade us; this isn't even a question. The battle at Szczyrk was already hard; now they will strike with their entire army. They have probably already rebuilt their army and are just waiting to strike. However, they must know that we also prepared. The fortifications are ready. The army is ready. The people are ready. The economy is ready. We are ready. And if they dare to underestimate us, we will give them the sweet taste of steel, lead, and liberation, even if they field an undefeatable army against us. We will win."

CIE_strike_back: "We Need to Strike Back!"
CIE_strike_back_desc: "The bandits are crushed, but what now? Just standing down and trying to build fortifications won't be sufficient. After all, fortifications can't attack; as we all know, the best defense is offense, offense, and offense. Therefore, there is no time for “peace,” “waiting,” or “fortifying”. Now is the time to seize the moment and launch a counteroffensive against their disorganized troops, for Poland isn't going to be unified by defense. So, march on and fight! For democracy!"

CIE_raid_on_buczkowice: "Raid on Buczkowice"
CIE_raid_on_buczkowice_desc: "The bandits have attacked us once; it's finally time to repay the favor. Buczkowice, a small city in the bandits' territory, is a perfect target for a raid. Situated on relatively flat terrain, it will be a perfect place to orchestrate an attack. The bandits' military, still in disarray after their loss, won't be that hard to defeat, and once we capture Buczkowice, we will gain yet another city, providing us with manpower, arms, and goods. The citizens shouldn't resist, since after all, we're their liberators from bandit occupation. Or, at least, it will be the thing that the citizens will read in their morning newspaper." 

CIE_keep_malysz: "Keep Małysz in Place"
CIE_keep_malysz_desc: "Ever since the region came under European protection, rumors had swirled in Wisła about removing Małysz. He stood as the final obstacle to the city's full integration into the occupational structures. \n\nIt was therefore a great surprise when it was revealed that Adam would remain at the helm of the Wisła State. This decision reassured many of the Górals, putting an end to a wave of desertions from the army - and allowing Wisła to retain a modicum of independence. \n\nNaturally, the Germans would have gladly replaced the \"Polish Eagle\" with some mediocre, passive, and loyal Eurocrat. However, the vast majority of European troops in the region are Czech, and they expressed firm opposition to such plans - fearing an open rebellion that would almost certainly have erupted had Małysz been removed. Furthermore, a harsh winter has created significant logistical challenges, forcing the Europeans to cooperate with the Górals to survive."

CIE_czech_investments: "Czech Investments"
CIE_czech_investments_desc: "European intervention saved not only Wisła's independence but its economy as well. The Czechs have a vested interest in ensuring their soldiers do not die from cold or hunger; consequently, local warehouses were flooded with a wave of Czech products almost immediately after the military situation stabilized. It has reached the point where it is easier to buy Kofola than Coca-Cola.\n\nFurthermore, cross-border trade is flourishing. The number of visitors to Wielka Czantoria is nearly as high as it was before the Fall - though today, these visitors are not tourists, but rather traders or soldiers on leave.\n\nEven the Germans, despite their arrogance, have contributed to this economic improvement. Thanks to the persistent efforts of Małysz, they allocated a portion of EU funds toward the expansion of roads and warehouses in Wisła. This improved the supply situation for both civilians and the military."

CIE_tourist_resort_no_more: "Tourist Resort No More"
CIE_tourist_resort_no_more_desc: "Before the Fall, Wisła was one of the premier tourist destinations in Poland. Those days have gone with the wind. Luxury hotels were requisitioned as quarters for German generals, while more modest establishments were turned into barracks for Czech troops. Not a soul comes here for a holiday anymore.\n\nThis has triggered a collapse of the local economy. Former hoteliers are now desperately searching for the cheapest possible shelter just to get through the winter. Vendors of oscypek cheese and souvenirs don't even bother setting up their stalls - there is simply no one to buy anything.\n\nThese issues weigh heavily on Adam Małysz. The economic system that once sustained Wisła has run its course, and a new one must be devised urgently - a model that does not depend on the whims of tourists or the unpredictable nature of geopolitics, but instead allows the Górals to be the masters of their own fate."

CIE_wrong_place_wrong_time: "Wrong Place, Wrong Time"
CIE_wrong_place_wrong_time_desc: "The greatest crisis in the European Union's history has reached Poland. The forces of the Europaarmee have scattered to the four winds, and Euro-commissariats' structures have collapsed like a house of cards.\n\nWisła is no exception to this rule. A dispute between German generals and their Czech subordinates - which had been simmering since the very beginning of the intervention has reached a breaking point. The Czechs simply stopped following orders and began a retreat toward Cieszyn. The Germans, finding themselves completely powerless, fled as fast as their legs could carry them.\n\nAdam Małysz, ever the optimist, is pleased with this turn of events. With no EU officers present, they can no longer exert control over Wisła. Consequently, the Górals have regained their freedom and autonomy - all without a drop of blood being shed. Alas, this may not last long; the Golec brothers are already sharpening their teeth, eyeing a town now left without European protection..."

CIE_vistulan_buffer_zone: "Propose the Vistulan Buffer Zone"
CIE_vistulan_buffer_zone_desc: "One of the reasons for the collapse of the Eurocommissariats was the massive social unrest that swept across nearly all of occupied Poland. This also applies to the Cieszyn Mandate, currently under Czech administration; its foundations are shaking, and it will not survive without outside assistance.\n\nAs this is the only ally of the Vistula State, its collapse would leave Małysz's forces isolated. Fortunately, Adam has a plan. He has proposed that the Czechs establish a buffer zone, which would relieve the pressure on their own forces and resolve the issue of the protests. This would be achieved by transferring ethnically Polish territories to the Vistulan control.\n\nAccepting this offer would be a major success for Małysz. His state would grow significantly in strength, providing him with more resources to defend against an invasion by the Golec brothers. Furthermore, Cieszyn would serve as an excellent staging ground for exerting influence over the region's largest city: Bielsko-Biała."

CIE_temporary_martial_law: "Temporary Martial Law"
CIE_temporary_martial_law_desc: "The situation is dire, and it's clear that Małysz will need more power to ensure that our young republic survives the coming storm. As much as we don't want to do it, our refusal do what is required of us will come back to bite us during the war. Therefore, we need to declare it, even if Małysz will be talked about like Jaruzelski for some time. No, citizens, replacing Jaruzelski's face with Małysz's in his famous broadcast won't help us win the war; stop doing that!"

CIE_trip_to_cieszyn: "Trip To Cieszyn"
CIE_trip_to_cieszyn_desc: "Małysz is going to Cieszyn, the capital of the Eurokomissariat, for a meeting. During it, they will decide the future of both the Eurokomissariat and the Eagles. It's clear that the situation of the Eurokomissariats keeps getting worse and worse. Małysz is practically the EU's only hope of having a somewhat friendly government in Podbeskidzkie, though Małysz has recently decreased his support for the Eurokomissariats. We will see what the discussion brings to both our country and the Eurokomissariat."


#####  FIRST TREE PART 2  #####


CIE_pro_european_propaganda: "Pro-European Propaganda"
CIE_pro_european_propaganda_desc: "Although our population sometimes views the European Union as an inherently evil organization, its support could turn the tables in our struggle against our rivals. The ideological similarities between Berlin and us already make it so that we are the most obvious pick for help as well as recognition. However, not to risk our own internal stability chasing foreign aid, we should focus also on improving the perception of the European Union among our citizens. To deal with euroscepticism, we will use the little media we have and try to reach out to those we need to persuade."

CIE_white_terror: "White Terror"
CIE_white_terror_desc: "The realities that we live in require sacrifices to be made. Furthermore, our current internal situation really is something for our leadership to work on. Although not really a popular solution, we have to stabilize our statelet if we ever want to prolong our existence, even if it means that we have to resort to using force. We will organize arrests if needed to prevent any sabotuers and traitors from destroying our state from within. Taking an approach like this might be bit too extreme having in mind our values, but we have to do what is necessary in order to survive."

CIE_long_night_at_olza: "Long Night at Olza"
CIE_long_night_at_olza_desc: "Before the Fall, the Olza river was just a small river that has been used as a border between Poland and Czechia. Now however, the lands at the banks of Olza have a different role - a battleground. A part of Cieszyn Silesia has avoided the fate of the other regions of Poland thanks to European Intervention and occupation. Furthermore since nothing in this country is ever about to last, their mandate granted from Berlin has decayed and we are going to make a good use from that fact."

CIE_creation_of_cieszyn_council: "Creation of the Cieszyn Defence Council"
CIE_creation_of_cieszyn_council_desc: "The realities that we found ourselves in after the events of The Fall were harsh to say the least. Even with our current initial successes we are still vulnerable to all sorts of internal and external threats. While we can manage the dangerous groups from our interior, we also have to remember about the possible threats from across our borders. Forming the defense council will bring together people who somewhat know what they are doing. Through the collective effort we are aiming to keep our citizens safe from getting conquered and to overcome the future threats."

CIE_cieszyn_silesia_united: "Cieszyn Silesia United Once Again"
CIE_cieszyn_silesia_united_desc: ""

CIE_seize_remaining_equipment: "Seize the Remaining Equipment"
CIE_seize_remaining_equipment_desc: ""

CIE_fate_of_transolza: "Fate of Trans-Olza"
CIE_fate_of_transolza_desc: "Who knew that after a hundred years, Trans-Olza would once again become a contentious topic in Polish-Czech relations? The territory is now mainly inhabited by Czechs, though it still has a significant Polish minority population. The latter want the autonomy to continue, pointing out that the friendly cooperation of both nations that has worked so far would be threatened by the annexation by Wisła. They claim that exceeding the borders of the Third Republic would be a sign that the Eagles no longer hold dear the ideals of Polish reunification, instead selling their souls to the devil of imperialism. On the other hand, since the dissolution of the Eurokommissariats, the Poles don't feel safe under any government born after the European intervention. Whatever we decide, we'll have to ensure that every nation will be treated fairly under our jurisdiction."

CIE_vanguard_of_chybie: "Vanguard of Brenna"
CIE_vanguard_of_chybie_desc: "Each new conflict is a mother of new heroes. This precept was proven once again true in Brenna, where local grassroots militia made good use of the chokepoints created by numerous bodies of water surrounding it, defending their hometown bravely against the horde of raiders. It would be wise to enlist those brave fighters into a professional fighting force integrated with our military. We will welcome them with due honor to show all the troops we reward loyalty and fierceness, but also to ensure the Brennan partisans don't get any funny ideas about independence."

CIE_cieszyn_guard: "Cieszyn Guard is Ready!"
CIE_cieszyn_guard_desc: "Poles of Cieszyn Silesia finally feel they have something to fight for! A successful Polish government headed by Adam Małysz himself made our recruitment centers overflow with volunteers ready to fight for a brighter future. A large manpower pool, which we sorely lacked in our exile in Wisła, is now at our disposal and will make our task much easier. The newly formed Cieszyn guard is willing to defend both Olza and Wisła from any foreign invaders and is willing to march beyond to see all of Podhale united under one joint banner."

CIE_shares_in_cieszyn_industry: "Shares in the Cieszyn Military Industry"
CIE_shares_in_cieszyn_industry_desc: "Czech Cieszyn boasts a highly developed industry, including a military one. Unfortunately, one problem remains: no one wants to work in the ammunition factories, as the labor is both difficult and dangerous. The facilities sit empty, waiting for workers. Wisła faces a different challenge: after the Collapse, many people find themselves jobless. They are ready to take on even the most grueling toil just to secure a livelihood—yet they cannot, as there are no big employers to be found. \n\nThere is a simple way to resolve both issues at once. Adam Małysz could propose to the Czechs that willing Vistulans could be allowed to work in their factories. In exchange, the Górals would receive a significant portion of the equipment produced there. This would not only address the problem of unemployment but also help to rapidly rearm our military."

CIE_alliance_under_the_stars: "Alliance Under the Stars"
CIE_alliance_under_the_stars_desc: ""

CIE_polish_czech_brigade: "Polish-Czech Mixed Brigade"
