unification.38.t: "[GetNewspaper]Cieszyn unifies Tatry Region!"
unification.38.desc: "Even after all that's happened, eagles soar into the sky. In a place dominated by the mad, the power-hungry and the cruel, Adam Małysz, who gained national acclaim during his extremely successful ski jumping career, gathered a following that ended up ruling whole mountain range from Cieszyn to Gorlice. On the remnants of the westernmost EU vassals, he leads a moderate democratic republic, poised to restore the country to European democracy. \nYet, from the depths of the new statelet, rumors surface of greater ambitions still. In place of the ski-jumping boards where Małysz once won his medals (gold ones included), rumors of mysterious launching pads surface. Some comment that Małysz is laying the groundwork for his very own space program, hopeful he, a former sportsman, can bring the nation from the brink and into the stars, even though their expertise on the subject is, quote - \"over 400 hours in Kerbal Space Program\"."
unification.38.a: "That is a new hill record!"

super.38.t: "[GetNewspaper]Adam Małysz unifies Poland!"
super.38.desc: "Adam Małysz became national hero twice. And not even for a second was he a villain. In the eyes of the people he is as revered as the Pope. At first, he was just humble ski jumper, racer and manager.\n\nBut it's a long way from Wisła, and Adam rose from murderous fight with Bandit Brothers to saving country from its worst enemy - itself. When he conquered Lesser Poland, everyone saw how illustrious his rule is. Though he did not want it, he was meant to be Poland's salvation. Many just surrendered and switched sides, and those who did not, eventually perished by the sheer will of Małysz' followers.'\n\nNow the Eagle from Wisła looks into the sky, as that's where the true future lies. Not only for Poland, but for the entire human race. And he is only that much. A Hero of Humanity."
super.38.a: "Per Aspera ad Astra."
