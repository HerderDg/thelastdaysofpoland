CIE_plead_for_intervention: "Plead for an Intervention!"
CIE_plead_for_intervention_desc: "Some see asking for support as a sign of weakness and cowardice. Nothing could be further from the truth: a mature leader must swallow his pride when his people's good demands it.\n\nAdam Małysz is exactly that kind of leader. After the defeat at Szczyrk, he turned to the European forces stationed in Cieszyn for help. Many criticize this decision, and some even accuse him of treason. But is it treason to defend freedom against tyrants who want to destroy it? Is there anything more patriotic than convincing a foreigner to shed blood for Poland?\n\nBesides, not all Europeans are Germans. A significant part of the troops of the Cieszyn Mandate are Czechs. They won’t be brutal occupiers, but friendly allies. Right?"

CIE_heavy_price_to_pay: "Heavy Price to Pay"
CIE_heavy_price_to_pay_desc: "Hard decisions bring equally hard consequences. European forces that might intervene to defend the Wisła State are no different. It may save Górals from the schemes of the Golec brothers, but at what price?\n\nThe German officers commanding the European troops treat the Wiślans with contempt and arrogance. In exchange for protection, they want to impose a heavy yoke on the people of Wisła. The areas surrounding the town will become a buffer zone, and units loyal to Małysz will be incorporated into the European army's structure. The civil administration will be almost entirely subordinated to orders from Cieszyn.\n\nIn addition, every official or officer will undergo a loyalty assessment. Those who pass it will receive a G card, for “Goralenvolk.” And what if somebody is reviewed negatively? Adam spent many sleepless nights wondering whether it was worth agreeing to such harsh terms, but he had no choice."

CIE_grenzzone_weichsel: "Grenzzone Weichsel"
CIE_grenzzone_weichsel_desc: "By launching the uprising against Golecs’ tyranny, Adam Małysz fought for freedom. Unfortunately, it looks like Wisła has jumped out of the frying pan and into the German fire.\n\nMost of the European troops are Czechs, who treat the Górals well. However, German generals take a different approach. They closely control every decision made in Wisła. Even the mildest criticism of them is met with accusations of Europhobia. Moreover, the loyalty assessment has been extended to all Górals. Fortunately, thanks to Małysz’s efforts, being denied the G card does not carry any serious consequences, at least for now. The Wisła State is entirely at the mercy of the Cieszyn Mandate, and mocking voices have begun to call it the Grenzzone Weichsel.\n\nThis has its good sides, too. Bandit gangs have halted their march and will not dare to attack Union territory. The Wisła forces can catch their breath, although they will have to do so under the German boot."

