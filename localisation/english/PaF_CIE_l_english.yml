CIE_horses_on_morskie_oko: "Horses on Morskie Oko"
CIE_horses_on_morskie_oko_desc: "Questions of nationality and religion matter little compared to solving this conflict. Ever since the 1870s, tourists in the Polish Tatras could (if their wallets were heavy enough) visit the famous Morskie Oko, the Eye of the Sea, by a horse-drawn wagon. The comers and Górals loved this arrangement. But in recent decades, various animal rights NGOs have been pointing out that the horses are overburdened by carrying whole families, the wagon, and a carter to the mountain top. There was an effort to make a compromise and shorten the distance for poor animals, but when the Fall came, the Górals continued with their practices hidden by the shadows of the ruins of the state. Now that we have brought stability to the region, the question of horses comes up once again. This time we could offer to buy the horses, arguing they're needed for our cavalry regiments. Would that convince the animal rights activists, though?"

CIE_mark_new_trails: "Fortify the Southern Mountain Passes"
CIE_mark_new_trails_desc: "Everyone remembers how the Germans invaded Poland in 1939. Few remember that, on the order of Jozef Tiso, the Slovak army entered Polish soil simultaneously with the Nazis, annexing Spisz and Orawa for the remainder of the Second World War. Right now, Slovakia is led by Marian Kotleba, who openly declares himself to be Tiso's successor and might be our fledgling republic in the back, knowing his distaste for Western-style liberal democracies. Nevertheless, it shouldn't be that hard to dissuade him; His spiritual predecessor was able to take over Zakopane because the Germans did all the work for him. Few fortifications on the tamest of the mountain passes should scare him away."

CIE_cieszyn_muszyna_rally: "Cieszyn-Muszyna Rally"
CIE_cieszyn_muszyna_rally_desc: "People remember Małysz for splendorous ski-jumping career. It takes average Janusz some time to remind himself of the rally-driving part of Małysz's sports career. A shame, really. The rallying may have never come close to his first love; when it comes to results, he became a capable driver in his own right, earning 13th place in Dakar rally or becoming the champion of Poland and Czechia. We can use this episode of Małysz's ride to set up and promote our own humble rally from Cieszyn to Muszyna. People need every occasion they can get to celebrate in those trying times."

CIE_transcarpathian_highway: "Transcarpathian Highway"
CIE_transcarpathian_highway_desc: "The mountainous terrain and relatively small population made the idea of a highway for the southernmost part of Poland hard to imagine for the pre-Fall elites. The best the region could hope for was a section from Bielsko-Biała to Kraków that never advanced beyond the planning stage. Because of that, in a state led by a ski-jumper and rally driver, people wait hours in intercity traffic. It's plain unseemly. Our citizens need a quick way to move from one point in our country to another on a concrete spine, infrastructurally binding the lands under our control into one organism."
