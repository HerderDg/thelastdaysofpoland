#####  WAR TREE  #####


CIE_bielsko_biala_breathes_again: "Bielsko-Biała Breathes Again!"
CIE_bielsko_biala_breathes_again_desc: "All hope seemed lost. The election took place without independent supervision; commissions closed early or changed an hour before announcing results, and some even refused to publish them, calling the elections fraudulent. Some of our own people doubted the validity of the democratic process in such circumstances. Yet our cause isn't limited to lands we control; Citizens of the Republic of Podbeskidzie, furious at the blatant attempt to rig the election, protested in front of the town hall in Bielsko-Biała, demanding the release of true results. The corrupt bureaucrats, trembling at the heated response, gave in to their demands and revealed the truth: Tomasz Drabek won the race with 53% support, making him the winner in the first round! His brother, despite the official report, gained only 39%. The number of faulty votes, as expected, was highly exaggerated, dropping from 18% to 8%, with 5 p.p. of them being cast for an invalid write-in candidate: Adam Małysz. A bronze medal worth more than a gold one, given the circumstances."

CIE_ustron_accords: "Ustroń Accords"
CIE_ustron_accords_desc: "With the end of the puppet Bielsko-Biała government that fostered an artificial division, we can finally have a civil discussion about the future of the region with a new, sensible president. We invited the envoys from Bielsko-Biała and Wilamowice to Ustroń to sign a document detailing our cooperation. We will present them with a proposal of equal rights and autonomy for all mountain peoples, no matter how small their numbers and where they want to live. To protect those new privileges, we hope to establish a joint military organization, whose task will be to defend against all forces that would try to disturb peace and tolerance in the region."

CIE_second_front: "Second Front on Our Doorstep"
CIE_second_front_desc: "Some say it was a fight doomed from the beginning. That the Golecs wouldn't ease their grip on Bielsko-Biała by allowing free elections. And so it happened. Despite numerous pieces of evidence of misconduct and the protests it sparked, most commissions (those with fewer UP supporters) declared that Przemysław Drabek would remain in the presidential seat, with alleged support from 61% of citizens. Tomasz Drabek got 21% of the vote; A massive 18% of votes were deemed null.\nThe president-elect didn't even wait for the swearing-in before he signed an act establishing a defensive alliance between the Republic of Podbeskidzie and the State of Żywiec. Now we have both factions breathing down our necks, ready for the final showdown."

CIE_visit_tavern_rzym: "A Visit to Tavern 'Rzym'"
CIE_visit_tavern_rzym_desc: "Despite the mockery that was the election in the Republic of Podbeskidzie, there are those who still believe in the ideals of democracy, or at least in Małysz, or oppose the bandit ways of the Golec Brothers due to a clash of ideals or personal animosity. Our intel suggests the Żywiec borderlands in the Maków and the Little Beskids are potential hotspots for the popular uprising if the Golecs try to extinguish the last torch of liberty in the Beskid region. We will send spies to verify this information, survey the local population, and help instigate a revolution against the violent reign of the two brothers."

CIE_mobilizing_for_inevitable: "Mobilizing for the Inevitable"
CIE_mobilizing_for_inevitable_desc: "We have done all we could, but the confrontation is inevitable. We could only do so much by issuing raids and repelling them. We were worried that our soldiers would prefer to protect their homes and would be unwilling to involve themselves in the operations deep in enemy territory. Still, we underestimated how much the Golecs have been reviled due to their crimes. Our people know you can't negotiate with robbers; you need to strike at them where it hurts and stop them once and for all.\nIt will be a great risk. A full escalation would mean we could lose more than just a small border region; The fate of our state is at stake."

CIE_final_war_for_podbeskidzie: "Final War for Podbeskidzie"
CIE_final_war_for_podbeskidzie_desc: "The Bandits have been on borrowed time for a long time now, and the time has come to end their pitiful state and integrate their rotten regions into our regime. Our army is ready, our citizens are ready, and the Bandits are not. March on people, for democracy, for liberty and for peace, for this is the last war in Podbeskidzkie!"

CIE_republic_restored: "The Republic Restored!"
CIE_republic_restored_desc: "After a long struggle and bloodshed, we can finally say that the Republic of Podbeskidzkie, once the biggest polity in the entire voivodeship, has been restored for good. While such a situation happened before, now we have security from the bandits and an actual army, which the republic didn’t have. Małysz and Tomasz Drabek are already planning a meeting to discuss the future of the voivodeship, and we can confidently say that the future of the region just got into much better hands."

CIE_fate_of_wymysou: "Fate of Wymysou"
CIE_fate_of_wymysou_desc: "The Wymysou autonomy is a very weird topic to discuss. While the Autonomy aligned themselves with the Bandits, we could see that they weren’t very compliant with the orders of the brothers, and some of them also helped us liberate the voivodeship. Therefore, a question remains: Should we give them autonomy, or should we integrate them into our nation, risking social upheaval?"

CIE_brother_against_brother: "Brother Against Brother"
CIE_brother_against_brother_desc: "Now, the time has come to decide what will be the fate of the Golec brothers, Przemysław Drabek, and their army and administration. While the Golec brothers are definitely the ones who started this entire chaos and deserve proper punishment, the military and the administration are the ones we should decide on. Both are experienced, and it would be almost a crime to let their potential go. Of course, there is another position. Some don’t want to deal with traitors, and therefore they think they shouldn’t be pardoned. The question remains: What should we do?"

CIE_run_to_the_hills: "Run for the Hills"
CIE_run_to_the_hills_desc: "In the Polish anarchy, authoritarian regimes sprung up everywhere, including in Podbeskidzkie. The Górals in Podhale also created an authoritarian regime, and our job as the liberators of the voivodeship is to ensure no authoritarian remains standing; therefore, we will invade the Górals and crush the nationalist “Góralskie Veto” regime before it can grow its roots too much."

CIE_priviliges_for_gorals: "Priviliges for the Górals"
CIE_priviliges_for_gorals_desc: "The Górals aren’t easy to appease. They constantly demand more autonomy, and as of right now they are one of the biggest groups in our country, we would face yet another armed revolt if we did nothing. The privileges won’t be that big; it’s just protectionism to ensure their economy flourishes, the establishment of a council for them to air their grievances in, and an increase in pensions. This should appease them enough to accept our rule."

CIE_under_the_great_krokiew: "Under the Great Krokiew"
CIE_under_the_great_krokiew_desc: "The Great Krokiew is a place forever connected to Adam Małysz and Polish skiing, and now that we control it again, the popularity of Adam Małysz should dramatically improve there again. However, it also has an emotional value for many people, including Adam Małysz himself. And now, as the undisputed king of skiing back in town, maybe it’s time for his last ski jump?"

CIE_root_goralskie_veto: "Root Out the Góralskie Veto"
CIE_root_goralskie_veto_desc: "The Góralskie Veto is like a weed - if you let it grow, you will never be able to cut it down. Therefore, we need to cut it down as soon as possible, that is now. We will direct our army to find any partisan strongholds and destroy them, as well as start an education campaign amongst the citizenry to diminish the tyrants’ support among them. This should greatly decrease resistance in the Beskidy and will definitely allow us to integrate them much quicker."

CIE_dive_into_sacz_land: "A Dive into Sącz Land"
CIE_dive_into_sacz_land_desc: "In Nowy Sącz, an anarcho-capitalist regime currently rules with an iron hand over its workers, who labour tirelessly just to make their masters buy their 89th Yacht. Nobody in the Voivodeship deserves to be treated like they treat their workers, and we will not allow them to oppress them anymore! Therefore, we will direct our army to march and defeat their corporate PMCs, so that nobody in the region can treat their workers worse than animals!"

CIE_deal_with_tymbark: "Deal with Tymbark"
CIE_deal_with_tymbark_desc: "Tymbark isn’t a bad company. While they did cooperate with Nowy Sącz for a while, they aren’t an example of late-stage capitalist companies trying to create a world from Cyberpunk. We should show that there is a difference between them and Nowy Sącz, and therefore we will integrate them into our country unscathed, while cutting down the other monopolies which were created in Nowy Sącz. While it will definitely serve an economic role, it will also serve a propaganda role - after all, who wouldn’t trust what’s written on the caps?"

CIE_religious_powder_keg: "Religious Powder Keg"
CIE_religious_powder_keg_desc: "Catholics. Protestants. Greek Catholics. Orthodox. Throw them all into a single voivodeship, and you will have the least stable amalgamation of religions and cultures you have ever seen. However, our country is in dire need of stability, and it can’t be achieved by having the religions pitted against each other. Therefore, we will have to decide on our approach to religion, whether it’s secularism, religious tolerance, or something different."

CIE_sacz_economic_miracle: "Economic Miracle of Nowy Sącz"
CIE_sacz_economic_miracle_desc: "Say what you want about Nowy Sącz, but after we got rid of corporate influence, the already established means of production began expanding, and now we have something that may be called an economic jewel in the heart of the voivodeship. While other cities are trying to achieve more than it, none have currently succeeded, but it isn’t a bad thing, provided that there is immense growth in each of our cities!"

CIE_where_eagles_dare: "Where Eagles Dare"
CIE_where_eagles_dare_desc: "From Cieszyn to Gorlice. The Beskids. Tatras. West Carpaths. All under our control, and we’ll show that we’re more than worthy of governing these diverse lands. Our military has definitely improved since the fights with the bandits, while our economy has finally started achieving heights unheard of since the Fall. And it isn’t over yet - there is still a lot to be done, and it will be done in its due time. It’s time to rest for some time before returning to making our country even better, though the name of the republic will rest much, much longer, for we aren’t a republic, but a federation of different peoples, each with their own cultures, religions, and traditions, but under one banner, our banner of freedom and democracy!"


