#####  CHARACTERS  #####


POLITICS_ADAM_MALYSZ_DESC: "Adam Małysz was a national hero. And then the nation as a united monolith ceased to exist, divided by a wall. He returned to his hometown, Wisła, wishing to survive the coming storm in peace. That... was not meant to be, as an opportunity to save his own neighbourhood from the fire consuming the whole country quickly made him give up his retirement. \n\nMałysz joined the newly formed Council of the Provisional Government of the Podbeskidzie Republic as one of the advisors and social representatives. He had hoped that even if only to a small extent, he could contribute to the survival of democracy in Poland. The peace, however, did not last forever as the president of the Republic of Podbeskidzie, Jerzy Buzek, fell ill and died in office. \n\nWith the president's death and raids from local upstarts becoming more and more rampant, the Council fell into chaos, unable to solidify their statelet's position. Days spent on bickering and panicking became weeks, and the republic's already bad situation became even worse. After two months and a couple hundreds dead civilians, Golec brothers - together with the local law enforcement forces - forcibly entered the town hall in Bielsko-Biała, arrested the Council's members, declared themselves interim rulers and quickly plunged the country into infighting with those unwilling to serve and live under an even temporary junta if it is willing to sacrifice everything in the name of stability, down to utilizing methods as bloody as those of the bandits plaguing the mountains. \n\nMałysz was one of the few who were let go, all thanks to the public's opinion of him. Following the coup, he rushed eastward - first to Cieszyn, and then to Wisła, organizing a resistance movement and forming an counter-coup force to retake Bielsko-Biała and restore the Republic. \n\nThe Golec Brothers, learning about this betrayal, broke at least one trombone and two trumpets. \n\nNow the drums of war are growing louder and louder at the borders of Silesian Beskids. Will mere willpower be enough for the last proponent of freedom in the region to emerge victorious? Or will the young state of our Polish Eagle become as vile as the forces it tried to fight back in the first place?"


##Events##


malysz_start.5.t: "Refugees from Szczyrk"
malysz_start.5.desc: "Małysz was determined to fight to the end. He was prepared to die alongside the people he led. Yet he did not want to expose his family to the harm the bandits might inflict on them. He stood by the car with his wife, checking that everything had been packed. Just as they were about to say their goodbyes, the intimate moment was interrupted by a desperate cry: \n\n-HELP! MR. ADAM, HELP! - before the gate, kneeling in a puddle of mud, was an elderly woman clutching a bundle. The athlete stepped closer and realized it was a sleeping infant. \n\n-What do you want? - he asked, sounding slightly annoyed. He recalled all those times when people claiming to be ill had knocked on his door, only to turn out to be scammers. \n\n -I'll manage somehow; it's the child that matters. The bandits burned down our home, and her parents didn't manage to escape Szczyrk in time. If only there were a place for the little one at the local nursery - even if just temporarily... - Hearing this, Adam knew she was sincere. Scammers always asked for money for themselves, never for genuine help for others. \n\n-Did you come alone, or are there others?- \n\n-Sir, people are fleeing Szczyrk like sheep before wolves. Anyone who could walk has already made it to Wisła.\n\n-I have two ideas on how to handle this situation. Please, give me a moment to think... - Małysz rested his hand on his chin. He could either take the refugees into Wisła or direct them toward Czechia. The first option offered several advantages: if someone is capable of walking, they are also capable of working. Even if the refugees performed only simple tasks, they would still significantly lighten the load for the defenders of Wisła. Furthermore, hosting them would help Adam cultivate an image as a benevolent leader. On the other hand, it would entail numerous difficulties; he would need to find shelter, food, and clothing for these people...\n\nThen again, sending them on to the Czech Republic wouldn't be all that terrible. For one thing, it's just a stone's throw from Wisła. Secondly, the journey wouldn't be too hard, as he could provide the former residents of Szczyrk with guides and provisions - a solution that would require far less effort and fewer resources than housing them locally. And thirdly, the entire focus of the Vistulans is currently on organizing a defense against bandits. If the refugees end up taking more than they contribute, Małysz's hometown could fall. In such a scenario, taking them in would harm everyone and help no one. Yet, there was a catch: what if the Czechs refused to let these people cross the border? What if they were forced to camp right outside the mountain shelter on Czantoria - only to be driven away by the Czech border guards? In any case, Adam knew one thing for certain: the decision made regarding this woman will be applied to all refugees. Everyone - or no one."
malysz_start.5.a: "We will take you in."
malysz_start.5.b: "We'll help you in going further."


malysz_start.11.t: "Difficult Cooperation"
malysz_start.11.desc: "The queue in the Wisła town square was longer than Małysz's longest ski jump. People stood in silence, despite the rain and the cold. Now and then, a child cried, or someone let out a loud sneeze. Adam stood just like any other resident of Wisła, moving forward at a snail's pace. Time dragged on, agonizingly slow. Every few minutes, someone entered or left the Dom Zdrojowy. Above the entrance hung a sign: 'CENSUS POINT,' and two soldiers from the Europaarmee stood guard by the doors. Suddenly, a loud shout rang out from inside the building.\n\n-POLNISCHE SCHWEINE! - an elderly man emerged, leaning on a cane, with deep worry and fear on his face.\n\n-This is too much. - Małysz said, stepping out of the queue. He walked briskly toward the door.\n\n-These Germans are shameless!  - he remarked loudly as he opened the door. The *Europaarmee* soldiers did not stop him.\n\nInside, several tables had been placed together. Behind them sat Union officers in official uniforms. Małysz approached them with a firm, decisive stride.\n\n-Who's in charge here?! - he asked in German. One of the Euro-comissars replied:\n\n-If you have any objections regarding the census, please fill out form PS-239 and...\n\n-You intervened to protect us from bandits, yet you're behaving like occupiers.\n\n-Ple...\n\n-If you want to maintain a buffer zone, you need the support of the local population - Adam continued, not letting himself be interrupted. - And if you keep acting like this, people will soon conclude that they'd rather live under the boot of bandits who, at the very least, speak Polish. This cannot go on.\n\nSilence fell over the room; the tension was so thick you could cut it with a knife. Adam knew he had taken a massive risk. He knew what happened to those who criticized the Euro-commissars. He didn't know whether his popularity would shield him from arrest and exile to a remote island. The German took a deep breath.\n\n-What changes do you propose?- he asked, lowering his head. He glared at the ski jumper with the malevolent look of a Gestapo officer longing to torture someone he couldn't even touch. Małysz smiled - he had won.\n\n-First of all, from now on, you come to the people - not the other way around. Nothing ruins your image quite like forcing people to stand in lines. Secondly, if you insult anyone ever again, we're ending our cooperation. And thirdly - why are you doing all of this in the first place?-\n\n-The collapse of Poland has caused such massive population displacement that a new general census is necessary.\n\n-If it's just a census, then why are these 'G' cards lying on the table?- The German was clearly taken aback.\n\n-I've said this once, and I'll keep saying it until you understand: by all means, go ahead and issue these ridiculous little slips of paper. But if I hear that anyone has lost their job or faced any kind of trouble because they didn't have one, you'll be running for your lives, like a tourist fleeing an enraged goat. Is that clear?\n\n-Yes. - The officer flushed with anger.\n\n-Very well. In that case, please, remember one thing:"
malysz_start.11.a: "We respect you, so you must respect us."

malysz_start.12.t: "Fortress Wisła"
malysz_start.12.desc: "Adam Małysz paced through the town square of Wisła. He spent the last few weeks preparing the town for defense—consulting with commanders, planning the battle, inspecting fortifications, and organizing logistics. But would it be enough? He kept repeating this question to himself, like a mantra.\n\nHis gaze fell upon a horse-drawn carriage. Before the Fall, it might have carried tourists; now it was packed to the brim with supply crates. The horses were visibly exhausted from days of relentless toil, and their driver looked no better. Could more fuel for vehicles have been secured? Would the animals survive? Could the carriage traverse the rugged mountain terrain quickly enough? A wave of doubt washed over Adam. The sight of recruits training in the square certainly did little to dispel it. They were either too young or too old. Most couldn't even climb onto the roofs of the abandoned souvenir stalls, let alone get back down. And one who actually could—leaping across the booths with a knife in hand—seemed to be playing Counter-Strike rather than preparing for a real fight. All in all, the recruits looked more likely to injure themselves than the enemy. Was lowering the physical requirements really a good idea? Couldn’t we have acquired more ranged weapons? Will these people be able to defend Wisła?\n\nAdam’s gaze rested on the tenement house. It used to be one of the beautiful landmarks of the Wisła town square, with signs on its walls proudly advertising shops and restaurants. Now, it still drew attention—though for all the wrong reasons. A collapsed wall loomed, looking even more daunting than the judges who would disqualify ski jumpers for too heavy suits. Exposed, plasterless interior and a pile of rubble on the ground floor served as a grim reminder of the explosion that had destroyed the building. Have I organized a strong enough anti-aircraft defense? Are we monitoring the storage and transport of ammunition closely enough? Have we checked every gas stove in town? Małysz shook his head. For the hundredth time, he ran through his mental to-do list. Secure food and water? Done. Enforce a nighttime blackout and silence? Done. Ensure at least four hours of electricity a day? We tried... Adam went on and on, ticking things off.\n\nSuddenly, he felt a hand on his shoulder. Surprised, he turned around. It was Piotr Żyła, dressed in shorts and a summer T-shirt.\n\n-Piotrek, what are you doing? It’s only about five degrees out!\n\n-Don’t you worry, Boss. I caught, like, ten Pokémon today. They wouldn’t be showing up here if they didn’t feel safe. We’re doing a good job and trying as hard as we can. – At first, Małysz wanted to tell Żyła what he thought about playing Pokémon at such a difficult moment. However, that last sentence stuck in his mind. He simply said:"
malysz_start.12.a: "We did everything that could be done."

malysz_start.13.t: "Retreat!" 
malysz_start.13.desc: "-Forget about the Grenzzone! We're cutting our losses and pulling out! Anyone who doesn't reach the assembly point by 14:20 will be considered a straggler and left to fend for themselves!- I said into the two-way radio. I took one last look around the command post. Once I was certain nothing of value remained, I emptied a canister of gasoline onto the wooden floor and tossed a match behind me as I walked out. Once at a safe distance, I adjusted my uniform and monocle. Ordnung muss sein - as an Eurokommissar, I have to maintain my image, especially at a time like this. Ahead, I could see the parking lot where my subordinates were gathering. Nearly every inch of space was taken up by tanks, armored vehicles, or trucks. Soldiers scurried about like ants, loading everything they could into the vehicles. Suddenly, three Poles blocked my path.\n\n-You're retreating, even though you've suffered hardly any losses?! You're not just cowards - you're arsonists, too! - said the oldest of them, pointing toward the fire raging behind me. He mangled the beautiful German language terribly. I tried to slip past them without a word, but they wouldn't let me. Finally, I replied/n/n-This isn't a retreat; it's a tactical movement to pre-planned positions. It's a response by Europaarmee's General Staff to the wave of Europhobic acts of violence in Poland. I assure you that the Weichsel will remain deep within the heart of the European community forever. - I said, as calmly as I could.\n\n-Not in the heart - in the ass! If you actually cared about us, you would have told us about your intentions beforehand. - His vulgarity shocked me.\n\n-Sharing top-secret information about our maneuvers would have put my troops in danger. And if you continue to block my path, I will consider it an act of aggressive Europhobia. - The older Pole wanted to respond, but his taller companion held him back. For a moment, they spoke to each other in Polish, their voices raised, it looked like they were arguing. I couldn't understand a word and, to make matters worse, I couldn't move, as a third man kept his eyes fixed on me. He was well-built and wore a security guard's uniform. After a moment, the older man sighed and said\n\n-Please, excuse my emotional reaction. It's just that I own the building that's currently on fire. Please tell your colleagues in Cieszyn that we are grateful for your help, and that we wish to maintain good neighborly relations and continue our cooperation. You may pass. - The Poles stepped aside to let me through. This sudden shift in behavior caught me completely off guard, so I simply said:\n\n-Danke! - and ran toward the assembly point. The soldiers there smiled when they saw me. I glanced at my watch - and suddenly, I understood what amused them. It was exactly 14:21 when I was getting into the officer's jeep.\n\n-Move out!- I shouted into the radio. As we pulled away, I said to the driver:"
malysz_start.13.a: "Poland is a very strange country."

