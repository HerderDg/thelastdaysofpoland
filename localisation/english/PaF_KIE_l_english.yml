 ###   Country Events   ###
 
 
 kielce.1.t: "Ziobro Demands Our Submission!"
 kielce.1.desc: "After doing the impossible and crushing the revolts in the Holy Cross Voivodeship, Ziobro has come for us! Today the Prosecutorship sent us a strongly worded letter demanding Kielce, and if we refuse Ziobro will definitely march in with his loyalists and besiege the city. In the end, should we bow to the Prosecutor or should we remain defiant against his forces?"
 kielce.1.a: "Refuse! For Kielce!"
 kielce.1.b: "Accept, there is no hope..."
 
 
 ###   News Events   ###
 
 
unification.125.t: "[GetNewspaper]Fortress of Kielce unifies the Holy Cross!"
unification.125.desc: "Ziobro may have failed, but his ideals live on, as only one force remains in the Holy Cross voivodeship. Led by a former underling of the General Prosecutor, the fortress of Kielce was initially meant to be merely a means to control the growing unrest within the city. This was nowhere near enough for the ambitions of Dominik Tarczyński, who through shrewd diplomatic and military maneuvering achieved what his former boss couldn't. Finally off his leash, he managed to quell all uprisings against his rule and eventually grew to supplant Ziobro. The further direction of the state remains unclear, as even now rumors of disloyalty persist among the upper echelons of the new government. There is also a question of his devout pro-american bias that may just influence Tarczyński's choices. Only time will tell whether Tarczyński's rule is meant to last."
unification.125.a: "The student becomes the master"

super.125.t: "[GetNewspaper]Poland united under the flag of [FROM.GetName]!"
super.125.desc: "Years have passed since Poland as a state collapsed, however, Poland as an idea has never entirely perished. As the government under the leadership of [FROM.GetLeader] clearly shown, unification within a single generation wasn't a distant dream, but attainable reality. Against all odds, facing enemies on all sides, from within, aswell as forces from abroad, [FROM.GetName] stands truly united, having reforged the nation of Poland and it's diverse people into a monolith, proving that the confidence it's citizens layed upon the leadership and beliefs of their government wasn't at all misguided. Scars of the conflict will take time to heal, but with the unity forged in fires of war, future looks bright for Poland. As the sun rises above the land, citizens of [FROM.GetName] look forward with pride and high spirits, having passed the ultimate test of the Polish civil war."
super.125.a: "United at last."

