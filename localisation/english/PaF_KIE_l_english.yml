 KIE_anarchy: "Afloat in a Sea of Anarchy"
 KIE_anarchy_desc: "Kielce were isolated by the Prosecutorship, which caused the population to mobilize to defend their city. Public unrest is very uncommon, which helps in holding the city should an enemy army come to seize the city."
    
 KIE_president: "The Two Presidents"
 KIE_president_desc: "While Stępniewski is the president of Kielce, Tarczyński is the head of Garrison Kielce. This causes a lot of problems in the bureaucracy, as both presidents have other plans for the city."
    
 KIE_wot: "Whims of the Territorial Forces"
 KIE_wot_desc: "The Garrison in Kielce gives us extra manpower should a war start, but its leaders have a lot of demands that our government has to fulfill if it doesn't want to be overthrown. Such is the price of a good army..."
 
