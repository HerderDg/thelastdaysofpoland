 NSZ_storm1: "The Incoming Storm"
 NSZ_storm1_desc: "A storm is approaching, which means that we must prepare for it and make sure that Poland survives it. It will engulf both the West and East, but through our perseverance and hard work we shall prevail. Unfortunately, not everyone in our country shares the same idea, as many believe that they can't do anything about it, causing a lot of people to turn into doomers who do the bare minimum and don't really help in our mission. On the other hand, there are also people who share our view-perhaps too enthusiastically. Preppers believe that collapse is coming soon, and they have to prepare for it. They spend all their time preparing for the collapse, and this causes a problem with the workforce, as they don't want to work in our industry and have already stockpiled essential goods, making our mission all the more difficult."
 
 ###   News Events   ###

unification.123.t: "[GetNewspaper]Holy Cross Society unifies the Voivodeship!"
unification.123.desc: "For the first time since The Fall happened, the Holy Cross Voivodeship finds itself at peace, a fact grandly announced in the capital of Kielce today. A great parade, modeled after the Independence Marches of years past, rolled through the city in front of tens of thousands of onlookers, Robert Bąkiewicz at its helm -  a man who turned a fringe movement into an unstoppable militia, himself coming from near ruin to national fame. Behind him, in lockstep, march the soldiers of the Holy Cross Society - loyal fanatics fighting for a Poland defined by national strength and rejection of Western degeneracy. \nYet further - the prisoners of war, serving one final purpose of showcasing their humiliation. Rights previously enjoyed by the populace are being rolled back to combat the 'dangerous changes brought by German influence,' as waves of refugees pour through the borders of the region, with persecution against all who are not of pure Polish blood intensifying since the conquest of the voivodeship."
unification.123.a: "It happened here."

super.123.t: "[GetNewspaper]Poland united under the flag of [FROM.GetName]!"
super.123.desc: "Years have passed since Poland as a state collapsed, however, Poland as an idea has never entirely perished. As the government under the leadership of [FROM.GetLeader] clearly shown, unification within a single generation wasn't a distant dream, but attainable reality. Against all odds, facing enemies on all sides, from within, aswell as forces from abroad, [FROM.GetName] stands truly united, having reforged the nation of Poland and it's diverse people into a monolith, proving that the confidence it's citizens layed upon the leadership and beliefs of their government wasn't at all misguided. Scars of the conflict will take time to heal, but with the unity forged in fires of war, future looks bright for Poland. As the sun rises above the land, citizens of [FROM.GetName] look forward with pride and high spirits, having passed the ultimate test of the Polish civil war."
super.123.a: "United at last."


