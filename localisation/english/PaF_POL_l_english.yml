POL_lessons_from_the_past_desc: ""

POL_unfettered_capital: "Unfettered Capital"
POL_unfettered_capital_desc: "Orlen makes a killing on moving fuel to various factions of the nation, and we chafe under the duties they impose, as though theirs was Poland, not ours! No more. The first step to reclaiming faith in our state, is reclaiming control over our fuel, starting with asserting ourselves over Orlen."

POL_in_the_oil_fumes: "In the Oil Fumes"
POL_in_the_oil_fumes_desc: "Our approach to take control of fuel in Poland is twofold: We first send lobbyists and envoys to Orlen itself to rally anyone friendly towards our cause. Meanwhile we get rid of leverage they have over us by investing in alternative means of producing and sourcing oil. Advantage of our scale is, that even relatively inefficient biodiesel can make a difference for now. Energy security will be worth any temporary hardship regardless."

POL_shadow_board: "Shadow Board"
POL_shadow_board_desc: "Eventually, we will take over Orlen itself, whether through capitalist acquisition or by force. PiS is similarly comfortable with both solutions: Until then, we must prepare a collaboration government for the corporation. This shadow board will slowly incur influence within Orlen, easing up its takeover."

POL_good_old_oil: "Good Old Oil"
POL_good_old_oil_desc: "Unlike those Platform pigs, we do not shy away from public ownership of key industries when necessary: Capture and nationalization of gas stations in areas under our control will put the Orlen question to bed once and for all, until we'll be ready to take them over. The Good Change of PiS was a promise easay to understand for all: Cheaper fuel, cheaper living, better Poland. We got one down, and with this the proof to others and ourselves, that we can still fight for the other two. \n We need this hope more than a bison needs grass."

POL_into_the_grassroots: "Into the Grassroots"
POL_into_the_grassroots_desc:"One of PiS's worst mistakes was failing to build strong grassroots support, and we are still paying dearly for those failures. After the Fall, it became clear what we had done wrong and what had caused Poles to side with warlords instead of the legitimate government: the growing alienation of ordinary citizens from our party. Elitism, corruption and nepotism diminished our support among the average Pole, and a warlord promising a new, better future was far more attractive than preserving the Third Republic. We must correct our mistakes and show ordinary citizens that we are still the best choice for them, in other words, Law and Justice must return to the grassroots. Winning back the support of ordinary citizens will greatly strengthen our government, as people naturally fight and work more efficiently for a cause they believe in, giving us an edge over the warlords occupying our rightful territory."

POL_local_activists: "Local Activists"
POL_local_activists_desc: "Law and Justice is a party with small chapters in every region of Poland, including the ones we currently control. While the local chapters lack manpower and motivation, there is nothing a little funding cannot remedy. Revitalizing and integrating the local chapters will increase our local support and, most importantly, give us capable agitators who can rally support for our cause. Of course, there will still be difficulties in integrating them, as, unfortunately, Law and Justice is not as unified as it appears, but we will have to make do. Integrating them would also greatly benefit our administration - after all, the less skilled among them can be assigned to administrative duties, helping streamline paperwork and tax collection."

POL_the_subdowntowners: "The Sub-Downtowners"
POL_the_subdowntowners_desc: "Despite being pushed out of Warsaw, we still control a few cities: Legionowo, Wyszków, Pułtusk and Nowy Dwór Mazowiecki. In our quest to build grassroots support, the cities are our best chance thanks to their large populations. However, there is one major problem - most of them lean towards liberalism or leftism, and our conservative politics don't really resonate with them. While we would love to just ignore liberal cities and concentrate on areas where conservative support is strongest, we no longer have that luxury. We need every able-bodied Pole to fight for Polish reunification, and ignoring such a large number of people will hardly help us put more men on the front lines. Furthermore, cities are our main production centers, and without their support our arms production would collapse, and without any weapons we would be defeated in every single battle we fight. We must show the urban population that they have not been abandoned."

POL_open_seats: "Open Seats"
POL_open_seats_desc: "All seats in the government are currently held by PiS members, and that's not a bad thing. After all, most of them won't vote against our proposals, making it much easier to pass beneficial reforms. However, recently a growing number of people have begun protesting against this arrangement, calling it \"undemocratic\", and these protests make it much harder to govern this country. Suppressing them is out of the question - we would lose our reputation as a democratic party, and that is not what we want. Fortunately, there is another solution that will please the opposition without sacrificing our position - creating new seats and letting opposition members fill them. It's a perfect solution, really. The opposition will be satisfied with their new seats and a voice in the government, calming the protests, while they still lack enough seats to block any proposals we introduce. This solution will also improve our reputation and present us as a modern Cincinnatus, restoring democracy once the threats against it have been neutralized."

POL_mask_of_hominess: "Mask of Hominess"
POL_mask_of_hominess_desc: "Morawiecki is a politician from the upper class, not really someone who can appeal to the masses as if he were one of them. However, in these trying times we need all the support we can get, and one of the ways we can gather support among the common folk is by making the Prime Minister at least appear to be one of them. People tend to support politicians they can relate to, and making Morawiecki seem like a normal person will surely boost his popularity, to our advantage. However, we can't simply say that Morawiecki is like the common man and expect people to see him as such. We have to make him do some things to appear relatable to the public, like recording his daily routine, showing how he cooks, cleans or works. We just have to edit out any parts that may make him seem elitist, and knowing him, there will be many. Fortunately we can always re-record scenes if we get just a minute of him being relatable. Now that we have a plan, it's time to set it in motion! Let's just hope he still remembers how to cook."

POL_self_autocracy: "Self-Autocracy"
POL_self_autocracy_desc: "The Third Polish Republic is a republic in name only, as after the Fall we were forced to suspend elections and intervene militarily to preserve the remnants of an already dying state. We also refused any deals with the opposition, as they were the ones who caused the collapse. However, it turns out that this method of governance is essentially a dictatorship, not an emergency government, and as the situation is still too dire to restore elections, we have to try to regain favor from the opposition, primarily by giving them concessions. By 'opposition', I mean the PO. While they were the ones who let German troops invade our country, there are still some members and voters of their party who opposed the invasion, and they are the ones we aim to appeal to. We will organize a program where people can send petitions to the government, and the best ones will be accepted. Such an initiative will surely earn us support from the opposition, we just must not reject too many petitions, as then people will protest that we're not giving them representation. Let's hope they aren't too extreme with their petitions."

POL_handel_lud_zalewa_bozy: "The Commerce Floods the Godly People"
POL_handel_lud_zalewa_bozy_desc: "Nearly every Sunday in Poland is a non-shopping Sunday - trade is prohibited, as Christians believe people should rest on that day after a hard week. This system has remained in place until now, but due to the Fall and its consequences, the average person only has time to buy whatever necessities are still available on the market on Sunday, but as all shops are closed, they find themselves not being able to buy clothes, food and other basic necessities. This is obviously a problem, but we have found a solution to it, and it's so simple that we can't believe we haven't thought about it yet. Lifting the ban on trading on Sundays. While the Church will surely be angry, this is not an issue we can compromise on. By abolishing it, internal trade should increase, which should strengthen our economy, while also giving the common man the ability to get some food and clothes on this day, increasing our popularity in the process. It's truly the greatest solution to this problem. The only downside is antagonizing the Church, but we will make up for it. Someday."

POL_turning_blind_eye: "Turning a Blind Eye"
POL_turning_blind_eye_desc: "While most of our party is against abortion, our dire situation requires us to gather all the support we can get, and it turns out that a large part of our population is pro-choice liberals. While legalizing abortion outright will cause a massive conservative backlash, turning a blind eye to it will give us some approval among the liberals, while the conservatives won't be nearly as outraged. There are also other liberal practices we could turn a blind eye to, and once again, pragmatism should come first. After all, ideals only matter so long as there is still a country left to believe in them, and having a large part of our populace opposed to our rule will hardly help our cause. While many in our party will dislike these compromises, we simply have to be pragmatic here, as their conservative idealism won't help us at the front lines. In time, they will surely understand that these concessions were necessary for Law and Justice to prevail in the post-Fall chaos. "

POL_securing_the_base: "Securing the Base"
POL_securing_the_base_desc: "After many compromises, concessions, and reforms, we have finally achieved something that can be called local support. While the road to it was paved with pragmatism, at least we can be almost certain that the mistakes of the past won't come back to haunt us. Of course, there are still many things we can do to further consolidate the base like further democratization, however now is not the time for them. For now, we can only offer temporary concessions, although in the future the republic shall return thanks to our efforts, and it will be glorious. Currently, we will use a different method of consolidation-social programs. After all, who doesn't value financial support? We will organize programs revitalizing cities, factories, and the countryside. While some may call this blatant populism, it is not; these programs boost infrastructure, and the support gained from them is merely a welcome bonus."

POL_your_best_alternative: "Your Best Alternative"
POL_your_best_alternative_desc: "Trzaskowski is far away from here, and so is every other liberal warlord. If any liberal in Northern Mazovia wants to avoid living under a despotic regime, we are pretty much the only choice for them. While some may try to actually make a pilgrimage to Warsaw, most of them will die at the first border, let alone reach Warsaw alive, but those who decide not to march to Warsaw will soon realize that we are pretty much their only sensible alternative. What else are they supposed to do, fight for the idiot who blew 70 million on an election that didn't take place? Of course they won't, and if they want to play an active role during the civil war, it's our chance to appeal to them. Convincing the liberals that we are their best alternative would do wonders for our manpower, and it's in our best interest to spread this message across the whole voivodeship and try to make the journey to our territory easier for them, using methods such as military escorts or sending buses to the cities to pick them up. The newly acquired manpower would surely give us a much-needed boost in military strength, which we could later use to reunify Poland and restore the Republic, and that's what both we and the liberals want, right?"

POL_matters_of_state: "Matters of State"
POL_matters_of_state_desc: "We won’t retake Poland with propaganda alone. We need to take action. Our resources are minimal and must be used to their fullest extent. We’ll have to take a closer look at what we have. Remove the things that hamper our effort and turn the rump state we are left with into a well-oiled machine ready to defend the legitimate government. The process will take us out of our comfort zones and be painful in the short run, but it is the only way to escape the post-Fall malaise. "

POL_banker_in_chief: "Banker-in-Chief"
POL_banker_in_chief_desc: "Ever since the Fall started, Poland has been struck with a terrible recession, which got worse as the supply chains and infrastructure continued to erode simultaneously with the withering away of the government's power. If there’s anyone to jumpstart the fading economy, it’s Mateusz Morawiecki. The experienced banker who successfully dealt with international corporations was elevated to the position of prime minister precisely because of this resume. Now free from the burden of dealing with imbeciles that Chairman Kaczyński kept around for political leverage, Morawiecki can see what he’s capable of. Still, the peculiar situation of the Third Republic will require many temporary solutions that won’t be continued once our current situation stabilizes."

POL_two_steps_back: "Two Steps Back"
POL_two_steps_back_desc: "Many of the ideas we once proposed have been implemented. And they were right. They worked entirely well... but all of those decisions were made when we had access to the full budget of a functioning, existing state. The context in which we introduced those reforms no longer exists, yet we continue to cling to the same mechanisms that have been in place since 2015. They survived the pandemic, wars, the collapse of the state... but in the current situation, it would be foolish to persist in something that only brings us losses. Maintaining a strong healthcare system, tax solutions, or social benefits at a European level - at a time when our authority barely extends beyond Nowy Dwór Mazowiecki and Legionowo - must be... corrected."

POL_non_material_law: "Non-Martial Law"
POL_non_material_law_desc: "Since the treacherous European invasion and the cataclysm that followed, our country has technically remained under martial law. That is to say... officially, the war with Germany was never concluded, and with the secessionist warlords, we were never truly at peace. Yet while we expect that sooner or later our neighbors - circling like vultures - will come for our throats, the reality is that we are simply no longer capable of financially sustaining the additional security forces and military expenditures that martial law demands.\n\nWe cannot gamble away our chances of survival... but if we go bankrupt, we will have nothing left but to dig our own grave."

POL_tax_reform: "Tax Reform"
POL_tax_reform_desc: "The tax system of Law and Justice was built with the diligence and precision required for a well-functioning system at a European level. And nothing changes that - not even civil war. But people no longer truly have the means to pay these taxes in the face of the total economic collapse of the country. Many now work for the proverbial bowl of rice - a bowl that is itself beginning to run out. Let them breathe, if only for a moment. Let them see that our system is capable of loosening its grip when circumstances demand it - and unlike the bloodthirsty neoliberals, we will not allow anyone to fall into destitution."

POL_noble_health: "Noble Health"
POL_noble_health_desc: "One of the greatest struggles of ordinary people is the collapse of healthcare. The fall of the state brings with it an abnormal number of deaths and injuries - things rarely seen under normal conditions. And all of this might be manageable... if we had the money. Anarchy or not, illness does not wait. There is a shortage of doctors. A shortage of medicine. Surgeries are not being performed. And attempting to subsidize everything has burned a massive hole in our budget. Temporarily shifting the burden of medical services onto the private sector may help - or at the very least, save those who have come to understand just how valuable health is when faced with its absence."

POL_suspension_of_polish_deal: "Suspension of the Polish Deal"
POL_suspension_of_polish_deal_desc: "It’s not like the Polish Deal is bad. It’s been an optimal programme that brought prosperity to all Poles, especially to the middle class and local governments, by steering the tax burdens away from them, while not lowering the total tax revenues. Nevertheless, ever since its implementation, the Polish Deal has raised some controversies. It has been stated that the programme was full of vagueness and contradictions that caused chaos in the accounting process, but it’s nothing but gross overexaggerations. It was merely the result of the lack of time for the bureaucrats to adapt to such complex changes. Had Poland not fallen, today we’d all be living in luxury enabled by this ambitious reform. Alas, all of the training courses had to be stopped due to the cascade collapse of the state structure. Therefore, with a heavy heart, we are forced to suspend the Polish Deal and return to the law that is more familiar to the government staff."

POL_reforma_prawa_budowlanego: "Reform of Construction Law"
POL_reforma_prawa_budowlanego_desc: "It is difficult to stand by and watch as the country withers away. We should be devoting far greater effort to rebuilding Poland! Yet all construction sites have frozen, and no new ones are emerging. It is highly likely that the current state of the country is to blame - what else could it be? Ergo - it is the Germans' fault. But jokes aside, the reality is this: it is difficult to obtain a construction permit when there are no surveyors, no maps, no ministry... because the procedures still exist, even if the offices themselves no longer do. Therefore, libe-... rather... a simplification of building law through an emergency decree should improve the situation. And at last, we will rebuild our beautiful country."

POL_przyjazny_urzad: "Friendly Office"
POL_przyjazny_urzad_desc: "Polls have always shown that the least trusted groups are politicians... and civil servants. Yet this should not be the case - what have these officials truly done to deserve such resentment? They should not be the target of public frustration, but a helping hand extended toward citizens, ensuring that their concerns are addressed. And that is what they must become: friendly, helpful, and smiling. Swift service at the counter, and pleasant queues. Or... perhaps the other way around. Either way - matters must be handled quickly and painlessly. And there is much to be handled. De-demonizing bureaucracy may prove to be a difficult challenge, but if we succeed, it will be an achievement in itself."

POL_sol_tej_gospodarki: "Salt of This Economy"
POL_sol_tej_gospodarki_desc: "The economy of the nation is a burden carried not, as one might assume, by great corporations, but by small entrepreneurs - those who, through their diligence and patriotism, build the prosperity of the Polish people. No foreign company will ever give as much to Poland as a single loyal entrepreneur, who reinvests their earnings into the very community in which they live. After all, they live here - among us - not in the Seychelles or Cyprus. And this is their mission: to return to society what has been earned through the work of their fellow countrymen. We must not place obstacles in their path, but rather lay out a red carpet before them, so they may freely grow and strengthen our state."

POL_newest_deal: "The Newest New Deal"
POL_newest_deal_desc: "Returning to the previous tax laws and being less ambitious, but more polished, turned out surprisingly effective. Although our latest reforms were meant to be temporary measures, their popularity among our population tempts the Prime Minister to leave them in place for good. There might be a way to go forward as the New Polish Deal resurrected our economy; The entrepreneurs are no longer afraid to engage in business free from the overbearing taxes or overinquisitive bureaucrats, and their employees, with their higher wages, have been spending even more, boosting our economy – the bedrock of our future reunification of Poland."

POL_our_man_in_the_stands: "Our Man in the Stands"
POL_our_man_in_the_stands_desc: "Over the years, Law and Justice developed a particular doctrine regarding the presence of the other right-wing parties. The doctrines can be summed up with: 'Nothing but a wall to our right'. That's why, among the multitude of factions, there have always been those that catered to young, radical men you could meet in the stadiums, men who preferred shouts on the rallies, rather than a calm speech backed up by data. Unfortunately, the Prime Minister's faction has always been the one to appeal to the intelligentsia, and those who felt at home among the young and angry have left our cause.\n\nFortunately, we still have on board Mateusz Chłopik. While not exactly a sports type himself, he nonetheless has contacts in the Legia Warszawa team, as he was the representative of the management board of Legia Warszawa, the most popular team around here. His task won't be to be the tribune of the masses, but to seek those in the football fans milieu who would be willing to shill for us"

POL_patriotic_duty: "Patriotic Duty"
POL_patriotic_duty_desc: "Chłopik's search starts to bare fruit. The influential people among the local football fans' circles he had found have started to spread the notions that the Third Republic has not yet perished and Morawiecki's government is legitimate and worth protecting against the greedy and incompetent foes who seek to destroy our nation. Well, those are not the exact words they usually use, but the message remains the same.\nAlready, the numerous hooligans have stopped engaging in brawls among themselves and have decided to enlist to aim their aggression at those who would like to extinguish the last flame of Poland. We shouldn't rest on laurels, though. If we don't strike against the warlords soon, the eager warriors may grow restless and decide it's time to take matters into their own hands, engaging in actions independently from or even against us."

POL_streets_respect: "Street Respect"
POL_streets_respect_desc: "Before our Minister of Interior's efforts, the streets were filled with right-wing radicals chanting the lies that our government was selling our country to the European Union and then was unwilling to protect Poland from the Euro-German attack. Now, the same people, convinced that Morawiecki's government was in fact delaying the invasion with their wise policies and was doomed by the opposition's putsch attempt against the lawful president, have had a Face Turn. Now they cheer the loudest during our rallies, offer to serve as unofficial bodyguards for our politicians, and cooperate with our police force, trying to keep the brawls to a minimum. Some even turn their fists against those hooligans who try to badmouth our cabinet. Let's hope the streets from now on will be safer."

POL_new_kind_of_rooter: "New Kind of Rooter"
POL_new_kind_of_rooter_desc: "It seems we succeeded. Thanks to our efforts, the young, right-wing radicals no longer see the Law and Justice as the party of their grandparents, but instead as the strongest and best group to shape the fate of Poland. They parade in the merch Chłopik set up and rush to join our party to help our informative campaigns on the streets. Most of their demographic has abandoned the once-popular National Movement and KORWiN parties, seeing them as ineffective even if they agree with their stances more than with ours.\nIt is time for our rhetoric and programme to step out of our comfort zone and address the less traditional electorate. The Prime Minister thinks that some communication workshops should help his cabinet to reach the men in the stadiums with their messages."

POL_unity_government: "Government of National Unity"
POL_unity_government_desc: "Few thought that it would happen. We started now with troubles rallying to our cause, even Law and Justice's supposed traditional power base, not to mention the opposition from both the left and the right. Now, our efforts rekindled the spirits of our voters, won the begrudging support of the liberals, and created a new image to attract the nationalists. There are still those who disagree with us, of course (especially the leftists whom we ignored in our conciliatory campaign), but almost nobody tries to outright dissolve our state. We showed them that what's left of the Third Republic is worth protecting and that the time for ideological discussions will come later. The regional opposition leaders may even hope that by helping us protect the legitimate state, they may later try to gain power through democratic means. Whatever their intention may be, they bring us a step closer to our goal of bouncing back and striking against the pretenders."

POL_what_we_will_achieve: "What We Will Achieve"
POL_what_we_will_achieve_desc: "We have addressed the issues that have been plaguing us since the Fall… and especially the Fall after Fall, when we lost the Capital. Now we must look into the future, clear our backyard so to speak, before we march into Warsaw; We can’t allow another strike in the back.\nWe must be quick in our actions as the renewed faith of the citizen has its limits – if we’re not quick enough, the discontent caused by the limited state services will rise to alarming levels. Furthermore, the stalemates on the front will be interpreted as a sign that nothing has changed and Morawiecki’s government is still incapable of enforcing the order in the lands it claims to possess."

