POL_defenses_on_the_narew: "Defenses on the Narew"
POL_defenses_on_the_narew_desc: "The brass predicts that Sasin has next to no offensive capabilities due to poor governance and management of his armies. Nevertheless, we underestimated him once, and it cost us North Masovia. This can’t happen again. To be extra sure, we’ll order the construction of some impromptu fortifications on the Narew River. No matter how uncoordinated or undersupplied Sasin’s troops may be, they are still dangerous, and we should do whatever we can to mitigate the damage they will try to inflict upon us to preserve as many of our soldiers' lives as possible."

