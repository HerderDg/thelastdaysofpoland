POL_hurtful_past: "Hurtful Past"
POL_hurtful_past_desc: "The hoi polloi, think in stories. The more riveting and powerful a story, the more will they rally behind it. They say the truth has power because it's the truth, and because it's true, that makes it right. But I say: It's true that we were on a cusp of triumph for all Poland, we were so close. And it's true that we were betrayed instead, that those we once called countrymen chose entropy over the Third Republic! \n\n No one with power will care how we dealt with the pesky details of this narrative anyway. "

