POL_false_note: "False Note"
POL_false_note_desc: "The cult that gathered around Żelazowa Wola may seem harmless enough, as they pose as pacifists who aim to protect the birthplace of Fryderyk Chopin. If so, they should submit to the will of the legitimate government, which provided the small village with numerous funds over the years. Alas, they denounce us as imperialists and warmongers merely due to our desire to see Poland united again. These preposterous accusations show their ulterior motives. Refusing our offer of surrender, they decided to take the side of anarchistic warlords who want to see Poland destroyed. If so, they must be subjugated by force. It is regrettable that it has come to this, but it is only because those who claim to love Polish culture so much decided to turn against their own country."

POL_knocking_out_their_fangs: "Knocking out their Fangs"
POL_knocking_out_their_fangs_desc: "The less said of the gangs of Beasts that terrorize the Gostynin area, the better. They’re the worst of the worst Poland has to offer. All of the patients of the psychiatric center have been placed there for heinous crimes that made them unfit to return to society. Their stay extended even after the end of their sentence, raising the criticism of various human rights organizations. Nevertheless, the terror they wrought after their escape from the center shows they were there for a good reason. Now at large, they must be killed by our soldiers or put back in prison, where they belong."

POL_prohibition: "Prohibition"
POL_prohibition_desc: "The anarchy of the Fall truly makes people lose their common sense. In Sierpc, Mateusz Król, an actor involved in the beer advertisements, decided to use the persona of the Castellan to unite the locals to consolidate power as one of the numerous warlords that plague our country. It isn’t surprising that he would try such a thing, as there have been far stranger nation-building ideas. What is surprising, however, is his moderate success. No matter, his lands will be conquered. Neither deluded fools, nor cynical jokers are supposed to poison the minds of Poles with their ridiculous notions of how the state should be run."

POL_give_back_70mil: "Give Me Back the 70 Million!"
POL_give_back_70mil_desc: "Jacek Sasin, one of the great traitors of the united Poland… It is high time to strike with vengeance against him for what he did. Come to think of it, it’s better for Poland in the long run that things ended up this way, and Sasin decided to rebel against our government. The protectorate of Northern Masovia was a shitshow even when Sasins answered to the legitimate authority. Now we have an opportunity to get rid of Sasin's corruption once and for all. We can wipe the slate clean and organize the region more effectively, free from the influence of the bloated fool."

POL_indivisible_polish_nation: "Indivisible Polish Nation"
POL_indivisible_polish_nation_desc: "The Polish nation has been full of forces that tried to destabilize our country. The foreign agents, deceitful political opposition, the aim of our next military campaign, the traitorous separatists. While we have nothing against ethnic minorities, we won’t tolerate the organizations that try to usurp the law and destroy the national cohesion by trying to unlawfully tear away the Polish lands from Poles. The Kurpie Federation that took over areas around Ostrołęka is an example of this type of organization. We firmly believe that people such as Miroslaw Grzyb are only a loud minority and most of the Kurpie will agree with us that ethnic minorities can only function as constituent parts of the Polish nation, and not independent entities."

POL_wolf_hunt: "Wolf Hunt"
POL_wolf_hunt_desc: "While Sylwester Wardęga was of great help in revealing the evidence during the Pandora Gate scandal, his escapades in Zawkrze land must come to an end. His unserious, blasphemous activity brings nothing but harm and chaos to the people of Mława, which has become a den of lawlessness and civilizational degradation. Despite his noble intention, the chaos that ensued after he took over outweighs any vigilante justice he and his pack may serve. The true order must be established there for the good of all Poles living there."

POL_bouncing_back: "Bouncing Back from Rock Bottom"
POL_bouncing_back_desc: "The last enemy soldier in northern Mazovia raises his flag in the gesture of surrender. The soldiers and the politicians alike look with pride and bewilderment. What they thought was a dying cause mustered enough strength to subdue eight dangerous warlords.\nThis is exactly what we needed to boost the confidence of our soldiers and population. They now look at Morawiecki’s government with full hope for a better tomorrow and return to the normal Poland they once knew. The crowds are already gathering in Legionowo to celebrate the recent successes with one unified call to action: ‘Prime Minister, lead us towards Warsaw!’."

