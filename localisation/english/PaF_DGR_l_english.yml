 DGR_separatists: "Separatists"
 DGR_separatists_desc: "Dąbrowa was a largest city in its voivodeship (by area) for a reason. And of course it led to rise of few separatist movement which think their several wooden shacks should be called separate city and not the district of a larger entity."
 DGR_druglords: "Drug Lords"
 DGR_druglords_desc: "One of many disadvantages of a city life is easy access to everything that's banned. And in such environments - drug lords thrive. Not only that, but they seem to be now major players in struggle to control the city."
 DGR_rastafari: "Zielona Camp"
 DGR_rastafari_desc: "There are not many things worse than Polish reggae, and here in Zielona, it looks like time has stopped, and the Fall never happened. What's happening here is an eternal Woodstock with a bunch of weed."
 DGR_pharaohs: "Pharaohs Gang" 
 DGR_pharaohs_desc: "Błędów Desert has become a home for baked out of their minds criminals. They are addicted to some new, unknown to us drug. But overall, they're waiting for their messiah. Good for them." 

 DGR_industrial_heart1: "Industrial Heart - Cardiac Arrest"
 DGR_industrial_heart2: "Industrial Heart - Resuscitation"
 DGR_industrial_heart3: "Industrial Heart - Resuscitation"
 DGR_industrial_heart4: "Industrial Heart - Life Support"
 DGR_industrial_heart5: "Industrial Heart of Zagłębie"
 DGR_industrial_heart1_desc: "The industrial might of Zagłębie was built over decades - and yet it took only a few short years of capitalist rule to reduce it all to nothingness. Mines shuttered, shafts sealed, collapsed steelworks, dismantled factories, ruined rail networks and only the wind now carries the fading echo of this region's once-proud economic achievements.\n\n§tThe industrial heart of Zagłębie lies in critical condition.§!"
 DGR_industrial_heart2_desc: "The industrial might of Zagłębie was built over decades - and yet it took only a few short years of capitalist rule to reduce it all to nothingness. Mines shuttered, shafts sealed, collapsed steelworks, dismantled factories, ruined rail networks and only the wind now carries the fading echo of this region's once-proud economic achievements.\n\n§tThe industrial heart of Zagłębie lies in critical condition - but we have the cure. And we will work ourselves to the bone.§!"
 DGR_industrial_heart3_desc: "The industrial might of Zagłębie was built over decades - and yet it took only a few short years of capitalist rule to reduce it all to nothingness. Mines shuttered, shafts sealed, collapsed steelworks, dismantled factories, ruined rail networks and only the wind now carries the fading echo of this region's once-proud economic achievements.\n\n§tThe industrial heart of Zagłębie lies in critical condition - but we have the cure. And we will work ourselves to the bone.§!"
 DGR_industrial_heart4_desc: "The industrial might of Zagłębie was built over decades - and yet it took only a few short years of capitalist rule to reduce it all to nothingness. Mines shuttered, shafts sealed, collapsed steelworks, dismantled factories, ruined rail networks and only the wind now carries the fading echo of this region's once-proud economic achievements.\n§YThe industrial heart of Zagłębie is slowly returning to life, but a great deal of work still lies ahead.§!"
 DGR_industrial_heart5_desc: "The industrial might of Zagłębie was built over decades - and yet it took only a few short years of capitalist rule to reduce it all to nothingness. Mines shuttered, shafts sealed, collapsed steelworks, dismantled factories, ruined rail networks and only the wind now carries the fading echo of this region's once-proud economic achievements.\n\n§GThrough the titanic effort of the entire working people, we have managed to restore a fragment of this industrial greatness - and the industrial heart beats once more with strength. And this is only the beginning!§!"
 DGR_red_heritage: "Legacy of Communism"
 DGR_red_heritage_desc: "The Red Zagłębie - a political term forged around the powerful workers' movement that emerged in this region during the industrialization of the late 19th century, carried forward by communists during the People's Republic, and standing firm to this very day. In Dąbrowa, many monuments from the communist era still stand, untouched by decommunization efforts. The legacy of Secretary Gierek, who raised this region to the rank of an industrial powerhouse, will never be forgotten."
