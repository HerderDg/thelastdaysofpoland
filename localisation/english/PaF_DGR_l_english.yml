DGR_we_forge_our_tomorrow_desc: "Sometimes I wonder if what I'm doing has any real significance. I'm just a tool of fate, one that can be discarded once the job is done. No matter what path I choose, in the end, it turns out that I'm not the one making the choices. The game was rigged from the start. Nationalism, communism, paganism - none of it matters. All that matters is playing your role well. Maybe then an opportunity will arise to change the status quo of reality. But for now, glory to the working people of cities and countryside, I guess... We're forging a new, national-popular future. How many more slogans will we churn out before they lose their meaning?"
DGR_unity_congress_desc: "The Party is calling. I'd pity myself if I had access to this Congress of the Working Class, but unfortunately, military personnel aren't welcome. I could argue that we work the hardest so that the apparatchiks can rot in their offices, enjoying freedom and life. But they can even have a damn UN summit if they want. The National People's Army now has enough influence in the country that it doesn't matter what decisions the comrades make."
DGR_civilian_rule_under_army_desc: "The party members deliberate, while the army decides. As Comrade Wiesław used to say, \"Power once seized will never be relinquished.\" And we certainly do not intend to give up our privileged position over the civilian authorities. We are the sole guarantors of our state's existence, and under the military banner, the national-popular future will flourish! It wasn't the bureaucrats who defended Sławków from the Antifa black gangs, nor did they defeat the enemies of communism in the Dąbrowa Basin, nor did they capture Jasna Góra. It was the army. And the army... is ours. Well, to be honest... it's MINE."
DGR_recommunization_desc: "There are, however, some things I have no control over, no matter how hard I try. But then again, it's not surprising. Nationalist rhetoric and symbolism are already well established in Poland. It's the communist one that needs to be revived and dug out of the infernal abyss. Only then will the idea of national communism be achieved when both elements mix and balance each other. As long as neither idea oversteps its bounds. Well, unless it's us. We can."
DGR_symbolism_act_desc: "In Poland, the hammer and sickle have always been regarded with the same revulsion as the swastika. Not much will change in that regard, so it's best to leave their use in the past. If we want to be taken seriously as a movement and not be lumped together with Stalin and Bierut, we need to promote our own symbols. The red lightning bolt and the red hammer - what could be more subtle and powerful than combining these two elements? After all, the hammer will forge the iron sword with which we will defeat all our enemies as fast as lightning."
DGR_authority_dilemma_desc: "Joseph Stalin did nothing wrong. Che Guevara was a revolutionary hero. Such statements often circulate within the left. But just as the right venerates murderers, the left also has a tendency to place truly unsavory figures on a pedestal. We must be different. I won't allow anyone in our circles to use authorities that are absurd to Poles. And perhaps, in the end, we might even reject Marx as the spiritual progenitor of all communism. After all, Hegelian ideas might suit us better than the ramblings of a privileged Jew who never worked a day in his life."
DGR_private_enterprises_desc: "The cult of entrepreneurs has reached its peak in our late capitalism. The exploitation of ordinary people by pathological liars who consider themselves the backbone of the Polish economy has been staggering. People were forced to live in a free market that guaranteed them nothing, primarily not even survival until the next day. Corporations, private profiteers, fraudsters, and thieves - each of them will face the hand of justice. And that hand wields a sword with which we will give every exploiter what they deserve. Under this communist postulate... I will sign with both hands"
DGR_fallen_monuments_desc: "It's somewhat amusing how certain public institutions in the Dąbrowa Basin suddenly came into possession of long-lost communist monuments following the announcement to restore them. It turns out that decommunization didn't mean destroying symbols or severing ties with the past; it was merely a \"hide it for later, it might come in handy\" operation. And now, it indeed comes in handy. How on earth did they know?"
DGR_living_factory_desc: "A workplace is like a second home. While that doesn't mean you should actually spend the night there, it does imply that major facilities should offer the right kind of amenities. Modern corporations boast about their game rooms, book nooks, and foosball tables. That's great, but we should go further. Our workplaces should feature restaurants, bars, and various public establishments. This not only fills our coffers but also boosts morale significantly. Let the revitalized Defum plant in Dąbrowa Górnicza, now known as The Living Factory, be the prime example. We've refurbished the factory, but the local pubs and eateries remain, serving the workers after, of course, and not during working hours."
DGR_security_service_desc: "I always wanted to have my own security forces. But it seems that this idea will be turned against me. Comrades from the government are working hard to minimize the influence of the army and to have any form of defense against potential internal threats. So maybe it's time to hurry up? Maybe this is a sign from fate? Otherwise, it might soon turn out that all the top officers will either face trials or, at worst, just disappear"
DGR_government_reconstruction_desc: "About time. I've long maintained that this grotesque caricature mistakenly called the People's Front is fit only for the dustbin of history. The chief relic of the Dąbrowa communist era has decreed that the government will undergo a radical overhaul, and that the newly appointed officials will be more in line with the ideals of our state. It's rather amusing how deeply he has insulted his current ministers in the process. If I were in their position, I would take this to heart and flee while there's still a chance to do so on my own terms. But it's not about me, is it?"
DGR_silesian_faction_desc: "I understand that Szwej feels isolated, but forming some kind of group of communist super comrades is senseless. We would only create a criminal regime preoccupied with internal power struggles rather than fighting external enemies. We do not need more communists, especially those unsure whether they want to praise Gierek or Gomułka. Some have even ventured far beyond our eastern border and prefer Mao Zedong. Deng Xiaoping might be tolerable, but Maoists? Next thing I know, we'll be recruiting Pol Pot enthusiasts or adherents of Juche..."
DGR_cult_of_gierek_desc: "If there is someone in the Dąbrowa Basin who could be equated with John Paul II in terms of mythologization and cult, it is undoubtedly comrade Edward Gierek, the First Secretary of the Polish United Workers' Party in the 1970s. He was originally from Sosnowiec, which is already a plus for him. But just ask someone who had the chance to live during those times, and they will tell you that comrade Gierek built the power of the Basin. Thanks to him, Dąbrowa Górnicza developed unimaginably. In 1970, the city's population was 60,000. By the end of his rule, it had already reached 140,000, more than double! His investments laid the foundations for this magnificent city, tamed the industrial potential of the Dąbrowa Basin, and exploited it to the fullest. And for that, people still love him. Because after him... things only got worse."
DGR_partisans_faction_desc: "As a former partisan, I firmly say that we should pursue this path. The path of nationalist-populism. We don't need more communists - what we need is a strong nationalist faction capable of uniting people from various backgrounds under the banner of nationalist rhetoric. That way, it won't matter whether someone follows Stalin or Dmowski; they will be able to integrate into our structures. And, I won't hide it - more allies for me in the Politburo."
DGR_civilian_apparatus_desc: "And as I expected, the Gierek faction is raising their voice, claiming that the army has too many powers, and its freedoms and influence must be radically cut. What the fuck. Clip our wings and then wonder why we're not flying. So far, all they've managed to do is expand the civilian administration and start a civil-military conflict. However, the further we go, the worse it will get. This won't end well - they won't stop, and we won't go down easily. War is coming."
DGR_wide_socialist_front_desc: "I retract what I said about Pol Potists and Jucheists. Because that's indeed the direction we're heading. Fortunately, there don't seem to be any Posadists yet. But knowing the realities of the Politburo, it's only a matter of time. Szwej already has ideas from outer space, so what would it be for him to proclaim a communist revolution brought by aliens? I just want to remind everyone - there was already one such attempt to create a great socialist front. In fact, several. In elections, the left always wanted to form grand coalitions to barely make it over the threshold. And the second one was called the Intercounty. We all remember how that ended."
DGR_progress_fund_desc: "I feel like something like this has been done before. Ah, yes, the Economic Progress Fund already existed. In fact, now I see it has the same goals - funding for farmers who suffered during the wars. Of course, aid will be granted only if they prepare the land for collectivization or fall under the protection of state agricultural enterprises. Clever move, Minister. We all know that farmers won't refuse such hefty subsidies. Just hope this fund lasts longer than its predecessor did, which was barely two years."
DGR_national_socialism_desc: "We have a strong socialist political front. We have nationalist elements in the army. So... I don't want to be the one explaining basic math here, but wouldn't this work out to be something like... National Socialism? Maybe use Socialist Nationalism, it might go down easier. You could have had a true nationalist-populist revolution, but instead, you'll end up with a strange amalgam of popular ideologies seasoned with an antagonistic military. The Soviet Union would be proud. The Third Reich, not so much, despite the name."
DGR_cult_of_moczar_desc: "The legacy of the factional wars in the PRL still affects our society, especially now. On one side, the socialists adhering to Gierek, on the other, we, the nationalist-populist patriots who now need a symbol as strong as the first secretary from Sosnowiec. And there is no better choice than Mieczysław Moczar, who embodied the idea of national-communism and right-wing nationalist tendencies. He will be the figure whose spirit will unite our political environment under one ideology. Let us just cool down with the antisemitic remarks for now."
DGR_military_government_desc: "If comrade Szwej's problem is that the military has far more influence on reality than the government, I have a solution for him. Simply integrate military personnel into the government. Isn't that simple? No more passively accepting idiotic political regulations from above. The National People's Army must become the official executive branch of our country because only this way can true revolution be realized. We will end all internal conflicts within the government and among politicians once and for all. They could use some real military discipline. If we shout loud enough... they'll agree to anything."
DGR_ideological_purity_desc: "Too much of anything is unhealthy. Ideological fragmentation does not serve the unity and strength of our state. We've seen this before with the unified front in the Basin; sooner or later, the leftists will turn on each other, and nothing will stop them from tearing apart even the greatest power. I believe we are ready for phase two. For what I have been building here since I decided that betraying my ideals and joining the Popular Front would be an investment in the future. And the future is now, old man. We stand on the brink of a glorious creation, a glorious revolution which will see this country reborn."
DGR_army_lobbying_desc: "The situation is very simple. We don't enter the government to avoid benefiting from it. And since every gain we make is an investment in the safety of our nation, that's a secondary matter, but a good one that arises from this entire cycle. We won't have to constantly beg the Politburo or threaten them with rebellion to get something. Now, we'll simply take what is rightfully ours, and no ministerial complaints will be able to stop us. We will strengthen the army to the point where all my dreams can be realized. And they are grand ones."
DGR_national_bolshevism_desc: "A time comes in the history of humanity when extraordinary individuals stand at a crossroads and are forced to make difficult choices that will determine the future of many. The National People's Army is ready. Our people within government institutions are also ready. The Palace of Culture will be surrounded. Comrade Szwej will undergo a long, enforced conversation with me. We will clarify a few things, and this time, it won't end as it did before. Lessons were learned here. And let hell consume me if we fail now. The plan has been years in the making; I was born for this moment. The previous failure was merely an element designed to prepare me for today. National Bolshevism, or death."
DGR_5_year_plan_desc: "Economic plans are cool. Instead of chaotic investments in whatever the global economy throws at us and all those theories about supply and demand, we're executing our objectives step by step. The capitalists are furious because, of course, you can't arbitrarily decide in which year to build which sectors of the economy, you have to think about Hayek. I couldn't fucking care less about the Austrians and their damned economic school; nothing enslaves people like capitalism. We know what people need, and we will steer to complete the seventh Five-Year Plan in Polish history. The seventh. The six previous ones clearly showed that the results are positive."
DGR_heavy_industry_nationalisation_desc: "Heavy industry is the backbone of the nation. The prosperity of the state depends on its proper functioning; the entire national economy relies on it. Therefore, we cannot allow a private entity to dictate terms to the state by controlling a key sector of the economy. No. All strategic economic positions and heavy industries must be state-owned to ensure that they work for the nation, rather than enriching some private individual at the expense of the country's future. Only nationalized enterprises will be cared for by their administrators as if they were their most cherished family."
DGR_restore_defunct_plants_desc: "The Balcerowicz Plan and its consequences have been a disaster for the Polish nation. The economy was completely devastated, enterprises went bankrupt in large numbers, and vast swathes of people were left without jobs or prospects for the future. The way in which liberal governments over the following decades attempted to eradicate any signs of Polish economic spirit deserves a separate category of national treason. Entire sectors - mining, metallurgy, shipbuilding, automotive industry - collapsed, yet those responsible for this never faced any consequences. Now they will. We shall, step by step, restore all the fallen enterprises to life. For the people. By the people."
DGR_prefab_apartments_desc: "Liberal governments loved to boast about the number of apartments they built and the wonderful lodgings they created. They were completely indifferent to the fact that ordinary people couldn't afford to live in their magnificent villas. After all, some wealthy investor would eventually come along and invest in real estate. A young person stands no chance of owning their own apartment; if they're lucky, they might afford to rent a tiny room in a six-person house within a cramped block. We need a mass housing program. A mass one, not just three hundred small units once every ten years."
DGR_real_estate_crash_desc: "I don't know if there's a worse creature than a landlord. In our state, the real estate market has essentially collapsed. Total breakdown, thanks to our efforts. And that's a good situation. On the ruins of this sick system, we can build a new world where there's no need to rely on the benevolence of real estate agents who might graciously lower the rent by 2 zlotys per square meter, while increasing utility fees by several hundred zlotys. Enough of flippers, enough of exploitation. Housing is a human right, not a commodity! And for those who so eagerly played with people's lives and mocked this fundamental right, we have special housing. Nice ones, where they'll never have to move out for the rest of their lives."
DGR_pgr_desc: "Farmers have become quite spoiled since the fall of communism. They've absorbed capitalist ideology to the core, which, combined with their socialist roots and demands, has created a terrifying mix. Entitlement, a lack of communal spirit, and no sense of responsibility towards society. The National Agricultural Farms we're introducing today will bring them back to reality and cement the image of the farmer as one who cares for the national community by feeding the entire country, not just themselves. And this is just the beginning of the changes they will face."
DGR_collectivisation_desc: "Privatization of agricultural land was a disastrous move towards liberalism. The conflicts surrounding this event persist to this day, and some farmers simply have no clue about management and shouldn't be involved at all. Therefore, collectivization will help achieve excellent results. Those who can work will work. Those who can manage will manage. Everyone in their place, everyone working hard for the common good. We will start with agriculture. Eventually, we will achieve a true national community where the fruits of labor will serve everyone who is honored to belong to our nation."
DGR_wait_and_see_desc: "The seed of productivity has been sown. The plans have been outlined, the organizations prepared to begin production according to the appropriate standards and agendas. Programs essential for the functioning of the five-year plan have been launched. Everyone knows what they must do.\nYes, there may be some fluctuations in the markets due to the revolutionary changes we are carrying out here. Surely, things will get worse for a while before they get better. But now, all that remains is to stay the course, do our work, and wait... for the fruits of our labor. And then we will savor their taste without having to tighten our belts any longer. It's almost here. Just five years."
DGR_green_utopia_desc: "Bas Tajpan, who recently decided to engage politically under his real name, presented a package of laws today that are intended as a response to the Green New Deal. To me, it seems like he's trying to be holier than the Pope, scrutinizing all European regulations and tightening the screws twice as hard. Banning car production, banning animal husbandry, dismantling our heavy industry and energy sector. I don't know if this man is joking or if he's a damn saboteur. No one in their right mind would take this seriously. Even Comrade Dementia isn't detached enough from reality to make us all frolic in green meadows like Disney princesses in a few years."
DGR_legalizacja_teraz_legalizacja_tu_desc: "From the start, I knew that dealing with this parasite would bring nothing but trouble! Perhaps if he had stayed sober, he wouldn't have had the energy to spout nonsense about the medicinal properties of drugs. And now Minister Krępa thinks it's the perfect time to give the Politburo an ultimatum - legalization of marijuana. So, all those previous ideas were just a smokescreen for this one issue. What frightens me is how many supporters he seems to have. Am I not the only member of the People's Front who has secretly been building an underground power base, waiting for the right moment?"
DGR_appease_them_desc: "If it shuts his damn mouth, so be it - I might even vote for legalization. Let him get high and keep him away from the Politburo meetings, because, as God is my witness, I'll light up a two-meter joint up his ass if he shows up again. And yes, we've got those in the army. They're called short-range missiles. Still, it seems like an appropriate approach to the current problem. People are shouting for something, demanding something. With legalization, at least we'll have control over the substance and its distribution, and we won't create another black market. We've had enough trouble with that already."
DGR_people_are_pissed_desc: "Okay, it seems like people weren't specifically asking for marijuana legalization... because they're still protesting. Today, strike committees were formed at the Myszków and Zawiercie factories. If it's not about marijuana... then what is it? They have housing - somewhat livable. They receive money - what they can buy with it is not our concern; we're in a civil war. Alcohol and cigarettes aren't taxed by us, so they're even cheaper. Security - provided. What could they possibly be missing?"
DGR_strikes_spreading_desc: "Freedom? What is freedom to a bunch of workers whose life goal is to work 8 hours, go to the pub with his mates, and then return to a wife who's rotting at home with the kids? What deeper needs could they possibly have that make democracy essential for them? None. People are divided into the ruling class and those destined to be ruled. Someone is inciting our workers; they aren't capable of such profound thoughts on their own to realize they are being controlled. We'll send security services to every factory to unmask the agitators. In the meantime, we need to start thinking about prevention because factories in Częstochowa, Sosnowiec, and Lubliniec are now joining the strikes..."
DGR_mistrzostwa_w_palowaniu_gornikow_desc: "Good morning, today we begin the National Championships in Beating Workers. The teams from all units of the National People's Army are ready to start the competition, warming up before the games and eagerly awaiting the first whistle from the officiating officers. Before you, the opening match - the 1st Battalion 'Edmund Cedler' will face off against the striking workers from the Zawiercie Steelworks. Who will win? We can only guess, though the favorite is undoubtedly the Red Banner Battalion. We also invite you to the other matches scheduled for this week at the largest industrial facilities in your city. Guaranteed beatings or deportation to a labor camp."
DGR_czolgi_na_hute_desc: "And you, steelworkers of Dąbrowa, you too? Stabbing us in the back? There will be no bread, because there is none. There is vinegar and steel. There will be no freedom either, because you don't need it. But refusal to work in strategically important factories during martial law will be met with the harshest penalty. The Politburo has agreed to execute the most radical of preventive scenarios. Tanks will once again head towards the Katowice Steelworks. And this time there will be no agreements, no Solidarity, and no Round Table. There will be pain, toil, and gnashing of teeth."
DGR_history_repeating_desc: "We cannot afford to be weak again. History tends to repeat itself, but in this case, it's so we can learn from our mistakes and not repeat them. Making concessions with striking workers is the first and greatest mistake one can make in the face of mass protests. We will respond to any sign of resistance to our authority with an iron fist and fire. As the historical maxim goes: \"Any provocateur or lunatic who dares to raise a hand against the people's authority can be certain that authority will sever that hand.\"\n\nCyrankiewicz was right. Today more than ever."
DGR_komu_to_potrzebne_desc: "Legalize marijuana? Why? Who needs it? We did not fight so hard against the criminal drug underground in Dąbrowa just to allow junkies to corrupt society once again. I will never vote for it. We are trying to build a new community, free from substances and addictions, not to surrender to the weaknesses of the underworld. No one will convince me that this is normal and natural. I have seen enough of the effects of this so-called \"wonder drug,\" which drives young people into debt and leaves their minds foggy as if they were perpetually dazed."
DGR_nowy_protest_desc: "In Zielona Park, government documents related to the criminalization of drugs, including marijuana, were just burned. The event was led by Minister Krępa, also known as Bas Tajpan. Then everyone started singing some nonsensical song about how, if they were a magician with three wishes, they would choose a kilo of marijuana. And then another song that goes like, \"Dąbrowa Górnicza, dressed in prohibition. Killed nobody, but still prohibited\" Yes, we all know those worthless artistic pieces. But for a minister to do something like this is a slap in the face of authority. And for this insult, Bas Tajpan will pay dearly."
DGR_diss_na_rzad_desc: "Minister Damian Krępa is no longer a said minister. Once someone starts opposing their own government while still being part of it, it no longer makes sense. Thus, we facilitated his trip to rock bottom by dismissing him immediately. Loyal government units are already heading towards the capital to crush this rebelling scum into dust. I can't wait for the last subversive element to vanish from our streets. The rest will disperse very quickly, and the situation will be under control.\n\nWait... is that idiot really putting on a concert in front of the palace?"
DGR_criminal_hydra_desc: "It's clear that a significant portion of our soldiers come from ghettos and gangster rap communities. One can leave a criminal environment, but mental poverty remains incurable. And it's within such circles that Bas Tajpan found his support. This concerns me greatly because it means that within the National People's Army, there is a cancer that will be hard to cure. Striking workers are breaking the law, so by definition, they have also become criminals. It will be difficult to manage a nation where the majority stands on the other side of the law.\n\nI'm worried about issuing the order to break through to the capital at all costs through blocked streets. There's a risk that soldiers might refuse to carry out the order. If that happens, it would mean they are criminals too... My head is starting to ache from all this."
DGR_SPALMY_BABILON_desc: "Once again, it seems I underestimated the power of the masses as they are unable to grasp ideas that go beyond the tip of their damn noses and reach further than their next meal. So, I have what I deserve. It's strange that I wasn't shot or burned at the stake on the spot, whatever they might have preferred. Locked in some dark cell, I await my fate. Meanwhile, the infamous \"Babylon\" is burning. Literally, the coup was executed amidst the flames of several fires in the capital. And the striking workers haven't even lifted a finger to help us. So, we face a Rastafarian future."
DGR_SADZIC_PALIC_ZALEGALIZOWAC_desc: "BUDI BAJ BAJ BAS TAJPAAAAAAAAAN JAAAAAAAAAH RASTAFAAARIIIIIIIIIIII"


DGR_hour_of_the_wolf: "Hour of the Wolf"
DGR_hour_of_the_wolf_desc: "The time has come for the revolutionaries to pay for their criminal actions against the government. What we did was an incredibly difficult decision - but a necessary one. The rest will not dare to repeat such an uprising, fearing an even harsher retaliation. The balance has tipped in our favor. All those subversives... they were waiting for the right moment. The old man was gone for just a second, and they were already at my throat. Not a chance.\n\nWith Szwej absent, and with martial law imposed, I will hold unlimited power. And believe me - I WILL restore order here."
DGR_bargiela_list: "Bargieła's List"
DGR_bargiela_list_desc: "Enough. I can hardly stand the thought that those nests of decay - political parties and social organizations - were allowed to function without restraint. The main reason for my contempt is their complete and thoughtless detachment from reality. On top of that, they are responsible for the recent strikes and riots through their agitation. Was it really them? And does it even have to be true? By my estimates, around three-quarters of all social, political, and cultural organizations will cease to exist after the next decree. No one will need them. They will no longer sow chaos or poison people's minds - not when a better, state-controlled alternative exists."
DGR_capital_punishment: "Capital Punishment"
DGR_capital_punishment_desc: "When a man is too lenient, others begin to take advantage of it. Give them a finger, and they will want the whole hand. And if they don't get it, they'll take it by force. The doctrine of \"turning the other cheek\" has wrought absolute devastation in people's minds. It is time to return to the simplest principles. Christian mercy cannot function when war rages around us and survival is at stake. An eye for an eye. A tooth for a tooth. Death for betrayal. That Hammurabi was a wise man indeed. And before the philosophers start preaching that an eye for an eye makes the whole nation blind - no, it won't... not if we are the ones who control the vision.\n\nSo, what's it gonna be? Hanging? Beheading? Electric chair? Firing squad?"
DGR_assembly_ban: "Assembly Ban"
DGR_assembly_ban_desc: "Gentlemen, colleagues - this is how it works: when you impose martial law, you also impose a ban on public gatherings. With the exception of those sanctioned by the Politburo, of course. Such a small decision, yet it clears the board of all unwanted pieces in one swift move. In the end, it comes down to a very simple rule: hold a public meeting, and you are an enemy. So if you're not an enemy - don't hold meetings. Simple and logical, isn't it?\n\nUnfortunately, the worst rats will flee underground, creeping through the shadows and the sewers. But we'll smoke them out too, step by step."
DGR_fake_judges_fake_trials: "Fake Judges, Fake Trials"
DGR_fake_judges_fake_trials_desc: "We may have gone a bit overboard with the number of arrests. The number of people awaiting trial exceeds our processing capacity. We can't keep them there forever, so we'll have to get creative. Fortunately, what we do have in abundance are judges' robes and empty halls. After all, a judge is only there to read out a verdict based on our law - they don't decide anything themselves. So why do we need real judges at all? We have plenty of officials. And these won't be long trials. Quick and efficient - prison, labor, or execution. The judicial system of the Third Republic has never been as effective as it will be now. And only now will we truly redefine what \"neo-judges\" means. Well - harsh law, but law nonetheless."
DGR_deaf_walls_of_wojkowice: "Deaf Walls of Wojkowice"
DGR_deaf_walls_of_wojkowice_desc: "In Wojkowice, there has been a prison since the 1960s. Since 2009, it has been the largest facility of its kind in the region. Congratulations - it's about to become the largest in the entire country. We need more space, and since there are forests and a (useless) stadium nearby, we can practically double the prison's area. We'll need not only a men's facility, but also a sector for women, a high-security wing, and a section for prisoners convicted of political crimes. On top of that, we'll double security, surveillance, and build thicker walls - so that no one nearby accidentally hears the screams coming from inside. Good heavens, not from torture! We're not sadists, for God's sake... we're professionals. That's just what people say, right?"
DGR_no_country_for_old_men: "No Country for Old Men"
DGR_no_country_for_old_men_desc: "The old man is coming back from the hospital today. Of course that damned dinosaur returns the moment I've finally managed to get this state back on its feet. The situation is calm now - no one is protesting, no one is throwing grenades at military posts, everything is quiet, nothing is happening. And in he comes, ready to take all the credit. And I'll be pushed aside immediately, blamed for everything. They'll say that if Szwej had been present the whole time, none of this would have happened. Of course it wouldn't have happened - because there wouldn't be a government left! Only the iron fist of the National People's Army protects the Politburo from annihilation at the hands of the masses. And fortunately, Comrade Dementia is now reduced to nodding and signing papers. We've got our own Brezhnev at home."
DGR_people_political_organisation: "People's Political Organisation"
DGR_people_political_organisation_desc: "The list of organizations slated for delegalization was only the first step. Now, as we fill the vacuum left behind, we are incorporating all the smaller, pro-government groups into a centralized People's Political Organization. They can keep their little sections - nationalist, communist, bridge clubs, whatever they like. But they must bear the state emblem. Otherwise, their activity cannot be sanctioned. This is the only way to control the great mass whose ambitions can easily exceed its capabilities. And that always leads to chaos.\n\nControl is the only imperative. Freedom never builds civilizations - it only destroys them."
DGR_commissariat_civil_sector: "Civilian Sector of the Commissariat"
DGR_commissariat_civil_sector_desc: "Commissars are an exceptionally effective tool - so effective that it would be a sin to leave them merely disciplining common soldiers. We need to unleash them and send them into the civilian population. Because the lack of discipline and sheer mediocrity are everywhere. People need... the right kind of moral instructors, ones who will remind them which values truly matter. This will also improve security behind the front lines - looters and saboteurs will disappear. Though, to be honest, I worry some of them might go too far... with their \"teaching methods.\" And Wojtek seems a little too excited about this news... well. If not us dealing with them... then they'll deal with you."
DGR_security_committee: "Security Committee"
DGR_security_committee_desc: "There comes a moment in every person's life when the need for security begins to outweigh all other needs - except the physiological ones, of course. It is the state's duty to guarantee that security. I dislike using capitalist analogies, but if we fail to protect the citizen, they will start looking for another patron - or worse, they will begin acting against us. When a person is safe and feels safe, they can actually live, enjoy life, instead of merely worrying about survival. And at every step, they must remember that the only true guarantor of their safety is the National People's Army."
DGR_juvenile_prisons: "Progressive Juvenile Prisons"
DGR_juvenile_prisons_desc: "Everyone keeps repeating the slogan that youth is the future of the nation. Yes, yes - we've all heard it. And that young people need to blow off steam, that everyone did foolish things when they were young, and so on, and so forth. This kind of leniency leads only to children who listen to no one and grow up believing they can do anything without consequences. And then comes polarization, political radicalization - and before you know it, a miracle: a generation of young terrorists. That's why every deviation from the law must be corrected at the earliest possible stage. Juvenile detention facilities will help us with that. Corrective - and brutally effective. And then, perhaps, when such institutions are no longer needed, youth truly will be our future. Or... we'll have to make ourselves a new youth."
DGR_militarization_of_police: "Militarization of the Police Force"
DGR_militarization_of_police_desc: "The police have always been, alternately, objects of hatred and ridicule. Respect for the uniform was steadily declining even before the Fall. I believe one of the reasons was their near-total lack of preparedness for crisis situations. And as it happens, a civil war ongoing since 2025 is one continuous crisis. A sidearm and a baton are no longer enough. Officers must be equipped properly to serve as our first line of internal defense - to be effective, and lethal when necessary. And they must not hesitate to make drastic decisions if they are to protect society. Just... maybe don't give them grenade launchers."
DGR_ideological_committee: "Ideological Committee"
DGR_ideological_committee_desc: "This will reek of hypocrisy. Because when I look inside myself - there is no ideology there. There wasn't one when I decided on an alliance with the KPP. There wasn't one when we carried out all those waves of communization and socialization. There wasn't one when I had to restore order in this country during the strikes and riots. And there isn't one now. There are values, yes - but it's hard to call that an ideology.\n\nAnd yet - the state needs one. Otherwise, this would be nothing more than a crude military junta. Some may already see it that way, but juntas have a habit of not lasting very long. That's why an ideology - one that people and officials alike will believe in - must become the binding material, the mortar that holds all the bricks together into a solid wall.\n\nAs long as we can keep the mask in place long enough."
DGR_action_c: "Action C"
DGR_action_c_desc: "Ask anyone about Dąbrowa Górnicza, and thanks to those damned priests they'll all start laughing about the rectory orgies. I've never seen eye to eye with religious lackeys. Sure, there are individuals who genuinely treat faith as a platform for doing good, but in ninety percent of cases I've encountered nothing but degenerate thieves who turned the Church into a career path and a ladder to power. The Protestants got one thing right - the immense wealth hoarded by Catholic clergy inside their churches is immoral and disgraceful. Especially in a state like ours.\n\nThe days when the Catholic Church served as a refuge for people in hard times are long gone. Nobody sees any support in this rotten institution anymore, where the hierarchy is either extorting money or molesting children. Which is precisely why nobody will lift a finger to stop what we're about to do. The hand of justice is about to reach the Catholic Church. And it won't even be that terrible. We merely wish to remind them of their roots and the circumstances from which their religion emerged. For now, however, we'll refrain from the lions and gladiatorial arenas. For now."
DGR_ckos: "Center for Shaping Public Opinion"
DGR_ckos_desc: "The sheer volume of information in modern times often overwhelms people who are unfamiliar with the techniques of media manipulation. Information overload leaves them unable to process anything important. That is why we need an institution that will gently guide people toward the information they actually need. And, more importantly, tell them what to think. Because most people do not possess opinions of their own on the majority of subjects. They simply repeat whatever their family, friends, celebrities, favorite television station, or preferred website tells them. And society is not going to change. Stupid people remain stupid.\n\nSo let us be shepherds and lead them where we want them to go. Let us guide their thoughts until they believe everything is fine simply because they have been taught that it is. The placebo effect will solve most of the problems they only think they have. And at least we'll get some peace from those rebellious troublemakers who always believe they know better than the people actually running the country."
DGR_national_protection_service: "National Protection Service"
DGR_national_protection_service_desc: "The government is always right. Even when it isn't. And if we happen to make a mistake and someone catches us with our hand in somebody else's pocket - well, that wasn't our hand. That may irritate some people at first, at least until our media machine starts doing its job. And considering the state of our country, a single dissatisfied man with a weapon in the right place at the right time could change the course of history. I have no intention of ending up like certain American presidents. I have to survive if this country is going to survive. That said, it would look rather suspicious - and rather foolish - if I simply granted extraordinary protection to myself alone. Therefore, we are establishing the National Protection Service, bringing together the finest professionals in personal security. Its purpose will be to safeguard the most important individuals within the state apparatus. Nothing revolutionary. They'll simply be far better equipped and funded than the Government Protection Bureau ever was before the Fall."
DGR_administration_committee: "Administration Committee"
DGR_administration_committee_desc: "Bureaucracy is a gigantic, bloated parasite that exists solely to drain meaning from people's lives. Administration should be simple and logical, so we spend as little time as possible resolving absurd situations and as much time as possible dealing with matters that actually matter. It's even worse when the entire bureaucracy is staffed by incompetent civilians with oversized egos who sit behind a government desk and suddenly think they're rulers of the world. And they reproduce through some bureaucratic form of mitosis. Before you know it, the same office employs the sister, grandmother, cousin, and half the family tree, despite the fact that the only skill any of them possesses is making terrible coffee. The whole system needs military discipline and iron control. Maybe then we'll be able to mold something useful out of this absolute cesspool."
DGR_regional_military_protectors: "Regional Military Protectors"
DGR_regional_military_protectors_desc: "Voivodes and county governors belong to a species that should have gone extinct long ago. They're nothing more than job-generating machines for the politically connected. The worst part is that they never really had anything meaningful to say. Their entire purpose was nodding along or taking the opposite position for the sake of appearances. Occasionally they signed a document because they had no choice. Given how little authority they actually possessed, it's difficult to blame them for doing nothing. Unfortunately, we still need them in some form. But by creating the office of Military Protector, we will ensure an additional layer of oversight over local administration. These Protectors will possess the authority to declare a state of emergency whenever civilian authorities fail to fulfill their responsibilities. And if local officials become too ambitious, the Protector will simply remove them - either at the request of the people or on their own initiative. If persuasion fails, pressure follows. Until results are achieved."
DGR_ministry_of_recovered_territories: "Ministry of Recovered Territories"
DGR_ministry_of_recovered_territories_desc: "We have a problem. On one hand, we're building a highly effective administrative system in our core territories. On the other hand, we're constantly expanding our authority into neighboring counties and provinces, which means new territories keep arriving faster than we can properly manage them. At first glance, it might seem easier to build a new administration from scratch than reform an existing one. Normally, yes. But reclaimed territories require a different approach. A more military one, at least until they are ready for civilian governance. That is why I have ordered the creation of the Ministry of Recovered Territories. It will oversee all lands that come under our control but have not yet been fully integrated into the administrative core. And it will have plenty to do. Partisans must be suppressed. Local property must be administered. In some cases, corrective social programs must be carried out. Most importantly, society itself must be prepared for integration into our system. For some people, it will come as quite a shock."
DGR_intelligence_committee: "Intelligence Committee"
DGR_intelligence_committee_desc: "Ignorance is the enemy of effective government. We must understand what is happening among the population - not only to avoid making decisions detached from reality, but also to safeguard public security and prevent undesirable outside influences from disrupting our order through subversion and reactionary propaganda. We are at war. A few civil liberties must be sacrificed so that all of us can be protected from the enemy. And besides, if you have nothing to hide, you have nothing to fear. At the same time, if we intend to counter our enemies abroad effectively, we must know what they are plotting and how to exploit their weaknesses. The intelligence war should be fought far from our homes. And perhaps, through a few well-executed operations, we might gain enough advantage to make the entire process of reclaiming Poland considerably easier."
DGR_expanding_informant_network: "Expanding the Informant Network"
DGR_expanding_informant_network_desc: "I dislike the word collaborator. It suggests that we are some kind of foreign occupiers, when in reality our Polishness is turned up to the maximum setting. Informant sounds much better. Not that I particularly care what we call them. To everyone else they'll still be rats reporting on their neighbors. And to be honest, I feel an instinctive contempt for such people. Because if someone starts by informing, where exactly do they end? Fortunately, I don't have to personally wade through that filth. And informants will prove useful everywhere - in every social class, every workplace, every university. Because few things are more dangerous than hidden traitors. They must be uprooted like weeds before they spread across the entire garden. And a good gardener never waits for weeds to appear. He prevents them from ever reaching the surface in the first place."
DGR_special_courses_for_agent: "Special Courses for Our Agents"
DGR_special_courses_for_agent_desc: "Being a spy is one thing. Being a good spy is an entirely different challenge. Sometimes you need assassins, explosives experts, escape artists, or someone capable of convincing another person of the most outrageous nonsense imaginable. Sometimes you need charm and seduction. Sometimes you just need someone who can punch hard enough to solve the problem.\n\nI've ordered the Intelligence Committee to prepare a series of specialized training programs for our agents, broadening their range of skills. A lone operative often has to improvise, drawing on every talent they possess to survive dangerous situations. I don't envy them for that job, though they could probably say the same about mine. The ultimate goal is to train agents versatile enough to become armies of one. Unfortunately, nobody will ever hear their stories, because operations like these can never come to light. A shame, really. They'd make for remarkable tales."
DGR_institute_of_people_history: "Institute of People's History"
DGR_institute_of_people_history_desc: "History is written by the victors. The saying is as old as civilization itself, but nobody ever said it couldn't be rewritten again. In fact, every state does exactly that - carefully concealing the worst things it has done to others. Ukrainians claim the UPA were saints who never harmed anyone. Russians say the same about the Red Army. Germans whitewash the Wehrmacht. And their societies genuinely believe it because they've rarely been taught otherwise, and even when they have, their first instinct is denial.\n\nTherefore, history must meet our expectations. And if certain facts fail to cooperate - so much the worse for history. We don't need to lie outright. It is enough to present selective truths and drown out anyone trying to highlight inconvenient contradictions. A nation is built upon shared culture, traditions, and history. Once we can influence all three, we will be able to reshape the entire nation into something extraordinary."
DGR_civil_committee: "Civilian Corps"
DGR_civil_committee_desc: "I maintain that there should be no true civilians in our country. Therefore, even when we call something the Civilian Corps, it is understood that its members belong to the National Political Organization, itself an extension of the military into civilian administration. Whether people like it or not, it remains a military institution.\n\nIf teachers, healthcare workers, and social workers are tied directly to the armed forces, we gain two advantages. First, we can effectively supervise their work and enforce accountability. Second, they become obligated to act in the collective interest of the military, which will undoubtedly improve both their competence and the quality of their work. Because all of us are simply components of one vast machine."
DGR_national_healthcare_league: "National Healthcare League"
DGR_national_healthcare_league_desc: "Healthcare has always been a rotten subject in Polish politics, and nobody seems capable of fixing it. One side screams for privatization, the other wants to pour billions into the system and hope that doctors earning astronomical salaries suddenly feel compelled to heal people effectively. But how can the system be effective when a cured patient is lost revenue?\n\nFrom this day forward, only those who achieve the proper rank and pass the required field medic examinations will be allowed to call themselves doctors. In this way, we will filter out those who merely want to sit behind desks and make decisions about human lives, replacing them with physicians who understand just how precious life becomes when it can disappear in the middle of a battlefield at any second. All medical personnel will be organized under the National Healthcare League, and only its members will be authorized to treat others. Because nobody who has never been responsible for human lives under field conditions will ever fully appreciate what it means to save one."
DGR_education_inside_the_nation: "Education Inside the Nation"
DGR_education_inside_the_nation_desc: "Polish education, much like healthcare, was one enormous and rather unfunny joke. It not only failed to prepare people for life in society - it often failed to teach anything genuinely useful. As for the teachers, many were utterly unprepared for the profession itself. Some couldn't even maintain order in a single classroom. If they become military officers, however, discipline will no longer be an issue. We also need to teach skills that actually matter. Civil defense training and people's history are essential. Existing subjects should place greater emphasis on practical applications: ballistics in physics and mathematics, explosives in chemistry, human anatomy in biology. Certain fields deserve greater attention because of how useful they may become later in life. And in place of religious studies, we'll teach tactics and strategy."
DGR_media_committee: "Media Committee"
DGR_media_committee_desc: "The media, the media, and then the media again. They never were free, they aren't free now, and they never will be. There's no point pretending otherwise. Journalism has become a profession more disreputable than sex work, while many so-called media personalities can barely put together a coherent sentence. The entire system needs to be torn down and rebuilt around centralized media outlets whose role is to provide news - and only news. Opinion-making should be left to other central institutions. Giving a platform to subversive elements only risks spreading reactionary contagion. We cannot afford compromise here. Free media inevitably create informational chaos. Every piece of information is a projectile that can be fired against us. The challenge, unfortunately, lies in enforcement. Television, newspapers, and radio can be controlled. The internet, however...We'll have to come up with something else for that."
DGR_supreme_censor_office: "Supreme Censor Office"
DGR_supreme_censor_office_desc: "This is not about banning artistic or journalistic creation outright. People are free to pursue such professions. But it cannot be allowed that some actor or celebrity does whatever they please while society is expected to fund them, only for them to present themselves as moral authorities. You're craftsmen, nothing more. You have no right to place yourselves above other working people. As for what you produce - that will be judged. The Supreme Censor will ensure that no hidden revolutionary messages, coded subversion, or other dangerous ideas find their way into your work. And if we discover something unfit for publication, you can be certain the consequences will go far beyond a simple warning. We will treat such actions as subversive activity and respond accordingly. And don't even think about making the wrong kind of memes"
DGR_intranet: "Our Own Intranet"
DGR_intranet_desc: "We have devised a final solution to the networking problem. Why risk informational chaos by connecting the country to a global network where control over cyberspace is effectively impossible, when we could simply create our own internal network instead? Yes, I know North Korea is the only country that does something similar, but at present it is the only way to guarantee the security of society. After all, everyone knows what lurks on the internet. How dangerous it can be for the public. No force caused more damage than social media. Nothing distorted the image of a healthy society quite like they did. They were a disaster for the human race, and it will take years of detoxification before people begin thinking like rational individuals again."
DGR_ministry_of_military_funds: "Ministry of Military Fund Acquisition"
DGR_ministry_of_military_funds_desc: "The machine must keep moving. And to keep moving, it needs money. Far more money than I would prefer, but there is little to be done about it. The capitalist system still clings stubbornly to the world with both hands. A major step toward streamlining our efforts will be institutionalizing the acquisition of funding for the military. The best way to accomplish this is through a dedicated ministry responsible for securing those resources. The minister will have broad authority, because achieving our goals will often require creativity and the occasional bending of a few rules. It will be one of the most important positions in government. After all, the responsibility for ensuring that our army remains equipped, supplied, and capable of fighting will rest squarely on their shoulders."
DGR_energy_committee: "Energy Committee"
DGR_energy_committee_desc: "The strategic sectors of the economy must remain under the exclusive control of the military. In a state of war, we cannot afford to let some civilian fool manage something as vital as the energy sector. Unfortunately, even that will not solve the fact that our aggressive reindustrialization efforts may be slowed by energy shortages. These damned systems are fragile when overloaded - push too hard in one place and we'll be dealing with blackout after blackout until everything collapses like a house of cards.\n\nWe could invest more heavily in alternative sources, but hell, the whole issue has become so heavily politicized that I'm not even sure what's worth pursuing anymore. Maybe we should just cover the entire Błędów Desert with solar panels and call it a day. One way or another, we need to secure our power grid. We cannot keep endlessly expanding the plants in Łagisza and Jaworzno. And Bełchatów won't save us either if we continue managing things carelessly."
DGR_alternative_power_sources: "Open Up to Alternative Power Sources"
DGR_alternative_power_sources_desc: "Alright, you've convinced me. Let's not celebrate too early, though. Opening ourselves to alternative energy sources does not mean we're about to create some green utopia and sing cheerful songs with deer and doves. Hydroelectric plants? Sure. Solar panels? Absolutely. Wind turbines? Not many good places for them, but if the numbers make sense, we can build them. Nuclear power? Yeah, sure, right. Atom. Mhm. Don't dream.\n\nThis is a purely pragmatic decision. We need to patch the holes in our energy mix, and I couldn't care less if some academics start screeching that ohmagad, the planet is burning. Of course it's burning - we're in the middle of a bloody civil war and bombarding each other. How exactly is it supposed not to burn? One wind turbine doesn't make you a leftist. And the environmental activists can shut their fucking mouths."
DGR_hard_coal_union: "Union of the Hard Coal"
DGR_hard_coal_union_desc: "Honestly, I'm not sure who's more insufferable humanoid - an environmentalist or a miner. Both treat energy policy like a religion when most of it can be reduced to a very simple equation: if we can use it, we will use it. But the moment you allow a few solar farms or wind parks to appear, you can already feel the fucking miners breathing down your neck. They want compensation. They want guarantees. They want endless recognition for their beloved coal.\n\nUnion of the Hard Coal, which we are establishing today, has two objectives. First: make the miners stop complaining and focus on something productive. Second: ensure the proper functioning of everything related to coal extraction and processing. Because we need oversight, and we cannot allow them to start forming independent trade unions. Once that happens, we'll never regain control - every shithead with a pickaxe will start imagining himself the ruler of both the surface and the underworld."
DGR_equality_committee: "Equality Committee"
DGR_equality_committee_desc: "Of course equality matters. Though in most cases, equality simply means bringing everyone down. Those at the top usually have far too much. And for good reason - people who accumulate immense fortunes are rarely the sort who deserve our trust. So we won't trust them. We'll manage those assets on society's behalf. And those who consider themselves superior to others because of wealth, status, or pedigree? There are few things more intolerable than a person inflated by their own fucking ego. I swear, some people will find little mercy if they choose to look down on others for being poorer or for coming from somewhere less prestigious than the noble lords they imagine themselves to be. The outrage of the privileged will be loud enough to shake the ground. But it will be worth it. If only to see their faces when karma finally catches up with them. And karma is a vicious bitch. I am merely her avatar."
DGR_being_rich_is_being_enemy: "Being Rich is Being an Enemy"
DGR_being_rich_is_being_enemy_desc: "Wealth is usually built on the backs of others. Under capitalism, exploitation comes as naturally to some people as breathing. Of course, it takes a complete moral vacuum to enrich yourself while watching everyone else struggle. Anyone who amasses great wealth has an obligation to return it to society. Those who do so willingly will be respected. Those who hoard vast fortunes for themselves will be enemies of the people. And enemies of the people...\n\nWell, I'm still considering the proper solution. We could settle the matter quickly and efficiently. One order would be enough. But perhaps it would be more interesting to allow the people themselves to carry out popular justice. Give them a sense of agency. Give them a chance for revenge. Naturally under the watchful eye of the Guard, so things do not spiral into indiscriminate violence against the working population. I'll think about it."
DGR_pink_files: "The Pink Files"
DGR_pink_files_desc: "Certain issues have been cynically exploited by modern neoliberal and left-wing movements for political gain. The casualties of that game have been people with homosexual tendencies, along with all the various... other categories. You know the ones. While some cases verge on mental illness and should be addressed through therapy, the mere existence of such inclinations does not disqualify a person. We are not Nazis. However, not every sexual inclination is healthy for society. People belonging to these groups often become involved in subversive activities, usually encouraged and manipulated by liberal reactionaries who, if they ever gained power, would probably prefer to pretend such people didn't exist at all. We won't do that. On the contrary, we will take a keen interest in their existence. What they do in private is their own business. But it would be useful to know who belongs to which group. And let's be honest - if someone lies to state officials about such matters, then punishment enters the equation. That punishment, however, will not depend on whom they happen to prefer."
DGR_red_scare: "Red Scare over Poland"
DGR_red_scare_desc: "The communists are coming! The red plague! Moscow's puppets! Commie bastards!\n\nThe propaganda machine aimed at us is thriving. Its sole purpose is to associate our movement with everything people fear and despise. Trying to explain ourselves is pointless. The fools have already made up their minds, and those driving the campaign are only laughing at us. So we will give them nothing to laugh about.\n\nLet them be afraid. They will learn what National Bolshevism looks like in practice. Subversives and political opponents alike will experience the terror they claim to fear so much. Only then will they truly understand what fear of communism means. And the funny part is that we won't even have to explain that we aren't really communists at all. That we never truly believed in that ideological swamp in the first place. Only the fear will remain."
DGR_illusion_of_bolshevism: "The Illusion of Bolshevism"
DGR_illusion_of_bolshevism_desc: "Have I mentioned how little I care about communism? And yet somehow everyone considers me one of the most important communist leaders of the modern era. Hell, perhaps I should have gone to acting school instead of wasting my life on soldiering. Of course, everyone judges me through the lens of Comrade Dementia, who supposedly suckled Lenin himself, but...\n\nHonestly, I don't know how much longer I can maintain this illusion. During the District Wars, I thought I'd keep it up for two weeks at most. The pessimists gave me two days. It's been over a decade. If anyone actually looked inside this country, they'd realize within minutes that it has absolutely nothing to do with communism, Bolshevism, or any other -ism. Then again, that fits perfectly with what every defender of failed communist regimes always says:\n\n\"That's not real communism!\""
DGR_day_of_the_sickle: "Day of the Sickle"
DGR_day_of_the_sickle_desc: "Now that we are the sole masters of this house called Poland, perhaps it's time to do a little cleaning. After all, maintaining order is the responsibility of the owner. And to be honest, there is plenty to clean up. When we inherited the country, we also inherited countless reactionaries and people who seem determined to watch Poland burn forever. Sometimes I wonder whether they ever grow tired of it.\n\nHow long can someone keep fighting imaginary enemies simply because their tribe isn't the one in power? We brought peace. We brought stability. This is a new country now. Deal with it. You lost. And if you insist on continuing the fight...don't worry. We have some very special holiday programs prepared for you. Permanent ones.\n\nHow many lessons in humility must we teach them before those monkeys finally learn?"
DGR_military_fiefdoms: "Military Fiefdoms of Officers"
DGR_military_fiefdoms_desc: "I should have expected that favoring people with no real leadership qualities would eventually erode the authority of the state itself. At this point, much of the officer corps has established its own little... fiefdoms. They play at being nobles, ruling over their tiny domains and indulging childish fantasies of kingship. As long as it remains confined to a few garrisons, I can tolerate it.\n\nWhat worries me is the possibility of it spreading into nearby cities, then entire provinces, until we find ourselves in a new age of feudal fragmentation. Fortunately, they all answer to me. And I will make sure they remember it. Especially because, in peacetime, we won't need many of them anymore. Let them sit on their little estates and stay there. They'll contribute more to society that way than by pretending to be regional rulers."
DGR_ultimate_autarky: "Ultimate Autarky"
DGR_ultimate_autarky_desc: "Poland's geographical position has always been, to put it mildly, fucking shitty. Now we find ourselves surrounded by countries that share none of our values or ambitions. Whether we like it or not, we are largely on our own. Perhaps we can secure a treaty or two where circumstances allow. But for the most part, nobody wants anything to do with us.\n\nIt would be naive to expect help. States do not have friends - only interests. And in many cases, their interest would simply be to watch Poland continue burning. Our economy will suffer from this geopolitical reality more than anything else. Therefore, we cannot depend on anyone. Total autarky. Self-sufficiency in every possible field. It can be done. And if anyone can achieve it, it is us. Our industry has already risen from the ashes. Give us a few more years to rebuild, and the very countries that ignore us today will be begging for permission to buy from us.\n\nJust a few years more."
DGR_iron_curtain: "Raising the Iron Curtain"
DGR_iron_curtain_desc: "Whoever claimed that Poland's future lies within a strong Europe must have slept through the last two decades. The only future Poland deserves is one in which it decides its own fate, free from dependence on decaying hegemonic germanic structures such as the European Union. Fortunately, the rot within that project can already be smelled across the Oder, and the rest of the continent is hardly in better shape.\n\nGerman invasions must never happen again. Russian invasions must never happen again. We cannot allow wandering butchers from Ukraine to set foot on Polish soil. No Czech or Slovak will cross the mountains to plunder and murder our people. No Lithuanian or Belarusian will dare stand against us. Fortifications. Border controls. Traps. And eternal vigilance along our frontiers. Only then will society sleep peacefully, while remaining prepared for the simple truth: Enemies are everywhere."
DGR_national_disposition_authority: "National Disposition Authority"
DGR_national_disposition_authority_desc: "The free market is a mockery of the society. It is a vast ocean into which people are thrown - most of whom cannot swim - in the hope that the economy will move forward just because we unleash people's entrepreneurship. Sure, but the one thing we won't unleash is the exploiters from prisons, where we will throw them for preying on people and their property. The economy must be planned - with room for improvisation, of course - but the main goal must be clearly established, and everything must operate according to the existing plan. Otherwise, the state will not function; everyone will do exactly as they please, and absolute chaos will ensue. And the only ones who benefit from that are the hustlers, not ordinary people.\n\nNational Disposition Authority is to serve as the governing body of the state economy. Of course, steering an entire economy is more like steering a massive ship. There isn't much room for maneuvering or sudden changes of course. Let's just hope there are no icebergs waiting for us along the way..."
DGR_economic_maneuver: "Economic Maneuver"
DGR_economic_maneuver_desc: "There's no denying that the economy has been brought to the brink of... collapse. And, of course, as usual, it's all the fault of people who think they are great patrons of economics and know-it-alls, when the only thing they've actually consumed is a summary of Karl Marx's Das Kapital - without understanding a single word of it. And so, they have brought the housing market to a crash, dealt a death blow to agriculture through collectivization, and where factories once stood and were supposed to be rebuilt, there are now only dug-up pits and structural skeletons.\n\nIt will certainly be better if the military sets the course from now on. The economists have already shown what they are capable of - their failure is useful to us in that we can now easily take the wheel and guide the state to a better future. And the fact that we don't entirely know what we're doing? The Chief Pioneer knows. I'll talk to him in a moment, and we'll draw up an economic plan that will turn us into a European powerhouse in just a few years. Mark my words, don't laugh!"
DGR_real_estate_takeover: "Real Estate Army Takeover"
DGR_real_estate_takeover_desc: "Good morning, block residents! As of today, the military has exclusive authority over real estate management due to the exceptional situation taking place in Poland. We are at war, aren't we? Right, so the military needs to have access to every location, every building, and every basement. During operational activities, all of them constitute an impassable fortress for the enemy, and when they are behind the front lines... our soldiers have to be quartered somewhere. We don't want them sleeping on the cold ground; we want them well-rested so they can fight at their best, right?\n\nRight, so - if anyone joins the military, they will also be entitled to a priority spot on the waiting list for their own council flat. Where will we get them from? Simple - we'll take them from all the landlords and clean up the vacant properties. No, the landlords won't protest. It's hard to shout when you're in prison. I mean, you can, but no one will hear you. So, if you want to secure your families' livelihood - join the army, and in just a few years, you'll be able to relax in your own apartment!"
DGR_reindustrialization_effort: "Reinforce the Reindustrialization Effort"
DGR_reindustrialization_effort_desc: "I hope I've already mentioned how much I despise Balcerowicz and his cohorts of liberals who sold our country out for pennies? And it's total bullshit that the world is changing and we had to move into the service sector. Powerful countries don't abandon their industry entirely just because someone decided it's outdated and we need to respecialize. We became the economic dumping ground of Europe in exchange for poor handouts from EU subsidies.\n\nThe reindustrialization process we are undertaking is the right one; we just have to see it through to the end! For now, we are mostly lacking the political will and quick decision-making to rebuild more factories! That is why we must allocate more funds to this cause because it guarantees our prosperity, and only in this way can we show the rest of the world that the industrial era is still alive and well, and we don't give a rat's ass about your Excel spreadsheets!"
DGR_restitution_of_family_farms: "Restitution of Family Farms"
DGR_restitution_of_family_farms_desc: "Smashing the entire agricultural system with a sledgehammer was bound to end this way, of course. Since ancient times, if you pissed off the peasants, you had trouble. And that's exactly how they tried to introduce forced collectivization, as if they hadn't learned from the mistakes of the last century. But we must forgive the Politburo; after all, they are so backward that they are only at the stage of the October Revolution and think Lenin is about to arrive in Sosnowiec on a Pendolino train. He won't, because it doesn't stop there.\n\nWe must now backpedal on these missteps and, at least for the time being, partially restore private farms, return the land, and let people manage it once again. Otherwise, it would be quite hilarious if a communist government were overthrown by a peasant revolt. I'm almost tempted to see it happen... but oh well. We need to go back to the old model and introduce the new one slowly. Otherwise, we'll all starve to death."
DGR_garrison_cities: "Garrison Cities"
DGR_garrison_cities_desc: "In a state of civil war engulfing the entire country, we should not leave the cities to their own devices. Aside from the fact that they are a breeding ground for reactionaries and liberals, they also constitute massive strategic points where one can defend themselves for months or even years. That is why we cannot afford to lose such cities, and the logistical support they provide is invaluable on a deep front and during various military operations.\n\nSince the military currently holds stewardship over real estate, we must ensure proper quartering for our soldiers and deploy garrisons so that they are present in every major urban center. Just so there are no misunderstandings - this will also increase the safety of the citizens. After all, the military will be living right alongside them in these cities - and there is nothing worse than fighting a man who is fighting for his own home."
DGR_grants_for_military_production: "Grants for the Military Production"
DGR_grants_for_military_production_desc: "We must get the economy back on the right track. And sure, we are developing industry - rebuilding factories, setting up new production plants, expanding raw material mining operations, and strengthening the energy grid. But without the defense industry, all of this will fall through. To win this war, we will need far more plants producing weapons, ammunition, and vehicles. Currently, we have quite a few, but we still need more.\n\nWe will establish an additional fund dedicated to financing the defense industry - streamlining factory management, providing better conditions for workers, and introducing cutting-edge machinery and technology. We cannot pinch pennies here, not even on a single bullet. Because every round means one less enemy of the fatherland. And they are lining up voluntarily, with no sign of running out anytime soon..."
DGR_military_settlement: "Promote the Military Settlement"
DGR_military_settlement_desc: "What are we fighting for? For Poland. For our land. Land... well. There will be plenty of it to hand out once we start dealing with our enemies. During the war, the Germans tempted their soldiers with the offer of Lebensraum in the east, telling them they could settle down in peace once they threw out everyone unworthy of their Germanic race. And during which war, you might ask? Well, it is quite hilarious that this also happened during the one in 2025. They brought hordes of people upon the Warta and Oder rivers, driven by the sick delusion that this is their ancestral home.\n\nBut even putting the Germans aside, there will be plenty of land to develop. That is why it would actually be worth addressing this fact and giving our soldiers the opportunity to take over a few such hectares after the redistribution. Because they obviously deserve it, and veterans must be taken care of. Otherwise, in a few years, we might face an ultra-militant, disgruntled political movement. This way, they will just sit back and cultivate the land, bothering no one and enjoying a well-deserved rest. It's a peaceful life, after a lifetime of war."
DGR_special_commission_for_combating_sabotage: "Special Commission for Combating Economic Sabotage"
DGR_special_commission_for_combating_sabotage_desc: "Economic sabotage is not just about people who show up at a factory and set it on fire. It is also about people who do not perform their jobs properly, or corporate secretaries who do not adhere to the political standards of our state. It is any person who consciously decides they will not fulfill the economic plan, or who ignores requests to put real effort into their work. Anyone who exposes a plant to losses through their ignorance or stupidity is contributing to the sabotage of the state. And whether you stand or whether you lie, you're getting a beating and that is why.\n\nThat is why we are establishing a special commission to combat manifestations of such sabotage, which will have virtually a free hand when it comes to enforcing anti-sabotage discipline among industrial plants. Unannounced inspections, surveillance, stings - whatever achieves the goal. And the goal is professional and conscientious work, with no room for mediocrity and greed; we are all working for the common good. We will station several special commissioners with operational capabilities in every industrial center. This way, we will very quickly spread a sense of discipline among all the slackers."
DGR_5_year_plan_2: "8th Five-Year Plan"
DGR_5_year_plan_2_desc: "Economic plans may be cool in theory, but they're mostly a pain in the ass. Instead of chaotic investments in whatever the global economy throws at us and all those theories about supply and demand, we're executing our own chaos, just under the cover of a perfectly crafted scheme. The capitalists are laughing at us now, because, of course, you can't really decide in which year to build which sectors of the economy. Well, I say you can, but what do I know - we already did it. And I still don't fucking care about the liberals and their damned economic school. Fuck'em. We know what we did wrong before, and we still know what people need. We will now steer to complete the eight Five-Year Plan in Polish history. The seventh one was less than satisfactory. But that's because of the war. If it wasn't for that - we would be already thriving."
DGR_infrastructure_roads: "Infrastructure Effort: Roads"
DGR_infrastructure_roads_desc: "Roads are the lifeblood of the state. Without them, there is no offensive in the modern world, no logistical support exists, and soldiers will get bogged down in hostile terrain. For decades, we were promised that this time we would definitely build so many roads that we'd be able to drive around in fucking circles forever. Given the number of roundabouts, then yeah, sure, we can drive in circles. Building roundabouts is an act of sabotage against the military - how are we supposed to maneuver heavy equipment through these inventions when the length of a vehicle is half the size of the intersection? No wonder the hacks in the media were laughing when yet another military convoy crashed, since the roads aren't adapted for military traffic! It has to be straight and fast! Patch up all the potholes, rebuild the damage, and drive straight to Berl... I mean, at the enemy!"
DGR_infrastructure_airports: "Infrastructure Effort: Airports"
DGR_infrastructure_airports_desc: "Along with the development of our air forces, we must ensure we have places to land and take off from. Fortunately, Poland is one of those countries where some airports were built for no reason and stood empty, like the one in Radom. There are also plenty of disused airfields that we can expand to serve as fully-fledged airports. Many of them are barely a grass strip where you can hardly gain speed, so these investments will have to be substantial. But it will be worth it when the air forces tip the scales of victory in our favor and the skies become ours! And civil flights? Well... unnecessary for now. Where would you even want to fly, huh? Flee abroad? Fat chance. As long as we are fighting, no civilian passenger plane is going to be trafficking people out of our country."
DGR_infrastructure_railways: "Infrastructure Effort: Railways"
DGR_infrastructure_railways_desc: "It might be a bit outdated in the age of airplanes, but it still has potential - the state railways. Unfortunately, we are not Japan or France to have super-fast trains that transport people and materials from one end of the country to the other in the blink of an eye. But... who said we can't be like that? Why? Because a Pole is somehow worse? The Pendolino was a botched investment that never fit our reality - it's like driving a Ferrari to a church that's 500 meters away. Absolute idiocy. That is why we must first expand our rail infrastructure so that we can later deploy our own super-fast trains on it. Manufactured here, of course. And for now, focused on freight transport, as they will be an excellent addition to our logistics. We'll worry about passenger transport later."
DGR_infrastructure_naval_ports: "Infrastructure Effort: Naval Ports"
DGR_infrastructure_naval_ports_desc: "To be honest, I am terribly skeptical about the very idea of investing in the navy, but well, the milk is already spilled. Of course, we can live under the delusion that it is necessary, but seriously - who cares about a fleet? No one uses it, and it's just a whim for people with too much time and money on their hands. But since we are actually building warships, let's do it right. River ports should be expanded to station such units. Plus, maybe we can revive something resembling river trade. It won't be fast, and it will be a massive target, but... no, no, I don't have a fucking argument for it. At best, it can serve as a goddamn distraction for the enemy because we'll send a shipment of soap down there. I don't fucking know."
DGR_state_maternity_facilities: "State Maternity Facilities"
DGR_state_maternity_facilities_desc: "Modern late-capitalist society has devolved into an incessant state of gender warfare between out-of-touch feminists and various masculinity warriors who have listened to way too many crypto-gays of Andrew Tate's ilk. The whole thing is so fucking exhausting... but fortunately, during a civil war, you don't have to worry about such bullshit. What we do have to worry about, however, is the birth rate. The statistics are relentless, and subsidies, fees, pleas, or threats do not help. Each of us, as a citizen, has certain duties to the state that provides us with care. Women, by virtue of biology, will have different duties than men. The main one, of course, is motherhood. For a selected group of women, we will establish facilities where they will feel at home from conception to birth, and we will provide them with the best care they can possibly imagine. In this way, we will secure the future of the generations that will inherit this country. Because they must be good generations - after all, we cannot hand over the reins to losers..."
DGR_genome_alignment_lab: "Genome Alignment Laboratory"
DGR_genome_alignment_lab_desc: "Technology brings many threats, but sometimes it also brings hope. Humans are biological machines programmed by nature in a certain specific way. So why don't we just change the code? Much is said about genetic diseases, but when they can be eliminated with one simple change in the genetic code, wouldn't it be worth investing in? And what if we can simply create a baseline that allows us to ensure that newborn children are no longer exposed to serious and chronic diseases? And what if we can use this to enhance an individual? I don't want to venture into eugenics here, and of course, I am getting ahead of myself and oversimplifying the whole process... but... that doesn't change the fact that we must establish a laboratory that will dedicate all its efforts to decoding our genetic potential. For our own good."
DGR_national_science_department: "National Science Department"
DGR_national_science_department_desc: "Scientists are necessary for any state's long-term development and thus require extensive state funding. It's a simple fact. The intellectuals very much like it when someone points that out. They don't like the equally simple conclusion that comes from it: One who pays is the one who demands. In the eggheads' ideal world, they'd like to bleed the R&D budget dry, while free to pursue the studies that interest only them and their colleagues. Not gonna happen. They will receive funding only after proving their research project is worthwhile from the perspective of the state. And of course, their efforts will be monitored constantly."
DGR_secret_nuclear_facilities: "Secret Nuclear Facilities"
DGR_secret_nuclear_facilities_desc: "Secret Nuclear Facilities was once a funny codename for one of the technical high schools in Dąbrowa Górnicza - the Technical Science Schools (pl. TZN - Tajne Zakłady Nuklearne/Techniczne Zakłady Naukowe). In Polish, the acronyms sound funny like that. Outsiders won't really get it. Whatever - we've already set up our command center there anyway, our own hexagonal Pentagon. And yes, I am aware of the irony. Nonetheless, we need proper facilities where we can conduct research that... as the name suggests, will be secret. There is nothing more secret than an underground bunker. And the headquarters building, where the school used to be, has exactly that - an underground level. If we connect it with the public hall next door... we could have a truly extensive network of subterranean labs to test various interesting technological options. Which ones? None of your fucking business, so stop poking your nose into it. They are secret for a reason."
DGR_incorporate_faculty_of_nature_science: "Incorporate Faculty of Natural Sciences"
DGR_incorporate_faculty_of_nature_science_desc: "The branch of Silesian University in Sosnowiec. Need I say more? For decades, the University from Katowice has been developing a facility for the benefit of the field of natural science. But why should anything Silesian have anything to do with a Zagłębian city? It's time to rectify that mistake by separating the famous 'Razor' to help Zagłębie stand on its own when it comes to science. Of course, a single faculty won't be able to stand on its own, so it will be integrated into the Zagłębian infrastructure we're developing. And besides, such restructurization will allow us to take a closer look at its cadres and organization."
DGR_home_of_revolution: "Home of the Revolution"
DGR_home_of_revolution_desc: "Dąbrowa. The Polish homeland of revolutionaries and the socialist movement in this part of the country. This is where the workers' movement and revolutionary thought were forged. We fought for freedom during the January Uprising, then again at the end of the First World War and throughout the Second. And when peace finally came, it gave birth to different kinds of revolutions - which is why we now possess the largest industrial complexes in the country. The sheer number of communist monuments scattered throughout the city has always exceeded all reasonable standards.\n\nAnd now, from Dąbrowa, comes the spark that will reshape this country in our image and likeness. Once again, we are the heralds of revolution."
DGR_zaglebie_only_city: "Zagłębie's Only City"
DGR_zaglebie_only_city_desc: "What kind of Zagłębie is it? Dąbrowskie, obviously. So really, what use do we have for Sosnowiec? Or Będzin? Dąbrowa deserves the title of the largest city in Poland. Besides, we weren't born yesterday. Our reach once extended farther east and west. Zagórze, Ksawera, Sławków - all of these were once territories belonging to Dąbrowa Górnicza.\n\nBut that phase of consolidation is already behind us. The Silesians were desperate to build their own metropolis, yet at every turn they denied us equal representation, tossing us scraps like merely including Zagłębie in the official name. We don't need their charity. We'll build our own metropolis - without the hanys bastards and without the Silesian mess."
DGR_urbanization_tricity: "Urbanization Effort: Tricity"
DGR_urbanization_tricity_desc: "The famous Dąbrowa Tricity - Łosień, Łęka, and (Ł)Okradzionów. Though the names alone make it obvious these places aren't exactly highly developed. Mostly rural land, dense forests, open fields. And honestly? That's not even a criticism. Quite the opposite. There's plenty of room for entirely new housing districts. People from the provinces could use a little street smarts and some urban attitude. Besides, our apartment blocks are fucking glorious. And eventually we need to reduce the percentage of \"village Dąbrowa\", because with great territory comes great responsibility to develop it properly."
DGR_urbanization_strzemieszyce: "Urbanization Effort: Strzemieszyce"
DGR_urbanization_strzemieszyce_desc: "Strzemieszyce is admittedly a rather ungrateful district, one that tried several times to pretend it deserved independence as a separate town. History demonstrated quite clearly that it simply did not. Unlike the outer districts of Dąbrowa, Strzemieszyce at least has a few apartment blocks. Well, \"a few\" might be generous. It's more like a handful of miserable prefab buildings scattered around. But at least they started somewhere. The main eastern transportation artery also passes through the district, which practically begs for large-scale residential expansion. And there's still plenty of room, although in some places we'll have to drain marshland first. But that never stopped anyone from building communist housing estates before, did it?"
DGR_urbanization_ujejsce: "Urbanization Effort: Antoniów & Ujejsce"
DGR_urbanization_ujejsce_desc: "Antoniów, Ujejsce, Trzebiesławice - the farther north you go in Dąbrowa, the more it turns into the middle of nowhere. Just like Poland in general: civilization and industry in the south, swamps and bullshit in the north. Antoniów is technically part of Ząbkowice, but after the bandits turned Ząbkowice into one massive squat, the district became nearly uninhabitable. We need to separate Antoniów administratively, incorporate the Young Steelworkers District into it, and expand it. And after that - we keep building northward.\n\nBecause one day, some massive investment project may emerge in that region, and it will need thriving residential centers nearby to support it. And hopefully, while we're at it, we'll manage to cover up some of that poverty."
DGR_expand_pkz: "Expand Zagłębie's Palace of Culture"
DGR_expand_pkz_desc: "You might ask why anyone ever thought building a second Palace of Culture in Poland was a good idea. What, the one in Warsaw wasn't enough? Maybe it was - but Aleksander Zawadzki wanted a palace just as impressive in his own hometown. And he got one. It just wasn't quite as tall. For years there were rumors that the reason was because Dąbrowa had been built over mining terrain, and that if they constructed something truly gigantic the entire city would collapse into the ground. Ridiculous. What next - the earth's crust splitting open to swallow us for our sins?\n\nThere's nothing to fear. We should expand it instead. We'll reach the heavens with that tower. And this time God won't punish us for it - because He doesn't exist."
DGR_niegowoniczki_airstrip: "Prepare Niegowoniczki Landing Strip"
DGR_niegowoniczki_airstrip_desc: "The absurdity of Katowice-Pyrzowice Airport exists on multiple levels at once. It's not in Katowice, and it's not even particularly close to Katowice. It's actually closer to Dąbrowa. Besides, why the hell do they even need that airport when they already have a perfectly good location at Muchowiec? It wouldn't be much use to us either, considering how close it lies to the state border, making it even more vulnerable to attack than usual. And that's where the inconspicuous village of Niegowoniczki comes to our rescue. What's special about it? Well, it sits right next to Dąbrowa, just past Łosień. And here's the best part - there's already a tiny airstrip there. Hardly anyone even needs relocating; there are maybe ten houses in total. The perfect place for an airport."
DGR_expand_dw_790: "Expand Voivodeship Road 790"
DGR_expand_dw_790_desc: "Road 790 may run through Niegowoniczki, but calling it \"good\" would be generous. Two lanes, two-way traffic, and to reach the airstrip you still have to drive down dirt roads. You're all familiar with modern airports, right? What surrounds them? Highways. Massive terminals. Huge transportation and logistics hubs. Exactly. And unfortunately, that's going to be the biggest challenge. We need to bring civilization here and expand the area to resemble what already exists around Pyrzowice. Some infrastructure can be relocated, some will have to be built from scratch."
DGR_move_pyrzowice: "Move Pyrzowice Airport"
DGR_move_pyrzowice_desc: "I honestly don't know what's harder - the physical relocation of the terminal itself (or rather rebuilding it using as many reusable parts as possible), or all the damned paperwork surrounding it. Yeah, we moved the airport. What are you going to do about it? The fact that the world still uses maps showing Katowice-Pyrzowice Airport in its old location is hardly our concern. It's not like anyone's flying in from abroad right now anyway. Yet. After the war, we can worry about bureaucrats and permit applications - we don't have time for that nonsense now. Dąbrowa Airport exists. That's what should concern people. Not whether the airport they're flying to technically still exists in the same spot. Worst case scenario, you pull up and keep flying a little farther. Hardly the end of the world."
DGR_restore_the_land: "Restore the Land Around Former Airport"
DGR_restore_the_land_desc: "The land surrounding the airport... once belonged to my family. My grandmother's parents on my father's side owned large stretches of it. Everyone lived well there - until the Germans arrived and built an auxiliary Luftwaffe airfield in 1940. Naturally, the local population was expelled. But when the war ended and people tried to return... the Soviets drove them out a second time. After all, why waste a perfectly usable airfield? And after the Soviets came the Polish Army, turning it into a military airport. Now, after nearly a hundred years, we are finally correcting that historical mistake. At last... the ancestral land returns to the hands of the people.\n\nI might have to build myself a house there."
DGR_pogoria_naval_commissariat: "Pogoria Naval Commissariat"
DGR_pogoria_naval_commissariat_desc: "To be fair, we do have some experience with sailing. Pogoria may not be an ideal location for a naval headquarters - you're not exactly getting large ships in there - but it could serve perfectly well as an officer training center for the navy. We can teach navigation, sailing, and naval basics there. It won't be perfect, but as a training ground for cadres taking their first steps into naval service, it's ideal. No point throwing them straight into the deep end. Because while we do have lakes, and we enjoy sailing them, we are not a maritime nation. We don't greet each other with \"Ahoy\". So we'll start with Pogoria... and end with the Baltic. Just not immediately."
DGR_pieklo_heaven: "Tourist Heaven in Piekło"
DGR_pieklo_heaven_desc: "Piekło - which literally means \"Hell\" - is, as the name suggests, the perfect place for relaxation. And that's not even ironic. The settlement of Piekło lies on a narrow strip of land between the two most popular reservoirs in Zagłębie: Pogoria III and Pogoria IV. There are already beaches there, yacht clubs, restaurants, rental cottages. But do you know what it lacks? Scale. Huge people's resorts like the ones in Bulgaria's Golden Sands. But not those privatized monstrosities built by hotel tycoons - no, true municipal achievements of socialist realism. Peace and quiet, water everywhere, forests nearby, close to the city... and if you turn around, you can even see the Katowice Steelworks in the distance."
DGR_gierek_university: "Edward Gierek's University"
DGR_gierek_university_desc: "Since we're naming everything after Gierek anyway, we might as well get rid of that grotesque capitalist mutation known as the Higher School of Business. The name alone reeks of reactionary bourgeois thinking. Business. Because that's all you people care about - money and profit. A university should be a place of inspiration, of exchanging ideas, of spreading ideals. Dąbrowa needs a true people's university. One where students are not taught by pseudo-professors trying to force Balcerowicz-style heresies onto the youth, but by people who show them how a state can function when led by someone with an actual plan - where things are not abandoned to be devoured by market chaos, but shaped with determination until even the forces of nature bend to human will.\n\nThat is the socialist imperative. And that is what we must teach."
DGR_great_wall_of_brynica: "Great Wall of Brynica"
DGR_great_wall_of_brynica_desc: "We need to build a wall. And we'll make Silesia pay for it. But jokes aside - we're actually going to do it. The Brynica River has always been the barrier separating the people's civilization of Zagłębie from the dark hordes of Silesians. The biggest problem, of course, is that from the upper floors of Sosnowiec apartment blocks you can still see Katowice. And it's simply not true that the best thing that can happen to you in Sosnowiec is a bus to Katowice. The best thing is never having to go there in the first place, because life is better here. And it cannot work the other way around - we cannot allow a single Silesian in here. Their time will come, and we'll show them who truly rules this country. But for now, in the event of a treacherous attack on the heart of Zagłębie, we must be fortified and ready to repel them. Because then they'd already be far too close to Dąbrowa."
DGR_people_medical_centre: "People's Medical Center"
DGR_people_medical_centre_desc: "Healthcare in Dąbrowa has always had a terrible reputation. Clinics scared people away with rude staff and a total lack of anesthesia, the ER was nicknamed \"the dying room\", the main hospital was perpetually underfunded, and the facility at the steelworks felt like a time capsule from the 1950s. Things were slightly better in neighboring Sosnowiec, but honestly - it still wasn't good enough. That has to change, even if we have to throw every doctor out and hire entirely new ones. The Regional Hospital on the Sosnowiec-Będzin border is already an impressive building, and that's exactly where we should pour every possible resource, so that at least one hospital becomes something we can genuinely be proud of."
DGR_our_own_pentagon: "Our Own Pentagon"
DGR_our_own_pentagon_desc: "Our army urgently needs a real command center. A proper Pentagon. A place where the general staff can meet without the risk of the Committee for Measuring Frying Pan Diameter holding deliberations in the next room. Honestly, that's the main reason - to get as far away from the Politburo as possible. Though... maybe we don't actually have to go that far. Since we want our own Pentagon, it just so happens there's already a building that looks remarkably similar to one. And it's right next to the main government district: the Technical Schools Complex. The students can be transferred to another vocational school, the building itself can be expanded and fortified, and there you have it - a headquarters.\n\nAnd yes, for fuck's sake, I know it's technically a hexagon. It's called an analogy."
DGR_remove_bien_forest: "Remove Bień Forest"
DGR_remove_bien_forest_desc: "The problem with industrial development is that it always needs more space. And while we usually have plenty of it, our current plans are becoming a little... uncomfortably cramped. Between Tucznawa and the Katowice Steelworks - where we're planning further expansion - sits the Bień Forest.\nEnvironmentalists will scream, someone will chain themselves to a tree, there'll be some crying, and then we'll haul them away. We'll get plenty of firewood out of it, and free up valuable land. Because we're not seriously going to get sentimental over one forest, are we? Wild boars already wander between apartment blocks - they clearly don't need forests for that. And besides, there are still forests outside the city. Go there if you want nature. Don't expect wilderness in the middle of a civilized industrial center."
DGR_expand_tucznawa_zone: "Expand Tucznawa Zone"
DGR_expand_tucznawa_zone_desc: "Now that we've removed the biggest obstacle - space constraints - we can finally expand the industrial zone in Tucznawa. And some people will say it's already been inflated to the absolute limit by us. To which I say: there are still loyal entrepreneurs eager to expand the productive capacity of the working people. They keep coming to us, asking for permission to open new facilities. And we will allow it. Because we can - and because we should take care of the working class, shouldn't we? So then, back to work - let's build a few more factories."
DGR_expand_przyjazn_coke_plant: "Expand Przyjaźń Coke Plant"
DGR_expand_przyjazn_coke_plant_desc: "That name still doesn't sit right with me after all these years. But we'll leave it as it is, because people won't realize what's actually standing there. The Politburo keeps interpreting it as \"friendship\" between the working class and the peasantry, Poland and the Soviet Union, or for all I know, between men and women. None of that matters. What matters is that now that we've renovated it, we should turn it into the largest coke plant in Poland. Because up until now, it was only second place. And that is unacceptable. If the steelworks is the biggest, then the coke plant has to be the biggest too!\n\nAnd stop calling it the \"coccoa plant\", for fuck's sake. This is a serious industrial facility."
DGR_industrial_triangle: "Tucznawa-Tworzeń-Strzemieszyce Industrial Triangle"
DGR_industrial_triangle_desc: "A massive portion of Dąbrowa is already covered with industrial terrain. And we've filled even more of it with newly built factories. So much so that in some places, the industrial districts have begun to merge into one another. Let's finish the job and build over the remaining triangle of land completely, and we'll create an enormous super-district producing such quantities of goods for the people that we'll practically achieve autarky. And for once, let's build a proper road through there instead of that pathetic two-lane excuse for infrastructure. Nobody's going to live there anymore anyway, so we might as well connect the entire industrial zone properly."
DGR_industrial_powerhouse: "Industrial Powerhouse"
DGR_industrial_powerhouse_desc: "The entire state is becoming an industrial powerhouse, but that doesn't mean Dąbrowa should step aside in this race. Quite the opposite - we must show everyone how it's done. We must become the pioneers of reconstruction, blazing trails where the rest of the people have yet to reach. Do more. Better. Harder. Bigger. Aim higher and farther than anyone else, because no one can stop us when we are driven by an idea and an iron will. There's still a little room left."
DGR_powering_steelworks: "Powering the Steelworks"
DGR_powering_steelworks_desc: "Mass-scale reindustrialization demands energy. And unfortunately, the demand curve keeps rising relentlessly. While we can still draw power from Łagisza and Jaworzno, those connections are risky. If those territories were cut off, the entire industrial zone would grind to a halt. A giant like the Katowice Steelworks must have its own independent power source - for redundancy, and for efficiency. And afterward, if we can manage it, we'll expand that capacity to the entire industrial district. Assuming we still have room left."
DGR_all_railroads_lead_to_slawkow: "All Railroads Lead to Sławków"
DGR_all_railroads_lead_to_slawkow_desc: "As much as I despise those rebel scum, I have to admit that Sławków possesses a tremendous advantage in the form of its gigantic freight terminal. It's impossible not to look at it with admiration. Of course, they called it the \"Euroterminal\", but that name hardly suits something meant to become the logistical crown jewel of the region. We'll work on that later. But the thing about the terminal is this: while every railway already leads there, we can still improve things on other fronts to make the entire complex even more efficient. Because what if we made the damn thing even bigger?"
DGR_strzemieszyce_fuel_base: "14th Fuel Base in Strzemieszyce"
DGR_strzemieszyce_fuel_base_desc: "This fuel depot already exists, but ever since the days of the neighborhood wars it's been operating at half-capacity at best. Later it served as a logistical support hub, but it was never used as effectively as it could have been. And there's always a simple solution to that. We need to expand it by at least double. Bigger means better, and the more fuel we have, the more supply capabilities we gain. Everyone knows that industrial progress and development bring more vehicles - and every one of them needs fuel. Not to mention our army. Oh, powering all the new toys is going to take quite a lot of pumping."
DGR_boleslaw_industry: "Expand Bolesław Mining and Metallurgical Plants"
DGR_boleslaw_industry_desc: "Once upon a time, Poland was incredibly diverse in terms of resource extraction. Coal, oil, gas, zinc, aluminum, iron, copper, salt, amber, silver, gold, uranium. And all of it vanished with time, like tears in rain. What remains are scraps.\nIn Bolesław, we still have the Mining and Metallurgical Works producing zinc - the only zinc-producing plant in all of Poland. And when something is the only one of its kind in Poland, you protect it like a treasure.\n\nOne day we'll return to those times. But for now, let's at least take the first step and preserve our Polish zinc. And the works themselves will provide us with plenty of benefits in machinery production, both civilian and military."
DGR_national_mechatronics_plant: "National Mechatronics Plants"
DGR_national_mechatronics_plant_desc: "Having industry is one thing. Having industry capable of meeting the demands of the modern world is another. Factories producing robots, integrated circuits, or parts for massive autonomous machines - that's the future. The problem is that this makes for a great slogan at a political rally, but not an actual roadmap for what's to come. Modern technology is so complex that you either need countless production lines, or a network of plants each specializing in one thing.\n\nAnd we will need both if we want to make up for all the lost time we could have spent on progress and research. But it will pay off in the future. Because the future is already just around the corner."
DGR_the_only_dabrowa: "The Only Dąbrowa That Matters"
DGR_the_only_dabrowa_desc: "There are many Dąbrowas in Poland. Dąbrowa Tarnowska, Dąbrowa Zielona, Dąbrowa Białostocka, and literally hundreds of ordinary little Dąbrowas and Dąbrówkas scattered around as villages.\n\nBut only one is as magnificent as ours. Only one has citizens willing to strive toward the highest goals. Only one is clearly superior to all the others. From this day forward, when people say \"Dąbrowa\", \"Górnicza\" will be implied automatically - just as the citizens of Dąbrowa have always done.\n\nIn time, we will simply become the Dąbrowa. And everyone will forget all the others. Or maybe we'll just force them to change their names and outlaw all the other Dąbrowas instead?"
DGR_central_supercomputer: "Central Supercomputer 'Xenon'"
DGR_central_supercomputer_desc: "The leader needs a robust and unflinching obedience. He needs to aggregate a tsunami of data to properly organize the economy, military, and science. What better way to achieve that than by using the supercomputer, in which copper wires dominate over neurons and nerves? Well, to be honest, neurons and nerves are much more available, but that shouldn't stop us. It's true that we don't have the know-how, material, or plan, but each great project can be reduced to smaller components. Recognizing that truth, we will connect as many less advanced computers as possible to construct a single machine with enough computing power to store an artificial superintelligence."
DGR_atomic_heart: "Atomic Heart"
DGR_atomic_heart_desc: "It took decades of planning, countless hours of consultation with the locals and myriad of boards in councils that drenched the budget to finally... have one small research reactor in Otwock. The stalling in this matter is fucking humiliating.\nPoland was once on the right track of harnessing the power of the atom, but alas, the Eastern Bloc collapsed, and the newly established regime, constrained by the capitalist ideology of profit and realities of bourgeois democracy, proved unable to finish what we started. Now that the patriots are once again in control, free from the restrictions of the previous system, we can pick things up where we left off."
DGR_contacts_in_the_east: "Contacts in the East"
DGR_contacts_in_the_east_desc: "A task as great as the construction of a large-scale nuclear reactor can be undertaken alone. We need the help of powerful countries that look favorably on our cause and are willing to send us their know-how, materials, and funds. As the West and its rotten elites are unwilling to help build welfare, we are forced to turn our heads eastwards, trying to fit into the game between hemispheres. Our plan is to reach out to the elites who sympathise with communist cause and help us reintroduce the socialist technical thought of the past and synthesize it with innovative practices of today to help us build a prosperous, nuclear-powered future."
DGR_send_szwej_to_moscow: "Send Szwej to Moscow"
DGR_send_szwej_to_moscow_desc: "It's been a long time since Poland and Russia were embraced in the 'brotherly embrace'. Few people believed it then, even fewer believe it now. The memory of the red past is still alive in Moscow though and Szwej still has some contacts that could lobby for us in Kremlin... if said contacts haven't ended up in nursing homes that is. Those that still hold some power within the state apparatus are usually far away from the highest echelons of power, but their voice still have a lot of weight in the Russian deep state. We hope that the great Russian nation that once elevated the Eastern Europe to Atomic Era, will once again pick up their historical mission. It's a long shot as the Navalny's government tries to break the ties with communist past, but it's our best chance to realise our ambitions."
DGR_chinese_business: "Chinese Business Ventures"
DGR_chinese_business_desc: "Let's be honest: It's been a long time, since Russia's been playing the first fiddle, when it comes to the eastern hemisphere. Right now we need a new power that can be convinced by the communist spectacle of ours - China. Trying to convince their leader should be a lot more straightforward, once we praise them for their championship of workers' cause and assure them on our anti-Western outlook. A promise of establishing a regional office of Confucius Institute would also help. Of course the diplomatic effort to Far East would require of us more than just a 0,7 Liter of vodka and a reminiscent talk about old times. We'll need a qualified diplomat, well-versed in speaking Chinese, prestigious delegation and at least 2 Liters of vodka!"
DGR_uranium_corridors: "Uranium Smuggling Corridors"
DGR_uranium_corridors_desc: "They should've brought 4 liters... The Chinamen agreed to supply us with resources, but instead of establishing a new Silk Road, they offered us a Silk Tunnel. Citing troubles with transportation and 'peculiar international position of the Soviet Republic', they claimed their country was unable to officially supply us either by land or by sea. Instead, they offered us help with a smuggling operation through Russian lands. Not an ideal solution, that nevertheless has its perks. Since we already have to rely on smuggling uranium, we may as well expand our operation and gather other resources on the fly. Nothing as spectacular as the Uranium, but every old piece of weapons and chemical ingredients for explosives will also be a great addition to our convoys."
DGR_purchase_rbmk: "Purchase RBMK Reactor Plans"
DGR_purchase_rbmk_desc: "You know how the joke goes:\n'Is it true that they give away top-notch nuclear reactor plans in Moscow?!'\n'It's true, but not in Moscow, but in a dacha near Yekaterinburg. They don't give them away, but demand an unequal trade treaty. And those aren't top-notch reactors, but those responsible for the Chernobyl disaster.'\nWell, here we are. The higher-ups repeat Russian marketing that, under proper maintenance and supervision, the RBMK reactor should work adequately and safely. Yeah, right. Just as I thought Szwej could achieve something, he returns with this kind of shit. Oh, well, let's profit from the nuclear energy while it lasts. As for me, I'll stay as far away from this reactor as possible."
DGR_ground_stabilisation: "Ground Stabilisation"
DGR_ground_stabilisation_desc: "Now for the mundane part. The terrain near Dąbrowian Ząbkowice had been chosen as the ideal place for the nuclear power plant. Before the Fall, the areas around Dąbrowa Górnicza were pitched as one of the potential locations for a small modular BWRX-300 reactor. But of course, we don't do small, but that creates some additional difficulties caused by the sandy terrain in the area. Even Szwej doesn't want to build his house on literal sand, so he ordered to have the local forests cut down and the sandy grounds stabilized. So there's that. I still don't know why build a plant in a place where you need to fill the ground with steel beams and cover it with cement instead of... anywhere else."
DGR_special_guards_unit: "1st Special Guards Unit"
DGR_special_guards_unit_desc: "Despite everything bad with the current regime, the facts are that we need this reactor, and it's good that it is being built despite all the mishaps. It's also easy to predict that once it's raised, it will become a primary target for our enemies both inside and outside our borders. If so, it has to be under constant guard by our most elite soldiers. A whole ne battalion stationing nearby will be needed to secure the perimeter. Our best people have the honor of protecting what would hopefully become the robust beating heart of our electric grid."
DGR_pogoria_5: "Create Pogoria V"
DGR_pogoria_5_desc: "Already, the problems arise. It is known that nuclear-based power plants, just like their coal-based equivalents, need water to function. It would be best to have a river (bigger than Trzebyczka) or a water storage reservoir nearby. As it turns out, the Pogoria reservoirs are a bit too far. Changing the location of the power plant at this point would be problematic, and it wouldn't do us much good; The terrain around Pogorias is even more inhospitable as the reservoirs were created when they filled the old sand mines with water. At this point, it'd be better to dig and create one more Pogoria reservoir to supplant our future plant. Even if we don't have conviniently placed obsolete mines nearby to pour water into."
DGR_advanced_staff_training: "Advanced Staff Training"
DGR_advanced_staff_training_desc: "Does anyone know how this thing will operate? I thought so. We have some theoretical physicists, but we lack practitioners to operate the future plant and instruct new engineers on how to deal with the nuclear power plant. Even if there are enough Polish specialists, they're scattered around the country. We will once again need the help of the Russians. It's only a temporary measure before we achieve a steady influx of home-grown specialists. Let's just hope by this time the Russkies won't mess things up too badly by the time the training's done."
DGR_zabkowice_nuclear_plant: "Ząbkowice Nuclear Power Plant"
DGR_zabkowice_nuclear_plant_desc: "It works? It works! I may have been too harsh on this whole effort. The unsuitable terrain, the alcohol-stained Russian plans, the lacking cadre fed my scepticism, but here I stand admiring the finalization of the construction efforts. I can say many bad things about the communists, no matter what coat of paint they were, but they've once again proven they can, if they want, build the infrastructure necessary for the strategic longevity of the state. Let's hope that Poland, no matter the administration, will prosper thanks to the affordable energy the Ząbkowice Nuclear Power Plant provides."
DGR_military_moloch: "Military Moloch"
DGR_military_moloch_desc: "As the saying goes - bigger is better. In this case, it's not just about quantity, but also about quality. Because we are talking about something that forms the very backbone of this country, without which it would cease to exist and would collapse in on itself like a house of cards. The National People's Army permeates every aspect of political and private life. It is us - all the citizens who form the vanguard against all kinds of enemies. We must constantly expand our army, as continuous and natural growth demands it of us; this is not the artificial pumping up of a straw military, but the organic development of institutions that go hand in hand with the armed forces. We need more vehicles, more soldiers, more weapons, and more ammunition. And along with that, a greater level of professionalism. This will require massive expenditures, but we must do it. Otherwise, we will turn to dust, trampled by others on their path to greatness."
DGR_national_army_fund: "National Army Fund"
DGR_national_army_fund_desc: "Everything costs money - that is, unfortunately, a truth as old as civilization itself, and even communist ideologies have been unable to challenge this ancient axiom. Armaments, in particular, will cost us - because a man can be bought with promises and pleas, but you cannot beg for a tank or an airplane. Establishing a national military fund is just the beginning; ensuring that this fund has the means to accumulate money is another matter entirely. We will have to look in many places, and on more than one occasion, we will likely be forced to cut funding in other, less vital sectors. Because right now - right now, every single one of us is part of the war effort. We are marching toward unification, and the only way we can get there is together, free of deserters and saboteurs. So, we all chip in for the military, because only they can secure our future."
DGR_higher_mandatory_taxation: "Higher Mandatory Taxation"
DGR_higher_mandatory_taxation_desc: "Like it or not - a state of emergency demands exceptional sacrifices, including financial ones. We need a greater amount of money that we can allocate to defense spending, and the best option is for society to foot the bill for all this equipment. Raising taxes is a risky move in this country, but we have no other choice. If we tighten our belts tight enough, we can be sure it will pay off, and every złoty spent on the armed forces is an investment by the citizens - not only in their own safety, but also in a future they won't even have if someone else takes over this country. So, stop whining; we must understand that this is for our collective good. And if anyone complains too loudly, well... you know what to do with them."
DGR_fire_and_fury: "Unleashing Fire and Fury"
DGR_fire_and_fury_desc: "Fire, fucking fury, and destruction! The carnage we will bring upon our enemies will be downright biblical. And I only mean that comparison as a source of imagery; I am no religious fool. What I do believe in is steel and lead - something our soldiers hand out left and right to all infidels and heretics of our cause. But sometimes, you just have to try harder and use a bigger gun. And if that doesn't work - keep increasing the caliber until the job is done and the enemy is eliminated. We have experience with elements of mechanized warfare and armored tactics - this will pay off when we start mass-producing all kinds of war machines. Every single battalion will be able to get their hands on these beauties, not just elite units. What follows will be the most beautiful display of destruction this country has ever seen. And unfortunately, it has seen a lot."
DGR_viper_program: "Viper Program"
DGR_viper_program_desc: "Innocent-looking armored cars can provide massive support for regular soldiers on the battlefield. Besides the ability to move fast even over rough terrain and their scouting potential - we're also packing them with quite a substantial amount of firepower. Mind you, such a car probably won't survive an encounter with a rocket launcher, but the armor does extend the crew's average lifespan, at least by a few minutes. Unfortunately, working off the blueprints of old Soviet junk, we can't really mess around with variations of the ideal modern armored car. Therefore, we will have to design something original of our own. Luckily, we have the right industrial plants for that."
DGR_bewup_eternal: "Eternal Spirit of BWP-1"
DGR_bewup_eternal_desc: "While 966 was the year that created and defined Poland, it seems 1966 was the year that created and defined its modern military. That was the year the first BMP-1, known in Poland as BWP-1, saw the light of day, and progress in the Polish military has stopped ever since. We were this close to replacing it with some new models, but the communist takeover shattered those dreams for decades to come. Whenever I try to do something about it, I point out that the BWP-1s are obsolete, used only by countries of the Second and Third World. Even some of the old countries of the Eastern Bloc got rid of it. I also try to sell completely new projects with similar names, such as BWP badger, elk, deer, roe, boar, fox, marten, raccoon dog, wolf, or lynx, but all discussions end with the same argument:\n'BWPs are fine. They swim, y'know.'"
DGR_gorillas_and_wolves: "Gorillas and Wolves"
DGR_gorillas_and_wolves_desc: "Wolves, Gorillas, Moose, Chickens, Raccoons. Yeah, right - continuing this fucking menagerie, we have something we can dig up from the secret arms archives. One of the moronic moves by the pre-Fall governments (aside from completely selling out the defense plants) was importing tanks from abroad. German, American, Korean, who-the-fuck-knows-what-else. Not to mention that we usually got them at inflated prices, and on top of that, without a license to service them in Poland - so if a part breaks, go run abroad and beg for spare parts from a junkyard. We had so many of our own good designs that just needed to be put into production; looking at it, you'd think the decision-makers were mentally deficient. So what if they're Soviet-based? It'll drive and shoot like a Polish one!"
DGR_star_constellation: "New Constellation of STAR Trucks"
DGR_star_constellation_desc: "Admittedly, not all the state enterprises that built our military are misinvestments. We have to evaluate each of the companies on a case-by-case basis. Take a look at a STAR factory. Once, it was a pride of our country that supplied our armies and even foreign ones. Now, gathering for the possible war with our neighbours, we need them more than ever. What good will we ever get from civilian buses from MAN that overtook the production lines in Starachowice? True, we still have the Jelcz factory, but that won't be enough. Especially when the Germans will try to enter Silesia once again. We need more factories in the central east. Besides, the Congress Poland still has to show the world, you know."
DGR_kutno_hippos: "Hippos from Kutno"
DGR_kutno_hippos_desc: "Wheeled engineering reconnaissance vehicle. Sounds boring as fuck, doesn't it? Well, luckily that's exactly what the engineers from Kutno thought after building the first prototypes of the Hippopotamus heavy transporter. Not only did they turn it into a highly modifiable platform for various other support vehicles, but they also adapted it perfectly for troop transport. Thanks to this, the Hippopotamus is fit for the front lines in mechanized infantry battalions and as support for regular troops. And now for the best part - THE FUCKING THING SWIMS TOO, JUST LIKE A BWP-1. In fact, that's mainly what it was designed for - as an amphibian. But it turned out to be versatile. Sounds perfect, right? Almost too good to be true? Well, yeah, because exactly zero units were produced before the Fall. It was merely a prototype. But what a prototype! Now that we have access to the blueprints - we must start manufacturing it immediately. Because looking at these sketches, you can't help but fall in love with this magnificent vehicle."
DGR_united_fire_command: "Unified Fire Control Command"
DGR_united_fire_command_desc: "As a classic saying goes - fuck the people who only hit you up when they need your artillery support. But in all seriousness - artillery is a very pleasant toy, but someone has to manage all of it. Otherwise, give the soldiers fifteen minutes on the battlefield and we'll have friendly fire incidents or some random village getting blown to pieces for nothing. We need highly responsible people in fire control positions, along with advanced communication tech and tools that allow for a broad overview of the battlefield. There are military systems out there right now that make the operator feel like they're playing a live-action RTS game. If we get our hands on them, nobody will ever have to fear being within range of friendly artillery again."
DGR_art_strongpoints: "Stationary Artillery Strongpoints"
DGR_art_strongpoints_desc: "Given the experiences from the front line, in some places the only thing you need to put in the enemy's way is a massive fucking gun, dig it in, conceal it - and blast away as much as you can. Right on cue, the high-speed fanatics are going to start whining that you can't do that, that nowadays you have to be mobile, you have to move after every shot, do fucking dodges in the bushes, and preferably do backflips while reloading. And that is total and utter bullshit - the enemy has zero reconnaissance or technology; this is literally shooting fish in a barrel. And if we do run into one that actually has those things - we'll wipe them out with our air force. In any case, a massive stationary gun will win. And it won't waste a single drop of fuel - because the damn thing doesn't need any."
DGR_mobile_fire_platforms: "Advanced Mobile Fire Platforms"
DGR_mobile_fire_platforms_desc: "But just so it doesn't look like all we're going to do is sit and wait, we must make up for our lack of mobility with mobile firing platforms. They will play the same role as a mosquito that flies into your room and can't find the window to get back out. We fly around, make noise, and nip at them whenever and as much as we can. The enemy will focus on trying to catch all these fast-moving little bugs while we can focus on a MASSIVE bombardment or a direct assault. Because warfare isn't about committing to just one single tactic, is it? Because if you do that, some smart-ass on the other side will immediately counter you with something you won't have a counter for, because you'll have pissed away all your money on self-propelled artillery. This way - we'll have everything."
DGR_revitalization_of_rocketry: "Revitalization of Rocketry"
DGR_revitalization_of_rocketry_desc: "The rocket forces during the PRL era... you have to admit, they were damn impressive. And that is yet another stain in a whole constellation of humiliations in the history of the Polish Armed Forces of the Third Republic. Because from a state that possessed rockets capable of even carrying nuclear warheads, we were left with... absolutely nothing. In Russia, the rocket forces even constitute a completely separate branch of the military, that's how heavily expanded they are there - and unfortunately, Ukraine found out the hard way that this is a devilishly effective weapon with minimal effort. You aim more or less, you launch, and you light a cigarette while waiting for reconnaissance or the air force to tell you what you hit. The perfect job, aside from the risk that if someone pinpoints your position, the entire enemy army will hunt you down. But put that aside - we must restore the rocket power we used to possess. And let's focus on that. We'll refresh the procedures once we actually build something that can fly and explode, and isn't a Russian passenger plane."
DGR_procedure_11b: "Initiate Procedure 11-B"
DGR_procedure_11b_desc: "Since we already possess something that resembles a rocket and can't be used to fly into space, we can get down to how we should actually use it. Because how are you supposed to conduct valuable and precise rocket fire when the enemy is hiding among the civilian population or has barricaded themselves deep inside major cities? Well, it's a typical tactic of cowards who care nothing for the lives of their citizens and use them as human shields. That might work on humanitarian social-democratoids, who would show up crying that they can't shoot because their conscience won't allow it, but we don't have such weaknesses. Every single location with a confirmed presence of enemy military elements is a legitimate target for a rocket attack. And since we have enemies everywhere... they'd better not hide in hospitals and schools. Because otherwise, they'll smear us as murderers later, rather than the ones who were using shields."
DGR_red_wyrm: "Red Wyrm"
DGR_red_wyrm_desc: "Sometimes having a tank to design is a really tedious job. Why overcomplicate some things? We're really simple soldiers. We don't need much to be happy. But when we do - well, go big - or go home. We solve problems. Not problems like \"What is beauty?\", 'cause that would fall within the purview of your conundrums of philosophy. We solve practical problems. For instance, how are we gonna stop some big mean Mother-warlord from tearing us a structurally superfluous new behind? The answer? Use a tank. And if that doesn't work...\n\nUse bigger tank. Like this super-heavy 300 mm gun-packing big-ol' beastie designed by our engineers. Built by our workers. And you best hope...\n\nIt's not coming at you."
DGR_suspend_non_essentials: "Suspend Non-Essential Public Services"
DGR_suspend_non_essentials_desc: "The truth is, some services are redundant and completely useless, yet we're still paying them fat millions just to operate. For what? The Municipal Guard? Give me a break, they couldn't even catch a mosquito, let alone maintain order in the city. Other non-militarized security forces are basically pointless too when we have the military on the ground, always ready and always close by. Factory security guards? Let them be paid from the industrial funds, not the military ones; they aren't cut out for soldiering anyway. The Railway Protection Guard? Christ, if they were any good, maybe people wouldn't steal so much of our coal from the train cars - the military will be a hundred times more effective at catching smugglers. And so on, bit by bit - until finally, every penny adds up, and we'll have the cash for more military."
DGR_redirecting_housing_funds: "Redirecting Housing Funds for Barracks"
DGR_redirecting_housing_funds_desc: "We own real estate, we have extensive garrisons in the cities, yet we are still wasting money that is useless right now on expanding housing infrastructure and maintaining homes where nobody lives. What for? Those funds would be better spent on garrisons and field barracks, which we have to build constantly because the front line keeps shifting in all directions. One day Sosnowiec is a frontline city, and the next day it's Łódź. And both of these cities will need barracks for our military. No sane person is going to be buying apartments right now anyway, and whatever stands empty, let it stay that way. It won't collapse, and after the war, we can build palaces if we want to. Wait, no... palaces are bourgeois. Ah, fuck it, we have the Palace of Culture after all... whatever, the housing co-ops need to cough up the cash!"
DGR_national_people_land_forces: "National People's Land Forces"
DGR_national_people_land_forces_desc: "As a land power, not constrained by the large rivers or the sea, we will naturally bet on the width, berth and bulk of our ground troops. It matters that we have river-traversing vehicles, but it matters more that we have vehicles to begin with. Overwhelming and implacable in discipline and quantity, our army will never falter. For that, we need extra shifts. Scavenger duties. Everyone who can walk will work until their hands bleed. Then, I don't know, do I look like a doctor? Give em plastic gloves soaked in pure ethanol and have em work some more!"
DGR_people_officer_school: "People's Officers' School"
DGR_people_officer_school_desc: "An army marches on its officer corps, its leadership, its ability to think on its feet, its... ideological robustness. One thing these fat bureaucrats have a point at is that preciesly because our worldview is so close to the two things that are poison to it: The international feel-good cool-Pole socialists and capitalist 'nationalists', we must ensure our officers are free from either error. Seriously. A nation is made up of its people, not of flags or, ugh, capital! That is why our officers must learn to wage war as lightning if need be, with allegiance that's social first, national second."
DGR_nplf_command_structure: "NPLF Command Structure"
DGR_nplf_command_structure_desc: "It's time to set up the command districts within our regime. There must be clear military chain of responsibility and command, with every officer knowing exactly who to answer to and who greenlights their initiatives. Similar methods were employed with mixed results by Soviets and Russians, but when on proper well-planned attack, it is paramount that everyone works as one, not as individuals out for themselves. This is socialism at work, as opposed to capitalist chaos."
DGR_urban_warfare_spec: "Urban Warfare Specialization"
DGR_urban_warfare_spec_desc: "Poland derives its name from fields; after all, a large part of the country is still farmland, forests, and other open spaces where our enemies used to set up their testing grounds for hundreds of years. And that is exactly how Polish military doctrine developed, only recently taking into account such whims as high-rise buildings and urban warfare. Aside from special forces, nobody had any idea how to approach it, so it was easier to just blow such a building to smithereens with artillery - and problem solved. But coming from the outskirts of the country's largest metropolis, we simply must incorporate fighting in built-up areas into our doctrine. Because more than once we will have to face sieges which, if poorly executed, will turn into the Battle of Stalingrad. And we don't have the time, the men, or the nerves for that"
DGR_ideological_imperative: "Ideological Motivation Imperative"
DGR_ideological_imperative_desc: "To make our doctrine work, the soldier must be motivated. Filled with the spirit of socialism and worker's strugg... hahaha, yeah right! I know how our men work, unlike those eunuchs at Politburo. We fight not for money, but for the Nation. Yes, even those who dig themselves into a more regional identity. For your parents, brothers, cousins, sons. Even if they aren't with you: You'll have a family yet. And of course, whether I like it or not, for the Party and the Secretary, who pave the way of the worker's paradise for you et cetera, et cetera. Just for posturing."
DGR_restandarisation_of_firearms: "Restandarization of Firearms"
DGR_restandarisation_of_firearms_desc: "Only capitalist pigs can't appreciate the nostalgia of unloading a PPSH-41 drum magazine. Alas, maintaining a pepesha these days is harder than even fixing one. Hundreds of variants, ammunition types, thousands of parts... no more. The logistical nightmare is over, the dawn breaks, and with it, new standard and new uniformity arises. One service rifle, one cartridge standard, one set of parts that's as universal as possible. This will help us scale up production and maintenence alike."
DGR_every_soldier_tank_destroyer: "Every Soldier a Tank Destroyer"
DGR_every_soldier_tank_destroyer_desc: "Our enemies take many forms, but armored ones are what demands our foremost attention. It's not enough to let our armored vehicles duel: When facing infantry, the enemy must melt as though they face our finest cannons. Every infantryman of ours will have an anti-armor solution to work with. Every infantryman of ours will know exactly how to use it well. Every single infantryman of ours will prove his worth in value of the tanks he brings down. The enemy's armored vehicles will thus be force multipliers no longer: Each will be worth only one of our troopers, and less as we scavenge and repurpose their wrecks."
DGR_black_stormtroopers: "Black Stormtroopers"
DGR_black_stormtroopers_desc: "Flesh is weak. That was obvious since the invention of firearms. And ironically, since inventing it, personal armor started to become obsolete, which, for me, is freaking counterintuitive, but well, what do I know? Now, in the machine age, we are able to create robots that would fight for us. It's not a question of possibility; now it has become a question of morality. But, if you can acquire an edge against your enemies, shouldn't you?\n\nImagine troopers that don't need supplies, don't feel fear, don't sleep, and don't ever have to stop. The pure terror that they would create would be enormous. Best part? We are in full control of their behaviour, so we don't have to worry about some Terminator shit scenario. That would make us pioneers in warfare on a global scale - no one has ever used humanoid robots to wage war! Fuck Asimov, we're going high with this one!"
DGR_national_people_air_forces: "National People's Air Force"
DGR_national_people_air_forces_desc: "Say what you will, if I had to choose between a ground force that does not run out of manpower and vehicles, and an airforce, I pick the latter. Air support is crucial for breakthroughs, ambitious campaigns, protection of home industry... at least until our enemies figure out cruise missiles. We won't let them though. Our planes will blot out the sun, until the red dawn, midday and dusk alike, will be the only sky our enemies behold! And there is a lot of ways to kill our enemy from the air - we're going to fund them all!"
DGR_rapid_response_brigades: "Rapid Response Air Cavalry Brigades"
DGR_rapid_response_brigades_desc: "The concept of air cavalry has always cracked me up because of how obsessed Poles are with the word 'cavalry.' Everything has to be a fucking cavalry unit; goddamn tanks are armored cavalry, helicopter drop units are air cavalry. These guys are seriously still dreaming about just drinking, screwing, and riding horses. But names aside - assault units moving by helicopter, capable of responding to even the smallest shift or breakthrough on a front line hundreds of kilometers away, is something that will completely change the face of our war. A lightning-fast, mass attack carried out by such brigades will break through even the toughest defense, and if we coordinate it well and master the operational chaos - this will be a weapon more effective than any bomb."
DGR_wzl_lightning: "WZL Lightning Program"
DGR_wzl_lightning_desc: "Yes, air assault forces sound good, but, sometimes you need something no less mobile that packs a heavier punch. This is where the Lightning comes in. A new prototype of a combat helicopter, designed for any and all demands of post-Fall warfare, where ingenuity and electronic disturbance work. End result will be a vicious bird of prey, striking as fast as lightning would and will supply our troops with needed morale when they see the entire fucking storm coming their way knowing that this is their support. Just play the Red Alert theme song along the way or Ride of the Valkyries and we're golden."
DGR_strategic_destruction_command: "Strategic Destruction National Command"
DGR_strategic_destruction_command_desc: "We all remember what happened to Dresden after the Allied bombings during World War II, and what dropped on Hiroshima and Nagasaki. Granted, you won't see atomic bombs here just yet, but we are ready to establish the Strategic Destruction National Command. Sounds pretty cringey, maybe that's true - but it will be a highly responsible command that will designate targets for our bombers. Because we aren't just going to blindly bomb civilians - that would be barbaric murder! First, we will pinpoint the military targets located within a given city - and only then will we bomb everything that moves there. Because responsibility is what matters most - and such a command will guarantee it (it will also guarantee we have someone to pin the blame on if something goes wrong)."
DGR_wzl_anvil: "WZL Anvil Program"
DGR_wzl_anvil_desc: "It'd be a shame if our enemies could churn out hardware undisturbed. We need a bomber to thwart them: That's where Anvil comes in. Everything a modern battlefleet requires of a bomber to survive and deliver, the Anvil will boast. Luckily we don't need it to deliver upon the Chinese or American Empire: Our foes within Poland are benchmark enough. This new project will meet the requirements of a modern battlefield where bombers are not only limited to bombing enemy to submission but they are also agile enough to try to take on interceptors and other bombers. Future is now!"
DGR_39_aviation_regiment: "Restore 39th Fighter Aviation Regiment"
DGR_39_aviation_regiment_desc: "Before Pyrzowice Airport became a civilian airport, it had a military history - first the Germans, then the Soviets, and finally the Polish Army used it as a military air base. During the communist era, the 39th Fighter Aviation Regiment operated here. It wasn't anything extraordinary - just another of the many air regiments back in the day. This is more about symbolism; we need military units that reference the heritage of their predecessors. It gives such a unit prestige, and the soldiers want to live up to that prestige by trying to be the best they can be. It's a good solution, and since we can simultaneously develop local air forces and rebuild something that used to exist... well, admittedly not in Pyrzowice but already in Niegowniczki... but still, it's something worth doing."
DGR_wzl_hammer: "WZL Hammer Program"
DGR_wzl_hammer_desc: "Old fighter jets work well enough for now against other local warlords, but the moment we advance into the next technological era, modern jets will make it a bit harder for us to compete while flying around in old Soviet junk. The answer to this is the Hammer. A program to develop modern fighter jets that will be capable of hitting enemy planes so hard that if they don't crash right away, their ears will be ringing until the moment they land. It's an elegant solution, combining all contemporary advancements in the field of avionics."
DGR_mothership_program: "Mothership Program"
DGR_mothership_program_desc: "Imagine a gigantic airplane. Now imagine that on board this airplane, there are smaller planes that can launch into the skies at any moment. An aircraft carrier in the sky - and I don't mean some pipedreams like a flying flight deck straight out of The Avengers, but real, functional solutions that have been developed by many different countries throughout history. Mind you... I don't really know if we actually need this, to be honest, because a war inside a single country like ours means planes don't have to wander far from their bases, given how short the distances are... but maybe it's a project for the future that will allow us to pursue a global policy of strength projection? Who knows, maybe it will be useful for something other than just looking pretty."
DGR_cut_luxury_sector: "Cut the Luxury Civilian Sector"
DGR_cut_luxury_sector_desc: "How many times do I have to remind you that we are in a state of war?! I won't deny that the concept of luxury is fluid and changes with living conditions, but we still must drastically cut production on products that are not essential for survival and are merely the whims of people longing for bourgeois times. You don't need expensive watches, luxury cars, or sophisticated clothes. You'll get by without them, but the military won't get by without more deliveries of heavy equipment! You could even say you'll get by without certain food products too. Goddammit, back in the day people lived on bread and water and they didn't complain! Things will be better after the war, but for now, it's time for a diet, ladies and gentlemen."
DGR_national_people_navy: "National People's Navy"
DGR_national_people_navy_desc: "I hardly have anything to add to this. Navy, HA! Well, as much as I dislike the idea of us wasting valuable resources on floating junk we will at some point be met with a need of maintaining a fleet, so we might as well start our research in that regard now so that we won't get caught off-guard later on. Just don't expect me to throw copious amounts of money bags onto this endevour, there is a lot more that needs my attention than this. Besides, it's a long way to Baltic Sea, and i really don't see us waging a full-scale naval invasions and Battle of Midway reconstructions on god-damn Vistula river. It's going to be a lot of ceremonial titles and empty suits for a long time, but as long as they won't want us to build actual ships we're cool."
DGR_przemsza_program: "Przemsza Program"
DGR_przemsza_program_desc: "I walked by Pogoria IV lake today, watching these waterlobes try out their new experiment. They call it the 'Przemsza Program' - the idea of it is to use preexisting small ships and tinker with them until they stop sinking or exploding and actually become viable light warships. Every single time so far, they're either too overtuned, or too overencumbered, or not maintained well enough, or whatever other reason they're using now to justify the bottom of Pogoria looking like the aftermath of a sea battle without a shot fired. Sucks to be the suckers whose boats they confiscated for testing, but it makes for a nice spectacle whenever you walk by and see another one burst into flames and hear the eggheads cursing from far away. And...the problem is, the boat didn't sink or burn today. That piqued my interest, because if they're succesfull that means we'll be going onto the next step."
DGR_warta_shipyard: "Warta Military Shipyard"
DGR_warta_shipyard_desc: "We're not cool. This is the moment where the plan to build a military dockyard actually takes place. I'll say, I'm glad they didn't try their bright idea on even smaller bodies of water before, though it'd be very comical to see the stupidity of navy enthusiasts on full display like that. Still, the Warta's infrastructure and access to a (semi-decently) big body of water to test our ships upon in the form of lake Jeziorsko is the best we can do before reaching the Baltic Sea itself (and absolutely above Pogoria in...any parameters to be honest), and I suppose that it makes at least a little bit of sense to prep up to it before we get there, even if in my opinion it's still just a waste of money that could go to LITERALLY any other branch we have. But alas, if we're really doing it, then we should just stick to it until the project's end."
DGR_project_716: "Continuation of the Project 716"
DGR_project_716_desc: "716. A project of a transport cutter, created for transporting divisions across bodies of water on a smaller scale. At least on paper, in our case these relics of the olden and rightfully bygone days are just about the perfect fit for freshwater transport we so far require. They are small enough to traverse rivers yet spacious enough to be effective in their task. And it's a commie project, keeping the grey mass happy. What's not to love? Aside from it being a Politburo's project centered around navy... Let's just focus on positives - as much as the navy will be useless, we're going to need transport ships that could be used in launching invasions from one bank of the river to another. Because enemies will likely blow up any bridges on the bigger rivers in the country. And if they fortify the opposing shore, pontoon crossing would be very stupid. Thus, transport ship. At least some good will come out of this."
DGR_first_npn_flotilla: "First NPN Flotilla"
DGR_first_npn_flotilla_desc: "Fuck me. They did it? I've heard today that the naval advancements of ours have allowed us to launch three new Przemsza class ships. Have I really underestimated the navy this much I didn't catch it growing so fast? What the hell!? A surprise to be sure, but a welcome one. It means all these high investments into it weren't fruitless, and now it's just even more power against the remaining rabble of Poland. My intuition was right! Well, we said 'A', time to say 'men'. And we're going to put a lot of men in those bad boys. Let's see just how far we can take this!"
DGR_metalowiec_gunboat: "Metalowiec-class Gunboat"
DGR_metalowiec_gunboat_desc: "The success of Warta shipyards means that we can now double our efforts when it comes to the production of their freshwater fleet. And now that we are reaching larger and larger bodies of water, it doesn't even seem to be that bad of an idea anymore. Still, I think we're overfixating ourselves on what's at best just an addition to Dąbrowa's real power, which lies elsewhere, clearly beyond the naval binoculars' sight. I cannot argue that there is potential in advancing it, though."
DGR_pogoria_monitor: "Pogoria-class Monitor"
DGR_pogoria_monitor_desc: "For all my dislike towards Pogoria and the waterphiles working there, ever since the project's positive turn, I can't, and it pains me a lot, say that their efforts didn't turn out to be successful. Eugh, I thought I'll throw up saying it... Nevertheless, the navy is working on moving to some actual large ships of war now, and they proposed to name the next iteration a 'Pogoria' class. Shameless self-glazing if I ever saw one, but for the fucking miracle of turning a landlocked state from Zagłębie into a naval power I suppose they deserve some..."
DGR_janczyszyn_project: "Janczyszyn Project"
DGR_janczyszyn_project_desc: "The crowning achievement of the utter pointlessness of improving the navy. In Poland, people have always joked about politicians' promises - that if they get desperate enough, they'll even promise an aircraft carrier. And then, during one campaign, they actually were promised. Not just one, but two. Never mind that, but... no - I fucking can't believe we are seriously going down this road. An aircraft carrier? Fucking hell, are we going to name it John Paul II next? And it'll have tiny little yellow planes on deck. You could make a million jokes about this, because that's about all it's good for.\n\nThough... considering that our war is nearing its end and we will soon have to extrapolate our military power on a regional scale - such a symbol of might might not even be the stupidest idea. Provided we can break our navy out of the mentality of fighting warlords whose greatest achievement was a spear on a kayak. So, ladies and gentlemen... I guess we're building an aircraft carrier?"
DGR_redirect_regional_budgets: "Redirect Regional Budgets to Central Command"
DGR_redirect_regional_budgets_desc: "Local governments have always specialized in pissing money away on the most idiotic projects. One guy puts up a bench for several hundred thousand, another puts up a monument of the Pope or some other celebrity for millions of złotys, and then a public toilet for 650,000 złotys that takes four years to build. There are no better gangsters than the people handling municipal tenders. 'Oh, my brother-in-law has a paving company? Cool, let's pave over the entire town square with concrete!' And that's how the little racket keeps spinning.\n\nWe need to put a stop to this. Never again on our watch will such scams be pulled, whether in villages or metropolises. Partly because we have just decided to redirect most of the local government funds to the central defense fund. We will put this money to better use by spending it on something functional, something that will actually help our soldiers rather than line the pockets of nepotistic cronies."
DGR_freeze_civilian_infrastructure: "Freeze Civilian Infrastructure Projects"
DGR_freeze_civilian_infrastructure_desc: "No matter how drastic it may sound - we must partially suspend expansion and operations in certain sectors. Halting civilian infrastructure projects will allow us to redirect funds to the sectors that need the money more right now - to the military. This is an exceptional situation that could cause a lot of discontent, and we might be walking right into a trap here... because it might turn out that where a road was needed, a front line emerges, and our units won't be able to move effectively... but oh well - we have to make sacrifices. At worst, in such cases, we will nationalize everything we can and hand those plots over to the army so strategic reserves can be used to rebuild that infrastructure. But that's only in rare exceptions. Don't you even dare fucking get offended - we have to end this war somehow!"
DGR_liquidate_private_assets: "Liquidate Remaining Private Assets"
DGR_liquidate_private_assets_desc: "Our fight against the privateers has been a massive success in this field; most millionaires no longer possess their wealth, and all assets have been properly redistributed among... the needy. But as we conquer further territories, we keep finding more of the nouveau riche who think we will forget about them. They carry the massive stain of exploiting innocent people on their backs, so how could we possibly overlook them?\n\nWe must redouble our efforts to nationalize all private wealth and redirect it into the military fund. After all, one such privateer could fund his own private army with the money he has. And some of them actually goddamn did that during the Fall. And if something cannot be monetized - strip it down to nothing or sell it for parts; we must utilize everything down to the last penny."
DGR_special_purpose_forces: "Special Purpose Forces"
DGR_special_purpose_forces_desc: "Special Forces have always played an important role in the arsenal of Polish People's Republic, so for them to be brought back with the same symbolism they used to have is something that, for a 'rightful descendant of PRL' is a priority: They were present during every suppression of strikes and riots until the very end and have always protected the Republic from hidden enemies of the state, even after its fall. It would be perfect propaganda fuel and, in practice, a great, even if stinking of communism, template for us to build our own spec-ops program upon, bringing them back so that they can once again serve their masters, even if the management has changed."
DGR_maroon_berets: "Maroon Berets"
DGR_maroon_berets_desc: "The idea of creating paratrooper forces was discussed widely today at the hq and it has been decided to go all in on the investment. While the phrase 'What occurred in your actual fucking brain to submit this idea?'  was what I was originally thinking after the meeting, I decided to give it a shot and, to my surprise, the paratrooper exercises turned out successful. Too successful. If I had known there would be so many volunteers that we'd run out of test planes for them, I'd actually shoot myself for treason and hearsay, not believing myself. Only after this revelation did I find out the stupid benefits they were promised in return for them becoming our guinea pigs. Obviously, these never existed in real life, prompting many to try to leave, but just as many actually stayed. Who knew so many nutjobs were walking around Zagłębie..."
DGR_green_berets: "Green Berets"
DGR_green_berets_desc: "Poland is, in a very large part, forests and wilderness, the likes of which you usually shouldn't be entering unless you're a Girl Scout or a professional ranger, or both. None of the two is at our disposal in large enough numbers, but with our training combined with Dąbrowa's unforgivingly large manpower, we can try to muster up some professional pinecone eaters of our own. At best, we will have ourselves a fresh batch of slav Rambos, ready for even the worst nettles, and at worst, suicide missions exist for a reason. Either way, it's profitable for us, and it's a field we can flex our muscles in when the others are watching."
DGR_blue_berets: "Blue Berets"
DGR_blue_berets_desc: "'Formoza', named after a popular torpedo factory in Gdynia, was a branch of Polish saboteur divers within the navy of the Polish People's Republic. While our reliance on the Navy is slim compared to the other branches of special purpose forces, their expertise and potential for the future so far make up for it. Because of this, recreating this branch, the Marines, and funding them is, according to the highest authority there is (me), the right course of action. With enough support, who knows, maybe the new marine forces will turn out not to be a waste of time after all."
DGR_restore_jwk: "Restore the Commandos Military Unit"
DGR_restore_jwk_desc: "Finally, after who knows how long, the efforts to secure more funds for the spec-ops paid off, and we can now form our commando brigades with everybody involved. From our peak in condition (as always), rangers through effortlessly effective marines to even the sick-in-the-head paratroopers, everyone got their spot. If these imbeciles overseeing the program had listened to me better, we would have naturally been able to do even more than what we can now with the funding increase on a level rivalling that of the monthly salary of a local janitor, and faster. Still, even the slightest chance of acknowledgement of our peak performance in the eyes of the blinded-by-red-star buffoons and other rout standing in our way to unifying the land of Poles is better than what you can usually expect from projects conducted in a chaotic manner, such as this one, that being damn nothing. They can all rest assured - we'll take good care of these banknotes, houses, lands..."
DGR_special_industrial_group: "Special Industrial Group"
DGR_special_industrial_group_desc: "Alright, apparently it needs to be spelled out to them - SPECIAL FORCES AREN'T MEANT TO USE GODDAMN FORKS AND SPEARS. Apparently, the idea of 'SPECIAL FORCES' using something at least slightly more refined than the equipment of a random miner on a strike just cannot cross these fools' minds. As always, it's clear that I always have to oversee everything personally, else that'd be the result. And yet, this stupidity of others on full display and the apparent scarcity of equipment can still benefit us in a way these numbskulls couldn't possibly consider. Given our location at the doorstep of Poland's largest agglomeration (or should I say abomination), Close Quarters Combat is something we should actually strive to perfect, even if it means bashing our opponents with machetes or bats. And even that, coupled with a good enough number of armored support, should be enough to at the very least buy us enough time to bring some actually relevant forces into the area."
DGR_urban_sabotage_battalions: "Urban Sabotage Battalions"
DGR_urban_sabotage_battalions_desc: "The nature of our situation is that we are hardly ever going to fight an enemy without a fairly developed industry and urban sectors. If our wars so far taught us anything, it's that in order to beat your enemy, you need to make sure you have the advantage before you pick a fight, and what's better at making sure that's the case other than making your opponent's biggest advantage their nail in the coffin ? The urban landscape isn't alien to us - we're from Dąbrowa, for fuck's sake, but through a series of very specialized trainings (as much as it's possible with this terrible budget.) we can prepare our militia to perfect traversing through highly built-up areas and our heavier weaponry to precisely pick off the most important structures and apparatus instead of firing more or less blindly in the enemy's general direction."
DGR_red_guardians: "Red Guardians"
DGR_red_guardians_desc: "Superhero culture has bred a sort of cult around the fucking American worldview in the average consumer. I despise all these comparisons to Captain America or Superman in every possible medium so much that I will punch the next person in the face who makes that comparison in reference to the Red Guardians project. They won't be running around in goddamn pajamas being insufferably pompous. They are meant to be killing machines, the pinnacle of soldier development, a massive arsenal enclosed in a single person. A fucking terminator. How do we want to achieve this? That is for the scientists working on it to figure out. And the fact that it looks like something out of your shitty comic books is just the fault of your own fucked-up mind that can't stop comparing, going 'WOW, THIS IS JUST LIKE IN MY FAVORITE FRANCHISE!'"
DGR_pkwn: "Manifesto of the Committee of National Liberation"
DGR_pkwn_desc: "The Polish Committee of National Liberation is associated with communism, yes. There is no point pretending anyone will see us as anything other than a red plague. So let us lean into it. We must send a manifesto to the entire world - a proclamation declaring, unequivocally, who emerged victorious in Poland, while also reminding everyone what we were fighting for all along. Just because our struggle was for a single nation does not mean our values cannot be applied universally to every country on Earth.\n\nEspecially to every nation shackled by neoliberal democracy, the capitalist whip, or the authoritarian rule of some petty strongman who cares for nothing beyond his own wealth. Our journey does not end here. We are merely the first representatives of a new era that will emerge across the world. First in Europe, and then beyond it. Everywhere, people will be able to draw inspiration from our struggle - from the fact that despite having virtually no chance of success, we defeated every obstacle and seized control of our own destiny.\n\nThis is who we are. We are the Poles."
DGR_eternal_watch: "Eternal Watch"
DGR_eternal_watch_desc: "And so he departed for the eternal watch, together with his beliefs and the entire Politburo. I won't pretend his death left some unbearable void in my heart - after all, I contributed a little to how quickly his end arrived. He had already been standing at the gates of Hades for far too long anyway.\n\nBut... it is still a symbolic day.\n\nBecause from this moment onward, appearances no longer matter. One funeral left to endure, and then total power is finally within reach. No ideological piece of human waste will ever stand in my way again. History has rewarded its loyal servant with the opportunity to claim supreme authority over the nation.\nWe are entering a new era - an era of iron will and bold action, an era of courage and ruthlessness. I just need to bring those pathetic excuse-for-generals into line first. Then it will be time to kick open the doors to the international arena with a bang."
DGR_state_funeral: "State Funeral"
DGR_state_funeral_desc: "The final performance I still have to endure: pretending to be sad at a grand state funeral. Such an empty spectacle that we're practically burying an empty coffin. But I can't look too sad - just enough grief to seem human, while still radiating steel determination and absolute confidence. Because the eyes of the entire country will be fixed on this ceremony. I cannot allow even a moment of weakness. They expect an unbreakable leader - and that is exactly what they will get. Even if everyone else is weak and spineless, my backbone will not bend.\n\nWho would have thought that fifteen years ago a man like me would be handed such an opportunity by fate? But many people are given opportunities. Only great men know how to seize them and turn fate itself into their puppet. Great deeds are coming."
DGR_second_wedding_to_sea: "Second Wedding to the Sea"
DGR_second_wedding_to_sea_desc: "Commissars Zimmermann and Zagórski are plotting something. I should have known that once the struggle for Poland ended, the political backstabbing would begin. A grand parade celebrating the restoration of access to the sea sounds noble. A second \"Wedding to the Sea\" sounds patriotic. And yet... something about all of this feels wrong. Far too much equipment is being moved northward. Yes, I know it's supposedly a military parade, but you don't need to redeploy that many forces for a parade. Maybe these years of war have made me completely paranoid, and instead of enjoying a national celebration I'm instinctively searching for an excuse to start another conflict.\n\nBut they started it! Yes, I'm going there. But I'll keep my eyes open at all times. They already told me before that the reports about secrets being covered up by the commissars were just reactionary conspiracy theories... But what if they were true?"
DGR_eastern_rising: "Eastern Rising"
DGR_eastern_rising_desc: "I never expected everyone to immediately accept our rule over the country. That's what the entire series of unification wars was for. But I always knew resistance would remain even after reunification. That is natural. Inevitable. And now it's happening in eastern Poland - Lublin, Rzeszów, Przemyśl. Which is precisely what confuses me. Eastern Poland has always been deeply conservative, and the closer you got to the border, the more traditionalist the population became. The wars didn't really change that. So what exactly is going on? Why are we facing an uprising from people who, theoretically, should be celebrating the fact that nationalists took power?\n\nThe Guard was more than eager to deploy most of its available forces to crush the rebellion. Which, to be fair, is exactly what they exist for. Still, I'd rather nobody starts welcoming Czyżewski as some kind of liberator. Every chance he gets, he finds a way to jab a knife into my side. There always has to be something he disagrees with. Fine. Let him go. Maybe the partisans will solve that problem for me."
DGR_ascension_of_one: "Ascension of the One"
DGR_ascension_of_one_desc: "Father always used to say never give power to people whose ego outweighs their intelligence. Though, admittedly, he phrased it a little less elegantly. Still - the principle remains true. Anyway - what kind of self-obsessed little shit, what kind of complete fucking idiot and narcissist do you have to be, to hold a respected ministerial office and then travel to fucking Grodzisk Wielkopolski to stage some ridiculous theatrical ceremony and crown yourself???\n\nCROWN YOURSELF AS WHAT, EXACTLY? YOU'RE NOT EVEN IN POWER!\n\n\"The Great Ascension of the One.\" Jesus Christ. If only the one thing ascending would be your room-temperature IQ. I should have dealt with that deranged cultist a long time ago. Slowly, I'm starting to feel like I'm losing control over whatever the hell these lunatics are doing."
DGR_abraham_mutiny: "Abrahamowicz's 'Mutiny'"
DGR_abraham_mutiny_desc: "I spoke with Abrahamowicz many times about the Eastern Borderlands, and about how, after finishing the campaign in Poland, we should enforce our authority over the lost territories by force if necessary. Of course, it had to be done firmly - but cautiously. Timing in geopolitics is the single most important skill there is. Żeligowski had the right idea. Russian \"little green men\" in Crimea refined the model. We were supposed to perfect it further by marching on Vilnius. That was the theory behind our discussions. But I don't even know how many times I emphasized the importance of the word TIMING.\n\nSo guess what happened?\n\nLithuanian headlines: POLES MASSING TROOPS AT THE BORDER - ALARMING REPORTS FROM THE WEST. And back home? Total euphoria. Apparently Rydz-Śmigły himself has been reincarnated, and crowds are already shouting, \"Leader, lead us to Vilnius!\". When I asked Abrahamowicz what the fuck he thought he was doing, he replied that it was \"just a show of force\" and that nothing would happen without my approval.\n\nFor some reason, I don't believe him."
DGR_meeting_with_chief_pioneer: "Meeting with the Chief Pioneer"
DGR_meeting_with_chief_pioneer_desc: "Marcin Lasecki seems to be the last friend I have left that I can truly trust. I know he'll stand by my side no matter what happens. And a lot is happening, because for the past few days I've been under heavy guard, wondering whether those bastards are planning to put a bullet in me. Because they want me dead. I know they do. Fucking hyenas - now they're not even pretending otherwise anymore.\n\nAfter all, Marcin is the First Pioneer, head of the Civil Corps, a general of the National People's Army. He was always a calm and thoughtful man. Why couldn't I have had more people like him? He'll tell me everything. He'll know the mood of the population, and he probably still has contacts among the rest of the high command. He won't betray me. I need to see him as soon as possible. Because I'm starting to fear that the chessboard was laid out the moment the country was unified... and for the last several months, everyone has simply been positioning their pieces."
DGR_way_is_shut: "The Way to Warsaw is Shut"
DGR_way_is_shut_desc: "God. Fucking. Damn. I hate politicians.\n\nThe central civilian government sitting in Warsaw shit its armor the moment the Guards seized every route and city south of the capital, while the army rolled out of the barracks in the north. Granted, that entire gang of bureaucrats will be useless if another civil war actually breaks out - but now more than ever we need soft power to prevent exactly that, and they cheerfully declare it's \"not their problem.\"\n\nNot one stone will remain standing in that damned, self-important city. Even if they compare me to Hitler for it, I will raze Warsaw to the ground, scatter its inhabitants across nearby towns, and as for the capital... We've had one in Dąbrowa for a long time already. We don't need that rotten center anymore."
DGR_struggle_for_fuel: "Struggle for Fuel"
DGR_struggle_for_fuel_desc: "The rat race has begun. Everyone is scrambling to secure as much fuel as possible. Honestly... it reminds me of the days right before our revolution in Dąbrowa. Back then we counted every last drop of gasoline - and eventually we decided to raid a fuel convoy just to keep the Sztygarka tanks running. Ah... history really does go in circles.\n\nOur fuel depot was massively expanded to sustain the demands of the ever-growing National People's Army, so our logistical base is solid. We don't need to fight for fuel - we already have it. They won't get far, and sooner or later they'll start tearing each other apart. And while they do, we'll quietly slip around them from the flank and fuck them from behind. Then we'll roll tanks straight into their headquarters and establish the final order."
DGR_operation_crane: "Operation Crane"
DGR_operation_crane_desc: "One of my favorite sayings goes: \"Assume you're gonna get fucked so you can prepare for the fuckery.\" And while I'm disappointed in my generals, that doesn't mean I was completely unprepared for action against me. One of the main commissariat headquarters is located in Gdańsk - and that's exactly where we'll strike. I'm ninety percent certain they're planning betrayal. I just don't know how yet. But intelligence reports speak clearly about preparations aimed at seizing power. Give them a finger and they'll devour your entire arm.\n\nIn a situation like this, betrayal can only be answered with absolute annihilation. A preemptive strike. A display of strength. And maybe, just maybe, we'll wipe one of the chief commissars off the board in the process. Either way, Gdańsk and its citizens will feel the wrath of the National People's Army. A lot of people will have to be sacrificed for the greater good - but I'm prepared for that. Because a monster like Zimmermann must either be kept on a leash... or put down. The people of Pomerania would probably thank me for bombing him, if only they understood the future he intended for them."
DGR_love_letter: "Love Letter for the Inquisitor"
DGR_love_letter_desc: "\"Szarejko, for fuck's sake, do you even realize the idiotic shit you're doing? Smash your head against a wall - but get a running start first.\"\n\nAlright, I admit it may not be the finest piece of literature I've ever produced, but emotions are taking over. I'm not going to write to that idiot in the language of diplomacy because he doesn't speak it anyway. Besides, there's a decent chance he won't even live long enough to read what I'd actually have to say. Why? Well, that's a surprise. No point jinxing it.\n\nStill... you spend decades thinking you know someone, thinking you understand what they're capable of. And yet you ignore all their flaws and degeneracies, hoping that the sheer weight of shared history will somehow keep the relationship alive. Blindness. Stupidity on my part. Sentimentality kills. Nostalgia is acid - it eats you alive and doesn't care what's left behind. So then, out of sentiment - Farewell, my friend. I won't miss you. May you rot in hell. And if you refuse to go there willingly - I'll send you there myself."
DGR_assuming_direct_control: "Assuming Direct Control"
DGR_assuming_direct_control_desc: "The board may be set, but everyone else seems to be playing checkers while this situation demands experienced chess players. Modern warfare cannot rely on outdated thinking, because that guarantees defeat in every possible scenario. Whoever controls energy controls momentum and dictates the pace of battle. Fortunately for us, our state relies first and foremost on a national intranet - which we have just disconnected from everyone else - and on a closed energy grid, which we have also just shut down.\n\nWe'll manage. We redirected sufficient reserves into energy storage facilities, and we control several of the largest power-generation units in the country. That will provide us with all the electricity we need. The rest will choke in darkness and communications chaos. It's only a matter of time before they lose their appetite for rebellion and peace and enlightenment return. Under my supervision, of course."
DGR_last_showdown: "The Last Showdown"
DGR_last_showdown_desc: "Cockroaches have a nasty habit of surviving even nuclear explosions. No matter what I tried, these damned maggots kept pushing toward rebellion - and worse, now they are openly opposing the central authority. My authority, because nobody gives a damn about Warsaw anymore. History likes to repeat itself: first as tragedy, then as farce. And now fate is punishing me for my own arrogance.\n\nUnless... this isn't punishment at all. Maybe it's the final test before glory itself. To move forward, sometimes you have to burn every bridge behind you so that nothing follows. And this is exactly that kind of trial. Because once upon a time... all of them were my friends. And if I am to claim my place among the greatest figures in history...\n\nThey must die. We've returned to the beginning. Once, we were equals to gods. Now all that remains is the struggle for a place in hell."
DGR_salvation_tactics: "Salvation Tactics"
DGR_salvation_tactics_desc: "We are your salvation. Your one and only hope. You will accept this and stop resisting, or we will destroy you and everyone you love. Fuck, it's kinda grim, but i'm beyond asking nicely. Maybe use this after everything else fails. And add that we are the only legitimate government. Although, everyone says that...but we have the true legitimacy, we hold Dąbrowa, and that's where all this started. \n\nWe need to pose as liberators. Again. While everyone burns, bombs and schemes we are bringing you peace and prosperity. This country is sick and we are doctors with medicine. Only we can secure the future for us and the generations that will come after us. I fucking hate advertising..."
DGR_rally_to_the_flag: "Rally to the Flag"
DGR_rally_to_the_flag_desc: "The lightning is red, and the hammer shall forge an iron sword. And the eagle that holds it declares plainly: Poland has not yet perished. Only beneath this banner will Poland remain Poland, and a Pole remain a Pole. We must make full use of the state we built upon the foundations of the army and implement universal, total people's mobilization. Remind the people what we are truly fighting for, and why our colors are the only national colors unstained by the yoke of betrayal. We must use every means available - even at the cost of stripping people of their free will. There will be time later for treating civilians gently, because the age of restraint is over...\n\nNOW THE CANNONS ROAR."
DGR_volkssturm: "National People's Storm Brigades"
DGR_volkssturm_desc: "When the army is in need, it is the duty of every citizen to take up arms and fight! Even if that struggle is logistical and far from the front lines, every effort must move in the same direction. Women wanted equal rights - let us give them equal responsibilities as well. The youth will serve perfectly as replacements for garrison units, and veterans do not abandon an oath once sworn. If enemy cohorts enter a city, every citizen has the duty to resist them. With a rifle, a Molotov cocktail, stones - anything. If they try to seize even a smallest village - resist them! They must not be able to set foot on our soil without someone rising to fight them.\n\nEveryone to the front!"
DGR_race_for_the_base: "Race for the Base"
DGR_race_for_the_base_desc: "We cannot allow ourselves to become trapped in another pointless war of attrition like the one that dragged on for years before. Now, armed with the invaluable experience of the Fall and the Unification Wars, we must strike quickly and mercilessly at the enemy's strategic points. Destroy supply depots, sever logistical lines, seize headquarters with rapid-response units.\n\nThis campaign must be fast and decisive, because the longer it drags on, the more we will begin to look like the losing side - even if we technically aren't. Just look at how well the Russian war in Ukraine supposedly went. They kept advancing, kept pushing forward - but at what cost? We need air assaults, deep raids, lightning warfare - otherwise we will end up buried in history's scrapyard, and our entire revolution will have been for nothing."
DGR_scorched_earth_tactics: "Scorched Earth Tactics"
DGR_scorched_earth_tactics_desc: "If this country cannot grant me power after I sacrificed everything for our fatherland, then perhaps it no longer deserves to be treated with respect. If the citizens cannot choose our side, why should we bother protecting them? Those who join us will be surrounded by an iron armored cordon, and we will stand beside them shoulder to shoulder. But the rest? There is no room for neutrality here. Either you are with the National People's Army - Or you are an enemy of the National People's Army. Simple. Effective.\n\nAnd those who choose to be enemies will learn the meaning of terror. They will not be capable of waging war if they cannot move, feed themselves, or maintain supplies. We will set this country ablaze and watch it burn. Those who survive the fire will crawl to us on their knees, begging for forgiveness."
DGR_dark_cold_hungry: "Dark, Cold and Hungry"
DGR_dark_cold_hungry_desc: "Morale is a soldier's greatest weapon. Even when the world stands against him, a soldier with an unbreakable spirit can smash through any barricade. But without food, warm clothing, or supplies... even the greatest veteran stops caring about victory and begins worrying only about survival.\n\nAnd that is precisely where we must strike. Destroy everything they can draw food from. Break every supply line. Cut power to every city and village. Crush their spirit. Then every army will collapse like a house of cards. Buildings can be rebuilt. Crops replanted. Roads repaired.\n\nBut victory will be eternal. And absolute."
DGR_ultimate_rocket_strike: "Ultimate Rocket Strike"
DGR_ultimate_rocket_strike_desc: "The next step toward completely breaking the enemy's will shall not be limited to internal sabotage and ground offensives. Since the dawn of humanity, mankind has gazed toward the stars wondering what awaited them in the heavens. But once the skies are filled with countless rockets, they will never look upward again.\n\nThe terror we sow among them must be constant and merciless. With every rocket slamming into another building, they must ask themselves whether they truly chose the right side. Day or night - they must never know peace. The primary targets will, of course, be cities, because cities are easiest to turn into fortresses. But no one can fight effectively among endless ruins. Even if they intercept some of the missiles, the rest will reach them sooner or later. And I guarantee you - after enduring such an endless barrage, they will no longer have the will to fight beneath the shadow of our rockets."
DGR_human_wave: "Human Wave Front"
DGR_human_wave_desc: "Once terror has reached the proper intensity, we will have to place the final brick upon the structure  -  the ground assault. Normally, the entire purpose of war is to eliminate the enemy before he even sees you. But not here. Not now. We want them to see us. We want them to fear us when they witness endless waves of men marching toward them to destroy them. That will be the final nail in their coffin, because how are they supposed to defend themselves when there are simply more of us?\n\nSoviet doctrine applied this across the entire front. It was little more than throwing men into the meat grinder. But we are turning it into a specialized weapon  -  merely the finishing touch to the broader system we have already built through other methods of intimidation. A tidal wave of soldiers will wash away all the filth festering within the rotten corners of Poland. We have just weaponized fear itself."
DGR_sabotage_tactics: "Sabotage Tactics"
DGR_sabotage_tactics_desc: "Precision and efficiency with minimal losses and minimal combat effort. We have already lived through one war, and we have no desire for another. This will simply be a peacekeeping operation  -  the precise surgical removal of tumors from the healthy body of the National People's Army. We must redirect every available resource toward avoiding a drawn-out war across a broad front.\n\nWhen enemy guns cease firing, when their vehicles cannot leave their bases, and when their desperate requests for orders are answered only by silence echoing through dead communication lines, every enemy soldier will realize the game was rigged from the beginning and they never stood a chance. With swift and lethal operations, we will cut the head off the hydra, and the rest will simply scatter in every direction. After that, all that remains is cleanup."
DGR_logistical_ruin: "Logistical and Infrastructural Ruin"
DGR_logistical_ruin_desc: "If you want to reach the front lines, sooner or later you must rely on roads or railways. Especially when someone else controls the skies. But when rail lines are blown apart, bridges reduced to rubble, and highways blocked... Well. You cannot fight where you cannot arrive. And you cannot fight with weapons, fuel, or ammunition you do not possess. Conveniently enough, there is no possibility that they have secretly built hidden depots, fuel reserves, or supply bases beyond our knowledge. We know exactly where every single one of those facilities is located, which makes precision strikes against them little more than a formality.\n\nWe will dismantle entire enemy armies with one simple trick. They can scream at their commanders for more ammunition and supplies all they want, but those commanders will only be able to spread their hands helplessly. Because they will not even have factories left."
DGR_behind_enemy_lines: "Behind Enemy Lines"
DGR_behind_enemy_lines_desc: "The Mongols were terrifyingly effective in their time because they did not care about fortresses or borders. They simply rode straight through enemy lands as if they owned them, seized whoever they found, looted everything possible, and vanished before anyone could react. And that is exactly how we must operate. Mobilize special forces for rapid, deep strikes behind enemy lines to create the impression that we are everywhere around them at once.\n\nThe deeper we strike, the greater the chaos we unleash. We do not even need to remain there long. A handful of carefully coordinated operations will create enough confusion and panic that, at times, the enemy will eliminate themselves for us. Because once they stop understanding what we are doing, the psychological effect alone will be devastating enough to paralyze every plan they have."
DGR_great_chops: "Operation Great Chops"
DGR_great_chops_desc: "This entire farce rests upon the shoulders of a few greedy and treacherous scumbags whom I foolishly grew accustomed to calling friends. That damned pack of Brutuses, trying to stab me in the back, forgot one thing - I know them inside and out. I know how they think. I know how they operate. And I will not hesitate to use that against them. And without them? Without them, there is no rebellion. None of their soldiers will continue fighting once their leaders are gone. The solution itself is simple: eliminate the commanders. There is only one problem  -  perhaps I failed to teach them many things, but one lesson they absorbed from me perfectly: Paranoia. They are obsessively cautious.\n\nGetting close will not be easy... but properly trained strike teams could slip in like American special forces, quietly storm the place, cause absolute chaos, capture the enemy leader, and disappear before anyone even has time to get out of bed and put on their slippers. And that could win the war without firing a single shot. And the ridiculous name? That is an extremely inside joke. Though somehow, I am not laughing anymore."
DGR_agonia_tozsamosci: "The Agony of Identity"
DGR_agonia_tozsamosci_desc: "It is over. And yet victory carries the bitterness of defeat. I struggle to find words capable of describing how a man cornered against the wall can transform into a monster willing to burn everything around him to ashes. Yet it was not thought, but action, that revealed it. Humanity is doomed to perform the same tragedy over and over throughout the ages. Only the actors and props ever change.\n\nBut this chapter is now closed. Someone had to stand at the front to face the approaching darkness. Someone had to lead the rest forward. Someone had to stand there and absorb the full force of envy's arrow as it pierced through the human soul itself  -  paralyzing the nervous system and reaching the mind, which eventually ceases to function beneath the crushing burden of responsibility for a nation and its future.\n\nNow, having destroyed everything and everyone I once knew, I can only ask myself: What remains? And do I even deserve to exist after the things I have done?\n\nFor Poland.\nOr was it always only for myself?\nThus begins the agony of identity."



 ## NARKOM ##
DGR_hour_of_the_wolf_nc: "Hour of the Wolf"
DGR_hour_of_the_wolf_nc_desc: "The time has come for the revolutionaries to pay for their criminal actions against the government. What we did was an incredibly difficult decision - but a necessary one. The rest will not dare to repeat such an uprising, fearing an even harsher retaliation. The balance has tipped in our favor. All those subversives... they were waiting for the right moment. The old man was gone for just a second, and they were already at my throat. Not a chance.\n\nWith Szwej absent, and with martial law imposed, I will hold unlimited power. And believe me - I WILL restore order here."
DGR_bargiela_list_nc: "Bargieła's List"
DGR_bargiela_list_nc_desc: "Enough. I can hardly stand the thought that those nests of decay - political parties and social organizations - were allowed to function without restraint. The main reason for my contempt is their complete and thoughtless detachment from reality. On top of that, they are responsible for the recent strikes and riots through their agitation. Was it really them? And does it even have to be true? By my estimates, around three-quarters of all social, political, and cultural organizations will cease to exist after the next decree. No one will need them. They will no longer sow chaos or poison people's minds - not when a better, state-controlled alternative exists."
DGR_capital_punishment_nc: "Capital Punishment"
DGR_capital_punishment_nc_desc: "When a man is too lenient, others begin to take advantage of it. Give them a finger, and they will want the whole hand. And if they don't get it, they'll take it by force. The doctrine of \"turning the other cheek\" has wrought absolute devastation in people's minds. It is time to return to the simplest principles. Christian mercy cannot function when war rages around us and survival is at stake. An eye for an eye. A tooth for a tooth. Death for betrayal. That Hammurabi was a wise man indeed. And before the philosophers start preaching that an eye for an eye makes the whole nation blind - no, it won't... not if we are the ones who control the vision.\n\nSo, what's it gonna be? Hanging? Beheading? Electric chair? Firing squad?"
DGR_assembly_ban_nc: "Assembly Ban"
DGR_assembly_ban_nc_desc: "Gentlemen, colleagues - this is how it works: when you impose martial law, you also impose a ban on public gatherings. With the exception of those sanctioned by the Politburo, of course. Such a small decision, yet it clears the board of all unwanted pieces in one swift move. In the end, it comes down to a very simple rule: hold a public meeting, and you are an enemy. So if you're not an enemy - don't hold meetings. Simple and logical, isn't it?\n\nUnfortunately, the worst rats will flee underground, creeping through the shadows and the sewers. But we'll smoke them out too, step by step."
DGR_health_trails: "Health Trails"
DGR_health_trails_desc: "Now, now it's my time to shine. All bastards and traitors will be tried for their defiance against the state. I've come up with something very interesting.\n\nHealth Trails, something SB used back in the day , will be a perfect punishment for all anti-state activists. Oh, I already imagine all of those bureaucrats jumping in between the Inquisition soldiers, begging for their miserable lives while getting beaten by batons.\n\nI'm close to securing total control over Zagłębie. Soon, there will be no one left to stop me. My dream of a national revolution has never been closer."
DGR_halt_the_trials: "Halt the Trials"
DGR_halt_the_trials_desc: "They think they have a voice, huh? What do they even fucking imagine telling me what to do? Those false communists stand in the way of everything I was born to achieve. I swear they will pay for this insult in blood.\n\nThat old fool Szwej isn't coming back, and treacherous apparatchiks will be tried and punished for their defiance. This is nothing but a brief shadow, a minor setback. Soon, my inquisition will reclaim absolute control over Zagłębie.\n\n My reign has only begun. The true vision of National Poland shall be achieved, no matter the cost. "
DGR_suspend_the_martial_law: "Suspend the Martial Law"
DGR_suspend_the_martial_law_desc: "WHAT?! How?! No, no, no, it is not possible! That old bastard woke up and came back stronger than ever! He suspended martial law and, with one decree, ended my whole plan! Inquisition is in shambles, apparatchiks are starting to regain voice, and old cunt is celebrating. It is not how it was supposed to be, and I won't let it pass without a fight. Szwej, you son of a bitch, you will regret that! My army is still loyal and strong, so let's see who has bigger balls! Fuck you, Szwej!"
DGR_national_disposition_authority_nc: "National Disposition Authority"
DGR_national_disposition_authority_nc_desc: "The free market is a mockery of the society. It is a vast ocean into which people are thrown - most of whom cannot swim - in the hope that the economy will move forward just because we unleash people's entrepreneurship. Sure, but the one thing we won't unleash is the exploiters from prisons, where we will throw them for preying on people and their property. The economy must be planned - with room for improvisation, of course - but the main goal must be clearly established, and everything must operate according to the existing plan. Otherwise, the state will not function; everyone will do exactly as they please, and absolute chaos will ensue. And the only ones who benefit from that are the hustlers, not ordinary people.\n\nNational Disposition Authority is to serve as the governing body of the state economy. Of course, steering an entire economy is more like steering a massive ship. There isn't much room for maneuvering or sudden changes of course. Let's just hope there are no icebergs waiting for us along the way..."
DGR_home_of_the_revolution_nc: "Home of the Revolution"
DGR_home_of_the_revolution_nc_desc: "Dąbrowa. The Polish homeland of revolutionaries and the socialist movement in this part of the country. This is where the workers' movement and revolutionary thought were forged. We fought for freedom during the January Uprising, then again at the end of the First World War and throughout the Second. And when peace finally came, it gave birth to different kinds of revolutions - which is why we now possess the largest industrial complexes in the country. The sheer number of communist monuments scattered throughout the city has always exceeded all reasonable standards.\n\nAnd now, from Dąbrowa, comes the spark that will reshape this country in our image and likeness. Once again, we are the heralds of revolution."
DGR_zaglebie_only_city_nc: "Zagłębie's Only City"
DGR_zaglebie_only_city_nc_desc: "What kind of Zagłębie is it? Dąbrowskie, obviously. So really, what use do we have for Sosnowiec? Or Będzin? Dąbrowa deserves the title of the largest city in Poland. Besides, we weren't born yesterday. Our reach once extended farther east and west. Zagórze, Ksawera, Sławków - all of these were once territories belonging to Dąbrowa Górnicza.\n\nBut that phase of consolidation is already behind us. The Silesians were desperate to build their own metropolis, yet at every turn they denied us equal representation, tossing us scraps like merely including Zagłębie in the official name. We don't need their charity. We'll build our own metropolis - without the hanys bastards and without the Silesian mess."
DGR_urbanisation_effort_tricity_nc: "Urbanization Effort: Tricity"
DGR_urbanisation_effort_tricity_nc_desc: "The famous Dąbrowa Tricity - Łosień, Łęka, and (Ł)Okradzionów. Though the names alone make it obvious these places aren't exactly highly developed. Mostly rural land, dense forests, open fields. And honestly? That's not even a criticism. Quite the opposite. There's plenty of room for entirely new housing districts. People from the provinces could use a little street smarts and some urban attitude. Besides, our apartment blocks are fucking glorious. And eventually we need to reduce the percentage of \"village Dąbrowa\", because with great territory comes great responsibility to develop it properly."
DGR_urbanisation_effort_strzemieszyce_nc: "Urbanization Effort: Strzemieszyce"
DGR_urbanisation_effort_strzemieszyce_nc_desc: "Strzemieszyce is admittedly a rather ungrateful district, one that tried several times to pretend it deserved independence as a separate town. History demonstrated quite clearly that it simply did not. Unlike the outer districts of Dąbrowa, Strzemieszyce at least has a few apartment blocks. Well, \"a few\" might be generous. It's more like a handful of miserable prefab buildings scattered around. But at least they started somewhere. The main eastern transportation artery also passes through the district, which practically begs for large-scale residential expansion. And there's still plenty of room, although in some places we'll have to drain marshland first. But that never stopped anyone from building communist housing estates before, did it?"
DGR_urbanisation_effort_antoniow_nc: "Urbanization Effort: Antoniów & Ujejsce"
DGR_urbanisation_effort_antoniow_nc_desc: "Antoniów, Ujejsce, Trzebiesławice - the farther north you go in Dąbrowa, the more it turns into the middle of nowhere. Just like Poland in general: civilization and industry in the south, swamps and bullshit in the north. Antoniów is technically part of Ząbkowice, but after the bandits turned Ząbkowice into one massive squat, the district became nearly uninhabitable. We need to separate Antoniów administratively, incorporate the Young Steelworkers District into it, and expand it. And after that - we keep building northward.\n\nBecause one day, some massive investment project may emerge in that region, and it will need thriving residential centers nearby to support it. And hopefully, while we're at it, we'll manage to cover up some of that poverty."
DGR_expand_zaglebie_palace_of_culture_nc: "Expand Zagłębie's Palace of Culture"
DGR_expand_zaglebie_palace_of_culture_nc_desc: "You might ask why anyone ever thought building a second Palace of Culture in Poland was a good idea. What, the one in Warsaw wasn't enough? Maybe it was - but Aleksander Zawadzki wanted a palace just as impressive in his own hometown. And he got one. It just wasn't quite as tall. For years there were rumors that the reason was because Dąbrowa had been built over mining terrain, and that if they constructed something truly gigantic the entire city would collapse into the ground. Ridiculous. What next - the earth's crust splitting open to swallow us for our sins?\n\nThere's nothing to fear. We should expand it instead. We'll reach the heavens with that tower. And this time God won't punish us for it - because He doesn't exist."
DGR_prepare_niegowiczki_landing_strip_nc: "Prepare Niegowoniczki Landing Strip"
DGR_prepare_niegowiczki_landing_strip_nc_desc: "The absurdity of Katowice-Pyrzowice Airport exists on multiple levels at once. It's not in Katowice, and it's not even particularly close to Katowice. It's actually closer to Dąbrowa. Besides, why the hell do they even need that airport when they already have a perfectly good location at Muchowiec? It wouldn't be much use to us either, considering how close it lies to the state border, making it even more vulnerable to attack than usual. And that's where the inconspicuous village of Niegowoniczki comes to our rescue. What's special about it? Well, it sits right next to Dąbrowa, just past Łosień. And here's the best part - there's already a tiny airstrip there. Hardly anyone even needs relocating; there are maybe ten houses in total. The perfect place for an airport."
DGR_expand_voivodeship_road_790_nc: "Expand Voivodeship Road 790"
DGR_expand_voivodeship_road_790_nc_desc: "Road 790 may run through Niegowoniczki, but calling it \"good\" would be generous. Two lanes, two-way traffic, and to reach the airstrip you still have to drive down dirt roads. You're all familiar with modern airports, right? What surrounds them? Highways. Massive terminals. Huge transportation and logistics hubs. Exactly. And unfortunately, that's going to be the biggest challenge. We need to bring civilization here and expand the area to resemble what already exists around Pyrzowice. Some infrastructure can be relocated, some will have to be built from scratch."
DGR_move_pyrzowice_nc: "Move Pyrzowice Airport"
DGR_move_pyrzowice_nc_desc: "I honestly don't know what's harder - the physical relocation of the terminal itself (or rather rebuilding it using as many reusable parts as possible), or all the damned paperwork surrounding it. Yeah, we moved the airport. What are you going to do about it? The fact that the world still uses maps showing Katowice-Pyrzowice Airport in its old location is hardly our concern. It's not like anyone's flying in from abroad right now anyway. Yet. After the war, we can worry about bureaucrats and permit applications - we don't have time for that nonsense now. Dąbrowa Airport exists. That's what should concern people. Not whether the airport they're flying to technically still exists in the same spot. Worst case scenario, you pull up and keep flying a little farther. Hardly the end of the world."
DGR_restore_the_pyrzowice_airport_land_nc: "Restore the Land Around Former Airport"
DGR_restore_the_pyrzowice_airport_land_nc_desc: "The land surrounding the airport... once belonged to my family. My grandmother's parents on my father's side owned large stretches of it. Everyone lived well there - until the Germans arrived and built an auxiliary Luftwaffe airfield in 1940. Naturally, the local population was expelled. But when the war ended and people tried to return... the Soviets drove them out a second time. After all, why waste a perfectly usable airfield? And after the Soviets came the Polish Army, turning it into a military airport. Now, after nearly a hundred years, we are finally correcting that historical mistake. At last... the ancestral land returns to the hands of the people.\n\nI might have to build myself a house there."
DGR_pogoria_naval_commissariat_nc: "Pogoria Naval Commissariat"
DGR_pogoria_naval_commissariat_nc_desc: "To be fair, we do have some experience with sailing. Pogoria may not be an ideal location for a naval headquarters - you're not exactly getting large ships in there - but it could serve perfectly well as an officer training center for the navy. We can teach navigation, sailing, and naval basics there. It won't be perfect, but as a training ground for cadres taking their first steps into naval service, it's ideal. No point throwing them straight into the deep end. Because while we do have lakes, and we enjoy sailing them, we are not a maritime nation. We don't greet each other with \"Ahoy\". So we'll start with Pogoria... and end with the Baltic. Just not immediately."
DGR_tourist_heaven_in_pieklo_nc: "Tourist Heaven in Piekło"
DGR_tourist_heaven_in_pieklo_nc_desc: "Piekło - which literally means \"Hell\" - is, as the name suggests, the perfect place for relaxation. And that's not even ironic. The settlement of Piekło lies on a narrow strip of land between the two most popular reservoirs in Zagłębie: Pogoria III and Pogoria IV. There are already beaches there, yacht clubs, restaurants, rental cottages. But do you know what it lacks? Scale. Huge people's resorts like the ones in Bulgaria's Golden Sands. But not those privatized monstrosities built by hotel tycoons - no, true municipal achievements of socialist realism. Peace and quiet, water everywhere, forests nearby, close to the city... and if you turn around, you can even see the Katowice Steelworks in the distance."
DGR_edward_gierek_university_nc: "Edward Gierek's University"
DGR_edward_gierek_university_nc_desc: "Since we're naming everything after Gierek anyway, we might as well get rid of that grotesque capitalist mutation known as the Higher School of Business. The name alone reeks of reactionary bourgeois thinking. Business. Because that's all you people care about - money and profit. A university should be a place of inspiration, of exchanging ideas, of spreading ideals. Dąbrowa needs a true people's university. One where students are not taught by pseudo-professors trying to force Balcerowicz-style heresies onto the youth, but by people who show them how a state can function when led by someone with an actual plan - where things are not abandoned to be devoured by market chaos, but shaped with determination until even the forces of nature bend to human will.\n\nThat is the socialist imperative. And that is what we must teach."
DGR_great_wall_of_brynica_nc: "Great Wall of Brynica"
DGR_great_wall_of_brynica_nc_desc: "We need to build a wall. And we'll make Silesia pay for it. But jokes aside - we're actually going to do it. The Brynica River has always been the barrier separating the people's civilization of Zagłębie from the dark hordes of Silesians. The biggest problem, of course, is that from the upper floors of Sosnowiec apartment blocks you can still see Katowice. And it's simply not true that the best thing that can happen to you in Sosnowiec is a bus to Katowice. The best thing is never having to go there in the first place, because life is better here. And it cannot work the other way around - we cannot allow a single Silesian in here. Their time will come, and we'll show them who truly rules this country. But for now, in the event of a treacherous attack on the heart of Zagłębie, we must be fortified and ready to repel them. Because then they'd already be far too close to Dąbrowa."
DGR_peoples_medical_center_nc: "People's Medical Center"
DGR_peoples_medical_center_nc_desc: "Healthcare in Dąbrowa has always had a terrible reputation. Clinics scared people away with rude staff and a total lack of anesthesia, the ER was nicknamed \"the dying room\", the main hospital was perpetually underfunded, and the facility at the steelworks felt like a time capsule from the 1950s. Things were slightly better in neighboring Sosnowiec, but honestly - it still wasn't good enough. That has to change, even if we have to throw every doctor out and hire entirely new ones. The Regional Hospital on the Sosnowiec-Będzin border is already an impressive building, and that's exactly where we should pour every possible resource, so that at least one hospital becomes something we can genuinely be proud of."
DGR_our_own_pentagon_nc: "Our Own Pentagon"
DGR_our_own_pentagon_nc_desc: "Our army urgently needs a real command center. A proper Pentagon. A place where the general staff can meet without the risk of the Committee for Measuring Frying Pan Diameter holding deliberations in the next room. Honestly, that's the main reason - to get as far away from the Politburo as possible. Though... maybe we don't actually have to go that far. Since we want our own Pentagon, it just so happens there's already a building that looks remarkably similar to one. And it's right next to the main government district: the Technical Schools Complex. The students can be transferred to another vocational school, the building itself can be expanded and fortified, and there you have it - a headquarters.\n\nAnd yes, for fuck's sake, I know it's technically a hexagon. It's called an analogy."
DGR_remove_bien_forest_nc: "Remove Bień Forest"
DGR_remove_bien_forest_nc_desc: "The problem with industrial development is that it always needs more space. And while we usually have plenty of it, our current plans are becoming a little... uncomfortably cramped. Between Tucznawa and the Katowice Steelworks - where we're planning further expansion - sits the Bień Forest.\nEnvironmentalists will scream, someone will chain themselves to a tree, there'll be some crying, and then we'll haul them away. We'll get plenty of firewood out of it, and free up valuable land. Because we're not seriously going to get sentimental over one forest, are we? Wild boars already wander between apartment blocks - they clearly don't need forests for that. And besides, there are still forests outside the city. Go there if you want nature. Don't expect wilderness in the middle of a civilized industrial center."
DGR_expand_tucznawa_zone_nc: "Expand Tucznawa Zone"
DGR_expand_tucznawa_zone_nc_desc: "Now that we've removed the biggest obstacle - space constraints - we can finally expand the industrial zone in Tucznawa. And some people will say it's already been inflated to the absolute limit by us. To which I say: there are still loyal entrepreneurs eager to expand the productive capacity of the working people. They keep coming to us, asking for permission to open new facilities. And we will allow it. Because we can - and because we should take care of the working class, shouldn't we? So then, back to work - let's build a few more factories."
DGR_expand_przyjazn_coke_plant_nc: "Expand Przyjaźń Coke Plant"
DGR_expand_przyjazn_coke_plant_nc_desc: "That name still doesn't sit right with me after all these years. But we'll leave it as it is, because people won't realize what's actually standing there. The Politburo keeps interpreting it as \"friendship\" between the working class and the peasantry, Poland and the Soviet Union, or for all I know, between men and women. None of that matters. What matters is that now that we've renovated it, we should turn it into the largest coke plant in Poland. Because up until now, it was only second place. And that is unacceptable. If the steelworks is the biggest, then the coke plant has to be the biggest too!\n\nAnd stop calling it the \"coccoa plant\", for fuck's sake. This is a serious industrial facility."
DGR_tucznawa_tworzen_strzemieszyce_triangle_nc: "Tucznawa-Tworzeń-Strzemieszyce Industrial Triangle"
DGR_tucznawa_tworzen_strzemieszyce_triangle_nc_desc: "A massive portion of Dąbrowa is already covered with industrial terrain. And we've filled even more of it with newly built factories. So much so that in some places, the industrial districts have begun to merge into one another. Let's finish the job and build over the remaining triangle of land completely, and we'll create an enormous super-district producing such quantities of goods for the people that we'll practically achieve autarky. And for once, let's build a proper road through there instead of that pathetic two-lane excuse for infrastructure. Nobody's going to live there anymore anyway, so we might as well connect the entire industrial zone properly."
DGR_industrial_powerhouse_nc: "Industrial Powerhouse"
DGR_industrial_powerhouse_nc_desc: "The entire state is becoming an industrial powerhouse, but that doesn't mean Dąbrowa should step aside in this race. Quite the opposite - we must show everyone how it's done. We must become the pioneers of reconstruction, blazing trails where the rest of the people have yet to reach. Do more. Better. Harder. Bigger. Aim higher and farther than anyone else, because no one can stop us when we are driven by an idea and an iron will. There's still a little room left."
DGR_powering_the_steelworks_nc: "Powering the Steelworks"
DGR_powering_the_steelworks_nc_desc: "Mass-scale reindustrialization demands energy. And unfortunately, the demand curve keeps rising relentlessly. While we can still draw power from Łagisza and Jaworzno, those connections are risky. If those territories were cut off, the entire industrial zone would grind to a halt. A giant like the Katowice Steelworks must have its own independent power source - for redundancy, and for efficiency. And afterward, if we can manage it, we'll expand that capacity to the entire industrial district. Assuming we still have room left."
DGR_all_railroads_lead_to_slawkow_nc: "All Railroads Lead to Sławków"
DGR_all_railroads_lead_to_slawkow_nc_desc: "As much as I despise those rebel scum, I have to admit that Sławków possesses a tremendous advantage in the form of its gigantic freight terminal. It's impossible not to look at it with admiration. Of course, they called it the \"Euroterminal\", but that name hardly suits something meant to become the logistical crown jewel of the region. We'll work on that later. But the thing about the terminal is this: while every railway already leads there, we can still improve things on other fronts to make the entire complex even more efficient. Because what if we made the damn thing even bigger?"
DGR_14th_fuel_base_in_strzemieszyce: "14th Fuel Base in Strzemieszyce"
DGR_14th_fuel_base_in_strzemieszyce_desc: "This fuel depot already exists, but ever since the days of the neighborhood wars it's been operating at half-capacity at best. Later it served as a logistical support hub, but it was never used as effectively as it could have been. And there's always a simple solution to that. We need to expand it by at least double. Bigger means better, and the more fuel we have, the more supply capabilities we gain. Everyone knows that industrial progress and development bring more vehicles - and every one of them needs fuel. Not to mention our army. Oh, powering all the new toys is going to take quite a lot of pumping."
DGR_expand_boleslaw_mining_and_metal_plants_nc: "Expand Bolesław Mining and Metallurgical Plants"
DGR_expand_boleslaw_mining_and_metal_plants_nc_desc: "Once upon a time, Poland was incredibly diverse in terms of resource extraction. Coal, oil, gas, zinc, aluminum, iron, copper, salt, amber, silver, gold, uranium. And all of it vanished with time, like tears in rain. What remains are scraps.\nIn Bolesław, we still have the Mining and Metallurgical Works producing zinc - the only zinc-producing plant in all of Poland. And when something is the only one of its kind in Poland, you protect it like a treasure.\n\nOne day we'll return to those times. But for now, let's at least take the first step and preserve our Polish zinc. And the works themselves will provide us with plenty of benefits in machinery production, both civilian and military."
DGR_national_mechatronics_plant_nc: "National Mechatronics Plants"
DGR_national_mechatronics_plant_nc_desc: "Having industry is one thing. Having industry capable of meeting the demands of the modern world is another. Factories producing robots, integrated circuits, or parts for massive autonomous machines - that's the future. The problem is that this makes for a great slogan at a political rally, but not an actual roadmap for what's to come. Modern technology is so complex that you either need countless production lines, or a network of plants each specializing in one thing.\n\nAnd we will need both if we want to make up for all the lost time we could have spent on progress and research. But it will pay off in the future. Because the future is already just around the corner."
DGR_the_only_dabrowa_nc: "The Only Dąbrowa That Matters"
DGR_the_only_dabrowa_nc_desc: "There are many Dąbrowas in Poland. Dąbrowa Tarnowska, Dąbrowa Zielona, Dąbrowa Białostocka, and literally hundreds of ordinary little Dąbrowas and Dąbrówkas scattered around as villages.\n\nBut only one is as magnificent as ours. Only one has citizens willing to strive toward the highest goals. Only one is clearly superior to all the others. From this day forward, when people say \"Dąbrowa\", \"Górnicza\" will be implied automatically - just as the citizens of Dąbrowa have always done.\n\nIn time, we will simply become the Dąbrowa. And everyone will forget all the others. Or maybe we'll just force them to change their names and outlaw all the other Dąbrowas instead?"
DGR_national_science_department_nc: "National Science Department"
DGR_national_science_department_nc_desc: "Scientists are necessary for any state's long-term development and thus require extensive state funding. It's a simple fact. The intellectuals very much like it when someone points that out. They don't like the equally simple conclusion that comes from it: One who pays is the one who demands. In the eggheads' ideal world, they'd like to bleed the R&D budget dry, while free to pursue the studies that interest only them and their colleagues. Not gonna happen. They will receive funding only after proving their research project is worthwhile from the perspective of the state. And of course, their efforts will be monitored constantly. "
DGR_party_institute_of_social_sciences_nc: "Party Institute of Social Sciences"
DGR_party_institute_of_social_sciences_nc_desc: "It's not like I think that we need some detailed ideological faculties in Universities. Our purpose should be clearly visible and easily felt by all members of our nation. It should be expressed by decisive actions of the leader, not by a lengthy thesis. Don't get me wrong, oversight over the humanists is necessary for any respectable state. They are the group that would most likely try to undermine the current regime, and not always for good. It is control, not the content of the curriculum, that matters the most. Does it have anything to do with genuine science? No, but neither did the degree courses of European or Gender Studies, when the humanities were supposedly free."
DGR_incorporate_faculty_of_nature_science_nc: "Incorporate Faculty of Nature Sciences"
DGR_incorporate_faculty_of_nature_science_nc_desc: "The branch of Silesian University in Sosnowiec. Need I say more? For decades, the University from Katowice has been developing a facility for the benefit of the field of natural science. But why should anything Silesian have anything to do with a Zagłębian city? It's time to rectify that mistake by separating the famous 'Razor' to help Zagłębie stand on its own when it comes to science. Of course, a single faculty won't be able to stand on its own, so it will be integrated into the Zagłębian infrastructure we're developing. And besides, such restructurization will allow us to take a closer look at its cadres and organization."
DGR_central_supercomputer_xenon_nc: "Central Supercomputer 'Xenon'"
DGR_central_supercomputer_xenon_nc_desc: "The leader needs a robust and unflinching obedience. He needs to aggregate a tsunami of data to properly organize the economy, military, and science. What better way to achieve that than by using the supercomputer, in which copper wires dominate over neurons and nerves? Well, to be honest, neurons and nerves are much more available, but that shouldn't stop us. It's true that we don't have the know-how, material, or plan, but each great project can be reduced to smaller components. Recognizing that truth, we will connect as many less advanced computers as possible to construct a single machine with enough computing power to store an artificial superintelligence."
DGR_economic_maneuver_nc: "Economic Maneuver"
DGR_economic_maneuver_nc_desc: "There's no denying that the economy has been brought to the brink of... collapse. And, of course, as usual, it's all the fault of people who think they are great patrons of economics and know-it-alls, when the only thing they've actually consumed is a summary of Karl Marx's Das Kapital - without understanding a single word of it. And so, they have brought the housing market to a crash, dealt a death blow to agriculture through collectivization, and where factories once stood and were supposed to be rebuilt, there are now only dug-up pits and structural skeletons.\n\nTo make matters worse, the Politburo has announced an economic maneuver to halt the unfolding tragedy. I don't trust them enough to know that, first of all, this bodes nothing good for the country, and second, it will in no way contribute to strengthening the military's efforts. They'll be busy building completely useless straw hat factories while the military remains underfunded and the defense industry goes down the drain. Let the whole thing just fucking blow up already, I beg you."
DGR_central_housing_allocation_council: "Central Housing Allocation Council"
DGR_central_housing_allocation_council_desc: "Yeah, well, bureaucratizing the housing allocation seems like a very great idea from the party! Well, no. I think the army should be accountable for that, but well, at least they care about equality.\n\nEveryone will have an equal chance to get a flat, and distributing the housing system would ensure that no developer controls the market. It seems like a good idea, but it didn't come from me, so I do have doubts.\n\nAnyway, I hope their patterns will prove unsuccessful, and people will realise that those traitors have no real skills to rule the country. "
DGR_housing_complaints_and_grievances_office: "Housing Complaints and Grievances Office"
DGR_housing_complaints_and_grievances_office_desc: "Housing complaints department? What a fucking dumb idea. So what now? Will we listen to some old Mrs Krysia, whose neighbour's cat shat at the doormat? Or Mr Andrzej's back problems and his desire for an elevator in the building?\n\nWhy should we give those people the time of day? Who cares what they think? We need to channel every resource into expanding our military, not catering to petty complaints.\n\nSo long as Szwej and his apparatchiks hold power, the reunification of Poland is a lost cause. I trust that the people will soon awaken, granting me the opportunity to fulfill my plan of the national revolution"
DGR_reinforce_the_reindustrialization_effort_nc: "Reinforce the Reindustrialization Effort"
DGR_reinforce_the_reindustrialization_effort_nc_desc: "I hope I've already mentioned how much I despise Balcerowicz and his cohorts of liberals who sold our country out for pennies? And it's total bullshit that the world is changing and we had to move into the service sector. Powerful countries don't abandon their industry entirely just because someone decided it's outdated and we need to respecialize. We became the economic dumping ground of Europe in exchange for poor handouts from EU subsidies.\n\nThe reindustrialization process we are undertaking is the right one; we just have to see it through to the end! For now, we are mostly lacking the political will and quick decision-making to rebuild more factories! That is why we must allocate more funds to this cause because it guarantees our prosperity, and only in this way can we show the rest of the world that the industrial era is still alive and well, and we don't give a rat's ass about your Excel spreadsheets!"
DGR_grants_for_heavy_industry: "Grants for Heavy Industry"
DGR_grants_for_heavy_industry_desc: "Well, uh, right. We invest in heavy industry. Normally, I would say I'm very happy about it, but... we are investing in civilian industry. Did they forget about the military? What does Szwej even imagine?\n\nBelieving that expanding the civilian industry and handing out benefits will lead us to victory is pure wishful thinking. I never expected Szwej to be so naive. Dąbrowa's strength has always resided in its military, and I cannot bear to watch reactionaries and revisionists abandon the core principles of our state.\n\nToo bad for Zagłębie, but perfect for me. Another opportunity to seize power has just presented itself, because that will surely fail, definitely."
DGR_restitution_of_family_farms_nc: "Restitution of Family Farms"
DGR_restitution_of_family_farms_nc_desc: "Smashing the entire agricultural system with a sledgehammer was bound to end this way, of course. Since ancient times, if you pissed off the peasants, you had trouble. And that's exactly how they tried to introduce forced collectivization, as if they hadn't learned from the mistakes of the last century. But we must forgive the Politburo; after all, they are so backward that they are only at the stage of the October Revolution and think Lenin is about to arrive in Sosnowiec on a Pendolino train. He won't, because it doesn't stop there.\n\nWe must now backpedal on these missteps and, at least for the time being, partially restore private farms, return the land, and let people manage it once again. Otherwise, it would be quite hilarious if a communist government were overthrown by a peasant revolt. I'm almost tempted to see it happen... but oh well. We need to go back to the old model and introduce the new one slowly. Otherwise, we'll all starve to death."
DGR_inspection_for_hygiene_and_crop_quality: "Inspection for Hygiene and Crop Quality"
DGR_inspection_for_hygiene_and_crop_quality_desc: "Crop quality inspections? Farming hygiene? Who the fuck cares about that? At this point, I believe that they completely lost their minds. Inspecting the size of a potato? Measuring it?! That's what they do instead of diverting the resources to the military?\n\nThe party wants to compel producers to change their fertilizer mix if it doesn't align with new government guidelines. I don't know how it can be effective or do any good for the nation. Crops are crops, and we already have enough. I haven't seen any hungry people. What's the problem then? I mean, they just lost their minds, and that's it. "
DGR_special_commission_for_combating_sabotage_nc: "Special Commission for Combating Sabotage"
DGR_special_commission_for_combating_sabotage_nc_desc: "Economic sabotage is not just about people who show up at a factory and set it on fire. It is also about people who do not perform their jobs properly, or corporate secretaries who do not adhere to the political standards of our state. It is any person who consciously decides they will not fulfill the economic plan, or who ignores requests to put real effort into their work. Anyone who exposes a plant to losses through their ignorance or stupidity is contributing to the sabotage of the state. And whether you stand or whether you lie, you're getting a beating and that is why.\n\nThat is why we are establishing a special commission to combat manifestations of such sabotage, which will have virtually a free hand when it comes to enforcing anti-sabotage discipline among industrial plants. Unannounced inspections, surveillance, stings - whatever achieves the goal. And the goal is professional and conscientious work, with no room for mediocrity and greed; we are all working for the common good. We will station several special commissioners with operational capabilities in every industrial center. This way, we will very quickly spread a sense of discipline among all the slackers."
DGR_war_enrichment_extraordinary_tax: "War Enrichment Extraordinary Tax"
DGR_war_enrichment_extraordinary_tax_desc: "How can an army work properly if it can't get a share of war spoils? Taxing, registry, who the fuck came up with that, huh? For years nobody had anything against it and now they are changing the narrative trying to say that military is reactionary? Such bullshit!\n\nEveryone knows soldiers, officers, and generals deserve something as a reward for their hardships, and, truly, finding a new way to bureaucratize everything is so stupid. But yeah, I guess it's what those apparatchiks do. Soon, the whole army will be on my side; my vision must prevail!"
DGR_viii_five_year_plan: "8th Five-Year Plan"
DGR_viii_five_year_plan_desc: "Economic plans may be cool in theory, but they're mostly a pain in the ass. Instead of chaotic investments in whatever the global economy throws at us and all those theories about supply and demand, we're executing our own chaos, just under the cover of a perfectly crafted scheme. The capitalists are laughing at us now, because, of course, you can't really decide in which year to build which sectors of the economy. Well, I say you can, but what do I know - we already did it. And I still don't fucking care about the liberals and their damned economic school. Fuck'em. We know what we did wrong before, and we still know what people need. We will now steer to complete the eight Five-Year Plan in Polish history. The seventh one was less than satisfactory. But that's because of the war. If it wasn't for that - we would be already thriving."
DGR_price_yield_operation: "Price-Yield Operation"
DGR_price_yield_operation_desc: "They can't learn from their mistakes, right? Drastic increases in the prices of convenience goods will only result in a wider population getting poorer. The wage compensation is always smaller than the said increase, so all they do is shoot themselves in the foot.\n\nWho could have guessed, damn bureaucrats. Their actions against people will soon give me a chance to strike. The general population sees their dumb decisions and will stand by my side. Soon, shelves will be empty, and hunger will strike, protests in every major city... oh yes, everything goes according to plan."
DGR_apply_for_foreign_credits: "Apply for Foreign Credits"
DGR_apply_for_foreign_credits_desc: "Szwej and his morons decided to follow Gierek's footsteps. Applying for foreign loans, as it could result in something good. They are so dumb. Not only will it weaken our economy, but it was the main policy that caused the collapse of communism in Poland.\n\nI'm starting to believe they are just a bunch of revisionists trying to destroy what I built in Dąbrowa. Everything is built on loans, what a joke. Who will pay it off? Us, the military? Not to mention that capitalists won't even bother to help us. It's all one big treason, big treason it is."
DGR_state_crop_purchase_price_list: "State Crop Purchase Price List"
DGR_state_crop_purchase_price_list_desc: ""
DGR_food_industry_innovations: "Food Industry Innovations"
DGR_food_industry_innovations_desc: ""
DGR_internal_export_company: "Internal Export Company"
DGR_internal_export_company_desc: "The party wants to reinstate Pewexes. In the face of an impending, monumental conflict, they decided that providing citizens with luxury goods was an excellent idea. I mean, isn't that kind of treacherous? Why do we need to provide goods from the corrupted West while people have everything here?\n\nIrresponsible decisions will only bring chaos and weaken our chances to defeat traitors. Pewexes were reactionary and revisionist ideas of old communists. Why do we repeat their mistakes? It will only bring doom to this nation. I hate it so much that I can't do anything!"
DGR_high_speed_state_rail_lines: "High Speed State Rail Lines"
DGR_high_speed_state_rail_lines_desc: ""
DGR_revival_of_automotive_industry: "Revival of Automotive Industry"
DGR_revival_of_automotive_industry_desc: "I think that creating our own automotive brand for citizens wouldn't be such a bad idea. Yeah, wouldn't be. We are at war, and instead of investing in the military, they think of a car brand? It's ridiculous! They want to invest millions in reopening old factories while we stand vulnerable against our enemies. In addition, this new scrap will probably be as unreliable as Maluch was. Why are we wasting money on that, huh? Let's invest in aviation or tanks, not in something that won't work either way!"
DGR_state_depots_of_strategic_stocks: "State Depots of Strategic Stocks"
DGR_state_depots_of_strategic_stocks_desc: "Strategic reserves that are centrally registered and distributed under supervision? Hello, can't nobody see what's really happening?! By that, they want to limit the military, I know it! I saw right through their plans. They never cared about us, people who are fighting for nation's preservation. All they want is to steal our reserves and take them for themselves. I wonder what Szwej will do with all that money, build himself a nice dacha on the outskirts of Katowice? Probably, yeah. I don't believe at all in their generosity to the people. The general population won't see a dime of that money spent on whatever!"
DGR_atomic_heart_nc: "Atomic Heart"
DGR_atomic_heart_nc_desc: "It took decades of planning, countless hours of consultation with the locals and myriad of boards in councils that drenched the budget to finally... have one small research reactor in Otwock. The stalling in this matter is fucking humiliating.\nPoland was once on the right track of harnessing the power of the atom, but alas, the Eastern Bloc collapsed, and the newly established regime, constrained by the capitalist ideology of profit and realities of bourgeois democracy, proved unable to finish what we started. Now that the patriots are once again in control, free from the restrictions of the previous system, we can pick things up where we left off."
DGR_ground_stabilization_nc: "Ground Stabilisation"
DGR_ground_stabilization_nc_desc: "Now for the mundane part. The terrain near Dąbrowian Ząbkowice had been chosen as the ideal place for the nuclear power plant. Before the Fall, the areas around Dąbrowa Górnicza were pitched as one of the potential locations for a small modular BWRX-300 reactor. But of course, we don't do small, but that creates some additional difficulties caused by the sandy terrain in the area. Even Szwej doesn't want to build his house on literal sand, so he ordered to have the local forests cut down and the sandy grounds stabilized. So there's that. I still don't know why build a plant in a place where you need to fill the ground with steel beams and cover it with cement instead of... anywhere else."
DGR_1st_special_guards_unit_nc: "1st Special Guards Unit"
DGR_1st_special_guards_unit_nc_desc: "Despite the monumental effort it will require, the facts are that we need this reactor, and it's good that it is being built despite all the mishaps. It's also easy to predict that once it's raised, it will become a primary target for our enemies both inside and outside our borders. If so, it has to be under constant guard by our most elite soldiers. A whole ne battalion stationing nearby will be needed to secure the perimeter. Our best people have the honor of protecting what would hopefully become the robust beating heart of our electric grid."
DGR_contacts_in_the_east_nc: "Contacts in the East"
DGR_contacts_in_the_east_nc_desc: "A task as great as the construction of a large-scale nuclear reactor can be undertaken alone. We need the help of powerful countries that look favorably on our cause and are willing to send us their know-how, materials, and funds. As the West and its rotten elites are unwilling to help build welfare, we are forced to turn our heads eastwards, trying to fit into the game between hemispheres. Our plan is to reach out to the elites who sympathise with anti-Western cause and help us reintroduce the socialist technical thought of the past and synthesize it with innovative practices of today to help us build a prosperous, nuclear-powered future."
DGR_send_szwej_to_moscow_nc: "Send Szwej to Moscow"
DGR_send_szwej_to_moscow_nc_desc: "It's been a long time since Poland and Russia were embraced in the 'brotherly embrace'. Few people believed it then, even fewer believe it now. The memory of our common past is still alive in Moscow though and Szwej still has some contacts that could lobby for us in Kremlin... if said contacts haven't ended up in nursing homes that is. Those that still hold some power within the state apparatus are usually far away from the highest echelons of power, but their voice still have a lot of weight in the Russian deep state. We hope that the great Russian nation that once elevated the Eastern Europe to Atomic Era, will once again pick up their historical mission. It's a long shot as the Navalny's government tries to break the ties with the past, but it's our best chance to realise our ambitions."
DGR_purchase_rbmk_nc: "Purchase RBMK Reactor Plans"
DGR_purchase_rbmk_nc_desc: "You know how the joke goes:\n'Is it true that they give away top-notch nuclear reactor plans in Moscow?!'\n'It's true, but not in Moscow, but in a dacha near Yekaterinburg. They don't give them away, but demand an unequal trade treaty. And those aren't top-notch reactors, but those responsible for the Chernobyl disaster.'\nWell, here we are. The higher-ups repeat Russian marketing that, under proper maintenance and supervision, the RBMK reactor should work adequately and safely. Yeah, right. Just as I thought Szwej could achieve something, he returns with this kind of shit. Oh, well, let's profit from the nuclear energy while it lasts. As for me, I'll stay as far away from this reactor as possible."
DGR_chinese_business_nc: "Chinese Business Ventures"
DGR_chinese_business_nc_desc: "Let's be honest: It's been a long time, since Russia's been playing the first fiddle, when it comes to the eastern hemisphere. Right now we need a new power that can is willing to support any non-liberal country - China. Trying to convince their leader should be a lot more straightforward, once we praise them for their championship of workers' cause and assure them on our anti-Western outlook. A promise of establishing a regional office of Confucius Institute would also help. Of course the diplomatic effort to Far East would require of us more than just a 0,7 Liter of vodka and a reminiscent talk about old times. We'll need a qualified diplomat, well-versed in speaking Chinese, prestigious delegation and at least 2 Liters of vodka!"
DGR_uranium_smuggling_corridor_nc: "Uranium Smuggling Corridors"
DGR_uranium_smuggling_corridor_nc_desc: "They should've brought 4 liters... The Chinamen agreed to supply us with resources, but instead of establishing a new Silk Road, they offered us a Silk Tunnel. Citing troubles with transportation and 'peculiar international position of the National People's Republic', they claimed their country was unable to officially supply us either by land or by sea. Instead, they offered us help with a smuggling operation through Russian lands. Not an ideal solution, that nevertheless has its perks. Since we already have to rely on smuggling uranium, we may as well expand our operation and gather other resources on the fly. Nothing as spectacular as the Uranium, but every old piece of weapons and chemical ingredients for explosives will also be a great addition to our convoys."
DGR_create_pogoria_v_nc: "Create Pogoria V"
DGR_create_pogoria_v_nc_desc: "Already, the problems arise. It is known that nuclear-based power plants, just like their coal-based equivalents, need water to function. It would be best to have a river (bigger than Trzebyczka) or a water storage reservoir nearby. As it turns out, the Pogoria reservoirs are a bit too far. Changing the location of the power plant at this point would be problematic, and it wouldn't do us much good; The terrain around Pogorias is even more inhospitable as the reservoirs were created when they filled the old sand mines with water. At this point, it'd be better to dig and create one more Pogoria reservoir to supplant our future plant. Even if we don't have conviniently placed obsolete mines nearby to pour water into."
DGR_advanced_staff_training_nc: "Advanced Staff Training"
DGR_advanced_staff_training_nc_desc: "Does anyone know how this thing will operate? I thought so. We have some theoretical physicists, but we lack practitioners to operate the future plant and instruct new engineers on how to deal with the nuclear power plant. Even if there are enough Polish specialists, they're scattered around the country. We will once again need the help of the Russians. It's only a temporary measure before we achieve a steady influx of home-grown specialists. Let's just hope by this time the Russkies won't mess things up too badly by the time the training's done."
DGR_zabkowice_nuclear_power_plant_nc: "Ząbkowice Nuclear Power Plant"
DGR_zabkowice_nuclear_power_plant_nc_desc: "It works? It works! I may have been too harsh on this whole effort. The unsuitable terrain, the alcohol-stained Russian plans, the lacking cadre fed my scepticism, but here I stand admiring the finalization of the construction efforts. I can say many bad things about the communists, no matter what coat of paint they were, but they've once again proven they can, if they want, build the infrastructure necessary for the strategic longevity of the state. Let's hope that Poland, no matter the administration, will prosper thanks to the affordable energy the Ząbkowice Nuclear Power Plant provides."
DGR_expansion_of_the_red_army: "Expansion of the Red Army"
DGR_expansion_of_the_red_army_desc: "Another year, another step towards our nation's inevitable liberation and advancement of its working people... assuming the Politburo and other paper pushers won't turn them to chase their own tails. Before they get uppity again, and to take on greater foes still, the Red Army must grow, multiply even. We need guns and men to wield them. We need spirits and shovels. This country does not stand on bureaucracy and philosophising by pricks who never lived in worker's society before, but on rifles of the working people. \n Lucky for us, all the philosophers have fled already, and all the men are still with us."
DGR_national_people_navy_nc: "National People's Navy"
DGR_national_people_navy_nc_desc: "...I hardly have anything to add to this. As if the Politburo's stupidity wasn't apparent enough their newest suggestion, one that, as they claim, 'will prove to be detrimental in the future conquests', that being the idea to fund a NAVY. Based around rivers. IN A LANDLOCKED COUNTRY proves it all just too well. The overall plan is to build a small freshwater navy capable of patrolling the riverline and disrupting the enemy supply chains and troop transports through the afformentioned bodies of water that is still versatile enough to be later on repurposed as the main backbone of our seafaring fleet. Does it make even the slightest bit of sense ? No, it does not in my book. But unless we don't want to secure extra funding we'll have to listen to dance for these braindead amoebas for a little bit."
DGR_przemsza_program_nc: "Przemsza Program"
DGR_przemsza_program_nc_desc: "I walked by the Kuźnica Warężyńska Reservoir today, watching these waterlobes try out their new experiment. They call it the 'Przemsza Program' - the idea of it is to use preexisting small ships and tinker with them until they stop sinking or exploding and actually become viable light warships. Every single time so far, they're either too overtuned, or too overencumbered, or not maintained well enough, or whatever other reason they're using now to justify the bottom of Kuźnica looking like the aftermath of a sea battle without a shot fired. Sucks to be the suckers whose boats they confiscated for testing, but it makes for a nice spectacle whenever you walk by and see another one burst into flames and hear the eggheads cursing from far away. ...The boat didn't sink or burn today..."
DGR_warta_military_shipyard_nc: "Warta Military Shipyard"
DGR_warta_military_shipyard_nc_desc: "So this is where the accursed plan to build a military dockyard will take place. I'll say, I'm glad they didn't try their bright idea on even smaller bodies of water before, though it'd be very comical to see the Politburo's stupidity on full display like that. Still, the Warta's infrastructure and access to a (semi-decently.) big body of water to test our ships upon in the form of lake Jeziorsko is the best we can do before reaching the Baltic Sea itself (and absolutely above Pogoria in...any parameters to be honest), and I suppose that it makes at least a little bit of sense to prep up to it before we get there, even if in my opinion it's still just a waste of money that could go to LITERALY any other branch we have. Seriously, we're not running on manifestos and promises, Szwej!"
DGR_first_npn_flotilla_nc: "First NPN Flotilla"
DGR_first_npn_flotilla_nc_desc: "I'll be damned. It actually....worked out ? I've heard today that the naval advancements of ours have allowed us to launch three new Przemsza class ships. Have I really underestimated the navy this much I didn't catch it growing so fast ? How the fuck ?! Oh well, a surprise to be sure, but a welcome one. It means all these high investments into it weren't fruitless, and now it's just even more power against the remaining rabble of Poland. I should be happy, but I can't not feel like the commies have pulled a number on me, even if they didn't know it..."
DGR_metalowiec_gunboat_nc: "Metalowiec-class Gunboat"
DGR_metalowiec_gunboat_nc_desc: "The (unfortunate to my psyche) success of Warta shipyards means that we can now double our efforts when it comes to the production of their freshwater fleet Politburo fantasizes so much. And now that we are reaching larger and larger bodies of water it doesn't even seem to be that bad of an idea anymore. Still, I think they're overfixating themselves on what's at best just an addition to Dąbrowa's real power, which lays elsewhere, clearly beyond their sight. I'd show them where that place is but if I start they'll just start ranting about how I was wrong about the navy. Let me tell you something you cunts, I was NOT WRONG, and you're all just finding even the smallest thing to point at me and laugh! Because you're so pathetic you cannot find any actual flaws of mine that aren't quindecupled in yourselves! ... Yeah, anyways. More gunboats it is I suppose..."
DGR_pogoria_class_monitor_nc: "Pogoria-class Monitor"
DGR_pogoria_class_monitor_nc_desc: "For all my dislike towards Pogoria and the waterphiles working there, I can't, and it pains me a lot, say that their efforts didn't turn out to be successful. Eugh, I thought I'll throw up saying it... Nevertheless, the navy is working on moving to some actual large ships of war now, and they proposed to name the next iteration a 'Pogoria' class. Shameless self-glazing if I ever saw one, but for the fucking miracle of turning a landlocked state from Zagłębie into a naval power I suppose they...deserve...some... Yeah, no, I'll definitely be sick."
DGR_continuation_of_project_716_nc: "Continuation of Project 716"
DGR_continuation_of_project_716_nc_desc: "There is hardly anything interesting that can be said about project 716's continuation for the needs of the navy. It's the same old story again - it's cheaper to take and repurpose vessels than to build them from scratch. The one positive of our current state is that we don't (yet) need large transport convoys to carry our men across bodies of water. So far - even the most simple ferry will do. And thus, lo and behold - the navy actually did something by providing us with a convoy fleet of old communist 716 Cutters! ...from parts of repurposed ferries and small boats....most of which weren't even originally built by them..."
DGR_national_ground_forces_nc: "National Ground Forces"
DGR_national_ground_forces_nc_desc: "As a land power, not constrained by the large rivers or the sea, we will naturally bet on the width, berth and bulk of our ground troops. It matters that we have river-traversing vehicles, but it matters more that we have vehicles to begin with. Overwhelming and implacable in discipline and quantity, our army will never falter. For that, we need extra shifts. Scavenger duties. Everyone who can walk will work until their hands bleed. Then, I don't know, do I look like a doctor? Give em plastic gloves soaked in pure ethanol and have em work some more!"
DGR_wide_front_strike_specialization_nc: "Wide Front Strike Specialization"
DGR_wide_front_strike_specialization_nc_desc: "We will descend upon our foes, we will overwhelm them, we will leave none alive. For that we need one of two things: Either people in orbit ready for deep strikes, or a doctrine of wide front strikes. Our entire border is a frontline with no natural barriers. We must cover and utilize all that ground, cover it with people's armored vehicles, and eventually, watch it be enveloped and swarmed by our masses."
DGR_ideological_motivation_imperative_nc: "Ideological Motivation Imperative"
DGR_ideological_motivation_imperative_nc_desc: "To make our doctrine work, the soldier must be motivated. Filled with the spirit of socialism and worker's strugg... hahaha, yeah right! I know how our men work, unlike those eunuchs at Politburo. We fight not for money, but for the Nation. Yes, even those who dig themselves into a more regional identity. For your parents, brothers, cousins, sons. Even if they aren't with you: You'll have a family yet. And of course, whether I like it or not, for the Party and the Secretary, who pave the way of the worker's paradise for you! Or else."
DGR_people_officer_school_nc: "People Officers' School"
DGR_people_officer_school_nc_desc: "An army marches on its officer corps, its leadership, its ability to think on its feet, its... ideological robustness. One thing these fat bureaucrats have a point at is that preciesly because our worldview is so close to the two things that are poison to it: The international feel-good cool-Pole socialists and capitalist 'nationalists', we must ensure our officers are free from either error. Seriously. A nation is made up of its people, not of flags or, ugh, capital! That is why our officers must learn to wage war as lightning if need be, with allegiance that's social first, national second."
DGR_ngf_command_structure_nc: "NGF Command Structure"
DGR_ngf_command_structure_nc_desc: "It's time to set up the command districts within our regime. There must be clear military chain of responsibility and command, with every officer knowing exactly who to answer to and who greenlights their initiatives. Similar methods were employed with mixed results by Soviets and Russians, but when on proper well-planned attack, it is paramount that everyone works as one, not as individuals out for themselves. This is socialism at work, as opposed to capitalist chaos."
DGR_restandarisation_of_firearms_nc: "Restandarisation of Firearms"
DGR_restandarisation_of_firearms_nc_desc: "Only capitalist pigs can't appreciate the nostalgia of unloading a PPSH-41 drum magazine. Alas, maintaining a pepesha these days is harder than even fixing one. Hundreds of variants, ammunition types, thousands of parts... no more. The logistical nightmare is over, the dawn breaks, and with it, new standard and new uniformity arises. One service rifle, one cartridge standard, one set of parts that's as universal as possible. This will help us scale up production and maintenence alike."
DGR_every_soldier_tank_destroyer_nc: "Every Soldier a Tank Destroyer"
DGR_every_soldier_tank_destroyer_nc_desc: "Our enemies take many forms, but armored ones are what demands our foremost attention. It's not enough to let our armored vehicles duel: When facing infantry, the enemy must melt as though they face our finest cannons. Every infantryman of ours will have an anti-armor solution to work with. Every infantryman of ours will know exactly how to use it well. Every single infantryman of ours will prove his worth in value of the tanks he brings down. The enemy's armored vehicles will thus be force multipliers no longer: Each will be worth only one of our troopers, and less as we scavenge and repurpose their wrecks."
DGR_unleashing_fire_and_fury_nc: "Unleashing Fire and Fury"
DGR_unleashing_fire_and_fury_nc_desc: "Fire, fucking fury, and destruction! The carnage we will bring upon our enemies will be downright biblical. And I only mean that comparison as a source of imagery; I am no religious fool. What I do believe in is steel and lead - something our soldiers hand out left and right to all infidels and heretics of our cause. But sometimes, you just have to try harder and use a bigger gun. And if that doesn't work - keep increasing the caliber until the job is done and the enemy is eliminated. We have experience with elements of mechanized warfare and armored tactics - this will pay off when we start mass-producing all kinds of war machines. Every single battalion will be able to get their hands on these beauties, not just elite units. And please, just fucking please - let me handle this by myself. If Politburo fucks with this branch, i'm gonna be livid."
DGR_viper_program_nc: "Viper Program"
DGR_viper_program_nc_desc: "Innocent-looking armored cars can provide massive support for regular soldiers on the battlefield. Besides the ability to move fast even over rough terrain and their scouting potential - we're also packing them with quite a substantial amount of firepower. Mind you, such a car probably won't survive an encounter with a rocket launcher, but the armor does extend the crew's average lifespan, at least by a few minutes. Unfortunately, working off the blueprints of old Soviet junk, we can't really mess around with variations of the ideal modern armored car. Therefore, we will have to design something original of our own. Luckily, we have the right industrial plants for that."
DGR_new_constellation_of_star_trucks_nc: "New Constellation of STAR Trucks"
DGR_new_constellation_of_star_trucks_nc_desc: "Admittedly, not all the state enterprises that built our military are misinvestments. We have to evaluate each of the companies on a case-by-case basis. Take a look at a STAR factory. Once, it was a pride of our country that supplied our armies and even foreign ones. Now, gathering for the possible war with our neighbours, we need them more than ever. What good will we ever get from civilian buses from MAN that overtook the production lines in Starachowice? True, we still have the Jelcz factory, but that won't be enough. Especially when the Germans will try to enter Silesia once again. We need more factories in the central east. Besides, the Congress Poland still has to show the world, you know."
DGR_new_old_skots_nc: "New-Old SKOTs"
DGR_new_old_skots_nc_desc: "Now, what makes even less sense than using an obsolete, decrepit communist design that even some of the former members of the Warsaw Pact won't use? Using even older communist design that never gained that much worldwide traction, and its usage was abandoned even by one of its original co-producers. That's right, we're talking about SKOTs. While the BWPs were admittedly still used in the Polish Army by the time of the Fall, in 2010, there were only about a hundred SKOTs. Judging by the designs, it seems we'll be reusing the oldest models and not even expanding upon modernized KTO Ryś designs."
DGR_eternal_spirit_of_bwp_1_nc: "Eternal Spirit Of BWP-1"
DGR_eternal_spirit_of_bwp_1_nc_desc: "While 966 was the year that created and defined Poland, it seems 1966 was the year that created and defined its modern military. That was the year the first BMP-1, known in Poland as BWP-1, saw the light of day, and progress in the Polish military has stopped ever since. We were this close to replacing it with some new models, but the influnce of the bygone era shattered those dreams for decades to come. I try to do something about it, I point out that the BWP-1s are obsolete, used only by countries of the Second and Third World. Even some of the old countries of the Eastern Bloc got rid of it. I also try to sell completely new projects with similar names, such as BWP badger, elk, deer, roe, boar, fox, marten, raccoon dog, wolf, or lynx, but all discussions end with the same argument:\n'BWPs are fine. They swim, y'know.'"
DGR_pt_91_the_hardest: "PT-91: The Hardest"
DGR_pt_91_the_hardest_desc: "K2, huh? The Koreans can stick with music. Our armored units need to terrorize our enemies and instill national pride, the feeling that there is greatness in each Pole and within our nation as a whole. That is why we need to use our own designs. We're talking about resurrecting the PT-91 Twardy model, whose production regretfully stopped in less than a few decades.  It's a relatively modern design compared to others of our... inspirations that, with a few tweaks here and there, can dominate the battlefield once again. It's true that we don't have any fancy way to protect even the upgraded tanks from drones. But a simple mesh has proved itself on the fronts of the Russo-Ukrainian War and should be enough for now."
DGR_unified_fire_control_command_nc: "Unified Fire Control Command"
DGR_unified_fire_control_command_nc_desc: "As a classic saying goes - fuck the people who only hit you up when they need your artillery support. But in all seriousness - artillery is a very pleasant toy, but someone has to manage all of it. Otherwise, give the soldiers fifteen minutes on the battlefield and we'll have friendly fire incidents or some random village getting blown to pieces for nothing. We need highly responsible people in fire control positions, along with advanced communication tech and tools that allow for a broad overview of the battlefield. There are military systems out there right now that make the operator feel like they're playing a live-action RTS game. If we get our hands on them, nobody will ever have to fear being within range of friendly artillery again."
DGR_stationary_artillery_strongpoints_nc: "Stationary Artillery Strongpoints"
DGR_stationary_artillery_strongpoints_nc_desc: "Given the experiences from the front line, in some places the only thing you need to put in the enemy's way is a massive fucking gun, dig it in, conceal it - and blast away as much as you can. Right on cue, the high-speed fanatics are going to start whining that you can't do that, that nowadays you have to be mobile, you have to move after every shot, do fucking dodges in the bushes, and preferably do backflips while reloading. And that is total and utter bullshit - the enemy has zero reconnaissance or technology; this is literally shooting fish in a barrel. And if we do run into one that actually has those things - we'll wipe them out with our air force. In any case, a massive stationary gun will win. And it won't waste a single drop of fuel - because the damn thing doesn't need any."
DGR_advanced_mobile_fire_platforms_nc: "Advanced Mobile Fire Platforms"
DGR_advanced_mobile_fire_platforms_nc_desc: "But just so it doesn't look like all we're going to do is sit and wait, we must make up for our lack of mobility with mobile firing platforms. They will play the same role as a mosquito that flies into your room and can't find the window to get back out. We fly around, make noise, and nip at them whenever and as much as we can. The enemy will focus on trying to catch all these fast-moving little bugs while we can focus on a MASSIVE bombardment or a direct assault. Because warfare isn't about committing to just one single tactic, is it? Because if you do that, some smart-ass on the other side will immediately counter you with something you won't have a counter for, because you'll have pissed away all your money on self-propelled artillery. This way - we'll have everything."
DGR_revitalization_of_rocketry_nc: "Revitalization of Rocketry"
DGR_revitalization_of_rocketry_nc_desc: "The rocket forces during the PRL era... you have to admit, they were damn impressive. And that is yet another stain in a whole constellation of humiliations in the history of the Polish Armed Forces of the Third Republic. Because from a state that possessed rockets capable of even carrying nuclear warheads, we were left with... absolutely nothing. In Russia, the rocket forces even constitute a completely separate branch of the military, that's how heavily expanded they are there - and unfortunately, Ukraine found out the hard way that this is a devilishly effective weapon with minimal effort. You aim more or less, you launch, and you light a cigarette while waiting for reconnaissance or the air force to tell you what you hit. The perfect job, aside from the risk that if someone pinpoints your position, the entire enemy army will hunt you down. But put that aside - we must restore the rocket power we used to possess. And let's focus on that. We'll refresh the procedures once we actually build something that can fly and explode, and isn't a Russian passenger plane."
DGR_strategic_rocket_forces_command_nc: "Strategic Rocket Forces Command"
DGR_strategic_rocket_forces_command_nc_desc: "A modernization in equipment requires someone to be in command of more and more complicated machines of destruction. Take rocket artillery, for example. We need capable people who will be knowledgeable enough not only to properly use our new weapons, but also to update their expertise. A rapid progress of the rocket technology is coming that will allow us to send more and more powerful and specialised missiles. Who knows, maybe our current effort will evolve into a space program given enough time."
DGR_red_skies_nc: "Red Skies"
DGR_red_skies_nc_desc: "Say what you will, if I had to choose between a ground force that does not run out of manpower and vehicles, and an airforce, I pick the latter. Air support is crucial for breakthroughs, ambitious campaigns, protection of home industry... at least until our enemies figure out cruise missiles. We won't let them though. Our planes will blot out the sun, until the red dawn, midday and dusk alike, will be the only sky our enemies behold! Of course until some geniuses decide that we can't afford substantial funds for the air force. Then I guess we'll fucking use pigeons."
DGR_expansion_of_pzl_mielec_nc: "Expansion of PZL-Mielec"
DGR_expansion_of_pzl_mielec_nc_desc: "PZL Mielec used to be one of our greatest aircraft works. The capitalism is a cruel mistress that drained it of its life, the Fall was no better. But now, at last, the true socialist force, national people's force, will care for this fair lady. Make her voluptous and lush. Her body of concrete and steel shall make us rise with joy, as we our workers court her, bearing gifts of scrap and raw materials... and from their union, entire swarms of warbirds will emerge, fruit of their queen and our people. \n And more importantly, oblivion to our foes."
DGR_pzl_anvil_program_nc: "PZL Anvil Program"
DGR_pzl_anvil_program_nc_desc: "It'd be a shame if our enemies could churn out hardware undisturbed. We need a bomber to thwart them: That's where Anvil comes in. Everything a modern battlefleet requires of a bomber to survive and deliver, the Anvil will boast. Luckily we don't need it to deliver upon the Chinese or American Empire: Our foes within Poland are benchmark enough. Even the fat cats at Politburo might rise to such a low bar of an occasion."
DGR_rapid_response_brigades_nc: "Rapid Response Air Cavalry Brigades"
DGR_rapid_response_brigades_nc_desc: "The concept of air cavalry has always cracked me up because of how obsessed Poles are with the word 'cavalry.' Everything has to be a fucking cavalry unit; goddamn tanks are armored cavalry, helicopter drop units are air cavalry. These guys are seriously still dreaming about just drinking, screwing, and riding horses. But names aside - assault units moving by helicopter, capable of responding to even the smallest shift or breakthrough on a front line hundreds of kilometers away, is something that will completely change the face of our war. A lightning-fast, mass attack carried out by such brigades will break through even the toughest defense, and if we coordinate it well and master the operational chaos - this will be a weapon more effective than any bomb."
DGR_pzl_sickle_program_nc: "PZL Sickle Program"
DGR_pzl_sickle_program_nc_desc: "Yes, air assault forces sound good, but, sometimes you need something no less mobile that packs a heavier punch. This is where the Sickle comes in. A new prototype of a combat helicopter, designed for any and all demands of post-Fall warfare, where ingenuity and electronic disturbance work. End result will be a vicious bird of prey, harvesting anything it faces as a sickle would... at least before harvester combines became a thing. Who am I kidding? This name sucks. It's just an another example of Politburo meddling with propaganda where they should not. At least I hope that this thing will fly."
DGR_nationalization_of_pzl_rzeszow: "Nationalization Of PZL-Rzeszów"
DGR_nationalization_of_pzl_rzeszow_desc: "Another birdhouse under our care. Another monument to the failures of capitalism. Another 'system', for the bureaucrat curs to make theirs once the nationalization papers will be signed. This nation teaches you one thing: How to deal with bureaucracy. You can't avoid it. But you can give PZL Rzeszów to the people and watch the People's armies swell in the skies."
DGR_pzl_hammer_program_nc: "PZL Hammer Program"
DGR_pzl_hammer_program_nc_desc: "The capitalists will have you know that contemporary air superiority aircraft is strictly a task for the wealthiest and mightiest nations, whether China or Russia or the Great Capitalist Satan, USA. Today, we head to the drawing board to conceptualize and prototype PZL Hammer, to prove those pigs wrong. Agility, resilience, mastery of our skies: This is what the Hammer will assure. Its missiles will swat foes like flies. Its mighty cannons will eat them alive. Its fuselage will combine the power of steel with lightness of an underfed child under the darkest days of Polish capitalism. And the best part? Vaccum tube electronics that shrug any EMP pulse like it's nothing!"
DGR_special_purpose_forces_nc: "Special Purpose Forces"
DGR_special_purpose_forces_nc_desc: "Special Forces have always played an important role in the arsenal of Polish People's Republic, so the Politburo obviously wants them to be brought back with the same symbolism they used to have: They were present during every suppression of strikes and riots until the very end and have always protected the Republic from hidden enemies of the state, even after its fall. It would be, in their eyes, dishonorable (and for me - just not wise strategically) for us not to bring them back so that they can once again serve. While the idea of making them a glorified socialism propaganda machine disgusts me personally the need of spec ops is there, so we may as well roll with it. We'll see how strong the sense of 'communist heroes' image is in them, though."
DGR_maroon_berets_nc: "Maroon Berets"
DGR_maroon_berets_nc_desc: "As if seeing communists every day wasn't enough of a fucking curse, now they're gonna be disgusting the sky with their existence as well. 'The idea of creating paratrooper forces was discussed widely today at the Politburo and, as they are absolute birdbrains themselves, they have decided to go all in on the investment in spite of us hardly being able to get our propeller junk off the ground itself!' was what I was originally thinking after the meeting, but, to surprise of everyone with half a functioning brain (so none of the Politburo) the paratrooper excersises turned out succesful. Too successful. I cannot even stare into the sky now without having to imagine a Szwej's squad flying through it, and it ruins my day immediately."
DGR_green_berets_nc: "Green Berets"
DGR_green_berets_nc_desc: "Poland is, in a very large part, forests and wilderness, the likes of which you usually shouldn't be entering unless you're a Girl Scout or a professional ranger, or both. None of the two are at our disposal in large enough numbers, but with our training combined with the commies' unforgivingly large numbers, we can try to muster up some professional pinecone eaters of our own. At best, we'll see if some of them can still be saved from the communist poison they have in their skulls, and at worst, suicide missions exist for a reason. Either way, it's profitable for us, and it's a field we can flex our muscles on when the Politburo donkeys are watching."
DGR_restore_the_commandos_nc: "Restore the Commandos"
DGR_restore_the_commandos_nc_desc: "Finally, after who knows how long, my efforts to secure more funds for the spec-ops paid off, and we can now form our commando brigades with everybody involved. From our peak in condition (as always), rangers through dubiously necessary but at least effective marines to even the thick-headed paratroopers, everyone got their spot. If these imbeciles had listened to me earlier, we would have naturally been able to do even more than what we can now with the funding increase on a level rivaling that of the monthly salary of a local janitor. Still, even the slightest acknowledgement of our peak performance in the eyes of the blinded-by-red-star buffoons and thus, even if marginal, their increased interest in this program is better than what you can usually expect from them, that being damn nothing. They can rest assured - we'll take good care of these banknotes."
DGR_special_industrial_group_nc: "Special Industrial Group"
DGR_special_industrial_group_nc_desc: "Alright, apparently it needs to be spelled out to them - SPECIAL FORCES AREN'T MEANT TO USE GODDAMN FORKS AND SPEARS. Apparently, the idea of 'SPECIAL FORCES' using something at least slightly more refined than the equipment of a random miner on a strike just cannot cross their mind. And yet, this attitude of the Politburo and the apparent scarcity of equipment can still benefit us in a way these numbskulls couldn't possibly consider. Given our location at the doorstep of Poland's largest agglomeration (or should I say abomination), Close Quarters Combat is something we should actually strive to perfect, even if it means bashing our opponents with machetes or bats. And even that, coupled with a good enough number of armored support, should be enough to at the very least buy us enough time to bring some actually relevant forces into the area."
DGR_urban_sabotage_battalions_nc: "Urban Sabotage Battalions"
DGR_urban_sabotage_battalions_nc_desc: "The nature of our situation is that we are hardly ever going to fight an enemy without a fairly developed industry and urban sectors. If our wars so far taught us anything, it's that in order to beat your enemy, you need to make sure you have the advantage before you pick a fight, and what's better at making sure that's the case other than making your opponent's biggest advantage their nail in the coffin ? The urban landscape isn't alien to us - we're from Dąbrowa, for fuck's sake, but through a series of very specialized trainings (as much as it's possible with this terrible budget.) we can prepare our militia to perfect traversing through highly built-up areas and our heavier weaponry to precisely pick off the most important structures and apparatus instead of firing more or less blindly in the enemy's general direction."
DGR_blue_berets_nc: "Blue Berets"
DGR_blue_berets_nc_desc: "'Formoza', named after a popular torpedo factory in Gdynia, was a branch of Polish saboteur divers within the navy of the Polish People's Republic. While our reliance on the Navy is slim compared to the other branches of special purpose forces, their expertise and potential for the future so far make up for it. Because of this, recreating this branch, the Marines, and funding them is, according to the central committee, the right course of action. With enough support, who knows, maybe these old sponges are right, and the new marine forces will turn out not to be a waste of time after all."
DGR_national_unity_front: "National Unity Front"
DGR_national_unity_front_desc: "Oh, they're so afraid. One small taste of a real revolution, and those cowards start huddling together to avoid the storm. We had a good thing going. I would've gotten rid of every single traitor, every single danger to the people's liberation. But of course, the forces of reaction had to come reeling and prop up a corpse instead. Unity front... unity... what they're really doing is trying to dilute us among the revisionists, social fascists, and the worthless apparatchiks. Anything, of course, anything to keep their fucking heads from ending up on the spikey tip of a bayonet. They think they can stop us. Stop me. How foolish. They've just shown their true colours. We'll break them from the inside, and once we are done, the list will have gotten much, much longer. They cannot reverse what has already begun. The revolution will come for them all!"
DGR_security_committee_nc: "Security Committee"
DGR_security_committee_nc_desc: "Life is nothing without security. Sure, everything can seem normal on the outside; you might have a job, a family, things all figured out, but the constant gnawing thought that it could all come crashing down through the work of a few... unwanted elements will eventually be enough to drive you to insanity. All I want is to take that burden off the people's shoulders - take care of their worries so that they can enjoy their lives with a carefree attitude that 'freedom' just cannot provide. Because freedom without security... well, that's just anarchy, and we can't have that. Giving the state a monopoly on violence ensures it will stay out of the minds of the common folk. So, no need to fret over it."
DGR_progressive_juvenile_prisons_nc: "Progressive Juvenile Prisons"
DGR_progressive_juvenile_prisons_nc_desc: "Ah, the beauty of youth. Those were the days. I still remember them so vividly. Back when 'riot against the system and break as much as you can in the process' was all the ideology you needed. Our teens today are no different. The future of the nation. Pah. The apparatchiks want to turn them into model citizens, but we all know how that's gonna go. They're rebels, contrarians - a burning flame of constant rage that cannot be put in a school uniform and told to regale party officials with tales of their scientific achievements. The National People's Army regularly opens its doors to these vagrants, but we can only offer an outlet to those willing to cooperate. Others will have to be broken in. Re-educated with the right values so that their anger serves the purposes of the revolution. Some might just require a bit more breaking first..."
DGR_recreate_ormo: "Recreate ORMO"
DGR_recreate_ormo_desc: "So, looks like we're no longer the only enforcers around here. Seems the party's had enough of the constant lawlessness on the streets and decided to join in the fun of putting down the rabble. Would've been better to keep it in our own hands, but eh, plenty of troublemakers to go around. That way, we can keep our eyes focused on the bigger prize - the real battles to be fought, rather than delegating half of the Army's personnel to care of police work. Honestly, at this point, a strike or two would be welcome. It would be nice to see what these guys are made of; check whether those batons are just for show. The only thing I'm worried about is - that's some pretty sweet gear they're being funneled. Some of this stuff, even we don't get. Feels like a sidelining if I've ever seen one. For their sake, it better not be."
DGR_administration_committee_nc: "Administration Committee"
DGR_administration_committee_nc_desc: "Honestly, we've had it up to here with administrative bloat. Rules, regulations, parallel systems... all existing to inflate the egos of a soulless bureaucratic class clinging to relevancy by being the only ones still able to follow and interpret the thousands of minuscule provisions they've set up to confuse the uninitiated. In the end, you've got mountains of paperwork to process a single waiver that could have been handled in five fucking minutes because it all needs to comply with some statute from seven generations over. What the system needs is a direct shakeup, and not just a single one. It needs to be shaken up every time it gets too comfortable, every time it solidifies, so that it remains a constant, dynamic fluid. I will beat the bureaucracy into a pulp so that when any request is put into it, it doesn't have to be shaped to fit the procedural mold; it's the system that will take form around it to allow it through."
DGR_establish_the_federation_council: "Establish the Federation Council"
DGR_establish_the_federation_council_desc: ""
DGR_ministry_of_recovered_territories_nc: "Ministry of Recovered Territories"
DGR_ministry_of_recovered_territories_nc_desc: "The lands we liberate are full of traitorous wretches constantly itching for the defeat of our movement. At best, they passively despise us. That, I can tolerate. It's the ones who take up arms that are the real problem. Sure, it's barely a hassle to put down the occasional uprising. It's good exercise for the troops; it keeps them from growing stiff in between campaigns. However, while the stick's a great tool, even it breaks when used too often. Sometimes, the carrot comes in handy as well. The people might hate everything we stand for, but if they believe us to be the only way of restoring stability to this godforsaken country, of actually being able to change something for the better, they'll eventually learn to shut up and go along with the party programme."
DGR_civilian_corps: "Civilian Corps"
DGR_civilian_corps_desc: "There's no such thing as a civilian in the middle of a revolution. We're all combatants, one way or another. Whether in the classroom, the hospital, or in some damp, dimly lit office, you're still part of the vanguard. That's why it's soldiers that we need in there, not milquetoast clerks who, while nicely trained to recite theory when needed, and under direct orders to serve the party, and party alone, have never seen a lick of the real fight. Their sheltered, pretty faces treat their mission as some sort of bureaucratic directive. The ideological checklist says to promote certain values, so promoting these values is what they will do. Beyond that, they're empty husks whose fervor is nothing but performative. Any such offices should be reserved for those who fought on the front lines and risked their lives for what they claim to believe in."
DGR_invest_in_public_healthcare_facilities: "Invest in Public Healthcare Facilities"
DGR_invest_in_public_healthcare_facilities_desc: "The medical cabal has always had a tendency to play god; deciding who gets to live and who dies without care when they're no longer contributing funds to the system. Even then, they'd probably squeeze them even further in those last days. In a capitalist system, the doctors' financial incentive is to keep the patients sick for as long as realistically possible. After all, a cured patient means the loss of further revenue. Medicine should be a service. No more inflated salaries and cozy private practices, just laborious self-sacrifice for the good of the nation. The few doctors who adapt to this unforgivable disrespect of actually being forced to do their damn jobs will be allowed to keep their positions. But if we see even the smallest sign of trying to unfairly profit off their work beyond the state-provided salary, their licenses will be permanently revoked on the grounds of moral bankruptcy until only the ones with a true calling are left."
DGR_expand_social_welfare_programs: "Expand Social Welfare Programs"
DGR_expand_social_welfare_programs_desc: ""
DGR_energy_committee_nc: "Energy Committee"
DGR_energy_committee_nc_desc: "The energy sector manages crucial strategic resources that need to remain within state control. We didn't take it back from the grubby hands of the oligarchs just to hand them back the keys. Instead, they think they can strongarm us into purchasing power from the global market, turning Poland into just another puppet. And if we disobey, they'll threaten to turn the lights off. No, I won't even entertain the notion of selling off our independence. I'd rather drag our tanks into combat myself than have them run on foreign oil. Our coal deposits might be stretched thin and alternative fuel technologies underdeveloped, but so be it. We'll tighten our belts until the power grid's ready to handle the needs of our citizens. We can just... I don't know, drop some panels in the middle of Błędów Desert or something. Expand the power plants. It's not my job to figure that out anyway. They have experts for that kind of stuff for a reason."
DGR_open_up_to_alternative_power_sources: "Open Up to Alternative Power Sources"
DGR_open_up_to_alternative_power_sources_desc: "You want to know my opinion on this so-called 'Alternative Energy'? Fine. It's a scam; that's what it is. A massive, ineffective fraud peddled by the Western liberal-banker class to siphon cash from mindless investors because, oh no, the planet's burning, and it can only be saved if you invest billions into a giant fucking spinning windmill. But no, no, that's what we're going for. That's what those ‘experts' over at the Committee say we need more of. Say hello to a Poland running on the power of the elements and the hopes and dreams of environmental lunatics. I swear, they better not build their windsticks anywhere close to our bases, because, what a shame, some stray explosive shells will 'accidentally' knock them down during training. Unless they somehow end up building a nuclear reactor; it might not be the best idea to detonate that."
DGR_union_of_the_hard_coal_nc: "Union of the Hard Coal"
DGR_union_of_the_hard_coal_nc_desc: "This comment is going strictly off-record, but a miner might be even more of an insufferable brat than an environmentalist. I swear, these people want so many privileges; they want to be treated like society's elite for just swinging a pickaxe around. Mindless proles, thinking they're kings while living worse than literal slaves. At least those have regular access to the sun. We won't allow ourselves to be bullied by such a pathetic class of people. The extraction targets will be centrally set, as will be the management of the existing mines. If the miners don't like it, they can join a trade union and collectively proclaim their grievances... a state-sponsored one, of course, where the only thing they can proclaim is their love of the People's State, since we banned independent unions. Those have been historically untrustworthy. Soon enough, they'll understand their place is lower than dirt."
DGR_ideological_committee_nc: "Ideological Committee"
DGR_ideological_committee_nc_desc: "Is that really what they're trying to fight us with? Brochures? Flyers? Hours upon hours of obligatory meetings, analyzing their 'doctrine' like it's some sort of unquestionable religious dogma? As if the magical fucking passages of some hundred-year-old book will summon some esoteric force of pure communism and then, only when the entire room believes it with equal fanaticism, will the people finally become free. The country still suffers under the judeo-capitalist grip, but noooo, let's waste our time on some study circles instead! We need to act. The people need to fight. The struggle continues, and I will not let it be mollified because another breed of dinosaurs keeps clinging to their favorite lecture. We will send over some irrelevant proxies, but the leadership will not allow itself to be sidetracked by this ideological nonsense."
DGR_office_for_religious_affairs: "Office for Religious Affairs"
DGR_office_for_religious_affairs_desc: "The time has finally come to crush the biggest reactionary behemoth in the entire land. The blood-leeching parasite that has drained the Polish peasants for an entire millennium. The rallying point of every single counterrevolutionary dissident. It's a disgrace we've allowed the Church free rein for so long. That changes now. The official party line they gave us is - 'make sure they know to keep their mouths shut'. Oh, we're gonna do so much more than that. We'll take back every single valuable stolen from the people! We'll make justice for the centuries of exploitation! We will make the priests regret they ever dared to speak out even as much as a word against our movement! And if they stand in our way, if they want to have another crop of martyrs, then martyrs we shall give them! If the party wants to control the Church, I'll make sure there's nothing left for them to keep around."
DGR_myth_of_the_prl: "Myth of the PRL"
DGR_myth_of_the_prl_desc: "The old days... The walking fossils within the party keep harkening back to them like it's some lost communist utopia. 'We all got a state-sponsored apartment, and a free car too...' 'You know, comrade Bargieła, life was so much better then...' No, I do not remember those times, but the more they keep repeating it, the less I'm inclined to believe them. If things truly were so perfect, why did this supposedly glorious People's Republic collapse, and why did they allow it to do so? Why did nobody defend the socialist paradise to their deaths when the capitalist robber barons came knocking? Nostalgia is a weak tool, a pathetic one. Reactionaries keep it in their wheelhouse and evoke it to reverse any real change. How pitiful that we have fallen prey to it as well."
DGR_intelligence_committee_nc: "Intelligence Committee"
DGR_intelligence_committee_nc_desc: "On the face of it, establishing a centralized intelligence committee is a rare step in the right direction. We are surrounded by traitors, both outside and within our inner circle. We need to know which little weasels have been relaying our moves to the global capitalist cabal itching for every opportunity to dismantle the progress of the Polish people's liberation. What I genuinely cannot fathom is why, then, they voted to keep the control of such an institution away from the only organization whose loyalty is without question? They know the army would make short work of any traitors, but instead, they'd rather keep it run by party apparatchiks. Perhaps they have something to hide? Some double loyalties they don't want us to discover? Even without those tools, the army will conduct its own investigations, and if we find even a sliver of compromising material about our so-called 'comrades', I will personally bring them before a tribunal!"
DGR_secret_collaborators_on_every_street: "Secret Collaborators on Every Street"
DGR_secret_collaborators_on_every_street_desc: "They've planted their own men everywhere. They think they can hide, but I see them. It's hard not to, given there's always someone around. Plainclothes, sitting on the same benches for hours, pretending to read the Tribune. Always the Tribune, too, for some reason, as if it's some standard-issue piece of work equipment. That's part of what gets you. You think you've gotten a good read on the situation, that you can tell who's who and when the coast is clear to speak out your mind, but every time there is someone else you forgot to account for. Listening in. Snooping around. I can just tell they're watching me with extra vigilance. Whoever's in charge of the new intelligence committee must be part of the same block that finds our ambitions 'problematic'. It seems they're looking for any sign of straying from the party line. Any justification to move against me. I won't give them this opportunity."
DGR_foreign_tech_espionage: "Foreign Tech Espionage"
DGR_foreign_tech_espionage_desc: "Lately, my forces have received a flurry of new designs - schematics passed on from the intelligence committee. In a number of crucial spots, they've retraced over the original blueprints to hide the obvious. What they're giving me- this supposed 'technological leap for the military and civilian sectors'-is nothing but stolen equipment. Are they really that inept that the best they can do is ape the innovations of our enemies?! Where is their national pride? How are the Polish people meant to achieve self-sufficiency if we refuse to develop our own technological base? So, what's their plan for later, huh? We take back the country and then what? Beg the foreign industrialists to keep trading their new designs so we can have a hope of keeping up? They'll make us sign away our rights, our independence... in time, we will be slaves to them again."
DGR_media_committee_nc: "Media Committee"
DGR_media_committee_nc_desc: "Control of the media. Finally, something I can get behind. For decades, the Polish people have been exposed to the barrage of lies spewed by networks funded by global capital. They've been fed so much propaganda that this materialistic, hyperindividualistic state of the world has become their status quo, the lens through which they view any of our policies. Most of my compatriots still fight against our revolution. Our cities are filled with quiet obstinance. It will take a colossal effort to deprogram the masses, but the hammer of truth will eventually pierce through the mirage. We will give them the viewpoint they deserve but do not yet know they need. We will turn them into the model proletarian vanguard. We will give them the truth. Our truth. The one and only truth."
DGR_supreme_censor_office_nc: "Supreme Censor Office"
DGR_supreme_censor_office_nc_desc: "The subversives think they're clever, packaging their doctrines into everyday literature. A number of authors and publishers have been exposed as counterrevolutionary elements, but new works keep entering circulation like weeds trying to take over a garden. Taking action after publication is not effective enough. The damage will have been done by then. The only way to regain control of the narrative is through preventive censorship. I can already see all the grumblings there'll be about the so-called infringement on free speech, but if they really wanted free speech, maybe they should've... I don't know, how about not trying to plaster every book they publish with propaganda? How about that? Works that prove to be apolitical will still be given the go-ahead. If anything, we're doing the readers a favor by filtering out the garbage."
DGR_reinforce_the_state_media_monopoly: "Bridging the Information Gap"
DGR_reinforce_the_state_media_monopoly_desc: ""
DGR_equality_committee_nc: "Equality Committee"
DGR_equality_committee_nc_desc: "Equality. It's not just a well-sounding word to wave around in front of the masses. But what those party bureaucrats don't understand is that it isn't some emotionless clerical process either. They must think that if you simply pool everybody's collective wealth into one massive pile and then hand out an equal share to each citizen, then all the old grudges will be gone and we'll all live happily ever after. That's what it is for them. A fucking fairytale. Here's what equality really is. It's a chance to stick it to that rich boy, that old money brat who always thought he was better than you just because his parents exploited the working class. To break into that guarded property that always taunted you with its extravagance when you passed by on the way to your own family hovel. To forcefully seize everything you've thus been denied. Only then will you have real equality."
DGR_being_rich_is_being_enemy_nc: "Being Rich is Being an Enemy"
DGR_being_rich_is_being_enemy_nc_desc: "In a capitalist system, there is no ethical way to acquire vast sums of wealth. There exists no such thing as a good billionaire. They all have their sins, and they will not be washed away with a single performative virtuous deed done every once in a while because, oh, they're such fucking saviors, exploiting us for 364 days but then nooo, they're saints because on the 365th they give us some coin so let's shut the hell up and praise them. That's why the rich, without exception, are nothing but a loathsome bunch of leeches, drowning in the decadence sponsored by the underpaid labor of the working class. The rich are an enemy... no. They are THE enemy! So let's see how they'd like it if the roles were reversed. Let's see them run a shift down in the steelworks. And then another. And then another few hundred until they've learned what it's like to labor like a true prole for a few loaves of bread, a bottle of vodka, and the promise of nothing but this for the rest of their pathetic lives."
DGR_state_homosexual_movement: "State Homosexual Movement"
DGR_state_homosexual_movement_desc: ""
DGR_curtailing_the_wolfpack: "Curtailing the Wolfpack"
DGR_curtailing_the_wolfpack_desc: "I'm going to spell it out for all the folks within the party who might think otherwise: it's YOU who's at our mercy. Not the other way round. You're nothing but a grey, faceless mass, pre-filled with ideology but no actual substance. You offer nothing to the people of Poland. We, the liberated masses, we want war. We want blood. We want to destroy the globalist system and tear its founders limb from limb. The revolution has come, and I am at its helm, not you, you bunch of fucking worthless pencil-pushers. I will finish what I started, and I will either do it with or without you, but if you even think about trying to stand in the way of the National People's Army, you will end up in the same mass graves as the rest of our enemies. Stay. In. Your. Lane. I can get rid of you literally whenever I want. Could you say the same about me? Oh, I doubt it."
DGR_committee_for_military_urban_planning: "Committee for Military Urban Planning"
DGR_committee_for_military_urban_planning_desc: "Military expansion should always take precedence over the civilian sector. For national security reasons, whenever we see a promising piece of land, we should be able to requisition it and build any necessary infrastructure. So, then, why are we suddenly being subjected to ZONING LAWS!? Why do we have to defend all new construction before some administrative official, and, even better question, why the fuck is he even allowed to say no? What, are we just not going to build new barracks because some urban planner already envisioned a new housing district there? Or not place down a shooting range because one corner barely touches the tip of a demarcated forest? Tell that to our enemies, why don't ya? Tell them we're literally defenseless because there just wasn't enough free space left around for the army. Incompetence. Just total incompetence."
DGR_expand_the_powers_of_internal_affairs_ministry: "Expand the Powers Of Internal Affairs Ministry"
DGR_expand_the_powers_of_internal_affairs_ministry_desc: "Internal security should be handled by the institutions already responsible for the wider national defense strategy. The Army defends Poland from external, but also internal threats. It's simple. It makes sense. What doesn't, though, is taking a portion of those duties and delegating it to a separate agency. This is a step in completely the wrong direction. The Ministry of Internal Affairs should be subservient to the military, not try to act as its equivalent. Say we give away our powers. What happens when a threat covers areas under both jurisdictions? It's easy to see how ineffective that would be, but oh, it's only national security, so who gives a damn? They want to play hardball? I can play hardball too. I will not cooperate with the ministry's forces, even under direct orders from up top. Let them figure this shit out. Watch them fail miserably and just wait until they realize the only option left is to give us back control."
DGR_party_supervision_of_guard_units: "Party Supervision of Guard Units"
DGR_party_supervision_of_guard_units_desc: "They are ripping my glorious army apart! This time, they've come for the guard, some of my most decorated and loyal units. Instead of maintaining operational flexibility and being utilized according to the needs of the central command, they've been gutted, turned into glorified babysitters for local party bosses. Could they really not have predicted that the hegemonic officials who run their chapters like a mob would just use the guard as their personal enforcers, or does the party hatred of the military run so deep, they'd rather see it neutered? Worst of all, these units still bear our insignia. They still nominally answer to me. Whenever one of these bastards sics the guard on a political opponent, or uses it to extort the people, the Army has to be the one to bear the responsibility. Sometimes, the abuses of power are so egregious, it feels like they're deliberately trying to frame us."
DGR_inspectorate_of_general_self_defense: "Inspectorate of General Self-Defense"
DGR_inspectorate_of_general_self_defense_desc: "Our country is practically a pariah on the global stage. The entire globalist world order fears us, and for a good reason, too. Our reputation is a double-edged sword, though. The Germans have already shown what they do whenever a Polish government does acquiesce to their hegemonic ambitions. When somebody says no to the Eurocrats' liberal insanity. They will invade again, which is why it's a welcome sign to see the party preparing the people for the inevitable. I'm not even going to launch an objection. The arming and training of our citizens is so imperative; I don't want it to fail because we can't agree on who gets to handle the process. If they can truly train millions of reservists, as they claim, let it be so, as long as they, naturally, get passed under the Army's control once the invasion comes. As long as we have the numbers, we'll make up for their lackluster preparation."
DGR_abolition_of_general_privileges: "Abolition of General Privileges"
DGR_abolition_of_general_privileges_desc: "They really just had the gall to tell me that we're being too lavish. That it's 'unbecoming of a card-carrying communist to enjoy luxuries unavailable to the working class'. That we've shot oligarchs for less. Seriously!? Is that supposed to be some fucking joke!? Yes, I live in a place like 10% more expensive than that of the average prole. Big fuckin' crime. I sometimes, occasionally, indulge in certain finer tastes. I got my ways, I got my contacts. And that's fine. You know why? Because every single day, I put my life on the line for this damn country. I spend my days in some ramshackle barracks, in the dirt, in the squalor, and this... THIS is how they repay me!? Fuck them, honestly. I'm already taking far less than I deserve."
DGR_supreme_audit_office_for_military_expenses: "Supreme Audit Office for Military Expenses"
DGR_supreme_audit_office_for_military_expenses_desc: ""
DGR_secret_files_357b: "Secret Files 357/B"
DGR_secret_files_357b_desc: ""
DGR_pseudo_fascist_deviations: "Pseudo Fascist Deviations"
DGR_pseudo_fascist_deviations_desc: ""
DGR_high_inspectorate_of_ideological_discipline: "High Inspectorate of Ideological Discipline"
DGR_high_inspectorate_of_ideological_discipline_desc: ""
DGR_supreme_prosecutors_office: "Supreme Prosecutor's Office"
DGR_supreme_prosecutors_office_desc: ""
DGR_commission_for_the_persecution_of_war_crimes: "Commission for the Persecution of War Crimes"
DGR_commission_for_the_persecution_of_war_crimes_desc: ""
DGR_dismantle_the_inquisition: "Dismantle the Inquisition"
DGR_dismantle_the_inquisition_desc: ""
DGR_keep_the_leadership_of_civilian_corps: "Keep the Leadership of Civilian Corps"
DGR_keep_the_leadership_of_civilian_corps_desc: ""
DGR_hunt_for_the_young_wolves: "Hunt for the Young Wolves"
DGR_hunt_for_the_young_wolves_desc: ""
DGR_principles_of_national_communism: "Principles of National Communism"
DGR_principles_of_national_communism_desc: ""
DGR_appeal_of_the_twenty: "Appeal of the Twenty"
DGR_appeal_of_the_twenty_desc: ""
DGR_association_of_trade_unions: "Association of Trade Unions"
DGR_association_of_trade_unions_desc: ""
DGR_dawn_of_communist_glory: "Dawn of Communist Glory"
DGR_dawn_of_communist_glory_desc: ""
DGR_eternal_watch_nc: "Eternal Watch"
DGR_eternal_watch_nc_desc: "Szwej is dead. SZWEJ IS FUCKING DEAD! Finally, that fucking dinosaur has died. It would be the ideal opportunity to seize power, but unfortunately, I don't think I can stage a coup from my prison cell. However, one thing is fucking great about it - he was pretty much the lynchpin holding the KPP together, and I'm pretty sure the rest of the party \"comrades\" will be unable to do anything to keep this moloch together, and once this damned country falls, I will finally be able to take back what's mine. I just need to be patient and wait. "
DGR_state_funeral_nc: "State Funeral"
DGR_state_funeral_nc_desc: "The government is organizing a fucking funeral for Szwej. While I would love to go there and spit in his fucking face one last time, I don't think the guards will let me go there after my recent escape attempt. I mean, I can always look through the window and see the preparations for the funeral. They are literally everywhere, and I'm pretty sure they will also recruit some prisoners to help. Maybe if I volunteer to decorate the prison, they will let me attend the funeral? Then I will finally be able to get my revenge for my arrest back then."
DGR_extraordinary_federation_council_session: "Extraordinary Federation Council Session"
DGR_extraordinary_federation_council_session_desc: "Now that the funeral is over, the so-called \"Federation Council\" has organized an emergency session to deal with the aftershocks of Szwej's death. What are they going to do? They were always marginalized, and I don't think they gained any experience during their years of assisting the actual government. I also heard they are going to choose a new general secretary, but the council is surely way too fucking divided to choose anyone. Just a few months, and this entire system will collapse, and I will finally be able to reclaim my power."
DGR_the_little_constitution: "The Little Constitution"
DGR_the_little_constitution_desc: "The Council is creating a new constitution? Wow, didn't expect they could even write. I'm pretty sure it will contain unnecessary points like \"LGBT rights\" or something like that, and lack very important points, such as letting the military elect new general secretaries. I'm not sure it would even change anything, as the commies have already purged the military of all experienced elements and replaced them with fucking mindless puppets, just to avoid sharing power with us. Anyway, I digress. The new constitution won't do anything to help with the post-Szwej's death chaos, so my return to power is coming closer and closer, I guess."
DGR_little_thaw: "Little Thaw"
DGR_little_thaw_desc: "What? The government has declared all my great, experienced, and loyal generals as fucking traitors of the state? Really? They are trying to blame all their mistakes on us, while they are the ones who caused them in the first place! And they included me, the greatest patriot of the country? I mean, that was to be expected, as the commies hate anyone who actually loves their country. They prefer to put people who don't even supply new soldiers for the state first, like these LGBT freaks. Anyway, I'm sure the people will realize who the traitor of the state really is, and finally fight for my cause."
DGR_economic_consolidation_plan: "Economic Consolidation Plan"
DGR_economic_consolidation_plan_desc: "The government recently created an \"Economic Consolidation Plan\". They make it seem like it will magically solve every problem of this country, but I see through their deception and realize that all of this is just made to temporarily satisfy the common man, just a populist measure. However, it means they have to somehow appease the people for now, and, by connecting the dots, I realize that the government is on its last legs and that my time to show is coming soon. I wish I could confirm it; however, there aren't many people visible through my cell's window, but I'm sure it's true."
DGR_new_leader_of_the_soviet_state: "New Leader of the Soviet State"
DGR_new_leader_of_the_soviet_state_desc: "They actually elected someone? Wow, thought the council would deadlock forever, but I guess I was wrong. I don't really know who the new secretary is; however, they will apparently reveal them soon and organize a massive countrywide parade to celebrate. They have to organize a fucking parade every time a big event happens, or else people wouldn't come there, because the common man doesn't care about politics. He cares about finishing his 8-hour shift, eating a meal at the canteen, and returning home to see his family. Anyway, I'm pretty sure the new General Secretary will be even more incompetent than Szwej. Szwej has at least gathered some experience during his life."
DGR_party_with_the_nation: "Party with the Nation"
DGR_party_with_the_nation_desc: "A party official recently visited my prison, and he wanted to help the staff with cooking. I think they actually let him cook, as the dinner that day was fucking inedible. I thought it was just a random inspection, but the next day another one came, and dinner was inedible once again. However, this couldn't be a coincidence - I'm sure the government planned something like that. Even in my daily newspaper, as fucking unreadable as it is, I saw many more acts of \"kindness\" from party officials. The government tried to give the party a human face. However, bureaucrats aren't there to have a human face. They are there to put a stamp on a piece of paper, then give it to another bureaucrat, who also stamps it, and so on. However, if the KPP is so desperate for public support, it means the collapse is coming, and finally, I will be able to regain my rightful place."
DGR_nation_with_the_party: "Nation with the Party"
DGR_nation_with_the_party_desc: "Literally everyone except me in my prison went to a May Day parade. Why? They were going to shorten their sentences by a fucking month if they went there, duh. Nobody cares about May Day; they only like it because it's a holiday. I would bet my every ration card that everyone there was bribed or forced to march, as there is literally no other reason. Anyway, in the newspapers there are lots of pictures of such marches, and on TV they show a 10-minute video of them every 5 minutes. Who do they think they are fooling? Me? The masses? Well, let me spoil it to them - absolutely fucking nobody. Only someone of Szwej's age would believe such lies."
DGR_opening_up_to_foreign_markets: "Opening Up to Foreign Markets"
DGR_opening_up_to_foreign_markets_desc: "Excuse me? I worked so much to make sure Poland could stand alone, without foreign interference, but they just ignore it, and sell Poland to the West, just like Balcerowicz 55 years ago? Anyway, I'm sure this action will backfire - we already had enough to prosper, and letting foreign corporations, who escaped Poland the moment it had some internal troubles, will surely bring nothing good except sucking out Polish labor, so that some billionaire can buy his 37th yacht. Hopefully, people realize this and help me get this country back on track, even though the future already looks gloomy."
DGR_warsaw_pact_reborn: "Warsaw Pact Reborn"
DGR_warsaw_pact_reborn_desc: "The Warsaw Pact. While it was named after Poland's capital, Poland was one of the slaves of the USSR, designed just to bring resources to the \"Motherland\". It's an old, failed concept, but I guess the commies like reviving concepts like this, as they announced the revival of the Warsaw Pact. Really? I worked so fucking hard so that the past doesn't come back haunting us, but they just fucking invite it to their door? A commie's mind is full of shit, I guess. I really hope the collapse will come soon, as I lose faith in ever saving this rotten country."
DGR_steadfast_demilitarization: "Steadfast Demilitarization"
DGR_steadfast_demilitarization_desc: "The fuck? The communists just lowered the number of troops they consider \"adequate\" for national defense. Yes, you heard that right. Lowered. LOWERED. I FUCKING WORKED SO FUCKING HARD TO MAKE SURE POLAND CAN DEFEND HERSELF, BUT THE COMMIES JUST FUCKING DON'T CARE ABOUT IT AND LEAVE OUR BORDERS UNGUARDED! I feel like I'm going to get a fucking heart attack. These red worms just don't care about Poland; they just care about their \"communist ideas\". I'm sure this will prove detrimental to them, as what nation has such a small standing army?"
DGR_forward_to_victory_of_communism: "Forward, to the Victory of Communism!"
DGR_forward_to_victory_of_communism_desc: "The entire world is against me. My former allies either turned their backs on me or were arrested. The nationalist cause has been purged by the dirty commies, who turned this once-glorious country into a communist hellhole. Is there even anything to live for? The nationalist cause is long dead. My life is meaningless. I'm not sure if these moments are life itself or just well-camouflaged death knocking on my door. Hope may die last, but mine has already died. Fear. Now I feel it. This primal essence of humanity. Fortunately, I happen to have the perfect recipe for this state. I've managed to steal a knife from the prison kitchen. Well, then. Old friend...i'm coming to you.\n*slash* \n*thud*\n..."


 
 ## Events ##

dabrowa_border.1.t: "Revenge for 2025!"
dabrowa_border.1.desc: "Our soldiers have achieved a monumental feat-we managed to seize the opportunity presented by the situation on our eastern border and take control of the land from Bukowno all the way to Klucze, previously under the tyranny of the Supreme Prosecutorship. This is undoubtedly a turning point in the war that has dragged on for many years, ever since Ziobro's hordes invaded the Zagłębie region. Now it is their land, their blood. And we will be the liberators from the chains! It's true that the Prosecutorship's forces have withdrawn from further military operations, and we are not strong enough to continue our offensive - but this is certainly a step closer to Olkusz. And to defeating that treacherous, fascist creature."
dabrowa_border.1.a: "Down with the fascist invaders!"

dabrowa_border.2.t: "Invasion on Bukowno Fails"
dabrowa_border.2.desc: "Our soldiers entered the fight with hope in their hearts and fury in their eyes, but reality proved merciless. The attempt to take advantage of the tense situation on our eastern border ended in failure - we were unable to hold our positions in either Bukowno or Klucze. Those lands remain under the boot of tyranny, still ruled by the iron hand of the Supreme Prosecutorship. This defeat marks a bitter blow in the long war that began when Ziobro's hordes first stormed the Zagłębie region. Our men fought bravely, but the enemy's defenses were too strong. For now, the path to Olkusz is closed. And the treacherous, fascist creature remains unpunished."
dabrowa_border.2.a: "We will get you!"

dabrowa_border.3.t: "Invasion on Bukowno Fails"
dabrowa_border.3.desc: "Our soldiers entered the fight with hope in their hearts and fury in their eyes, but reality proved merciless. The attempt to take advantage of the tense situation on our eastern border ended in failure - we were unable to hold our positions in either Bukowno or Klucze. Those lands remain under the boot of tyranny, still ruled by the iron hand of the Supreme Prosecutorship. This defeat marks a bitter blow in the long war that began when Ziobro's hordes first stormed the Zagłębie region. Our men fought bravely, but the enemy's defenses were too strong. For now, the path to Olkusz is closed. And the treacherous, fascist creature remains unpunished."
dabrowa_border.3.a: "We will get you!"

dgr_district.1.t: "Ride into Obsession"
dgr_district.1.desc: "Marcin Bazylak didn't even look back. The guards had let him go-not out of mercy, but indifference. The coup was over, the National Council had declared victory, and there was no point in holding a broken man. His breath steamed in the morning air as he stumbled to his Skoda Superb, fumbled with the keys, and fired up the engine. He didn't care where he left the documents or if anyone followed him. There was only one thought in his mind: his family. Tires screeched as he turned onto the main road. Is he too late? Past the quiet buildings. Were they telling the truth? Past shuttered shops. Was it just a lie? Through the smoking ruins of last week's 'random' explosions.\n\nAt the roundabout near Katowice Steelworks, he missed the exit. His hands trembled. Sweat poured despite the cold. Somewhere between panic and instinct, he tried to turn back - too sharply, too fast. The car fishtailed. Slammed into a barrier. Metal groaned, glass cracked, and the world spun.\nSilence. Then voices.\nRough hands pulled open the driver's side door. Boots crunched gravel. Someone pulled Bazylak out, dazed and bleeding, onto the cold pavement.\n- Alive - said one of them. - Barely.\nPresident passed out. When he woke up, he was lying on the couch in some old office. Is he in the Steelworks? Standing above him was a broad-shouldered man in an old suit, with a faded red star pinned to the collar. First Secretary of the Communist Party of Poland, Krzysztof Szwej.\n- Marcin - Szwej muttered, amused. - Still running?\nBazylak tried to speak, failed, then nodded. His voice cracked. \n- I need to get my wife. My kids...\n- We'll get them - Szwej said firmly - You have more pressing issues to deal with, President.\n\nBehind the dirty window, one could see that smoke was rising across the city. The National Council had barely lasted the morning. But it was already almost sunset. The neighborhoods turned on them fast - old gang grudges, political feuds, vendettas with boots and fire. The police were gone for good. Bargieła fled west, toward Łęknice with only a handful of his loyal friends. A few minutes later, in a backroom beneath an old steelworks office, Bazylak sat with a wet rag to his head and a cup of bitter coffee in his shaking hands.\n- I can't - he whispered - I'm done. I should've left years ago.\n- You'll do what's needed - Szwej said, pacing across the room - We all will.\nHe turned to one of his men. - Find his family. Bring them here. Safe. Take three men with you. - Then he turned to Bazylak, quieter now - You were a ghost in a dead state, comrade. But now you'll help build something real.\n\nAs the steelworkers were leaving the premises to find the president's family, they saw one of their comrades raising red banners and instead of the text \"Huta Katowice\" above the gate, they proudly displayed a new one, a declaration that said:"
dgr_district.1.a: "POPULAR FRONT OF DĄBROWA GÓRNICZA"

dgr_district.2.t: "District Wars"
dgr_district.2.desc: "Can a so-called government that controls only one district have any legitimacy to govern the entire city? Dąbrowa Górnicza is a highly conflicted place, if not one outright in a state of anarchy. Gangs constantly terrorize people, holding them in an iron grip while fighting among themselves, for control of one or two more already devastated buildings. And when they came for him, Bazylak had no choice. Well, he had a choice, but he probably would have ended up hanging from a lamppost in Haller's Park. So, he decided to make a pact with the devil and establish a government of municipal unity in the most powerful steel combine in all of Poland - Katowice Steelworks. This industrial facility has now become the last bastion of municipal administration, and it has been taken over by the Communist Party of Poland. How desperate must a person be to decide to hand over power to a group of geriatric dinosaurs from a bygone era? Again, Bazylak had no choice.\n\nUnfortunately, not everyone agrees with this decision, and in the industrial heart of Dąbrowa Górnicza, the government managed to gather fewer than a thousand supporters. Can such a small number of soldiers subdue a city of over a hundred thousand? They will definitely need help and skillful maneuvering between the gangs. It's time to divide and conquer."
dgr_district.2.a: "Chaos is a ladder..."
 
dgr_district.3.t: "Young Steelworkers' Answer"
dgr_district.3.desc: "To Krzysztof Szwej:\n\nfuck off, grandpa"
dgr_district.3.a: "Such impudence!"
 
dgr_district.4.t: "Zielona Camp Submits!"
dgr_district.4.desc: "Weirdos are an inseparable part of any revolution. No one in their right mind would stake everything they own to fight for an uncertain tomorrow. But does a revolutionary movement really need people whose core value seems to be the hedonistic inhalation of substances widely considered narcotics?\n\nThe endless party in Zielona Park appears to be coming to an end. We weren't even particularly eager to move against them - and it's unclear whether they even realize they've surrendered and chosen not to resist the People's Front.n\nOne way or another, Korzeniec and Zielona have returned to central government control, and that's probably where we should leave it. Best not to dig too deeply into the who, what, or why."
dgr_district.4.a: "You better don't smoke weed every day..." 

dgr_district.5.t: "End of the District Wars"
dgr_district.5.desc: "It's done. It's over. After months of chaos and anarchy, our brave forces have finally brought the city's internal war to an end and taken control over the majority of its territory. At present, fighting is limited to isolated pockets of resistance barricaded inside a few remaining buildings. The city administration has returned to its rightful place: the civilian council has resumed operations at the city hall, while the Party has established its headquarters in the Zagłębie Palace of Culture, which is now being rebuilded and refitted to serve our party as a fine base of operations. Street patrols have resumed, and our militia is closely monitoring the neighborhoods that, just days ago, were too dangerous to even step outside. For the first time in a long while, factories and small shops are opening their doors without fear of extortion or arson.\n\nA new dawn has risen over Dąbrowa Górnicza."
dgr_district.5.a: "Time to rebuild!"

dgr_district.6.t: "District Struggle - Failure"
dgr_district.6.desc: "The attempt to seize control over Strzemieszyce ended in failure. Initial advances were met with unexpectedly fierce resistance from irregular formations of gangs entrenched in industrial zones. Coordinated ambushes, barricaded intersections, and improvised explosive devices halted our troops before they could reach strategic junctions. The attacking units, overextended and lacking local support, were forced into chaotic retreats. No foothold was established. The district's key infrastructure remains under hostile control. Morale among the surviving units was described as \"shaken but intact\". As of now, the district is lost. The price paid was bloody and this part of Dąbrowa Górnicza remains in hostile hands. Time will only tell if we will be able to try again to seize it."
dgr_district.6.a: "We will return."

