dgr_nazbol.2.t: "The Listening"
dgr_nazbol.2.desc: "Comrades! The rot is plaguing our country. The rapid expansion caused us to be lenient on the element of reaction that grew in our nation. They plan to strike now that our dear leader Krzysztof Szwej is at his weakest! While he sleeps, we must stand ready to defend our accomplishments! The wolves in sheep's clothing are among us. Below is the list of social, political, and cultural organizations that were deemed suspicious of seditious activity and thus delegalized:\n- International Youth\n- The Right of Silesia\n- The Underground\n- Red Alternative\n- Redder Alternative\n- New Red Alternative\n- Orange Dąbrowa\n- Independent Doctors' Association\n- Society of Friends of Reason\n- Egyptologist Society\n- People's Union of Dąbrowa (gmina Koniecpol)\n- Green Mainstream\n- The New Guard\n- The Red Alternative\n- The Guardians of the Novelty\n- Club of Dissidents\n- The Living Filmmakers Studio\n- Futurizts for Dombrowa\n- The Hidden Cell\n- Social and Cultural Society of Germans in Opole Silesia\n- National Housewives' Clubs Association\n- Club of Associated Organizations\n- Dadaist Brotherhood\n- Attack Against Today\n- The Open Borders\n- The First to Work\n The Last to Fight\n- Rage of the Masses\n- The International Red Brigades\n- Federation of National Minorities\n The True Patriots\n- The Conspirators\n- Dąbrowa Górnicza's Bridge Card Game Club\n- True Red Alternative\nAll of the members of said organization are obliged to end their illegal participation. It is in all citizens' interest to be informed about the further expansion of the list as more and more reports of crimes of treason are reported to peace-keeping authorities."
dgr_nazbol.2.a: "Down with the traitors!"

