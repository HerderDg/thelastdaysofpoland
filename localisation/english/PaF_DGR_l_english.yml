dgr_nazbol.16.t: "Extremely Quick Census"
dgr_nazbol.16.desc: "It wasn't going very fast at first, merely several hundred people per day. By the time they were done with one village they were already behind with their quota for the whole week, and it was supposed to be a 'quick' census. However, something has changed recently. The groups got larger and the expeditions were now going through multiple areas of towns, villages and cities at the same time instead of walking in a single, slow group. The people did notice how much they were picking up on speed. They would knock on every door, go to every street, visit every house. And everytime they asked the same question - 'Do you belong to the Party?' No answers other than plain 'Yes' or 'No' were tolerated, and those who refused to answer in such a straight up way were definetly given a lot of time to rethink their life choices. There was a famous example of an older man, living somewhere under the very heart of their base of operations who refused to even open them the door and when they barged in he refused to answer them. It's said that he was an older member of Solidarity from the days way before the fall, but noone will ever know: he died soon after they nailed him to his door upon leaving, but not before cutting his tongue off. It was because of acts like these that a majority of citizens, just to be sure, answered 'Yes'. And if it turned out to be a lie later, when they were checking it ? 'No problem, you can always submit any missing documents to complete the initiation'. Unlike the census this message was never a multi-answer option..."
dgr_nazbol.16.a: "...Where can I find the nearest office ?"

