dgr_narkom.18.t: "It Just Works"
dgr_narkom.18.desc: "In one day, I have committed more thought crimes than in his entire lifetime.\n Yes, NATO is the ultimate nemesis of every right-thinking socialist patriot. Yes, their evil system and demonic men in black are a scourge upon the workers worldwide, turning lower classes into impotent lumpen-proles locked in struggle against cheap minorities from abroad. Yes, their war machines are what we were supposed to rise against. \n\n But at least said war machines fucking work! \n\n Standardised cartridge, interchangeable parts, workable, modular designs. If one was to create a chimera from British chassis, German gun, Korean engine, one could, given enough time, one did, even! Because, I don't know, the part manufacturers were extant and available? And made with remote attention to quality? \n\n Instead, I am working with rusted salvage of Warsaw Pact. A BTR here, a Romanian take on it there, a Soviet BMP-2 chassis, a M53/59 Praga auto-cannon, a Polish mortar from 1960s, and a Yugoslav transmission I didn't even know existed. My task? SOMEHOW, SOMEWHERE rig those parts to work with one another. It was bad enough during Cold War: At least back then, Poland could take Soviet T-55s and upgrade them into Merida variant. But now, the manufacturers of this junk are gone, the documentation thereof has gone the way of the Berlin wall, and I'm left with the rust and dust that's supposed to be turned to war machines yesterday! I'd need a cocksucking motherfucking year to even reverse engineer workable versions of all this! I'd need another one to design an uniform standard for their extremities. Yes, a year! Did I mention these piles of rust don't work in vacuum, let alone as part of a system? I'd need YET ANOTHER year to fix them. Do the pricks at politburo or whatever-the-fuck this place is called realize, that even if I already knew how to reverse engineer, fix, and make compatible, WITHOUT THE SHRED OF THE INDUSTRY AND KNOW-HOW THEY ORIGINATED FROM, I need TIME and HANDS to make it happen? SKILLED HANDS. In other words, ones that aren't shaking without an hourly designer drug injection! \n\n But no... everything, EVERY FUCKING PRACTICALITY, is supposed to be alleviated by Uncle Lenin's Invisible Hand of Five Year Cunt... I mean, Plan! And I'm supposed to be done in 28 days?! Whatever happened to worker's rights, I'd rather be back in Germany, running 14 hour strawberry shifts on undocumented wage! \n\n Anyway, I guess I do have a furnace and a cast. If I can just get a half-decent transmission axle from a car scrapyard, maybe the suspension on that BMP-2 can be fixed... With it I just have to replace the missing bolt with one from that other wreck... if all else fails I could even carve up a cast and get to smelting..."
dgr_narkom.18.a: "Those are the words of Paweł Sobczak, Chief Engineer of 'Factory' no. 6"

