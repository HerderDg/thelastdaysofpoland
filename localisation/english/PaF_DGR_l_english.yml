 DGR_industrial_heart6_desc: "The industrial might of Zagłębie was built over decades - and yet it took only a few short years of capitalist rule to reduce it all to nothingness. Mines shuttered, shafts sealed, collapsed steelworks, dismantled factories, ruined rail networks and only the wind now carries the fading echo of this region's once-proud economic achievements.\n\n§GThrough the titanic effort of the entire working people, we have managed to restore a fragment of this industrial greatness - and the industrial heart beats once more with strength. And now we are truly an industrial powerhouse in the entire region or event in the whole of Poland!§!"
