unification.179.t: "[GetNewspaper]Estates of Brzesko Unite Lesser Poland Voivodeship!"
unification.179.desc: "In a monumental shift, the Estates of Brzesko - formerly known as Optimus - have united the Lesser Poland Voivodeship under the banner of a new, technocratic age. With precision and innovation at their helm, the Estates declare the dawn of a future where technology, industry, and intellect reign supreme.\n\nFrom the bustling streets of Tarnów to the industrious heart of Kraków, engineers, scholars, and machine enthusiasts alike have rallied to the cause, pledging to forge a society that balances progress with tradition. The Estates, now reimagined as a force of calculated ambition, vow to rebuild the region through digital prowess, automated agriculture, and perhaps even the occasional robot-powered joust. With gears turning, computers humming, and the spirit of innovation driving them forward, the Estates of Brzesko lead Lesser Poland into a new era of prosperity and precision."
unification.179.a: "To technology! To progress! To future!"

super.179.t: "[GetNewspaper]Poland united under the flag of [FROM.GetName]!"
super.179.desc: "Years have passed since Poland as a state collapsed, however, Poland as an idea has never entirely perished. As the government under the leadership of [FROM.GetLeader] clearly shown, unification within a single generation wasn't a distant dream, but attainable reality. Against all odds, facing enemies on all sides, from within, aswell as forces from abroad, [FROM.GetName] stands truly united, having reforged the nation of Poland and it's diverse people into a monolith, proving that the confidence it's citizens layed upon the leadership and beliefs of their government wasn't at all misguided. Scars of the conflict will take time to heal, but with the unity forged in fires of war, future looks bright for Poland. As the sun rises above the land, citizens of [FROM.GetName] look forward with pride and high spirits, having passed the ultimate test of the Polish civil war."
super.179.a: "United at last."

