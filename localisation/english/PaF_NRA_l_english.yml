 NRA_fervor1: "Revolutionary Fervor"
 NRA_fervor1_desc: "The Revolution has to be fast, strong and unyielding. The Guard's radicalization will either make or break our state. If the guard grows too radical, our country will collapse from instability, yet on the other hand if the guard is not radical enough, fewer volunteers will want to join our cause and our soldiers will not be as motivated to fight the reactionary hordes. We'll have to channel this fervor to ensure that the red flag flies over Kielce, Kraków and later Warsaw. It will be a hard task, but our resolve will carry us to victory. For the Revolution! For Stalin, Bierut and Mao!"
 
 ###   Country Events   ###
 
 gwardia.1.t: "Our Syndicalist Brothers Plead for Aid!"
 gwardia.1.desc: "Our syndicalist brothers call for aid in the war against Materek! The situation in Starachowice was getting worse and worse day by day, but recently our comrades rose up against Materek's tyrannical regime. Unfortunately, many workers, still deceived by capitalist propaganda remained loyal to Materek, and our comrades were pushed back by counter-revolutionary forces, so they have sent a request to us for aid against the capitalist tyrant. It's in our best interest to accept and help them with our troops, but maybe our armies can be used in another place to give us a bigger benefit, and in the end liberating Starachowice anyway. Lady Commissar, what is your decision?"
 gwardia.1.a: "Send our troops to help!"
 gwardia.1.b: "We're a bit preoccupied at the moment"
 
 ###   News Events   ###

unification.122.t: "[GetNewspaper]People's Guard unifies the Holy Cross!"
unification.122.desc: "The fall of Poland was an event that radicalized many within the country, turning previously unviable movements into forces able to contend with the crumbling, disgraced mainstream. While most turned to newfound ideas such as Postpolonism or became enveloped in nationalistic fervor, the destruction that the right-wing government of PiS brought to the country allowed many leftist militias to form as well. Unexpectedly, one of them ended up filling the power vacuum that was the collapse of Ziobro's regime. Red flags now fly all over the Holy Cross voivodeship as the People's Guard consolidates their grip on the region. Adherent to a Soviet-style form of communist thought and striving to rehabilitate the images of the leaders of the old Polish People's Republic, the state finds itself at odds with the beliefs of the common folk. But who will complain with the barrel of a gun ready to strike down any who dissents?"
unification.122.a: "For Bierut! For Stalin! For a red Poland!"

super.122.t: "[GetNewspaper]Poland united under the flag of [FROM.GetName]!"
super.122.desc: "Years have passed since Poland as a state collapsed, however, Poland as an idea has never entirely perished. As the government under the leadership of [FROM.GetLeader] clearly shown, unification within a single generation wasn't a distant dream, but attainable reality. Against all odds, facing enemies on all sides, from within, aswell as forces from abroad, [FROM.GetName] stands truly united, having reforged the nation of Poland and it's diverse people into a monolith, proving that the confidence it's citizens layed upon the leadership and beliefs of their government wasn't at all misguided. Scars of the conflict will take time to heal, but with the unity forged in fires of war, future looks bright for Poland. As the sun rises above the land, citizens of [FROM.GetName] look forward with pride and high spirits, having passed the ultimate test of the Polish civil war."
super.122.a: "United at last."
