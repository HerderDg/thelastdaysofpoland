buzzer.1974.t: "A Footballer Without a Club"
buzzer.1974.desc: "Among the chaos of the defeated state, one unexpected prize has fallen into our hands: a footballer from their national setup. Their old colours mean little now. With the right paperwork, a fresh shirt, and a convincing enough speech about regional pride, they could be brought into the ZWKT squad."
buzzer.1974.a: "Offer them a place in the squad."
buzzer.1974.b: "We do not need cast-offs."
buzzer.1974.accept_tt: "The player will join §YZWKT§!.\nPosition: §Y[GetZWKTCapturedFootballerRole]§!\nSkill: §Y[?zwkt_captured_fb_power|0]§!\nShirt number: §Y[?next_tee_number|0]§!."

