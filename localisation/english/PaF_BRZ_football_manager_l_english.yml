brz_league.1.t: "Half-Time Whistles"
brz_league.1.desc: "The season has reached its halfway point, and Olimpia Truskolasy sits dangerously low in the table. The supporters are restless, the local press is circling, and every dropped point now feels like a political humiliation. If they continue to play like this and finish dead last, we may face some dire consequences..."
brz_league.1.a: "This is becoming embarrassing."

brz_league.2.t: "A Season Worth Believing In"
brz_league.2.d: "The halfway point of the season has arrived, and Olimpia Truskolasy sits near the top of the table. The mood around the club has transformed overnight: the terraces are louder, the local press is unusually generous, and even political critics have found it harder to sneer at a winning side. We are going to win the whole fucking thing!"
brz_league.2.a: "Keep the momentum going."

brz_league.3.t: "The Bottom of the Table"
brz_league.3.d: "Olimpia Truskolasy has finished the season dead last. What began as disappointment has curdled into fury. The terraces chant against the government, local sponsors vanish overnight, and the club's humiliation has become a symbol of wider collapse. Enraged fans took to the streets demanding the resignation of our leader, Jerzy Brzęczek who is also directly responsible for the club's results."
brz_league.3.a: "This is more than football now."

brz_league.4.t: "The Final Whistle"
brz_league.4.desc: "The local season has reached its end. Olimpia Truskolasy now learns whether its campaign was enough to escape the familiar mud of the local league."
brz_league.4.a: "We are going up! We will never go down!"
brz_league.4.b: "I guess third league is cool too..."
brz_league.4.c: "We are going up! We will never go down!"
brz_league.4.d: "This team is hopeless..."

