BRZ_league_info_tt: "§RTHIS IS NOT THE SAME TEAM AND MECHANICS AS ABOVE§!\n\nThis is a League GUI. In this mechanics, you will face many different clubs while leading Olimpia Truskolasy.\n\nYour task? Get promotion to the next league.\n\nWhat can you do to help your club? Not much, really. It's just a sport after all. You can try to influence a match by bribing a referee or an enemy club, but be wary - this may hurt you in the long run, and really - it does not guarantee a victory.\n\nSo if I can't do much and it's all random...why is it here? Well - haven't you dreamt of having a football league inside HoI4? We neither. But there it is. So at least we can watch the numbers go up and down.\n\nJokes aside, most of the influence that league would have is planned for future content, so right now...it's not much."

BRZ_national_team_info_tt: "§RTHIS IS NOT THE SAME TEAM AND MECHANICS AS BELOW§!\n\nThis is a National Team GUI. Here you lead your country's national team to play with different warlords. This is not the team that you have in the league. \n\nIts job is to present you with a different solution when it comes to declaring war as [BRZ.GetName]. Declaring war is done here by matches. These matches can go good, bad or you know - there can be a draw. Depending on the result, you will either gain buffs or debuffs in the upcoming war with the nation that you played with. And every match will result in a war, no matter the result.\n\nHere, though, you can strengthen your team by doing training sessions, capturing more players (by defeating other countries), and switching up your tactics. The better you do as a team, the more chance for a win you'll have."

