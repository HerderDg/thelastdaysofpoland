tesin.2.t: "European Mandate is shattering"
tesin.2.desc: "Wave of unrest is spreading throughout the entirety of Eurokommissariats from as far north as the Baltic Sea to south down in Czechia. Czech occupation Army led by Petr Pavel just ordered a mass retreat from the occupied territories in Polish Silesia. Lot of Teschin's troops are feeling that they should follow the suit and go back beyond the Olza river, leaving the Polish territories alone. Considering the rebellious people of Poland just started a mass strikes and protests in the Polish Cieszyn region, keeping the peace might be too expensive for the Euromandate alone."
tesin.2.a: "Kurevsko nedobre novinky"

tesin.3.t: "Mass Desertions"
tesin.3.desc: "Following the retreat, a lot of our troops have lost faith in our leadership and there are mass desertions in all of our units. Lot of them is going over the border to join the remains of the Petr Pavel's forces - seeing as in times like this, they want stronger leadership than they got here. Others are just going to Moravia back to their homes. This is getting out of hand."
tesin.3.a: "Kurevsko nedobre novinky"

